:22,\"slug\":\"hsk2-17c-objects-misc\",\"label\":\"HSK2 · Bài 22\"},{\"n\":23,\"slug\":\"hsk2-18-questions\",\"label\":\"HSK2 · Bài 23\"}],\"sections\":[{\"id\":\"nghe\",\"title_vi\":\"Nghe\",\"parts\":[{\"id\":\"nghe\",\"kind\":\"listen\",\"title_vi\":\"Nghe và chọn nghĩa\",\"instructions_vi\":\"Bấm Nghe (nghe được nhiều lần), rồi chọn nghĩa đúng.\",\"items\":[{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"他是好人，不是坏人。\",\"lesson\":18,\"options\":[\"Tôi chỉ ăn một chút xíu thôi.\",\"Đây là một vấn đề thường gặp.\",\"Ước mơ của anh ấy đã thành hiện thực, anh ấy đã trở thành nhà văn.\",\"Anh ấy là người tốt, không phải người xấu.\"],\"answer\":3},{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"没想到你也来了。\",\"lesson\":21,\"options\":[\"Có điều, tôi vẫn muốn thử một chút.\",\"Bài hát này nghe dở thật.\",\"Bạn có thể đi tàu điện ngầm hoặc đi xe buýt.\",\"Không ngờ bạn cũng đến.\"],\"answer\":3},{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"我喜欢打篮球和网球。\",\"lesson\":16,\"options\":[\"Tôi chỉ muốn nghỉ ngơi.\",\"Những bức ảnh này đẹp thật.\",\"Tôi thích chơi bóng rổ và quần vợt.\",\"Ước mơ của anh ấy đã thành hiện thực, anh ấy đã trở thành nhà văn.\"],\"answer\":2},{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"他是真正的好人。\",\"lesson\":18,\"options\":[\"Đội bóng của chúng tôi ngày càng mạnh.\",\"Trên trời có rất nhiều sao.\",\"Tôi sẽ mãi mãi không quên sự giúp đỡ của bạn.\",\"Anh ấy là một người tốt thực sự.\"],\"answer\":3},{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"因为下雨，所以活动停了。\",\"lesson\":17,\"options\":[\"Quan điểm của chúng tôi hoàn toàn giống nhau.\",\"Vì trời mưa nên hoạt động đã dừng lại.\",\"Con đường này không đi qua được.\",\"Anh ấy cố tình không nghe điện thoại của tôi.\"],\"answer\":1},{\"q\":\"Câu này nghĩa là gì?\",\"audio\":\"教室的墙上有中国地图。\",\"lesson\":20,\"options\":[\"Tôi rất tự tin vào bản thân.\",\"Muộn rồi, tôi phải đi đây.\",\"Trên tường lớp học có bản đồ Trung Quốc.\",\"Dùng máy tính xong, đừng quên tắt máy.\"],\"answer\":2}]},{\"id\":\"dungsai\",\"kind\":\"listen\",\"title_vi\":\"Nghe và chọn Đúng / Sai\",\"instructions_vi\":\"Nghe câu, rồi chọn xem nghĩa tiếng Việt ghi trong câu hỏi có khớp không.\",\"items\":[{\"q\":\"Câu vừa nghe có nghĩa: “Đây là một khách sạn cao cấp.”. Đúng hay sai?\",\"audio\":\"这是一家高级酒店。\",\"options\":[\"Đúng\",\"Sai\"],\"answer\":0,\"lesson\":21},{\"q\":\"Câu vừa nghe có nghĩa: “Đây là một khách sạn cao cấp.”. Đúng hay sai?\",\"audio\":\"他的读音很准确。\",\"options\":[\"Đúng\",\"Sai\"],\"answer\":1,\"lesson\":21},{\"q\":\"Câu vừa nghe có nghĩa: “Nếu bạn có thời gian thì đến nhà tôi chơi nhé.”. Đúng hay sai?\",\"audio\":\"如果你有时间的话，来我家玩儿吧。\",\"options\":[\"Đúng\",\"Sai\"],\"answer\":0,\"lesson\":17}]}]},{\"id\":\"doc\",\"title_vi\":\"Đọc\",\"parts\":[{\"id\":\"nghia\",\"kind\":\"mcq\",\"title_vi\":\"Từ nào, nghĩa gì?\",\"instructions_vi\":\"Chọn nghĩa đúng của từ.\",\"items\":[{\"q\":\"“经常” (jīng cháng) nghĩa là gì?\",\"lesson\":21,\"options\":[\"ngôi sao; người nổi tiếng\",\"kể lại (ví dụ: kết quả bầu cử)\",\"hoàn thành\",\"thường xuyên; liên tục; đều đặn; thường\"],\"answer\":3},{\"q\":\"“生” (shēng) nghĩa là gì?\",\"lesson\":19,\"options\":[\"tiến hành\",\"hoặc\",\"được sinh\",\"phương pháp; cách thức; cách\"],\"answer\":2},{\"q\":\"“以为” (yǐ wéi) nghĩa là gì?\",\"lesson\":17,\"options\":[\"bề mặt bên ngoài\",\"thông tin\",\"đứng lại\",\"nghĩ rằng (tức là cho là đúng ...) (Thường có hàm ý rằng quan niệm đó là sai lầm – ngoại trừ khi diễn đạt ý kiến hiện tại của chính mình.)\"],\"answer\":3},{\"q\":\"“轻” (qīng) nghĩa là gì?\",\"lesson\":21,\"options\":[\"màu đen\",\"nhẹ\",\"thông tin\",\"mảnh mỏng\"],\"answer\":1},{\"q\":\"“占” (zhàn) nghĩa là gì?\",\"lesson\":20,\"options\":[\"đi qua; vượt qua\",\"loại gì?; dạng gì?\",\"nghĩ rằng (tức là cho là đúng ...) (Thường có hàm ý rằng quan niệm đó là sai lầm – ngoại trừ khi diễn đạt ý kiến hiện tại của chính mình.)\",\"biến thể của 占[zhan4]\"],\"answer\":3}]},{\"id\":\"chu\",\"kind\":\"mcq\",\"title_vi\":\"Chọn chữ Hán\",\"instructions_vi\":\"Chọn chữ Hán đúng với nghĩa.\
