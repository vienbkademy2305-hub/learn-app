ù\",\"vi\":\"Tôi sẽ mãi mãi không quên sự giúp đỡ của bạn.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0300.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0300_slow.mp3\"},\"audioMs\":{\"normal\":2016,\"slow\":2424}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0301\",\"hanzi\":\"这件事让我很感动。\",\"pinyin\":\"zhè jiàn shì ràng wǒ hěn gǎn dòng\",\"vi\":\"Chuyện này khiến tôi rất cảm động.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0301.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0301_slow.mp3\"},\"audioMs\":{\"normal\":1488,\"slow\":1944}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0302\",\"hanzi\":\"别难过，这不是坏事。\",\"pinyin\":\"bié nán guò zhè bu shì huài shì\",\"vi\":\"Đừng buồn, đây không phải là chuyện xấu.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0302.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0302_slow.mp3\"},\"audioMs\":{\"normal\":2208,\"slow\":2064}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0303\",\"hanzi\":\"他是好人，不是坏人。\",\"pinyin\":\"tā shì hǎo rén bù shì huài rén\",\"vi\":\"Anh ấy là người tốt, không phải người xấu.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0303.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0303_slow.mp3\"},\"audioMs\":{\"normal\":1776,\"slow\":2448}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0304\",\"hanzi\":\"这样做坏处很多。\",\"pinyin\":\"zhè yàng zuò huài chu hěn duō\",\"vi\":\"Làm như thế này có rất nhiều cái hại.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0304.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0304_slow.mp3\"},\"audioMs\":{\"normal\":1824,\"slow\":1944}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0305\",\"hanzi\":\"好日子就要来了。\",\"pinyin\":\"hǎo rì zi jiù yào lái le\",\"vi\":\"Những ngày tốt đẹp sắp đến rồi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0305.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0305_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":1752}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0306\",\"hanzi\":\"这是一个好机会。\",\"pinyin\":\"zhè shì yī ge hǎo jī huì\",\"vi\":\"Đây là một cơ hội tốt.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0306.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0306_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":1704}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0307\",\"hanzi\":\"他气得说不出话。\",\"pinyin\":\"tā qì dé shuō bu chū huà\",\"vi\":\"Anh ấy tức đến mức không nói nên lời.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0307.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0307_slow.mp3\"},\"audioMs\":{\"normal\":1656,\"slow\":1752}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0308\",\"hanzi\":\"多么可爱的孩子啊！\",\"pinyin\":\"duō me kě ài de hái zi a\",\"vi\":\"Đứa trẻ đáng yêu biết bao!\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0308.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0308_slow.mp3\"},\"audioMs\":{\"normal\":1728,\"slow\":1704}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0309\",\"hanzi\":\"这是一个爱情故事。\",\"pinyin\":\"zhè shì yī ge ài qíng gù shì\",\"vi\":\"Đây là một câu chuyện tình yêu.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0309.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0309_slow.mp3\"},\"audioMs\":{\"normal\":1776,\"slow\":2112}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0458\",\"hanzi\":\"这个钱我不能收。\",\"pinyin\":\"zhè ge qián wǒ bù néng shōu\",\"vi\":\"Số tiền này tôi không thể nhận.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0458.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0458_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":2448}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0460\",\"hanzi\":\"他的理想实现了，成了作家。\",\"pinyin\":\"tā de lǐ xiǎng shí xiàn le chéng le zuò jiā\",\"vi\":\"Ước mơ của anh ấy đã thành hiện thực, anh ấy đã trở thành nhà văn.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0460.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0460_slow.mp3\"},\"audioMs\":{\"normal\":2256,\"slow\":3312}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0464\",\"hanzi\":\"他常常提到你。\",\"pinyin\":\"tā cháng cháng tí dào nǐ\",\"vi\":\"Anh ấy thường nhắc đến bạn.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0464.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0464_slow.mp3\"},\"audioMs\":{\"normal\":1464,\"slow\":1464}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0465\",\"hanzi\":\"这件事以后再提。\",\"pinyin\":\"zhè jiàn shì yǐ hòu zài tí\",\"vi\":\"Chuyện này để sau hẵng nhắc lại.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0465.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0465_slow.mp3\"},\"audioMs\":{\"normal\":1584,\"slow\":2112}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0466\",\"hanzi\":\"求你别生气了。\",\"pinyin\":\"qiú nǐ bié shēng qì le\",\"vi\":\"Xin bạn đừng giận nữa mà.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0466.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0466_slow.mp3\"},\"audioMs\":{\"normal\":1464,\"slow\":1320}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0477\",\"hanzi\":\"你放心，我会小心的。\",\"pinyin\":\"nǐ fàng xīn wǒ huì xiǎo xīn de\",\"vi\":\"Bạn yên tâm, tôi sẽ cẩn thận.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0477.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0477_slow.mp3\"},\"audioMs\":{\"normal\":1488,\"slow\":2256}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0480\",\"hanzi\":\"他心中有很多话想说。\",\"pinyin\":\"tā xīn zhōng yǒu hěn duō huà xiǎng shuō\",\"vi\":\"Trong lòng anh ấy có rất nhiều điều muốn nói.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0480.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0480_slow.mp3\"},\"audioMs\":{\"normal\":2328,\"slow\":2256}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0514\",\"hanzi\":\"挺好的，就这样吧。\",\"pinyin\":\"tǐng hǎo de jiù zhè yàng ba\",\"vi\":\"Khá tốt rồi, cứ thế đi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0514.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0514_slow.mp3\"},\"audioMs\":{\"normal\":1368,\"slow\":1824}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0519\",\"hanzi\":\"他对结果很不满。\",\"pinyin\":\"tā duì jiē guǒ hěn bù mǎn\",\"vi\":\"Anh ấy rất không hài lòng với kết quả.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0519.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0519_slow.mp3\"},\"audioMs\":{\"normal\":1728,\"slow\":1848}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0524\",\"hanzi\":\"不过，我还是想试试。\",\"pinyin\":\"bù guò wǒ hái shi xiǎng shì shì\",\"vi\":\"Có điều, tôi vẫn muốn thử một chút.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0524.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0524_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":2664}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0525\",\"hanzi\":\"可是他不听。\",\"pinyin\":\"kě shì tā bù tīng\",\"vi\":\"Nhưng anh ấy không chịu nghe.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0525.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0525_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":1560}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0526\",\"hanzi\":\"但他没有来。\",\"pinyin\":\"dàn tā méi yǒu lái\",\"vi\":\"Nhưng anh ấy đã không đến.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0526.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0526_slow.mp3\"},\"audioMs\":{\"normal\":1008,\"slow\":1512}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0530\",\"hanzi\":\"他是真正的好人。\",\"pinyin\":\"tā shì zhēn zhèng de hǎo rén\",\"vi\":\"Anh ấy là một người tốt thực sự.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0530.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0530_slow.mp3\"},\"audioMs\":{\"normal\":1416,\"slow\":1824}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0531\",\"hanzi\":\"或早或晚，他都会知道。\",\"pinyin\":\"huò zǎo huò wǎn tā dū huì zhī dào\",\"vi\":\"Sớm hay muộn thì anh ấy cũng sẽ biết.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0531.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0531_slow.mp3\"},\"audioMs\":{\"normal\":2136,\"slow\":2712}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0535\",\"hanzi\":\"你说的全对。\",\"pinyin\":\"nǐ shuō de quán duì\",\"vi\":\"Bạn nói hoàn toàn đúng.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0535.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0535_slow.mp3\"},\"audioMs\":{\"normal\":1056,\"slow\":1344}}]}],\"$L1b\"]}]\n1c:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n1b:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/zh/lesson/hsk2-15b-feelings/practice\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Luyện tập\"]}],[\"$\",\"$L8\",null,{\"href\":\"/zh/lesson/hsk2-15b-feelings/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n10:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"Luyện nói · HSK2 · Bài 18 · Học tiếng Trung\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Học tiếng Trung HSK cho người Việt: từ vựng, pinyin, Hán Việt, câu ví dụ có audio.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/learn-app/manifest.webmanifest\",\"crossOrigin\":\"$
