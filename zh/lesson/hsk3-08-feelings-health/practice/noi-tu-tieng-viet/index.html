i-tu-tieng-viet\",\"aria-current\":\"page\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium bg-white text-stone-900 shadow-sm\",\"children\":\"Nói từ tiếng Việt\"}],[\"$\",\"$L8\",\"paragraph\",{\"href\":\"/zh/lesson/hsk3-08-feelings-health/practice/paragraph\",\"aria-current\":\"$undefined\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium text-stone-500 hover:text-stone-800\",\"children\":\"Viết đoạn văn\"}]]}]}]]}],[[\"$\",\"section\",null,{\"className\":\"space-y-3 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\",\"children\":\"Câu của bài\"}],[\"$\",\"$L1a\",null,{\"lang\":\"zh\",\"items\":[{\"vi\":\"Rửa tay thường xuyên để phòng cảm cúm.\",\"answer\":\"多洗手，防止感冒。\",\"hints\":[\"duō xǐ shǒu fáng zhǐ gǎn mào\",\"多洗手，防止感冒。\"],\"note\":\"duō xǐ shǒu fáng zhǐ gǎn mào\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0707.mp3\"},{\"vi\":\"Anh ấy bị sốt, phải đi tiêm.\",\"answer\":\"他发烧了，要去打针。\",\"hints\":[\"tā fā shāo le yào qù dǎ zhēn\",\"他发烧了，要去打针。\"],\"note\":\"tā fā shāo le yào qù dǎ zhēn\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0252.mp3\"},{\"vi\":\"Mẹ lo lắng cho sức khỏe của tôi.\",\"answer\":\"妈妈担心我的健康。\",\"hints\":[\"mā ma dān xīn wǒ de jiàn kāng\",\"妈妈担心我的健康。\"],\"note\":\"mā ma dān xīn wǒ de jiàn kāng\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0507.mp3\"},{\"vi\":\"Hết giờ rồi, anh ấy rất sốt ruột.\",\"answer\":\"时间到了，他很着急。\",\"hints\":[\"shí jiān dào liǎo tā hěn zháo jí\",\"时间到了，他很着急。\"],\"note\":\"shí jiān dào liǎo tā hěn zháo jí\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0627.mp3\"},{\"vi\":\"An toàn là trên hết, đừng vội.\",\"answer\":\"安全优先，别着急。\",\"hints\":[\"ān quán yōu xiān bié zháo jí\",\"安全优先，别着急。\"],\"note\":\"ān quán yōu xiān bié zháo jí\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0277.mp3\"},{\"vi\":\"Bạn không cần phải sợ.\",\"answer\":\"你不必害怕。\",\"hints\":[\"nǐ bù bì hài pà\",\"你不必害怕。\"],\"note\":\"nǐ bù bì hài pà\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0290.mp3\"},{\"vi\":\"Không cần phải sợ.\",\"answer\":\"没有必要害怕。\",\"hints\":[\"méi yǒu bì yào hài pà\",\"没有必要害怕。\"],\"note\":\"méi yǒu bì yào hài pà\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0524.mp3\"},{\"vi\":\"Hành vi của anh ấy rất kỳ lạ.\",\"answer\":\"他的行为很奇怪。\",\"hints\":[\"tā de xíng wéi hěn qí guài\",\"他的行为很奇怪。\"],\"note\":\"tā de xíng wéi hěn qí guài\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0244.mp3\"},{\"vi\":\"Máy phát ra âm thanh kỳ lạ.\",\"answer\":\"机器发出奇怪的声音。\",\"hints\":[\"jī qì fā chū qí guài de shēng yīn\",\"机器发出奇怪的声音。\"],\"note\":\"jī qì fā chū qí guài de shēng yīn\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0449.mp3\"},{\"vi\":\"Tôi hy vọng bạn có thể thành công.\",\"answer\":\"我希望你能成功。\",\"hints\":[\"wǒ xī wàng nǐ néng chéng gōng\",\"我希望你能成功。\"],\"note\":\"wǒ xī wàng nǐ néng chéng gōng\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0211.mp3\"},{\"vi\":\"Anh ấy tràn đầy hy vọng vào tương lai.\",\"answer\":\"他对将来充满希望。\",\"hints\":[\"tā duì jiāng lái chōng mǎn xī wàng\",\"他对将来充满希望。\"],\"note\":\"tā duì jiāng lái chōng mǎn xī wàng\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0230.mp3\"},{\"vi\":\"Sở thích của anh ấy là vẽ tranh.\",\"answer\":\"他的兴趣是画画儿。\",\"hints\":[\"tā de xìng qù shì huà huà ér\",\"他的兴趣是画画儿。\"],\"note\":\"tā de xìng qù shì huà huà ér\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0333.mp3\"},{\"vi\":\"Tôi rất hứng thú với Kinh kịch.\",\"answer\":\"我对京剧很感兴趣。\",\"hints\":[\"wǒ duì jīng jù hěn gǎn xìng qù\",\"我对京剧很感兴趣。\"],\"note\":\"wǒ duì jīng jù hěn gǎn xìng qù\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0332.mp3\"},{\"vi\":\"Anh ấy rất hứng thú với chính trị.\",\"answer\":\"他对政治很感兴趣。\",\"hints\":[\"tā duì zhèng zhì hěn gǎn xìng qù\",\"他对政治很感兴趣。\"],\"note\":\"tā duì zhèng zhì hěn gǎn xìng qù\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0526.mp3\"},{\"vi\":\"Mọi người đều yêu thích chương trình này.\",\"answer\":\"大家都喜爱这个节目。\",\"hints\":[\"dà jiā dōu xǐ ài zhè ge jié mù\",\"大家都喜爱这个节目。\"],\"note\":\"dà jiā dōu xǐ ài zhè ge jié mù\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0396.mp3\"},{\"vi\":\"Đây là chương trình được công chúng yêu thích.\",\"answer\":\"这是大众喜爱的节目。\",\"hints\":[\"zhè shì dà zhòng xǐ ài de jié mù\",\"这是大众喜爱的节目。\"],\"note\":\"zhè shì dà zhòng xǐ ài de jié mù\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0413.mp3\"},{\"vi\":\"Anh ấy trước sau vẫn kiên trì.\",\"answer\":\"他始终坚持着。\",\"hints\":[\"tā shǐ zhōng jiān chí zhe\",\"他始终坚持着。\"],\"note\":\"tā shǐ zhōng jiān chí zhe\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0317.mp3\"},{\"vi\":\"Phải kiên trì tập thể dục lâu dài.\",\"answer\":\"要长期坚持运动。\",\"hints\":[\"yào cháng qī jiān chí yùn dòng\",\"要长期坚持运动。\"],\"note\":\"yào cháng qī jiān chí yùn dòng\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0705.mp3\"},{\"vi\":\"Tôi đành phải đồng ý.\",\"answer\":\"我不得不同意。\",\"hints\":[\"wǒ bù dé bù tóng yì\",\"我不得不同意。\"],\"note\":\"wǒ bù dé bù tóng yì\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0291.mp3\"},{\"vi\":\"Hai bên đồng ý hợp tác.\",\"answer\":\"双方同意合作。\",\"hints\":[\"shuāng fāng tóng yì hé zuò\",\"双方同意合作。\"],\"note\":\"shuāng fāng tóng yì hé zuò\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0446.mp3\"},{\"vi\":\"Thưa mọi người, xin chú ý!\",\"answer\":\"各位，请注意！\",\"hints\":[\"gè wèi qǐng zhù yì\",\"各位，请注意！\"],\"note\":\"gè wèi qǐng zhù yì\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0283.mp3\"},{\"vi\":\"Đi đường phải chú ý an toàn.\",\"answer\":\"路上要注意安全。\",\"hints\":[\"lù shang yào zhù yì ān quán\",\"路上要注意安全。\"],\"note\":\"lù shang yào zhù yì ān quán\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0144.mp3\"},{\"vi\":\"Truyền thông đều đang quan tâm đến chủ đề này.\",\"answer\":\"媒体都在关注这个话题。\",\"hints\":[\"méi tǐ dōu zài guān zhù zhè ge huà tí\",\"媒体都在关注这个话题。\"],\"note\":\"méi tǐ dōu zài guān zhù zhè ge huà tí\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0408.mp3\"},{\"vi\":\"Dư luận bên ngoài rất quan tâm đến chuyện này.\",\"answer\":\"外界对此很关注。\",\"hints\":[\"wài jiè duì cǐ hěn
