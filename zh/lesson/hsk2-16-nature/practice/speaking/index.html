y\":\"sentence:hsk2-0310\",\"hanzi\":\"晚上的月亮又大又亮。\",\"pinyin\":\"wǎn shang de yuè liang yòu dà yòu liàng\",\"vi\":\"Trăng đêm nay vừa to vừa sáng.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0310.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0310_slow.mp3\"},\"audioMs\":{\"normal\":1704,\"slow\":2448}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0311\",\"hanzi\":\"天上有很多星星。\",\"pinyin\":\"tiān shàng yǒu hěn duō xīng xing\",\"vi\":\"Trên trời có rất nhiều sao.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0311.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0311_slow.mp3\"},\"audioMs\":{\"normal\":1464,\"slow\":1920}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0312\",\"hanzi\":\"大海是蓝色的。\",\"pinyin\":\"dà hǎi shì lán sè de\",\"vi\":\"Biển cả có màu xanh lam.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0312.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0312_slow.mp3\"},\"audioMs\":{\"normal\":1248,\"slow\":1608}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0313\",\"hanzi\":\"我们在海边玩儿了一天。\",\"pinyin\":\"wǒ men zài hǎi biān wánr le yī tiān\",\"vi\":\"Chúng tôi chơi ở bờ biển cả một ngày.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0313.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0313_slow.mp3\"},\"audioMs\":{\"normal\":2256,\"slow\":2256}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0314\",\"hanzi\":\"湖边的草绿了。\",\"pinyin\":\"hú biān de cǎo lǜ le\",\"vi\":\"Cỏ bên hồ đã xanh rồi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0314.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0314_slow.mp3\"},\"audioMs\":{\"normal\":1488,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0315\",\"hanzi\":\"这条河很长，向东流。\",\"pinyin\":\"zhè tiáo hé hěn zhǎng xiàng dōng liú\",\"vi\":\"Con sông này rất dài, chảy về phía đông.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0315.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0315_slow.mp3\"},\"audioMs\":{\"normal\":1968,\"slow\":2424}},{\"kind\":
