"$\",\"$L8\",\"paragraph\",{\"href\":\"/zh/lesson/hsk3-01-people/practice/paragraph\",\"aria-current\":\"$undefined\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium text-stone-500 hover:text-stone-800\",\"children\":\"Viết đoạn văn\"}]]}]}]]}],[[\"$\",\"section\",null,{\"className\":\"space-y-3 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\",\"children\":\"Câu của bài\"}],[\"$\",\"$L1a\",null,{\"lang\":\"zh\",\"items\":[{\"vi\":\"Anh ấy nói chuyện điện thoại với người nhà.\",\"answer\":\"他和家人通话。\",\"hints\":[\"tā hé jiā rén tōng huà\",\"他和家人通话。\"],\"note\":\"tā hé jiā rén tōng huà\",\"audio\":\"audio/hsk-sentences-audio/hsk6-0953.mp3\"},{\"vi\":\"Anh ấy coi thú cưng như người nhà.\",\"answer\":\"他把宠物当成家人。\",\"hints\":[\"tā bǎ chǒng wù dàng chéng jiā rén\",\"他把宠物当成家人。\"],\"note\":\"tā bǎ chǒng wù dàng chéng jiā rén\",\"audio\":\"audio/hsk-sentences-audio/hsk6-0040.mp3\"},{\"vi\":\"Hành khách đang xếp hàng lên xe.\",\"answer\":\"旅客们在排队上车。\",\"hints\":[\"lǚ kè men zài pái duì shàng chē\",\"旅客们在排队上车。\"],\"note\":\"lǚ kè men zài pái duì shàng chē\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0191.mp3\"},{\"vi\":\"Các du học sinh đang học tiếng phổ thông.\",\"answer\":\"留学生们在学普通话。\",\"hints\":[\"liú xué sheng men zài xué pǔ tōng huà\",\"留学生们在学普通话。\"],\"note\":\"liú xué sheng men zài xué pǔ tōng huà\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0144.mp3\"},{\"vi\":\"Thưa quý ông quý bà, chào buổi tối!\",\"answer\":\"男士和女士们，晚上好！\",\"hints\":[\"nán shì hé nǚ shì men wǎn shang hǎo\",\"男士和女士们，晚上好！\"],\"note\":\"nán shì hé nǚ shì men wǎn shang hǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0020.mp3\"},{\"vi\":\"Vợ anh ấy là một y tá.\",\"answer\":\"他的妻子是一名护士。\",\"hints\":[\"tā de qī zǐ shì yī míng hù shi\",\"他的妻子是一名护士。\"],\"note\":\"tā de qī zǐ shì yī míng hù shi\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0006.mp3\"},{\"vi\":\"Ngày nào anh ấy cũng lau bàn giúp vợ.\",\"answer\":\"他每天帮妻子擦桌子。\",\"hints\":[\"tā měi tiān bāng qī zǐ cā zhuō zi\",\"他每天帮妻子擦桌子。\"],\"note\":\"tā měi tiān bāng qī zǐ cā zhuō zi\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0051.mp3\"},{\"vi\":\"Chồng tôi là một luật sư.\",\"answer\":\"我丈夫是一位律师。\",\"hints\":[\"wǒ zhàng fu shì yī wèi lǜ shī\",\"我丈夫是一位律师。\"],\"note\":\"wǒ zhàng fu shì yī wèi lǜ shī\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0007.mp3\"},{\"vi\":\"Cặp vợ chồng này là bạn thân của tôi.\",\"answer\":\"这对夫妻是我的好友。\",\"hints\":[\"zhè duì fū qī shì wǒ de hǎo yǒu\",\"这对夫妻是我的好友。\"],\"note\":\"zhè duì fū qī shì wǒ de hǎo yǒu\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0004.mp3\"},{\"vi\":\"Cả dì và chú đều đến dự đám cưới.\",\"answer\":\"阿姨和叔叔都来参加婚礼了。\",\"hints\":[\"ā yí hé shū shu dōu lái cān jiā hūn lǐ le\",\"阿姨和叔叔都来参加婚礼了。\"],\"note\":\"ā yí hé shū shu dōu lái cān jiā hūn lǐ le\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0001.mp3\"},{\"vi\":\"Anh chị em phải giúp đỡ lẫn nhau.\",\"answer\":\"兄弟姐妹要互相帮助。\",\"hints\":[\"xiōng dì jiě mèi yào hù xiāng bāng zhù\",\"兄弟姐妹要互相帮助。\"],\"note\":\"xiōng dì jiě mèi yào hù xiāng bāng zhù\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0024.mp3\"},{\"vi\":\"Người hàng xóm sát vách rất lịch sự.\",\"answer\":\"隔壁的邻居很客气。\",\"hints\":[\"gé bì de lín jū hěn kè qi\",\"隔壁的邻居很客气。\"],\"note\":\"gé bì de lín jū hěn kè qi\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0035.mp3\"},{\"vi\":\"Hàng xóm là một quân nhân đã nghỉ hưu.\",\"answer\":\"邻居是一位退休的军人。\",\"hints\":[\"lín jū shì yī wèi tuì xiū de jūn rén\",\"邻居是一位退休的军人。\"],\"note\":\"lín jū shì yī wèi tuì xiū de jūn rén\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0022.mp3\"},{\"vi\":\"Ông ấy là một người nổi tiếng, cũng là một nhà thơ.\",\"answer\":\"他是一位名人，也是诗人。\",\"hints\":[\"tā shì yī wèi míng rén yě shì shī rén\",\"他是一位名人，也是诗人。\"],\"note\":\"tā shì yī wèi míng rén yě shì shī rén\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0022.mp3\"},{\"vi\":\"Anh ấy từng là một thành viên của đội.\",\"answer\":\"他曾经是一名队员。\",\"hints\":[\"tā céng jīng shì yī míng duì yuán\",\"他曾经是一名队员。\"],\"note\":\"tā céng jīng shì yī míng duì yuán\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0076.mp3\"},{\"vi\":\"Nhân viên đã có mặt đầy đủ.\",\"answer\":\"工作人员都到齐了。\",\"hints\":[\"gōng zuò rén yuán dōu dào qí le\",\"工作人员都到齐了。\"],\"note\":\"gōng zuò rén yuán dōu dào qí le\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0372.mp3\"},{\"vi\":\"Các vận động viên đang tập luyện.\",\"answer\":\"运动员们在训练。\",\"hints\":[\"yùn dòng yuán men zài xùn liàn\",\"运动员们在训练。\"],\"note\":\"yùn dòng yuán men zài xùn liàn\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0729.mp3\"},{\"vi\":\"Phóng viên đã phỏng vấn vận động viên.\",\"answer\":\"记者采访了运动员。\",\"hints\":[\"jì zhě cǎi fǎng le yùn dòng yuán\",\"记者采访了运动员。\"],\"note\":\"jì zhě cǎi fǎng le yùn dòng yuán\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0747.mp3\"},{\"vi\":\"Anh ấy thấp nhưng rất dũng cảm.\",\"answer\":\"他个子矮，但是很勇敢。\",\"hints\":[\"tā gè zi ǎi dàn shì hěn yǒng gǎn\",\"他个子矮，但是很勇敢。\"],\"note\":\"tā gè zi ǎi dàn shì hěn yǒng gǎn\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0034.mp3\"},{\"vi\":\"Chàng trai này dáng người thấp nhỏ.\",\"answer\":\"这个小伙子长得矮小。\",\"hints\":[\"zhè ge xiǎo huǒ zǐ cháng dé ǎi xiǎo\",\"这个小伙子长得矮小。\"],\"note\":\"zhè ge xiǎo huǒ zǐ cháng dé ǎi xiǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0629.mp3\"},{\"vi\":\"Dạo này anh ấy béo lên rồi.\",\"answer\":\"他最近胖了。\",\"hints\":[\"tā zuì jìn pàng le\",\"他最近胖了。\"],\"note\":\"tā zuì jìn pàng le\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0646.mp3\"},{\"vi\":\"Anh chàng béo đó rất hay cười.\",\"answer\":\"那个胖子很爱笑。\",\"hints\":[\"nà ge pàng zi hěn ài xiào\",\"那个胖子很爱笑。\"],\"note\":\"nà ge pàng zi hěn ài xiào\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0798.mp3\"},{\"vi\":\"Dạo này anh ấy gầy đi.\",\"answer\":\"他最近瘦了。\",\"hints\":[\"tā zuì jìn shòu le\",\"他最近瘦了。\"],\"note\":\"tā zuì jìn shòu le\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0728.mp3\"},{\"vi\":\"Anh ấy cao một mét tám, nặng bảy mươi cân.\",\"answer\":\"他的身高一米八，体重七十公斤。\",\"hints\":[\"tā de shēn gāo yī mǐ bā tǐ zhòng qī shí gōng jīn\",\"他的身高一米八，体重七十公斤。\"],\"note\":\"tā de shēn gāo yī mǐ bā tǐ zhòng qī shí gōng jīn\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0057.mp3\"},{\"vi\":\"Đầu óc anh ấy rất thông minh.\",\"answer\":\"他脑子很聪明。\",\"hints\":[\"tā nǎo zi hěn cōng ming\",\"他脑子很聪明。\"],\"note\":\"tā nǎo zi hěn cōng ming\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0796.mp3\"},{\"vi\":\"Người này rất thông minh, nhưng hơi chủ quan.\",\"answer\":\"这个人很聪明，但有点儿主观。\",\"hints\":[\"zhè ge rén hěn cōng ming dàn yǒu diǎnr zhǔ guān\",\"这个人很聪明，但有点儿主观。\"],\"note\":\"zhè ge rén hěn cōng ming dàn yǒu diǎnr zhǔ guān\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0019.mp3\"},{\"vi\":\"Anh ấy lấy tay bịt tai lại.\",\"answer\":\"他用手挡住耳朵。\",\"hints\":[\"tā yòng shǒu dǎng zhù ěr duo\",\"他用手挡住耳朵。\"],\"note\":\"tā yòng shǒu dǎng zhù ěr duo\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0782.mp3\"},{\"vi\":\"Đau răng cũng phải đi bệnh viện.\",\"answer\":\"牙疼也要去医院。\",\"hints\":[\"yá téng yě yào qù yī yuàn\",\"牙疼也要去医院。\"],\"note\":\"yá téng yě yào qù yī yuàn\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0254.mp3\"},{\"vi\":\"Mỗi sáng đánh răng phải dùng bàn chải đánh răng.\",\"answer\":\"每天早上刷牙要用牙刷。\",\"hints\":[\"měi tiān zǎo shang shuā yá yào yòng yá shuā\",\"每天早上刷牙要用牙刷。\"],\"note\":\"měi tiān zǎo shang shuā yá yào yòng yá shuā\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0048.mp3\"},{\"vi\":\"Tôi bị cảm rồi, đau đầu lắm.\",\"answer\":\"我感冒了，头很痛。\",\"hints\":[\"wǒ gǎn mào le tóu hěn tòng\",\"我感冒了，头很痛。\"],\"note\":\"wǒ gǎn mào le tóu hěn tòng\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0178.mp3\"},{\"vi\":\"Anh ấy ngẩng đầu lên nhìn tôi.\",\"answer\":\"他抬起头看着我。\",\"hints\":[\"tā tái qǐ tóu kàn zhe wǒ\",\"他抬起头看着我。\"],\"note\":\"tā tái qǐ tóu kàn zhe wǒ\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0542.mp3\"},{\"vi\":\"Tôi biết đường đến nhà ga.\",\"answer\":\"我认得去车站的路。\",\"hints\":[\"wǒ rèn de qù chē zhàn de lù\",\"我认得去车站的路。\"],\"note\":\"wǒ rèn de qù chē zhàn de lù\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0664.mp3\"},{\"vi\":\"Tôi không nhận ra chữ này.\",\"answer\":\"我不认得这个字。\",\"hints\":[\"wǒ bù rèn de zhè ge zì\",\"我不认得这个字。\"],\"note\":\"wǒ bù rèn de zhè ge zì\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0955.mp3\"},{\"vi\":\"Lâu lắm không gặp, dạo này bạn đi đâu thế?\",\"answer\":\"好久不见，你去哪儿了？\",\"hints\":[\"hǎo jiǔ bu jiàn nǐ qù nǎr le\",\"好久不见，你去哪儿了？\"],\"note\":\"hǎo jiǔ bu jiàn nǐ qù nǎr le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0010.mp3\"},{\"vi\":\"Chất khí thì không nhìn thấy được.\",\"answer\":\"气体看不见。\",\"hints\":[\"qì tǐ kàn bu jiàn\",\"气体看不见。\"],\"note\":\"qì tǐ kàn bu jiàn\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0669.mp3\"},{\"vi\":\"Cô ấy vẫn chưa có đối tượng để kết hôn.\",\"answer\":\"她还没有结婚的对象。\",\"hints\":[\"tā hái méi yǒu jié hūn de duì xiàng\",\"她还没有结婚的对象。\"],\"note\":\"tā hái méi yǒu jié hūn de duì xiàng\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0032.mp3\"},{\"vi\":\"Hai người họ đã kết hôn năm ngoái.\",\"answer\":\"他们两个人去年结婚了。\",\"hints\":[\"tā men liǎng gè rén qù nián jié hūn le\",\"他们两个人去年结婚了。\"],\"note\":\"tā men liǎng gè rén qù nián jié hūn le\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0030.mp3\"}]}]]}],\"$L1b\",\"$L1c\"],\"$L1d\"]}]\n1b:[\"$\",\"section\",null,{\"className\":\"space-y-3 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\",\"children\":\"Từ vựng\"}],[\"$\",\"$L1a\",null,{\"lang\":\"zh\",\"items\":[{\"vi\":\"Từ: thành viên gia đình\",\"answer\":\"家人\",\"hints\":[\"jiā rén\",\"家人\"],\"note\":\"jiā rén\"},{\"vi\":\"Từ: dùng để chỉ số nhiều cho đại từ và danh từ chỉ người\",\"answer\":\"们\",\"hints\":[\"men\",\"们\"],\"note\":\"men\"},{\"vi\":\"Từ: quý bà\",\"answer\":\"女士\",\"hints\":[\"nǚ shì\",\"女士\"],\"note\":\"nǚ shì\"},{\"vi\":\"Từ: vợ\",\"answer\":\"妻子\",\"hints\":[\"qī zi\",\"妻子\"],\"note\":\"qī zi\"},{\"vi\":\"Từ: chồng\",\"answer\":\"丈夫\",\"hints
