io/hsk2-0161_slow.mp3\"},\"audioMs\":{\"normal\":1416,\"slow\":2712}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0162\",\"hanzi\":\"爷爷的一生都在教书。\",\"pinyin\":\"yé ye de yī shēng dōu zài jiào shū\",\"vi\":\"Cả đời ông nội đều làm nghề dạy học.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0162.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0162_slow.mp3\"},\"audioMs\":{\"normal\":1944,\"slow\":2856}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0446\",\"hanzi\":\"教室里的桌子和椅子都很新。\",\"pinyin\":\"jiào shì lǐ de zhuō zi hé yǐ zi dōu hěn xīn\",\"vi\":\"Bàn và ghế trong lớp học đều rất mới.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0446.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0446_slow.mp3\"},\"audioMs\":{\"normal\":2544,\"slow\":3048}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0447\",\"hanzi\":\"我在课堂上记笔记。\",\"pinyin\":\"wǒ zài kè táng shàng jì bǐ jì\",\"vi\":\"Tôi ghi chép trong giờ học.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0447.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0447_slow.mp3\"},\"audioMs\":{\"normal\":1968,\"slow\":2160}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0468\",\"hanzi\":\"我们去交作业吧。\",\"pinyin\":\"wǒ men qù jiāo zuò yè ba\",\"vi\":\"Chúng ta đi nộp bài tập đi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0468.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0468_slow.mp3\"},\"audioMs\":{\"normal\":1728,\"slow\":1560}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0471\",\"hanzi\":\"我们参观了他们的学校。\",\"pinyin\":\"wǒ men cān guān le tā men de xué xiào\",\"vi\":\"Chúng tôi đã đi thăm quan trường của họ.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0471.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0471_slow.mp3\"},\"audioMs\":{\"normal\":1944,\"slow\":2256}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0483\",\"hanzi\":\"教育是国家的大事。\",\"pinyin\":\"jiào yù shì guó jiā de dà shì\",\"vi\":\"Giáo dục là việc lớn của quốc gia.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0483.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0483_slow.mp3\"},\"audioMs\":{\"normal\":1776,\"slow\":2064}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0484\",\"hanzi\":\"他做教学工作二十年了。\",\"pinyin\":\"tā zuò jiāo xué gōng zuò èr shí nián le\",\"vi\":\"Ông ấy làm công tác giảng dạy đã hai mươi năm rồi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0484.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0484_slow.mp3\"},\"audioMs\":{\"normal\":2064,\"slow\":2712}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0490\",\"hanzi\":\"我们组有五个人。\",\"pinyin\":\"wǒ men zǔ yǒu wǔ gè rén\",\"vi\":\"Nhóm chúng tôi có năm người.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0490.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0490_slow.mp3\"},\"audioMs\":{\"normal\":1416,\"slow\":2448}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0496\",\"hanzi\":\"全部的作业我都写完了。\",\"pinyin\":\"quán bù de zuò yè wǒ dōu xiě wán le\",\"vi\":\"Tôi đã làm xong toàn bộ bài tập.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0496.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0496_slow.mp3\"},\"audioMs\":{\"normal\":2016,\"slow\":2520}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0515\",\"hanzi\":\"中小学生都放假了。\",\"pinyin\":\"zhōng xiǎo xué sheng dōu fàng jià le\",\"vi\":\"Học sinh tiểu học và trung học đều được nghỉ rồi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0515.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0515_slow.mp3\"},\"audioMs\":{\"normal\":1656,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0532\",\"hanzi\":\"接着，我们讨论第二个问题。\",\"pinyin\":\"jiē zhe wǒ men tǎo lùn dì èr gè wèn tí\",\"vi\":\"Tiếp theo, chúng ta thảo luận vấn đề thứ hai.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0532.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0532_slow.mp3\"},\"audioMs\":{\"normal\":2256,\"slow\":2712}}]}],\"$L1b\"]}]\n1c:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chu
