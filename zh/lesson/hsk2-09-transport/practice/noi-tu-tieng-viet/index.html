oi-thoai\",\"aria-current\":\"$undefined\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium text-stone-500 hover:text-stone-800\",\"children\":\"Hội thoại đóng vai\"}],[\"$\",\"$L8\",\"interpret\",{\"href\":\"/zh/lesson/hsk2-09-transport/practice/noi-tu-tieng-viet\",\"aria-current\":\"page\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium bg-white text-stone-900 shadow-sm\",\"children\":\"Nói từ tiếng Việt\"}],[\"$\",\"$L8\",\"paragraph\",{\"href\":\"/zh/lesson/hsk2-09-transport/practice/paragraph\",\"aria-current\":\"$undefined\",\"className\":\"whitespace-nowrap rounded-lg px-3 py-1.5 font-medium text-stone-500 hover:text-stone-800\",\"children\":\"Viết đoạn văn\"}]]}]}]]}],[[\"$\",\"section\",null,{\"className\":\"space-y-3 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\",\"children\":\"Câu của bài\"}],[\"$\",\"$L1a\",null,{\"lang\":\"zh\",\"items\":[{\"vi\":\"Tôi đi tàu điện ngầm đi làm.\",\"answer\":\"我坐地铁去上班。\",\"hints\":[\"wǒ zuò dì tiě qù shàng bān\",\"我坐地铁去上班。\"],\"note\":\"wǒ zuò dì tiě qù shàng bān\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0179.mp3\"},{\"vi\":\"Trong ga tàu điện ngầm rất đông người.\",\"answer\":\"地铁站里人很多。\",\"hints\":[\"dì tiě zhàn lǐ rén hěn duō\",\"地铁站里人很多。\"],\"note\":\"dì tiě zhàn lǐ rén hěn duō\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0180.mp3\"},{\"vi\":\"Bạn có thể đi xe buýt đến đó.\",\"answer\":\"你可以坐公共汽车去。\",\"hints\":[\"nǐ kě yǐ zuò gōng gòng qì chē qù\",\"你可以坐公共汽车去。\"],\"note\":\"nǐ kě yǐ zuò gōng gòng qì chē qù\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0181.mp3\"},{\"vi\":\"Xe buýt đến rồi, mau lên xe!\",\"answer\":\"公交车来了，快上车！\",\"hints\":[\"gōng jiāo chē lái le kuài shàng chē\",\"公交车来了，快上车！\"],\"note\":\"gōng jiāo chē lái le kuài shàng chē\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0182.mp3\"},{\"vi\":\"Taxi đắt hơn tàu điện ngầm.\",\"answer\":\"出租车比地铁贵。\",\"hints\":[\"chū zū chē bǐ dì tiě guì\",\"出租车比地铁贵。\"],\"note\":\"chū zū chē bǐ dì tiě guì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0183.mp3\"},{\"vi\":\"Tôi biết đi xe đạp.\",\"answer\":\"我会骑自行车。\",\"hints\":[\"wǒ huì qí zì xíng chē\",\"我会骑自行车。\"],\"note\":\"wǒ huì qí zì xíng chē\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0184.mp3\"},{\"vi\":\"Anh ấy đạp xe đến trường.\",\"answer\":\"他骑车去学校。\",\"hints\":[\"tā qí chē qù xué xiào\",\"他骑车去学校。\"],\"note\":\"tā qí chē qù xué xiào\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0185.mp3\"},{\"vi\":\"Chúng tôi đi thuyền qua sông.\",\"answer\":\"我们坐船过河。\",\"hints\":[\"wǒ men zuò chuán guò hé\",\"我们坐船过河。\"],\"note\":\"wǒ men zuò chuán guò hé\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0186.mp3\"},{\"vi\":\"Máy bay sắp cất cánh rồi.\",\"answer\":\"飞机就要起飞了。\",\"hints\":[\"fēi jī jiù yào qǐ fēi le\",\"飞机就要起飞了。\"],\"note\":\"fēi jī jiù yào qǐ fēi le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0187.mp3\"},{\"vi\":\"Đi nước ngoài phải mang hộ chiếu.\",\"answer\":\"出国要带护照。\",\"hints\":[\"chū guó yào dài hù zhào\",\"出国要带护照。\"],\"note\":\"chū guó yào dài hù zhào\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0188.mp3\"},{\"vi\":\"Tháng sau anh ấy về nước.\",\"answer\":\"他下个月回国。\",\"hints\":[\"tā xià ge yuè huí guó\",\"他下个月回国。\"],\"note\":\"tā xià ge yuè huí guó\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0189.mp3\"},{\"vi\":\"Chuyến du lịch lần này rất suôn sẻ.\",\"answer\":\"这次旅行很顺利。\",\"hints\":[\"zhè cì lǚ xíng hěn shùn lì\",\"这次旅行很顺利。\"],\"note\":\"zhè cì lǚ xíng hěn shùn lì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0190.mp3\"},{\"vi\":\"Hành khách đang xếp hàng lên xe.\",\"answer\":\"旅客们在排队上车。\",\"hints\":[\"lǚ kè men zài pái duì shàng chē\",\"旅客们在排队上车。\"],\"note\":\"lǚ kè men zài pái duì shàng chē\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0191.mp3\"},{\"vi\":\"Trên đường xe cộ rất đông, phải cẩn thận.\",\"answer\":\"路上车辆很多，要小心。\",\"hints\":[\"lù shang chē liàng hěn duō yào xiǎo xīn\",\"路上车辆很多，要小心。\"],\"note\":\"lù shang chē liàng hěn duō yào xiǎo xīn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0192.mp3\"},{\"vi\":\"Giao thông ở đây rất thuận tiện, đi xe mười phút là đến.\",\"answer\":\"这里交通很方便，坐车十分钟就到。\",\"hints\":[\"zhè lǐ jiāo tōng hěn fāng biàn zuò chē shí fēn zhōng jiù dào\",\"这里交通很方便，坐车十分钟就到。\"],\"note\":\"zhè lǐ jiāo tōng hěn fāng biàn zuò chē shí fēn zhōng jiù dào\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0193.mp3\"},{\"vi\":\"Bãi đỗ xe ở phía sau khách sạn.\",\"answer\":\"停车场在酒店后边。\",\"hints\":[\"tíng chē chǎng zài jiǔ diàn hòu bian\",\"停车场在酒店后边。\"],\"note\":\"tíng chē chǎng zài jiǔ diàn hòu bian\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0194.mp3\"},{\"vi\":\"Ở đây không được đỗ xe.\",\"answer\":\"这里不能停车。\",\"hints\":[\"zhè lǐ bù néng tíng chē\",\"这里不能停车。\"],\"note\":\"zhè lǐ bù néng tíng chē\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0195.mp3\"},{\"vi\":\"Chúng tôi xuất phát từ trường.\",\"answer\":\"我们从学校出发。\",\"hints\":[\"wǒ men cóng xué xiào chū fā\",\"我们从学校出发。\"],\"note\":\"wǒ men cóng xué xiào chū fā\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0196.mp3\"},{\"vi\":\"Anh ấy hỏi đường tôi.\",\"answer\":\"他向我问路。\",\"hints\":[\"tā xiàng wǒ wèn lù\",\"他向我问路。\"],\"note\":\"tā xiàng wǒ wèn lù\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0197.mp3\"},{\"vi\":\"Đi qua công viên là đến nhà tôi.\",\"answer\":\"经过公园，就到我家了。\",\"hints\":[\"jīng guò gōng yuán jiù dào wǒ jiā le\",\"经过公园，就到我家了。\"],\"note\":\"jīng guò gōng yuán jiù dào wǒ jiā le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0198.mp3\"},{\"vi\":\"Đi qua hết con phố này là siêu thị.\",\"answer\":\"走过这条街就是超市。\",\"hints\":[\"zǒu guò zhè tiáo jiē jiù shì chāo shì\",\"走过这条街就是超市。\"],\"note\":\"zǒu guò zhè tiáo jiē jiù shì chāo shì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0199.mp3\"},{\"vi\":\"Xe chạy nhanh quá, đáng sợ thật.\",\"answer\":\"车开得太快，太可怕了。\",\"hints\":[\"chē kāi dé tài kuài tài kě pà le\",\"车开得太快，太可怕了。\"],\"note\":\"chē kāi dé tài kuài tài kě pà le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0200.mp3\"},{\"vi\":\"Tôi đã l
