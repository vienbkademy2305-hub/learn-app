jié rì\",\"春节是中国最重要的节日。\"],\"note\":\"chūn jié shì zhōng guó zuì zhòng yào de jié rì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0066.mp3\"},{\"vi\":\"Cuối tuần bạn có rảnh không?\",\"answer\":\"周末你有空儿吗？\",\"hints\":[\"zhōu mò nǐ yǒu kòngr ma\",\"周末你有空儿吗？\"],\"note\":\"zhōu mò nǐ yǒu kòngr ma\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0067.mp3\"},{\"vi\":\"Tuần trước tôi đã đi biển.\",\"answer\":\"上周我去了海边。\",\"hints\":[\"shàng zhōu wǒ qù le hǎi biān\",\"上周我去了海边。\"],\"note\":\"shàng zhōu wǒ qù le hǎi biān\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0068.mp3\"},{\"vi\":\"Tuần sau khai giảng, tôi phải ôn lại từ mới.\",\"answer\":\"下周开学，我要复习生词。\",\"hints\":[\"xià zhōu kāi xué wǒ yào fù xí shēng cí\",\"下周开学，我要复习生词。\"],\"note\":\"xià zhōu kāi xué wǒ yào fù xí shēng cí\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0069.mp3\"},{\"vi\":\"Sáng sớm sáu giờ tôi đã dậy rồi.\",\"answer\":\"我早晨六点就起床了。\",\"hints\":[\"wǒ zǎo chén liù diǎn jiù qǐ chuáng le\",\"我早晨六点就起床了。\"],\"note\":\"wǒ zǎo chén liù diǎn jiù qǐ chuáng le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0070.mp3\"},{\"vi\":\"Nửa đêm hôm qua tuyết đã rơi.\",\"answer\":\"昨天半夜下雪了。\",\"hints\":[\"zuó tiān bàn yè xià xuě le\",\"昨天半夜下雪了。\"],\"note\":\"zuó tiān bàn yè xià xuě le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0071.mp3\"},{\"vi\":\"Ban đêm rất yên tĩnh.\",\"answer\":\"夜里很安静。\",\"hints\":[\"yè li hěn ān jìng\",\"夜里很安静。\"],\"note\":\"yè li hěn ān jìng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0072.mp3\"},{\"vi\":\"Vừa nãy có người gọi điện cho bạn.\",\"answer\":\"刚才有人给你打电话。\",\"hints\":[\"gāng cái yǒu rén gěi nǐ dǎ diàn huà\",\"刚才有人给你打电话。\"],\"note\":\"gāng cái yǒu rén gěi nǐ dǎ diàn huà\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0073.mp3\"},{\"vi\":\"Dạo này tôi đặc biệt bận.\",\"answer\":\"最近我特别忙。\",\"hints\":[\"zuì jìn wǒ tè bié máng\",\"最近我特别忙。\"],\"note\":\"zuì jìn wǒ tè bié máng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0074.mp3\"},{\"vi\":\"Về sau anh ấy đi làm ở nơi khác.\",\"answer\":\"后来他去外地工作了。\",\"hints\":[\"hòu lái tā qù wài dì gōng zuò le\",\"后来他去外地工作了。\"],\"note\":\"hòu lái tā qù wài dì gōng zuò le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0075.mp3\"},{\"vi\":\"Lúc đó tôi vẫn còn là học sinh tiểu học.\",\"answer\":\"当时我还是小学生。\",\"hints\":[\"dāng shí wǒ hái shi xiǎo xué sheng\",\"当时我还是小学生。\"],\"note\":\"dāng shí wǒ hái shi xiǎo xué sheng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0076.mp3\"},{\"vi\":\"Kỳ nghỉ tôi định đi du lịch.\",\"answer\":\"假期我打算去旅行。\",\"hints\":[\"jià qī wǒ dǎ suàn qù lǚ xíng\",\"假期我打算去旅行。\"],\"note\":\"jià qī wǒ dǎ suàn qù lǚ xíng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0077.mp3\"},{\"vi\":\"Tháng Mười là tháng tôi thích nhất.\",\"answer\":\"十月是我最喜欢的月份。\",\"hints\":[\"shí yuè shì wǒ zuì xǐ huan de yuè fèn\",\"十月是我最喜欢的月份。\"],\"note\":\"shí yuè shì wǒ zuì xǐ huan de yuè fèn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0078.mp3\"},{\"vi\":\"Năm kia tôi vẫn còn học cấp ba.\",\"answer\":\"前年我还在高中。\",\"hints\":[\"qián nián wǒ hái zài gāo zhōng\",\"前年我还在高中。\"],\"note\":\"qián nián wǒ hái zài gāo zhōng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0079.mp3\"},{\"vi\":\"Hồi nhỏ tôi sợ bóng tối.\",\"answer\":\"小时候我怕黑。\",\"hints\":[\"xiǎo shí hou wǒ pà hēi\",\"小时候我怕黑。\"],\"note\":\"xiǎo shí hou wǒ pà hēi\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0080.mp3\"},{\"vi\":\"Đợi đến mùa xuân năm sau, chúng ta lại gặp nhau.\",\"answer\":\"等到明年春天，我们再见面。\",\"hints\":[\"děng dào míng nián chūn tiān wǒ men zài jiàn miàn\",\"等到明年春天，我们再见面。\"],\"note\":\"děng dào míng nián chūn tiān wǒ men zài jiàn miàn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0081.mp3\"},{\"vi\":\"Hồi đó tôi còn nhỏ, nhiều chuyện chưa hiểu.\",\"answer\":\"那时我还小，很多事不懂。\",\"hints\":[\"nà shí wǒ hái xiǎo hěn duō shì bù dǒng\",\"那时我还小，很多事不懂。\"],\"note\":\"nà shí wǒ hái xiǎo hěn duō shì bù dǒng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0082.mp3\"},{\"vi\":\"Lúc này trên đường rất ít người đi bộ.\",\"answer\":\"这时候路上行人很少。\",\"hints\":[\"zhè shí hou lù shang xíng rén hěn shǎo\",\"这时候路上行人很少。\"],\"note\":\"zhè shí hou lù shang xíng rén hěn shǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0083.mp3\"},{\"vi\":\"Từ nay về sau tôi sẽ thường đến thăm bạn.\",\"answer\":\"今后我会常来看你。\",\"hints\":[\"jīn hòu wǒ huì cháng lái kàn nǐ\",\"今后我会常来看你。\"],\"note\":\"jīn hòu wǒ huì cháng lái kàn nǐ\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0084.mp3\"},{\"vi\":\"Tuần này tôi rất bận, tuần sau đỡ hơn một chút.\",\"answer\":\"这周我很忙，下周好一点儿。\",\"hints\":[\"zhè zhōu wǒ hěn máng xià zhōu hǎo yī diǎnr\",\"这周我很忙，下周好一点儿。\"],\"note\":\"zhè zhōu wǒ hěn máng xià zhōu hǎo yī diǎnr\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0085.mp3\"},{\"vi\":\"Bây giờ đúng là lúc ăn sủi cảo.\",\"answer\":\"现在正是吃饺子的时候。\",\"hints\":[\"xiàn zài zhèng shì chī jiǎo zi de shí hou\",\"现在正是吃饺子的时候。\"],\"note\":\"xiàn zài zhèng shì chī jiǎo zi de shí hou\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0086.mp3\"},{\"vi\":\"Bây giờ là ba giờ mười lăm.\",\"answer\":\"现在是三点一刻。\",\"hints\":[\"xiàn zài shì sān diǎn yī kè\",\"现在是三点一刻。\"],\"note\":\"xiàn zài shì sān diǎn yī kè\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0087.mp3\"},{\"vi\":\"Tết Xuân là ngày lễ lớn nhất trong năm.\",\"answer\":\"春节是一年里最大的节。\",\"hints\":[\"chūn jié shì yī nián lǐ zuì dà de jié\",\"春节是一年里最大的节。\"],\"note\":\"chūn jié shì yī nián lǐ zuì dà de jié\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0492.mp3\"},{\"vi\":\"Hồi đó chúng tôi còn chưa quen nhau.\",\"answer\":\"那时候我们还不认识。\",\"hints\":[\"nà shí hou wǒ men hái bù rèn shi\",\"那时候我们还不认识。\"],\"note\":\"nà shí hou wǒ men hái bù rèn shi\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0502.mp3\"},{\"vi\":\"Lúc ấy tôi đang ngủ.\",\"answer\":\"那会儿我正在睡觉。\",\"hints\":[\"nà huìr wǒ zhèng zài shuì jiào\",\"那会儿我正在睡觉。\"],\"note\":\"nà huìr wǒ zhèng zài shuì jiào\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0503.mp3\"},{\"vi\":\"Đúng lúc này, có tiếng gõ cửa.\",\"answer\":\"这时，门响了。\",\"hints\":[\"zhè shí mén xiǎng le\",\"这时，门响了。\"],\"note\":\"zhè shí mén xiǎng le\",\"audio\":\"audio/hsk-se
