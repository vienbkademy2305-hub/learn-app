 có 1,4 tỷ dân.\",\"answer\":\"中国有十四亿人口。\",\"hints\":[\"zhōng guó yǒu shí sì yì rén kǒu\",\"中国有十四亿人口。\"],\"note\":\"zhōng guó yǒu shí sì yì rén kǒu\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0045.mp3\"},{\"vi\":\"Phần lớn học sinh đều đã tham gia hoạt động.\",\"answer\":\"大部分学生都参加了活动。\",\"hints\":[\"dà bù fen xué sheng dōu cān jiā le huó dòng\",\"大部分学生都参加了活动。\"],\"note\":\"dà bù fen xué sheng dōu cān jiā le huó dòng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0046.mp3\"},{\"vi\":\"Rất nhiều du khách chụp ảnh trên quảng trường.\",\"answer\":\"许多游客在广场上照相。\",\"hints\":[\"xǔ duō yóu kè zài guǎng chǎng shàng zhào xiàng\",\"许多游客在广场上照相。\"],\"note\":\"xǔ duō yóu kè zài guǎng chǎng shàng zhào xiàng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0047.mp3\"},{\"vi\":\"Cuốn sách này tôi đã đọc hai lượt.\",\"answer\":\"这本书我读了两遍。\",\"hints\":[\"zhè běn shū wǒ dú le liǎng biàn\",\"这本书我读了两遍。\"],\"note\":\"zhè běn shū wǒ dú le liǎng biàn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0048.mp3\"},{\"vi\":\"Tòa nhà này có hai mươi tầng.\",\"answer\":\"这座楼有二十层。\",\"hints\":[\"zhè zuò lóu yǒu èr shí céng\",\"这座楼有二十层。\"],\"note\":\"zhè zuò lóu yǒu èr shí céng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0049.mp3\"},{\"vi\":\"Tôi đã viết một bài văn.\",\"answer\":\"我写了一篇作文。\",\"hints\":[\"wǒ xiě le yī piān zuò wén\",\"我写了一篇作文。\"],\"note\":\"wǒ xiě le yī piān zuò wén\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0050.mp3\"},{\"vi\":\"Anh ấy đã gửi cho tôi một tin nhắn.\",\"answer\":\"他给我发了一条短信。\",\"hints\":[\"tā gěi wǒ fā le yī tiáo duǎn xìn\",\"他给我发了一条短信。\"],\"note\":\"tā gěi wǒ fā le yī tiáo duǎn xìn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0051.mp3\"},{\"vi\":\"Tôi đã nhận được một lá thư.\",\"answer\":\"我收到了一封信。\",\"hints\":[\"wǒ shōu dào liǎo yī fēng xìn\",\"我收到了一封信。\"],\"note\":\"wǒ shōu dào liǎo yī fēng xìn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0052.mp3\"},{\"vi\":\"Mua một bộ sách giáo khoa tổng cộng một trăm đồng.\",\"answer\":\"买一套课本一共一百块。\",\"hints\":[\"mǎi yī tào kè běn yī gòng yì bǎi kuài\",\"买一套课本一共一百块。\"],\"note\":\"mǎi yī tào kè běn yī gòng yì bǎi kuài\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0053.mp3\"},{\"vi\":\"Một số ít người không muốn đi.\",\"answer\":\"少数人不愿意去。\",\"hints\":[\"shǎo shù rén bù yuàn yì qù\",\"少数人不愿意去。\"],\"note\":\"shǎo shù rén bù yuàn yì qù\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0054.mp3\"},{\"vi\":\"Rất nhiều người đang xếp hàng.\",\"answer\":\"好多人在排队。\",\"hints\":[\"hǎo duō rén zài pái duì\",\"好多人在排队。\"],\"note\":\"hǎo duō rén zài pái duì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0055.mp3\"},{\"vi\":\"Số người đã vượt quá một trăm.\",\"answer\":\"人数超过了一百。\",\"hints\":[\"rén shù chāo guò le yì bǎi\",\"人数超过了一百。\"],\"note\":\"rén shù chāo guò le yì bǎi\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0056.mp3\"},{\"vi\":\"Hãy đếm xem có bao nhiêu người.\",\"answer\":\"请数一数有多少人。\",\"hints\":[\"qǐng shù yī shù yǒu duō shǎo rén\",\"请数一数有多少人。\"],\"note\":\"qǐng shù yī shù yǒu duō shǎo rén\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0057.mp3\"},{\"vi\":\"Anh ấy đã đọc rất nhiều sách.\",\"answer\":\"他读了大量的书。\",\"hints\":[\"tā dú le dà liàng de shū\",\"他读了大量的书。\"],\"note\":\"tā dú le dà liàng de shū\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0058.mp3\"},{\"vi\":\"Tôi có mười cuốn sách, trong đó ba cuốn là tiểu thuyết.\",\"answer\":\"我有十本书，其中三本是小说。\",\"hints\":[\"wǒ yǒu shí běn shū qí zhōng sān běn shì xiǎo shuō\",\"我有十本书，其中三本是小说。\"],\"note\":\"wǒ yǒu shí běn shū qí zhōng sān běn shì xiǎo shuō\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0059.mp3\"},{\"vi\":\"Quả trứng này nặng năm mươi gam.\",\"answer\":\"这个蛋有五十克。\",\"hints\":[\"zhè ge dàn yǒu wǔ shí kè\",\"这个蛋有五十克。\"],\"note\":\"zhè ge dàn yǒu wǔ shí kè\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0060.mp3\"},{\"vi\":\"Cuốn sách này giá năm đồng bốn hào.\",\"answer\":\"这本书五块四角。\",\"hints\":[\"zhè běn shū wǔ kuài sì jiǎo\",\"这本书五块四角。\"],\"note\":\"zhè běn shū wǔ kuài sì jiǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0061.mp3\"},{\"vi\":\"Tháng sau
