vi\":\"Ăn ít đường thì tốt cho sức khỏe.\",\"answer\":\"少吃糖对身体好。\",\"hints\":[\"shǎo chī táng duì shēn tǐ hǎo\",\"少吃糖对身体好。\"],\"note\":\"shǎo chī táng duì shēn tǐ hǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0166.mp3\"},{\"vi\":\"Hàm lượng đường quá cao.\",\"answer\":\"糖的含量太高。\",\"hints\":[\"táng de hán liàng tài gāo\",\"糖的含量太高。\"],\"note\":\"táng de hán liàng tài gāo\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0388.mp3\"},{\"vi\":\"Loại hoa quả này rất ngọt.\",\"answer\":\"这种水果很甜。\",\"hints\":[\"zhè zhǒng shuǐ guǒ hěn tián\",\"这种水果很甜。\"],\"note\":\"zhè zhǒng shuǐ guǒ hěn tián\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0046.mp3\"},{\"vi\":\"Món canh này hơi ngọt.\",\"answer\":\"这个汤有点儿甜。\",\"hints\":[\"zhè ge tāng yǒu diǎnr tián\",\"这个汤有点儿甜。\"],\"note\":\"zhè ge tāng yǒu diǎnr tián\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0165.mp3\"},{\"vi\":\"Hít thở không khí trong lành tốt cho sức khỏe.\",\"answer\":\"呼吸新鲜空气对身体好。\",\"hints\":[\"hū xī xīn xiān kōng qì duì shēn tǐ hǎo\",\"呼吸新鲜空气对身体好。\"],\"note\":\"hū xī xīn xiān kōng qì duì shēn tǐ hǎo\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0265.mp3\"},{\"vi\":\"Hải sản phải ăn đồ tươi.\",\"answer\":\"水产品要吃新鲜的。\",\"hints\":[\"shuǐ chǎn pǐn yào chī xīn xiān de\",\"水产品要吃新鲜的。\"],\"note\":\"shuǐ chǎn pǐn yào chī xīn xiān de\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0062.mp3\"},{\"vi\":\"Anh ấy nếm thử một miếng, thấy vị khá ngon.\",\"answer\":\"他尝了一口，觉得味道不错。\",\"hints\":[\"tā cháng le yī kǒu jué de wèi dao bù cuò\",\"他尝了一口，觉得味道不错。\"],\"note\":\"tā cháng le yī kǒu jué de wèi dao bù cuò\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0061.mp3\"},{\"vi\":\"Anh ấy đã thử phương pháp mới.\",\"answer\":\"他尝试了新方法。\",\"hints\":[\"tā cháng shì le xīn fāng fǎ\",\"他尝试了新方法。\"],\"note\":\"tā cháng shì le xīn fāng fǎ\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0458.mp3\"},{\"vi\":\"Mặt hồ đã đóng băng.\",\"answer\":\"湖上结了冰。\",\"hints\":[\"hú shàng jié le bīng\",\"湖上结了冰。\"],\"note\":\"hú shàng jié le bīng\",\"audio\":\"audio/hsk-sentences-audio/hsk4-0340.mp3\"},{\"vi\":\"Anh ấy bị trượt chân trên mặt băng.\",\"answer\":\"他在冰上滑了一下。\",\"hints\":[\"tā zài bīng shàng huá le yī xià\",\"他在冰上滑了一下。\"],\"note\":\"tā zài bīng shàng huá le yī xià\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0692.mp3\"},{\"vi\":\"Buổi sáng tôi uống cà phê, buổi tối uống trà xanh.\",\"answer\":\"我早上喝咖啡，晚上喝绿茶。\",\"hints\":[\"wǒ zǎo shang hē kā fēi wǎn shang hē lǜ chá\",\"我早上喝咖啡，晚上喝绿茶。\"],\"note\":\"wǒ zǎo shang hē kā fēi wǎn shang hē lǜ chá\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0162.mp3\"},{\"vi\":\"Hồng trà và cô-ca, bạn muốn cái nào?\",\"answer\":\"红茶和可乐，你要哪个？\",\"hints\":[\"hóng chá hé kě lè nǐ yào nǎ ge\",\"红茶和可乐，你要哪个？\"],\"note\":\"hóng chá hé kě lè nǐ yào nǎ ge\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0169.mp3\"},{\"vi\":\"Cho một cốc trà sữa và một cốc nước hoa quả.\",\"answer\":\"请来一杯奶茶和一杯果汁。\",\"hints\":[\"qǐng lái yī bēi nǎi chá hé yī bēi guǒ zhī\",\"请来一杯奶茶和一杯果汁。\"],\"note\":\"qǐng lái yī bēi nǎi chá hé yī bēi guǒ zhī\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0163.mp3\"},{\"vi\":\"Anh ấy đã uống một cốc bia và một ly rượu vang đỏ.\",\"answer\":\"他喝了一杯啤酒和一杯红酒。\",\"hints\":[\"tā hē le yī bēi pí jiǔ hé yī bēi hóng jiǔ\",\"他喝了一杯啤酒和一杯红酒。\"],\"note\":\"tā hē le yī bēi pí jiǔ hé yī bēi hóng jiǔ\",\"audio\":\"audio/hsk-sentences-audio/hsk3-0167.mp3\"},{\"vi\":\"Anh ấy gọi một suất cơm hộp và một chai đồ uống.\",\"answer\":\"他点了一份盒饭和一瓶饮料。\",\"hints\":[\"tā diǎn le yī fèn hé fàn hé yī píng yǐn liào\",\"他点了一份盒饭和一瓶饮料。\"],\"note\":\"tā diǎn le yī fèn hé fàn hé yī píng yǐn liào\",\"audio\":\"audio/hsk-sentences-audio/hsk5-0049.mp3\"},{\"vi\":\"Đây là nước khoáng thiên nhiên.\",\"answer\":\"这是天然的矿泉水。\",\"hints\":[\"zhè shì tiān rán de kuàng quán shuǐ\",\"这是天然的矿泉水。\"],\"note\":\"zhè shì tiān rán de kuàng quán shuǐ\",\"audio\":\"audio/hsk-sentences-audio/hsk6-0169.mp3\"},{\"vi\":\"Giá của chiếc áo sơ mi này rất hợp lý.\",\"answer\":\"这件衬衫的价格很合理。\",\"hints\":[\"zhè jiàn chèn shān de jià gé hěn hé lǐ\",\"这件衬衫的价格很合理。\"],
