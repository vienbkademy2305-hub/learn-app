",\"answer\":\"你觉得这个电影怎样？\",\"hints\":[\"nǐ jué de zhè ge diàn yǐng zěn yàng\",\"你觉得这个电影怎样？\"],\"note\":\"nǐ jué de zhè ge diàn yǐng zěn yàng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0411.mp3\"},{\"vi\":\"Anh ấy là người như thế nào?\",\"answer\":\"他是什么样的人？\",\"hints\":[\"tā shì shén me yàng de rén\",\"他是什么样的人？\"],\"note\":\"tā shì shén me yàng de rén\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0412.mp3\"},{\"vi\":\"Đừng đi nhanh thế.\",\"answer\":\"别走那么快。\",\"hints\":[\"bié zǒu nà me kuài\",\"别走那么快。\"],\"note\":\"bié zǒu nà me kuài\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0413.mp3\"},{\"vi\":\"Những người khác đều đi cả rồi.\",\"answer\":\"其他人都走了。\",\"hints\":[\"qí tā rén dōu zǒu le\",\"其他人都走了。\"],\"note\":\"qí tā rén dōu zǒu le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0414.mp3\"},{\"vi\":\"Tôi chỉ ăn một chút xíu thôi.\",\"answer\":\"我只吃了一点点。\",\"hints\":[\"wǒ zhǐ chī le yī diǎn diǎn\",\"我只吃了一点点。\"],\"note\":\"wǒ zhǐ chī le yī diǎn diǎn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0415.mp3\"},{\"vi\":\"Hôm nay hơi lạnh một chút.\",\"answer\":\"今天有一点儿冷。\",\"hints\":[\"jīn tiān yǒu yī diǎnr lěng\",\"今天有一点儿冷。\"],\"note\":\"jīn tiān yǒu yī diǎnr lěng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0416.mp3\"},{\"vi\":\"Chưa chắc anh ấy đã đến.\",\"answer\":\"他不一定来。\",\"hints\":[\"tā bù yī dìng lái\",\"他不一定来。\"],\"note\":\"tā bù yī dìng lái\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0417.mp3\"},{\"vi\":\"Không lâu sau, anh ấy đã về nước.\",\"answer\":\"不久以后，他就回国了。\",\"hints\":[\"bù jiǔ yǐ hòu tā jiù huí guó le\",\"不久以后，他就回国了。\"],\"note\":\"bù jiǔ yǐ hòu tā jiù huí guó le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0418.mp3\"},{\"vi\":\"Bạn học tiếng Trung bao lâu rồi?\",\"answer\":\"你学中文多久了？\",\"hints\":[\"nǐ xué zhōng wén duō jiǔ le\",\"你学中文多久了？\"],\"note\":\"nǐ xué zhōng wén duō jiǔ le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0419.mp3\"},{\"vi\":\"Hãy đọc đoạn này.\",\"answer\":\"请读这一段。\",\"hints\":[\"qǐng dú zhè yī duàn\",\"请读这一段。\"],\"note\":\"qǐng dú zhè yī duàn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0420.mp3\"},{\"vi\":\"Anh ấy học trên tôi một lớp.\",\"answer\":\"他比我高一级。\",\"hints\":[\"tā bǐ wǒ gāo yī jí\",\"他比我高一级。\"],\"note\":\"tā bǐ wǒ gāo yī jí\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0421.mp3\"},{\"vi\":\"Uống hai viên thuốc là khỏi thôi.\",\"answer\":\"吃两片药就好了。\",\"hints\":[\"chī liǎng piàn yào jiù hǎo le\",\"吃两片药就好了。\"],\"note\":\"chī liǎng piàn yào jiù hǎo le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0422.mp3\"},{\"vi\":\"Đồng hồ của tôi chậm năm phút.\",\"answer\":\"我的表慢了五分钟。\",\"hints\":[\"wǒ de biǎo màn le wǔ fēn zhōng\",\"我的表慢了五分钟。\"],\"note\":\"wǒ de biǎo màn le wǔ fēn zhōng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0423.mp3\"},{\"vi\":\"Chiếc đồng hồ đeo tay này là bố tặng tôi.\",\"answer\":\"这个手表是爸爸送给我的。\",\"hints\":[\"zhè ge shǒu biǎo shì bà ba sòng gěi wǒ de\",\"这个手表是爸爸送给我的。\"],\"note\":\"zhè ge shǒu biǎo shì bà ba sòng gěi wǒ de\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0424.mp3\"},{\"vi\":\"Từ này có hai âm tiết.\",\"answer\":\"这个词有两个音节。\",\"hints\":[\"zhè ge cí yǒu liǎng gè yīn jié\",\"这个词有两个音节。\"],\"note\":\"zhè ge cí yǒu liǎng gè yīn jié\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0425.mp3\"},{\"vi\":\"Ngôn ngữ phải luyện tập nhiều mới được.\",\"answer\":\"语言要多练才行。\",\"hints\":[\"yǔ yán yào duō liàn cái xíng\",\"语言要多练才行。\"],\"note\":\"yǔ yán yào duō liàn cái xíng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0426.mp3\"},{\"vi\":\"Tác dụng của thuốc này rất lớn.\",\"answer\":\"这个药的作用很大。\",\"hints\":[\"zhè ge yào de zuò yòng hěn dà\",\"这个药的作用很大。\"],\"note\":\"zhè ge yào de zuò yòng hěn dà\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0427.mp3\"},{\"vi\":\"Tôi không hiểu cách làm của bạn.\",\"answer\":\"我不懂你的做法。\",\"hints\":[\"wǒ bù dǒng nǐ de zuò fǎ\",\"我不懂你的做法。\"],\"note\":\"wǒ bù dǒng nǐ de zuò fǎ\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0428.mp3\"},{\"vi\":\"Hành vi của anh ấy khiến người ta khó hiểu.\",\"answer\":\"他的行为让人难懂。\",\"hints\":[\"tā de xíng wéi ràng rén nán dǒng\",\"他的行为让人难懂。\"],\"note\":\"tā de xíng wéi ràng rén nán dǒng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0429.mp3\"},{\"vi\":\"Chúng ta hành động ngay lập tức.\",\"answer\":\"我们马上行动。\",\"hints\":[\"wǒ men mǎ shàng xíng dòng\",\"我们马上行动。\"],\"note\":\"wǒ men mǎ shàng xíng dòng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0430.mp3\"},{\"vi\":\"Ông nội tin Đông y, còn bố thì đi khám Tây y.\",\"answer\":\"爷爷相信中医，爸爸看西医。\",\"hints\":[\"yé ye xiāng xìn zhōng yī bà ba kàn xī yī\",\"爷爷相信中医，爸爸看西医。\"],\"note\":\"yé ye xiāng xìn zhōng yī bà ba kàn xī yī\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0431.mp3\"},{\"vi\":\"Đây là trọng điểm của hôm nay.\",\"answer\":\"这是今天的重点。\",\"hints\":[\"zhè shì jīn tiān de chóng diǎn\",\"这是今天的重点。\"],\"note\":\"zhè shì jīn tiān de chóng diǎn\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0432.mp3\"},{\"vi\":\"Đặc điểm của nơi này là yên tĩnh.\",\"answer\":\"这个地方的特点是安静。\",\"hints\":[\"zhè ge dì fāng de tè diǎn shì ān jìng\",\"这个地方的特点是安静。\"],\"note\":\"zhè ge dì fāng de tè diǎn shì ān jìng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0433.mp3\"},{\"vi\":\"Chúng ta đi sai hướng rồi.\",\"answer\":\"我们走的方向不对。\",\"hints\":[\"wǒ men zǒu de fāng xiàng bù duì\",\"我们走的方向不对。\"],\"note\":\"wǒ men zǒu de fāng xiàng bù duì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0434.mp3\"},{\"vi\":\"Điều anh ấy nói khác với thực tế.\",\"answer\":\"他说的和实际不同。\",\"hints\":[\"tā shuō de hé shí jì bù tóng\",\"他说的和实际不同。\"],\"note\":\"tā shuō de hé shí jì bù tóng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0435.mp3\"},{\"vi\":\"Tên của con phố này rất thú vị.\",\"answer\":\"这条街的名称很有意思。\",\"hints\":[\"zhè tiáo jiē de míng chēng hěn yǒu yì si\",\"这条街的名称很有意思。\"],\"note\":\"zhè tiáo jiē de míng chēng hěn yǒu yì si\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0436.mp3\"},{\"vi\":\"Thẻ của tôi không dùng được nữa.\",\"answer\":\"我的卡不能用了。\",\"hints\":[\"wǒ de kǎ bù néng yòng le\",\"我的卡不能用了。\"],\"note\":\"wǒ de kǎ bù néng yòng le\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0437.mp3\"},{\"vi\":\"Hãy nghe đoạn hội thoại này.\",\"answer\":\"请听这段对话。\",\"hints\":[\"qǐng tīng zhè duàn duì huà\",\"请听这段对话。\"],\"note\":\"qǐng tīng zhè duàn duì huà\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0438.mp3\"},{\"vi\":\"Về mặt ăn uống, anh ấy không coi trọng lắm.\",\"answer\":\"在吃的方面，他不太重视。\",\"hints\":[\"zài chī de fāng miàn tā bù tài zhòng shì\",\"在吃的方面，他不太重视。\"],\"note\":\"zài chī de fāng miàn tā bù tài zhòng shì\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0439.mp3\"},{\"vi\":\"Làm giáo viên là ước mơ của tôi.\",\"answer\":\"当老师是我的理想。\",\"hints\":[\"dāng lǎo shī shì wǒ de lǐ xiǎng\",\"当老师是我的理想。\"],\"note\":\"dāng lǎo shī shì wǒ de lǐ xiǎng\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0440.mp3\"},{\"vi\":\"Đỏ, vàng, đen, bạn thích màu nào?\",\"answer\":\"红色、黄色、黑色，你喜欢哪个颜色？\",\"hints\":[\"hóng sè huáng sè hēi sè nǐ xǐ huan nǎ ge yán sè\",\"红色、黄色、黑色，你喜欢哪个颜色？\"],\"note\":\"hóng sè huáng sè hēi sè nǐ xǐ huan nǎ ge yán sè\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0441.mp3\"},{\"vi\":\"Vấn đề nhà ở rất quan trọng.\",\"answer\":\"住房问题很重要。\",\"hints\":[\"zhù fáng wèn tí hěn zhòng yào\",\"住房问题很重要。\"],\"note\":\"zhù fáng wèn tí hěn zhòng yào\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0481.mp3\"},{\"vi\":\"Nhật báo phát hành buổi sáng, báo chiều phát hành buổi chiều.\",\"answer\":\"日报是早上出的，晚报是下午出的。\",\"hints\":[\"rì bào shì zǎo shang chū de wǎn bào shì xià wǔ chū de\",\"日报是早上出的，晚报是下午出的。\"],\"note\":\"rì bào shì zǎo shang chū de wǎn bào shì xià wǔ chū de\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0486.mp3\"},{\"vi\":\"Cuốn sách này bằng tiếng Anh.\",\"answer\":\"这本书是英文的。\",\"hints\":[\"zhè běn shū shì yīng wén de\",\"这本书是英文的。\"],\"note\":\"zhè běn shū shì yīng wén de\",\"audio\":\"audio/hsk-sentences-audio/hsk2-0494.mp3\"}]}]]}],\"$L1b\",\"$L1c\"],\"$L1d\"]}]\n1b:[\"$\",\"section\",null,{\"className\":\"space-y-3 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\
