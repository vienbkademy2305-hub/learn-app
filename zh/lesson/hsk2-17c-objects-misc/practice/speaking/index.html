entence\",\"key\":\"sentence:hsk2-0421\",\"hanzi\":\"他比我高一级。\",\"pinyin\":\"tā bǐ wǒ gāo yī jí\",\"vi\":\"Anh ấy học trên tôi một lớp.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0421.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0421_slow.mp3\"},\"audioMs\":{\"normal\":1344,\"slow\":1752}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0422\",\"hanzi\":\"吃两片药就好了。\",\"pinyin\":\"chī liǎng piàn yào jiù hǎo le\",\"vi\":\"Uống hai viên thuốc là khỏi thôi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0422.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0422_slow.mp3\"},\"audioMs\":{\"normal\":1224,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0423\",\"hanzi\":\"我的表慢了五分钟。\",\"pinyin\":\"wǒ de biǎo màn le wǔ fēn zhōng\",\"vi\":\"Đồng hồ của tôi chậm năm phút.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0423.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0423_slow.mp3\"},\"audioMs\":{\"normal\":1704,\"slow\":2160}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0424\",\"hanzi\":\"这个手表是爸爸送给我的。\",\"pinyin\":\"zhè ge shǒu biǎo shì bà ba sòng gěi wǒ de\",\"vi\":\"Chiếc đồng hồ đeo tay này là bố tặng tôi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0424.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0424_slow.mp3\"},\"audioMs\":{\"normal\":2208,\"slow\":2856}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0425\",\"hanzi\":\"这个词有两个音节。\",\"pinyin\":\"zhè ge cí yǒu liǎng gè yīn jié\",\"vi\":\"Từ này có hai âm tiết.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0425.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0425_slow.mp3\"},\"audioMs\":{\"normal\":2136,\"slow\":2544}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0426\",\"hanzi\":\"语言要多练才行。\",\"pinyin\":\"yǔ yán yào duō liàn cái xíng\",\"vi\":\"Ngôn ngữ phải luyện tập nhiều mới được.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0426.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0426_slow.mp3\"},\"audioMs\":{\"normal\":1944,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0427\",\"hanzi\":\"这个药的作用很大。\",\"pinyin\":\"zhè ge yào de zuò yòng hěn dà\",\"vi\":\"Tác dụng của thuốc này rất lớn.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0427.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0427_slow.mp3\"},\"audioMs\":{\"normal\":1536,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0428\",\"hanzi\":\"我不懂你的做法。\",\"pinyin\":\"wǒ bù dǒng nǐ de zuò fǎ\",\"vi\":\"Tôi không hiểu cách làm của bạn.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0428.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0428_slow.mp3\"},\"audioMs\":{\"normal\":1248,\"slow\":1752}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0429\",\"hanzi\":\"他的行为让人难懂。\",\"pinyin\":\"tā de xíng wéi ràng rén nán dǒng\",\"vi\":\"Hành vi của anh ấy khiến người ta khó hiểu.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0429.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0429_slow.mp3\"},\"audioMs\":{\"normal\":1776,\"slow\":2304}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0430\",\"hanzi\":\"我们马上行动。\",\"pinyin\":\"wǒ men mǎ shàng xíng dòng\",\"vi\":\"Chúng ta hành động ngay lập tức.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0430.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0430_slow.mp3\"},\"audioMs\":{\"normal\":1416,\"slow\":1464}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0431\",\"hanzi\":\"爷爷相信中医，爸爸看西医。\",\"pinyin\":\"yé ye xiāng xìn zhōng yī bà ba kàn xī yī\",\"vi\":\"Ông nội tin Đông y, còn bố thì đi khám Tây y.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0431.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0431_slow.mp3\"},\"audioMs\":{\"normal\":3864,\"slow\":2952}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0432\",\"hanzi\":\"这是今天的重点。\",\"pinyin\":\"zhè shì jīn tiān de chóng diǎn\",\"vi\":\"Đây là trọng điểm của hôm nay.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0432.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0432_slow.mp3\"},\"audioMs\":{\"normal\":1176,\"slow\":1848}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0433\",\"hanzi\":\"这个地方的特点是安静。\",\"pinyin\":\"zhè ge dì fāng de tè diǎn shì ān jìng\",\"vi\":\"Đặc điểm của nơi này là yên tĩnh.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0433.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0433_slow.mp3\"},\"audioMs\":{\"normal\":1968,\"slow\":2208}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0434\",\"hanzi\":\"我们走的方向不对。\",\"pinyin\":\"wǒ men zǒu de fāng xiàng bù duì\",\"vi\":\"Chúng ta đi sai hướng rồi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0434.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0434_slow.mp3\"},\"audioMs\":{\"normal\":1824,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0435\",\"hanzi\":\"他说的和实际不同。\",\"pinyin\":\"tā shuō de hé shí jì bù tóng\",\"vi\":\"Điều anh ấy nói khác với thực tế.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0435.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0435_slow.mp3\"},\"audioMs\":{\"normal\":2184,\"slow\":2856}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0436\",\"hanzi\":\"这条街的名称很有意思。\",\"pinyin\":\"zhè tiáo jiē de míng chēng hěn yǒu yì si\",\"vi\":\"Tên của con phố này rất thú vị.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0436.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0436_slow.mp3\"},\"audioMs\":{\"normal\":1896,\"slow\":2544}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0437\",\"hanzi\":\"我的卡不能用了。\",\"pinyin\":\"wǒ de kǎ bù néng yòng le\",\"vi\":\"Thẻ của tôi không dùng được nữa.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0437.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0437_slow.mp3\"},\"audioMs\":{\"normal\":1416,\"slow\":1824}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0438\",\"hanzi\":\"请听这段对话。\",\"pinyin\":\"qǐng tīng zhè duàn duì huà\",\"vi\":\"Hãy nghe đoạn hội thoại này.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0438.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0438_slow.mp3\"},\"audioMs\":{\"normal\":1728,\"slow\":1656}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0439\",\"hanzi\":\"在吃的方面，他不太重视。\",\"pinyin\":\"zài chī de fāng miàn tā bù tài zhòng shì\",\"vi\":\"Về mặt ăn uống, anh ấy không coi trọng lắm.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0439.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0439_slow.mp3\"},\"audioMs\":{\"normal\":2208,\"slow\":3552}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0440\",\"hanzi\":\"当老师是我的理想。\",\"pinyin\":\"dāng lǎo shī shì wǒ de lǐ xiǎng\",\"vi\":\"Làm giáo viên là ước mơ của tôi.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0440.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0440_slow.mp3\"},\"audioMs\":{\"normal\":1368,\"slow\":2016}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0441\",\"hanzi\":\"红色、黄色、黑色，你喜欢哪个颜色？\",\"pinyin\":\"hóng sè huáng sè hēi sè nǐ xǐ huan nǎ ge yán sè\",\"vi\":\"Đỏ, vàng, đen, bạn thích màu nào?\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0441.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0441_slow.mp3\"},\"audioMs\":{\"normal\":3648,\"slow\":4152}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0481\",\"hanzi\":\"住房问题很重要。\",\"pinyin\":\"zhù fáng wèn tí hěn zhòng yào\",\"vi\":\"Vấn đề nhà ở rất quan trọng.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0481.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0481_slow.mp3\"},\"audioMs\":{\"normal\":1608,\"slow\":1848}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0486\",\"hanzi\":\"日报是早上出的，晚报是下午出的。\",\"pinyin\":\"rì bào shì zǎo shang chū de wǎn bào shì xià wǔ chū de\",\"vi\":\"Nhật báo phát hành buổi sáng, báo chiều phát hành buổi chiều.\",\"audio\":{\"normal\":\"audio/hsk-sentences-audio/hsk2-0486.mp3\",\"slow\":\"audio/hsk-sentences-audio/hsk2-0486_slow.mp3\"},\"audioMs\":{\"normal\":3144,\"slow\":3912}},{\"kind\":\"sentence\",\"key\":\"sentence:hsk2-0494\",\"hanzi\":\"这本书是英文的。\",\"pinyin\":\"zhè běn shū shì yīng wén de\",\
