nyin\":\"jīn tiān zǎo shàng qī diǎn xià le yǔ, hòu lái yǔ jiù tíng le.\"},{\"text\":\"下午我要回家，可是我的伞不见了。\",\"vi\":\"Chiều thầy định về nhà, nhưng ô của thầy không thấy đâu.\",\"pinyin\":\"xià wǔ wǒ yào huí jiā, kě shì wǒ de sǎn bú jiàn le.\"}],\"checks\":[{\"claim_vi\":\"Ô của thầy màu xanh.\",\"answer\":true,\"explain_vi\":\"Đúng: “我的伞是蓝色的”.\"},{\"claim_vi\":\"Sáng nay không mưa.\",\"answer\":false,\"explain_vi\":\"Sai: bảy giờ trời có mưa.\"}],\"name_pinyin\":\"lǐ lǎo shī\",\"role_pinyin\":\"lǎo shī\"},{\"id\":\"tongxue\",\"name\":\"王明\",\"role\":\"同学\",\"avatar\":\"🧒\",\"segments\":[{\"text\":\"我八点到教室，教室里有五六个同学。\",\"vi\":\"Tám giờ mình đến lớp, trong lớp có năm sáu bạn.\",\"pinyin\":\"wǒ bā diǎn dào jiào shì, jiào shì lǐ yǒu wǔ liù gè tóng xué.\"},{\"text\":\"早上我看见小红拿着一把很湿的雨伞进教室。\",\"vi\":\"Sáng nay mình thấy Tiểu Hồng cầm một chiếc ô rất ướt vào lớp.\",\"clues\":[\"wet-umbrella\"],\"focus\":[\"很湿\",\"进教室\"],\"pinyin\":\"zǎo shàng wǒ kàn jiàn xiǎo hóng ná zhe yì bǎ hěn shī de yǔ sǎn jìn jiào shì.\"}],\"checks\":[{\"claim_vi\":\"Vương Minh thấy Tiểu Hồng cầm ô ướt.\",\"answer\":true,\"explain_vi\":\"Đúng: “拿着一把很湿的雨伞”.\"},{\"claim_vi\":\"Vương Minh đến lớp lúc bảy giờ.\",\"answer\":false,\"explain_vi\":\"Sai: bạn đến lúc tám giờ.\"}],\"name_pinyin\":\"wáng míng\",\"role_pinyin\":\"tóng xué\"},{\"id\":\"xiaohong\",\"name\":\"小红\",\"role\":\"同学\",\"avatar\":\"👧\",\"segments\":[{\"text\":\"今天早上没有下雨，所以我没有带伞。\",\"vi\":\"Sáng nay trời không mưa nên mình không mang ô.\",\"clues\":[\"no-rain\"],\"focus\":[\"没有下雨\",\"没有带伞\"],\"pinyin\":\"jīn tiān zǎo shàng méi yǒu xià yǔ, suǒ yǐ wǒ méi yǒu dài sǎn.\"},{\"text\":\"我没有拿老师的伞，我下午就回家了。\",\"vi\":\"Mình không lấy ô của thầy, buổi chiều mình về nhà luôn.\",\"pinyin\":\"wǒ méi yǒu ná lǎo shī de sǎn, wǒ xià wǔ jiù huí jiā le.\"}],\"checks\":[{\"claim_vi\":\"Tiểu Hồng nói mình không mang ô.\",\"answer\":true,\"explain_vi\":\"Đúng: “我没有带伞”.\"},{\"claim_vi\":\"Tiểu Hồng nói sáng nay trời mưa.\",\"answer\":false,\"explain_vi\":\"Sai: cô nó
