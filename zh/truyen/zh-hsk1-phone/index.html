。\",\"vi\":\"Bốn giờ mẹ đi cửa hàng mua đồ, bốn giờ rưỡi mẹ về nhà.\",\"clues\":[\"shop\"],\"pinyin\":\"wǒ sì diǎn qù shāng diàn mǎi dōng xī, sì diǎn bàn huí jiā.\"},{\"text\":\"我看见小明的书包在桌子旁边，可是手机不在桌子上了。小明不在家。\",\"vi\":\"Mẹ thấy cặp sách của Tiểu Minh ở cạnh bàn, nhưng điện thoại không còn trên bàn. Tiểu Minh không có nhà.\",\"clues\":[\"bag-home\"],\"focus\":[\"书包\",\"旁边\"],\"pinyin\":\"wǒ kàn jiàn xiǎo míng de shū bāo zài zhuō zi páng biān, kě shì shǒu jī bú zài zhuō zi shàng le. xiǎo míng bú zài jiā.\"}],\"checks\":[{\"claim_vi\":\"Ba giờ điện thoại ở trên bàn.\",\"answer\":true,\"explain_vi\":\"Đúng: “爸爸的手机在桌子上。”\"},{\"claim_vi\":\"Mẹ ở nhà cả buổi chiều.\",\"answer\":false,\"explain_vi\":\"Sai: bốn giờ mẹ đi cửa hàng.\"},{\"claim_vi\":\"Mẹ thấy cặp của Tiểu Minh ở cạnh bàn.\",\"answer\":true,\"explain_vi\":\"Đúng: “小明的书包在桌子旁边。”\"}],\"name_pinyin\":\"xiǎo míng de mā ma\",\"role_pinyin\":\"mā ma\"},{\"id\":\"wang\",\"name\":\"王老师\",\"role\":\"老师\",\"avatar\":\"🧑‍🏫\",\"segments\":[{\"text\":\"我是小明的老师。今天下午没有课，学生们两点就回家了。\",\"vi\":\"Tôi là thầy giáo của Tiểu Minh. Chiều nay không có tiết, học sinh về nhà từ hai giờ.\",\"clues\":[\"no-class\"],\"focus\":[\"没有课\",\"回家\"],\"pinyin\":\"wǒ shì xiǎo míng de lǎo shī. jīn tiān xià wǔ méi yǒu kè, xué shēng men liǎng diǎn jiù huí jiā le.\"},{\"text\":\"学校三点就关门了，学校里没有人。\",\"vi\":\"Ba giờ trường đã đóng cửa, trong trường không có ai.\",\"pinyin\":\"xué xiào sān diǎn jiù guān mén le, xué xiào lǐ méi yǒu rén.\"},{\"text\":\"小明是好学生，我很喜欢他。\",\"vi\":\"Tiểu Minh là học sinh ngoan, tôi rất quý cậu ấy.\",\"pinyin\":\"xiǎo míng shì hào xué shēng, wǒ hěn xǐ huan tā.\"}],\"checks\":[{\"claim_vi\":\"Chiều nay có tiết học.\",\"answer\":false,\"explain_vi\":\"Sai: “今天下午没有课。”\"},{\"claim_vi\":\"Học sinh về nhà lúc hai giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “学生们两点就回家了。”\"},{\"claim_vi\":\"Ba giờ trường vẫn còn mở cửa.\",\"answer\":false,\"explain_vi\":\"Sai: “学校三点就关门了。”\"}],\"name_pinyin\":\"wáng lǎo shī\",\"role_pinyin\":\"lǎo shī\"},{\"id\":\"xiaoming\",\"name\":\"小明\",\"role\":\"儿子\",\"avatar\":\"🎒\",\"segments\":[{\"text\":\"今天下午我在学校学习，五点才回家。\",\"vi\":\"Chiều nay con học ở trường, năm giờ mới về nhà.\",\"focus\":[\"在学校\",\"五点才回家\"],\"pinyin\":\"jīn tiān xià wǔ wǒ zài xué xiào xué xí, wǔ diǎn cái huí jiā.\"},{\"text\":\"我没有看见爸爸的手机。我不在家。\",\"vi\":\"Con không thấy điện thoại của bố. Con không ở nhà.\",\"pinyin\":\"wǒ méi yǒu kàn jiàn bà ba de shǒu jī. wǒ bú zài jiā.\"},{\"text\":\"我也有手机，我不要爸爸的手机。\",\"vi\":\"Con cũng có điện thoại, con không cần điện thoại của bố.\",\"pinyin\":\"wǒ yě yǒu shǒu jī, wǒ bú yào bà ba de shǒu jī.\"}],\"checks\":[{\"claim_vi\":\"Tiểu Minh nói cậu học ở trường buổi chiều.\",\"answer\":true,\"explain_vi\":\"Đúng: “我在学校学习。”\"},{\"claim_vi\":\"Tiểu Minh nói cậu về nhà lúc hai giờ.\",\"answer\":false,\"explain_vi\":\"Sai: cậu nói năm giờ mới về.\"},{\"claim_vi\":\"Tiểu Minh nói cậu cần điện thoại của bố.\",\"answer\":false,\"explain_vi\":\"Sai: “我不要爸爸的手机。”\"}],\"name_pinyin\":\"xiǎo míng\",\"role_pinyin\":\"ér zi\"}],\"solution\":{\"culprit\":\"xiaoming\",\"evidence\":[\"no-class\",\"bag-home\"],\"explain_vi\":\"Tiểu Minh nói cậu ở trường đến năm giờ. Nhưng thầy Vương nói chiều nay không có tiết và học sinh về từ hai giờ, còn mẹ thấy cặp của cậu ở cạnh bàn lúc bốn giờ rưỡi.\",\"confession\":\"对不起，爸爸。我想玩游戏，所以拿了你的手机。我现在还给你。\",\"confession_vi\":\"Con xin lỗi bố. Con muốn chơi game nên đã lấy điện thoại của bố. Bây giờ con trả bố.\",\"confession_pinyin\":\"duì bù qǐ, bà bà. wǒ xiǎng wán yóu xì, suǒ yǐ ná le nǐ de shǒu jī. wǒ xiàn zài hái gěi nǐ.\"},\"lang\":\"zh\"}}]\n12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n17:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"Ic
