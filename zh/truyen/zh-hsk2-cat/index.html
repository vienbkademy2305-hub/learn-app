a, giày của em trai cũng không còn ở cửa.\",\"clues\":[\"shoes-gone\"],\"focus\":[\"门响\",\"不在门口\"],\"pinyin\":\"qī diǎn de shí hòu, wǒ tīng jiàn mén xiǎng, dì di de xié yě bú zài mén kǒu le.\"},{\"text\":\"我在洗澡，没有出去看。\",\"vi\":\"Chị đang tắm, không ra xem.\",\"pinyin\":\"wǒ zài xǐ zǎo, méi yǒu chū qù kàn.\"}],\"checks\":[{\"claim_vi\":\"Chị nghe tiếng cửa lúc bảy giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “我听见门响”.\"},{\"claim_vi\":\"Chị thấy giày của em trai vẫn ở cửa.\",\"answer\":false,\"explain_vi\":\"Sai: giày của em trai không còn ở cửa.\"}],\"name_pinyin\":\"jiě jie\",\"role_pinyin\":\"jiě jie\"},{\"id\":\"didi\",\"name\":\"弟弟\",\"role\":\"弟弟\",\"avatar\":\"👦\",\"segments\":[{\"text\":\"我七点还在睡觉，我没有出门。\",\"vi\":\"Bảy giờ em còn đang ngủ, em không ra khỏi nhà.\",\"clues\":[\"sleeping\"],\"focus\":[\"还在睡觉\",\"没有出门\"],\"pinyin\":\"wǒ qī diǎn hái zài shuì jiào, wǒ méi yǒu chū mén.\"},{\"text\":\"我不知道猫去哪儿了。\",\"vi\":\"Em không biết con mèo đi đâu.\",\"pinyin\":\"wǒ bù zhī dào māo qù nǎ ér le.\"}],\"checks\":[{\"claim_vi\":\"Em trai nói bảy giờ mình còn đang ngủ.\",\"answer\":true,\"explain_vi\":\"Đúng: “我七点还在睡觉”.\"},{\"claim_vi\":\"Em trai nói chính mình đã mở cửa.\",\"answer\":false,\"explain_vi\":\"Sai: em nói “我没有出门”.\"}],\"name_pinyin\":\"dì di\",\"role_pinyin\":\"dì di\"},{\"id\":\"baba\",\"name\":\"爸爸\",\"role\":\"爸爸\",\"avatar\":\"👨\",\"segments\":[{\"text\":\"昨天晚上我看见猫在椅子上睡觉。\",\"vi\":\"Tối qua bố thấy con mèo ngủ ở trên ghế.\",\"clues\":[\"cat-night\"],\"pinyin\":\"zuó tiān wǎn shàng wǒ kàn jiàn māo zài yǐ zi shàng shuì jiào.\"},{\"text\":\"七点半，我下楼的时候，门是开着的。\",\"vi\":\"Bảy giờ rưỡi, lúc bố xuống lầu, cửa đang mở.\",\"clues\":[\"door-open\"],\"focus\":[\"下楼\",\"开着\"],\"pinyin\":\"qī diǎn bàn, wǒ xià lóu de shí hòu, mén shì kāi zhe de.\"}],\"checks\":[{\"claim_vi\":\"Tối qua bố thấy mèo ở trên ghế.\",\"answer\":true,\"explain_vi\":\"Đúng: “猫在椅子上睡觉”.\"},{\"claim_vi\":\"Bảy giờ rưỡi cửa nhà đang đóng.\",\"answer\":false,\"explain_vi\":\"Sai: cửa “是开着的”.\"}],\
