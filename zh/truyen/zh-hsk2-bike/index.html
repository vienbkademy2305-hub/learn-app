门口\",\"没有了\"],\"pinyin\":\"wǒ zài gōng sī mén kǒu gōng zuò. xià wǔ liù diǎn, wǒ kàn jiàn zì xíng chē méi yǒu le.\"},{\"text\":\"地上有一把车锁，车锁被剪开了。\",\"vi\":\"Dưới đất có một ổ khóa xe, ổ khóa bị cắt.\",\"clues\":[\"lock-cut\"],\"pinyin\":\"dì shàng yǒu yì bǎ chē suǒ, chē suǒ bèi jiǎn kāi le.\"},{\"text\":\"今天因为下大雨，公共汽车六点不开，六点半才有车。\",\"vi\":\"Hôm nay vì mưa lớn, xe buýt sáu giờ không chạy, sáu giờ rưỡi mới có xe.\",\"clues\":[\"bus-stopped\"],\"focus\":[\"因为\",\"六点半才有车\"],\"pinyin\":\"jīn tiān yīn wèi xià dà yǔ, gōng gòng qì chē liù diǎn bù kāi, liù diǎn bàn cái yǒu chē.\"}],\"checks\":[{\"claim_vi\":\"Bảo vệ làm việc ở cổng công ty.\",\"answer\":true,\"explain_vi\":\"Đúng: “我在公司门口工作。”\"},{\"claim_vi\":\"Ổ khóa xe được mở bằng chìa.\",\"answer\":false,\"explain_vi\":\"Sai: “车锁被剪开了。”\"},{\"claim_vi\":\"Hôm nay xe buýt sáu giờ vẫn chạy.\",\"answer\":false,\"explain_vi\":\"Sai: sáu giờ không chạy, sáu giờ rưỡi mới có xe.\"}],\"name_pinyin\":\"bǎo ān\",\"role_pinyin\":\"gōng sī de bǎo ān\"},{\"id\":\"xiaozhang\",\"name\":\"小张\",\"role\":\"自行车的主人\",\"avatar\":\"🧑‍💼\",\"segments\":[{\"text\":\"我今天工作到六点。我的自行车在公司门口。\",\"vi\":\"Hôm nay tôi làm việc đến sáu giờ. Xe đạp của tôi để ở cổng công ty.\",\"clues\":[\"work-late\"],\"pinyin\":\"wǒ jīn tiān gōng zuò dào liù diǎn. wǒ de zì xíng chē zài gōng sī mén kǒu.\"},{\"text\":\"六点我从窗户看出去，看见小李站在我的自行车旁边，手里有一把剪刀。\",\"vi\":\"Sáu giờ tôi nhìn ra từ cửa sổ, thấy tiểu Lý đứng cạnh xe đạp của tôi, trong tay có một cái kìm.\",\"clues\":[\"scissors\"],\"focus\":[\"窗户\",\"剪刀\"],\"pinyin\":\"liù diǎn wǒ cóng chuāng hù kàn chū qù, kàn jiàn xiǎo lǐ zhàn zài wǒ de zì xíng chē páng biān, shǒu lǐ yǒu yì bǎ jiǎn dāo.\"},{\"text\":\"我以为他是工人，所以没有下楼。现在我觉得很后悔。\",\"vi\":\"Tôi tưởng anh ta là thợ nên không xuống lầu. Bây giờ tôi thấy rất hối hận.\",\"pinyin\":\"wǒ yǐ wéi tā shì gōng rén, suǒ yǐ méi yǒu xià lóu. xiàn zài wǒ jué de hěn hòu huǐ.\"}],\"checks\":[{\"claim_vi\":\"Tiểu Trương làm việc đến sáu giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “我今天工作到六点。”\"},{\"claim_vi\":\"Tiểu Trương thấy tiểu Lý cầm một cái kìm.\",\"answer\":true,\"explain_vi\":\"Đúng: “手里有一把剪刀。”\"},{\"claim_vi\":\"Tiểu Trương xuống lầu ngay khi thấy tiểu Lý.\",\"answer\":false,\"explain_vi\":\"Sai: “所以没有下楼。”\"}],\"name_pinyin\":\"xiǎo zhāng\",\"role_pinyin\":\"zì xíng chē de zhǔ rén\"},{\"id\":\"xiaoli\",\"name\":\"小李\",\"role\":\"同事\",\"avatar\":\"🧢\",\"segments\":[{\"text\":\"我今天六点下班，坐公共汽车回家。\",\"vi\":\"Hôm nay tôi tan làm lúc sáu giờ, đi xe buýt về nhà.\",\"focus\":[\"下班\",\"公共汽车\"],\"pinyin\":\"wǒ jīn tiān liù diǎn xià bān, zuò gōng gòng qì chē huí jiā.\"},{\"text\":\"我没有去过自行车旁边。我不知道那是谁的车。\",\"vi\":\"Tôi chưa hề đến gần chiếc xe đạp. Tôi không biết đó là xe của ai.\",\"pinyin\":\"wǒ méi yǒu qù guò zì xíng chē páng biān. wǒ bù zhī dào nà shì shuí de chē.\"},{\"text\":\"我没有剪刀。我的包里只有书。\",\"vi\":\"Tôi không có kìm. Trong túi tôi chỉ có sách.\",\"pinyin\":\"wǒ méi yǒu jiǎn dāo. wǒ de bāo lǐ zhǐ yǒu shū.\"}],\"checks\":[{\"claim_vi\":\"Tiểu Lý nói anh đi xe buýt về nhà.\",\"answer\":true,\"explain_vi\":\"Đúng: “坐公共汽车回家。”\"},{\"claim_vi\":\"Tiểu Lý nói anh có một cái kìm.\",\"answer\":false,\"explain_vi\":\"Sai: “我没有剪刀。”\"},{\"claim_vi\":\"Tiểu Lý nói anh biết chiếc xe là của ai.\",\"answer\":false,\"explain_vi\":\"Sai: “我不知道那是谁的车。”\"}],\"name_pinyin\":\"xiǎo lǐ\",\"role_pinyin\":\"tóng shì\"}],\"solution\":{\"culprit\":\"xiaoli\",\"evidence\":[\"bus-stopped\",\"scissors\"],\"explain_vi\":\"Tiểu Lý nói anh đi xe buýt lúc sáu giờ. Nhưng hôm đó vì mưa lớn xe buýt đến sáu giờ rưỡi mới chạy, và tiểu Trương thấy anh đứng cạnh xe đạp với một cái kìm lúc sáu giờ.\",\"confession\":\"对不起。我今天要早点回家，可是没有车。我看见一辆自行车，就用剪刀剪开了车锁。明天我还给你。\",\"confession_vi\":\"Xin lỗi. Hôm nay tôi cần về nhà sớm mà không có xe. Tôi thấy một chiếc xe đạp nên đã dùng kìm cắt ổ khóa. Ngày mai tôi sẽ trả lại bạn.\",\"confession_pinyin\":\"duì bù qǐ. wǒ jīn tiān yào zǎo diǎn huí jiā, kě shì méi yǒu chē. wǒ kàn jiàn yí liàng zì xíng chē, jiù yòng jiǎn dāo jiǎn kāi le chē suǒ. míng tiān wǒ
