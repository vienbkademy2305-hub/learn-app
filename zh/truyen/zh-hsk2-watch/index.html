 ông đi tắm.\",\"clues\":[\"watch-eight\"],\"pinyin\":\"bā diǎn de shí hòu, shǒu biǎo zài zhuō zi shàng, wǒ qù xǐ zǎo le.\"},{\"text\":\"我洗澡洗了半个小时。\",\"vi\":\"Ông tắm nửa tiếng.\",\"clues\":[\"bath\"],\"focus\":[\"半个小时\"],\"pinyin\":\"wǒ xǐ zǎo xǐ le bàn gè xiǎo shí.\"}],\"checks\":[{\"claim_vi\":\"Ông để đồng hồ trên bàn lúc tám giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “手表在桌子上”.\"},{\"claim_vi\":\"Ông tắm một tiếng rưỡi.\",\"answer\":false,\"explain_vi\":\"Sai: ông tắm “半个小时” (nửa tiếng).\"}],\"name_pinyin\":\"yé ye\",\"role_pinyin\":\"yé ye\"},{\"id\":\"jiejie\",\"name\":\"姐姐\",\"role\":\"姐姐\",\"avatar\":\"👩\",\"segments\":[{\"text\":\"九点的时候，我看见哥哥的手上有一块手表。\",\"vi\":\"Lúc chín giờ, chị thấy trên tay anh trai có một chiếc đồng hồ.\",\"clues\":[\"saw-watch\"],\"focus\":[\"手上\",\"一块手表\"],\"pinyin\":\"jiǔ diǎn de shí hòu, wǒ kàn jiàn gē ge de shǒu shàng yǒu yí kuài shǒu biǎo.\"},{\"text\":\"我不知道那是不是爷爷的手表。\",\"vi\":\"Chị không biết đó có phải đồng hồ của ông không.\",\"pinyin\":\"wǒ bù zhī dào nà shì bu shì yé ye de shǒu biǎo.\"}],\"checks\":[{\"claim_vi\":\"Chị thấy một chiếc đồng hồ trên tay anh trai.\",\"answer\":true,\"explain_vi\":\"Đúng: “哥哥的手上有一块手表”.\"},{\"claim_vi\":\"Chị chắc chắn đó là đồng hồ của ông.\",\"answer\":false,\"explain_vi\":\"Sai: chị nói “我不知道”.\"}],\"name_pinyin\":\"jiě jie\",\"role_pinyin\":\"jiě jie\"},{\"id\":\"gege\",\"name\":\"哥哥\",\"role\":\"哥哥\",\"avatar\":\"👦\",\"segments\":[{\"text\":\"我没有用过手表，我也没有进爷爷的房间。\",\"vi\":\"Anh chưa từng dùng đồng hồ, anh cũng không vào phòng ông.\",\"clues\":[\"never-used\"],\"focus\":[\"没有用过\",\"没有进\"],\"pinyin\":\"wǒ méi yǒu yòng guò shǒu biǎo, wǒ yě méi yǒu jìn yé ye de fáng jiān.\"},{\"text\":\"九点的时候，我在家里写作业。\",\"vi\":\"Lúc chín giờ, anh ở nhà làm bài tập.\",\"pinyin\":\"jiǔ diǎn de shí hòu, wǒ zài jiā lǐ xiě zuò yè.\"}],\"checks\":[{\"claim_vi\":\"Anh trai nói mình chưa từng dùng đồng hồ.\",\"answer\":true,\"explain_vi\":\"Đúng: “我没有用过手表”.\"},{\"claim_vi\":\"Anh trai nói lúc chín giờ mình đã ra ngoài.
