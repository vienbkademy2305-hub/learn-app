rd\",\"text\":\"fresh air\",\"vi\":\"không khí trong lành\",\"extra\":\"/ˌfreʃ ˈeər/\"},{\"group\":\"word\",\"text\":\"countryside\",\"vi\":\"vùng nông thôn; miền quê\",\"extra\":\"/ˈkʌn.tri.saɪd/\"},{\"group\":\"word\",\"text\":\"green space\",\"vi\":\"không gian xanh (công viên, vườn cây trong thành phố)\",\"extra\":\"/ˌɡriːn ˈspeɪs/\"},{\"group\":\"word\",\"text\":\"peaceful\",\"vi\":\"yên bình; thanh bình\",\"extra\":\"/ˈpiːs.fəl/\"},{\"group\":\"word\",\"text\":\"noisy\",\"vi\":\"ồn ào\",\"extra\":\"/ˈnɔɪ.zi/\"},{\"group\":\"word\",\"text\":\"polluted\",\"vi\":\"bị ô nhiễm\",\"extra\":\"/pəˈluː.tɪd/\"},{\"group\":\"word\",\"text\":\"traffic jam\",\"vi\":\"tắc đường\",\"extra\":\"/ˈtræf.ɪk ˌdʒæm/\"},{\"group\":\"word\",\"text\":\"outdoor\",\"vi\":\"ngoài trời\",\"extra\":\"/ˈaʊt.dɔː/\"},{\"group\":\"word\",\"text\":\"go for a walk\",\"vi\":\"đi dạo\",\"extra\":\"/ɡəʊ fər ə ˈwɔːk/\"},{\"group\":\"word\",\"text\":\"plant\",\"vi\":\"trồng (cây)\",\"extra\":\"/plɑːnt/\"},{\"group\":\"word\",\"text\":\"keen on\",\"vi\":\"thích; say mê\",\"extra\":\"/ˈkiːn ɒn/\"},{\"group\":\"word\",\"text\":\"interested in\",\"vi\":\"quan tâm; thích thú (cái gì)\",\"extra\":\"/ˈɪn.trəs.tɪd ɪn/\"},{\"group\":\"word\",\"text\":\"prefer\",\"vi\":\"thích hơn\",\"extra\":\"/prɪˈfɜːr/\"},{\"group\":\"word\",\"text\":\"would rather\",\"vi\":\"thà… còn hơn; muốn … hơn\",\"extra\":\"/wʊd ˈrɑː.ðər/\"},{\"group\":\"sentence\",\"text\":\"I prefer walking in the park to staying at home.\",\"vi\":\"Tôi thích đi bộ trong công viên hơn là ở nhà.\"},{\"group\":\"sentence\",\"text\":\"I'm really keen on outdoor activities like cycling and camping.\",\"vi\":\"Tôi rất mê các hoạt động ngoài trời như đạp xe và cắm trại.\"},{\"group\":\"sentence\",\"text\":\"I would rather live in the countryside than in a big city.\",\"vi\":\"Tôi thà sống ở nông thôn còn hơn ở thành phố lớn.\"},{\"group\":\"sentence\",\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"},{\"group\":\"sentence\",\"text\":\"I go for a walk by the lake every evening to get some fresh air.\",\"vi\":\"Tối nào tôi cũng đi dạo bên hồ để hít thở không khí trong lành.\"},{\"group\":\"sentence\",\"text\":\"There are not many green spaces in the city centre.\",\"vi\":\"Trung tâm thành phố không có nhiều không gian xanh.\"},{\"group\":\"sentence\",\"text\":\"The river near my house is badly polluted.\",\"vi\":\"Con sông gần nhà tôi bị ô nhiễm nặng.\"},{\"group\":\"sentence\",\"text\":\"Spending time in nature helps me relax after work.\",\"vi\":\"Dành thời gian giữa thiên nhiên giúp tôi thư giãn sau giờ làm.\"},{\"group\":\"sentence\",\"text\":\"To be honest, I'm not very keen on hot weather.\",\"vi\":\"Thật lòng mà nói, tôi không thích thời tiết nóng lắm.\"},{\"group\":\"sentence\",\"text\":\"I can't stand traffic jams, so I usually go to work by bike.\",\"vi\":\"Tôi không chịu nổi tắc đường, nên tôi thường đi làm bằng xe đạp.\"},{\"group\":\"dialogue\",\"text\":\"Let's talk about parks. Are there many parks where you live?\",\"vi\":\"Chúng ta nói về công viên nhé. Nơi bạn sống có nhiều công viên không?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"Not really. I live in the city centre, and there are only a few small green spaces, so people often go to one big park at weekends.\",\"vi\":\"Không nhiều lắm. Tôi sống ở trung tâm, chỉ có vài không gian xanh nhỏ, nên cuối tuần mọi người thường kéo đến một công viên lớn.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"How often do you go to a park?\",\"vi\":\"Bạn có hay đi công viên không?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"About twice a week. I usually go for a walk after dinner because it helps me relax after a long day.\",\"vi\":\"Khoảng hai lần một tuần. Tôi thường đi dạo sau bữa tối vì nó giúp tôi thư giãn sau một ngày dài.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"Do you prefer the countryside or the city?\",\"vi\":\"Bạn thích nông thôn hay thành phố hơn?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"Well, I prefer the countryside to the city. The air is fresher and it's much more peaceful, but I'd rather work in the city because there are more jobs.\",\"vi\":\"À, tôi thích nông thôn hơn thành phố. Không khí trong lành hơn và yên bình hơn nhiều, nhưng tôi lại muốn làm việc ở thành phố vì có nhiều việc hơn.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"Did you often play outside when you were a child?\",\"vi\":\"Hồi nhỏ bạn có hay chơi ngoài trời không?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"Yes, all the time. I grew up in a village, so my friends and I played in the rice fields and swam in the river every summer.\",\"vi\":\"Có, suốt ngày. Tôi lớn lên ở làng, nên mùa hè nào tôi và bạn bè cũng chơi ngoài đồng và bơi ở sông.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"Have you ever planted a tree?\",\"vi\":\"Bạn đã bao giờ trồng cây chưa?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"Yes, I have. Last year my company planted trees near the river, and I planted two small mango trees. I'm really keen on doing things like that.\",\"vi\":\"Rồi. Năm ngoái công ty tôi trồng cây gần bờ sông, và tôi trồng hai cây xoài nhỏ. Tôi rất thích làm những việc như vậy.\",\"extra\":\"Candidate\"}],\"dialogue\":[{\"speaker\":\"Examiner\",\"text\":\"Let's talk about parks. Are there many parks where you live?\",\"vi\":\"Chúng ta nói về công viên nhé. Nơi bạn sống có nhiều công viên không?\"},{\"speaker\":\"Candidate\",\"text\":\"Not really. I live in the city centre, and there are only a few small green spaces, so people often go to one big park at weekends.\",\"vi\":\"Không nhiều lắm. Tôi sống ở trung tâm, chỉ có vài không gian xanh nhỏ, nên cuối tuần mọi người thường kéo đến một công viên lớn.\"},{\"speaker\":\"Examiner\",\"text\":\"How often do you go to a park?\",\"vi\":\"Bạn có hay đi công viên không?\"},{\"speaker\":\"Candidate\",\"text\":\"About twice a week. I usually go for a walk after dinner because it helps me relax after a long day.\",\"vi\":\"Khoảng hai lần một tuần. Tôi thường đi dạo sau bữa tối vì nó giúp tôi thư giãn sau một ngày dài.\"},{\"speaker\":\"Examiner\",\"text\":\"Do you prefer the countryside or the city?\",\"vi\":\"Bạn thích nông thôn hay thành phố hơn?\"},{\"speaker\":\"Candidate\",\"text\":\"Well, I prefer the countryside to the city. The air is fresher and it's much more peaceful, but I'd rather work in the city because there are more jobs.\",\"vi\":\"À, tôi thích nông thôn hơn thành phố. Không khí trong lành hơn và yên bình hơn nhiều, nhưng tôi lại muốn làm việc ở thành phố vì có nhiều việc hơn.\"},{\"speaker\":\"Examiner\",\"text\":\"Did you often play outside when you were a child?\",\"vi\":\"Hồi nhỏ bạn có hay chơi ngoài trời không?\"},{\"speaker\":\"Candidate\",\"text\":\"Yes, all the time. I grew up in a village, so my friends and I played in the rice fields and swam in the river every summer.\",\"vi\":\"Có, suốt ngày. Tôi lớn lên ở làng, nên mùa hè nào tôi và bạn bè cũng chơi ngoài đồng và bơi ở sông.\"},{\"speaker\":\"Examiner\",\"text\":\"Have you ever planted a tree?\",\"vi\":\"Bạn đã bao giờ trồng cây chưa?\"},{\"speaker\":\"Candidate\",\"text\":\"Yes, I have. Last year my company planted trees near the river, and I planted two small mango trees. I'm really keen on doing things like that.\",\"vi\":\"Rồi. Năm ngoái công ty tôi trồng cây gần bờ sông, và tôi trồng hai cây xoài nhỏ. Tôi rất thích làm những việc như vậy.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"
