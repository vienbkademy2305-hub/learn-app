\"id\":\"grow|v\",\"term\":\"grow\",\"reading\":\"/ɡrəʊ/\",\"meaning\":\"trồng; lớn lên\",\"definitionEn\":\"to make plants develop; to get bigger\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"export|v\",\"term\":\"export\",\"reading\":\"/ɪkˈspɔːt/\",\"meaning\":\"xuất khẩu\",\"definitionEn\":\"to sell goods to another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: ex-PORT\"},{\"id\":\"import|v\",\"term\":\"import\",\"reading\":\"/ɪmˈpɔːt/\",\"meaning\":\"nhập khẩu\",\"definitionEn\":\"to buy goods from another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PORT\"},{\"id\":\"factory|n\",\"term\":\"factory\",\"reading\":\"/ˈfæk.tər.i/\",\"meaning\":\"nhà máy\",\"definitionEn\":\"a building where goods are made by machines\",\"lesson\":19,\"pos\":\"n\",\"example\":{\"text\":\"The factory produces a thousand cars a day.\",\"vi\":\"Nhà máy sản xuất một nghìn chiếc ô tô mỗi ngày.\"}},{\"id\":\"product|n\",\"term\":\"product\",\"reading\":\"/ˈprɒd.ʌkt/\",\"meaning\":\"sản phẩm\",\"definitionEn\":\"something that is made to be sold\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"Trọng âm: PRO-duct — Hay đi với: local products\"},{\"id\":\"material|n\",\"term\":\"material\",\"reading\":\"/məˈtɪə.ri.əl/\",\"meaning\":\"chất liệu; vật liệu\",\"definitionEn\":\"what something is made from, e.g. wood or cloth\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"mờ-TIR-i-ờl: nhấn âm 2. — Trọng âm: ma-TE-ri-al\",\"example\":{\"text\":\"What material is this shirt made of?\",\"vi\":\"Chiếc áo này làm bằng chất liệu gì?\"}},{\"id\":\"silk|n\",\"term\":\"silk\",\"reading\":\"/sɪlk/\",\"meaning\":\"lụa\",\"definitionEn\":\"a smooth, shiny cloth made by insects\",\"lesson\":19,\"pos\":\"n\",\"example\":{\"text\":\"Hoi An is famous for its silk.\",\"vi\":\"Hội An nổi tiếng về lụa.\"}},{\"id\":\"handmade|adj\",\"term\":\"handmade\",\"reading\":\"/ˌhændˈmeɪd/\",\"meaning\":\"làm bằng tay; thủ công\",\"definitionEn\":\"made by a person, not a machine\",\"lesson\":19,\"pos\":\"adj\",\"example\":{\"text\":\"My mother gave me a handmade bag.\",\"vi\":\"Mẹ tặng tôi một chiếc túi làm thủ công.\"}},{\"id\":\"translate|v\",\"term\":\"translate\",\"reading\":\"/trænzˈleɪt/\",\"meaning\":\"dịch (ngôn ngữ)\",\"definitionEn\":\"to change words into another language\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Hay đi với: translate into English\"},{\"id\":\"recycle|v\",\"term\":\"recycle\",\"reading\":\"/ˌriːˈsaɪ.kəl/\",\"meaning\":\"tái chế\",\"definitionEn\":\"to process used things so they can be used again\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: re-CY-cle\"},{\"id\":\"education|n\",\"term\":\"education\",\"reading\":\"/ˌedʒ.uˈkeɪ.ʃən/\",\"meaning\":\"giáo dục; sự học hành\",\"definitionEn\":\"the process of teaching and learning\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: e-du-CA-tion — Hay đi với: receive a good education · the education system\",\"example\":{\"text\":\"My lecturer has written three books about education.\",\"vi\":\"Giảng viên của tôi đã viết ba cuốn sách về giáo dục.\"}},{\"id\":\"higher-education|phr-n\",\"term\":\"higher education\",\"reading\":\"/ˌhaɪ.ər ˌedʒ.uˈkeɪ.ʃən/\",\"meaning\":\"giáo dục đại học; bậc học sau phổ thông\",\"definitionEn\":\"study at a university or college\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: access to higher education · the cost of higher education\"},{\"id\":\"curriculum|n\",\"term\":\"curriculum\",\"reading\":\"/kəˈrɪk.jə.ləm/\",\"meaning\":\"chương trình học; chương trình giảng dạy\",\"definitionEn\":\"all the subjects taught at a school or course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: cu-RI-cu-lum — Hay đi với: the school curriculum · change the curriculum\",\"example\":{\"text\":\"Our school has used a new curriculum since 2020.\",\"vi\":\"Trường chúng tôi dùng chương trình học mới từ năm 2020.\"}},{\"id\":\"tuition-fee|phr-n\",\"term\":\"tuition fee\",\"reading\":\"/tjuˈɪʃ.ən fiː/\",\"meaning\":\"học phí\",\"definitionEn\":\"the money you pay to study at a school or university\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: pay tuition fees · high tuition fees\"},{\"id\":\"qualification|n\",\"term\":\"qualification\",\"reading\":\"/ˌkwɒl.ɪ.fɪˈkeɪ.ʃən/\",\"meaning\":\"bằng cấp; chứng chỉ\",\"definitionEn\":\"an official record that you have passed a course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: qua-li-fi-CA-tion — Hay đi với: get a qualification · a qualification in accounting\",\"example\":{\"text\":\"A good qualification can help you find a better job.\",\"vi\":\"Một tấm bằng tốt có thể giúp bạn tìm được việc tốt hơn.\"}},{\"id\":\"knowledge|n\",\"term\":\"knowledge\",\"reading\":\"/ˈnɒl.ɪdʒ/\",\"meaning\":\"kiến thức; hiểu biết\",\"definitionEn\":\"information and understanding you have\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Chữ k câm: NOL-ij. — Trọng âm: KNOW-ledge — Hay đi với: gain knowledge · knowledge of history\",\"example\":{\"text\":\"You can gain a lot of knowledge from books.\",\"vi\":\"Bạn có thể thu được nhiều kiến thức từ sách.\"}},{\"id\":\"skill|n\",\"term\":\"skill\",\"reading\":\"/skɪl/\",\"meaning\":\"kỹ năng\",\"definitionEn\":\"an ability to do something well\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Hay đi với: improve your skills · language skills\"},{\"id\":\"lecturer|n\",\"term\":\"lecturer\",\"reading\":\"/ˈlek.tʃər.ər/\",\"meaning\":\"giảng viên (đại học)\",\"definitionEn\":\"a teacher at a university\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: LEC-tur-er\",\"example\":{\"text\":\"My lecturer has written three books about education.\",\"vi\":\"Giảng viên của tôi đã viết ba cuốn sách về giáo dục.\"}},{\"id\":\"scholarship|n\",\"term\":\"scholarship\",\"reading\":\"/ˈskɒl.ə.ʃɪp/\",\"meaning\":\"học bổng\",\"definitionEn\":\"money given to a student to pay for studies\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: SCHO-lar-ship — Hay đi với: win a scholarship · get a scholarship\",\"example\":{\"text\":\"Have you ever won a scholarship?\",\"vi\":\"Bạn đã bao giờ giành được học bổng chưa?\"}},{\"id\":\"academic|adj\",\"term\":\"academic\",\"reading\":\"/ˌæk.əˈdem.ɪk/\",\"meaning\":\"(thuộc) học thuật; học tập\",\"definitionEn\":\"connected with studying and schools or universities\",\"lesson\":21,\"pos\":\"adj\",\"hint\":\"Trọng âm: a-ca-DE-mic — Hay đi với: academic subjects · academic performance\",\"example\":{\"text\":\"He is good at academic subjects like maths and physics.\",\"vi\":\"Cậu ấy giỏi các môn học thuật như toán và vật lý.\"}},{\"id\":\"rote-learning|phr-n\",\"term\":\"rote learning\",\"reading\":\"/ˌrəʊt ˈlɜː.nɪŋ/\",\"meaning\":\"học vẹt; học thuộc lòng máy móc\",\"definitionEn\":\"learning by repeating facts without understanding them\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rely on rote learning · learn by rote\"},{\"id\":\"extracurricular-activity|phr-n\",\"term\":\"extracurricular activity\",\"reading\":\"/ˌek.strə.kəˈrɪk.jə.lər ækˈtɪv.ə.ti/\",\"meaning\":\"hoạt động ngoại khóa\",\"definitionEn\":\"an activity at school outside normal lessons\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: take part in extracurricular activities\"},{\"id\":\"attend|v\",\"term\":\"attend\",\"reading\":\"/əˈtend/\",\"meaning\":\"theo học; tham dự (lớp, buổi học, sự kiện)\",\"definitionEn\":\"to go to a class, meeting or event\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: at-TEND — Hay đi với: attend a class · attend school\"},{\"id\":\"improve|v\",\"term\":\"improve\",\"reading\":\"/ɪmˈpruːv/\",\"meaning\":\"cải thiện; tiến bộ\",\"definitionEn\":\"to become better or make something better\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PROVE — Hay đi với: improve your English · improve skills\",\"example\":{\"text\":\"Many graduates do internships in order to improve their job security.\",\"vi\":\"Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc.\"}},{\"id\":\"achieve|v\",\"term\":\"achieve\",\"reading\":\"/əˈtʃiːv/\",\"meaning\":\"đạt được (mục tiêu, kết quả)\",\"definitionEn\":\"to succeed in doing something after effort\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: a-CHIEVE — Hay đi với: achieve a goal · achieve good results\",\"example\":{\"text\":\"What do you want to achieve this year?\",\"vi\":\"Năm nay bạn muốn đạt được điều gì?\"}},{\"id\":\"main-idea|phr-n\",\"term\":\"main idea\",\"reading\":\"/ˌmeɪn aɪˈdɪə/\",\"meaning\":\"ý chính\",\"definitionEn\":\"the most important point of a text\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the main idea of a paragraph · find the main idea\"},{\"id\":\"paragraph|n\",\"term\":\"paragraph\",\"reading\":\"/ˈpær.ə.ɡrɑːf/\",\"meaning\":\"đoạn văn\",\"definitionEn\":\"a part of a text that starts on a new line\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: PA-ra-graph — Hay đi với: the first paragraph · write a paragraph\",\"example\":{\"text\":\"The main idea of a paragraph is often in the first sentence.\",\"vi\":\"Ý chính của một đoạn văn thường nằm ở câu đầu tiên.\"}},{\"id\":\"opinion|n\",\"term\":\"opinion\",\"reading\":\"/əˈpɪn.jən/\",\"meaning\":\"ý kiến; quan điểm\",\"definitionEn\":\"what you think about something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"ờ-PIN-yờn: nhấn âm 2. — Trọng âm: o-PI-nion — Hay đi với: in my opinion · express an opinion\",\"example\":{\"text\":\"Misleading headlines can change public opinion very quickly.\",\"vi\":\"Những tiêu đề gây hiểu lầm có thể thay đổi dư luận rất nhanh.\"}},{\"id\":\"argue|v\",\"term\":\"argue\",\"reading\":\"/ˈɑːɡ.juː/\",\"meaning\":\"lập luận; cho rằng\",\"definitionEn\":\"to give reasons to support an idea\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: AR-gue — Hay đi với: argue that… · it is often argued that…\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"believe|v\",\"term\":\"believe\",\"reading\":\"/bɪˈliːv/\",\"meaning\":\"tin; cho rằng\",\"definitionEn\":\"to think that something is true\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"“Be-LIE-ve”: đừng tin lời nói dối; i đứng trước e. — Trọng âm: be-LIEVE — Hay đi với: believe that… · strongly believe\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"disagree|v\",\"term\":\"disagree\",\"reading\":\"/ˌdɪs.əˈɡriː/\",\"meaning\":\"không đồng ý; phản đối\",\"definitionEn\":\"to have a different opinion\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: dis-a-GREE — Hay đi với: disagree with someone · strongly disagree\",\"example\":{\"text\":\"You can agree or disagree, but you must give clear reasons.\",\"vi\":\"Bạn có thể đồng ý hoặc phản đối, nhưng phải đưa ra lý do rõ ràng.\"}},{\"id\":\"reason|n\",\"term\":\"reason\",\"reading\":\"/ˈriː.zən/\",\"meaning\":\"lý do\",\"definitionEn\":\"why something happens or why someone does something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: REA-son — Hay đi với: the main reason · for two reasons\",\"example\":{\"text\":\"The reason space research is worth funding is that it produces useful spin-offs.\",\"vi\":\"Lý do nghiên cứu vũ trụ đáng được tài trợ là nó tạo ra nhiều ứng dụng hữu ích.\"}},{\"id\":\"benefit|n\",\"term\":\"benefit\",\"reading\":\"/ˈben.ɪ.fɪt/\",\"meaning\":\"lợi ích\",\"definitionEn\":\"a good effect or advantage\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: BE-ne-fit — Hay đi với: the benefits of… · a major benefit\",\"example\":{\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"}},{\"id\":\"drawback|n\",\"term\":\"drawback\",\"reading\":\"/ˈdrɔː.bæk/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"a problem that makes something less attractive\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: DRAW-back — Hay đi với: the main drawback · a serious drawback\",\"example\":{\"text\":\"The main drawback of online classes is the lack of contact with teachers.\",\"vi\":\"Nhược điểm chính của lớp học online là thiếu tiếp xúc với giáo viên.\"}},{\"id\":\"positive|adj\",\"term\":\"positive\",\"reading\":\"/ˈpɒz.ə.tɪv/\",\"meaning\":\"tích cực\",\"definitionEn\":\"good or helpful; hopeful\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PO-si-tive — Hay đi với: a positive effect · positive attitude\",\"example\":{\"text\":\"Sport has a positive effect on students' health.\",\"vi\":\"Thể thao có ảnh hưởng tích cực đến sức khỏe của học sinh.\"}},{\"id\":\"negative|adj\",\"term\":\"negative\",\"reading\":\"/ˈneɡ.ə.tɪv/\",\"meaning\":\"tiêu cực\",\"definitionEn\":\"bad or harmful\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: NE-ga-tive — Hay đi với: a negative effect on… · negative impact\",\"example\":{\"text\":\"Too much screen time can have a negative effect on children.\",\"vi\":\"Dùng màn hình quá nhiều có thể ảnh hưởng tiêu cực đến trẻ em.\"}},{\"id\":\"compulsory|adj\",\"term\":\"compulsory\",\"reading\":\"/kəmˈpʌl.sər.i/\",\"meaning\":\"bắt buộc\",\"definitionEn\":\"required by a rule or law\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: com-PUL-so-ry — Hay đi với: compulsory subject · compulsory education\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"essential|adj\",\"term\":\"essential\",\"reading\":\"/ɪˈsen.ʃəl/\",\"meaning\":\"thiết yếu; rất cần thiết\",\"definitionEn\":\"absolutely necessary\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: es-SEN-tial — Hay đi với: essential for… · it is essential to…\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"creativity|n\",\"term\":\"creativity\",\"reading\":\"/ˌkriː.eɪˈtɪv.ə.ti/\",\"meaning\":\"sự sáng tạo; khả năng sáng tạo\",\"definitionEn\":\"the ability to produce new and original ideas\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: cre-a-TI-vi-ty — Hay đi với: develop creativity · encourage creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"independent|adj\",\"term\":\"independent\",\"reading\":\"/ˌɪn.dɪˈpen.dənt/\",\"meaning\":\"tự lập; độc lập\",\"definitionEn\":\"able to do things without help from others\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-de-PEN-dent — Hay đi với: become independent · independent learners\",\"example\":{\"text\":\"University students should be more independent than school children.\",\"vi\":\"Sinh viên đại học nên tự lập hơn học sinh phổ thông.\"}},{\"id\":\"practical|adj\",\"term\":\"practical\",\"reading\":\"/ˈpræk.tɪ.kəl/\",\"meaning\":\"thực tế; thực hành\",\"definitionEn\":\"connected with real situations rather than ideas\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PRAC-ti-cal — Hay đi với: practical skills · practical experience\",\"example\":{\"text\":\"Cooking and managing money are practical skills.\",\"vi\":\"Nấu ăn và quản lý tiền bạc là những kỹ năng thực tế.\"}},{\"id\":\"pressure|n\",\"term\":\"pressure\",\"reading\":\"/ˈpreʃ.ər/\",\"meaning\":\"áp lực\",\"definitionEn\":\"a feeling that you must do something, causing stress\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: PRES-sure — Hay đi với: put pressure on someone · under pressure\",\"example\":{\"text\":\"Some teenagers start smoking due to peer pressure.\",\"vi\":\"Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè.\"}},{\"id\":\"critical-thinking|phr-n\",\"term\":\"critical thinking\",\"reading\":\"/ˌkrɪt.ɪ.kəl ˈθɪŋ.kɪŋ/\",\"meaning\":\"tư duy phản biện\",\"definitionEn\":\"the ability to judge information carefully and logically\",\"lesson\":22,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: develop critical thinking · critical thinking skills\"},{\"id\":\"develop|v\",\"term\":\"develop\",\"reading\":\"/dɪˈvel.əp/\",\"meaning\":\"phát triển; rèn luyện (kỹ năng)\",\"definitionEn\":\"to grow or make something grow stronger\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"di-VEL-ờp: không có e ở cuối. — Trọng âm: de-VE-lop — Hay đi với: develop skills · develop creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"environment|n\",\"term\":\"environment\",\"reading\":\"/ɪnˈvaɪ.rən.mənt/\",\"meaning\":\"môi trường\",\"definitionEn\":\"the natural world of land, air, water, plants and animals\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"En-VAI-rần-mần: có “iron” (AI-rần) ở giữa từ. — Trọng âm: en-VI-ron-ment — Hay đi với: protect the environment · harm the environment\",\"example\":{\"text\":\"We should protect the environment for our children.\",\"vi\":\"Chúng ta nên bảo vệ môi trường vì con cháu mình.\"}},{\"id\":\"pollution|n\",\"term\":\"pollution\",\"reading\":\"/pəˈluː.ʃən/\",\"meaning\":\"sự ô nhiễm\",\"definitionEn\":\"damage to air, water or land by harmful substances\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: pol-LU-tion — Hay đi với: air pollution · water pollution\",\"example\":{\"text\":\"Air pollution in our city has got worse since 2015.\",\"vi\":\"Ô nhiễm không khí ở thành phố chúng tôi trở nên tệ hơn kể từ năm 2015.\"}},{\"id\":\"waste|n\",\"term\":\"waste\",\"reading\":\"/weɪst/\",\"meaning\":\"rác thải; chất thải\",\"definitionEn\":\"things that are thrown away because they are not needed\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Hay đi với: plastic waste · food waste\",\"example\":{\"text\":\"Food waste is a big problem in restaurants.\",\"vi\":\"Lãng phí thực phẩm là một vấn đề lớn ở các nhà hàng.\"}},{\"id\":\"rubbish|n\",\"term\":\"rubbish\",\"reading\":\"/ˈrʌb.ɪʃ/\",\"meaning\":\"rác\",\"definitionEn\":\"things you throw away (British English)\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"RÂB-ish: 2 chữ b. — Trọng âm: RUB-bish — Hay đi với: throw away rubbish · a rubbish bin\",\"example\":{\"text\":\"Our group has picked up five tons of rubbish so far.\",\"vi\":\"Đến nay nhóm chúng tôi đã nhặt được năm tấn rác.\"}},{\"id\":\"climate-change|phr-n\",\"term\":\"climate change\",\"reading\":\"/ˈklaɪ.mət ˌtʃeɪndʒ/\",\"meaning\":\"biến đổi khí hậu\",\"definitionEn\":\"long-term changes in the Earth's weather patterns\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: tackle climate change · the effects of climate change\"},{\"id\":\"global-warming|phr-n\",\"term\":\"global warming\",\"reading\":\"/ˌɡləʊ.bəl ˈwɔː.mɪŋ/\",\"meaning\":\"sự nóng lên toàn cầu\",\"definitionEn\":\"the rise in the Earth's average temperature\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: cause global warming · slow down global warming\"},{\"id\":\"carbon-emissions|phr-n\",\"term\":\"carbon emissions\",\"reading\":\"/ˌkɑː.bən iˈmɪʃ.ənz/\",\"meaning\":\"khí thải carbon\",\"definitionEn\":\"gases released when fuel is burned\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce carbon emissions · cut carbon emissions\"},{\"id\":\"renewable-energy|phr-n\",\"term\":\"renewable energy\",\"reading\":\"/rɪˌnjuː.ə.bəl ˈen.ə.dʒi/\",\"meaning\":\"năng lượng tái tạo\",\"definitionEn\":\"power from sources such as the sun and wind\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use renewable energy · invest in renewable energy\"},{\"id\":\"protect|v\",\"term\":\"protect\",\"reading\":\"/prəˈtekt/\",\"meaning\":\"bảo vệ\",\"definitionEn\":\"to keep someone or something safe from harm\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: pro-TECT — Hay đi với: protect the environment · protect wildlife\",\"example\":{\"text\":\"Users should protect their privacy online.\",\"vi\":\"Người dùng nên bảo vệ quyền riêng tư của mình trên mạng.\"}},{\"id\":\"reduce|v\",\"term\":\"reduce\",\"reading\":\"/rɪˈdʒuːs/\",\"meaning\":\"giảm; cắt giảm\",\"definitionEn\":\"to make something smaller in amount or size\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: re-DUCE — Hay đi với: reduce pollution · reduce waste\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"volunteer|n\",\"term\":\"volunteer\",\"reading\":\"/ˌvɒl.ənˈtɪər/\",\"meaning\":\"tình nguyện viên\",\"definitionEn\":\"a person who works without being paid\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"vol-ờn-TIR: nhấn âm cuối. — Trọng âm: vo-lun-TEER — Hay đi với: work as a volunteer · volunteer work\",\"example\":{\"text\":\"Have you ever worked as a volunteer? – Yes, I worked at a national park last summer.\",\"vi\":\"Bạn đã bao giờ làm tình nguyện viên chưa? – Rồi, mùa hè năm ngoái tôi làm ở một vườn quốc gia.\"}},{\"id\":\"deforestation|n\",\"term\":\"deforestation\",\"reading\":\"/diːˌfɒr.ɪˈsteɪ.ʃən/\",\"meaning\":\"nạn phá rừng\",\"definitionEn\":\"cutting down large areas of trees\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: de-fo-res-TA-tion — Hay đi với: stop deforestation · the causes of deforestation\",\"example\":{\"text\":\"Deforestation has destroyed the homes of many animals.\",\"vi\":\"Nạn phá rừng đã phá hủy nơi sống của nhiều loài động vật.\"}},{\"id\":\"endangered-species|phr-n\",\"term\":\"endangered species\",\"reading\":\"/ɪnˌdeɪn.dʒəd ˈspiː.ʃiːz/\",\"meaning\":\"loài có nguy cơ tuyệt chủng\",\"definitionEn\":\"types of animals or plants that may soon disappear\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect endangered species\"},{\"id\":\"single-use-plastic|phr-n\",\"term\":\"single-use plastic\",\"reading\":\"/ˌsɪŋ.ɡəl.juːs ˈplæs.tɪk/\",\"meaning\":\"nhựa dùng một lần\",\"definitionEn\":\"plastic items used once and then thrown away\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: ban single-use plastic · single-use plastic bags\"},{\"id\":\"reusable|adj\",\"term\":\"reusable\",\"reading\":\"/ˌriːˈjuː.zə.bəl/\",\"meaning\":\"dùng lại được\",\"definitionEn\":\"able to be used again\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-U-sa-ble — Hay đi với: a reusable bag · a reusable bottle\",\"example\":{\"text\":\"I always bring a reusable bottle to work.\",\"vi\":\"Tôi luôn mang theo một chai nước dùng lại được khi đi làm.\"}},{\"id\":\"environmentally-friendly|adj\",\"term\":\"environmentally friendly\",\"reading\":\"/ɪnˌvaɪ.rən.men.təl.i ˈfrend.li/\",\"meaning\":\"thân thiện với môi trường\",\"definitionEn\":\"not harmful to nature\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Hay đi với: environmentally friendly products\"},{\"id\":\"nature|n\",\"term\":\"nature\",\"reading\":\"/ˈneɪ.tʃər/\",\"meaning\":\"thiên nhiên; tự nhiên\",\"definitionEn\":\"plants, animals, and the physical world not made by people\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: NA-ture — Hay đi với: in nature · close to nature\",\"example\":{\"text\":\"Spending time in nature helps me relax after work.\",\"vi\":\"Dành thời gian giữa thiên nhiên giúp tôi thư giãn sau giờ làm.\"}},{\"id\":\"fresh-air|phr-n\",\"term\":\"fresh air\",\"reading\":\"/ˌfreʃ ˈeər/\",\"meaning\":\"không khí trong lành\",\"definitionEn\":\"clean air outside, away from pollution\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: get some fresh air · breathe fresh air\"},{\"id\":\"countryside|n\",\"term\":\"countryside\",\"reading\":\"/ˈkʌn.tri.saɪd/\",\"meaning\":\"vùng nông thôn; miền quê\",\"definitionEn\":\"land outside towns, with fields and farms\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: COUN-try-side — Hay đi với: live in the countryside · the beautiful countryside\",\"example\":{\"text\":\"I would rather live in the countryside than in a big city.\",\"vi\":\"Tôi thà sống ở nông thôn còn hơn ở thành phố lớn.\"}},{\"id\":\"green-space|phr-n\",\"term\":\"green space\",\"reading\":\"/ˌɡriːn ˈspeɪs/\",\"meaning\":\"không gian xanh (công viên, vườn cây trong thành phố)\",\"definitionEn\":\"an area of grass and trees in a city\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: more green spaces · a lack of green space\"},{\"id\":\"peaceful|adj\",\"term\":\"peaceful\",\"reading\":\"/ˈpiːs.fəl/\",\"meaning\":\"yên bình; thanh bình\",\"definitionEn\":\"quiet and calm\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: PEACE-ful — Hay đi với: a peaceful village · peaceful and quiet\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"noisy|adj\",\"term\":\"noisy\",\"reading\":\"/ˈnɔɪ.zi/\",\"meaning\":\"ồn ào\",\"definitionEn\":\"making a lot of loud sounds\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: NOI-sy — Hay đi với: a noisy street · noisy neighbours\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"polluted|adj\",\"term\":\"polluted\",\"reading\":\"/pəˈluː.tɪd/\",\"meaning\":\"bị ô nhiễm\",\"definitionEn\":\"made dirty by harmful substances\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: pol-LU-ted — Hay đi với: a polluted river · heavily polluted\",\"example\":{\"text\":\"The river near my house is badly polluted.\",\"vi\":\"Con sông gần nhà tôi bị ô nhiễm nặng.\"}},{\"id\":\"outdoor|adj\",\"term\":\"outdoor\",\"reading\":\"/ˈaʊt.dɔː/\",\"meaning\":\"ngoài trời\",\"definitionEn\":\"happening outside, not in a building\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Hay đi với: outdoor activities · outdoor sports\",\"example\":{\"text\":\"I'm really keen on outdoor activities like cycling and camping.\",\"vi\":\"Tôi rất mê các hoạt động ngoài trời như đạp xe và cắm trại.\"}},{\"id\":\"go-for-a-walk|colloc\",\"term\":\"go for a walk\",\"reading\":\"/ɡəʊ fər ə ˈwɔːk/\",\"meaning\":\"đi dạo\",\"definitionEn\":\"to leave the house and move on foot for pleasure\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: go for a walk in the park · go for a walk after dinner\"},{\"id\":\"plant|v\",\"term\":\"plant\",\"reading\":\"/plɑːnt/\",\"meaning\":\"trồng (cây)\",\"definitionEn\":\"to put seeds or young trees into the ground\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Hay đi với: plant trees · plant flowers\",\"example\":{\"text\":\"First, used bottles are collected from homes and taken to a recycling plant.\",\"vi\":\"Đầu tiên, chai đã qua sử dụng được thu gom từ các hộ gia đình và đưa đến nhà máy tái chế.\"}},{\"id\":\"keen-on|colloc\",\"term\":\"keen on\",\"reading\":\"/ˈkiːn ɒn/\",\"meaning\":\"thích; say mê\",\"definitionEn\":\"very interested in something\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: be keen on + V-ing · be really keen on\"},{\"id\":\"prefer|v\",\"term\":\"prefer\",\"reading\":\"/prɪˈfɜːr/\",\"meaning\":\"thích hơn\",\"definitionEn\":\"to like one thing more than another\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-FER — Hay đi với: prefer A to B · prefer + V-ing\",\"example\":{\"text\":\"I prefer casual clothes at the weekend.\",\"vi\":\"Cuối tuần tôi thích mặc đồ thường ngày hơn.\"}},{\"id\":\"would-rather|colloc\",\"term\":\"would rather\",\"reading\":\"/wʊd ˈrɑː.ðər/\",\"meaning\":\"thà… còn hơn; muốn … hơn\",\"definitionEn\":\"used to say what you want to do more\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: would rather + V + than + V · I'd rather not\"}],\"lesson\":{\"number\":24,\"title\":\"Môi trường · Speaking Part 1: trả lời mở rộng\"}}]\n"])</script><script>self.__next_f.push([1,"28:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=24\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n29:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-20
