i phạm tội giúp ích cho xã hội.\"}},{\"id\":\"disadvantage|n\",\"term\":\"disadvantage\",\"reading\":\"/ˌdɪs.ədˈvɑːn.tɪdʒ/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"something that causes problems\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: dis-ad-VAN-tage — Hay đi với: a serious disadvantage · the disadvantages of…\",\"example\":{\"text\":\"One disadvantage of prison is its high cost.\",\"vi\":\"Một nhược điểm của nhà tù là chi phí cao.\"}},{\"id\":\"outweigh|v\",\"term\":\"outweigh\",\"reading\":\"/ˌaʊtˈweɪ/\",\"meaning\":\"lớn hơn; quan trọng hơn (khi cân nhắc)\",\"definitionEn\":\"to be greater or more important than\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: out-WEIGH — Hay đi với: the advantages outweigh the disadvantages\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"society|n\",\"term\":\"society\",\"reading\":\"/səˈsaɪ.ə.ti/\",\"meaning\":\"xã hội\",\"definitionEn\":\"people living together in a community or country\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: so-CI-e-ty — Hay đi với: modern society · in society\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"public-safety|phr-n\",\"term\":\"public safety\",\"reading\":\"/ˌpʌb.lɪk ˈseɪf.ti/\",\"meaning\":\"an toàn công cộng\",\"definitionEn\":\"the protection of everyone from danger\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve public safety · a threat to public safety\"},{\"id\":\"crime-rate|phr-n\",\"term\":\"crime rate\",\"reading\":\"/ˈkraɪm ˌreɪt/\",\"meaning\":\"tỉ lệ tội phạm\",\"definitionEn\":\"the number of crimes in an area during a period\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce the crime rate · a high crime rate\"},{\"id\":\"deter|v\",\"term\":\"deter\",\"reading\":\"/dɪˈtɜːr/\",\"meaning\":\"răn đe; ngăn chặn (ai làm gì)\",\"definitionEn\":\"to make someone decide not to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: de-TER — Hay đi với: deter crime · deter people from committing crimes\",\"example\":{\"text\":\"Security cameras can deter crime. In addition, they help the police find criminals.\",\"vi\":\"Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.\"}},{\"id\":\"prevent|v\",\"term\":\"prevent\",\"reading\":\"/prɪˈvent/\",\"meaning\":\"ngăn chặn; phòng ngừa\",\"definitionEn\":\"to stop something from happening\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-VENT — Hay đi với: prevent crime · prevent somebody from + V-ing\",\"example\":{\"text\":\"Better street lights can prevent people from committing crimes at night.\",\"vi\":\"Đèn đường tốt hơn có thể ngăn người ta phạm tội vào ban đêm.\"}},{\"id\":\"encourage|v\",\"term\":\"encourage\",\"reading\":\"/ɪnˈkʌr.ɪdʒ/\",\"meaning\":\"khuyến khích; động viên\",\"definitionEn\":\"to give someone confidence or support to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: en-COU-rage — Hay đi với: encourage somebody to + V\",\"example\":{\"text\":\"Schools should encourage students to follow the law.\",\"vi\":\"Trường học nên khuyến khích học sinh tuân thủ pháp luật.\"}},{\"id\":\"harsh|adj\",\"term\":\"harsh\",\"reading\":\"/hɑːʃ/\",\"meaning\":\"khắc nghiệt; nghiêm khắc\",\"definitionEn\":\"very severe or unkind\",\"lesson\":30,\"pos\":\"adj\",\"hint\":\"Hay đi với: a harsh punishment · harsh laws\",\"example\":{\"text\":\"Some people think harsh punishments are the best way to protect public safety.\",\"vi\":\"Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng.\"}},{\"id\":\"community-service|phr-n\",\"term\":\"community service\",\"reading\":\"/kəˌmjuː.nə.ti ˈsɜː.vɪs/\",\"meaning\":\"lao động công ích (hình phạt thay tù)\",\"definitionEn\":\"unpaid work in the local area as a punishment\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do community service · be sentenced to community service\"},{\"id\":\"freedom|n\",\"term\":\"freedom\",\"reading\":\"/ˈfriː.dəm/\",\"meaning\":\"sự tự do\",\"definitionEn\":\"the right to do what you want\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: FREE-dom — Hay đi với: personal freedom · freedom of speech\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"in-addition|idiom\",\"term\":\"in addition\",\"reading\":\"/ɪn əˈdɪʃ.ən/\",\"meaning\":\"thêm vào đó; ngoài ra\",\"definitionEn\":\"also; used to add another point\",\"lesson\":30,\"pos\":\"idiom\",\"hint\":\"Hay đi với: In addition, … · in addition to + N/V-ing\"},{\"id\":\"on-the-other-hand|idiom\",\"term\":\"on the other hand\",\"reading\":\"/ɒn ði ˈʌð.ər ˌhænd/\",\"meaning\":\"mặt khác (nêu ý đối lập)\",\"definitionEn\":\"used to introduce an opposite point\",\"lesson\":30,\"pos\":\"idiom\"},{\"id\":\"however|adv\",\"term\":\"however\",\"reading\":\"/haʊˈev.ər/\",\"meaning\":\"tuy nhiên\",\"definitionEn\":\"but; used to show contrast\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"hau-EV-ờ: nhấn âm 2. — Trọng âm: how-E-ver\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"therefore|adv\",\"term\":\"therefore\",\"reading\":\"/ˈðeə.fɔːr/\",\"meaning\":\"vì vậy; do đó\",\"definitionEn\":\"for that reason; as a result\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"Trọng âm: THERE-fore\",\"example\":{\"text\":\"Cameras record everything. Therefore, it is easier to find witnesses.\",\"vi\":\"Camera ghi lại mọi thứ. Vì vậy, việc tìm nhân chứng dễ hơn.\"}},{\"id\":\"nuclear-family|phr-n\",\"term\":\"nuclear family\",\"reading\":\"/ˌnjuː.kli.ə ˈfæm.əl.i/\",\"meaning\":\"gia đình hạt nhân (bố mẹ và con cái)\",\"definitionEn\":\"a family of just parents and their children\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: live in a nuclear family · the traditional nuclear family\"},{\"id\":\"extended-family|phr-n\",\"term\":\"extended family\",\"reading\":\"/ɪkˌsten.dɪd ˈfæm.əl.i/\",\"meaning\":\"đại gia đình (ông bà, cô chú… sống chung hoặc gắn bó)\",\"definitionEn\":\"a family including grandparents, aunts and uncles\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: live with your extended family · members of the extended family\"},{\"id\":\"generation-gap|phr-n\",\"term\":\"generation gap\",\"reading\":\"/ˌdʒen.əˈreɪ.ʃən ɡæp/\",\"meaning\":\"khoảng cách thế hệ\",\"definitionEn\":\"differences in ideas between young and old people\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Trọng âm: gen-e-RA-tion gap — Hay đi với: bridge the generation gap · a wide generation gap\"},{\"id\":\"work-life-balance|phr-n\",\"term\":\"work-life balance\",\"reading\":\"/ˌwɜːk ˈlaɪf ˌbæl.əns/\",\"meaning\":\"cân bằng giữa công việc và cuộc sống\",\"definitionEn\":\"dividing time well between your job and personal life\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have a good work-life balance · improve your work-life balance\"},{\"id\":\"bring-up|phr-v\",\"term\":\"bring up\",\"reading\":\"/ˌbrɪŋ ˈʌp/\",\"meaning\":\"nuôi dạy (con cái)\",\"definitionEn\":\"to look after and educate a child until adulthood\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: bring up children · be brought up by your grandparents\"},{\"id\":\"household-chore|phr-n\",\"term\":\"household chore\",\"reading\":\"/ˌhaʊs.həʊld ˈtʃɔːr/\",\"meaning\":\"việc nhà\",\"definitionEn\":\"a regular job at home, e.g. washing dishes\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do household chores · share the household chores\"},{\"id\":\"look-after|phr-v\",\"term\":\"look after\",\"reading\":\"/ˌlʊk ˈɑːf.tər/\",\"meaning\":\"chăm sóc; trông nom\",\"definitionEn\":\"to take care of someone or something\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look after children · look after elderly parents\"},{\"id\":\"elderly|adj\",\"term\":\"elderly\",\"reading\":\"/ˈel.dəl.i/\",\"meaning\":\"cao tuổi (cách nói lịch sự)\",\"definitionEn\":\"old (a polite word)\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Trọng âm: EL-der-ly — Hay đi với: elderly parents · the elderly\",\"example\":{\"text\":\"Elderly people are particularly vulnerable to heatwaves.\",\"vi\":\"Người cao tuổi đặc biệt dễ bị ảnh hưởng bởi các đợt nắng nóng.\"}},{\"id\":\"retire|v\",\"term\":\"retire\",\"reading\":\"/rɪˈtaɪər/\",\"meaning\":\"nghỉ hưu\",\"definitionEn\":\"to stop working because of age\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: re-TIRE — Hay đi với: retire at 60 · retire from work\"},{\"id\":\"responsibility|n\",\"term\":\"responsibility\",\"reading\":\"/rɪˌspɒn.səˈbɪl.ə.ti/\",\"meaning\":\"trách nhiệm\",\"definitionEn\":\"a duty to take care of something\",\"lesson\":31,\"pos\":\"n\",\"hint\":\"Trọng âm: re-spon-si-BI-li-ty — Hay đi với: take responsibility for · share the responsibility\",\"example\":{\"text\":\"Children will learn responsibility if they do household chores.\",\"vi\":\"Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà.\"}},{\"id\":\"support|v\",\"term\":\"support\",\"reading\":\"/səˈpɔːt/\",\"meaning\":\"hỗ trợ; nuôi (về tài chính)\",\"definitionEn\":\"to help someone, often with money\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: sup-PORT — Hay đi với: support your family · support elderly parents financially\",\"example\":{\"text\":\"It is important to support local businesses in small towns.\",\"vi\":\"Việc ủng hộ các doanh nghiệp địa phương ở thị trấn nhỏ là rất quan trọng.\"}},{\"id\":\"relationship|n\",\"term\":\"relationship\",\"reading\":\"/rɪˈleɪ.ʃən.ʃɪp/\",\"meaning\":\"mối quan hệ\",\"definitionEn\":\"the way people are connected or behave towards each other\",\"lesson\":31,\"pos\":\"n\",\"hint\":\"Trọng âm: re-LA-tion-ship — Hay đi với: a close relationship with · build a good relationship\"},{\"id\":\"respect|v\",\"term\":\"respect\",\"reading\":\"/rɪˈspekt/\",\"meaning\":\"tôn trọng; kính trọng\",\"definitionEn\":\"to admire someone and treat them politely\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: re-SPECT — Hay đi với: respect your elders · respect other people's opinions\",\"example\":{\"text\":\"Visitors should respect local customs, for example by dressing politely in temples.\",\"vi\":\"Du khách nên tôn trọng phong tục địa phương, ví dụ ăn mặc lịch sự trong chùa.\"}},{\"id\":\"get-on-with|phr-v\",\"term\":\"get on with\",\"reading\":\"/ˌɡet ˈɒn wɪð/\",\"meaning\":\"hòa hợp với (ai)\",\"definitionEn\":\"to have a friendly relationship with someone\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: get on well with · not get on with\"},{\"id\":\"single-parent|phr-n\",\"term\":\"single parent\",\"reading\":\"/ˌsɪŋ.ɡəl ˈpeə.rənt/\",\"meaning\":\"cha/mẹ đơn thân\",\"definitionEn\":\"a mother or father raising children alone\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a single-parent family · be brought up by a single parent\"},{\"id\":\"traditional|adj\",\"term\":\"traditional\",\"reading\":\"/trəˈdɪʃ.ən.əl/\",\"meaning\":\"truyền thống\",\"definitionEn\":\"following customs from the past\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Trọng âm: tra-DI-tion-al — Hay đi với: traditional values · traditional gender roles\",\"example\":{\"text\":\"Instead of eating fast food, we should try traditional dishes.\",\"vi\":\"Thay vì ăn đồ ăn nhanh, chúng ta nên thử các món truyền thống.\"}},{\"id\":\"close-knit|adj\",\"term\":\"close-knit\",\"reading\":\"/ˌkləʊsˈnɪt/\",\"meaning\":\"gắn bó khăng khít\",\"definitionEn\":\"(of a group) whose members care about each other\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Hay đi với: a close-knit family · a close-knit community\"},{\"id\":\"unless|conj\",\"term\":\"unless\",\"reading\":\"/ənˈles/\",\"meaning\":\"trừ khi; nếu … không\",\"definitionEn\":\"except if\",\"lesson\":31,\"pos\":\"conj\",\"hint\":\"Trọng âm: un-LESS — Hay đi với: unless you hurry · unless it rains\",\"example\":{\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"}},{\"id\":\"gender-role|phr-n\",\"term\":\"gender role\",\"reading\":\"/ˈdʒen.də ˌrəʊl/\",\"meaning\":\"vai trò giới (việc được cho là của nam hoặc nữ)\",\"definitionEn\":\"behaviour society expects from men or from women\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: traditional gender roles · challenge gender roles\"},{\"id\":\"equality|n\",\"term\":\"equality\",\"reading\":\"/iˈkwɒl.ə.ti/\",\"meaning\":\"sự bình đẳng\",\"definitionEn\":\"the same rights and chances for everyone\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: e-QUAL-i-ty — Hay đi với: gender equality · equality between men and women\",\"example\":{\"text\":\"Gender equality starts at home, when boys and girls do the same household chores.\",\"vi\":\"Bình đẳng giới bắt đầu từ trong nhà, khi con trai và con gái cùng làm việc nhà như nhau.\"}},{\"id\":\"role-model|phr-n\",\"term\":\"role model\",\"reading\":\"/ˈrəʊl ˌmɒd.əl/\",\"meaning\":\"tấm gương (để noi theo)\",\"definitionEn\":\"a person others admire and try to copy\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a good role model for · act as a role model\"},{\"id\":\"influence|v\",\"term\":\"influence\",\"reading\":\"/ˈɪn.flu.əns/\",\"meaning\":\"ảnh hưởng đến\",\"definitionEn\":\"to have an effect on someone's behaviour or ideas\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"Trọng âm: IN-flu-ence — Hay đi với: influence children's behaviour · be influenced by friends\",\"example\":{\"text\":\"A happy childhood can have a positive influence on a person's attitude to life.\",\"vi\":\"Một tuổi thơ hạnh phúc có thể ảnh hưởng tích cực đến thái độ sống của một người.\"}},{\"id\":\"value|n\",\"term\":\"value\",\"reading\":\"/ˈvæl.juː/\",\"meaning\":\"giá trị, quan niệm sống (số nhiều: values); giá trị (của đồ vật)\",\"definitionEn\":\"a belief about what is important in life; or what something is worth\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Hay đi với: family values · traditional values\",\"example\":{\"text\":\"The table shows that the total value of exports doubled over the period.\",\"vi\":\"Bảng cho thấy tổng giá trị xuất khẩu tăng gấp đôi trong giai đoạn này.\"}},{\"id\":\"peer-pressure|phr-n\",\"term\":\"peer pressure\",\"reading\":\"/ˈpɪə ˌpreʃ.ər/\",\"meaning\":\"áp lực đồng trang lứa\",\"definitionEn\":\"pressure from people your age to behave like them\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: give in to peer pressure · under peer pressure\"},{\"id\":\"discipline|n\",\"term\":\"discipline\",\"reading\":\"/ˈdɪs.ə.plɪn/\",\"meaning\":\"kỷ luật; sự rèn luyện kỷ luật\",\"definitionEn\":\"training people to follow rules and control themselves\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: DIS-ci-pline — Hay đi với: strict discipline · self-discipline\"},{\"id\":\"strict|adj\",\"term\":\"strict\",\"reading\":\"/strɪkt/\",\"meaning\":\"nghiêm khắc\",\"definitionEn\":\"demanding that rules are followed\",\"lesson\":32,\"pos\":\"adj\",\"hint\":\"Hay đi với: strict parents · be strict with children\",\"example\":{\"text\":\"Strict law enforcement is needed to reduce violent crime.\",\"vi\":\"Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực.\"}},{\"id\":\"spoil|v\",\"term\":\"spoil\",\"reading\":\"/spɔɪl/\",\"meaning\":\"nuông chiều (làm hư); làm hỏng\",\"definitionEn\":\"to give a child everything they want, making them behave badly\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"Hay đi với: spoil a child · spoiled children\",\"example\":{\"text\":\"Grandparents sometimes spoil their grandchildren by giving them too many sweets.\",\"vi\":\"Ông bà đôi khi nuông chiều cháu bằng cách cho chúng quá nhiều bánh kẹo.\"}},{\"id\":\"communicate|v\",\"term\":\"communicate\",\"reading\":\"/kəˈmjuː.nɪ.keɪt/\",\"meaning\":\"giao tiếp; trao đổi\",\"definitionEn\":\"to share ideas or information with others\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"kờ-MYU-ni-keit: nhấn âm 2. — Trọng âm: com-MU-ni-cate — Hay đi với: communicate with your parents · communicate clearly\",\"example\":{\"text\":\"If parents are too strict, their children may not communicate with them openly.\",\"vi\":\"Nếu bố mẹ quá nghiêm khắc, con cái có thể không cởi mở trò chuyện với họ.\"}},{\"id\":\"behaviour|n\",\"term\":\"behaviour\",\"reading\":\"/bɪˈheɪ.vjər/\",\"meaning\":\"hành vi; cách cư xử\",\"definitionEn\":\"the way someone acts\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"bi-HEIV-yờ: nhấn âm 2; Anh-Anh viết có u (Mỹ: behavior). — Trọng âm: be-HA-viour — Hay đi với: good behaviour · children's behaviour\",\"example\":{\"text\":\"Children learn good behaviour mainly from their families, not from school.\",\"vi\":\"Trẻ học cách cư xử tốt chủ yếu từ gia đình, không phải từ trường học.\"}},{\"id\":\"childhood|n\",\"term\":\"childhood\",\"reading\":\"/ˈtʃaɪld.hʊd/\",\"meaning\":\"thời thơ ấu\",\"definitionEn\":\"the period of your life when you are a child\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Hay đi với: a happy childhood · in my childhood\",\"example\":{\"text\":\"Much childhood obesity stems from the high consumption of sugary drinks.\",\"vi\":\"Phần lớn béo phì ở trẻ bắt nguồn từ việc tiêu thụ nhiều đồ uống có đường.\"}},{\"id\":\"teenager|n\",\"term\":\"teenager\",\"reading\":\"/ˈtiːnˌeɪ.dʒər/\",\"meaning\":\"thiếu niên (13–19 tuổi)\",\"definitionEn\":\"a person aged between 13 and 19\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: TEEN-a-ger — Hay đi với: as a teenager · teenagers and their parents\"},{\"id\":\"expectation|n\",\"term\":\"expectation\",\"reading\":\"/ˌek.spekˈteɪ.ʃən/\",\"meaning\":\"sự kỳ vọng\",\"definitionEn\":\"a belief about what should or will happen\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-pec-TA-tion — Hay đi với: high expectations · parents' expectations\"},{\"id\":\"attitude|n\",\"term\":\"attitude\",\"reading\":\"/ˈæt.ɪ.tʃuːd/\",\"meaning\":\"thái độ; quan điểm\",\"definitionEn\":\"the way you think or feel about something\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: AT-ti-tude — Hay đi với: attitude to/towards · a positive attitude\",\"example\":{\"text\":\"A happy childhood can have a positive influence on a person's attitude to life.\",\"vi\":\"Một tuổi thơ hạnh phúc có thể ảnh hưởng tích cực đến thái độ sống của một người.\"}},{\"id\":\"nowadays|adv\",\"term\":\"nowadays\",\"reading\":\"/ˈnaʊ.ə.deɪz/\",\"meaning\":\"ngày nay\",\"definitionEn\":\"at the present time\",\"lesson\":32,\"pos\":\"adv\",\"hint\":\"NAU-ờ-deiz: now + a + days.\",\"example\":{\"text\":\"Nowadays, teenagers are influenced more by social media than by their parents.\",\"vi\":\"Ngày nay, thanh thiếu niên chịu ảnh hưởng từ mạng xã hội nhiều hơn từ bố mẹ.\"}},{\"id\":\"due-to|prep\",\"term\":\"due to\",\"reading\":\"/ˈdʒuː tuː/\",\"meaning\":\"do; bởi vì (+ danh từ)\",\"definitionEn\":\"because of\",\"lesson\":32,\"pos\":\"prep\",\"hint\":\"Hay đi với: due to work pressure · due to the high cost\"},{\"id\":\"for-instance|idiom\",\"term\":\"for instance\",\"reading\":\"/fər ˈɪn.stəns/\",\"meaning\":\"ví dụ (= for example)\",\"definitionEn\":\"for example\",\"lesson\":32,\"pos\":\"idiom\"},{\"id\":\"such-as|prep\",\"term\":\"such as\",\"reading\":\"/ˈsʌtʃ əz/\",\"meaning\":\"chẳng hạn như (+ danh từ, đứng trong câu)\",\"definitionEn\":\"used before giving examples\",\"lesson\":32,\"pos\":\"prep\",\"hint\":\"Hay đi với: household chores such as cooking and cleaning\"},{\"id\":\"cultural-heritage|phr-n\",\"term\":\"cultural heritage\",\"reading\":\"/ˌkʌl.tʃər.əl ˈher.ɪ.tɪdʒ/\",\"meaning\":\"di sản văn hóa\",\"definitionEn\":\"traditions, buildings and art passed down from the past\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect cultural heritage · part of our cultural heritage\"},{\"id\":\"mass-tourism|phr-n\",\"term\":\"mass tourism\",\"reading\":\"/ˌmæs ˈtʊə.rɪ.zəm/\",\"meaning\":\"du lịch đại trà (lượng khách rất đông)\",\"definitionEn\":\"travel by very large numbers of people to the same places\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the effects of mass tourism · suffer from mass tourism\"},{\"id\":\"tourism|n\",\"term\":\"tourism\",\"reading\":\"/ˈtʊə.rɪ.zəm/\",\"meaning\":\"ngành du lịch; hoạt động du lịch\",\"definitionEn\":\"the business of providing services for people on holiday\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"TUƠ-ri-zờm. — Trọng âm: TOU-ri-sm — Hay đi với: the tourism industry · promote tourism\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"culture|n\",\"term\":\"culture\",\"reading\":\"/ˈkʌl.tʃər/\",\"meaning\":\"văn hóa\",\"definitionEn\":\"the customs, arts and beliefs of a group of people\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: local culture · learn about a different culture\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"cultural-identity|phr-n\",\"term\":\"cultural identity\",\"reading\":\"/ˌkʌl.tʃər.əl aɪˈden.tə.ti/\",\"meaning\":\"bản sắc văn hóa\",\"definitionEn\":\"a sense of belonging to a group with shared traditions\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lose its cultural identity · keep a strong cultural identity\"},{\"id\":\"preserve|v\",\"term\":\"preserve\",\"reading\":\"/prɪˈzɜːv/\",\"meaning\":\"bảo tồn; giữ gìn\",\"definitionEn\":\"to keep something in its original state\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-SERVE — Hay đi với: preserve traditions · preserve old buildings\",\"example\":{\"text\":\"Young people should learn about their cultural heritage and preserve old traditions.\",\"vi\":\"Người trẻ nên tìm hiểu di sản văn hóa của mình và giữ gìn các truyền thống cũ.\"}},{\"id\":\"tradition|n\",\"term\":\"tradition\",\"reading\":\"/trəˈdɪʃ.ən/\",\"meaning\":\"truyền thống\",\"definitionEn\":\"a custom passed from one generation to the next\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"trờ-DI-shờn: nhấn âm 2. — Trọng âm: tra-DI-tion — Hay đi với: keep a tradition alive · follow a tradition\"},{\"id\":\"custom|n\",\"term\":\"custom\",\"reading\":\"/ˈkʌs.təm/\",\"meaning\":\"phong tục\",\"definitionEn\":\"a usual way of doing something in a society\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: local customs · respect the customs of\"},{\"id\":\"ancient|adj\",\"term\":\"ancient\",\"reading\":\"/ˈeɪn.ʃənt/\",\"meaning\":\"cổ; cổ xưa\",\"definitionEn\":\"very old; from a long time ago\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Hay đi với: an ancient town · ancient temples\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"historic|adj\",\"term\":\"historic\",\"reading\":\"/hɪˈstɒr.ɪk/\",\"meaning\":\"có tính lịch sử; quan trọng về mặt lịch sử\",\"definitionEn\":\"important in history\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: his-TOR-ic — Hay đi với: a historic building · the historic centre\",\"example\":{\"text\":\"If I were the mayor, I would ban motorbikes in the historic centre.\",\"vi\":\"Nếu tôi là thị trưởng, tôi sẽ cấm xe máy ở khu trung tâm lịch sử.\"}},{\"id\":\"landmark|n\",\"term\":\"landmark\",\"reading\":\"/ˈlænd.mɑːk/\",\"meaning\":\"công trình/địa danh biểu tượng\",\"definitionEn\":\"a famous building or place that is easy to recognise\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: a famous landmark · a national landmark\",\"example\":{\"text\":\"The bridge is the town's most famous landmark and appears on many postcards.\",\"vi\":\"Cây cầu là địa danh nổi tiếng nhất của thị trấn và xuất hiện trên nhiều bưu thiếp.\"}},{\"id\":\"overcrowded|adj\",\"term\":\"overcrowded\",\"reading\":\"/ˌəʊ.vəˈkraʊ.dɪd/\",\"meaning\":\"quá đông đúc\",\"definitionEn\":\"having too many people\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: o-ver-CROW-ded — Hay đi với: overcrowded streets · become overcrowded\",\"example\":{\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"}},{\"id\":\"authentic|adj\",\"term\":\"authentic\",\"reading\":\"/ɔːˈθen.tɪk/\",\"meaning\":\"đích thực; nguyên bản\",\"definitionEn\":\"real and original, not a copy\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: au-THEN-tic — Hay đi với: authentic local food · an authentic experience\",\"example\":{\"text\":\"If I were you, I would try authentic local food instead of pizza.\",\"vi\":\"Nếu tôi là bạn, tôi sẽ thử món ăn địa phương đích thực thay vì pizza.\"}},{\"id\":\"local-resident|phr-n\",\"term\":\"local resident\",\"reading\":\"/ˌləʊ.kəl ˈrez.ɪ.dənt/\",\"meaning\":\"cư dân địa phương\",\"definitionEn\":\"a person who lives in a particular area\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: local residents complain about · the needs of local residents\"},{\"id\":\"restore|v\",\"term\":\"restore\",\"reading\":\"/rɪˈstɔːr/\",\"meaning\":\"trùng tu; khôi phục\",\"definitionEn\":\"to repair something old to its original condition\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: re-STORE — Hay đi với: restore an old house · be carefully restored\",\"example\":{\"text\":\"The government has spent a lot of money to restore the old temples.\",\"vi\":\"Chính phủ đã chi nhiều tiền để trùng tu các ngôi chùa cổ.\"}},{\"id\":\"damage|v\",\"term\":\"damage\",\"reading\":\"/ˈdæm.ɪdʒ/\",\"meaning\":\"làm hư hại\",\"definitionEn\":\"to harm or break something\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: DAM-age — Hay đi với: damage old buildings · be badly damaged\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"unique|adj\",\"term\":\"unique\",\"reading\":\"/juːˈniːk/\",\"meaning\":\"độc nhất; độc đáo\",\"definitionEn\":\"being the only one of its kind\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: u-NIQUE — Hay đi với: a unique culture · unique to this region\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"festival|n\",\"term\":\"festival\",\"reading\":\"/ˈfes.tɪ.vəl/\",\"meaning\":\"lễ hội\",\"definitionEn\":\"a special time of celebration\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: a lantern festival · hold a festival\",\"example\":{\"text\":\"Critics say the festival has become too commercialised.\",\"vi\":\"Những người chỉ trích nói lễ hội đã bị thương mại hóa quá mức.\"}},{\"id\":\"bar-chart|phr-n\",\"term\":\"bar chart\",\"reading\":\"/ˈbɑː ˌtʃɑːt/\",\"meaning\":\"biểu đồ cột\",\"definitionEn\":\"a graph that uses rectangles of different heights to compare amounts\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the bar chart compares · the bar chart shows\"},{\"id\":\"destination|n\",\"term\":\"destination\",\"reading\":\"/ˌdes.tɪˈneɪ.ʃən/\",\"meaning\":\"điểm đến\",\"definitionEn\":\"the place where someone is going\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: des-ti-NA-tion — Hay đi với: a popular tourist destination · a holiday destination\",\"example\":{\"text\":\"Da Nang was the second most popular destination in both years.\",\"vi\":\"Đà Nẵng là điểm đến được ưa chuộng thứ hai trong cả hai năm.\"}},{\"id\":\"visitor|n\",\"term\":\"visitor\",\"reading\":\"/ˈvɪz.ɪ.tər/\",\"meaning\":\"khách tham quan; du khách\",\"definitionEn\":\"a person who comes to see a place or person\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Hay đi với: attract visitors · international visitors\"},{\"id\":\"international|adj\",\"term\":\"international\",\"reading\":\"/ˌɪn.təˈnæʃ.ən.əl/\",\"meaning\":\"quốc tế\",\"definitionEn\":\"involving more than one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-ter-NA-tion-al — Hay đi với: international tourists · international flights\",\"example\":{\"text\":\"In 2023, Hanoi received twice as many international visitors as Hue.\",\"vi\":\"Năm 2023, Hà Nội đón lượng khách quốc tế gấp đôi Huế.\"}},{\"id\":\"domestic|adj\",\"term\":\"domestic\",\"reading\":\"/dəˈmes.tɪk/\",\"meaning\":\"trong nước; nội địa\",\"definitionEn\":\"within one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: do-MES-tic — Hay đi với: domestic tourists · domestic flights\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"accommodation|n\",\"term\":\"accommodation\",\"reading\":\"/əˌkɒm.əˈdeɪ.ʃən/\",\"meaning\":\"chỗ ở (khách sạn, nhà nghỉ…)\",\"definitionEn\":\"a place to stay, e.g. a hotel\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"2 chữ c, 2 chữ m: ac-COM-MO-da-tion. — Trọng âm: ac-com-mo-DA-tion — Hay đi với: spend money on accommodation · cheap accommodation\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"tourist-attraction|phr-n\",\"term\":\"tourist attraction\",\"reading\":\"/ˈtʊə.rɪst əˌtræk.ʃən/\",\"meaning\":\"điểm tham quan du lịch\",\"definitionEn\":\"a place that many travellers visit\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a major tourist attraction · visit tourist attractions\"},{\"id\":\"expenditure|n\",\"term\":\"expenditure\",\"reading\":\"/ɪkˈspen.dɪ.tʃər/\",\"meaning\":\"khoản chi tiêu\",\"definitionEn\":\"the amount of money spent\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-PEN-di-ture — Hay đi với: expenditure on food · total expenditure\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"category|n\",\"term\":\"category\",\"reading\":\"/ˈkæt.ə.ɡər.i/\",\"meaning\":\"hạng mục; loại\",\"definitionEn\":\"a group of things of the same type\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"KAT-ờ-gờ-ri: nhấn âm đầu. — Trọng âm: CAT-e-go-ry — Hay đi với: in each category · the largest category\",\"example\":{\"text\":\"Accommodation was the largest category of spending. In contrast, shopping was the smallest.\",\"vi\":\"Chỗ ở là hạng mục chi tiêu lớn nhất. Ngược lại, mua sắm là nhỏ nhất.\"}},{\"id\":\"region|n\",\"term\":\"region\",\"reading\":\"/ˈriː.dʒən/\",\"meaning\":\"vùng; khu vực\",\"definitionEn\":\"a large area of a country or the world\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Hay đi với: the northern region · in the Mekong Delta region\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"popular|adj\",\"term\":\"popular\",\"reading\":\"/ˈpɒp.jə.lər/\",\"meaning\":\"phổ biến; được ưa chuộng\",\"definitionEn\":\"liked by many people\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: POP-u-lar — Hay đi với: the most popular destination · popular with young people\",\"example\":{\"text\":\"Beef noodle soup is very popular in Hanoi.\",\"vi\":\"Phở bò rất được ưa chuộng ở Hà Nội.\"}},{\"id\":\"double|v\",\"term\":\"double\",\"reading\":\"/ˈdʌb.əl/\",\"meaning\":\"tăng gấp đôi\",\"definitionEn\":\"to become twice as large\",\"lesson\":34,\"pos\":\"v\",\"hint\":\"Hay đi với: double in size · the number doubled\"},{\"id\":\"approximately|adv\",\"term\":\"approximately\",\"reading\":\"/əˈprɒk.sɪ.mət.li/\",\"meaning\":\"xấp xỉ; khoảng\",\"definitionEn\":\"about; close to an exact number\",\"lesson\":34,\"pos\":\"adv\",\"hint\":\"Trọng âm: ap-PROX-i-mate-ly — Hay đi với: approximately 40% · approximately half\",\"example\":{\"text\":\"Approximately 40% of visitors spent their money on tourist attractions.\",\"vi\":\"Khoảng 40% du khách chi tiền cho các điểm tham quan.\"}},{\"id\":\"respectively|adv\",\"term\":\"respectively\",\"reading\":\"/rɪˈspek.tɪv.li/\",\"meaning\":\"lần lượt; tương ứng\",\"definitionEn\":\"in the same order as the things just mentioned\",\"lesson\":34,\"pos\":\"adv\",\"hint\":\"Trọng âm: re-SPEC-tive-ly — Hay đi với: A and B were 20% and 30%, respectively\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"whereas|conj\",\"term\":\"whereas\",\"reading\":\"/weərˈæz/\",\"meaning\":\"trong khi (đối lập)\",\"definitionEn\":\"while; used to compare two different facts\",\"lesson\":34,\"pos\":\"conj\",\"hint\":\"weờ-AZ: nhấn âm cuối. — Trọng âm: where-AS — Hay đi với: …, whereas …\",\"example\":{\"text\":\"Some countries have strict drug laws, whereas others focus on treatment.\",\"vi\":\"Một số nước có luật ma túy nghiêm khắc, trong khi những nước khác tập trung vào điều trị.\"}},{\"id\":\"compared-with|colloc\",\"term\":\"compared with\",\"reading\":\"/kəmˈpeəd wɪð/\",\"meaning\":\"so với\",\"definitionEn\":\"used to show how two things differ\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: compared with last year · compared to 2010\"},{\"id\":\"in-contrast|idiom\",\"term\":\"in contrast\",\"reading\":\"/ɪn ˈkɒn.trɑːst/\",\"meaning\":\"ngược lại\",\"definitionEn\":\"used to show a big difference\",\"lesson\":34,\"pos\":\"idiom\"},{\"id\":\"similarly|adv\",\"term\":\"similarly\",\"reading\":\"/ˈsɪm.ɪ.lə.li/\",\"meaning\":\"tương tự như vậy\",\"definitionEn\":\"in the same way\",\"lesson\":34,\"pos\":\"adv\",\"example\":{\"text\":\"The northern region attracted fewer foreign tourists than the south. Similarly, it had fewer hotels.\",\"vi\":\"Miền Bắc thu hút ít khách nước ngoài hơn miền Nam. Tương tự, miền Bắc có ít khách sạn hơn.\"}},{\"id\":\"the-majority-of|colloc\",\"term\":\"the majority of\",\"reading\":\"/ðə məˈdʒɒr.ə.ti əv/\",\"meaning\":\"phần lớn; đa số\",\"definitionEn\":\"most of a group\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: the majority of tourists · a large majority of\"}],\"lesson\":{\"number\":34,\"title\":\"Du lịch \u0026 văn hóa · Writing Task 1: biểu đồ cột\"}}]\n"])</script><script>self.__next_f.push([1,"2c:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=34\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2d:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-34-du-lich-writing-task-1-bar-chart/pronunciation\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Phát âm\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",
