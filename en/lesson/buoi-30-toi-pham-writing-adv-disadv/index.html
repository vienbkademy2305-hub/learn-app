:\"sharply\",\"reading\":\"/ˈʃɑːp.li/\",\"meaning\":\"mạnh; đột ngột (tăng/giảm)\",\"definitionEn\":\"suddenly and by a large amount\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Hay đi với: rise sharply · fall sharply\",\"example\":{\"text\":\"The number of online shoppers rose sharply between 2015 and 2020.\",\"vi\":\"Số người mua sắm trực tuyến tăng mạnh từ năm 2015 đến 2020.\"}},{\"id\":\"gradually|adv\",\"term\":\"gradually\",\"reading\":\"/ˈɡrædʒ.u.ə.li/\",\"meaning\":\"dần dần; từ từ\",\"definitionEn\":\"slowly over a period of time\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Trọng âm: GRA-du-al-ly — Hay đi với: increase gradually · gradually decline\",\"example\":{\"text\":\"The use of cash gradually decreased as more people paid by phone.\",\"vi\":\"Việc dùng tiền mặt giảm dần khi ngày càng nhiều người trả tiền bằng điện thoại.\"}},{\"id\":\"significantly|adv\",\"term\":\"significantly\",\"reading\":\"/sɪɡˈnɪf.ɪ.kənt.li/\",\"meaning\":\"đáng kể\",\"definitionEn\":\"by a large or important amount\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Trọng âm: sig-NI-fi-cant-ly — Hay đi với: grow significantly · significantly higher\",\"example\":{\"text\":\"Smartphone use has increased significantly since 2015.\",\"vi\":\"Việc sử dụng điện thoại thông minh đã tăng đáng kể kể từ năm 2015.\"}},{\"id\":\"slightly|adv\",\"term\":\"slightly\",\"reading\":\"/ˈslaɪt.li/\",\"meaning\":\"nhẹ; một chút\",\"definitionEn\":\"a little\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Hay đi với: fall slightly · slightly higher than\",\"example\":{\"text\":\"The figure reached a peak of 60% in 2019 and then fell slightly.\",\"vi\":\"Con số đạt đỉnh 60% năm 2019 rồi giảm nhẹ.\"}},{\"id\":\"gym|n\",\"term\":\"gym\",\"reading\":\"/dʒɪm/\",\"meaning\":\"phòng tập thể dục (gym)\",\"definitionEn\":\"a room or building with equipment for exercise\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Hay đi với: go to the gym · work out at the gym\",\"example\":{\"text\":\"I work out at the gym three times a week. ,{\"id\":\"exhausted|adj\",\"term\":\"exhausted\",\"reading\":\"/ɪɡˈzɔː.stɪd/\",\"meaning\":\"kiệt sức\",\"definitionEn\":\"extremely tired\",\"lesson\":28,\"pos\":\"adj\",\"hint\":\"ig-ZAW-stid: chữ h câm. — Trọng âm: ex-HAUS-ted\",\"example\":{\"text\":\"After the race I was exhausted but very proud.\",\"vi\":\"Sau cuộc đua tôi kiệt sức nhưng rất tự hào.\"}},{\"id\":\"memorable|adj\",\"term\":\"memorable\",\"reading\":\"/ˈmem.ər.ə.bəl/\",\"meaning\":\"đáng nhớ\",\"definitionEn\":\"worth remembering; special\",\"lesson\":28,\"pos\":\"adj\",\"hint\":\"Trọng âm: ME-mo-ra-ble — Hay đi với: a memorable day · a memorable experience\",\"example\":{\"text\":\"It was one of the most memorable days of my life.\",\"vi\":\"Đó là một trong những ngày đáng nhớ nhất đời tôi.\"}},{\"id\":\"crime|n\",\"term\":\"crime\",\"reading\":\"/kraɪm/\",\"meaning\":\"tội phạm; tội ác\",\"definitionEn\":\"an action that is against the law\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: commit a crime · the crime rate\",\"example\":{\"text\":\"Strict law enforcement is needed to reduce violent crime.\",\"vi\":\"Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực.\"}},{\"id\":\"criminal|n\",\"term\":\"criminal\",\"reading\":\"/ˈkrɪm.ɪ.nəl/\",\"meaning\":\"tội phạm (người)\",\"definitionEn\":\"a person who has broken the law\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: CRI-mi-nal\",\"example\":{\"text\":\"The criminal was caught by a security guard.\",\"vi\":\"Kẻ phạm tội bị một bảo vệ bắt được.\"}},{\"id\":\"offender|n\",\"term\":\"offender\",\"reading\":\"/əˈfen.dər/\",\"meaning\":\"người phạm tội\",\"definitionEn\":\"a person who has committed a crime (formal)\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: of-FEN-der — Hay đi với: young offenders · first-time offenders\"},{\"id\":\"commit|v\",\"term\":\"commit\",\"reading\":\"/kəˈmɪt/\",\"meaning\":\"phạm (tội)\",\"definitionEn\":\"to do something wrong or illegal\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Trọng âm: com-MIT — Hay đi với: commit a crime · commit an offence\"},{\"id\":\"steal|v\",\"term\":\"steal\",\"reading\":\"/stiːl/\",\"meaning\":\"ăn trộm; lấy cắp\",\"definitionEn\":\"to take something that is not yours\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Hay đi với: steal a phone · have something stolen\"},{\"id\":\"thief|n\",\"term\":\"thief\",\"reading\":\"/θiːf/\",\"meaning\":\"kẻ trộm\",\"definitionEn\":\"a person who takes things that are not theirs\",\"lesson\":29,\"pos\":\"n\",\"example\":{\"text\":\"The thief will be sent to prison for two years.\",\"vi\":\"Tên trộm sẽ bị đưa vào tù hai năm.\"}},{\"id\":\"arrest|v\",\"term\":\"arrest\",\"reading\":\"/əˈrest/\",\"meaning\":\"bắt giữ\",\"definitionEn\":\"(of police) to take someone away because of a crime\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Trọng âm: ar-REST — Hay đi với: be arrested for stealing · arrest a suspect\"},{\"id\":\"victim|n\",\"term\":\"victim\",\"reading\":\"/ˈvɪk.tɪm/\",\"meaning\":\"nạn nhân\",\"definitionEn\":\"a person who is hurt or harmed by a crime\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: VIC-tim — Hay đi với: a crime victim · the victim of a robbery\",\"example\":{\"text\":\"The victim told the police what happened.\",\"vi\":\"Nạn nhân kể cho cảnh sát chuyện đã xảy ra.\"}},{\"id\":\"witness|n\",\"term\":\"witness\",\"reading\":\"/ˈwɪt.nəs/\",\"meaning\":\"nhân chứng\",\"definitionEn\":\"a person who sees a crime or accident happen\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: WIT-ness — Hay đi với: a witness to the crime\",\"example\":{\"text\":\"A witness saw the car and remembered the number.\",\"vi\":\"Một nhân chứng thấy chiếc xe và nhớ biển số.\"}},{\"id\":\"law|n\",\"term\":\"law\",\"reading\":\"/lɔː/\",\"meaning\":\"luật; pháp luật\",\"definitionEn\":\"the system of rules of a country\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: break the law · obey the law\",\"example\":{\"text\":\"A new law against drink-driving is being discussed.\",\"vi\":\"Một luật mới chống lái xe khi say rượu đang được thảo luận.\"}},{\"id\":\"illegal|adj\",\"term\":\"illegal\",\"reading\":\"/ɪˈliː.ɡəl/\",\"meaning\":\"bất hợp pháp\",\"definitionEn\":\"against the law\",\"lesson\":29,\"pos\":\"adj\",\"hint\":\"Trọng âm: il-LE-gal — Hay đi với: illegal drugs · it is illegal to…\",\"example\":{\"text\":\"It is illegal to drive without a licence.\",\"vi\":\"Lái xe không có bằng là bất hợp pháp.\"}},{\"id\":\"judge|n\",\"term\":\"judge\",\"reading\":\"/dʒʌdʒ/\",\"meaning\":\"thẩm phán\",\"definitionEn\":\"the person who decides cases in a court\",\"lesson\":29,\"pos\":\"n\",\"example\":{\"text\":\"Don't judge people by their appearance.\",\"vi\":\"Đừng đánh giá người khác qua vẻ bề ngoài.\"}},{\"id\":\"punishment|n\",\"term\":\"punishment\",\"reading\":\"/ˈpʌn.ɪʃ.mənt/\",\"meaning\":\"hình phạt\",\"definitionEn\":\"a penalty for doing something wrong\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: PU-nish-ment — Hay đi với: a harsh punishment · a fair punishment\",\"example\":{\"text\":\"Some people think prison is not the best punishment for young offenders.\",\"vi\":\"Một số người cho rằng tù không phải hình phạt tốt nhất cho người phạm tội trẻ tuổi.\"}},{\"id\":\"prison|n\",\"term\":\"prison\",\"reading\":\"/ˈprɪz.ən/\",\"meaning\":\"nhà tù\",\"definitionEn\":\"a building where criminals are kept\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: PRI-son — Hay đi với: go to prison · be sent to prison\",\"example\":{\"text\":\"One disadvantage of prison is its high cost.\",\"vi\":\"Một nhược điểm của nhà tù là chi phí cao.\"}},{\"id\":\"fine|n\",\"term\":\"fine\",\"reading\":\"/faɪn/\",\"meaning\":\"tiền phạt\",\"definitionEn\":\"money you must pay as a penalty\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: pay a fine · a heavy fine\",\"example\":{\"text\":\"He had to pay a fine for parking on the pavement.\",\"vi\":\"Anh ấy phải nộp phạt vì đỗ xe trên vỉa hè.\"}},{\"id\":\"security-camera|phr-n\",\"term\":\"security camera\",\"reading\":\"/sɪˈkjʊə.rə.ti ˌkæm.rə/\",\"meaning\":\"camera an ninh\",\"definitionEn\":\"a camera that records an area to prevent crime\",\"lesson\":29,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: install security cameras · CCTV\"},{\"id\":\"advantage|n\",\"term\":\"advantage\",\"reading\":\"/ədˈvɑːn.tɪdʒ/\",\"meaning\":\"ưu điểm; lợi thế\",\"definitionEn\":\"something that helps you or makes a situation better\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: ad-VAN-tage — Hay đi với: the main advantage of… · have an advantage\",\"example\":{\"text\":\"The main advantage of community service is that offenders help society.\",\"vi\":\"Ưu điểm chính của lao động công ích là người phạm tội giúp ích cho xã hội.\"}},{\"id\":\"disadvantage|n\",\"term\":\"disadvantage\",\"reading\":\"/ˌdɪs.ədˈvɑːn.tɪdʒ/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"something that causes problems\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: dis-ad-VAN-tage — Hay đi với: a serious disadvantage · the disadvantages of…\",\"example\":{\"text\":\"One disadvantage of prison is its high cost.\",\"vi\":\"Một nhược điểm của nhà tù là chi phí cao.\"}},{\"id\":\"outweigh|v\",\"term\":\"outweigh\",\"reading\":\"/ˌaʊtˈweɪ/\",\"meaning\":\"lớn hơn; quan trọng hơn (khi cân nhắc)\",\"definitionEn\":\"to be greater or more important than\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: out-WEIGH — Hay đi với: the advantages outweigh the disadvantages\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"society|n\",\"term\":\"society\",\"reading\":\"/səˈsaɪ.ə.ti/\",\"meaning\":\"xã hội\",\"definitionEn\":\"people living together in a community or country\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: so-CI-e-ty — Hay đi với: modern society · in society\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"public-safety|phr-n\",\"term\":\"public safety\",\"reading\":\"/ˌpʌb.lɪk ˈseɪf.ti/\",\"meaning\":\"an toàn công cộng\",\"definitionEn\":\"the protection of everyone from danger\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve public safety · a threat to public safety\"},{\"id\":\"crime-rate|phr-n\",\"term\":\"crime rate\",\"reading\":\"/ˈkraɪm ˌreɪt/\",\"meaning\":\"tỉ lệ tội phạm\",\"definitionEn\":\"the number of crimes in an area during a period\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce the crime rate · a high crime rate\"},{\"id\":\"deter|v\",\"term\":\"deter\",\"reading\":\"/dɪˈtɜːr/\",\"meaning\":\"răn đe; ngăn chặn (ai làm gì)\",\"definitionEn\":\"to make someone decide not to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: de-TER — Hay đi với: deter crime · deter people from committing crimes\",\"example\":{\"text\":\"Security cameras can deter crime. In addition, they help the police find criminals.\",\"vi\":\"Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.\"}},{\"id\":\"prevent|v\",\"term\":\"prevent\",\"reading\":\"/prɪˈvent/\",\"meaning\":\"ngăn chặn; phòng ngừa\",\"definitionEn\":\"to stop something from happening\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-VENT — Hay đi với: prevent crime · prevent somebody from + V-ing\",\"example\":{\"text\":\"Better street lights can prevent people from committing crimes at night.\",\"vi\":\"Đèn đường tốt hơn có thể ngăn người ta phạm tội vào ban đêm.\"}},{\"id\":\"encourage|v\",\"term\":\"encourage\",\"reading\":\"/ɪnˈkʌr.ɪdʒ/\",\"meaning\":\"khuyến khích; động viên\",\"definitionEn\":\"to give someone confidence or support to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: en-COU-rage — Hay đi với: encourage somebody to + V\",\"example\":{\"text\":\"Schools should encourage students to follow the law.\",\"vi\":\"Trường học nên khuyến khích học sinh tuân thủ pháp luật.\"}},{\"id\":\"harsh|adj\",\"term\":\"harsh\",\"reading\":\"/hɑːʃ/\",\"meaning\":\"khắc nghiệt; nghiêm khắc\",\"definitionEn\":\"very severe or unkind\",\"lesson\":30,\"pos\":\"adj\",\"hint\":\"Hay đi với: a harsh punishment · harsh laws\",\"example\":{\"text\":\"Some people think harsh punishments are the best way to protect public safety.\",\"vi\":\"Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng.\"}},{\"id\":\"community-service|phr-n\",\"term\":\"community service\",\"reading\":\"/kəˌmjuː.nə.ti ˈsɜː.vɪs/\",\"meaning\":\"lao động công ích (hình phạt thay tù)\",\"definitionEn\":\"unpaid work in the local area as a punishment\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do community service · be sentenced to community service\"},{\"id\":\"freedom|n\",\"term\":\"freedom\",\"reading\":\"/ˈfriː.dəm/\",\"meaning\":\"sự tự do\",\"definitionEn\":\"the right to do what you want\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: FREE-dom — Hay đi với: personal freedom · freedom of speech\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"in-addition|idiom\",\"term\":\"in addition\",\"reading\":\"/ɪn əˈdɪʃ.ən/\",\"meaning\":\"thêm vào đó; ngoài ra\",\"definitionEn\":\"also; used to add another point\",\"lesson\":30,\"pos\":\"idiom\",\"hint\":\"Hay đi với: In addition, … · in addition to + N/V-ing\"},{\"id\":\"on-the-other-hand|idiom\",\"term\":\"on the other hand\",\"reading\":\"/ɒn ði ˈʌð.ər ˌhænd/\",\"meaning\":\"mặt khác (nêu ý đối lập)\",\"definitionEn\":\"used to introduce an opposite point\",\"lesson\":30,\"pos\":\"idiom\"},{\"id\":\"however|adv\",\"term\":\"however\",\"reading\":\"/haʊˈev.ər/\",\"meaning\":\"tuy nhiên\",\"definitionEn\":\"but; used to show contrast\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"hau-EV-ờ: nhấn âm 2. — Trọng âm: how-E-ver\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"therefore|adv\",\"term\":\"therefore\",\"reading\":\"/ˈðeə.fɔːr/\",\"meaning\":\"vì vậy; do đó\",\"definitionEn\":\"for that reason; as a result\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"Trọng âm: THERE-fore\",\"example\":{\"text\":\"Cameras record everything. Therefore, it is easier to find witnesses.\",\"vi\":\"Camera ghi lại mọi thứ. Vì vậy, việc tìm nhân chứng dễ hơn.\"}}],\"lesson\":{\"number\":30,\"title\":\"Tội phạm \u0026 pháp luật · Writing Task 2: Advantages / Disadvantages\"}}]\n"])</script><script>self.__next_f.push([1,"2e:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=30\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2f:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-30-toi-pham-writing-adv-disadv/pronunciation\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Phát âm\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Buổi 30: T
