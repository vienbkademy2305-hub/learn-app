 người lao động bị thay thế; mất việc (do công nghệ)\",\"extra\":\"/ˈdʒɒb dɪsˌpleɪs.mənt/\"},{\"group\":\"word\",\"text\":\"rely on\",\"vi\":\"dựa vào; phụ thuộc vào\",\"extra\":\"/rɪˈlaɪ ɒn/\"},{\"group\":\"word\",\"text\":\"reliance\",\"vi\":\"sự phụ thuộc\",\"extra\":\"/rɪˈlaɪ.əns/\"},{\"group\":\"word\",\"text\":\"digital divide\",\"vi\":\"khoảng cách số (giữa người có và không có công nghệ)\",\"extra\":\"/ˌdɪdʒ.ɪ.təl dɪˈvaɪd/\"},{\"group\":\"word\",\"text\":\"social isolation\",\"vi\":\"sự cô lập xã hội\",\"extra\":\"/ˌsəʊ.ʃəl ˌaɪ.səˈleɪ.ʃən/\"},{\"group\":\"word\",\"text\":\"convenience\",\"vi\":\"sự tiện lợi\",\"extra\":\"/kənˈviː.ni.əns/\"},{\"group\":\"word\",\"text\":\"innovation\",\"vi\":\"sự đổi mới; sáng kiến\",\"extra\":\"/ˌɪn.əˈveɪ.ʃən/\"},{\"group\":\"word\",\"text\":\"obsolete\",\"vi\":\"lỗi thời\",\"extra\":\"/ˈɒb.səl.iːt/\"},{\"group\":\"word\",\"text\":\"upskill\",\"vi\":\"nâng cao kỹ năng\",\"extra\":\"/ˈʌp.skɪl/\"},{\"group\":\"word\",\"text\":\"counterargument\",\"vi\":\"lập luận phản bác\",\"extra\":\"/ˈkaʊn.təˌrɑːɡ.jə.mənt/\"},{\"group\":\"word\",\"text\":\"perspective\",\"vi\":\"góc nhìn; quan điểm\",\"extra\":\"/pəˈspek.tɪv/\"},{\"group\":\"word\",\"text\":\"admittedly\",\"vi\":\"phải thừa nhận rằng\",\"extra\":\"/ədˈmɪt.ɪd.li/\"},{\"group\":\"word\",\"text\":\"having said that\",\"vi\":\"nói vậy chứ; dù vậy\",\"extra\":\"/ˌhæv.ɪŋ ˈsed ðæt/\"},{\"group\":\"word\",\"text\":\"valid\",\"vi\":\"có cơ sở; hợp lý (lập luận)\",\"extra\":\"/ˈvæl.ɪd/\"},{\"group\":\"word\",\"text\":\"overestimate\",\"vi\":\"đánh giá quá cao\",\"extra\":\"/ˌəʊ.vərˈes.tɪ.meɪt/\"},{\"group\":\"word\",\"text\":\"inevitable\",\"vi\":\"không thể tránh khỏi\",\"extra\":\"/ɪˈnev.ɪ.tə.bəl/\"},{\"group\":\"word\",\"text\":\"tech-savvy\",\"vi\":\"rành công nghệ\",\"extra\":\"/ˌtekˈsæv.i/\"},{\"group\":\"sentence\",\"text\":\"While it is true that automation causes job displacement, it also creates new kinds of work.\",\"vi\":\"Mặc dù đúng là tự động hóa khiến người lao động mất việc, nó cũng tạo ra những loại việc mới.\"},{\"group\":\"sentence\",\"text\":\"Admittedly, smartphones are convenient. However, our reliance on them may be harmful.\",\"vi\":\"Phải thừa nhận điện thoại thông minh rất tiện. Tuy nhiên, việc phụ thuộc vào chúng có thể có hại.\"},{\"group\":\"sentence\",\"text\":\"I can see why older people worry, but most young people are tech-savvy enough to stay safe online.\",\"vi\":\"Tôi hiểu vì sao người lớn tuổi lo lắng, nhưng phần lớn người trẻ đủ rành công nghệ để an toàn trên mạng.\"},{\"group\":\"sentence\",\"text\":\"That's a valid point. Having said that, I think we tend to overestimate the risks.\",\"vi\":\"Đó là một ý có cơ sở. Dù vậy, tôi nghĩ chúng ta thường đánh giá quá cao rủi ro.\"},{\"group\":\"sentence\",\"text\":\"Many older people rely on their children to use online banking.\",\"vi\":\"Nhiều người lớn tuổi phải dựa vào con cái để dùng ngân hàng trực tuyến.\"},{\"group\":\"sentence\",\"text\":\"The digital divide between cities and rural areas is still wide.\",\"vi\":\"Khoảng cách số giữa thành phố và nông thôn vẫn còn lớn.\"},{\"group\":\"sentence\",\"text\":\"Spending hours online can lead to social isolation, especially among teenagers.\",\"vi\":\"Dành hàng giờ trên mạng có thể dẫn đến cô lập xã hội, nhất là ở thanh thiếu niên.\"},{\"group\":\"sentence\",\"text\":\"Some skills will become obsolete, so workers need to upskill regularly.\",\"vi\":\"Một số kỹ năng sẽ trở nên lỗi thời, nên người lao động cần thường xuyên nâng cao kỹ năng.\"},{\"group\":\"sentence\",\"text\":\"It seems inevitable that technology will keep changing the way we work.\",\"vi\":\"Dường như không thể tránh khỏi việc công nghệ sẽ tiếp tục thay đổi cách chúng ta làm việc.\"},{\"group\":\"sentence\",\"text\":\"From an economic perspective, innovation is essential for growth.\",\"vi\":\"Từ góc độ kinh tế, đổi mới là yếu tố thiết yếu cho tăng trưởng.\"},{\"group\":\"sentence\",\"text\":\"A strong essay considers the counterargument before rejecting it.\",\"vi\":\"Một bài luận tốt cân nhắc lập luận phản bác trước khi bác bỏ nó.\"},{\"group\":\"sentence\",\"text\":\"The convenience of online shopping has changed the way people spend their weekends.\",\"vi\":\"Sự tiện lợi của mua sắm trực tuyến đã thay đổi cách mọi người dành thời gian cuối tuần.\"},{\"group\":\"dialogue\",\"text\":\"Some people say robots will take most jobs in the future. What's your view?\",\"vi\":\"Một số người nói robot sẽ lấy phần lớn việc làm trong tương lai. Quan điểm của bạn thế nào?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"I can see why people worry, because some jobs, like checking tickets, have already disappeared.\",\"vi\":\"Tôi hiểu vì sao người ta lo, vì một số việc, như soát vé, đã biến mất rồi.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"But I wouldn't go as far as saying robots will take most jobs. New technology usually creates new kinds of work too.\",\"vi\":\"Nhưng tôi không đến mức nói robot sẽ lấy phần lớn việc làm. Công nghệ mới thường cũng tạo ra những loại việc mới.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"But isn't it true that older workers find it hard to learn new skills?\",\"vi\":\"Nhưng chẳng phải người lao động lớn tuổi khó học kỹ năng mới sao?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"That's a valid point. Having said that, I think the problem is a lack of training, not age.\",\"vi\":\"Đó là ý có cơ sở. Nói vậy chứ, tôi nghĩ vấn đề là thiếu đào tạo, không phải tuổi tác.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"My uncle is fifty, and after a free course, he now manages the machines in his factory.\",\"vi\":\"Chú tôi năm mươi tuổi, sau một khóa học miễn phí, giờ chú quản lý máy móc trong nhà máy.\",\"extra\":\"Candidate\"},{\"group\":\"dialogue\",\"text\":\"So who should pay for that training?\",\"vi\":\"Vậy ai nên trả tiền cho việc đào tạo đó?\",\"extra\":\"Examiner\"},{\"group\":\"dialogue\",\"text\":\"Ideally both. Companies benefit directly, so they should pay part of it, and the government could help people who have already lost their jobs.\",\"vi\":\"Lý tưởng là cả hai. Công ty được lợi trực tiếp nên nên trả một phần, còn chính phủ có thể hỗ trợ những người đã mất việc.\",\"extra\":\"Candidate\"}],\"dialogue\":[{\"speaker\":\"Examiner\",\"text\":\"Some people say robots will take most jobs in the future. What's your view?\",\"vi\":\"Một số người nói robot sẽ lấy phần lớn việc làm trong tương lai. Quan điểm của bạn thế nào?\"},{\"speaker\":\"Candidate\",\"text\":\"I can see why people worry, because some jobs, like checking tickets, have already disappeared.\",\"vi\":\"Tôi hiểu vì sao người ta lo, vì một số việc, như soát vé, đã biến mất rồi.\"},{\"speaker\":\"Candidate\",\"text\":\"But I wouldn't go as far as saying robots will take most jobs. New technology usually creates new kinds of work too.\",\"vi\":\"Nhưng tôi không đến mức nói robot sẽ lấy phần lớn việc làm. Công nghệ mới thường cũng tạo ra những loại việc mới.\"},{\"speaker\":\"Examiner\",\"text\":\"But isn't it true that older workers find it hard to learn new skills?\",\"vi\":\"Nhưng chẳng phải người lao động lớn tuổi khó học kỹ năng mới sao?\"},{\"speaker\":\"Candidate\",\"text\":\"That's a valid point. Having said that, I think the problem is a lack of training, not age.\",\"vi\":\"Đó là ý có cơ sở. Nói vậy chứ, tôi nghĩ vấn đề là thiếu đào tạo, không phải tuổi tác.\"},{\"speaker\":\"Candidate\",\"text\":\"My uncle is fifty, and after a free course, he now manages the machines in his factory.\",\"vi\":\"Chú tôi năm mươi tuổi, sau một khóa học miễn phí, giờ chú quản lý máy móc trong nhà máy.\"},{\"speaker\":\"Examiner\",\"text\":\"So who should pay for that training?\",\"vi\":\"Vậy ai nên trả tiền cho việc đào tạo đó?\"},{\"speaker\":\"Candidate\",\"text\":\"Ideally both. Companies benefit directly, so they should pay part of it, and the government could help people who have already lost their jobs.\",\"vi\":\"Lý tưởng là cả hai. Công ty được lợi trực tiếp nên nên trả một phần, còn chính phủ có thể hỗ trợ những người đã mất việc.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-53-cong-nghe-speaking-part-3/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-53-cong-nghe-speaking-part-3/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n1b:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Luyện nói · Buổi 53 · Học tiếng Anh\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Học tiếng Anh cho người Việt theo lộ trình IELTS 6.5: từ vựng theo chủ đề có IPA, ngữ pháp, hội thoại, bài tập.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/learn-app/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\"
