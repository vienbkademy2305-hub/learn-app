i\":\"Nếu bố mẹ làm việc nhiều giờ, con cái sẽ ở một mình nhiều hơn.\"},{\"group\":\"sentence\",\"text\":\"If my grandparents live with us, they can help look after my little brother.\",\"vi\":\"Nếu ông bà sống cùng chúng tôi, ông bà có thể giúp trông em trai tôi.\"},{\"group\":\"sentence\",\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"},{\"group\":\"sentence\",\"text\":\"Children will learn responsibility if they do household chores.\",\"vi\":\"Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà.\"},{\"group\":\"sentence\",\"text\":\"In Vietnam, many people still live with their extended family.\",\"vi\":\"Ở Việt Nam, nhiều người vẫn sống cùng đại gia đình.\"},{\"group\":\"sentence\",\"text\":\"The nuclear family has become more common in big cities.\",\"vi\":\"Gia đình hạt nhân đã trở nên phổ biến hơn ở các thành phố lớn.\"},{\"group\":\"sentence\",\"text\":\"I was brought up by my grandmother because my parents worked abroad.\",\"vi\":\"Tôi được bà nuôi dạy vì bố mẹ tôi làm việc ở nước ngoài.\"},{\"group\":\"sentence\",\"text\":\"Many adults find it hard to have a good work-life balance.\",\"vi\":\"Nhiều người trưởng thành thấy khó cân bằng giữa công việc và cuộc sống.\"},{\"group\":\"sentence\",\"text\":\"In a close-knit family, everyone supports each other.\",\"vi\":\"Trong một gia đình gắn bó, mọi người đều hỗ trợ lẫn nhau.\"},{\"group\":\"sentence\",\"text\":\"Young people should respect traditional values, but they don't have to follow all of them.\",\"vi\":\"Người trẻ nên tôn trọng các giá trị truyền thống, nhưng không nhất thiết phải làm theo tất cả.\"},{\"group\":\"sentence\",\"text\":\"I get on well with my father, but we sometimes argue about my future.\",\"vi\":\"Tôi hòa hợp với bố, nhưng thỉnh thoảng hai bố con tranh cãi về tương lai của tôi.\"},{\"group\":\"sentence\",\"text\":\"When my father retires next year, he will spend more time with his elderly parents.\",\"vi\":\"Khi bố tôi nghỉ hưu vào năm sau, ông sẽ dành nhiều thời gian hơn cho ông bà nội đã cao tuổi.\"},{\"group\":\"dialogue\",\"text\":\"Mum looks really tired these days. She does all the household chores after work.\",\"vi\":\"Dạo này mẹ trông mệt lắm. Mẹ làm hết việc nhà sau giờ làm.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I know. If we share the chores, she'll have more time to rest.\",\"vi\":\"Tớ biết. Nếu tụi mình chia nhau việc nhà, mẹ sẽ có thêm thời gian nghỉ.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"OK. I'll do the washing-up every evening. What about you?\",\"vi\":\"Được. Tớ sẽ rửa bát mỗi tối. Còn cậu?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I can clean the house at the weekend. And Dad can do the shopping.\",\"vi\":\"Tớ có thể dọn nhà vào cuối tuần. Còn bố có thể đi chợ.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Dad works until nine. Unless he finishes earlier, he won't have time.\",\"vi\":\"Bố làm tới chín giờ. Trừ khi bố xong việc sớm hơn, không thì bố sẽ không có thời gian.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Then Grandma may help. She lives near the market.\",\"vi\":\"Vậy thì bà có thể giúp. Bà sống gần chợ mà.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Good idea. But she's elderly now, so we shouldn't ask her to carry heavy bags.\",\"vi\":\"Ý hay. Nhưng bà có tuổi rồi, nên mình không nên nhờ bà xách đồ nặng.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"True. Let's talk to Mum tonight. If she agrees, we'll start tomorrow.\",\"vi\":\"Đúng. Tối nay mình nói với mẹ. Nếu mẹ đồng ý, mai mình bắt đầu luôn.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Mum looks really tired these days. She does all the household chores after work.\",\"vi\":\"Dạo này mẹ trông mệt lắm. Mẹ làm hết việc nhà sau giờ làm.\"},{\"speaker\":\"B\",\"text\":\"I know. If we share the chores, she'll have more time to rest.\",\"vi\":\"Tớ biết. Nếu tụi mình chia nhau việc nhà, mẹ sẽ có thêm thời gian nghỉ.\"},{\"speaker\":\"A\",\"text\":\"OK. I'll do the washing-up every evening. What about you?\",\"vi\":\"Được. Tớ sẽ rửa bát mỗi tối. Còn cậu?\"},{\"speaker\":\"B\",\"text\":\"I can clean the house at the weekend. And Dad can do the shopping.\",\"vi\":\"Tớ có thể dọn nhà vào cuối tuần. Còn bố có thể đi chợ.\"},{\"speaker\":\"A\",\"text\":\"Dad works until nine. Unless he finishes earlier, he won't have time.\",\"vi\":\"Bố làm tới chín giờ. Trừ khi bố xong việc sớm hơn, không thì bố sẽ không có thời gian.\"},{\"speaker\":\"B\",\"text\":\"Then Grandma may help. She lives near the market.\",\"vi\":\"Vậy thì bà có thể giúp. Bà sống gần chợ mà.\"},{\"speaker\":\"A\",\"text\":\"Good idea. But she's elderly now, so we shouldn't ask her to carry heavy bags.\",\"vi\":\"Ý hay. Nhưng bà có tuổi rồi, nên mình không nên nhờ bà xách đồ nặng.\"},{\"speaker\":\"B\",\"text\":\"True. Let's talk to Mum tonight. If she agrees, we'll start tomorrow.\",\"vi\":\"Đúng. Tối nay mình nói với mẹ. Nếu mẹ đồng ý, mai mình bắt đầu luôn.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-31-gia-dinh-listening-multiple-choice/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-31-gia-dinh-listening-multiple-choice/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"m
