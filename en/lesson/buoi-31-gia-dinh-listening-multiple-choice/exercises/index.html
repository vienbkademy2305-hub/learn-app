At first, it was only for young mothers with babies, but now we welcome everyone, from teenagers to elderly people. Our most popular service used to be the free childcare, but these days more people come for our weekend workshops. Last year, the workshops were mainly about cooking, but this year we're focusing on communication between parents and teenagers, because many families told us the generation gap is their biggest problem. The workshops are free for members. If you aren't a member, they cost ten dollars each, and membership itself costs twenty dollars a year. Now, some of you have asked about volunteering. We need volunteers mainly to help elderly people with shopping. We don't need help with cleaning or cooking at the moment. If you're interested, please don't call the office — just talk to Linda at the front desk after this talk.\",\"questions\":[{\"q\":\"When the centre opened, it was for…\",\"options\":[\"elderly people\",\"young mothers\",\"teenagers\"],\"answer\":\"b\"},{\"q\":\"What do most people come to the centre for now?\",\"options\":[\"free childcare\",\"weekend workshops\",\"cheap meals\"],\"answer\":\"b\",\"explain_vi\":\"'used to be the free childcare, but these days more people come for our weekend workshops' — used to = trước đây.\"},{\"q\":\"This year, the workshops are mainly about…\",\"options\":[\"cooking\",\"communication in families\",\"looking after babies\"],\"answer\":\"b\",\"explain_vi\":\"'Last year … cooking, but this year … communication between parents and teenagers'. Bẫy thời gian: cooking là năm ngoái.\"},{\"q\":\"How much does a workshop cost for a non-member?\",\"options\":[\"nothing\",\"$$10\",\"$$20\"],\"answer\":\"b\",\"explain_vi\":\"$$20 là phí thành viên cả năm; $10 là giá một workshop cho người chưa là thành viên.\"},{\"q\":\"Volunteers are needed to…\",\"options\":[\"clean the centre\",\"cook meals\",\"help elderly people with shopping\"],\"answer\":\"c\"},{\"q\":\"People who want to volunteer should…\",\"options\":[\"call the office\",\"speak to Linda\",\"send an email\"],\"answer\":\"b\"}]},{\"id\":\"b31-x2\",\"bank_no\":20,\"kind\":\"mcq\",\"instructions_vi\":\"Nghe hai sinh viên bàn về bài thuyết trình (hội thoại kiểu Part 3, mỗi người một giọng) và chọn đáp án đúng.\",\"audio_text\":\"Anna: So, Tom, what topic shall we choose for our presentation on family life?\\nTom: I was thinking about single-parent families, but there's already a group doing that.\\nAnna: Right. What about work-life balance? Lots of parents work very long hours.\\nTom: Hmm, that's interesting, but I think the generation gap is better. We can interview our own grandparents.\\nAnna: Good point. OK, let's do that. How many people should we interview?\\nTom: Maybe ten? Actually, no. If we interview ten, we won't have time to analyse everything. Let's say six.\\nAnna: Fine. And what's the most surprising thing you found in your reading so far?\\nTom: Well, I expected older people to complain about technology. But in fact, most of them said the biggest problem is that young people don't have time to visit them.\\nAnna: That's sad. I think we should end the presentation with some ideas to bridge the gap, then.\",\"questions\":[{\"q\":\"Why don't they choose single-parent families?\",\"options\":[\"It is too difficult.\",\"Another group has chosen it.\",\"The teacher doesn't like it.\"],\"answer\":\"b\"},{\"q\":\"What topic do they finally choose?\",\"options\":[\"single-parent families\",\"work-life balance\",\"the generation gap\"],\"answer\":\"c\"},{\"q\":\"How many people will they interview?\",\"options\":[\"six\",\"ten\",\"sixteen\"],\"answer\":\"a\",\"explain_vi\":\"'Maybe ten? Actually, no … Let's say six.' — thông tin cuối cùng sau 'Actually'.\"},{\"q\":\"According to Tom's reading, what do older people complain about most?\",\"options\":[\"new technology\",\"young people not visiting them\",\"the cost of living\"],\"answer\":\"b\",\"explain_vi\":\"'I expected … technology. But in fact, most of them said …' — phương án A là điều Tom ĐOÁN, không phải kết quả.\"}]},{\"id\":\"b31-x3\",\"bank_no\":6,\"kind\":\"verb-form\",\"instructions_vi\":\"Chia động từ trong ngoặc theo câu điều kiện loại 1. Dùng will cho vế kết quả (trừ khi đề cho sẵn can/may).\",\"questions\":[{\"q\":\"If my mother (retire) ___ next year, she will look after my son.\",\"answer\":\"retires\"},{\"q\":\"If you share the household chores, your parents (be) ___ less tired.\",\"answer\":\"will be\",\"accept\":[\"'ll be\"]},{\"q\":\"Unless he (leave) ___ work earlier, he won't see his children before bedtime.\",\"answer\":\"leaves\"},{\"q\":\"The generation gap (not / get) ___ smaller if families don't talk more.\",\"answer\":\"won't get\",\"accept\":[\"will not get\"]},{\"q\":\"If grandparents (live) ___ with the family, children can learn traditional values.\",\"answer\":\"live\"},{\"q\":\"If Lan (not / finish) ___ her homework, her father won't let her go out.\",\"answer\":\"doesn't finish\",\"accept\":[\"does not finish\"]}]},{\"id\":\"b31-x4\",\"bank_no\":10,\"kind\":\"mcq\",\"instructions_vi\":\"Chọn đáp án đúng.\",\"questions\":[{\"q\":\"___ you tell your parents the truth, they will be angry.\",\"options\":[\"If\",\"Unless\",\"When\",\"Because\"],\"answer\":\"b\",\"explain_vi\":\"Unless = If … not: nếu bạn KHÔNG nói thật, bố mẹ sẽ giận.\"},{\"q\":\"If it ___ this weekend, we will visit our grandparents.\",\"options\":[\"won't rain\",\"doesn't rain\",\"didn't rain\",\"not rain\"],\"answer\":\"b\"},{\"q\":\"___ my brother finishes university next June, he will look for a job.\",\"options\":[\"Unless\",\"If not\",\"When\",\"Although\"],\"answer\":\"c\",\"explain_vi\":\"Việc chắc chắn sẽ xảy ra (tốt nghiệp vào tháng 6 tới) → when.\"},{\"q\":\"Which sentence is correct?\",\"options\":[\"If parents will spend more time at home, children will be happier.\",\"If parents spend more time at home, children will be happier.\",\"If parents spend more time at home children are happier will.\",\"Unless parents don't spend time at home, children will be sad.\"],\"answer\":\"b\"},{\"q\":\"Which sentence has the correct punctuation?\",\"options\":[\"If you respect your elders they will respect you.\",\"If you respect your elders, they will respect you.\",\"They will respect you, if you respect your elders.\",\"If you respect your elders. They will respect you.\"],\"answer\":\"b\",\"explain_vi\":\"If đứng đầu → dấu phẩy giữa hai vế. If đứng giữa → không dấu phẩy. Không tách thành hai câu.\"}]},{\"id\":\"b31-x5\",\"bank_no\":3,\"kind\":\"collocation\",\"instructions_vi\":\"Ghép động từ với cụm danh từ phù hợp.\",\"pairs\":[{\"left\":\"bridge\",\"right\":\"the generation gap\"},{\"left\":\"do\",\"right\":\"household chores\"},{\"left\":\"take\",\"right\":\"responsibility for your actions\"},{\"left\":\"support\",\"right\":\"your elderly parents\"},{\"left\":\"have\",\"right\":\"a good work-life balance\"},{\"left\":\"respect\",\"right\":\"other people's opinions\"}]},{\"id\":\"b31-x6\",\"bank_no\":2,\"kind\":\"match-definition\",\"instructions_vi\":\"Nối từ/cụm từ với định nghĩa tiếng Anh.\",\"pairs\":[{\"left\":\"nuclear family\",\"right\":\"parents and their children living together\"},{\"left\":\"extended family\",\"right\":\"a family that includes grandparents, aunts and uncles\"},{\"left\":\"close-knit\",\"right\":\"having strong relationships and helping each other\"},{\"left\":\"bring up\",\"right\":\"to look after a child until he or she is an adult\"},{\"left\":\"get on with\",\"right\":\"to have a friendly relationship with somebody\"},{\"left\":\"single parent\",\"right\":\"a mother or father who brings up a child alone\"}]},{\"id\":\"b31-x7\",\"bank_no\":2,\"kind\":\"match-definition\",\"instructions_vi\":\"Tín hiệu chuyển ý (signposting) giúp bạn biết bài nghe đang ở đâu. Nối mỗi cụm với chức năng của nó.\",\"pairs\":[{\"left\":\"Today I'm going to tell you about …\",\"right\":\"introducing the topic\"},{\"left\":\"Then … / After that …\",\"right\":\"showing the order of events\"},{\"left\":\"Don't forget to …\",\"right\":\"stressing important information\"},{\"left\":\"because / since / as\",\"right\":\"giving a reason\"},{\"left\":\"so that / in order to\",\"right\":\"giving a purpose\"},{\"left\":\"although / but / however\",\"right\":\"showing a contrast\"},{\"left\":\"Also … / In addition …\",\"right\":\"adding more information\"}]},{\"id\":\"b31-x8\",\"bank_no\":20,\"kind\":\"tf\",\"instructions_vi\":\"Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể (parents / grandparents) và mốc thời gian.\",\"audio_text\":\"In the past, most Vietnamese families were extended families, and three generations often lived under one roof. Grandparents looked after the children while the parents worked in the fields. Today, many young couples move to big cities for work, so the nuclear family has become more common. However, grandparents still play an important role. In many families, they come to the city to help with childcare. If this trend continues, experts say the relationship between grandparents and grandchildren will stay strong.\",\"questions\":[{\"q\":\"In the past, three generations often lived together.\",\"answer\":\"T\"},{\"q\":\"In the past, parents looked after the children while grandparents worked.\",\"answer\":\"F\",\"explain_vi\":\"Đảo chủ thể: ông bà trông cháu, bố mẹ làm đồng.\"},{\"q\":\"Today, the extended family has become more common.\",\"answer\":\"F\"},{\"q\":\"Many grandparents move to the city to help with childcare.\",\"answer\":\"T\"},{\"q\":\"Experts think the relationship between grandparents and grandchildren will become weaker.\",\"answer\":\"F\"}]}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap
