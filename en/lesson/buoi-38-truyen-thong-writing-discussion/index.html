/\",\"meaning\":\"quá đông đúc\",\"definitionEn\":\"having too many people\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: o-ver-CROW-ded — Hay đi với: overcrowded streets · become overcrowded\",\"example\":{\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"}},{\"id\":\"authentic|adj\",\"term\":\"authentic\",\"reading\":\"/ɔːˈθen.tɪk/\",\"meaning\":\"đích thực; nguyên bản\",\"definitionEn\":\"real and original, not a copy\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: au-THEN-tic — Hay đi với: authentic local food · an authentic experience\",\"example\":{\"text\":\"If I were you, I would try authentic local food instead of pizza.\",\"vi\":\"Nếu tôi là bạn, tôi sẽ thử món ăn địa phương đích thực thay vì pizza.\"}},{\"id\":\"local-resident|phr-n\",\"term\":\"local resident\",\"reading\":\"/ˌləʊ.kəl ˈrez.ɪ.dənt/\",\"meaning\":\"cư dân địa phương\",\"definitionEn\":\"a person who lives in a particular area\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: local residents complain about · the needs of local residents\"},{\"id\":\"restore|v\",\"term\":\"restore\",\"reading\":\"/rɪˈstɔːr/\",\"meaning\":\"trùng tu; khôi phục\",\"definitionEn\":\"to repair something old to its original condition\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: re-STORE — Hay đi với: restore an old house · be carefully restored\",\"example\":{\"text\":\"The government has spent a lot of money to restore the old temples.\",\"vi\":\"Chính phủ đã chi nhiều tiền để trùng tu các ngôi chùa cổ.\"}},{\"id\":\"damage|v\",\"term\":\"damage\",\"reading\":\"/ˈdæm.ɪdʒ/\",\"meaning\":\"làm hư hại\",\"definitionEn\":\"to harm or break something\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: DAM-age — Hay đi với: damage old buildings · be badly damaged\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"unique|adj\",\"term\":\"unique\",\"reading\":\"/juːˈniːk/\",\"meaning\":\"độc nhất; độc đáo\",\"definitionEn\":\"being the only one of its kind\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: u-NIQUE — Hay đi với: a unique culture · unique to this region\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"festival|n\",\"term\":\"festival\",\"reading\":\"/ˈfes.tɪ.vəl/\",\"meaning\":\"lễ hội\",\"definitionEn\":\"a special time of celebration\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: a lantern festival · hold a festival\",\"example\":{\"text\":\"Critics say the festival has become too commercialised.\",\"vi\":\"Những người chỉ trích nói lễ hội đã bị thương mại hóa quá mức.\"}},{\"id\":\"bar-chart|phr-n\",\"term\":\"bar chart\",\"reading\":\"/ˈbɑː ˌtʃɑːt/\",\"meaning\":\"biểu đồ cột\",\"definitionEn\":\"a graph that uses rectangles of different heights to compare amounts\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the bar chart compares · the bar chart shows\"},{\"id\":\"destination|n\",\"term\":\"destination\",\"reading\":\"/ˌdes.tɪˈneɪ.ʃən/\",\"meaning\":\"điểm đến\",\"definitionEn\":\"the place where someone is going\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: des-ti-NA-tion — Hay đi với: a popular tourist destination · a holiday destination\",\"example\":{\"text\":\"Da Nang was the second most popular destination in both years.\",\"vi\":\"Đà Nẵng là điểm đến được ưa chuộng thứ hai trong cả hai năm.\"}},{\"id\":\"visitor|n\",\"term\":\"visitor\",\"reading\":\"/ˈvɪz.ɪ.tər/\",\"meaning\":\"khách tham quan; du khách\",\"definitionEn\":\"a person who comes to see a place or person\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Hay đi với: attract visitors · international visitors\"},{\"id\":\"international|adj\",\"term\":\"international\",\"reading\":\"/ˌɪn.təˈnæʃ.ən.əl/\",\"meaning\":\"quốc tế\",\"definitionEn\":\"involving more than one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-ter-NA-tion-al — Hay đi với: international tourists · international flights\",\"example\":{\"text\":\"In 2023, Hanoi received twice as many international visitors as Hue.\",\"vi\":\"Năm 2023, Hà Nội đón lượng khách quốc tế gấp đôi Huế.\"}},{\"id\":\"domestic|adj\",\"term\":\"domestic\",\"reading\":\"/dəˈmes.tɪk/\",\"meaning\":\"trong nước; nội địa\",\"definitionEn\":\"within one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: do-MES-tic — Hay đi với: domestic tourists · domestic flights\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"accommodation|n\",\"term\":\"accommodation\",\"reading\":\"/əˌkɒm.əˈdeɪ.ʃən/\",\"meaning\":\"chỗ ở (khách sạn, nhà nghỉ…)\",\"definitionEn\":\"a place to stay, e.g. a hotel\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"2 chữ c, 2 chữ m: ac-COM-MO-da-tion. — Trọng âm: ac-com-mo-DA-tion — Hay đi với: spend money on accommodation · cheap accommodation\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"tourist-attraction|phr-n\",\"term\":\"tourist attraction\",\"reading\":\"/ˈtʊə.rɪst əˌtræk.ʃən/\",\"meaning\":\"điểm tham quan du lịch\",\"definitionEn\":\"a place that many travellers visit\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a major tourist attraction · visit tourist attractions\"},{\"id\":\"expenditure|n\",\"term\":\"expenditure\",\"reading\":\"/ɪkˈspen.dɪ.tʃər/\",\"meaning\":\"khoản chi tiêu\",\"definitionEn\":\"the amount of money spent\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-PEN-di-ture — Hay đi với: expenditure on food · total expenditure\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"category|n\",\"term\":\"category\",\"reading\":\"/ˈkæt.ə.ɡər.i/\",\"meaning\":\"hạng mục; loại\",\"definitionEn\":\"a group of things of the same type\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"KAT-ờ-gờ-ri: nhấn âm đầu. — Trọng âm: CAT-e-go-ry — Hay đi với: in each category · the largest category\",\"example\":{\"text\":\"Accommodation was the largest category of spending. In contrast, shopping was the smallest.\",\"vi\":\"Chỗ ở là hạng mục chi tiêu lớn nhất. Ngược lại, mua sắm là nhỏ nhất.\"}},{\"id\":\"region|n\",\"term\":\"region\",\"reading\":\"/ˈriː.dʒən/\",\"meaning\":\"vùng; khu vực\",\"definitionEn\":\"a large area of a country or the world\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Hay đi với: the northern region · in the Mekong Delta region\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"popular|adj\",\"term\":\"popular\",\"reading\":\"/ˈpɒp.jə.lər/\",\"meaning\":\"phổ biến; được ưa chuộng\",\"definitionEn\":\"liked by many people\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: POP-u-lar — Hay đi với: the most popular destination · popular with young people\",\"example\":{\"text\":\"Beef noodle soup is very popular in Hanoi.\",\"vi\":\"Phở bò rất được ưa chuộng ở Hà Nội.\"}},{\"id\":\"double|v\",\"term\":\"double\",\"reading\":\"/ˈdʌb.əl/\",\"meaning\":\"tăng gấp đôi\",\"definitionEn\":\"to become twice as large\",\"lesson\":34,\"pos\":\"v\",\"hint\":\"Hay đi với: double in size · the number doubled\"},{\"id\":\"approximately|adv\",\"term\":\"approximately\",\"reading\":\"/əˈprɒk.sɪ.mət.li/\",\"meaning\":\"xấp xỉ; khoảng\",\"definitionEn\":\"about; close to an exact number\",\"lesson\":34,\"pos\":\"adv\",\"hint\":\"Trọng âm: ap-PROX-i-mate-ly — Hay đi với: approximately 40% · approximately half\",\"example\":{\"text\":\"Approximately 40% of visitors spent their money on tourist attractions.\",\"vi\":\"Khoảng 40% du khách chi tiền cho các điểm tham quan.\"}},{\"id\":\"respectively|adv\",\"term\":\"respectively\",\"reading\":\"/rɪˈspek.tɪv.li/\",\"meaning\":\"lần lượt; tương ứng\",\"definitionEn\":\"in the same order as the things just mentioned\",\"lesson\":34,\"pos\":\"adv\",\"hint\":\"Trọng âm: re-SPEC-tive-ly — Hay đi với: A and B were 20% and 30%, respectively\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"whereas|conj\",\"term\":\"whereas\",\"reading\":\"/weərˈæz/\",\"meaning\":\"trong khi (đối lập)\",\"definitionEn\":\"while; used to compare two different facts\",\"lesson\":34,\"pos\":\"conj\",\"hint\":\"weờ-AZ: nhấn âm cuối. — Trọng âm: where-AS — Hay đi với: …, whereas …\",\"example\":{\"text\":\"Some countries have strict drug laws, whereas others focus on treatment.\",\"vi\":\"Một số nước có luật ma túy nghiêm khắc, trong khi những nước khác tập trung vào điều trị.\"}},{\"id\":\"compared-with|colloc\",\"term\":\"compared with\",\"reading\":\"/kəmˈpeəd wɪð/\",\"meaning\":\"so với\",\"definitionEn\":\"used to show how two things differ\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: compared with last year · compared to 2010\"},{\"id\":\"in-contrast|idiom\",\"term\":\"in contrast\",\"reading\":\"/ɪn ˈkɒn.trɑːst/\",\"meaning\":\"ngược lại\",\"definitionEn\":\"used to show a big difference\",\"lesson\":34,\"pos\":\"idiom\"},{\"id\":\"similarly|adv\",\"term\":\"similarly\",\"reading\":\"/ˈsɪm.ɪ.lə.li/\",\"meaning\":\"tương tự như vậy\",\"definitionEn\":\"in the same way\",\"lesson\":34,\"pos\":\"adv\",\"example\":{\"text\":\"The northern region attracted fewer foreign tourists than the south. Similarly, it had fewer hotels.\",\"vi\":\"Miền Bắc thu hút ít khách nước ngoài hơn miền Nam. Tương tự, miền Bắc có ít khách sạn hơn.\"}},{\"id\":\"the-majority-of|colloc\",\"term\":\"the majority of\",\"reading\":\"/ðə məˈdʒɒr.ə.ti əv/\",\"meaning\":\"phần lớn; đa số\",\"definitionEn\":\"most of a group\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: the majority of tourists · a large majority of\"},{\"id\":\"urbanisation|n\",\"term\":\"urbanisation\",\"reading\":\"/ˌɜː.bən.aɪˈzeɪ.ʃən/\",\"meaning\":\"đô thị hóa\",\"definitionEn\":\"the process of more people moving to live in cities\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: ur-ban-i-SA-tion — Hay đi với: rapid urbanisation · the effects of urbanisation\",\"example\":{\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"}},{\"id\":\"urban|adj\",\"term\":\"urban\",\"reading\":\"/ˈɜː.bən/\",\"meaning\":\"thuộc đô thị; thành thị\",\"definitionEn\":\"connected with towns or cities\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: urban areas · urban life\",\"example\":{\"text\":\"Urban areas offer better services, but rural life is quieter and cheaper.\",\"vi\":\"Khu đô thị có dịch vụ tốt hơn, nhưng cuộc sống nông thôn yên tĩnh và rẻ hơn.\"}},{\"id\":\"rural|adj\",\"term\":\"rural\",\"reading\":\"/ˈrʊə.rəl/\",\"meaning\":\"thuộc nông thôn\",\"definitionEn\":\"connected with the countryside\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: rural areas · rural-urban migration\",\"example\":{\"text\":\"The officer asked us if we had moved from a rural area.\",\"vi\":\"Cán bộ hỏi chúng tôi có phải đã chuyển đến từ vùng nông thôn không.\"}},{\"id\":\"urban-sprawl|phr-n\",\"term\":\"urban sprawl\",\"reading\":\"/ˌɜː.bən ˈsprɔːl/\",\"meaning\":\"sự lan rộng tràn lan của đô thị ra vùng ven\",\"definitionEn\":\"uncontrolled spread of a city into surrounding land\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: control urban sprawl · the problem of urban sprawl\"},{\"id\":\"infrastructure|n\",\"term\":\"infrastructure\",\"reading\":\"/ˈɪn.frəˌstrʌk.tʃər/\",\"meaning\":\"cơ sở hạ tầng\",\"definitionEn\":\"basic systems a country needs, e.g. roads and power\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-fra-struc-ture — Hay đi với: invest in infrastructure · poor infrastructure\",\"example\":{\"text\":\"If the city doesn't invest in infrastructure, urban sprawl will get worse.\",\"vi\":\"Nếu thành phố không đầu tư vào cơ sở hạ tầng, tình trạng đô thị lan tràn sẽ trầm trọng hơn.\"}},{\"id\":\"traffic-congestion|phr-n\",\"term\":\"traffic congestion\",\"reading\":\"/ˈtræf.ɪk kənˌdʒes.tʃən/\",\"meaning\":\"ùn tắc giao thông\",\"definitionEn\":\"too many vehicles on the roads, causing delays\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce traffic congestion · heavy traffic congestion\"},{\"id\":\"housing|n\",\"term\":\"housing\",\"reading\":\"/ˈhaʊ.zɪŋ/\",\"meaning\":\"nhà ở (nói chung)\",\"definitionEn\":\"houses and flats for people to live in\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: affordable housing · housing costs\",\"example\":{\"text\":\"Housing was by far the largest expense in all three countries.\",\"vi\":\"Nhà ở là khoản chi lớn nhất với cách biệt xa ở cả ba nước.\"}},{\"id\":\"rent|n\",\"term\":\"rent\",\"reading\":\"/rent/\",\"meaning\":\"tiền thuê nhà\",\"definitionEn\":\"money you pay regularly to live in someone's property\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: pay the rent · high rents\"},{\"id\":\"migrate|v\",\"term\":\"migrate\",\"reading\":\"/maɪˈɡreɪt/\",\"meaning\":\"di cư; chuyển đến nơi khác (để sống, làm việc)\",\"definitionEn\":\"to move to another place to live or work\",\"lesson\":35,\"pos\":\"v\",\"hint\":\"Hay đi với: migrate to the cities · migrate from rural areas\",\"example\":{\"text\":\"Every year, thousands of young people migrate from the countryside to big cities.\",\"vi\":\"Mỗi năm, hàng nghìn người trẻ di cư từ nông thôn lên các thành phố lớn.\"}},{\"id\":\"migration|n\",\"term\":\"migration\",\"reading\":\"/maɪˈɡreɪ.ʃən/\",\"meaning\":\"sự di cư\",\"definitionEn\":\"the movement of people from one place to another\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: mi-GRA-tion — Hay đi với: rural-urban migration · mass migration\",\"example\":{\"text\":\"The main reason for rural-urban migration is the lack of job opportunities in the countryside.\",\"vi\":\"Lý do chính của di cư từ nông thôn ra thành thị là thiếu cơ hội việc làm ở nông thôn.\"}},{\"id\":\"population|n\",\"term\":\"population\",\"reading\":\"/ˌpɒp.jəˈleɪ.ʃən/\",\"meaning\":\"dân số\",\"definitionEn\":\"the number of people living in an area\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: pop-u-LA-tion — Hay đi với: a growing population · the population of Hanoi\",\"example\":{\"text\":\"The population of Ho Chi Minh City has grown very quickly since 2000.\",\"vi\":\"Dân số Thành phố Hồ Chí Minh đã tăng rất nhanh kể từ năm 2000.\"}},{\"id\":\"high-rise|adj\",\"term\":\"high-rise\",\"reading\":\"/ˈhaɪ.raɪz/\",\"meaning\":\"cao tầng\",\"definitionEn\":\"(of a building) very tall with many floors\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: high-rise buildings · high-rise apartments\"},{\"id\":\"suburb|n\",\"term\":\"suburb\",\"reading\":\"/ˈsʌb.ɜːb/\",\"meaning\":\"vùng ngoại ô\",\"definitionEn\":\"an area where people live outside the centre of a city\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: live in the suburbs · a quiet suburb\"},{\"id\":\"city-centre|phr-n\",\"term\":\"city centre\",\"reading\":\"/ˌsɪt.i ˈsen.tər/\",\"meaning\":\"trung tâm thành phố\",\"definitionEn\":\"the main business and shopping area of a city\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: in the city centre · move out of the city centre\"},{\"id\":\"cost-of-living|phr-n\",\"term\":\"cost of living\",\"reading\":\"/ˌkɒst əv ˈlɪv.ɪŋ/\",\"meaning\":\"chi phí sinh hoạt\",\"definitionEn\":\"the money needed for food, housing and other basics\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the high cost of living · the cost of living in big cities\"},{\"id\":\"job-opportunity|phr-n\",\"term\":\"job opportunity\",\"reading\":\"/ˈdʒɒb ɒp.əˌtjuː.nə.ti/\",\"meaning\":\"cơ hội việc làm\",\"definitionEn\":\"a chance to get work\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: more job opportunities · create job opportunities\"},{\"id\":\"skyscraper|n\",\"term\":\"skyscraper\",\"reading\":\"/ˈskaɪˌskreɪ.pər/\",\"meaning\":\"nhà chọc trời\",\"definitionEn\":\"an extremely tall building\",\"lesson\":35,\"pos\":\"n\"},{\"id\":\"neighbourhood|n\",\"term\":\"neighbourhood\",\"reading\":\"/ˈneɪ.bə.hʊd/\",\"meaning\":\"khu phố; khu dân cư\",\"definitionEn\":\"the area around your home\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"NEI-bờ-hud: gh câm. — Trọng âm: NEIGH-bour-hood — Hay đi với: a friendly neighbourhood · in my neighbourhood\",\"example\":{\"text\":\"She mentioned that her neighbourhood didn't have any green spaces.\",\"vi\":\"Cô ấy nhắc rằng khu phố của cô không có mảng xanh nào.\"}},{\"id\":\"mention|v\",\"term\":\"mention\",\"reading\":\"/ˈmen.ʃən/\",\"meaning\":\"nhắc đến; đề cập\",\"definitionEn\":\"to talk about something briefly\",\"lesson\":35,\"pos\":\"v\",\"hint\":\"MEN-shờn: -tion đọc shờn. — Hay đi với: mention a problem · as I mentioned\"},{\"id\":\"vibrant|adj\",\"term\":\"vibrant\",\"reading\":\"/ˈvaɪ.brənt/\",\"meaning\":\"sôi động; đầy sức sống\",\"definitionEn\":\"full of energy and excitement\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a vibrant city · vibrant nightlife\",\"example\":{\"text\":\"Ho Chi Minh City is a vibrant city with exciting nightlife.\",\"vi\":\"Thành phố Hồ Chí Minh là một thành phố sôi động với cuộc sống về đêm hấp dẫn.\"}},{\"id\":\"lively|adj\",\"term\":\"lively\",\"reading\":\"/ˈlaɪv.li/\",\"meaning\":\"náo nhiệt; sinh động\",\"definitionEn\":\"full of activity and energy\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a lively street · a lively atmosphere\",\"example\":{\"text\":\"The old quarter is famous for its street food and lively atmosphere.\",\"vi\":\"Phố cổ nổi tiếng với đồ ăn đường phố và không khí náo nhiệt.\"}},{\"id\":\"nightlife|n\",\"term\":\"nightlife\",\"reading\":\"/ˈnaɪt.laɪf/\",\"meaning\":\"cuộc sống về đêm (hoạt động vui chơi buổi tối)\",\"definitionEn\":\"entertainment available in the evening, e.g. bars\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: exciting nightlife · the city's nightlife\",\"example\":{\"text\":\"Ho Chi Minh City is a vibrant city with exciting nightlife.\",\"vi\":\"Thành phố Hồ Chí Minh là một thành phố sôi động với cuộc sống về đêm hấp dẫn.\"}},{\"id\":\"street-food|phr-n\",\"term\":\"street food\",\"reading\":\"/ˈstriːt ˌfuːd/\",\"meaning\":\"đồ ăn đường phố\",\"definitionEn\":\"cheap meals sold from stalls by the road\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: famous for its street food · try street food\"},{\"id\":\"district|n\",\"term\":\"district\",\"reading\":\"/ˈdɪs.trɪkt/\",\"meaning\":\"quận; khu vực\",\"definitionEn\":\"an area of a city or country\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: District 1 · the business district\",\"example\":{\"text\":\"My district has lots of cafés as well as a big shopping mall.\",\"vi\":\"Quận của tôi có nhiều quán cà phê cũng như một trung tâm thương mại lớn.\"}},{\"id\":\"pedestrian|n\",\"term\":\"pedestrian\",\"reading\":\"/pəˈdes.tri.ən/\",\"meaning\":\"người đi bộ\",\"definitionEn\":\"a person who is walking in the street\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Trọng âm: pe-DES-tri-an — Hay đi với: a pedestrian street · pedestrian zone\",\"example\":{\"text\":\"On weekend evenings, the street around the lake becomes a pedestrian zone.\",\"vi\":\"Vào tối cuối tuần, con phố quanh hồ trở thành khu đi bộ.\"}},{\"id\":\"spacious|adj\",\"term\":\"spacious\",\"reading\":\"/ˈspeɪ.ʃəs/\",\"meaning\":\"rộng rãi\",\"definitionEn\":\"having a lot of space\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a spacious park · spacious streets\",\"example\":{\"text\":\"The new park is spacious and green. Besides, it's free for everyone.\",\"vi\":\"Công viên mới rộng rãi và xanh mát. Hơn nữa, nó miễn phí cho mọi người.\"}},{\"id\":\"amenity|n\",\"term\":\"amenity\",\"reading\":\"/əˈmiː.nə.ti/\",\"meaning\":\"tiện ích (công viên, bệnh viện, cửa hàng…)\",\"definitionEn\":\"a useful service or building, e.g. a park or hospital\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: local amenities · modern amenities\"},{\"id\":\"modern|adj\",\"term\":\"modern\",\"reading\":\"/ˈmɒd.ən/\",\"meaning\":\"hiện đại\",\"definitionEn\":\"new and using the latest ideas\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Trọng âm: MOD-ern — Hay đi với: modern buildings · a modern city\",\"example\":{\"text\":\"People think Hanoi is very old, but actually some areas are very modern.\",\"vi\":\"Mọi người nghĩ Hà Nội rất cổ kính, nhưng thật ra có những khu rất hiện đại.\"}},{\"id\":\"get-around|phr-v\",\"term\":\"get around\",\"reading\":\"/ˌɡet əˈraʊnd/\",\"meaning\":\"đi lại (trong một khu vực)\",\"definitionEn\":\"to travel from place to place in an area\",\"lesson\":36,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: easy to get around · get around by motorbike\"},{\"id\":\"walking-distance|phr-n\",\"term\":\"walking distance\",\"reading\":\"/ˈwɔː.kɪŋ ˌdɪs.təns/\",\"meaning\":\"khoảng cách đi bộ được\",\"definitionEn\":\"near enough to reach by walking\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: within walking distance of · a short walking distance\"},{\"id\":\"shopping-mall|phr-n\",\"term\":\"shopping mall\",\"reading\":\"/ˈʃɒp.ɪŋ ˌmɔːl/\",\"meaning\":\"trung tâm thương mại\",\"definitionEn\":\"a large indoor building with many shops\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: go to the shopping mall · a huge shopping mall\"},{\"id\":\"hustle-and-bustle|idiom\",\"term\":\"hustle and bustle\",\"reading\":\"/ˌhʌs.əl ən ˈbʌs.əl/\",\"meaning\":\"sự hối hả; nhộn nhịp\",\"definitionEn\":\"busy noisy activity\",\"lesson\":36,\"pos\":\"idiom\",\"hint\":\"Hay đi với: the hustle and bustle of city life · escape the hustle and bustle\"},{\"id\":\"quality-of-life|phr-n\",\"term\":\"quality of life\",\"reading\":\"/ˌkwɒl.ə.ti əv ˈlaɪf/\",\"meaning\":\"chất lượng cuộc sống\",\"definitionEn\":\"how good and comfortable a person's life is\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve the quality of life · a high quality of life\"},{\"id\":\"besides|adv\",\"term\":\"besides\",\"reading\":\"/bɪˈsaɪdz/\",\"meaning\":\"ngoài ra; hơn nữa\",\"definitionEn\":\"also; in addition\",\"lesson\":36,\"pos\":\"adv\",\"example\":{\"text\":\"The new park is spacious and green. Besides, it's free for everyone.\",\"vi\":\"Công viên mới rộng rãi và xanh mát. Hơn nữa, nó miễn phí cho mọi người.\"}},{\"id\":\"apart-from|prep\",\"term\":\"apart from\",\"reading\":\"/əˈpɑːt frəm/\",\"meaning\":\"ngoài … ra; trừ …\",\"definitionEn\":\"except for; or in addition to\",\"lesson\":36,\"pos\":\"prep\",\"hint\":\"Hay đi với: apart from that · apart from the traffic\"},{\"id\":\"as-well-as|prep\",\"term\":\"as well as\",\"reading\":\"/əz ˈwel əz/\",\"meaning\":\"cũng như; bên cạnh\",\"definitionEn\":\"and also\",\"lesson\":36,\"pos\":\"prep\",\"hint\":\"Hay đi với: cafés as well as restaurants\"},{\"id\":\"actually|adv\",\"term\":\"actually\",\"reading\":\"/ˈæk.tʃu.ə.li/\",\"meaning\":\"thật ra; thực ra\",\"definitionEn\":\"used to say what is really true\",\"lesson\":36,\"pos\":\"adv\",\"hint\":\"Trọng âm: AC-tu-al-ly\",\"example\":{\"text\":\"Overusing linking words can actually weaken cohesion.\",\"vi\":\"Lạm dụng từ nối thực ra có thể làm yếu tính liên kết.\"}},{\"id\":\"to-be-honest|idiom\",\"term\":\"to be honest\",\"reading\":\"/tə bi ˈɒn.ɪst/\",\"meaning\":\"thật lòng mà nói\",\"definitionEn\":\"used to say what you really think\",\"lesson\":36,\"pos\":\"idiom\"},{\"id\":\"mainstream-media|phr-n\",\"term\":\"mainstream media\",\"reading\":\"/ˌmeɪn.striːm ˈmiː.di.ə/\",\"meaning\":\"truyền thông chính thống (báo, đài lớn)\",\"definitionEn\":\"large, well-known newspapers and TV channels\",\"lesson\":37,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: trust the mainstream media · reported by the mainstream media\"},{\"id\":\"misinformation|n\",\"term\":\"misinformation\",\"reading\":\"/ˌmɪs.ɪn.fəˈmeɪ.ʃən/\",\"meaning\":\"thông tin sai lệch\",\"definitionEn\":\"false or wrong information\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: mis-in-for-MA-tion — Hay đi với: spread misinformation · a source of misinformation\",\"example\":{\"text\":\"Misinformation often spreads faster than the truth on social media.\",\"vi\":\"Thông tin sai lệch thường lan nhanh hơn sự thật trên mạng xã hội.\"}},{\"id\":\"media-literacy|phr-n\",\"term\":\"media literacy\",\"reading\":\"/ˌmiː.di.ə ˈlɪt.ər.ə.si/\",\"meaning\":\"năng lực hiểu và đánh giá thông tin truyền thông\",\"definitionEn\":\"the ability to judge news and media critically\",\"lesson\":37,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: teach media literacy · improve media literacy\"},{\"id\":\"journalist|n\",\"term\":\"journalist\",\"reading\":\"/ˈdʒɜː.nə.lɪst/\",\"meaning\":\"nhà báo\",\"definitionEn\":\"a person who writes news reports\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"JƠ-nờ-list: j ở đầu. — Trọng âm: JOUR-nal-ist — Hay đi với: a professional journalist · journalists report\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"headline|n\",\"term\":\"headline\",\"reading\":\"/ˈhed.laɪn/\",\"meaning\":\"tiêu đề (bài báo)\",\"definitionEn\":\"the title of a news story in large letters\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a shocking headline · read only the headlines\",\"example\":{\"text\":\"Although the headline was false, the story spread very quickly online.\",\"vi\":\"Mặc dù tiêu đề là sai sự thật, câu chuyện vẫn lan truyền rất nhanh trên mạng.\"}},{\"id\":\"source|n\",\"term\":\"source\",\"reading\":\"/sɔːs/\",\"meaning\":\"nguồn (thông tin)\",\"definitionEn\":\"where information comes from\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a reliable source · check the source\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"reliable|adj\",\"term\":\"reliable\",\"reading\":\"/rɪˈlaɪ.ə.bəl/\",\"meaning\":\"đáng tin cậy\",\"definitionEn\":\"able to be trusted\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-LI-a-ble — Hay đi với: a reliable source · reliable information\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"spread|v\",\"term\":\"spread\",\"reading\":\"/spred/\",\"meaning\":\"lan truyền; lan rộng\",\"definitionEn\":\"to move to more places or people\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: spread quickly · spread fake news\",\"example\":{\"text\":\"The report said that misinformation had spread faster than the truth.\",\"vi\":\"Báo cáo nói rằng thông tin sai lệch đã lan nhanh hơn sự thật.\"}},{\"id\":\"publish|v\",\"term\":\"publish\",\"reading\":\"/ˈpʌb.lɪʃ/\",\"meaning\":\"đăng; xuất bản\",\"definitionEn\":\"to make a book, article or post available to the public\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: publish an article · be published online\"},{\"id\":\"audience|n\",\"term\":\"audience\",\"reading\":\"/ˈɔː.di.əns/\",\"meaning\":\"khán giả; độc giả\",\"definitionEn\":\"the people who watch, read or listen to something\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"AW-di-ờns: nhấn âm đầu. — Trọng âm: AU-di-ence — Hay đi với: a large audience · reach a young audience\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"viral|adj\",\"term\":\"viral\",\"reading\":\"/ˈvaɪə.rəl/\",\"meaning\":\"lan truyền rất nhanh trên mạng\",\"definitionEn\":\"spreading very quickly online\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Hay đi với: go viral · a viral video\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"platform|n\",\"term\":\"platform\",\"reading\":\"/ˈplæt.fɔːm/\",\"meaning\":\"nền tảng (mạng xã hội, trực tuyến)\",\"definitionEn\":\"a website or app where people share content\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: social media platforms · online platforms\"},{\"id\":\"influencer|n\",\"term\":\"influencer\",\"reading\":\"/ˈɪn.flu.ən.sər/\",\"meaning\":\"người có ảnh hưởng trên mạng\",\"definitionEn\":\"a person paid to promote products to their online followers\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-flu-en-cer — Hay đi với: a social media influencer · follow influencers\"},{\"id\":\"fact-check|v\",\"term\":\"fact-check\",\"reading\":\"/ˈfækt.tʃek/\",\"meaning\":\"kiểm chứng thông tin\",\"definitionEn\":\"to make sure information is true before using it\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: fact-check a story · fact-checking websites\"},{\"id\":\"although|conj\",\"term\":\"although\",\"reading\":\"/ɔːlˈðəʊ/\",\"meaning\":\"mặc dù (+ mệnh đề)\",\"definitionEn\":\"used before a clause that contrasts with the main idea\",\"lesson\":37,\"pos\":\"conj\",\"hint\":\"Trọng âm: al-THOUGH\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"even-though|conj\",\"term\":\"even though\",\"reading\":\"/ˌiː.vən ˈðəʊ/\",\"meaning\":\"mặc dù (nhấn mạnh hơn although)\",\"definitionEn\":\"a stronger way of saying 'although'\",\"lesson\":37,\"pos\":\"conj\"},{\"id\":\"despite|prep\",\"term\":\"despite\",\"reading\":\"/dɪˈspaɪt/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being stopped by (used before a noun)\",\"lesson\":37,\"pos\":\"prep\",\"hint\":\"Trọng âm: de-SPITE\",\"example\":{\"text\":\"Despite the warnings, many people shared the video without checking it.\",\"vi\":\"Bất chấp những lời cảnh báo, nhiều người vẫn chia sẻ video mà không kiểm tra.\"}},{\"id\":\"in-spite-of|prep\",\"term\":\"in spite of\",\"reading\":\"/ɪn ˈspaɪt əv/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being affected by; despite\",\"lesson\":37,\"pos\":\"prep\"},{\"id\":\"censorship|n\",\"term\":\"censorship\",\"reading\":\"/ˈsen.sə.ʃɪp/\",\"meaning\":\"sự kiểm duyệt\",\"definitionEn\":\"blocking parts of books, films or news that officials dislike\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CEN-sor-ship — Hay đi với: media censorship · strict censorship\",\"example\":{\"text\":\"Others believe that censorship would limit freedom of speech.\",\"vi\":\"Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận.\"}},{\"id\":\"freedom-of-speech|phr-n\",\"term\":\"freedom of speech\",\"reading\":\"/ˌfriː.dəm əv ˈspiːtʃ/\",\"meaning\":\"quyền tự do ngôn luận\",\"definitionEn\":\"the right to say what you think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect freedom of speech · limit freedom of speech\"},{\"id\":\"freedom-of-the-press|phr-n\",\"term\":\"freedom of the press\",\"reading\":\"/ˌfriː.dəm əv ðə ˈpres/\",\"meaning\":\"tự do báo chí\",\"definitionEn\":\"the right of newspapers to report without government control\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: respect freedom of the press\"},{\"id\":\"regulate|v\",\"term\":\"regulate\",\"reading\":\"/ˈreɡ.jə.leɪt/\",\"meaning\":\"quản lý; điều tiết (bằng luật lệ)\",\"definitionEn\":\"to control something with rules\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Trọng âm: REG-u-late — Hay đi với: regulate social media · strictly regulated\",\"example\":{\"text\":\"Some people argue that the government should regulate social media more strictly.\",\"vi\":\"Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn.\"}},{\"id\":\"government|n\",\"term\":\"government\",\"reading\":\"/ˈɡʌv.ən.mənt/\",\"meaning\":\"chính phủ\",\"definitionEn\":\"the group of people who run a country\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"GUV-ần-mần: chữ n ở giữa thường không đọc. — Trọng âm: GOV-ern-ment — Hay đi với: the government should · government control\",\"example\":{\"text\":\"The government should make road safety a top priority.\",\"vi\":\"Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu.\"}},{\"id\":\"entertainment|n\",\"term\":\"entertainment\",\"reading\":\"/ˌen.təˈteɪn.mənt/\",\"meaning\":\"sự giải trí\",\"definitionEn\":\"films, music and shows that people enjoy\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: en-ter-TAIN-ment — Hay đi với: a form of entertainment · for entertainment\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"educational|adj\",\"term\":\"educational\",\"reading\":\"/ˌedʒ.uˈkeɪ.ʃən.əl/\",\"meaning\":\"mang tính giáo dục\",\"definitionEn\":\"helping people to learn\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ed-u-CA-tion-al — Hay đi với: educational programmes · educational value\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"mislead|v\",\"term\":\"mislead\",\"reading\":\"/mɪsˈliːd/\",\"meaning\":\"đánh lừa; làm hiểu sai\",\"definitionEn\":\"to make someone believe something that is not true\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: mislead the public · misleading information\"},{\"id\":\"biased|adj\",\"term\":\"biased\",\"reading\":\"/ˈbaɪ.əst/\",\"meaning\":\"thiên vị; phiến diện\",\"definitionEn\":\"unfairly supporting one side\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: biased reporting · be biased against/towards\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"objective|adj\",\"term\":\"objective\",\"reading\":\"/əbˈdʒek.tɪv/\",\"meaning\":\"khách quan\",\"definitionEn\":\"based on facts, not personal feelings\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ob-JEC-tive — Hay đi với: objective reporting · an objective view\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"public-opinion|phr-n\",\"term\":\"public opinion\",\"reading\":\"/ˌpʌb.lɪk əˈpɪn.jən/\",\"meaning\":\"dư luận\",\"definitionEn\":\"what most people in a society think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: influence public opinion · shape public opinion\"},{\"id\":\"claim|v\",\"term\":\"claim\",\"reading\":\"/kleɪm/\",\"meaning\":\"cho rằng; khẳng định (thường chưa chắc đúng)\",\"definitionEn\":\"to say something is true without proof\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: claim that … · some people claim\"},{\"id\":\"view|n\",\"term\":\"view\",\"reading\":\"/vjuː/\",\"meaning\":\"quan điểm; cách nhìn\",\"definitionEn\":\"an opinion\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Hay đi với: both views · in my view\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"point-of-view|phr-n\",\"term\":\"point of view\",\"reading\":\"/ˌpɔɪnt əv ˈvjuː/\",\"meaning\":\"quan điểm; góc nhìn\",\"definitionEn\":\"a particular way of thinking about something\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: from my point of view · a different point of view\"},{\"id\":\"on-the-one-hand|idiom\",\"term\":\"on the one hand\",\"reading\":\"/ɒn ðə ˈwʌn ˌhænd/\",\"meaning\":\"một mặt\",\"definitionEn\":\"used to introduce the first of two opposite ideas\",\"lesson\":38,\"pos\":\"idiom\"},{\"id\":\"advertising|n\",\"term\":\"advertising\",\"reading\":\"/ˈæd.və.taɪ.zɪŋ/\",\"meaning\":\"ngành/hoạt động quảng cáo\",\"definitionEn\":\"the business of telling people about products to sell them\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: AD-ver-tis-ing — Hay đi với: online advertising · advertising aimed at children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"harmful|adj\",\"term\":\"harmful\",\"reading\":\"/ˈhɑːm.fəl/\",\"meaning\":\"có hại\",\"definitionEn\":\"causing damage or injury\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: harmful content · harmful to children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"content|n\",\"term\":\"content\",\"reading\":\"/ˈkɒn.tent/\",\"meaning\":\"nội dung\",\"definitionEn\":\"the information, videos or articles on a website\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CON-tent — Hay đi với: online content · violent content\",\"example\":{\"text\":\"From my point of view, parents should check the content their children watch.\",\"vi\":\"Theo quan điểm của tôi, bố mẹ nên kiểm tra nội dung con cái xem.\"}}],\"lesson\":{\"number\":38,\"title\":\"Truyền thông \u0026 internet · Writing Task 2: Discuss both views\"}}]\n"])</script><script>self.__next_f.push([1,"2e:[\"$\",\"p\",null,
