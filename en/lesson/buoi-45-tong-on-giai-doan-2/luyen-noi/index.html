ˌkjʊə.rə.ti/\"},{\"group\":\"word\",\"text\":\"globalisation\",\"vi\":\"toàn cầu hóa\",\"extra\":\"/ˌɡləʊ.bəl.aɪˈzeɪ.ʃən/\"},{\"group\":\"word\",\"text\":\"tackle\",\"vi\":\"giải quyết; đối phó với (vấn đề khó)\",\"extra\":\"/ˈtæk.əl/\"},{\"group\":\"sentence\",\"text\":\"If the government invests more in renewable energy, air pollution will be reduced.\",\"vi\":\"Nếu chính phủ đầu tư nhiều hơn vào năng lượng tái tạo, ô nhiễm không khí sẽ giảm.\"},{\"group\":\"sentence\",\"text\":\"Although globalisation has created jobs, it has also led to cultural homogenisation.\",\"vi\":\"Mặc dù toàn cầu hóa đã tạo ra việc làm, nó cũng dẫn đến sự đồng nhất hóa văn hóa.\"},{\"group\":\"sentence\",\"text\":\"Teenagers who spend too much screen time may give in to peer pressure more easily.\",\"vi\":\"Thanh thiếu niên dành quá nhiều thời gian cho màn hình có thể dễ khuất phục áp lực bạn bè hơn.\"},{\"group\":\"sentence\",\"text\":\"The report said that misinformation had spread faster than the truth.\",\"vi\":\"Báo cáo nói rằng thông tin sai lệch đã lan nhanh hơn sự thật.\"},{\"group\":\"sentence\",\"text\":\"Many graduates do internships in order to improve their job security.\",\"vi\":\"Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc.\"},{\"group\":\"sentence\",\"text\":\"Old buildings in the city centre should be restored so as to preserve our cultural heritage.\",\"vi\":\"Các công trình cũ ở trung tâm nên được trùng tu để bảo tồn di sản văn hóa.\"},{\"group\":\"sentence\",\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"},{\"group\":\"sentence\",\"text\":\"When it comes to reducing crime, I believe education is more effective than harsh punishments.\",\"vi\":\"Khi nói đến giảm tội phạm, tôi tin rằng giáo dục hiệu quả hơn hình phạt nghiêm khắc.\"},{\"group\":\"dialogue\",\"text\":\"How did the mock test go?\",\"vi\":\"Bài thi thử thế nào?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Listening was OK, but I ran out of time in Reading. I spent ages on the matching headings.\",\"vi\":\"Nghe thì ổn, nhưng phần Đọc tớ hết giờ. Tớ mất quá nhiều thời gian cho matching headings.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Next time, do them last. If you do the T/F/NG questions first, you'll know the paragraphs better.\",\"vi\":\"Lần sau làm phần đó cuối cùng. Nếu cậu làm T/F/NG trước, cậu sẽ nắm các đoạn rõ hơn.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Good point. And in Writing, my teacher said I had made the same mistake five times.\",\"vi\":\"Đúng. Còn phần Viết, cô bảo tớ mắc cùng một lỗi năm lần.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Which one?\",\"vi\":\"Lỗi gì?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Joining sentences with a comma instead of a full stop.\",\"vi\":\"Nối câu bằng dấu phẩy thay vì dấu chấm.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"That's easy to fix. Check every 'however' before you finish so that you don't lose marks.\",\"vi\":\"Dễ sửa mà. Kiểm tra mọi chữ 'however' trước khi nộp để không mất điểm.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I will. Despite the mistakes, I feel ready for Stage 3.\",\"vi\":\"Tớ sẽ làm vậy. Dù còn lỗi, tớ thấy sẵn sàng cho Giai đoạn 3 rồi.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"How did the mock test go?\",\"vi\":\"Bài thi thử thế nào?\"},{\"speaker\":\"B\",\"text\":\"Listening was OK, but I ran out of time in Reading. I spent ages on the matching headings.\",\"vi\":\"Nghe thì ổn, nhưng phần Đọc tớ hết giờ. Tớ mất quá nhiều thời gian cho matching headings.\"},{\"speaker\":\"A\",\"text\":\"Next time, do them last. If you do the T/F/NG questions first, you'll know the paragraphs better.\",\"vi\":\"Lần sau làm phần đó cuối cùng. Nếu cậu làm T/F/NG trước, cậu sẽ nắm các đoạn rõ hơn.\"},{\"speaker\":\"B\",\"text\":\"Good point. And in Writing, my teacher said I had made the same mistake five times.\",\"vi\":\"Đúng. Còn phần Viết, cô bảo tớ mắc cùng một lỗi năm lần.\"},{\"speaker\":\"A\",\"text\":\"Which one?\",\"vi\":\"Lỗi gì?\"},{\"speaker\":\"B\",\"text\":\"Joining sentences with a comma instead of a full stop.\",\"vi\":\"Nối câu bằng dấu phẩy thay vì dấu chấm.\"},{\"speaker\":\"A\",\"text\":\"That's easy to fix. Check every 'however' before you finish so that you don't lose marks.\",\"vi\":\"Dễ sửa mà. Kiểm tra mọi chữ 'however' trước khi nộp để không mất điểm.\"},{\"speaker\":\"B\",\"text\":\"I will. Despite the mistakes, I feel ready for Stage 3.\",\"vi\":\"Tớ sẽ làm vậy. Dù còn lỗi, tớ thấy sẵn sàng cho Giai đoạn 3 rồi.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-45-tong-on-giai-doan-2/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-45-tong-on-giai-doan-2/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n1b:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n11:null\n16:[[\"$
