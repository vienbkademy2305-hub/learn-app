own motorbike, since sharing was cheaper than paying for parking and repairs.\n\nC  However, the sharing economy has also created problems. Drivers usually work as freelancers, so they have little job security and no paid holidays. In addition, some cities have complained that shared bicycles are left on pavements, where they block pedestrians.\n\nD  Governments are now trying to find a balance. Some have introduced rules so that app companies must pay part of their drivers' insurance. Others have limited the number of shared bicycles that each company can put on the streets. Experts believe that if these rules are enforced, the sharing economy can continue to grow without harming workers or cities.1b:T5da,THE SHARING ECONOMY\n\nA  In the past ten years, a new kind of business has grown quickly in Asian cities. Instead of owning things, people now share them through apps: cars, bicycles, rooms and even clothes. Supporters say this 'sharing economy' saves money and reduces waste, because fewer products need to be manufactured.\n\nB  Ride-sharing apps are the best-known example. In Ho Chi Minh City, a survey in 2023 found that almost two thirds of young office workers had used a ride-sharing app in the previous week. Many said they had sold their own motorbike, since sharing was cheaper than paying for parking and repairs.\n\nC  However, the sharing economy has also created problems. Drivers usually work as freelancers, so they have little job security and no paid holidays. In addition, some cities have complained that shared bicycles are left on pavements, where they block pedestrians.\n\nD  Governments are now trying to find a balance. Some have introduced rules so that app companies must pay part of their drivers' insurance. Others have limited the number of shared bicycles that each company can put on the streets. Experts believe that if these rules are enforced, the sharing economy can continue to grow without harming workers or cities.\n\nHeadings:\ni    Negative effects on workers and the street\nii   How governments are responding\niii  The history of car ownership\niv   What the sharing economy is and why people like it\nv    A popular example from Vietnam\nvi   Why apps are expensivee:[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"$L19\",null,{\"exercises\":[{\"id\":\"b45-x1\",\"bank_no\":13,\"kind\":\"tfng\",\"instructions_vi\":\"Reading (mô phỏng, 8 phút cho bài 1 và bài 2): đọc bài và chọn T (True), F (False) hoặc NG (Not Given).\",\"passage\":\"$1a\",\"questions\":[{\"q\":\"The sharing economy has developed quickly in Asian cities over the last decade.\",\"answer\":\"T\"},{\"q\":\"The sharing economy increases the number of products that need to be made.\",\"answer\":\"F\"},{\"q\":\"Most young office workers in the survey owned a car.\",\"answer\":\"NG\",\"explain_vi\":\"Bài nói về ride-sharing và bán xe máy — không có thông tin về sở hữu ô tô. NG, không phải F.\"},{\"q\":\"Ride-sharing drivers usually have good job security.\",\"answer\":\"F\"},{\"q\":\"All cities have banned shared bicycles.\",\"answer\":\"F\",\"explain_vi\":\"Một số thành phố GIỚI HẠN số lượng — không cấm.\"},{\"q\":\"Experts think the rules must be enforced for the sharing economy to grow safely.\",\"answer\":\"T\"}]},{\"id\":\"b45-x2\",\"bank_no\":14,\"kind\":\"mcq\",\"instructions_vi\":\"Matching headings: chọn tiêu đề đúng cho mỗi đoạn của bài 'The sharing economy' ở bài 1. Có 2 tiêu đề thừa.\",\"passage\":\"$1b\",\"questions\":[{\"q\":\"Paragraph A\",\"options\":[\"i\",\"ii\",\"iii\",\"iv\",\"v\",\"vi\"],\"answer\":\"d\"},{\"q\":\"Paragraph B\",\"options\":[\"i\",\"ii\",\"iii\",\"iv\",\"v\",\"vi\"],\"answer\":\"e\"},{\"q\":\"Paragraph C\",\"options\":[\"i\",\"ii\",\"iii\",\"iv\",\"v\",\"vi\"],\"answer\":\"a\"},{\"q\":\"Paragraph D\",\"options\":[\"i\",\"ii\",\"iii\",\"iv\",\"v\",\"vi\"],\"answer\":\"b\"}]},{\"id\":\"b45-x3\",\"bank_no\":18,\"kind\":\"completion\",\"instructions_vi\":\"Listening Part 1 (mô phỏng): nghe cuộc gọi và điền form. Viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ. Nghe 1 lần.\",\"max_words\":2,\"audio_text\":\"Woman: Good morning, City Language Centre. How can I help?\\nMan: Hi, I'd like to book an IELTS mock test for my sister.\\nWoman: Of course. What's her name?\\nMan: Nguyen Thi Hoa. H-O-A.\\nWoman: And her date of birth?\\nMan: The fourteenth of March, 2004.\\nWoman: Which test would she like — the full test or the short version?\\nMan: The full test, please. Oh, sorry — she only has a morning free, so the short version.\\nWoman: No problem. The short version is on Saturdays at 8.30. It costs 350,000 dong.\\nMan: Can she pay by card?\\nWoman: Yes, or by bank transfer. And please tell her to bring her ID card and a pencil.\",\"passage\":\"MOCK TEST BOOKING FORM\\nName: Nguyen Thi (1) ___\\nDate of birth: (2) ___ March 2004\\nTest type: (3) ___ version\\nDay: (4) ___\\nStart time: (5) ___\\nBring: ID card and a (6) ___\",\"questions\":[{\"q\":\"(1)\",\"answer\":\"Hoa\"},{\"q\":\"(2)\",\"answer\":\"14\",\"accept\":[\"14th\",\"fourteenth\"]},{\"q\":\"(3)\",\"answer\":\"short\",\"explain_vi\":\"Bẫy tự sửa: 'The full test, please. Oh, sorry — … the short version'.\"},{\"q\":\"(4)\",\"answer\":\"Saturday\",\"accept\":[\"Saturdays\"]},{\"q\":\"(5)\",\"answer\":\"8.30\",\"accept\":[\"8:30\",\"8.30 am\",\"8:30 am\"]},{\"q\":\"(6)\",\"answer\":\"pencil\"}]},{\"id\":\"b45-x4\",\"bank_no\":20,\"kind\":\"mcq\",\"instructions_vi\":\"Listening Part 3 (mô phỏng): nghe hai sinh viên và giảng viên (nhiều giọng) rồi chọn đáp án đúng.\",\"audio_text\":\"Tutor: So, what did you find in your survey about part-time jobs?\\nLinh: Well, about seventy per cent of students have a part-time job. Most of them work in cafés or teach private lessons.\\nTutor: Did that surprise you?\\nKhoa: A little. We expected money to be the main reason, but most students said they work to gain experience.\\nTutor: Interesting. Any negative effects?\\nLinh: Yes. Students who work more than twenty hours a week had lower marks. So we think universities should give advice about working hours.\\nKhoa: I'm not sure advice is enough. I think the limit should be written into the rules.\\nTutor: Well, you'll need to agree before you write the conclusion.\",\"questions\":[{\"q\":\"What proportion of students have a part-time job?\",\"options\":[\"about half\",\"about 70%\",\"about a third\"],\"answer\":\"b\"},{\"q\":\"What was the main reason students gave for working?\",\"options\":[\"money\",\"experience\",\"friends\"],\"answer\":\"b\",\"explain_vi\":\"'We expected money… but most students said… to gain experience'.\"},{\"q\":\"What was the negative effect of working more than 20 hours?\",\"options\":[\"lower marks\",\"poor health\",\"less sleep\"],\"answer\":\"a\"},{\"q\":\"What does Khoa think?\",\"options\":[\"Advice is enough.\",\"A limit should be in the rules.\",\"Students should not work.\"],\"answer\":\"b\"}]},{\"id\":\"b45-x5\",\"bank_no\":20,\"kind\":\"tf\",\"instructions_vi\":\"Listening Part 4 (đoạn ngắn): nghe rồi chọn T (đúng) hoặc F (sai).\",\"audio_text\":\"In the final part of today's lecture, I'll summarise the effects of the four-day week trial. Productivity did not fall; in fact, it rose slightly in most companies. Staff reported less stress, and fewer people resigned. However, customer service teams found it difficult, so a rota system was introduced. The researchers recommend that the trial should be extended to hospitals next year.\",\"questions\":[{\"q\":\"Productivity fell during the trial.\",\"answer\":\"F\"},{\"q\":\"Fewer employees resigned.\",\"answer\":\"T\"},{\"q\":\"Customer service teams had no problems.\",\"answer\":\"F\"},{\"q\":\"The trial has already been extended to hospitals.\",\"answer\":\"F\",\"explain_vi\":\"'should be extended … next year' — khuyến nghị cho tương lai.\"}]},{\"id\":\"b45-x6\",\"bank_no\":7,\"kind\":\"error-correction\",\"instructions_vi\":\"Rà lỗi lặp lại: đoạn Task 2 có 6 lỗi thuộc danh sách ở tab Ngữ pháp (comma splice, although…but, because of, for + V, bị động modal, viết hoa I). Sửa trực tiếp.\",\"text\":\"Many young people move to big cities for find jobs, however this causes problems. Although cities offer more opportunities, but the cost of living is very high. Some people cannot buy a house because of prices are rising. In my opinion, more affordable housing should built. i believe this is the best solution.\",\"errors\":[{\"wrong\":\"for find jobs\",\"right\":\"to find jobs\",\"why\":\"Mục đích: to V (Buổi 39).\"},{\"wrong\":\"find jobs, however this causes\",\"right\":\"find jobs. However, this causes\",\"why\":\"Comma splice: tách câu, However + dấu phẩy (Buổi 30).\"},{\"wrong\":\"more opportunities, but the cost\",\"right\":\"more opportunities, the cost\",\"why\":\"Although không đi với but (Buổi 37).\"},{\"wrong\":\"because of prices are rising\",\"right\":\"because prices are rising\",\"why\":\"because + mệnh đề (Buổi 32).\"},{\"wrong\":\"should built\",\"right\":\"should be built\",\"why\":\"Bị động modal: should be + V3 (Buổi 43).\"},{\"wrong\":\"i believe\",\"right\":\"I believe\",\"why\":\"Luôn viết hoa I — lỗi riêng cần tự kiểm tra.\"}]},{\"id\":\"b45-x7\",\"bank_no\":10,\"kind\":\"mcq\",\"instructions_vi\":\"Ngữ pháp tổng hợp Giai đoạn 2: chọn đáp án đúng.\",\"questions\":[{\"q\":\"I ___ in Hanoi since 2019.\",\"options\":[\"live\",\"lived\",\"have lived\",\"am living\"],\"answer\":\"c\"},{\"q\":\"The woman ___ lives next door is a journalist.\",\"options\":[\"which\",\"who\",\"whose\",\"where\"],\"answer\":\"b\"},{\"q\":\"If fewer tourists ___, the old town would be quieter.\",\"options\":[\"come\",\"came\",\"will come\",\"would come\"],\"answer\":\"b\"},{\"q\":\"Three men ___ yesterday.\",\"options\":[\"arrested\",\"were arrested\",\"have arrested\",\"are arrested\"],\"answer\":\"b\"},{\"q\":\"She asked me ___ I lived near the lake.\",\"options\":[\"that\",\"if\",\"what\",\"do\"],\"answer\":\"b\"},{\"q\":\"___ being a journalist, he didn't check the source.\",\"options\":[\"Although\",\"Despite\",\"However\",\"Even though\"],\"answer\":\"b\"},{\"q\":\"Rising rents ___ many families moving to the suburbs.\",\"options\":[\"result from\",\"result in\",\"are caused\",\"lead\"],\"answer\":\"b\"},{\"q\":\"Hanoi had twice as ___ visitors as Hue.\",\"options\":[\"much\",\"many\",\"more\",\"most\"],\"answer\":\"b\"}]},{\"id\":\"b45-x8\",\"bank_no\":30,\"kind\":\"speaking-part2\",\"instructions_vi\":\"Speaking (mô phỏng): 1 phút chuẩn bị, nói 2 phút, ghi âm. Sau đó tự hỏi 2 câu Part 3 bên dưới và trả lời theo A-R-E-A. Tự kiểm tra: đủ 4 gợi ý? có ít nhất 3 cấu trúc câu phức của Giai đoạn 2 không?\",\"cue_card\":{\"topic\":\"Describe a change in your city or town that you think is positive.\",\"points\":[\"what the change is\",\"when it happened\",\"how it has affected people\",\"and explain why you think it is positive\"]},\"sample\":\"I'd like to talk about the new metro line in my city, which opened a couple of years ago. Before it was built, it used to take me an hour to get to work because of the traffic congestion. Now it takes only twenty-five minutes… (Part 3: Should governments spend more on public transport than on roads? · Will cities have fewer cars in the future?)\"}]}],\"$L1c\"]}]\n1c:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-45-tong-on-giai-doan-2/luyen-noi\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Luyện nói\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-45-tong-on-giai-doan-2/homework\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-
