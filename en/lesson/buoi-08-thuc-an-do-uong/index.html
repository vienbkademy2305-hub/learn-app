{\"id\":\"glass|n\",\"term\":\"glass\",\"reading\":\"/ɡlɑːs/\",\"meaning\":\"thủy tinh; kính\",\"definitionEn\":\"a hard clear material used for windows\",\"lesson\":3,\"pos\":\"n\",\"hint\":\"Hay đi với: a glass table\",\"example\":{\"text\":\"There is a big leather sofa and a glass table in the living room.\",\"vi\":\"Phòng khách có một chiếc sofa da lớn và một chiếc bàn kính.\"}},{\"id\":\"leather|n\",\"term\":\"leather\",\"reading\":\"/ˈleð.ə/\",\"meaning\":\"da (thuộc)\",\"definitionEn\":\"animal skin used to make shoes, bags and jackets\",\"lesson\":3,\"pos\":\"n\",\"hint\":\"Hay đi với: a leather sofa · leather shoes\",\"example\":{\"text\":\"There is a big leather sofa and a glass table in the living room.\",\"vi\":\"Phòng khách có một chiếc sofa da lớn và một chiếc bàn kính.\"}},{\"id\":\"cotton|n\",\"term\":\"cotton\",\"reading\":\"/ˈkɒt.ən/\",\"meaning\":\"vải bông; cotton\",\"definitionEn\":\"a soft cloth made from a plant\",\"lesson\":3,\"pos\":\"n\",\"example\":{\"text\":\"My bed has soft cotton sheets.\",\"vi\":\"Giường tôi có ga trải bằng vải bông mềm.\"}},{\"id\":\"colour|n\",\"term\":\"colour\",\"reading\":\"/ˈkʌl.ə/\",\"meaning\":\"màu sắc\",\"definitionEn\":\"red, blue, green, yellow, etc.\",\"lesson\":3,\"pos\":\"n\",\"example\":{\"text\":\"What colour is your bedroom? It's light blue.\",\"vi\":\"Phòng ngủ của bạn màu gì? Màu xanh nhạt.\"}},{\"id\":\"wide|adj\",\"term\":\"wide\",\"reading\":\"/waɪd/\",\"meaning\":\"rộng (bề ngang)\",\"definitionEn\":\"measuring a large distance from side to side\",\"lesson\":3,\"pos\":\"adj\",\"example\":{\"text\":\"Our house is narrow, but the balcony is wide.\",\"vi\":\"Nhà chúng tôi hẹp nhưng ban công thì rộng.\"}},{\"id\":\"narrow|adj\",\"term\":\"narrow\",\"reading\":\"/ˈnær.əʊ/\",\"meaning\":\"hẹp\",\"definitionEn\":\"small from one side to the other\",\"lesson\":3,\"pos\":\"adj\",\"example\":{\"text\":\"Our house is narrow, but the balcony is wide.\",\"vi\":\"Nhà chúng tôi hẹp nhưng ban công thì rộng.\"}},{\"id\":\"soft|adj\",\"term\":\"soft\",\"reading\":\"/sɒft/\",\"meaning\":\"mềm\",\"definitionEn\":\"not hard; pleasant to touch\",\"lesson\":3,\"pos\":\"adj\",\"example\":{\"text\":\"My bed has soft cotton sheets.\",\"vi\":\"Giường tôi có ga trải bằng vải bông mềm.\"}},{\"id\":\"carpet|n\",\"term\":\"carpet\",\"reading\":\"/ˈkɑː.pɪt/\",\"meaning\":\"tấm thảm\",\"definitionEn\":\"a thick cloth that covers a floor\",\"lesson\":3,\"pos\":\"n\",\"example\":{\"text\":\"There is a red carpet under the table.\",\"vi\":\"Có một tấm thảm đỏ dưới gầm bàn.\"}},{\"id\":\"garage|n\",\"term\":\"garage\",\"reading\":\"/ˈɡær.ɑːʒ/\",\"meaning\":\"nhà để xe; ga-ra\",\"definitionEn\":\"a building where you keep a car\",\"lesson\":3,\"pos\":\"n\",\"example\":{\"text\":\"We keep our motorbikes in the garage.\",\"vi\":\"Chúng tôi để xe máy trong ga-ra.\"}},{\"id\":\"first|num\",\"term\":\"first\",\"reading\":\"/fɜːst/\",\"meaning\":\"thứ nhất; đầu tiên\",\"definitionEn\":\"coming before all others\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"January is the first month of the year.\",\"vi\":\"Tháng Một là tháng đầu tiên của năm.\"}},{\"id\":\"second|num\",\"term\":\"second\",\"reading\":\"/ˈsek.ənd/\",\"meaning\":\"thứ hai\",\"definitionEn\":\"coming next after the first\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"My parents' bedroom is on the second floor.\",\"vi\":\"Phòng ngủ của bố mẹ tôi ở tầng hai.\"}},{\"id\":\"third|num\",\"term\":\"third\",\"reading\":\"/θɜːd/\",\"meaning\":\"thứ ba\",\"definitionEn\":\"coming after the second\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"My office is on the third floor.\",\"vi\":\"Văn phòng của tôi ở tầng ba.\"}},{\"id\":\"fifth|num\",\"term\":\"fifth\",\"reading\":\"/fɪfθ/\",\"meaning\":\"thứ năm\",\"definitionEn\":\"number 5 in a series\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"Today is the fifth of May.\",\"vi\":\"Hôm nay là ngày năm tháng Năm.\"}},{\"id\":\"twelfth|num\",\"term\":\"twelfth\",\"reading\":\"/twelfθ/\",\"meaning\":\"thứ mười hai\",\"definitionEn\":\"number 12 in a series\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"My birthday is on the twelfth of June.\",\"vi\":\"Sinh nhật tôi vào ngày mười hai tháng Sáu.\"}},{\"id\":\"twentieth|num\",\"term\":\"twentieth\",\"reading\":\"/ˈtwen.ti.əθ/\",\"meaning\":\"thứ hai mươi\",\"definitionEn\":\"number 20 in a series\",\"lesson\":4,\"pos\":\"num\",\"example\":{\"text\":\"The shop closes on the twentieth of December.\",\"vi\":\"Cửa hàng đóng cửa vào ngày hai mươi tháng Mười Hai.\"}},{\"id\":\"thirteen|num\",\"term\":\"thirteen\",\"reading\":\"/θɜːˈtiːn/\",\"meaning\":\"mười ba\",\"definitionEn\":\"the number 13\",\"lesson\":4,\"pos\":\"num\",\"hint\":\"thơ-TIN: nhấn âm cuối (thirty thì nhấn âm đầu). — Trọng âm: thir-TEEN\",\"example\":{\"text\":\"My younger sister is thirteen years old.\",\"vi\":\"Em gái tôi mười ba tuổi.\"}},{\"id\":\"thirty|num\",\"term\":\"thirty\",\"reading\":\"/ˈθɜː.ti/\",\"meaning\":\"ba mươi\",\"definitionEn\":\"the number 30\",\"lesson\":4,\"pos\":\"num\",\"hint\":\"Trọng âm: THIR-ty\",\"example\":{\"text\":\"There are thirty days in April.\",\"vi\":\"Tháng Tư có ba mươi ngày.\"}},{\"id\":\"month|n\",\"term\":\"month\",\"reading\":\"/mʌnθ/\",\"meaning\":\"tháng\",\"definitionEn\":\"one of the twelve parts of a year, e.g. May\",\"lesson\":4,\"pos\":\"n\",\"example\":{\"text\":\"I pay for my phone every month.\",\"vi\":\"Tháng nào tôi cũng trả tiền điện thoại.\"}},{\"id\":\"week|n\",\"term\":\"week\",\"reading\":\"/wiːk/\",\"meaning\":\"tuần\",\"definitionEn\":\"a period of seven days\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Hay đi với: every week · next week\",\"example\":{\"text\":\"I have a meeting every week.\",\"vi\":\"Tuần nào tôi cũng có một cuộc họp.\"}},{\"id\":\"weekend|n\",\"term\":\"weekend\",\"reading\":\"/ˌwiːkˈend/\",\"meaning\":\"cuối tuần\",\"definitionEn\":\"Saturday and Sunday\",\"lesson\":4,\"pos\":\"n\",\"example\":{\"text\":\"We often go camping at the weekend.\",\"vi\":\"Cuối tuần chúng tôi hay đi cắm trại.\"}},{\"id\":\"birthday|n\",\"term\":\"birthday\",\"reading\":\"/ˈbɜːθ.deɪ/\",\"meaning\":\"sinh nhật\",\"definitionEn\":\"the day each year that is the anniversary of your birth\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Trọng âm: BIRTH-day — Hay đi với: on my birthday · birthday party\",\"example\":{\"text\":\"My birthday is on the twelfth of June.\",\"vi\":\"Sinh nhật tôi vào ngày mười hai tháng Sáu.\"}},{\"id\":\"date|n\",\"term\":\"date\",\"reading\":\"/deɪt/\",\"meaning\":\"ngày (tháng)\",\"definitionEn\":\"a particular day of a month or year\",\"lesson\":4,\"pos\":\"n\",\"example\":{\"text\":\"What's the date today?\",\"vi\":\"Hôm nay là ngày mấy?\"}},{\"id\":\"o'clock|adv\",\"term\":\"o'clock\",\"reading\":\"/əˈklɒk/\",\"meaning\":\"giờ đúng\",\"definitionEn\":\"used after a number to say an exact hour\",\"lesson\":4,\"pos\":\"adv\"},{\"id\":\"half-past|colloc\",\"term\":\"half past\",\"reading\":\"/ˌhɑːf ˈpɑːst/\",\"meaning\":\"rưỡi (hơn 30 phút)\",\"definitionEn\":\"thirty minutes after the hour\",\"lesson\":4,\"pos\":\"colloc\",\"hint\":\"Hay đi với: half past seven\"},{\"id\":\"quarter|n\",\"term\":\"quarter\",\"reading\":\"/ˈkwɔː.tə/\",\"meaning\":\"mười lăm phút; một phần tư\",\"definitionEn\":\"fifteen minutes; one of four equal parts\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Hay đi với: a quarter past · a quarter to\",\"example\":{\"text\":\"Our English class starts at a quarter to eight.\",\"vi\":\"Lớp tiếng Anh của chúng tôi bắt đầu lúc tám giờ kém mười lăm.\"}},{\"id\":\"morning|n\",\"term\":\"morning\",\"reading\":\"/ˈmɔː.nɪŋ/\",\"meaning\":\"buổi sáng\",\"definitionEn\":\"the early part of the day, before 12 noon\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Hay đi với: in the morning\",\"example\":{\"text\":\"We go swimming every Sunday morning.\",\"vi\":\"Sáng Chủ nhật nào chúng tôi cũng đi bơi.\"}},{\"id\":\"afternoon|n\",\"term\":\"afternoon\",\"reading\":\"/ˌɑːf.təˈnuːn/\",\"meaning\":\"buổi chiều\",\"definitionEn\":\"the part of the day between noon and evening\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"af-ter-NOON: nhấn âm cuối; buổi chiều là sau “noon” (trưa). — Trọng âm: af-ter-NOON — Hay đi với: in the afternoon\",\"example\":{\"text\":\"I usually study in the afternoon.\",\"vi\":\"Tôi thường học vào buổi chiều.\"}},{\"id\":\"midnight|n\",\"term\":\"midnight\",\"reading\":\"/ˈmɪd.naɪt/\",\"meaning\":\"nửa đêm (12 giờ đêm)\",\"definitionEn\":\"twelve o'clock at night\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Hay đi với: at midnight\",\"example\":{\"text\":\"I go to bed at midnight.\",\"vi\":\"Tôi đi ngủ lúc nửa đêm.\"}},{\"id\":\"holiday|n\",\"term\":\"holiday\",\"reading\":\"/ˈhɒl.ə.deɪ/\",\"meaning\":\"ngày lễ; kỳ nghỉ\",\"definitionEn\":\"a time when you do not work or go to school\",\"lesson\":4,\"pos\":\"n\",\"hint\":\"Trọng âm: HO-li-day — Hay đi với: public holiday · on holiday\",\"example\":{\"text\":\"We planned our holiday very carefully.\",\"vi\":\"Chúng tôi lên kế hoạch cho kỳ nghỉ rất cẩn thận.\"}},{\"id\":\"during|prep\",\"term\":\"during\",\"reading\":\"/ˈdʒʊə.rɪŋ/\",\"meaning\":\"trong suốt (một sự kiện)\",\"definitionEn\":\"all through a period of time or event\",\"lesson\":4,\"pos\":\"prep\",\"example\":{\"text\":\"Many people go back to their hometown during Tet.\",\"vi\":\"Nhiều người về quê trong dịp Tết.\"}},{\"id\":\"until|prep\",\"term\":\"until\",\"reading\":\"/ənˈtɪl/\",\"meaning\":\"cho đến khi; cho tới (mốc)\",\"definitionEn\":\"up to a particular time, and then stopping\",\"lesson\":4,\"pos\":\"prep\",\"hint\":\"Chỉ 1 chữ l, khác till (2 chữ l). — Trọng âm: un-TIL — Hay đi với: from Monday until Friday\",\"example\":{\"text\":\"The shop is open from 8 a.m. until 10 p.m.\",\"vi\":\"Cửa hàng mở cửa từ 8 giờ sáng đến 10 giờ tối.\"}},{\"id\":\"routine|n\",\"term\":\"routine\",\"reading\":\"/ruːˈtiːn/\",\"meaning\":\"thói quen hằng ngày; lịch sinh hoạt\",\"definitionEn\":\"the things you do regularly every day\",\"lesson\":5,\"pos\":\"n\",\"hint\":\"ru-TIN: nhấn âm cuối. — Trọng âm: rou-TINE — Hay đi với: daily routine · morning routine\",\"example\":{\"text\":\"My daily routine is very simple.\",\"vi\":\"Lịch sinh hoạt hằng ngày của tôi rất đơn giản.\"}},{\"id\":\"wake-up|phr-v\",\"term\":\"wake up\",\"reading\":\"/weɪk ˈʌp/\",\"meaning\":\"thức dậy (tỉnh giấc)\",\"definitionEn\":\"to stop sleeping\",\"lesson\":5,\"pos\":\"phr-v\"},{\"id\":\"get-up|phr-v\",\"term\":\"get up\",\"reading\":\"/ɡet ˈʌp/\",\"meaning\":\"dậy; ra khỏi giường\",\"definitionEn\":\"to leave your bed after sleeping\",\"lesson\":5,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: get up early · get up late\"},{\"id\":\"take-a-shower|colloc\",\"term\":\"take a shower\",\"reading\":\"/teɪk ə ˈʃaʊ.ə/\",\"meaning\":\"tắm (vòi sen)\",\"definitionEn\":\"to wash your body under running water\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"have-breakfast|colloc\",\"term\":\"have breakfast\",\"reading\":\"/hæv ˈbrek.fəst/\",\"meaning\":\"ăn sáng\",\"definitionEn\":\"to eat the first meal of the day\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"go-to-work|colloc\",\"term\":\"go to work\",\"reading\":\"/ɡəʊ tə ˈwɜːk/\",\"meaning\":\"đi làm\",\"definitionEn\":\"to travel to your job\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"cook|v\",\"term\":\"cook\",\"reading\":\"/kʊk/\",\"meaning\":\"nấu ăn\",\"definitionEn\":\"to make food ready to eat by heating it\",\"lesson\":5,\"pos\":\"v\",\"example\":{\"text\":\"Gender roles have changed. For example, many fathers now cook and look after the children.\",\"vi\":\"Vai trò giới đã thay đổi. Ví dụ, nhiều ông bố giờ nấu ăn và chăm con.\"}},{\"id\":\"do-the-housework|colloc\",\"term\":\"do the housework\",\"reading\":\"/duː ðə ˈhaʊs.wɜːk/\",\"meaning\":\"làm việc nhà\",\"definitionEn\":\"to do cleaning, washing and other jobs at home\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"watch|v\",\"term\":\"watch\",\"reading\":\"/wɒtʃ/\",\"meaning\":\"xem (TV, phim)\",\"definitionEn\":\"to look at something, e.g. TV or a film, for a time\",\"lesson\":5,\"pos\":\"v\",\"hint\":\"Hay đi với: watch TV · watch a film\",\"example\":{\"text\":\"How often do you watch TV? Twice a week.\",\"vi\":\"Bạn có hay xem TV không? Hai lần một tuần.\"}},{\"id\":\"relax|v\",\"term\":\"relax\",\"reading\":\"/rɪˈlæks/\",\"meaning\":\"thư giãn; nghỉ ngơi\",\"definitionEn\":\"to rest and stop worrying\",\"lesson\":5,\"pos\":\"v\",\"hint\":\"Trọng âm: re-LAX\",\"example\":{\"text\":\"Painting helps me relax.\",\"vi\":\"Vẽ tranh giúp tôi thư giãn.\"}},{\"id\":\"go-to-bed|colloc\",\"term\":\"go to bed\",\"reading\":\"/ɡəʊ tə ˈbed/\",\"meaning\":\"đi ngủ\",\"definitionEn\":\"to lie down to sleep at night\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"always|adv\",\"term\":\"always\",\"reading\":\"/ˈɔːl.weɪz/\",\"meaning\":\"luôn luôn (100%)\",\"definitionEn\":\"every time; at all times\",\"lesson\":5,\"pos\":\"adv\",\"example\":{\"text\":\"I always do my best in every lesson.\",\"vi\":\"Tôi luôn cố gắng hết sức trong mỗi buổi học.\"}},{\"id\":\"usually|adv\",\"term\":\"usually\",\"reading\":\"/ˈjuː.ʒu.ə.li/\",\"meaning\":\"thường thường (~80%)\",\"definitionEn\":\"in most cases; most of the time\",\"lesson\":5,\"pos\":\"adv\",\"hint\":\"YU-zhu-ờ-li. — Trọng âm: U-su-al-ly\",\"example\":{\"text\":\"I usually get up at six o'clock.\",\"vi\":\"Tôi thường dậy lúc sáu giờ.\"}},{\"id\":\"often|adv\",\"term\":\"often\",\"reading\":\"/ˈɒf.ən/\",\"meaning\":\"thường; hay (~60%)\",\"definitionEn\":\"many times\",\"lesson\":5,\"pos\":\"adv\",\"hint\":\"Thường đọc OF-ần (t câm), cũng có người đọc cả t.\",\"example\":{\"text\":\"My father often has back pain.\",\"vi\":\"Bố tôi hay bị đau lưng.\"}},{\"id\":\"sometimes|adv\",\"term\":\"sometimes\",\"reading\":\"/ˈsʌm.taɪmz/\",\"meaning\":\"thỉnh thoảng (~40%)\",\"definitionEn\":\"on some occasions, but not always\",\"lesson\":5,\"pos\":\"adv\",\"example\":{\"text\":\"Old people sometimes feel lonely.\",\"vi\":\"Người già đôi khi thấy cô đơn.\"}},{\"id\":\"rarely|adv\",\"te . physics or biology\",\"lesson\":6,\"pos\":\"n\",\"hint\":\"SAI-ờns: c đứng sau s thì câm.\",\"example\":{\"text\":\"We have science on Monday and Thursday.\",\"vi\":\"Chúng tôi có môn khoa học vào thứ Hai và thứ Năm.\"}},{\"id\":\"literature|n\",\"term\":\"literature\",\"reading\":\"/ˈlɪt.rə.tʃə/\",\"meaning\":\"văn học; môn văn\",\"definitionEn\":\"books, poems and plays studied as art\",\"lesson\":6,\"pos\":\"n\",\"hint\":\"Trọng âm: LIT-ra-ture\",\"example\":{\"text\":\"In literature class, we read Vietnamese poems.\",\"vi\":\"Trong giờ văn, chúng tôi đọc thơ Việt Nam.\"}},{\"id\":\"foreign-language|phr-n\",\"term\":\"foreign language\",\"reading\":\"/ˌfɒr.ən ˈlæŋ.ɡwɪdʒ/\",\"meaning\":\"ngoại ngữ\",\"definitionEn\":\"a language from another country\",\"lesson\":6,\"pos\":\"phr-n\"},{\"id\":\"classroom|n\",\"term\":\"classroom\",\"reading\":\"/ˈklɑːs.ruːm/\",\"meaning\":\"lớp học (phòng học)\",\"definitionEn\":\"a room in a school where lessons happen\",\"lesson\":6,\"pos\":\"n\",\"example\":{\"text\":\"The students are taking notes in the classroom.\",\"vi\":\"Các sinh viên đang ghi chép trong lớp.\"}},{\"id\":\"timetable|n\",\"term\":\"timetable\",\"reading\":\"/ˈtaɪmˌteɪ.bəl/\",\"meaning\":\"thời khóa biểu; lịch chạy (tàu, xe)\",\"definitionEn\":\"a list showing when lessons, buses or trains happen\",\"lesson\":6,\"pos\":\"n\",\"example\":{\"text\":\"Please check the timetable on the wall.\",\"vi\":\"Hãy xem thời khóa biểu trên tường.\"}},{\"id\":\"textbook|n\",\"term\":\"textbook\",\"reading\":\"/ˈtekst.bʊk/\",\"meaning\":\"sách giáo khoa\",\"definitionEn\":\"a book used for studying a subject\",\"lesson\":6,\"pos\":\"n\",\"example\":{\"text\":\"Open your textbook at page twenty.\",\"vi\":\"Mở sách giáo khoa trang hai mươi.\"}},{\"id\":\"uniform|n\",\"term\":\"uniform\",\"reading\":\"/ˈjuː.nɪ.fɔːm/\",\"meaning\":\"đồng phục\",\"definitionEn\":\"special clothes that all students or workers wear\",\"lesson\":6,\"pos\":\"n\",\"hint\":\"YU-ni-form: u đọc yu. — H ",\"definitionEn\":\"painting, drawing and other creative work\",\"lesson\":6,\"pos\":\"n\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"calculator|n\",\"term\":\"calculator\",\"reading\":\"/ˈkæl.kjə.leɪ.tə/\",\"meaning\":\"máy tính bỏ túi\",\"definitionEn\":\"a small machine for doing sums\",\"lesson\":6,\"pos\":\"n\",\"hint\":\"Trọng âm: CAL-cu-la-tor — Hay đi với: use a calculator\",\"example\":{\"text\":\"You can't use a calculator in this maths test.\",\"vi\":\"Bạn không được dùng máy tính bỏ túi trong bài kiểm tra Toán này.\"}},{\"id\":\"spend-time|colloc\",\"term\":\"spend time\",\"reading\":\"/ˌspend ˈtaɪm/\",\"meaning\":\"dành thời gian\",\"definitionEn\":\"to use hours or days doing something\",\"lesson\":6,\"pos\":\"colloc\",\"hint\":\"Hay đi với: spend time on something · spend time doing something\"},{\"id\":\"job|n\",\"term\":\"job\",\"reading\":\"/dʒɒb/\",\"meaning\":\"công việc; việc làm\",\"definitionEn\":\"the work you do to earn money\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Hay đi với: get a job · look for a job\",\"example\":{\"text\":\"Nam wants a full-time job.\",\"vi\":\"Nam muốn một công việc toàn thời gian.\"}},{\"id\":\"company|n\",\"term\":\"company\",\"reading\":\"/ˈkʌm.pə.ni/\",\"meaning\":\"công ty\",\"definitionEn\":\"a business that makes or sells things\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: COM-pa-ny — Hay đi với: work for a company\",\"example\":{\"text\":\"My father works for a big company.\",\"vi\":\"Bố tôi làm việc cho một công ty lớn.\"}},{\"id\":\"office|n\",\"term\":\"office\",\"reading\":\"/ˈɒf.ɪs/\",\"meaning\":\"văn phòng\",\"definitionEn\":\"a room or building where people work at desks\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Hay đi với: in the office\",\"example\":{\"text\":\"My office is on the third floor.\",\"vi\":\"Văn phòng của tôi ở tầng ba.\"}},{\"id\":\"colleague|n\",\"term\":\"colleague\",\"reading\":\"/ˈkɒl.iːɡ/\",\"meaning\":\"đồng nghiệp\",\"definitionEn\":\"a person you work with\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"KOL-ig: đuôi -league đọc g. — Trọng âm: COL-league\",\"example\":{\"text\":\"My colleague studied at a college in Da Nang.\",\"vi\":\"Đồng nghiệp của tôi từng học ở một trường cao đẳng tại Đà Nẵng.\"}},{\"id\":\"manager|n\",\"term\":\"manager\",\"reading\":\"/ˈmæn.ɪ.dʒə/\",\"meaning\":\"quản lý; trưởng phòng\",\"definitionEn\":\"a person in charge of a team or business\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"MAN-i-jờ: g đọc j. — Trọng âm: MAN-a-ger\",\"example\":{\"text\":\"Can I talk to the manager, please?\",\"vi\":\"Cho tôi nói chuyện với quản lý được không?\"}},{\"id\":\"salary|n\",\"term\":\"salary\",\"reading\":\"/ˈsæl.ər.i/\",\"meaning\":\"lương (tháng/năm)\",\"definitionEn\":\"money you receive for your job every month or year\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Hay đi với: a good salary · earn a salary\",\"example\":{\"text\":\"Engineers earn a good salary in Vietnam.\",\"vi\":\"Kỹ sư ở Việt Nam có mức lương khá.\"}},{\"id\":\"customer|n\",\"term\":\"customer\",\"reading\":\"/ˈkʌs.tə.mə/\",\"meaning\":\"khách hàng\",\"definitionEn\":\"a person who buys things from a shop or business\",\"lesson\":7,\"pos\":\"n\"},{\"id\":\"engineer|n\",\"term\":\"engineer\",\"reading\":\"/ˌen.dʒɪˈnɪə/\",\"meaning\":\"kỹ sư\",\"definitionEn\":\"a person who designs machines, roads or buildings\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"en-ji-NIR: nhấn âm cuối. — Trọng âm: en-gi-NEER\",\"example\":{\"text\":\"My sister is a nurse, and my brother is an engineer.\",\"vi\":\"Chị tôi là y tá, còn anh tôi là kỹ sư.\"}},{\"id\":\"accountant|n\",\"term\":\"accountant\",\"reading\":\"/əˈkaʊn.tənt/\",\"meaning\":\"kế toán (người)\",\"definitionEn\":\"a person whose job is to keep financial records\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: ac-COUN-tant\",\"example\":{\"text\":\"What do you do? I'm an accountant.\",\"vi\":\"Bạn làm nghề gì? Tôi là kế toán.\"}},{\"id\":\"nurse|n\",\"term\":\"nurse\",\"reading\":\"/nɜːs/\",\"meaning\":\"y tá\",\"definitionEn\":\"a person who looks after sick people in a hospital\",\"lesson\":7,\"pos\":\"n\",\"example\":{\"text\":\"I live in Da Nang and I work as a nurse.\",\"vi\":\"Tôi sống ở Đà Nẵng và làm y tá.\"}},{\"id\":\"electrician|n\",\"term\":\"electrician\",\"reading\":\"/ˌel.ɪkˈtrɪʃ.ən/\",\"meaning\":\"thợ điện\",\"definitionEn\":\"a person who fixes wires and electrical equipment\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: e-lec-TRI-cian\",\"example\":{\"text\":\"The electrician is repairing the lights in our kitchen.\",\"vi\":\"Thợ điện đang sửa đèn trong bếp nhà tôi.\"}},{\"id\":\"shop-assistant|phr-n\",\"term\":\"shop assistant\",\"reading\":\"/ˈʃɒp əˌsɪs.tənt/\",\"meaning\":\"nhân viên bán hàng\",\"definitionEn\":\"a person who serves customers in a shop\",\"lesson\":7,\"pos\":\"phr-n\"},{\"id\":\"police-officer|phr-n\",\"term\":\"police officer\",\"reading\":\"/pəˈliːs ˌɒf.ɪ.sə/\",\"meaning\":\"cảnh sát (người)\",\"definitionEn\":\"a member of the police\",\"lesson\":7,\"pos\":\"phr-n\"},{\"id\":\"full-time|adj\",\"term\":\"full-time\",\"reading\":\"/ˌfʊlˈtaɪm/\",\"meaning\":\"toàn thời gian\",\"definitionEn\":\"working all the normal hours of a week\",\"lesson\":7,\"pos\":\"adj\",\"hint\":\"Hay đi với: a full-time job\"},{\"id\":\"part-time|adj\",\"term\":\"part-time\",\"reading\":\"/ˌpɑːtˈtaɪm/\",\"meaning\":\"bán thời gian\",\"definitionEn\":\"working only some hours of the week\",\"lesson\":7,\"pos\":\"adj\",\"hint\":\"Hay đi với: a part-time job\"},{\"id\":\"earn|v\",\"term\":\"earn\",\"reading\":\"/ɜːn/\",\"meaning\":\"kiếm (tiền)\",\"definitionEn\":\"to get money for work you do\",\"lesson\":7,\"pos\":\"v\",\"hint\":\"Hay đi với: earn money · earn a salary\",\"example\":{\"text\":\"Engineers earn a good salary in Vietnam.\",\"vi\":\"Kỹ sư ở Việt Nam có mức lương khá.\"}},{\"id\":\"apply-for|phr-v\",\"term\":\"apply for\",\"reading\":\"/əˈplaɪ fɔː/\",\"meaning\":\"nộp đơn xin (việc, học bổng)\",\"definitionEn\":\"to formally ask for a job, place or scholarship\",\"lesson\":7,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: apply for a job\"},{\"id\":\"interview|n\",\"term\":\"interview\",\"reading\":\"/ˈɪn.tə.vjuː/\",\"meaning\":\"cuộc phỏng vấn\",\"definitionEn\":\"a meeting where someone asks you questions for a job\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"IN-tờ-vyu: nhấn âm đầu. — Trọng âm: IN-ter-view — Hay đi với: a job interview\",\"example\":{\"text\":\"I'm always nervous before an interview.\",\"vi\":\"Tôi luôn hồi hộp trước buổi phỏng vấn.\"}},{\"id\":\"unemployed|adj\",\"term\":\"unemployed\",\"reading\":\"/ˌʌn.ɪmˈplɔɪd/\",\"meaning\":\"thất nghiệp\",\"definitionEn\":\"without a job\",\"lesson\":7,\"pos\":\"adj\",\"example\":{\"text\":\"He is unemployed, so he is looking for work.\",\"vi\":\"Anh ấy đang thất nghiệp nên đang tìm việc.\"}},{\"id\":\"occupation|n\",\"term\":\"occupation\",\"reading\":\"/ˌɒk.jəˈpeɪ.ʃən/\",\"meaning\":\"nghề nghiệp (dùng trên giấy tờ)\",\"definitionEn\":\"your job (a formal word used on forms)\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"2 chữ c, 1 chữ p: ok-yu-PEI-shờn. — Trọng âm: oc-cu-PA-tion\",\"example\":{\"text\":\"Please write your occupation on this form.\",\"vi\":\"Vui lòng ghi nghề nghiệp của bạn vào mẫu đơn này.\"}},{\"id\":\"secretary|n\",\"term\":\"secretary\",\"reading\":\"/ˈsek.rə.tər.i/\",\"meaning\":\"thư ký\",\"definitionEn\":\"a person who types letters and organises an office\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"SEK-rờ-tri. — Trọng âm: SEC-re-ta-ry\",\"example\":{\"text\":\"The secretary answers the phone and arranges meetings.\",\"vi\":\"Thư ký nghe điện thoại và sắp xếp các cuộc họp.\"}},{\"id\":\"receptionist|n\",\"term\":\"receptionist\",\"reading\":\"/rɪˈsep.ʃən.ɪst/\",\"meaning\":\"lễ tân\",\"definitionEn\":\"a person who greets visitors at the front desk\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: re-CEP-tion-ist — Hay đi với: hotel receptionist\",\"example\":{\"text\":\"The receptionist showed us the way to our room.\",\"vi\":\"Lễ tân chỉ đường cho chúng tôi lên phòng.\"}},{\"id\":\"chef|n\",\"term\":\"chef\",\"reading\":\"/ʃef/\",\"meaning\":\"đầu bếp (nhà hàng)\",\"definitionEn\":\"a professional cook in a restaurant\",\"lesson\":7,\"pos\":\"n\",\"example\":{\"text\":\"My uncle is a chef in a big hotel in Hue.\",\"vi\":\"Chú tôi là đầu bếp ở một khách sạn lớn ở Huế.\"}},{\"id\":\"director|n\",\"term\":\"director\",\"reading\":\"/daɪˈrek.tə/\",\"meaning\":\"giám đốc; đạo diễn\",\"definitionEn\":\"a person who manages a company; or who makes films\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: di-REC-tor — Hay đi với: company director · film director\",\"example\":{\"text\":\"The director usually works late, but today she is having a day off.\",\"vi\":\"Giám đốc thường làm muộn, nhưng hôm nay bà ấy đang nghỉ một ngày.\"}},{\"id\":\"staff|n\",\"term\":\"staff\",\"reading\":\"/stɑːf/\",\"meaning\":\"toàn bộ nhân viên\",\"definitionEn\":\"all the people who work for an organisation\",\"lesson\":7,\"pos\":\"n\",\"example\":{\"text\":\"All the staff wear a uniform at work.\",\"vi\":\"Tất cả nhân viên đều mặc đồng phục khi làm việc.\"}},{\"id\":\"businessman|n\",\"term\":\"businessman\",\"reading\":\"/ˈbɪz.nɪs.mæn/\",\"meaning\":\"doanh nhân (nam)\",\"definitionEn\":\"a man who works in business\",\"lesson\":7,\"pos\":\"n\",\"hint\":\"Trọng âm: BUSI-ness-man\",\"example\":{\"text\":\"He is a successful businessman with three companies.\",\"vi\":\"Ông ấy là một doanh nhân thành đạt có ba công ty.\"}},{\"id\":\"rice|n\",\"term\":\"rice\",\"reading\":\"/raɪs/\",\"meaning\":\"gạo; cơm\",\"definitionEn\":\"small white or brown grains cooked as food\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"I eat rice every day.\",\"vi\":\"Ngày nào tôi cũng ăn cơm.\"}},{\"id\":\"bread|n\",\"term\":\"bread\",\"reading\":\"/bred/\",\"meaning\":\"bánh mì\",\"definitionEn\":\"food made from flour and baked, often sliced\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"Do we have any bread?\",\"vi\":\"Nhà mình còn bánh mì không?\"}},{\"id\":\"meat|n\",\"term\":\"meat\",\"reading\":\"/miːt/\",\"meaning\":\"thịt\",\"definitionEn\":\"the flesh of animals eaten as food\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"I don't eat meat, but I love fish.\",\"vi\":\"Tôi không ăn thịt, nhưng rất thích cá.\"}},{\"id\":\"chicken|n\",\"term\":\"chicken\",\"reading\":\"/ˈtʃɪk.ɪn/\",\"meaning\":\"con gà (đếm được); thịt gà (không đếm được)\",\"definitionEn\":\"a farm bird, or its meat\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"My mother is cooking chicken for dinner.\",\"vi\":\"Mẹ tôi đang nấu thịt gà cho bữa tối.\"}},{\"id\":\"beef|n\",\"term\":\"beef\",\"reading\":\"/biːf/\",\"meaning\":\"thịt bò\",\"definitionEn\":\"meat from a cow\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"Beef noodle soup is very popular in Hanoi.\",\"vi\":\"Phở bò rất được ưa chuộng ở Hà Nội.\"}},{\"id\":\"fish|n\",\"term\":\"fish\",\"reading\":\"/fɪʃ/\",\"meaning\":\"con cá; món cá\",\"definitionEn\":\"an animal that lives in water, or its meat\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"I don't eat meat, but I love fish.\",\"vi\":\"Tôi không ăn thịt, nhưng rất thích cá.\"}},{\"id\":\"vegetable|n\",\"term\":\"vegetable\",\"reading\":\"/ˈvedʒ.tə.bəl/\",\"meaning\":\"rau; rau củ\",\"definitionEn\":\"a plant eaten as food, e.g. carrots or cabbage\",\"lesson\":8,\"pos\":\"n\",\"hint\":\"Chỉ 3 âm tiết: VEJ-tờ-bồ, không đọc “ve-ge-ta-ble”. — Trọng âm: VEG-ta-ble\"},{\"id\":\"fruit|n\",\"term\":\"fruit\",\"reading\":\"/fruːt/\",\"meaning\":\"hoa quả; trái cây\",\"definitionEn\":\"the sweet part of a plant, e.g. an apple or mango\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"Fruit is good for you.\",\"vi\":\"Hoa quả tốt cho sức khỏe.\"}},{\"id\":\"egg|n\",\"term\":\"egg\",\"reading\":\"/eɡ/\",\"meaning\":\"quả trứng\",\"definitionEn\":\"the oval thing a hen lays, which we eat\",\"lesson\":8,\"pos\":\"n\"},{\"id\":\"cheese|n\",\"term\":\"cheese\",\"reading\":\"/tʃiːz/\",\"meaning\":\"phô mai\",\"definitionEn\":\"a solid food made from milk\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"I'd like a slice of cheese, please.\",\"vi\":\"Cho tôi một lát phô mai.\"}},{\"id\":\"milk|n\",\"term\":\"milk\",\"reading\":\"/mɪlk/\",\"meaning\":\"sữa\",\"definitionEn\":\"the white liquid from cows that people drink\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"There is some milk in the fridge.\",\"vi\":\"Trong tủ lạnh có một ít sữa.\"}},{\"id\":\"juice|n\",\"term\":\"juice\",\"reading\":\"/dʒuːs/\",\"meaning\":\"nước ép\",\"definitionEn\":\"liquid from fruit\",\"lesson\":8,\"pos\":\"n\",\"hint\":\"Hay đi với: orange juice\",\"example\":{\"text\":\"Would you like some juice?\",\"vi\":\"Bạn uống chút nước ép nhé?\"}},{\"id\":\"salt|n\",\"term\":\"salt\",\"reading\":\"/sɔːlt/\",\"meaning\":\"muối\",\"definitionEn\":\"a white substance that gives food flavour\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"Don't put much salt in the soup.\",\"vi\":\"Đừng cho nhiều muối vào canh.\"}},{\"id\":\"sugar|n\",\"term\":\"sugar\",\"reading\":\"/ˈʃʊɡ.ə/\",\"meaning\":\"đường (ăn)\",\"definitionEn\":\"a sweet white substance added to food and drinks\",\"lesson\":8,\"pos\":\"n\",\"example\":{\"text\":\"This coffee has too much sugar in it.\",\"vi\":\"Cốc cà phê này cho quá nhiều đường.\"}},{\"id\":\"bottle|n\",\"term\":\"bottle\",\"reading\":\"/ˈbɒt.əl/\",\"meaning\":\"cái chai\",\"definitionEn\":\"a container for liquids with a narrow top\",\"lesson\":8,\"pos\":\"n\",\"hint\":\"Hay đi với: a bottle of water\",\"example\":{\"text\":\"Can I have a bottle of water, please?\",\"vi\":\"Cho tôi một chai nước nhé.\"}},{\"id\":\"slice|n\",\"term\":\"slice\",\"reading\":\"/slaɪs/\",\"meaning\":\"lát; miếng mỏng\",\"definitionEn\":\"a thin flat piece cut from something, e.g. bread\",\"lesson\":8,\"pos\":\"n\",\"hint\":\"Hay đi với: a slice of bread · a slice of cake\",\"example\":{\"text\":\"I'd like a slice of cheese, please.\",\"vi\":\"Cho tôi một lát phô mai.\"}},{\"id\":\"packet|n\",\"term\":\"packet\",\"reading\":\"/ˈpæk.ɪt/\",\"meaning\":\"gói; túi nhỏ\",\"definitionEn\":\"a small paper or plastic container for food\",\"lesson\":8,\"pos\":\"n\",\"hint\":\"Hay đi với: a packet of biscuits\",\"example\":{\"text\":\"I buy a packet of biscuits every week.\",\"vi\":\"Tuần nào tôi cũng mua một gói bánh quy.\"}},{\"id\":\"snack|n\",\"term\":\"snack\",\"reading\":\"/snæk/\",\"meaning\":\"đồ ăn vặt; bữa ăn nhẹ\",\"definitionEn\":\"a small amount of food eaten between meals\",\"lesson\":8,\"pos\":\"n\"},{\"id\":\"delicious|adj\",\"term\":\"delicious\",\"reading\":\"/dɪˈlɪʃ.əs/\",\"meaning\":\"ngon\",\"definitionEn\":\"tasting very good\",\"lesson\":8,\"pos\":\"adj\",\"hint\":\"di-LI-shờs: ci đọc sh. — Trọng âm: de-LI-cious\",\"example\":{\"text\":\"This pho is delicious!\",\"vi\":\"Bát phở này ngon quá!\"}},{\"id\":\"spicy|adj\",\"term\":\"spicy\",\"reading\":\"/ˈspaɪ.si/\",\"meaning\":\"cay\",\"definitionEn\":\"having a hot taste, e.g. with chilli\",\"lesson\":8,\"pos\":\"adj\"},{\"id\":\"a-few|det\",\"term\":\"a few\",\"reading\":\"/ə ˈfjuː/\",\"meaning\":\"một vài (đếm được)\",\"definitionEn\":\"a small number of\",\"lesson\":8,\"pos\":\"det\"},{\"id\":\"a-little|det\",\"term\":\"a little\",\"reading\":\"/ə ˈlɪt.əl/\",\"meaning\":\"một chút (không đếm được)\",\"definitionEn\":\"a small amount of\",\"lesson\":8,\"pos\":\"det\"},{\"id\":\"enough|det\",\"term\":\"enough\",\"reading\":\"/ɪˈnʌf/\",\"meaning\":\"đủ\",\"definitionEn\":\"as much or as many as you need\",\"lesson\":8,\"pos\":\"det\",\"hint\":\"ough đọc “ấf”: i-NÁF.\",\"example\":{\"text\":\"There isn't enough rice for everyone.\",\"vi\":\"Không đủ cơm cho mọi người.\"}}],\"lesson\":{\"number\":8,\"title\":\"Thức ăn \u0026 đồ uống\"}}]\n"])</script><script>self.__next_f.push([1,"35:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flas
