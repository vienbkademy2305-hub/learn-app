orted goods has become much easier because of globalisation.\",\"vi\":\"Mua hàng nhập khẩu đã trở nên dễ dàng hơn nhiều nhờ toàn cầu hóa.\"},{\"group\":\"sentence\",\"text\":\"Instead of eating fast food, we should try traditional dishes.\",\"vi\":\"Thay vì ăn đồ ăn nhanh, chúng ta nên thử các món truyền thống.\"},{\"group\":\"sentence\",\"text\":\"It is important to support local businesses in small towns.\",\"vi\":\"Việc ủng hộ các doanh nghiệp địa phương ở thị trấn nhỏ là rất quan trọng.\"},{\"group\":\"sentence\",\"text\":\"Some companies stopped manufacturing in Europe and moved their factories to Asia.\",\"vi\":\"Một số công ty ngừng sản xuất ở châu Âu và chuyển nhà máy sang châu Á.\"},{\"group\":\"sentence\",\"text\":\"Multinational corporations often outsource production to countries with lower wages.\",\"vi\":\"Các tập đoàn đa quốc gia thường thuê ngoài việc sản xuất ở các nước có lương thấp hơn.\"},{\"group\":\"sentence\",\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"},{\"group\":\"sentence\",\"text\":\"A problem in one factory can affect global supply chains.\",\"vi\":\"Một sự cố ở một nhà máy có thể ảnh hưởng đến chuỗi cung ứng toàn cầu.\"},{\"group\":\"sentence\",\"text\":\"Some people worry that cultural homogenisation will make every city look the same.\",\"vi\":\"Một số người lo rằng sự đồng nhất hóa văn hóa sẽ khiến mọi thành phố trông giống nhau.\"},{\"group\":\"sentence\",\"text\":\"Removing trade barriers has had a big impact on Vietnam's exports.\",\"vi\":\"Việc dỡ bỏ rào cản thương mại đã tác động lớn đến xuất khẩu của Việt Nam.\"},{\"group\":\"sentence\",\"text\":\"In an interconnected world, a crisis in one country quickly spreads to others.\",\"vi\":\"Trong một thế giới kết nối chặt chẽ, khủng hoảng ở một nước nhanh chóng lan sang nước khác.\"},{\"group\":\"dialogue\",\"text\":\"Look at this T-shirt. It's an American brand, but it was manufactured in Vietnam.\",\"vi\":\"Nhìn chiếc áo này xem. Thương hiệu Mỹ nhưng sản xuất ở Việt Nam.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"That's globalisation. Big companies outsource production to save money.\",\"vi\":\"Toàn cầu hóa đấy. Các công ty lớn thuê ngoài sản xuất để tiết kiệm tiền.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Is that good for Vietnam?\",\"vi\":\"Điều đó có tốt cho Việt Nam không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"In some ways. It creates jobs, and exporting goods helps the economy grow.\",\"vi\":\"Ở một số mặt. Nó tạo việc làm, và xuất khẩu hàng hóa giúp kinh tế tăng trưởng.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"But I worry about local businesses. It's hard for them to compete with global brands.\",\"vi\":\"Nhưng tớ lo cho doanh nghiệp địa phương. Họ khó cạnh tranh với các thương hiệu toàn cầu.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"True. And every shopping mall looks the same now — the same fast-food chains everywhere.\",\"vi\":\"Đúng. Mà giờ trung tâm thương mại nào cũng giống nhau — chuỗi đồ ăn nhanh ở khắp nơi.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"So instead of eating burgers, let's try that new pho place tonight.\",\"vi\":\"Vậy thay vì ăn burger, tối nay mình thử quán phở mới đi.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Good idea. Supporting local businesses is the least we can do!\",\"vi\":\"Ý hay. Ủng hộ doanh nghiệp địa phương là điều tối thiểu mình có thể làm!\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Look at this T-shirt. It's an American brand, but it was manufactured in Vietnam.\",\"vi\":\"Nhìn chiếc áo này xem. Thương hiệu Mỹ nhưng sản xuất ở Việt Nam.\"},{\"speaker\":\"B\",\"text\":\"That's globalisation. Big companies outsource production to save money.\",\"vi\":\"Toàn cầu hóa đấy. Các công ty lớn thuê ngoài sản xuất để tiết kiệm tiền.\"},{\"speaker\":\"A\",\"text\":\"Is that good for Vietnam?\",\"vi\":\"Điều đó có tốt cho Việt Nam không?\"},{\"speaker\":\"B\",\"text\":\"In some ways. It creates jobs, and exporting goods helps the economy grow.\",\"vi\":\"Ở một số mặt. Nó tạo việc làm, và xuất khẩu hàng hóa giúp kinh tế tăng trưởng.\"},{\"speaker\":\"A\",\"text\":\"But I worry about local businesses. It's hard for them to compete with global brands.\",\"vi\":\"Nhưng tớ lo cho doanh nghiệp địa phương. Họ khó cạnh tranh với các thương hiệu toàn cầu.\"},{\"speaker\":\"B\",\"text\":\"True. And every shopping mall looks the same now — the same fast-food chains everywhere.\",\"vi\":\"Đúng. Mà giờ trung tâm thương mại nào cũng giống nhau — chuỗi đồ ăn nhanh ở khắp nơi.\"},{\"speaker\":\"A\",\"text\":\"So instead of eating burgers, let's try that new pho place tonight.\",\"vi\":\"Vậy thay vì ăn burger, tối nay mình thử quán phở mới đi.\"},{\"speaker\":\"B\",\"text\":\"Good idea. Supporting local businesses is the least we can do!\",\"vi\":\"Ý hay. Ủng hộ doanh nghiệp địa phương là điều tối thiểu mình có thể làm!\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-41-toan-cau-hoa-summary-completion/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-41-toan-cau-hoa-summary-completion/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewp
