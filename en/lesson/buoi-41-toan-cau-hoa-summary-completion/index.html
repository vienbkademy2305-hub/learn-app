\"reading\":\"/ˌmɪs.ɪn.fəˈmeɪ.ʃən/\",\"meaning\":\"thông tin sai lệch\",\"definitionEn\":\"false or wrong information\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: mis-in-for-MA-tion — Hay đi với: spread misinformation · a source of misinformation\",\"example\":{\"text\":\"Misinformation often spreads faster than the truth on social media.\",\"vi\":\"Thông tin sai lệch thường lan nhanh hơn sự thật trên mạng xã hội.\"}},{\"id\":\"media-literacy|phr-n\",\"term\":\"media literacy\",\"reading\":\"/ˌmiː.di.ə ˈlɪt.ər.ə.si/\",\"meaning\":\"năng lực hiểu và đánh giá thông tin truyền thông\",\"definitionEn\":\"the ability to judge news and media critically\",\"lesson\":37,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: teach media literacy · improve media literacy\"},{\"id\":\"journalist|n\",\"term\":\"journalist\",\"reading\":\"/ˈdʒɜː.nə.lɪst/\",\"meaning\":\"nhà báo\",\"definitionEn\":\"a person who writes news reports\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"JƠ-nờ-list: j ở đầu. — Trọng âm: JOUR-nal-ist — Hay đi với: a professional journalist · journalists report\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"headline|n\",\"term\":\"headline\",\"reading\":\"/ˈhed.laɪn/\",\"meaning\":\"tiêu đề (bài báo)\",\"definitionEn\":\"the title of a news story in large letters\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a shocking headline · read only the headlines\",\"example\":{\"text\":\"Although the headline was false, the story spread very quickly online.\",\"vi\":\"Mặc dù tiêu đề là sai sự thật, câu chuyện vẫn lan truyền rất nhanh trên mạng.\"}},{\"id\":\"source|n\",\"term\":\"source\",\"reading\":\"/sɔːs/\",\"meaning\":\"nguồn (thông tin)\",\"definitionEn\":\"where information comes from\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a reliable source · check the source\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"reliable|adj\",\"term\":\"reliable\",\"reading\":\"/rɪˈlaɪ.ə.bəl/\",\"meaning\":\"đáng tin cậy\",\"definitionEn\":\"able to be trusted\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-LI-a-ble — Hay đi với: a reliable source · reliable information\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"spread|v\",\"term\":\"spread\",\"reading\":\"/spred/\",\"meaning\":\"lan truyền; lan rộng\",\"definitionEn\":\"to move to more places or people\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: spread quickly · spread fake news\",\"example\":{\"text\":\"The report said that misinformation had spread faster than the truth.\",\"vi\":\"Báo cáo nói rằng thông tin sai lệch đã lan nhanh hơn sự thật.\"}},{\"id\":\"publish|v\",\"term\":\"publish\",\"reading\":\"/ˈpʌb.lɪʃ/\",\"meaning\":\"đăng; xuất bản\",\"definitionEn\":\"to make a book, article or post available to the public\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: publish an article · be published online\"},{\"id\":\"audience|n\",\"term\":\"audience\",\"reading\":\"/ˈɔː.di.əns/\",\"meaning\":\"khán giả; độc giả\",\"definitionEn\":\"the people who watch, read or listen to something\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"AW-di-ờns: nhấn âm đầu. — Trọng âm: AU-di-ence — Hay đi với: a large audience · reach a young audience\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"viral|adj\",\"term\":\"viral\",\"reading\":\"/ˈvaɪə.rəl/\",\"meaning\":\"lan truyền rất nhanh trên mạng\",\"definitionEn\":\"spreading very quickly online\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Hay đi với: go viral · a viral video\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"platform|n\",\"term\":\"platform\",\"reading\":\"/ˈplæt.fɔːm/\",\"meaning\":\"nền tảng (mạng xã hội, trực tuyến)\",\"definitionEn\":\"a website or app where people share content\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: social media platforms · online platforms\"},{\"id\":\"influencer|n\",\"term\":\"influencer\",\"reading\":\"/ˈɪn.flu.ən.sər/\",\"meaning\":\"người có ảnh hưởng trên mạng\",\"definitionEn\":\"a person paid to promote products to their online followers\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-flu-en-cer — Hay đi với: a social media influencer · follow influencers\"},{\"id\":\"fact-check|v\",\"term\":\"fact-check\",\"reading\":\"/ˈfækt.tʃek/\",\"meaning\":\"kiểm chứng thông tin\",\"definitionEn\":\"to make sure information is true before using it\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: fact-check a story · fact-checking websites\"},{\"id\":\"although|conj\",\"term\":\"although\",\"reading\":\"/ɔːlˈðəʊ/\",\"meaning\":\"mặc dù (+ mệnh đề)\",\"definitionEn\":\"used before a clause that contrasts with the main idea\",\"lesson\":37,\"pos\":\"conj\",\"hint\":\"Trọng âm: al-THOUGH\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"even-though|conj\",\"term\":\"even though\",\"reading\":\"/ˌiː.vən ˈðəʊ/\",\"meaning\":\"mặc dù (nhấn mạnh hơn although)\",\"definitionEn\":\"a stronger way of saying 'although'\",\"lesson\":37,\"pos\":\"conj\"},{\"id\":\"despite|prep\",\"term\":\"despite\",\"reading\":\"/dɪˈspaɪt/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being stopped by (used before a noun)\",\"lesson\":37,\"pos\":\"prep\",\"hint\":\"Trọng âm: de-SPITE\",\"example\":{\"text\":\"Despite the warnings, many people shared the video without checking it.\",\"vi\":\"Bất chấp những lời cảnh báo, nhiều người vẫn chia sẻ video mà không kiểm tra.\"}},{\"id\":\"in-spite-of|prep\",\"term\":\"in spite of\",\"reading\":\"/ɪn ˈspaɪt əv/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being affected by; despite\",\"lesson\":37,\"pos\":\"prep\"},{\"id\":\"censorship|n\",\"term\":\"censorship\",\"reading\":\"/ˈsen.sə.ʃɪp/\",\"meaning\":\"sự kiểm duyệt\",\"definitionEn\":\"blocking parts of books, films or news that officials dislike\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CEN-sor-ship — Hay đi với: media censorship · strict censorship\",\"example\":{\"text\":\"Others believe that censorship would limit freedom of speech.\",\"vi\":\"Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận.\"}},{\"id\":\"freedom-of-speech|phr-n\",\"term\":\"freedom of speech\",\"reading\":\"/ˌfriː.dəm əv ˈspiːtʃ/\",\"meaning\":\"quyền tự do ngôn luận\",\"definitionEn\":\"the right to say what you think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect freedom of speech · limit freedom of speech\"},{\"id\":\"freedom-of-the-press|phr-n\",\"term\":\"freedom of the press\",\"reading\":\"/ˌfriː.dəm əv ðə ˈpres/\",\"meaning\":\"tự do báo chí\",\"definitionEn\":\"the right of newspapers to report without government control\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: respect freedom of the press\"},{\"id\":\"regulate|v\",\"term\":\"regulate\",\"reading\":\"/ˈreɡ.jə.leɪt/\",\"meaning\":\"quản lý; điều tiết (bằng luật lệ)\",\"definitionEn\":\"to control something with rules\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Trọng âm: REG-u-late — Hay đi với: regulate social media · strictly regulated\",\"example\":{\"text\":\"Some people argue that the government should regulate social media more strictly.\",\"vi\":\"Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn.\"}},{\"id\":\"government|n\",\"term\":\"government\",\"reading\":\"/ˈɡʌv.ən.mənt/\",\"meaning\":\"chính phủ\",\"definitionEn\":\"the group of people who run a country\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"GUV-ần-mần: chữ n ở giữa thường không đọc. — Trọng âm: GOV-ern-ment — Hay đi với: the government should · government control\",\"example\":{\"text\":\"The government should make road safety a top priority.\",\"vi\":\"Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu.\"}},{\"id\":\"entertainment|n\",\"term\":\"entertainment\",\"reading\":\"/ˌen.təˈteɪn.mənt/\",\"meaning\":\"sự giải trí\",\"definitionEn\":\"films, music and shows that people enjoy\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: en-ter-TAIN-ment — Hay đi với: a form of entertainment · for entertainment\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"educational|adj\",\"term\":\"educational\",\"reading\":\"/ˌedʒ.uˈkeɪ.ʃən.əl/\",\"meaning\":\"mang tính giáo dục\",\"definitionEn\":\"helping people to learn\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ed-u-CA-tion-al — Hay đi với: educational programmes · educational value\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"mislead|v\",\"term\":\"mislead\",\"reading\":\"/mɪsˈliːd/\",\"meaning\":\"đánh lừa; làm hiểu sai\",\"definitionEn\":\"to make someone believe something that is not true\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: mislead the public · misleading information\"},{\"id\":\"biased|adj\",\"term\":\"biased\",\"reading\":\"/ˈbaɪ.əst/\",\"meaning\":\"thiên vị; phiến diện\",\"definitionEn\":\"unfairly supporting one side\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: biased reporting · be biased against/towards\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"objective|adj\",\"term\":\"objective\",\"reading\":\"/əbˈdʒek.tɪv/\",\"meaning\":\"khách quan\",\"definitionEn\":\"based on facts, not personal feelings\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ob-JEC-tive — Hay đi với: objective reporting · an objective view\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"public-opinion|phr-n\",\"term\":\"public opinion\",\"reading\":\"/ˌpʌb.lɪk əˈpɪn.jən/\",\"meaning\":\"dư luận\",\"definitionEn\":\"what most people in a society think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: influence public opinion · shape public opinion\"},{\"id\":\"claim|v\",\"term\":\"claim\",\"reading\":\"/kleɪm/\",\"meaning\":\"cho rằng; khẳng định (thường chưa chắc đúng)\",\"definitionEn\":\"to say something is true without proof\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: claim that … · some people claim\"},{\"id\":\"view|n\",\"term\":\"view\",\"reading\":\"/vjuː/\",\"meaning\":\"quan điểm; cách nhìn\",\"definitionEn\":\"an opinion\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Hay đi với: both views · in my view\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"point-of-view|phr-n\",\"term\":\"point of view\",\"reading\":\"/ˌpɔɪnt əv ˈvjuː/\",\"meaning\":\"quan điểm; góc nhìn\",\"definitionEn\":\"a particular way of thinking about something\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: from my point of view · a different point of view\"},{\"id\":\"on-the-one-hand|idiom\",\"term\":\"on the one hand\",\"reading\":\"/ɒn ðə ˈwʌn ˌhænd/\",\"meaning\":\"một mặt\",\"definitionEn\":\"used to introduce the first of two opposite ideas\",\"lesson\":38,\"pos\":\"idiom\"},{\"id\":\"advertising|n\",\"term\":\"advertising\",\"reading\":\"/ˈæd.və.taɪ.zɪŋ/\",\"meaning\":\"ngành/hoạt động quảng cáo\",\"definitionEn\":\"the business of telling people about products to sell them\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: AD-ver-tis-ing — Hay đi với: online advertising · advertising aimed at children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"harmful|adj\",\"term\":\"harmful\",\"reading\":\"/ˈhɑːm.fəl/\",\"meaning\":\"có hại\",\"definitionEn\":\"causing damage or injury\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: harmful content · harmful to children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"content|n\",\"term\":\"content\",\"reading\":\"/ˈkɒn.tent/\",\"meaning\":\"nội dung\",\"definitionEn\":\"the information, videos or articles on a website\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CON-tent — Hay đi với: online content · violent content\",\"example\":{\"text\":\"From my point of view, parents should check the content their children watch.\",\"vi\":\"Theo quan điểm của tôi, bố mẹ nên kiểm tra nội dung con cái xem.\"}},{\"id\":\"employee|n\",\"term\":\"employee\",\"reading\":\"/ɪmˈplɔɪ.iː/\",\"meaning\":\"nhân viên; người lao động\",\"definitionEn\":\"a person who works for a company\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"em-ploi-Ì: nhấn âm cuối. — Trọng âm: em-ploy-EE — Hay đi với: full-time employees · the company's employees\"},{\"id\":\"employer|n\",\"term\":\"employer\",\"reading\":\"/ɪmˈplɔɪ.ər/\",\"meaning\":\"người sử dụng lao động; chủ (công ty)\",\"definitionEn\":\"a person or company that pays people to work\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: em-PLOY-er — Hay đi với: a good employer · employers look for\"},{\"id\":\"wage|n\",\"term\":\"wage\",\"reading\":\"/weɪdʒ/\",\"meaning\":\"tiền công (thường trả theo giờ/tuần)\",\"definitionEn\":\"money paid for work, usually per hour or week\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: a low wage · an hourly wage\",\"example\":{\"text\":\"Many people believe the minimum wage should be raised because the cost of living is rising.\",\"vi\":\"Nhiều người cho rằng lương tối thiểu nên được tăng vì chi phí sinh hoạt đang tăng.\"}},{\"id\":\"promotion|n\",\"term\":\"promotion\",\"reading\":\"/prəˈməʊ.ʃən/\",\"meaning\":\"sự thăng chức\",\"definitionEn\":\"a move to a higher position at work\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: pro-MO-tion — Hay đi với: get a promotion · chances of promotion\",\"example\":{\"text\":\"After three years, he finally got a promotion to team leader.\",\"vi\":\"Sau ba năm, cuối cùng anh ấy cũng được thăng chức lên trưởng nhóm.\"}},{\"id\":\"experience|n\",\"term\":\"experience\",\"reading\":\"/ɪkˈspɪə.ri.əns/\",\"meaning\":\"kinh nghiệm (không đếm được); trải nghiệm (đếm được)\",\"definitionEn\":\"knowledge you gain by doing something\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-PE-ri-ence — Hay đi với: work experience · have experience in\",\"example\":{\"text\":\"Looking back on it, the experience was extremely rewarding.\",\"vi\":\"Nhìn lại thì trải nghiệm đó rất đáng giá.\"}},{\"id\":\"internship|n\",\"term\":\"internship\",\"reading\":\"/ˈɪn.tɜːn.ʃɪp/\",\"meaning\":\"kỳ thực tập\",\"definitionEn\":\"a short period of work to gain experience, often unpaid\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: do an internship · a three-month internship\",\"example\":{\"text\":\"Many students do an internship in order to gain work experience.\",\"vi\":\"Nhiều sinh viên đi thực tập để có kinh nghiệm làm việc.\"}},{\"id\":\"freelance|adj\",\"term\":\"freelance\",\"reading\":\"/ˈfriː.lɑːns/\",\"meaning\":\"làm tự do (không thuộc biên chế công ty nào)\",\"definitionEn\":\"working for different companies, not employed by one\",\"lesson\":39,\"pos\":\"adj\",\"hint\":\"Hay đi với: freelance work · a freelance designer\",\"example\":{\"text\":\"More and more young people choose freelance work because it is flexible.\",\"vi\":\"Ngày càng nhiều người trẻ chọn làm tự do vì nó linh hoạt.\"}},{\"id\":\"work-from-home|phr-v\",\"term\":\"work from home\",\"reading\":\"/ˌwɜːk frəm ˈhəʊm/\",\"meaning\":\"làm việc tại nhà\",\"definitionEn\":\"to do your job at your house instead of an office\",\"lesson\":39,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: work from home twice a week · the right to work from home\"},{\"id\":\"recruit|v\",\"term\":\"recruit\",\"reading\":\"/rɪˈkruːt/\",\"meaning\":\"tuyển dụng\",\"definitionEn\":\"to find new people to join a company\",\"lesson\":39,\"pos\":\"v\",\"hint\":\"Trọng âm: re-CRUIT — Hay đi với: recruit new staff · recruit graduates\"},{\"id\":\"resign|v\",\"term\":\"resign\",\"reading\":\"/rɪˈzaɪn/\",\"meaning\":\"từ chức; xin nghỉ việc\",\"definitionEn\":\"to leave your job by choice\",\"lesson\":39,\"pos\":\"v\",\"hint\":\"Hay đi với: resign from a job · decide to resign\"},{\"id\":\"workplace|n\",\"term\":\"workplace\",\"reading\":\"/ˈwɜːk.pleɪs/\",\"meaning\":\"nơi làm việc\",\"definitionEn\":\"the place where you do your job\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: in the workplace · a safe workplace\",\"example\":{\"text\":\"A friendly workplace can improve job satisfaction more than a high salary.\",\"vi\":\"Một nơi làm việc thân thiện có thể tăng sự hài lòng với công việc hơn cả lương cao.\"}},{\"id\":\"job-satisfaction|phr-n\",\"term\":\"job satisfaction\",\"reading\":\"/ˈdʒɒb sæt.ɪsˌfæk.ʃən/\",\"meaning\":\"sự hài lòng với công việc\",\"definitionEn\":\"the feeling of enjoying your work\",\"lesson\":39,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: high job satisfaction · improve job satisfaction\"},{\"id\":\"so-that|conj\",\"term\":\"so that\",\"reading\":\"/ˈsəʊ ðæt/\",\"meaning\":\"để mà (+ mệnh đề)\",\"definitionEn\":\"in order to make something possible\",\"lesson\":39,\"pos\":\"conj\",\"hint\":\"Hay đi với: so that I can · so that they won't\"},{\"id\":\"in-order-to|idiom\",\"term\":\"in order to\",\"reading\":\"/ɪn ˈɔː.də tə/\",\"meaning\":\"để (+ động từ nguyên thể)\",\"definitionEn\":\"with the purpose of\",\"lesson\":39,\"pos\":\"idiom\",\"hint\":\"Hay đi với: in order to save money · in order not to be late\"},{\"id\":\"unemployment|n\",\"term\":\"unemployment\",\"reading\":\"/ˌʌn.ɪmˈplɔɪ.mənt/\",\"meaning\":\"tình trạng thất nghiệp\",\"definitionEn\":\"the situation of not having a job\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: un-em-PLOY-ment — Hay đi với: high unemployment · youth unemployment\",\"example\":{\"text\":\"When it comes to youth unemployment, I think the main problem is a lack of practical skills.\",\"vi\":\"Nói về tình trạng thất nghiệp ở người trẻ, tôi nghĩ vấn đề chính là thiếu kỹ năng thực tế.\"}},{\"id\":\"job-security|phr-n\",\"term\":\"job security\",\"reading\":\"/ˈdʒɒb sɪˌkjʊə.rə.ti/\",\"meaning\":\"sự ổn định; an toàn của công việc (ít nguy cơ mất việc)\",\"definitionEn\":\"little risk of losing your work\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have job security · a lack of job security\"},{\"id\":\"income-inequality|phr-n\",\"term\":\"income inequality\",\"reading\":\"/ˈɪn.kʌm ˌɪn.ɪˈkwɒl.ə.ti/\",\"meaning\":\"bất bình đẳng thu nhập\",\"definitionEn\":\"the large gap between the rich and the poor\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce income inequality · growing income inequality\"},{\"id\":\"minimum-wage|phr-n\",\"term\":\"minimum wage\",\"reading\":\"/ˌmɪn.ɪ.məm ˈweɪdʒ/\",\"meaning\":\"lương tối thiểu\",\"definitionEn\":\"the lowest hourly pay allowed by law\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: raise the minimum wage · earn the minimum wage\"},{\"id\":\"economic-growth|phr-n\",\"term\":\"economic growth\",\"reading\":\"/ˌiː.kəˌnɒm.ɪk ˈɡrəʊθ/\",\"meaning\":\"tăng trưởng kinh tế\",\"definitionEn\":\"an increase in the goods and services a country produces\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rapid economic growth · lead to economic growth\"},{\"id\":\"economy|n\",\"term\":\"economy\",\"reading\":\"/iˈkɒn.ə.mi/\",\"meaning\":\"nền kinh tế\",\"definitionEn\":\"the system of money, trade and industry in a country\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: e-CON-o-my — Hay đi với: a strong economy · the global economy\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"}},{\"id\":\"industry|n\",\"term\":\"industry\",\"reading\":\"/ˈɪn.də.stri/\",\"meaning\":\"ngành công nghiệp; ngành\",\"definitionEn\":\"the production of goods in factories; a type of business\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-dus-try — Hay đi với: the tourism industry · the IT industry\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"}},{\"id\":\"replace|v\",\"term\":\"replace\",\"reading\":\"/rɪˈpleɪs/\",\"meaning\":\"thay thế\",\"definitionEn\":\"to put something new in the place of something else\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: be replaced by machines · replace A with B\"},{\"id\":\"skilled|adj\",\"term\":\"skilled\",\"reading\":\"/skɪld/\",\"meaning\":\"có tay nghề; lành nghề\",\"definitionEn\":\"trained and good at a job\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: skilled workers · highly skilled\",\"example\":{\"text\":\"Skilled workers can find jobs more easily, especially in the IT industry.\",\"vi\":\"Lao động có tay nghề tìm việc dễ hơn, nhất là trong ngành công nghệ thông tin.\"}},{\"id\":\"retrain|v\",\"term\":\"retrain\",\"reading\":\"/ˌriːˈtreɪn/\",\"meaning\":\"đào tạo lại (cho nghề mới)\",\"definitionEn\":\"to learn new skills for a different job\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: retrain workers · retrain as a programmer\",\"example\":{\"text\":\"If factory workers lose their jobs, the government should help them retrain.\",\"vi\":\"Nếu công nhân nhà máy mất việc, chính phủ nên giúp họ đào tạo lại.\"}},{\"id\":\"workforce|n\",\"term\":\"workforce\",\"reading\":\"/ˈwɜːk.fɔːs/\",\"meaning\":\"lực lượng lao động\",\"definitionEn\":\"all the people who work in a country or company\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Hay đi với: a skilled workforce · join the workforce\",\"example\":{\"text\":\"Women now make up almost half of the workforce in many wealthy countries.\",\"vi\":\"Phụ nữ hiện chiếm gần một nửa lực lượng lao động ở nhiều nước giàu.\"}},{\"id\":\"flexible|adj\",\"term\":\"flexible\",\"reading\":\"/ˈflek.sə.bəl/\",\"meaning\":\"linh hoạt\",\"definitionEn\":\"able to change easily\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Trọng âm: FLEX-i-ble — Hay đi với: flexible working hours · a flexible job\",\"example\":{\"text\":\"Young people today want flexible jobs rather than a job for life.\",\"vi\":\"Người trẻ ngày nay muốn công việc linh hoạt hơn là một công việc suốt đời.\"}},{\"id\":\"poverty|n\",\"term\":\"poverty\",\"reading\":\"/ˈpɒv.ə.ti/\",\"meaning\":\"sự nghèo đói\",\"definitionEn\":\"the state of being very poor\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Hay đi với: live in poverty · reduce poverty\",\"example\":{\"text\":\"Poverty and a lack of education are two root causes of juvenile crime.\",\"vi\":\"Nghèo đói và thiếu giáo dục là hai nguyên nhân gốc rễ của tội phạm vị thành niên.\"}},{\"id\":\"wealthy|adj\",\"term\":\"wealthy\",\"reading\":\"/ˈwel.θi/\",\"meaning\":\"giàu có\",\"definitionEn\":\"having a lot of money\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: wealthy families · the gap between wealthy and poor people\",\"example\":{\"text\":\"Women now make up almost half of the workforce in many wealthy countries.\",\"vi\":\"Phụ nữ hiện chiếm gần một nửa lực lượng lao động ở nhiều nước giàu.\"}},{\"id\":\"invest|v\",\"term\":\"invest\",\"reading\":\"/ɪnˈvest/\",\"meaning\":\"đầu tư\",\"definitionEn\":\"to put money into something to make a profit\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: invest in education · invest money in\",\"example\":{\"text\":\"In terms of reducing poverty, the government should invest in education.\",\"vi\":\"Về việc giảm nghèo, chính phủ nên đầu tư vào giáo dục.\"}},{\"id\":\"lifelong-learning|phr-n\",\"term\":\"lifelong learning\",\"reading\":\"/ˌlaɪf.lɒŋ ˈlɜː.nɪŋ/\",\"meaning\":\"học tập suốt đời\",\"definitionEn\":\"continuing to study and gain skills throughout your life\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: encourage lifelong learning\"},{\"id\":\"in-demand|adj\",\"term\":\"in-demand\",\"reading\":\"/ɪn dɪˈmɑːnd/\",\"meaning\":\"đang được săn đón; có nhu cầu cao\",\"definitionEn\":\"wanted by many employers or customers\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: in-demand skills · be in demand\"},{\"id\":\"globalisation|n\",\"term\":\"globalisation\",\"reading\":\"/ˌɡləʊ.bəl.aɪˈzeɪ.ʃən/\",\"meaning\":\"toàn cầu hóa\",\"definitionEn\":\"the process of countries becoming more connected through trade\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Trọng âm: glo-bal-i-SA-tion — Hay đi với: the effects of globalisation · economic globalisation\",\"example\":{\"text\":\"Buying imported goods has become much easier because of globalisation.\",\"vi\":\"Mua hàng nhập khẩu đã trở nên dễ dàng hơn nhiều nhờ toàn cầu hóa.\"}},{\"id\":\"global|adj\",\"term\":\"global\",\"reading\":\"/ˈɡləʊ.bəl/\",\"meaning\":\"toàn cầu\",\"definitionEn\":\"affecting the whole world\",\"lesson\":41,\"pos\":\"adj\",\"hint\":\"Hay đi với: the global economy · a global brand\",\"example\":{\"text\":\"Global warming makes summers hotter every year.\",\"vi\":\"Sự nóng lên toàn cầu khiến mùa hè mỗi năm một nóng hơn.\"}},{\"id\":\"multinational-corporation|phr-n\",\"term\":\"multinational corporation\",\"reading\":\"/ˌmʌl.tiˌnæʃ.ən.əl ˌkɔː.pəˈreɪ.ʃən/\",\"meaning\":\"tập đoàn đa quốc gia\",\"definitionEn\":\"a large company operating in many countries\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: large multinational corporations · work for a multinational\"},{\"id\":\"supply-chain|phr-n\",\"term\":\"supply chain\",\"reading\":\"/səˈplaɪ ˌtʃeɪn/\",\"meaning\":\"chuỗi cung ứng\",\"definitionEn\":\"the steps needed to make a product and get it to customers\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: global supply chains · a break in the supply chain\"},{\"id\":\"trade|n\",\"term\":\"trade\",\"reading\":\"/treɪd/\",\"meaning\":\"thương mại; buôn bán\",\"definitionEn\":\"buying and selling goods between countries\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: international trade · free trade\",\"example\":{\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"}},{\"id\":\"trade-barrier|phr-n\",\"term\":\"trade barrier\",\"reading\":\"/ˈtreɪd ˌbær.i.ər/\",\"meaning\":\"rào cản thương mại (thuế, hạn ngạch…)\",\"definitionEn\":\"a tax or rule that limits imports\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: remove trade barriers · reduce trade barriers\"},{\"id\":\"cultural-homogenisation|phr-n\",\"term\":\"cultural homogenisation\",\"reading\":\"/ˌkʌl.tʃər.əl həˌmɒdʒ.ən.aɪˈzeɪ.ʃən/\",\"meaning\":\"sự đồng nhất hóa văn hóa (các nền văn hóa trở nên giống nhau)\",\"definitionEn\":\"the process of different cultures becoming similar\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lead to cultural homogenisation\"},{\"id\":\"consumer|n\",\"term\":\"consumer\",\"reading\":\"/kənˈsjuː.mər/\",\"meaning\":\"người tiêu dùng\",\"definitionEn\":\"a person who buys goods or services\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Trọng âm: con-SU-mer — Hay đi với: consumers can choose · consumer goods\"},{\"id\":\"goods|n\",\"term\":\"goods\",\"reading\":\"/ɡʊdz/\",\"meaning\":\"hàng hóa\",\"definitionEn\":\"things that are made to be sold\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: imported goods · cheap goods\",\"example\":{\"text\":\"The total comprises five categories of goods.\",\"vi\":\"Tổng số gồm năm nhóm hàng hóa.\"}},{\"id\":\"local-business|phr-n\",\"term\":\"local business\",\"reading\":\"/ˌləʊ.kəl ˈbɪz.nɪs/\",\"meaning\":\"doanh nghiệp địa phương\",\"definitionEn\":\"a small company that serves people in its area\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: support local businesses · compete with local businesses\"},{\"id\":\"fast-food|phr-n\",\"term\":\"fast food\",\"reading\":\"/ˌfɑːst ˈfuːd/\",\"meaning\":\"đồ ăn nhanh\",\"definitionEn\":\"quick, cheap meals like burgers and fries\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: fast-food chains · eat fast food\"},{\"id\":\"interconnected|adj\",\"term\":\"interconnected\",\"reading\":\"/ˌɪn.tə.kəˈnek.tɪd/\",\"meaning\":\"kết nối chặt chẽ với nhau\",\"definitionEn\":\"closely linked to each other\",\"lesson\":41,\"pos\":\"adj\",\"hint\":\"Hay đi với: an interconnected world · closely interconnected\",\"example\":{\"text\":\"In an interconnected world, a crisis in one country quickly spreads to others.\",\"vi\":\"Trong một thế giới kết nối chặt chẽ, khủng hoảng ở một nước nhanh chóng lan sang nước khác.\"}},{\"id\":\"benefit-from|phr-v\",\"term\":\"benefit from\",\"reading\":\"/ˈben.ɪ.fɪt frəm/\",\"meaning\":\"được hưởng lợi từ\",\"definitionEn\":\"to get an advantage from something\",\"lesson\":41,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: benefit from trade · benefit from globalisation\"},{\"id\":\"impact|n\",\"term\":\"impact\",\"reading\":\"/ˈɪm.pækt/\",\"meaning\":\"tác động; ảnh hưởng\",\"definitionEn\":\"a strong effect\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: have an impact on · a positive/negative impact\",\"example\":{\"text\":\"Removing trade barriers has had a big impact on Vietnam's exports.\",\"vi\":\"Việc dỡ bỏ rào cản thương mại đã tác động lớn đến xuất khẩu của Việt Nam.\"}},{\"id\":\"manufacture|v\",\"term\":\"manufacture\",\"reading\":\"/ˌmæn.jəˈfæk.tʃər/\",\"meaning\":\"sản xuất (hàng loạt, trong nhà máy)\",\"definitionEn\":\"to make goods in large numbers in a factory\",\"lesson\":41,\"pos\":\"v\",\"hint\":\"Trọng âm: man-u-FAC-ture — Hay đi với: manufacture goods · be manufactured in Vietnam\"},{\"id\":\"outsource|v\",\"term\":\"outsource\",\"reading\":\"/ˈaʊt.sɔːs/\",\"meaning\":\"thuê ngoài (chuyển công việc cho công ty/nước khác làm)\",\"definitionEn\":\"to pay another company to do work for you\",\"lesson\":41,\"pos\":\"v\",\"hint\":\"Hay đi với: outsource production · outsource jobs to\",\"example\":{\"text\":\"Multinational corporations often outsource production to countries with lower wages.\",\"vi\":\"Các tập đoàn đa quốc gia thường thuê ngoài việc sản xuất ở các nước có lương thấp hơn.\"}}],\"lesson\":{\"number\":41,\"title\":\"Toàn cầu hóa · Reading: Summary completion\"}}]\n"])</script><script>self.__next_f.push([1,"2e:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=41\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2f:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-41-toan-cau-hoa-summary-completion/pronunciation\
