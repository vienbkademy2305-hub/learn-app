tch was very exciting.\",\"vi\":\"Trận bóng đá rất hấp dẫn.\"}},{\"id\":\"tired|adj\",\"term\":\"tired\",\"reading\":\"/taɪəd/\",\"meaning\":\"mệt\",\"definitionEn\":\"needing rest or sleep\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"Hay đi với: tired of something (chán ngấy)\",\"example\":{\"text\":\"Why are you so tired today?\",\"vi\":\"Sao hôm nay bạn mệt thế?\"}},{\"id\":\"tiring|adj\",\"term\":\"tiring\",\"reading\":\"/ˈtaɪə.rɪŋ/\",\"meaning\":\"gây mệt mỏi\",\"definitionEn\":\"making you need rest\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"After a tiring day at work, I felt very tired.\",\"vi\":\"Sau một ngày làm việc mệt nhọc, tôi thấy rất mệt.\"}},{\"id\":\"surprised|adj\",\"term\":\"surprised\",\"reading\":\"/səˈpraɪzd/\",\"meaning\":\"ngạc nhiên (cảm thấy)\",\"definitionEn\":\"feeling that something was not expected\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"sờ-PRAIZD: 2 chữ r. — Hay đi với: surprised at/by something\",\"example\":{\"text\":\"We were surprised when we heard the news.\",\"vi\":\"Chúng tôi ngạc nhiên khi nghe tin đó.\"}},{\"id\":\"surprising|adj\",\"term\":\"surprising\",\"reading\":\"/səˈpraɪ.zɪŋ/\",\"meaning\":\"đáng ngạc nhiên\",\"definitionEn\":\"not expected\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"It's surprising that he failed the exam.\",\"vi\":\"Thật bất ngờ là anh ấy trượt kỳ thi.\"}},{\"id\":\"embarrassed|adj\",\"term\":\"embarrassed\",\"reading\":\"/ɪmˈbær.əst/\",\"meaning\":\"xấu hổ; ngượng (cảm thấy)\",\"definitionEn\":\"feeling silly or ashamed in front of others\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"2 chữ r, 2 chữ s: em-BAR-RASSED. — Trọng âm: em-BAR-rassed\",\"example\":{\"text\":\"I felt embarrassed when I forgot her name.\",\"vi\":\"Tôi thấy ngượng khi quên tên cô ấy.\"}},{\"id\":\"embarrassing|adj\",\"term\":\"embarrassing\",\"reading\":\"/ɪmˈbær.ə.sɪŋ/\",\"meaning\":\"gây xấu hổ; ngượng ngùng\",\"definitionEn\":\"making you feel silly in front of others\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"It was an embarrassing mistake.\",\"vi\":\"Đó là một lỗi đáng xấu hổ.\"}},{\"id\":\"disappointed|adj\",\"term\":\"disappointed\",\"reading\":\"/ˌdɪs.əˈpɔɪn.tɪd/\",\"meaning\":\"thất vọng (cảm thấy)\",\"definitionEn\":\"sad because something was not as good as you hoped\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"1 chữ s, 2 chữ p: dis-ap-POINT-ed. — Trọng âm: dis-ap-POINT-ed — Hay đi với: disappointed with something/someone\",\"example\":{\"text\":\"We were disappointed with the hotel.\",\"vi\":\"Chúng tôi thất vọng về khách sạn.\"}},{\"id\":\"confused|adj\",\"term\":\"confused\",\"reading\":\"/kənˈfjuːzd/\",\"meaning\":\"bối rối; không hiểu\",\"definitionEn\":\"unable to understand something\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"Please speak slowly. I'm confused.\",\"vi\":\"Làm ơn nói chậm thôi. Tôi đang rối quá.\"}},{\"id\":\"confusing|adj\",\"term\":\"confusing\",\"reading\":\"/kənˈfjuː.zɪŋ/\",\"meaning\":\"khó hiểu; gây rối\",\"definitionEn\":\"difficult to understand\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"This exercise is confusing. I'm confused.\",\"vi\":\"Bài tập này khó hiểu quá. Tôi rối rồi.\"}},{\"id\":\"relaxed|adj\",\"term\":\"relaxed\",\"reading\":\"/rɪˈlækst/\",\"meaning\":\"thoải mái; thư thái\",\"definitionEn\":\"calm and not worried\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"I feel relaxed after a hot bath.\",\"vi\":\"Tắm nước nóng xong tôi thấy thư thái.\"}},{\"id\":\"nervous|adj\",\"term\":\"nervous\",\"reading\":\"/ˈnɜː.vəs/\",\"meaning\":\"lo lắng; hồi hộp\",\"definitionEn\":\"worried about something that will happen\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"NƠ-vờs: er đọc ơ. — Hay đi với: nervous about something\",\"example\":{\"text\":\"I'm always nervous before an interview.\",\"vi\":\"Tôi luôn hồi hộp trước buổi phỏng vấn.\"}},{\"id\":\"proud|adj\",\"term\":\"proud\",\"reading\":\"/praʊd/\",\"meaning\":\"tự hào\",\"definitionEn\":\"pleased about something you or others have done\",\"lesson\":17,\"pos\":\"adj\",\"hint\":\"Hay đi với: proud of someone/something\",\"example\":{\"text\":\"My parents are proud of me.\",\"vi\":\"Bố mẹ tự hào về tôi.\"}},{\"id\":\"lonely|adj\",\"term\":\"lonely\",\"reading\":\"/ˈləʊn.li/\",\"meaning\":\"cô đơn\",\"definitionEn\":\"sad because you are alone\",\"lesson\":17,\"pos\":\"adj\",\"example\":{\"text\":\"Old people sometimes feel lonely.\",\"vi\":\"Người già đôi khi thấy cô đơn.\"}},{\"id\":\"quickly|adv\",\"term\":\"quickly\",\"reading\":\"/ˈkwɪk.li/\",\"meaning\":\"nhanh chóng\",\"definitionEn\":\"at a fast speed\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"Get on the train quickly!\",\"vi\":\"Lên tàu nhanh lên!\"}},{\"id\":\"slowly|adv\",\"term\":\"slowly\",\"reading\":\"/ˈsləʊ.li/\",\"meaning\":\"chậm rãi\",\"definitionEn\":\"at a low speed\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"Please speak slowly. I'm confused.\",\"vi\":\"Làm ơn nói chậm thôi. Tôi đang rối quá.\"}},{\"id\":\"carefully|adv\",\"term\":\"carefully\",\"reading\":\"/ˈkeə.fəl.i/\",\"meaning\":\"cẩn thận\",\"definitionEn\":\"with attention, to avoid mistakes\",\"lesson\":17,\"pos\":\"adv\",\"hint\":\"Hay đi với: drive carefully · listen carefully\",\"example\":{\"text\":\"We planned our holiday very carefully.\",\"vi\":\"Chúng tôi lên kế hoạch cho kỳ nghỉ rất cẩn thận.\"}},{\"id\":\"well|adv\",\"term\":\"well\",\"reading\":\"/wel/\",\"meaning\":\"tốt; giỏi (cách làm)\",\"definitionEn\":\"in a good way\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"She was nervous, but she answered all the questions well.\",\"vi\":\"Cô ấy hồi hộp nhưng trả lời mọi câu hỏi rất tốt.\"}},{\"id\":\"badly|adv\",\"term\":\"badly\",\"reading\":\"/ˈbæd.li/\",\"meaning\":\"tệ; kém\",\"definitionEn\":\"in a poor way\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"I played badly and felt disappointed.\",\"vi\":\"Tôi chơi tệ và thấy thất vọng.\"}},{\"id\":\"loudly|adv\",\"term\":\"loudly\",\"reading\":\"/ˈlaʊd.li/\",\"meaning\":\"to; ầm ĩ\",\"definitionEn\":\"making a lot of noise\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"The children are laughing loudly in the garden.\",\"vi\":\"Bọn trẻ đang cười ầm ĩ trong vườn.\"}},{\"id\":\"quietly|adv\",\"term\":\"quietly\",\"reading\":\"/ˈkwaɪ.ət.li/\",\"meaning\":\"nhẹ nhàng; khẽ\",\"definitionEn\":\"making very little noise\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"She closed the door quietly because the baby was sleeping.\",\"vi\":\"Cô ấy khẽ đóng cửa vì em bé đang ngủ.\"}},{\"id\":\"easily|adv\",\"term\":\"easily\",\"reading\":\"/ˈiː.zəl.i/\",\"meaning\":\"dễ dàng\",\"definitionEn\":\"without difficulty\",\"lesson\":17,\"pos\":\"adv\",\"example\":{\"text\":\"My teacher explains things so clearly that I understand them easily.\",\"vi\":\"Cô giáo giảng rõ đến mức tôi hiểu rất dễ.\"}},{\"id\":\"listen-to|phr-v\",\"term\":\"listen to\",\"reading\":\"/ˈlɪs.ən tuː/\",\"meaning\":\"nghe (có chủ ý)\",\"definitionEn\":\"to pay attention to sounds or someone speaking\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"look-at|phr-v\",\"term\":\"look at\",\"reading\":\"/ˈlʊk æt/\",\"meaning\":\"nhìn vào\",\"definitionEn\":\"to turn your eyes towards something\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"look-for|phr-v\",\"term\":\"look for\",\"reading\":\"/ˈlʊk fɔː/\",\"meaning\":\"tìm kiếm\",\"definitionEn\":\"to try to find something\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"wait-for|phr-v\",\"term\":\"wait for\",\"reading\":\"/ˈweɪt fɔː/\",\"meaning\":\"chờ; đợi (ai/cái gì)\",\"definitionEn\":\"to stay until someone arrives or something happens\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"depend-on|phr-v\",\"term\":\"depend on\",\"reading\":\"/dɪˈpend ɒn/\",\"meaning\":\"phụ thuộc vào\",\"definitionEn\":\"to be decided by something else\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"belong-to|phr-v\",\"term\":\"belong to\",\"reading\":\"/bɪˈlɒŋ tuː/\",\"meaning\":\"thuộc về\",\"definitionEn\":\"to be owned by someone\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"talk-to|phr-v\",\"term\":\"talk to\",\"reading\":\"/ˈtɔːk tuː/\",\"meaning\":\"nói chuyện với\",\"definitionEn\":\"to have a conversation with someone\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"talk-about|phr-v\",\"term\":\"talk about\",\"reading\":\"/ˈtɔːk əˌbaʊt/\",\"meaning\":\"nói về\",\"definitionEn\":\"to discuss a topic\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"think-about|phr-v\",\"term\":\"think about\",\"reading\":\"/ˈθɪŋk əˌbaʊt/\",\"meaning\":\"nghĩ về; cân nhắc\",\"definitionEn\":\"to consider something carefully\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"agree-with|phr-v\",\"term\":\"agree with\",\"reading\":\"/əˈɡriː wɪð/\",\"meaning\":\"đồng ý với\",\"definitionEn\":\"to have the same opinion as someone\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"ask-for|phr-v\",\"term\":\"ask for\",\"reading\":\"/ˈɑːsk fɔː/\",\"meaning\":\"xin; yêu cầu (cái gì)\",\"definitionEn\":\"to say that you want something\",\"lesson\":18,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: ask for help · ask for the bill\"},{\"id\":\"laugh-at|phr-v\",\"term\":\"laugh at\",\"reading\":\"/ˈlɑːf æt/\",\"meaning\":\"cười nhạo; cười vì\",\"definitionEn\":\"to make fun of someone; to find something funny\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"apologise-for|phr-v\",\"term\":\"apologise for\",\"reading\":\"/əˈpɒl.ə.dʒaɪz fɔː/\",\"meaning\":\"xin lỗi vì\",\"definitionEn\":\"to say sorry about something you did\",\"lesson\":18,\"pos\":\"phr-v\"},{\"id\":\"smartphone|n\",\"term\":\"smartphone\",\"reading\":\"/ˈsmɑːt.fəʊn/\",\"meaning\":\"điện thoại thông minh\",\"definitionEn\":\"a mobile phone that can use apps and the internet\",\"lesson\":18,\"pos\":\"n\",\"example\":{\"text\":\"There is a message on the screen of your smartphone.\",\"vi\":\"Có một tin nhắn trên màn hình điện thoại của bạn.\"}},{\"id\":\"screen|n\",\"term\":\"screen\",\"reading\":\"/skriːn/\",\"meaning\":\"màn hình\",\"definitionEn\":\"the flat surface of a TV, computer or phone\",\"lesson\":18,\"pos\":\"n\",\"hint\":\"Hay đi với: on the screen · screen time\",\"example\":{\"text\":\"There is a message on the screen of your smartphone.\",\"vi\":\"Có một tin nhắn trên màn hình điện thoại của bạn.\"}},{\"id\":\"internet|n\",\"term\":\"internet\",\"reading\":\"/ˈɪn.tə.net/\",\"meaning\":\"mạng internet\",\"definitionEn\":\"the global network that connects computers\",\"lesson\":18,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-ter-net — Hay đi với: on the internet · internet connection\",\"example\":{\"text\":\"The internet is a great invention.\",\"vi\":\"Internet là một phát minh vĩ đại.\"}},{\"id\":\"website|n\",\"term\":\"website\",\"reading\":\"/ˈweb.saɪt/\",\"meaning\":\"trang web\",\"definitionEn\":\"a set of pages you visit online\",\"lesson\":18,\"pos\":\"n\",\"hint\":\"Hay đi với: on a website · visit a website\",\"example\":{\"text\":\"You can buy the tickets on the website or with an app.\",\"vi\":\"Bạn có thể mua vé trên trang web hoặc bằng một ứng dụng.\"}},{\"id\":\"app|n\",\"term\":\"app\",\"reading\":\"/æp/\",\"meaning\":\"ứng dụng\",\"definitionEn\":\"a program you download onto a phone or tablet\",\"lesson\":18,\"pos\":\"n\",\"example\":{\"text\":\"The app that I use most is a dictionary.\",\"vi\":\"Ứng dụng tôi dùng nhiều nhất là từ điển.\"}},{\"id\":\"laptop|n\",\"term\":\"laptop\",\"reading\":\"/ˈlæp.tɒp/\",\"meaning\":\"máy tính xách tay\",\"definitionEn\":\"a small computer that you can carry\",\"lesson\":18,\"pos\":\"n\",\"hint\":\"Hay đi với: on my laptop\",\"example\":{\"text\":\"My daughter studies online on her laptop.\",\"vi\":\"Con gái tôi học trực tuyến trên máy tính xách tay.\"}},{\"id\":\"online|adv\",\"term\":\"online\",\"reading\":\"/ˌɒnˈlaɪn/\",\"meaning\":\"trực tuyến; qua mạng\",\"definitionEn\":\"connected to or using the internet\",\"lesson\":18,\"pos\":\"adv\",\"hint\":\"Hay đi với: buy things online · study online\",\"example\":{\"text\":\"My daughter studies online on her laptop.\",\"vi\":\"Con gái tôi học t
