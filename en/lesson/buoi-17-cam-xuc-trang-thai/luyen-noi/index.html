 ầm ĩ\",\"extra\":\"/ˈlaʊd.li/\"},{\"group\":\"word\",\"text\":\"quietly\",\"vi\":\"nhẹ nhàng; khẽ\",\"extra\":\"/ˈkwaɪ.ət.li/\"},{\"group\":\"word\",\"text\":\"easily\",\"vi\":\"dễ dàng\",\"extra\":\"/ˈiː.zəl.i/\"},{\"group\":\"sentence\",\"text\":\"I am bored. This film is really boring.\",\"vi\":\"Tôi thấy chán quá. Bộ phim này thật tẻ nhạt.\"},{\"group\":\"sentence\",\"text\":\"Are you interested in history?\",\"vi\":\"Bạn có thích lịch sử không?\"},{\"group\":\"sentence\",\"text\":\"The football match was very exciting.\",\"vi\":\"Trận bóng đá rất hấp dẫn.\"},{\"group\":\"sentence\",\"text\":\"She is excited about her trip to Japan.\",\"vi\":\"Cô ấy háo hức về chuyến đi Nhật Bản.\"},{\"group\":\"sentence\",\"text\":\"After a tiring day at work, I felt very tired.\",\"vi\":\"Sau một ngày làm việc mệt nhọc, tôi thấy rất mệt.\"},{\"group\":\"sentence\",\"text\":\"We were surprised when we heard the news.\",\"vi\":\"Chúng tôi ngạc nhiên khi nghe tin đó.\"},{\"group\":\"sentence\",\"text\":\"My parents are proud of me.\",\"vi\":\"Bố mẹ tự hào về tôi.\"},{\"group\":\"sentence\",\"text\":\"This exercise is confusing. I'm confused.\",\"vi\":\"Bài tập này khó hiểu quá. Tôi rối rồi.\"},{\"group\":\"sentence\",\"text\":\"She was nervous, but she answered all the questions well.\",\"vi\":\"Cô ấy hồi hộp nhưng trả lời mọi câu hỏi rất tốt.\"},{\"group\":\"sentence\",\"text\":\"He read the letter carefully and then smiled.\",\"vi\":\"Anh ấy đọc lá thư thật kỹ rồi mỉm cười.\"},{\"group\":\"dialogue\",\"text\":\"You look tired. Are you OK?\",\"vi\":\"Trông bạn mệt quá. Bạn ổn chứ?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I'm a bit worried about my English test tomorrow.\",\"vi\":\"Mình hơi lo về bài kiểm tra tiếng Anh ngày mai.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Don't be nervous. You're a hard-working student.\",\"vi\":\"Đừng hồi hộp. Bạn chăm chỉ lắm mà.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Thanks. But the grammar is so confusing!\",\"vi\":\"Cảm ơn. Nhưng ngữ pháp khó hiểu quá!\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"I know. I thought last week's lesson was really interesting, though.\",\"vi\":\"Mình hiểu. Nhưng mình thấy bài tuần trước rất thú vị mà.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Yes, but I felt embarrassed when the teacher asked me a question.\",\"vi\":\"Ừ, nhưng mình thấy ngượng khi cô gọi mình trả lời.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Everyone makes mistakes. Let's study together tonight.\",\"vi\":\"Ai chẳng có lúc sai. Tối nay mình học cùng nhau nhé.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Great! I feel more relaxed now.\",\"vi\":\"Tuyệt! Giờ mình thấy nhẹ nhõm hơn rồi.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"You look tired. Are you OK?\",\"vi\":\"Trông bạn mệt quá. Bạn ổn chứ?\"},{\"speaker\":\"B\",\"text\":\"I'm a bit worried about my English test tomorrow.\",\"vi\":\"Mình hơi lo về bài kiểm tra tiếng Anh ngày mai.\"},{\"speaker\":\"A\",\"text\":\"Don't be nervous. You're a hard-working student.\",\"vi\":\"Đừng hồi hộp. Bạn chăm chỉ lắm mà.\"},{\"speaker\":\"B\",\"text\":\"Thanks. But the grammar is so confusing!\",\"vi\":\"Cảm ơn. Nhưng ngữ pháp khó hiểu quá!\"},{\"speaker\":\"A\",\"text\":\"I know. I thought last week's lesson was really interesting, though.\",\"vi\":\"Mình hiểu. Nhưng mình thấy bài tuần trước rất thú vị mà.\"},{\"speaker\":\"B\",\"text\":\"Yes, but I felt embarrassed when the teacher asked me a question.\",\"vi\":\"Ừ, nhưng mình thấy ngượng khi cô gọi mình trả lời.\"},{\"speaker\":\"A\",\"text\":\"Everyone makes mistakes. Let's study together tonight.\",\"vi\":\"Ai chẳng có lúc sai. Tối nay mình học cùng nhau nhé.\"},{\"speaker\":\"B\",\"text\":\"Great! I feel more relaxed now.\",\"vi\":\"Tuyệt! Giờ mình thấy nhẹ nhõm hơn rồi.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t bord
