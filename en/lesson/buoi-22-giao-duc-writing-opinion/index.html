at someone has created\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"Trọng âm: in-VEN-tion\",\"example\":{\"text\":\"The internet is a great invention.\",\"vi\":\"Internet là một phát minh vĩ đại.\"}},{\"id\":\"discover|v\",\"term\":\"discover\",\"reading\":\"/dɪˈskʌv.ə/\",\"meaning\":\"khám phá; phát hiện\",\"definitionEn\":\"to find something for the first time\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"design|v\",\"term\":\"design\",\"reading\":\"/dɪˈzaɪn/\",\"meaning\":\"thiết kế\",\"definitionEn\":\"to plan how something will look and work\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"grow|v\",\"term\":\"grow\",\"reading\":\"/ɡrəʊ/\",\"meaning\":\"trồng; lớn lên\",\"definitionEn\":\"to make plants develop; to get bigger\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"export|v\",\"term\":\"export\",\"reading\":\"/ɪkˈspɔːt/\",\"meaning\":\"xuất khẩu\",\"definitionEn\":\"to sell goods to another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: ex-PORT\"},{\"id\":\"import|v\",\"term\":\"import\",\"reading\":\"/ɪmˈpɔːt/\",\"meaning\":\"nhập khẩu\",\"definitionEn\":\"to buy goods from another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PORT\"},{\"id\":\"factory|n\",\"term\":\"factory\",\"reading\":\"/ˈfæk.tər.i/\",\"meaning\":\"nhà máy\",\"definitionEn\":\"a building where goods are made by machines\",\"lesson\":19,\"pos\":\"n\",\"example\":{\"text\":\"The factory produces a thousand cars a day.\",\"vi\":\"Nhà máy sản xuất một nghìn chiếc ô tô mỗi ngày.\"}},{\"id\":\"product|n\",\"term\":\"product\",\"reading\":\"/ˈprɒd.ʌkt/\",\"meaning\":\"sản phẩm\",\"definitionEn\":\"something that is made to be sold\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"Trọng âm: PRO-duct — Hay đi với: local products\"},{\"id\":\"material|n\",\"term\":\"material\",\"reading\":\"/məˈtɪə.ri.əl/\",\"meaning\":\"chất liệu; vật liệu\",\"definitionEn\":\"what something is made from, e.g. wood or cloth\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"mờ-TIR-i-ờl: nhấn âm 2. — Trọng âm: ma-TE-ri-al\" \"/kəˈrɪk.jə.ləm/\",\"meaning\":\"chương trình học; chương trình giảng dạy\",\"definitionEn\":\"all the subjects taught at a school or course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: cu-RI-cu-lum — Hay đi với: the school curriculum · change the curriculum\",\"example\":{\"text\":\"Our school has used a new curriculum since 2020.\",\"vi\":\"Trường chúng tôi dùng chương trình học mới từ năm 2020.\"}},{\"id\":\"tuition-fee|phr-n\",\"term\":\"tuition fee\",\"reading\":\"/tjuˈɪʃ.ən fiː/\",\"meaning\":\"học phí\",\"definitionEn\":\"the money you pay to study at a school or university\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: pay tuition fees · high tuition fees\"},{\"id\":\"qualification|n\",\"term\":\"qualification\",\"reading\":\"/ˌkwɒl.ɪ.fɪˈkeɪ.ʃən/\",\"meaning\":\"bằng cấp; chứng chỉ\",\"definitionEn\":\"an official record that you have passed a course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: qua-li-fi-CA-tion — Hay đi với: get a qualification · a qualification in accounting\",\"example\":{\"text\":\"A good qualification can help you find a better job.\",\"vi\":\"Một tấm bằng tốt có thể giúp bạn tìm được việc tốt hơn.\"}},{\"id\":\"knowledge|n\",\"term\":\"knowledge\",\"reading\":\"/ˈnɒl.ɪdʒ/\",\"meaning\":\"kiến thức; hiểu biết\",\"definitionEn\":\"information and understanding you have\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Chữ k câm: NOL-ij. — Trọng âm: KNOW-ledge — Hay đi với: gain knowledge · knowledge of history\",\"example\":{\"text\":\"You can gain a lot of knowledge from books.\",\"vi\":\"Bạn có thể thu được nhiều kiến thức từ sách.\"}},{\"id\":\"skill|n\",\"term\":\"skill\",\"reading\":\"/skɪl/\",\"meaning\":\"kỹ năng\",\"definitionEn\":\"an ability to do something well\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Hay đi với: improve your skills · language skills\"},{\"id\":\"lecturer|n\",\"term\":\"lecturer\",\"reading\":\"/ˈlek.tʃər.ər/\",\"meaning\":\"giảng viên (đại học)\",\"definitionEn\":\"a teacher at a university\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: LEC-tur-er\",\"example\":{\"text\":\"My lecturer has written three books about education.\",\"vi\":\"Giảng viên của tôi đã viết ba cuốn sách về giáo dục.\"}},{\"id\":\"scholarship|n\",\"term\":\"scholarship\",\"reading\":\"/ˈskɒl.ə.ʃɪp/\",\"meaning\":\"học bổng\",\"definitionEn\":\"money given to a student to pay for studies\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: SCHO-lar-ship — Hay đi với: win a scholarship · get a scholarship\",\"example\":{\"text\":\"Have you ever won a scholarship?\",\"vi\":\"Bạn đã bao giờ giành được học bổng chưa?\"}},{\"id\":\"academic|adj\",\"term\":\"academic\",\"reading\":\"/ˌæk.əˈdem.ɪk/\",\"meaning\":\"(thuộc) học thuật; học tập\",\"definitionEn\":\"connected with studying and schools or universities\",\"lesson\":21,\"pos\":\"adj\",\"hint\":\"Trọng âm: a-ca-DE-mic — Hay đi với: academic subjects · academic performance\",\"example\":{\"text\":\"He is good at academic subjects like maths and physics.\",\"vi\":\"Cậu ấy giỏi các môn học thuật như toán và vật lý.\"}},{\"id\":\"rote-learning|phr-n\",\"term\":\"rote learning\",\"reading\":\"/ˌrəʊt ˈlɜː.nɪŋ/\",\"meaning\":\"học vẹt; học thuộc lòng máy móc\",\"definitionEn\":\"learning by repeating facts without understanding them\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rely on rote learning · learn by rote\"},{\"id\":\"extracurricular-activity|phr-n\",\"term\":\"extracurricular activity\",\"reading\":\"/ˌek.strə.kəˈrɪk.jə.lər ækˈtɪv.ə.ti/\",\"meaning\":\"hoạt động ngoại khóa\",\"definitionEn\":\"an activity at school outside normal lessons\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: take part in extracurricular activities\"},{\"id\":\"attend|v\",\"term\":\"attend\",\"reading\":\"/əˈtend/\",\"meaning\":\"theo học; tham dự (lớp, buổi học, sự kiện)\",\"definitionEn\":\"to go to a class, meeting or event\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: at-TEND — Hay đi với: attend a class · attend school\"},{\"id\":\"improve|v\",\"term\":\"improve\",\"reading\":\"/ɪmˈpruːv/\",\"meaning\":\"cải thiện; tiến bộ\",\"definitionEn\":\"to become better or make something better\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PROVE — Hay đi với: improve your English · improve skills\",\"example\":{\"text\":\"Many graduates do internships in order to improve their job security.\",\"vi\":\"Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc.\"}},{\"id\":\"achieve|v\",\"term\":\"achieve\",\"reading\":\"/əˈtʃiːv/\",\"meaning\":\"đạt được (mục tiêu, kết quả)\",\"definitionEn\":\"to succeed in doing something after effort\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: a-CHIEVE — Hay đi với: achieve a goal · achieve good results\",\"example\":{\"text\":\"What do you want to achieve this year?\",\"vi\":\"Năm nay bạn muốn đạt được điều gì?\"}},{\"id\":\"main-idea|phr-n\",\"term\":\"main idea\",\"reading\":\"/ˌmeɪn aɪˈdɪə/\",\"meaning\":\"ý chính\",\"definitionEn\":\"the most important point of a text\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the main idea of a paragraph · find the main idea\"},{\"id\":\"paragraph|n\",\"term\":\"paragraph\",\"reading\":\"/ˈpær.ə.ɡrɑːf/\",\"meaning\":\"đoạn văn\",\"definitionEn\":\"a part of a text that starts on a new line\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: PA-ra-graph — Hay đi với: the first paragraph · write a paragraph\",\"example\":{\"text\":\"The main idea of a paragraph is often in the first sentence.\",\"vi\":\"Ý chính của một đoạn văn thường nằm ở câu đầu tiên.\"}},{\"id\":\"opinion|n\",\"term\":\"opinion\",\"reading\":\"/əˈpɪn.jən/\",\"meaning\":\"ý kiến; quan điểm\",\"definitionEn\":\"what you think about something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"ờ-PIN-yờn: nhấn âm 2. — Trọng âm: o-PI-nion — Hay đi với: in my opinion · express an opinion\",\"example\":{\"text\":\"Misleading headlines can change public opinion very quickly.\",\"vi\":\"Những tiêu đề gây hiểu lầm có thể thay đổi dư luận rất nhanh.\"}},{\"id\":\"argue|v\",\"term\":\"argue\",\"reading\":\"/ˈɑːɡ.juː/\",\"meaning\":\"lập luận; cho rằng\",\"definitionEn\":\"to give reasons to support an idea\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: AR-gue — Hay đi với: argue that… · it is often argued that…\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"believe|v\",\"term\":\"believe\",\"reading\":\"/bɪˈliːv/\",\"meaning\":\"tin; cho rằng\",\"definitionEn\":\"to think that something is true\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"“Be-LIE-ve”: đừng tin lời nói dối; i đứng trước e. — Trọng âm: be-LIEVE — Hay đi với: believe that… · strongly believe\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"disagree|v\",\"term\":\"disagree\",\"reading\":\"/ˌdɪs.əˈɡriː/\",\"meaning\":\"không đồng ý; phản đối\",\"definitionEn\":\"to have a different opinion\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: dis-a-GREE — Hay đi với: disagree with someone · strongly disagree\",\"example\":{\"text\":\"You can agree or disagree, but you must give clear reasons.\",\"vi\":\"Bạn có thể đồng ý hoặc phản đối, nhưng phải đưa ra lý do rõ ràng.\"}},{\"id\":\"reason|n\",\"term\":\"reason\",\"reading\":\"/ˈriː.zən/\",\"meaning\":\"lý do\",\"definitionEn\":\"why something happens or why someone does something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: REA-son — Hay đi với: the main reason · for two reasons\",\"example\":{\"text\":\"The reason space research is worth funding is that it produces useful spin-offs.\",\"vi\":\"Lý do nghiên cứu vũ trụ đáng được tài trợ là nó tạo ra nhiều ứng dụng hữu ích.\"}},{\"id\":\"benefit|n\",\"term\":\"benefit\",\"reading\":\"/ˈben.ɪ.fɪt/\",\"meaning\":\"lợi ích\",\"definitionEn\":\"a good effect or advantage\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: BE-ne-fit — Hay đi với: the benefits of… · a major benefit\",\"example\":{\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"}},{\"id\":\"drawback|n\",\"term\":\"drawback\",\"reading\":\"/ˈdrɔː.bæk/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"a problem that makes something less attractive\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: DRAW-back — Hay đi với: the main drawback · a serious drawback\",\"example\":{\"text\":\"The main drawback of online classes is the lack of contact with teachers.\",\"vi\":\"Nhược điểm chính của lớp học online là thiếu tiếp xúc với giáo viên.\"}},{\"id\":\"positive|adj\",\"term\":\"positive\",\"reading\":\"/ˈpɒz.ə.tɪv/\",\"meaning\":\"tích cực\",\"definitionEn\":\"good or helpful; hopeful\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PO-si-tive — Hay đi với: a positive effect · positive attitude\",\"example\":{\"text\":\"Sport has a positive effect on students' health.\",\"vi\":\"Thể thao có ảnh hưởng tích cực đến sức khỏe của học sinh.\"}},{\"id\":\"negative|adj\",\"term\":\"negative\",\"reading\":\"/ˈneɡ.ə.tɪv/\",\"meaning\":\"tiêu cực\",\"definitionEn\":\"bad or harmful\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: NE-ga-tive — Hay đi với: a negative effect on… · negative impact\",\"example\":{\"text\":\"Too much screen time can have a negative effect on children.\",\"vi\":\"Dùng màn hình quá nhiều có thể ảnh hưởng tiêu cực đến trẻ em.\"}},{\"id\":\"compulsory|adj\",\"term\":\"compulsory\",\"reading\":\"/kəmˈpʌl.sər.i/\",\"meaning\":\"bắt buộc\",\"definitionEn\":\"required by a rule or law\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: com-PUL-so-ry — Hay đi với: compulsory subject · compulsory education\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"essential|adj\",\"term\":\"essential\",\"reading\":\"/ɪˈsen.ʃəl/\",\"meaning\":\"thiết yếu; rất cần thiết\",\"definitionEn\":\"absolutely necessary\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: es-SEN-tial — Hay đi với: essential for… · it is essential to…\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"creativity|n\",\"term\":\"creativity\",\"reading\":\"/ˌkriː.eɪˈtɪv.ə.ti/\",\"meaning\":\"sự sáng tạo; khả năng sáng tạo\",\"definitionEn\":\"the ability to produce new and original ideas\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: cre-a-TI-vi-ty — Hay đi với: develop creativity · encourage creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"independent|adj\",\"term\":\"independent\",\"reading\":\"/ˌɪn.dɪˈpen.dənt/\",\"meaning\":\"tự lập; độc lập\",\"definitionEn\":\"able to do things without help from others\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-de-PEN-dent — Hay đi với: become independent · independent learners\",\"example\":{\"text\":\"University students should be more independent than school children.\",\"vi\":\"Sinh viên đại học nên tự lập hơn học sinh phổ thông.\"}},{\"id\":\"practical|adj\",\"term\":\"practical\",\"reading\":\"/ˈpræk.tɪ.kəl/\",\"meaning\":\"thực tế; thực hành\",\"definitionEn\":\"connected with real situations rather than ideas\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PRAC-ti-cal — Hay đi với: practical skills · practical experience\",\"example\":{\"text\":\"Cooking and managing money are practical skills.\",\"vi\":\"Nấu ăn và quản lý tiền bạc là những kỹ năng thực tế.\"}},{\"id\":\"pressure|n\",\"term\":\"pressure\",\"reading\":\"/ˈpreʃ.ər/\",\"meaning\":\"áp lực\",\"definitionEn\":\"a feeling that you must do something, causing stress\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: PRES-sure — Hay đi với: put pressure on someone · under pressure\",\"example\":{\"text\":\"Some teenagers start smoking due to peer pressure.\",\"vi\":\"Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè.\"}},{\"id\":\"critical-thinking|phr-n\",\"term\":\"critical thinking\",\"reading\":\"/ˌkrɪt.ɪ.kəl ˈθɪŋ.kɪŋ/\",\"meaning\":\"tư duy phản biện\",\"definitionEn\":\"the ability to judge information carefully and logically\",\"lesson\":22,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: develop critical thinking · critical thinking skills\"},{\"id\":\"develop|v\",\"term\":\"develop\",\"reading\":\"/dɪˈvel.əp/\",\"meaning\":\"phát triển; rèn luyện (kỹ năng)\",\"definitionEn\":\"to grow or make something grow stronger\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"di-VEL-ờp: không có e ở cuối. — Trọng âm: de-VE-lop — Hay đi với: develop skills · develop creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}}],\"lesson\":{\"number\":22,\"title\":\"Giáo dục · Writing Task 2: bài Opinion\"}}]\n"])</script><script>self.__next_f.push([1,"2c:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=22\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2d:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",
