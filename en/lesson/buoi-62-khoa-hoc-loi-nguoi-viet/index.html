at sells goods to the public\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: online retailers · large retailers\"},{\"id\":\"e-commerce|n\",\"term\":\"e-commerce\",\"reading\":\"/ˈiːˌkɒm.ɜːs/\",\"meaning\":\"thương mại điện tử\",\"definitionEn\":\"buying and selling online\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: the growth of e-commerce · e-commerce platforms\"},{\"id\":\"considerably|adv\",\"term\":\"considerably\",\"reading\":\"/kənˈsɪd.ər.ə.bli/\",\"meaning\":\"đáng kể; nhiều\",\"definitionEn\":\"by a large amount\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Trọng âm: con-SID-er-a-bly — Hay đi với: considerably higher · considerably more than\",\"example\":{\"text\":\"Spending on housing was considerably higher in the city than in rural areas.\",\"vi\":\"Chi tiêu cho nhà ở tại thành phố cao hơn đáng kể so với nông thôn.\"}},{\"id\":\"marginally|adv\",\"term\":\"marginally\",\"reading\":\"/ˈmɑː.dʒɪ.nəl.i/\",\"meaning\":\"không đáng kể; nhỉnh hơn một chút\",\"definitionEn\":\"by a very small amount\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Hay đi với: marginally lower · marginally more popular\",\"example\":{\"text\":\"The proportion spent on utilities was marginally lower in 2020 than in 2010.\",\"vi\":\"Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010.\"}},{\"id\":\"substantially|adv\",\"term\":\"substantially\",\"reading\":\"/səbˈstæn.ʃəl.i/\",\"meaning\":\"một cách đáng kể; rất nhiều\",\"definitionEn\":\"by a large amount; greatly\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Hay đi với: substantially higher · rise substantially\",\"example\":{\"text\":\"The table covers food and housing; the former fell, whereas the latter rose substantially.\",\"vi\":\"Bảng gồm thực phẩm và nhà ở; khoản trước giảm, trong khi khoản sau tăng đáng kể.\"}},{\"id\":\"by-far|idiom\",\"term\":\"by far\",\"reading\":\"/ˌbaɪ ˈfɑːr/\",\"meaning\":\"hơn hẳn; (lớn/cao…) nhất với cách biệt xa\",\"definitionEn\":\"by a very large amount\",\"lesson\":59,\"pos\":\"idiom\",\"hint\":\"Hay đi với: by far the largest · by far the most popular\"},{\"id\":\"exceed|v\",\"term\":\"exceed\",\"reading\":\"/ɪkˈsiːd/\",\"meaning\":\"vượt quá\",\"definitionEn\":\"to be more than a certain amount\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: exceed 50% · exceed the figure for\"},{\"id\":\"overtake|v\",\"term\":\"overtake\",\"reading\":\"/ˌəʊ.vəˈteɪk/\",\"meaning\":\"vượt lên; vượt qua\",\"definitionEn\":\"to go past something that was ahead\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-TAKE — Hay đi với: overtake food as the largest expense\"},{\"id\":\"triple|v\",\"term\":\"triple\",\"reading\":\"/ˈtrɪp.əl/\",\"meaning\":\"tăng gấp ba\",\"definitionEn\":\"to become three times as large\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: almost triple · triple over the period\"},{\"id\":\"halve|v\",\"term\":\"halve\",\"reading\":\"/hɑːv/\",\"meaning\":\"giảm một nửa\",\"definitionEn\":\"to reduce by fifty per cent\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: be halved · almost halve\"},{\"id\":\"the-former|pron\",\"term\":\"the former\",\"reading\":\"/ðə ˈfɔː.mər/\",\"meaning\":\"cái/người thứ nhất (trong hai cái vừa nhắc)\",\"definitionEn\":\"the first of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the former …, whereas the latter …\"},{\"id\":\"the-latter|pron\",\"term\":\"the latter\",\"reading\":\"/ðə ˈlæt.ər/\",\"meaning\":\"cái/người thứ hai (trong hai cái vừa nhắc)\",\"definitionEn\":\"the second of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the latter rose to 30%\"},{\"id\":\"negligible|adj\",\"term\":\"negligible\",\"reading\":\"/ˈneɡ.lɪ.dʒə.bəl/\",\"meaning\":\"không đáng kể\",\"definitionEn\":\"so small it is not important\",\"lesson\":59,\"pos\":\"adj\",\"hint\":\"Trọng âm: NEG-li-gi-ble — Hay đi với: a negligible change · the difference was negligible\",\"example\":{\"text\":\"The change in spending on clothes was negligible.\",\"vi\":\"Thay đổi trong chi tiêu cho quần áo là không đáng kể.\"}},{\"id\":\"comparable|adj\",\"term\":\"comparable\",\"reading\":\"/ˈkɒm.pər.ə.bəl/\",\"meaning\":\"tương đương; có thể so sánh được\",\"definitionEn\":\"similar in size or quality\",\"lesson\":59,\"pos\":\"adj\",\"hint\":\"Trọng âm: COM-pa-ra-ble — Hay đi với: comparable figures · be comparable to\",\"example\":{\"text\":\"The figures for the two countries are comparable.\",\"vi\":\"Số liệu của hai nước tương đương nhau.\"}},{\"id\":\"allocate|v\",\"term\":\"allocate\",\"reading\":\"/ˈæl.ə.keɪt/\",\"meaning\":\"phân bổ; dành (tiền, thời gian) cho\",\"definitionEn\":\"to give an amount of money or time for a purpose\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: allocate 30% of income to housing\"},{\"id\":\"utilities|n\",\"term\":\"utilities\",\"reading\":\"/juːˈtɪl.ə.tiz/\",\"meaning\":\"các dịch vụ tiện ích (điện, nước, gas)\",\"definitionEn\":\"services such as electricity, water and gas\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Hay đi với: spending on utilities · utility bills\",\"example\":{\"text\":\"The proportion spent on utilities was marginally lower in 2020 than in 2010.\",\"vi\":\"Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010.\"}},{\"id\":\"leisure|n\",\"term\":\"leisure\",\"reading\":\"/ˈleʒ.ər/\",\"meaning\":\"giải trí; thời gian rảnh\",\"definitionEn\":\"free time when you can relax\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"LE-zhờ (Anh) hoặc LI-zhờ (Mỹ). — Hay đi với: leisure activities · spending on leisure\",\"example\":{\"text\":\"The higher a family's income, the more it spends on leisure.\",\"vi\":\"Thu nhập gia đình càng cao thì càng chi nhiều cho giải trí.\"}},{\"id\":\"groceries|n\",\"term\":\"groceries\",\"reading\":\"/ˈɡrəʊ.sər.iz/\",\"meaning\":\"thực phẩm và đồ dùng hằng ngày (mua ở siêu thị)\",\"definitionEn\":\"food and household items bought at a supermarket\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"GRÔU-sờ-riz. — Hay đi với: spend on groceries · grocery shopping\",\"example\":{\"text\":\"Spending on groceries was almost as high as spending on transport.\",\"vi\":\"Chi cho thực phẩm gần bằng chi cho đi lại.\"}},{\"id\":\"income|n\",\"term\":\"income\",\"reading\":\"/ˈɪn.kʌm/\",\"meaning\":\"thu nhập\",\"definitionEn\":\"money you receive regularly from work or investments\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Hay đi với: average income · household income\",\"example\":{\"text\":\"The higher a family's income, the more it spends on leisure.\",\"vi\":\"Thu nhập gia đình càng cao thì càng chi nhiều cho giải trí.\"}},{\"id\":\"revenue|n\",\"term\":\"revenue\",\"reading\":\"/ˈrev.ən.juː/\",\"meaning\":\"doanh thu\",\"definitionEn\":\"the money a business or government receives\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Trọng âm: REV-e-nue — Hay đi với: sales revenue · revenue from online sales\",\"example\":{\"text\":\"Online revenue tripled over the period, while shop sales were almost halved.\",\"vi\":\"Doanh thu trực tuyến tăng gấp ba trong giai đoạn này, trong khi doanh số tại cửa hàng giảm gần một nửa.\"}},{\"id\":\"exhibition|n\",\"term\":\"exhibition\",\"reading\":\"/ˌek.sɪˈbɪʃ.ən/\",\"meaning\":\"triển lãm\",\"definitionEn\":\"a public show of art or other objects\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-hi-BI-tion — Hay đi với: an art exhibition · hold an exhibition\",\"example\":{\"text\":\"The exhibition includes portraits and sculptures by young Vietnamese artists.\",\"vi\":\"Triển lãm gồm tranh chân dung và tác phẩm điêu khắc của các nghệ sĩ trẻ Việt Nam.\"}},{\"id\":\"gallery|n\",\"term\":\"gallery\",\"reading\":\"/ˈɡæl.ər.i/\",\"meaning\":\"phòng trưng bày tranh; bảo tàng mỹ thuật\",\"definitionEn\":\"a building where art is shown\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: an art gallery · the national gallery\",\"example\":{\"text\":\"Had the gallery received more funding, it would not have closed.\",\"vi\":\"Nếu phòng tranh được tài trợ nhiều hơn thì nó đã không đóng cửa.\"}},{\"id\":\"sculpture|n\",\"term\":\"sculpture\",\"reading\":\"/ˈskʌlp.tʃər/\",\"meaning\":\"tác phẩm điêu khắc; nghệ thuật điêu khắc\",\"definitionEn\":\"a piece of art made from stone, wood or metal\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a bronze sculpture · modern sculpture\"},{\"id\":\"masterpiece|n\",\"term\":\"masterpiece\",\"reading\":\"/ˈmɑː.stə.piːs/\",\"meaning\":\"kiệt tác\",\"definitionEn\":\"an extremely good work of art\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a true masterpiece · be regarded as a masterpiece\",\"example\":{\"text\":\"Many people regard this painting as a masterpiece.\",\"vi\":\"Nhiều người coi bức tranh này là một kiệt tác.\"}},{\"id\":\"performance|n\",\"term\":\"performance\",\"reading\":\"/pəˈfɔː.məns/\",\"meaning\":\"buổi biểu diễn; màn trình diễn\",\"definitionEn\":\"the act of entertaining an audience\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"pờ-FOR-mờns: nhấn âm 2. — Trọng âm: per-FOR-mance — Hay đi với: a live performance · give a performance\",\"example\":{\"text\":\"The playwright gave a short speech after the performance.\",\"vi\":\"Nhà viết kịch có bài phát biểu ngắn sau buổi diễn.\"}},{\"id\":\"critic|n\",\"term\":\"critic\",\"reading\":\"/ˈkrɪt.ɪk/\",\"meaning\":\"nhà phê bình\",\"definitionEn\":\"a person who writes reviews of films, books or art\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a film critic · praised by critics\"},{\"id\":\"review|n\",\"term\":\"review\",\"reading\":\"/rɪˈvjuː/\",\"meaning\":\"bài phê bình; bài đánh giá\",\"definitionEn\":\"an article giving an opinion of a film, book or show\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: good reviews · mixed reviews\"},{\"id\":\"box-office|phr-n\",\"term\":\"box office\",\"reading\":\"/ˈbɒks ˌɒf.ɪs/\",\"meaning\":\"phòng vé; doanh thu phòng vé\",\"definitionEn\":\"the place where tickets are sold; ticket sales\",\"lesson\":60,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a box office hit · do well at the box office\"},{\"id\":\"sequel|n\",\"term\":\"sequel\",\"reading\":\"/ˈsiː.kwəl/\",\"meaning\":\"phần tiếp theo (phim, truyện)\",\"definitionEn\":\"a film or book that continues the story of an earlier one\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a sequel to · make a sequel\",\"example\":{\"text\":\"The sequel might have done better at the box office if the critics had liked it.\",\"vi\":\"Phần tiếp theo có lẽ đã có doanh thu phòng vé tốt hơn nếu giới phê bình thích nó.\"}},{\"id\":\"soundtrack|n\",\"term\":\"soundtrack\",\"reading\":\"/ˈsaʊnd.træk/\",\"meaning\":\"nhạc phim\",\"definitionEn\":\"the music played in a film\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the film's soundtrack\",\"example\":{\"text\":\"The film received mixed reviews, but its soundtrack was a huge success.\",\"vi\":\"Bộ phim nhận đánh giá trái chiều, nhưng nhạc phim thì rất thành công.\"}},{\"id\":\"playwright|n\",\"term\":\"playwright\",\"reading\":\"/ˈpleɪ.raɪt/\",\"meaning\":\"nhà viết kịch\",\"definitionEn\":\"a person who writes plays\",\"lesson\":60,\"pos\":\"n\",\"example\":{\"text\":\"The playwright gave a short speech after the performance.\",\"vi\":\"Nhà viết kịch có bài phát biểu ngắn sau buổi diễn.\"}},{\"id\":\"sold-out|adj\",\"term\":\"sold-out\",\"reading\":\"/ˌsəʊld ˈaʊt/\",\"meaning\":\"bán hết vé\",\"definitionEn\":\"with no tickets left\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: a sold-out concert · the show was sold out\"},{\"id\":\"premiere|n\",\"term\":\"premiere\",\"reading\":\"/ˈprem.i.eər/\",\"meaning\":\"buổi công chiếu đầu tiên\",\"definitionEn\":\"the first public showing of a film or play\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the world premiere · attend the premiere\",\"example\":{\"text\":\"If we had booked earlier, we would have got tickets for the premiere.\",\"vi\":\"Nếu chúng tôi đặt sớm hơn thì đã có vé xem buổi công chiếu.\"}},{\"id\":\"blockbuster|n\",\"term\":\"blockbuster\",\"reading\":\"/ˈblɒkˌbʌs.tər/\",\"meaning\":\"phim bom tấn\",\"definitionEn\":\"a very successful film with a big budget\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a Hollywood blockbuster · a summer blockbuster\"},{\"id\":\"portrait|n\",\"term\":\"portrait\",\"reading\":\"/ˈpɔː.trət/\",\"meaning\":\"chân dung\",\"definitionEn\":\"a painting or photo of a person\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: paint a portrait · a self-portrait\"},{\"id\":\"abstract|adj\",\"term\":\"abstract\",\"reading\":\"/ˈæb.strækt/\",\"meaning\":\"trừu tượng\",\"definitionEn\":\"(of art) using shapes and colours, not real objects\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: abstract art · abstract ideas\",\"example\":{\"text\":\"If I had learnt to paint as a child, I would enjoy abstract art more now.\",\"vi\":\"Nếu hồi nhỏ tôi học vẽ thì giờ tôi sẽ thích nghệ thuật trừu tượng hơn.\"}},{\"id\":\"critically-acclaimed|adj\",\"term\":\"critically acclaimed\",\"reading\":\"/ˌkrɪt.ɪ.kəl.i əˈkleɪmd/\",\"meaning\":\"được giới phê bình ca ngợi\",\"definitionEn\":\"praised by professional reviewers\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: a critically acclaimed film\"},{\"id\":\"genre|n\",\"term\":\"genre\",\"reading\":\"/ˈʒɒn.rə/\",\"meaning\":\"thể loại\",\"definitionEn\":\"a type of film, music or book\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a film genre · my favourite genre\",\"example\":{\"text\":\"Documentaries are a genre that is becoming more popular with young audiences.\",\"vi\":\"Phim tài liệu là một thể loại đang ngày càng được khán giả trẻ yêu thích.\"}},{\"id\":\"accomplishment|n\",\"term\":\"accomplishment\",\"reading\":\"/əˈkʌm.plɪʃ.mənt/\",\"meaning\":\"thành tựu; việc đã làm được\",\"definitionEn\":\"something you have succeeded in doing\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Trọng âm: ac-COM-plish-ment — Hay đi với: a sense of accomplishment · a great accomplishment\",\"example\":{\"text\":\"Finishing the marathon gave me a real sense of accomplishment.\",\"vi\":\"Hoàn thành cuộc chạy marathon cho tôi cảm giác thành tựu thật sự.\"}},{\"id\":\"milestone|n\",\"term\":\"milestone\",\"reading\":\"/ˈmaɪl.stəʊn/\",\"meaning\":\"cột mốc (quan trọng)\",\"definitionEn\":\"an important event in a process or life\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: an important milestone · reach a milestone\",\"example\":{\"text\":\"Getting into university was a milestone, but moving abroad was the real turning point.\",\"vi\":\"Đỗ đại học là một cột mốc, nhưng ra nước ngoài mới là bước ngoặt thật sự.\"}},{\"id\":\"turning-point|phr-n\",\"term\":\"turning point\",\"reading\":\"/ˈtɜː.nɪŋ ˌpɔɪnt/\",\"meaning\":\"bước ngoặt\",\"definitionEn\":\"a moment when an important change happens\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a turning point in my life · mark a turning point\"},{\"id\":\"nostalgic|adj\",\"term\":\"nostalgic\",\"reading\":\"/nɒsˈtæl.dʒɪk/\",\"meaning\":\"hoài niệm; nhớ về quá khứ\",\"definitionEn\":\"thinking happily about the past\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Trọng âm: nos-TAL-gic — Hay đi với: feel nostalgic about · a nostalgic song\",\"example\":{\"text\":\"That old song always makes me feel nostalgic about my student days.\",\"vi\":\"Bài hát cũ đó luôn khiến tôi hoài niệm về thời sinh viên.\"}},{\"id\":\"rehearse|v\",\"term\":\"rehearse\",\"reading\":\"/rɪˈhɜːs/\",\"meaning\":\"tập dượt (trước khi biểu diễn)\",\"definitionEn\":\"to practise a performance before the real show\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Hay đi với: rehearse for a show · rehearse every evening\"},{\"id\":\"stage-fright|phr-n\",\"term\":\"stage fright\",\"reading\":\"/ˈsteɪdʒ ˌfraɪt/\",\"meaning\":\"chứng sợ sân khấu; run khi lên sân khấu\",\"definitionEn\":\"fear of performing in front of an audience\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: suffer from stage fright · overcome stage fright\"},{\"id\":\"applause|n\",\"term\":\"applause\",\"reading\":\"/əˈplɔːz/\",\"meaning\":\"tràng pháo tay\",\"definitionEn\":\"the sound of people clapping\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: loud applause · a round of applause\",\"example\":{\"text\":\"By the time the applause started, I had forgotten all my fears.\",\"vi\":\"Đến khi tràng pháo tay vang lên, tôi đã quên hết mọi nỗi sợ.\"}},{\"id\":\"overcome|v\",\"term\":\"overcome\",\"reading\":\"/ˌəʊ.vəˈkʌm/\",\"meaning\":\"vượt qua (khó khăn, nỗi sợ)\",\"definitionEn\":\"to succeed in dealing with a difficulty\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-COME — Hay đi với: overcome a fear · overcome difficulties\"},{\"id\":\"determination|n\",\"term\":\"determination\",\"reading\":\"/dɪˌtɜː.mɪˈneɪ.ʃən/\",\"meaning\":\"sự quyết tâm\",\"definitionEn\":\"the quality of not giving up\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: with great determination · sheer determination\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"vividly|adv\",\"term\":\"vividly\",\"reading\":\"/ˈvɪv.ɪd.li/\",\"meaning\":\"rõ ràng; sống động\",\"definitionEn\":\"in a very clear and detailed way\",\"lesson\":61,\"pos\":\"adv\",\"hint\":\"Hay đi với: I vividly remember · vividly describe\",\"example\":{\"text\":\"I still vividly remember the day I overcame my fear of speaking in public.\",\"vi\":\"Tôi vẫn nhớ rõ ngày tôi vượt qua nỗi sợ nói trước đám đông.\"}},{\"id\":\"look-back-on|phr-v\",\"term\":\"look back on\",\"reading\":\"/ˌlʊk ˈbæk ɒn/\",\"meaning\":\"nhìn lại; hồi tưởng\",\"definitionEn\":\"to think about something in the past\",\"lesson\":61,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look back on my school days · look back on the experience\"},{\"id\":\"perseverance|n\",\"term\":\"perseverance\",\"reading\":\"/ˌpɜː.sɪˈvɪə.rəns/\",\"meaning\":\"sự kiên trì; bền bỉ\",\"definitionEn\":\"continuing to try despite difficulties\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Trọng âm: per-se-VE-rance — Hay đi với: patience and perseverance\",\"example\":{\"text\":\"It took a lot of perseverance and dedication to learn the piano as an adult.\",\"vi\":\"Học piano khi đã trưởng thành đòi hỏi rất nhiều kiên trì và tận tâm.\"}},{\"id\":\"audition|n\",\"term\":\"audition\",\"reading\":\"/ɔːˈdɪʃ.ən/\",\"meaning\":\"buổi thử giọng; thử vai\",\"definitionEn\":\"a short performance to test if someone is suitable for a role\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: pass an audition · go to an audition\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"rewarding|adj\",\"term\":\"rewarding\",\"reading\":\"/rɪˈwɔː.dɪŋ/\",\"meaning\":\"đáng công; mang lại sự hài lòng\",\"definitionEn\":\"giving satisfaction\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: a rewarding experience · extremely rewarding\",\"example\":{\"text\":\"Looking back on it, the experience was extremely rewarding.\",\"vi\":\"Nhìn lại thì trải nghiệm đó rất đáng giá.\"}},{\"id\":\"self-confidence|n\",\"term\":\"self-confidence\",\"reading\":\"/ˌselfˈkɒn.fɪ.dəns/\",\"meaning\":\"sự tự tin\",\"definitionEn\":\"belief in your own abilities\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: build self-confidence · lack self-confidence\"},{\"id\":\"unforgettable|adj\",\"term\":\"unforgettable\",\"reading\":\"/ˌʌn.fəˈɡet.ə.bəl/\",\"meaning\":\"không thể quên\",\"definitionEn\":\"impossible to stop remembering\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: an unforgettable night · an unforgettable experience\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"in-hindsight|idiom\",\"term\":\"in hindsight\",\"reading\":\"/ɪn ˈhaɪnd.saɪt/\",\"meaning\":\"nhìn lại thì; giờ nghĩ lại\",\"definitionEn\":\"when thinking about the past with what you know now\",\"lesson\":61,\"pos\":\"idiom\"},{\"id\":\"dedication|n\",\"term\":\"dedication\",\"reading\":\"/ˌded.ɪˈkeɪ.ʃən/\",\"meaning\":\"sự tận tâm; cống hiến\",\"definitionEn\":\"hard work and commitment\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: hard work and dedication\",\"example\":{\"text\":\"It took a lot of perseverance and dedication to learn the piano as an adult.\",\"vi\":\"Học piano khi đã trưởng thành đòi hỏi rất nhiều kiên trì và tận tâm.\"}},{\"id\":\"astronaut|n\",\"term\":\"astronaut\",\"reading\":\"/ˈæs.trə.nɔːt/\",\"meaning\":\"phi hành gia\",\"definitionEn\":\"a person who travels into space\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Trọng âm: AS-tro-naut — Hay đi với: train as an astronaut · astronauts on the space station\"},{\"id\":\"planet|n\",\"term\":\"planet\",\"reading\":\"/ˈplæn.ɪt/\",\"meaning\":\"hành tinh\",\"definitionEn\":\"a large round object that moves around a star\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: the planet Mars · other planets\",\"example\":{\"text\":\"No other habitable planet has been found so far.\",\"vi\":\"Cho đến nay chưa tìm thấy hành tinh nào khác có thể sinh sống.\"}},{\"id\":\"orbit|v\",\"term\":\"orbit\",\"reading\":\"/ˈɔː.bɪt/\",\"meaning\":\"quay quanh (quỹ đạo)\",\"definitionEn\":\"to move in a circle around a planet or star\",\"lesson\":62,\"pos\":\"v\",\"hint\":\"Hay đi với: orbit the Earth · orbit the Sun\",\"example\":{\"text\":\"The satellite was launched into orbit in 2023.\",\"vi\":\"Vệ tinh được phóng lên quỹ đạo năm 2023.\"}},{\"id\":\"satellite|n\",\"term\":\"satellite\",\"reading\":\"/ˈsæt.əl.aɪt/\",\"meaning\":\"vệ tinh\",\"definitionEn\":\"a machine sent into space to go around the Earth\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Trọng âm: SAT-el-lite — Hay đi với: launch a satellite · satellite images\",\"example\":{\"text\":\"The satellite was launched into orbit in 2023.\",\"vi\":\"Vệ tinh được phóng lên quỹ đạo năm 2023.\"}},{\"id\":\"telescope|n\",\"term\":\"telescope\",\"reading\":\"/ˈtel.ɪ.skəʊp/\",\"meaning\":\"kính thiên văn\",\"definitionEn\":\"an instrument for looking at distant objects\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: look through a telescope · a space telescope\",\"example\":{\"text\":\"The new space telescope can observe galaxies billions of light years away.\",\"vi\":\"Kính thiên văn không gian mới có thể quan sát các thiên hà cách hàng tỉ năm ánh sáng.\"}},{\"id\":\"galaxy|n\",\"term\":\"galaxy\",\"reading\":\"/ˈɡæl.ək.si/\",\"meaning\":\"thiên hà\",\"definitionEn\":\"a huge group of stars\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: our galaxy · distant galaxies\"},{\"id\":\"gravity|n\",\"term\":\"gravity\",\"reading\":\"/ˈɡræv.ə.ti/\",\"meaning\":\"trọng lực; lực hấp dẫn\",\"definitionEn\":\"the force that pulls objects towards the ground\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: zero gravity · the force of gravity\",\"example\":{\"text\":\"Astronauts on the space station live without gravity for months.\",\"vi\":\"Các phi hành gia trên trạm vũ trụ sống không trọng lực hàng tháng trời.\"}},{\"id\":\"spacecraft|n\",\"term\":\"spacecraft\",\"reading\":\"/ˈspeɪs.krɑːft/\",\"meaning\":\"tàu vũ trụ\",\"definitionEn\":\"a vehicle that travels in space\",\"lesson\":62,\"pos\":\"n\",\"example\":{\"text\":\"Two spacecraft are now travelling beyond our solar system.\",\"vi\":\"Hai con tàu vũ trụ hiện đang bay ra ngoài hệ Mặt Trời.\"}},{\"id\":\"launch|v\",\"term\":\"launch\",\"reading\":\"/lɔːntʃ/\",\"meaning\":\"phóng (tên lửa, vệ tinh); ra mắt\",\"definitionEn\":\"to send a rocket into the sky; to start something new\",\"lesson\":62,\"pos\":\"v\",\"hint\":\"Hay đi với: launch a rocket · be launched into space\"},{\"id\":\"universe|n\",\"term\":\"universe\",\"reading\":\"/ˈjuː.nɪ.vɜːs/\",\"meaning\":\"vũ trụ\",\"definitionEn\":\"everything that exists, including all stars and planets\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"YU-ni-vơs. — Hay đi với: the universe · the origin of the universe\",\"example\":{\"text\":\"The universe is far bigger than scientists once thought.\",\"vi\":\"Vũ trụ lớn hơn nhiều so với các nhà khoa học từng nghĩ.\"}},{\"id\":\"laboratory|n\",\"term\":\"laboratory\",\"reading\":\"/ləˈbɒr.ə.tər.i/\",\"meaning\":\"phòng thí nghiệm\",\"definitionEn\":\"a room for scientific experiments\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: in the laboratory · a research laboratory\",\"example\":{\"text\":\"The samples were tested in a laboratory to find scientific evidence of water.\",\"vi\":\"Các mẫu được kiểm tra trong phòng thí nghiệm để tìm bằng chứng khoa học về nước.\"}},{\"id\":\"hypothesis|n\",\"term\":\"hypothesis\",\"reading\":\"/haɪˈpɒθ.ə.sɪs/\",\"meaning\":\"giả thuyết\",\"definitionEn\":\"an idea that needs to be tested\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Trọng âm: hy-POTH-e-sis — Hay đi với: test a hypothesis · support the hypothesis\",\"example\":{\"text\":\"Scientists carried out an experiment to test their hypothesis.\",\"vi\":\"Các nhà khoa học tiến hành một thí nghiệm để kiểm chứng giả thuyết.\"}},{\"id\":\"experiment|n\",\"term\":\"experiment\",\"reading\":\"/ɪkˈsper.ɪ.mənt/\",\"meaning\":\"thí nghiệm\",\"definitionEn\":\"a scientific test\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: carry out an experiment · do experiments on\",\"example\":{\"text\":\"Scientists carried out an experiment to test their hypothesis.\",\"vi\":\"Các nhà khoa học tiến hành một thí nghiệm để kiểm chứng giả thuyết.\"}},{\"id\":\"solar-system|phr-n\",\"term\":\"solar system\",\"reading\":\"/ˈsəʊ.lə ˌsɪs.təm/\",\"meaning\":\"hệ Mặt Trời\",\"definitionEn\":\"the sun and the planets that move around it\",\"lesson\":62,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the planets in our solar system\"},{\"id\":\"atmosphere|n\",\"term\":\"atmosphere\",\"reading\":\"/ˈæt.mə.sfɪər/\",\"meaning\":\"khí quyển; bầu không khí\",\"definitionEn\":\"the layer of gases around the Earth; the mood of a place\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Trọng âm: AT-mos-phere — Hay đi với: the Earth's atmosphere · a friendly atmosphere\",\"example\":{\"text\":\"Mars has a very thin atmosphere, so it is extremely cold.\",\"vi\":\"Sao Hỏa có bầu khí quyển rất mỏng, nên nó cực kỳ lạnh.\"}},{\"id\":\"observe|v\",\"term\":\"observe\",\"reading\":\"/əbˈzɜːv/\",\"meaning\":\"quan sát\",\"definitionEn\":\"to watch carefully\",\"lesson\":62,\"pos\":\"v\",\"hint\":\"Hay đi với: observe the stars · be observed through a telescope\",\"example\":{\"text\":\"The new space telescope can observe galaxies billions of light years away.\",\"vi\":\"Kính thiên văn không gian mới có thể quan sát các thiên hà cách hàng tỉ năm ánh sáng.\"}},{\"id\":\"scientific|adj\",\"term\":\"scientific\",\"reading\":\"/ˌsaɪ.ənˈtɪf.ɪk/\",\"meaning\":\"(thuộc) khoa học\",\"definitionEn\":\"connected with science\",\"lesson\":62,\"pos\":\"adj\",\"hint\":\"sai-ờn-TIF-ik: nhấn âm 3. — Trọng âm: sci-en-TIF-ic — Hay đi với: scientific research · scientific evidence\",\"example\":{\"text\":\"The samples were tested in a laboratory to find scientific evidence of water.\",\"vi\":\"Các mẫu được kiểm tra trong phòng thí nghiệm để tìm bằng chứng khoa học về nước.\"}},{\"id\":\"research|n\",\"term\":\"research\",\"reading\":\"/rɪˈsɜːtʃ/\",\"meaning\":\"nghiên cứu\",\"definitionEn\":\"careful study to discover new facts\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: carry out research into · research shows that\",\"example\":{\"text\":\"A lot of research into Mars has been done in the last decade.\",\"vi\":\"Rất nhiều nghiên cứu về sao Hỏa đã được thực hiện trong thập kỷ qua.\"}}],\"lesson\":{\"number\":62,\"title\":\"Không gian \u0026 khoa học · Sửa lỗi ngữ pháp đặc trưng người Việt\"}}]\n"])</script><script>self.__next_f.push([1,"30:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=62\",\"className\":\"font-medium
