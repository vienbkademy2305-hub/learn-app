oup\":\"word\",\"text\":\"mass tourism\",\"vi\":\"du lịch đại trà (lượng khách rất đông)\",\"extra\":\"/ˌmæs ˈtʊə.rɪ.zəm/\"},{\"group\":\"word\",\"text\":\"tourism\",\"vi\":\"ngành du lịch; hoạt động du lịch\",\"extra\":\"/ˈtʊə.rɪ.zəm/\"},{\"group\":\"word\",\"text\":\"culture\",\"vi\":\"văn hóa\",\"extra\":\"/ˈkʌl.tʃər/\"},{\"group\":\"word\",\"text\":\"cultural identity\",\"vi\":\"bản sắc văn hóa\",\"extra\":\"/ˌkʌl.tʃər.əl aɪˈden.tə.ti/\"},{\"group\":\"word\",\"text\":\"preserve\",\"vi\":\"bảo tồn; giữ gìn\",\"extra\":\"/prɪˈzɜːv/\"},{\"group\":\"word\",\"text\":\"tradition\",\"vi\":\"truyền thống\",\"extra\":\"/trəˈdɪʃ.ən/\"},{\"group\":\"word\",\"text\":\"custom\",\"vi\":\"phong tục\",\"extra\":\"/ˈkʌs.təm/\"},{\"group\":\"word\",\"text\":\"ancient\",\"vi\":\"cổ; cổ xưa\",\"extra\":\"/ˈeɪn.ʃənt/\"},{\"group\":\"word\",\"text\":\"historic\",\"vi\":\"có tính lịch sử; quan trọng về mặt lịch sử\",\"extra\":\"/hɪˈstɒr.ɪk/\"},{\"group\":\"word\",\"text\":\"landmark\",\"vi\":\"công trình/địa danh biểu tượng\",\"extra\":\"/ˈlænd.mɑːk/\"},{\"group\":\"word\",\"text\":\"overcrowded\",\"vi\":\"quá đông đúc\",\"extra\":\"/ˌəʊ.vəˈkraʊ.dɪd/\"},{\"group\":\"word\",\"text\":\"authentic\",\"vi\":\"đích thực; nguyên bản\",\"extra\":\"/ɔːˈθen.tɪk/\"},{\"group\":\"word\",\"text\":\"local resident\",\"vi\":\"cư dân địa phương\",\"extra\":\"/ˌləʊ.kəl ˈrez.ɪ.dənt/\"},{\"group\":\"word\",\"text\":\"restore\",\"vi\":\"trùng tu; khôi phục\",\"extra\":\"/rɪˈstɔːr/\"},{\"group\":\"word\",\"text\":\"damage\",\"vi\":\"làm hư hại\",\"extra\":\"/ˈdæm.ɪdʒ/\"},{\"group\":\"word\",\"text\":\"unique\",\"vi\":\"độc nhất; độc đáo\",\"extra\":\"/juːˈniːk/\"},{\"group\":\"word\",\"text\":\"festival\",\"vi\":\"lễ hội\",\"extra\":\"/ˈfes.tɪ.vəl/\"},{\"group\":\"sentence\",\"text\":\"If fewer tourists visited the old town, local residents would have a quieter life.\",\"vi\":\"Nếu ít khách du lịch đến phố cổ hơn, cư dân địa phương sẽ có cuộc sống yên tĩnh hơn.\"},{\"group\":\"sentence\",\"text\":\"If I were the mayor, I would ban motorbikes in the historic centre.\",\"vi\":\"Nếu tôi là thị trưởng, tôi sẽ cấm xe máy ở khu trung tâm lịch sử.\"},{\"group\":\"sentence\",\"text\":\"The festival would lose its meaning if it became just a show for tourists.\",\"vi\":\"Lễ hội sẽ mất đi ý nghĩa nếu nó chỉ còn là một màn trình diễn cho khách du lịch.\"},{\"group\":\"sentence\",\"text\":\"If I were you, I would try authentic local food instead of pizza.\",\"vi\":\"Nếu tôi là bạn, tôi sẽ thử món ăn địa phương đích thực thay vì pizza.\"},{\"group\":\"sentence\",\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"},{\"group\":\"sentence\",\"text\":\"The government has spent a lot of money to restore the old temples.\",\"vi\":\"Chính phủ đã chi nhiều tiền để trùng tu các ngôi chùa cổ.\"},{\"group\":\"sentence\",\"text\":\"Tourism brings jobs, but it can also change the cultural identity of a place.\",\"vi\":\"Du lịch mang lại việc làm, nhưng cũng có thể làm thay đổi bản sắc văn hóa của một nơi.\"},{\"group\":\"sentence\",\"text\":\"Young people should learn about their cultural heritage and preserve old traditions.\",\"vi\":\"Người trẻ nên tìm hiểu di sản văn hóa của mình và giữ gìn các truyền thống cũ.\"},{\"group\":\"sentence\",\"text\":\"In summer, the beaches are so overcrowded that you can hardly find a place to sit.\",\"vi\":\"Vào mùa hè, bãi biển đông đến mức bạn gần như không tìm được chỗ ngồi.\"},{\"group\":\"sentence\",\"text\":\"Visitors should respect local customs, for example by dressing politely in temples.\",\"vi\":\"Du khách nên tôn trọng phong tục địa phương, ví dụ ăn mặc lịch sự trong chùa.\"},{\"group\":\"sentence\",\"text\":\"The bridge is the town's most famous landmark and appears on many postcards.\",\"vi\":\"Cây cầu là địa danh nổi tiếng nhất của thị trấn và xuất hiện trên nhiều bưu thiếp.\"},{\"group\":\"sentence\",\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"},{\"group\":\"dialogue\",\"text\":\"I'm thinking of visiting the old town during the lantern festival.\",\"vi\":\"Tớ đang tính đi phố cổ dịp lễ hội đèn lồng.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"It's beautiful, but it gets really overcrowded. If I were you, I would go on a weekday.\",\"vi\":\"Đẹp lắm, nhưng đông kinh khủng. Nếu tớ là cậu, tớ sẽ đi vào ngày thường.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Good idea. Is it still authentic, or is it just for tourists now?\",\"vi\":\"Ý hay. Ở đó còn giữ nét nguyên bản không, hay giờ chỉ phục vụ khách du lịch?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Both, really. Many old houses have been restored, and local residents still keep their traditions.\",\"vi\":\"Cả hai. Nhiều nhà cổ đã được trùng tu, và người dân địa phương vẫn giữ truyền thống.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"But mass tourism has changed a lot of things, hasn't it?\",\"vi\":\"Nhưng du lịch đại trà đã làm thay đổi nhiều thứ, đúng không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Yes. If there were fewer tourists, the town would feel more peaceful.\",\"vi\":\"Ừ. Nếu ít khách hơn, phố sẽ yên bình hơn.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Any tips for food?\",\"vi\":\"Có gợi ý gì về đồ ăn không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Avoid the restaurants near the landmark. Walk a bit further and you'll find authentic local dishes at half the price.\",\"vi\":\"Tránh mấy nhà hàng gần chỗ nổi tiếng. Đi xa thêm một chút là có món địa phương đúng vị, giá bằng nửa.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"I'm thinking of visiting the old town during the lantern festival.\",\"vi\":\"Tớ đang tính đi phố cổ dịp lễ hội đèn lồng.\"},{\"speaker\":\"B\",\"text\":\"It's beautiful, but it gets really overcrowded. If I were you, I would go on a weekday.\",\"vi\":\"Đẹp lắm, nhưng đông kinh khủng. Nếu tớ là cậu, tớ sẽ đi vào ngày thường.\"},{\"speaker\":\"A\",\"text\":\"Good idea. Is it still authentic, or is it just for tourists now?\",\"vi\":\"Ý hay. Ở đó còn giữ nét nguyên bản không, hay giờ chỉ phục vụ khách du lịch?\"},{\"speaker\":\"B\",\"text\":\"Both, really. Many old houses have been restored, and local residents still keep their traditions.\",\"vi\":\"Cả hai. Nhiều nhà cổ đã được trùng tu, và người dân địa phương vẫn giữ truyền thống.\"},{\"speaker\":\"A\",\"text\":\"But mass tourism has changed a lot of things, hasn't it?\",\"vi\":\"Nhưng du lịch đại trà đã làm thay đổi nhiều thứ, đúng không?\"},{\"speaker\":\"B\",\"text\":\"Yes. If there were fewer tourists, the town would feel more peaceful.\",\"vi\":\"Ừ. Nếu ít khách hơn, phố sẽ yên bình hơn.\"},{\"speaker\":\"A\",\"text\":\"Any tips for food?\",\"vi\":\"Có gợi ý gì về đồ ăn không?\"},{\"speaker\":\"B\",\"text\":\"Avoid the restaurants near the landmark. Walk a bit further and you'll find authentic local dishes at half the price.\",\"vi\":\"Tránh mấy nhà hàng gần chỗ nổi tiếng. Đi xa thêm một chút là có món địa phương đúng vị, giá bằng nửa.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-33-du-lich-sentence-completion/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-33-du-lich-sentence-completion/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-
