milies can receive the support they may not get at home. For working parents, an early start also reduces the cost of childcare.\n\nOn the other hand, many educators believe that children under seven learn best through play rather than formal lessons. Activities such as building, drawing and role-play develop language, creativity and social skills, which form the foundation for later academic learning. Finland, where children usually begin school at seven, is often cited as an example: its pupils typically catch up quickly and perform well in international comparisons. Starting formal lessons too early, by contrast, may cause stress and a dislike of learning.\n\nOverall, although an early start offers some practical benefits, I believe that the risks outweigh them. Children should begin formal schooling at around seven, but governments should ensure that high-quality, play-based pre-schools are available to all families before that age.1c:[\"$\",\"div\",null,{\"className\":\"space-y-3\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-semibold text-stone-900\",\"children\":\"Bài mẫu Task 2 (khoảng band 7) cho đề Discuss both views ở phần Về nhà\"}],[\"$\",\"p\",null,{\"lang\":\"en\",\"className\":\"overflow-x-auto rounded-xl bg-stone-50 p-4 leading-relaxed whitespace-pre-wrap text-stone-800\",\"children\":\"$21\"}],[\"$\",\"ul\",null,{\"className\":\"space-y-2\",\"children\":[[\"$\",\"li\",\"0\",{\"className\":\"rounded-xl border border-sky-100 p-3 text-sm\",\"children\":[[\"$\",\"p\",null,{\"lang\":\"en\",\"className\":\"font-semibold text-sky-900\",\"children\":\"Mở bài\"}],[\"$\",\"p\",null,{\"className\":\"leading-relaxed whitespace-pre-line text-stone-700\",\"children\":\"Câu 1 paraphrase chủ đề; câu 2 nêu hai quan điểm; câu 3 là ý kiến riêng (có điều kiện 'provided that').\"}]]}],[\"$\",\"li\",\"1\",{\"className\":\"rounded-xl border border-sky-100 p-3 text-sm\",\"children\":[[\"$\",\"p\",null,{\"lang\":\"en\",\"className\":\"font-semibold text-sky-900\"
