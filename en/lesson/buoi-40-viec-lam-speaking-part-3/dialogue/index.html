rạng cử nhân thất nghiệp, tôi nghĩ lý do chính là thiếu kinh nghiệm thực tế. Đại học dạy lý thuyết, còn nhà tuyển dụng cần kỹ năng.\"},{\"speaker\":\"Examiner\",\"text\":\"What could universities do about that?\",\"vi\":\"Các trường đại học có thể làm gì?\"},{\"speaker\":\"Candidate\",\"text\":\"They could work with companies so that every student does an internship. Some universities in Vietnam already do this.\",\"vi\":\"Họ có thể hợp tác với doanh nghiệp để mọi sinh viên đều đi thực tập. Một số trường ở Việt Nam đã làm vậy.\"},{\"speaker\":\"Examiner\",\"text\":\"Which is more important when choosing a job: salary or job satisfaction?\",\"vi\":\"Khi chọn việc, lương hay sự hài lòng với công việc quan trọng hơn?\"},{\"speaker\":\"Candidate\",\"text\":\"Of course, salary matters, especially with the cost of living in big cities. But I'd say job satisfaction is more important in the long term, because people who hate their jobs often resign.\",\"vi\":\"Tất nhiên lương quan trọng, nhất là với chi phí sinh hoạt ở thành phố lớn. Nhưng tôi cho là sự hài lòng quan trọng hơn về lâu dài, vì người ghét công việc thường nghỉ việc.\"},{\"speaker\":\"Examiner\",\"text\":\"Will people still work in offices in twenty years?\",\"vi\":\"Hai mươi năm nữa người ta còn làm việc ở văn phòng không?\"},{\"speaker\":\"Candidate\",\"text\":\"As for office work, I think offices will probably still exist, but they'll be smaller. Most people will have flexible jobs and work from home a few days a week.\",\"vi\":\"Còn về công việc văn phòng, tôi nghĩ có lẽ văn phòng vẫn tồn tại nhưng nhỏ hơn. Phần lớn mọi người sẽ có công việc linh hoạt và làm ở nhà vài ngày mỗi tuần.\"}]}],[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-bet
