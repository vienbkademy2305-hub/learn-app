 nhà máy thải ra rất nhiều khí thải carbon.\"}},{\"id\":\"build|v\",\"term\":\"build\",\"reading\":\"/bɪld/\",\"meaning\":\"xây; xây dựng\",\"definitionEn\":\"to make a house, road or bridge\",\"lesson\":19,\"pos\":\"v\",\"example\":{\"text\":\"In hindsight, the competition helped me build my self-confidence.\",\"vi\":\"Giờ nghĩ lại, cuộc thi đã giúp tôi xây dựng sự tự tin.\"}},{\"id\":\"invent|v\",\"term\":\"invent\",\"reading\":\"/ɪnˈvent/\",\"meaning\":\"phát minh\",\"definitionEn\":\"to create something that did not exist before\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"invention|n\",\"term\":\"invention\",\"reading\":\"/ɪnˈven.ʃən/\",\"meaning\":\"phát minh; sáng chế\",\"definitionEn\":\"something completely new that someone has created\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"Trọng âm: in-VEN-tion\",\"example\":{\"text\":\"The internet is a great invention.\",\"vi\":\"Internet là một phát minh vĩ đại.\"}},{\"id\":\"discover|v\",\"term\":\"discover\",\"reading\":\"/dɪˈskʌv.ə/\",\"meaning\":\"khám phá; phát hiện\",\"definitionEn\":\"to find something for the first time\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"design|v\",\"term\":\"design\",\"reading\":\"/dɪˈzaɪn/\",\"meaning\":\"thiết kế\",\"definitionEn\":\"to plan how something will look and work\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"grow|v\",\"term\":\"grow\",\"reading\":\"/ɡrəʊ/\",\"meaning\":\"trồng; lớn lên\",\"definitionEn\":\"to make plants develop; to get bigger\",\"lesson\":19,\"pos\":\"v\"},{\"id\":\"export|v\",\"term\":\"export\",\"reading\":\"/ɪkˈspɔːt/\",\"meaning\":\"xuất khẩu\",\"definitionEn\":\"to sell goods to another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: ex-PORT\"},{\"id\":\"import|v\",\"term\":\"import\",\"reading\":\"/ɪmˈpɔːt/\",\"meaning\":\"nhập khẩu\",\"definitionEn\":\"to buy goods from another country\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PORT\"},{\"id\":\"factory|n\",\"term\":\"factory\",\"reading\":\"/ˈfæk.tər.i/\",\"meaning\":\"nhà máy\",\"definitionEn\":\"a building where goods are made by machines\",\"lesson\":19,\"pos\":\"n\",\"example\":{\"text\":\"The factory produces a thousand cars a day.\",\"vi\":\"Nhà máy sản xuất một nghìn chiếc ô tô mỗi ngày.\"}},{\"id\":\"product|n\",\"term\":\"product\",\"reading\":\"/ˈprɒd.ʌkt/\",\"meaning\":\"sản phẩm\",\"definitionEn\":\"something that is made to be sold\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"Trọng âm: PRO-duct — Hay đi với: local products\"},{\"id\":\"material|n\",\"term\":\"material\",\"reading\":\"/məˈtɪə.ri.əl/\",\"meaning\":\"chất liệu; vật liệu\",\"definitionEn\":\"what something is made from, e.g. wood or cloth\",\"lesson\":19,\"pos\":\"n\",\"hint\":\"mờ-TIR-i-ờl: nhấn âm 2. — Trọng âm: ma-TE-ri-al\",\"example\":{\"text\":\"What material is this shirt made of?\",\"vi\":\"Chiếc áo này làm bằng chất liệu gì?\"}},{\"id\":\"silk|n\",\"term\":\"silk\",\"reading\":\"/sɪlk/\",\"meaning\":\"lụa\",\"definitionEn\":\"a smooth, shiny cloth made by insects\",\"lesson\":19,\"pos\":\"n\",\"example\":{\"text\":\"Hoi An is famous for its silk.\",\"vi\":\"Hội An nổi tiếng về lụa.\"}},{\"id\":\"handmade|adj\",\"term\":\"handmade\",\"reading\":\"/ˌhændˈmeɪd/\",\"meaning\":\"làm bằng tay; thủ công\",\"definitionEn\":\"made by a person, not a machine\",\"lesson\":19,\"pos\":\"adj\",\"example\":{\"text\":\"My mother gave me a handmade bag.\",\"vi\":\"Mẹ tặng tôi một chiếc túi làm thủ công.\"}},{\"id\":\"translate|v\",\"term\":\"translate\",\"reading\":\"/trænzˈleɪt/\",\"meaning\":\"dịch (ngôn ngữ)\",\"definitionEn\":\"to change words into another language\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Hay đi với: translate into English\"},{\"id\":\"recycle|v\",\"term\":\"recycle\",\"reading\":\"/ˌriːˈsaɪ.kəl/\",\"meaning\":\"tái chế\",\"definitionEn\":\"to process used things so they can be used again\",\"lesson\":19,\"pos\":\"v\",\"hint\":\"Trọng âm: re-CY-cle\"},{\"id\":\"education|n\",\"term\":\"education\",\"reading\":\"/ˌedʒ.uˈkeɪ.ʃən/\",\"meaning\":\"giáo dục; sự học hành\",\"definitionEn\":\"the process of teaching and learning\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: e-du-CA-tion — Hay đi với: receive a good education · the education system\",\"example\":{\"text\":\"My lecturer has written three books about education.\",\"vi\":\"Giảng viên của tôi đã viết ba cuốn sách về giáo dục.\"}},{\"id\":\"higher-education|phr-n\",\"term\":\"higher education\",\"reading\":\"/ˌhaɪ.ər ˌedʒ.uˈkeɪ.ʃən/\",\"meaning\":\"giáo dục đại học; bậc học sau phổ thông\",\"definitionEn\":\"study at a university or college\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: access to higher education · the cost of higher education\"},{\"id\":\"curriculum|n\",\"term\":\"curriculum\",\"reading\":\"/kəˈrɪk.jə.ləm/\",\"meaning\":\"chương trình học; chương trình giảng dạy\",\"definitionEn\":\"all the subjects taught at a school or course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: cu-RI-cu-lum — Hay đi với: the school curriculum · change the curriculum\",\"example\":{\"text\":\"Our school has used a new curriculum since 2020.\",\"vi\":\"Trường chúng tôi dùng chương trình học mới từ năm 2020.\"}},{\"id\":\"tuition-fee|phr-n\",\"term\":\"tuition fee\",\"reading\":\"/tjuˈɪʃ.ən fiː/\",\"meaning\":\"học phí\",\"definitionEn\":\"the money you pay to study at a school or university\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: pay tuition fees · high tuition fees\"},{\"id\":\"qualification|n\",\"term\":\"qualification\",\"reading\":\"/ˌkwɒl.ɪ.fɪˈkeɪ.ʃən/\",\"meaning\":\"bằng cấp; chứng chỉ\",\"definitionEn\":\"an official record that you have passed a course\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: qua-li-fi-CA-tion — Hay đi với: get a qualification · a qualification in accounting\",\"example\":{\"text\":\"A good qualification can help you find a better job.\",\"vi\":\"Một tấm bằng tốt có thể giúp bạn tìm được việc tốt hơn.\"}},{\"id\":\"knowledge|n\",\"term\":\"knowledge\",\"reading\":\"/ˈnɒl.ɪdʒ/\",\"meaning\":\"kiến thức; g them\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rely on rote learning · learn by rote\"},{\"id\":\"extracurricular-activity|phr-n\",\"term\":\"extracurricular activity\",\"reading\":\"/ˌek.strə.kəˈrɪk.jə.lər ækˈtɪv.ə.ti/\",\"meaning\":\"hoạt động ngoại khóa\",\"definitionEn\":\"an activity at school outside normal lessons\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: take part in extracurricular activities\"},{\"id\":\"attend|v\",\"term\":\"attend\",\"reading\":\"/əˈtend/\",\"meaning\":\"theo học; tham dự (lớp, buổi học, sự kiện)\",\"definitionEn\":\"to go to a class, meeting or event\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: at-TEND — Hay đi với: attend a class · attend school\"},{\"id\":\"improve|v\",\"term\":\"improve\",\"reading\":\"/ɪmˈpruːv/\",\"meaning\":\"cải thiện; tiến bộ\",\"definitionEn\":\"to become better or make something better\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PROVE — Hay đi với: improve your English · improve skills\",\"example\":{\"text\":\"Many graduates do internships in order to improve their job security.\",\"vi\":\"Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc.\"}},{\"id\":\"achieve|v\",\"term\":\"achieve\",\"reading\":\"/əˈtʃiːv/\",\"meaning\":\"đạt được (mục tiêu, kết quả)\",\"definitionEn\":\"to succeed in doing something after effort\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: a-CHIEVE — Hay đi với: achieve a goal · achieve good results\",\"example\":{\"text\":\"What do you want to achieve this year?\",\"vi\":\"Năm nay bạn muốn đạt được điều gì?\"}},{\"id\":\"main-idea|phr-n\",\"term\":\"main idea\",\"reading\":\"/ˌmeɪn aɪˈdɪə/\",\"meaning\":\"ý chính\",\"definitionEn\":\"the most important point of a text\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the main idea of a paragraph · find the main idea\"},{\"id\":\"paragraph|n\",\"term\":\"paragraph\",\"reading\":\"/ˈpær.ə.ɡrɑːf/\",\"meaning\":\"đoạn văn\",\"definitionEn\":\"a part of a tex
