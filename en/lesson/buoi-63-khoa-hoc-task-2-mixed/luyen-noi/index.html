 khu vực tư nhân đang dẫn đầu việc thám hiểm vũ trụ.\"},{\"group\":\"sentence\",\"text\":\"What concerns many taxpayers is the astronomical cost of each mission.\",\"vi\":\"Điều khiến nhiều người đóng thuế lo ngại là chi phí khổng lồ của mỗi sứ mệnh.\"},{\"group\":\"sentence\",\"text\":\"It was in 1961 that the first human travelled into outer space.\",\"vi\":\"Chính năm 1961 con người đầu tiên bay vào không gian vũ trụ.\"},{\"group\":\"sentence\",\"text\":\"The reason space research is worth funding is that it produces useful spin-offs.\",\"vi\":\"Lý do nghiên cứu vũ trụ đáng được tài trợ là nó tạo ra nhiều ứng dụng hữu ích.\"},{\"group\":\"sentence\",\"text\":\"Some billionaires dream of colonising Mars within twenty years.\",\"vi\":\"Một số tỉ phú mơ lập thuộc địa trên sao Hỏa trong vòng hai mươi năm.\"},{\"group\":\"sentence\",\"text\":\"It is difficult to justify such spending when there are more pressing problems on Earth.\",\"vi\":\"Khó mà biện minh cho khoản chi như vậy khi Trái Đất còn nhiều vấn đề cấp bách hơn.\"},{\"group\":\"sentence\",\"text\":\"Reusable rockets have made commercial space flights more feasible.\",\"vi\":\"Tên lửa tái sử dụng đã khiến các chuyến bay vũ trụ thương mại khả thi hơn.\"},{\"group\":\"sentence\",\"text\":\"Space debris is becoming a serious threat to satellites.\",\"vi\":\"Rác vũ trụ đang trở thành mối đe dọa nghiêm trọng đối với vệ tinh.\"},{\"group\":\"sentence\",\"text\":\"No other habitable planet has been found so far.\",\"vi\":\"Cho đến nay chưa tìm thấy hành tinh nào khác có thể sinh sống.\"},{\"group\":\"sentence\",\"text\":\"Many see space as the final frontier for humanity.\",\"vi\":\"Nhiều người coi vũ trụ là biên giới cuối cùng của nhân loại.\"},{\"group\":\"sentence\",\"text\":\"Cutting-edge technology developed for astronauts is now used in hospitals.\",\"vi\":\"Công nghệ tiên tiến phát triển cho phi hành gia nay được dùng trong bệnh viện.\"},{\"group\":\"dialogue\",\"text\":\"Did you see the news? Another mission to Mars is planned for next year.\",\"vi\":\"Bạn xem tin chưa? Lại có một sứ mệnh lên sao Hỏa dự kiến năm sau.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Honestly, what bothers me is the cost. It's astronomical.\",\"vi\":\"Thật lòng, điều làm mình khó chịu là chi phí. Khổng lồ.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"But it's partly paid for by the private sector now, not only taxpayers.\",\"vi\":\"Nhưng giờ khu vực tư nhân trả một phần, không chỉ người đóng thuế.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Even so, we have more pressing problems on Earth, like climate change.\",\"vi\":\"Dù vậy, Trái Đất còn nhiều vấn đề cấp bách hơn, như biến đổi khí hậu.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Actually, it's satellites that give us most of our climate data.\",\"vi\":\"Thật ra, chính vệ tinh cung cấp phần lớn dữ liệu khí hậu cho chúng ta.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Fair point. I just don't think colonising Mars is feasible.\",\"vi\":\"Có lý. Mình chỉ không nghĩ lập thuộc địa trên sao Hỏa là khả thi.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Maybe not yet. But fifty years ago, reusable rockets weren't feasible either.\",\"vi\":\"Có lẽ chưa. Nhưng năm mươi năm trước, tên lửa tái sử dụng cũng đâu khả thi.\",\"extra\":\"A\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Did you see the news? Another mission to Mars is planned for next year.\",\"vi\":\"Bạn xem tin chưa? Lại có một sứ mệnh lên sao Hỏa dự kiến năm sau.\"},{\"speaker\":\"B\",\"text\":\"Honestly, what bothers me is the cost. It's astronomical.\",\"vi\":\"Thật lòng, điều làm mình khó chịu là chi phí. Khổng lồ.\"},{\"speaker\":\"A\",\"text\":\"But it's partly paid for by the private sector now, not only taxpayers.\",\"vi\":\"Nhưng giờ khu vực tư nhân trả một phần, không chỉ người đóng thuế.\"},{\"speaker\":\"B\",\"text\":\"Even so, we have more pressing problems on Earth, like climate change.\",\"vi\":\"Dù vậy, Trái Đất còn nhiều vấn đề cấp bách hơn, như biến đổi khí hậu.\"},{\"speaker\":\"A\",\"text\":\"Actually, it's satellites that give us most of our climate data.\",\"vi\":\"Thật ra, chính vệ tinh cung cấp phần lớn dữ liệu khí hậu cho chúng ta.\"},{\"speaker\":\"B\",\"text\":\"Fair point. I just don't think colonising Mars is feasible.\",\"vi\":\"Có lý. Mình chỉ không nghĩ lập thuộc địa trên sao Hỏa là khả thi.\"},{\"speaker\":\"A\",\"text\":\"Maybe not yet. But fifty years ago, reusable rockets weren't feasible either.\",\"vi\":\"Có lẽ chưa. Nhưng năm mươi năm trước, tên lửa tái sử dụng cũng đâu khả thi.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-63-khoa-hoc-task-2-mixed/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-63-khoa-hoc-task-2-mixed/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n1b:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Luyện nói · Buổi 63 · Học tiếng Anh\"}],[\"$\",\"meta\",\"1\",
