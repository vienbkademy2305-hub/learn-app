\"The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.\",\"vi\":\"Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.\"},{\"group\":\"sentence\",\"text\":\"Street lighting was improved in 2020. Consequently, night-time robberies fell by a third.\",\"vi\":\"Đèn đường được cải thiện năm 2020. Do đó, các vụ cướp ban đêm giảm một phần ba.\"},{\"group\":\"sentence\",\"text\":\"Education programmes give prisoners new skills, thus reducing the chance that they will reoffend.\",\"vi\":\"Các chương trình giáo dục trang bị kỹ năng mới cho phạm nhân, qua đó giảm khả năng họ tái phạm.\"},{\"group\":\"sentence\",\"text\":\"Everyone has the right to a fair trial, even people who are clearly guilty.\",\"vi\":\"Ai cũng có quyền được xét xử công bằng, kể cả người rõ ràng có tội.\"},{\"group\":\"sentence\",\"text\":\"Corruption weakens people's trust in the legal system.\",\"vi\":\"Tham nhũng làm suy giảm niềm tin của người dân vào hệ thống pháp luật.\"},{\"group\":\"sentence\",\"text\":\"Long-term imprisonment separates offenders from their families. Furthermore, it makes it harder for them to find work later.\",\"vi\":\"Án tù dài hạn tách người phạm tội khỏi gia đình. Ngoài ra, nó khiến họ khó tìm việc sau này.\"},{\"group\":\"sentence\",\"text\":\"Some countries have strict drug laws, whereas others focus on treatment.\",\"vi\":\"Một số nước có luật ma túy nghiêm khắc, trong khi những nước khác tập trung vào điều trị.\"},{\"group\":\"sentence\",\"text\":\"Harsh sentences may deter adults. Conversely, they may push teenagers further into crime.\",\"vi\":\"Án nặng có thể răn đe người lớn. Ngược lại, chúng có thể đẩy thanh thiếu niên sâu hơn vào con đường phạm tội.\"},{\"group\":\"sentence\",\"text\":\"The aim of the justice system should be to protect society. As a result, rehabilitation matters as much as punishment.\",\"vi\":\"Mục tiêu của hệ thống tư pháp phải là bảo vệ xã hội. Vì vậy, cải tạo cũng quan trọng như trừng phạt.\"},{\"group\":\"sentence\",\"text\":\"The policy was unpopular at first. It reduced crime, nonetheless.\",\"vi\":\"Chính sách lúc đầu không được ủng hộ. Dù vậy, nó vẫn làm giảm tội phạm.\"},{\"group\":\"dialogue\",\"text\":\"Our debate topic is the death penalty. Which side are you on?\",\"vi\":\"Chủ đề tranh biện của tụi mình là án tử hình. Cậu ủng hộ bên nào?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I'm against it. The main problem is that innocent people can be executed.\",\"vi\":\"Tớ phản đối. Vấn đề chính là người vô tội có thể bị xử tử.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"But in most cases, the evidence is very strong.\",\"vi\":\"Nhưng trong hầu hết trường hợp, bằng chứng rất rõ ràng.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Most cases, not all. And if the legal system makes a mistake, it can't be corrected.\",\"vi\":\"Hầu hết, không phải tất cả. Và nếu hệ thống pháp luật sai, thì không sửa được.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Fair point. Nevertheless, some people believe it deters serious crime.\",\"vi\":\"Có lý. Dù vậy, một số người tin là nó răn đe tội nghiêm trọng.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Actually, there's little evidence of that. Countries without it don't have higher murder rates.\",\"vi\":\"Thật ra, có rất ít bằng chứng cho điều đó. Các nước không có án tử hình cũng không có tỉ lệ giết người cao hơn.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"So what would you use instead?\",\"vi\":\"Vậy cậu dùng gì thay thế?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Life imprisonment. It protects society, and it still gives justice to the victims' families.\",\"vi\":\"Tù chung thân. Nó bảo vệ xã hội, và vẫn mang lại công lý cho gia đình nạn nhân.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Our debate topic is the death penalty. Which side are you on?\",\"vi\":\"Chủ đề tranh biện của tụi mình là án tử hình. Cậu ủng hộ bên nào?\"},{\"speaker\":\"B\",\"text\":\"I'm against it. The main problem is that innocent people can be executed.\",\"vi\":\"Tớ phản đối. Vấn đề chính là người vô tội có thể bị xử tử.\"},{\"speaker\":\"A\",\"text\":\"But in most cases, the evidence is very strong.\",\"vi\":\"Nhưng trong hầu hết trường hợp, bằng chứng rất rõ ràng.\"},{\"speaker\":\"B\",\"text\":\"Most cases, not all. And if the legal system makes a mistake, it can't be corrected.\",\"vi\":\"Hầu hết, không phải tất cả. Và nếu hệ thống pháp luật sai, thì không sửa được.\"},{\"speaker\":\"A\",\"text\":\"Fair point. Nevertheless, some people believe it deters serious crime.\",\"vi\":\"Có lý. Dù vậy, một số người tin là nó răn đe tội nghiêm trọng.\"},{\"speaker\":\"B\",\"text\":\"Actually, there's little evidence of that. Countries without it don't have higher murder rates.\",\"vi\":\"Thật ra, có rất ít bằng chứng cho điều đó. Các nước không có án tử hình cũng không có tỉ lệ giết người cao hơn.\"},{\"speaker\":\"A\",\"text\":\"So what would you use instead?\",\"vi\":\"Vậy cậu dùng gì thay thế?\"},{\"speaker\":\"B\",\"text\":\"Life imprisonment. It protects society, and it still gives justice to the victims' families.\",\"vi\":\"Tù chung thân. Nó bảo vệ xã hội, và vẫn mang lại công lý cho gia đình nạn nhân.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-51-toi-pham-cohesive-devices/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-51-toi-pham-cohesive-de
