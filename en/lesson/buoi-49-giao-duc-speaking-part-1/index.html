\":\"package|v\",\"term\":\"package\",\"reading\":\"/ˈpæk.ɪdʒ/\",\"meaning\":\"đóng gói\",\"definitionEn\":\"to put goods into boxes or wrappers\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be packaged and sold · packaged in boxes\"},{\"id\":\"deliver|v\",\"term\":\"deliver\",\"reading\":\"/dɪˈlɪv.ər/\",\"meaning\":\"giao; chuyển đến\",\"definitionEn\":\"to take goods to a person or place\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: de-LIV-er — Hay đi với: be delivered to shops · deliver water to homes\"},{\"id\":\"reservoir|n\",\"term\":\"reservoir\",\"reading\":\"/ˈrez.ə.vwɑːr/\",\"meaning\":\"hồ chứa nước\",\"definitionEn\":\"a large lake used to store water\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: be stored in a reservoir\",\"example\":{\"text\":\"The clean water is stored in a reservoir before it is delivered to homes.\",\"vi\":\"Nước sạch được lưu trong hồ chứa trước khi được đưa đến các hộ gia đình.\"}},{\"id\":\"subsequently|adv\",\"term\":\"subsequently\",\"reading\":\"/ˈsʌb.sɪ.kwənt.li/\",\"meaning\":\"sau đó\",\"definitionEn\":\"after that; later\",\"lesson\":46,\"pos\":\"adv\",\"hint\":\"Trọng âm: SUB-se-quent-ly\",\"example\":{\"text\":\"The mixture is heated to 200°C and subsequently packaged for sale.\",\"vi\":\"Hỗn hợp được đun nóng đến 200°C và sau đó được đóng gói để bán.\"}},{\"id\":\"once|conj\",\"term\":\"once\",\"reading\":\"/wʌns/\",\"meaning\":\"một khi; sau khi\",\"definitionEn\":\"as soon as; after\",\"lesson\":46,\"pos\":\"conj\",\"hint\":\"Hay đi với: once the water has been filtered, …\",\"example\":{\"text\":\"The Moon orbits the Earth once every 27 days.\",\"vi\":\"Mặt Trăng quay quanh Trái Đất 27 ngày một vòng.\"}},{\"id\":\"landfill|n\",\"term\":\"landfill\",\"reading\":\"/ˈlænd.fɪl/\",\"meaning\":\"bãi chôn lấp rác\",\"definitionEn\":\"a place where rubbish is buried in the ground\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: send waste to landfill · landfill sites\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"compost|n\",\"term\":\"compost\",\"reading\":\"/ˈkɒm.pɒst/\",\"meaning\":\"phân hữu cơ (ủ từ rác thực vật)\",\"definitionEn\":\"decayed plant waste used to feed soil\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: turn food waste into compost · make compost\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"demolish|v\",\"term\":\"demolish\",\"reading\":\"/dɪˈmɒl.ɪʃ/\",\"meaning\":\"phá dỡ (công trình)\",\"definitionEn\":\"to knock down a building\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: de-MOL-ish — Hay đi với: be demolished to make way for · demolish old houses\"},{\"id\":\"construct|v\",\"term\":\"construct\",\"reading\":\"/kənˈstrʌkt/\",\"meaning\":\"xây dựng\",\"definitionEn\":\"to build something\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-STRUCT — Hay đi với: be constructed in the centre · construct a bridge\"},{\"id\":\"convert|v\",\"term\":\"convert\",\"reading\":\"/kənˈvɜːt/\",\"meaning\":\"chuyển đổi (mục đích sử dụng)\",\"definitionEn\":\"to change something into a different form or use\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-VERT — Hay đi với: be converted into a hotel · convert A into B\"},{\"id\":\"extend|v\",\"term\":\"extend\",\"reading\":\"/ɪkˈstend/\",\"meaning\":\"kéo dài; mở rộng (theo chiều dài)\",\"definitionEn\":\"to make something longer or larger\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the road was extended to the coast · extend the railway line\"},{\"id\":\"expand|v\",\"term\":\"expand\",\"reading\":\"/ɪkˈspænd/\",\"meaning\":\"mở rộng; phát triển (quy mô)\",\"definitionEn\":\"to become or make bigger in size\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the car park was expanded · expand significantly\"},{\"id\":\"relocate|v\",\"term\":\"relocate\",\"reading\":\"/ˌriː.ləʊˈkeɪt/\",\"meaning\":\"di dời; chuyển đến chỗ khác\",\"definitionEn\":\"to move to a new place\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: re-lo-CATE — Hay đi với: be relocated to the north · relocate the market\"},{\"id\":\"remove|v\",\"term\":\"remove\",\"reading\":\"/rɪˈmuːv/\",\"meaning\":\"dỡ bỏ; loại bỏ\",\"definitionEn\":\"to take something away\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the trees were removed · remove the fence\"},{\"id\":\"residential|adj\",\"term\":\"residential\",\"reading\":\"/ˌrez.ɪˈden.ʃəl/\",\"meaning\":\"(thuộc) khu dân cư\",\"definitionEn\":\"having houses rather than offices or factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: res-i-DEN-tial — Hay đi với: a residential area · residential buildings\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"industrial|adj\",\"term\":\"industrial\",\"reading\":\"/ɪnˈdʌs.tri.əl/\",\"meaning\":\"(thuộc) công nghiệp\",\"definitionEn\":\"having factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-DUS-tri-al — Hay đi với: an industrial area · industrial zone\",\"example\":{\"text\":\"An industrial zone has been constructed next to the railway station.\",\"vi\":\"Một khu công nghiệp đã được xây dựng bên cạnh nhà ga.\"}},{\"id\":\"woodland|n\",\"term\":\"woodland\",\"reading\":\"/ˈwʊd.lənd/\",\"meaning\":\"khu rừng nhỏ; đất rừng\",\"definitionEn\":\"land covered with trees\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: an area of woodland · woodland was cleared\",\"example\":{\"text\":\"The woodland in the south made way for a large car park.\",\"vi\":\"Khu rừng ở phía nam nhường chỗ cho một bãi đỗ xe lớn.\"}},{\"id\":\"farmland|n\",\"term\":\"farmland\",\"reading\":\"/ˈfɑːm.lænd/\",\"meaning\":\"đất nông nghiệp\",\"definitionEn\":\"land used for growing crops or keeping animals\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: farmland was replaced by houses\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"footpath|n\",\"term\":\"footpath\",\"reading\":\"/ˈfʊt.pɑːθ/\",\"meaning\":\"lối đi bộ\",\"definitionEn\":\"a narrow path for walking\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: a new footpath · a footpath along the river\",\"example\":{\"text\":\"A new footpath makes the beach more accessible to visitors.\",\"vi\":\"Một lối đi bộ mới giúp du khách dễ ra bãi biển hơn.\"}},{\"id\":\"redevelopment|n\",\"term\":\"redevelopment\",\"reading\":\"/ˌriː.dɪˈvel.əp.mənt/\",\"meaning\":\"sự tái phát triển; cải tạo (khu vực)\",\"definitionEn\":\"rebuilding an area to improve it\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: after the redevelopment · a major redevelopment\",\"example\":{\"text\":\"After the redevelopment, the church remained unchanged.\",\"vi\":\"Sau đợt cải tạo, nhà thờ vẫn giữ nguyên.\"}},{\"id\":\"cycle-lane|phr-n\",\"term\":\"cycle lane\",\"reading\":\"/ˈsaɪ.kəl ˌleɪn/\",\"meaning\":\"làn đường xe đạp\",\"definitionEn\":\"part of a road only for bicycles\",\"lesson\":47,\"pos\":\"phr-n\"},{\"id\":\"make-way-for|phr-v\",\"term\":\"make way for\",\"reading\":\"/ˌmeɪk ˈweɪ fɔːr/\",\"meaning\":\"nhường chỗ cho (bị thay bằng)\",\"definitionEn\":\"to be removed so something new can replace it\",\"lesson\":47,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: the trees were cut down to make way for a car park · the farm made way for houses\"},{\"id\":\"layout|n\",\"term\":\"layout\",\"reading\":\"/ˈleɪ.aʊt/\",\"meaning\":\"bố cục; cách bố trí\",\"definitionEn\":\"the way things are arranged in a space\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: the layout of the village · change the layout\",\"example\":{\"text\":\"The two maps show how the layout of the village changed between 1990 and 2020.\",\"vi\":\"Hai bản đồ cho thấy bố cục của ngôi làng đã thay đổi thế nào từ năm 1990 đến 2020.\"}},{\"id\":\"dramatic|adj\",\"term\":\"dramatic\",\"reading\":\"/drəˈmæt.ɪk/\",\"meaning\":\"đáng kể; mạnh mẽ (thay đổi)\",\"definitionEn\":\"very great and sudden\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: dra-MAT-ic — Hay đi với: dramatic changes · a dramatic transformation\",\"example\":{\"text\":\"The most dramatic change was the removal of the trees in the centre.\",\"vi\":\"Thay đổi đáng kể nhất là việc dỡ bỏ cây xanh ở trung tâm.\"}},{\"id\":\"transform|v\",\"term\":\"transform\",\"reading\":\"/trænsˈfɔːm/\",\"meaning\":\"biến đổi hoàn toàn\",\"definitionEn\":\"to change something completely\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: trans-FORM — Hay đi với: be transformed into · transform the area\"},{\"id\":\"accessible|adj\",\"term\":\"accessible\",\"reading\":\"/əkˈses.ə.bəl/\",\"meaning\":\"dễ tiếp cận; dễ đến\",\"definitionEn\":\"easy to reach or use\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: ac-CES-si-ble — Hay đi với: more accessible to visitors · easily accessible by bus\",\"example\":{\"text\":\"A new footpath makes the beach more accessible to visitors.\",\"vi\":\"Một lối đi bộ mới giúp du khách dễ ra bãi biển hơn.\"}},{\"id\":\"academic-performance|phr-n\",\"term\":\"academic performance\",\"reading\":\"/ˌæk.əˈdem.ɪk pəˈfɔː.məns/\",\"meaning\":\"kết quả học tập\",\"definitionEn\":\"how well a student does at school\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve academic performance · poor academic performance\"},{\"id\":\"tertiary-education|phr-n\",\"term\":\"tertiary education\",\"reading\":\"/ˈtɜː.ʃər.i ˌedʒ.uˈkeɪ.ʃən/\",\"meaning\":\"giáo dục bậc cao (đại học, cao đẳng)\",\"definitionEn\":\"education at university or college level\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: access to tertiary education · go on to tertiary education\"},{\"id\":\"vocational-training|phr-n\",\"term\":\"vocational training\",\"reading\":\"/vəʊˌkeɪ.ʃən.əl ˈtreɪ.nɪŋ/\",\"meaning\":\"đào tạo nghề\",\"definitionEn\":\"training for a particular job, e.g. plumbing\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: vocational training courses · receive vocational training\"},{\"id\":\"standardised-test|phr-n\",\"term\":\"standardised test\",\"reading\":\"/ˌstæn.də.daɪzd ˈtest/\",\"meaning\":\"bài thi chuẩn hóa (cùng đề, cùng cách chấm cho mọi người)\",\"definitionEn\":\"an exam that is the same and scored the same for everyone\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: national standardised tests · prepare for standardised tests\"},{\"id\":\"well-rounded|adj\",\"term\":\"well-rounded\",\"reading\":\"/ˌwelˈraʊn.dɪd/\",\"meaning\":\"toàn diện (về kiến thức, kỹ năng, nhân cách)\",\"definitionEn\":\"having many different skills and interests\",\"lesson\":48,\"pos\":\"adj\",\"hint\":\"Hay đi với: a well-rounded education · well-rounded students\"},{\"id\":\"graduate|n\",\"term\":\"graduate\",\"reading\":\"/ˈɡrædʒ.u.ət/\",\"meaning\":\"người đã tốt nghiệp (đại học)\",\"definitionEn\":\"a person who has finished a university degree\",\"lesson\":48,\"pos\":\"n\",\"hint\":\"Hay đi với: university graduates · a recent graduate\",\"example\":{\"text\":\"I'm going to graduate from university next year.\",\"vi\":\"Năm sau tôi sẽ tốt nghiệp đại học.\"}},{\"id\":\"assess|v\",\"term\":\"assess\",\"reading\":\"/əˈses/\",\"meaning\":\"đánh giá\",\"definitionEn\":\"to judge the quality or level of something\",\"lesson\":48,\"pos\":\"v\",\"hint\":\"Hay đi với: assess students' progress · be assessed by exams\",\"example\":{\"text\":\"Standardised tests assess memory rather than critical thinking.\",\"vi\":\"Các bài thi chuẩn hóa đánh giá trí nhớ hơn là tư duy phản biện.\"}},{\"id\":\"hands-on|adj\",\"term\":\"hands-on\",\"reading\":\"/ˌhændzˈɒn/\",\"meaning\":\"thực hành; trực tiếp làm\",\"definitionEn\":\"involving doing things yourself, not just reading\",\"lesson\":48,\"pos\":\"adj\",\"hint\":\"Hay đi với: hands-on experience · hands-on learning\"},{\"id\":\"theoretical|adj\",\"term\":\"theoretical\",\"reading\":\"/ˌθɪəˈret.ɪ.kəl/\",\"meaning\":\"(thuộc) lý thuyết\",\"definitionEn\":\"based on ideas rather than practice\",\"lesson\":48,\"pos\":\"adj\",\"hint\":\"Trọng âm: the-o-RET-i-cal — Hay đi với: theoretical knowledge · too theoretical\",\"example\":{\"text\":\"Hands-on experience improves graduates' employability more than theoretical knowledge.\",\"vi\":\"Kinh nghiệm thực hành cải thiện khả năng được tuyển dụng của sinh viên tốt nghiệp hơn kiến thức lý thuyết.\"}},{\"id\":\"employability|n\",\"term\":\"employability\",\"reading\":\"/ɪmˌplɔɪ.əˈbɪl.ə.ti/\",\"meaning\":\"khả năng được tuyển dụng\",\"definitionEn\":\"how likely someone is to get a job\",\"lesson\":48,\"pos\":\"n\",\"hint\":\"Hay đi với: improve graduates' employability\",\"example\":{\"text\":\"Hands-on experience improves graduates' employability more than theoretical knowledge.\",\"vi\":\"Kinh nghiệm thực hành cải thiện khả năng được tuyển dụng của sinh viên tốt nghiệp hơn kiến thức lý thuyết.\"}},{\"id\":\"soft-skills|phr-n\",\"term\":\"soft skills\",\"reading\":\"/ˈsɒft ˌskɪlz/\",\"meaning\":\"kỹ năng mềm\",\"definitionEn\":\"personal abilities such as teamwork and communication\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: develop soft skills such as teamwork\"},{\"id\":\"exam-oriented|adj\",\"term\":\"exam-oriented\",\"reading\":\"/ɪɡˈzæm ˌɔː.ri.en.tɪd/\",\"meaning\":\"nặng về thi cử\",\"definitionEn\":\"focused mainly on passing tests\",\"lesson\":48,\"pos\":\"adj\",\"hint\":\"Hay đi với: an exam-oriented education system\"},{\"id\":\"workload|n\",\"term\":\"workload\",\"reading\":\"/ˈwɜːk.ləʊd/\",\"meaning\":\"khối lượng công việc; bài vở\",\"definitionEn\":\"the amount of work you have to do\",\"lesson\":48,\"pos\":\"n\",\"hint\":\"Hay đi với: a heavy workload · reduce students' workload\",\"example\":{\"text\":\"Students often have a heavy workload, which leaves them little time for sport.\",\"vi\":\"Học sinh thường có khối lượng bài vở nặng, điều này khiến các em có ít thời gian cho thể thao.\"}},{\"id\":\"distance-learning|phr-n\",\"term\":\"distance learning\",\"reading\":\"/ˈdɪs.təns ˌlɜː.nɪŋ/\",\"meaning\":\"học từ xa\",\"definitionEn\":\"studying from home using the internet or post\",\"lesson\":48,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: distance learning courses\"},{\"id\":\"motivation|n\",\"term\":\"motivation\",\"reading\":\"/ˌməʊ.tɪˈveɪ.ʃən/\",\"meaning\":\"động lực\",\"definitionEn\":\"the desire to do something\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Trọng âm: mo-ti-VA-tion — Hay đi với: lack motivation · a source of motivation\",\"example\":{\"text\":\"My biggest problem is a lack of motivation when I study alone.\",\"vi\":\"Vấn đề lớn nhất của tôi là thiếu động lực khi tự học.\"}},{\"id\":\"peer|n\",\"term\":\"peer\",\"reading\":\"/pɪər/\",\"meaning\":\"bạn cùng trang lứa; bạn học cùng lớp\",\"definitionEn\":\"a person of the same age or level as you\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: learn from your peers · peer feedback\",\"example\":{\"text\":\"Some teenagers start smoking due to peer pressure.\",\"vi\":\"Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè.\"}},{\"id\":\"mentor|n\",\"term\":\"mentor\",\"reading\":\"/ˈmen.tɔːr/\",\"meaning\":\"người cố vấn; người dìu dắt\",\"definitionEn\":\"an experienced person who advises someone less experienced\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: a good mentor · act as a mentor\",\"example\":{\"text\":\"An inspiring teacher can act as a mentor for young learners.\",\"vi\":\"Một giáo viên truyền cảm hứng có thể là người dìu dắt cho những người học trẻ.\"}},{\"id\":\"assessment|n\",\"term\":\"assessment\",\"reading\":\"/əˈses.mənt/\",\"meaning\":\"sự đánh giá; bài kiểm tra đánh giá\",\"definitionEn\":\"a test or judgement of someone's ability\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: continuous assessment · an online assessment\",\"example\":{\"text\":\"Our school used continuous assessment instead of one final exam.\",\"vi\":\"Trường chúng tôi đánh giá thường xuyên thay vì một kỳ thi cuối.\"}},{\"id\":\"learner|n\",\"term\":\"learner\",\"reading\":\"/ˈlɜː.nər/\",\"meaning\":\"người học\",\"definitionEn\":\"a person who is studying something\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: a slow learner · independent learners\"},{\"id\":\"procrastinate|v\",\"term\":\"procrastinate\",\"reading\":\"/prəˈkræs.tɪ.neɪt/\",\"meaning\":\"trì hoãn; chần chừ\",\"definitionEn\":\"to delay doing something you should do\",\"lesson\":49,\"pos\":\"v\",\"hint\":\"Trọng âm: pro-CRAS-ti-nate — Hay đi với: tend to procrastinate · stop procrastinating\",\"example\":{\"text\":\"I tend to procrastinate, so I often cram the night before an exam.\",\"vi\":\"Tôi hay trì hoãn, nên thường học nhồi vào đêm trước kỳ thi.\"}},{\"id\":\"cram|v\",\"term\":\"cram\",\"reading\":\"/kræm/\",\"meaning\":\"học nhồi (sát ngày thi)\",\"definitionEn\":\"to study a lot just before an exam\",\"lesson\":49,\"pos\":\"v\",\"hint\":\"Hay đi với: cram for an exam · cram the night before\",\"example\":{\"text\":\"I tend to procrastinate, so I often cram the night before an exam.\",\"vi\":\"Tôi hay trì hoãn, nên thường học nhồi vào đêm trước kỳ thi.\"}},{\"id\":\"deadline|n\",\"term\":\"deadline\",\"reading\":\"/ˈded.laɪn/\",\"meaning\":\"hạn chót\",\"definitionEn\":\"the time by which something must be finished\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: meet a deadline · miss a deadline\",\"example\":{\"text\":\"I've never missed a deadline, although I've come close a few times.\",\"vi\":\"Tôi chưa bao giờ trễ hạn, dù đã suýt vài lần.\"}},{\"id\":\"self-study|n\",\"term\":\"self-study\",\"reading\":\"/ˌselfˈstʌd.i/\",\"meaning\":\"tự học\",\"definitionEn\":\"learning on your own without a teacher\",\"lesson\":49,\"pos\":\"n\",\"hint\":\"Hay đi với: hours of self-study · prefer self-study\"},{\"id\":\"concentrate|v\",\"term\":\"concentrate\",\"reading\":\"/ˈkɒn.sən.treɪt/\",\"meaning\":\"tập trung\",\"definitionEn\":\"to give all your attention to something\",\"lesson\":49,\"pos\":\"v\",\"hint\":\"Trọng âm: CON-cen-trate — Hay đi với: concentrate on your studies · find it hard to concentrate\",\"example\":{\"text\":\"I find it hard to concentrate when my phone is next to me.\",\"vi\":\"Tôi thấy khó tập trung khi điện thoại ở bên cạnh.\"}},{\"id\":\"tend-to|phr-v\",\"term\":\"tend to\",\"reading\":\"/ˈtend tuː/\",\"meaning\":\"thường có xu hướng (làm gì)\",\"definitionEn\":\"to usually do something\",\"lesson\":49,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: I tend to study late at night · students tend to\"},{\"id\":\"fairly|adv\",\"term\":\"fairly\",\"reading\":\"/ˈfeə.li/\",\"meaning\":\"khá (mức vừa phải)\",\"definitionEn\":\"to some degree; not very\",\"lesson\":49,\"pos\":\"adv\",\"hint\":\"Hay đi với: fairly easy · fairly often\",\"example\":{\"text\":\"Maths was fairly easy for me, but chemistry was quite challenging.\",\"vi\":\"Toán với tôi khá dễ, nhưng hóa thì khá khó.\"}},{\"id\":\"quite|adv\",\"term\":\"quite\",\"reading\":\"/kwaɪt/\",\"meaning\":\"khá\",\"definitionEn\":\"to some degree; rather\",\"lesson\":49,\"pos\":\"adv\",\"hint\":\"Hay đi với: quite difficult · quite a lot of\",\"example\":{\"text\":\"The actor was great, but the plot was quite boring.\",\"vi\":\"Diễn viên đóng rất hay, nhưng cốt truyện khá nhàm.\"}},{\"id\":\"memorise|v\",\"term\":\"memorise\",\"reading\":\"/ˈmem.ə.raɪz/\",\"meaning\":\"học thuộc; ghi nhớ\",\"definitionEn\":\"to learn something so you remember it exactly\",\"lesson\":49,\"pos\":\"v\",\"hint\":\"Hay đi với: memorise vocabulary · memorise facts\"},{\"id\":\"inspiring|adj\",\"term\":\"inspiring\",\"reading\":\"/ɪnˈspaɪə.rɪŋ/\",\"meaning\":\"truyền cảm hứng\",\"definitionEn\":\"making you want to do something great\",\"lesson\":49,\"pos\":\"adj\",\"hint\":\"Hay đi với: an inspiring teacher · inspiring stories\",\"example\":{\"text\":\"An inspiring teacher can act as a mentor for young learners.\",\"vi\":\"Một giáo viên truyền cảm hứng có thể là người dìu dắt cho những người học trẻ.\"}},{\"id\":\"challenging|adj\",\"term\":\"challenging\",\"reading\":\"/ˈtʃæl.ɪn.dʒɪŋ/\",\"meaning\":\"khó nhưng thú vị; đầy thử thách\",\"definitionEn\":\"difficult in an interesting way\",\"lesson\":49,\"pos\":\"adj\",\"hint\":\"Hay đi với: a challenging subject · find something challenging\",\"example\":{\"text\":\"Maths was fairly easy for me, but chemistry was quite challenging.\",\"vi\":\"Toán với tôi khá dễ, nhưng hóa thì khá khó.\"}}],\"lesson\":{\"number\":49,\"title\":\"Giáo dục (nâng cao) · Speaking Part 1 chuẩn band 6.5\"}}]\n"])</script><script>self.__next_f.push([1,"2b:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=49\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2c:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-49-giao-duc-speaking-part-1/pronunciation\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Phát âm\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":
