our homework!\",\"vi\":\"Thôi chơi điện tử và làm xong bài tập đi!\"},{\"group\":\"sentence\",\"text\":\"I enjoy watching films at the cinema with my friends.\",\"vi\":\"Tôi thích xem phim ở rạp với bạn bè.\"},{\"group\":\"sentence\",\"text\":\"This song is so catchy. I can't stop singing it!\",\"vi\":\"Bài hát này bắt tai quá. Tôi hát mãi không dừng được!\"},{\"group\":\"sentence\",\"text\":\"My brother enjoys playing football with his friends after school.\",\"vi\":\"Em trai tôi thích đá bóng với bạn sau giờ học.\"},{\"group\":\"sentence\",\"text\":\"Our team won the match last night.\",\"vi\":\"Tối qua đội chúng tôi thắng trận.\"},{\"group\":\"dialogue\",\"text\":\"What do you like doing in your free time?\",\"vi\":\"Lúc rảnh bạn thích làm gì?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I love taking photos. I joined a photography club last month.\",\"vi\":\"Mình rất thích chụp ảnh. Tháng trước mình đã vào một câu lạc bộ nhiếp ảnh.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"That sounds fun! Do you go out a lot?\",\"vi\":\"Nghe vui đấy! Bạn có hay ra ngoài không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Yes, I enjoy walking around the Old Quarter with my camera. What about you?\",\"vi\":\"Có, mình thích đi dạo quanh Phố Cổ với máy ảnh. Còn bạn?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"I'm learning to play the guitar. I practise every evening.\",\"vi\":\"Mình đang học chơi guitar. Tối nào mình cũng tập.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Wow! Do you want to play at our club party next week?\",\"vi\":\"Hay quá! Tuần sau bạn có muốn chơi đàn ở bữa tiệc của câu lạc bộ mình không?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"I'm not very good yet, but I don't mind trying.\",\"vi\":\"Mình chưa giỏi lắm, nhưng mình không ngại thử.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Great! I hope to see you there.\",\"vi\":\"Tuyệt! Mong gặp bạn ở đó.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\"
