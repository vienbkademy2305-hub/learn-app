s film look very real — the city is on fire!\",\"answer\":\"special effects\"},{\"q\":\"I'm a big ___ of Den Vau. I have all his songs.\",\"answer\":\"fan\"},{\"q\":\"Everybody is singing this song. It's really ___.\",\"answer\":\"catchy\"},{\"q\":\"She has a beautiful voice. She wants to be a ___.\",\"answer\":\"singer\"}]},{\"id\":\"b16-x7\",\"bank_no\":3,\"kind\":\"gap-fill\",\"instructions_vi\":\"Điền play, go hoặc do (play + môn có bóng; go + môn đuôi -ing; do + võ, yoga, thể dục).\",\"bank\":[\"play\",\"go\",\"do\"],\"questions\":[{\"q\":\"I ___ football every Saturday.\",\"answer\":\"play\"},{\"q\":\"Let's ___ swimming this afternoon.\",\"answer\":\"go\"},{\"q\":\"My mother and I ___ yoga in the morning.\",\"answer\":\"do\"},{\"q\":\"They ___ basketball after school.\",\"answer\":\"play\"},{\"q\":\"We often ___ cycling at the weekend.\",\"answer\":\"go\"},{\"q\":\"My brother wants to ___ karate.\",\"answer\":\"do\"}]},{\"id\":\"b16-x8\",\"bank_no\":20,\"kind\":\"mcq\",\"instructions_vi\":\"Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.\",\"audio_text\":\"Man: What do you like doing at the weekend?\\nWoman: I enjoy painting, and I'm learning to play the guitar.\\nMan: Cool! I love watching football. Do you want to come to a match on Sunday?\\nWoman: I'd love to, but I promised to visit my grandmother.\\nMan: No problem. Maybe next time.\",\"questions\":[{\"q\":\"What does the woman enjoy?\",\"options\":[\"playing football\",\"painting\",\"cooking\",\"swimming\"],\"answer\":\"b\"},{\"q\":\"What is she learning?\",\"options\":[\"to play the piano\",\"to play the guitar\",\"to paint\",\"to cook\"],\"answer\":\"b\"},{\"q\":\"Why can't she go to the match?\",\"options\":[\"She hates football.\",\"She is ill.\",\"She is visiting her grandmother.\",\"She has to work.\"],\"answer\":\"c\"}]},{\"id\":\"b16-x9\",\"bank_no\":20,\"kind\":\"tf\",\"instructions_vi\":\"Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý
