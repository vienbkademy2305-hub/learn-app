y caused by the large number of private vehicles.\",\"vi\":\"Ùn tắc giao thông chủ yếu do số lượng lớn phương tiện cá nhân gây ra.\"},{\"group\":\"sentence\",\"text\":\"One solution is to give people incentives to use public transport.\",\"vi\":\"Một giải pháp là khuyến khích người dân dùng phương tiện công cộng.\"},{\"group\":\"sentence\",\"text\":\"This problem can be tackled by building more affordable housing.\",\"vi\":\"Vấn đề này có thể được giải quyết bằng cách xây thêm nhà ở giá phải chăng.\"},{\"group\":\"sentence\",\"text\":\"Rising rents have resulted in many young people living with their parents longer.\",\"vi\":\"Tiền thuê nhà tăng đã khiến nhiều người trẻ sống cùng bố mẹ lâu hơn.\"},{\"group\":\"sentence\",\"text\":\"Air pollution is a serious issue with long-term consequences for children's health.\",\"vi\":\"Ô nhiễm không khí là một vấn đề nghiêm trọng với hậu quả lâu dài cho sức khỏe trẻ em.\"},{\"group\":\"sentence\",\"text\":\"The government should make road safety a top priority.\",\"vi\":\"Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu.\"},{\"group\":\"sentence\",\"text\":\"A national campaign could raise awareness of the dangers of drink-driving.\",\"vi\":\"Một chiến dịch toàn quốc có thể nâng cao nhận thức về nguy hiểm của việc lái xe khi say rượu.\"},{\"group\":\"sentence\",\"text\":\"Heavy penalties are effective only if the law is enforced.\",\"vi\":\"Hình phạt nặng chỉ hiệu quả nếu luật được thực thi.\"},{\"group\":\"sentence\",\"text\":\"The new sports programme will be funded by the city and will address the problem of childhood obesity.\",\"vi\":\"Chương trình thể thao mới sẽ được thành phố cấp kinh phí và sẽ giải quyết vấn đề béo phì ở trẻ em.\"},{\"group\":\"sentence\",\"text\":\"There is no simple way to solve this problem.\",\"vi\":\"Không có cách đơn giản nào để giải quyết vấn đề này.\"},{\"group\":\"dialogue\",\"text\":\"The question is: many young people in cities cannot afford to buy a home. What are the causes, and what are the solutions?\",\"vi\":\"Đề là: nhiều người trẻ ở thành phố không đủ tiền mua nhà. Nguyên nhân là gì, giải pháp là gì?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Causes first. House prices have risen much faster than salaries.\",\"vi\":\"Nguyên nhân trước. Giá nhà tăng nhanh hơn lương nhiều.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"And rich people buy flats as an investment, which leads to even higher prices.\",\"vi\":\"Và người giàu mua căn hộ để đầu tư, điều đó càng đẩy giá lên cao hơn.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Good. Now match each cause with a solution.\",\"vi\":\"Tốt. Giờ ghép mỗi nguyên nhân với một giải pháp.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"For the first one, the government could build more affordable housing for young workers.\",\"vi\":\"Với cái thứ nhất, chính phủ có thể xây thêm nhà ở giá rẻ cho người lao động trẻ.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"And for the second, a higher tax should be introduced on people who own many empty flats.\",\"vi\":\"Còn cái thứ hai, nên áp thuế cao hơn với người sở hữu nhiều căn hộ bỏ trống.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"That gives them an incentive to sell or rent them out.\",\"vi\":\"Điều đó khuyến khích họ bán hoặc cho thuê.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Perfect. Two causes, two solutions, and each solution tackles one cause.\",\"vi\":\"Hoàn hảo. Hai nguyên nhân, hai giải pháp, mỗi giải pháp giải quyết một nguyên nhân.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"The question is: many young people in cities cannot afford to buy a home. What are the causes, and what are the solutions?\",\"vi\":\"Đề là: nhiều người trẻ ở thành phố không đủ tiền mua nhà. Nguyên nhân là gì, giải pháp là gì?\"},{\"speaker\":\"B\",\"text\":\"Causes first. House prices have risen much faster than salaries.\",\"vi\":\"Nguyên nhân trước. Giá nhà tăng nhanh hơn lương nhiều.\"},{\"speaker\":\"A\",\"text\":\"And rich people buy flats as an investment, which leads to even higher prices.\",\"vi\":\"Và người giàu mua căn hộ để đầu tư, điều đó càng đẩy giá lên cao hơn.\"},{\"speaker\":\"B\",\"text\":\"Good. Now match each cause with a solution.\",\"vi\":\"Tốt. Giờ ghép mỗi nguyên nhân với một giải pháp.\"},{\"speaker\":\"A\",\"text\":\"For the first one, the government could build more affordable housing for young workers.\",\"vi\":\"Với cái thứ nhất, chính phủ có thể xây thêm nhà ở giá rẻ cho người lao động trẻ.\"},{\"speaker\":\"B\",\"text\":\"And for the second, a higher tax should be introduced on people who own many empty flats.\",\"vi\":\"Còn cái thứ hai, nên áp thuế cao hơn với người sở hữu nhiều căn hộ bỏ trống.\"},{\"speaker\":\"A\",\"text\":\"That gives them an incentive to sell or rent them out.\",\"vi\":\"Điều đó khuyến khích họ bán hoặc cho thuê.\"},{\"speaker\":\"B\",\"text\":\"Perfect. Two causes, two solutions, and each solution tackles one cause.\",\"vi\":\"Hoàn hảo. Hai nguyên nhân, hai giải pháp, mỗi giải pháp giải quyết một nguyên nhân.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-44-chinh-phu-writing-problem-solution/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-44-chinh-phu-writing-problem-solution/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{
