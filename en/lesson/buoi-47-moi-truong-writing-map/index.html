h long-term consequences for children's health.\",\"vi\":\"Ô nhiễm không khí là một vấn đề nghiêm trọng với hậu quả lâu dài cho sức khỏe trẻ em.\"}},{\"id\":\"cause|n\",\"term\":\"cause\",\"reading\":\"/kɔːz/\",\"meaning\":\"nguyên nhân\",\"definitionEn\":\"what makes something happen\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: the main cause of · one cause of the problem\"},{\"id\":\"solution|n\",\"term\":\"solution\",\"reading\":\"/səˈluː.ʃən/\",\"meaning\":\"giải pháp\",\"definitionEn\":\"a way of dealing with a problem\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: so-LU-tion — Hay đi với: a solution to the problem · find a solution\",\"example\":{\"text\":\"One solution is to give people incentives to use public transport.\",\"vi\":\"Một giải pháp là khuyến khích người dân dùng phương tiện công cộng.\"}},{\"id\":\"solve|v\",\"term\":\"solve\",\"reading\":\"/sɒlv/\",\"meaning\":\"giải quyết\",\"definitionEn\":\"to find an answer to a problem\",\"lesson\":44,\"pos\":\"v\",\"hint\":\"Hay đi với: solve a problem · be solved by\",\"example\":{\"text\":\"There is no simple way to solve this problem.\",\"vi\":\"Không có cách đơn giản nào để giải quyết vấn đề này.\"}},{\"id\":\"consequence|n\",\"term\":\"consequence\",\"reading\":\"/ˈkɒn.sɪ.kwəns/\",\"meaning\":\"hậu quả\",\"definitionEn\":\"a result, often a bad one\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: CON-se-quence — Hay đi với: serious consequences · as a consequence\"},{\"id\":\"lead-to|phr-v\",\"term\":\"lead to\",\"reading\":\"/ˈliːd tuː/\",\"meaning\":\"dẫn đến\",\"definitionEn\":\"to cause something to happen\",\"lesson\":44,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: lead to health problems · lead to an increase in\"},{\"id\":\"result-in|phr-v\",\"term\":\"result in\",\"reading\":\"/rɪˈzʌlt ɪn/\",\"meaning\":\"gây ra; dẫn đến (kết quả)\",\"definitionEn\":\"to have something as an effect\",\"lesson\":44,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: result in higher prices · result in serious :{\"text\":\"After a year of training, I'm used to running in the heat.\",\"vi\":\"Sau một năm luyện tập, tôi đã quen chạy dưới trời nóng.\"}},{\"id\":\"filter|v\",\"term\":\"filter\",\"reading\":\"/ˈfɪl.tər/\",\"meaning\":\"lọc\",\"definitionEn\":\"to remove dirt by passing a liquid through something\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be filtered through sand · filter out dirt\"},{\"id\":\"purify|v\",\"term\":\"purify\",\"reading\":\"/ˈpjʊə.rɪ.faɪ/\",\"meaning\":\"làm sạch; tinh lọc\",\"definitionEn\":\"to make something clean and safe\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: PU-ri-fy — Hay đi với: purify water · be purified with chemicals\",\"example\":{\"text\":\"Chemicals are added to purify the water and kill bacteria.\",\"vi\":\"Hóa chất được thêm vào để làm sạch nước và diệt vi khuẩn.\"}},{\"id\":\"store|v\",\"term\":\"store\",\"reading\":\"/stɔːr/\",\"meaning\":\"lưu trữ; cất giữ\",\"definitionEn\":\"to keep something somewhere until it is needed\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be stored in tanks · store water\"},{\"id\":\"sort|v\",\"term\":\"sort\",\"reading\":\"/sɔːt/\",\"meaning\":\"phân loại\",\"definitionEn\":\"to put things into groups\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be sorted by type · sort rubbish\"},{\"id\":\"crush|v\",\"term\":\"crush\",\"reading\":\"/krʌʃ/\",\"meaning\":\"nghiền; ép nát\",\"definitionEn\":\"to press something hard until it breaks into small pieces\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be crushed into small pieces\"},{\"id\":\"melt|v\",\"term\":\"melt\",\"reading\":\"/melt/\",\"meaning\":\"làm tan chảy; nung chảy\",\"definitionEn\":\"to turn something solid into liquid by heating it\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be melted down · melt plastic\"},{\"id\":\"package|v\",\"term\":\"package\",\"reading\":\"/ˈpæk.ɪdʒ/\",\"meaning\":\"đóng gói\",\"definitionEn\":\"to put goods into boxes or wrappers\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be packaged and sold · packaged in boxes\"},{\"id\":\"deliver|v\",\"term\":\"deliver\",\"reading\":\"/dɪˈlɪv.ər/\",\"meaning\":\"giao; chuyển đến\",\"definitionEn\":\"to take goods to a person or place\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: de-LIV-er — Hay đi với: be delivered to shops · deliver water to homes\"},{\"id\":\"reservoir|n\",\"term\":\"reservoir\",\"reading\":\"/ˈrez.ə.vwɑːr/\",\"meaning\":\"hồ chứa nước\",\"definitionEn\":\"a large lake used to store water\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: be stored in a reservoir\",\"example\":{\"text\":\"The clean water is stored in a reservoir before it is delivered to homes.\",\"vi\":\"Nước sạch được lưu trong hồ chứa trước khi được đưa đến các hộ gia đình.\"}},{\"id\":\"subsequently|adv\",\"term\":\"subsequently\",\"reading\":\"/ˈsʌb.sɪ.kwənt.li/\",\"meaning\":\"sau đó\",\"definitionEn\":\"after that; later\",\"lesson\":46,\"pos\":\"adv\",\"hint\":\"Trọng âm: SUB-se-quent-ly\",\"example\":{\"text\":\"The mixture is heated to 200°C and subsequently packaged for sale.\",\"vi\":\"Hỗn hợp được đun nóng đến 200°C và sau đó được đóng gói để bán.\"}},{\"id\":\"once|conj\",\"term\":\"once\",\"reading\":\"/wʌns/\",\"meaning\":\"một khi; sau khi\",\"definitionEn\":\"as soon as; after\",\"lesson\":46,\"pos\":\"conj\",\"hint\":\"Hay đi với: once the water has been filtered, …\",\"example\":{\"text\":\"The Moon orbits the Earth once every 27 days.\",\"vi\":\"Mặt Trăng quay quanh Trái Đất 27 ngày một vòng.\"}},{\"id\":\"landfill|n\",\"term\":\"landfill\",\"reading\":\"/ˈlænd.fɪl/\",\"meaning\":\"bãi chôn lấp rác\",\"definitionEn\":\"a place where rubbish is buried in the ground\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: send waste to landfill · landfill sites\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"compost|n\",\"term\":\"compost\",\"reading\":\"/ˈkɒm.pɒst/\",\"meaning\":\"phân hữu cơ (ủ từ rác thực vật)\",\"definitionEn\":\"decayed plant waste used to feed soil\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: turn food waste into compost · make compost\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"demolish|v\",\"term\":\"demolish\",\"reading\":\"/dɪˈmɒl.ɪʃ/\",\"meaning\":\"phá dỡ (công trình)\",\"definitionEn\":\"to knock down a building\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: de-MOL-ish — Hay đi với: be demolished to make way for · demolish old houses\"},{\"id\":\"construct|v\",\"term\":\"construct\",\"reading\":\"/kənˈstrʌkt/\",\"meaning\":\"xây dựng\",\"definitionEn\":\"to build something\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-STRUCT — Hay đi với: be constructed in the centre · construct a bridge\"},{\"id\":\"convert|v\",\"term\":\"convert\",\"reading\":\"/kənˈvɜːt/\",\"meaning\":\"chuyển đổi (mục đích sử dụng)\",\"definitionEn\":\"to change something into a different form or use\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-VERT — Hay đi với: be converted into a hotel · convert A into B\"},{\"id\":\"extend|v\",\"term\":\"extend\",\"reading\":\"/ɪkˈstend/\",\"meaning\":\"kéo dài; mở rộng (theo chiều dài)\",\"definitionEn\":\"to make something longer or larger\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the road was extended to the coast · extend the railway line\"},{\"id\":\"expand|v\",\"term\":\"expand\",\"reading\":\"/ɪkˈspænd/\",\"meaning\":\"mở rộng; phát triển (quy mô)\",\"definitionEn\":\"to become or make bigger in size\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the car park was expanded · expand significantly\"},{\"id\":\"relocate|v\",\"term\":\"relocate\",\"reading\":\"/ˌriː.ləʊˈkeɪt/\",\"meaning\":\"di dời; chuyển đến chỗ khác\",\"definitionEn\":\"to move to a new place\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: re-lo-CATE — Hay đi với: be relocated to the north · relocate the market\"},{\"id\":\"remove|v\",\"term\":\"remove\",\"reading\":\"/rɪˈmuːv/\",\"meaning\":\"dỡ bỏ; loại bỏ\",\"definitionEn\":\"to take something away\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the trees were removed · remove the fence\"},{\"id\":\"residential|adj\",\"term\":\"residential\",\"reading\":\"/ˌrez.ɪˈden.ʃəl/\",\"meaning\":\"(thuộc) khu dân cư\",\"definitionEn\":\"having houses rather than offices or factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: res-i-DEN-tial — Hay đi với: a residential area · residential buildings\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"industrial|adj\",\"term\":\"industrial\",\"reading\":\"/ɪnˈdʌs.tri.əl/\",\"meaning\":\"(thuộc) công nghiệp\",\"definitionEn\":\"having factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-DUS-tri-al — Hay đi với: an industrial area · industrial zone\",\"example\":{\"text\":\"An industrial zone has been constructed next to the railway station.\",\"vi\":\"Một khu công nghiệp đã được xây dựng bên cạnh nhà ga.\"}},{\"id\":\"woodland|n\",\"term\":\"woodland\",\"reading\":\"/ˈwʊd.lənd/\",\"meaning\":\"khu rừng nhỏ; đất rừng\",\"definitionEn\":\"land covered with trees\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: an area of woodland · woodland was cleared\",\"example\":{\"text\":\"The woodland in the south made way for a large car park.\",\"vi\":\"Khu rừng ở phía nam nhường chỗ cho một bãi đỗ xe lớn.\"}},{\"id\":\"farmland|n\",\"term\":\"farmland\",\"reading\":\"/ˈfɑːm.lænd/\",\"meaning\":\"đất nông nghiệp\",\"definitionEn\":\"land used for growing crops or keeping animals\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: farmland was replaced by houses\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"footpath|n\",\"term\":\"footpath\",\"reading\":\"/ˈfʊt.pɑːθ/\",\"meaning\":\"lối đi bộ\",\"definitionEn\":\"a narrow path for walking\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: a new footpath · a footpath along the river\",\"example\":{\"text\":\"A new footpath makes the beach more accessible to visitors.\",\"vi\":\"Một lối đi bộ mới giúp du khách dễ ra bãi biển hơn.\"}},{\"id\":\"redevelopment|n\",\"term\":\"redevelopment\",\"reading\":\"/ˌriː.dɪˈvel.əp.mənt/\",\"meaning\":\"sự tái phát triển; cải tạo (khu vực)\",\"definitionEn\":\"rebuilding an area to improve it\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: after the redevelopment · a major redevelopment\",\"example\":{\"text\":\"After the redevelopment, the church remained unchanged.\",\"vi\":\"Sau đợt cải tạo, nhà thờ vẫn giữ nguyên.\"}},{\"id\":\"cycle-lane|phr-n\",\"term\":\"cycle lane\",\"reading\":\"/ˈsaɪ.kəl ˌleɪn/\",\"meaning\":\"làn đường xe đạp\",\"definitionEn\":\"part of a road only for bicycles\",\"lesson\":47,\"pos\":\"phr-n\"},{\"id\":\"make-way-for|phr-v\",\"term\":\"make way for\",\"reading\":\"/ˌmeɪk ˈweɪ fɔːr/\",\"meaning\":\"nhường chỗ cho (bị thay bằng)\",\"definitionEn\":\"to be removed so something new can replace it\",\"lesson\":47,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: the trees were cut down to make way for a car park · the farm made way for houses\"},{\"id\":\"layout|n\",\"term\":\"layout\",\"reading\":\"/ˈleɪ.aʊt/\",\"meaning\":\"bố cục; cách bố trí\",\"definitionEn\":\"the way things are arranged in a space\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: the layout of the village · change the layout\",\"example\":{\"text\":\"The two maps show how the layout of the village changed between 1990 and 2020.\",\"vi\":\"Hai bản đồ cho thấy bố cục của ngôi làng đã thay đổi thế nào từ năm 1990 đến 2020.\"}},{\"id\":\"dramatic|adj\",\"term\":\"dramatic\",\"reading\":\"/drəˈmæt.ɪk/\",\"meaning\":\"đáng kể; mạnh mẽ (thay đổi)\",\"definitionEn\":\"very great and sudden\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: dra-MAT-ic — Hay đi với: dramatic changes · a dramatic transformation\",\"example\":{\"text\":\"The most dramatic change was the removal of the trees in the centre.\",\"vi\":\"Thay đổi đáng kể nhất là việc dỡ bỏ cây xanh ở trung tâm.\"}},{\"id\":\"transform|v\",\"term\":\"transform\",\"reading\":\"/trænsˈfɔːm/\",\"meaning\":\"biến đổi hoàn toàn\",\"definitionEn\":\"to change something completely\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: trans-FORM — Hay đi với: be transformed into · transform the area\"},{\"id\":\"accessible|adj\",\"term\":\"accessible\",\"reading\":\"/əkˈses.ə.bəl/\",\"meaning\":\"dễ tiếp cận; dễ đến\",\"definitionEn\":\"easy to reach or use\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: ac-CES-si-ble — Hay đi với: more accessible to visitors · easily accessible by bus\",\"example\":{\"text\":\"A new footpath makes the beach more accessible to visitors.\",\"vi\":\"Một lối đi bộ mới giúp du khách dễ ra bãi biển hơn.\"}}],\"lesson\":{\"number\":47,\"title\":\"Môi trường (nâng cao) · Writing Task 1: so sánh bản đồ\"}}]\n"])</script><script>self.__next_f.push([1,"30:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=47\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n31:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-
