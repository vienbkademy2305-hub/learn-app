[{\"q\":\"The woodland has been partly cleared. A park has been created there. (to create)\",\"answer\":\"The woodland has been partly cleared to create a park.\"},{\"q\":\"A footbridge has been added. It links the park with the housing estate. (which)\",\"answer\":\"A footbridge has been added, which links the park with the housing estate.\",\"accept\":[\"A footbridge which links the park with the housing estate has been added.\"]},{\"q\":\"The river has not changed. The main road has not changed either. (Both … and … have remained unchanged)\",\"answer\":\"Both the river and the main road have remained unchanged.\",\"accept\":[\"Both the river and the main road remain unchanged.\"]}]},{\"id\":\"b71-x3\",\"bank_no\":10,\"kind\":\"mcq\",\"instructions_vi\":\"Đề Task 2: 'In many cities, young people find it increasingly difficult to afford a home. What are the causes of this problem? What measures could be taken to solve it?' Chọn đáp án đúng.\",\"questions\":[{\"q\":\"Which introduction answers BOTH questions?\",\"options\":[\"Housing is a big problem in many cities around the world today.\",\"This essay will discuss the causes of high house prices.\",\"Rising property prices and low starting salaries have made homes unaffordable for many young adults, but building more affordable housing and supporting first-time buyers could ease the problem.\",\"I agree that young people cannot afford a home.\"],\"answer\":\"c\"},{\"q\":\"Which solution matches the cause 'investors buy flats and leave them empty'?\",\"options\":[\"Young people should save more money.\",\"Governments could tax properties that are left empty for a long time.\",\"Cities should build more schools.\",\"Banks should lend more to investors.\"],\"answer\":\"b\",\"explain_vi\":\"Giải pháp tốt nhất đi kèm trực tiếp với nguyên nhân đã nêu.\"},{\"q\":\"Which sentence is NOT appropriate in the 'solutions' paragraph?\",\"options\":[\"One effective measure would be to build more affordable rental housing.\",\"Another option is to offer low-interest loans to first-time buyers.\",\"Another cause is that salaries for graduates have not kept pace with prices.\",\"Employers in expensive cities could also provide housing allowances.\"],\"answer\":\"c\",\"explain_vi\":\"Đây là một NGUYÊN NHÂN — đặt nhầm đoạn làm giảm điểm Coherence.\"}]},{\"id\":\"b71-x4\",\"bank_no\":7,\"kind\":\"error-correction\",\"instructions_vi\":\"Đoạn giải pháp có 4 lỗi. Tìm và sửa.\",\"text\":\"One effective solution would be for government to build more affordable houses. Another option is offer cheap loans to a young buyers. Finally, employers could to provide housing allowances.\",\"errors\":[{\"wrong\":\"for government\",\"right\":\"for the government\",\"why\":\"Chỉ chính phủ của một nước cụ thể → 'the government'.\"},{\"wrong\":\"is offer\",\"right\":\"is to offer\",\"why\":\"'Another option is' + to V.\"},{\"wrong\":\"a young buyers\",\"right\":\"young buyers\",\"why\":\"Không dùng 'a' trước danh từ số nhiều (lỗi riêng của bạn: 'a students').\"},{\"wrong\":\"could to provide\",\"right\":\"could provide\",\"why\":\"Sau động từ khuyết thiếu 'could' là động từ nguyên mẫu không 'to'.\"}]},{\"id\":\"b71-x5\",\"bank_no\":20,\"kind\":\"mcq\",\"instructions_vi\":\"Nghe một giáo viên nhận xét bài Task 1 bản đồ (hai giọng). Chọn đáp án đúng.\",\"audio_text\":\"Teacher: Your map description is much better organised than last time, Nam.\\nStudent: Thanks. I went from north to south like you suggested.\\nTeacher: Yes, that works well. But in your overview, you only mentioned the new school. That's a detail, not a general trend.\\nStudent: So what should I write?\\nTeacher: Something like 'the village has become more residential'. Then the details go in the body.\\nStudent: OK. Were my tenses correct?\\nTeacher: Mostly. But you wrote 'the farmhouse is demolished'. It should be 'has been demolished', because you're comparing with the present.\\nStudent: Right. And the word count?\\nTeacher: A hundred and forty. You need at least a hundred and fifty, so add one more detail about the park.\",\"questions\":[{\"q\":\"What has improved since the student's last essay?\",\"options\":[\"the overview\",\"the organisation\",\"the word count\",\"the tenses\"],\"answer\":\"b\"},{\"q\":\"What was wrong with the overview?\",\"options\":[\"It was too long.\",\"It included numbers.\",\"It described a detail rather than a general trend.\",\"It was missing.\"],\"answer\":\"c\"},{\"q\":\"Which correction did the teacher make?\",\"options\":[\"'is demolished' → 'has been demolished'\",\"'was built' → 'is built'\",\"'park' → 'parks'\",\"'north' → 'the north'\"],\"answer\":\"a\"},{\"q\":\"How many words did the student write?\",\"options\":[\"114\",\"140\",\"150\",\"160\"],\"answer\":\"b\"}]},{\"id\":\"b71-x6\",\"bank_no\":20,\"kind\":\"tf\",\"instructions_vi\":\"Nghe lời khuyên về đề hai câu hỏi (độc thoại). Chọn Đúng (T) hoặc Sai (F).\",\"audio_text\":\"When an essay question contains two questions, examiners check whether you have answered both of them fully. It's not enough to mention solutions briefly in the conclusion. The safest plan is one body paragraph for causes and one for solutions, roughly the same length. And try to link them: if one cause is that wages are low, one solution could address wages directly.\",\"questions\":[{\"q\":\"Mentioning solutions in the conclusion is enough.\",\"answer\":\"F\"},{\"q\":\"The two body paragraphs should be about the same length.\",\"answer\":\"T\"},{\"q\":\"Solutions should be connected to the causes you described.\",\"answer\":\"T\"},{\"q\":\"Examiners only check the first question.\",\"answer\":\"F\"}]}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-betwe
