\"Trọng âm: com-PUL-so-ry — Hay đi với: compulsory subject · compulsory education\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"essential|adj\",\"term\":\"essential\",\"reading\":\"/ɪˈsen.ʃəl/\",\"meaning\":\"thiết yếu; rất cần thiết\",\"definitionEn\":\"absolutely necessary\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: es-SEN-tial — Hay đi với: essential for… · it is essential to…\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"creativity|n\",\"term\":\"creativity\",\"reading\":\"/ˌkriː.eɪˈtɪv.ə.ti/\",\"meaning\":\"sự sáng tạo; khả năng sáng tạo\",\"definitionEn\":\"the ability to produce new and original ideas\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: cre-a-TI-vi-ty — Hay đi với: develop creativity · encourage creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"independent|adj\",\"term\":\"independent\",\"reading\":\"/ˌɪn.dɪˈpen.dənt/\",\"meaning\":\"tự lập; độc lập\",\"definitionEn\":\"able to do things without help from others\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-de-PEN-dent — Hay đi với: become independent · independent learners\",\"example\":{\"text\":\"University students should be more independent than school children.\",\"vi\":\"Sinh viên đại học nên tự lập hơn học sinh phổ thông.\"}},{\"id\":\"practical|adj\",\"term\":\"practical\",\"reading\":\"/ˈpræk.tɪ.kəl/\",\"meaning\":\"thực tế; thực hành\",\"definitionEn\":\"connected with real situations rather than ideas\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PRAC-ti-cal — Hay đi với: practical skills · practical experience\",\"example\":{\"text\":\"Cooking and managing money are practical skills.\",\"vi\":\"Nấu ăn và quản lý tiền bạc là những kỹ năng thực tế.\"}},{\"id\":\"pressure|n\",\"term\":\"pressure\",\"reading\":\"/ˈpreʃ.ər/\",\"meaning\":\"áp lực\",\"definitionEn\":\"a feeling that you must do something, causing stress\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: PRES-sure — Hay đi với: put pressure on someone · under pressure\",\"example\":{\"text\":\"Some teenagers start smoking due to peer pressure.\",\"vi\":\"Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè.\"}},{\"id\":\"critical-thinking|phr-n\",\"term\":\"critical thinking\",\"reading\":\"/ˌkrɪt.ɪ.kəl ˈθɪŋ.kɪŋ/\",\"meaning\":\"tư duy phản biện\",\"definitionEn\":\"the ability to judge information carefully and logically\",\"lesson\":22,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: develop critical thinking · critical thinking skills\"},{\"id\":\"develop|v\",\"term\":\"develop\",\"reading\":\"/dɪˈvel.əp/\",\"meaning\":\"phát triển; rèn luyện (kỹ năng)\",\"definitionEn\":\"to grow or make something grow stronger\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"di-VEL-ờp: không có e ở cuối. — Trọng âm: de-VE-lop — Hay đi với: develop skills · develop creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"environment|n\",\"term\":\"environment\",\"reading\":\"/ɪnˈvaɪ.rən.mənt/\",\"meaning\":\"môi trường\",\"definitionEn\":\"the natural world of land, air, water, plants and animals\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"En-VAI-rần-mần: có “iron” (AI-rần) ở giữa từ. — Trọng âm: en-VI-ron-ment — Hay đi với: protect the environment · harm the environment\",\"example\":{\"text\":\"We should protect the environment for our children.\",\"vi\":\"Chúng ta nên bảo vệ môi trường vì con cháu mình.\"}},{\"id\":\"pollution|n\",\"term\":\"pollution\",\"reading\":\"/pəˈluː.ʃən/\",\"meaning\":\"sự ô nhiễm\",\"definitionEn\":\"damage to air, water or land by harmful substances\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: pol-LU-tion — Hay đi với: air pollution · water pollution\",\"example\":{\"text\":\"Air pollution in our city has got worse since 2015.\",\"vi\":\"Ô nhiễm không khí ở thành phố chúng tôi trở nên tệ hơn kể từ năm 2015.\"}},{\"id\":\"waste|n\",\"term\":\"waste\",\"reading\":\"/weɪst/\",\"meaning\":\"rác thải; chất thải\",\"definitionEn\":\"things that are thrown away because they are not needed\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Hay đi với: plastic waste · food waste\",\"example\":{\"text\":\"Food waste is a big problem in restaurants.\",\"vi\":\"Lãng phí thực phẩm là một vấn đề lớn ở các nhà hàng.\"}},{\"id\":\"rubbish|n\",\"term\":\"rubbish\",\"reading\":\"/ˈrʌb.ɪʃ/\",\"meaning\":\"rác\",\"definitionEn\":\"things you throw away (British English)\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"RÂB-ish: 2 chữ b. — Trọng âm: RUB-bish — Hay đi với: throw away rubbish · a rubbish bin\",\"example\":{\"text\":\"Our group has picked up five tons of rubbish so far.\",\"vi\":\"Đến nay nhóm chúng tôi đã nhặt được năm tấn rác.\"}},{\"id\":\"climate-change|phr-n\",\"term\":\"climate change\",\"reading\":\"/ˈklaɪ.mət ˌtʃeɪndʒ/\",\"meaning\":\"biến đổi khí hậu\",\"definitionEn\":\"long-term changes in the Earth's weather patterns\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: tackle climate change · the effects of climate change\"},{\"id\":\"global-warming|phr-n\",\"term\":\"global warming\",\"reading\":\"/ˌɡləʊ.bəl ˈwɔː.mɪŋ/\",\"meaning\":\"sự nóng lên toàn cầu\",\"definitionEn\":\"the rise in the Earth's average temperature\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: cause global warming · slow down global warming\"},{\"id\":\"carbon-emissions|phr-n\",\"term\":\"carbon emissions\",\"reading\":\"/ˌkɑː.bən iˈmɪʃ.ənz/\",\"meaning\":\"khí thải carbon\",\"definitionEn\":\"gases released when fuel is burned\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce carbon emissions · cut carbon emissions\"},{\"id\":\"renewable-energy|phr-n\",\"term\":\"renewable energy\",\"reading\":\"/rɪˌnjuː.ə.bəl ˈen.ə.dʒi/\",\"meaning\":\"năng lượng tái tạo\",\"definitionEn\":\"power from sources such as the sun and wind\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use renewable energy · invest in renewable energy\"},{\"id\":\"protect|v\",\"term\":\"protect\",\"reading\":\"/prəˈtekt/\",\"meaning\":\"bảo vệ\",\"definitionEn\":\"to keep someone or something safe from harm\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: pro-TECT — Hay đi với: protect the environment · protect wildlife\",\"example\":{\"text\":\"Users should protect their privacy online.\",\"vi\":\"Người dùng nên bảo vệ quyền riêng tư của mình trên mạng.\"}},{\"id\":\"reduce|v\",\"term\":\"reduce\",\"reading\":\"/rɪˈdʒuːs/\",\"meaning\":\"giảm; cắt giảm\",\"definitionEn\":\"to make something smaller in amount or size\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: re-DUCE — Hay đi với: reduce pollution · reduce waste\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"volunteer|n\",\"term\":\"volunteer\",\"reading\":\"/ˌvɒl.ənˈtɪər/\",\"meaning\":\"tình nguyện viên\",\"definitionEn\":\"a person who works without being paid\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"vol-ờn-TIR: nhấn âm cuối. — Trọng âm: vo-lun-TEER — Hay đi với: work as a volunteer · volunteer work\",\"example\":{\"text\":\"Have you ever worked as a volunteer? – Yes, I worked at a national park last summer.\",\"vi\":\"Bạn đã bao giờ làm tình nguyện viên chưa? – Rồi, mùa hè năm ngoái tôi làm ở một vườn quốc gia.\"}},{\"id\":\"deforestation|n\",\"term\":\"deforestation\",\"reading\":\"/diːˌfɒr.ɪˈsteɪ.ʃən/\",\"meaning\":\"nạn phá rừng\",\"definitionEn\":\"cutting down large areas of trees\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: de-fo-res-TA-tion — Hay đi với: stop deforestation · the causes of deforestation\",\"example\":{\"text\":\"Deforestation has destroyed the homes of many animals.\",\"vi\":\"Nạn phá rừng đã phá hủy nơi sống của nhiều loài động vật.\"}},{\"id\":\"endangered-species|phr-n\",\"term\":\"endangered species\",\"reading\":\"/ɪnˌdeɪn.dʒəd ˈspiː.ʃiːz/\",\"meaning\":\"loài có nguy cơ tuyệt chủng\",\"definitionEn\":\"types of animals or plants that may soon disappear\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect endangered species\"},{\"id\":\"single-use-plastic|phr-n\",\"term\":\"single-use plastic\",\"reading\":\"/ˌsɪŋ.ɡəl.juːs ˈplæs.tɪk/\",\"meaning\":\"nhựa dùng một lần\",\"definitionEn\":\"plastic items used once and then thrown away\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: ban single-use plastic · single-use plastic bags\"},{\"id\":\"reusable|adj\",\"term\":\"reusable\",\"reading\":\"/ˌriːˈjuː.zə.bəl/\",\"meaning\":\"dùng lại được\",\"definitionEn\":\"able to be used again\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-U-sa-ble — Hay đi với: a reusable bag · a reusable bottle\",\"example\":{\"text\":\"I always bring a reusable bottle to work.\",\"vi\":\"Tôi luôn mang theo một chai nước dùng lại được khi đi làm.\"}},{\"id\":\"environmentally-friendly|adj\",\"term\":\"environmentally friendly\",\"reading\":\"/ɪnˌvaɪ.rən.men.təl.i ˈfrend.li/\",\"meaning\":\"thân thiện với môi trường\",\"definitionEn\":\"not harmful to nature\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Hay đi với: environmentally friendly products\"},{\"id\":\"nature|n\",\"term\":\"nature\",\"reading\":\"/ˈneɪ.tʃər/\",\"meaning\":\"thiên nhiên; tự nhiên\",\"definitionEn\":\"plants, animals, and the physical world not made by people\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: NA-ture — Hay đi với: in nature · close to nature\",\"example\":{\"text\":\"Spending time in nature helps me relax after work.\",\"vi\":\"Dành thời gian giữa thiên nhiên giúp tôi thư giãn sau giờ làm.\"}},{\"id\":\"fresh-air|phr-n\",\"term\":\"fresh air\",\"reading\":\"/ˌfreʃ ˈeər/\",\"meaning\":\"không khí trong lành\",\"definitionEn\":\"clean air outside, away from pollution\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: get some fresh air · breathe fresh air\"},{\"id\":\"countryside|n\",\"term\":\"countryside\",\"reading\":\"/ˈkʌn.tri.saɪd/\",\"meaning\":\"vùng nông thôn; miền quê\",\"definitionEn\":\"land outside towns, with fields and farms\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: COUN-try-side — Hay đi với: live in the countryside · the beautiful countryside\",\"example\":{\"text\":\"I would rather live in the countryside than in a big city.\",\"vi\":\"Tôi thà sống ở nông thôn còn hơn ở thành phố lớn.\"}},{\"id\":\"green-space|phr-n\",\"term\":\"green space\",\"reading\":\"/ˌɡriːn ˈspeɪs/\",\"meaning\":\"không gian xanh (công viên, vườn cây trong thành phố)\",\"definitionEn\":\"an area of grass and trees in a city\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: more green spaces · a lack of green space\"},{\"id\":\"peaceful|adj\",\"term\":\"peaceful\",\"reading\":\"/ˈpiːs.fəl/\",\"meaning\":\"yên bình; thanh bình\",\"definitionEn\":\"quiet and calm\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: PEACE-ful — Hay đi với: a peaceful village · peaceful and quiet\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"noisy|adj\",\"term\":\"noisy\",\"reading\":\"/ˈnɔɪ.zi/\",\"meaning\":\"ồn ào\",\"definitionEn\":\"making a lot of loud sounds\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: NOI-sy — Hay đi với: a noisy street · noisy neighbours\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"polluted|adj\",\"term\":\"polluted\",\"reading\":\"/pəˈluː.tɪd/\",\"meaning\":\"bị ô nhiễm\",\"definitionEn\":\"made dirty by harmful substances\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: pol-LU-ted — Hay đi với: a polluted river · heavily polluted\",\"example\":{\"text\":\"The river near my house is badly polluted.\",\"vi\":\"Con sông gần nhà tôi bị ô nhiễm nặng.\"}},{\"id\":\"outdoor|adj\",\"term\":\"outdoor\",\"reading\":\"/ˈaʊt.dɔː/\",\"meaning\":\"ngoài trời\",\"definitionEn\":\"happening outside, not in a building\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Hay đi với: outdoor activities · outdoor sports\",\"example\":{\"text\":\"I'm really keen on outdoor activities like cycling and camping.\",\"vi\":\"Tôi rất mê các hoạt động ngoài trời như đạp xe và cắm trại.\"}},{\"id\":\"go-for-a-walk|colloc\",\"term\":\"go for a walk\",\"reading\":\"/ɡəʊ fər ə ˈwɔːk/\",\"meaning\":\"đi dạo\",\"definitionEn\":\"to leave the house and move on foot for pleasure\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: go for a walk in the park · go for a walk after dinner\"},{\"id\":\"plant|v\",\"term\":\"plant\",\"reading\":\"/plɑːnt/\",\"meaning\":\"trồng (cây)\",\"definitionEn\":\"to put seeds or young trees into the ground\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Hay đi với: plant trees · plant flowers\",\"example\":{\"text\":\"First, used bottles are collected from homes and taken to a recycling plant.\",\"vi\":\"Đầu tiên, chai đã qua sử dụng được thu gom từ các hộ gia đình và đưa đến nhà máy tái chế.\"}},{\"id\":\"keen-on|colloc\",\"term\":\"keen on\",\"reading\":\"/ˈkiːn ɒn/\",\"meaning\":\"thích; say mê\",\"definitionEn\":\"very interested in something\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: be keen on + V-ing · be really keen on\"},{\"id\":\"prefer|v\",\"term\":\"prefer\",\"reading\":\"/prɪˈfɜːr/\",\"meaning\":\"thích hơn\",\"definitionEn\":\"to like one thing more than another\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-FER — Hay đi với: prefer A to B · prefer + V-ing\",\"example\":{\"text\":\"I prefer casual clothes at the weekend.\",\"vi\":\"Cuối tuần tôi thích mặc đồ thường ngày hơn.\"}},{\"id\":\"would-rather|colloc\",\"term\":\"would rather\",\"reading\":\"/wʊd ˈrɑː.ðər/\",\"meaning\":\"thà… còn hơn; muốn … hơn\",\"definitionEn\":\"used to say what you want to do more\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: would rather + V + than + V · I'd rather not\"},{\"id\":\"technology|n\",\"term\":\"technology\",\"reading\":\"/tekˈnɒl.ə.dʒi/\",\"meaning\":\"công nghệ\",\"definitionEn\":\"scientific knowledge used to make machines and tools\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: tech-NO-lo-gy — Hay đi với: modern technology · new technology\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"device|n\",\"term\":\"device\",\"reading\":\"/dɪˈvaɪs/\",\"meaning\":\"thiết bị\",\"definitionEn\":\"a machine or tool, e.g. a phone or tablet\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: de-VICE — Hay đi với: electronic devices · a mobile device\"},{\"id\":\"artificial-intelligence|phr-n\",\"term\":\"artificial intelligence\",\"reading\":\"/ˌɑː.tɪ.fɪʃ.əl ɪnˈtel.ɪ.dʒəns/\",\"meaning\":\"trí tuệ nhân tạo (AI)\",\"definitionEn\":\"computer systems that can learn and make decisions\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use artificial intelligence · AI tools\"},{\"id\":\"automation|n\",\"term\":\"automation\",\"reading\":\"/ˌɔː.təˈmeɪ.ʃən/\",\"meaning\":\"tự động hóa\",\"definitionEn\":\"using machines to do work that people used to do\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: au-to-MA-tion — Hay đi với: automation in factories · jobs lost to automation\",\"example\":{\"text\":\"Automation has replaced many jobs in factories.\",\"vi\":\"Tự động hóa đã thay thế nhiều công việc trong nhà máy.\"}},{\"id\":\"digital-literacy|phr-n\",\"term\":\"digital literacy\",\"reading\":\"/ˌdɪdʒ.ɪ.təl ˈlɪt.ər.ə.si/\",\"meaning\":\"kỹ năng số; hiểu biết về công nghệ số\",\"definitionEn\":\"the ability to use computers and the internet well\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve digital literacy · digital literacy skills\"},{\"id\":\"social-media|phr-n\",\"term\":\"social media\",\"reading\":\"/ˌsəʊ.ʃəl ˈmiː.di.ə/\",\"meaning\":\"mạng xã hội\",\"definitionEn\":\"websites and apps where people share posts and messages\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use social media · on social media\"},{\"id\":\"screen-time|phr-n\",\"term\":\"screen time\",\"reading\":\"/ˈskriːn ˌtaɪm/\",\"meaning\":\"thời gian dùng màn hình (điện thoại, máy tính, TV)\",\"definitionEn\":\"the amount of time spent using phones, computers or TV\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: limit screen time · too much screen time\"},{\"id\":\"software|n\",\"term\":\"software\",\"reading\":\"/ˈsɒft.weər/\",\"meaning\":\"phần mềm\",\"definitionEn\":\"programs that run on a computer\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: SOFT-ware — Hay đi với: install software · a software engineer\",\"example\":{\"text\":\"A software engineer is a person who writes computer programs.\",\"vi\":\"Kỹ sư phần mềm là người viết chương trình máy tính.\"}},{\"id\":\"robot|n\",\"term\":\"robot\",\"reading\":\"/ˈrəʊ.bɒt/\",\"meaning\":\"rô-bốt; người máy\",\"definitionEn\":\"a machine that can do tasks automatically\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: RO-bot — Hay đi với: industrial robots · a robot vacuum cleaner\"},{\"id\":\"user|n\",\"term\":\"user\",\"reading\":\"/ˈjuː.zər/\",\"meaning\":\"người dùng\",\"definitionEn\":\"a person who uses a product or service\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: U-ser — Hay đi với: internet users · smartphone users\"},{\"id\":\"data|n\",\"term\":\"data\",\"reading\":\"/ˈdeɪ.tə/\",\"meaning\":\"dữ liệu\",\"definitionEn\":\"facts and numbers, especially stored on computers\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Hay đi với: collect data · personal data\",\"example\":{\"text\":\"Artificial intelligence is technology that can learn from data.\",\"vi\":\"Trí tuệ nhân tạo là công nghệ có thể học từ dữ liệu.\"}},{\"id\":\"access|v\",\"term\":\"access\",\"reading\":\"/ˈæk.ses/\",\"meaning\":\"truy cập; tiếp cận\",\"definitionEn\":\"to be able to enter or use something\",\"lesson\":25,\"pos\":\"v\",\"hint\":\"Trọng âm: AC-cess — Hay đi với: access the internet · access information\",\"example\":{\"text\":\"You can access the internet almost everywhere in Vietnam.\",\"vi\":\"Ở Việt Nam bạn có thể truy cập internet gần như ở mọi nơi.\"}},{\"id\":\"addicted-to|colloc\",\"term\":\"addicted to\",\"reading\":\"/əˈdɪk.tɪd tuː/\",\"meaning\":\"nghiện (cái gì)\",\"definitionEn\":\"unable to stop doing or using something\",\"lesson\":25,\"pos\":\"colloc\",\"hint\":\"Hay đi với: be addicted to social media · addicted to games\"},{\"id\":\"privacy|n\",\"term\":\"privacy\",\"reading\":\"/ˈprɪv.ə.si/\",\"meaning\":\"quyền riêng tư; sự riêng tư\",\"definitionEn\":\"the right to keep personal information secret\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: PRI-va-cy — Hay đi với: protect your privacy · online privacy\",\"example\":{\"text\":\"Users should protect their privacy online.\",\"vi\":\"Người dùng nên bảo vệ quyền riêng tư của mình trên mạng.\"}},{\"id\":\"fake-news|phr-n\",\"term\":\"fake news\",\"reading\":\"/ˌfeɪk ˈnjuːz/\",\"meaning\":\"tin giả\",\"definitionEn\":\"false stories that look like real reports\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: spread fake news · fake news on social media\"}],\"lesson\":{\"number\":25,\"title\":\"Công nghệ · Reading: True / False / Not Given\"}}]\n"])</script><script>self.__next_f.push([1,"29:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=25\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-are
