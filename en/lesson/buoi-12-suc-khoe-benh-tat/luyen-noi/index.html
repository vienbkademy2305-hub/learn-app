":\"hand\",\"vi\":\"bàn tay\",\"extra\":\"/hænd/\"},{\"group\":\"word\",\"text\":\"finger\",\"vi\":\"ngón tay\",\"extra\":\"/ˈfɪŋ.ɡə/\"},{\"group\":\"word\",\"text\":\"back\",\"vi\":\"lưng\",\"extra\":\"/bæk/\"},{\"group\":\"word\",\"text\":\"leg\",\"vi\":\"chân (cả cẳng chân)\",\"extra\":\"/leɡ/\"},{\"group\":\"word\",\"text\":\"knee\",\"vi\":\"đầu gối\",\"extra\":\"/niː/\"},{\"group\":\"word\",\"text\":\"foot\",\"vi\":\"bàn chân\",\"extra\":\"/fʊt/\"},{\"group\":\"sentence\",\"text\":\"You have a fever. You should get some rest.\",\"vi\":\"Bạn bị sốt rồi. Bạn nên nghỉ ngơi.\"},{\"group\":\"sentence\",\"text\":\"You must take this medicine three times a day.\",\"vi\":\"Bạn phải uống thuốc này ba lần một ngày.\"},{\"group\":\"sentence\",\"text\":\"My mother has to work on Saturday, so she can't come.\",\"vi\":\"Mẹ tôi phải làm việc vào thứ Bảy nên không đến được.\"},{\"group\":\"sentence\",\"text\":\"You shouldn't drink cold water when you have a sore throat.\",\"vi\":\"Bạn không nên uống nước lạnh khi bị đau họng.\"},{\"group\":\"sentence\",\"text\":\"You don't have to make an appointment at this pharmacy.\",\"vi\":\"Bạn không cần đặt hẹn ở hiệu thuốc này.\"},{\"group\":\"sentence\",\"text\":\"I have a headache and a bad cough.\",\"vi\":\"Tôi bị đau đầu và ho nhiều.\"},{\"group\":\"sentence\",\"text\":\"Eating vegetables is good for your health.\",\"vi\":\"Ăn rau tốt cho sức khỏe.\"},{\"group\":\"sentence\",\"text\":\"My grandfather exercises every morning, so he is very healthy.\",\"vi\":\"Ông tôi tập thể dục mỗi sáng nên ông rất khỏe mạnh.\"},{\"group\":\"sentence\",\"text\":\"Take this medicine twice a day after meals.\",\"vi\":\"Uống thuốc này hai lần một ngày sau bữa ăn.\"},{\"group\":\"sentence\",\"text\":\"Don't stay up late. Get some rest.\",\"vi\":\"Đừng thức khuya. Nghỉ ngơi đi.\"},{\"group\":\"sentence\",\"text\":\"I have a pain in my back and my shoulders.\",\"vi\":\"Tôi bị đau lưng và đau vai.\"},{\"group\":\"sentence\",\"text\":\"You should brush your teeth twice a day.\",\"vi\":\"Bạn nên đánh răng hai lần một ngày.\"},{\"group\":\"dialogue\",\"text\":\"Good morning. What's the problem?\",\"vi\":\"Chào anh. Anh bị làm sao?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"I have a headache and a sore throat. I also have a fever.\",\"vi\":\"Tôi bị đau đầu và đau họng. Tôi còn bị sốt nữa.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"I think you have the flu. You must take this medicine twice a day.\",\"vi\":\"Tôi nghĩ anh bị cúm. Anh phải uống thuốc này hai lần một ngày.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Do I have to stay at home?\",\"vi\":\"Tôi có phải ở nhà không?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Yes. You should get some rest for three days, and you shouldn't go to work.\",\"vi\":\"Có. Anh nên nghỉ ngơi ba ngày, và không nên đi làm.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Can I drink coffee?\",\"vi\":\"Tôi uống cà phê được không?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"You should drink warm water, not coffee.\",\"vi\":\"Anh nên uống nước ấm, đừng uống cà phê.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Do I have to make another appointment?\",\"vi\":\"Tôi có phải đặt lịch hẹn nữa không?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"No, you don't have to. Just come back if you feel worse.\",\"vi\":\"Không cần đâu. Nếu thấy tệ hơn thì quay lại.\",\"extra\":\"A\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Good morning. What's the problem?\",\"vi\":\"Chào anh. Anh bị làm sao?\"},{\"speaker\":\"B\",\"text\":\"I have a headache and a sore throat. I also have a fever.\",\"vi\":\"Tôi bị đau đầu và đau họng. Tôi còn bị sốt nữa.\"},{\"speaker\":\"A\",\"text\":\"I think you have the flu. You must take this medicine twice a day.\",\"vi\":\"Tôi nghĩ anh bị cúm. Anh phải uống thuốc này hai lần một ngày.\"},{\"speaker\":\"B\",\"text\":\"Do I have to stay at home?\",\"vi\":\"Tôi có phải ở nhà không?\"},{\"speaker\":\"A\",\"text\":\"Yes. You should get some rest for three days, and you shouldn't go to work.\",\"vi\":\"Có. Anh nên nghỉ ngơi ba ngày, và không nên đi làm.\"},{\"speaker\":\"B\",\"text\":\"Can I drink coffee?\",\"vi\":\"Tôi uống cà phê được không?\"},{\"speaker\":\"A\",\"text\":\"You should drink warm water, not coffee.\",\"vi\":\"Anh nên uống nước ấm, đừng uống cà phê.\"},{\"speaker\":\"B\",\"text\":\"Do I have to make another appointment?\",\"vi\":\"Tôi có phải đặt lịch hẹn nữa không?\"},{\"speaker\":\"A\",\"text\":\"No, you don't have to. Just come back if you feel worse.\",\"vi\":\"Không cần đâu. Nếu thấy tệ hơn thì quay lại.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-12-suc-khoe-benh-tat/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-12-suc-khoe-benh-tat/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n1b:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Luyện nói · Buổi 12 · Học tiếng Anh\"}],[\"
