ing\":\"/ˈhel.mət/\",\"meaning\":\"mũ bảo hiểm\",\"definitionEn\":\"a hard hat that protects your head\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: wear a helmet\",\"example\":{\"text\":\"Please wear a helmet on your motorbike.\",\"vi\":\"Hãy đội mũ bảo hiểm khi đi xe máy.\"}},{\"id\":\"on-foot|idiom\",\"term\":\"on foot\",\"reading\":\"/ɒn ˈfʊt/\",\"meaning\":\"đi bộ\",\"definitionEn\":\"by walking\",\"lesson\":10,\"pos\":\"idiom\"},{\"id\":\"commute|v\",\"term\":\"commute\",\"reading\":\"/kəˈmjuːt/\",\"meaning\":\"đi lại hằng ngày (giữa nhà và nơi làm)\",\"definitionEn\":\"to travel regularly between home and work\",\"lesson\":10,\"pos\":\"v\",\"example\":{\"text\":\"I commute to work every day. It takes forty minutes.\",\"vi\":\"Ngày nào tôi cũng đi làm, mất bốn mươi phút.\"}},{\"id\":\"north|n\",\"term\":\"north\",\"reading\":\"/nɔːθ/\",\"meaning\":\"phía bắc; hướng bắc\",\"definitionEn\":\"the direction towards the top of a map\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: in the north of Vietnam\",\"example\":{\"text\":\"The tennis courts are in the north of the park.\",\"vi\":\"Các sân tennis nằm ở phía bắc công viên.\"}},{\"id\":\"south|n\",\"term\":\"south\",\"reading\":\"/saʊθ/\",\"meaning\":\"phía nam; hướng nam\",\"definitionEn\":\"the direction towards the bottom of a map\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"Many birds fly south in autumn.\",\"vi\":\"Nhiều loài chim bay về phương nam vào mùa thu.\"}},{\"id\":\"east|n\",\"term\":\"east\",\"reading\":\"/iːst/\",\"meaning\":\"phía đông; hướng đông\",\"definitionEn\":\"the direction where the sun rises\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"The sun rises in the east and sets in the west.\",\"vi\":\"Mặt trời mọc ở đằng đông và lặn ở đằng tây.\"}},{\"id\":\"west|n\",\"term\":\"west\",\"reading\":\"/west/\",\"meaning\":\"phía tây; hướng tây\",\"definitionEn\":\"the direction where the sun sets\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"The sun rises in omething\",\"lesson\":10,\"pos\":\"prep\",\"hint\":\"Hay đi với: go across the bridge · across the road\",\"example\":{\"text\":\"We walk along the river and go across the bridge.\",\"vi\":\"Chúng tôi đi bộ dọc bờ sông rồi băng qua cầu.\"}},{\"id\":\"through|prep\",\"term\":\"through\",\"reading\":\"/θruː/\",\"meaning\":\"xuyên qua; đi qua (bên trong)\",\"definitionEn\":\"into one side and out of the other side\",\"lesson\":10,\"pos\":\"prep\",\"hint\":\"ough đọc “ú”: thru. — Hay đi với: through the park · through the gate\",\"example\":{\"text\":\"The bus goes through the city centre.\",\"vi\":\"Xe buýt chạy xuyên qua trung tâm thành phố.\"}},{\"id\":\"catch|v\",\"term\":\"catch\",\"reading\":\"/kætʃ/\",\"meaning\":\"bắt (xe); đón (xe)\",\"definitionEn\":\"to get on a bus or train in time\",\"lesson\":10,\"pos\":\"v\",\"hint\":\"Hay đi với: catch the bus · catch a train\",\"example\":{\"text\":\"Many people catch a cold in winter.\",\"vi\":\"Nhiều người bị cảm lạnh vào mùa đông.\"}},{\"id\":\"pick-up|phr-v\",\"term\":\"pick up\",\"reading\":\"/ˌpɪk ˈʌp/\",\"meaning\":\"đón (ai đó)\",\"definitionEn\":\"to collect someone in a car\",\"lesson\":10,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: pick somebody up from school\"},{\"id\":\"weather|n\",\"term\":\"weather\",\"reading\":\"/ˈweð.ə/\",\"meaning\":\"thời tiết\",\"definitionEn\":\"conditions such as sun, rain and wind\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Thời tiết: có chữ a và e, khác với whether (liệu rằng).\",\"example\":{\"text\":\"It depends on the weather.\",\"vi\":\"Còn tùy vào thời tiết.\"}},{\"id\":\"season|n\",\"term\":\"season\",\"reading\":\"/ˈsiː.zən/\",\"meaning\":\"mùa\",\"definitionEn\":\"one of the four parts of the year, e.g. summer\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Hay đi với: rainy season · dry season\",\"example\":{\"text\":\"Autumn is my favourite season in Hanoi.\",\"vi\":\"Mùa thu là mùa tôi thích nhất ở Hà Nội.\"}},{\"id\":\"sunny|adj\",\"term\":\"sunny\",\"reading\":\"/ˈsʌn.i/\",\"meaning\":\"nắng\",\"definitionEn\":\"with a lot of bright light from the sun\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"I think it will be sunny tomorrow.\",\"vi\":\"Tôi nghĩ mai trời sẽ nắng.\"}},{\"id\":\"cloudy|adj\",\"term\":\"cloudy\",\"reading\":\"/ˈklaʊ.di/\",\"meaning\":\"nhiều mây; âm u\",\"definitionEn\":\"with a lot of grey or white clouds in the sky\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's cloudy and windy this afternoon.\",\"vi\":\"Chiều nay trời nhiều mây và gió.\"}},{\"id\":\"rainy|adj\",\"term\":\"rainy\",\"reading\":\"/ˈreɪ.ni/\",\"meaning\":\"có mưa; mưa nhiều\",\"definitionEn\":\"with a lot of water falling from the sky\",\"lesson\":11,\"pos\":\"adj\",\"hint\":\"Hay đi với: rainy season · a rainy day\",\"example\":{\"text\":\"Farmers are worried about the rainy season.\",\"vi\":\"Nông dân lo lắng về mùa mưa.\"}},{\"id\":\"windy|adj\",\"term\":\"windy\",\"reading\":\"/ˈwɪn.di/\",\"meaning\":\"nhiều gió; lộng gió\",\"definitionEn\":\"with a lot of moving air\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's cloudy and windy this afternoon.\",\"vi\":\"Chiều nay trời nhiều mây và gió.\"}},{\"id\":\"humid|adj\",\"term\":\"humid\",\"reading\":\"/ˈhjuː.mɪd/\",\"meaning\":\"ẩm; oi ẩm\",\"definitionEn\":\"warm and wet, so the air feels heavy\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's sunny today, but it's very humid.\",\"vi\":\"Hôm nay trời nắng nhưng rất oi ẩm.\"}},{\"id\":\"freezing|adj\",\"term\":\"freezing\",\"reading\":\"/ˈfriː.zɪŋ/\",\"meaning\":\"lạnh cóng; rét buốt\",\"definitionEn\":\"extremely cold\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's freezing outside, so wear a warm coat.\",\"vi\":\"Ngoài trời lạnh cóng, mặc áo khoác ấm vào.\"}},{\"id\":\"temperature|n\",\"term\":\"temperature\",\"reading\":\"/ˈtem.prə.tʃə/\",\"meaning\":\"nhiệt độ\",\"definitionEn\":\"how hot or cold something is\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"TEM-prờ-chờ: chỉ 3 âm tiết. — Trọng âm: T "definitionEn\":\"a small pet animal that says 'meow'\",\"lesson\":11,\"pos\":\"n\",\"example\":{\"text\":\"My cat sleeps under the bed.\",\"vi\":\"Con mèo của tôi ngủ dưới gầm giường.\"}},{\"id\":\"bird|n\",\"term\":\"bird\",\"reading\":\"/bɜːd/\",\"meaning\":\"con chim\",\"definitionEn\":\"an animal with feathers and wings\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"cow|n\",\"term\":\"cow\",\"reading\":\"/kaʊ/\",\"meaning\":\"con bò (cái)\",\"definitionEn\":\"a large farm animal that gives milk\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"horse|n\",\"term\":\"horse\",\"reading\":\"/hɔːs/\",\"meaning\":\"con ngựa\",\"definitionEn\":\"a large animal that people ride\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"bear|n\",\"term\":\"bear\",\"reading\":\"/beə/\",\"meaning\":\"con gấu\",\"definitionEn\":\"a large, heavy wild animal with thick fur\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"spider|n\",\"term\":\"spider\",\"reading\":\"/ˈspaɪ.də/\",\"meaning\":\"con nhện\",\"definitionEn\":\"a small creature with eight legs that makes webs\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"dolphin|n\",\"term\":\"dolphin\",\"reading\":\"/ˈdɒl.fɪn/\",\"meaning\":\"cá heo\",\"definitionEn\":\"a clever sea animal that looks like a large fish\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"rabbit|n\",\"term\":\"rabbit\",\"reading\":\"/ˈræb.ɪt/\",\"meaning\":\"con thỏ\",\"definitionEn\":\"a small animal with long ears\",\"lesson\":11,\"pos\":\"n\",\"example\":{\"text\":\"My son has a white rabbit.\",\"vi\":\"Con trai tôi nuôi một con thỏ trắng.\"}},{\"id\":\"health|n\",\"term\":\"health\",\"reading\":\"/helθ/\",\"meaning\":\"sức khỏe\",\"definitionEn\":\"the condition of your body and mind\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: good health · mental health\",\"example\":{\"text\":\"Eating vegetables is good for your health.\",\"vi\":\"Ăn rau tốt cho sức khỏe.\"}},{\"id\":\"healthy|adj\",\"term\":\"healthy\",\"reading\":\"/ˈhel.θi/\",\"meaning\":\"khỏe mạnh; tốt cho sức khỏe\",\"definitionEn\":\"well and strong; good for your body\",\"lesson\":12,\"pos\":\"adj\",\"hint\":\"HEL-thi: gốc “health”. — Hay đi với: healthy food · a healthy lifestyle\",\"example\":{\"text\":\"A healthy diet has a lot of fruit and vegetables.\",\"vi\":\"Một chế độ ăn lành mạnh có nhiều rau quả.\"}},{\"id\":\"ill|adj\",\"term\":\"ill\",\"reading\":\"/ɪl/\",\"meaning\":\"ốm; bệnh\",\"definitionEn\":\"not well; sick\",\"lesson\":12,\"pos\":\"adj\",\"example\":{\"text\":\"She is ill, so she doesn't go to work today.\",\"vi\":\"Cô ấy bị ốm nên hôm nay không đi làm.\"}},{\"id\":\"headache|n\",\"term\":\"headache\",\"reading\":\"/ˈhed.eɪk/\",\"meaning\":\"đau đầu\",\"definitionEn\":\"a pain in your head\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"HED-eik: head + ache. — Trọng âm: HEAD-ache\",\"example\":{\"text\":\"I have a headache and a bad cough.\",\"vi\":\"Tôi bị đau đầu và ho nhiều.\"}},{\"id\":\"stomachache|n\",\"term\":\"stomachache\",\"reading\":\"/ˈstʌm.ək.eɪk/\",\"meaning\":\"đau bụng\",\"definitionEn\":\"a pain in your stomach\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"I have a stomachache after lunch.\",\"vi\":\"Tôi bị đau bụng sau bữa trưa.\"}},{\"id\":\"sore-throat|phr-n\",\"term\":\"sore throat\",\"reading\":\"/ˌsɔː ˈθrəʊt/\",\"meaning\":\"đau họng\",\"definitionEn\":\"pain at the back of your mouth when you swallow\",\"lesson\":12,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have a sore throat\"},{\"id\":\"fever|n\",\"term\":\"fever\",\"reading\":\"/ˈfiː.və/\",\"meaning\":\"sốt\",\"definitionEn\":\"a body temperature that is higher than normal\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a fever · a high fever\",\"example\":{\"text\":\"You have a fever. You should get some rest.\",\"vi\":\"Bạn bị sốt rồi. Bạn nên nghỉ ngơi.\"}},{\"id\":\"cough|n\",\"term\":\"cough\",\"reading\":\"/kɒf/\",\"meaning\":\"ho; cơn ho\",\"definitionEn\":\"a sudden noisy push of air from your throat\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a cough · a bad cough\",\"example\":{\"text\":\"I have a headache and a bad cough.\",\"vi\":\"Tôi bị đau đầu và ho nhiều.\"}},{\"id\":\"cold|n\",\"term\":\"cold\",\"reading\":\"/kəʊld/\",\"meaning\":\"cảm lạnh\",\"definitionEn\":\"a common illness that gives you a runny nose\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a cold · catch a cold\",\"example\":{\"text\":\"Many people catch a cold in winter.\",\"vi\":\"Nhiều người bị cảm lạnh vào mùa đông.\"}},{\"id\":\"flu|n\",\"term\":\"flu\",\"reading\":\"/fluː/\",\"meaning\":\"cúm\",\"definitionEn\":\"an illness like a bad cold, with fever and aches\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have the flu\",\"example\":{\"text\":\"He has the flu and must stay at home.\",\"vi\":\"Anh ấy bị cúm và phải ở nhà.\"}},{\"id\":\"medicine|n\",\"term\":\"medicine\",\"reading\":\"/ˈmed.ɪ.sən/\",\"meaning\":\"thuốc\",\"definitionEn\":\"something you take to treat an illness\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"MED-sin: chỉ 2 âm tiết. — Trọng âm: ME-di-cine — Hay đi với: take medicine\",\"example\":{\"text\":\"Take this medicine twice a day after meals.\",\"vi\":\"Uống thuốc này hai lần một ngày sau bữa ăn.\"}},{\"id\":\"pharmacy|n\",\"term\":\"pharmacy\",\"reading\":\"/ˈfɑː.mə.si/\",\"meaning\":\"hiệu thuốc\",\"definitionEn\":\"a shop where you can buy medicine\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"FAR-mờ-si: ph đọc f. — Trọng âm: PHAR-ma-cy\",\"example\":{\"text\":\"You have a fever. Let's go to the pharmacy.\",\"vi\":\"Bạn bị sốt rồi. Mình ra hiệu thuốc đi.\"}},{\"id\":\"appointment|n\",\"term\":\"appointment\",\"reading\":\"/əˈpɔɪnt.mənt/\",\"meaning\":\"cuộc hẹn (bác sĩ, công việc)\",\"definitionEn\":\"an arranged time to meet someone, e.g. a doctor\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Trọng âm: ap-POINT-ment — Hay đi với: make an appointment · a doctor's appointment\",\"example\":{\"text\":\"You don't have to make an appointment at this pharmacy.\",\"vi\":\"Bạn không cần đặt hẹn ở hiệu thuốc này.\"}},{\"id\":\"exercise|v\",\"term\":\"exercise\",\"reading\":\"/ˈek.sə.saɪz/\",\"meaning\":\"tập thể dục\",\"definitionEn\":\"to move your body to stay fit\",\"lesson\":12,\"pos\":\"v\",\"hint\":\"Trọng âm: EX-er-cise — Hay đi với: exercise regularly\",\"example\":{\"text\":\"This exercise is confusing. I'm confused.\",\"vi\":\"Bài tập này khó hiểu quá. Tôi rối rồi.\"}},{\"id\":\"diet|n\",\"term\":\"diet\",\"reading\":\"/ˈdaɪ.ət/\",\"meaning\":\"chế độ ăn\",\"definitionEn\":\"the kind of food you usually eat\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: a healthy diet · go on a diet\",\"example\":{\"text\":\"A healthy diet has a lot of fruit and vegetables.\",\"vi\":\"Một chế độ ăn lành mạnh có nhiều rau quả.\"}},{\"id\":\"pain|n\",\"term\":\"pain\",\"reading\":\"/peɪn/\",\"meaning\":\"cơn đau; sự đau\",\"definitionEn\":\"the feeling you have when part of your body hurts\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: back pain · in pain\",\"example\":{\"text\":\"My father often has back pain.\",\"vi\":\"Bố tôi hay bị đau lưng.\"}},{\"id\":\"rest|n\",\"term\":\"rest\",\"reading\":\"/rest/\",\"meaning\":\"sự nghỉ ngơi\",\"definitionEn\":\"a time when you relax or sleep\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: get some rest · have a rest\",\"example\":{\"text\":\"Don't stay up late. Get some rest.\",\"vi\":\"Đừng thức khuya. Nghỉ ngơi đi.\"}},{\"id\":\"should|v\",\"term\":\"should\",\"reading\":\"/ʃʊd/\",\"meaning\":\"nên\",\"definitionEn\":\"used to give advice\",\"lesson\":12,\"pos\":\"v\",\"example\":{\"text\":\"You should brush your teeth twice a day.\",\"vi\":\"Bạn nên đánh răng hai lần một ngày.\"}},{\"id\":\"have-to|v\",\"term\":\"have to\",\"reading\":\"/ˈhæv tə/\",\"meaning\":\"phải (do hoàn cảnh, quy định)\",\"definitionEn\":\"to be forced to do something by rules or situation\",\"lesson\":12,\"pos\":\"v\"},{\"id\":\"head|n\",\"term\":\"head\",\"reading\":\"/hed/\",\"meaning\":\"cái đầu\",\"definitionEn\":\"the top part of your body, above your neck\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My head hurts and my nose is red.\",\"vi\":\"Tôi nhức đầu và mũi thì đỏ.\"}},{\"id\":\"face|n\",\"term\":\"face\",\"reading\":\"/feɪs/\",\"meaning\":\"khuôn mặt\",\"definitionEn\":\"the front of your head\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"She has a round face and big brown eyes.\",\"vi\":\"Cô ấy có khuôn mặt tròn và đôi mắt nâu to.\"}},{\"id\":\"eye|n\",\"term\":\"eye\",\"reading\":\"/aɪ/\",\"meaning\":\"mắt\",\"definitionEn\":\"the part of your body you see with\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"ear|n\",\"term\":\"ear\",\"reading\":\"/ɪə/\",\"meaning\":\"tai\",\"definitionEn\":\"the part of your body you hear with\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"nose|n\",\"term\":\"nose\",\"reading\":\"/nəʊz/\",\"meaning\":\"mũi\",\"definitionEn\":\"the part of your face you smell with\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My head hurts and my nose is red.\",\"vi\":\"Tôi nhức đầu và mũi thì đỏ.\"}},{\"id\":\"mouth|n\",\"term\":\"mouth\",\"reading\":\"/maʊθ/\",\"meaning\":\"miệng\",\"definitionEn\":\"the part of your face you eat and speak with\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"Open your mouth, please. I want to look at your throat.\",\"vi\":\"Hãy há miệng ra. Tôi muốn khám họng của bạn.\"}},{\"id\":\"tooth|n\",\"term\":\"tooth\",\"reading\":\"/tuːθ/\",\"meaning\":\"răng\",\"definitionEn\":\"one of the hard white things in your mouth\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"neck|n\",\"term\":\"neck\",\"reading\":\"/nek/\",\"meaning\":\"cổ\",\"definitionEn\":\"the part between your head and shoulders\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My neck hurts after a long day on the computer.\",\"vi\":\"Cổ tôi đau sau một ngày dài ngồi máy tính.\"}},{\"id\":\"shoulder|n\",\"term\":\"shoulder\",\"reading\":\"/ˈʃəʊl.də/\",\"meaning\":\"vai\",\"definitionEn\":\"the part of your body where your arm joins it\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"arm|n\",\"term\":\"arm\",\"reading\":\"/ɑːm/\",\"meaning\":\"cánh tay\",\"definitionEn\":\"the long part of your body from shoulder to hand\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: a broken arm\",\"example\":{\"text\":\"My brother fell off his bike and broke his arm.\",\"vi\":\"Em trai tôi ngã xe đạp và bị gãy tay.\"}},{\"id\":\"hand|n\",\"term\":\"hand\",\"reading\":\"/hænd/\",\"meaning\":\"bàn tay\",\"definitionEn\":\"the part at the end of your arm with five fingers\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: wash your hands\",\"example\":{\"text\":\"I splashed out on a new laptop, and now I'm buying second-hand clothes to save money.\",\"vi\":\"Tôi đã chi mạnh tay mua laptop mới, và giờ tôi mua quần áo cũ để tiết kiệm.\"}},{\"id\":\"finger|n\",\"term\":\"finger\",\"reading\":\"/ˈfɪŋ.ɡə/\",\"meaning\":\"ngón tay\",\"definitionEn\":\"one of the five long parts of your hand\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"back|n\",\"term\":\"back\",\"reading\":\"/bæk/\",\"meaning\":\"lưng\",\"definitionEn\":\"the part of your body behind you, from neck to bottom\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: back pain\",\"example\":{\"text\":\"My father often has back pain.\",\"vi\":\"Bố tôi hay bị đau lưng.\"}},{\"id\":\"leg|n\",\"term\":\"leg\",\"reading\":\"/leɡ/\",\"meaning\":\"chân (cả cẳng chân)\",\"definitionEn\":\"the part of your body you stand and walk on\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"knee|n\",\"term\":\"knee\",\"reading\":\"/niː/\",\"meaning\":\"đầu gối\",\"definitionEn\":\"the joint in the middle of your leg\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"He has had a knee injury since last month.\",\"vi\":\"Anh ấy bị chấn thương đầu gối từ tháng trước.\"}},{\"id\":\"foot|n\",\"term\":\"foot\",\"reading\":\"/fʊt/\",\"meaning\":\"bàn chân\",\"definitionEn\":\"the part at the end of your leg that you stand on\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My sister goes to school on foot.\",\"vi\":\"Em gái tôi đi bộ đến trườ
