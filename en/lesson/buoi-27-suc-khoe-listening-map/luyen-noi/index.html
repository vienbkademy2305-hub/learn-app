 the south of the sports centre.\",\"vi\":\"Bãi đỗ xe nằm về phía nam của trung tâm thể thao.\"},{\"group\":\"sentence\",\"text\":\"Please sign in at reception before you use the facilities.\",\"vi\":\"Vui lòng đăng ký ở quầy lễ tân trước khi dùng các tiện ích.\"},{\"group\":\"sentence\",\"text\":\"I work out at the gym three times a week.\",\"vi\":\"Tôi tập gym ba lần một tuần.\"},{\"group\":\"sentence\",\"text\":\"Always stretch before you run, or you may pull a muscle.\",\"vi\":\"Luôn giãn cơ trước khi chạy, nếu không bạn có thể bị căng cơ.\"},{\"group\":\"sentence\",\"text\":\"He has had a knee injury since last month.\",\"vi\":\"Anh ấy bị chấn thương đầu gối từ tháng trước.\"},{\"group\":\"sentence\",\"text\":\"The first aid room is just past the main entrance.\",\"vi\":\"Phòng sơ cứu ở ngay sau lối vào chính.\"},{\"group\":\"sentence\",\"text\":\"Doctors say adults need at least 150 minutes of physical activity a week.\",\"vi\":\"Bác sĩ nói người lớn cần ít nhất 150 phút vận động mỗi tuần.\"},{\"group\":\"dialogue\",\"text\":\"Excuse me, I'm new here. Where are the changing rooms?\",\"vi\":\"Xin lỗi, tôi mới đến. Phòng thay đồ ở đâu ạ?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Go past reception, and they're at the end of the corridor, on the left.\",\"vi\":\"Chị đi qua quầy lễ tân, phòng thay đồ ở cuối hành lang, bên trái.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Thanks. And is the swimming pool near there?\",\"vi\":\"Cảm ơn. Bể bơi có gần đó không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Yes, it's directly opposite the changing rooms.\",\"vi\":\"Có, nó ở ngay đối diện phòng thay đồ.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Great. I'd also like to use the gym. Is it on this floor?\",\"vi\":\"Tuyệt. Tôi cũng muốn dùng phòng gym. Nó ở tầng này à?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"No, it's upstairs, in the north corner of the building.\",\"vi\":\"Không, nó ở trên lầu, góc phía bắc của tòa nhà.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"OK. And if someone gets an injury?\",\"vi\":\"Được. Còn nếu ai đó bị chấn thương thì sao?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"The first aid room is just past the main entrance. And please stretch before you work out!\",\"vi\":\"Phòng sơ cứu ở ngay sau lối vào chính. Và nhớ giãn cơ trước khi tập nhé!\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Excuse me, I'm new here. Where are the changing rooms?\",\"vi\":\"Xin lỗi, tôi mới đến. Phòng thay đồ ở đâu ạ?\"},{\"speaker\":\"B\",\"text\":\"Go past reception, and they're at the end of the corridor, on the left.\",\"vi\":\"Chị đi qua quầy lễ tân, phòng thay đồ ở cuối hành lang, bên trái.\"},{\"speaker\":\"A\",\"text\":\"Thanks. And is the swimming pool near there?\",\"vi\":\"Cảm ơn. Bể bơi có gần đó không?\"},{\"speaker\":\"B\",\"text\":\"Yes, it's directly opposite the changing rooms.\",\"vi\":\"Có, nó ở ngay đối diện phòng thay đồ.\"},{\"speaker\":\"A\",\"text\":\"Great. I'd also like to use the gym. Is it on this floor?\",\"vi\":\"Tuyệt. Tôi cũng muốn dùng phòng gym. Nó ở tầng này à?\"},{\"speaker\":\"B\",\"text\":\"No, it's upstairs, in the north corner of the building.\",\"vi\":\"Không, nó ở trên lầu, góc phía bắc của tòa nhà.\"},{\"speaker\":\"A\",\"text\":\"OK. And if someone gets an injury?\",\"vi\":\"Được. Còn nếu ai đó bị chấn thương thì sao?\"},{\"speaker\":\"B\",\"text\":\"The first aid room is just past the main entrance. And please stretch before you work out!\",\"vi\":\"Phòng sơ cứu ở ngay sau lối vào chính. Và nhớ giãn cơ trước khi tập nhé!\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"
