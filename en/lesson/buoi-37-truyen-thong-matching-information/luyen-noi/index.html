alse, the story spread very quickly online.\",\"vi\":\"Mặc dù tiêu đề là sai sự thật, câu chuyện vẫn lan truyền rất nhanh trên mạng.\"},{\"group\":\"sentence\",\"text\":\"Despite the warnings, many people shared the video without checking it.\",\"vi\":\"Bất chấp những lời cảnh báo, nhiều người vẫn chia sẻ video mà không kiểm tra.\"},{\"group\":\"sentence\",\"text\":\"In spite of being a journalist, he didn't check his sources.\",\"vi\":\"Mặc dù là nhà báo, anh ta không kiểm tra nguồn tin của mình.\"},{\"group\":\"sentence\",\"text\":\"Even though the mainstream media corrected the story, the fake version was more popular.\",\"vi\":\"Mặc dù truyền thông chính thống đã đính chính câu chuyện, bản tin giả vẫn phổ biến hơn.\"},{\"group\":\"sentence\",\"text\":\"Misinformation often spreads faster than the truth on social media.\",\"vi\":\"Thông tin sai lệch thường lan nhanh hơn sự thật trên mạng xã hội.\"},{\"group\":\"sentence\",\"text\":\"Schools should teach media literacy so that students can recognise fake news.\",\"vi\":\"Trường học nên dạy năng lực truyền thông để học sinh có thể nhận ra tin giả.\"},{\"group\":\"sentence\",\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"},{\"group\":\"sentence\",\"text\":\"The newspaper published the article on its website last night.\",\"vi\":\"Tờ báo đã đăng bài viết trên trang web của mình tối qua.\"},{\"group\":\"sentence\",\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"},{\"group\":\"sentence\",\"text\":\"Many young people get their news from influencers rather than newspapers.\",\"vi\":\"Nhiều người trẻ tiếp nhận tin tức từ người có ảnh hưởng trên mạng thay vì báo chí.\"},{\"group\":\"sentence\",\"text\":\"Social media platforms should do more to fact-check posts.\",\"vi\":\"Các nền tảng mạng xã hội nên làm nhiều hơn để kiểm chứng bài đăng.\"},{\"group\":\"dialogue\",\"text\":\"Look at this headline! It says drinking coffee makes you live ten years longer.\",\"vi\":\"Xem tiêu đề này! Nó bảo uống cà phê giúp sống lâu thêm mười năm.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Hmm. Where does it come from? Is it a reliable source?\",\"vi\":\"Hừm. Tin này từ đâu? Nguồn có đáng tin không?\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"An influencer posted it. It's gone viral — two million views.\",\"vi\":\"Một người có ảnh hưởng đăng. Nó đang lan truyền mạnh — hai triệu lượt xem.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Although lots of people have watched it, that doesn't mean it's true.\",\"vi\":\"Dù nhiều người xem, điều đó không có nghĩa là nó đúng.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Fair enough. How can I check?\",\"vi\":\"Cũng đúng. Làm sao để kiểm tra?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Search for the study. If a journalist from a real newspaper has published it, it's probably OK.\",\"vi\":\"Tìm nghiên cứu gốc. Nếu một nhà báo của tờ báo thật đã đăng, chắc là ổn.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Nothing. Only small websites mention it.\",\"vi\":\"Không có gì. Chỉ mấy trang nhỏ nhắc đến.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Then don't share it. Despite the big numbers, it's probably misinformation.\",\"vi\":\"Thế thì đừng chia sẻ. Dù số lượt xem lớn, nhiều khả năng đó là tin sai lệch.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Look at this headline! It says drinking coffee makes you live ten years longer.\",\"vi\":\"Xem tiêu đề này! Nó bảo uống cà phê giúp sống lâu thêm mười năm.\"},{\"speaker\":\"B\",\"text\":\"Hmm. Where does it come from? Is it a reliable source?\",\"vi\":\"Hừm. Tin này từ đâu? Nguồn có đáng tin không?\"},{\"speaker\":\"A\",\"text\":\"An influencer posted it. It's gone viral — two million views.\",\"vi\":\"Một người có ảnh hưởng đăng. Nó đang lan truyền mạnh — hai triệu lượt xem.\"},{\"speaker\":\"B\",\"text\":\"Although lots of people have watched it, that doesn't mean it's true.\",\"vi\":\"Dù nhiều người xem, điều đó không có nghĩa là nó đúng.\"},{\"speaker\":\"A\",\"text\":\"Fair enough. How can I check?\",\"vi\":\"Cũng đúng. Làm sao để kiểm tra?\"},{\"speaker\":\"B\",\"text\":\"Search for the study. If a journalist from a real newspaper has published it, it's probably OK.\",\"vi\":\"Tìm nghiên cứu gốc. Nếu một nhà báo của tờ báo thật đã đăng, chắc là ổn.\"},{\"speaker\":\"A\",\"text\":\"Nothing. Only small websites mention it.\",\"vi\":\"Không có gì. Chỉ mấy trang nhỏ nhắc đến.\"},{\"speaker\":\"B\",\"text\":\"Then don't share it. Despite the big numbers, it's probably misinformation.\",\"vi\":\"Thế thì đừng chia sẻ. Dù số lượt xem lớn, nhiều khả năng đó là tin sai lệch.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-37-truyen-thong-matching-information/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-37-truyen-thong-matching-information/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"
