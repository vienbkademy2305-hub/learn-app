nhiều nước.\"},{\"group\":\"sentence\",\"text\":\"The introduction of stricter legislation led to a fall in pollution.\",\"vi\":\"Việc ban hành luật chặt chẽ hơn đã dẫn đến giảm ô nhiễm.\"},{\"group\":\"sentence\",\"text\":\"All companies are required to comply with the new regulations.\",\"vi\":\"Mọi công ty đều phải tuân thủ các quy định mới.\"},{\"group\":\"sentence\",\"text\":\"Collecting personal data without consent violates people's privacy.\",\"vi\":\"Thu thập dữ liệu cá nhân không có sự đồng ý là xâm phạm quyền riêng tư.\"},{\"group\":\"sentence\",\"text\":\"Doctors sometimes face a moral dilemma when a patient refuses treatment.\",\"vi\":\"Bác sĩ đôi khi đối mặt với tình thế khó xử về đạo đức khi bệnh nhân từ chối điều trị.\"},{\"group\":\"sentence\",\"text\":\"Politicians must be held accountable for their decisions.\",\"vi\":\"Các chính trị gia phải chịu trách nhiệm về quyết định của mình.\"},{\"group\":\"sentence\",\"text\":\"Discrimination against older workers is illegal in many countries.\",\"vi\":\"Phân biệt đối xử với người lao động lớn tuổi là bất hợp pháp ở nhiều nước.\"},{\"group\":\"sentence\",\"text\":\"The company used a legal loophole to avoid paying tax.\",\"vi\":\"Công ty đã lợi dụng kẽ hở pháp luật để trốn thuế.\"},{\"group\":\"sentence\",\"text\":\"The city imposed a ban on plastic bags last year.\",\"vi\":\"Thành phố đã áp lệnh cấm túi nhựa năm ngoái.\"},{\"group\":\"sentence\",\"text\":\"Most law-abiding citizens support harsher penalties for drink-driving.\",\"vi\":\"Phần lớn công dân tuân thủ pháp luật ủng hộ hình phạt nặng hơn cho lái xe khi say rượu.\"},{\"group\":\"sentence\",\"text\":\"Many people believe it is unethical to keep wild animals in small cages.\",\"vi\":\"Nhiều người cho rằng nhốt động vật hoang dã trong lồng nhỏ là trái đạo đức.\"},{\"group\":\"sentence\",\"text\":\"Protecting human rights is a legal obligation for every government.\",\"vi\":\"Bảo vệ nhân quyền là nghĩa vụ pháp lý của mọi chính phủ.\"},{\"group\":\"dialogue\",\"text\":\"Our city wants to install cameras on every street. Do you think it's a good idea?\",\"vi\":\"Thành phố muốn lắp camera trên mọi con phố. Bạn thấy ý đó hay không?\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"It's a dilemma. Law-abiding people have nothing to hide, but it still violates our privacy.\",\"vi\":\"Khó xử lắm. Người tuân thủ pháp luật chẳng có gì phải giấu, nhưng nó vẫn xâm phạm quyền riêng tư.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"Maybe the city should ask for residents' consent first.\",\"vi\":\"Có lẽ thành phố nên hỏi ý kiến đồng ý của cư dân trước.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Yes, and there should be strict regulations on how the data is used.\",\"vi\":\"Đúng, và cần có quy định chặt chẽ về cách dùng dữ liệu.\",\"extra\":\"B\"},{\"group\":\"dialogue\",\"text\":\"And whoever misuses it must be held accountable.\",\"vi\":\"Và ai lạm dụng thì phải chịu trách nhiệm.\",\"extra\":\"A\"},{\"group\":\"dialogue\",\"text\":\"Exactly. Otherwise, companies will just find a loophole.\",\"vi\":\"Chính xác. Nếu không, các công ty sẽ tìm ra kẽ hở ngay.\",\"extra\":\"B\"}],\"dialogue\":[{\"speaker\":\"A\",\"text\":\"Our city wants to install cameras on every street. Do you think it's a good idea?\",\"vi\":\"Thành phố muốn lắp camera trên mọi con phố. Bạn thấy ý đó hay không?\"},{\"speaker\":\"B\",\"text\":\"It's a dilemma. Law-abiding people have nothing to hide, but it still violates our privacy.\",\"vi\":\"Khó xử lắm. Người tuân thủ pháp luật chẳng có gì phải giấu, nhưng nó vẫn xâm phạm quyền riêng tư.\"},{\"speaker\":\"A\",\"text\":\"Maybe the city should ask for residents' consent first.\",\"vi\":\"Có lẽ thành phố nên hỏi ý kiến đồng ý của cư dân trước.\"},{\"speaker\":\"B\",\"text\":\"Yes, and there should be strict regulations on how the data is used.\",\"vi\":\"Đúng, và cần có quy định chặt chẽ về cách dùng dữ liệu.\"},{\"speaker\":\"A\",\"text\":\"And whoever misuses it must be held accountable.\",\"vi\":\"Và ai lạm dụng thì phải chịu trách nhiệm.\"},{\"speaker\":\"B\",\"text\":\"Exactly. Otherwise, companies will just find a loophole.\",\"vi\":\"Chính xác. Nếu không, các công ty sẽ tìm ra kẽ hở ngay.\"}]}],\"$L1a\"]}]\n1a:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-64-luat-phap-paraphrase/dialogue\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Hội thoại\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-64-luat-phap-paraphrase/exercises\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Bài tập\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n1b:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Luyện nói · Buổi 64 · Học tiếng Anh\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Học tiếng Anh cho người Việt theo lộ trình IELTS 6.5: từ vựng theo chủ đề có IPA, ngữ pháp, hội thoại, bài tập.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/learn-app/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",
