\":\"to be more than a certain amount\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: exceed 50% · exceed the figure for\"},{\"id\":\"overtake|v\",\"term\":\"overtake\",\"reading\":\"/ˌəʊ.vəˈteɪk/\",\"meaning\":\"vượt lên; vượt qua\",\"definitionEn\":\"to go past something that was ahead\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-TAKE — Hay đi với: overtake food as the largest expense\"},{\"id\":\"triple|v\",\"term\":\"triple\",\"reading\":\"/ˈtrɪp.əl/\",\"meaning\":\"tăng gấp ba\",\"definitionEn\":\"to become three times as large\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: almost triple · triple over the period\"},{\"id\":\"halve|v\",\"term\":\"halve\",\"reading\":\"/hɑːv/\",\"meaning\":\"giảm một nửa\",\"definitionEn\":\"to reduce by fifty per cent\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: be halved · almost halve\"},{\"id\":\"the-former|pron\",\"term\":\"the former\",\"reading\":\"/ðə ˈfɔː.mər/\",\"meaning\":\"cái/người thứ nhất (trong hai cái vừa nhắc)\",\"definitionEn\":\"the first of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the former …, whereas the latter …\"},{\"id\":\"the-latter|pron\",\"term\":\"the latter\",\"reading\":\"/ðə ˈlæt.ər/\",\"meaning\":\"cái/người thứ hai (trong hai cái vừa nhắc)\",\"definitionEn\":\"the second of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the latter rose to 30%\"},{\"id\":\"negligible|adj\",\"term\":\"negligible\",\"reading\":\"/ˈneɡ.lɪ.dʒə.bəl/\",\"meaning\":\"không đáng kể\",\"definitionEn\":\"so small it is not important\",\"lesson\":59,\"pos\":\"adj\",\"hint\":\"Trọng âm: NEG-li-gi-ble — Hay đi với: a negligible change · the difference was negligible\",\"example\":{\"text\":\"The change in spending on clothes was negligible.\",\"vi\":\"Thay đổi trong chi tiêu cho quần áo là không đáng kể.\"}},{\"id\":\"comparable|adj\",\"term\":\"comparable\",\"reading\":\"/ˈkɒm.pər.ə.bəl/\",\"meaning\":\"tương đương; có lier one\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a sequel to · make a sequel\",\"example\":{\"text\":\"The sequel might have done better at the box office if the critics had liked it.\",\"vi\":\"Phần tiếp theo có lẽ đã có doanh thu phòng vé tốt hơn nếu giới phê bình thích nó.\"}},{\"id\":\"soundtrack|n\",\"term\":\"soundtrack\",\"reading\":\"/ˈsaʊnd.træk/\",\"meaning\":\"nhạc phim\",\"definitionEn\":\"the music played in a film\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the film's soundtrack\",\"example\":{\"text\":\"The film received mixed reviews, but its soundtrack was a huge success.\",\"vi\":\"Bộ phim nhận đánh giá trái chiều, nhưng nhạc phim thì rất thành công.\"}},{\"id\":\"playwright|n\",\"term\":\"playwright\",\"reading\":\"/ˈpleɪ.raɪt/\",\"meaning\":\"nhà viết kịch\",\"definitionEn\":\"a person who writes plays\",\"lesson\":60,\"pos\":\"n\",\"example\":{\"text\":\"The playwright gave a short speech after the performance.\",\"vi\":\"Nhà viết kịch có bài phát biểu ngắn sau buổi diễn.\"}},{\"id\":\"sold-out|adj\",\"term\":\"sold-out\",\"reading\":\"/ˌsəʊld ˈaʊt/\",\"meaning\":\"bán hết vé\",\"definitionEn\":\"with no tickets left\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: a sold-out concert · the show was sold out\"},{\"id\":\"premiere|n\",\"term\":\"premiere\",\"reading\":\"/ˈprem.i.eər/\",\"meaning\":\"buổi công chiếu đầu tiên\",\"definitionEn\":\"the first public showing of a film or play\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the world premiere · attend the premiere\",\"example\":{\"text\":\"If we had booked earlier, we would have got tickets for the premiere.\",\"vi\":\"Nếu chúng tôi đặt sớm hơn thì đã có vé xem buổi công chiếu.\"}},{\"id\":\"blockbuster|n\",\"term\":\"blockbuster\",\"reading\":\"/ˈblɒkˌbʌs.tər/\",\"meaning\":\"phim bom tấn\",\"definitionEn\":\"a very successful film with a big budget\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a Hollywood blockbuster · a summer blockbuster\"},{\" ng)\",\"definitionEn\":\"an important event in a process or life\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: an important milestone · reach a milestone\",\"example\":{\"text\":\"Getting into university was a milestone, but moving abroad was the real turning point.\",\"vi\":\"Đỗ đại học là một cột mốc, nhưng ra nước ngoài mới là bước ngoặt thật sự.\"}},{\"id\":\"turning-point|phr-n\",\"term\":\"turning point\",\"reading\":\"/ˈtɜː.nɪŋ ˌpɔɪnt/\",\"meaning\":\"bước ngoặt\",\"definitionEn\":\"a moment when an important change happens\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a turning point in my life · mark a turning point\"},{\"id\":\"nostalgic|adj\",\"term\":\"nostalgic\",\"reading\":\"/nɒsˈtæl.dʒɪk/\",\"meaning\":\"hoài niệm; nhớ về quá khứ\",\"definitionEn\":\"thinking happily about the past\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Trọng âm: nos-TAL-gic — Hay đi với: feel nostalgic about · a nostalgic song\",\"example\":{\"text\":\"That old song always makes me feel nostalgic about my student days.\",\"vi\":\"Bài hát cũ đó luôn khiến tôi hoài niệm về thời sinh viên.\"}},{\"id\":\"rehearse|v\",\"term\":\"rehearse\",\"reading\":\"/rɪˈhɜːs/\",\"meaning\":\"tập dượt (trước khi biểu diễn)\",\"definitionEn\":\"to practise a performance before the real show\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Hay đi với: rehearse for a show · rehearse every evening\"},{\"id\":\"stage-fright|phr-n\",\"term\":\"stage fright\",\"reading\":\"/ˈsteɪdʒ ˌfraɪt/\",\"meaning\":\"chứng sợ sân khấu; run khi lên sân khấu\",\"definitionEn\":\"fear of performing in front of an audience\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: suffer from stage fright · overcome stage fright\"},{\"id\":\"applause|n\",\"term\":\"applause\",\"reading\":\"/əˈplɔːz/\",\"meaning\":\"tràng pháo tay\",\"definitionEn\":\"the sound of people clapping\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: loud applause · a round of applause\",\"example\":{\"text\":\"By the time the applause started, I had forgotten all my fears.\",\"vi\":\"Đến khi tràng pháo tay vang lên, tôi đã quên hết mọi nỗi sợ.\"}},{\"id\":\"overcome|v\",\"term\":\"overcome\",\"reading\":\"/ˌəʊ.vəˈkʌm/\",\"meaning\":\"vượt qua (khó khăn, nỗi sợ)\",\"definitionEn\":\"to succeed in dealing with a difficulty\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-COME — Hay đi với: overcome a fear · overcome difficulties\"},{\"id\":\"determination|n\",\"term\":\"determination\",\"reading\":\"/dɪˌtɜː.mɪˈneɪ.ʃən/\",\"meaning\":\"sự quyết tâm\",\"definitionEn\":\"the quality of not giving up\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: with great determination · sheer determination\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"vividly|adv\",\"term\":\"vividly\",\"reading\":\"/ˈvɪv.ɪd.li/\",\"meaning\":\"rõ ràng; sống động\",\"definitionEn\":\"in a very clear and detailed way\",\"lesson\":61,\"pos\":\"adv\",\"hint\":\"Hay đi với: I vividly remember · vividly describe\",\"example\":{\"text\":\"I still vividly remember the day I overcame my fear of speaking in public.\",\"vi\":\"Tôi vẫn nhớ rõ ngày tôi vượt qua nỗi sợ nói trước đám đông.\"}},{\"id\":\"look-back-on|phr-v\",\"term\":\"look back on\",\"reading\":\"/ˌlʊk ˈbæk ɒn/\",\"meaning\":\"nhìn lại; hồi tưởng\",\"definitionEn\":\"to think about something in the past\",\"lesson\":61,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look back on my school days · look back on the experience\"},{\"id\":\"perseverance|n\",\"term\":\"perseverance\",\"reading\":\"/ˌpɜː.sɪˈvɪə.rəns/\",\"meaning\":\"sự kiên trì; bền bỉ\",\"definitionEn\":\"continuing to try despite difficulties\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Trọng âm: per-se-VE-rance — Hay đi với: patience and perseverance\",\"example\":{\"text\":\"It took a lot of perseverance and dedication to learn the piano as an adult.\",\"vi\":\"Học piano khi đã trưởng thành đòi hỏi rất nhiều kiên trì và tận tâm.\"}},{\"id\":\"audition|n\",\"term\":\"audition\",\"reading\":\"/ɔːˈdɪʃ.ən/\",\"meaning\":\"buổi thử giọng; thử vai\",\"definitionEn\":\"a short performance to test if someone is suitable for a role\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: pass an audition · go to an audition\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"rewarding|adj\",\"term\":\"rewarding\",\"reading\":\"/rɪˈwɔː.dɪŋ/\",\"meaning\":\"đáng công; mang lại sự hài lòng\",\"definitionEn\":\"giving satisfaction\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: a rewarding experience · extremely rewarding\",\"example\":{\"text\":\"Looking back on it, the experience was extremely rewarding.\",\"vi\":\"Nhìn lại thì trải nghiệm đó rất đáng giá.\"}},{\"id\":\"self-confidence|n\",\"term\":\"self-confidence\",\"reading\":\"/ˌselfˈkɒn.fɪ.dəns/\",\"meaning\":\"sự tự tin\",\"definitionEn\":\"belief in your own abilities\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: build self-confidence · lack self-confidence\"},{\"id\":\"unforgettable|adj\",\"term\":\"unforgettable\",\"reading\":\"/ˌʌn.fəˈɡet.ə.bəl/\",\"meaning\":\"không thể quên\",\"definitionEn\":\"impossible to stop remembering\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: an unforgettable night · an unforgettable experience\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"in-hindsight|idiom\",\"term\":\"in hindsight\",\"reading\":\"/ɪn ˈhaɪnd.saɪt/\",\"meaning\":\"nhìn lại thì; giờ nghĩ lại\",\"definitionEn\":\"when thinking about the past with what you know now\",\"lesson\":61,\"pos\":\"idiom\"},{\"id\":\"dedication|n\",\"term\":\"dedication\",\"reading\":\"/ˌ ":\"Mars has a very thin atmosphere, so it is extremely cold.\",\"vi\":\"Sao Hỏa có bầu khí quyển rất mỏng, nên nó cực kỳ lạnh.\"}},{\"id\":\"observe|v\",\"term\":\"observe\",\"reading\":\"/əbˈzɜːv/\",\"meaning\":\"quan sát\",\"definitionEn\":\"to watch carefully\",\"lesson\":62,\"pos\":\"v\",\"hint\":\"Hay đi với: observe the stars · be observed through a telescope\",\"example\":{\"text\":\"The new space telescope can observe galaxies billions of light years away.\",\"vi\":\"Kính thiên văn không gian mới có thể quan sát các thiên hà cách hàng tỉ năm ánh sáng.\"}},{\"id\":\"scientific|adj\",\"term\":\"scientific\",\"reading\":\"/ˌsaɪ.ənˈtɪf.ɪk/\",\"meaning\":\"(thuộc) khoa học\",\"definitionEn\":\"connected with science\",\"lesson\":62,\"pos\":\"adj\",\"hint\":\"sai-ờn-TIF-ik: nhấn âm 3. — Trọng âm: sci-en-TIF-ic — Hay đi với: scientific research · scientific evidence\",\"example\":{\"text\":\"The samples were tested in a laboratory to find scientific evidence of water.\",\"vi\":\"Các mẫu được kiểm tra trong phòng thí nghiệm để tìm bằng chứng khoa học về nước.\"}},{\"id\":\"research|n\",\"term\":\"research\",\"reading\":\"/rɪˈsɜːtʃ/\",\"meaning\":\"nghiên cứu\",\"definitionEn\":\"careful study to discover new facts\",\"lesson\":62,\"pos\":\"n\",\"hint\":\"Hay đi với: carry out research into · research shows that\",\"example\":{\"text\":\"A lot of research into Mars has been done in the last decade.\",\"vi\":\"Rất nhiều nghiên cứu về sao Hỏa đã được thực hiện trong thập kỷ qua.\"}},{\"id\":\"space-exploration|phr-n\",\"term\":\"space exploration\",\"reading\":\"/ˈspeɪs ek.spləˌreɪ.ʃən/\",\"meaning\":\"thám hiểm vũ trụ\",\"definitionEn\":\"travel and study beyond the Earth\",\"lesson\":63,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: invest in space exploration · the cost of space exploration\"},{\"id\":\"colonise|v\",\"term\":\"colonise\",\"reading\":\"/ˈkɒl.ə.naɪz/\",\"meaning\":\"lập thuộc địa; đến định cư (ở hành tinh khác)\",\"definitionEn\":\"to go and live in a new place and take control of it\",\"lesson\":63,\"pos\":\"v\",\"hint\":\"Hay đi với: colonise Mars · colonise other planets\"},{\"id\":\"justify|v\",\"term\":\"justify\",\"reading\":\"/ˈdʒʌs.tɪ.faɪ/\",\"meaning\":\"biện minh; chứng minh là hợp lý\",\"definitionEn\":\"to give good reasons for something\",\"lesson\":63,\"pos\":\"v\",\"hint\":\"Hay đi với: justify the cost · be difficult to justify\",\"example\":{\"text\":\"It is difficult to justify such spending when there are more pressing problems on Earth.\",\"vi\":\"Khó mà biện minh cho khoản chi như vậy khi Trái Đất còn nhiều vấn đề cấp bách hơn.\"}},{\"id\":\"taxpayer|n\",\"term\":\"taxpayer\",\"reading\":\"/ˈtæksˌpeɪ.ər/\",\"meaning\":\"người đóng thuế\",\"definitionEn\":\"a person who pays money to the government\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: taxpayers' money · at the taxpayer's expense\"},{\"id\":\"mission|n\",\"term\":\"mission\",\"reading\":\"/ˈmɪʃ.ən/\",\"meaning\":\"sứ mệnh; chuyến (bay) nhiệm vụ\",\"definitionEn\":\"an important journey or task\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: a space mission · a mission to Mars\",\"example\":{\"text\":\"What concerns many taxpayers is the astronomical cost of each mission.\",\"vi\":\"Điều khiến nhiều người đóng thuế lo ngại là chi phí khổng lồ của mỗi sứ mệnh.\"}},{\"id\":\"cutting-edge|adj\",\"term\":\"cutting-edge\",\"reading\":\"/ˌkʌt.ɪŋ ˈedʒ/\",\"meaning\":\"tiên tiến nhất; mũi nhọn\",\"definitionEn\":\"the most advanced\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Hay đi với: cutting-edge technology · cutting-edge research\"},{\"id\":\"feasible|adj\",\"term\":\"feasible\",\"reading\":\"/ˈfiː.zə.bəl/\",\"meaning\":\"khả thi\",\"definitionEn\":\"possible to do\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Hay đi với: technically feasible · a feasible solution\",\"example\":{\"text\":\"Reusable rockets have made commercial space flights more feasible.\",\"vi\":\"Tên lửa tái sử dụng đã khiến các chuyến bay vũ trụ thương mại khả thi hơn.\"}},{\"id\":\"space-debris|phr-n\",\"term\":\"space debris\",\"reading\":\"/ˈspeɪs ˌdeb.riː/\",\"meaning\":\"rác vũ trụ\",\"definitionEn\":\"old pieces of rockets and satellites circling the Earth\",\"lesson\":63,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: pieces of space debris · the problem of space debris\"},{\"id\":\"pressing|adj\",\"term\":\"pressing\",\"reading\":\"/ˈpres.ɪŋ/\",\"meaning\":\"cấp bách\",\"definitionEn\":\"needing to be dealt with immediately\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Hay đi với: pressing problems · a pressing need\",\"example\":{\"text\":\"It is difficult to justify such spending when there are more pressing problems on Earth.\",\"vi\":\"Khó mà biện minh cho khoản chi như vậy khi Trái Đất còn nhiều vấn đề cấp bách hơn.\"}},{\"id\":\"habitable|adj\",\"term\":\"habitable\",\"reading\":\"/ˈhæb.ɪ.tə.bəl/\",\"meaning\":\"có thể sinh sống được\",\"definitionEn\":\"suitable for living in\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Hay đi với: a habitable planet\",\"example\":{\"text\":\"No other habitable planet has been found so far.\",\"vi\":\"Cho đến nay chưa tìm thấy hành tinh nào khác có thể sinh sống.\"}},{\"id\":\"astronomical|adj\",\"term\":\"astronomical\",\"reading\":\"/ˌæs.trəˈnɒm.ɪ.kəl/\",\"meaning\":\"(chi phí) cực kỳ lớn; thuộc thiên văn học\",\"definitionEn\":\"(of costs) extremely large; connected with stars\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Trọng âm: as-tro-NOM-i-cal — Hay đi với: astronomical costs · an astronomical sum\",\"example\":{\"text\":\"What concerns many taxpayers is the astronomical cost of each mission.\",\"vi\":\"Điều khiến nhiều người đóng thuế lo ngại là chi phí khổng lồ của mỗi sứ mệnh.\"}},{\"id\":\"rocket|n\",\"term\":\"rocket\",\"reading\":\"/ˈrɒk.ɪt/\",\"meaning\":\"tên lửa\",\"definitionEn\":\"a vehicle that flies into space\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: launch a rocket · reusable rockets\"},{\"id\":\"spin-off|n\",\"term\":\"spin-off\",\"reading\":\"/ˈspɪn.ɒf/\",\"meaning\":\"sản phẩm phụ; ứng dụng phát sinh (từ một nghiên cứu)\",\"definitionEn\":\"a useful product that comes from other research\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: a spin-off from space research\"},{\"id\":\"humanity|n\",\"term\":\"humanity\",\"reading\":\"/hjuːˈmæn.ə.ti/\",\"meaning\":\"nhân loại\",\"definitionEn\":\"all people\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: the future of humanity · benefit humanity\",\"example\":{\"text\":\"Many see space as the final frontier for humanity.\",\"vi\":\"Nhiều người coi vũ trụ là biên giới cuối cùng của nhân loại.\"}},{\"id\":\"frontier|n\",\"term\":\"frontier\",\"reading\":\"/ˈfrʌn.tɪər/\",\"meaning\":\"biên giới; giới hạn (của hiểu biết)\",\"definitionEn\":\"the limit of what is known or explored\",\"lesson\":63,\"pos\":\"n\",\"hint\":\"Hay đi với: the final frontier · the frontiers of science\",\"example\":{\"text\":\"Many see space as the final frontier for humanity.\",\"vi\":\"Nhiều người coi vũ trụ là biên giới cuối cùng của nhân loại.\"}},{\"id\":\"commercial|adj\",\"term\":\"commercial\",\"reading\":\"/kəˈmɜː.ʃəl/\",\"meaning\":\"thương mại\",\"definitionEn\":\"connected with business and making money\",\"lesson\":63,\"pos\":\"adj\",\"hint\":\"Hay đi với: commercial flights · commercial companies\",\"example\":{\"text\":\"Reusable rockets have made commercial space flights more feasible.\",\"vi\":\"Tên lửa tái sử dụng đã khiến các chuyến bay vũ trụ thương mại khả thi hơn.\"}},{\"id\":\"private-sector|phr-n\",\"term\":\"private sector\",\"reading\":\"/ˈpraɪ.vət ˌsek.tər/\",\"meaning\":\"khu vực tư nhân\",\"definitionEn\":\"businesses not owned by the government\",\"lesson\":63,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the private sector · private-sector investment\"},{\"id\":\"outer-space|phr-n\",\"term\":\"outer space\",\"reading\":\"/ˌaʊ.tə ˈspeɪs/\",\"meaning\":\"không gian vũ trụ (ngoài khí quyển)\",\"definitionEn\":\"the area beyond the Earth's atmosphere\",\"lesson\":63,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: travel into outer space\"},{\"id\":\"legislation|n\",\"term\":\"legislation\",\"reading\":\"/ˌledʒ.ɪˈsleɪ.ʃən/\",\"meaning\":\"luật pháp; bộ luật (nói chung)\",\"definitionEn\":\"laws passed by a parliament\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: introduce legislation · pass legislation\",\"example\":{\"text\":\"The introduction of stricter legislation led to a fall in pollution.\",\"vi\":\"Việc ban hành luật chặt chẽ hơn đã dẫn đến giảm ô nhiễm.\"}},{\"id\":\"regulation|n\",\"term\":\"regulation\",\"reading\":\"/ˌreɡ.jəˈleɪ.ʃən/\",\"meaning\":\"quy định\",\"definitionEn\":\"an official rule\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: strict regulations · safety regulations\"},{\"id\":\"moral|adj\",\"term\":\"moral\",\"reading\":\"/ˈmɒr.əl/\",\"meaning\":\"(thuộc) đạo đức\",\"definitionEn\":\"connected with right and wrong\",\"lesson\":64,\"pos\":\"adj\",\"hint\":\"Hay đi với: a moral duty · moral values\",\"example\":{\"text\":\"Doctors sometimes face a moral dilemma when a patient refuses treatment.\",\"vi\":\"Bác sĩ đôi khi đối mặt với tình thế khó xử về đạo đức khi bệnh nhân từ chối điều trị.\"}},{\"id\":\"dilemma|n\",\"term\":\"dilemma\",\"reading\":\"/dɪˈlem.ə/\",\"meaning\":\"tình thế khó xử; thế tiến thoái lưỡng nan\",\"definitionEn\":\"a difficult choice between two options\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: a moral dilemma · face a dilemma\",\"example\":{\"text\":\"Doctors sometimes face a moral dilemma when a patient refuses treatment.\",\"vi\":\"Bác sĩ đôi khi đối mặt với tình thế khó xử về đạo đức khi bệnh nhân từ chối điều trị.\"}},{\"id\":\"violate|v\",\"term\":\"violate\",\"reading\":\"/ˈvaɪə.leɪt/\",\"meaning\":\"vi phạm; xâm phạm\",\"definitionEn\":\"to break a law or agreement\",\"lesson\":64,\"pos\":\"v\",\"hint\":\"Hay đi với: violate the law · violate someone's privacy\"},{\"id\":\"human-rights|phr-n\",\"term\":\"human rights\",\"reading\":\"/ˌhjuː.mən ˈraɪts/\",\"meaning\":\"nhân quyền\",\"definitionEn\":\"basic freedoms that every person should have\",\"lesson\":64,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect human rights · a violation of human rights\"},{\"id\":\"discrimination|n\",\"term\":\"discrimination\",\"reading\":\"/dɪˌskrɪm.ɪˈneɪ.ʃən/\",\"meaning\":\"sự phân biệt đối xử\",\"definitionEn\":\"treating people unfairly because of race, age or gender\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: discrimination against women · age discrimination\",\"example\":{\"text\":\"Discrimination against older workers is illegal in many countries.\",\"vi\":\"Phân biệt đối xử với người lao động lớn tuổi là bất hợp pháp ở nhiều nước.\"}},{\"id\":\"consent|n\",\"term\":\"consent\",\"reading\":\"/kənˈsent/\",\"meaning\":\"sự đồng ý; cho phép\",\"definitionEn\":\"permission\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: without consent · give consent\",\"example\":{\"text\":\"Collecting personal data without consent violates people's privacy.\",\"vi\":\"Thu thập dữ liệu cá nhân không có sự đồng ý là xâm phạm quyền riêng tư.\"}},{\"id\":\"accountable|adj\",\"term\":\"accountable\",\"reading\":\"/əˈkaʊn.tə.bəl/\",\"meaning\":\"chịu trách nhiệm (giải trình)\",\"definitionEn\":\"responsible and expected to explain actions\",\"lesson\":64,\"pos\":\"adj\",\"hint\":\"Hay đi với: be held accountable for · accountable to the public\",\"example\":{\"text\":\"Politicians must be held accountable for their decisions.\",\"vi\":\"Các chính trị gia phải chịu trách nhiệm về quyết định của mình.\"}},{\"id\":\"integrity|n\",\"term\":\"integrity\",\"reading\":\"/ɪnˈteɡ.rə.ti/\",\"meaning\":\"sự chính trực\",\"definitionEn\":\"being honest and having strong principles\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: a person of integrity · professional integrity\"},{\"id\":\"loophole|n\",\"term\":\"loophole\",\"reading\":\"/ˈluːp.həʊl/\",\"meaning\":\"kẽ hở (luật)\",\"definitionEn\":\"a gap in a law that lets people avoid it\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: a legal loophole · close a loophole\",\"example\":{\"text\":\"The company used a legal loophole to avoid paying tax.\",\"vi\":\"Công ty đã lợi dụng kẽ hở pháp luật để trốn thuế.\"}},{\"id\":\"comply-with|phr-v\",\"term\":\"comply with\",\"reading\":\"/kəmˈplaɪ wɪð/\",\"meaning\":\"tuân thủ\",\"definitionEn\":\"to obey a rule\",\"lesson\":64,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: comply with the law · comply with regulations\"},{\"id\":\"impose|v\",\"term\":\"impose\",\"reading\":\"/ɪmˈpəʊz/\",\"meaning\":\"áp đặt (thuế, luật, hình phạt)\",\"definitionEn\":\"to force a rule or tax on someone\",\"lesson\":64,\"pos\":\"v\",\"hint\":\"Hay đi với: impose a ban on · impose a fine on\"},{\"id\":\"law-abiding|adj\",\"term\":\"law-abiding\",\"reading\":\"/ˈlɔː.əˌbaɪ.dɪŋ/\",\"meaning\":\"tuân thủ pháp luật\",\"definitionEn\":\"obeying the law\",\"lesson\":64,\"pos\":\"adj\",\"hint\":\"Hay đi với: law-abiding citizens\"},{\"id\":\"unethical|adj\",\"term\":\"unethical\",\"reading\":\"/ʌnˈeθ.ɪ.kəl/\",\"meaning\":\"trái đạo đức\",\"definitionEn\":\"not morally acceptable\",\"lesson\":64,\"pos\":\"adj\",\"hint\":\"Hay đi với: unethical behaviour · it is unethical to\",\"example\":{\"text\":\"Many people believe it is unethical to keep wild animals in small cages.\",\"vi\":\"Nhiều người cho rằng nhốt động vật hoang dã trong lồng nhỏ là trái đạo đức.\"}},{\"id\":\"animal-testing|phr-n\",\"term\":\"animal testing\",\"reading\":\"/ˈæn.ɪ.məl ˌtes.tɪŋ/\",\"meaning\":\"thử nghiệm trên động vật\",\"definitionEn\":\"using animals in experiments for products or medicine\",\"lesson\":64,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: ban animal testing · animal testing for cosmetics\"},{\"id\":\"prohibit|v\",\"term\":\"prohibit\",\"reading\":\"/prəˈhɪb.ɪt/\",\"meaning\":\"cấm (trang trọng)\",\"definitionEn\":\"to officially forbid\",\"lesson\":64,\"pos\":\"v\",\"hint\":\"Hay đi với: be prohibited by law · prohibit someone from doing\"},{\"id\":\"obligation|n\",\"term\":\"obligation\",\"reading\":\"/ˌɒb.lɪˈɡeɪ.ʃən/\",\"meaning\":\"nghĩa vụ\",\"definitionEn\":\"something you must do\",\"lesson\":64,\"pos\":\"n\",\"hint\":\"Hay đi với: a legal obligation · a moral obligation to\",\"example\":{\"text\":\"Protecting human rights is a legal obligation for every government.\",\"vi\":\"Bảo vệ nhân quyền là nghĩa vụ pháp lý của mọi chính phủ.\"}}],\"lesson\":{\"number\":64,\"title\":\"Luật pháp \u0026 đạo đức xã hội · Ôn collocation + paraphrase toàn bộ chủ đề\"}}]\n"])</script><script>self.__next_f.push([1,"2e:[\"$\",\"p\",null,{\"className\":\"text-sm\",\"children\":[\"$\",\"$L8\",null,{\"href\":\"/en/flashcards/?lesson=64\",\"className\":\"font-medium text-sky-800 hover:underline\",\"children\":\"Ôn các từ này bằng flashcard →\"}]}]\n2f:[\"$\",\"div\",null,{\"className\":\"fixed inset-x-0 bottom-[calc(3.5rem+env(safe-area-inset-bottom))] z-20 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mt-8 sm:border-0 sm:bg-transparent sm:p-0\",\"children\":[\"$\",\"div\",null,{\"className\":\"mx-auto flex max-w-5xl items-center justify-between gap-3\",\"children\":[[\"$\",\"$L8\",null,{\"href\":\"/en\",\"className\":\"rounded-xl px-4 py-2.5 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100\",\"children\":[\"← \",\"Danh sách buổi\"]}],[\"$\",\"$L8\",null,{\"href\":\"/en/lesson/buoi-64-luat-phap-paraphrase/pronunciation\",\"className\":\"rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700\",\"children\":[\"Phát âm\",\" →\"]}]]}]}]\n14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n11:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Buổi 64: Luật pháp \u0026 đạo đức xã hội · Ôn collocation + paraphrase toàn bộ chủ đề · Học tiếng Anh\"}],[\"$\",\"meta
