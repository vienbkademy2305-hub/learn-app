22,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-de-PEN-dent — Hay đi với: become independent · independent learners\",\"example\":{\"text\":\"University students should be more independent than school children.\",\"vi\":\"Sinh viên đại học nên tự lập hơn học sinh phổ thông.\"}},{\"id\":\"practical|adj\",\"term\":\"practical\",\"reading\":\"/ˈpræk.tɪ.kəl/\",\"meaning\":\"thực tế; thực hành\",\"definitionEn\":\"connected with real situations rather than ideas\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PRAC-ti-cal — Hay đi với: practical skills · practical experience\",\"example\":{\"text\":\"Cooking and managing money are practical skills.\",\"vi\":\"Nấu ăn và quản lý tiền bạc là những kỹ năng thực tế.\"}},{\"id\":\"pressure|n\",\"term\":\"pressure\",\"reading\":\"/ˈpreʃ.ər/\",\"meaning\":\"áp lực\",\"definitionEn\":\"a feeling that you must do something, causing stress\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: PRES-sure — Hay đi với: put pressure on someone · under pressure\",\"example\":{\"text\":\"Some teenagers start smoking due to peer pressure.\",\"vi\":\"Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè.\"}},{\"id\":\"critical-thinking|phr-n\",\"term\":\"critical thinking\",\"reading\":\"/ˌkrɪt.ɪ.kəl ˈθɪŋ.kɪŋ/\",\"meaning\":\"tư duy phản biện\",\"definitionEn\":\"the ability to judge information carefully and logically\",\"lesson\":22,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: develop critical thinking · critical thinking skills\"},{\"id\":\"develop|v\",\"term\":\"develop\",\"reading\":\"/dɪˈvel.əp/\",\"meaning\":\"phát triển; rèn luyện (kỹ năng)\",\"definitionEn\":\"to grow or make something grow stronger\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"di-VEL-ờp: không có e ở cuối. — Trọng âm: de-VE-lop — Hay đi với: develop skills · develop creativity\",\"example\":{\"text\":\"Art lessons can develop children's creativity.\",\"vi\":\"Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ.\"}},{\"id\":\"environment|n\",\"term\":\"environment\",\"reading\":\"/ɪnˈvaɪ.rən.mənt/\",\"meaning\":\"môi trường\",\"definitionEn\":\"the natural world of land, air, water, plants and animals\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"En-VAI-rần-mần: có “iron” (AI-rần) ở giữa từ. — Trọng âm: en-VI-ron-ment — Hay đi với: protect the environment · harm the environment\",\"example\":{\"text\":\"We should protect the environment for our children.\",\"vi\":\"Chúng ta nên bảo vệ môi trường vì con cháu mình.\"}},{\"id\":\"pollution|n\",\"term\":\"pollution\",\"reading\":\"/pəˈluː.ʃən/\",\"meaning\":\"sự ô nhiễm\",\"definitionEn\":\"damage to air, water or land by harmful substances\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: pol-LU-tion — Hay đi với: air pollution · water pollution\",\"example\":{\"text\":\"Air pollution in our city has got worse since 2015.\",\"vi\":\"Ô nhiễm không khí ở thành phố chúng tôi trở nên tệ hơn kể từ năm 2015.\"}},{\"id\":\"waste|n\",\"term\":\"waste\",\"reading\":\"/weɪst/\",\"meaning\":\"rác thải; chất thải\",\"definitionEn\":\"things that are thrown away because they are not needed\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Hay đi với: plastic waste · food waste\",\"example\":{\"text\":\"Food waste is a big problem in restaurants.\",\"vi\":\"Lãng phí thực phẩm là một vấn đề lớn ở các nhà hàng.\"}},{\"id\":\"rubbish|n\",\"term\":\"rubbish\",\"reading\":\"/ˈrʌb.ɪʃ/\",\"meaning\":\"rác\",\"definitionEn\":\"things you throw away (British English)\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"RÂB-ish: 2 chữ b. — Trọng âm: RUB-bish — Hay đi với: throw away rubbish · a rubbish bin\",\"example\":{\"text\":\"Our group has picked up five tons of rubbish so far.\",\"vi\":\"Đến nay nhóm chúng tôi đã nhặt được năm tấn rác.\"}},{\"id\":\"climate-change|phr-n\",\"term\":\"climate change\",\"reading\":\"/ˈklaɪ.mət ˌtʃeɪndʒ/\",\"meaning\":\"biến đổi khí hậu\",\"definitionEn\":\"long-term changes in the Earth's weather patterns\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: tackle climate change · the effects of climate change\"},{\"id\":\"global-warming|phr-n\",\"term\":\"global warming\",\"reading\":\"/ˌɡləʊ.bəl ˈwɔː.mɪŋ/\",\"meaning\":\"sự nóng lên toàn cầu\",\"definitionEn\":\"the rise in the Earth's average temperature\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: cause global warming · slow down global warming\"},{\"id\":\"carbon-emissions|phr-n\",\"term\":\"carbon emissions\",\"reading\":\"/ˌkɑː.bən iˈmɪʃ.ənz/\",\"meaning\":\"khí thải carbon\",\"definitionEn\":\"gases released when fuel is burned\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce carbon emissions · cut carbon emissions\"},{\"id\":\"renewable-energy|phr-n\",\"term\":\"renewable energy\",\"reading\":\"/rɪˌnjuː.ə.bəl ˈen.ə.dʒi/\",\"meaning\":\"năng lượng tái tạo\",\"definitionEn\":\"power from sources such as the sun and wind\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use renewable energy · invest in renewable energy\"},{\"id\":\"protect|v\",\"term\":\"protect\",\"reading\":\"/prəˈtekt/\",\"meaning\":\"bảo vệ\",\"definitionEn\":\"to keep someone or something safe from harm\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: pro-TECT — Hay đi với: protect the environment · protect wildlife\",\"example\":{\"text\":\"Users should protect their privacy online.\",\"vi\":\"Người dùng nên bảo vệ quyền riêng tư của mình trên mạng.\"}},{\"id\":\"reduce|v\",\"term\":\"reduce\",\"reading\":\"/rɪˈdʒuːs/\",\"meaning\":\"giảm; cắt giảm\",\"definitionEn\":\"to make something smaller in amount or size\",\"lesson\":23,\"pos\":\"v\",\"hint\":\"Trọng âm: re-DUCE — Hay đi với: reduce pollution · reduce waste\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"volunteer|n\",\"term\":\"volunteer\",\"reading\":\"/ˌvɒl.ənˈtɪər/\",\"meaning\":\"tình nguyện viên\",\"definitionEn\":\"a person who works without being paid\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"vol-ờn-TIR: nhấn âm cuối. — Trọng âm: vo-lun-TEER — Hay đi với: work as a volunteer · volunteer work\",\"example\":{\"text\":\"Have you ever worked as a volunteer? – Yes, I worked at a national park last summer.\",\"vi\":\"Bạn đã bao giờ làm tình nguyện viên chưa? – Rồi, mùa hè năm ngoái tôi làm ở một vườn quốc gia.\"}},{\"id\":\"deforestation|n\",\"term\":\"deforestation\",\"reading\":\"/diːˌfɒr.ɪˈsteɪ.ʃən/\",\"meaning\":\"nạn phá rừng\",\"definitionEn\":\"cutting down large areas of trees\",\"lesson\":23,\"pos\":\"n\",\"hint\":\"Trọng âm: de-fo-res-TA-tion — Hay đi với: stop deforestation · the causes of deforestation\",\"example\":{\"text\":\"Deforestation has destroyed the homes of many animals.\",\"vi\":\"Nạn phá rừng đã phá hủy nơi sống của nhiều loài động vật.\"}},{\"id\":\"endangered-species|phr-n\",\"term\":\"endangered species\",\"reading\":\"/ɪnˌdeɪn.dʒəd ˈspiː.ʃiːz/\",\"meaning\":\"loài có nguy cơ tuyệt chủng\",\"definitionEn\":\"types of animals or plants that may soon disappear\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect endangered species\"},{\"id\":\"single-use-plastic|phr-n\",\"term\":\"single-use plastic\",\"reading\":\"/ˌsɪŋ.ɡəl.juːs ˈplæs.tɪk/\",\"meaning\":\"nhựa dùng một lần\",\"definitionEn\":\"plastic items used once and then thrown away\",\"lesson\":23,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: ban single-use plastic · single-use plastic bags\"},{\"id\":\"reusable|adj\",\"term\":\"reusable\",\"reading\":\"/ˌriːˈjuː.zə.bəl/\",\"meaning\":\"dùng lại được\",\"definitionEn\":\"able to be used again\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-U-sa-ble — Hay đi với: a reusable bag · a reusable bottle\",\"example\":{\"text\":\"I always bring a reusable bottle to work.\",\"vi\":\"Tôi luôn mang theo một chai nước dùng lại được khi đi làm.\"}},{\"id\":\"environmentally-friendly|adj\",\"term\":\"environmentally friendly\",\"reading\":\"/ɪnˌvaɪ.rən.men.təl.i ˈfrend.li/\",\"meaning\":\"thân thiện với môi trường\",\"definitionEn\":\"not harmful to nature\",\"lesson\":23,\"pos\":\"adj\",\"hint\":\"Hay đi với: environmentally friendly products\"},{\"id\":\"nature|n\",\"term\":\"nature\",\"reading\":\"/ˈneɪ.tʃər/\",\"meaning\":\"thiên nhiên; tự nhiên\",\"definitionEn\":\"plants, animals, and the physical world not made by people\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: NA-ture — Hay đi với: in nature · close to nature\",\"example\":{\"text\":\"Spending time in nature helps me relax after work.\",\"vi\":\"Dành thời gian giữa thiên nhiên giúp tôi thư giãn sau giờ làm.\"}},{\"id\":\"fresh-air|phr-n\",\"term\":\"fresh air\",\"reading\":\"/ˌfreʃ ˈeər/\",\"meaning\":\"không khí trong lành\",\"definitionEn\":\"clean air outside, away from pollution\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: get some fresh air · breathe fresh air\"},{\"id\":\"countryside|n\",\"term\":\"countryside\",\"reading\":\"/ˈkʌn.tri.saɪd/\",\"meaning\":\"vùng nông thôn; miền quê\",\"definitionEn\":\"land outside towns, with fields and farms\",\"lesson\":24,\"pos\":\"n\",\"hint\":\"Trọng âm: COUN-try-side — Hay đi với: live in the countryside · the beautiful countryside\",\"example\":{\"text\":\"I would rather live in the countryside than in a big city.\",\"vi\":\"Tôi thà sống ở nông thôn còn hơn ở thành phố lớn.\"}},{\"id\":\"green-space|phr-n\",\"term\":\"green space\",\"reading\":\"/ˌɡriːn ˈspeɪs/\",\"meaning\":\"không gian xanh (công viên, vườn cây trong thành phố)\",\"definitionEn\":\"an area of grass and trees in a city\",\"lesson\":24,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: more green spaces · a lack of green space\"},{\"id\":\"peaceful|adj\",\"term\":\"peaceful\",\"reading\":\"/ˈpiːs.fəl/\",\"meaning\":\"yên bình; thanh bình\",\"definitionEn\":\"quiet and calm\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: PEACE-ful — Hay đi với: a peaceful village · peaceful and quiet\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"noisy|adj\",\"term\":\"noisy\",\"reading\":\"/ˈnɔɪ.zi/\",\"meaning\":\"ồn ào\",\"definitionEn\":\"making a lot of loud sounds\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: NOI-sy — Hay đi với: a noisy street · noisy neighbours\",\"example\":{\"text\":\"My hometown is quite peaceful, but the main road is noisy in the morning.\",\"vi\":\"Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.\"}},{\"id\":\"polluted|adj\",\"term\":\"polluted\",\"reading\":\"/pəˈluː.tɪd/\",\"meaning\":\"bị ô nhiễm\",\"definitionEn\":\"made dirty by harmful substances\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Trọng âm: pol-LU-ted — Hay đi với: a polluted river · heavily polluted\",\"example\":{\"text\":\"The river near my house is badly polluted.\",\"vi\":\"Con sông gần nhà tôi bị ô nhiễm nặng.\"}},{\"id\":\"outdoor|adj\",\"term\":\"outdoor\",\"reading\":\"/ˈaʊt.dɔː/\",\"meaning\":\"ngoài trời\",\"definitionEn\":\"happening outside, not in a building\",\"lesson\":24,\"pos\":\"adj\",\"hint\":\"Hay đi với: outdoor activities · outdoor sports\",\"example\":{\"text\":\"I'm really keen on outdoor activities like cycling and camping.\",\"vi\":\"Tôi rất mê các hoạt động ngoài trời như đạp xe và cắm trại.\"}},{\"id\":\"go-for-a-walk|colloc\",\"term\":\"go for a walk\",\"reading\":\"/ɡəʊ fər ə ˈwɔːk/\",\"meaning\":\"đi dạo\",\"definitionEn\":\"to leave the house and move on foot for pleasure\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: go for a walk in the park · go for a walk after dinner\"},{\"id\":\"plant|v\",\"term\":\"plant\",\"reading\":\"/plɑːnt/\",\"meaning\":\"trồng (cây)\",\"definitionEn\":\"to put seeds or young trees into the ground\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Hay đi với: plant trees · plant flowers\",\"example\":{\"text\":\"First, used bottles are collected from homes and taken to a recycling plant.\",\"vi\":\"Đầu tiên, chai đã qua sử dụng được thu gom từ các hộ gia đình và đưa đến nhà máy tái chế.\"}},{\"id\":\"keen-on|colloc\",\"term\":\"keen on\",\"reading\":\"/ˈkiːn ɒn/\",\"meaning\":\"thích; say mê\",\"definitionEn\":\"very interested in something\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: be keen on + V-ing · be really keen on\"},{\"id\":\"prefer|v\",\"term\":\"prefer\",\"reading\":\"/prɪˈfɜːr/\",\"meaning\":\"thích hơn\",\"definitionEn\":\"to like one thing more than another\",\"lesson\":24,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-FER — Hay đi với: prefer A to B · prefer + V-ing\",\"example\":{\"text\":\"I prefer casual clothes at the weekend.\",\"vi\":\"Cuối tuần tôi thích mặc đồ thường ngày hơn.\"}},{\"id\":\"would-rather|colloc\",\"term\":\"would rather\",\"reading\":\"/wʊd ˈrɑː.ðər/\",\"meaning\":\"thà… còn hơn; muốn … hơn\",\"definitionEn\":\"used to say what you want to do more\",\"lesson\":24,\"pos\":\"colloc\",\"hint\":\"Hay đi với: would rather + V + than + V · I'd rather not\"},{\"id\":\"technology|n\",\"term\":\"technology\",\"reading\":\"/tekˈnɒl.ə.dʒi/\",\"meaning\":\"công nghệ\",\"definitionEn\":\"scientific knowledge used to make machines and tools\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: tech-NO-lo-gy — Hay đi với: modern technology · new technology\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"device|n\",\"term\":\"device\",\"reading\":\"/dɪˈvaɪs/\",\"meaning\":\"thiết bị\",\"definitionEn\":\"a machine or tool, e.g. a phone or tablet\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: de-VICE — Hay đi với: electronic devices · a mobile device\"},{\"id\":\"artificial-intelligence|phr-n\",\"term\":\"artificial intelligence\",\"reading\":\"/ˌɑː.tɪ.fɪʃ.əl ɪnˈtel.ɪ.dʒəns/\",\"meaning\":\"trí tuệ nhân tạo (AI)\",\"definitionEn\":\"computer systems that can learn and make decisions\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use artificial intelligence · AI tools\"},{\"id\":\"automation|n\",\"term\":\"automation\",\"reading\":\"/ˌɔː.təˈmeɪ.ʃən/\",\"meaning\":\"tự động hóa\",\"definitionEn\":\"using machines to do work that people used to do\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: au-to-MA-tion — Hay đi với: automation in factories · jobs lost to automation\",\"example\":{\"text\":\"Automation has replaced many jobs in factories.\",\"vi\":\"Tự động hóa đã thay thế nhiều công việc trong nhà máy.\"}},{\"id\":\"digital-literacy|phr-n\",\"term\":\"digital literacy\",\"reading\":\"/ˌdɪdʒ.ɪ.təl ˈlɪt.ər.ə.si/\",\"meaning\":\"kỹ năng số; hiểu biết về công nghệ số\",\"definitionEn\":\"the ability to use computers and the internet well\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve digital literacy · digital literacy skills\"},{\"id\":\"social-media|phr-n\",\"term\":\"social media\",\"reading\":\"/ˌsəʊ.ʃəl ˈmiː.di.ə/\",\"meaning\":\"mạng xã hội\",\"definitionEn\":\"websites and apps where people share posts and messages\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: use social media · on social media\"},{\"id\":\"screen-time|phr-n\",\"term\":\"screen time\",\"reading\":\"/ˈskriːn ˌtaɪm/\",\"meaning\":\"thời gian dùng màn hình (điện thoại, máy tính, TV)\",\"definitionEn\":\"the amount of time spent using phones, computers or TV\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: limit screen time · too much screen time\"},{\"id\":\"software|n\",\"term\":\"software\",\"reading\":\"/ˈsɒft.weər/\",\"meaning\":\"phần mềm\",\"definitionEn\":\"programs that run on a computer\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: SOFT-ware — Hay đi với: install software · a software engineer\",\"example\":{\"text\":\"A software engineer is a person who writes computer programs.\",\"vi\":\"Kỹ sư phần mềm là người viết chương trình máy tính.\"}},{\"id\":\"robot|n\",\"term\":\"robot\",\"reading\":\"/ˈrəʊ.bɒt/\",\"meaning\":\"rô-bốt; người máy\",\"definitionEn\":\"a machine that can do tasks automatically\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: RO-bot — Hay đi với: industrial robots · a robot vacuum cleaner\"},{\"id\":\"user|n\",\"term\":\"user\",\"reading\":\"/ˈjuː.zər/\",\"meaning\":\"người dùng\",\"definitionEn\":\"a person who uses a product or service\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: U-ser — Hay đi với: internet users · smartphone users\"},{\"id\":\"data|n\",\"term\":\"data\",\"reading\":\"/ˈdeɪ.tə/\",\"meaning\":\"dữ liệu\",\"definitionEn\":\"facts and numbers, especially stored on computers\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Hay đi với: collect data · personal data\",\"example\":{\"text\":\"Artificial intelligence is technology that can learn from data.\",\"vi\":\"Trí tuệ nhân tạo là công nghệ có thể học từ dữ liệu.\"}},{\"id\":\"access|v\",\"term\":\"access\",\"reading\":\"/ˈæk.ses/\",\"meaning\":\"truy cập; tiếp cận\",\"definitionEn\":\"to be able to enter or use something\",\"lesson\":25,\"pos\":\"v\",\"hint\":\"Trọng âm: AC-cess — Hay đi với: access the internet · access information\",\"example\":{\"text\":\"You can access the internet almost everywhere in Vietnam.\",\"vi\":\"Ở Việt Nam bạn có thể truy cập internet gần như ở mọi nơi.\"}},{\"id\":\"addicted-to|colloc\",\"term\":\"addicted to\",\"reading\":\"/əˈdɪk.tɪd tuː/\",\"meaning\":\"nghiện (cái gì)\",\"definitionEn\":\"unable to stop doing or using something\",\"lesson\":25,\"pos\":\"colloc\",\"hint\":\"Hay đi với: be addicted to social media · addicted to games\"},{\"id\":\"privacy|n\",\"term\":\"privacy\",\"reading\":\"/ˈprɪv.ə.si/\",\"meaning\":\"quyền riêng tư; sự riêng tư\",\"definitionEn\":\"the right to keep personal information secret\",\"lesson\":25,\"pos\":\"n\",\"hint\":\"Trọng âm: PRI-va-cy — Hay đi với: protect your privacy · online privacy\",\"example\":{\"text\":\"Users should protect their privacy online.\",\"vi\":\"Người dùng nên bảo vệ quyền riêng tư của mình trên mạng.\"}},{\"id\":\"fake-news|phr-n\",\"term\":\"fake news\",\"reading\":\"/ˌfeɪk ˈnjuːz/\",\"meaning\":\"tin giả\",\"definitionEn\":\"false stories that look like real reports\",\"lesson\":25,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: spread fake news · fake news on social media\"},{\"id\":\"line-graph|phr-n\",\"term\":\"line graph\",\"reading\":\"/ˈlaɪn ˌɡrɑːf/\",\"meaning\":\"biểu đồ đường\",\"definitionEn\":\"a chart that shows changes over time with lines\",\"lesson\":26,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the line graph shows / illustrates\"},{\"id\":\"trend|n\",\"term\":\"trend\",\"reading\":\"/trend/\",\"meaning\":\"xu hướng\",\"definitionEn\":\"a general direction of change\",\"lesson\":26,\"pos\":\"n\",\"hint\":\"Hay đi với: an upward trend · a downward trend\",\"example\":{\"text\":\"The graph shows an upward trend in online banking.\",\"vi\":\"Biểu đồ cho thấy xu hướng tăng của ngân hàng trực tuyến.\"}},{\"id\":\"figure|n\",\"term\":\"figure\",\"reading\":\"/ˈfɪɡ.ər/\",\"meaning\":\"con số; số liệu\",\"definitionEn\":\"a number, especially in official data\",\"lesson\":26,\"pos\":\"n\",\"hint\":\"Trọng âm: FI-gure — Hay đi với: the figure for… · sales figures\",\"example\":{\"text\":\"The figure reached a peak of 60% in 2019 and then fell slightly.\",\"vi\":\"Con số đạt đỉnh 60% năm 2019 rồi giảm nhẹ.\"}},{\"id\":\"proportion|n\",\"term\":\"proportion\",\"reading\":\"/prəˈpɔː.ʃən/\",\"meaning\":\"tỉ lệ; phần\",\"definitionEn\":\"a part of a whole, often shown as a percentage\",\"lesson\":26,\"pos\":\"n\",\"hint\":\"Trọng âm: pro-POR-tion — Hay đi với: the proportion of people who… · a large proportion of\",\"example\":{\"text\":\"The proportion spent on utilities was marginally lower in 2020 than in 2010.\",\"vi\":\"Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010.\"}},{\"id\":\"period|n\",\"term\":\"period\",\"reading\":\"/ˈpɪə.ri.əd/\",\"meaning\":\"giai đoạn; khoảng thời gian\",\"definitionEn\":\"a length of time\",\"lesson\":26,\"pos\":\"n\",\"hint\":\"Trọng âm: PE-ri-od — Hay đi với: over the period · during the period\",\"example\":{\"text\":\"The table shows that the total value of exports doubled over the period.\",\"vi\":\"Bảng cho thấy tổng giá trị xuất khẩu tăng gấp đôi trong giai đoạn này.\"}},{\"id\":\"overall|adv\",\"term\":\"overall\",\"reading\":\"/ˌəʊ.vərˈɔːl/\",\"meaning\":\"nhìn chung; tổng thể\",\"definitionEn\":\"in general; considering everything\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Hay đi với: Overall, …\",\"example\":{\"text\":\"Overall, the proportion of older people using the internet grew over the period.\",\"vi\":\"Nhìn chung, tỉ lệ người lớn tuổi dùng internet tăng trong suốt giai đoạn.\"}},{\"id\":\"increase|v\",\"term\":\"increase\",\"reading\":\"/ɪnˈkriːs/\",\"meaning\":\"tăng\",\"definitionEn\":\"to become larger in number or amount\",\"lesson\":26,\"pos\":\"v\",\"hint\":\"Trọng âm: in-CREASE — Hay đi với: increase sharply · increase by 10%\",\"example\":{\"text\":\"More video surveillance may lead to an increase in public safety.\",\"vi\":\"Giám sát bằng camera nhiều hơn có thể giúp tăng an toàn công cộng.\"}},{\"id\":\"decrease|v\",\"term\":\"decrease\",\"reading\":\"/dɪˈkriːs/\",\"meaning\":\"giảm\",\"definitionEn\":\"to become smaller in number or amount\",\"lesson\":26,\"pos\":\"v\",\"hint\":\"Trọng âm: de-CREASE — Hay đi với: decrease gradually · decrease by half\",\"example\":{\"text\":\"There was a gradual decrease in the use of desktop computers.\",\"vi\":\"Việc sử dụng máy tính để bàn giảm dần.\"}},{\"id\":\"rise|v\",\"term\":\"rise\",\"reading\":\"/raɪz/\",\"meaning\":\"tăng, tăng lên (số liệu, giá cả)\",\"definitionEn\":\"to go up (of numbers or prices)\",\"lesson\":26,\"pos\":\"v\",\"hint\":\"Hay đi với: rise steadily · rise to a peak\",\"example\":{\"text\":\"The rise in cybercrime has worried many governments.\",\"vi\":\"Sự gia tăng tội phạm mạng khiến nhiều chính phủ lo ngại.\"}},{\"id\":\"fluctuate|v\",\"term\":\"fluctuate\",\"reading\":\"/ˈflʌk.tʃu.eɪt/\",\"meaning\":\"dao động; lên xuống thất thường\",\"definitionEn\":\"to go up and down many times\",\"lesson\":26,\"pos\":\"v\",\"hint\":\"Trọng âm: FLUC-tu-ate — Hay đi với: fluctuate between X and Y · fluctuate wildly\"},{\"id\":\"remain-stable|colloc\",\"term\":\"remain stable\",\"reading\":\"/rɪˌmeɪn ˈsteɪ.bəl/\",\"meaning\":\"giữ ổn định; không thay đổi\",\"definitionEn\":\"to stay at about the same level\",\"lesson\":26,\"pos\":\"colloc\",\"hint\":\"Hay đi với: remain stable at 20% · stay the same\"},{\"id\":\"reach-a-peak|colloc\",\"term\":\"reach a peak\",\"reading\":\"/ˌriːtʃ ə ˈpiːk/\",\"meaning\":\"đạt đỉnh\",\"definitionEn\":\"to arrive at the highest point\",\"lesson\":26,\"pos\":\"colloc\",\"hint\":\"Hay đi với: reach a peak of 60% in 2020 · peak at 60%\"},{\"id\":\"sharply|adv\",\"term\":\"sharply\",\"reading\":\"/ˈʃɑːp.li/\",\"meaning\":\"mạnh; đột ngột (tăng/giảm)\",\"definitionEn\":\"suddenly and by a large amount\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Hay đi với: rise sharply · fall sharply\",\"example\":{\"text\":\"The number of online shoppers rose sharply between 2015 and 2020.\",\"vi\":\"Số người mua sắm trực tuyến tăng mạnh từ năm 2015 đến 2020.\"}},{\"id\":\"gradually|adv\",\"term\":\"gradually\",\"reading\":\"/ˈɡrædʒ.u.ə.li/\",\"meaning\":\"dần dần; từ từ\",\"definitionEn\":\"slowly over a period of time\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Trọng âm: GRA-du-al-ly — Hay đi với: increase gradually · gradually decline\",\"example\":{\"text\":\"The use of cash gradually decreased as more people paid by phone.\",\"vi\":\"Việc dùng tiền mặt giảm dần khi ngày càng nhiều người trả tiền bằng điện thoại.\"}},{\"id\":\"significantly|adv\",\"term\":\"significantly\",\"reading\":\"/sɪɡˈnɪf.ɪ.kənt.li/\",\"meaning\":\"đáng kể\",\"definitionEn\":\"by a large or important amount\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Trọng âm: sig-NI-fi-cant-ly — Hay đi với: grow significantly · significantly higher\",\"example\":{\"text\":\"Smartphone use has increased significantly since 2015.\",\"vi\":\"Việc sử dụng điện thoại thông minh đã tăng đáng kể kể từ năm 2015.\"}},{\"id\":\"slightly|adv\",\"term\":\"slightly\",\"reading\":\"/ˈslaɪt.li/\",\"meaning\":\"nhẹ; một chút\",\"definitionEn\":\"a little\",\"lesson\":26,\"pos\":\"adv\",\"hint\":\"Hay đi với: fall slightly · slightly higher than\",\"example\":{\"text\":\"The figure reached a peak of 60% in 2019 and then fell slightly.\",\"vi\":\"Con số đạt đỉnh 60% năm 2019 rồi giảm nhẹ.\"}},{\"id\":\"gym|n\",\"term\":\"gym\",\"reading\":\"/dʒɪm/\",\"meaning\":\"phòng tập thể dục (gym)\",\"definitionEn\":\"a room or building with equipment for exercise\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Hay đi với: go to the gym · work out at the gym\",\"example\":{\"text\":\"I work out at the gym three times a week.\",\"vi\":\"Tôi tập gym ba lần một tuần.\"}},{\"id\":\"swimming-pool|phr-n\",\"term\":\"swimming pool\",\"reading\":\"/ˈswɪm.ɪŋ ˌpuːl/\",\"meaning\":\"bể bơi\",\"definitionEn\":\"an area of water built for people to swim in\",\"lesson\":27,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: an indoor swimming pool · an outdoor swimming pool\"},{\"id\":\"changing-room|phr-n\",\"term\":\"changing room\",\"reading\":\"/ˈtʃeɪn.dʒɪŋ ˌruːm/\",\"meaning\":\"phòng thay đồ\",\"definitionEn\":\"a room where you put on sports clothes\",\"lesson\":27,\"pos\":\"phr-n\"},{\"id\":\"reception|n\",\"term\":\"reception\",\"reading\":\"/rɪˈsep.ʃən/\",\"meaning\":\"quầy lễ tân\",\"definitionEn\":\"the front desk where visitors are greeted\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"ri-SEP-shờn. — Trọng âm: re-CEP-tion — Hay đi với: at reception · the reception desk\",\"example\":{\"text\":\"Please sign in at reception before you use the facilities.\",\"vi\":\"Vui lòng đăng ký ở quầy lễ tân trước khi dùng các tiện ích.\"}},{\"id\":\"entrance|n\",\"term\":\"entrance\",\"reading\":\"/ˈen.trəns/\",\"meaning\":\"lối vào; cổng vào\",\"definitionEn\":\"a door or gate where you go into a place\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Trọng âm: EN-trance — Hay đi với: the main entrance · the side entrance\",\"example\":{\"text\":\"The first aid room is just past the main entrance.\",\"vi\":\"Phòng sơ cứu ở ngay sau lối vào chính.\"}},{\"id\":\"car-park|phr-n\",\"term\":\"car park\",\"reading\":\"/ˈkɑː ˌpɑːk/\",\"meaning\":\"bãi đỗ xe\",\"definitionEn\":\"an area where you leave your car\",\"lesson\":27,\"pos\":\"phr-n\"},{\"id\":\"court|n\",\"term\":\"court\",\"reading\":\"/kɔːt/\",\"meaning\":\"sân (tennis, cầu lông, bóng rổ)\",\"definitionEn\":\"an area marked with lines for tennis or basketball\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Hay đi với: a tennis court · a badminton court\"},{\"id\":\"running-track|phr-n\",\"term\":\"running track\",\"reading\":\"/ˈrʌn.ɪŋ ˌtræk/\",\"meaning\":\"đường chạy\",\"definitionEn\":\"an oval path for races\",\"lesson\":27,\"pos\":\"phr-n\"},{\"id\":\"facility|n\",\"term\":\"facility\",\"reading\":\"/fəˈsɪl.ə.ti/\",\"meaning\":\"cơ sở vật chất; tiện ích\",\"definitionEn\":\"a building or equipment provided for a purpose\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Trọng âm: fa-CI-li-ty — Hay đi với: sports facilities · modern facilities\"},{\"id\":\"fitness|n\",\"term\":\"fitness\",\"reading\":\"/ˈfɪt.nəs/\",\"meaning\":\"sự khỏe mạnh; thể lực\",\"definitionEn\":\"being strong and healthy through exercise\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Hay đi với: a fitness class · improve your fitness\",\"example\":{\"text\":\"Our company offers free fitness classes on Friday evenings.\",\"vi\":\"Công ty chúng tôi có lớp thể dục miễn phí vào tối thứ Sáu.\"}},{\"id\":\"work-out|phr-v\",\"term\":\"work out\",\"reading\":\"/ˌwɜːk ˈaʊt/\",\"meaning\":\"tập luyện thể lực\",\"definitionEn\":\"to do physical exercise to get stronger\",\"lesson\":27,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: work out at the gym · work out three times a week\"},{\"id\":\"muscle|n\",\"term\":\"muscle\",\"reading\":\"/ˈmʌs.əl/\",\"meaning\":\"cơ bắp\",\"definitionEn\":\"a part of the body that helps you move\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Trọng âm: MUS-cle — Hay đi với: build muscle · pull a muscle\",\"example\":{\"text\":\"Always stretch before you run, or you may pull a muscle.\",\"vi\":\"Luôn giãn cơ trước khi chạy, nếu không bạn có thể bị căng cơ.\"}},{\"id\":\"stretch|v\",\"term\":\"stretch\",\"reading\":\"/stretʃ/\",\"meaning\":\"giãn cơ; duỗi người\",\"definitionEn\":\"to make your arms or legs long to loosen them\",\"lesson\":27,\"pos\":\"v\",\"hint\":\"Hay đi với: stretch before running · stretch your legs\",\"example\":{\"text\":\"Always stretch before you run, or you may pull a muscle.\",\"vi\":\"Luôn giãn cơ trước khi chạy, nếu không bạn có thể bị căng cơ.\"}},{\"id\":\"injury|n\",\"term\":\"injury\",\"reading\":\"/ˈɪn.dʒər.i/\",\"meaning\":\"chấn thương; vết thương\",\"definitionEn\":\"harm done to your body\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-ju-ry — Hay đi với: a sports injury · a knee injury\",\"example\":{\"text\":\"He has had a knee injury since last month.\",\"vi\":\"Anh ấy bị chấn thương đầu gối từ tháng trước.\"}},{\"id\":\"first-aid|phr-n\",\"term\":\"first aid\",\"reading\":\"/ˌfɜːst ˈeɪd/\",\"meaning\":\"sơ cứu\",\"definitionEn\":\"simple medical help given before a doctor arrives\",\"lesson\":27,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a first aid room · give first aid\"},{\"id\":\"referee|n\",\"term\":\"referee\",\"reading\":\"/ˌref.əˈriː/\",\"meaning\":\"trọng tài\",\"definitionEn\":\"a person who makes sure players follow the rules\",\"lesson\":27,\"pos\":\"n\",\"hint\":\"Trọng âm: re-fe-REE\",\"example\":{\"text\":\"The referee stopped the match because of the rain.\",\"vi\":\"Trọng tài dừng trận đấu vì trời mưa.\"}},{\"id\":\"physical-activity|phr-n\",\"term\":\"physical activity\",\"reading\":\"/ˌfɪz.ɪ.kəl ækˈtɪv.ə.ti/\",\"meaning\":\"hoạt động thể chất; vận động\",\"definitionEn\":\"any movement of the body that uses energy\",\"lesson\":27,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do physical activity · a lack of physical activity\"},{\"id\":\"take-up|phr-v\",\"term\":\"take up\",\"reading\":\"/ˌteɪk ˈʌp/\",\"meaning\":\"bắt đầu chơi / theo (một môn, sở thích)\",\"definitionEn\":\"to start a new hobby or sport\",\"lesson\":28,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: take up swimming · take up a new sport\"},{\"id\":\"give-up|phr-v\",\"term\":\"give up\",\"reading\":\"/ˌɡɪv ˈʌp/\",\"meaning\":\"bỏ (thói quen, môn học); từ bỏ\",\"definitionEn\":\"to stop doing something\",\"lesson\":28,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: give up smoking · give up football\"},{\"id\":\"keep-fit|colloc\",\"term\":\"keep fit\",\"reading\":\"/ˌkiːp ˈfɪt/\",\"meaning\":\"giữ dáng; giữ cơ thể khỏe mạnh\",\"definitionEn\":\"to stay healthy by exercising\",\"lesson\":28,\"pos\":\"colloc\",\"hint\":\"Hay đi với: keep fit by swimming · stay in shape\"},{\"id\":\"healthy-lifestyle|phr-n\",\"term\":\"healthy lifestyle\",\"reading\":\"/ˌhel.θi ˈlaɪf.staɪl/\",\"meaning\":\"lối sống lành mạnh\",\"definitionEn\":\"a way of living with good food, exercise and sleep\",\"lesson\":28,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lead a healthy lifestyle · have a healthy lifestyle\"},{\"id\":\"compete|v\",\"term\":\"compete\",\"reading\":\"/kəmˈpiːt/\",\"meaning\":\"thi đấu; cạnh tranh\",\"definitionEn\":\"to try to win against others\",\"lesson\":28,\"pos\":\"v\",\"hint\":\"Trọng âm: com-PETE — Hay đi với: compete in a tournament · compete against\"},{\"id\":\"competition|n\",\"term\":\"competition\",\"reading\":\"/ˌkɒm.pəˈtɪʃ.ən/\",\"meaning\":\"cuộc thi; sự cạnh tranh\",\"definitionEn\":\"an event in which people try to win\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"Trọng âm: com-pe-TI-tion — Hay đi với: enter a competition · win a competition\",\"example\":{\"text\":\"In hindsight, the competition helped me build my self-confidence.\",\"vi\":\"Giờ nghĩ lại, cuộc thi đã giúp tôi xây dựng sự tự tin.\"}},{\"id\":\"tournament|n\",\"term\":\"tournament\",\"reading\":\"/ˈtʊə.nə.mənt/\",\"meaning\":\"giải đấu\",\"definitionEn\":\"a series of games to find the best player or team\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"Trọng âm: TOUR-na-ment — Hay đi với: a badminton tournament · win the tournament\",\"example\":{\"text\":\"Our school team competed in a national tournament.\",\"vi\":\"Đội của trường tôi thi đấu ở một giải toàn quốc.\"}},{\"id\":\"marathon|n\",\"term\":\"marathon\",\"reading\":\"/ˈmær.ə.θən/\",\"meaning\":\"cuộc chạy marathon\",\"definitionEn\":\"a running race of about 42 kilometres\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"MA-rờ-thon. — Trọng âm: MA-ra-thon — Hay đi với: run a marathon · a half marathon\",\"example\":{\"text\":\"More than 10,000 people ran in the Hanoi Marathon.\",\"vi\":\"Hơn 10.000 người đã chạy giải Marathon Hà Nội.\"}},{\"id\":\"athlete|n\",\"term\":\"athlete\",\"reading\":\"/ˈæθ.liːt/\",\"meaning\":\"vận động viên\",\"definitionEn\":\"a person who is very good at sport\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"ATH-leet: chỉ 2 âm tiết, đừng chèn thêm e (không đọc “ath-e-lete”). — Trọng âm: ATH-lete\"},{\"id\":\"champion|n\",\"term\":\"champion\",\"reading\":\"/ˈtʃæm.pi.ən/\",\"meaning\":\"nhà vô địch\",\"definitionEn\":\"a person or team that has won a competition\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"Trọng âm: CHAM-pi-on — Hay đi với: world champion · become champion\"},{\"id\":\"medal|n\",\"term\":\"medal\",\"reading\":\"/ˈmed.əl/\",\"meaning\":\"huy chương\",\"definitionEn\":\"a metal disc given as a prize\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"Trọng âm: ME-dal — Hay đi với: win a gold medal · a silver medal\",\"example\":{\"text\":\"The whole stadium cheered when Vietnam won the gold medal.\",\"vi\":\"Cả sân vận động reo hò khi Việt Nam giành huy chương vàng.\"}},{\"id\":\"cheer|v\",\"term\":\"cheer\",\"reading\":\"/tʃɪər/\",\"meaning\":\"cổ vũ; reo hò\",\"definitionEn\":\"to shout to support a team or player\",\"lesson\":28,\"pos\":\"v\",\"hint\":\"Hay đi với: cheer for a team · cheer loudly\"},{\"id\":\"badminton|n\",\"term\":\"badminton\",\"reading\":\"/ˈbæd.mɪn.tən/\",\"meaning\":\"cầu lông\",\"definitionEn\":\"a game where players hit a shuttlecock over a net\",\"lesson\":28,\"pos\":\"n\",\"hint\":\"Trọng âm: BAD-min-ton — Hay đi với: play badminton · a badminton court\",\"example\":{\"text\":\"I used to play badminton with my father every Sunday.\",\"vi\":\"Ngày xưa Chủ nhật nào tôi cũng chơi cầu lông với bố.\"}},{\"id\":\"energetic|adj\",\"term\":\"energetic\",\"reading\":\"/ˌen.əˈdʒet.ɪk/\",\"meaning\":\"tràn đầy năng lượng\",\"definitionEn\":\"full of energy and very active\",\"lesson\":28,\"pos\":\"adj\",\"hint\":\"Trọng âm: e-ner-GE-tic\",\"example\":{\"text\":\"Morning exercise makes me feel energetic all day.\",\"vi\":\"Tập thể dục buổi sáng giúp tôi tràn đầy năng lượng cả ngày.\"}},{\"id\":\"exhausted|adj\",\"term\":\"exhausted\",\"reading\":\"/ɪɡˈzɔː.stɪd/\",\"meaning\":\"kiệt sức\",\"definitionEn\":\"extremely tired\",\"lesson\":28,\"pos\":\"adj\",\"hint\":\"ig-ZAW-stid: chữ h câm. — Trọng âm: ex-HAUS-ted\",\"example\":{\"text\":\"After the race I was exhausted but very proud.\",\"vi\":\"Sau cuộc đua tôi kiệt sức nhưng rất tự hào.\"}},{\"id\":\"memorable|adj\",\"term\":\"memorable\",\"reading\":\"/ˈmem.ər.ə.bəl/\",\"meaning\":\"đáng nhớ\",\"definitionEn\":\"worth remembering; special\",\"lesson\":28,\"pos\":\"adj\",\"hint\":\"Trọng âm: ME-mo-ra-ble — Hay đi với: a memorable day · a memorable experience\",\"example\":{\"text\":\"It was one of the most memorable days of my life.\",\"vi\":\"Đó là một trong những ngày đáng nhớ nhất đời tôi.\"}},{\"id\":\"crime|n\",\"term\":\"crime\",\"reading\":\"/kraɪm/\",\"meaning\":\"tội phạm; tội ác\",\"definitionEn\":\"an action that is against the law\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: commit a crime · the crime rate\",\"example\":{\"text\":\"Strict law enforcement is needed to reduce violent crime.\",\"vi\":\"Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực.\"}},{\"id\":\"criminal|n\",\"term\":\"criminal\",\"reading\":\"/ˈkrɪm.ɪ.nəl/\",\"meaning\":\"tội phạm (người)\",\"definitionEn\":\"a person who has broken the law\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: CRI-mi-nal\",\"example\":{\"text\":\"The criminal was caught by a security guard.\",\"vi\":\"Kẻ phạm tội bị một bảo vệ bắt được.\"}},{\"id\":\"offender|n\",\"term\":\"offender\",\"reading\":\"/əˈfen.dər/\",\"meaning\":\"người phạm tội\",\"definitionEn\":\"a person who has committed a crime (formal)\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: of-FEN-der — Hay đi với: young offenders · first-time offenders\"},{\"id\":\"commit|v\",\"term\":\"commit\",\"reading\":\"/kəˈmɪt/\",\"meaning\":\"phạm (tội)\",\"definitionEn\":\"to do something wrong or illegal\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Trọng âm: com-MIT — Hay đi với: commit a crime · commit an offence\"},{\"id\":\"steal|v\",\"term\":\"steal\",\"reading\":\"/stiːl/\",\"meaning\":\"ăn trộm; lấy cắp\",\"definitionEn\":\"to take something that is not yours\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Hay đi với: steal a phone · have something stolen\"},{\"id\":\"thief|n\",\"term\":\"thief\",\"reading\":\"/θiːf/\",\"meaning\":\"kẻ trộm\",\"definitionEn\":\"a person who takes things that are not theirs\",\"lesson\":29,\"pos\":\"n\",\"example\":{\"text\":\"The thief will be sent to prison for two years.\",\"vi\":\"Tên trộm sẽ bị đưa vào tù hai năm.\"}},{\"id\":\"arrest|v\",\"term\":\"arrest\",\"reading\":\"/əˈrest/\",\"meaning\":\"bắt giữ\",\"definitionEn\":\"(of police) to take someone away because of a crime\",\"lesson\":29,\"pos\":\"v\",\"hint\":\"Trọng âm: ar-REST — Hay đi với: be arrested for stealing · arrest a suspect\"},{\"id\":\"victim|n\",\"term\":\"victim\",\"reading\":\"/ˈvɪk.tɪm/\",\"meaning\":\"nạn nhân\",\"definitionEn\":\"a person who is hurt or harmed by a crime\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: VIC-tim — Hay đi với: a crime victim · the victim of a robbery\",\"example\":{\"text\":\"The victim told the police what happened.\",\"vi\":\"Nạn nhân kể cho cảnh sát chuyện đã xảy ra.\"}},{\"id\":\"witness|n\",\"term\":\"witness\",\"reading\":\"/ˈwɪt.nəs/\",\"meaning\":\"nhân chứng\",\"definitionEn\":\"a person who sees a crime or accident happen\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: WIT-ness — Hay đi với: a witness to the crime\",\"example\":{\"text\":\"A witness saw the car and remembered the number.\",\"vi\":\"Một nhân chứng thấy chiếc xe và nhớ biển số.\"}},{\"id\":\"law|n\",\"term\":\"law\",\"reading\":\"/lɔː/\",\"meaning\":\"luật; pháp luật\",\"definitionEn\":\"the system of rules of a country\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: break the law · obey the law\",\"example\":{\"text\":\"A new law against drink-driving is being discussed.\",\"vi\":\"Một luật mới chống lái xe khi say rượu đang được thảo luận.\"}},{\"id\":\"illegal|adj\",\"term\":\"illegal\",\"reading\":\"/ɪˈliː.ɡəl/\",\"meaning\":\"bất hợp pháp\",\"definitionEn\":\"against the law\",\"lesson\":29,\"pos\":\"adj\",\"hint\":\"Trọng âm: il-LE-gal — Hay đi với: illegal drugs · it is illegal to…\",\"example\":{\"text\":\"It is illegal to drive without a licence.\",\"vi\":\"Lái xe không có bằng là bất hợp pháp.\"}},{\"id\":\"judge|n\",\"term\":\"judge\",\"reading\":\"/dʒʌdʒ/\",\"meaning\":\"thẩm phán\",\"definitionEn\":\"the person who decides cases in a court\",\"lesson\":29,\"pos\":\"n\",\"example\":{\"text\":\"Don't judge people by their appearance.\",\"vi\":\"Đừng đánh giá người khác qua vẻ bề ngoài.\"}},{\"id\":\"punishment|n\",\"term\":\"punishment\",\"reading\":\"/ˈpʌn.ɪʃ.mənt/\",\"meaning\":\"hình phạt\",\"definitionEn\":\"a penalty for doing something wrong\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: PU-nish-ment — Hay đi với: a harsh punishment · a fair punishment\",\"example\":{\"text\":\"Some people think prison is not the best punishment for young offenders.\",\"vi\":\"Một số người cho rằng tù không phải hình phạt tốt nhất cho người phạm tội trẻ tuổi.\"}},{\"id\":\"prison|n\",\"term\":\"prison\",\"reading\":\"/ˈprɪz.ən/\",\"meaning\":\"nhà tù\",\"definitionEn\":\"a building where criminals are kept\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Trọng âm: PRI-son — Hay đi với: go to prison · be sent to prison\",\"example\":{\"text\":\"One disadvantage of prison is its high cost.\",\"vi\":\"Một nhược điểm của nhà tù là chi phí cao.\"}},{\"id\":\"fine|n\",\"term\":\"fine\",\"reading\":\"/faɪn/\",\"meaning\":\"tiền phạt\",\"definitionEn\":\"money you must pay as a penalty\",\"lesson\":29,\"pos\":\"n\",\"hint\":\"Hay đi với: pay a fine · a heavy fine\",\"example\":{\"text\":\"He had to pay a fine for parking on the pavement.\",\"vi\":\"Anh ấy phải nộp phạt vì đỗ xe trên vỉa hè.\"}},{\"id\":\"security-camera|phr-n\",\"term\":\"security camera\",\"reading\":\"/sɪˈkjʊə.rə.ti ˌkæm.rə/\",\"meaning\":\"camera an ninh\",\"definitionEn\":\"a camera that records an area to prevent crime\",\"lesson\":29,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: install security cameras · CCTV\"},{\"id\":\"advantage|n\",\"term\":\"advantage\",\"reading\":\"/ədˈvɑːn.tɪdʒ/\",\"meaning\":\"ưu điểm; lợi thế\",\"definitionEn\":\"something that helps you or makes a situation better\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: ad-VAN-tage — Hay đi với: the main advantage of… · have an advantage\",\"example\":{\"text\":\"The main advantage of community service is that offenders help society.\",\"vi\":\"Ưu điểm chính của lao động công ích là người phạm tội giúp ích cho xã hội.\"}},{\"id\":\"disadvantage|n\",\"term\":\"disadvantage\",\"reading\":\"/ˌdɪs.ədˈvɑːn.tɪdʒ/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"something that causes problems\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: dis-ad-VAN-tage — Hay đi với: a serious disadvantage · the disadvantages of…\",\"example\":{\"text\":\"One disadvantage of prison is its high cost.\",\"vi\":\"Một nhược điểm của nhà tù là chi phí cao.\"}},{\"id\":\"outweigh|v\",\"term\":\"outweigh\",\"reading\":\"/ˌaʊtˈweɪ/\",\"meaning\":\"lớn hơn; quan trọng hơn (khi cân nhắc)\",\"definitionEn\":\"to be greater or more important than\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: out-WEIGH — Hay đi với: the advantages outweigh the disadvantages\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"society|n\",\"term\":\"society\",\"reading\":\"/səˈsaɪ.ə.ti/\",\"meaning\":\"xã hội\",\"definitionEn\":\"people living together in a community or country\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: so-CI-e-ty — Hay đi với: modern society · in society\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"public-safety|phr-n\",\"term\":\"public safety\",\"reading\":\"/ˌpʌb.lɪk ˈseɪf.ti/\",\"meaning\":\"an toàn công cộng\",\"definitionEn\":\"the protection of everyone from danger\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve public safety · a threat to public safety\"},{\"id\":\"crime-rate|phr-n\",\"term\":\"crime rate\",\"reading\":\"/ˈkraɪm ˌreɪt/\",\"meaning\":\"tỉ lệ tội phạm\",\"definitionEn\":\"the number of crimes in an area during a period\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce the crime rate · a high crime rate\"},{\"id\":\"deter|v\",\"term\":\"deter\",\"reading\":\"/dɪˈtɜːr/\",\"meaning\":\"răn đe; ngăn chặn (ai làm gì)\",\"definitionEn\":\"to make someone decide not to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: de-TER — Hay đi với: deter crime · deter people from committing crimes\",\"example\":{\"text\":\"Security cameras can deter crime. In addition, they help the police find criminals.\",\"vi\":\"Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.\"}},{\"id\":\"prevent|v\",\"term\":\"prevent\",\"reading\":\"/prɪˈvent/\",\"meaning\":\"ngăn chặn; phòng ngừa\",\"definitionEn\":\"to stop something from happening\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-VENT — Hay đi với: prevent crime · prevent somebody from + V-ing\",\"example\":{\"text\":\"Better street lights can prevent people from committing crimes at night.\",\"vi\":\"Đèn đường tốt hơn có thể ngăn người ta phạm tội vào ban đêm.\"}},{\"id\":\"encourage|v\",\"term\":\"encourage\",\"reading\":\"/ɪnˈkʌr.ɪdʒ/\",\"meaning\":\"khuyến khích; động viên\",\"definitionEn\":\"to give someone confidence or support to do something\",\"lesson\":30,\"pos\":\"v\",\"hint\":\"Trọng âm: en-COU-rage — Hay đi với: encourage somebody to + V\",\"example\":{\"text\":\"Schools should encourage students to follow the law.\",\"vi\":\"Trường học nên khuyến khích học sinh tuân thủ pháp luật.\"}},{\"id\":\"harsh|adj\",\"term\":\"harsh\",\"reading\":\"/hɑːʃ/\",\"meaning\":\"khắc nghiệt; nghiêm khắc\",\"definitionEn\":\"very severe or unkind\",\"lesson\":30,\"pos\":\"adj\",\"hint\":\"Hay đi với: a harsh punishment · harsh laws\",\"example\":{\"text\":\"Some people think harsh punishments are the best way to protect public safety.\",\"vi\":\"Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng.\"}},{\"id\":\"community-service|phr-n\",\"term\":\"community service\",\"reading\":\"/kəˌmjuː.nə.ti ˈsɜː.vɪs/\",\"meaning\":\"lao động công ích (hình phạt thay tù)\",\"definitionEn\":\"unpaid work in the local area as a punishment\",\"lesson\":30,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do community service · be sentenced to community service\"},{\"id\":\"freedom|n\",\"term\":\"freedom\",\"reading\":\"/ˈfriː.dəm/\",\"meaning\":\"sự tự do\",\"definitionEn\":\"the right to do what you want\",\"lesson\":30,\"pos\":\"n\",\"hint\":\"Trọng âm: FREE-dom — Hay đi với: personal freedom · freedom of speech\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"in-addition|idiom\",\"term\":\"in addition\",\"reading\":\"/ɪn əˈdɪʃ.ən/\",\"meaning\":\"thêm vào đó; ngoài ra\",\"definitionEn\":\"also; used to add another point\",\"lesson\":30,\"pos\":\"idiom\",\"hint\":\"Hay đi với: In addition, … · in addition to + N/V-ing\"},{\"id\":\"on-the-other-hand|idiom\",\"term\":\"on the other hand\",\"reading\":\"/ɒn ði ˈʌð.ər ˌhænd/\",\"meaning\":\"mặt khác (nêu ý đối lập)\",\"definitionEn\":\"used to introduce an opposite point\",\"lesson\":30,\"pos\":\"idiom\"},{\"id\":\"however|adv\",\"term\":\"however\",\"reading\":\"/haʊˈev.ər/\",\"meaning\":\"tuy nhiên\",\"definitionEn\":\"but; used to show contrast\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"hau-EV-ờ: nhấn âm 2. — Trọng âm: how-E-ver\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"}},{\"id\":\"therefore|adv\",\"term\":\"therefore\",\"reading\":\"/ˈðeə.fɔːr/\",\"meaning\":\"vì vậy; do đó\",\"definitionEn\":\"for that reason; as a result\",\"lesson\":30,\"pos\":\"adv\",\"hint\":\"Trọng âm: THERE-fore\",\"example\":{\"text\":\"Cameras record everything. Therefore, it is easier to find witnesses.\",\"vi\":\"Camera ghi lại mọi thứ. Vì vậy, việc tìm nhân chứng dễ hơn.\"}},{\"id\":\"nuclear-family|phr-n\",\"term\":\"nuclear family\",\"reading\":\"/ˌnjuː.kli.ə ˈfæm.əl.i/\",\"meaning\":\"gia đình hạt nhân (bố mẹ và con cái)\",\"definitionEn\":\"a family of just parents and their children\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: live in a nuclear family · the traditional nuclear family\"},{\"id\":\"extended-family|phr-n\",\"term\":\"extended family\",\"reading\":\"/ɪkˌsten.dɪd ˈfæm.əl.i/\",\"meaning\":\"đại gia đình (ông bà, cô chú… sống chung hoặc gắn bó)\",\"definitionEn\":\"a family including grandparents, aunts and uncles\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: live with your extended family · members of the extended family\"},{\"id\":\"generation-gap|phr-n\",\"term\":\"generation gap\",\"reading\":\"/ˌdʒen.əˈreɪ.ʃən ɡæp/\",\"meaning\":\"khoảng cách thế hệ\",\"definitionEn\":\"differences in ideas between young and old people\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Trọng âm: gen-e-RA-tion gap — Hay đi với: bridge the generation gap · a wide generation gap\"},{\"id\":\"work-life-balance|phr-n\",\"term\":\"work-life balance\",\"reading\":\"/ˌwɜːk ˈlaɪf ˌbæl.əns/\",\"meaning\":\"cân bằng giữa công việc và cuộc sống\",\"definitionEn\":\"dividing time well between your job and personal life\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have a good work-life balance · improve your work-life balance\"},{\"id\":\"bring-up|phr-v\",\"term\":\"bring up\",\"reading\":\"/ˌbrɪŋ ˈʌp/\",\"meaning\":\"nuôi dạy (con cái)\",\"definitionEn\":\"to look after and educate a child until adulthood\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: bring up children · be brought up by your grandparents\"},{\"id\":\"household-chore|phr-n\",\"term\":\"household chore\",\"reading\":\"/ˌhaʊs.həʊld ˈtʃɔːr/\",\"meaning\":\"việc nhà\",\"definitionEn\":\"a regular job at home, e.g. washing dishes\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: do household chores · share the household chores\"},{\"id\":\"look-after|phr-v\",\"term\":\"look after\",\"reading\":\"/ˌlʊk ˈɑːf.tər/\",\"meaning\":\"chăm sóc; trông nom\",\"definitionEn\":\"to take care of someone or something\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look after children · look after elderly parents\"},{\"id\":\"elderly|adj\",\"term\":\"elderly\",\"reading\":\"/ˈel.dəl.i/\",\"meaning\":\"cao tuổi (cách nói lịch sự)\",\"definitionEn\":\"old (a polite word)\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Trọng âm: EL-der-ly — Hay đi với: elderly parents · the elderly\",\"example\":{\"text\":\"Elderly people are particularly vulnerable to heatwaves.\",\"vi\":\"Người cao tuổi đặc biệt dễ bị ảnh hưởng bởi các đợt nắng nóng.\"}},{\"id\":\"retire|v\",\"term\":\"retire\",\"reading\":\"/rɪˈtaɪər/\",\"meaning\":\"nghỉ hưu\",\"definitionEn\":\"to stop working because of age\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: re-TIRE — Hay đi với: retire at 60 · retire from work\"},{\"id\":\"responsibility|n\",\"term\":\"responsibility\",\"reading\":\"/rɪˌspɒn.səˈbɪl.ə.ti/\",\"meaning\":\"trách nhiệm\",\"definitionEn\":\"a duty to take care of something\",\"lesson\":31,\"pos\":\"n\",\"hint\":\"Trọng âm: re-spon-si-BI-li-ty — Hay đi với: take responsibility for · share the responsibility\",\"example\":{\"text\":\"Children will learn responsibility if they do household chores.\",\"vi\":\"Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà.\"}},{\"id\":\"support|v\",\"term\":\"support\",\"reading\":\"/səˈpɔːt/\",\"meaning\":\"hỗ trợ; nuôi (về tài chính)\",\"definitionEn\":\"to help someone, often with money\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: sup-PORT — Hay đi với: support your family · support elderly parents financially\",\"example\":{\"text\":\"It is important to support local businesses in small towns.\",\"vi\":\"Việc ủng hộ các doanh nghiệp địa phương ở thị trấn nhỏ là rất quan trọng.\"}},{\"id\":\"relationship|n\",\"term\":\"relationship\",\"reading\":\"/rɪˈleɪ.ʃən.ʃɪp/\",\"meaning\":\"mối quan hệ\",\"definitionEn\":\"the way people are connected or behave towards each other\",\"lesson\":31,\"pos\":\"n\",\"hint\":\"Trọng âm: re-LA-tion-ship — Hay đi với: a close relationship with · build a good relationship\"},{\"id\":\"respect|v\",\"term\":\"respect\",\"reading\":\"/rɪˈspekt/\",\"meaning\":\"tôn trọng; kính trọng\",\"definitionEn\":\"to admire someone and treat them politely\",\"lesson\":31,\"pos\":\"v\",\"hint\":\"Trọng âm: re-SPECT — Hay đi với: respect your elders · respect other people's opinions\",\"example\":{\"text\":\"Visitors should respect local customs, for example by dressing politely in temples.\",\"vi\":\"Du khách nên tôn trọng phong tục địa phương, ví dụ ăn mặc lịch sự trong chùa.\"}},{\"id\":\"get-on-with|phr-v\",\"term\":\"get on with\",\"reading\":\"/ˌɡet ˈɒn wɪð/\",\"meaning\":\"hòa hợp với (ai)\",\"definitionEn\":\"to have a friendly relationship with someone\",\"lesson\":31,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: get on well with · not get on with\"},{\"id\":\"single-parent|phr-n\",\"term\":\"single parent\",\"reading\":\"/ˌsɪŋ.ɡəl ˈpeə.rənt/\",\"meaning\":\"cha/mẹ đơn thân\",\"definitionEn\":\"a mother or father raising children alone\",\"lesson\":31,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a single-parent family · be brought up by a single parent\"},{\"id\":\"traditional|adj\",\"term\":\"traditional\",\"reading\":\"/trəˈdɪʃ.ən.əl/\",\"meaning\":\"truyền thống\",\"definitionEn\":\"following customs from the past\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Trọng âm: tra-DI-tion-al — Hay đi với: traditional values · traditional gender roles\",\"example\":{\"text\":\"Instead of eating fast food, we should try traditional dishes.\",\"vi\":\"Thay vì ăn đồ ăn nhanh, chúng ta nên thử các món truyền thống.\"}},{\"id\":\"close-knit|adj\",\"term\":\"close-knit\",\"reading\":\"/ˌkləʊsˈnɪt/\",\"meaning\":\"gắn bó khăng khít\",\"definitionEn\":\"(of a group) whose members care about each other\",\"lesson\":31,\"pos\":\"adj\",\"hint\":\"Hay đi với: a close-knit family · a close-knit community\"},{\"id\":\"unless|conj\",\"term\":\"unless\",\"reading\":\"/ənˈles/\",\"meaning\":\"trừ khi; nếu … không\",\"definitionEn\":\"except if\",\"lesson\":31,\"pos\":\"conj\",\"hint\":\"Trọng âm: un-LESS — Hay đi với: unless you hurry · unless it rains\",\"example\":{\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"}},{\"id\":\"gender-role|phr-n\",\"term\":\"gender role\",\"reading\":\"/ˈdʒen.də ˌrəʊl/\",\"meaning\":\"vai trò giới (việc được cho là của nam hoặc nữ)\",\"definitionEn\":\"behaviour society expects from men or from women\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: traditional gender roles · challenge gender roles\"},{\"id\":\"equality|n\",\"term\":\"equality\",\"reading\":\"/iˈkwɒl.ə.ti/\",\"meaning\":\"sự bình đẳng\",\"definitionEn\":\"the same rights and chances for everyone\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: e-QUAL-i-ty — Hay đi với: gender equality · equality between men and women\",\"example\":{\"text\":\"Gender equality starts at home, when boys and girls do the same household chores.\",\"vi\":\"Bình đẳng giới bắt đầu từ trong nhà, khi con trai và con gái cùng làm việc nhà như nhau.\"}},{\"id\":\"role-model|phr-n\",\"term\":\"role model\",\"reading\":\"/ˈrəʊl ˌmɒd.əl/\",\"meaning\":\"tấm gương (để noi theo)\",\"definitionEn\":\"a person others admire and try to copy\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a good role model for · act as a role model\"},{\"id\":\"influence|v\",\"term\":\"influence\",\"reading\":\"/ˈɪn.flu.əns/\",\"meaning\":\"ảnh hưởng đến\",\"definitionEn\":\"to have an effect on someone's behaviour or ideas\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"Trọng âm: IN-flu-ence — Hay đi với: influence children's behaviour · be influenced by friends\",\"example\":{\"text\":\"A happy childhood can have a positive influence on a person's attitude to life.\",\"vi\":\"Một tuổi thơ hạnh phúc có thể ảnh hưởng tích cực đến thái độ sống của một người.\"}},{\"id\":\"value|n\",\"term\":\"value\",\"reading\":\"/ˈvæl.juː/\",\"meaning\":\"giá trị, quan niệm sống (số nhiều: values); giá trị (của đồ vật)\",\"definitionEn\":\"a belief about what is important in life; or what something is worth\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Hay đi với: family values · traditional values\",\"example\":{\"text\":\"The table shows that the total value of exports doubled over the period.\",\"vi\":\"Bảng cho thấy tổng giá trị xuất khẩu tăng gấp đôi trong giai đoạn này.\"}},{\"id\":\"peer-pressure|phr-n\",\"term\":\"peer pressure\",\"reading\":\"/ˈpɪə ˌpreʃ.ər/\",\"meaning\":\"áp lực đồng trang lứa\",\"definitionEn\":\"pressure from people your age to behave like them\",\"lesson\":32,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: give in to peer pressure · under peer pressure\"},{\"id\":\"discipline|n\",\"term\":\"discipline\",\"reading\":\"/ˈdɪs.ə.plɪn/\",\"meaning\":\"kỷ luật; sự rèn luyện kỷ luật\",\"definitionEn\":\"training people to follow rules and control themselves\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: DIS-ci-pline — Hay đi với: strict discipline · self-discipline\"},{\"id\":\"strict|adj\",\"term\":\"strict\",\"reading\":\"/strɪkt/\",\"meaning\":\"nghiêm khắc\",\"definitionEn\":\"demanding that rules are followed\",\"lesson\":32,\"pos\":\"adj\",\"hint\":\"Hay đi với: strict parents · be strict with children\",\"example\":{\"text\":\"Strict law enforcement is needed to reduce violent crime.\",\"vi\":\"Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực.\"}},{\"id\":\"spoil|v\",\"term\":\"spoil\",\"reading\":\"/spɔɪl/\",\"meaning\":\"nuông chiều (làm hư); làm hỏng\",\"definitionEn\":\"to give a child everything they want, making them behave badly\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"Hay đi với: spoil a child · spoiled children\",\"example\":{\"text\":\"Grandparents sometimes spoil their grandchildren by giving them too many sweets.\",\"vi\":\"Ông bà đôi khi nuông chiều cháu bằng cách cho chúng quá nhiều bánh kẹo.\"}},{\"id\":\"communicate|v\",\"term\":\"communicate\",\"reading\":\"/kəˈmjuː.nɪ.keɪt/\",\"meaning\":\"giao tiếp; trao đổi\",\"definitionEn\":\"to share ideas or information with others\",\"lesson\":32,\"pos\":\"v\",\"hint\":\"kờ-MYU-ni-keit: nhấn âm 2. — Trọng âm: com-MU-ni-cate — Hay đi với: communicate with your parents · communicate clearly\",\"example\":{\"text\":\"If parents are too strict, their children may not communicate with them openly.\",\"vi\":\"Nếu bố mẹ quá nghiêm khắc, con cái có thể không cởi mở trò chuyện với họ.\"}},{\"id\":\"behaviour|n\",\"term\":\"behaviour\",\"reading\":\"/bɪˈheɪ.vjər/\",\"meaning\":\"hành vi; cách cư xử\",\"definitionEn\":\"the way someone acts\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"bi-HEIV-yờ: nhấn âm 2; Anh-Anh viết có u (Mỹ: behavior). — Trọng âm: be-HA-viour — Hay đi với: good behaviour · children's behaviour\",\"example\":{\"text\":\"Children learn good behaviour mainly from their families, not from school.\",\"vi\":\"Trẻ học cách cư xử tốt chủ yếu từ gia đình, không phải từ trường học.\"}},{\"id\":\"childhood|n\",\"term\":\"childhood\",\"reading\":\"/ˈtʃaɪld.hʊd/\",\"meaning\":\"thời thơ ấu\",\"definitionEn\":\"the period of your life when you are a child\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Hay đi với: a happy childhood · in my childhood\",\"example\":{\"text\":\"Much childhood obesity stems from the high consumption of sugary drinks.\",\"vi\":\"Phần lớn béo phì ở trẻ bắt nguồn từ việc tiêu thụ nhiều đồ uống có đường.\"}},{\"id\":\"teenager|n\",\"term\":\"teenager\",\"reading\":\"/ˈtiːnˌeɪ.dʒər/\",\"meaning\":\"thiếu niên (13–19 tuổi)\",\"definitionEn\":\"a person aged between 13 and 19\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: TEEN-a-ger — Hay đi với: as a teenager · teenagers and their parents\"},{\"id\":\"expectation|n\",\"term\":\"expectation\",\"reading\":\"/ˌek.spekˈteɪ.ʃən/\",\"meaning\":\"sự kỳ vọng\",\"definitionEn\":\"a belief about what should or will happen\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-pec-TA-tion — Hay đi với: high expectations · parents' expectations\"},{\"id\":\"attitude|n\",\"term\":\"attitude\",\"reading\":\"/ˈæt.ɪ.tʃuːd/\",\"meaning\":\"thái độ; quan điểm\",\"definitionEn\":\"the way you think or feel about something\",\"lesson\":32,\"pos\":\"n\",\"hint\":\"Trọng âm: AT-ti-tude — Hay đi với: attitude to/towards · a positive attitude\",\"example\":{\"text\":\"A happy childhood can have a positive influence on a person's attitude to life.\",\"vi\":\"Một tuổi thơ hạnh phúc có thể ảnh hưởng tích cực đến thái độ sống của một người.\"}},{\"id\":\"nowadays|adv\",\"term\":\"nowadays\",\"reading\":\"/ˈnaʊ.ə.deɪz/\",\"meaning\":\"ngày nay\",\"definitionEn\":\"at the present time\",\"lesson\":32,\"pos\":\"adv\",\"hint\":\"NAU-ờ-deiz: now + a + days.\",\"example\":{\"text\":\"Nowadays, teenagers are influenced more by social media than by their parents.\",\"vi\":\"Ngày nay, thanh thiếu niên chịu ảnh hưởng từ mạng xã hội nhiều hơn từ bố mẹ.\"}},{\"id\":\"due-to|prep\",\"term\":\"due to\",\"reading\":\"/ˈdʒuː tuː/\",\"meaning\":\"do; bởi vì (+ danh từ)\",\"definitionEn\":\"because of\",\"lesson\":32,\"pos\":\"prep\",\"hint\":\"Hay đi với: due to work pressure · due to the high cost\"},{\"id\":\"for-instance|idiom\",\"term\":\"for instance\",\"reading\":\"/fər ˈɪn.stəns/\",\"meaning\":\"ví dụ (= for example)\",\"definitionEn\":\"for example\",\"lesson\":32,\"pos\":\"idiom\"},{\"id\":\"such-as|prep\",\"term\":\"such as\",\"reading\":\"/ˈsʌtʃ əz/\",\"meaning\":\"chẳng hạn như (+ danh từ, đứng trong câu)\",\"definitionEn\":\"used before giving examples\",\"lesson\":32,\"pos\":\"prep\",\"hint\":\"Hay đi với: household chores such as cooking and cleaning\"},{\"id\":\"cultural-heritage|phr-n\",\"term\":\"cultural heritage\",\"reading\":\"/ˌkʌl.tʃər.əl ˈher.ɪ.tɪdʒ/\",\"meaning\":\"di sản văn hóa\",\"definitionEn\":\"traditions, buildings and art passed down from the past\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect cultural heritage · part of our cultural heritage\"},{\"id\":\"mass-tourism|phr-n\",\"term\":\"mass tourism\",\"reading\":\"/ˌmæs ˈtʊə.rɪ.zəm/\",\"meaning\":\"du lịch đại trà (lượng khách rất đông)\",\"definitionEn\":\"travel by very large numbers of people to the same places\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the effects of mass tourism · suffer from mass tourism\"},{\"id\":\"tourism|n\",\"term\":\"tourism\",\"reading\":\"/ˈtʊə.rɪ.zəm/\",\"meaning\":\"ngành du lịch; hoạt động du lịch\",\"definitionEn\":\"the business of providing services for people on holiday\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"TUƠ-ri-zờm. — Trọng âm: TOU-ri-sm — Hay đi với: the tourism industry · promote tourism\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"culture|n\",\"term\":\"culture\",\"reading\":\"/ˈkʌl.tʃər/\",\"meaning\":\"văn hóa\",\"definitionEn\":\"the customs, arts and beliefs of a group of people\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: local culture · learn about a different culture\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"cultural-identity|phr-n\",\"term\":\"cultural identity\",\"reading\":\"/ˌkʌl.tʃər.əl aɪˈden.tə.ti/\",\"meaning\":\"bản sắc văn hóa\",\"definitionEn\":\"a sense of belonging to a group with shared traditions\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lose its cultural identity · keep a strong cultural identity\"},{\"id\":\"preserve|v\",\"term\":\"preserve\",\"reading\":\"/prɪˈzɜːv/\",\"meaning\":\"bảo tồn; giữ gìn\",\"definitionEn\":\"to keep something in its original state\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: pre-SERVE — Hay đi với: preserve traditions · preserve old buildings\",\"example\":{\"text\":\"Young people should learn about their cultural heritage and preserve old traditions.\",\"vi\":\"Người trẻ nên tìm hiểu di sản văn hóa của mình và giữ gìn các truyền thống cũ.\"}},{\"id\":\"tradition|n\",\"term\":\"tradition\",\"reading\":\"/trəˈdɪʃ.ən/\",\"meaning\":\"truyền thống\",\"definitionEn\":\"a custom passed from one generation to the next\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"trờ-DI-shờn: nhấn âm 2. — Trọng âm: tra-DI-tion — Hay đi với: keep a tradition alive · follow a tradition\"},{\"id\":\"custom|n\",\"term\":\"custom\",\"reading\":\"/ˈkʌs.təm/\",\"meaning\":\"phong tục\",\"definitionEn\":\"a usual way of doing something in a society\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: local customs · respect the customs of\"},{\"id\":\"ancient|adj\",\"term\":\"ancient\",\"reading\":\"/ˈeɪn.ʃənt/\",\"meaning\":\"cổ; cổ xưa\",\"definitionEn\":\"very old; from a long time ago\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Hay đi với: an ancient town · ancient temples\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"historic|adj\",\"term\":\"historic\",\"reading\":\"/hɪˈstɒr.ɪk/\",\"meaning\":\"có tính lịch sử; quan trọng về mặt lịch sử\",\"definitionEn\":\"important in history\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: his-TOR-ic — Hay đi với: a historic building · the historic centre\",\"example\":{\"text\":\"If I were the mayor, I would ban motorbikes in the historic centre.\",\"vi\":\"Nếu tôi là thị trưởng, tôi sẽ cấm xe máy ở khu trung tâm lịch sử.\"}},{\"id\":\"landmark|n\",\"term\":\"landmark\",\"reading\":\"/ˈlænd.mɑːk/\",\"meaning\":\"công trình/địa danh biểu tượng\",\"definitionEn\":\"a famous building or place that is easy to recognise\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: a famous landmark · a national landmark\",\"example\":{\"text\":\"The bridge is the town's most famous landmark and appears on many postcards.\",\"vi\":\"Cây cầu là địa danh nổi tiếng nhất của thị trấn và xuất hiện trên nhiều bưu thiếp.\"}},{\"id\":\"overcrowded|adj\",\"term\":\"overcrowded\",\"reading\":\"/ˌəʊ.vəˈkraʊ.dɪd/\",\"meaning\":\"quá đông đúc\",\"definitionEn\":\"having too many people\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: o-ver-CROW-ded — Hay đi với: overcrowded streets · become overcrowded\",\"example\":{\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"}},{\"id\":\"authentic|adj\",\"term\":\"authentic\",\"reading\":\"/ɔːˈθen.tɪk/\",\"meaning\":\"đích thực; nguyên bản\",\"definitionEn\":\"real and original, not a copy\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: au-THEN-tic — Hay đi với: authentic local food · an authentic experience\",\"example\":{\"text\":\"If I were you, I would try authentic local food instead of pizza.\",\"vi\":\"Nếu tôi là bạn, tôi sẽ thử món ăn địa phương đích thực thay vì pizza.\"}},{\"id\":\"local-resident|phr-n\",\"term\":\"local resident\",\"reading\":\"/ˌləʊ.kəl ˈrez.ɪ.dənt/\",\"meaning\":\"cư dân địa phương\",\"definitionEn\":\"a person who lives in a particular area\",\"lesson\":33,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: local residents complain about · the needs of local residents\"},{\"id\":\"restore|v\",\"term\":\"restore\",\"reading\":\"/rɪˈstɔːr/\",\"meaning\":\"trùng tu; khôi phục\",\"definitionEn\":\"to repair something old to its original condition\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: re-STORE — Hay đi với: restore an old house · be carefully restored\",\"example\":{\"text\":\"The government has spent a lot of money to restore the old temples.\",\"vi\":\"Chính phủ đã chi nhiều tiền để trùng tu các ngôi chùa cổ.\"}},{\"id\":\"damage|v\",\"term\":\"damage\",\"reading\":\"/ˈdæm.ɪdʒ/\",\"meaning\":\"làm hư hại\",\"definitionEn\":\"to harm or break something\",\"lesson\":33,\"pos\":\"v\",\"hint\":\"Trọng âm: DAM-age — Hay đi với: damage old buildings · be badly damaged\",\"example\":{\"text\":\"Mass tourism can damage ancient buildings and pollute beaches.\",\"vi\":\"Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển.\"}},{\"id\":\"unique|adj\",\"term\":\"unique\",\"reading\":\"/juːˈniːk/\",\"meaning\":\"độc nhất; độc đáo\",\"definitionEn\":\"being the only one of its kind\",\"lesson\":33,\"pos\":\"adj\",\"hint\":\"Trọng âm: u-NIQUE — Hay đi với: a unique culture · unique to this region\",\"example\":{\"text\":\"Each region of Vietnam has a unique culture with its own food and music.\",\"vi\":\"Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng.\"}},{\"id\":\"festival|n\",\"term\":\"festival\",\"reading\":\"/ˈfes.tɪ.vəl/\",\"meaning\":\"lễ hội\",\"definitionEn\":\"a special time of celebration\",\"lesson\":33,\"pos\":\"n\",\"hint\":\"Hay đi với: a lantern festival · hold a festival\",\"example\":{\"text\":\"Critics say the festival has become too commercialised.\",\"vi\":\"Những người chỉ trích nói lễ hội đã bị thương mại hóa quá mức.\"}},{\"id\":\"bar-chart|phr-n\",\"term\":\"bar chart\",\"reading\":\"/ˈbɑː ˌtʃɑːt/\",\"meaning\":\"biểu đồ cột\",\"definitionEn\":\"a graph that uses rectangles of different heights to compare amounts\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the bar chart compares · the bar chart shows\"},{\"id\":\"destination|n\",\"term\":\"destination\",\"reading\":\"/ˌdes.tɪˈneɪ.ʃən/\",\"meaning\":\"điểm đến\",\"definitionEn\":\"the place where someone is going\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: des-ti-NA-tion — Hay đi với: a popular tourist destination · a holiday destination\",\"example\":{\"text\":\"Da Nang was the second most popular destination in both years.\",\"vi\":\"Đà Nẵng là điểm đến được ưa chuộng thứ hai trong cả hai năm.\"}},{\"id\":\"visitor|n\",\"term\":\"visitor\",\"reading\":\"/ˈvɪz.ɪ.tər/\",\"meaning\":\"khách tham quan; du khách\",\"definitionEn\":\"a person who comes to see a place or person\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Hay đi với: attract visitors · international visitors\"},{\"id\":\"international|adj\",\"term\":\"international\",\"reading\":\"/ˌɪn.təˈnæʃ.ən.əl/\",\"meaning\":\"quốc tế\",\"definitionEn\":\"involving more than one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-ter-NA-tion-al — Hay đi với: international tourists · international flights\",\"example\":{\"text\":\"In 2023, Hanoi received twice as many international visitors as Hue.\",\"vi\":\"Năm 2023, Hà Nội đón lượng khách quốc tế gấp đôi Huế.\"}},{\"id\":\"domestic|adj\",\"term\":\"domestic\",\"reading\":\"/dəˈmes.tɪk/\",\"meaning\":\"trong nước; nội địa\",\"definitionEn\":\"within one country\",\"lesson\":34,\"pos\":\"adj\",\"hint\":\"Trọng âm: do-MES-tic — Hay đi với: domestic tourists · domestic flights\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"accommodation|n\",\"term\":\"accommodation\",\"reading\":\"/əˌkɒm.əˈdeɪ.ʃən/\",\"meaning\":\"chỗ ở (khách sạn, nhà nghỉ…)\",\"definitionEn\":\"a place to stay, e.g. a hotel\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"2 chữ c, 2 chữ m: ac-COM-MO-da-tion. — Trọng âm: ac-com-mo-DA-tion — Hay đi với: spend money on accommodation · cheap accommodation\",\"example\":{\"text\":\"Domestic tourists spent less money on accommodation than international tourists.\",\"vi\":\"Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế.\"}},{\"id\":\"tourist-attraction|phr-n\",\"term\":\"tourist attraction\",\"reading\":\"/ˈtʊə.rɪst əˌtræk.ʃən/\",\"meaning\":\"điểm tham quan du lịch\",\"definitionEn\":\"a place that many travellers visit\",\"lesson\":34,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a major tourist attraction · visit tourist attractions\"},{\"id\":\"expenditure|n\",\"term\":\"expenditure\",\"reading\":\"/ɪkˈspen.dɪ.tʃər/\",\"meaning\":\"khoản chi tiêu\",\"definitionEn\":\"the amount of money spent\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-PEN-di-ture — Hay đi với: expenditure on food · total expenditure\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"category|n\",\"term\":\"category\",\"reading\":\"/ˈkæt.ə.ɡər.i/\",\"meaning\":\"hạng mục; loại\",\"definitionEn\":\"a group of things of the same type\",\"lesson\":34,\"pos\":\"n\",\"hint\":\"KAT-ờ-gờ-ri:
