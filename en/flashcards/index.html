 same order as the things just mentioned\",\"lesson\":34,\"pos\":\"adv\",\"hint\":\"Trọng âm: re-SPEC-tive-ly — Hay đi với: A and B were 20% and 30%, respectively\",\"example\":{\"text\":\"Food and transport accounted for 25% and 15% of tourist expenditure, respectively.\",\"vi\":\"Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch.\"}},{\"id\":\"whereas|conj\",\"term\":\"whereas\",\"reading\":\"/weərˈæz/\",\"meaning\":\"trong khi (đối lập)\",\"definitionEn\":\"while; used to compare two different facts\",\"lesson\":34,\"pos\":\"conj\",\"hint\":\"weờ-AZ: nhấn âm cuối. — Trọng âm: where-AS — Hay đi với: …, whereas …\",\"example\":{\"text\":\"Some countries have strict drug laws, whereas others focus on treatment.\",\"vi\":\"Một số nước có luật ma túy nghiêm khắc, trong khi những nước khác tập trung vào điều trị.\"}},{\"id\":\"compared-with|colloc\",\"term\":\"compared with\",\"reading\":\"/kəmˈpeəd wɪð/\",\"meaning\":\"so với\",\"definitionEn\":\"used to show how two things differ\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: compared with last year · compared to 2010\"},{\"id\":\"in-contrast|idiom\",\"term\":\"in contrast\",\"reading\":\"/ɪn ˈkɒn.trɑːst/\",\"meaning\":\"ngược lại\",\"definitionEn\":\"used to show a big difference\",\"lesson\":34,\"pos\":\"idiom\"},{\"id\":\"similarly|adv\",\"term\":\"similarly\",\"reading\":\"/ˈsɪm.ɪ.lə.li/\",\"meaning\":\"tương tự như vậy\",\"definitionEn\":\"in the same way\",\"lesson\":34,\"pos\":\"adv\",\"example\":{\"text\":\"The northern region attracted fewer foreign tourists than the south. Similarly, it had fewer hotels.\",\"vi\":\"Miền Bắc thu hút ít khách nước ngoài hơn miền Nam. Tương tự, miền Bắc có ít khách sạn hơn.\"}},{\"id\":\"the-majority-of|colloc\",\"term\":\"the majority of\",\"reading\":\"/ðə məˈdʒɒr.ə.ti əv/\",\"meaning\":\"phần lớn; đa số\",\"definitionEn\":\"most of a group\",\"lesson\":34,\"pos\":\"colloc\",\"hint\":\"Hay đi với: the majority of tourists · a large majority of\"},{\"id\":\"urbanisation|n\",\"term\":\"urbanisation\",\"reading\":\"/ˌɜː.bən.aɪˈzeɪ.ʃən/\",\"meaning\":\"đô thị hóa\",\"definitionEn\":\"the process of more people moving to live in cities\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: ur-ban-i-SA-tion — Hay đi với: rapid urbanisation · the effects of urbanisation\",\"example\":{\"text\":\"Rapid urbanisation has resulted in overcrowded cities and a lack of green space.\",\"vi\":\"Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh.\"}},{\"id\":\"urban|adj\",\"term\":\"urban\",\"reading\":\"/ˈɜː.bən/\",\"meaning\":\"thuộc đô thị; thành thị\",\"definitionEn\":\"connected with towns or cities\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: urban areas · urban life\",\"example\":{\"text\":\"Urban areas offer better services, but rural life is quieter and cheaper.\",\"vi\":\"Khu đô thị có dịch vụ tốt hơn, nhưng cuộc sống nông thôn yên tĩnh và rẻ hơn.\"}},{\"id\":\"rural|adj\",\"term\":\"rural\",\"reading\":\"/ˈrʊə.rəl/\",\"meaning\":\"thuộc nông thôn\",\"definitionEn\":\"connected with the countryside\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: rural areas · rural-urban migration\",\"example\":{\"text\":\"The officer asked us if we had moved from a rural area.\",\"vi\":\"Cán bộ hỏi chúng tôi có phải đã chuyển đến từ vùng nông thôn không.\"}},{\"id\":\"urban-sprawl|phr-n\",\"term\":\"urban sprawl\",\"reading\":\"/ˌɜː.bən ˈsprɔːl/\",\"meaning\":\"sự lan rộng tràn lan của đô thị ra vùng ven\",\"definitionEn\":\"uncontrolled spread of a city into surrounding land\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: control urban sprawl · the problem of urban sprawl\"},{\"id\":\"infrastructure|n\",\"term\":\"infrastructure\",\"reading\":\"/ˈɪn.frəˌstrʌk.tʃər/\",\"meaning\":\"cơ sở hạ tầng\",\"definitionEn\":\"basic systems a country needs, e.g. roads and power\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-fra-struc-ture — Hay đi với: invest in infrastructure · poor infrastructure\",\"example\":{\"text\":\"If the city doesn't invest in infrastructure, urban sprawl will get worse.\",\"vi\":\"Nếu thành phố không đầu tư vào cơ sở hạ tầng, tình trạng đô thị lan tràn sẽ trầm trọng hơn.\"}},{\"id\":\"traffic-congestion|phr-n\",\"term\":\"traffic congestion\",\"reading\":\"/ˈtræf.ɪk kənˌdʒes.tʃən/\",\"meaning\":\"ùn tắc giao thông\",\"definitionEn\":\"too many vehicles on the roads, causing delays\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce traffic congestion · heavy traffic congestion\"},{\"id\":\"housing|n\",\"term\":\"housing\",\"reading\":\"/ˈhaʊ.zɪŋ/\",\"meaning\":\"nhà ở (nói chung)\",\"definitionEn\":\"houses and flats for people to live in\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: affordable housing · housing costs\",\"example\":{\"text\":\"Housing was by far the largest expense in all three countries.\",\"vi\":\"Nhà ở là khoản chi lớn nhất với cách biệt xa ở cả ba nước.\"}},{\"id\":\"rent|n\",\"term\":\"rent\",\"reading\":\"/rent/\",\"meaning\":\"tiền thuê nhà\",\"definitionEn\":\"money you pay regularly to live in someone's property\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: pay the rent · high rents\"},{\"id\":\"migrate|v\",\"term\":\"migrate\",\"reading\":\"/maɪˈɡreɪt/\",\"meaning\":\"di cư; chuyển đến nơi khác (để sống, làm việc)\",\"definitionEn\":\"to move to another place to live or work\",\"lesson\":35,\"pos\":\"v\",\"hint\":\"Hay đi với: migrate to the cities · migrate from rural areas\",\"example\":{\"text\":\"Every year, thousands of young people migrate from the countryside to big cities.\",\"vi\":\"Mỗi năm, hàng nghìn người trẻ di cư từ nông thôn lên các thành phố lớn.\"}},{\"id\":\"migration|n\",\"term\":\"migration\",\"reading\":\"/maɪˈɡreɪ.ʃən/\",\"meaning\":\"sự di cư\",\"definitionEn\":\"the movement of people from one place to another\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: mi-GRA-tion — Hay đi với: rural-urban migration · mass migration\",\"example\":{\"text\":\"The main reason for rural-urban migration is the lack of job opportunities in the countryside.\",\"vi\":\"Lý do chính của di cư từ nông thôn ra thành thị là thiếu cơ hội việc làm ở nông thôn.\"}},{\"id\":\"population|n\",\"term\":\"population\",\"reading\":\"/ˌpɒp.jəˈleɪ.ʃən/\",\"meaning\":\"dân số\",\"definitionEn\":\"the number of people living in an area\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Trọng âm: pop-u-LA-tion — Hay đi với: a growing population · the population of Hanoi\",\"example\":{\"text\":\"The population of Ho Chi Minh City has grown very quickly since 2000.\",\"vi\":\"Dân số Thành phố Hồ Chí Minh đã tăng rất nhanh kể từ năm 2000.\"}},{\"id\":\"high-rise|adj\",\"term\":\"high-rise\",\"reading\":\"/ˈhaɪ.raɪz/\",\"meaning\":\"cao tầng\",\"definitionEn\":\"(of a building) very tall with many floors\",\"lesson\":35,\"pos\":\"adj\",\"hint\":\"Hay đi với: high-rise buildings · high-rise apartments\"},{\"id\":\"suburb|n\",\"term\":\"suburb\",\"reading\":\"/ˈsʌb.ɜːb/\",\"meaning\":\"vùng ngoại ô\",\"definitionEn\":\"an area where people live outside the centre of a city\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"Hay đi với: live in the suburbs · a quiet suburb\"},{\"id\":\"city-centre|phr-n\",\"term\":\"city centre\",\"reading\":\"/ˌsɪt.i ˈsen.tər/\",\"meaning\":\"trung tâm thành phố\",\"definitionEn\":\"the main business and shopping area of a city\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: in the city centre · move out of the city centre\"},{\"id\":\"cost-of-living|phr-n\",\"term\":\"cost of living\",\"reading\":\"/ˌkɒst əv ˈlɪv.ɪŋ/\",\"meaning\":\"chi phí sinh hoạt\",\"definitionEn\":\"the money needed for food, housing and other basics\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the high cost of living · the cost of living in big cities\"},{\"id\":\"job-opportunity|phr-n\",\"term\":\"job opportunity\",\"reading\":\"/ˈdʒɒb ɒp.əˌtjuː.nə.ti/\",\"meaning\":\"cơ hội việc làm\",\"definitionEn\":\"a chance to get work\",\"lesson\":35,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: more job opportunities · create job opportunities\"},{\"id\":\"skyscraper|n\",\"term\":\"skyscraper\",\"reading\":\"/ˈskaɪˌskreɪ.pər/\",\"meaning\":\"nhà chọc trời\",\"definitionEn\":\"an extremely tall building\",\"lesson\":35,\"pos\":\"n\"},{\"id\":\"neighbourhood|n\",\"term\":\"neighbourhood\",\"reading\":\"/ˈneɪ.bə.hʊd/\",\"meaning\":\"khu phố; khu dân cư\",\"definitionEn\":\"the area around your home\",\"lesson\":35,\"pos\":\"n\",\"hint\":\"NEI-bờ-hud: gh câm. — Trọng âm: NEIGH-bour-hood — Hay đi với: a friendly neighbourhood · in my neighbourhood\",\"example\":{\"text\":\"She mentioned that her neighbourhood didn't have any green spaces.\",\"vi\":\"Cô ấy nhắc rằng khu phố của cô không có mảng xanh nào.\"}},{\"id\":\"mention|v\",\"term\":\"mention\",\"reading\":\"/ˈmen.ʃən/\",\"meaning\":\"nhắc đến; đề cập\",\"definitionEn\":\"to talk about something briefly\",\"lesson\":35,\"pos\":\"v\",\"hint\":\"MEN-shờn: -tion đọc shờn. — Hay đi với: mention a problem · as I mentioned\"},{\"id\":\"vibrant|adj\",\"term\":\"vibrant\",\"reading\":\"/ˈvaɪ.brənt/\",\"meaning\":\"sôi động; đầy sức sống\",\"definitionEn\":\"full of energy and excitement\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a vibrant city · vibrant nightlife\",\"example\":{\"text\":\"Ho Chi Minh City is a vibrant city with exciting nightlife.\",\"vi\":\"Thành phố Hồ Chí Minh là một thành phố sôi động với cuộc sống về đêm hấp dẫn.\"}},{\"id\":\"lively|adj\",\"term\":\"lively\",\"reading\":\"/ˈlaɪv.li/\",\"meaning\":\"náo nhiệt; sinh động\",\"definitionEn\":\"full of activity and energy\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a lively street · a lively atmosphere\",\"example\":{\"text\":\"The old quarter is famous for its street food and lively atmosphere.\",\"vi\":\"Phố cổ nổi tiếng với đồ ăn đường phố và không khí náo nhiệt.\"}},{\"id\":\"nightlife|n\",\"term\":\"nightlife\",\"reading\":\"/ˈnaɪt.laɪf/\",\"meaning\":\"cuộc sống về đêm (hoạt động vui chơi buổi tối)\",\"definitionEn\":\"entertainment available in the evening, e.g. bars\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: exciting nightlife · the city's nightlife\",\"example\":{\"text\":\"Ho Chi Minh City is a vibrant city with exciting nightlife.\",\"vi\":\"Thành phố Hồ Chí Minh là một thành phố sôi động với cuộc sống về đêm hấp dẫn.\"}},{\"id\":\"street-food|phr-n\",\"term\":\"street food\",\"reading\":\"/ˈstriːt ˌfuːd/\",\"meaning\":\"đồ ăn đường phố\",\"definitionEn\":\"cheap meals sold from stalls by the road\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: famous for its street food · try street food\"},{\"id\":\"district|n\",\"term\":\"district\",\"reading\":\"/ˈdɪs.trɪkt/\",\"meaning\":\"quận; khu vực\",\"definitionEn\":\"an area of a city or country\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: District 1 · the business district\",\"example\":{\"text\":\"My district has lots of cafés as well as a big shopping mall.\",\"vi\":\"Quận của tôi có nhiều quán cà phê cũng như một trung tâm thương mại lớn.\"}},{\"id\":\"pedestrian|n\",\"term\":\"pedestrian\",\"reading\":\"/pəˈdes.tri.ən/\",\"meaning\":\"người đi bộ\",\"definitionEn\":\"a person who is walking in the street\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Trọng âm: pe-DES-tri-an — Hay đi với: a pedestrian street · pedestrian zone\",\"example\":{\"text\":\"On weekend evenings, the street around the lake becomes a pedestrian zone.\",\"vi\":\"Vào tối cuối tuần, con phố quanh hồ trở thành khu đi bộ.\"}},{\"id\":\"spacious|adj\",\"term\":\"spacious\",\"reading\":\"/ˈspeɪ.ʃəs/\",\"meaning\":\"rộng rãi\",\"definitionEn\":\"having a lot of space\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Hay đi với: a spacious park · spacious streets\",\"example\":{\"text\":\"The new park is spacious and green. Besides, it's free for everyone.\",\"vi\":\"Công viên mới rộng rãi và xanh mát. Hơn nữa, nó miễn phí cho mọi người.\"}},{\"id\":\"amenity|n\",\"term\":\"amenity\",\"reading\":\"/əˈmiː.nə.ti/\",\"meaning\":\"tiện ích (công viên, bệnh viện, cửa hàng…)\",\"definitionEn\":\"a useful service or building, e.g. a park or hospital\",\"lesson\":36,\"pos\":\"n\",\"hint\":\"Hay đi với: local amenities · modern amenities\"},{\"id\":\"modern|adj\",\"term\":\"modern\",\"reading\":\"/ˈmɒd.ən/\",\"meaning\":\"hiện đại\",\"definitionEn\":\"new and using the latest ideas\",\"lesson\":36,\"pos\":\"adj\",\"hint\":\"Trọng âm: MOD-ern — Hay đi với: modern buildings · a modern city\",\"example\":{\"text\":\"People think Hanoi is very old, but actually some areas are very modern.\",\"vi\":\"Mọi người nghĩ Hà Nội rất cổ kính, nhưng thật ra có những khu rất hiện đại.\"}},{\"id\":\"get-around|phr-v\",\"term\":\"get around\",\"reading\":\"/ˌɡet əˈraʊnd/\",\"meaning\":\"đi lại (trong một khu vực)\",\"definitionEn\":\"to travel from place to place in an area\",\"lesson\":36,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: easy to get around · get around by motorbike\"},{\"id\":\"walking-distance|phr-n\",\"term\":\"walking distance\",\"reading\":\"/ˈwɔː.kɪŋ ˌdɪs.təns/\",\"meaning\":\"khoảng cách đi bộ được\",\"definitionEn\":\"near enough to reach by walking\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: within walking distance of · a short walking distance\"},{\"id\":\"shopping-mall|phr-n\",\"term\":\"shopping mall\",\"reading\":\"/ˈʃɒp.ɪŋ ˌmɔːl/\",\"meaning\":\"trung tâm thương mại\",\"definitionEn\":\"a large indoor building with many shops\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: go to the shopping mall · a huge shopping mall\"},{\"id\":\"hustle-and-bustle|idiom\",\"term\":\"hustle and bustle\",\"reading\":\"/ˌhʌs.əl ən ˈbʌs.əl/\",\"meaning\":\"sự hối hả; nhộn nhịp\",\"definitionEn\":\"busy noisy activity\",\"lesson\":36,\"pos\":\"idiom\",\"hint\":\"Hay đi với: the hustle and bustle of city life · escape the hustle and bustle\"},{\"id\":\"quality-of-life|phr-n\",\"term\":\"quality of life\",\"reading\":\"/ˌkwɒl.ə.ti əv ˈlaɪf/\",\"meaning\":\"chất lượng cuộc sống\",\"definitionEn\":\"how good and comfortable a person's life is\",\"lesson\":36,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve the quality of life · a high quality of life\"},{\"id\":\"besides|adv\",\"term\":\"besides\",\"reading\":\"/bɪˈsaɪdz/\",\"meaning\":\"ngoài ra; hơn nữa\",\"definitionEn\":\"also; in addition\",\"lesson\":36,\"pos\":\"adv\",\"example\":{\"text\":\"The new park is spacious and green. Besides, it's free for everyone.\",\"vi\":\"Công viên mới rộng rãi và xanh mát. Hơn nữa, nó miễn phí cho mọi người.\"}},{\"id\":\"apart-from|prep\",\"term\":\"apart from\",\"reading\":\"/əˈpɑːt frəm/\",\"meaning\":\"ngoài … ra; trừ …\",\"definitionEn\":\"except for; or in addition to\",\"lesson\":36,\"pos\":\"prep\",\"hint\":\"Hay đi với: apart from that · apart from the traffic\"},{\"id\":\"as-well-as|prep\",\"term\":\"as well as\",\"reading\":\"/əz ˈwel əz/\",\"meaning\":\"cũng như; bên cạnh\",\"definitionEn\":\"and also\",\"lesson\":36,\"pos\":\"prep\",\"hint\":\"Hay đi với: cafés as well as restaurants\"},{\"id\":\"actually|adv\",\"term\":\"actually\",\"reading\":\"/ˈæk.tʃu.ə.li/\",\"meaning\":\"thật ra; thực ra\",\"definitionEn\":\"used to say what is really true\",\"lesson\":36,\"pos\":\"adv\",\"hint\":\"Trọng âm: AC-tu-al-ly\",\"example\":{\"text\":\"Overusing linking words can actually weaken cohesion.\",\"vi\":\"Lạm dụng từ nối thực ra có thể làm yếu tính liên kết.\"}},{\"id\":\"to-be-honest|idiom\",\"term\":\"to be honest\",\"reading\":\"/tə bi ˈɒn.ɪst/\",\"meaning\":\"thật lòng mà nói\",\"definitionEn\":\"used to say what you really think\",\"lesson\":36,\"pos\":\"idiom\"},{\"id\":\"mainstream-media|phr-n\",\"term\":\"mainstream media\",\"reading\":\"/ˌmeɪn.striːm ˈmiː.di.ə/\",\"meaning\":\"truyền thông chính thống (báo, đài lớn)\",\"definitionEn\":\"large, well-known newspapers and TV channels\",\"lesson\":37,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: trust the mainstream media · reported by the mainstream media\"},{\"id\":\"misinformation|n\",\"term\":\"misinformation\",\"reading\":\"/ˌmɪs.ɪn.fəˈmeɪ.ʃən/\",\"meaning\":\"thông tin sai lệch\",\"definitionEn\":\"false or wrong information\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: mis-in-for-MA-tion — Hay đi với: spread misinformation · a source of misinformation\",\"example\":{\"text\":\"Misinformation often spreads faster than the truth on social media.\",\"vi\":\"Thông tin sai lệch thường lan nhanh hơn sự thật trên mạng xã hội.\"}},{\"id\":\"media-literacy|phr-n\",\"term\":\"media literacy\",\"reading\":\"/ˌmiː.di.ə ˈlɪt.ər.ə.si/\",\"meaning\":\"năng lực hiểu và đánh giá thông tin truyền thông\",\"definitionEn\":\"the ability to judge news and media critically\",\"lesson\":37,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: teach media literacy · improve media literacy\"},{\"id\":\"journalist|n\",\"term\":\"journalist\",\"reading\":\"/ˈdʒɜː.nə.lɪst/\",\"meaning\":\"nhà báo\",\"definitionEn\":\"a person who writes news reports\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"JƠ-nờ-list: j ở đầu. — Trọng âm: JOUR-nal-ist — Hay đi với: a professional journalist · journalists report\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"headline|n\",\"term\":\"headline\",\"reading\":\"/ˈhed.laɪn/\",\"meaning\":\"tiêu đề (bài báo)\",\"definitionEn\":\"the title of a news story in large letters\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a shocking headline · read only the headlines\",\"example\":{\"text\":\"Although the headline was false, the story spread very quickly online.\",\"vi\":\"Mặc dù tiêu đề là sai sự thật, câu chuyện vẫn lan truyền rất nhanh trên mạng.\"}},{\"id\":\"source|n\",\"term\":\"source\",\"reading\":\"/sɔːs/\",\"meaning\":\"nguồn (thông tin)\",\"definitionEn\":\"where information comes from\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: a reliable source · check the source\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"reliable|adj\",\"term\":\"reliable\",\"reading\":\"/rɪˈlaɪ.ə.bəl/\",\"meaning\":\"đáng tin cậy\",\"definitionEn\":\"able to be trusted\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Trọng âm: re-LI-a-ble — Hay đi với: a reliable source · reliable information\",\"example\":{\"text\":\"A reliable source always tells you where the information comes from.\",\"vi\":\"Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu.\"}},{\"id\":\"spread|v\",\"term\":\"spread\",\"reading\":\"/spred/\",\"meaning\":\"lan truyền; lan rộng\",\"definitionEn\":\"to move to more places or people\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: spread quickly · spread fake news\",\"example\":{\"text\":\"The report said that misinformation had spread faster than the truth.\",\"vi\":\"Báo cáo nói rằng thông tin sai lệch đã lan nhanh hơn sự thật.\"}},{\"id\":\"publish|v\",\"term\":\"publish\",\"reading\":\"/ˈpʌb.lɪʃ/\",\"meaning\":\"đăng; xuất bản\",\"definitionEn\":\"to make a book, article or post available to the public\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: publish an article · be published online\"},{\"id\":\"audience|n\",\"term\":\"audience\",\"reading\":\"/ˈɔː.di.əns/\",\"meaning\":\"khán giả; độc giả\",\"definitionEn\":\"the people who watch, read or listen to something\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"AW-di-ờns: nhấn âm đầu. — Trọng âm: AU-di-ence — Hay đi với: a large audience · reach a young audience\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"viral|adj\",\"term\":\"viral\",\"reading\":\"/ˈvaɪə.rəl/\",\"meaning\":\"lan truyền rất nhanh trên mạng\",\"definitionEn\":\"spreading very quickly online\",\"lesson\":37,\"pos\":\"adj\",\"hint\":\"Hay đi với: go viral · a viral video\",\"example\":{\"text\":\"Her cooking video went viral and reached an audience of two million people.\",\"vi\":\"Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem.\"}},{\"id\":\"platform|n\",\"term\":\"platform\",\"reading\":\"/ˈplæt.fɔːm/\",\"meaning\":\"nền tảng (mạng xã hội, trực tuyến)\",\"definitionEn\":\"a website or app where people share content\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Hay đi với: social media platforms · online platforms\"},{\"id\":\"influencer|n\",\"term\":\"influencer\",\"reading\":\"/ˈɪn.flu.ən.sər/\",\"meaning\":\"người có ảnh hưởng trên mạng\",\"definitionEn\":\"a person paid to promote products to their online followers\",\"lesson\":37,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-flu-en-cer — Hay đi với: a social media influencer · follow influencers\"},{\"id\":\"fact-check|v\",\"term\":\"fact-check\",\"reading\":\"/ˈfækt.tʃek/\",\"meaning\":\"kiểm chứng thông tin\",\"definitionEn\":\"to make sure information is true before using it\",\"lesson\":37,\"pos\":\"v\",\"hint\":\"Hay đi với: fact-check a story · fact-checking websites\"},{\"id\":\"although|conj\",\"term\":\"although\",\"reading\":\"/ɔːlˈðəʊ/\",\"meaning\":\"mặc dù (+ mệnh đề)\",\"definitionEn\":\"used before a clause that contrasts with the main idea\",\"lesson\":37,\"pos\":\"conj\",\"hint\":\"Trọng âm: al-THOUGH\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"even-though|conj\",\"term\":\"even though\",\"reading\":\"/ˌiː.vən ˈðəʊ/\",\"meaning\":\"mặc dù (nhấn mạnh hơn although)\",\"definitionEn\":\"a stronger way of saying 'although'\",\"lesson\":37,\"pos\":\"conj\"},{\"id\":\"despite|prep\",\"term\":\"despite\",\"reading\":\"/dɪˈspaɪt/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being stopped by (used before a noun)\",\"lesson\":37,\"pos\":\"prep\",\"hint\":\"Trọng âm: de-SPITE\",\"example\":{\"text\":\"Despite the warnings, many people shared the video without checking it.\",\"vi\":\"Bất chấp những lời cảnh báo, nhiều người vẫn chia sẻ video mà không kiểm tra.\"}},{\"id\":\"in-spite-of|prep\",\"term\":\"in spite of\",\"reading\":\"/ɪn ˈspaɪt əv/\",\"meaning\":\"mặc dù; bất chấp (+ danh từ / V-ing)\",\"definitionEn\":\"without being affected by; despite\",\"lesson\":37,\"pos\":\"prep\"},{\"id\":\"censorship|n\",\"term\":\"censorship\",\"reading\":\"/ˈsen.sə.ʃɪp/\",\"meaning\":\"sự kiểm duyệt\",\"definitionEn\":\"blocking parts of books, films or news that officials dislike\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CEN-sor-ship — Hay đi với: media censorship · strict censorship\",\"example\":{\"text\":\"Others believe that censorship would limit freedom of speech.\",\"vi\":\"Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận.\"}},{\"id\":\"freedom-of-speech|phr-n\",\"term\":\"freedom of speech\",\"reading\":\"/ˌfriː.dəm əv ˈspiːtʃ/\",\"meaning\":\"quyền tự do ngôn luận\",\"definitionEn\":\"the right to say what you think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: protect freedom of speech · limit freedom of speech\"},{\"id\":\"freedom-of-the-press|phr-n\",\"term\":\"freedom of the press\",\"reading\":\"/ˌfriː.dəm əv ðə ˈpres/\",\"meaning\":\"tự do báo chí\",\"definitionEn\":\"the right of newspapers to report without government control\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: respect freedom of the press\"},{\"id\":\"regulate|v\",\"term\":\"regulate\",\"reading\":\"/ˈreɡ.jə.leɪt/\",\"meaning\":\"quản lý; điều tiết (bằng luật lệ)\",\"definitionEn\":\"to control something with rules\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Trọng âm: REG-u-late — Hay đi với: regulate social media · strictly regulated\",\"example\":{\"text\":\"Some people argue that the government should regulate social media more strictly.\",\"vi\":\"Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn.\"}},{\"id\":\"government|n\",\"term\":\"government\",\"reading\":\"/ˈɡʌv.ən.mənt/\",\"meaning\":\"chính phủ\",\"definitionEn\":\"the group of people who run a country\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"GUV-ần-mần: chữ n ở giữa thường không đọc. — Trọng âm: GOV-ern-ment — Hay đi với: the government should · government control\",\"example\":{\"text\":\"The government should make road safety a top priority.\",\"vi\":\"Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu.\"}},{\"id\":\"entertainment|n\",\"term\":\"entertainment\",\"reading\":\"/ˌen.təˈteɪn.mənt/\",\"meaning\":\"sự giải trí\",\"definitionEn\":\"films, music and shows that people enjoy\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: en-ter-TAIN-ment — Hay đi với: a form of entertainment · for entertainment\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"educational|adj\",\"term\":\"educational\",\"reading\":\"/ˌedʒ.uˈkeɪ.ʃən.əl/\",\"meaning\":\"mang tính giáo dục\",\"definitionEn\":\"helping people to learn\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ed-u-CA-tion-al — Hay đi với: educational programmes · educational value\",\"example\":{\"text\":\"While some people watch TV for entertainment, others prefer educational programmes.\",\"vi\":\"Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.\"}},{\"id\":\"mislead|v\",\"term\":\"mislead\",\"reading\":\"/mɪsˈliːd/\",\"meaning\":\"đánh lừa; làm hiểu sai\",\"definitionEn\":\"to make someone believe something that is not true\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: mislead the public · misleading information\"},{\"id\":\"biased|adj\",\"term\":\"biased\",\"reading\":\"/ˈbaɪ.əst/\",\"meaning\":\"thiên vị; phiến diện\",\"definitionEn\":\"unfairly supporting one side\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: biased reporting · be biased against/towards\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"objective|adj\",\"term\":\"objective\",\"reading\":\"/əbˈdʒek.tɪv/\",\"meaning\":\"khách quan\",\"definitionEn\":\"based on facts, not personal feelings\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Trọng âm: ob-JEC-tive — Hay đi với: objective reporting · an objective view\",\"example\":{\"text\":\"A good journalist should be objective and not biased.\",\"vi\":\"Một nhà báo giỏi nên khách quan và không thiên vị.\"}},{\"id\":\"public-opinion|phr-n\",\"term\":\"public opinion\",\"reading\":\"/ˌpʌb.lɪk əˈpɪn.jən/\",\"meaning\":\"dư luận\",\"definitionEn\":\"what most people in a society think\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: influence public opinion · shape public opinion\"},{\"id\":\"claim|v\",\"term\":\"claim\",\"reading\":\"/kleɪm/\",\"meaning\":\"cho rằng; khẳng định (thường chưa chắc đúng)\",\"definitionEn\":\"to say something is true without proof\",\"lesson\":38,\"pos\":\"v\",\"hint\":\"Hay đi với: claim that … · some people claim\"},{\"id\":\"view|n\",\"term\":\"view\",\"reading\":\"/vjuː/\",\"meaning\":\"quan điểm; cách nhìn\",\"definitionEn\":\"an opinion\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Hay đi với: both views · in my view\",\"example\":{\"text\":\"In my view, the benefits of cameras outweigh the drawbacks.\",\"vi\":\"Theo tôi, lợi ích của camera lớn hơn nhược điểm.\"}},{\"id\":\"point-of-view|phr-n\",\"term\":\"point of view\",\"reading\":\"/ˌpɔɪnt əv ˈvjuː/\",\"meaning\":\"quan điểm; góc nhìn\",\"definitionEn\":\"a particular way of thinking about something\",\"lesson\":38,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: from my point of view · a different point of view\"},{\"id\":\"on-the-one-hand|idiom\",\"term\":\"on the one hand\",\"reading\":\"/ɒn ðə ˈwʌn ˌhænd/\",\"meaning\":\"một mặt\",\"definitionEn\":\"used to introduce the first of two opposite ideas\",\"lesson\":38,\"pos\":\"idiom\"},{\"id\":\"advertising|n\",\"term\":\"advertising\",\"reading\":\"/ˈæd.və.taɪ.zɪŋ/\",\"meaning\":\"ngành/hoạt động quảng cáo\",\"definitionEn\":\"the business of telling people about products to sell them\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: AD-ver-tis-ing — Hay đi với: online advertising · advertising aimed at children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"harmful|adj\",\"term\":\"harmful\",\"reading\":\"/ˈhɑːm.fəl/\",\"meaning\":\"có hại\",\"definitionEn\":\"causing damage or injury\",\"lesson\":38,\"pos\":\"adj\",\"hint\":\"Hay đi với: harmful content · harmful to children\",\"example\":{\"text\":\"It is often claimed that online advertising is harmful to children.\",\"vi\":\"Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em.\"}},{\"id\":\"content|n\",\"term\":\"content\",\"reading\":\"/ˈkɒn.tent/\",\"meaning\":\"nội dung\",\"definitionEn\":\"the information, videos or articles on a website\",\"lesson\":38,\"pos\":\"n\",\"hint\":\"Trọng âm: CON-tent — Hay đi với: online content · violent content\",\"example\":{\"text\":\"From my point of view, parents should check the content their children watch.\",\"vi\":\"Theo quan điểm của tôi, bố mẹ nên kiểm tra nội dung con cái xem.\"}},{\"id\":\"employee|n\",\"term\":\"employee\",\"reading\":\"/ɪmˈplɔɪ.iː/\",\"meaning\":\"nhân viên; người lao động\",\"definitionEn\":\"a person who works for a company\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"em-ploi-Ì: nhấn âm cuối. — Trọng âm: em-ploy-EE — Hay đi với: full-time employees · the company's employees\"},{\"id\":\"employer|n\",\"term\":\"employer\",\"reading\":\"/ɪmˈplɔɪ.ər/\",\"meaning\":\"người sử dụng lao động; chủ (công ty)\",\"definitionEn\":\"a person or company that pays people to work\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: em-PLOY-er — Hay đi với: a good employer · employers look for\"},{\"id\":\"wage|n\",\"term\":\"wage\",\"reading\":\"/weɪdʒ/\",\"meaning\":\"tiền công (thường trả theo giờ/tuần)\",\"definitionEn\":\"money paid for work, usually per hour or week\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: a low wage · an hourly wage\",\"example\":{\"text\":\"Many people believe the minimum wage should be raised because the cost of living is rising.\",\"vi\":\"Nhiều người cho rằng lương tối thiểu nên được tăng vì chi phí sinh hoạt đang tăng.\"}},{\"id\":\"promotion|n\",\"term\":\"promotion\",\"reading\":\"/prəˈməʊ.ʃən/\",\"meaning\":\"sự thăng chức\",\"definitionEn\":\"a move to a higher position at work\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: pro-MO-tion — Hay đi với: get a promotion · chances of promotion\",\"example\":{\"text\":\"After three years, he finally got a promotion to team leader.\",\"vi\":\"Sau ba năm, cuối cùng anh ấy cũng được thăng chức lên trưởng nhóm.\"}},{\"id\":\"experience|n\",\"term\":\"experience\",\"reading\":\"/ɪkˈspɪə.ri.əns/\",\"meaning\":\"kinh nghiệm (không đếm được); trải nghiệm (đếm được)\",\"definitionEn\":\"knowledge you gain by doing something\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-PE-ri-ence — Hay đi với: work experience · have experience in\",\"example\":{\"text\":\"Looking back on it, the experience was extremely rewarding.\",\"vi\":\"Nhìn lại thì trải nghiệm đó rất đáng giá.\"}},{\"id\":\"internship|n\",\"term\":\"internship\",\"reading\":\"/ˈɪn.tɜːn.ʃɪp/\",\"meaning\":\"kỳ thực tập\",\"definitionEn\":\"a short period of work to gain experience, often unpaid\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: do an internship · a three-month internship\",\"example\":{\"text\":\"Many students do an internship in order to gain work experience.\",\"vi\":\"Nhiều sinh viên đi thực tập để có kinh nghiệm làm việc.\"}},{\"id\":\"freelance|adj\",\"term\":\"freelance\",\"reading\":\"/ˈfriː.lɑːns/\",\"meaning\":\"làm tự do (không thuộc biên chế công ty nào)\",\"definitionEn\":\"working for different companies, not employed by one\",\"lesson\":39,\"pos\":\"adj\",\"hint\":\"Hay đi với: freelance work · a freelance designer\",\"example\":{\"text\":\"More and more young people choose freelance work because it is flexible.\",\"vi\":\"Ngày càng nhiều người trẻ chọn làm tự do vì nó linh hoạt.\"}},{\"id\":\"work-from-home|phr-v\",\"term\":\"work from home\",\"reading\":\"/ˌwɜːk frəm ˈhəʊm/\",\"meaning\":\"làm việc tại nhà\",\"definitionEn\":\"to do your job at your house instead of an office\",\"lesson\":39,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: work from home twice a week · the right to work from home\"},{\"id\":\"recruit|v\",\"term\":\"recruit\",\"reading\":\"/rɪˈkruːt/\",\"meaning\":\"tuyển dụng\",\"definitionEn\":\"to find new people to join a company\",\"lesson\":39,\"pos\":\"v\",\"hint\":\"Trọng âm: re-CRUIT — Hay đi với: recruit new staff · recruit graduates\"},{\"id\":\"resign|v\",\"term\":\"resign\",\"reading\":\"/rɪˈzaɪn/\",\"meaning\":\"từ chức; xin nghỉ việc\",\"definitionEn\":\"to leave your job by choice\",\"lesson\":39,\"pos\":\"v\",\"hint\":\"Hay đi với: resign from a job · decide to resign\"},{\"id\":\"workplace|n\",\"term\":\"workplace\",\"reading\":\"/ˈwɜːk.pleɪs/\",\"meaning\":\"nơi làm việc\",\"definitionEn\":\"the place where you do your job\",\"lesson\":39,\"pos\":\"n\",\"hint\":\"Hay đi với: in the workplace · a safe workplace\",\"example\":{\"text\":\"A friendly workplace can improve job satisfaction more than a high salary.\",\"vi\":\"Một nơi làm việc thân thiện có thể tăng sự hài lòng với công việc hơn cả lương cao.\"}},{\"id\":\"job-satisfaction|phr-n\",\"term\":\"job satisfaction\",\"reading\":\"/ˈdʒɒb sæt.ɪsˌfæk.ʃən/\",\"meaning\":\"sự hài lòng với công việc\",\"definitionEn\":\"the feeling of enjoying your work\",\"lesson\":39,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: high job satisfaction · improve job satisfaction\"},{\"id\":\"so-that|conj\",\"term\":\"so that\",\"reading\":\"/ˈsəʊ ðæt/\",\"meaning\":\"để mà (+ mệnh đề)\",\"definitionEn\":\"in order to make something possible\",\"lesson\":39,\"pos\":\"conj\",\"hint\":\"Hay đi với: so that I can · so that they won't\"},{\"id\":\"in-order-to|idiom\",\"term\":\"in order to\",\"reading\":\"/ɪn ˈɔː.də tə/\",\"meaning\":\"để (+ động từ nguyên thể)\",\"definitionEn\":\"with the purpose of\",\"lesson\":39,\"pos\":\"idiom\",\"hint\":\"Hay đi với: in order to save money · in order not to be late\"},{\"id\":\"unemployment|n\",\"term\":\"unemployment\",\"reading\":\"/ˌʌn.ɪmˈplɔɪ.mənt/\",\"meaning\":\"tình trạng thất nghiệp\",\"definitionEn\":\"the situation of not having a job\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: un-em-PLOY-ment — Hay đi với: high unemployment · youth unemployment\",\"example\":{\"text\":\"When it comes to youth unemployment, I think the main problem is a lack of practical skills.\",\"vi\":\"Nói về tình trạng thất nghiệp ở người trẻ, tôi nghĩ vấn đề chính là thiếu kỹ năng thực tế.\"}},{\"id\":\"job-security|phr-n\",\"term\":\"job security\",\"reading\":\"/ˈdʒɒb sɪˌkjʊə.rə.ti/\",\"meaning\":\"sự ổn định; an toàn của công việc (ít nguy cơ mất việc)\",\"definitionEn\":\"little risk of losing your work\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have job security · a lack of job security\"},{\"id\":\"income-inequality|phr-n\",\"term\":\"income inequality\",\"reading\":\"/ˈɪn.kʌm ˌɪn.ɪˈkwɒl.ə.ti/\",\"meaning\":\"bất bình đẳng thu nhập\",\"definitionEn\":\"the large gap between the rich and the poor\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reduce income inequality · growing income inequality\"},{\"id\":\"minimum-wage|phr-n\",\"term\":\"minimum wage\",\"reading\":\"/ˌmɪn.ɪ.məm ˈweɪdʒ/\",\"meaning\":\"lương tối thiểu\",\"definitionEn\":\"the lowest hourly pay allowed by law\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: raise the minimum wage · earn the minimum wage\"},{\"id\":\"economic-growth|phr-n\",\"term\":\"economic growth\",\"reading\":\"/ˌiː.kəˌnɒm.ɪk ˈɡrəʊθ/\",\"meaning\":\"tăng trưởng kinh tế\",\"definitionEn\":\"an increase in the goods and services a country produces\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rapid economic growth · lead to economic growth\"},{\"id\":\"economy|n\",\"term\":\"economy\",\"reading\":\"/iˈkɒn.ə.mi/\",\"meaning\":\"nền kinh tế\",\"definitionEn\":\"the system of money, trade and industry in a country\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: e-CON-o-my — Hay đi với: a strong economy · the global economy\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"}},{\"id\":\"industry|n\",\"term\":\"industry\",\"reading\":\"/ˈɪn.də.stri/\",\"meaning\":\"ngành công nghiệp; ngành\",\"definitionEn\":\"the production of goods in factories; a type of business\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-dus-try — Hay đi với: the tourism industry · the IT industry\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"}},{\"id\":\"replace|v\",\"term\":\"replace\",\"reading\":\"/rɪˈpleɪs/\",\"meaning\":\"thay thế\",\"definitionEn\":\"to put something new in the place of something else\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: be replaced by machines · replace A with B\"},{\"id\":\"skilled|adj\",\"term\":\"skilled\",\"reading\":\"/skɪld/\",\"meaning\":\"có tay nghề; lành nghề\",\"definitionEn\":\"trained and good at a job\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: skilled workers · highly skilled\",\"example\":{\"text\":\"Skilled workers can find jobs more easily, especially in the IT industry.\",\"vi\":\"Lao động có tay nghề tìm việc dễ hơn, nhất là trong ngành công nghệ thông tin.\"}},{\"id\":\"retrain|v\",\"term\":\"retrain\",\"reading\":\"/ˌriːˈtreɪn/\",\"meaning\":\"đào tạo lại (cho nghề mới)\",\"definitionEn\":\"to learn new skills for a different job\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: retrain workers · retrain as a programmer\",\"example\":{\"text\":\"If factory workers lose their jobs, the government should help them retrain.\",\"vi\":\"Nếu công nhân nhà máy mất việc, chính phủ nên giúp họ đào tạo lại.\"}},{\"id\":\"workforce|n\",\"term\":\"workforce\",\"reading\":\"/ˈwɜːk.fɔːs/\",\"meaning\":\"lực lượng lao động\",\"definitionEn\":\"all the people who work in a country or company\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Hay đi với: a skilled workforce · join the workforce\",\"example\":{\"text\":\"Women now make up almost half of the workforce in many wealthy countries.\",\"vi\":\"Phụ nữ hiện chiếm gần một nửa lực lượng lao động ở nhiều nước giàu.\"}},{\"id\":\"flexible|adj\",\"term\":\"flexible\",\"reading\":\"/ˈflek.sə.bəl/\",\"meaning\":\"linh hoạt\",\"definitionEn\":\"able to change easily\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Trọng âm: FLEX-i-ble — Hay đi với: flexible working hours · a flexible job\",\"example\":{\"text\":\"Young people today want flexible jobs rather than a job for life.\",\"vi\":\"Người trẻ ngày nay muốn công việc linh hoạt hơn là một công việc suốt đời.\"}},{\"id\":\"poverty|n\",\"term\":\"poverty\",\"reading\":\"/ˈpɒv.ə.ti/\",\"meaning\":\"sự nghèo đói\",\"definitionEn\":\"the state of being very poor\",\"lesson\":40,\"pos\":\"n\",\"hint\":\"Hay đi với: live in poverty · reduce poverty\",\"example\":{\"text\":\"Poverty and a lack of education are two root causes of juvenile crime.\",\"vi\":\"Nghèo đói và thiếu giáo dục là hai nguyên nhân gốc rễ của tội phạm vị thành niên.\"}},{\"id\":\"wealthy|adj\",\"term\":\"wealthy\",\"reading\":\"/ˈwel.θi/\",\"meaning\":\"giàu có\",\"definitionEn\":\"having a lot of money\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: wealthy families · the gap between wealthy and poor people\",\"example\":{\"text\":\"Women now make up almost half of the workforce in many wealthy countries.\",\"vi\":\"Phụ nữ hiện chiếm gần một nửa lực lượng lao động ở nhiều nước giàu.\"}},{\"id\":\"invest|v\",\"term\":\"invest\",\"reading\":\"/ɪnˈvest/\",\"meaning\":\"đầu tư\",\"definitionEn\":\"to put money into something to make a profit\",\"lesson\":40,\"pos\":\"v\",\"hint\":\"Hay đi với: invest in education · invest money in\",\"example\":{\"text\":\"In terms of reducing poverty, the government should invest in education.\",\"vi\":\"Về việc giảm nghèo, chính phủ nên đầu tư vào giáo dục.\"}},{\"id\":\"lifelong-learning|phr-n\",\"term\":\"lifelong learning\",\"reading\":\"/ˌlaɪf.lɒŋ ˈlɜː.nɪŋ/\",\"meaning\":\"học tập suốt đời\",\"definitionEn\":\"continuing to study and gain skills throughout your life\",\"lesson\":40,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: encourage lifelong learning\"},{\"id\":\"in-demand|adj\",\"term\":\"in-demand\",\"reading\":\"/ɪn dɪˈmɑːnd/\",\"meaning\":\"đang được săn đón; có nhu cầu cao\",\"definitionEn\":\"wanted by many employers or customers\",\"lesson\":40,\"pos\":\"adj\",\"hint\":\"Hay đi với: in-demand skills · be in demand\"},{\"id\":\"globalisation|n\",\"term\":\"globalisation\",\"reading\":\"/ˌɡləʊ.bəl.aɪˈzeɪ.ʃən/\",\"meaning\":\"toàn cầu hóa\",\"definitionEn\":\"the process of countries becoming more connected through trade\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Trọng âm: glo-bal-i-SA-tion — Hay đi với: the effects of globalisation · economic globalisation\",\"example\":{\"text\":\"Buying imported goods has become much easier because of globalisation.\",\"vi\":\"Mua hàng nhập khẩu đã trở nên dễ dàng hơn nhiều nhờ toàn cầu hóa.\"}},{\"id\":\"global|adj\",\"term\":\"global\",\"reading\":\"/ˈɡləʊ.bəl/\",\"meaning\":\"toàn cầu\",\"definitionEn\":\"affecting the whole world\",\"lesson\":41,\"pos\":\"adj\",\"hint\":\"Hay đi với: the global economy · a global brand\",\"example\":{\"text\":\"Global warming makes summers hotter every year.\",\"vi\":\"Sự nóng lên toàn cầu khiến mùa hè mỗi năm một nóng hơn.\"}},{\"id\":\"multinational-corporation|phr-n\",\"term\":\"multinational corporation\",\"reading\":\"/ˌmʌl.tiˌnæʃ.ən.əl ˌkɔː.pəˈreɪ.ʃən/\",\"meaning\":\"tập đoàn đa quốc gia\",\"definitionEn\":\"a large company operating in many countries\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: large multinational corporations · work for a multinational\"},{\"id\":\"supply-chain|phr-n\",\"term\":\"supply chain\",\"reading\":\"/səˈplaɪ ˌtʃeɪn/\",\"meaning\":\"chuỗi cung ứng\",\"definitionEn\":\"the steps needed to make a product and get it to customers\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: global supply chains · a break in the supply chain\"},{\"id\":\"trade|n\",\"term\":\"trade\",\"reading\":\"/treɪd/\",\"meaning\":\"thương mại; buôn bán\",\"definitionEn\":\"buying and selling goods between countries\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: international trade · free trade\",\"example\":{\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"}},{\"id\":\"trade-barrier|phr-n\",\"term\":\"trade barrier\",\"reading\":\"/ˈtreɪd ˌbær.i.ər/\",\"meaning\":\"rào cản thương mại (thuế, hạn ngạch…)\",\"definitionEn\":\"a tax or rule that limits imports\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: remove trade barriers · reduce trade barriers\"},{\"id\":\"cultural-homogenisation|phr-n\",\"term\":\"cultural homogenisation\",\"reading\":\"/ˌkʌl.tʃər.əl həˌmɒdʒ.ən.aɪˈzeɪ.ʃən/\",\"meaning\":\"sự đồng nhất hóa văn hóa (các nền văn hóa trở nên giống nhau)\",\"definitionEn\":\"the process of different cultures becoming similar\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lead to cultural homogenisation\"},{\"id\":\"consumer|n\",\"term\":\"consumer\",\"reading\":\"/kənˈsjuː.mər/\",\"meaning\":\"người tiêu dùng\",\"definitionEn\":\"a person who buys goods or services\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Trọng âm: con-SU-mer — Hay đi với: consumers can choose · consumer goods\"},{\"id\":\"goods|n\",\"term\":\"goods\",\"reading\":\"/ɡʊdz/\",\"meaning\":\"hàng hóa\",\"definitionEn\":\"things that are made to be sold\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: imported goods · cheap goods\",\"example\":{\"text\":\"The total comprises five categories of goods.\",\"vi\":\"Tổng số gồm năm nhóm hàng hóa.\"}},{\"id\":\"local-business|phr-n\",\"term\":\"local business\",\"reading\":\"/ˌləʊ.kəl ˈbɪz.nɪs/\",\"meaning\":\"doanh nghiệp địa phương\",\"definitionEn\":\"a small company that serves people in its area\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: support local businesses · compete with local businesses\"},{\"id\":\"fast-food|phr-n\",\"term\":\"fast food\",\"reading\":\"/ˌfɑːst ˈfuːd/\",\"meaning\":\"đồ ăn nhanh\",\"definitionEn\":\"quick, cheap meals like burgers and fries\",\"lesson\":41,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: fast-food chains · eat fast food\"},{\"id\":\"interconnected|adj\",\"term\":\"interconnected\",\"reading\":\"/ˌɪn.tə.kəˈnek.tɪd/\",\"meaning\":\"kết nối chặt chẽ với nhau\",\"definitionEn\":\"closely linked to each other\",\"lesson\":41,\"pos\":\"adj\",\"hint\":\"Hay đi với: an interconnected world · closely interconnected\",\"example\":{\"text\":\"In an interconnected world, a crisis in one country quickly spreads to others.\",\"vi\":\"Trong một thế giới kết nối chặt chẽ, khủng hoảng ở một nước nhanh chóng lan sang nước khác.\"}},{\"id\":\"benefit-from|phr-v\",\"term\":\"benefit from\",\"reading\":\"/ˈben.ɪ.fɪt frəm/\",\"meaning\":\"được hưởng lợi từ\",\"definitionEn\":\"to get an advantage from something\",\"lesson\":41,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: benefit from trade · benefit from globalisation\"},{\"id\":\"impact|n\",\"term\":\"impact\",\"reading\":\"/ˈɪm.pækt/\",\"meaning\":\"tác động; ảnh hưởng\",\"definitionEn\":\"a strong effect\",\"lesson\":41,\"pos\":\"n\",\"hint\":\"Hay đi với: have an impact on · a positive/negative impact\",\"example\":{\"text\":\"Removing trade barriers has had a big impact on Vietnam's exports.\",\"vi\":\"Việc dỡ bỏ rào cản thương mại đã tác động lớn đến xuất khẩu của Việt Nam.\"}},{\"id\":\"manufacture|v\",\"term\":\"manufacture\",\"reading\":\"/ˌmæn.jəˈfæk.tʃər/\",\"meaning\":\"sản xuất (hàng loạt, trong nhà máy)\",\"definitionEn\":\"to make goods in large numbers in a factory\",\"lesson\":41,\"pos\":\"v\",\"hint\":\"Trọng âm: man-u-FAC-ture — Hay đi với: manufacture goods · be manufactured in Vietnam\"},{\"id\":\"outsource|v\",\"term\":\"outsource\",\"reading\":\"/ˈaʊt.sɔːs/\",\"meaning\":\"thuê ngoài (chuyển công việc cho công ty/nước khác làm)\",\"definitionEn\":\"to pay another company to do work for you\",\"lesson\":41,\"pos\":\"v\",\"hint\":\"Hay đi với: outsource production · outsource jobs to\",\"example\":{\"text\":\"Multinational corporations often outsource production to countries with lower wages.\",\"vi\":\"Các tập đoàn đa quốc gia thường thuê ngoài việc sản xuất ở các nước có lương thấp hơn.\"}},{\"id\":\"pie-chart|phr-n\",\"term\":\"pie chart\",\"reading\":\"/ˈpaɪ ˌtʃɑːt/\",\"meaning\":\"biểu đồ tròn\",\"definitionEn\":\"a circle divided into slices to show parts of a whole\",\"lesson\":42,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the two pie charts compare · the pie chart illustrates\"},{\"id\":\"account-for|phr-v\",\"term\":\"account for\",\"reading\":\"/əˈkaʊnt fɔːr/\",\"meaning\":\"chiếm (một tỉ lệ)\",\"definitionEn\":\"to form a certain part of a total\",\"lesson\":42,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: account for 40% of · account for the largest share\"},{\"id\":\"make-up|phr-v\",\"term\":\"make up\",\"reading\":\"/ˌmeɪk ˈʌp/\",\"meaning\":\"chiếm; tạo thành (một phần của tổng)\",\"definitionEn\":\"to form a part of a whole\",\"lesson\":42,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: make up a quarter of · make up the majority\"},{\"id\":\"represent|v\",\"term\":\"represent\",\"reading\":\"/ˌrep.rɪˈzent/\",\"meaning\":\"chiếm; tương ứng với; đại diện cho\",\"definitionEn\":\"to be equal to; to stand for\",\"lesson\":42,\"pos\":\"v\",\"hint\":\"Trọng âm: rep-re-SENT — Hay đi với: represent 15% of the total\"},{\"id\":\"percentage|n\",\"term\":\"percentage\",\"reading\":\"/pəˈsen.tɪdʒ/\",\"meaning\":\"tỉ lệ phần trăm\",\"definitionEn\":\"an amount shown as a part of 100\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Trọng âm: per-CEN-tage — Hay đi với: a high percentage of · the percentage of people who\",\"example\":{\"text\":\"The percentage of exports going to the USA rose from 20% to 30%.\",\"vi\":\"Tỉ lệ xuất khẩu sang Mỹ tăng từ 20% lên 30%.\"}},{\"id\":\"half|n\",\"term\":\"half\",\"reading\":\"/hɑːf/\",\"meaning\":\"một nửa\",\"definitionEn\":\"one of two equal parts\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Chữ l câm: haf. — Hay đi với: just over half · half of the total\",\"example\":{\"text\":\"I get up at half past six in the morning.\",\"vi\":\"Tôi dậy lúc sáu rưỡi sáng.\"}},{\"id\":\"segment|n\",\"term\":\"segment\",\"reading\":\"/ˈseɡ.mənt/\",\"meaning\":\"phần; miếng (của biểu đồ tròn)\",\"definitionEn\":\"one of the parts something is divided into\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Hay đi với: the largest segment · the smallest segment of the pie\",\"example\":{\"text\":\"Coal was the largest segment of the pie in both years.\",\"vi\":\"Than đá là phần lớn nhất của biểu đồ tròn trong cả hai năm.\"}},{\"id\":\"minority|n\",\"term\":\"minority\",\"reading\":\"/maɪˈnɒr.ə.ti/\",\"meaning\":\"thiểu số; phần nhỏ\",\"definitionEn\":\"a smaller part of a group, less than half\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Trọng âm: mi-NOR-i-ty — Hay đi với: a small minority of · only a minority\",\"example\":{\"text\":\"Agricultural products represented only a small minority of exports.\",\"vi\":\"Nông sản chỉ chiếm một phần nhỏ trong xuất khẩu.\"}},{\"id\":\"comprise|v\",\"term\":\"comprise\",\"reading\":\"/kəmˈpraɪz/\",\"meaning\":\"bao gồm; gồm có\",\"definitionEn\":\"to consist of; to be made up of\",\"lesson\":42,\"pos\":\"v\",\"hint\":\"Hay đi với: the total comprises five categories\"},{\"id\":\"remainder|n\",\"term\":\"remainder\",\"reading\":\"/rɪˈmeɪn.dər/\",\"meaning\":\"phần còn lại\",\"definitionEn\":\"the part that is left\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Hay đi với: the remainder · the remaining 10%\",\"example\":{\"text\":\"The remainder was made up of other goods, such as furniture and toys.\",\"vi\":\"Phần còn lại gồm các mặt hàng khác, như đồ nội thất và đồ chơi.\"}},{\"id\":\"combined|adj\",\"term\":\"combined\",\"reading\":\"/kəmˈbaɪnd/\",\"meaning\":\"gộp lại; cộng lại\",\"definitionEn\":\"added together\",\"lesson\":42,\"pos\":\"adj\",\"hint\":\"Hay đi với: Combined, they accounted for … · the combined total\",\"example\":{\"text\":\"Combined, Asia and Europe received three quarters of all exports.\",\"vi\":\"Gộp lại, châu Á và châu Âu nhận ba phần tư tổng xuất khẩu.\"}},{\"id\":\"table|n\",\"term\":\"table\",\"reading\":\"/ˈteɪ.bəl/\",\"meaning\":\"bảng (số liệu)\",\"definitionEn\":\"information arranged in rows and columns\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Hay đi với: the table shows · according to the table\",\"example\":{\"text\":\"The table is made of wood.\",\"vi\":\"Cái bàn làm bằng gỗ.\"}},{\"id\":\"nearly|adv\",\"term\":\"nearly\",\"reading\":\"/ˈnɪə.li/\",\"meaning\":\"gần; suýt (hơi dưới một con số)\",\"definitionEn\":\"almost; a little less than\",\"lesson\":42,\"pos\":\"adv\",\"hint\":\"Hay đi với: nearly half · nearly 30%\",\"example\":{\"text\":\"In the chart, electronics accounted for nearly half of the country's exports.\",\"vi\":\"Trong biểu đồ, hàng điện tử chiếm gần một nửa xuất khẩu của quốc gia đó.\"}},{\"id\":\"share|n\",\"term\":\"share\",\"reading\":\"/ʃeər/\",\"meaning\":\"phần; tỉ phần\",\"definitionEn\":\"a part of something divided between people or groups\",\"lesson\":42,\"pos\":\"n\",\"hint\":\"Hay đi với: the largest share of · a smaller share\",\"example\":{\"text\":\"My colleagues and I share ideas so that we can finish projects faster.\",\"vi\":\"Tôi và đồng nghiệp chia sẻ ý tưởng để có thể hoàn thành dự án nhanh hơn.\"}},{\"id\":\"just-over|colloc\",\"term\":\"just over\",\"reading\":\"/ˌdʒʌst ˈəʊ.vər/\",\"meaning\":\"nhỉnh hơn một chút\",\"definitionEn\":\"a little more than\",\"lesson\":42,\"pos\":\"colloc\",\"hint\":\"Hay đi với: just over a third · just over 20%\"},{\"id\":\"public-spending|phr-n\",\"term\":\"public spending\",\"reading\":\"/ˌpʌb.lɪk ˈspen.dɪŋ/\",\"meaning\":\"chi tiêu công\",\"definitionEn\":\"money the government spends on services\",\"lesson\":43,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: increase public spending on · cuts in public spending\"},{\"id\":\"tax|n\",\"term\":\"tax\",\"reading\":\"/tæks/\",\"meaning\":\"thuế\",\"definitionEn\":\"money people must pay to the government\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: pay tax · raise taxes\",\"example\":{\"text\":\"The company used a legal loophole to avoid paying tax.\",\"vi\":\"Công ty đã lợi dụng kẽ hở pháp luật để trốn thuế.\"}},{\"id\":\"taxation|n\",\"term\":\"taxation\",\"reading\":\"/tækˈseɪ.ʃən/\",\"meaning\":\"hệ thống thuế; việc đánh thuế\",\"definitionEn\":\"the system of collecting money for the state from people\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Trọng âm: tax-A-tion — Hay đi với: high taxation · fair taxation\",\"example\":{\"text\":\"Some people think high taxation discourages people from working harder.\",\"vi\":\"Một số người cho rằng mức thuế cao khiến người ta không muốn làm việc chăm hơn.\"}},{\"id\":\"welfare|n\",\"term\":\"welfare\",\"reading\":\"/ˈwel.feər/\",\"meaning\":\"phúc lợi xã hội\",\"definitionEn\":\"help given by the state to people in need\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: the welfare system · welfare benefits\",\"example\":{\"text\":\"In a welfare state, citizens get free healthcare and education.\",\"vi\":\"Trong một nhà nước phúc lợi, công dân được chăm sóc y tế và giáo dục miễn phí.\"}},{\"id\":\"subsidy|n\",\"term\":\"subsidy\",\"reading\":\"/ˈsʌb.sə.di/\",\"meaning\":\"trợ cấp (của nhà nước)\",\"definitionEn\":\"money the government pays to reduce costs\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Trọng âm: SUB-si-dy — Hay đi với: government subsidies · a subsidy for farmers\"},{\"id\":\"policy|n\",\"term\":\"policy\",\"reading\":\"/ˈpɒl.ə.si/\",\"meaning\":\"chính sách\",\"definitionEn\":\"a plan of action agreed by a government or organisation\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: government policy · introduce a new policy\",\"example\":{\"text\":\"The policy was unpopular at first. It reduced crime, nonetheless.\",\"vi\":\"Chính sách lúc đầu không được ủng hộ. Dù vậy, nó vẫn làm giảm tội phạm.\"}},{\"id\":\"implement|v\",\"term\":\"implement\",\"reading\":\"/ˈɪm.plɪ.ment/\",\"meaning\":\"thực thi; triển khai\",\"definitionEn\":\"to put a plan into action\",\"lesson\":43,\"pos\":\"v\",\"hint\":\"Trọng âm: IM-ple-ment — Hay đi với: implement a policy · implement changes\"},{\"id\":\"introduce|v\",\"term\":\"introduce\",\"reading\":\"/ˌɪn.trəˈdʒuːs/\",\"meaning\":\"đưa ra; ban hành (luật, chính sách); giới thiệu\",\"definitionEn\":\"to bring in a new law or system\",\"lesson\":43,\"pos\":\"v\",\"hint\":\"Trọng âm: in-tro-DUCE — Hay đi với: introduce a law · introduce a tax\"},{\"id\":\"ban|v\",\"term\":\"ban\",\"reading\":\"/bæn/\",\"meaning\":\"cấm\",\"definitionEn\":\"to officially forbid something\",\"lesson\":43,\"pos\":\"v\",\"hint\":\"Hay đi với: ban smoking in public places · be banned from\",\"example\":{\"text\":\"The city imposed a ban on plastic bags last year.\",\"vi\":\"Thành phố đã áp lệnh cấm túi nhựa năm ngoái.\"}},{\"id\":\"citizen|n\",\"term\":\"citizen\",\"reading\":\"/ˈsɪt.ɪ.zən/\",\"meaning\":\"công dân\",\"definitionEn\":\"a person who legally belongs to a country\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: ordinary citizens · the rights of citizens\"},{\"id\":\"authority|n\",\"term\":\"authority\",\"reading\":\"/ɔːˈθɒr.ə.ti/\",\"meaning\":\"chính quyền; nhà chức trách (số nhiều: the authorities)\",\"definitionEn\":\"an official organisation with power to make decisions\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Trọng âm: au-THOR-i-ty — Hay đi với: the local authorities · the authorities should\"},{\"id\":\"funding|n\",\"term\":\"funding\",\"reading\":\"/ˈfʌn.dɪŋ/\",\"meaning\":\"nguồn kinh phí; tài trợ\",\"definitionEn\":\"money provided for a particular purpose\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: government funding · funding for research\",\"example\":{\"text\":\"Had the gallery received more funding, it would not have closed.\",\"vi\":\"Nếu phòng tranh được tài trợ nhiều hơn thì nó đã không đóng cửa.\"}},{\"id\":\"budget|n\",\"term\":\"budget\",\"reading\":\"/ˈbʌdʒ.ɪt/\",\"meaning\":\"ngân sách\",\"definitionEn\":\"a plan for how much money can be spent\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: the national budget · a limited budget\",\"example\":{\"text\":\"Families in Country A allocated 35% of their budget to housing (hypothetical figures).\",\"vi\":\"Các gia đình ở nước A dành 35% ngân sách cho nhà ở (số liệu giả định).\"}},{\"id\":\"public-service|phr-n\",\"term\":\"public service\",\"reading\":\"/ˌpʌb.lɪk ˈsɜː.vɪs/\",\"meaning\":\"dịch vụ công\",\"definitionEn\":\"a service provided by the state, e.g. hospitals\",\"lesson\":43,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: improve public services · public services such as healthcare\"},{\"id\":\"healthcare|n\",\"term\":\"healthcare\",\"reading\":\"/ˈhelθ.keər/\",\"meaning\":\"chăm sóc y tế\",\"definitionEn\":\"medical services for people\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: free healthcare · access to healthcare\",\"example\":{\"text\":\"In a welfare state, citizens get free healthcare and education.\",\"vi\":\"Trong một nhà nước phúc lợi, công dân được chăm sóc y tế và giáo dục miễn phí.\"}},{\"id\":\"enforce|v\",\"term\":\"enforce\",\"reading\":\"/ɪnˈfɔːs/\",\"meaning\":\"thực thi (luật) một cách nghiêm\",\"definitionEn\":\"to make people obey a law\",\"lesson\":43,\"pos\":\"v\",\"hint\":\"Hay đi với: enforce the law · strictly enforced\"},{\"id\":\"measure|n\",\"term\":\"measure\",\"reading\":\"/ˈmeʒ.ər/\",\"meaning\":\"biện pháp\",\"definitionEn\":\"an action taken to deal with a problem\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: take measures to · effective measures\"},{\"id\":\"scheme|n\",\"term\":\"scheme\",\"reading\":\"/skiːm/\",\"meaning\":\"chương trình; kế hoạch (của chính phủ, tổ chức)\",\"definitionEn\":\"an official plan or programme\",\"lesson\":43,\"pos\":\"n\",\"hint\":\"Hay đi với: a government scheme · a recycling scheme\",\"example\":{\"text\":\"The recycling scheme was implemented in 2022, but it has not had enough funding.\",\"vi\":\"Chương trình tái chế được triển khai năm 2022, nhưng chưa có đủ kinh phí.\"}},{\"id\":\"problem|n\",\"term\":\"problem\",\"reading\":\"/ˈprɒb.ləm/\",\"meaning\":\"vấn đề\",\"definitionEn\":\"a difficult situation that needs dealing with\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: a serious problem · solve a problem\",\"example\":{\"text\":\"Food waste is a big problem in restaurants.\",\"vi\":\"Lãng phí thực phẩm là một vấn đề lớn ở các nhà hàng.\"}},{\"id\":\"issue|n\",\"term\":\"issue\",\"reading\":\"/ˈɪʃ.uː/\",\"meaning\":\"vấn đề (cần bàn, cần giải quyết)\",\"definitionEn\":\"a topic that people discuss or worry about\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: a social issue · address an issue\",\"example\":{\"text\":\"Air pollution is a serious issue with long-term consequences for children's health.\",\"vi\":\"Ô nhiễm không khí là một vấn đề nghiêm trọng với hậu quả lâu dài cho sức khỏe trẻ em.\"}},{\"id\":\"cause|n\",\"term\":\"cause\",\"reading\":\"/kɔːz/\",\"meaning\":\"nguyên nhân\",\"definitionEn\":\"what makes something happen\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: the main cause of · one cause of the problem\"},{\"id\":\"solution|n\",\"term\":\"solution\",\"reading\":\"/səˈluː.ʃən/\",\"meaning\":\"giải pháp\",\"definitionEn\":\"a way of dealing with a problem\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: so-LU-tion — Hay đi với: a solution to the problem · find a solution\",\"example\":{\"text\":\"One solution is to give people incentives to use public transport.\",\"vi\":\"Một giải pháp là khuyến khích người dân dùng phương tiện công cộng.\"}},{\"id\":\"solve|v\",\"term\":\"solve\",\"reading\":\"/sɒlv/\",\"meaning\":\"giải quyết\",\"definitionEn\":\"to find an answer to a problem\",\"lesson\":44,\"pos\":\"v\",\"hint\":\"Hay đi với: solve a problem · be solved by\",\"example\":{\"text\":\"There is no simple way to solve this problem.\",\"vi\":\"Không có cách đơn giản nào để giải quyết vấn đề này.\"}},{\"id\":\"consequence|n\",\"term\":\"consequence\",\"reading\":\"/ˈkɒn.sɪ.kwəns/\",\"meaning\":\"hậu quả\",\"definitionEn\":\"a result, often a bad one\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: CON-se-quence — Hay đi với: serious consequences · as a consequence\"},{\"id\":\"lead-to|phr-v\",\"term\":\"lead to\",\"reading\":\"/ˈliːd tuː/\",\"meaning\":\"dẫn đến\",\"definitionEn\":\"to cause something to happen\",\"lesson\":44,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: lead to health problems · lead to an increase in\"},{\"id\":\"result-in|phr-v\",\"term\":\"result in\",\"reading\":\"/rɪˈzʌlt ɪn/\",\"meaning\":\"gây ra; dẫn đến (kết quả)\",\"definitionEn\":\"to have something as an effect\",\"lesson\":44,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: result in higher prices · result in serious damage\"},{\"id\":\"tackle|v\",\"term\":\"tackle\",\"reading\":\"/ˈtæk.əl/\",\"meaning\":\"giải quyết; đối phó với (vấn đề khó)\",\"definitionEn\":\"to make an effort to deal with a difficult problem\",\"lesson\":44,\"pos\":\"v\",\"hint\":\"Hay đi với: tackle the problem of · tackle obesity\"},{\"id\":\"address|v\",\"term\":\"address\",\"reading\":\"/əˈdres/\",\"meaning\":\"giải quyết; xử lý (một vấn đề)\",\"definitionEn\":\"to start dealing with a problem\",\"lesson\":44,\"pos\":\"v\",\"hint\":\"2 chữ d, 2 chữ s: ad-DRESS. — Trọng âm: ad-DRESS — Hay đi với: address the issue · address this problem\",\"example\":\"$0:f:0:1:1:children:1:children:1:children:0:props:children:0:props:children:1:props:words:4:example\"},{\"id\":\"effective|adj\",\"term\":\"effective\",\"reading\":\"/ɪˈfek.tɪv/\",\"meaning\":\"hiệu quả\",\"definitionEn\":\"working well; producing the result you want\",\"lesson\":44,\"pos\":\"adj\",\"hint\":\"Trọng âm: ef-FEC-tive — Hay đi với: an effective solution · highly effective\",\"example\":{\"text\":\"Heavy penalties are effective only if the law is enforced.\",\"vi\":\"Hình phạt nặng chỉ hiệu quả nếu luật được thực thi.\"}},{\"id\":\"priority|n\",\"term\":\"priority\",\"reading\":\"/praɪˈɒr.ə.ti/\",\"meaning\":\"sự ưu tiên; việc ưu tiên\",\"definitionEn\":\"something that is more important than other things\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: pri-OR-i-ty — Hay đi với: a top priority · give priority to\",\"example\":{\"text\":\"The government should make road safety a top priority.\",\"vi\":\"Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu.\"}},{\"id\":\"campaign|n\",\"term\":\"campaign\",\"reading\":\"/kæmˈpeɪn/\",\"meaning\":\"chiến dịch\",\"definitionEn\":\"a planned series of actions to achieve a goal\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: an advertising campaign · launch a campaign\",\"example\":{\"text\":\"A national campaign could raise awareness of the dangers of drink-driving.\",\"vi\":\"Một chiến dịch toàn quốc có thể nâng cao nhận thức về nguy hiểm của việc lái xe khi say rượu.\"}},{\"id\":\"raise-awareness|colloc\",\"term\":\"raise awareness\",\"reading\":\"/ˌreɪz əˈweə.nəs/\",\"meaning\":\"nâng cao nhận thức\",\"definitionEn\":\"to help people know more about a problem\",\"lesson\":44,\"pos\":\"colloc\",\"hint\":\"Hay đi với: raise awareness of the problem · raise public awareness\"},{\"id\":\"fund|v\",\"term\":\"fund\",\"reading\":\"/fʌnd/\",\"meaning\":\"cấp kinh phí; tài trợ\",\"definitionEn\":\"to provide money for something\",\"lesson\":44,\"pos\":\"v\",\"hint\":\"Hay đi với: be funded by the government · fund research\"},{\"id\":\"incentive|n\",\"term\":\"incentive\",\"reading\":\"/ɪnˈsen.tɪv/\",\"meaning\":\"biện pháp khuyến khích (thường bằng lợi ích)\",\"definitionEn\":\"something that encourages people to do something\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Trọng âm: in-CEN-tive — Hay đi với: tax incentives · an incentive to save\"},{\"id\":\"penalty|n\",\"term\":\"penalty\",\"reading\":\"/ˈpen.əl.ti/\",\"meaning\":\"hình phạt; mức phạt\",\"definitionEn\":\"a punishment for breaking a rule\",\"lesson\":44,\"pos\":\"n\",\"hint\":\"Hay đi với: heavy penalties · a penalty for\",\"example\":{\"text\":\"The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.\",\"vi\":\"Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.\"}},{\"id\":\"long-term|adj\",\"term\":\"long-term\",\"reading\":\"/ˌlɒŋˈtɜːm/\",\"meaning\":\"dài hạn\",\"definitionEn\":\"lasting for a long time into the future\",\"lesson\":44,\"pos\":\"adj\",\"hint\":\"Hay đi với: a long-term solution · in the long term\"},{\"id\":\"process|n\",\"term\":\"process\",\"reading\":\"/ˈprəʊ.ses/\",\"meaning\":\"quy trình; quá trình\",\"definitionEn\":\"a series of actions to achieve a result\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: the production process · a five-stage process\",\"example\":{\"text\":\"There are six stages in the process, from collection to delivery.\",\"vi\":\"Quy trình có sáu giai đoạn, từ thu gom đến phân phối.\"}},{\"id\":\"stage|n\",\"term\":\"stage\",\"reading\":\"/steɪdʒ/\",\"meaning\":\"giai đoạn; bước\",\"definitionEn\":\"one step in a process\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: at the first stage · the final stage\",\"example\":{\"text\":\"I had never performed in front of an audience before, so I had terrible stage fright.\",\"vi\":\"Tôi chưa từng biểu diễn trước khán giả, nên tôi run sợ sân khấu kinh khủng.\"}},{\"id\":\"diagram|n\",\"term\":\"diagram\",\"reading\":\"/ˈdaɪ.ə.ɡræm/\",\"meaning\":\"sơ đồ\",\"definitionEn\":\"a simple drawing that shows how something works\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: the diagram illustrates · a process diagram\",\"example\":{\"text\":\"The diagram illustrates how drinking water is produced from a river.\",\"vi\":\"Sơ đồ minh họa cách nước uống được sản xuất từ một con sông.\"}},{\"id\":\"raw-material|phr-n\",\"term\":\"raw material\",\"reading\":\"/ˌrɔː məˈtɪə.ri.əl/\",\"meaning\":\"nguyên liệu thô\",\"definitionEn\":\"a natural substance used to make products\",\"lesson\":46,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: raw materials such as clay · use recycled raw materials\"},{\"id\":\"transport|v\",\"term\":\"transport\",\"reading\":\"/trænˈspɔːt/\",\"meaning\":\"vận chuyển\",\"definitionEn\":\"to move goods or people from one place to another\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: trans-PORT — Hay đi với: be transported to a factory · transport goods by lorry\",\"example\":{\"text\":\"Public transport in my city is not as convenient as in Singapore.\",\"vi\":\"Giao thông công cộng ở thành phố tôi không tiện bằng ở Singapore.\"}},{\"id\":\"heat|v\",\"term\":\"heat\",\"reading\":\"/hiːt/\",\"meaning\":\"làm nóng; đun nóng\",\"definitionEn\":\"to make something warm or hot\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be heated to 200°C · heat the mixture\",\"example\":{\"text\":\"After a year of training, I'm used to running in the heat.\",\"vi\":\"Sau một năm luyện tập, tôi đã quen chạy dưới trời nóng.\"}},{\"id\":\"filter|v\",\"term\":\"filter\",\"reading\":\"/ˈfɪl.tər/\",\"meaning\":\"lọc\",\"definitionEn\":\"to remove dirt by passing a liquid through something\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be filtered through sand · filter out dirt\"},{\"id\":\"purify|v\",\"term\":\"purify\",\"reading\":\"/ˈpjʊə.rɪ.faɪ/\",\"meaning\":\"làm sạch; tinh lọc\",\"definitionEn\":\"to make something clean and safe\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: PU-ri-fy — Hay đi với: purify water · be purified with chemicals\",\"example\":{\"text\":\"Chemicals are added to purify the water and kill bacteria.\",\"vi\":\"Hóa chất được thêm vào để làm sạch nước và diệt vi khuẩn.\"}},{\"id\":\"store|v\",\"term\":\"store\",\"reading\":\"/stɔːr/\",\"meaning\":\"lưu trữ; cất giữ\",\"definitionEn\":\"to keep something somewhere until it is needed\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be stored in tanks · store water\"},{\"id\":\"sort|v\",\"term\":\"sort\",\"reading\":\"/sɔːt/\",\"meaning\":\"phân loại\",\"definitionEn\":\"to put things into groups\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be sorted by type · sort rubbish\"},{\"id\":\"crush|v\",\"term\":\"crush\",\"reading\":\"/krʌʃ/\",\"meaning\":\"nghiền; ép nát\",\"definitionEn\":\"to press something hard until it breaks into small pieces\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be crushed into small pieces\"},{\"id\":\"melt|v\",\"term\":\"melt\",\"reading\":\"/melt/\",\"meaning\":\"làm tan chảy; nung chảy\",\"definitionEn\":\"to turn something solid into liquid by heating it\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be melted down · melt plastic\"},{\"id\":\"package|v\",\"term\":\"package\",\"reading\":\"/ˈpæk.ɪdʒ/\",\"meaning\":\"đóng gói\",\"definitionEn\":\"to put goods into boxes or wrappers\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Hay đi với: be packaged and sold · packaged in boxes\"},{\"id\":\"deliver|v\",\"term\":\"deliver\",\"reading\":\"/dɪˈlɪv.ər/\",\"meaning\":\"giao; chuyển đến\",\"definitionEn\":\"to take goods to a person or place\",\"lesson\":46,\"pos\":\"v\",\"hint\":\"Trọng âm: de-LIV-er — Hay đi với: be delivered to shops · deliver water to homes\"},{\"id\":\"reservoir|n\",\"term\":\"reservoir\",\"reading\":\"/ˈrez.ə.vwɑːr/\",\"meaning\":\"hồ chứa nước\",\"definitionEn\":\"a large lake used to store water\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: be stored in a reservoir\",\"example\":{\"text\":\"The clean water is stored in a reservoir before it is delivered to homes.\",\"vi\":\"Nước sạch được lưu trong hồ chứa trước khi được đưa đến các hộ gia đình.\"}},{\"id\":\"subsequently|adv\",\"term\":\"subsequently\",\"reading\":\"/ˈsʌb.sɪ.kwənt.li/\",\"meaning\":\"sau đó\",\"definitionEn\":\"after that; later\",\"lesson\":46,\"pos\":\"adv\",\"hint\":\"Trọng âm: SUB-se-quent-ly\",\"example\":{\"text\":\"The mixture is heated to 200°C and subsequently packaged for sale.\",\"vi\":\"Hỗn hợp được đun nóng đến 200°C và sau đó được đóng gói để bán.\"}},{\"id\":\"once|conj\",\"term\":\"once\",\"reading\":\"/wʌns/\",\"meaning\":\"một khi; sau khi\",\"definitionEn\":\"as soon as; after\",\"lesson\":46,\"pos\":\"conj\",\"hint\":\"Hay đi với: once the water has been filtered, …\",\"example\":{\"text\":\"The Moon orbits the Earth once every 27 days.\",\"vi\":\"Mặt Trăng quay quanh Trái Đất 27 ngày một vòng.\"}},{\"id\":\"landfill|n\",\"term\":\"landfill\",\"reading\":\"/ˈlænd.fɪl/\",\"meaning\":\"bãi chôn lấp rác\",\"definitionEn\":\"a place where rubbish is buried in the ground\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: send waste to landfill · landfill sites\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"compost|n\",\"term\":\"compost\",\"reading\":\"/ˈkɒm.pɒst/\",\"meaning\":\"phân hữu cơ (ủ từ rác thực vật)\",\"definitionEn\":\"decayed plant waste used to feed soil\",\"lesson\":46,\"pos\":\"n\",\"hint\":\"Hay đi với: turn food waste into compost · make compost\",\"example\":{\"text\":\"Food waste can be turned into compost instead of being sent to landfill.\",\"vi\":\"Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.\"}},{\"id\":\"demolish|v\",\"term\":\"demolish\",\"reading\":\"/dɪˈmɒl.ɪʃ/\",\"meaning\":\"phá dỡ (công trình)\",\"definitionEn\":\"to knock down a building\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: de-MOL-ish — Hay đi với: be demolished to make way for · demolish old houses\"},{\"id\":\"construct|v\",\"term\":\"construct\",\"reading\":\"/kənˈstrʌkt/\",\"meaning\":\"xây dựng\",\"definitionEn\":\"to build something\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-STRUCT — Hay đi với: be constructed in the centre · construct a bridge\"},{\"id\":\"convert|v\",\"term\":\"convert\",\"reading\":\"/kənˈvɜːt/\",\"meaning\":\"chuyển đổi (mục đích sử dụng)\",\"definitionEn\":\"to change something into a different form or use\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: con-VERT — Hay đi với: be converted into a hotel · convert A into B\"},{\"id\":\"extend|v\",\"term\":\"extend\",\"reading\":\"/ɪkˈstend/\",\"meaning\":\"kéo dài; mở rộng (theo chiều dài)\",\"definitionEn\":\"to make something longer or larger\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the road was extended to the coast · extend the railway line\"},{\"id\":\"expand|v\",\"term\":\"expand\",\"reading\":\"/ɪkˈspænd/\",\"meaning\":\"mở rộng; phát triển (quy mô)\",\"definitionEn\":\"to become or make bigger in size\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the car park was expanded · expand significantly\"},{\"id\":\"relocate|v\",\"term\":\"relocate\",\"reading\":\"/ˌriː.ləʊˈkeɪt/\",\"meaning\":\"di dời; chuyển đến chỗ khác\",\"definitionEn\":\"to move to a new place\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Trọng âm: re-lo-CATE — Hay đi với: be relocated to the north · relocate the market\"},{\"id\":\"remove|v\",\"term\":\"remove\",\"reading\":\"/rɪˈmuːv/\",\"meaning\":\"dỡ bỏ; loại bỏ\",\"definitionEn\":\"to take something away\",\"lesson\":47,\"pos\":\"v\",\"hint\":\"Hay đi với: the trees were removed · remove the fence\"},{\"id\":\"residential|adj\",\"term\":\"residential\",\"reading\":\"/ˌrez.ɪˈden.ʃəl/\",\"meaning\":\"(thuộc) khu dân cư\",\"definitionEn\":\"having houses rather than offices or factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: res-i-DEN-tial — Hay đi với: a residential area · residential buildings\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"industrial|adj\",\"term\":\"industrial\",\"reading\":\"/ɪnˈdʌs.tri.əl/\",\"meaning\":\"(thuộc) công nghiệp\",\"definitionEn\":\"having factories\",\"lesson\":47,\"pos\":\"adj\",\"hint\":\"Trọng âm: in-DUS-tri-al — Hay đi với: an industrial area · industrial zone\",\"example\":{\"text\":\"An industrial zone has been constructed next to the railway station.\",\"vi\":\"Một khu công nghiệp đã được xây dựng bên cạnh nhà ga.\"}},{\"id\":\"woodland|n\",\"term\":\"woodland\",\"reading\":\"/ˈwʊd.lənd/\",\"meaning\":\"khu rừng nhỏ; đất rừng\",\"definitionEn\":\"land covered with trees\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: an area of woodland · woodland was cleared\",\"example\":{\"text\":\"The woodland in the south made way for a large car park.\",\"vi\":\"Khu rừng ở phía nam nhường chỗ cho một bãi đỗ xe lớn.\"}},{\"id\":\"farmland|n\",\"term\":\"farmland\",\"reading\":\"/ˈfɑːm.lænd/\",\"meaning\":\"đất nông nghiệp\",\"definitionEn\":\"land used for growing crops or keeping animals\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: farmland was replaced by houses\",\"example\":{\"text\":\"The farmland to the north of the river was replaced by a residential area.\",\"vi\":\"Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư.\"}},{\"id\":\"footpath|n\",\"term\":\"footpath\",\"reading\":\"/ˈfʊt.pɑːθ/\",\"meaning\":\"lối đi bộ\",\"definitionEn\":\"a narrow path for walking\",\"lesson\":47,\"pos\":\"n\",\"hint\":\"Hay đi với: a new footpath · a footpath along the river\",\"exam
