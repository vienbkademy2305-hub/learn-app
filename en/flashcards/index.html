ˈtend tuː/\",\"meaning\":\"thường có xu hướng (làm gì)\",\"definitionEn\":\"to usually do something\",\"lesson\":49,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: I tend to study late at night · students tend to\"},{\"id\":\"fairly|adv\",\"term\":\"fairly\",\"reading\":\"/ˈfeə.li/\",\"meaning\":\"khá (mức vừa phải)\",\"definitionEn\":\"to some degree; not very\",\"lesson\":49,\"pos\":\"adv\",\"hint\":\"Hay đi với: fairly easy · fairly often\",\"example\":{\"text\":\"Maths was fairly easy for me, but chemistry was quite challenging.\",\"vi\":\"Toán với tôi khá dễ, nhưng hóa thì khá khó.\"}},{\"id\":\"quite|adv\",\"term\":\"quite\",\"reading\":\"/kwaɪt/\",\"meaning\":\"khá\",\"definitionEn\":\"to some degree; rather\",\"lesson\":49,\"pos\":\"adv\",\"hint\":\"Hay đi với: quite difficult · quite a lot of\",\"example\":{\"text\":\"The actor was great, but the plot was quite boring.\",\"vi\":\"Diễn viên đóng rất hay, nhưng cốt truyện khá nhàm.\"}},{\"id\":\"memorise|v\",\"term\":\"memorise\",\"reading\":\"/ˈmem.ə.raɪz/\",\"meaning\":\"học thuộc; ghi nhớ\",\"definitionEn\":\"to learn something so you remember it exactly\",\"lesson\":49,\"pos\":\"v\",\"hint\":\"Hay đi với: memorise vocabulary · memorise facts\"},{\"id\":\"inspiring|adj\",\"term\":\"inspiring\",\"reading\":\"/ɪnˈspaɪə.rɪŋ/\",\"meaning\":\"truyền cảm hứng\",\"definitionEn\":\"making you want to do something great\",\"lesson\":49,\"pos\":\"adj\",\"hint\":\"Hay đi với: an inspiring teacher · inspiring stories\",\"example\":{\"text\":\"An inspiring teacher can act as a mentor for young learners.\",\"vi\":\"Một giáo viên truyền cảm hứng có thể là người dìu dắt cho những người học trẻ.\"}},{\"id\":\"challenging|adj\",\"term\":\"challenging\",\"reading\":\"/ˈtʃæl.ɪn.dʒɪŋ/\",\"meaning\":\"khó nhưng thú vị; đầy thử thách\",\"definitionEn\":\"difficult in an interesting way\",\"lesson\":49,\"pos\":\"adj\",\"hint\":\"Hay đi với: a challenging subject · find something challenging\",\"example\":{\"text\":\"Maths was fairly easy for me, but chemistry was quite challenging.\",\"vi\":\"Toán với tôi khá dễ, nhưng hóa thì khá khó.\"}},{\"id\":\"offence|n\",\"term\":\"offence\",\"reading\":\"/əˈfens/\",\"meaning\":\"hành vi phạm tội; tội\",\"definitionEn\":\"an illegal act; a crime\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: commit an offence · a serious offence\",\"example\":{\"text\":\"Anyone who commits a serious offence should be punished.\",\"vi\":\"Bất cứ ai phạm tội nghiêm trọng đều nên bị trừng phạt.\"}},{\"id\":\"juvenile-crime|phr-n\",\"term\":\"juvenile crime\",\"reading\":\"/ˈdʒuː.vən.aɪl ˌkraɪm/\",\"meaning\":\"tội phạm vị thành niên\",\"definitionEn\":\"illegal acts committed by young people under 18\",\"lesson\":50,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a rise in juvenile crime · tackle juvenile crime\"},{\"id\":\"law-enforcement|phr-n\",\"term\":\"law enforcement\",\"reading\":\"/ˈlɔː ɪnˌfɔːs.mənt/\",\"meaning\":\"việc thực thi pháp luật (cảnh sát, cơ quan chức năng)\",\"definitionEn\":\"police and officials who make people obey laws\",\"lesson\":50,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: law enforcement agencies · strict law enforcement\"},{\"id\":\"rehabilitate|v\",\"term\":\"rehabilitate\",\"reading\":\"/ˌriː.həˈbɪl.ɪ.teɪt/\",\"meaning\":\"cải tạo; giúp tái hòa nhập\",\"definitionEn\":\"to help a criminal live a normal life again\",\"lesson\":50,\"pos\":\"v\",\"hint\":\"Trọng âm: re-ha-BIL-i-tate — Hay đi với: rehabilitate offenders · be rehabilitated\",\"example\":{\"text\":\"Crime prevention programmes in schools can rehabilitate young people before it is too late.\",\"vi\":\"Các chương trình phòng chống tội phạm ở trường học có thể giúp cải tạo người trẻ trước khi quá muộn.\"}},{\"id\":\"rehabilitation|n\",\"term\":\"rehabilitation\",\"reading\":\"/ˌriː.həˌbɪl.ɪˈteɪ.ʃən/\",\"meaning\":\"sự cải tạo; phục hồi\",\"definitionEn\":\"helping someone return to normal life after prison\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Trọng âm: re-ha-bil-i-TA-tion — Hay đi với: rehabilitation programmes · focus on rehabilitation rather than punishment\",\"example\":{\"text\":\"The rehabilitation of young offenders should be a priority.\",\"vi\":\"Việc cải tạo người phạm tội trẻ tuổi nên được ưu tiên.\"}},{\"id\":\"reoffend|v\",\"term\":\"reoffend\",\"reading\":\"/ˌriː.əˈfend/\",\"meaning\":\"tái phạm\",\"definitionEn\":\"to commit another crime after being punished\",\"lesson\":50,\"pos\":\"v\",\"hint\":\"Hay đi với: are less likely to reoffend · the reoffending rate\",\"example\":{\"text\":\"Offenders who receive education in prison are less likely to reoffend.\",\"vi\":\"Người phạm tội được học tập trong tù ít có khả năng tái phạm hơn.\"}},{\"id\":\"deterrent|n\",\"term\":\"deterrent\",\"reading\":\"/dɪˈter.ənt/\",\"meaning\":\"biện pháp răn đe\",\"definitionEn\":\"something that makes people afraid to do wrong\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: act as a deterrent · an effective deterrent to crime\",\"example\":{\"text\":\"Long prison sentences do not always act as a deterrent.\",\"vi\":\"Án tù dài không phải lúc nào cũng có tác dụng răn đe.\"}},{\"id\":\"sentence|n\",\"term\":\"sentence\",\"reading\":\"/ˈsen.təns/\",\"meaning\":\"bản án; mức án\",\"definitionEn\":\"the punishment a court gives\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: a prison sentence · a long sentence\",\"example\":{\"text\":\"The main idea of a paragraph is often in the first sentence.\",\"vi\":\"Ý chính của một đoạn văn thường nằm ở câu đầu tiên.\"}},{\"id\":\"surveillance|n\",\"term\":\"surveillance\",\"reading\":\"/səˈveɪ.ləns/\",\"meaning\":\"sự giám sát\",\"definitionEn\":\"careful watching of people, often with cameras\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Trọng âm: sur-VEIL-lance — Hay đi với: video surveillance · under surveillance\",\"example\":{\"text\":\"More video surveillance may lead to an increase in public safety.\",\"vi\":\"Giám sát bằng camera nhiều hơn có thể giúp tăng an toàn công cộng.\"}},{\"id\":\"petty-crime|phr-n\",\"term\":\"petty crime\",\"reading\":\"/ˌpet.i ˈkraɪm/\",\"meaning\":\"tội phạm nhỏ; tội vặt (móc túi, trộm vặt)\",\"definitionEn\":\"small illegal acts like pickpocketing\",\"lesson\":50,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: petty crime such as shoplifting\"},{\"id\":\"cybercrime|n\",\"term\":\"cybercrime\",\"reading\":\"/ˈsaɪ.bə.kraɪm/\",\"meaning\":\"tội phạm mạng\",\"definitionEn\":\"illegal activity using computers or the internet\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: a rise in cybercrime · victims of cybercrime\",\"example\":{\"text\":\"The rise in cybercrime has worried many governments.\",\"vi\":\"Sự gia tăng tội phạm mạng khiến nhiều chính phủ lo ngại.\"}},{\"id\":\"violent-crime|phr-n\",\"term\":\"violent crime\",\"reading\":\"/ˌvaɪə.lənt ˈkraɪm/\",\"meaning\":\"tội phạm bạo lực\",\"definitionEn\":\"illegal acts that physically hurt people\",\"lesson\":50,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a fall in violent crime\"},{\"id\":\"crack-down-on|phr-v\",\"term\":\"crack down on\",\"reading\":\"/ˌkræk ˈdaʊn ɒn/\",\"meaning\":\"trấn áp mạnh tay\",\"definitionEn\":\"to take strong action to stop something\",\"lesson\":50,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: crack down on drink-driving · the police cracked down on theft\"},{\"id\":\"root-cause|phr-n\",\"term\":\"root cause\",\"reading\":\"/ˌruːt ˈkɔːz/\",\"meaning\":\"nguyên nhân gốc rễ\",\"definitionEn\":\"the basic reason behind a problem\",\"lesson\":50,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: tackle the root causes of crime · the root cause of the problem\"},{\"id\":\"reduction|n\",\"term\":\"reduction\",\"reading\":\"/rɪˈdʌk.ʃən/\",\"meaning\":\"sự giảm bớt\",\"definitionEn\":\"making something smaller or less\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: a significant reduction in · lead to a reduction in\",\"example\":{\"text\":\"There has been a significant reduction in petty crime since the cameras were installed.\",\"vi\":\"Tội vặt đã giảm đáng kể kể từ khi camera được lắp đặt.\"}},{\"id\":\"increase|n\",\"term\":\"increase\",\"reading\":\"/ˈɪŋ.kriːs/\",\"meaning\":\"sự gia tăng\",\"definitionEn\":\"a rise in amount or number\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Trọng âm: IN-crease — Hay đi với: an increase in crime · a sharp increase\",\"example\":\"$0:f:0:1:1:children:1:children:1:children:0:props:children:0:props:children:1:props:words:585:example\"},{\"id\":\"prevention|n\",\"term\":\"prevention\",\"reading\":\"/prɪˈven.ʃən/\",\"meaning\":\"sự phòng ngừa\",\"definitionEn\":\"stopping something bad from happening\",\"lesson\":50,\"pos\":\"n\",\"hint\":\"Hay đi với: crime prevention · prevention is better than cure\",\"example\":{\"text\":\"It is widely accepted that prevention is cheaper than treatment.\",\"vi\":\"Người ta thừa nhận rộng rãi rằng phòng ngừa rẻ hơn điều trị.\"}},{\"id\":\"moreover|adv\",\"term\":\"moreover\",\"reading\":\"/mɔːˈrəʊ.vər/\",\"meaning\":\"hơn nữa (thêm ý mạnh hơn)\",\"definitionEn\":\"in addition, and more importantly\",\"lesson\":51,\"pos\":\"adv\",\"hint\":\"Trọng âm: more-O-ver\",\"example\":{\"text\":\"Prison is expensive. Moreover, there is little evidence that it reduces crime.\",\"vi\":\"Nhà tù tốn kém. Hơn nữa, có rất ít bằng chứng cho thấy nó làm giảm tội phạm.\"}},{\"id\":\"furthermore|adv\",\"term\":\"furthermore\",\"reading\":\"/ˌfɜː.ðəˈmɔːr/\",\"meaning\":\"ngoài ra; hơn nữa\",\"definitionEn\":\"in addition\",\"lesson\":51,\"pos\":\"adv\",\"example\":{\"text\":\"Long-term imprisonment separates offenders from their families. Furthermore, it makes it harder for them to find work later.\",\"vi\":\"Án tù dài hạn tách người phạm tội khỏi gia đình. Ngoài ra, nó khiến họ khó tìm việc sau này.\"}},{\"id\":\"nevertheless|adv\",\"term\":\"nevertheless\",\"reading\":\"/ˌnev.ə.ðəˈles/\",\"meaning\":\"tuy vậy; dù vậy\",\"definitionEn\":\"in spite of that\",\"lesson\":51,\"pos\":\"adv\",\"hint\":\"Trọng âm: nev-er-the-LESS\",\"example\":{\"text\":\"The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.\",\"vi\":\"Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.\"}},{\"id\":\"nonetheless|adv\",\"term\":\"nonetheless\",\"reading\":\"/ˌnʌn.ðəˈles/\",\"meaning\":\"tuy nhiên; dù sao đi nữa\",\"definitionEn\":\"even so; despite this\",\"lesson\":51,\"pos\":\"adv\",\"example\":{\"text\":\"The policy was unpopular at first. It reduced crime, nonetheless.\",\"vi\":\"Chính sách lúc đầu không được ủng hộ. Dù vậy, nó vẫn làm giảm tội phạm.\"}},{\"id\":\"consequently|adv\",\"term\":\"consequently\",\"reading\":\"/ˈkɒn.sɪ.kwənt.li/\",\"meaning\":\"do đó; hậu quả là\",\"definitionEn\":\"as a result\",\"lesson\":51,\"pos\":\"adv\",\"hint\":\"Trọng âm: CON-se-quent-ly\",\"example\":{\"text\":\"Street lighting was improved in 2020. Consequently, night-time robberies fell by a third.\",\"vi\":\"Đèn đường được cải thiện năm 2020. Do đó, các vụ cướp ban đêm giảm một phần ba.\"}},{\"id\":\"thus|adv\",\"term\":\"thus\",\"reading\":\"/ðʌs/\",\"meaning\":\"vì vậy; do đó; như thế\",\"definitionEn\":\"in this way; so\",\"lesson\":51,\"pos\":\"adv\",\"hint\":\"Hay đi với: …, thus reducing crime\",\"example\":{\"text\":\"Education programmes give prisoners new skills, thus reducing the chance that they will reoffend.\",\"vi\":\"Các chương trình giáo dục trang bị kỹ năng mới cho phạm nhân, qua đó giảm khả năng họ tái phạm.\"}},{\"id\":\"conversely|adv\",\"term\":\"conversely\",\"reading\":\"/ˈkɒn.vɜːs.li/\",\"meaning\":\"ngược lại (chiều ngược)\",\"definitionEn\":\"in the opposite way\",\"lesson\":51,\"pos\":\"adv\",\"example\":{\"text\":\"Harsh sentences may deter adults. Conversely, they may push teenagers further into crime.\",\"vi\":\"Án nặng có thể răn đe người lớn. Ngược lại, chúng có thể đẩy thanh thiếu niên sâu hơn vào con đường phạm tội.\"}},{\"id\":\"as-a-result|idiom\",\"term\":\"as a result\",\"reading\":\"/æz ə rɪˈzʌlt/\",\"meaning\":\"kết quả là\",\"definitionEn\":\"because of this\",\"lesson\":51,\"pos\":\"idiom\"},{\"id\":\"justice|n\",\"term\":\"justice\",\"reading\":\"/ˈdʒʌs.tɪs/\",\"meaning\":\"công lý; sự công bằng\",\"definitionEn\":\"fair treatment according to the law\",\"lesson\":51,\"pos\":\"n\",\"hint\":\"Hay đi với: the justice system · bring someone to justice\",\"example\":{\"text\":\"The aim of the justice system should be to protect society. As a result, rehabilitation matters as much as punishment.\",\"vi\":\"Mục tiêu của hệ thống tư pháp phải là bảo vệ xã hội. Vì vậy, cải tạo cũng quan trọng như trừng phạt.\"}},{\"id\":\"trial|n\",\"term\":\"trial\",\"reading\":\"/traɪəl/\",\"meaning\":\"phiên tòa; sự xét xử\",\"definitionEn\":\"a legal process in court to decide if someone is guilty\",\"lesson\":51,\"pos\":\"n\",\"hint\":\"Hay đi với: a fair trial · go on trial\",\"example\":{\"text\":\"Everyone has the right to a fair trial, even people who are clearly guilty.\",\"vi\":\"Ai cũng có quyền được xét xử công bằng, kể cả người rõ ràng có tội.\"}},{\"id\":\"death-penalty|phr-n\",\"term\":\"death penalty\",\"reading\":\"/ˈdeθ ˌpen.əl.ti/\",\"meaning\":\"án tử hình\",\"definitionEn\":\"punishment by killing someone for a crime\",\"lesson\":51,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: abolish the death penalty · support the death penalty\"},{\"id\":\"corruption|n\",\"term\":\"corruption\",\"reading\":\"/kəˈrʌp.ʃən/\",\"meaning\":\"tham nhũng\",\"definitionEn\":\"dishonest behaviour by people in power, e.g. taking money\",\"lesson\":51,\"pos\":\"n\",\"hint\":\"Hay đi với: fight corruption · political corruption\",\"example\":{\"text\":\"Corruption weakens people's trust in the legal system.\",\"vi\":\"Tham nhũng làm suy giảm niềm tin của người dân vào hệ thống pháp luật.\"}},{\"id\":\"legal-system|phr-n\",\"term\":\"legal system\",\"reading\":\"/ˌliː.ɡəl ˈsɪs.təm/\",\"meaning\":\"hệ thống pháp luật\",\"definitionEn\":\"the laws and courts of a country\",\"lesson\":51,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: reform the legal system · trust in the legal system\"},{\"id\":\"imprisonment|n\",\"term\":\"imprisonment\",\"reading\":\"/ɪmˈprɪz.ən.mənt/\",\"meaning\":\"sự bỏ tù; án tù\",\"definitionEn\":\"the punishment of being kept in jail\",\"lesson\":51,\"pos\":\"n\",\"hint\":\"Hay đi với: life imprisonment · five years' imprisonment\",\"example\":{\"text\":\"Long-term imprisonment separates offenders from their families. Furthermore, it makes it harder for them to find work later.\",\"vi\":\"Án tù dài hạn tách người phạm tội khỏi gia đình. Ngoài ra, nó khiến họ khó tìm việc sau này.\"}},{\"id\":\"innocent|adj\",\"term\":\"innocent\",\"reading\":\"/ˈɪn.ə.sənt/\",\"meaning\":\"vô tội\",\"definitionEn\":\"not guilty of a crime\",\"lesson\":51,\"pos\":\"adj\",\"hint\":\"Hay đi với: innocent people · be found innocent\",\"example\":{\"text\":\"The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.\",\"vi\":\"Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.\"}},{\"id\":\"guilty|adj\",\"term\":\"guilty\",\"reading\":\"/ˈɡɪl.ti/\",\"meaning\":\"có tội; cảm thấy có lỗi\",\"definitionEn\":\"having done something wrong\",\"lesson\":51,\"pos\":\"adj\",\"hint\":\"Hay đi với: be found guilty of · feel guilty\",\"example\":{\"text\":\"The judge decided that the man was not guilty.\",\"vi\":\"Thẩm phán kết luận người đàn ông vô tội.\"}},{\"id\":\"evidence|n\",\"term\":\"evidence\",\"reading\":\"/ˈev.ɪ.dəns/\",\"meaning\":\"bằng chứng\",\"definitionEn\":\"facts or objects that show something is true\",\"lesson\":51,\"pos\":\"n\",\"hint\":\"Hay đi với: there is little evidence that · strong evidence\",\"example\":{\"text\":\"The samples were tested in a laboratory to find scientific evidence of water.\",\"vi\":\"Các mẫu được kiểm tra trong phòng thí nghiệm để tìm bằng chứng khoa học về nước.\"}},{\"id\":\"algorithm|n\",\"term\":\"algorithm\",\"reading\":\"/ˈæl.ɡə.rɪ.ðəm/\",\"meaning\":\"thuật toán\",\"definitionEn\":\"a set of steps a computer follows to solve a problem\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Trọng âm: AL-go-ri-thm — Hay đi với: a computer algorithm · algorithms decide what we see\"},{\"id\":\"machine-learning|phr-n\",\"term\":\"machine learning\",\"reading\":\"/məˌʃiːn ˈlɜː.nɪŋ/\",\"meaning\":\"học máy\",\"definitionEn\":\"computers improving their tasks by learning from data\",\"lesson\":52,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: machine learning systems · use machine learning to\"},{\"id\":\"ethical|adj\",\"term\":\"ethical\",\"reading\":\"/ˈeθ.ɪ.kəl/\",\"meaning\":\"(thuộc) đạo đức; hợp đạo đức\",\"definitionEn\":\"morally right and fair\",\"lesson\":52,\"pos\":\"adj\",\"hint\":\"Hay đi với: ethical questions · ethical concerns\",\"example\":{\"text\":\"Autonomous cars may reduce accidents, but they raise difficult ethical questions.\",\"vi\":\"Xe tự lái có thể giảm tai nạn, nhưng chúng đặt ra những câu hỏi đạo đức khó.\"}},{\"id\":\"bias|n\",\"term\":\"bias\",\"reading\":\"/ˈbaɪ.əs/\",\"meaning\":\"sự thiên lệch; thành kiến\",\"definitionEn\":\"an unfair preference for or against something\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Hay đi với: racial bias · a bias against women\",\"example\":{\"text\":\"Some algorithms appear to show a bias against women.\",\"vi\":\"Một số thuật toán dường như thể hiện sự thiên lệch với phụ nữ.\"}},{\"id\":\"transparency|n\",\"term\":\"transparency\",\"reading\":\"/trænˈspær.ən.si/\",\"meaning\":\"sự minh bạch\",\"definitionEn\":\"being open and honest about how things are done\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Trọng âm: trans-PAR-en-cy — Hay đi với: a lack of transparency · increase transparency\",\"example\":{\"text\":\"Companies should explain how their algorithms work, which would increase transparency.\",\"vi\":\"Các công ty nên giải thích thuật toán hoạt động ra sao, điều đó sẽ tăng tính minh bạch.\"}},{\"id\":\"autonomous|adj\",\"term\":\"autonomous\",\"reading\":\"/ɔːˈtɒn.ə.məs/\",\"meaning\":\"tự hành; tự chủ\",\"definitionEn\":\"able to operate without human control\",\"lesson\":52,\"pos\":\"adj\",\"hint\":\"Trọng âm: au-TON-o-mous — Hay đi với: autonomous vehicles · autonomous weapons\",\"example\":{\"text\":\"Autonomous cars may reduce accidents, but they raise difficult ethical questions.\",\"vi\":\"Xe tự lái có thể giảm tai nạn, nhưng chúng đặt ra những câu hỏi đạo đức khó.\"}},{\"id\":\"facial-recognition|phr-n\",\"term\":\"facial recognition\",\"reading\":\"/ˌfeɪ.ʃəl ˌrek.əɡˈnɪʃ.ən/\",\"meaning\":\"nhận diện khuôn mặt\",\"definitionEn\":\"technology that identifies people from their faces\",\"lesson\":52,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: facial recognition technology · facial recognition cameras\"},{\"id\":\"breakthrough|n\",\"term\":\"breakthrough\",\"reading\":\"/ˈbreɪk.θruː/\",\"meaning\":\"bước đột phá\",\"definitionEn\":\"an important new discovery\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Hay đi với: a major breakthrough in · a scientific breakthrough\",\"example\":{\"text\":\"Machine learning has led to a major breakthrough in medical diagnosis.\",\"vi\":\"Học máy đã dẫn đến một bước đột phá lớn trong chẩn đoán y khoa.\"}},{\"id\":\"capability|n\",\"term\":\"capability\",\"reading\":\"/ˌkeɪ.pəˈbɪl.ə.ti/\",\"meaning\":\"khả năng; năng lực\",\"definitionEn\":\"the ability or power to do something\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Hay đi với: the capabilities of AI · beyond human capability\"},{\"id\":\"unprecedented|adj\",\"term\":\"unprecedented\",\"reading\":\"/ʌnˈpres.ɪ.den.tɪd/\",\"meaning\":\"chưa từng có\",\"definitionEn\":\"never having happened before\",\"lesson\":52,\"pos\":\"adj\",\"hint\":\"Trọng âm: un-PREC-e-den-ted — Hay đi với: at an unprecedented speed · unprecedented change\",\"example\":{\"text\":\"Technology is changing society at an unprecedented speed.\",\"vi\":\"Công nghệ đang thay đổi xã hội với tốc độ chưa từng có.\"}},{\"id\":\"generate|v\",\"term\":\"generate\",\"reading\":\"/ˈdʒen.ə.reɪt/\",\"meaning\":\"tạo ra; sinh ra\",\"definitionEn\":\"to produce or create something\",\"lesson\":52,\"pos\":\"v\",\"hint\":\"Hay đi với: generate text · generate income\",\"example\":{\"text\":\"Chatbots can generate a whole essay in a few seconds.\",\"vi\":\"Chatbot có thể tạo ra cả một bài luận trong vài giây.\"}},{\"id\":\"arguably|adv\",\"term\":\"arguably\",\"reading\":\"/ˈɑːɡ.ju.ə.bli/\",\"meaning\":\"có thể nói là (có cơ sở để cho rằng)\",\"definitionEn\":\"used to say something can be supported with good reasons\",\"lesson\":52,\"pos\":\"adv\",\"example\":{\"text\":\"Arguably, the greatest risk of facial recognition is the loss of privacy.\",\"vi\":\"Có thể nói, rủi ro lớn nhất của nhận diện khuôn mặt là mất quyền riêng tư.\"}},{\"id\":\"likely|adj\",\"term\":\"likely\",\"reading\":\"/ˈlaɪ.kli/\",\"meaning\":\"có khả năng xảy ra\",\"definitionEn\":\"probably going to happen\",\"lesson\":52,\"pos\":\"adj\",\"hint\":\"Hay đi với: be likely to + V · it is likely that\",\"example\":{\"text\":\"AI is likely to change most office jobs within the next decade.\",\"vi\":\"AI có khả năng cao sẽ thay đổi hầu hết công việc văn phòng trong thập kỷ tới.\"}},{\"id\":\"potential|n\",\"term\":\"potential\",\"reading\":\"/pəˈten.ʃəl/\",\"meaning\":\"tiềm năng\",\"definitionEn\":\"qualities that could develop in the future\",\"lesson\":52,\"pos\":\"n\",\"hint\":\"Hay đi với: the potential to transform · huge potential\",\"example\":{\"text\":\"The potential of AI in education is huge, but its capabilities are often exaggerated.\",\"vi\":\"Tiềm năng của AI trong giáo dục rất lớn, nhưng khả năng của nó thường bị phóng đại.\"}},{\"id\":\"accurate|adj\",\"term\":\"accurate\",\"reading\":\"/ˈæk.jə.rət/\",\"meaning\":\"chính xác\",\"definitionEn\":\"correct and exact\",\"lesson\":52,\"pos\":\"adj\",\"hint\":\"Hay đi với: highly accurate · accurate results\",\"example\":{\"text\":\"Without human oversight, AI systems are unlikely to be completely accurate.\",\"vi\":\"Nếu không có sự giám sát của con người, hệ thống AI khó có thể chín uộc vào chúng có thể có hại.\"}},{\"id\":\"digital-divide|phr-n\",\"term\":\"digital divide\",\"reading\":\"/ˌdɪdʒ.ɪ.təl dɪˈvaɪd/\",\"meaning\":\"khoảng cách số (giữa người có và không có công nghệ)\",\"definitionEn\":\"the gap between people with and without technology access\",\"lesson\":53,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: widen the digital divide · bridge the digital divide\"},{\"id\":\"social-isolation|phr-n\",\"term\":\"social isolation\",\"reading\":\"/ˌsəʊ.ʃəl ˌaɪ.səˈleɪ.ʃən/\",\"meaning\":\"sự cô lập xã hội\",\"definitionEn\":\"having little contact with other people\",\"lesson\":53,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: lead to social isolation\"},{\"id\":\"convenience|n\",\"term\":\"convenience\",\"reading\":\"/kənˈviː.ni.əns/\",\"meaning\":\"sự tiện lợi\",\"definitionEn\":\"the quality of being easy and saving time\",\"lesson\":53,\"pos\":\"n\",\"hint\":\"Trọng âm: con-VEN-ience — Hay đi với: for convenience · the convenience of online shopping\",\"example\":{\"text\":\"The convenience of online shopping has changed the way people spend their weekends.\",\"vi\":\"Sự tiện lợi của mua sắm trực tuyến đã thay đổi cách mọi người dành thời gian cuối tuần.\"}},{\"id\":\"innovation|n\",\"term\":\"innovation\",\"reading\":\"/ˌɪn.əˈveɪ.ʃən/\",\"meaning\":\"sự đổi mới; sáng kiến\",\"definitionEn\":\"a new idea, method or product\",\"lesson\":53,\"pos\":\"n\",\"hint\":\"Hay đi với: technological innovation · encourage innovation\",\"example\":{\"text\":\"From an economic perspective, innovation is essential for growth.\",\"vi\":\"Từ góc độ kinh tế, đổi mới là yếu tố thiết yếu cho tăng trưởng.\"}},{\"id\":\"obsolete|adj\",\"term\":\"obsolete\",\"reading\":\"/ˈɒb.səl.iːt/\",\"meaning\":\"lỗi thời\",\"definitionEn\":\"no longer used because something newer exists\",\"lesson\":53,\"pos\":\"adj\",\"hint\":\"Hay đi với: become obsolete · obsolete skills\",\"example\":{\"text\":\"Some skills will become obsolete, so workers need to upskill regularly.\",\"vi\":\"Mộ lation\",\"lesson\":54,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a threat to public health · improve public health\"},{\"id\":\"vaccination|n\",\"term\":\"vaccination\",\"reading\":\"/ˌvæk.sɪˈneɪ.ʃən/\",\"meaning\":\"sự tiêm chủng\",\"definitionEn\":\"giving people an injection to protect them from disease\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"2 chữ c: vak-si-NEI-shờn. — Hay đi với: vaccination programmes · free vaccination\",\"example\":{\"text\":\"The fact that vaccination is free has helped to stop several outbreaks.\",\"vi\":\"Việc tiêm chủng miễn phí đã giúp ngăn chặn một số đợt bùng phát.\"}},{\"id\":\"epidemic|n\",\"term\":\"epidemic\",\"reading\":\"/ˌep.ɪˈdem.ɪk/\",\"meaning\":\"dịch bệnh (lan rộng trong một vùng)\",\"definitionEn\":\"a disease affecting many people in one area at the same time\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Trọng âm: ep-i-DEM-ic — Hay đi với: an epidemic of obesity · stop the epidemic\",\"example\":{\"text\":\"Some experts warn that there is an epidemic of loneliness in big cities.\",\"vi\":\"Một số chuyên gia cảnh báo có một 'đại dịch' cô đơn ở các thành phố lớn.\"}},{\"id\":\"outbreak|n\",\"term\":\"outbreak\",\"reading\":\"/ˈaʊt.breɪk/\",\"meaning\":\"sự bùng phát (dịch)\",\"definitionEn\":\"a sudden start of a disease\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Hay đi với: an outbreak of flu · control an outbreak\"},{\"id\":\"infectious|adj\",\"term\":\"infectious\",\"reading\":\"/ɪnˈfek.ʃəs/\",\"meaning\":\"truyền nhiễm; dễ lây\",\"definitionEn\":\"(of a disease) passing easily from person to person\",\"lesson\":54,\"pos\":\"adj\",\"hint\":\"Hay đi với: infectious diseases · highly infectious\",\"example\":{\"text\":\"Good hygiene and clean water reduce the spread of infectious diseases.\",\"vi\":\"Vệ sinh tốt và nước sạch giảm sự lây lan của bệnh truyền nhiễm.\"}},{\"id\":\"life-expectancy|phr-n\",\"term\":\"life expectancy\",\"reading\":\"/ˈlaɪf ɪkˌspek.tən.si/\",\"meaning\":\"tuổi thọ trung bình\",\"definitionEn\":\"the average number of years people live\",\"lesson\":54,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: average life expectancy · life expectancy has risen\"},{\"id\":\"chronic-disease|phr-n\",\"term\":\"chronic disease\",\"reading\":\"/ˌkrɒn.ɪk dɪˈziːz/\",\"meaning\":\"bệnh mãn tính\",\"definitionEn\":\"an illness that lasts a long time\",\"lesson\":54,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: chronic diseases such as diabetes\"},{\"id\":\"mental-health|phr-n\",\"term\":\"mental health\",\"reading\":\"/ˌmen.təl ˈhelθ/\",\"meaning\":\"sức khỏe tinh thần\",\"definitionEn\":\"the condition of a person's mind and emotions\",\"lesson\":54,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: mental health problems · look after your mental health\"},{\"id\":\"preventive|adj\",\"term\":\"preventive\",\"reading\":\"/prɪˈven.tɪv/\",\"meaning\":\"phòng ngừa\",\"definitionEn\":\"intended to stop something bad from happening\",\"lesson\":54,\"pos\":\"adj\",\"hint\":\"Hay đi với: preventive medicine · preventive measures\",\"example\":{\"text\":\"Regular check-ups are a simple form of preventive medicine.\",\"vi\":\"Khám định kỳ là một hình thức y học phòng ngừa đơn giản.\"}},{\"id\":\"nutrition|n\",\"term\":\"nutrition\",\"reading\":\"/njuːˈtrɪʃ.ən/\",\"meaning\":\"dinh dưỡng\",\"definitionEn\":\"the food your body needs to stay healthy\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"nyu-TRI-shờn: nhấn âm 2. — Hay đi với: good nutrition · poor nutrition\",\"example\":{\"text\":\"Good nutrition and a balanced diet are essential for children's development.\",\"vi\":\"Dinh dưỡng tốt và chế độ ăn cân bằng là thiết yếu cho sự phát triển của trẻ.\"}},{\"id\":\"well-being|n\",\"term\":\"well-being\",\"reading\":\"/ˌwelˈbiː.ɪŋ/\",\"meaning\":\"sự khỏe mạnh và hạnh phúc (thể chất + tinh thần)\",\"definitionEn\":\"feeling healthy and happy\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Hay đi với: physical and mental well-being · improve well-being\"},{\"id\":\"hygiene|n\",\"term\":\"hygiene\",\"reading\":\"/ˈhaɪ.dʒiːn/\",\"meaning\":\"vệ sinh\",\"definitionEn\":\"keeping yourself and things clean to prevent disease\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Hay đi với: personal hygiene · good hygiene\",\"example\":{\"text\":\"Good hygiene and clean water reduce the spread of infectious diseases.\",\"vi\":\"Vệ sinh tốt và nước sạch giảm sự lây lan của bệnh truyền nhiễm.\"}},{\"id\":\"sanitation|n\",\"term\":\"sanitation\",\"reading\":\"/ˌsæn.ɪˈteɪ.ʃən/\",\"meaning\":\"hệ thống vệ sinh (nước sạch, thoát nước)\",\"definitionEn\":\"systems for clean water and removing waste\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Hay đi với: poor sanitation · improve sanitation\",\"example\":{\"text\":\"Better sanitation has improved public health in many developing countries.\",\"vi\":\"Hệ thống vệ sinh tốt hơn đã cải thiện sức khỏe cộng đồng ở nhiều nước đang phát triển.\"}},{\"id\":\"check-up|n\",\"term\":\"check-up\",\"reading\":\"/ˈtʃek.ʌp/\",\"meaning\":\"khám sức khỏe định kỳ\",\"definitionEn\":\"a general medical examination\",\"lesson\":54,\"pos\":\"n\",\"hint\":\"Hay đi với: a regular check-up · an annual check-up\"},{\"id\":\"balanced-diet|phr-n\",\"term\":\"balanced diet\",\"reading\":\"/ˌbæl.ənst ˈdaɪ.ət/\",\"meaning\":\"chế độ ăn cân bằng\",\"definitionEn\":\"eating the right amounts of different foods\",\"lesson\":54,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: eat a balanced diet\"},{\"id\":\"obesity|n\",\"term\":\"obesity\",\"reading\":\"/əʊˈbiː.sə.ti/\",\"meaning\":\"bệnh béo phì\",\"definitionEn\":\"the condition of being very overweight\",\"lesson\":55,\"pos\":\"n\",\"hint\":\"Trọng âm: o-BE-si-ty — Hay đi với: childhood obesity · rising obesity rates\",\"example\":{\"text\":\"A sedentary lifestyle contributes to obesity and heart disease.\",\"vi\":\"Lối sống ít vận động góp phần gây béo phì và bệnh tim.\"}},{\"id\":\"sedentary|adj\",\"term\":\"sedentary\",\"reading\":\"/ˈsed.ən.tər.i/\",\"meaning\":\"ít vận động\",\"definitionEn\":\"involving a lot of sitting and little exercise\",\"lesson\":55,\"pos\":\"adj\",\"hint\":\"Trọng âm: SED-en-ta-ry — Hay đi với: a sedentary lifestyle · sedentary jobs\",\"example\":{\"text\":\"A sedentary lifestyle contributes to obesity and heart disease.\",\"vi\":\"Lối sống ít vận động góp phần gây béo phì và bệnh tim.\"}},{\"id\":\"processed-food|phr-n\",\"term\":\"processed food\",\"reading\":\"/ˌprəʊ.sest ˈfuːd/\",\"meaning\":\"thực phẩm chế biến sẵn\",\"definitionEn\":\"food changed in factories, often with added salt or sugar\",\"lesson\":55,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: eat too much processed food\"},{\"id\":\"sugary|adj\",\"term\":\"sugary\",\"reading\":\"/ˈʃʊɡ.ər.i/\",\"meaning\":\"nhiều đường\",\"definitionEn\":\"containing a lot of sugar\",\"lesson\":55,\"pos\":\"adj\",\"hint\":\"Hay đi với: sugary drinks · sugary snacks\",\"example\":{\"text\":\"Much childhood obesity stems from the high consumption of sugary drinks.\",\"vi\":\"Phần lớn béo phì ở trẻ bắt nguồn từ việc tiêu thụ nhiều đồ uống có đường.\"}},{\"id\":\"consumption|n\",\"term\":\"consumption\",\"reading\":\"/kənˈsʌmp.ʃən/\",\"meaning\":\"sự tiêu thụ\",\"definitionEn\":\"the amount of something that is used or eaten\",\"lesson\":55,\"pos\":\"n\",\"hint\":\"Hay đi với: sugar consumption · the consumption of alcohol\",\"example\":{\"text\":\"Much childhood obesity stems from the high consumption of sugary drinks.\",\"vi\":\"Phần lớn béo phì ở trẻ bắt nguồn từ việc tiêu thụ nhiều đồ uống có đường.\"}},{\"id\":\"contribute-to|phr-v\",\"term\":\"contribute to\",\"reading\":\"/kənˈtrɪb.juːt tuː/\",\"meaning\":\"góp phần gây ra\",\"definitionEn\":\"to be one of the causes of something\",\"lesson\":55,\"pos\":\"phr-v\",\"hint\":\"Trọng âm: con-TRIB-ute to — Hay đi với: contribute to obesity · a major factor contributing to\"},{\"id\":\"stem-from|phr-v\",\"term\":\"stem from\",\"reading\":\"/ˈstem frəm/\",\"meaning\":\"bắt nguồn từ\",\"definitionEn\":\"to be caused by something\",\"lesson\":55,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: the problem stem ,\"pos\":\"n\",\"hint\":\"Hay đi với: from generation to generation · the younger generation\",\"example\":{\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"}},{\"id\":\"descendant|n\",\"term\":\"descendant\",\"reading\":\"/dɪˈsen.dənt/\",\"meaning\":\"con cháu; hậu duệ\",\"definitionEn\":\"a person related to someone who lived long ago\",\"lesson\":56,\"pos\":\"n\",\"hint\":\"Hay đi với: direct descendants · descendants of immigrants\"},{\"id\":\"get-the-hang-of|idiom\",\"term\":\"get the hang of\",\"reading\":\"/ˌɡet ðə ˈhæŋ əv/\",\"meaning\":\"bắt đầu quen tay; nắm được cách làm\",\"definitionEn\":\"to learn how to do something\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: get the hang of chopsticks · it took me a while to get the hang of it\"},{\"id\":\"look-forward-to|phr-v\",\"term\":\"look forward to\",\"reading\":\"/ˌlʊk ˈfɔː.wəd tuː/\",\"meaning\":\"mong chờ\",\"definitionEn\":\"to feel happy about something that will happen\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look forward to the holiday · look forward to seeing you\"},{\"id\":\"bring-back-memories|idiom\",\"term\":\"bring back memories\",\"reading\":\"/ˌbrɪŋ ˌbæk ˈmem.ər.iz/\",\"meaning\":\"gợi lại kỷ niệm\",\"definitionEn\":\"to make you remember the past\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: this song brings back memories of my childhood\"},{\"id\":\"in-the-long-run|idiom\",\"term\":\"in the long run\",\"reading\":\"/ɪn ðə ˌlɒŋ ˈrʌn/\",\"meaning\":\"về lâu dài\",\"definitionEn\":\"eventually, after an extended period of time\",\"lesson\":57,\"pos\":\"idiom\"},{\"id\":\"keep-up-with|phr-v\",\"term\":\"keep up with\",\"reading\":\"/ˌkiːp ˈʌp wɪð/\",\"meaning\":\"theo kịp\",\"definitionEn\":\"to stay at the same level or speed as others\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: keep up with technology · keep up with the latest trends\"},{\"id\":\"take-for-granted|idiom\",\"term\":\"take for granted\",\"reading\":\"/ˌteɪk fə ˈɡrɑːn.tɪd/\",\"meaning\":\"coi là hiển nhiên (không trân trọng)\",\"definitionEn\":\"to not appreciate something because it is always there\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: take something for granted · we take clean water for granted\"},{\"id\":\"broaden-your-horizons|idiom\",\"term\":\"broaden your horizons\",\"reading\":\"/ˌbrɔː.dən jɔː həˈraɪ.zənz/\",\"meaning\":\"mở rộng tầm nhìn; hiểu biết\",\"definitionEn\":\"to experience new things and widen your understanding\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: travel broadens your horizons\"},{\"id\":\"a-far-cry-from|idiom\",\"term\":\"a far cry from\",\"reading\":\"/ə ˌfɑː ˈkraɪ frəm/\",\"meaning\":\"khác xa với\",\"definitionEn\":\"very different from\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: life today is a far cry from the 1990s\"},{\"id\":\"come-across|phr-v\",\"term\":\"come across\",\"reading\":\"/ˌkʌm əˈkrɒs/\",\"meaning\":\"tình cờ gặp/thấy\",\"definitionEn\":\"to find or meet something by chance\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: come across an old photo · come across a new word\"},{\"id\":\"stand-out|phr-v\",\"term\":\"stand out\",\"reading\":\"/ˌstænd ˈaʊt/\",\"meaning\":\"nổi bật\",\"definitionEn\":\"to be easy to notice because it is better or different\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: stand out from the crowd · what stood out most was\"},{\"id\":\"fit-in|phr-v\",\"term\":\"fit in\",\"reading\":\"/ˌfɪt ˈɪn/\",\"meaning\":\"hòa nhập; thích nghi (với nhóm)\",\"definitionEn\":\"to feel accepted in a group\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: fit in with new classmates · find it hard to fit in\"},{\"id\":\"grow-up|phr-v\",\"term\":\"grow up\",\"reading\":\"/ˌɡrəʊ ˈʌp/\",\"meaning\":\"lớn lên\",\"definitionEn\":\"to become an adult\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: grow up in the countryside · when I was growing up\"},{\"id\":\"catch-up-on|phr-v\",\"term\":\"catch up on\",\"reading\":\"/ˌkætʃ ˈʌp ɒn/\",\"meaning\":\"bù lại (việc bị lỡ); cập nhật\",\"definitionEn\":\"to do things you did not have time to do before\",\"lesson\":57,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: catch up on sleep · catch up on the news\"},{\"id\":\"culture-shock|phr-n\",\"term\":\"culture shock\",\"reading\":\"/ˈkʌl.tʃə ˌʃɒk/\",\"meaning\":\"sốc văn hóa\",\"definitionEn\":\"confusion felt when living in a very different place\",\"lesson\":57,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: experience culture shock · suffer from culture shock\"},{\"id\":\"feel-at-home|idiom\",\"term\":\"feel at home\",\"reading\":\"/ˌfiːl ət ˈhəʊm/\",\"meaning\":\"cảm thấy thoải mái như ở nhà\",\"definitionEn\":\"to feel comfortable and relaxed somewhere\",\"lesson\":57,\"pos\":\"idiom\",\"hint\":\"Hay đi với: make someone feel at home · I never felt at home there\"},{\"id\":\"homesick|adj\",\"term\":\"homesick\",\"reading\":\"/ˈhəʊm.sɪk/\",\"meaning\":\"nhớ nhà\",\"definitionEn\":\"sad because you are away from your family and country\",\"lesson\":57,\"pos\":\"adj\",\"hint\":\"Hay đi với: feel homesick · get homesick\",\"example\":{\"text\":\"When I first studied abroad, I experienced culture shock and felt very homesick.\",\"vi\":\"Lần đầu du học, tôi bị sốc văn hóa và rất nhớ nhà.\"}},{\"id\":\"open-minded|adj\",\"term\":\"open-minded\",\"reading\":\"/ˌəʊ.pənˈmaɪn.dɪd/\",\"meaning\":\"cởi mở; dễ tiếp thu cái mới\",\"definitionEn\":\"willing to accept new ideas\",\"lesson\":57,\"pos\":\"adj\",\"hint\":\"Hay đi với: become more open-minded · an open-minded person\"},{\"id\":\"consumerism|n\",\"term\":\"consumerism\",\"reading\":\"/kənˈsjuː.mə.rɪ.zəm/\",\"meaning\":\"chủ nghĩa tiêu dùng; lối sống chạy theo mua sắm\",\"definitionEn\":\"the belief that buying things makes people happy\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Trọng âm: con-SU-mer-ism — Hay đi với: the rise of consumerism · a culture of consumerism\",\"example\":{\"text\":\"The rise of consumerism has made society more materialistic.\",\"vi\":\"Sự trỗi dậy của chủ nghĩa tiêu dùng khiến xã hội trở nên thực dụng hơn.\"}},{\"id\":\"purchase|v\",\"term\":\"purchase\",\"reading\":\"/ˈpɜː.tʃəs/\",\"meaning\":\"mua (trang trọng)\",\"definitionEn\":\"to buy (formal)\",\"lesson\":58,\"pos\":\"v\",\"hint\":\"Trọng âm: PUR-chase — Hay đi với: purchase goods online · be purchased by consumers\",\"example\":{\"text\":\"Rarely do shoppers read the terms and conditions before they purchase something online.\",\"vi\":\"Hiếm khi người mua đọc điều khoản trước khi mua gì đó trên mạng.\"}},{\"id\":\"impulse-buying|phr-n\",\"term\":\"impulse buying\",\"reading\":\"/ˈɪm.pʌls ˌbaɪ.ɪŋ/\",\"meaning\":\"mua sắm bốc đồng\",\"definitionEn\":\"buying things suddenly without planning\",\"lesson\":58,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: encourage impulse buying · an impulse buy\"},{\"id\":\"disposable-income|phr-n\",\"term\":\"disposable income\",\"reading\":\"/dɪˌspəʊ.zə.bəl ˈɪn.kʌm/\",\"meaning\":\"thu nhập khả dụng (tiền còn lại sau thuế và chi phí thiết yếu)\",\"definitionEn\":\"money left after paying tax and basic costs\",\"lesson\":58,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have more disposable income · a rise in disposable income\"},{\"id\":\"luxury-goods|phr-n\",\"term\":\"luxury goods\",\"reading\":\"/ˈlʌk.ʃər.i ˌɡʊdz/\",\"meaning\":\"hàng xa xỉ\",\"definitionEn\":\"expensive items that are not necessary\",\"lesson\":58,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: spend money on luxury goods · the market for luxury goods\"},{\"id\":\"materialistic|adj\",\"term\":\"materialistic\",\"reading\":\"/məˌtɪə.ri.əˈlɪs.tɪk/\",\"meaning\":\"thực dụng; coi trọng vật chất\",\"definitionEn\":\"caring too much about money and possessions\",\"lesson\":58,\"pos\":\"adj\",\"hint\":\"Trọng âm: ma-te-ri-a-LIS-tic — Hay đi với: a materialistic society · become more materialistic\",\"example\":{\"text\":\"The rise of consumerism has made society more materialistic.\",\"vi\":\"Sự trỗi dậy của chủ nghĩa tiêu dùng khiến xã hội trở nên thực dụng hơn.\"}},{\"id\":\"status-symbol|phr-n\",\"term\":\"status symbol\",\"reading\":\"/ˈsteɪ.təs ˌsɪm.bəl/\",\"meaning\":\"biểu tượng địa vị (món đồ để khoe đẳng cấp)\",\"definitionEn\":\"an item that shows a person's wealth or position\",\"lesson\":58,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: see a car as a status symbol\"},{\"id\":\"inflation|n\",\"term\":\"inflation\",\"reading\":\"/ɪnˈfleɪ.ʃən/\",\"meaning\":\"lạm phát\",\"definitionEn\":\"a general rise in prices\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: high inflation · the rate of inflation\",\"example\":{\"text\":\"Only when inflation rises do many families start to live more frugally.\",\"vi\":\"Chỉ khi lạm phát tăng thì nhiều gia đình mới bắt đầu sống tiết kiệm hơn.\"}},{\"id\":\"recession|n\",\"term\":\"recession\",\"reading\":\"/rɪˈseʃ.ən/\",\"meaning\":\"suy thoái kinh tế\",\"definitionEn\":\"a period when the economy shrinks\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: during a recession · the economy went into recession\",\"example\":{\"text\":\"During the recession, many retailers closed their shops.\",\"vi\":\"Trong thời kỳ suy thoái, nhiều nhà bán lẻ đã đóng cửa hàng.\"}},{\"id\":\"debt|n\",\"term\":\"debt\",\"reading\":\"/det/\",\"meaning\":\"nợ; khoản nợ\",\"definitionEn\":\"money that you owe\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: be in debt · get into debt\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"}},{\"id\":\"frugal|adj\",\"term\":\"frugal\",\"reading\":\"/ˈfruː.ɡəl/\",\"meaning\":\"tiết kiệm; tằn tiện\",\"definitionEn\":\"careful not to waste money\",\"lesson\":58,\"pos\":\"adj\",\"hint\":\"Hay đi với: a frugal lifestyle · live frugally\"},{\"id\":\"splash-out|phr-v\",\"term\":\"splash out\",\"reading\":\"/ˌsplæʃ ˈaʊt/\",\"meaning\":\"vung tiền mua sắm; chi mạnh tay\",\"definitionEn\":\"to spend a lot of money on something\",\"lesson\":58,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: splash out on a new phone\"},{\"id\":\"second-hand|adj\",\"term\":\"second-hand\",\"reading\":\"/ˌsek.ənd ˈhænd/\",\"meaning\":\"đã qua sử dụng; đồ cũ\",\"definitionEn\":\"owned by someone else before\",\"lesson\":58,\"pos\":\"adj\",\"hint\":\"Hay đi với: second-hand clothes · buy second-hand\"},{\"id\":\"instant-gratification|phr-n\",\"term\":\"instant gratification\",\"reading\":\"/ˌɪn.stənt ˌɡræt.ɪ.fɪˈkeɪ.ʃən/\",\"meaning\":\"sự thỏa mãn tức thì\",\"definitionEn\":\"getting pleasure immediately instead of waiting\",\"lesson\":58,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a culture of instant gratification\"},{\"id\":\"seldom|adv\",\"term\":\"seldom\",\"reading\":\"/ˈsel.dəm/\",\"meaning\":\"hiếm khi\",\"definitionEn\":\"rarely; not often\",\"lesson\":58,\"pos\":\"adv\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"}},{\"id\":\"loan|n\",\"term\":\"loan\",\"reading\":\"/ləʊn/\",\"meaning\":\"khoản vay\",\"definitionEn\":\"money that you borrow\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: take out a loan · repay a loan\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"}},{\"id\":\"retailer|n\",\"term\":\"retailer\",\"reading\":\"/ˈriː.teɪ.lər/\",\"meaning\":\"nhà bán lẻ\",\"definitionEn\":\"a business that sells goods to the public\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: online retailers · large retailers\"},{\"id\":\"e-commerce|n\",\"term\":\"e-commerce\",\"reading\":\"/ˈiːˌkɒm.ɜːs/\",\"meaning\":\"thương mại điện tử\",\"definitionEn\":\"buying and selling online\",\"lesson\":58,\"pos\":\"n\",\"hint\":\"Hay đi với: the growth of e-commerce · e-commerce platforms\"},{\"id\":\"considerably|adv\",\"term\":\"considerably\",\"reading\":\"/kənˈsɪd.ər.ə.bli/\",\"meaning\":\"đáng kể; nhiều\",\"definitionEn\":\"by a large amount\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Trọng âm: con-SID-er-a-bly — Hay đi với: considerably higher · considerably more than\",\"example\":{\"text\":\"Spending on housing was considerably higher in the city than in rural areas.\",\"vi\":\"Chi tiêu cho nhà ở tại thành phố cao hơn đáng kể so với nông thôn.\"}},{\"id\":\"marginally|adv\",\"term\":\"marginally\",\"reading\":\"/ˈmɑː.dʒɪ.nəl.i/\",\"meaning\":\"không đáng kể; nhỉnh hơn một chút\",\"definitionEn\":\"by a very small amount\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Hay đi với: marginally lower · marginally more popular\",\"example\":{\"text\":\"The proportion spent on utilities was marginally lower in 2020 than in 2010.\",\"vi\":\"Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010.\"}},{\"id\":\"substantially|adv\",\"term\":\"substantially\",\"reading\":\"/səbˈstæn.ʃəl.i/\",\"meaning\":\"một cách đáng kể; rất nhiều\",\"definitionEn\":\"by a large amount; greatly\",\"lesson\":59,\"pos\":\"adv\",\"hint\":\"Hay đi với: substantially higher · rise substantially\",\"example\":{\"text\":\"The table covers food and housing; the former fell, whereas the latter rose substantially.\",\"vi\":\"Bảng gồm thực phẩm và nhà ở; khoản trước giảm, trong khi khoản sau tăng đáng kể.\"}},{\"id\":\"by-far|idiom\",\"term\":\"by far\",\"reading\":\"/ˌbaɪ ˈfɑːr/\",\"meaning\":\"hơn hẳn; (lớn/cao…) nhất với cách biệt xa\",\"definitionEn\":\"by a very large amount\",\"lesson\":59,\"pos\":\"idiom\",\"hint\":\"Hay đi với: by far the largest · by far the most popular\"},{\"id\":\"exceed|v\",\"term\":\"exceed\",\"reading\":\"/ɪkˈsiːd/\",\"meaning\":\"vượt quá\",\"definitionEn\":\"to be more than a certain amount\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: exceed 50% · exceed the figure for\"},{\"id\":\"overtake|v\",\"term\":\"overtake\",\"reading\":\"/ˌəʊ.vəˈteɪk/\",\"meaning\":\"vượt lên; vượt qua\",\"definitionEn\":\"to go past something that was ahead\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-TAKE — Hay đi với: overtake food as the largest expense\"},{\"id\":\"triple|v\",\"term\":\"triple\",\"reading\":\"/ˈtrɪp.əl/\",\"meaning\":\"tăng gấp ba\",\"definitionEn\":\"to become three times as large\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: almost triple · triple over the period\"},{\"id\":\"halve|v\",\"term\":\"halve\",\"reading\":\"/hɑːv/\",\"meaning\":\"giảm một nửa\",\"definitionEn\":\"to reduce by fifty per cent\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: be halved · almost halve\"},{\"id\":\"the-former|pron\",\"term\":\"the former\",\"reading\":\"/ðə ˈfɔː.mər/\",\"meaning\":\"cái/người thứ nhất (trong hai cái vừa nhắc)\",\"definitionEn\":\"the first of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the former …, whereas the latter …\"},{\"id\":\"the-latter|pron\",\"term\":\"the latter\",\"reading\":\"/ðə ˈlæt.ər/\",\"meaning\":\"cái/người thứ hai (trong hai cái vừa nhắc)\",\"definitionEn\":\"the second of two things just mentioned\",\"lesson\":59,\"pos\":\"pron\",\"hint\":\"Hay đi với: the latter rose to 30%\"},{\"id\":\"negligible|adj\",\"term\":\"negligible\",\"reading\":\"/ˈneɡ.lɪ.dʒə.bəl/\",\"meaning\":\"không đáng kể\",\"definitionEn\":\"so small it is not important\",\"lesson\":59,\"pos\":\"adj\",\"hint\":\"Trọng âm: NEG-li-gi-ble — Hay đi với: a negligible change · the difference was negligible\",\"example\":{\"text\":\"The change in spending on clothes was negligible.\",\"vi\":\"Thay đổi trong chi tiêu cho quần áo là không đáng kể.\"}},{\"id\":\"comparable|adj\",\"term\":\"comparable\",\"reading\":\"/ˈkɒm.pər.ə.bəl/\",\"meaning\":\"tương đương; có thể so sánh được\",\"definitionEn\":\"similar in size or quality\",\"lesson\":59,\"pos\":\"adj\",\"hint\":\"Trọng âm: COM-pa-ra-ble — Hay đi với: comparable figures · be comparable to\",\"example\":{\"text\":\"The figures for the two countries are comparable.\",\"vi\":\"Số liệu của hai nước tương đương nhau.\"}},{\"id\":\"allocate|v\",\"term\":\"allocate\",\"reading\":\"/ˈæl.ə.keɪt/\",\"meaning\":\"phân bổ; dành (tiền, thời gian) cho\",\"definitionEn\":\"to give an amount of money or time for a purpose\",\"lesson\":59,\"pos\":\"v\",\"hint\":\"Hay đi với: allocate 30% of income to housing\"},{\"id\":\"utilities|n\",\"term\":\"utilities\",\"reading\":\"/juːˈtɪl.ə.tiz/\",\"meaning\":\"các dịch vụ tiện ích (điện, nước, gas)\",\"definitionEn\":\"services such as electricity, water and gas\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Hay đi với: spending on utilities · utility bills\",\"example\":{\"text\":\"The proportion spent on utilities was marginally lower in 2020 than in 2010.\",\"vi\":\"Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010.\"}},{\"id\":\"leisure|n\",\"term\":\"leisure\",\"reading\":\"/ˈleʒ.ər/\",\"meaning\":\"giải trí; thời gian rảnh\",\"definitionEn\":\"free time when you can relax\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"LE-zhờ (Anh) hoặc LI-zhờ (Mỹ). — Hay đi với: leisure activities · spending on leisure\",\"example\":{\"text\":\"The higher a family's income, the more it spends on leisure.\",\"vi\":\"Thu nhập gia đình càng cao thì càng chi nhiều cho giải trí.\"}},{\"id\":\"groceries|n\",\"term\":\"groceries\",\"reading\":\"/ˈɡrəʊ.sər.iz/\",\"meaning\":\"thực phẩm và đồ dùng hằng ngày (mua ở siêu thị)\",\"definitionEn\":\"food and household items bought at a supermarket\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"GRÔU-sờ-riz. — Hay đi với: spend on groceries · grocery shopping\",\"example\":{\"text\":\"Spending on groceries was almost as high as spending on transport.\",\"vi\":\"Chi cho thực phẩm gần bằng chi cho đi lại.\"}},{\"id\":\"income|n\",\"term\":\"income\",\"reading\":\"/ˈɪn.kʌm/\",\"meaning\":\"thu nhập\",\"definitionEn\":\"money you receive regularly from work or investments\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Hay đi với: average income · household income\",\"example\":{\"text\":\"The higher a family's income, the more it spends on leisure.\",\"vi\":\"Thu nhập gia đình càng cao thì càng chi nhiều cho giải trí.\"}},{\"id\":\"revenue|n\",\"term\":\"revenue\",\"reading\":\"/ˈrev.ən.juː/\",\"meaning\":\"doanh thu\",\"definitionEn\":\"the money a business or government receives\",\"lesson\":59,\"pos\":\"n\",\"hint\":\"Trọng âm: REV-e-nue — Hay đi với: sales revenue · revenue from online sales\",\"example\":{\"text\":\"Online revenue tripled over the period, while shop sales were almost halved.\",\"vi\":\"Doanh thu trực tuyến tăng gấp ba trong giai đoạn này, trong khi doanh số tại cửa hàng giảm gần một nửa.\"}},{\"id\":\"exhibition|n\",\"term\":\"exhibition\",\"reading\":\"/ˌek.sɪˈbɪʃ.ən/\",\"meaning\":\"triển lãm\",\"definitionEn\":\"a public show of art or other objects\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Trọng âm: ex-hi-BI-tion — Hay đi với: an art exhibition · hold an exhibition\",\"example\":{\"text\":\"The exhibition includes portraits and sculptures by young Vietnamese artists.\",\"vi\":\"Triển lãm gồm tranh chân dung và tác phẩm điêu khắc của các nghệ sĩ trẻ Việt Nam.\"}},{\"id\":\"gallery|n\",\"term\":\"gallery\",\"reading\":\"/ˈɡæl.ər.i/\",\"meaning\":\"phòng trưng bày tranh; bảo tàng mỹ thuật\",\"definitionEn\":\"a building where art is shown\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: an art gallery · the national gallery\",\"example\":{\"text\":\"Had the gallery received more funding, it would not have closed.\",\"vi\":\"Nếu phòng tranh được tài trợ nhiều hơn thì nó đã không đóng cửa.\"}},{\"id\":\"sculpture|n\",\"term\":\"sculpture\",\"reading\":\"/ˈskʌlp.tʃər/\",\"meaning\":\"tác phẩm điêu khắc; nghệ thuật điêu khắc\",\"definitionEn\":\"a piece of art made from stone, wood or metal\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a bronze sculpture · modern sculpture\"},{\"id\":\"masterpiece|n\",\"term\":\"masterpiece\",\"reading\":\"/ˈmɑː.stə.piːs/\",\"meaning\":\"kiệt tác\",\"definitionEn\":\"an extremely good work of art\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a true masterpiece · be regarded as a masterpiece\",\"example\":{\"text\":\"Many people regard this painting as a masterpiece.\",\"vi\":\"Nhiều người coi bức tranh này là một kiệt tác.\"}},{\"id\":\"performance|n\",\"term\":\"performance\",\"reading\":\"/pəˈfɔː.məns/\",\"meaning\":\"buổi biểu diễn; màn trình diễn\",\"definitionEn\":\"the act of entertaining an audience\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"pờ-FOR-mờns: nhấn âm 2. — Trọng âm: per-FOR-mance — Hay đi với: a live performance · give a performance\",\"example\":{\"text\":\"The playwright gave a short speech after the performance.\",\"vi\":\"Nhà viết kịch có bài phát biểu ngắn sau buổi diễn.\"}},{\"id\":\"critic|n\",\"term\":\"critic\",\"reading\":\"/ˈkrɪt.ɪk/\",\"meaning\":\"nhà phê bình\",\"definitionEn\":\"a person who writes reviews of films, books or art\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a film critic · praised by critics\"},{\"id\":\"review|n\",\"term\":\"review\",\"reading\":\"/rɪˈvjuː/\",\"meaning\":\"bài phê bình; bài đánh giá\",\"definitionEn\":\"an article giving an opinion of a film, book or show\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: good reviews · mixed reviews\"},{\"id\":\"box-office|phr-n\",\"term\":\"box office\",\"reading\":\"/ˈbɒks ˌɒf.ɪs/\",\"meaning\":\"phòng vé; doanh thu phòng vé\",\"definitionEn\":\"the place where tickets are sold; ticket sales\",\"lesson\":60,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a box office hit · do well at the box office\"},{\"id\":\"sequel|n\",\"term\":\"sequel\",\"reading\":\"/ˈsiː.kwəl/\",\"meaning\":\"phần tiếp theo (phim, truyện)\",\"definitionEn\":\"a film or book that continues the story of an earlier one\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a sequel to · make a sequel\",\"example\":{\"text\":\"The sequel might have done better at the box office if the critics had liked it.\",\"vi\":\"Phần tiếp theo có lẽ đã có doanh thu phòng vé tốt hơn nếu giới phê bình thích nó.\"}},{\"id\":\"soundtrack|n\",\"term\":\"soundtrack\",\"reading\":\"/ˈsaʊnd.træk/\",\"meaning\":\"nhạc phim\",\"definitionEn\":\"the music played in a film\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the film's soundtrack\",\"example\":{\"text\":\"The film received mixed reviews, but its soundtrack was a huge success.\",\"vi\":\"Bộ phim nhận đánh giá trái chiều, nhưng nhạc phim thì rất thành công.\"}},{\"id\":\"playwright|n\",\"term\":\"playwright\",\"reading\":\"/ˈpleɪ.raɪt/\",\"meaning\":\"nhà viết kịch\",\"definitionEn\":\"a person who writes plays\",\"lesson\":60,\"pos\":\"n\",\"example\":{\"text\":\"The playwright gave a short speech after the performance.\",\"vi\":\"Nhà viết kịch có bài phát biểu ngắn sau buổi diễn.\"}},{\"id\":\"sold-out|adj\",\"term\":\"sold-out\",\"reading\":\"/ˌsəʊld ˈaʊt/\",\"meaning\":\"bán hết vé\",\"definitionEn\":\"with no tickets left\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: a sold-out concert · the show was sold out\"},{\"id\":\"premiere|n\",\"term\":\"premiere\",\"reading\":\"/ˈprem.i.eər/\",\"meaning\":\"buổi công chiếu đầu tiên\",\"definitionEn\":\"the first public showing of a film or play\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: the world premiere · attend the premiere\",\"example\":{\"text\":\"If we had booked earlier, we would have got tickets for the premiere.\",\"vi\":\"Nếu chúng tôi đặt sớm hơn thì đã có vé xem buổi công chiếu.\"}},{\"id\":\"blockbuster|n\",\"term\":\"blockbuster\",\"reading\":\"/ˈblɒkˌbʌs.tər/\",\"meaning\":\"phim bom tấn\",\"definitionEn\":\"a very successful film with a big budget\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a Hollywood blockbuster · a summer blockbuster\"},{\"id\":\"portrait|n\",\"term\":\"portrait\",\"reading\":\"/ˈpɔː.trət/\",\"meaning\":\"chân dung\",\"definitionEn\":\"a painting or photo of a person\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: paint a portrait · a self-portrait\"},{\"id\":\"abstract|adj\",\"term\":\"abstract\",\"reading\":\"/ˈæb.strækt/\",\"meaning\":\"trừu tượng\",\"definitionEn\":\"(of art) using shapes and colours, not real objects\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: abstract art · abstract ideas\",\"example\":{\"text\":\"If I had learnt to paint as a child, I would enjoy abstract art more now.\",\"vi\":\"Nếu hồi nhỏ tôi học vẽ thì giờ tôi sẽ thích nghệ thuật trừu tượng hơn.\"}},{\"id\":\"critically-acclaimed|adj\",\"term\":\"critically acclaimed\",\"reading\":\"/ˌkrɪt.ɪ.kəl.i əˈkleɪmd/\",\"meaning\":\"được giới phê bình ca ngợi\",\"definitionEn\":\"praised by professional reviewers\",\"lesson\":60,\"pos\":\"adj\",\"hint\":\"Hay đi với: a critically acclaimed film\"},{\"id\":\"genre|n\",\"term\":\"genre\",\"reading\":\"/ˈʒɒn.rə/\",\"meaning\":\"thể loại\",\"definitionEn\":\"a type of film, music or book\",\"lesson\":60,\"pos\":\"n\",\"hint\":\"Hay đi với: a film genre · my favourite genre\",\"example\":{\"text\":\"Documentaries are a genre that is becoming more popular with young audiences.\",\"vi\":\"Phim tài liệu là một thể loại đang ngày càng được khán giả trẻ yêu thích.\"}},{\"id\":\"accomplishment|n\",\"term\":\"accomplishment\",\"reading\":\"/əˈkʌm.plɪʃ.mənt/\",\"meaning\":\"thành tựu; việc đã làm được\",\"definitionEn\":\"something you have succeeded in doing\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Trọng âm: ac-COM-plish-ment — Hay đi với: a sense of accomplishment · a great accomplishment\",\"example\":{\"text\":\"Finishing the marathon gave me a real sense of accomplishment.\",\"vi\":\"Hoàn thành cuộc chạy marathon cho tôi cảm giác thành tựu thật sự.\"}},{\"id\":\"milestone|n\",\"term\":\"milestone\",\"reading\":\"/ˈmaɪl.stəʊn/\",\"meaning\":\"cột mốc (quan trọng)\",\"definitionEn\":\"an important event in a process or life\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: an important milestone · reach a milestone\",\"example\":{\"text\":\"Getting into university was a milestone, but moving abroad was the real turning point.\",\"vi\":\"Đỗ đại học là một cột mốc, nhưng ra nước ngoài mới là bước ngoặt thật sự.\"}},{\"id\":\"turning-point|phr-n\",\"term\":\"turning point\",\"reading\":\"/ˈtɜː.nɪŋ ˌpɔɪnt/\",\"meaning\":\"bước ngoặt\",\"definitionEn\":\"a moment when an important change happens\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: a turning point in my life · mark a turning point\"},{\"id\":\"nostalgic|adj\",\"term\":\"nostalgic\",\"reading\":\"/nɒsˈtæl.dʒɪk/\",\"meaning\":\"hoài niệm; nhớ về quá khứ\",\"definitionEn\":\"thinking happily about the past\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Trọng âm: nos-TAL-gic — Hay đi với: feel nostalgic about · a nostalgic song\",\"example\":{\"text\":\"That old song always makes me feel nostalgic about my student days.\",\"vi\":\"Bài hát cũ đó luôn khiến tôi hoài niệm về thời sinh viên.\"}},{\"id\":\"rehearse|v\",\"term\":\"rehearse\",\"reading\":\"/rɪˈhɜːs/\",\"meaning\":\"tập dượt (trước khi biểu diễn)\",\"definitionEn\":\"to practise a performance before the real show\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Hay đi với: rehearse for a show · rehearse every evening\"},{\"id\":\"stage-fright|phr-n\",\"term\":\"stage fright\",\"reading\":\"/ˈsteɪdʒ ˌfraɪt/\",\"meaning\":\"chứng sợ sân khấu; run khi lên sân khấu\",\"definitionEn\":\"fear of performing in front of an audience\",\"lesson\":61,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: suffer from stage fright · overcome stage fright\"},{\"id\":\"applause|n\",\"term\":\"applause\",\"reading\":\"/əˈplɔːz/\",\"meaning\":\"tràng pháo tay\",\"definitionEn\":\"the sound of people clapping\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: loud applause · a round of applause\",\"example\":{\"text\":\"By the time the applause started, I had forgotten all my fears.\",\"vi\":\"Đến khi tràng pháo tay vang lên, tôi đã quên hết mọi nỗi sợ.\"}},{\"id\":\"overcome|v\",\"term\":\"overcome\",\"reading\":\"/ˌəʊ.vəˈkʌm/\",\"meaning\":\"vượt qua (khó khăn, nỗi sợ)\",\"definitionEn\":\"to succeed in dealing with a difficulty\",\"lesson\":61,\"pos\":\"v\",\"hint\":\"Trọng âm: o-ver-COME — Hay đi với: overcome a fear · overcome difficulties\"},{\"id\":\"determination|n\",\"term\":\"determination\",\"reading\":\"/dɪˌtɜː.mɪˈneɪ.ʃən/\",\"meaning\":\"sự quyết tâm\",\"definitionEn\":\"the quality of not giving up\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: with great determination · sheer determination\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"vividly|adv\",\"term\":\"vividly\",\"reading\":\"/ˈvɪv.ɪd.li/\",\"meaning\":\"rõ ràng; sống động\",\"definitionEn\":\"in a very clear and detailed way\",\"lesson\":61,\"pos\":\"adv\",\"hint\":\"Hay đi với: I vividly remember · vividly describe\",\"example\":{\"text\":\"I still vividly remember the day I overcame my fear of speaking in public.\",\"vi\":\"Tôi vẫn nhớ rõ ngày tôi vượt qua nỗi sợ nói trước đám đông.\"}},{\"id\":\"look-back-on|phr-v\",\"term\":\"look back on\",\"reading\":\"/ˌlʊk ˈbæk ɒn/\",\"meaning\":\"nhìn lại; hồi tưởng\",\"definitionEn\":\"to think about something in the past\",\"lesson\":61,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: look back on my school days · look back on the experience\"},{\"id\":\"perseverance|n\",\"term\":\"perseverance\",\"reading\":\"/ˌpɜː.sɪˈvɪə.rəns/\",\"meaning\":\"sự kiên trì; bền bỉ\",\"definitionEn\":\"continuing to try despite difficulties\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Trọng âm: per-se-VE-rance — Hay đi với: patience and perseverance\",\"example\":{\"text\":\"It took a lot of perseverance and dedication to learn the piano as an adult.\",\"vi\":\"Học piano khi đã trưởng thành đòi hỏi rất nhiều kiên trì và tận tâm.\"}},{\"id\":\"audition|n\",\"term\":\"audition\",\"reading\":\"/ɔːˈdɪʃ.ən/\",\"meaning\":\"buổi thử giọng; thử vai\",\"definitionEn\":\"a short performance to test if someone is suitable for a role\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: pass an audition · go to an audition\",\"example\":{\"text\":\"I passed the audition, although I had failed twice before.\",\"vi\":\"Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.\"}},{\"id\":\"rewarding|adj\",\"term\":\"rewarding\",\"reading\":\"/rɪˈwɔː.dɪŋ/\",\"meaning\":\"đáng công; mang lại sự hài lòng\",\"definitionEn\":\"giving satisfaction\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: a rewarding experience · extremely rewarding\",\"example\":{\"text\":\"Looking back on it, the experience was extremely rewarding.\",\"vi\":\"Nhìn lại thì trải nghiệm đó rất đáng giá.\"}},{\"id\":\"self-confidence|n\",\"term\":\"self-confidence\",\"reading\":\"/ˌselfˈkɒn.fɪ.dəns/\",\"meaning\":\"sự tự tin\",\"definitionEn\":\"belief in your own abilities\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: build self-confidence · lack self-confidence\"},{\"id\":\"unforgettable|adj\",\"term\":\"unforgettable\",\"reading\":\"/ˌʌn.fəˈɡet.ə.bəl/\",\"meaning\":\"không thể quên\",\"definitionEn\":\"impossible to stop remembering\",\"lesson\":61,\"pos\":\"adj\",\"hint\":\"Hay đi với: an unforgettable night · an unforgettable experience\",\"example\":{\"text\":\"It was an unforgettable night, thanks to her determination to make everything perfect.\",\"vi\":\"Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.\"}},{\"id\":\"in-hindsight|idiom\",\"term\":\"in hindsight\",\"reading\":\"/ɪn ˈhaɪnd.saɪt/\",\"meaning\":\"nhìn lại thì; giờ nghĩ lại\",\"definitionEn\":\"when thinking about the past with what you know now\",\"lesson\":61,\"pos\":\"idiom\"},{\"id\":\"dedication|n\",\"term\":\"dedication\",\"reading\":\"/ˌded.ɪˈkeɪ.ʃən/\",\"meaning\":\"sự tận tâm; cống hiến\",\"definitionEn\":\"hard work and commitment\",\"lesson\":61,\"pos\":\"n\",\"hint\":\"Hay đi với: hard work and dedication\",\"example\":{\"text
