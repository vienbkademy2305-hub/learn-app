antage of community service is that offenders help society.\",\"vi\":\"Ưu điểm chính của lao động công ích là người phạm tội giúp ích cho xã hội.\"},\"lesson\":30,\"aids\":[\"Trọng âm: so-CI-e-ty\",\"Hay đi với: modern society · in society\"]},{\"id\":\"public-safety|phr-n\",\"headword\":\"public safety\",\"pos\":\"phr-n\",\"ipa\":\"/ˌpʌb.lɪk ˈseɪf.ti/\",\"meaning\":\"an toàn công cộng\",\"example\":{\"text\":\"Some people think harsh punishments are the best way to protect public safety.\",\"vi\":\"Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng.\"},\"lesson\":30,\"aids\":[\"Hay đi với: improve public safety · a threat to public safety\"]},{\"id\":\"crime-rate|phr-n\",\"headword\":\"crime rate\",\"pos\":\"phr-n\",\"ipa\":\"/ˈkraɪm ˌreɪt/\",\"meaning\":\"tỉ lệ tội phạm\",\"example\":{\"text\":\"Many cities have installed cameras. As a result, the crime rate has fallen.\",\"vi\":\"Nhiều thành phố đã lắp camera. Kết quả là tỉ lệ tội phạm đã giảm.\"},\"lesson\":30,\"aids\":[\"Hay đi với: reduce the crime rate · a high crime rate\"]},{\"id\":\"deter|v\",\"headword\":\"deter\",\"pos\":\"v\",\"ipa\":\"/dɪˈtɜːr/\",\"meaning\":\"răn đe; ngăn chặn (ai làm gì)\",\"example\":{\"text\":\"Security cameras can deter crime. In addition, they help the police find criminals.\",\"vi\":\"Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.\"},\"lesson\":30,\"aids\":[\"Trọng âm: de-TER\",\"Hay đi với: deter crime · deter people from committing crimes\"]},{\"id\":\"prevent|v\",\"headword\":\"prevent\",\"pos\":\"v\",\"ipa\":\"/prɪˈvent/\",\"meaning\":\"ngăn chặn; phòng ngừa\",\"example\":{\"text\":\"Better street lights can prevent people from committing crimes at night.\",\"vi\":\"Đèn đường tốt hơn có thể ngăn người ta phạm tội vào ban đêm.\"},\"lesson\":30,\"aids\":[\"Trọng âm: pre-VENT\",\"Hay đi với: prevent crime · prevent somebody from + V-ing\"]},{\"id\":\"encourage|v\",\"headword\":\"encourage\",\"pos\":\"v\",\"ipa\":\"/ɪnˈkʌr.ɪdʒ/\",\"meaning\":\"khuyến khích; động viên\",\"example\":{\"text\":\"Schools should encourage students to follow the law.\",\"vi\":\"Trường học nên khuyến khích học sinh tuân thủ pháp luật.\"},\"lesson\":30,\"aids\":[\"Trọng âm: en-COU-rage\",\"Hay đi với: encourage somebody to + V\"]},{\"id\":\"harsh|adj\",\"headword\":\"harsh\",\"pos\":\"adj\",\"ipa\":\"/hɑːʃ/\",\"meaning\":\"khắc nghiệt; nghiêm khắc\",\"example\":{\"text\":\"Some people think harsh punishments are the best way to protect public safety.\",\"vi\":\"Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng.\"},\"lesson\":30,\"aids\":[\"Hay đi với: a harsh punishment · harsh laws\"]},{\"id\":\"community-service|phr-n\",\"headword\":\"community service\",\"pos\":\"phr-n\",\"ipa\":\"/kəˌmjuː.nə.ti ˈsɜː.vɪs/\",\"meaning\":\"lao động công ích (hình phạt thay tù)\",\"example\":{\"text\":\"The main advantage of community service is that offenders help society.\",\"vi\":\"Ưu điểm chính của lao động công ích là người phạm tội giúp ích cho xã hội.\"},\"lesson\":30,\"aids\":[\"Hay đi với: do community service · be sentenced to community service\"]},{\"id\":\"freedom|n\",\"headword\":\"freedom\",\"pos\":\"n\",\"ipa\":\"/ˈfriː.dəm/\",\"meaning\":\"sự tự do\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"},\"lesson\":30,\"aids\":[\"Trọng âm: FREE-dom\",\"Hay đi với: personal freedom · freedom of speech\"]},{\"id\":\"in-addition|idiom\",\"headword\":\"in addition\",\"pos\":\"idiom\",\"ipa\":\"/ɪn əˈdɪʃ.ən/\",\"meaning\":\"thêm vào đó; ngoài ra\",\"example\":{\"text\":\"Security cameras can deter crime. In addition, they help the police find criminals.\",\"vi\":\"Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.\"},\"lesson\":30,\"aids\":[\"Hay đi với: In addition, … · in addition to + N/V-ing\"]},{\"id\":\"on-the-other-hand|idiom\",\"headword\":\"on the other hand\",\"pos\":\"idiom\",\"ipa\":\"/ɒn ði ˈʌð.ər ˌhænd/\",\"meaning\":\"mặt khác (nêu ý đối lập)\",\"example\":{\"text\":\"Prison is very expensive. On the other hand, it keeps dangerous people away from the public.\",\"vi\":\"Nhà tù rất tốn kém. Mặt khác, nó giữ những người nguy hiểm tránh xa công chúng.\"},\"lesson\":30},{\"id\":\"however|adv\",\"headword\":\"however\",\"pos\":\"adv\",\"ipa\":\"/haʊˈev.ər/\",\"meaning\":\"tuy nhiên\",\"example\":{\"text\":\"However, too many cameras may reduce people's freedom.\",\"vi\":\"Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.\"},\"lesson\":30,\"aids\":[\"hau-EV-ờ: nhấn âm 2.\",\"Trọng âm: how-E-ver\"]},{\"id\":\"therefore|adv\",\"headword\":\"therefore\",\"pos\":\"adv\",\"ipa\":\"/ˈðeə.fɔːr/\",\"meaning\":\"vì vậy; do đó\",\"example\":{\"text\":\"Cameras record everything. Therefore, it is easier to find witnesses.\",\"vi\":\"Camera ghi lại mọi thứ. Vì vậy, việc tìm nhân chứng dễ hơn.\"},\"lesson\":30,\"aids\":[\"Trọng âm: THERE-fore\"]},{\"id\":\"nuclear-family|phr-n\",\"headword\":\"nuclear family\",\"pos\":\"phr-n\",\"ipa\":\"/ˌnjuː.kli.ə ˈfæm.əl.i/\",\"meaning\":\"gia đình hạt nhân (bố mẹ và con cái)\",\"example\":{\"text\":\"The nuclear family has become more common in big cities.\",\"vi\":\"Gia đình hạt nhân đã trở nên phổ biến hơn ở các thành phố lớn.\"},\"lesson\":31,\"aids\":[\"Hay đi với: live in a nuclear family · the traditional nuclear family\"]},{\"id\":\"extended-family|phr-n\",\"headword\":\"extended family\",\"pos\":\"phr-n\",\"ipa\":\"/ɪkˌsten.dɪd ˈfæm.əl.i/\",\"meaning\":\"đại gia đình (ông bà, cô chú… sống chung hoặc gắn bó)\",\"example\":{\"text\":\"In Vietnam, many people still live with their extended family.\",\"vi\":\"Ở Việt Nam, nhiều người vẫn sống cùng đại gia đình.\"},\"lesson\":31,\"aids\":[\"Hay đi với: live with your extended family · members of the extended family\"]},{\"id\":\"generation-gap|phr-n\",\"headword\":\"generation gap\",\"pos\":\"phr-n\",\"ipa\":\"/ˌdʒen.əˈreɪ.ʃən ɡæp/\",\"meaning\":\"khoảng cách thế hệ\",\"example\":{\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"},\"lesson\":31,\"aids\":[\"Trọng âm: gen-e-RA-tion gap\",\"Hay đi với: bridge the generation gap · a wide generation gap\"]},{\"id\":\"work-life-balance|phr-n\",\"headword\":\"work-life balance\",\"pos\":\"phr-n\",\"ipa\":\"/ˌwɜːk ˈlaɪf ˌbæl.əns/\",\"meaning\":\"cân bằng giữa công việc và cuộc sống\",\"example\":{\"text\":\"Many adults find it hard to have a good work-life balance.\",\"vi\":\"Nhiều người trưởng thành thấy khó cân bằng giữa công việc và cuộc sống.\"},\"lesson\":31,\"aids\":[\"Hay đi với: have a good work-life balance · improve your work-life balance\"]},{\"id\":\"bring-up|phr-v\",\"headword\":\"bring up\",\"pos\":\"phr-v\",\"ipa\":\"/ˌbrɪŋ ˈʌp/\",\"meaning\":\"nuôi dạy (con cái)\",\"example\":{\"text\":\"I was brought up by my grandmother because my parents worked abroad.\",\"vi\":\"Tôi được bà nuôi dạy vì bố mẹ tôi làm việc ở nước ngoài.\"},\"lesson\":31,\"aids\":[\"Hay đi với: bring up children · be brought up by your grandparents\"]},{\"id\":\"household-chore|phr-n\",\"headword\":\"household chore\",\"pos\":\"phr-n\",\"ipa\":\"/ˌhaʊs.həʊld ˈtʃɔːr/\",\"meaning\":\"việc nhà\",\"example\":{\"text\":\"Children will learn responsibility if they do household chores.\",\"vi\":\"Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà.\"},\"lesson\":31,\"aids\":[\"Hay đi với: do household chores · share the household chores\"]},{\"id\":\"look-after|phr-v\",\"headword\":\"look after\",\"pos\":\"phr-v\",\"ipa\":\"/ˌlʊk ˈɑːf.tər/\",\"meaning\":\"chăm sóc; trông nom\",\"example\":{\"text\":\"If my grandparents live with us, they can help look after my little brother.\",\"vi\":\"Nếu ông bà sống cùng chúng tôi, ông bà có thể giúp trông em trai tôi.\"},\"lesson\":31,\"aids\":[\"Hay đi với: look after children · look after elderly parents\"]},{\"id\":\"elderly|adj\",\"headword\":\"elderly\",\"pos\":\"adj\",\"ipa\":\"/ˈel.dəl.i/\",\"meaning\":\"cao tuổi (cách nói lịch sự)\",\"example\":{\"text\":\"When my father retires next year, he will spend more time with his elderly parents.\",\"vi\":\"Khi bố tôi nghỉ hưu vào năm sau, ông sẽ dành nhiều thời gian hơn cho ông bà nội đã cao tuổi.\"},\"lesson\":31,\"aids\":[\"Trọng âm: EL-der-ly\",\"Hay đi với: elderly parents · the elderly\"]},{\"id\":\"retire|v\",\"headword\":\"retire\",\"pos\":\"v\",\"ipa\":\"/rɪˈtaɪər/\",\"meaning\":\"nghỉ hưu\",\"example\":{\"text\":\"When my father retires next year, he will spend more time with his elderly parents.\",\"vi\":\"Khi bố tôi nghỉ hưu vào năm sau, ông sẽ dành nhiều thời gian hơn cho ông bà nội đã cao tuổi.\"},\"lesson\":31,\"aids\":[\"Trọng âm: re-TIRE\",\"Hay đi với: retire at 60 · retire from work\"]},{\"id\":\"responsibility|n\",\"headword\":\"responsibility\",\"pos\":\"n\",\"ipa\":\"/rɪˌspɒn.səˈbɪl.ə.ti/\",\"meaning\":\"trách nhiệm\",\"example\":{\"text\":\"Children will learn responsibility if they do household chores.\",\"vi\":\"Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà.\"},\"lesson\":31,\"aids\":[\"Trọng âm: re-spon-si-BI-li-ty\",\"Hay đi với: take responsibility for · share the responsibility\"]},{\"id\":\"support|v\",\"headword\":\"support\",\"pos\":\"v\",\"ipa\":\"/səˈpɔːt/\",\"meaning\":\"hỗ trợ; nuôi (về tài chính); ủng hộ\",\"example\":{\"text\":\"In a close-knit family, everyone supports each other.\",\"vi\":\"Trong một gia đình gắn bó, mọi người đều hỗ trợ lẫn nhau.\"},\"lesson\":31,\"aids\":[\"Trọng âm: sup-PORT\",\"Hay đi với: support your family · support elderly parents financially\"]},{\"id\":\"relationship|n\",\"headword\":\"relationship\",\"pos\":\"n\",\"ipa\":\"/rɪˈleɪ.ʃən.ʃɪp/\",\"meaning\":\"mối quan hệ\",\"example\":null,\"lesson\":31,\"aids\":[\"Trọng âm: re-LA-tion-ship\",\"Hay đi với: a close relationship with · build a good relationship\"]},{\"id\":\"respect|v\",\"headword\":\"respect\",\"pos\":\"v\",\"ipa\":\"/rɪˈspekt/\",\"meaning\":\"tôn trọng; kính trọng\",\"example\":{\"text\":\"Young people should respect traditional values, but they don't have to follow all of them.\",\"vi\":\"Người trẻ nên tôn trọng các giá trị truyền thống, nhưng không nhất thiết phải làm theo tất cả.\"},\"lesson\":31,\"aids\":[\"Trọng âm: re-SPECT\",\"Hay đi với: respect your elders · respect other people's opinions\"]},{\"id\":\"get-on-with|phr-v\",\"headword\":\"get on with\",\"pos\":\"phr-v\",\"ipa\":\"/ˌɡet ˈɒn wɪð/\",\"meaning\":\"hòa hợp với (ai)\",\"example\":{\"text\":\"I get on well with my father, but we sometimes argue about my future.\",\"vi\":\"Tôi hòa hợp với bố, nhưng thỉnh thoảng hai bố con tranh cãi về tương lai của tôi.\"},\"lesson\":31,\"aids\":[\"Hay đi với: get on well with · not get on with\"]},{\"id\":\"single-parent|phr-n\",\"headword\":\"single parent\",\"pos\":\"phr-n\",\"ipa\":\"/ˌsɪŋ.ɡəl ˈpeə.rənt/\",\"meaning\":\"cha/mẹ đơn thân\",\"example\":null,\"lesson\":31,\"aids\":[\"Hay đi với: a single-parent family · be brought up by a single parent\"]},{\"id\":\"traditional|adj\",\"headword\":\"traditional\",\"pos\":\"adj\",\"ipa\":\"/trəˈdɪʃ.ən.əl/\",\"meaning\":\"truyền thống\",\"example\":{\"text\":\"Young people should respect traditional values, but they don't have to follow all of them.\",\"vi\":\"Người trẻ nên tôn trọng các giá trị truyền thống, nhưng không nhất thiết phải làm theo tất cả.\"},\"lesson\":31,\"aids\":[\"Trọng âm: tra-DI-tion-al\",\"Hay đi với: traditional values · traditional gender roles\"]},{\"id\":\"close-knit|adj\",\"headword\":\"close-knit\",\"pos\":\"adj\",\"ipa\":\"/ˌkləʊsˈnɪt/\",\"meaning\":\"gắn bó khăng khít\",\"example\":{\"text\":\"In a close-knit family, everyone supports each other.\",\"vi\":\"Trong một gia đình gắn bó, mọi người đều hỗ trợ lẫn nhau.\"},\"lesson\":31,\"aids\":[\"Hay đi với: a close-knit family · a close-knit community\"]},{\"id\":\"unless|conj\",\"headword\":\"unless\",\"pos\":\"conj\",\"ipa\":\"/ənˈles/\",\"meaning\":\"trừ khi; nếu … không\",\"example\":{\"text\":\"Unless we talk to each other more, the generation gap will get wider.\",\"vi\":\"Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.\"},\"lesson\":31,\"aids\":[\"Trọng âm: un-LESS\",\"Hay đi với: unless you hurry · unless it rains\"]},{\"id\":\"gender-role|phr-n\",\"headword\":\"gender role\",\"pos\":\"phr-n\",\"ipa\":\"/ˈdʒen.də ˌrəʊl/\",\"meaning\":\"vai trò giới (việc được cho là của nam hoặc nữ)\",\"example\":{\"text\":\"Gender roles have changed. For example, many fathers now cook and look after the children.\",\"vi\":\"Vai trò giới đã thay đổi. Ví dụ, nhiều ông bố giờ nấu ăn và chăm con.\"},\"lesson\":32,\"aids\":[\"Hay đi với: traditional gender roles · challenge gender roles\"]},{\"id\":\"equality|n\",\"headword\":\"equality\",\"pos\":\"n\",\"ipa\":\"/iˈkwɒl.ə.ti/\",\"meaning\":\"sự bình đẳng\",\"example\":{\"text\":\"Gender equality starts at home, when boys and girls do the same household chores.\",\"vi\":\"Bình đẳng giới bắt đầu từ trong nhà, khi con trai và con gái cùng làm việc nhà như nhau.\"},\"lesson\":32,\"aids\":[\"Trọng âm: e-QUAL-i-ty\",\"Hay đi với: gender equality · equality between men and women\"]},{\"id\":\"role-model|phr-n\",\"headword\":\"role model\",\"pos\":\"phr-n\",\"ipa\":\"/ˈrəʊl ˌmɒd.əl/\",\"meaning\":\"tấm gương (để noi theo)\",\"example\":{\"text\":\"Children often copy their parents because they see them as role models.\",\"vi\":\"Trẻ em thường bắt chước bố mẹ vì chúng coi bố mẹ là tấm gương.\"},\"lesson\":32,\"aids\":[\"Hay đi với: a good role model for · act as a role model\"]},{\"id\":\"influence|v\",\"headword\":\"influence\",\"pos\":\"v\",\"ipa\":\"/ˈɪn.flu.əns/\",\"meaning\":\"ảnh hưởng đến\",\"example\":{\"text\":\"Nowadays, teenagers are influenced more by social media than by their parents.\",\"vi\":\"Ngày nay, thanh thiếu niên chị orship\",\"pos\":\"n\",\"ipa\":\"/ˈsen.sə.ʃɪp/\",\"meaning\":\"sự kiểm duyệt\",\"example\":{\"text\":\"Others believe that censorship would limit freedom of speech.\",\"vi\":\"Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận.\"},\"lesson\":38,\"aids\":[\"Trọng âm: CEN-sor-ship\",\"Hay đi với: media censorship · strict censorship\"]},{\"id\":\"freedom-of-speech|phr-n\",\"headword\":\"freedom of speech\",\"pos\":\"phr-n\",\"ipa\":\"/ˌfriː.dəm əv ˈspiːtʃ/\",\"meaning\":\"quyền tự do ngôn luận\",\"example\":{\"text\":\"Others believe that censorship would limit freedom of speech.\",\"vi\":\"Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận.\"},\"lesson\":38,\"aids\":[\"Hay đi với: protect freedom of speech · limit freedom of speech\"]},{\"id\":\"freedom-of-the-press|phr-n\",\"headword\":\"freedom of the press\",\"pos\":\"phr-n\",\"ipa\":\"/ˌfriː.dəm əv ðə ˈpres/\",\"meaning\":\"tự do báo chí\",\"example\":{\"text\":\"Freedom of the press is important because journalists need to report the truth.\",\"vi\":\"Tự do báo chí quan trọng vì nhà báo cần đưa tin sự thật.\"},\"lesson\":38,\"aids\":[\"Hay đi với: respect freedom of the press\"]},{\"id\":\"regulate|v\",\"headword\":\"regulate\",\"pos\":\"v\",\"ipa\":\"/ˈreɡ.jə.leɪt/\",\"meaning\":\"quản lý; điều tiết (bằng luật lệ)\",\"example\":{\"text\":\"Some people argue that the government should regulate social media more strictly.\",\"vi\":\"Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn.\"},\"lesson\":38,\"aids\":[\"Trọng âm: REG-u-late\",\"Hay đi với: regulate social media · strictly regulated\"]},{\"id\":\"government|n\",\"headword\":\"government\",\"pos\":\"n\",\"ipa\":\"/ˈɡʌv.ən.mənt/\",\"meaning\":\"chính phủ\",\"example\":{\"text\":\"Some people argue that the government should regulate social media more strictly.\",\"vi\":\"Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn.\"},\"lesson\":38,\"aids\":[\"GUV-ần-mần: chữ n ở giữa thường khôn \":\"so-that|conj\",\"headword\":\"so that\",\"pos\":\"conj\",\"ipa\":\"/ˈsəʊ ðæt/\",\"meaning\":\"để mà (+ mệnh đề)\",\"example\":{\"text\":\"I work from home on Fridays so that I can spend more time with my family.\",\"vi\":\"Tôi làm việc tại nhà vào thứ Sáu để có thể dành nhiều thời gian hơn cho gia đình.\"},\"lesson\":39,\"aids\":[\"Hay đi với: so that I can · so that they won't\"]},{\"id\":\"in-order-to|idiom\",\"headword\":\"in order to\",\"pos\":\"idiom\",\"ipa\":\"/ɪn ˈɔː.də tə/\",\"meaning\":\"để (+ động từ nguyên thể)\",\"example\":{\"text\":\"Many students do an internship in order to gain work experience.\",\"vi\":\"Nhiều sinh viên đi thực tập để có kinh nghiệm làm việc.\"},\"lesson\":39,\"aids\":[\"Hay đi với: in order to save money · in order not to be late\"]},{\"id\":\"unemployment|n\",\"headword\":\"unemployment\",\"pos\":\"n\",\"ipa\":\"/ˌʌn.ɪmˈplɔɪ.mənt/\",\"meaning\":\"tình trạng thất nghiệp\",\"example\":{\"text\":\"When it comes to youth unemployment, I think the main problem is a lack of practical skills.\",\"vi\":\"Nói về tình trạng thất nghiệp ở người trẻ, tôi nghĩ vấn đề chính là thiếu kỹ năng thực tế.\"},\"lesson\":40,\"aids\":[\"Trọng âm: un-em-PLOY-ment\",\"Hay đi với: high unemployment · youth unemployment\"]},{\"id\":\"job-security|phr-n\",\"headword\":\"job security\",\"pos\":\"phr-n\",\"ipa\":\"/ˈdʒɒb sɪˌkjʊə.rə.ti/\",\"meaning\":\"sự ổn định; an toàn của công việc (ít nguy cơ mất việc)\",\"example\":{\"text\":\"When it comes to choosing a career, job security matters more to my parents than to me.\",\"vi\":\"Khi chọn nghề, sự ổn định công việc quan trọng với bố mẹ tôi hơn là với tôi.\"},\"lesson\":40,\"aids\":[\"Hay đi với: have job security · a lack of job security\"]},{\"id\":\"income-inequality|phr-n\",\"headword\":\"income inequality\",\"pos\":\"phr-n\",\"ipa\":\"/ˈɪn.kʌm ˌɪn.ɪˈkwɒl.ə.ti/\",\"meaning\":\"bất bình đẳng thu nhập\",\"example\":{\"text\":\"Rapid economic growth has created many jobs, but income inequality has also increased.\",\"vi\":\"Tăng trưởng kinh tế nhanh đã tạo ra nhiều việc làm, nhưng bất bình đẳng thu nhập cũng tăng lên.\"},\"lesson\":40,\"aids\":[\"Hay đi với: reduce income inequality · growing income inequality\"]},{\"id\":\"minimum-wage|phr-n\",\"headword\":\"minimum wage\",\"pos\":\"phr-n\",\"ipa\":\"/ˌmɪn.ɪ.məm ˈweɪdʒ/\",\"meaning\":\"lương tối thiểu\",\"example\":{\"text\":\"Many people believe the minimum wage should be raised because the cost of living is rising.\",\"vi\":\"Nhiều người cho rằng lương tối thiểu nên được tăng vì chi phí sinh hoạt đang tăng.\"},\"lesson\":40,\"aids\":[\"Hay đi với: raise the minimum wage · earn the minimum wage\"]},{\"id\":\"economic-growth|phr-n\",\"headword\":\"economic growth\",\"pos\":\"phr-n\",\"ipa\":\"/ˌiː.kəˌnɒm.ɪk ˈɡrəʊθ/\",\"meaning\":\"tăng trưởng kinh tế\",\"example\":{\"text\":\"Rapid economic growth has created many jobs, but income inequality has also increased.\",\"vi\":\"Tăng trưởng kinh tế nhanh đã tạo ra nhiều việc làm, nhưng bất bình đẳng thu nhập cũng tăng lên.\"},\"lesson\":40,\"aids\":[\"Hay đi với: rapid economic growth · lead to economic growth\"]},{\"id\":\"economy|n\",\"headword\":\"economy\",\"pos\":\"n\",\"ipa\":\"/iˈkɒn.ə.mi/\",\"meaning\":\"nền kinh tế\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"},\"lesson\":40,\"aids\":[\"Trọng âm: e-CON-o-my\",\"Hay đi với: a strong economy · the global economy\"]},{\"id\":\"industry|n\",\"headword\":\"industry\",\"pos\":\"n\",\"ipa\":\"/ˈɪn.də.stri/\",\"meaning\":\"ngành công nghiệp; ngành\",\"example\":{\"text\":\"Vietnam's economy depends a lot on the manufacturing industry.\",\"vi\":\"Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất.\"},\"lesson\":40,\"aids\":[\"Trọng âm: IN-dus-try\",\"Hay đi với: the tourism industry · the IT industry\"]},{\"id\":\"replace|v\",\"headword\":\"replace\",\"pos\":\"v\",\"ipa\":\"/rɪˈple mple\":{\"text\":\"Strict law enforcement is needed to reduce violent crime.\",\"vi\":\"Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực.\"},\"lesson\":50,\"aids\":[\"Hay đi với: a fall in violent crime\"]},{\"id\":\"crack-down-on|phr-v\",\"headword\":\"crack down on\",\"pos\":\"phr-v\",\"ipa\":\"/ˌkræk ˈdaʊn ɒn/\",\"meaning\":\"trấn áp mạnh tay\",\"example\":{\"text\":\"The police have cracked down on drink-driving during the holiday season.\",\"vi\":\"Cảnh sát đã trấn áp mạnh tay việc lái xe sau khi uống rượu trong mùa lễ.\"},\"lesson\":50,\"aids\":[\"Hay đi với: crack down on drink-driving · the police cracked down on theft\"]},{\"id\":\"root-cause|phr-n\",\"headword\":\"root cause\",\"pos\":\"phr-n\",\"ipa\":\"/ˌruːt ˈkɔːz/\",\"meaning\":\"nguyên nhân gốc rễ\",\"example\":{\"text\":\"Poverty and a lack of education are two root causes of juvenile crime.\",\"vi\":\"Nghèo đói và thiếu giáo dục là hai nguyên nhân gốc rễ của tội phạm vị thành niên.\"},\"lesson\":50,\"aids\":[\"Hay đi với: tackle the root causes of crime · the root cause of the problem\"]},{\"id\":\"reduction|n\",\"headword\":\"reduction\",\"pos\":\"n\",\"ipa\":\"/rɪˈdʌk.ʃən/\",\"meaning\":\"sự giảm bớt\",\"example\":{\"text\":\"There has been a significant reduction in petty crime since the cameras were installed.\",\"vi\":\"Tội vặt đã giảm đáng kể kể từ khi camera được lắp đặt.\"},\"lesson\":50,\"aids\":[\"Hay đi với: a significant reduction in · lead to a reduction in\"]},{\"id\":\"increase|n\",\"headword\":\"increase\",\"pos\":\"n\",\"ipa\":\"/ˈɪŋ.kriːs/\",\"meaning\":\"sự gia tăng\",\"example\":{\"text\":\"More video surveillance may lead to an increase in public safety.\",\"vi\":\"Giám sát bằng camera nhiều hơn có thể giúp tăng an toàn công cộng.\"},\"lesson\":50,\"aids\":[\"Trọng âm: IN-crease\",\"Hay đi với: an increase in crime · a sharp increase\"]},{\"id\":\"prevention|n\",\"headword\":\"prevention\",\"pos\":\"n\",\"ipa\":\"/prɪˈven.ʃən/\",\"meaning\":\"sự phòng ngừa\",\"example\":{\ innocent|adj\",\"headword\":\"innocent\",\"pos\":\"adj\",\"ipa\":\"/ˈɪn.ə.sənt/\",\"meaning\":\"vô tội\",\"example\":{\"text\":\"The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.\",\"vi\":\"Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.\"},\"lesson\":51,\"aids\":[\"Hay đi với: innocent people · be found innocent\"]},{\"id\":\"guilty|adj\",\"headword\":\"guilty\",\"pos\":\"adj\",\"ipa\":\"/ˈɡɪl.ti/\",\"meaning\":\"có tội; cảm thấy có lỗi\",\"example\":{\"text\":\"Everyone has the right to a fair trial, even people who are clearly guilty.\",\"vi\":\"Ai cũng có quyền được xét xử công bằng, kể cả người rõ ràng có tội.\"},\"lesson\":51,\"aids\":[\"Hay đi với: be found guilty of · feel guilty\"]},{\"id\":\"evidence|n\",\"headword\":\"evidence\",\"pos\":\"n\",\"ipa\":\"/ˈev.ɪ.dəns/\",\"meaning\":\"bằng chứng\",\"example\":{\"text\":\"Prison is expensive. Moreover, there is little evidence that it reduces crime.\",\"vi\":\"Nhà tù tốn kém. Hơn nữa, có rất ít bằng chứng cho thấy nó làm giảm tội phạm.\"},\"lesson\":51,\"aids\":[\"Hay đi với: there is little evidence that · strong evidence\"]},{\"id\":\"algorithm|n\",\"headword\":\"algorithm\",\"pos\":\"n\",\"ipa\":\"/ˈæl.ɡə.rɪ.ðəm/\",\"meaning\":\"thuật toán\",\"example\":{\"text\":\"Some algorithms appear to show a bias against women.\",\"vi\":\"Một số thuật toán dường như thể hiện sự thiên lệch với phụ nữ.\"},\"lesson\":52,\"aids\":[\"Trọng âm: AL-go-ri-thm\",\"Hay đi với: a computer algorithm · algorithms decide what we see\"]},{\"id\":\"machine-learning|phr-n\",\"headword\":\"machine learning\",\"pos\":\"phr-n\",\"ipa\":\"/məˌʃiːn ˈlɜː.nɪŋ/\",\"meaning\":\"học máy\",\"example\":{\"text\":\"Machine learning has led to a major breakthrough in medical diagnosis.\",\"vi\":\"Học máy đã dẫn đến một bước đột phá lớn trong chẩn đoán y khoa.\"},\"lesson\":52,\"aids\":[\"Hay đi với: machine learning systems · use machine learning to\"]},{\"id\":  đi với: deepfake videos · spot a deepfake\"]},{\"id\":\"chatbot|n\",\"headword\":\"chatbot\",\"pos\":\"n\",\"ipa\":\"/ˈtʃæt.bɒt/\",\"meaning\":\"chatbot; phần mềm trò chuyện tự động\",\"example\":{\"text\":\"Chatbots can generate a whole essay in a few seconds.\",\"vi\":\"Chatbot có thể tạo ra cả một bài luận trong vài giây.\"},\"lesson\":52,\"aids\":[\"Hay đi với: an AI chatbot · ask a chatbot\"]},{\"id\":\"job-displacement|phr-n\",\"headword\":\"job displacement\",\"pos\":\"phr-n\",\"ipa\":\"/ˈdʒɒb dɪsˌpleɪs.mənt/\",\"meaning\":\"việc người lao động bị thay thế; mất việc (do công nghệ)\",\"example\":{\"text\":\"While it is true that automation causes job displacement, it also creates new kinds of work.\",\"vi\":\"Mặc dù đúng là tự động hóa khiến người lao động mất việc, nó cũng tạo ra những loại việc mới.\"},\"lesson\":53,\"aids\":[\"Hay đi với: job displacement caused by automation\"]},{\"id\":\"rely-on|phr-v\",\"headword\":\"rely on\",\"pos\":\"phr-v\",\"ipa\":\"/rɪˈlaɪ ɒn/\",\"meaning\":\"dựa vào; phụ thuộc vào\",\"example\":{\"text\":\"Many older people rely on their children to use online banking.\",\"vi\":\"Nhiều người lớn tuổi phải dựa vào con cái để dùng ngân hàng trực tuyến.\"},\"lesson\":53,\"aids\":[\"Hay đi với: rely too much on technology · rely on smartphones\"]},{\"id\":\"reliance|n\",\"headword\":\"reliance\",\"pos\":\"n\",\"ipa\":\"/rɪˈlaɪ.əns/\",\"meaning\":\"sự phụ thuộc\",\"example\":{\"text\":\"Admittedly, smartphones are convenient. However, our reliance on them may be harmful.\",\"vi\":\"Phải thừa nhận điện thoại thông minh rất tiện. Tuy nhiên, việc phụ thuộc vào chúng có thể có hại.\"},\"lesson\":53,\"aids\":[\"Hay đi với: our reliance on technology · heavy reliance on\"]},{\"id\":\"digital-divide|phr-n\",\"headword\":\"digital divide\",\"pos\":\"phr-n\",\"ipa\":\"/ˌdɪdʒ.ɪ.təl dɪˈvaɪd/\",\"meaning\":\"khoảng cách số (giữa người có và không có công nghệ)\",\"example\":{\"text\":\"The digital divide between cities and rural areas is still wi on\":58,\"aids\":[\"Trọng âm: PUR-chase\",\"Hay đi với: purchase goods online · be purchased by consumers\"]},{\"id\":\"impulse-buying|phr-n\",\"headword\":\"impulse buying\",\"pos\":\"phr-n\",\"ipa\":\"/ˈɪm.pʌls ˌbaɪ.ɪŋ/\",\"meaning\":\"mua sắm bốc đồng\",\"example\":{\"text\":\"Not only does e-commerce save time, but it also encourages impulse buying.\",\"vi\":\"Thương mại điện tử không chỉ tiết kiệm thời gian mà còn khuyến khích mua sắm bốc đồng.\"},\"lesson\":58,\"aids\":[\"Hay đi với: encourage impulse buying · an impulse buy\"]},{\"id\":\"disposable-income|phr-n\",\"headword\":\"disposable income\",\"pos\":\"phr-n\",\"ipa\":\"/dɪˌspəʊ.zə.bəl ˈɪn.kʌm/\",\"meaning\":\"thu nhập khả dụng (tiền còn lại sau thuế và chi phí thiết yếu)\",\"example\":{\"text\":\"As disposable income rises, people spend more on luxury goods.\",\"vi\":\"Khi thu nhập khả dụng tăng, người ta chi nhiều hơn cho hàng xa xỉ.\"},\"lesson\":58,\"aids\":[\"Hay đi với: have more disposable income · a rise in disposable income\"]},{\"id\":\"luxury-goods|phr-n\",\"headword\":\"luxury goods\",\"pos\":\"phr-n\",\"ipa\":\"/ˈlʌk.ʃər.i ˌɡʊdz/\",\"meaning\":\"hàng xa xỉ\",\"example\":{\"text\":\"As disposable income rises, people spend more on luxury goods.\",\"vi\":\"Khi thu nhập khả dụng tăng, người ta chi nhiều hơn cho hàng xa xỉ.\"},\"lesson\":58,\"aids\":[\"Hay đi với: spend money on luxury goods · the market for luxury goods\"]},{\"id\":\"materialistic|adj\",\"headword\":\"materialistic\",\"pos\":\"adj\",\"ipa\":\"/məˌtɪə.ri.əˈlɪs.tɪk/\",\"meaning\":\"thực dụng; coi trọng vật chất\",\"example\":{\"text\":\"The rise of consumerism has made society more materialistic.\",\"vi\":\"Sự trỗi dậy của chủ nghĩa tiêu dùng khiến xã hội trở nên thực dụng hơn.\"},\"lesson\":58,\"aids\":[\"Trọng âm: ma-te-ri-a-LIS-tic\",\"Hay đi với: a materialistic society · become more materialistic\"]},{\"id\":\"status-symbol|phr-n\",\"headword\":\"status symbol\",\"pos\":\"phr-n\",\"ipa\":\"/ˈsteɪ.təs ˌsɪm.bəl/\",\"meaning\":\"biểu tượng địa vị (món đồ để khoe đẳng cấp)\",\"example\":{\"text\":\"For many young people, the latest phone is a status symbol.\",\"vi\":\"Với nhiều người trẻ, chiếc điện thoại mới nhất là biểu tượng địa vị.\"},\"lesson\":58,\"aids\":[\"Hay đi với: see a car as a status symbol\"]},{\"id\":\"inflation|n\",\"headword\":\"inflation\",\"pos\":\"n\",\"ipa\":\"/ɪnˈfleɪ.ʃən/\",\"meaning\":\"lạm phát\",\"example\":{\"text\":\"Only when inflation rises do many families start to live more frugally.\",\"vi\":\"Chỉ khi lạm phát tăng thì nhiều gia đình mới bắt đầu sống tiết kiệm hơn.\"},\"lesson\":58,\"aids\":[\"Hay đi với: high inflation · the rate of inflation\"]},{\"id\":\"recession|n\",\"headword\":\"recession\",\"pos\":\"n\",\"ipa\":\"/rɪˈseʃ.ən/\",\"meaning\":\"suy thoái kinh tế\",\"example\":{\"text\":\"During the recession, many retailers closed their shops.\",\"vi\":\"Trong thời kỳ suy thoái, nhiều nhà bán lẻ đã đóng cửa hàng.\"},\"lesson\":58,\"aids\":[\"Hay đi với: during a recession · the economy went into recession\"]},{\"id\":\"debt|n\",\"headword\":\"debt\",\"pos\":\"n\",\"ipa\":\"/det/\",\"meaning\":\"nợ; khoản nợ\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"},\"lesson\":58,\"aids\":[\"Hay đi với: be in debt · get into debt\"]},{\"id\":\"frugal|adj\",\"headword\":\"frugal\",\"pos\":\"adj\",\"ipa\":\"/ˈfruː.ɡəl/\",\"meaning\":\"tiết kiệm; tằn tiện\",\"example\":{\"text\":\"Only when inflation rises do many families start to live more frugally.\",\"vi\":\"Chỉ khi lạm phát tăng thì nhiều gia đình mới bắt đầu sống tiết kiệm hơn.\"},\"lesson\":58,\"aids\":[\"Hay đi với: a frugal lifestyle · live frugally\"]},{\"id\":\"splash-out|phr-v\",\"headword\":\"splash out\",\"pos\":\"phr-v\",\"ipa\":\"/ˌsplæʃ ˈaʊt/\",\"meaning\":\"vung tiền mua sắm; chi mạnh tay\",\"example\":{\"text\":\"I splashed out on a new laptop, and now I'm buying second-hand clothes to save money.\",\"vi\":\"Tôi đã chi mạnh tay mua laptop mới, và giờ tôi mua quần áo cũ để tiết kiệm.\"},\"lesson\":58,\"aids\":[\"Hay đi với: splash out on a new phone\"]},{\"id\":\"second-hand|adj\",\"headword\":\"second-hand\",\"pos\":\"adj\",\"ipa\":\"/ˌsek.ənd ˈhænd/\",\"meaning\":\"đã qua sử dụng; đồ cũ\",\"example\":{\"text\":\"I splashed out on a new laptop, and now I'm buying second-hand clothes to save money.\",\"vi\":\"Tôi đã chi mạnh tay mua laptop mới, và giờ tôi mua quần áo cũ để tiết kiệm.\"},\"lesson\":58,\"aids\":[\"Hay đi với: second-hand clothes · buy second-hand\"]},{\"id\":\"instant-gratification|phr-n\",\"headword\":\"instant gratification\",\"pos\":\"phr-n\",\"ipa\":\"/ˌɪn.stənt ˌɡræt.ɪ.fɪˈkeɪ.ʃən/\",\"meaning\":\"sự thỏa mãn tức thì\",\"example\":{\"text\":\"Online shopping offers instant gratification, which makes it hard to resist.\",\"vi\":\"Mua sắm trực tuyến mang lại sự thỏa mãn tức thì, khiến người ta khó cưỡng lại.\"},\"lesson\":58,\"aids\":[\"Hay đi với: a culture of instant gratification\"]},{\"id\":\"seldom|adv\",\"headword\":\"seldom\",\"pos\":\"adv\",\"ipa\":\"/ˈsel.dəm/\",\"meaning\":\"hiếm khi\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"},\"lesson\":58},{\"id\":\"loan|n\",\"headword\":\"loan\",\"pos\":\"n\",\"ipa\":\"/ləʊn/\",\"meaning\":\"khoản vay\",\"example\":{\"text\":\"Seldom do young people think about debt when they take out a loan.\",\"vi\":\"Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền.\"},\"lesson\":58,\"aids\":[\"Hay đi với: take out a loan · repay a loan\"]},{\"id\":\"retailer|n\",\"headword\":\"retailer\",\"pos\":\"n\",\"ipa\":\"/ˈriː.teɪ.lər/\",\"meaning\":\"nhà bán lẻ\",\"example\":{\"text\":\"During the recession, many retailers closed their shops.\",\"vi\":\"Trong thời kỳ suy thoái, nhiều nhà bán lẻ đã đóng cửa hàng.\"},\"lesson\":58,\"aids\":[\"Hay đi với: online retailers · large retailers\"]},{\"i \":{\"text\":\"The stairs are very narrow in my grandparents' house.\",\"vi\":\"Cầu thang nhà ông bà tôi rất hẹp.\"}},{\"id\":\"balcony|n\",\"term\":\"balcony\",\"reading\":\"/ˈbæl.kə.ni/\",\"meaning\":\"ban công\",\"definitionEn\":\"a small area outside an upstairs window, with a wall or rail\",\"lesson\":3,\"pos\":\"n\",\"hint\":\"Trọng âm: BAL-co-ny\",\"example\":{\"text\":\"Is there a balcony? Yes, there is.\",\"vi\":\"Có ban công không? Có.\"}},{\"id\":\"floor|n\",\"term\":\"floor\",\"reading\":\"/flɔː/\",\"meaning\":\"tầng (nhà); sàn nhà\",\"definitionEn\":\"one level of a building; also the surface you walk on\",\"lesson\":3,\"pos\":\"n\",\"hint\":\"Hay đi với: on the second floor · on the floor\",\"example\":{\"text\":\"Be careful! The floor is wet.\",\"vi\":\"Cẩn thận! Sàn nhà ướt đấy.\"}},{\"id\":\"next-to|prep\",\"term\":\"next to\",\"reading\":\"/ˈnekst tə/\",\"meaning\":\"bên cạnh\",\"definitionEn\":\"very close to, at the side of\",\"lesson\":3,\"pos\":\"prep\"},{\"id\":\"in-front-of|prep\",\"term\":\"in front of\",\"reading\":\"/ɪn ˈfrʌnt əv/\",\"meaning\":\"phía trước\",\"definitionEn\":\"at the place directly ahead of something\",\"lesson\":3,\"pos\":\"prep\"},{\"id\":\"behind|prep\",\"term\":\"behind\",\"reading\":\"/bɪˈhaɪnd/\",\"meaning\":\"phía sau\",\"definitionEn\":\"at the back of something\",\"lesson\":3,\"pos\":\"prep\",\"hint\":\"Trọng âm: be-HIND\",\"example\":{\"text\":\"There isn't a garden behind our house.\",\"vi\":\"Sau nhà chúng tôi không có vườn.\"}},{\"id\":\"between|prep\",\"term\":\"between\",\"reading\":\"/bɪˈtwiːn/\",\"meaning\":\"ở giữa (hai người/vật)\",\"definitionEn\":\"in the space in the middle of two things\",\"lesson\":3,\"pos\":\"prep\",\"hint\":\"Trọng âm: be-TWEEN — Hay đi với: between A and B\",\"example\":{\"text\":\"The bathroom is between the kitchen and my bedroom.\",\"vi\":\"Phòng tắm nằm giữa bếp và phòng ngủ của tôi.\"}},{\"id\":\"under|prep\",\"term\":\"under\",\"reading\":\"/ˈʌn.də/\",\"meaning\":\"ở dưới\ \":\"dậy; ra khỏi giường\",\"definitionEn\":\"to leave your bed after sleeping\",\"lesson\":5,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: get up early · get up late\"},{\"id\":\"take-a-shower|colloc\",\"term\":\"take a shower\",\"reading\":\"/teɪk ə ˈʃaʊ.ə/\",\"meaning\":\"tắm (vòi sen)\",\"definitionEn\":\"to wash your body under running water\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"have-breakfast|colloc\",\"term\":\"have breakfast\",\"reading\":\"/hæv ˈbrek.fəst/\",\"meaning\":\"ăn sáng\",\"definitionEn\":\"to eat the first meal of the day\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"go-to-work|colloc\",\"term\":\"go to work\",\"reading\":\"/ɡəʊ tə ˈwɜːk/\",\"meaning\":\"đi làm\",\"definitionEn\":\"to travel to your job\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"cook|v\",\"term\":\"cook\",\"reading\":\"/kʊk/\",\"meaning\":\"nấu ăn\",\"definitionEn\":\"to make food ready to eat by heating it\",\"lesson\":5,\"pos\":\"v\",\"example\":{\"text\":\"Gender roles have changed. For example, many fathers now cook and look after the children.\",\"vi\":\"Vai trò giới đã thay đổi. Ví dụ, nhiều ông bố giờ nấu ăn và chăm con.\"}},{\"id\":\"do-the-housework|colloc\",\"term\":\"do the housework\",\"reading\":\"/duː ðə ˈhaʊs.wɜːk/\",\"meaning\":\"làm việc nhà\",\"definitionEn\":\"to do cleaning, washing and other jobs at home\",\"lesson\":5,\"pos\":\"colloc\"},{\"id\":\"watch|v\",\"term\":\"watch\",\"reading\":\"/wɒtʃ/\",\"meaning\":\"xem (TV, phim)\",\"definitionEn\":\"to look at something, e.g. TV or a film, for a time\",\"lesson\":5,\"pos\":\"v\",\"hint\":\"Hay đi với: watch TV · watch a film\",\"example\":{\"text\":\"How often do you watch TV? Twice a week.\",\"vi\":\"Bạn có hay xem TV không? Hai lần một tuần.\"}},{\"id\":\"relax|v\",\"term\":\"relax\",\"reading\":\"/rɪˈlæks/\",\"meaning\":\"thư giãn; nghỉ ngơi\",\"definitionEn\":\"to rest and stop worrying\",\"lesson\":5,\"pos\":\"v\",\"hint\":\"Trọng âm: re-LAX\",\"example\":{\"text\":\"Painting helps me relax.\",\"vi\":\ ousers made of strong blue cotton\",\"lesson\":9,\"pos\":\"n\",\"example\":{\"text\":\"These jeans are not as comfortable as my old ones.\",\"vi\":\"Chiếc quần bò này không thoải mái bằng chiếc cũ của tôi.\"}},{\"id\":\"trousers|n\",\"term\":\"trousers\",\"reading\":\"/ˈtraʊ.zəz/\",\"meaning\":\"quần dài\",\"definitionEn\":\"clothing that covers each leg separately\",\"lesson\":9,\"pos\":\"n\",\"hint\":\"TRAU-zờz.\",\"example\":{\"text\":\"Can I try on these trousers in a bigger size?\",\"vi\":\"Tôi có thể thử chiếc quần dài này cỡ lớn hơn không?\"}},{\"id\":\"skirt|n\",\"term\":\"skirt\",\"reading\":\"/skɜːt/\",\"meaning\":\"chân váy\",\"definitionEn\":\"clothing for women that hangs from the waist\",\"lesson\":9,\"pos\":\"n\",\"example\":{\"text\":\"She is wearing a long skirt and a white T-shirt.\",\"vi\":\"Cô ấy mặc chân váy dài và áo phông trắng.\"}},{\"id\":\"jumper|n\",\"term\":\"jumper\",\"reading\":\"/ˈdʒʌm.pə/\",\"meaning\":\"áo len chui đầu\",\"definitionEn\":\"a warm knitted top with long sleeves\",\"lesson\":9,\"pos\":\"n\",\"example\":{\"text\":\"In winter, I always wear a warm jumper and a coat.\",\"vi\":\"Mùa đông tôi luôn mặc áo len ấm và áo khoác.\"}},{\"id\":\"coat|n\",\"term\":\"coat\",\"reading\":\"/kəʊt/\",\"meaning\":\"áo khoác dài\",\"definitionEn\":\"a long warm piece of clothing worn outside\",\"lesson\":9,\"pos\":\"n\",\"example\":{\"text\":\"It's windy and cold today, so wear a coat.\",\"vi\":\"Hôm nay trời gió và lạnh, mặc áo khoác vào.\"}},{\"id\":\"casual|adj\",\"term\":\"casual\",\"reading\":\"/ˈkæʒ.ju.əl/\",\"meaning\":\"thường ngày; thoải mái (không trang trọng)\",\"definitionEn\":\"relaxed and informal, not for special occasions\",\"lesson\":9,\"pos\":\"adj\",\"hint\":\"Trọng âm: CA-su-al — Hay đi với: casual clothes · a casual look\",\"example\":{\"text\":\"I prefer casual clothes at the weekend.\",\"vi\":\"Cuối tuần tôi thích mặc đồ thường ngày hơn.\"}},{\"id\":\"traffic|n\",\"term\":\"traffic\",\"reading\":\"/ˈtræf.ɪk/\",\"meaning\":\"giao thông; xe cộ trên đường\",\"definitionEn\":\"the cars and other vehicles on a road\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: heavy traffic\",\"example\":{\"text\":\"The traffic is terrible today.\",\"vi\":\"Hôm nay giao thông tệ quá.\"}},{\"id\":\"traffic-jam|phr-n\",\"term\":\"traffic jam\",\"reading\":\"/ˈtræf.ɪk ˌdʒæm/\",\"meaning\":\"tắc đường\",\"definitionEn\":\"a long line of vehicles that cannot move\",\"lesson\":10,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: be stuck in a traffic jam\"},{\"id\":\"motorbike|n\",\"term\":\"motorbike\",\"reading\":\"/ˈməʊ.tə.baɪk/\",\"meaning\":\"xe máy\",\"definitionEn\":\"a two-wheeled vehicle with an engine\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: ride a motorbike\",\"example\":{\"text\":\"I go to work by motorbike.\",\"vi\":\"Tôi đi làm bằng xe máy.\"}},{\"id\":\"bicycle|n\",\"term\":\"bicycle\",\"reading\":\"/ˈbaɪ.sɪ.kəl/\",\"meaning\":\"xe đạp\",\"definitionEn\":\"a two-wheeled vehicle you ride by pushing pedals\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"BAI-si-kồ: c đầu đọc s, c cuối đọc k. — Hay đi với: ride a bicycle\",\"example\":{\"text\":\"My son rides his bicycle to school.\",\"vi\":\"Con trai tôi đạp xe đến trường.\"}},{\"id\":\"bus-stop|phr-n\",\"term\":\"bus stop\",\"reading\":\"/ˈbʌs ˌstɒp/\",\"meaning\":\"điểm dừng xe buýt\",\"definitionEn\":\"a place by the road where you wait to get on a public vehicle\",\"lesson\":10,\"pos\":\"phr-n\"},{\"id\":\"station|n\",\"term\":\"station\",\"reading\":\"/ˈsteɪ.ʃən/\",\"meaning\":\"nhà ga; trạm\",\"definitionEn\":\"a place where trains or buses stop\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: train station · bus station\",\"example\":{\"text\":\"Excuse me, where is the train station?\",\"vi\":\"Xin lỗi, ga tàu ở đâu ạ?\"}},{\"id\":\"airport|n\",\"term\":\"airport\",\"reading\":\"/ˈeə.pɔːt/\",\"meaning\":\"sân bay\",\"definitionEn\":\"a place where planes take off and land\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Trọng âm: AIR-port\",\"example\":{\"text\":\"It takes an hour to get to the airport.\",\"vi\":\"Ra sân bay mất một tiếng.\"}},{\"id\":\"passenger|n\",\"term\":\"passenger\",\"reading\":\"/ˈpæs.ən.dʒə/\",\"meaning\":\"hành khách\",\"definitionEn\":\"a person travelling in a vehicle but not driving it\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"PAS-in-jờ: g đọc j. — Trọng âm: PAS-sen-ger\"},{\"id\":\"driver|n\",\"term\":\"driver\",\"reading\":\"/ˈdraɪ.və/\",\"meaning\":\"tài xế; người lái xe\",\"definitionEn\":\"a person who drives a vehicle\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"The bus driver is very friendly.\",\"vi\":\"Bác tài xe buýt rất thân thiện.\"}},{\"id\":\"ticket|n\",\"term\":\"ticket\",\"reading\":\"/ˈtɪk.ɪt/\",\"meaning\":\"vé\",\"definitionEn\":\"a piece of paper that allows you to travel or enter\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: a bus ticket · a return ticket\",\"example\":{\"text\":\"How much is a ticket to Da Nang?\",\"vi\":\"Vé đi Đà Nẵng bao nhiêu tiền?\"}},{\"id\":\"journey|n\",\"term\":\"journey\",\"reading\":\"/ˈdʒɜː.ni/\",\"meaning\":\"chuyến đi; hành trình\",\"definitionEn\":\"travel from one place to another\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"JƠ-ni: ou đọc ơ.\",\"example\":{\"text\":\"The journey from Hanoi to Hai Phong takes about two hours.\",\"vi\":\"Đi từ Hà Nội đến Hải Phòng mất khoảng hai tiếng.\"}},{\"id\":\"get-on|phr-v\",\"term\":\"get on\",\"reading\":\"/ˌɡet ˈɒn/\",\"meaning\":\"lên (xe buýt, tàu, máy bay, xe máy)\",\"definitionEn\":\"to enter a bus, train or plane\",\"lesson\":10,\"pos\":\"phr-v\"},{\"id\":\"get-off|phr-v\",\"term\":\"get off\",\"reading\":\"/ˌɡet ˈɒf/\",\"meaning\":\"xuống (xe buýt, tàu, máy bay, xe máy)\",\"definitionEn\":\"to leave a bus, train or plane\",\"lesson\":10,\"pos\":\"phr-v\"},{\"id\":\"crowded|adj\",\"term\":\"crowded\",\"reading\":\"/ˈkraʊ.dɪd/\",\"meaning\":\"đông đúc; chật người\",\"definitionEn\":\"full of people\",\"lesson\":10,\"pos\":\"adj\",\"example\":{\"text\":\"The trains are very crowded at rush hour.\",\"vi\":\"Tàu rất đông vào giờ cao điểm.\"}},{\"id\":\"convenient|adj\",\"term\":\"convenient\",\"reading\":\"/kənˈviː.ni.ənt/\",\"meaning\":\"tiện lợi\",\"definitionEn\":\"easy to use and saving time\",\"lesson\":10,\"pos\":\"adj\",\"hint\":\"Trọng âm: con-VE-ni-ent\",\"example\":{\"text\":\"Online banking is very convenient for busy people.\",\"vi\":\"Ngân hàng trực tuyến rất tiện cho người bận rộn.\"}},{\"id\":\"public-transport|phr-n\",\"term\":\"public transport\",\"reading\":\"/ˌpʌb.lɪk ˈtræn.spɔːt/\",\"meaning\":\"phương tiện giao thông công cộng\",\"definitionEn\":\"buses and trains that everyone can use\",\"lesson\":10,\"pos\":\"phr-n\"},{\"id\":\"rush-hour|phr-n\",\"term\":\"rush hour\",\"reading\":\"/ˈrʌʃ ˌaʊə/\",\"meaning\":\"giờ cao điểm\",\"definitionEn\":\"the busy time when people travel to and from work\",\"lesson\":10,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: at rush hour · in the rush hour\"},{\"id\":\"helmet|n\",\"term\":\"helmet\",\"reading\":\"/ˈhel.mət/\",\"meaning\":\"mũ bảo hiểm\",\"definitionEn\":\"a hard hat that protects your head\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: wear a helmet\",\"example\":{\"text\":\"Please wear a helmet on your motorbike.\",\"vi\":\"Hãy đội mũ bảo hiểm khi đi xe máy.\"}},{\"id\":\"on-foot|idiom\",\"term\":\"on foot\",\"reading\":\"/ɒn ˈfʊt/\",\"meaning\":\"đi bộ\",\"definitionEn\":\"by walking\",\"lesson\":10,\"pos\":\"idiom\"},{\"id\":\"commute|v\",\"term\":\"commute\",\"reading\":\"/kəˈmjuːt/\",\"meaning\":\"đi lại hằng ngày (giữa nhà và nơi làm)\",\"definitionEn\":\"to travel regularly between home and work\",\"lesson\":10,\"pos\":\"v\",\"example\":{\"text\":\"I commute to work every day. It takes forty minutes.\",\"vi\":\"Ngày nào tôi cũng đi làm, mất bốn mươi phút.\"}},{\"id\":\"north|n\",\"term\":\"north\",\"reading\":\"/nɔːθ/\",\"meaning\":\"phía bắc; hướng bắc\",\"definitionEn\":\"the direction towards the top of a map\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: in the north of Vietnam\",\"example\":{\"text\":\"The tennis courts are in the north of the park.\",\"vi\":\"Các sân tennis nằm ở phía bắc công viên.\"}},{\"id\":\"south|n\",\"term\":\"south\",\"reading\":\"/saʊθ/\",\"meaning\":\"phía nam; hướng nam\",\"definitionEn\":\"the direction towards the bottom of a map\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"Many birds fly south in autumn.\",\"vi\":\"Nhiều loài chim bay về phương nam vào mùa thu.\"}},{\"id\":\"east|n\",\"term\":\"east\",\"reading\":\"/iːst/\",\"meaning\":\"phía đông; hướng đông\",\"definitionEn\":\"the direction where the sun rises\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"The sun rises in the east and sets in the west.\",\"vi\":\"Mặt trời mọc ở đằng đông và lặn ở đằng tây.\"}},{\"id\":\"west|n\",\"term\":\"west\",\"reading\":\"/west/\",\"meaning\":\"phía tây; hướng tây\",\"definitionEn\":\"the direction where the sun sets\",\"lesson\":10,\"pos\":\"n\",\"example\":{\"text\":\"The sun rises in the east and sets in the west.\",\"vi\":\"Mặt trời mọc ở đằng đông và lặn ở đằng tây.\"}},{\"id\":\"map|n\",\"term\":\"map\",\"reading\":\"/mæp/\",\"meaning\":\"bản đồ\",\"definitionEn\":\"a drawing that shows roads, towns and places\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: look at the map · a map app\",\"example\":{\"text\":\"I often look at the map on my phone.\",\"vi\":\"Tôi hay xem bản đồ trên điện thoại.\"}},{\"id\":\"corner|n\",\"term\":\"corner\",\"reading\":\"/ˈkɔː.nə/\",\"meaning\":\"góc (phố, phòng)\",\"definitionEn\":\"the point where two streets or walls meet\",\"lesson\":10,\"pos\":\"n\",\"hint\":\"Hay đi với: on the corner · at the corner of the street\",\"example\":{\"text\":\"You go straight on and turn left at the corner.\",\"vi\":\"Bạn đi thẳng rồi rẽ trái ở góc phố.\"}},{\"id\":\"turn-left|colloc\",\"term\":\"turn left\",\"reading\":\"/ˌtɜːn ˈleft/\",\"meaning\":\"rẽ trái\",\"definitionEn\":\"to change direction to the side opposite your right hand\",\"lesson\":10,\"pos\":\"colloc\"},{\"id\":\"turn-right|colloc\",\"term\":\"turn right\",\"reading\":\"/ˌtɜːn ˈraɪt/\",\"meaning\":\"rẽ phải\",\"definitionEn\":\"to change direction to the side opposite your left hand\",\"lesson\":10,\"pos\":\"colloc\"},{\"id\":\"go-straight-on|colloc\",\"term\":\"go straight on\",\"reading\":\"/ˌɡəʊ ˈstreɪt ɒn/\",\"meaning\":\"đi thẳng\",\"definitionEn\":\"to continue ahead without turning\",\"lesson\":10,\"pos\":\"colloc\"},{\"id\":\"along|prep\",\"term\":\"along\",\"reading\":\"/əˈlɒŋ/\",\"meaning\":\"dọc theo\",\"definitionEn\":\"from one end towards the other end of a road or river\",\"lesson\":10,\"pos\":\"prep\",\"hint\":\"Hay đi với: walk along the river\",\"example\":{\"text\":\"We walk along the river and go across the bridge.\",\"vi\":\"Chúng tôi đi bộ dọc bờ sông rồi băng qua cầu.\"}},{\"id\":\"across|prep\",\"term\":\"across\",\"reading\":\"/əˈkrɒs/\",\"meaning\":\"băng qua; sang bên kia\",\"definitionEn\":\"from one side to the other side of something\",\"lesson\":10,\"pos\":\"prep\",\"hint\":\"Hay đi với: go across the bridge · across the road\",\"example\":{\"text\":\"We walk along the river and go across the bridge.\",\"vi\":\"Chúng tôi đi bộ dọc bờ sông rồi băng qua cầu.\"}},{\"id\":\"through|prep\",\"term\":\"through\",\"reading\":\"/θruː/\",\"meaning\":\"xuyên qua; đi qua (bên trong)\",\"definitionEn\":\"into one side and out of the other side\",\"lesson\":10,\"pos\":\"prep\",\"hint\":\"ough đọc “ú”: thru. — Hay đi với: through the park · through the gate\",\"example\":{\"text\":\"The bus goes through the city centre.\",\"vi\":\"Xe buýt chạy xuyên qua trung tâm thành phố.\"}},{\"id\":\"catch|v\",\"term\":\"catch\",\"reading\":\"/kætʃ/\",\"meaning\":\"bắt (xe); đón (xe)\",\"definitionEn\":\"to get on a bus or train in time\",\"lesson\":10,\"pos\":\"v\",\"hint\":\"Hay đi với: catch the bus · catch a train\",\"example\":{\"text\":\"Many people catch a cold in winter.\",\"vi\":\"Nhiều người bị cảm lạnh vào mùa đông.\"}},{\"id\":\"pick-up|phr-v\",\"term\":\"pick up\",\"reading\":\"/ˌpɪk ˈʌp/\",\"meaning\":\"đón (ai đó)\",\"definitionEn\":\"to collect someone in a car\",\"lesson\":10,\"pos\":\"phr-v\",\"hint\":\"Hay đi với: pick somebody up from school\"},{\"id\":\"weather|n\",\"term\":\"weather\",\"reading\":\"/ˈweð.ə/\",\"meaning\":\"thời tiết\",\"definitionEn\":\"conditions such as sun, rain and wind\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Thời tiết: có chữ a và e, khác với whether (liệu rằng).\",\"example\":{\"text\":\"It depends on the weather.\",\"vi\":\"Còn tùy vào thời tiết.\"}},{\"id\":\"season|n\",\"term\":\"season\",\"reading\":\"/ˈsiː.zən/\",\"meaning\":\"mùa\",\"definitionEn\":\"one of the four parts of the year, e.g. summer\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Hay đi với: rainy season · dry season\",\"example\":{\"text\":\"Autumn is my favourite season in Hanoi.\",\"vi\":\"Mùa thu là mùa tôi thích nhất ở Hà Nội.\"}},{\"id\":\"sunny|adj\",\"term\":\"sunny\",\"reading\":\"/ˈsʌn.i/\",\"meaning\":\"nắng\",\"definitionEn\":\"with a lot of bright light from the sun\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"I think it will be sunny tomorrow.\",\"vi\":\"Tôi nghĩ mai trời sẽ nắng.\"}},{\"id\":\"cloudy|adj\",\"term\":\"cloudy\",\"reading\":\"/ˈklaʊ.di/\",\"meaning\":\"nhiều mây; âm u\",\"definitionEn\":\"with a lot of grey or white clouds in the sky\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's cloudy and windy this afternoon.\",\"vi\":\"Chiều nay trời nhiều mây và gió.\"}},{\"id\":\"rainy|adj\",\"term\":\"rainy\",\"reading\":\"/ˈreɪ.ni/\",\"meaning\":\"có mưa; mưa nhiều\",\"definitionEn\":\"with a lot of water falling from the sky\",\"lesson\":11,\"pos\":\"adj\",\"hint\":\"Hay đi với: rainy season · a rainy day\",\"example\":{\"text\":\"Farmers are worried about the rainy season.\",\"vi\":\"Nông dân lo lắng về mùa mưa.\"}},{\"id\":\"windy|adj\",\"term\":\"windy\",\"reading\":\"/ˈwɪn.di/\",\"meaning\":\"nhiều gió; lộng gió\",\"definitionEn\":\"with a lot of moving air\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's cloudy and windy this afternoon.\",\"vi\":\"Chiều nay trời nhiều mây và gió.\"}},{\"id\":\"humid|adj\",\"term\":\"humid\",\"reading\":\"/ˈhjuː.mɪd/\",\"meaning\":\"ẩm; oi ẩm\",\"definitionEn\":\"warm and wet, so the air feels heavy\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's sunny today, but it's very humid.\",\"vi\":\"Hôm nay trời nắng nhưng rất oi ẩm.\"}},{\"id\":\"freezing|adj\",\"term\":\"freezing\",\"reading\":\"/ˈfriː.zɪŋ/\",\"meaning\":\"lạnh cóng; rét buốt\",\"definitionEn\":\"extremely cold\",\"lesson\":11,\"pos\":\"adj\",\"example\":{\"text\":\"It's freezing outside, so wear a warm coat.\",\"vi\":\"Ngoài trời lạnh cóng, mặc áo khoác ấm vào.\"}},{\"id\":\"temperature|n\",\"term\":\"temperature\",\"reading\":\"/ˈtem.prə.tʃə/\",\"meaning\":\"nhiệt độ\",\"definitionEn\":\"how hot or cold something is\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"TEM-prờ-chờ: chỉ 3 âm tiết. — Trọng âm: TEM-pra-ture — Hay đi với: high temperature · low temperature\",\"example\":{\"text\":\"In winter, the temperature in Sa Pa is sometimes below zero degrees.\",\"vi\":\"Mùa đông, nhiệt độ ở Sa Pa đôi khi dưới không độ.\"}},{\"id\":\"degree|n\",\"term\":\"degree\",\"reading\":\"/dɪˈɡriː/\",\"meaning\":\"độ (nhiệt độ); bằng (đại học), học vị\",\"definitionEn\":\"a unit for measuring heat; also a university qualification\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Trọng âm: de-GREE — Hay đi với: 35 degrees · a degree in business\",\"example\":{\"text\":\"She has a degree in business from a university in Hanoi.\",\"vi\":\"Cô ấy có bằng cử nhân kinh doanh của một trường đại học ở Hà Nội.\"}},{\"id\":\"forecast|n\",\"term\":\"forecast\",\"reading\":\"/ˈfɔː.kɑːst/\",\"meaning\":\"dự báo\",\"definitionEn\":\"a statement about what will happen, especially the weather\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Trọng âm: FORE-cast — Hay đi với: weather forecast\",\"example\":{\"text\":\"My father is interested in the weather forecast.\",\"vi\":\"Bố tôi quan tâm đến dự báo thời tiết.\"}},{\"id\":\"storm|n\",\"term\":\"storm\",\"reading\":\"/stɔːm/\",\"meaning\":\"cơn bão; giông\",\"definitionEn\":\"very bad weather with strong wind and rain\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"autumn|n\",\"term\":\"autumn\",\"reading\":\"/ˈɔː.təm/\",\"meaning\":\"mùa thu\",\"definitionEn\":\"the season between summer and winter\",\"lesson\":11,\"pos\":\"n\",\"example\":{\"text\":\"Many birds fly south in autumn.\",\"vi\":\"Nhiều loài chim bay về phương nam vào mùa thu.\"}},{\"id\":\"winter|n\",\"term\":\"winter\",\"reading\":\"/ˈwɪn.tə/\",\"meaning\":\"mùa đông\",\"definitionEn\":\"the coldest season of the year\",\"lesson\":11,\"pos\":\"n\",\"hint\":\"Hay đi với: in winter\",\"example\":{\"text\":\"Many people catch a cold in winter.\",\"vi\":\"Nhiều người bị cảm lạnh vào mùa đông.\"}},{\"id\":\"afraid-of|colloc\",\"term\":\"afraid of\",\"reading\":\"/əˈfreɪd əv/\",\"meaning\":\"sợ (cái gì)\",\"definitionEn\":\"frightened by something\",\"lesson\":11,\"pos\":\"colloc\"},{\"id\":\"interested-in|colloc\",\"term\":\"interested in\",\"reading\":\"/ˈɪn.trəs.tɪd ɪn/\",\"meaning\":\"quan tâm; thích thú (cái gì)\",\"definitionEn\":\"wanting to know more about something\",\"lesson\":11,\"pos\":\"colloc\"},{\"id\":\"good-at|colloc\",\"term\":\"good at\",\"reading\":\"/ˈɡʊd ət/\",\"meaning\":\"giỏi (về việc gì)\",\"definitionEn\":\"able to do something well\",\"lesson\":11,\"pos\":\"colloc\"},{\"id\":\"worried-about|colloc\",\"term\":\"worried about\",\"reading\":\"/ˈwʌr.id əˌbaʊt/\",\"meaning\":\"lo lắng về\",\"definitionEn\":\"thinking about a problem and feeling anxious\",\"lesson\":11,\"pos\":\"colloc\"},{\"id\":\"famous-for|colloc\",\"term\":\"famous for\",\"reading\":\"/ˈfeɪ.məs fə/\",\"meaning\":\"nổi tiếng về\",\"definitionEn\":\"known by many people because of something\",\"lesson\":11,\"pos\":\"colloc\",\"hint\":\"Hay đi với: Da Lat is famous for its cool weather\"},{\"i  creature with eight legs that makes webs\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"dolphin|n\",\"term\":\"dolphin\",\"reading\":\"/ˈdɒl.fɪn/\",\"meaning\":\"cá heo\",\"definitionEn\":\"a clever sea animal that looks like a large fish\",\"lesson\":11,\"pos\":\"n\"},{\"id\":\"rabbit|n\",\"term\":\"rabbit\",\"reading\":\"/ˈræb.ɪt/\",\"meaning\":\"con thỏ\",\"definitionEn\":\"a small animal with long ears\",\"lesson\":11,\"pos\":\"n\",\"example\":{\"text\":\"My son has a white rabbit.\",\"vi\":\"Con trai tôi nuôi một con thỏ trắng.\"}},{\"id\":\"health|n\",\"term\":\"health\",\"reading\":\"/helθ/\",\"meaning\":\"sức khỏe\",\"definitionEn\":\"the condition of your body and mind\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: good health · mental health\",\"example\":{\"text\":\"Eating vegetables is good for your health.\",\"vi\":\"Ăn rau tốt cho sức khỏe.\"}},{\"id\":\"healthy|adj\",\"term\":\"healthy\",\"reading\":\"/ˈhel.θi/\",\"meaning\":\"khỏe mạnh; tốt cho sức khỏe\",\"definitionEn\":\"well and strong; good for your body\",\"lesson\":12,\"pos\":\"adj\",\"hint\":\"HEL-thi: gốc “health”. — Hay đi với: healthy food · a healthy lifestyle\",\"example\":{\"text\":\"A healthy diet has a lot of fruit and vegetables.\",\"vi\":\"Một chế độ ăn lành mạnh có nhiều rau quả.\"}},{\"id\":\"ill|adj\",\"term\":\"ill\",\"reading\":\"/ɪl/\",\"meaning\":\"ốm; bệnh\",\"definitionEn\":\"not well; sick\",\"lesson\":12,\"pos\":\"adj\",\"example\":{\"text\":\"She is ill, so she doesn't go to work today.\",\"vi\":\"Cô ấy bị ốm nên hôm nay không đi làm.\"}},{\"id\":\"headache|n\",\"term\":\"headache\",\"reading\":\"/ˈhed.eɪk/\",\"meaning\":\"đau đầu\",\"definitionEn\":\"a pain in your head\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"HED-eik: head + ache. — Trọng âm: HEAD-ache\",\"example\":{\"text\":\"I have a headache and a bad cough.\",\"vi\":\"Tôi bị đau đầu và ho nhiều.\"}},{\"id\":\"stomachache|n\",\"term\":\"stomachache\",\"reading\":\"/ˈstʌm.ək.eɪk/\",\"meaning\":\"đau bụng\",\"definitionEn\":\"a pain in your stomach\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"I have a stomachache after lunch.\",\"vi\":\"Tôi bị đau bụng sau bữa trưa.\"}},{\"id\":\"sore-throat|phr-n\",\"term\":\"sore throat\",\"reading\":\"/ˌsɔː ˈθrəʊt/\",\"meaning\":\"đau họng\",\"definitionEn\":\"pain at the back of your mouth when you swallow\",\"lesson\":12,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: have a sore throat\"},{\"id\":\"fever|n\",\"term\":\"fever\",\"reading\":\"/ˈfiː.və/\",\"meaning\":\"sốt\",\"definitionEn\":\"a body temperature that is higher than normal\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a fever · a high fever\",\"example\":{\"text\":\"You have a fever. You should get some rest.\",\"vi\":\"Bạn bị sốt rồi. Bạn nên nghỉ ngơi.\"}},{\"id\":\"cough|n\",\"term\":\"cough\",\"reading\":\"/kɒf/\",\"meaning\":\"ho; cơn ho\",\"definitionEn\":\"a sudden noisy push of air from your throat\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a cough · a bad cough\",\"example\":{\"text\":\"I have a headache and a bad cough.\",\"vi\":\"Tôi bị đau đầu và ho nhiều.\"}},{\"id\":\"cold|n\",\"term\":\"cold\",\"reading\":\"/kəʊld/\",\"meaning\":\"cảm lạnh\",\"definitionEn\":\"a common illness that gives you a runny nose\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have a cold · catch a cold\",\"example\":{\"text\":\"Many people catch a cold in winter.\",\"vi\":\"Nhiều người bị cảm lạnh vào mùa đông.\"}},{\"id\":\"flu|n\",\"term\":\"flu\",\"reading\":\"/fluː/\",\"meaning\":\"cúm\",\"definitionEn\":\"an illness like a bad cold, with fever and aches\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: have the flu\",\"example\":{\"text\":\"He has the flu and must stay at home.\",\"vi\":\"Anh ấy bị cúm và phải ở nhà.\"}},{\"id\":\"medicine|n\",\"term\":\"medicine\",\"reading\":\"/ˈmed.ɪ.sən/\",\"meaning\":\"thuốc\",\"definitionEn\":\"something you take to treat an illness\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"MED-sin: chỉ 2 âm tiết. — Trọng âm: ME-di-cine — Hay đi với: take medicine\",\"example\":{\"text\":\"Take this medicine twice a day after meals.\",\"vi\":\"Uống thuốc này hai lần một ngày sau bữa ăn.\"}},{\"id\":\"pharmacy|n\",\"term\":\"pharmacy\",\"reading\":\"/ˈfɑː.mə.si/\",\"meaning\":\"hiệu thuốc\",\"definitionEn\":\"a shop where you can buy medicine\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"FAR-mờ-si: ph đọc f. — Trọng âm: PHAR-ma-cy\",\"example\":{\"text\":\"You have a fever. Let's go to the pharmacy.\",\"vi\":\"Bạn bị sốt rồi. Mình ra hiệu thuốc đi.\"}},{\"id\":\"appointment|n\",\"term\":\"appointment\",\"reading\":\"/əˈpɔɪnt.mənt/\",\"meaning\":\"cuộc hẹn (bác sĩ, công việc)\",\"definitionEn\":\"an arranged time to meet someone, e.g. a doctor\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Trọng âm: ap-POINT-ment — Hay đi với: make an appointment · a doctor's appointment\",\"example\":{\"text\":\"You don't have to make an appointment at this pharmacy.\",\"vi\":\"Bạn không cần đặt hẹn ở hiệu thuốc này.\"}},{\"id\":\"exercise|v\",\"term\":\"exercise\",\"reading\":\"/ˈek.sə.saɪz/\",\"meaning\":\"tập thể dục\",\"definitionEn\":\"to move your body to stay fit\",\"lesson\":12,\"pos\":\"v\",\"hint\":\"Trọng âm: EX-er-cise — Hay đi với: exercise regularly\",\"example\":{\"text\":\"This exercise is confusing. I'm confused.\",\"vi\":\"Bài tập này khó hiểu quá. Tôi rối rồi.\"}},{\"id\":\"diet|n\",\"term\":\"diet\",\"reading\":\"/ˈdaɪ.ət/\",\"meaning\":\"chế độ ăn\",\"definitionEn\":\"the kind of food you usually eat\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: a healthy diet · go on a diet\",\"example\":{\"text\":\"A healthy diet has a lot of fruit and vegetables.\",\"vi\":\"Một chế độ ăn lành mạnh có nhiều rau quả.\"}},{\"id\":\"pain|n\",\"term\":\"pain\",\"reading\":\"/peɪn/\",\"meaning\":\"cơn đau; sự đau\",\"definitionEn\":\"the feeling you have when part of your body hurts\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: back pain · in pain\",\"example\":{\"text\":\"My father often has back pain.\",\"vi\":\"Bố tôi hay bị đau lưng.\"}},{\"id\":\"rest|n\",\"term\":\"rest\",\"reading\":\"/rest/\",\"meaning\":\"sự nghỉ ngơi\",\"definitionEn\":\"a time when you relax or sleep\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: get some rest · have a rest\",\"example\":{\"text\":\"Don't stay up late. Get some rest.\",\"vi\":\"Đừng thức khuya. Nghỉ ngơi đi.\"}},{\"id\":\"should|v\",\"term\":\"should\",\"reading\":\"/ʃʊd/\",\"meaning\":\"nên\",\"definitionEn\":\"used to give advice\",\"lesson\":12,\"pos\":\"v\",\"example\":{\"text\":\"You should brush your teeth twice a day.\",\"vi\":\"Bạn nên đánh răng hai lần một ngày.\"}},{\"id\":\"have-to|v\",\"term\":\"have to\",\"reading\":\"/ˈhæv tə/\",\"meaning\":\"phải (do hoàn cảnh, quy định)\",\"definitionEn\":\"to be forced to do something by rules or situation\",\"lesson\":12,\"pos\":\"v\"},{\"id\":\"head|n\",\"term\":\"head\",\"reading\":\"/hed/\",\"meaning\":\"cái đầu\",\"definitionEn\":\"the top part of your body, above your neck\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My head hurts and my nose is red.\",\"vi\":\"Tôi nhức đầu và mũi thì đỏ.\"}},{\"id\":\"face|n\",\"term\":\"face\",\"reading\":\"/feɪs/\",\"meaning\":\"khuôn mặt\",\"definitionEn\":\"the front of your head\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"She has a round face and big brown eyes.\",\"vi\":\"Cô ấy có khuôn mặt tròn và đôi mắt nâu to.\"}},{\"id\":\"eye|n\",\"term\":\"eye\",\"reading\":\"/aɪ/\",\"meaning\":\"mắt\",\"definitionEn\":\"the part of your body you see with\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"ear|n\",\"term\":\"ear\",\"reading\":\"/ɪə/\",\"meaning\":\"tai\",\"definitionEn\":\"the part of your body you hear with\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"nose|n\",\"term\":\"nose\",\"reading\":\"/nəʊz/\",\"meaning\":\"mũi\",\"definitionEn\":\"the part of your face you smell with\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My head hurts and my nose is red.\",\"vi\":\"Tôi nhức đầu và mũi thì đỏ.\"}},{\"id\":\"mouth|n\",\"term\":\"mouth\",\"reading\":\"/maʊθ/\",\"meaning\":\"miệng\",\"definitionEn\":\"the part of your face you eat and speak with\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"Open your mouth, please. I want to look at your throat.\",\"vi\":\"Hãy há miệng ra. Tôi muốn khám họng của bạn.\"}},{\"id\":\"tooth|n\",\"term\":\"tooth\",\"reading\":\"/tuːθ/\",\"meaning\":\"răng\",\"definitionEn\":\"one of the hard white things in your mouth\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"neck|n\",\"term\":\"neck\",\"reading\":\"/nek/\",\"meaning\":\"cổ\",\"definitionEn\":\"the part between your head and shoulders\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My neck hurts after a long day on the computer.\",\"vi\":\"Cổ tôi đau sau một ngày dài ngồi máy tính.\"}},{\"id\":\"shoulder|n\",\"term\":\"shoulder\",\"reading\":\"/ˈʃəʊl.də/\",\"meaning\":\"vai\",\"definitionEn\":\"the part of your body where your arm joins it\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"arm|n\",\"term\":\"arm\",\"reading\":\"/ɑːm/\",\"meaning\":\"cánh tay\",\"definitionEn\":\"the long part of your body from shoulder to hand\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: a broken arm\",\"example\":{\"text\":\"My brother fell off his bike and broke his arm.\",\"vi\":\"Em trai tôi ngã xe đạp và bị gãy tay.\"}},{\"id\":\"hand|n\",\"term\":\"hand\",\"reading\":\"/hænd/\",\"meaning\":\"bàn tay\",\"definitionEn\":\"the part at the end of your arm with five fingers\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: wash your hands\",\"example\":{\"text\":\"I splashed out on a new laptop, and now I'm buying second-hand clothes to save money.\",\"vi\":\"Tôi đã chi mạnh tay mua laptop mới, và giờ tôi mua quần áo cũ để tiết kiệm.\"}},{\"id\":\"finger|n\",\"term\":\"finger\",\"reading\":\"/ˈfɪŋ.ɡə/\",\"meaning\":\"ngón tay\",\"definitionEn\":\"one of the five long parts of your hand\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"back|n\",\"term\":\"back\",\"reading\":\"/bæk/\",\"meaning\":\"lưng\",\"definitionEn\":\"the part of your body behind you, from neck to bottom\",\"lesson\":12,\"pos\":\"n\",\"hint\":\"Hay đi với: back pain\",\"example\":{\"text\":\"My father often has back pain.\",\"vi\":\"Bố tôi hay bị đau lưng.\"}},{\"id\":\"leg|n\",\"term\":\"leg\",\"reading\":\"/leɡ/\",\"meaning\":\"chân (cả cẳng chân)\",\"definitionEn\":\"the part of your body you stand and walk on\",\"lesson\":12,\"pos\":\"n\"},{\"id\":\"knee|n\",\"term\":\"knee\",\"reading\":\"/niː/\",\"meaning\":\"đầu gối\",\"definitionEn\":\"the joint in the middle of your leg\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"He has had a knee injury since last month.\",\"vi\":\"Anh ấy bị chấn thương đầu gối từ tháng trước.\"}},{\"id\":\"foot|n\",\"term\":\"foot\",\"reading\":\"/fʊt/\",\"meaning\":\"bàn chân\",\"definitionEn\":\"the part at the end of your leg that you stand on\",\"lesson\":12,\"pos\":\"n\",\"example\":{\"text\":\"My sister goes to school on foot.\",\"vi\":\"Em gái tôi đi bộ đến trường.\"}},{\"id\":\"trip|n\",\"term\":\"trip\",\"reading\":\"/trɪp/\",\"meaning\":\"chuyến đi\",\"definitionEn\":\"a journey to a place and back again\",\"lesson\":13,\"pos\":\"n\",\"hint\":\"Hay đi với: a business trip · a day trip\",\"example\":{\"text\":\"It was a short trip, but we enjoyed it.\",\"vi\":\"Đó là một chuyến đi ngắn, nhưng chúng tôi rất thích.\"}},{\"id\":\"travel|v\",\"term\":\"travel\",\"reading\":\"/ˈtræv.əl/\",\"meaning\":\"đi du lịch; di chuyển\",\"definitionEn\":\"to go from one place to another, often far away\",\"lesson\":13,\"pos\":\"v\",\"example\":{\"text\":\"We usually travel to Hue by train.\",\"vi\":\"Chúng tôi thường đi Huế bằng tàu hỏa.\"}},{\"id\":\"visit|v\",\"term\":\"visit\",\"reading\":\"/ˈvɪz.ɪt/\",\"meaning\":\"thăm; tham quan\",\"definitionEn\":\"to go to see a person or place\",\"lesson\":13,\"pos\":\"v\",\"hint\":\"Trọng âm: VI-sit\",\"example\":{\"text\":\"My cousins often visit us at Tet.\",\"vi\":\"Các anh chị em họ thường đến thăm nhà "We didn't go sightseeing because it rained all day.\",\"vi\":\"Chúng tôi không đi ngắm cảnh vì trời mưa cả ngày.\"}},{\"id\":\"beach|n\",\"term\":\"beach\",\"reading\":\"/biːtʃ/\",\"meaning\":\"bãi biển\",\"definitionEn\":\"an area of sand next to the sea\",\"lesson\":13,\"pos\":\"n\",\"hint\":\"Hay đi với: on the beach\",\"example\":{\"text\":\"I joined a beach clean-up two years ago.\",\"vi\":\"Hai năm trước tôi đã tham gia một buổi dọn rác bãi biển.\"}},{\"id\":\"museum|n\",\"term\":\"museum\",\"reading\":\"/mjuːˈziː.əm/\",\"meaning\":\"bảo tàng\",\"definitionEn\":\"a building where old or interesting objects are shown\",\"lesson\":13,\"pos\":\"n\",\"hint\":\"Trọng âm: mu-SE-um\",\"example\":{\"text\":\"The museum is free on Sundays.\",\"vi\":\"Bảo tàng miễn phí vào Chủ nhật.\"}},{\"id\":\"arrive|v\",\"term\":\"arrive\",\"reading\":\"/əˈraɪv/\",\"meaning\":\"đến nơi\",\"definitionEn\":\"to reach a place\",\"lesson\":13,\"pos\":\"v\"},{\"id\":\"stay|v\",\"term\":\"stay\",\"reading\":\"/steɪ/\",\"meaning\":\"ở lại; lưu trú\",\"definitionEn\":\"to live somewhere for a short time\",\"lesson\":13,\"pos\":\"v\",\"hint\":\"Hay đi với: stay at a hotel · stay with friends\",\"example\":{\"text\":\"Don't stay up late. Get some rest.\",\"vi\":\"Đừng thức khuya. Nghỉ ngơi đi.\"}},{\"id\":\"souvenir|n\",\"term\":\"souvenir\",\"reading\":\"/ˌsuː.vənˈɪə/\",\"meaning\":\"quà lưu niệm\",\"definitionEn\":\"something you buy to remember a place\",\"lesson\":13,\"pos\":\"n\",\"hint\":\"su-vờ-NIR: nhấn âm cuối. — Trọng âm: sou-ve-NIR\",\"example\":{\"text\":\"She looked for a souvenir for her mother.\",\"vi\":\"Cô ấy tìm một món quà lưu niệm cho mẹ.\"}},{\"id\":\"flight|n\",\"term\":\"flight\",\"reading\":\"/flaɪt/\",\"meaning\":\"chuyến bay\",\"definitionEn\":\"a journey by plane\",\"lesson\":13,\"pos\":\"n\",\"hint\":\"Hay đi với: book a flight · a long flight\",\"example\":{\"text\":\"Our flight arrived in Hanoi two hours ago.\",\"vi\":\"Chuyến bay của chúng tôi đã hạ cánh ở Hà N "lesson\":14,\"pos\":\"adv\",\"example\":{\"text\":\"Suddenly, the lights went out.\",\"vi\":\"Đột nhiên đèn tắt phụt.\"}},{\"id\":\"while|conj\",\"term\":\"while\",\"reading\":\"/waɪl/\",\"meaning\":\"trong khi\",\"definitionEn\":\"during the time that\",\"lesson\":14,\"pos\":\"conj\",\"example\":{\"text\":\"While I was riding to work, I saw an accident.\",\"vi\":\"Trong lúc đang đi xe đến chỗ làm, tôi thấy một vụ tai nạn.\"}},{\"id\":\"meet|v\",\"term\":\"meet\",\"reading\":\"/miːt/\",\"meaning\":\"gặp\",\"definitionEn\":\"to see and talk to someone, for the first time or by arrangement\",\"lesson\":14,\"pos\":\"v\"},{\"id\":\"lose|v\",\"term\":\"lose\",\"reading\":\"/luːz/\",\"meaning\":\"làm mất; thua\",\"definitionEn\":\"to be unable to find something; or to not win\",\"lesson\":14,\"pos\":\"v\",\"example\":{\"text\":\"The festival would lose its meaning if it became just a show for tourists.\",\"vi\":\"Lễ hội sẽ mất đi ý nghĩa nếu nó chỉ còn là một màn trình diễn cho khách du lịch.\"}},{\"id\":\"find|v\",\"term\":\"find\",\"reading\":\"/faɪnd/\",\"meaning\":\"tìm thấy\",\"definitionEn\":\"to discover something you were looking for\",\"lesson\":14,\"pos\":\"v\",\"example\":{\"text\":\"I hope I'll find a good job soon.\",\"vi\":\"Tôi hy vọng sẽ sớm tìm được việc tốt.\"}},{\"id\":\"break|v\",\"term\":\"break\",\"reading\":\"/breɪk/\",\"meaning\":\"làm vỡ; gãy\",\"definitionEn\":\"to make something separate into pieces\",\"lesson\":14,\"pos\":\"v\",\"hint\":\"Hay đi với: break a leg · break a phone\",\"example\":\"$0:f:0:1:1:children:1:children:1:children:0:props:children:0:props:children:1:props:words:154:example\"},{\"id\":\"fall|v\",\"term\":\"fall\",\"reading\":\"/fɔːl/\",\"meaning\":\"ngã; rơi\",\"definitionEn\":\"to drop down towards the ground\",\"lesson\":14,\"pos\":\"v\",\"hint\":\"Hay đi với: fall off a bike · fall down\",\"example\":{\"text\":\"The introduction of stricter legislation led to a fall in pollution.\",\"vi\":\"Việc ban hành luật chặt chẽ hơ initionEn\":\"after that; next\",\"lesson\":14,\"pos\":\"adv\",\"example\":{\"text\":\"He read the letter carefully and then smiled.\",\"vi\":\"Anh ấy đọc lá thư thật kỹ rồi mỉm cười.\"}},{\"id\":\"at-first|colloc\",\"term\":\"at first\",\"reading\":\"/ət ˈfɜːst/\",\"meaning\":\"lúc đầu (sau đó thì khác)\",\"definitionEn\":\"at the beginning, before things changed\",\"lesson\":14,\"pos\":\"colloc\"},{\"id\":\"give|v\",\"term\":\"give\",\"reading\":\"/ɡɪv/\",\"meaning\":\"đưa; tặng\",\"definitionEn\":\"to hand something to someone\",\"lesson\":14,\"pos\":\"v\",\"hint\":\"Hay đi với: give somebody something · give something to somebody\",\"example\":{\"text\":\"You can agree or disagree, but you must give clear reasons.\",\"vi\":\"Bạn có thể đồng ý hoặc phản đối, nhưng phải đưa ra lý do rõ ràng.\"}},{\"id\":\"send|v\",\"term\":\"send\",\"reading\":\"/send/\",\"meaning\":\"gửi\",\"definitionEn\":\"to make a letter or message go to someone\",\"lesson\":14,\"pos\":\"v\",\"hint\":\"Hay đi với: send somebody a message · send an email\"},{\"id\":\"buy|v\",\"term\":\"buy\",\"reading\":\"/baɪ/\",\"meaning\":\"mua\",\"definitionEn\":\"to get something by paying money\",\"lesson\":14,\"pos\":\"v\",\"example\":{\"text\":\"I buy a packet of biscuits every week.\",\"vi\":\"Tuần nào tôi cũng mua một gói bánh quy.\"}},{\"id\":\"lend|v\",\"term\":\"lend\",\"reading\":\"/lend/\",\"meaning\":\"cho mượn\",\"definitionEn\":\"to let someone use something that they will return\",\"lesson\":14,\"pos\":\"v\",\"example\":{\"text\":\"Could you lend me your umbrella? It's raining.\",\"vi\":\"Bạn cho mình mượn ô được không? Trời đang mưa.\"}},{\"id\":\"show|v\",\"term\":\"show\",\"reading\":\"/ʃəʊ/\",\"meaning\":\"cho xem; chỉ\",\"definitionEn\":\"to let someone see something\",\"lesson\":14,\"pos\":\"v\",\"hint\":\"Hay đi với: show somebody the way\",\"example\":{\"text\":\"Some algorithms appear to show a bias against women.\",\"vi\":\"Một số thuật toán dường như thể hiện sự thiên lệch với phụ t tấm bằng tốt có thể giúp bạn tìm được việc tốt hơn.\"}},{\"id\":\"knowledge|n\",\"term\":\"knowledge\",\"reading\":\"/ˈnɒl.ɪdʒ/\",\"meaning\":\"kiến thức; hiểu biết\",\"definitionEn\":\"information and understanding you have\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Chữ k câm: NOL-ij. — Trọng âm: KNOW-ledge — Hay đi với: gain knowledge · knowledge of history\",\"example\":{\"text\":\"You can gain a lot of knowledge from books.\",\"vi\":\"Bạn có thể thu được nhiều kiến thức từ sách.\"}},{\"id\":\"skill|n\",\"term\":\"skill\",\"reading\":\"/skɪl/\",\"meaning\":\"kỹ năng\",\"definitionEn\":\"an ability to do something well\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Hay đi với: improve your skills · language skills\"},{\"id\":\"lecturer|n\",\"term\":\"lecturer\",\"reading\":\"/ˈlek.tʃər.ər/\",\"meaning\":\"giảng viên (đại học)\",\"definitionEn\":\"a teacher at a university\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: LEC-tur-er\",\"example\":{\"text\":\"My lecturer has written three books about education.\",\"vi\":\"Giảng viên của tôi đã viết ba cuốn sách về giáo dục.\"}},{\"id\":\"scholarship|n\",\"term\":\"scholarship\",\"reading\":\"/ˈskɒl.ə.ʃɪp/\",\"meaning\":\"học bổng\",\"definitionEn\":\"money given to a student to pay for studies\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: SCHO-lar-ship — Hay đi với: win a scholarship · get a scholarship\",\"example\":{\"text\":\"Have you ever won a scholarship?\",\"vi\":\"Bạn đã bao giờ giành được học bổng chưa?\"}},{\"id\":\"academic|adj\",\"term\":\"academic\",\"reading\":\"/ˌæk.əˈdem.ɪk/\",\"meaning\":\"(thuộc) học thuật; học tập\",\"definitionEn\":\"connected with studying and schools or universities\",\"lesson\":21,\"pos\":\"adj\",\"hint\":\"Trọng âm: a-ca-DE-mic — Hay đi với: academic subjects · academic performance\",\"example\":{\"text\":\"He is good at academic subjects like maths and physics.\",\"vi\":\"Cậu ấy giỏi các môn học thuật như toán và vật lý.\"}},{\"id\":\"rote-learning|phr-n\",\"term\":\"rote learning\",\"reading\":\"/ˌrəʊt ˈlɜː.nɪŋ/\",\"meaning\":\"học vẹt; học thuộc lòng máy móc\",\"definitionEn\":\"learning by repeating facts without understanding them\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: rely on rote learning · learn by rote\"},{\"id\":\"extracurricular-activity|phr-n\",\"term\":\"extracurricular activity\",\"reading\":\"/ˌek.strə.kəˈrɪk.jə.lər ækˈtɪv.ə.ti/\",\"meaning\":\"hoạt động ngoại khóa\",\"definitionEn\":\"an activity at school outside normal lessons\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: take part in extracurricular activities\"},{\"id\":\"attend|v\",\"term\":\"attend\",\"reading\":\"/əˈtend/\",\"meaning\":\"theo học; tham dự (lớp, buổi học, sự kiện)\",\"definitionEn\":\"to go to a class, meeting or event\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: at-TEND — Hay đi với: attend a class · attend school\"},{\"id\":\"improve|v\",\"term\":\"improve\",\"reading\":\"/ɪmˈpruːv/\",\"meaning\":\"cải thiện; tiến bộ\",\"definitionEn\":\"to become better or make something better\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: im-PROVE — Hay đi với: improve your English · improve skills\",\"example\":{\"text\":\"Many graduates do internships in order to improve their job security.\",\"vi\":\"Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc.\"}},{\"id\":\"achieve|v\",\"term\":\"achieve\",\"reading\":\"/əˈtʃiːv/\",\"meaning\":\"đạt được (mục tiêu, kết quả)\",\"definitionEn\":\"to succeed in doing something after effort\",\"lesson\":21,\"pos\":\"v\",\"hint\":\"Trọng âm: a-CHIEVE — Hay đi với: achieve a goal · achieve good results\",\"example\":{\"text\":\"What do you want to achieve this year?\",\"vi\":\"Năm nay bạn muốn đạt được điều gì?\"}},{\"id\":\"main-idea|phr-n\",\"term\":\"main idea\",\"reading\":\"/ˌmeɪn aɪˈdɪə/\",\"meaning\":\"ý chính\",\"definitionEn\":\"the most important point of a text\",\"lesson\":21,\"pos\":\"phr-n\",\"hint\":\"Hay đi với: the main idea of a paragraph · find the main idea\"},{\"id\":\"paragraph|n\",\"term\":\"paragraph\",\"reading\":\"/ˈpær.ə.ɡrɑːf/\",\"meaning\":\"đoạn văn\",\"definitionEn\":\"a part of a text that starts on a new line\",\"lesson\":21,\"pos\":\"n\",\"hint\":\"Trọng âm: PA-ra-graph — Hay đi với: the first paragraph · write a paragraph\",\"example\":{\"text\":\"The main idea of a paragraph is often in the first sentence.\",\"vi\":\"Ý chính của một đoạn văn thường nằm ở câu đầu tiên.\"}},{\"id\":\"opinion|n\",\"term\":\"opinion\",\"reading\":\"/əˈpɪn.jən/\",\"meaning\":\"ý kiến; quan điểm\",\"definitionEn\":\"what you think about something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"ờ-PIN-yờn: nhấn âm 2. — Trọng âm: o-PI-nion — Hay đi với: in my opinion · express an opinion\",\"example\":{\"text\":\"Misleading headlines can change public opinion very quickly.\",\"vi\":\"Những tiêu đề gây hiểu lầm có thể thay đổi dư luận rất nhanh.\"}},{\"id\":\"argue|v\",\"term\":\"argue\",\"reading\":\"/ˈɑːɡ.juː/\",\"meaning\":\"lập luận; cho rằng\",\"definitionEn\":\"to give reasons to support an idea\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: AR-gue — Hay đi với: argue that… · it is often argued that…\",\"example\":{\"text\":\"Some people argue that sport should be compulsory at school.\",\"vi\":\"Một số người cho rằng thể thao nên là môn bắt buộc ở trường.\"}},{\"id\":\"believe|v\",\"term\":\"believe\",\"reading\":\"/bɪˈliːv/\",\"meaning\":\"tin; cho rằng\",\"definitionEn\":\"to think that something is true\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"“Be-LIE-ve”: đừng tin lời nói dối; i đứng trước e. — Trọng âm: be-LIEVE — Hay đi với: believe that… · strongly believe\",\"example\":{\"text\":\"Many people believe that homework is essential for learning.\",\"vi\":\"Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học.\"}},{\"id\":\"disagree|v\",\"term\":\"disagree\",\"reading\":\"/ˌdɪs.əˈɡriː/\",\"meaning\":\"không đồng ý; phản đối\",\"definitionEn\":\"to have a different opinion\",\"lesson\":22,\"pos\":\"v\",\"hint\":\"Trọng âm: dis-a-GREE — Hay đi với: disagree with someone · strongly disagree\",\"example\":{\"text\":\"You can agree or disagree, but you must give clear reasons.\",\"vi\":\"Bạn có thể đồng ý hoặc phản đối, nhưng phải đưa ra lý do rõ ràng.\"}},{\"id\":\"reason|n\",\"term\":\"reason\",\"reading\":\"/ˈriː.zən/\",\"meaning\":\"lý do\",\"definitionEn\":\"why something happens or why someone does something\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: REA-son — Hay đi với: the main reason · for two reasons\",\"example\":{\"text\":\"The reason space research is worth funding is that it produces useful spin-offs.\",\"vi\":\"Lý do nghiên cứu vũ trụ đáng được tài trợ là nó tạo ra nhiều ứng dụng hữu ích.\"}},{\"id\":\"benefit|n\",\"term\":\"benefit\",\"reading\":\"/ˈben.ɪ.fɪt/\",\"meaning\":\"lợi ích\",\"definitionEn\":\"a good effect or advantage\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: BE-ne-fit — Hay đi với: the benefits of… · a major benefit\",\"example\":{\"text\":\"Consumers benefit from free trade because goods become cheaper.\",\"vi\":\"Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn.\"}},{\"id\":\"drawback|n\",\"term\":\"drawback\",\"reading\":\"/ˈdrɔː.bæk/\",\"meaning\":\"nhược điểm; bất lợi\",\"definitionEn\":\"a problem that makes something less attractive\",\"lesson\":22,\"pos\":\"n\",\"hint\":\"Trọng âm: DRAW-back — Hay đi với: the main drawback · a serious drawback\",\"example\":{\"text\":\"The main drawback of online classes is the lack of contact with teachers.\",\"vi\":\"Nhược điểm chính của lớp học online là thiếu tiếp xúc với giáo viên.\"}},{\"id\":\"positive|adj\",\"term\":\"positive\",\"reading\":\"/ˈpɒz.ə.tɪv/\",\"meaning\":\"tích cực\",\"definitionEn\":\"good or helpful; hopeful\",\"lesson\":22,\"pos\":\"adj\",\"hint\":\"Trọng âm: PO-si-tive — Hay đi với: a positive effect · positive attitude\",\"example\":{\"text\":\"Sport has a positive effect on students' health.\",\"vi\":\"Thể thao có ảnh hưởng
