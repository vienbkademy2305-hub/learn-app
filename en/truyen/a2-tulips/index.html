 bà Green. Cô bé cầm một bó hoa tulip vàng trong tay.\",\"focus\":[\"a bunch of\",\"in her hand\"]},{\"text\":\"She walked across the road and went into number twelve.\",\"vi\":\"Cô bé đi sang bên kia đường và vào nhà số mười hai.\",\"clues\":[\"tulips-no12\"]}],\"checks\":[{\"claim_vi\":\"Pete giao báo lúc bốn giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “at four o'clock every day.”\"},{\"claim_vi\":\"Cô bé cầm hoa hồng đỏ.\",\"answer\":false,\"explain_vi\":\"Sai: hoa tulip vàng.\"},{\"claim_vi\":\"Cô bé vào nhà số mười hai.\",\"answer\":true,\"explain_vi\":\"Đúng: “went into number twelve.”\"}]},{\"id\":\"ruby\",\"name\":\"Ruby\",\"role\":\"A neighbour's daughter\",\"avatar\":\"🩰\",\"segments\":[{\"text\":\"I live at number twelve with my mum and dad.\",\"vi\":\"Em sống ở nhà số mười hai với bố mẹ.\",\"clues\":[\"ruby-house\"]},{\"text\":\"I had my ballet class from three o'clock to five o'clock. I was there all afternoon.\",\"vi\":\"Em có lớp múa ba lê từ ba giờ đến năm giờ. Em ở đó cả buổi chiều.\",\"focus\":[\"from … to\",\"all afternoon\"]},{\"text\":\"I like flowers, but I never pick them from other people's gardens.\",\"vi\":\"Em thích hoa nhưng em không bao giờ hái hoa trong vườn của người khác.\"}],\"checks\":[{\"claim_vi\":\"Ruby sống ở nhà số mười hai.\",\"answer\":true,\"explain_vi\":\"Đúng: “I live at number twelve.”\"},{\"claim_vi\":\"Ruby nói cô ở nhà cả buổi chiều.\",\"answer\":false,\"explain_vi\":\"Sai: cô nói cô ở lớp ba lê.\"},{\"claim_vi\":\"Ruby nói cô không hái hoa của người khác.\",\"answer\":true,\"explain_vi\":\"Đúng: “I never pick them from other people's gardens.”\"}]}],\"solution\":{\"culprit\":\"ruby\",\"evidence\":[\"ballet-cancelled\",\"tulips-no12\"],\"explain_vi\":\"Ruby nói cô học ba lê cả buổi chiều. Nhưng lớp ba lê đã bị hủy, và Pete thấy một cô bé cầm tulip vàng đi vào nhà số mười hai, nhà của Ruby.\",\"confession\":\"I'm sorry, Mrs Green. It was my mum's birthday, and I wanted to give her something beautiful. I should have as
