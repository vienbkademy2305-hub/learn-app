 eating from a bag with a dinosaur on it.\",\"text_vi\":\"Ben thấy Sofia ăn từ một chiếc túi có hình khủng long.\"},{\"id\":\"park-bench\",\"witness\":\"park\",\"text\":\"The lunch break was at twelve o'clock at the picnic tables.\",\"text_vi\":\"Giờ nghỉ trưa là mười hai giờ ở các bàn picnic.\"},{\"id\":\"ben-sticker\",\"witness\":\"ben\",\"text\":\"Ben's bag has a dinosaur sticker.\",\"text_vi\":\"Túi của Ben có hình dán khủng long.\"}],\"witnesses\":[{\"id\":\"park\",\"name\":\"Miss Park\",\"role\":\"The teacher\",\"avatar\":\"🧑‍🏫\",\"segments\":[{\"text\":\"The lunch break was at twelve o'clock at the picnic tables. We saw the lions before lunch.\",\"vi\":\"Giờ nghỉ trưa là mười hai giờ ở các bàn picnic. Chúng ta xem sư tử trước bữa trưa.\",\"clues\":[\"park-bench\"]},{\"text\":\"In the morning, Sofia's mother phoned the school. She said, 'Sofia forgot her lunch at home.' So I gave Sofia some fruit.\",\"vi\":\"Buổi sáng, mẹ của Sofia gọi điện cho trường. Bà nói: “Sofia để quên bữa trưa ở nhà.” Vì vậy cô cho Sofia ít trái cây.\",\"clues\":[\"forgot-lunch\"],\"focus\":[\"forgot\",\"fruit\"]},{\"text\":\"At lunchtime, I counted the children. Everyone was at the tables.\",\"vi\":\"Giờ ăn trưa, cô đếm các em. Ai cũng ngồi ở các bàn.\"}],\"checks\":[{\"claim_vi\":\"Giờ nghỉ trưa là mười hai giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “at twelve o'clock.”\"},{\"claim_vi\":\"Sofia mang theo bữa trưa từ nhà.\",\"answer\":false,\"explain_vi\":\"Sai: mẹ Sofia báo Sofia đã để quên.\"},{\"claim_vi\":\"Cô Park cho Sofia ít trái cây.\",\"answer\":true,\"explain_vi\":\"Đúng: “I gave Sofia some fruit.”\"}]},{\"id\":\"ben\",\"name\":\"Ben\",\"role\":\"A classmate\",\"avatar\":\"🦖\",\"segments\":[{\"text\":\"My lunch bag has a green dinosaur sticker. My mum made me a cheese sandwich and an apple.\",\"vi\":\"Túi bữa trưa của em có hình dán khủng long xanh. Mẹ làm cho em một chiếc sandwich phô mai và một quả táo.\",\"clues\":[\"ben-sticker\"]},{\"text\":\"I left the bag on the bench near the lions. When I came back, it was gone.\",\"vi\":\"Em để túi trên ghế dài gần chuồng sư tử. Khi quay lại, nó không còn.\",\"focus\":[\"left\",\"gone\"]},{\"text\":\"Later, I saw Sofia at the picnic table. She was eating a cheese sandwich from a bag with a green dinosaur.\",\"vi\":\"Sau đó em thấy Sofia ở bàn picnic. Cô ấy đang ăn sandwich phô mai từ chiếc túi có hình khủng long xanh.\",\"clues\":[\"dino-bag\"],\"focus\":[\"eating\",\"from a bag\"]}],\"checks\":[{\"claim_vi\":\"Mẹ Ben làm cho cậu một chiếc sandwich phô mai.\",\"answer\":true,\"explain_vi\":\"Đúng: “a cheese sandwich and an apple.”\"},{\"claim_vi\":\"Ben để túi trong lớp học.\",\"answer\":false,\"explain_vi\":\"Sai: em để túi trên ghế dài gần sư tử.\"},{\"claim_vi\":\"Sofia ăn từ chiếc túi có khủng long.\",\"answer\":true,\"explain_vi\":\"Đúng: “from a bag with a green dinosaur.”\"}]},{\"id\":\"sofia\",\"name\":\"Sofia\",\"role\":\"A classmate\",\"avatar\":\"🍉\",\"segments\":[{\"text\":\"I brought my own lunch today. My dad made it for me.\",\"vi\":\"Hôm nay em tự mang bữa trưa. Bố làm cho em.\"},{\"text\":\"I ate my sandwich at the picnic table. It was a cheese sandwich, too.\",\"vi\":\"Em ăn sandwich ở bàn picnic. Đó cũng là sandwich phô mai.\",\"focus\":[\"ate\",\"too\"]},{\"text\":\"I didn't see Ben's bag. I was watching the lions.\",\"vi\":\"Em không thấy túi của Ben. Em đang ngắm sư tử.\"}],\"checks\":[{\"claim_vi\":\"Sofia nói bố cô làm bữa trưa.\",\"answer\":true,\"explain_vi\":\"Đúng: “My dad made it for me.”\"},{\"claim_vi\":\"Sofia nói cô quên mang bữa trưa.\",\"answer\":false,\"explain_vi\":\"Sai: cô nói cô tự mang bữa trưa.\"},{\"claim_vi\":\"Sofia nói cô đang ngắm sư tử.\",\"answer\":true,\"explain_vi\":\"Đúng: “I was watching the lions.”\"}]}],\"solution\":{\"culprit\":\"sofia\",\"evidence\":[\"forgot-lunch\",\"dino-bag\"],\"explain_vi\":\"Sofia nói cô tự mang bữa trưa. Nhưng mẹ cô báo cô để quên, và Ben thấy cô ăn từ chiếc túi có hình khủng long xanh của cậu.\",\"confession\":\"I'm sorry, Ben. I was very hungry, and I didn't have any lunch. I saw your bag and took it. I'll give you my fruit tomorrow.\",\"confession_vi\":\"Mình xin lỗi Ben. Mình đói quá mà không có bữa trưa. Mình thấy túi của bạn và lấy nó. Mai mình sẽ đưa bạn trái cây của mình.\"},\"lang\":\"en\"}}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n18:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n10:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"Bữa trưa ở sở thú · Truyện trinh thám · Học tiếng Anh\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Học tiếng Anh cho người Việt theo lộ trình IELTS 6.5: từ vựng theo chủ đề có IPA, ngữ pháp, hội thoại, bài tập.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/learn-app/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"7\",{\"rel\":\"apple-touch-icon\",\"href\":\"/learn-app/icons/apple-touch-icon.png\"}],[\"$\",\"$L18\",\"8\",{}]]\n"])</script></body></html>
