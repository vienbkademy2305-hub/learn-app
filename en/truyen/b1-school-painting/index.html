 giờ là 2:12 chiều.\"},{\"id\":\"blue-bag\",\"witness\":\"priya\",\"text\":\"Priya saw Dan's blue camera bag on the stage at ten past two.\",\"text_vi\":\"Priya thấy túi máy ảnh màu xanh của Dan trên sân khấu lúc hai giờ mười.\"},{\"id\":\"side-door\",\"witness\":\"hall\",\"text\":\"The side door stayed open until half past two.\",\"text_vi\":\"Cửa hông mở đến hai giờ rưỡi.\"},{\"id\":\"main-door\",\"witness\":\"hall\",\"text\":\"Mr Hall locked the main door at two o'clock.\",\"text_vi\":\"Ông Hall khóa cửa chính lúc hai giờ.\"},{\"id\":\"cake-stall\",\"witness\":\"priya\",\"text\":\"Priya was working at the cake stall until twenty past two.\",\"text_vi\":\"Priya trông quầy bánh đến hai giờ hai mươi.\"},{\"id\":\"dan-left\",\"witness\":\"dan\",\"text\":\"Dan says he left the hall at ten to two.\",\"text_vi\":\"Dan nói anh rời hội trường lúc hai giờ kém mười.\"}],\"witnesses\":[{\"id\":\"hall\",\"name\":\"Mr Hall\",\"role\":\"The school caretaker\",\"avatar\":\"🗝️\",\"segments\":[{\"text\":\"I'm the only person who has the key to the main door. At two o'clock I looked inside the hall and then I locked it. I haven't given the key to anyone.\",\"vi\":\"Tôi là người duy nhất giữ chìa khóa cửa chính. Lúc hai giờ tôi nhìn vào trong hội trường rồi khóa lại. Tôi chưa đưa chìa cho ai.\",\"clues\":[\"main-door\"],\"focus\":[\"haven't given\",\"looked inside\"]},{\"text\":\"However, the side door next to the stage was open until half past two. It was a very hot day, so the teachers wanted some fresh air.\",\"vi\":\"Tuy nhiên, cửa hông cạnh sân khấu mở đến hai giờ rưỡi. Hôm đó trời rất nóng nên các thầy cô muốn có chút không khí trong lành.\",\"clues\":[\"side-door\"],\"focus\":[\"However\",\"until half past two\"]},{\"text\":\"I was standing at the front entrance the whole time, so I couldn't see the side door. I'm sorry I can't tell you more.\",\"vi\":\"Tôi đứng ở cổng trước suốt thời gian đó nên không nhìn thấy cửa hông. Tôi xin lỗi vì không thể nói thêm.\"}],\"checks\":[{\"claim_vi\":\"Ông Hall đã đưa chìa khóa cửa chính cho một giáo viên.\",\"answer\":false,\"explain_vi\":\"Sai: “I haven't given the key to anyone.”\"},{\"claim_vi\":\"Cửa hông mở đến hai giờ rưỡi.\",\"answer\":true,\"explain_vi\":\"Đúng: “the side door… was open until half past two.”\"},{\"claim_vi\":\"Ông Hall nhìn thấy cửa hông suốt thời gian đó.\",\"answer\":false,\"explain_vi\":\"Sai: ông đứng ở cổng trước nên không thấy cửa hông.\"}]},{\"id\":\"priya\",\"name\":\"Priya\",\"role\":\"A student volunteer\",\"avatar\":\"🍰\",\"segments\":[{\"text\":\"I was working at the cake stall outside the hall until twenty past two. Then I went to help Mrs Lee with the chairs.\",\"vi\":\"Em trông quầy bánh bên ngoài hội trường đến hai giờ hai mươi. Rồi em đi giúp cô Lee xếp ghế.\",\"clues\":[\"cake-stall\"],\"focus\":[\"until\",\"help\"]},{\"text\":\"At about ten past two I was carrying some chairs past the hall window. I looked in and saw a blue camera bag on the stage, next to the painting.\",\"vi\":\"Khoảng hai giờ mười, em đang bê mấy chiếc ghế đi ngang cửa sổ hội trường. Em nhìn vào và thấy một chiếc túi máy ảnh màu xanh trên sân khấu, cạnh bức tranh.\",\"clues\":[\"blue-bag\"],\"focus\":[\"was carrying\",\"next to\"]},{\"text\":\"I didn't see anybody inside, and I didn't think about it. I only remembered the bag when everyone started shouting about the painting.\",\"vi\":\"Em không thấy ai bên trong và cũng không nghĩ ngợi gì. Em chỉ nhớ đến chiếc túi khi mọi người bắt đầu la lên về bức tranh.\"}],\"checks\":[{\"claim_vi\":\"Priya trông quầy bánh đến hai giờ hai mươi.\",\"answer\":true,\"explain_vi\":\"Đúng: “I was working at the cake stall… until twenty past two.”\"},{\"claim_vi\":\"Priya thấy một người đứng trên sân khấu.\",\"answer\":false,\"explain_vi\":\"Sai: “I didn't see anybody inside.”\"},{\"claim_vi\":\"Chiếc túi máy ảnh có màu xanh.\",\"answer\":true,\"explain_vi\":\"Đúng: “a blue camera bag on the stage.”\"}]},{\"id\":\"okoro\",\"name\":\"Mr Okoro\",\"role\":\"The art teacher\",\"avatar\":\"🎨\",\"segments\":[{\"text\":\"I painted that picture last summer. It had been hanging on the stage wall since the morning, and I had checked it at one o'clock.\",\"vi\":\"Tôi vẽ bức tranh đó vào mùa hè năm ngoái. Nó được treo trên tường sân khấu từ sáng, và tôi đã kiểm tra nó lúc một giờ.\",\"focus\":[\"had been hanging\",\"had checked\"]},{\"text\":\"Dan, the photographer, took some pictures of it. Later, he showed me one on his camera screen. The time on the photo was 2:12 pm.\",\"vi\":\"Dan, người chụp ảnh, đã chụp vài tấm bức tranh. Sau đó cậu ấy cho tôi xem một tấm trên màn hình máy ảnh. Giờ trên tấm ảnh là 2:12 chiều.\",\"clues\":[\"photo-time\"],\"focus\":[\"showed me\",\"The time on the photo\"]},{\"text\":\"I didn't pay attention to the time then. Now I realise that the hall was already locked at that moment. It's very strange.\",\"vi\":\"Lúc đó tôi không để ý đến giờ. Bây giờ tôi nhận ra khi ấy cửa chính của hội trường đã khóa rồi. Thật kỳ lạ.\",\"focus\":[\"realise\",\"already\"]}],\"checks\":[{\"claim_vi\":\"Thầy Okoro vẽ bức tranh vào mùa hè năm ngoái.\",\"answer\":true,\"explain_vi\":\"Đúng: “I painted that picture last summer.”\"},{\"claim_vi\":\"Giờ trên tấm ảnh của Dan là 2:12 chiều.\",\"answer\":true,\"explain_vi\":\"Đúng: “The time on the photo was 2:12 pm.”\"},{\"claim_vi\":\"Thầy Okoro đã chụp bức ảnh đó.\",\"answer\":false,\"explain_vi\":\"Sai: Dan là người chụp, thầy chỉ xem ảnh trên máy ảnh của Dan.\"}]},{\"id\":\"dan\",\"name\":\"Dan\",\"role\":\"The school photographer\",\"avatar\":\"📷\",\"segments\":[{\"text\":\"I've been taking photos at the fair since ten o'clock this morning. I took about a hundred pictures, including some of Mr Okoro's painting.\",\"vi\":\"Tôi chụp ảnh ở hội chợ từ mười giờ sáng nay. Tôi đã chụp khoảng một trăm tấm, trong đó có vài tấm bức tranh của thầy Okoro.\",\"focus\":[\"I've been taking\",\"including\"]},{\"text\":\"I finished in the hall at ten to two and went to the sports field. I haven't been back in the hall since then.\",\"vi\":\"Tôi chụp xong trong hội trường lúc hai giờ kém mười rồi ra sân thể thao. Từ đó tôi chưa quay lại hội trường.\",\"clues\":[\"dan-left\"],\"focus\":[\"haven't been back\",\"since then\"]},{\"text\":\"Why would I take a painting? I'm a photographer, not a thief! Somebody must have come through the side door.\",\"vi\":\"Tại sao tôi lại lấy một bức tranh? Tôi là thợ ảnh, không phải kẻ trộm! Chắc chắn ai đó đã vào bằng cửa hông.\",\"focus\":[\"Why would I\",\"must have come\"]}],\"checks\":[{\"claim_vi\":\"Dan nói anh chụp ảnh ở hội chợ từ mười giờ sáng.\",\"answer\":true,\"explain_vi\":\"Đúng: “I've been taking photos at the fair since ten o'clock.”\"},{\"claim_vi\":\"Dan nói anh quay lại hội trường sau hai giờ.\",\"answer\":false,\"explain_vi\":\"Sai: “I haven't been back in the hall since then.”\"},{\"claim_vi\":\"Dan cho rằng có người đi vào bằng cửa hông.\",\"answer\":true,\"explain_vi\":\"Đúng: “Somebody must have come through the side door.”\"}]}],\"solution\":{\"culprit\":\"dan\",\"evidence\":[\"photo-time\",\"blue-bag\"],\"explain_vi\":\"Dan nói anh rời hội trường lúc hai giờ kém mười và không quay lại. Nhưng ảnh của anh chụp bức tranh có giờ 2:12, và Priya thấy túi máy ảnh của anh trên sân khấu lúc hai giờ mười. Anh vào lại hội trường bằng cửa hông đang mở.\",\"confession\":\"I'm sorry. I went back through the side door to take a better photo. Then I saw how valuable the painting was, and I put it in my bag. I haven't sold it. It's in my car.\",\"confession_vi\":\"Tôi xin lỗi. Tôi quay lại qua cửa hông để chụp ảnh đẹp hơn. Rồi tôi thấy bức tranh quá giá trị nên bỏ vào túi. Tôi chưa bán nó. Nó đang ở trong xe tôi.\"},\"lang\":\"en\"}}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n18:I[45127,[\"/learn-app/_next/s
