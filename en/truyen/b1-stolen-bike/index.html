\"ruth\",\"text\":\"Ruth saw Ali next to her bike at ten to five with a pair of metal cutters.\",\"text_vi\":\"Ruth thấy Ali đứng cạnh xe của cô lúc năm giờ kém mười với một cái kìm cắt.\"},{\"id\":\"lock-cut\",\"witness\":\"pike\",\"text\":\"The lock was cut, not opened.\",\"text_vi\":\"Ổ khóa bị cắt chứ không phải mở.\"},{\"id\":\"ruth-library\",\"witness\":\"ruth\",\"text\":\"Ruth was inside the library from four until five.\",\"text_vi\":\"Ruth ở trong thư viện từ bốn giờ đến năm giờ.\"}],\"witnesses\":[{\"id\":\"ruth\",\"name\":\"Ruth\",\"role\":\"The owner of the bike\",\"avatar\":\"📖\",\"segments\":[{\"text\":\"I locked my bike to the railing outside the library at four o'clock and went inside to study. I came out at five.\",\"vi\":\"Tôi khoá xe vào lan can ngoài thư viện lúc bốn giờ rồi vào học. Tôi ra lúc năm giờ.\",\"clues\":[\"ruth-library\"]},{\"text\":\"Just before five, I looked out of the window of the reading room. At ten to five I saw Ali standing next to my bike. He was holding a pair of metal cutters.\",\"vi\":\"Ngay trước năm giờ, tôi nhìn ra cửa sổ phòng đọc. Lúc năm giờ kém mười tôi thấy Ali đứng cạnh xe của tôi. Anh ta cầm một cái kìm cắt kim loại.\",\"clues\":[\"ali-cutters\"],\"focus\":[\"looked out of\",\"holding\"]},{\"text\":\"I thought he was a workman, so I didn't go outside. Now I feel stupid.\",\"vi\":\"Tôi tưởng anh ta là thợ nên không ra ngoài. Giờ tôi thấy mình thật ngốc.\"}],\"checks\":[{\"claim_vi\":\"Ruth khóa xe lúc bốn giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “I locked my bike… at four o'clock.”\"},{\"claim_vi\":\"Ruth thấy Ali đứng cạnh xe lúc năm giờ kém mười.\",\"answer\":true,\"explain_vi\":\"Đúng: “At ten to five I saw Ali standing next to my bike.”\"},{\"claim_vi\":\"Ruth ra ngoài ngay khi thấy Ali.\",\"answer\":false,\"explain_vi\":\"Sai: “I didn't go outside.”\"}]},{\"id\":\"pike\",\"name\":\"Mr Pike\",\"role\":\"The security guard\",\"avatar\":\"🔦\",\"segments\":[{\"text\":\"I checked the railing at five past five. The bike had gone. On the ground there was a piece of the lock, so it had been cut, not opened with a key.\",\"vi\":\"Tôi kiểm tra lan can lúc năm giờ năm phút. Chiếc xe đã biến mất. Dưới đất có một mảnh ổ khóa, nên nó đã bị cắt chứ không phải mở bằng chìa.\",\"clues\":[\"lock-cut\"],\"focus\":[\"had gone\",\"cut, not opened\"]},{\"text\":\"The bus stop is opposite the library. The number 12 bus was late today because of an accident. It didn't arrive until a quarter past five.\",\"vi\":\"Trạm xe buýt ở đối diện thư viện. Hôm nay xe số 12 bị trễ vì một vụ tai nạn. Mãi đến năm giờ mười lăm nó mới đến.\",\"clues\":[\"bus-late\"],\"focus\":[\"because of\",\"didn't arrive until\"]},{\"text\":\"A lot of people waited for it. Before that, the stop was almost empty.\",\"vi\":\"Rất nhiều người đã đợi nó. Trước đó trạm gần như trống.\"}],\"checks\":[{\"claim_vi\":\"Ổ khóa được mở bằng chìa.\",\"answer\":false,\"explain_vi\":\"Sai: ổ khóa bị cắt.\"},{\"claim_vi\":\"Xe buýt số 12 đến muộn hôm nay.\",\"answer\":true,\"explain_vi\":\"Đúng: “The number 12 bus was late today.”\"},{\"claim_vi\":\"Trạm xe buýt ở cách thư viện rất xa.\",\"answer\":false,\"explain_vi\":\"Sai: trạm ở đối diện thư viện.\"}]},{\"id\":\"ali\",\"name\":\"Ali\",\"role\":\"A passer-by\",\"avatar\":\"🧢\",\"segments\":[{\"text\":\"I was at the bus stop opposite the library at a quarter to five. I got on the bus and went straight home.\",\"vi\":\"Tôi ở trạm xe buýt đối diện thư viện lúc năm giờ kém mười lăm. Tôi lên xe buýt và về thẳng nhà.\",\"focus\":[\"got on\",\"straight home\"]},{\"text\":\"I didn't go near the library. I don't even know whose bike it was.\",\"vi\":\"Tôi không đến gần thư viện. Tôi còn không biết chiếc xe đó của ai.\"},{\"text\":\"I don't carry tools. I'm a student, and I only have books in my bag.\",\"vi\":\"Tôi không mang dụng cụ. Tôi là sinh viên và trong ba lô tôi chỉ có sách.\"}],\"checks\":[{\"claim_vi\":\"Ali nói anh lên xe buýt lúc năm giờ kém mười lăm.\",\"answer\":true,\"explain_vi\":\"Đúng: “I got on the bus and went straight home.”\"},{\"claim_vi\":\"Ali nói anh biết chiếc xe của ai.\",\"answer\":false,\"explain_vi\":\"Sai: “I don't even know whose bike it was.”\"},{\"claim_vi\":\"Ali nói anh mang theo dụng cụ.\",\"answer\":false,\"explain_vi\":\"Sai: “I don't carry tools.”\"}]}],\"solution\":{\"culprit\":\"ali\",\"evidence\":[\"bus-late\",\"ali-cutters\"],\"explain_vi\":\"Ali nói anh lên xe buýt lúc 4:45 rồi về nhà. Nhưng xe buýt hôm đó chỉ đến lúc 5:15, và Ruth thấy anh đứng cạnh chiếc xe lúc 4:50 với một cái kìm cắt.\",\"confession\":\"I'm sorry. I needed a bike to get to work, and I didn't have any money. I cut the lock and rode away. I'll give it back tomorrow.\",\"confession_vi\":\"Tôi xin lỗi. Tôi cần một chiếc xe đạp để đi làm mà không có tiền. Tôi cắt ổ khóa rồi đạp xe đi. Ngày mai tôi sẽ trả lại.\"},\"lang\":\"en\"}}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#c73c27\"}]]\n18:I[45127,[\"/learn-app/_next/static/chunks/1ql_55-u1voyz.js\",\"/learn-app/_next/static/chunks/3uc1j8hoj5okw.js\",\"/learn-app/_next/static/chunks/2hl1geuk8-75i.js\"],\"IconMark\"]\n10:null\n15:[[\"$\",\"title\",\"0\",{\"children\":\"Chiếc xe đạp bị lấy mất · Truyện trinh thám · Học tiếng Anh\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Học tiếng Anh cho người Việt theo lộ trình IELTS 6.5: từ vựng theo chủ đề có IPA, ngữ pháp, hội thoại, bài tập.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/learn-app/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Học ngoại ngữ\"}],[\"$\",\"meta\",\"6\",
