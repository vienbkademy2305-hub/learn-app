 homework.' He went upstairs.\",\"vi\":\"Tom nói: “Anh đi làm bài tập đây.” Anh ấy lên lầu.\"}],\"checks\":[{\"claim_vi\":\"Anna dọn gara vào buổi sáng.\",\"answer\":true,\"explain_vi\":\"Đúng: “I tidied the garage this morning.”\"},{\"claim_vi\":\"Ủng của Tom khô và nằm trong gara.\",\"answer\":false,\"explain_vi\":\"Sai: chúng ướt và ở cạnh cửa sau.\"},{\"claim_vi\":\"Tom lên lầu làm bài tập.\",\"answer\":true,\"explain_vi\":\"Đúng: “He went upstairs.”\"}]},{\"id\":\"tom\",\"name\":\"Tom\",\"role\":\"The brother\",\"avatar\":\"📚\",\"segments\":[{\"text\":\"I did my homework in my room all afternoon. I never went outside.\",\"vi\":\"Anh làm bài tập trong phòng cả buổi chiều. Anh không hề ra ngoài.\",\"focus\":[\"all afternoon\",\"never\"]},{\"text\":\"My boots are in the garage. I didn't wear them today.\",\"vi\":\"Ủng của anh ở trong gara. Hôm nay anh không đi chúng.\"},{\"text\":\"Maybe the dog brought mud into the kitchen.\",\"vi\":\"Có lẽ con chó mang bùn vào bếp.\"}],\"checks\":[{\"claim_vi\":\"Tom nói cậu làm bài tập trong phòng.\",\"answer\":true,\"explain_vi\":\"Đúng: “I did my homework in my room.”\"},{\"claim_vi\":\"Tom nói cậu đã đi ủng hôm nay.\",\"answer\":false,\"explain_vi\":\"Sai: “I didn't wear them today.”\"},{\"claim_vi\":\"Tom nghĩ con chó có thể mang bùn vào.\",\"answer\":true,\"explain_vi\":\"Đúng: “Maybe the dog brought mud into the kitchen.”\"}]}],\"solution\":{\"culprit\":\"tom\",\"evidence\":[\"boots-door\",\"small-prints\"],\"explain_vi\":\"Tom nói cậu ở trong phòng và ủng để trong gara. Nhưng ủng của cậu ướt cạnh cửa sau, và dấu chân nhỏ cỡ bốn giống ủng của cậu.\",\"confession\":\"I'm sorry, Mum. I went outside to play in the rain. I came in through the kitchen with my boots on. I was afraid you'd be angry.\",\"confession_vi\":\"Con xin lỗi mẹ. Con ra ngoài chơi dưới mưa. Con đi ủng vào bếp. Con sợ mẹ giận.\"},\"lang\":\"en\"}}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":
