oco.\",\"text_vi\":\"Ella nói cô muốn bế Coco.\"},{\"id\":\"lee-early\",\"witness\":\"lee\",\"text\":\"Mr Lee came to school at eight o'clock.\",\"text_vi\":\"Thầy Lee đến trường lúc tám giờ.\"},{\"id\":\"max-late\",\"witness\":\"max\",\"text\":\"Max arrived at ten past eight.\",\"text_vi\":\"Max đến lúc tám giờ mười.\"}],\"witnesses\":[{\"id\":\"lee\",\"name\":\"Mr Lee\",\"role\":\"The class teacher\",\"avatar\":\"🍎\",\"segments\":[{\"text\":\"I came to school at eight o'clock. The cage was closed at that time.\",\"vi\":\"Thầy đến trường lúc tám giờ. Khi đó lồng vẫn đóng.\",\"clues\":[\"lee-early\"]},{\"text\":\"At half past eight the cage was open. Coco wasn't there.\",\"vi\":\"Lúc tám giờ rưỡi lồng đã mở. Coco không còn ở đó.\",\"focus\":[\"open\",\"wasn't there\"]},{\"text\":\"Then I looked around the room. I saw some sunflower seeds on Ella's desk. Coco loves sunflower seeds.\",\"vi\":\"Rồi thầy nhìn quanh lớp. Thầy thấy vài hạt hướng dương trên bàn của Ella. Coco rất thích hạt hướng dương.\",\"clues\":[\"seeds-desk\"],\"focus\":[\"looked around\",\"loves\"]}],\"checks\":[{\"claim_vi\":\"Thầy Lee đến trường lúc tám giờ.\",\"answer\":true,\"explain_vi\":\"Đúng: “I came to school at eight o'clock.”\"},{\"claim_vi\":\"Lúc tám giờ rưỡi lồng vẫn đóng.\",\"answer\":false,\"explain_vi\":\"Sai: lồng đã mở.\"},{\"claim_vi\":\"Có hạt hướng dương trên bàn của Ella.\",\"answer\":true,\"explain_vi\":\"Đúng: “sunflower seeds on Ella's desk.”\"}]},{\"id\":\"max\",\"name\":\"Max\",\"role\":\"A classmate\",\"avatar\":\"🏃\",\"segments\":[{\"text\":\"I arrived at ten past eight. I put my bag on my desk and went to the toilet.\",\"vi\":\"Em đến lúc tám giờ mười. Em đặt balô lên bàn rồi đi vệ sinh.\",\"clues\":[\"max-late\"]},{\"text\":\"Yesterday, in the playground, Ella said, 'I want to hold Coco. He is so cute!'\",\"vi\":\"Hôm qua, ở sân chơi, Ella nói: “Mình muốn bế Coco. Nó dễ thương quá!”\",\"clues\":[\"wanted-hold\"],\"focus\":[\"hold\",\"cute\"]},{\"text\":\"But Mr Lee says only the teacher can open the cage.\",\"vi\":\"Nhưng thầy Lee nói chỉ giáo viên mới được mở lồng.\"}],\"checks\":[{\"claim_vi\":\"Max đến lúc tám giờ mười.\",\"answer\":true,\"explain_vi\":\"Đúng: “I arrived at ten past eight.”\"},{\"claim_vi\":\"Ella nói cô muốn bế Coco.\",\"answer\":true,\"explain_vi\":\"Đúng: “I want to hold Coco.”\"},{\"claim_vi\":\"Học sinh được mở lồng khi muốn.\",\"answer\":false,\"explain_vi\":\"Sai: chỉ giáo viên được mở lồng.\"}]},{\"id\":\"ella\",\"name\":\"Ella\",\"role\":\"A classmate\",\"avatar\":\"🌻\",\"segments\":[{\"text\":\"I came to school early today. I read a book at my desk.\",\"vi\":\"Hôm nay em đến trường sớm. Em đọc sách ở bàn.\"},{\"text\":\"I didn't touch the cage. I love animals, so I would never hurt Coco.\",\"vi\":\"Em không đụng vào lồng. Em yêu động vật nên sẽ không bao giờ làm đau Coco.\",\"focus\":[\"didn't touch\",\"never\"]},{\"text\":\"Maybe Coco opened the door by himself. Hamsters are clever.\",\"vi\":\"Có lẽ Coco tự mở cửa. Chuột hamster thông minh lắm.\"}],\"checks\":[{\"claim_vi\":\"Ella đọc sách ở bàn.\",\"answer\":true,\"explain_vi\":\"Đúng: “I read a book at my desk.”\"},{\"claim_vi\":\"Ella nói cô đã mở lồng.\",\"answer\":false,\"explain_vi\":\"Sai: “I didn't touch the cage.”\"},{\"claim_vi\":\"Ella nghĩ Coco có thể tự mở cửa.\",\"answer\":true,\"explain_vi\":\"Đúng: “Maybe Coco opened the door by himself.”\"}]}],\"solution\":{\"culprit\":\"ella\",\"evidence\":[\"seeds-desk\",\"wanted-hold\"],\"explain_vi\":\"Ella nói cô không đụng vào lồng. Nhưng trên bàn cô có hạt hướng dương (Coco thích loại hạt đó) và hôm qua cô nói muốn bế Coco.\",\"confession\":\"I'm sorry, Mr Lee. I only wanted to hold Coco for a minute. He ran under the cupboard, and I was afraid to tell you.\",\"confession_vi\":\"Em xin lỗi thầy Lee. Em chỉ muốn bế Coco một phút. Nó chạy vào gầm tủ và em sợ nói với thầy.\"},\"lang\":\"en\"}}]\n13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"cont
