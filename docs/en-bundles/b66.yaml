lesson:
  slug: buoi-66-mock-1-listening-reading
  number: 66
  stage: 4
  title_vi: "Mock test 1 · Listening + Reading đủ 80 câu theo giờ thi thật"
  focus:
    grammar: Không học điểm mới — chữa lỗi phát sinh khi làm đề
    skill: "Listening + Reading — làm đề đủ 40 + 40 câu đúng giờ, quy đổi band, lập nhật ký lỗi theo dạng câu"
  target_band: 6.0-6.5
  steps:
    - type: skill
      skill: listening
      title_vi: Làm một đề Listening + Reading như ngày thi thật
      intro_vi: "Giai đoạn 4 không dạy nội dung mới: bạn làm đề đủ chuẩn, chấm, quy đổi band rồi chữa lỗi theo DẠNG câu. Đề hôm nay gồm Listening 4 phần (40 câu, khoảng 30 phút) và Reading 3 bài đọc (40 câu, 60 phút). Đề do biên tập viên tự viết theo đúng cấu trúc thi IELTS Academic, độ khó gần band 6–6.5. Kết quả buổi này là điểm xuất phát để chọn kỹ năng cần luyện riêng ở Buổi 75–76."
      steps:
        - title_vi: Chuẩn bị như phòng thi
          text_vi: "Tắt thông báo điện thoại, chuẩn bị giấy nháp, đặt đồng hồ. Làm Listening một mạch từ Part 1 đến Part 4, sau đó nghỉ không quá 5 phút rồi làm Reading đúng 60 phút. Không tra từ điển, không xem lại lời bài nghe trước khi nộp."
        - title_vi: "Listening: nghe MỘT lần"
          text_vi: "Thi thật chỉ được nghe một lần. Trước mỗi phần, dùng khoảng 30 giây đọc câu hỏi, gạch keyword và đoán loại thông tin (số, tên, danh từ số ít/số nhiều). Không bấm nghe lại. Câu nào bỏ lỡ thì đoán một đáp án hợp lý rồi chuyển sang câu tiếp theo."
        - title_vi: "Reading: 20 phút mỗi bài đọc"
          text_vi: "Bài 1 dễ nhất, bài 3 khó nhất. Mục tiêu: xong bài 1 trước phút 18, bài 2 trước phút 38, để khoảng 22 phút cho bài 3. Kẹt một câu quá 90 giây thì đánh dấu, bỏ qua, cuối giờ quay lại. Thi Reading không có thời gian riêng để chép đáp án, nên ghi đáp án ngay khi làm."
        - title_vi: Chấm và quy đổi band
          text_vi: "Đếm số câu đúng trên 40 cho từng kỹ năng. Theo bảng quy đổi trung bình do IELTS công bố: Listening 16 câu ≈ band 5, 23 ≈ 6, 30 ≈ 7, 35 ≈ 8; Academic Reading 15 ≈ 5, 23 ≈ 6, 30 ≈ 7, 35 ≈ 8. Mốc thật thay đổi nhẹ theo từng đề. Muốn đạt 6.5, hãy nhắm khoảng 26–27 câu đúng mỗi kỹ năng."
        - title_vi: Lập nhật ký lỗi theo DẠNG, không theo câu
          text_vi: "Với mỗi câu sai, ghi: số câu, dạng câu (form, MCQ, T/F/NG, headings…), nguyên nhân (không nghe kịp · bẫy sửa thông tin · sai chính tả/số ít-số nhiều · quá số từ · không nhận ra paraphrase · nhầm F với NG · nhầm chủ thể). Sau 3 buổi mock, dạng nào lặp lại nhiều nhất là việc cần luyện ở Buổi 75–76."
      tips:
        - "Bảng quy đổi: ielts.org › IELTS scoring in detail (mốc trung bình 5/6/7/8). Thi thật, mốc có thể lệch 1–2 câu."
        - "Listening Part 1 và Part 2 là phần 'kiếm điểm'. Band 6.5 thường cần gần như tuyệt đối ở Part 1."
        - "Reading bài 3 thường có Yes/No/Not Given và câu hỏi về quan điểm tác giả: đọc câu hỏi trước, tìm đoạn chứa ý kiến (I think, In my view, …) sau."
        - "Chép đáp án xong, soát chính tả và -s số nhiều: đáp án đúng ý nhưng sai chính tả vẫn bị tính sai."
      traps:
        - trap_vi: "Nghe lại nhiều lần trong app nên điểm Listening cao hơn thực lực."
          fix_vi: "Chỉ bấm nghe một lần. Câu nào phải nghe lại mới làm được thì tính sai, ghi vào nhật ký lỗi."
        - trap_vi: "Reading: nhầm Not Given thành False (lỗi riêng của bạn từ Giai đoạn 1)."
          fix_vi: "Chỉ chọn F khi bài nói ĐIỀU NGƯỢC LẠI. Bài không nhắc tới (giá cả, lương, kết quả…) thì chọn NG."
        - trap_vi: "Nhầm chủ thể khi bài có hai đối tượng giống nhau (ong mật và ong hoang dã; nhóm làm việc nhàm chán và nhóm còn lại)."
          fix_vi: "Gạch chân chủ ngữ trong câu hỏi, rồi tìm đúng chủ ngữ đó trong bài trước khi so sánh động từ."
        - trap_vi: "Viết quá số từ cho phép (VD: 'the sheepskin' khi đề cho tối đa hai từ, hoặc thêm 'a/the' không cần)."
          fix_vi: "Đọc lại dòng NO MORE THAN … WORDS. Bỏ mạo từ nếu không cần."
        - trap_vi: "Bị bẫy sửa thông tin ở Part 1 (người nói đổi ý: 'Sorry, I mean…', 'Actually…')."
          fix_vi: "Nghe đến hết lượt nói. Đáp án là thông tin CUỐI CÙNG được xác nhận."
      phrases:
        - en: "Sorry, did you say …?"
          vi: "Xin lỗi, bạn vừa nói … à?"
          note_vi: "Tín hiệu bẫy Part 1: đáp án đúng thường đến ngay sau câu này."
        - en: "Actually, …"
          vi: "Thật ra là …"
          note_vi: "Người nói sắp sửa lại thông tin trước đó."
        - en: "So the earliest would be …"
          vi: "Vậy sớm nhất là …"
        - en: "That's been postponed until next year."
          vi: "Việc đó đã bị hoãn sang năm sau."
          note_vi: "Phương án bị 'hoãn' thường là phương án nhiễu trong MCQ."
        - en: "In my view, this is a genuine loss."
          vi: "Theo tôi, đây là một mất mát thật sự."
          note_vi: "Câu nêu quan điểm tác giả → dùng cho Yes/No/Not Given."
    - type: exercises
      items:
        - id: b66-x1
          bank_no: 18
          kind: completion
          instructions_vi: "LISTENING PART 1 · Câu 1–10. Hoàn thành phiếu đăng ký. Viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống. Chỉ nghe MỘT lần."
          max_words: 3
          audio_text: |-
            Woman: Good morning, Riverside Sports Centre. How can I help?
            Man: Hi, I'd like to become a member. Can I do that over the phone?
            Woman: Of course. Let me take some details. What's your name, please?
            Man: Daniel Harper.
            Woman: Is that H-A-R-P-E-R?
            Man: That's right.
            Woman: And your address?
            Man: Eighteen Mill Road, in Eastfield.
            Woman: Sorry, did you say Hill Road?
            Man: No, Mill. M-I-L-L.
            Woman: Thanks. And the postcode?
            Man: It's E-F-3, 7-L-T.
            Woman: Lovely. Now, we have two types of membership. Standard membership lets you come at any time, and off-peak is only before four p.m. on weekdays.
            Man: I work during the day, so I'll need to come in the evenings. I'd better take the standard one.
            Woman: OK. Are you interested in any of our classes?
            Man: Yes. A friend recommended the yoga class, but I see that's on Monday mornings. Is there anything on Thursday evenings?
            Woman: On Thursdays we have pilates at seven.
            Man: Pilates sounds good. I'll try that.
            Woman: Standard membership is normally thirty-five pounds a month, but this month there's a discount for new members, so you'd pay twenty-eight pounds.
            Man: Great.
            Woman: For your first session, you'll need to bring a photo for your membership card. Towels are provided, so you don't need one.
            Man: OK.
            Woman: Do you have any health problems we should know about?
            Man: Well, I hurt my knee playing football last year, so I sometimes have a problem with it.
            Woman: I'll make a note. And how did you hear about us? Was it our website?
            Man: Actually, I saw an advertisement in the local newspaper.
            Woman: Good to know. When would you like to start?
            Man: Is the fourth of October possible?
            Woman: Our induction sessions are on Saturdays, so the earliest would be Saturday the eleventh.
            Man: Then I'll start on the eleventh.
          passage: |-
            RIVERSIDE SPORTS CENTRE — NEW MEMBER FORM
            Name: Daniel (1) ___
            Address: 18 (2) ___ Road, Eastfield
            Postcode: (3) ___
            Membership type: (4) ___
            Class chosen: (5) ___ on Thursday evenings
            Monthly fee this month: £(6) ___
            Bring to first session: a (7) ___
            Health problem: bad (8) ___
            Found out about the centre from: an advertisement in the local (9) ___
            Start date: (10) ___ October
          questions:
            - q: (1)
              answer: Harper
              explain_vi: "Tên được đánh vần H-A-R-P-E-R. Viết hoa chữ đầu tên riêng."
            - q: (2)
              answer: Mill
              explain_vi: "Bẫy: người nghe đoán 'Hill', người nói sửa lại và đánh vần M-I-L-L."
            - q: (3)
              answer: EF3 7LT
              accept:
                - EF37LT
            - q: (4)
              answer: standard
              explain_vi: "Anh ấy làm việc ban ngày nên không chọn off-peak (chỉ trước 4 giờ chiều ngày thường)."
            - q: (5)
              answer: pilates
              explain_vi: "Yoga là phương án nhiễu: lớp yoga vào sáng thứ Hai."
            - q: (6)
              answer: "28"
              accept:
                - twenty-eight
                - twenty eight
              explain_vi: "35 là giá thường; tháng này được giảm còn 28."
            - q: (7)
              answer: photo
              accept:
                - photograph
              explain_vi: "Khăn tắm (towel) đã có sẵn, không cần mang."
            - q: (8)
              answer: knee
            - q: (9)
              answer: newspaper
              explain_vi: "Nhân viên đoán 'website', người nói sửa: 'Actually, … newspaper'."
            - q: (10)
              answer: "11"
              accept:
                - 11th
                - eleventh
              explain_vi: "Ngày 4 không được vì buổi hướng dẫn rơi vào thứ Bảy; sớm nhất là thứ Bảy ngày 11."
        - id: b66-x2
          bank_no: 20
          kind: mcq
          instructions_vi: "LISTENING PART 2 · Câu 11–15. Chọn đáp án đúng A, B, C hoặc D."
          audio_text: "Good afternoon, everyone, and welcome to the Greenway Community Garden. My name's Laura and I coordinate the volunteers here. Before we walk round, let me tell you a little about the garden. It was opened eight years ago on land that used to be a car park. Many people assume the local council created it, but in fact it was a group of parents from the primary school next door who raised the money, although the council did agree to rent us the land for a very small amount. At the moment we have about sixty regular volunteers. When we started, most of them were retired people, and they're still very important to us, but the biggest group now is students from the college, who come to get practical experience for their courses. People often ask what happens to the vegetables we grow. We used to sell them at a weekly market, but that took a lot of time, so now everything goes to a food bank in the town centre, apart from a few herbs we use in our cooking workshops. Speaking of workshops, they've been very popular. This year we're adding a new one on keeping bees. We had planned a course on making furniture from recycled wood, but we couldn't find an instructor, so that's been postponed until next year."
          questions:
            - q: "11 · Who raised the money to create the garden?"
              options:
                - the local council
                - a group of parents
                - college students
                - retired people
              answer: b
              explain_vi: "'Many people assume the council…, but in fact it was a group of parents' — hội đồng chỉ cho thuê đất."
            - q: "12 · Before the garden was opened, the land was"
              options:
                - a school playground.
                - a car park.
                - a market.
                - a farm.
              answer: b
            - q: "13 · Which group of volunteers is now the largest?"
              options:
                - retired people
                - parents
                - college students
                - local office workers
              answer: c
              explain_vi: "Người về hưu là nhóm đông nhất LÚC ĐẦU (when we started); bây giờ là sinh viên."
            - q: "14 · What happens to most of the vegetables now?"
              options:
                - They are sold at a weekly market.
                - They are used in cooking workshops.
                - They are given to a food bank.
                - Volunteers take them home.
              answer: c
              explain_vi: "Chợ hằng tuần là cách làm cũ (used to). Chỉ vài loại rau thơm dùng cho lớp nấu ăn."
            - q: "15 · Which new workshop will start this year?"
              options:
                - making furniture from recycled wood
                - keeping bees
                - cooking with herbs
                - repairing greenhouses
              answer: b
              explain_vi: "Lớp làm đồ gỗ tái chế bị hoãn (postponed) sang năm sau."
        - id: b66-x3
          bank_no: 18
          kind: completion
          instructions_vi: "LISTENING PART 2 · Câu 16–20. Hoàn thành ghi chú. Viết MỘT TỪ cho mỗi chỗ trống."
          max_words: 1
          audio_text: "Now let me explain where things are as we walk. Just inside the main gate on your left is the tool shed. Volunteers must sign the book there before they borrow any tools. Next to the shed is the children's area, where we grow strawberries, because children love picking them. In the middle of the garden is the pond, which we dug three years ago to attract frogs and insects that eat the pests on our plants, so we don't need to use chemicals. Beyond the pond you'll see the greenhouse. It was built using four hundred plastic bottles that were collected by local schools. And the last thing I want to show you is the compost area in the far corner. Last year, we turned around two tonnes of food waste from local cafés into compost. If you'd like to join us, volunteer sessions take place every Wednesday and Saturday morning, starting at half past nine."
          passage: |-
            GREENWAY GARDEN — TOUR NOTES
            • Tool shed: volunteers must sign the (16) ___ before borrowing tools
            • Children's area: children enjoy picking (17) ___
            • Pond: attracts frogs and insects, so no (18) ___ are needed
            • Greenhouse: made from 400 plastic (19) ___ collected by schools
            • Compost area: about two (20) ___ of food waste turned into compost last year
          questions:
            - q: (16)
              answer: book
            - q: (17)
              answer: strawberries
              explain_vi: "Danh từ số nhiều — thiếu -s là sai."
            - q: (18)
              answer: chemicals
            - q: (19)
              answer: bottles
            - q: (20)
              answer: tonnes
              accept:
                - tons
        - id: b66-x4
          bank_no: 20
          kind: mcq
          instructions_vi: "LISTENING PART 3 · Câu 21–25. Hai sinh viên Sophie và Tom bàn về dự án. Chọn đáp án đúng."
          audio_text: |-
            Man: Hi Sophie. Have you got a minute to talk about our project on food waste in the canteen?
            Woman: Sure, Tom. I've been looking at the survey results. I was surprised that most of the waste isn't from students leaving food on their plates.
            Man: Really? I assumed that would be the main cause.
            Woman: So did I, but the kitchen manager told me that over half of it is food that's cooked but never served, because they prepare too much at lunchtime.
            Man: That's a useful point. So our recommendations should focus on planning in the kitchen rather than on persuading students.
            Woman: Exactly. Although I still think we should include something about portion sizes.
            Man: Fine. What about the method? Our tutor said our questionnaire was too long.
            Woman: Yes, she said that's probably why only forty people completed it. I think we should do short interviews instead.
            Man: I'm not sure. Interviews take a lot of time. What if we keep the questionnaire but cut it to ten questions?
            Woman: OK, that's a reasonable compromise. And we could put it online rather than on paper.
            Man: Good. Now, the deadline. The tutor has given us an extra week, so it's due on the twentieth, not the thirteenth.
            Woman: That's a relief. But I'd like to finish the draft by the thirteenth anyway, so we have time to check it.
          questions:
            - q: "21 · What surprised Sophie about the survey results?"
              options:
                - Most waste came from students' plates.
                - Most waste was food that was never served.
                - The kitchen cooked too little food.
                - Students wanted bigger portions.
              answer: b
            - q: "22 · What do they agree their recommendations should focus on?"
              options:
                - persuading students
                - planning in the kitchen
                - reducing prices
                - using smaller plates
              answer: b
              explain_vi: "Portion sizes chỉ là ý Sophie muốn THÊM vào, không phải trọng tâm."
            - q: "23 · According to the tutor, why did few people complete the questionnaire?"
              options:
                - It was too long.
                - It was only on paper.
                - Students were too busy.
                - The questions were unclear.
              answer: a
            - q: "24 · What do they decide to do about the method?"
              options:
                - replace the questionnaire with interviews
                - use both interviews and a questionnaire
                - shorten the questionnaire and put it online
                - stop collecting data
              answer: c
              explain_vi: "Sophie đề xuất phỏng vấn, Tom phản đối; hai bạn thỏa hiệp: rút còn 10 câu và làm online."
            - q: "25 · When is the project now due?"
              options:
                - the 10th
                - the 13th
                - the 20th
                - the 27th
              answer: c
              explain_vi: "Ngày 13 là hạn cũ và cũng là hạn Sophie tự đặt cho bản nháp, không phải hạn nộp."
        - id: b66-x5
          bank_no: 21
          kind: mcq
          instructions_vi: "LISTENING PART 3 · Câu 26–30. Ai sẽ viết từng phần của báo cáo? Chọn A (Sophie), B (Tom) hoặc C (cả hai cùng viết)."
          audio_text: |-
            Man: Sophie, let's divide up the report. Who's doing the introduction?
            Woman: I don't mind doing it, but you know the background better, Tom. Why don't you write it?
            Man: OK, I'll do the introduction. What about the literature review? There's a lot of reading.
            Woman: That's too much for one person. Let's both do it, and then put our notes together.
            Man: Agreed. And the methods section?
            Woman: I designed most of the questionnaire, so I'd better write that.
            Man: Fine. The results will need graphs. I'm better with spreadsheets, so leave that to me.
            Woman: Thanks. That leaves the conclusion. I'd prefer to write it with you, because it has to match both our parts.
            Man: True. We'll do it together, then.
          questions:
            - q: "26 · Introduction"
              options:
                - Sophie
                - Tom
                - both
              answer: b
              explain_vi: "Sophie nói 'I don't mind doing it' nhưng rồi đề nghị Tom viết — đừng chọn theo câu đầu tiên."
            - q: "27 · Literature review"
              options:
                - Sophie
                - Tom
                - both
              answer: c
            - q: "28 · Methods"
              options:
                - Sophie
                - Tom
                - both
              answer: a
            - q: "29 · Results"
              options:
                - Sophie
                - Tom
                - both
              answer: b
            - q: "30 · Conclusion"
              options:
                - Sophie
                - Tom
                - both
              answer: c
        - id: b66-x6
          bank_no: 18
          kind: completion
          instructions_vi: "LISTENING PART 4 · Câu 31–40. Bài giảng về hiệu ứng đảo nhiệt đô thị. Viết MỘT TỪ cho mỗi chỗ trống."
          max_words: 1
          audio_text: "Today's lecture is about the urban heat island effect, the fact that cities are often several degrees warmer than the countryside around them. The difference is usually greatest at night. During the day, buildings and roads absorb heat from the sun, and after sunset they release it slowly, so the city cannot cool down. There are several causes. The first is the materials we build with. Dark surfaces such as asphalt absorb up to ninety per cent of the sunlight that falls on them. The second is the lack of vegetation. Trees cool the air in two ways: they provide shade, and they release water through their leaves. A third cause is waste heat from human activity, for example from cars, factories and, increasingly, air conditioners, which, ironically, make the street outside even hotter. Why does this matter? The most serious consequence is for health. During heatwaves, death rates rise sharply, and elderly people are most at risk. Higher temperatures also increase the demand for electricity, and they make air quality worse, because heat speeds up the chemical reactions that produce smog. So what can cities do? One simple solution is to paint roofs white, which reflects sunlight. In one study, white roofs reduced the temperature inside buildings by about three degrees. Another option is the green roof, which is covered with plants. Green roofs are more expensive to build, but they also absorb rainwater, which reduces the risk of flooding. Finally, many cities are planting more trees along their streets. One Australian city, for example, aims to double its tree cover over the next twenty years. However, planners must choose species carefully: the trees need to survive drought, and their roots must not damage pipes under the street."
          passage: |-
            THE URBAN HEAT ISLAND EFFECT
            Basic idea
            • Cities are warmer than the countryside, especially at (31) ___
            Causes
            • Dark surfaces, e.g. (32) ___, absorb up to 90% of sunlight
            • Lack of vegetation: trees give shade and release (33) ___ through their leaves
            • Waste heat from cars, factories and air (34) ___
            Effects
            • Health: death rates rise during heatwaves; (35) ___ people are at greatest risk
            • Higher demand for (36) ___
            • Worse air quality: heat speeds up reactions that produce (37) ___
            Solutions
            • White roofs reflect sunlight; buildings about 3 degrees cooler inside
            • Green roofs: more expensive, but also absorb (38) ___, reducing flood risk
            • Street trees: one Australian city plans to (39) ___ its tree cover
            • Tree species must survive (40) ___; roots must not damage pipes
          questions:
            - q: (31)
              answer: night
            - q: (32)
              answer: asphalt
              explain_vi: "Từ khó chính tả: a-s-p-h-a-l-t. Sai một chữ cái là mất điểm."
            - q: (33)
              answer: water
            - q: (34)
              answer: conditioners
              explain_vi: "Số nhiều: air conditioners."
            - q: (35)
              answer: elderly
              accept:
                - old
                - older
            - q: (36)
              answer: electricity
            - q: (37)
              answer: smog
            - q: (38)
              answer: rainwater
              accept:
                - rain
            - q: (39)
              answer: double
            - q: (40)
              answer: drought
              explain_vi: "drought /draʊt/ — hạn hán. Đừng nhầm với 'draught'."
        - id: b66-x7
          bank_no: 20
          kind: tf
          instructions_vi: "SAU KHI CHẤM · Luyện bẫy sửa thông tin (dạng hay mất điểm ở Part 1). Nghe một lần, chọn Đúng (T) hoặc Sai (F). Không tính vào điểm 40 câu."
          audio_text: |-
