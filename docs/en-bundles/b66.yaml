            THE PENCIL: A SHORT HISTORY

            A  For something so ordinary, the pencil has a surprisingly long and complicated history. Its story begins in the middle of the sixteenth century in Borrowdale, a valley in the north-west of England, where local people discovered a large deposit of an unusual black mineral. According to local tradition, shepherds were the first to find a use for it: they used lumps of the substance to mark their sheep so that they could tell their own animals from their neighbours'.

            B  At the time, nobody understood what the material was. Because it left a dark grey mark, similar to the mark left by lead, it was believed to be a type of lead, and it was given names such as 'plumbago', from the Latin word for lead. It was not until the late eighteenth century that chemists showed it was in fact a form of carbon, and it was renamed 'graphite', from a Greek word meaning 'to write'. Even so, the old name has never disappeared. People still talk about pencil 'lead', although no pencil has ever contained it.

            C  The Borrowdale graphite was remarkably pure, and it soon became extremely valuable — not mainly for writing, but because it could be used to line the moulds in which cannonballs were made. As a result, the mine was guarded, and the amount removed each year was strictly controlled. Stealing graphite became such a problem that, in the eighteenth century, the British Parliament made it a serious crime.

            D  The first pencils were simply sticks of graphite. Because graphite is soft, breaks easily and leaves marks on the hands, users wrapped the sticks in string or sheepskin. Later, craftsmen began placing the graphite inside a wooden holder, and this basic design — a core surrounded by wood — has remained almost unchanged ever since.

            E  The next major development came from France. In the 1790s, France was at war with Britain and could no longer obtain English graphite. The French government asked an inventor, Nicolas-Jacques Conté, to find a solution. Conté discovered that he could grind lower-quality graphite into powder, mix it with clay and water, shape the mixture into thin rods and then heat them in a kiln. His method had an important advantage: by changing the amount of clay, manufacturers could control how hard or soft the pencil was. More clay produced a harder pencil and a lighter line, while less clay produced a softer pencil and a darker line. The letters still printed on many pencils today — H for 'hard' and B for 'black' — reflect this system.

            F  In the nineteenth century, pencil production became an industry. Factories in Germany, and later in the United States, produced pencils in enormous quantities. In 1858, an American, Hymen Lipman, received a patent for attaching a rubber to the end of a pencil, although the patent was later declared invalid. Interestingly, in many European countries, pencils are still commonly sold without one.

            G  Towards the end of the century, the pencil's appearance changed too. According to a popular story, one manufacturer began painting its best pencils yellow, a colour which many buyers associated with luxury and with China, the source of some of the finest graphite at that time. The colour became so popular that other manufacturers copied it, and in North America, at least, the yellow pencil is still the standard image of a pencil.

            H  Today, despite computers and tablets, billions of pencils are made every year. Artists value them for the wide range of tones they can produce, while engineers and carpenters prefer them because their marks can be erased. Perhaps the pencil's greatest strength, however, is its reliability: it works in extreme cold and upside down — which is one reason why pencils have been taken into space.
