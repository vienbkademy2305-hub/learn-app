            THE UNEXPECTED VALUE OF BOREDOM

            A  Few experiences are as widely disliked as boredom. We fill every spare moment — waiting for a bus, standing in a queue, even pausing at traffic lights — by reaching for our phones. Many people, it seems, would rather do almost anything than sit alone with their thoughts. In one widely reported experiment in the United States, a number of participants who were left alone in a room for a short period chose to give themselves a mild electric shock rather than simply sit and think. Boredom, it seems, is something we will go to considerable lengths to avoid.

            B  Yet a growing body of research suggests that this may be a mistake. Psychologists now argue that boredom is not simply an unpleasant feeling but a signal — a message from the brain that our current activity is not meeting our needs and that we should look for something more meaningful. Like pain or hunger, boredom is uncomfortable precisely because it is meant to make us act. Seen in this way, the problem is not boredom itself but the way we respond to it.

            C  Some of the most interesting evidence concerns creativity. In a study carried out in Britain, one group of participants was given a deliberately dull task — copying numbers from a telephone directory — before being asked to think of as many uses as possible for a pair of plastic cups. A second group went straight to the creative task. The participants who had been bored produced more ideas, and more original ones. The researchers suggested that boredom encourages the mind to wander, and that daydreaming allows us to make unusual connections between ideas.

            D  I find this research persuasive, but it should be interpreted with care. Not all boredom is equally useful. The short, mild boredom of a long train journey is very different from the chronic boredom of a person stuck in an unsatisfying job for years, which has been linked to depression, overeating and other harmful behaviours. To claim that boredom is simply 'good for us' would be just as misleading as to claim that it is always bad.

            E  What, then, has changed? Boredom is hardly a new experience, but our ability to escape it is. Smartphones offer an unlimited supply of short, easy entertainment, and they are always within reach. The result is that many of us — and children in particular — rarely experience boredom long enough for it to lead anywhere. In my view, this is a genuine loss. A child who is never allowed to be bored never has to discover what he or she really enjoys doing.

            F  This does not mean that parents should take away all screens or that adults should force themselves to sit in empty rooms. A more realistic approach is to build small periods of unstructured time into the day: a walk without headphones, a journey without a phone, an evening without plans. Some schools have begun experimenting with 'quiet time', when pupils are free to do nothing at all. It is too early to know whether such schemes will have lasting effects, but the idea deserves serious attention. Boredom, after all, may be the price we pay for an imagination of our own.
