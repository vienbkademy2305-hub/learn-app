            BEES ON THE ROOF

            A  Ten years ago, a beehive on the roof of an office building would have seemed strange. Today, hives can be found on hotels, museums, schools and even railway stations in many large cities. In some city centres, the number of hives has risen so quickly that local beekeeping associations have struggled to keep up with requests for training. For many companies, a rooftop hive has become a symbol of their commitment to the environment, and some even give jars of 'office honey' to clients as gifts.

            B  The popularity of urban beekeeping is closely connected with public concern about the decline of bees. Over the past few decades, news reports have regularly described large losses of honeybee colonies, and many people have concluded that keeping a hive is a simple way to help. The argument seems reasonable: bees pollinate crops and wild flowers, so more bees should mean a healthier environment.

            C  However, a growing number of ecologists believe that this argument is based on a misunderstanding. The honeybee is just one of many bee species. In Britain, for example, there are around 270 species of bee, and only one of them is the honeybee; the rest are bumblebees and solitary bees, most of which do not live in hives at all. It is these wild species, not honeybees, that face the greatest threat. Honeybees are managed by humans, who can replace a lost colony by buying a new one. Wild bees have no such protection.

            D  In fact, researchers have suggested that too many honeybees may harm wild bees. A single hive can contain tens of thousands of bees, all collecting nectar and pollen from the same flowers that wild bees depend on. Where flowers are limited, as they often are in cities, wild bees may simply not find enough food. Some studies have also shown that diseases can spread from managed honeybees to wild species through shared flowers. In one large city, scientists calculated that the number of hives had grown faster than the supply of flowers, meaning that each colony had less food available than before.

            E  This does not mean that urban beekeeping is always harmful. Experienced beekeepers point out that hives in cities are often healthier than those in the countryside, because city gardens and parks contain a wide variety of plants and are exposed to fewer agricultural chemicals. Beekeeping can also raise public awareness of the importance of insects and encourage people to learn more about nature. The problem, critics argue, is not beekeeping itself but beekeeping without planning.

            F  So what should individuals and businesses do if they want to help bees? Most experts agree that the most effective action is to increase the number of flowers. Planting a range of species that flower at different times of year provides food for both honeybees and wild bees from spring until autumn. Leaving areas of grass uncut, and providing nesting places such as piles of dead wood or 'bee hotels', can also make a significant difference. For those who still want to keep honeybees, the advice is to find out how many hives already exist nearby, and to plant enough flowers to support any new colony before installing it.
