grammar:
  - id: en-g3-09
    lesson: buoi-54-suc-khoe-noun-clauses
    title: "Mệnh đề danh từ: What … is … · that … · whether … · how/why …"
    cefr: B2
    structures:
      - "What + S + V + is/was …   (làm chủ ngữ):  What worries doctors is the rise in obesity."
      - "It is + adj + that + S + V:  It is clear that prevention is cheaper than cure."
      - "S + V + whether / if + S + V:  Nobody knows whether the campaign will work."
      - "S + V + how / why / what + S + V (không đảo ngữ):  Researchers want to know why life expectancy fell."
      - "The fact that + S + V + …:  The fact that vaccination is free has increased coverage."
    explain: >-
      Mệnh đề danh từ là một mệnh đề đóng vai trò như DANH TỪ trong câu (chủ ngữ hoặc tân ngữ). Chúng giúp bạn nói về một
      Ý TƯỞNG, một SỰ VIỆC chứ không chỉ một vật. Trong Writing Task 2, 'What worries experts most is …' và 'It is widely
      accepted that …' là cách mở câu nhấn mạnh, học thuật; 'whether' giúp bàn về điều chưa chắc. Lưu ý quan trọng: sau
      how/why/what/whether, câu KHÔNG đảo trợ động từ (như câu hỏi tường thuật ở Buổi 35).
    table:
      - [Mở đầu, Chức năng, Ví dụ]
      - ["What … is …", "nhấn mạnh (chủ ngữ)", "What concerns doctors is the lack of exercise."]
      - ["It is + adj + that …", "nêu nhận định", "It is widely accepted that smoking causes cancer."]
      - ["The fact that …", "nêu sự thật làm chủ ngữ", "The fact that sugar is cheap makes it hard to reduce."]
      - ["whether …", "điều chưa chắc", "It is unclear whether the tax will change habits."]
      - ["why / how …", "tân ngữ, không đảo ngữ", "Scientists are studying why some people never get ill."]
    notes:
      - "What … is: động từ is/was chia theo MỆNH ĐỀ, thường số ít: What worries me IS …"
      - "whether (or not) dùng tốt hơn if khi đứng đầu câu hoặc sau giới từ: Whether the plan works depends on funding."
      - "Không bỏ 'that' trong văn viết sau It is + adj."
    mistakes:
      - { wrong: "What worries doctors are the rise in obesity.", right: "What worries doctors is the rise in obesity.", why: "Chủ ngữ là cả mệnh đề What … → động từ số ít." }
      - { wrong: "Scientists want to know why do some people live longer.", right: "Scientists want to know why some people live longer.", why: "Mệnh đề danh từ không đảo trợ động từ." }
      - { wrong: "Nobody knows that the campaign will work or not.", right: "Nobody knows whether the campaign will work (or not).", why: "Điều chưa chắc → whether, không dùng that." }
    examples: [b54-001, b54-002, b54-003, b54-004]
    provenance: []

sentences:
  - { id: b54-001, text: "What worries doctors most is the rise in chronic diseases among young people.", vi: "Điều khiến các bác sĩ lo nhất là sự gia tăng bệnh mãn tính ở người trẻ.", words: [chronic-disease|phr-n], grammar: [en-g3-09], cefr: B2 }
  - { id: b54-002, text: "It is widely accepted that prevention is cheaper than treatment.", vi: "Người ta thừa nhận rộng rãi rằng phòng ngừa rẻ hơn điều trị.", words: [prevention|n], grammar: [en-g3-09], cefr: B2 }
  - { id: b54-003, text: "Nobody knows whether the new campaign will improve people's mental health.", vi: "Không ai biết liệu chiến dịch mới có cải thiện sức khỏe tinh thần của người dân không.", words: [mental-health|phr-n, campaign|n], grammar: [en-g3-09], cefr: B2 }
  - { id: b54-004, text: "Researchers are studying why life expectancy is higher in some regions.", vi: "Các nhà nghiên cứu đang tìm hiểu vì sao tuổi thọ ở một số vùng cao hơn.", words: [life-expectancy|phr-n], grammar: [en-g3-09], cefr: B2 }
  - { id: b54-005, text: "The fact that vaccination is free has helped to stop several outbreaks.", vi: "Việc tiêm chủng miễn phí đã giúp ngăn chặn một số đợt bùng phát.", words: [vaccination|n, outbreak|n], grammar: [en-g3-09], cefr: C1 }
  - { id: b54-006, text: "Good hygiene and clean water reduce the spread of infectious diseases.", vi: "Vệ sinh tốt và nước sạch giảm sự lây lan của bệnh truyền nhiễm.", words: [hygiene|n, infectious|adj], grammar: [], cefr: B2 }
  - { id: b54-007, text: "Better sanitation has improved public health in many developing countries.", vi: "Hệ thống vệ sinh tốt hơn đã cải thiện sức khỏe cộng đồng ở nhiều nước đang phát triển.", words: [sanitation|n, public-health|phr-n], grammar: [en-g2-01], cefr: B2 }
  - { id: b54-008, text: "Regular check-ups are a simple form of preventive medicine.", vi: "Khám định kỳ là một hình thức y học phòng ngừa đơn giản.", words: [check-up|n, preventive|adj], grammar: [], cefr: B2 }
  - { id: b54-009, text: "Good nutrition and a balanced diet are essential for children's development.", vi: "Dinh dưỡng tốt và chế độ ăn cân bằng là thiết yếu cho sự phát triển của trẻ.", words: [nutrition|n, balanced-diet|phr-n], grammar: [], cefr: B1 }
  - { id: b54-010, text: "Spending time in nature improves both physical and mental well-being.", vi: "Dành thời gian với thiên nhiên cải thiện cả sức khỏe thể chất lẫn tinh thần.", words: [well-being|n], grammar: [en-g2-21], cefr: B2 }
  - { id: b54-011, text: "Some experts warn that there is an epidemic of loneliness in big cities.", vi: "Một số chuyên gia cảnh báo có một 'đại dịch' cô đơn ở các thành phố lớn.", words: [epidemic|n], grammar: [en-g3-09], cefr: C1 }

lesson:
  slug: buoi-54-suc-khoe-noun-clauses
  number: 54
  stage: 3
  title_vi: "Sức khỏe cộng đồng · Mệnh đề danh từ"
  focus: { grammar: "Mệnh đề danh từ (What … is, It is clear that, whether, how/why)", skill: "Listening Part 4 — bài giảng: ý chính, số liệu và thái độ người nói" }
  target_band: "6.0-6.5"
  steps:
    - type: vocabulary
      items: [public-health|phr-n, vaccination|n, epidemic|n, outbreak|n, infectious|adj, life-expectancy|phr-n, chronic-disease|phr-n, mental-health|phr-n, preventive|adj, nutrition|n, well-being|n, hygiene|n, sanitation|n, check-up|n, balanced-diet|phr-n, healthcare|n, diet|n]
    - type: pronunciation
      notes:
        - { word: epidemic|n, text_vi: "ep-i-DEM-ic: nhấn âm 3 (đuôi -ic kéo trọng âm về ngay trước)." }
        - { word: hygiene|n, text_vi: "HAI-jeen /ˈhaɪ.dʒiːn/: y đọc /aɪ/, g đọc /dʒ/." }
        - { word: chronic-disease|phr-n, text_vi: "KRON-ik di-ZEEZ: ch = /k/; disease có /z/ hai lần." }
        - { word: nutrition|n, text_vi: "nu-TRI-tion: nhấn âm 2 (đuôi -tion)." }
        - { word: life-expectancy|phr-n, text_vi: "ex-PEC-tan-cy: nhấn âm 2 của expectancy." }
    - type: grammar
      items: [en-g3-09]
    - type: skill
      skill: listening
      title_vi: "Listening Part 4 — ý chính, số liệu và thái độ người nói"
      intro_vi: "Buổi 39 và 43 đã luyện theo dõi bài giảng dài và dạng flowchart/diagram. Ở band 6.5+, Part 4 thử thách thêm hai điểm: (1) phân biệt SỐ LIỆU gần nhau (người nói nhắc nhiều con số, năm, phần trăm — chỉ một cái là đáp án); (2) nhận ra THÁI ĐỘ và mức độ chắc chắn của người nói (surprisingly, unfortunately, it is unclear whether…). Mệnh đề danh từ xuất hiện rất nhiều trong bài giảng: 'What is interesting is that…', 'The question is whether…' — đó là tín hiệu thông tin quan trọng sắp tới."
      steps:
        - { title_vi: "Đọc câu hỏi, gạch loại thông tin", text_vi: "Số (năm? phần trăm? tuổi?), danh từ, tính từ thái độ. Ghi chú bên cạnh: %, yr, adj." }
        - { title_vi: "Nghe tín hiệu nhấn mạnh", text_vi: "'What is surprising is that…', 'The key point is…', 'What researchers found was…' → thông tin ngay sau là đáp án thường gặp." }
        - { title_vi: "Ghi mọi con số, gạch sau", text_vi: "Khi có nhiều số, ghi nhanh cả hai ('1990: 67 → now: 74'), rồi chọn theo câu hỏi (năm nào? tăng bao nhiêu?)." }
        - { title_vi: "Nghe từ chỉ thái độ", text_vi: "surprisingly, unfortunately, encouragingly, it remains unclear whether → câu hỏi về ý kiến người nói dựa vào những từ này." }
        - { title_vi: "Kiểm tra chính tả thuật ngữ", text_vi: "vaccination, nutrition, sanitation, hygiene — đáp án đúng nghĩa nhưng sai chính tả vẫn bị tính sai." }
      tips:
        - "'It is unclear whether…' = người nói KHÔNG chắc; đừng chọn đáp án khẳng định."
        - "Số tăng: rose from X to Y — câu hỏi 'now' là Y, câu hỏi 'in the past' là X, câu hỏi 'by how much' là Y − X."
        - "Part 4 có thể không có ví dụ đầu — luôn đọc câu 31 trước khi bài nghe bắt đầu."
      traps:
        - { trap_vi: "Điền con số nghe đầu tiên.", fix_vi: "Nghe hết câu: '…fell from 30% to 12%' — câu hỏi hỏi con số nào?" }
        - { trap_vi: "Bỏ qua 'not' hoặc 'unclear'.", fix_vi: "Gạch ý phủ định/không chắc chắn khi ghi chú." }
        - { trap_vi: "Sai chính tả thuật ngữ y tế.", fix_vi: "Học chính tả các từ của buổi: hygiene, sanitation, vaccination." }
      phrases:
        - { en: "What is interesting is that …", vi: "Điều thú vị là …", note_vi: "Tín hiệu thông tin quan trọng." }
        - { en: "The question is whether …", vi: "Vấn đề là liệu …" }
        - { en: "It remains unclear whether …", vi: "Vẫn chưa rõ liệu …", note_vi: "Người nói không chắc chắn." }
        - { en: "Surprisingly, …", vi: "Đáng ngạc nhiên là, …" }
        - { en: "The main reason why … is that …", vi: "Lý do chính khiến … là …" }
      demo:
        title_vi: "Làm mẫu: chọn đúng con số và thái độ"
        text_en: |-
          Lecture: "In 1990, average life expectancy in the country was sixty-seven. By 2020, it had risen to seventy-four. What is surprising is that the biggest improvement came not from new medicines but from clean water and better sanitation. However, it remains unclear whether this trend will continue, as chronic diseases are becoming more common."

          Notes:  Life expectancy in 2020: ______   Main cause of improvement: clean water and ______   Speaker's view of the future: ______ (certain / uncertain)
        notes:
          - { label: "74", text_vi: "Câu hỏi 2020 → số thứ hai. 67 là năm 1990 (bẫy)." }
          - { label: "sanitation", text_vi: "Sau 'What is surprising is that…' — tín hiệu đáp án. 'not from new medicines' loại bẫy." }
          - { label: "uncertain", text_vi: "'it remains unclear whether' = không chắc chắn." }
    - type: examples
      items: [b54-001, b54-002, b54-003, b54-004, b54-005, b54-006, b54-007, b54-008, b54-009, b54-010, b54-011]
    - type: dialogue
      title_vi: "Khám sức khỏe định kỳ"
      lines:
        - { speaker: A, text: "When did you last have a check-up?", vi: "Lần cuối cậu khám sức khỏe định kỳ là khi nào?" }
        - { speaker: B, text: "Honestly, I can't remember whether it was two or three years ago.", vi: "Thật lòng tớ không nhớ là hai hay ba năm trước nữa." }
        - { speaker: A, text: "That's quite a long time. What my doctor always says is that prevention is better than cure.", vi: "Khá lâu đấy. Điều bác sĩ của tớ luôn nói là phòng bệnh hơn chữa bệnh." }
        - { speaker: B, text: "I know, but I feel fine. I eat a balanced diet and I exercise.", vi: "Tớ biết, nhưng tớ thấy khỏe mà. Tớ ăn uống cân bằng và có tập thể dục." }
        - { speaker: A, text: "The problem is that many chronic diseases have no symptoms at first.", vi: "Vấn đề là nhiều bệnh mãn tính lúc đầu không có triệu chứng." }
        - { speaker: B, text: "Really? I didn't know that high blood pressure could be silent.", vi: "Thật à? Tớ không biết là huyết áp cao có thể không có dấu hiệu." }
        - { speaker: A, text: "Exactly. And it's also worth asking how your mental health is, not just your body.", vi: "Chính xác. Và cũng nên hỏi về sức khỏe tinh thần của cậu nữa, không chỉ cơ thể." }
        - { speaker: B, text: "OK, you've convinced me. I'll book an appointment this week.", vi: "Được rồi, cậu thuyết phục được tớ rồi. Tuần này tớ sẽ đặt lịch khám." }
    - type: exercises
      items:
        - id: b54-x1
          bank_no: 18
          kind: completion
          instructions_vi: "Part 4: nghe bài giảng (nghe 1 lần) và hoàn thành ghi chú. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống. Chú ý các con số gần nhau và từ chỉ thái độ. (Quốc gia và số liệu là giả định.)"
          max_words: 1
          audio_text: "Today I want to look at how one country improved public health over thirty years. In 1990, average life expectancy was sixty-seven. By 2020, it had reached seventy-four. What is interesting is that the biggest improvement did not come from hospitals or new medicines. It came from simple things: clean water, better sanitation and free vaccination for children. In 1990, only forty per cent of children were vaccinated; by 2020, the figure was ninety-five per cent. Consequently, outbreaks of infectious diseases became rare. However, the country now faces a different problem. Chronic diseases such as diabetes are increasing, mainly because of poor nutrition and a lack of exercise. The government has started a programme of free check-ups for everyone over forty. Unfortunately, it remains unclear whether people will actually use it, because in the first year, only a quarter of those invited came."
          passage: |-
            PUBLIC HEALTH: 1990–2020
            • Life expectancy in 2020: (1) ___ years
            • Main causes of improvement: clean water, better (2) ___ and free vaccination
            • Children vaccinated in 2020: (3) ___ %
            • Result: fewer outbreaks of (4) ___ diseases
            • New problem: chronic diseases, e.g. (5) ___
            • Free check-ups for people over (6) ___
            • First-year attendance: about a (7) ___
          questions:
            - { q: "(1)", answer: "74", accept: [seventy-four] }
            - { q: "(2)", answer: sanitation }
            - { q: "(3)", answer: "95", accept: [ninety-five] }
            - { q: "(4)", answer: infectious }
            - { q: "(5)", answer: diabetes }
            - { q: "(6)", answer: "40", accept: [forty] }
            - { q: "(7)", answer: quarter }
        - id: b54-x2
          bank_no: 20
          kind: mcq
          instructions_vi: "Dựa vào bài giảng ở bài 1, chọn đáp án đúng về thái độ người nói."
          audio_text: "Today I want to look at how one country improved public health over thirty years. In 1990, average life expectancy was sixty-seven. By 2020, it had reached seventy-four. What is interesting is that the biggest improvement did not come from hospitals or new medicines. It came from simple things: clean water, better sanitation and free vaccination for children. In 1990, only forty per cent of children were vaccinated; by 2020, the figure was ninety-five per cent. Consequently, outbreaks of infectious diseases became rare. However, the country now faces a different problem. Chronic diseases such as diabetes are increasing, mainly because of poor nutrition and a lack of exercise. The government has started a programme of free check-ups for everyone over forty. Unfortunately, it remains unclear whether people will actually use it, because in the first year, only a quarter of those invited came."
          questions:
            - { q: "What does the speaker find interesting?", options: [Life expectancy fell., The biggest improvement came from simple measures., Hospitals improved dramatically., New medicines were very cheap.], answer: b }
            - { q: "What was the vaccination rate in 1990?", options: ["40%", "67%", "74%", "95%"], answer: a }
