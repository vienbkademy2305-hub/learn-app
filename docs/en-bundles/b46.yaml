grammar:
  - id: en-g3-01
    lesson: buoi-46-moi-truong-writing-process
    title: "Mô tả quy trình: bị động hiện tại + từ chỉ trình tự (first, then, once, after being + V3)"
    cefr: B2
    structures:
      - "S + is/are + V3 (+ by / in / into …)"
      - "First, … · Next, … · After that, … · Subsequently, … · Finally, …"
      - "Once + S + has/have been + V3, S + is/are + V3"
      - "After being + V3, S + is/are + V3"
      - "…, where / which + mệnh đề   (nối hai bước)"
    explain: >-
      Sơ đồ quy trình cho thấy các bước làm ra hoặc xử lý một thứ gì đó. Người làm các bước không quan trọng, nên câu mô tả
      dùng BỊ ĐỘNG hiện tại (is collected, are heated). Để bài không thành danh sách rời rạc, nối các bước bằng từ chỉ trình
      tự, và thỉnh thoảng gộp hai bước vào một câu bằng once/after being/where. Quy trình tự nhiên (vòng đời con ếch, chu
      trình nước) thì dùng CHỦ ĐỘNG vì không có người làm: Water evaporates, the tadpole grows legs.
    table:
      - [Cách nối, Ví dụ]
      - ["First / Then", "First, the bottles are collected. Then they are sorted by colour."]
      - ["Once … has been V3", "Once the bottles have been sorted, they are crushed into flakes."]
      - ["After being V3", "After being washed, the flakes are melted down."]
      - ["…, where …", "The water is pumped to a tank, where it is filtered through sand."]
      - ["…, which …", "The plastic is made into pellets, which are sold to factories."]
    notes:
      - "Sau giới từ (after, before, by) dùng V-ing: after being washed (bị động) / after washing (chủ động)."
      - "Không bỏ 'be': *The bottles collected* ❌ → The bottles are collected."
      - "Trong 20 phút, chỉ cần 2–3 câu gộp bước; còn lại câu đơn bị động rõ ràng là đủ."
    mistakes:
      - { wrong: "First, the bottles collect from homes.", right: "First, the bottles are collected from homes.", why: "Chai không tự thu gom → bị động is/are + V3." }
      - { wrong: "After washed, the flakes are dried.", right: "After being washed, the flakes are dried.", why: "Sau after cần being + V3 (hoặc: After they have been washed, …)." }
      - { wrong: "Water is evaporated from the sea.", right: "Water evaporates from the sea.", why: "Quy trình tự nhiên, không có người làm → chủ động." }
    examples: [b46-001, b46-002, b46-003, b46-004]
    provenance:
      - { source: prep-co-ban, field: scope, ref: "Writing cơ bản — Diagrams (process, bị động hiện tại): đối chiếu phạm vi, không chép" }

sentences:
  - { id: b46-001, text: "First, used bottles are collected from homes and taken to a recycling plant.", vi: "Đầu tiên, chai đã qua sử dụng được thu gom từ các hộ gia đình và đưa đến nhà máy tái chế.", words: [recycle|v], grammar: [en-g3-01], cefr: B1 }
  - { id: b46-002, text: "Once the bottles have been sorted, they are crushed into small pieces.", vi: "Sau khi chai được phân loại, chúng được nghiền thành mảnh nhỏ.", words: [once|conj, sort|v, crush|v], grammar: [en-g3-01], cefr: B2 }
  - { id: b46-003, text: "After being washed, the plastic is melted down and made into pellets.", vi: "Sau khi được rửa, nhựa được nung chảy và làm thành hạt.", words: [melt|v], grammar: [en-g3-01], cefr: B2 }
  - { id: b46-004, text: "The water is pumped into a tank, where it is filtered through sand.", vi: "Nước được bơm vào một bể, tại đó nó được lọc qua cát.", words: [filter|v], grammar: [en-g3-01], cefr: B2 }
  - { id: b46-005, text: "The diagram illustrates how drinking water is produced from a river.", vi: "Sơ đồ minh họa cách nước uống được sản xuất từ một con sông.", words: [diagram|n], grammar: [en-g3-01], cefr: B1 }
  - { id: b46-006, text: "There are six stages in the process, from collection to delivery.", vi: "Quy trình có sáu giai đoạn, từ thu gom đến phân phối.", words: [stage|n, process|n], grammar: [], cefr: B1 }
  - { id: b46-007, text: "The clean water is stored in a reservoir before it is delivered to homes.", vi: "Nước sạch được lưu trong hồ chứa trước khi được đưa đến các hộ gia đình.", words: [store|v, reservoir|n, deliver|v], grammar: [en-g3-01], cefr: B1 }
  - { id: b46-008, text: "Food waste can be turned into compost instead of being sent to landfill.", vi: "Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp.", words: [compost|n, landfill|n], grammar: [en-g2-23, en-g2-21], cefr: B2 }
  - { id: b46-009, text: "The raw materials are transported to the factory by lorry.", vi: "Nguyên liệu thô được vận chuyển đến nhà máy bằng xe tải.", words: [raw-material|phr-n, transport|v], grammar: [en-g3-01], cefr: B1 }
  - { id: b46-010, text: "The mixture is heated to 200°C and subsequently packaged for sale.", vi: "Hỗn hợp được đun nóng đến 200°C và sau đó được đóng gói để bán.", words: [heat|v, subsequently|adv, package|v], grammar: [en-g3-01], cefr: B2 }
  - { id: b46-011, text: "Chemicals are added to purify the water and kill bacteria.", vi: "Hóa chất được thêm vào để làm sạch nước và diệt vi khuẩn.", words: [purify|v], grammar: [en-g3-01, en-g2-19], cefr: B1 }

lesson:
  slug: buoi-46-moi-truong-writing-process
  number: 46
  stage: 3
  title_vi: "Môi trường (nâng cao) · Writing Task 1: sơ đồ quy trình"
  focus: { grammar: "Bị động hiện tại + từ chỉ trình tự (once, after being V3)", skill: "Writing Task 1 — process diagram" }
  target_band: "6.0-6.5"
  steps:
    - type: vocabulary
      items: [process|n, stage|n, diagram|n, raw-material|phr-n, transport|v, heat|v, filter|v, purify|v, store|v, sort|v, crush|v, melt|v, package|v, deliver|v, reservoir|n, subsequently|adv, once|conj, landfill|n, compost|n]
    - type: pronunciation
      notes:
        - { word: transport|v, text_vi: "Động từ trans-PORT, danh từ TRANS-port. Trong bài process chủ yếu là động từ bị động: are trans-PORT-ed /ɪd/." }
        - { word: reservoir|n, text_vi: "REZ-ə-vwah /ˈrez.ə.vwɑː/: -voir đọc /vwɑː/, không đọc 'vơ'." }
        - { word: purify|v, text_vi: "PU-ri-fy /ˈpjʊə.rɪ.faɪ/: u đọc /jʊə/ như 'pure'." }
        - { word: subsequently|adv, text_vi: "SUB-se-quent-ly: 4 âm tiết, nhấn âm 1." }
        - { word: heat|v, text_vi: "Đuôi -ed sau /t/, /d/ đọc /ɪd/: heated, collected, transported, sorted — thêm một âm tiết." }
    - type: grammar
      items: [en-g3-01]
    - type: skill
      skill: writing
      title_vi: "Writing Task 1 — sơ đồ quy trình (process diagram)"
      intro_vi: "Đề cho một sơ đồ các bước (sản xuất gạch, tái chế chai nhựa, xử lý nước…). Không có số liệu để so sánh, nên nhiều bạn thấy 'dễ' nhưng hay mất điểm vì (1) bỏ sót bước, (2) viết như danh sách rời rạc, (3) sai bị động. Bố cục 4 đoạn vẫn giữ: mở bài → overview (số bước, điểm đầu → điểm cuối) → thân bài 1 (nửa đầu quy trình) → thân bài 2 (nửa sau)."
      steps:
        - { title_vi: "Đếm bước và xác định điểm đầu, điểm cuối", text_vi: "Có mấy bước? Bắt đầu từ đâu (nguyên liệu), kết thúc ở đâu (sản phẩm)? Là quy trình nhân tạo (bị động) hay tự nhiên (chủ động)? Có phải vòng tròn (cycle) không?" }
        - { title_vi: "Mở bài: paraphrase", text_vi: "The diagram shows how… → The diagram illustrates the process by which… / the stages involved in…" }
        - { title_vi: "Overview: số bước + đầu → cuối", text_vi: "'Overall, there are six main stages in the process, beginning with the collection of used bottles and ending with the production of new plastic items.' Không đi vào chi tiết từng bước." }
        - { title_vi: "Chia thân bài theo nửa quy trình", text_vi: "Thân bài 1: bước 1–3; thân bài 2: bước 4–6. Mỗi bước ít nhất một câu; giữ đúng thứ tự mũi tên." }
        - { title_vi: "Dùng từ trong sơ đồ, đổi dạng", text_vi: "Nhãn trong sơ đồ thường là danh từ (collection, sorting) → đổi thành động từ bị động (are collected, are sorted). Giữ thuật ngữ kỹ thuật, không cố tìm từ đồng nghĩa." }
        - { title_vi: "Soát lỗi", text_vi: "Mỗi câu bị động có đủ be + V3? -ed đúng? Có bỏ sót bước nào không?" }
      tips:
        - "Cần tối thiểu 150 từ — sơ đồ ít chữ, nên thêm chi tiết có trong hình (nhiệt độ, thời gian, địa điểm)."
        - "Luân phiên: First → Next → After that → Once … → Subsequently → Finally. Không lặp 'Then' năm lần."
        - "Không thêm thông tin ngoài sơ đồ (không giải thích vì sao phải lọc nước)."
      traps:
        - { trap_vi: "Viết chủ động sai: 'The bottles collect'.", fix_vi: "Quy trình nhân tạo → bị động: are collected." }
        - { trap_vi: "Overview liệt kê từng bước.", fix_vi: "Overview chỉ: số bước + bắt đầu + kết thúc (+ vòng tròn hay không)." }
        - { trap_vi: "Bỏ sót bước nhỏ (VD bước làm khô).", fix_vi: "Đánh số các bước trên đề trước khi viết, gạch khi đã viết xong." }
      phrases:
        - { en: "The diagram illustrates the process by which …", vi: "Sơ đồ minh họa quy trình mà qua đó …", note_vi: "Mở bài." }
        - { en: "Overall, there are … main stages, beginning with … and ending with …", vi: "Nhìn chung, có … giai đoạn chính, bắt đầu với … và kết thúc với …", note_vi: "Overview." }
        - { en: "At the first stage, …", vi: "Ở giai đoạn đầu, …" }
        - { en: "Once … has been …, it is …", vi: "Sau khi … đã được …, nó được …" }
        - { en: "After being …, the … is …", vi: "Sau khi được …, … được …" }
        - { en: "In the final stage, …", vi: "Ở giai đoạn cuối, …" }
      demo:
        title_vi: "Làm mẫu: bài process tái chế chai nhựa (sơ đồ mô tả bằng lời để luyện tập)"
        text_en: |-
          Diagram (6 stages): 1 used bottles collected from homes → 2 taken to a recycling plant and sorted by colour → 3 crushed into flakes → 4 washed and dried → 5 melted and formed into pellets → 6 pellets sold to factories to make new products (clothes, bottles, furniture).

          Introduction: The diagram illustrates the process by which used plastic bottles are recycled to make new products.

          Overview: Overall, there are six main stages in the process, beginning with the collection of used bottles and ending with the production of new items such as clothes and furniture.

          Body 1: At the first stage, used bottles are collected from homes and taken to a recycling plant. There, they are sorted according to their colour. Once the bottles have been sorted, they are crushed into small flakes.

          Body 2: After being washed and dried, the flakes are melted down and formed into small pellets. Finally, these pellets are sold to factories, where they are used as raw materials to make a range of new products, including clothes, bottles and furniture.
        notes:
          - { label: "process by which", text_vi: "Paraphrase 'shows how' — cụm học thuật, dùng một lần ở mở bài." }
          - { label: "Overview", text_vi: "Số bước (six) + bắt đầu (collection) + kết thúc (new items). Danh từ hóa: the collection of, the production of." }
          - { label: "Once … have been sorted", text_vi: "Gộp bước 2 và 3; hiện tại hoàn thành bị động sau once." }
          - { label: "After being washed … where …", text_vi: "Hai cách gộp bước khác; where nối bước 6 với nơi dùng pellets." }
    - type: examples
      items: [b46-001, b46-002, b46-003, b46-004, b46-005, b46-006, b46-007, b46-008, b46-009, b46-010, b46-011]
    - type: dialogue
      title_vi: "Tham quan nhà máy nước"
      lines:
        - { speaker: A, text: "So where does the water come from?", vi: "Vậy nước đến từ đâu ạ?" }
        - { speaker: B, text: "It's pumped from the river into this tank. At this stage, it's still very dirty.", vi: "Nó được bơm từ sông vào bể này. Ở giai đoạn này, nước vẫn rất bẩn." }
        - { speaker: A, text: "And then it's cleaned?", vi: "Rồi nó được làm sạch?" }
        - { speaker: B, text: "Yes. First, it's filtered through sand and small stones to remove the mud.", vi: "Đúng. Đầu tiên, nước được lọc qua cát và sỏi nhỏ để loại bỏ bùn." }
        - { speaker: A, text: "What about bacteria?", vi: "Còn vi khuẩn thì sao?" }
        - { speaker: B, text: "Once it has been filtered, chemicals are added to purify it.", vi: "Sau khi được lọc, hóa chất được thêm vào để làm sạch." }
        - { speaker: A, text: "Where is it kept after that?", vi: "Sau đó nó được giữ ở đâu?" }
        - { speaker: B, text: "It's stored in a reservoir on the hill, and finally it's delivered to homes through pipes.", vi: "Nó được trữ trong hồ chứa trên đồi, và cuối cùng được đưa đến các nhà qua đường ống." }
    - type: exercises
      items:
        - id: b46-x1
          bank_no: 8
          kind: transformation
          instructions_vi: "Viết lại các bước dưới dạng câu bị động hiện tại."
          questions:
            - { q: "Workers collect the bottles. → The bottles ___", answer: "are collected by workers.", accept: ["are collected."] }
            - { q: "The machine crushes the glass into small pieces. → The glass ___", answer: "is crushed into small pieces.", accept: ["is crushed into small pieces by the machine."] }
            - { q: "They heat the mixture to 900°C. → The mixture ___", answer: "is heated to 900°C." }
            - { q: "Lorries deliver the bricks to building sites. → The bricks ___", answer: "are delivered to building sites.", accept: ["are delivered to building sites by lorries.", "are delivered to building sites by lorry."] }
        - id: b46-x2
          bank_no: 9
          kind: combine
          instructions_vi: "Gộp hai bước thành một câu bằng từ trong ngoặc."
          questions:
