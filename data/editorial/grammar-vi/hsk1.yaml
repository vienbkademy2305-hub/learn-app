# Ngữ pháp HSK1 theo bài học — giải thích tiếng Việt (docs/PHASE5_GRAMMAR_PLAN.md).
# BẢN NHÁP do Claude (AI) viết ngày 2026-09-28 — CẦN NGƯỜI DUYỆT.
# Khi đã duyệt một điểm, đổi `status` của điểm đó thành `reviewed` (UI sẽ bỏ nhãn "Bản nháp").
#
# - Nội dung tự viết, không chép từ grammar_points.json (krmanik/HSK-3.0, license UNKNOWN).
# - `hsk_code`: mã điểm ngữ pháp cấp 1 theo cách đánh số của grammar_points.json (VD "1-09"), để sau này nối với
#   sentence_grammar. Chưa đối chiếu với văn bản đề cương chính thức (UNRESOLVED); UI không hiển thị mã này.
