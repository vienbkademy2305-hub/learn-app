# Sự thật: bài thuyết trình cho khách bị xóa lúc 7:55 từ laptop phòng họp 3 (đăng nhập bằng tài khoản Sam). Sam nói đang xếp hàng mua cà phê
# ở căng-tin 7:50–8:10; Ravi: căng-tin đóng cửa dọn đến 8:15 (có biển). Olu: lịch sử phiên bản cho thấy xóa từ phòng họp 3 bằng tài khoản Sam.
# Helen: Sam bất mãn vì không được dẫn dự án. Hung thủ: Sam.
id: b2-sabotaged-slides
level: B2
lesson_range: [52, 62]
status: draft
title_vi: Bài thuyết trình bị phá
cover: "📊"
premise_vi: >-
  Tám giờ sáng, trước khi khách hàng lớn đến, cả bộ slide thuyết trình quan trọng bị xóa khỏi ổ đĩa chung.
  Công ty nghi ngờ có người cố ý phá. Bốn đồng nghiệp bị hỏi. Ai đã làm điều đó?

clues:
  - id: canteen-closed
    witness: ravi
    text: "The canteen was closed for cleaning until a quarter past eight."
    text_vi: "Căng-tin đóng cửa để dọn dẹp cho đến tám giờ mười lăm."
  - id: room3-login
    witness: olu
    text: "The slides were deleted at 7:55 from the laptop in Meeting Room 3, where Sam's account was logged in."
    text_vi: "Slide bị xóa lúc 7:55 từ laptop ở phòng họp 3, nơi tài khoản của Sam đang đăng nhập."
  - id: sticky-note
    witness: olu
    text: "Sam keeps his password on a sticky note."
    text_vi: "Sam dán mật khẩu lên giấy nhớ."
  - id: helen-project
    witness: helen
    text: "Helen gave the lead of the project to Ravi, not to Sam."
    text_vi: "Helen giao việc dẫn dự án cho Ravi chứ không phải Sam."

witnesses:
  - id: helen
    name: Helen
    role: The project manager
    avatar: "👩‍💼"
    segments:
      - text: "The client meeting was scheduled for nine o'clock, and the presentation had been finished the night before. I'd checked it myself."
        vi: "Cuộc họp với khách hàng được lên lịch lúc chín giờ và bài thuyết trình đã được hoàn thành tối hôm trước. Chính tôi đã kiểm tra nó."
        focus: ["was scheduled", "had been finished"]
      - text: "Last month I decided that Ravi would lead the project. Sam had expected to be given that role, and I know he was disappointed."
        vi: "Tháng trước tôi quyết định Ravi sẽ dẫn dự án. Sam đã mong được giao vai trò đó và tôi biết anh ấy thất vọng."
        clues: [helen-project]
        focus: ["had expected", "disappointed"]
      - text: "However, I don't want to accuse anyone without proof. Sam has always been a hard-working and loyal colleague."
        vi: "Tuy nhiên tôi không muốn buộc tội ai khi chưa có bằng chứng. Sam luôn là một đồng nghiệp chăm chỉ và trung thành."
        focus: ["accuse", "proof"]
    checks:
      - claim_vi: "Cuộc họp với khách hàng lúc chín giờ."
        answer: true
        explain_vi: "Đúng: “scheduled for nine o'clock.”"
      - claim_vi: "Helen giao việc dẫn dự án cho Sam."
        answer: false
        explain_vi: "Sai: bà giao cho Ravi."
      - claim_vi: "Helen có bằng chứng chắc chắn về thủ phạm."
        answer: false
        explain_vi: "Sai: “I don't want to accuse anyone without proof.”"
  - id: olu
    name: Olu
    role: The IT manager
    avatar: "🖥️"
    segments:
      - text: "The shared drive keeps a version history. According to it, the whole folder was deleted at 7:55 am."
        vi: "Ổ đĩa chung lưu lịch sử phiên bản. Theo đó, toàn bộ thư mục bị xóa lúc 7:55 sáng."
        focus: ["version history", "According to"]
      - text: "The deletion was made from the laptop in Meeting Room 3, and Sam's account was logged in on that laptop at the time."
        vi: "Việc xóa được thực hiện từ laptop ở phòng họp 3 và lúc đó tài khoản của Sam đang đăng nhập trên chiếc laptop ấy."
        clues: [room3-login]
        focus: ["was made from", "logged in"]
      - text: "I admit that Sam keeps his password on a sticky note, so someone else might have used it. I can't prove who was sitting at the keyboard."
        vi: "Tôi thừa nhận Sam dán mật khẩu lên giấy nhớ nên người khác có thể đã dùng nó. Tôi không thể chứng minh ai ngồi trước bàn phím."
        clues: [sticky-note]
        focus: ["might have used", "prove"]
    checks:
      - claim_vi: "Thư mục bị xóa lúc 7:55 sáng."
        answer: true
        explain_vi: "Đúng: “deleted at 7:55 am.”"
      - claim_vi: "Việc xóa được làm từ văn phòng của Olu."
        answer: false
        explain_vi: "Sai: từ laptop ở phòng họp 3."
      - claim_vi: "Olu có thể chứng minh ai ngồi trước bàn phím."
        answer: false
        explain_vi: "Sai: “I can't prove who was sitting at the keyboard.”"
  - id: ravi
    name: Ravi
    role: A junior analyst
    avatar: "☕"
    segments:
      - text: "I arrived at a quarter to eight, and I wanted to buy a coffee. I went to the canteen, but the door was locked."
        vi: "Tôi đến lúc tám giờ kém mười lăm và muốn mua cà phê. Tôi đến căng-tin nhưng cửa bị khóa."
        focus: ["wanted to", "locked"]
      - text: "There was a sign on the door saying that the canteen was closed for cleaning until a quarter past eight. Nobody was inside, and nobody was waiting."
        vi: "Trên cửa có tấm biển ghi căng-tin đóng cửa để dọn dẹp cho đến tám giờ mười lăm. Không ai ở bên trong và cũng không ai đứng đợi."
        clues: [canteen-closed]
        focus: ["a sign", "closed for cleaning"]
      - text: "So I went back to my desk. On my way I passed the meeting rooms, but I didn't look inside."
        vi: "Vì vậy tôi quay về bàn làm việc. Trên đường đi tôi đi ngang các phòng họp nhưng không nhìn vào."
    checks:
      - claim_vi: "Ravi vào được căng-tin lúc tám giờ kém mười lăm."
        answer: false
        explain_vi: "Sai: cửa bị khóa."
      - claim_vi: "Căng-tin đóng cửa đến tám giờ mười lăm."
        answer: true
        explain_vi: "Đúng: “closed for cleaning until a quarter past eight.”"
      - claim_vi: "Ravi nhìn vào các phòng họp."
        answer: false
        explain_vi: "Sai: “I didn't look inside.”"
  - id: sam
    name: Sam
    role: A senior designer
    avatar: "🎨"
    segments:
      - text: "I arrived at half past seven. At ten to eight I went to the canteen, and I stayed in the queue until ten past eight."
        vi: "Tôi đến lúc bảy giờ rưỡi. Lúc tám giờ kém mười tôi xuống căng-tin và đứng trong hàng đến tám giờ mười phút."
        focus: ["stayed in the queue", "until"]
      - text: "I was buying coffee for the whole team, so I couldn't have been in a meeting room. That's impossible."
        vi: "Tôi đang mua cà phê cho cả nhóm nên tôi không thể ở trong phòng họp. Điều đó là không thể."
        focus: ["couldn't have been", "impossible"]
      - text: "I'm very sorry about the slides, but I worked on them for two weeks. Why would I destroy my own work?"
        vi: "Tôi rất tiếc về bộ slide nhưng tôi đã làm việc với chúng hai tuần. Tại sao tôi lại phá hủy công sức của chính mình?"
    checks:
      - claim_vi: "Sam nói anh đứng xếp hàng ở căng-tin."
        answer: true
        explain_vi: "Đúng: “I stayed in the queue until ten past eight.”"
      - claim_vi: "Sam nói anh đang ở phòng họp lúc 7:55."
        answer: false
        explain_vi: "Sai: anh nói đang mua cà phê, không thể ở phòng họp."
      - claim_vi: "Sam đã làm việc với bộ slide hai tuần."
        answer: true
        explain_vi: "Đúng: “I worked on them for two weeks.”"
solution:
  culprit: sam
  evidence: [canteen-closed, room3-login]
  explain_vi: >-
    Sam nói anh đứng xếp hàng ở căng-tin từ 7:50 đến 8:10. Nhưng căng-tin đóng cửa đến 8:15, và bộ slide bị xóa lúc 7:55
    từ phòng họp 3 bằng tài khoản của anh. Lời khai của Sam không thể đúng.
  confession: "I'm ashamed. When Helen chose Ravi, I felt invisible after years of hard work. I deleted the folder in a moment of anger, and then I realised what I had done. I thought nobody would find out."
  confession_vi: "Tôi rất xấu hổ. Khi Helen chọn Ravi, tôi thấy mình vô hình sau bao năm làm việc chăm chỉ. Tôi xóa thư mục trong cơn giận rồi mới nhận ra mình đã làm gì. Tôi nghĩ sẽ không ai phát hiện."
