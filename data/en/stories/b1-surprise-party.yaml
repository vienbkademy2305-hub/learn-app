# Sự thật: ai đó nhắn cho Hana biết về bữa tiệc bất ngờ. Jess nói điện thoại cô hỏng cả tuần nên không nhắn được;
# Kai: thứ Ba thấy Jess cho xem ảnh trên điện thoại ở quán cà phê; Lena: tin nhắn đến từ số kết thúc bằng 47, số của Jess. Hung thủ: Jess.
id: b1-surprise-party
level: B1
lesson_range: [20, 28]
status: draft
title_vi: Bữa tiệc bất ngờ bị lộ
cover: "🎉"
premise_vi: >-
  Cả nhóm bạn chuẩn bị tiệc sinh nhật bất ngờ cho Hana. Nhưng hôm qua Hana nhận được một tin nhắn nói hết mọi chuyện.
  Ai trong ba người bạn đã nhắn tin?

clues:
  - id: phone-tuesday
    witness: kai
    text: "Jess showed Kai some photos on her phone on Tuesday."
    text_vi: "Thứ Ba Jess đã cho Kai xem ảnh trên điện thoại của cô."
  - id: number-47
    witness: lena
    text: "The message came from a number ending in 47, which is Jess's number."
    text_vi: "Tin nhắn đến từ số điện thoại kết thúc bằng 47, đó là số của Jess."
  - id: kai-cake
    witness: kai
    text: "Kai ordered the cake."
    text_vi: "Kai đặt bánh."
  - id: lena-decor
    witness: lena
    text: "Lena bought the decorations."
    text_vi: "Lena mua đồ trang trí."

witnesses:
  - id: kai
    name: Kai
    role: Hana's friend
    avatar: "🎂"
    segments:
      - text: "I ordered the cake last week. It's chocolate, and Hana loves chocolate. I've told nobody the name of the bakery."
        vi: "Tuần trước tôi đã đặt bánh. Đó là bánh sô-cô-la và Hana rất thích sô-cô-la. Tôi chưa nói cho ai tên tiệm bánh."
        clues: [kai-cake]
        focus: ["I've told nobody", "bakery"]
      - text: "On Tuesday afternoon I met Jess at the café on Main Street. She was happy, and she showed me some photos on her phone."
        vi: "Chiều thứ Ba tôi gặp Jess ở quán cà phê trên phố Main. Cô ấy rất vui và cho tôi xem vài bức ảnh trên điện thoại."
        clues: [phone-tuesday]
        focus: ["showed me", "photos"]
      - text: "So I was surprised when she said later that her phone had been broken all week."
        vi: "Vì vậy tôi rất ngạc nhiên khi sau đó cô ấy nói điện thoại của cô ấy hỏng cả tuần."
        focus: ["had been broken", "surprised"]
    checks:
      - claim_vi: "Kai đặt bánh sô-cô-la."
        answer: true
        explain_vi: "Đúng: “It's chocolate.”"
      - claim_vi: "Kai gặp Jess ở quán cà phê hôm thứ Tư."
        answer: false
        explain_vi: "Sai: hôm thứ Ba."
      - claim_vi: "Jess đã cho Kai xem ảnh trên điện thoại."
        answer: true
        explain_vi: "Đúng: “she showed me some photos on her phone.”"
  - id: lena
    name: Lena
    role: Hana's friend
    avatar: "🎈"
    segments:
      - text: "I bought the decorations: balloons, a banner and some lights. I kept everything in my garage."
        vi: "Tôi mua đồ trang trí: bóng bay, băng rôn và vài dây đèn. Tôi giữ mọi thứ trong gara."
        clues: [lena-decor]
      - text: "Yesterday Hana called me. She said she had received a message about the party, and she showed it to me."
        vi: "Hôm qua Hana gọi cho tôi. Cô ấy nói đã nhận được một tin nhắn về bữa tiệc và cho tôi xem."
        focus: ["had received", "showed it"]
      - text: "The message came from a number that ended in 47. That's Jess's number. I know it because I've called her a hundred times."
        vi: "Tin nhắn đến từ một số kết thúc bằng 47. Đó là số của Jess. Tôi biết vì tôi đã gọi cho cô ấy cả trăm lần."
        clues: [number-47]
        focus: ["ended in", "a hundred times"]
    checks:
      - claim_vi: "Lena giữ đồ trang trí trong gara."
        answer: true
        explain_vi: "Đúng: “I kept everything in my garage.”"
      - claim_vi: "Hana nhận được tin nhắn từ số của Lena."
        answer: false
        explain_vi: "Sai: số kết thúc bằng 47 là số của Jess."
      - claim_vi: "Lena biết số của Jess rất rõ."
        answer: true
        explain_vi: "Đúng: “I've called her a hundred times.”"
  - id: jess
    name: Jess
    role: Hana's best friend
    avatar: "📱"
    segments:
      - text: "I couldn't have sent that message. My phone has been broken since last Sunday, and I haven't been able to text anyone."
        vi: "Tôi không thể gửi tin nhắn đó. Điện thoại của tôi hỏng từ Chủ nhật tuần trước và tôi không nhắn được cho ai."
        focus: ["couldn't have sent", "has been broken since"]
      - text: "I only use my laptop to chat with friends this week. Ask anybody!"
        vi: "Tuần này tôi chỉ dùng máy tính xách tay để trò chuyện với bạn bè. Cứ hỏi bất kỳ ai!"
      - text: "Hana is my best friend. I wanted her party to be perfect, so I would never spoil it."
        vi: "Hana là bạn thân nhất của tôi. Tôi muốn bữa tiệc của cô ấy thật hoàn hảo nên tôi sẽ không bao giờ phá hỏng nó."
    checks:
      - claim_vi: "Jess nói điện thoại của cô hỏng từ Chủ nhật."
        answer: true
        explain_vi: "Đúng: “My phone has been broken since last Sunday.”"
      - claim_vi: "Jess nói tuần này cô dùng điện thoại để nhắn tin."
        answer: false
        explain_vi: "Sai: cô chỉ dùng máy tính xách tay."
      - claim_vi: "Jess muốn phá hỏng bữa tiệc."
        answer: false
        explain_vi: "Sai: “I would never spoil it.”"
solution:
  culprit: jess
  evidence: [phone-tuesday, number-47]
  explain_vi: >-
    Jess nói điện thoại cô hỏng cả tuần nên không thể nhắn tin. Nhưng thứ Ba cô cho Kai xem ảnh trên điện thoại,
    và tin nhắn gửi cho Hana đến từ số kết thúc bằng 47, chính là số của Jess.
  confession: "I'm sorry. I was so excited that I couldn't keep the secret. I only wanted to tell Hana something nice, and I forgot it was a surprise. Please don't be angry."
  confession_vi: "Tôi xin lỗi. Tôi háo hức quá nên không giữ nổi bí mật. Tôi chỉ muốn nói với Hana một điều tốt đẹp và quên mất đó là bất ngờ. Xin đừng giận tôi."
