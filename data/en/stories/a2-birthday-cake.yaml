# Bảng sự thật (không hiển thị):
#   - Mẹ làm bánh sô-cô-la cho sinh nhật bà, để trong tủ lạnh lúc 4:30. Đến 6:00 bánh biến mất.
#   - Bố nói: cả chiều ở trong gara sửa xe đạp, không vào bếp.
#   - Max (10 tuổi): chơi bóng ngoài vườn từ 5 giờ; 5:50 nhìn qua cửa sổ bếp thấy bố đứng trước tủ lạnh.
#   - Dì Rose: đến lúc 5 giờ, chỉ mở tủ lạnh để cất nước ép (bánh còn đó), sau đó ngồi xem TV với bà.
#   - Bà: Rose ngồi cạnh bà từ 5:30, không rời đi  -> Rose và Max có chứng cứ vắng mặt.
#   - Hung thủ duy nhất: bố.
id: a2-birthday-cake
level: A2
lesson_range: [14, 16]
status: draft
title_vi: Chiếc bánh sinh nhật biến mất
cover: "🎂"
premise_vi: >-
  Mẹ làm một chiếc bánh sô-cô-la cho sinh nhật bà. Bốn giờ rưỡi, bánh còn trong tủ lạnh.
  Sáu giờ, bánh biến mất không để lại gì. Bốn người trong nhà, ai đã lấy bánh?

clues:
  - id: dad-garage-claim
    witness: dad
    text: "Dad says he stayed in the garage all afternoon."
    text_vi: "Bố nói bố ở trong gara cả buổi chiều."
  - id: max-saw-dad
    witness: max
    text: "Max saw Dad at the fridge in the kitchen at ten to six."
    text_vi: "Max thấy bố đứng ở tủ lạnh trong bếp lúc sáu giờ kém mười."
  - id: rose-with-granny
    witness: granny
    text: "Rose sat with Granny from half past five."
    text_vi: "Dì Rose ngồi cạnh bà từ năm giờ rưỡi."
  - id: rose-juice
    witness: rose
    text: "Rose opened the fridge only to put in some juice."
    text_vi: "Dì Rose chỉ mở tủ lạnh để cất nước ép."
  - id: max-football
    witness: max
    text: "Max played football in the garden."
    text_vi: "Max chơi bóng đá ngoài vườn."

witnesses:
  - id: dad
    name: Dad
    role: Your friend's father
    avatar: "🔧"
    segments:
      - text: "I'm fixing Max's bike today. I was in the garage all afternoon."
        vi: "Hôm nay bố sửa xe đạp cho Max. Bố ở trong gara cả buổi chiều."
        clues: [dad-garage-claim]
        focus: ["fixing", "all afternoon"]
      - text: "I didn't go into the kitchen after lunch. I don't even know where the cake was."
        vi: "Sau bữa trưa bố không vào bếp. Bố còn không biết cái bánh để ở đâu."
        focus: ["after lunch", "even"]
      - text: "I love chocolate, but I'm not a thief! Ask Max. He was in the garden near the garage."
        vi: "Bố thích sô-cô-la nhưng bố không phải kẻ trộm! Hãy hỏi Max. Nó ở ngoài vườn gần gara."
    checks:
      - claim_vi: "Bố sửa xe đạp trong gara."
        answer: true
        explain_vi: "Đúng: “I'm fixing Max's bike… in the garage.”"
      - claim_vi: "Bố nói rằng sau bữa trưa bố đã vào bếp."
        answer: false
        explain_vi: "Sai: “I didn't go into the kitchen after lunch.”"
      - claim_vi: "Bố biết chiếc bánh để ở đâu."
        answer: false
        explain_vi: "Sai: “I don't even know where the cake was.”"

  - id: rose
    name: Aunt Rose
    role: Your friend's aunt
    avatar: "🧣"
    segments:
      - text: "I arrived by bus at five o'clock. I brought a big bottle of orange juice for the party."
        vi: "Dì đến bằng xe buýt lúc năm giờ. Dì mang một chai nước cam lớn cho bữa tiệc."
      - text: "I went to the kitchen and opened the fridge only to put the juice inside. The cake was there. It looked delicious!"
        vi: "Dì vào bếp và mở tủ lạnh chỉ để cất nước cam. Chiếc bánh vẫn ở đó. Trông ngon lắm!"
        clues: [rose-juice]
        focus: ["only to", "delicious"]
      - text: "Then I sat in the living room with Granny and we watched TV. I didn't touch the cake."
        vi: "Rồi dì ngồi trong phòng khách với bà và hai bà cháu xem TV. Dì không đụng vào bánh."
    checks:
      - claim_vi: "Dì Rose đến bằng xe buýt."
        answer: true
        explain_vi: "Đúng: “I arrived by bus.”"
      - claim_vi: "Khi dì mở tủ lạnh, chiếc bánh đã biến mất."
        answer: false
        explain_vi: "Sai: “The cake was there.”"
      - claim_vi: "Dì Rose xem TV với bà."
        answer: true
        explain_vi: "Đúng: “I sat in the living room with Granny and we watched TV.”"

  - id: max
    name: Max
    role: Your friend's little brother
    avatar: "🏀"
    segments:
      - text: "I played football in the garden from five o'clock. I never went inside."
        vi: "Em chơi bóng đá ngoài vườn từ năm giờ. Em không hề vào nhà."
        clues: [max-football]
      - text: "The kitchen window is next to the garden. At ten to six I looked through it."
        vi: "Cửa sổ bếp ở cạnh khu vườn. Lúc sáu giờ kém mười em nhìn qua đó."
        focus: ["next to", "through"]
      - text: "I saw Dad! He stood in front of the fridge. He had a big piece of chocolate cake in his hand."
        vi: "Em thấy bố! Bố đứng trước tủ lạnh. Bố cầm trong tay một miếng bánh sô-cô-la thật to."
        clues: [max-saw-dad]
        focus: ["in front of", "in his hand"]
    checks:
      - claim_vi: "Max chơi bóng đá ngoài vườn."
        answer: true
        explain_vi: "Đúng: “I played football in the garden.”"
      - claim_vi: "Max nhìn thấy bố qua cửa sổ bếp."
        answer: true
        explain_vi: "Đúng: “At ten to six I looked through it… I saw Dad!”"
      - claim_vi: "Max vào bếp lấy bánh."
        answer: false
        explain_vi: "Sai: “I never went inside.”"

  - id: granny
    name: Granny
    role: The birthday lady
    avatar: "🧶"
    segments:
      - text: "Today is my birthday! I'm seventy-five years old. I sat in the living room all evening."
        vi: "Hôm nay là sinh nhật của bà! Bà bảy mươi lăm tuổi. Bà ngồi trong phòng khách cả buổi tối."
      - text: "Rose came at half past five and sat next to me. She never left the sofa. We watched a film."
        vi: "Rose đến lúc năm giờ rưỡi và ngồi cạnh bà. Con bé không rời khỏi ghế sofa. Hai bà cháu xem phim."
        clues: [rose-with-granny]
        focus: ["next to", "never left"]
      - text: "I'm not angry about the cake. I only want to know who took it."
        vi: "Bà không giận chuyện cái bánh. Bà chỉ muốn biết ai đã lấy."
    checks:
      - claim_vi: "Hôm nay là sinh nhật bà."
        answer: true
        explain_vi: "Đúng: “Today is my birthday!”"
      - claim_vi: "Dì Rose rời khỏi ghế sofa nhiều lần."
        answer: false
        explain_vi: "Sai: “She never left the sofa.”"
      - claim_vi: "Bà rất giận về chiếc bánh."
        answer: false
        explain_vi: "Sai: “I'm not angry about the cake.”"

solution:
  culprit: dad
  evidence: [dad-garage-claim, max-saw-dad]
  explain_vi: >-
    Bố nói bố ở trong gara cả buổi chiều và không vào bếp. Nhưng Max nhìn qua cửa sổ bếp và thấy bố đứng
    trước tủ lạnh với một miếng bánh. Dì Rose có bà làm chứng, còn Max chơi ngoài vườn — chỉ có bố là nói dối.
  confession: "OK, OK. I was hungry and the cake looked so good. I wanted a small piece, but then I ate a bigger piece… and then another one. I'm very sorry!"
  confession_vi: "Được rồi, bố thú nhận. Bố đói và chiếc bánh trông ngon quá. Bố chỉ định ăn một miếng nhỏ, rồi ăn miếng to hơn… rồi thêm miếng nữa. Bố xin lỗi!"
