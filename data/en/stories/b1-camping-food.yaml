solution:
  culprit: omar
  evidence: [turned-back, wrappers]
  explain_vi: >-
    Omar nói anh đi cùng nhóm cả buổi sáng và không thích thanh năng lượng. Nhưng Hana nói anh quay lại sau hai mươi phút,
    và Chris tìm thấy giấy gói thanh năng lượng trong ba lô của anh.
  confession_en: "I'm sorry. I forgot my breakfast and my foot really hurt, so I went back to the tent. I was so hungry that I ate the energy bars and the biscuits. I'll buy new food."
  confession_vi: "Tôi xin lỗi. Tôi quên bữa sáng và chân tôi thực sự đau nên tôi quay lại lều. Tôi đói đến mức ăn hết thanh năng lượng và bánh quy. Tôi sẽ mua đồ ăn mới."
