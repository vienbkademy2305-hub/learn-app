# Sự thật: thanh năng lượng và đồ ăn trong lều bị lấy khi cả nhóm đi bộ ra hồ (9 giờ). Omar nói anh đi cùng nhóm cả buổi sáng;
# Hana: Omar quay lại sau 20 phút vì đau chân; Chris: tìm thấy giấy gói thanh năng lượng trong túi hông ba lô của Omar. Hung thủ: Omar.
id: b1-camping-food
level: B1
lesson_range: [22, 32]
status: draft
title_vi: Đồ ăn biến mất ở khu cắm trại
cover: "⛺"
premise_vi: >-
  Cả nhóm đi bộ ra hồ và để đồ trong lều. Khi quay về, hộp thanh năng lượng và đồ ăn dự trữ đã biến mất.
  Ba người trong nhóm bị hỏi. Ai đã lấy đồ ăn?

clues:
  - id: turned-back
    witness: hana
    text_en: "Omar turned back after twenty minutes because his foot hurt."
    text_vi: "Omar quay lại sau hai mươi phút vì đau chân."
  - id: wrappers
    witness: chris
    text_en: "Chris found energy bar wrappers in the side pocket of Omar's backpack."
    text_vi: "Chris tìm thấy giấy gói thanh năng lượng trong túi hông ba lô của Omar."
  - id: left-nine
    witness: hana
    text_en: "The group left the camp at nine o'clock."
    text_vi: "Cả nhóm rời khu cắm trại lúc chín giờ."
  - id: chris-lake
    witness: chris
    text_en: "Chris walked to the lake with the group."
    text_vi: "Chris đi bộ ra hồ cùng nhóm."

