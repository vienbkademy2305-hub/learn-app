# Sự thật: một lá thư nặc danh gửi báo địa phương tiết lộ quỹ của hội đồng thị trấn bị chi sai. Thư in bằng máy in của văn phòng hội đồng tầng 1,
# phong bì dán bằng tem loại đặc biệt chỉ có ở quầy thư. Nhân viên quầy thư (Paul) nói cậu chưa dùng tem loại đó tuần này;
# bà Ng (lễ tân): Paul đã mua 10 tem đó hôm thứ Ba và nhờ không ghi sổ; Hugh (thư ký hội đồng): dấu gửi bưu điện là thứ Tư và Paul nghỉ ốm hôm thứ Tư?
# -> chọn: Hung thủ Paul. Bằng chứng: Ng (tem thứ Ba), Hugh (thư in bằng máy tầng 1, chìa phòng in chỉ Paul và Hugh giữ; Hugh ở nhà nghỉ phép).
id: b2-anonymous-letter
level: B2
lesson_range: [60, 70]
status: draft
title_vi: Lá thư nặc danh
cover: "✉️"
premise_vi: >-
  Một lá thư nặc danh gửi cho tờ báo địa phương nói rằng hội đồng thị trấn đã chi sai một khoản quỹ lớn.
  Hội đồng muốn biết ai là người gửi. Ba nhân viên bị hỏi. Ai đã viết lá thư?

clues:
  - id: special-stamps
    witness: ng
    text_en: "Paul bought ten special stamps on Tuesday and asked her not to write it in the book."
    text_vi: "Paul mua mười con tem đặc biệt hôm thứ Ba và nhờ bà đừng ghi vào sổ."
  - id: printer-room
    witness: hugh
    text_en: "The letter was printed on the printer in the post room, and only Paul and Hugh have a key to it."
    text_vi: "Lá thư được in bằng máy in trong phòng thư, và chỉ Paul và Hugh có chìa phòng đó."
  - id: hugh-away
    witness: hugh
    text_en: "Hugh was on holiday all of last week."
    text_vi: "Cả tuần trước Hugh nghỉ phép."
  - id: paul-claim
    witness: paul
    text_en: "Paul says he has not used those stamps this week."
    text_vi: "Paul nói tuần này anh chưa dùng loại tem đó."

witnesses:
  - id: ng
    name: Mrs Ng
    role_en: The receptionist
    avatar: "🛎️"
    segments:
      - text_en: "I look after the stamp book at reception. Everybody who buys stamps has to sign for them, and I record the date."
        vi: "Tôi giữ sổ tem ở quầy lễ tân. Ai mua tem cũng phải ký nhận và tôi ghi lại ngày."
        focus: ["look after", "has to sign"]
      - text_en: "On Tuesday afternoon Paul came and bought ten of the special green stamps, the ones we use for registered letters. He asked me not to write it in the book."
        vi: "Chiều thứ Ba Paul đến mua mười con tem xanh đặc biệt, loại chúng tôi dùng cho thư bảo đảm. Anh ấy nhờ tôi đừng ghi vào sổ."
        clues: [special-stamps]
        focus: ["registered letters", "asked me not to"]
      - text_en: "I agreed because he said it was for a personal favour. It was my mistake, and I've regretted it ever since."
        vi: "Tôi đồng ý vì anh ấy nói đó là việc riêng nhờ giúp. Đó là lỗi của tôi và tôi hối hận từ đó đến nay."
        focus: ["agreed", "regretted"]
    checks:
      - claim_vi: "Bà Ng giữ sổ tem ở quầy lễ tân."
        answer: true
        explain_vi: "Đúng: “I look after the stamp book at reception.”"
      - claim_vi: "Paul mua tem vào thứ Tư."
        answer: false
        explain_vi: "Sai: chiều thứ Ba."
      - claim_vi: "Bà Ng ghi việc mua tem vào sổ."
        answer: false
        explain_vi: "Sai: bà đã đồng ý không ghi."
  - id: hugh
    name: Hugh
    role_en: The council secretary
    avatar: "🖨️"
    segments:
      - text_en: "I was on holiday all of last week, and I only came back yesterday. I haven't seen the letter itself, only a photocopy."
        vi: "Cả tuần trước tôi nghỉ phép và hôm qua mới quay lại. Tôi chưa thấy chính lá thư, chỉ thấy bản photo."
        clues: [hugh-away]
        focus: ["only came back", "photocopy"]
      - text_en: "The newspaper editor told us that the letter had been printed on a laser printer, and the toner had a small stripe. That's a known fault with the printer in our post room."
        vi: "Biên tập viên tờ báo cho chúng tôi biết lá thư được in bằng máy in laser và mực có một vệt nhỏ. Đó là lỗi đã biết của chiếc máy in trong phòng thư của chúng tôi."
        focus: ["had been printed", "known fault"]
      - text_en: "Only two people have a key to the post room: Paul and me. As I was away, nobody else could have used it without Paul knowing."
        vi: "Chỉ hai người có chìa phòng thư: Paul và tôi. Vì tôi đi vắng nên không ai khác có thể dùng nó mà Paul không biết."
        clues: [printer-room]
        focus: ["Only two people", "could have used"]
    checks:
      - claim_vi: "Hugh nghỉ phép cả tuần trước."
        answer: true
        explain_vi: "Đúng: “I was on holiday all of last week.”"
      - claim_vi: "Có ba người giữ chìa phòng thư."
        answer: false
        explain_vi: "Sai: chỉ hai người, Paul và Hugh."
      - claim_vi: "Máy in trong phòng thư có một lỗi quen thuộc."
        answer: true
        explain_vi: "Đúng: “a known fault with the printer in our post room.”"
  - id: paul
    name: Paul
    role_en: The post room clerk
    avatar: "📮"
    segments:
      - text_en: "I've worked in the post room for six years. I send hundreds of letters every month, and I enjoy my job."
        vi: "Tôi làm ở phòng thư sáu năm rồi. Mỗi tháng tôi gửi hàng trăm lá thư và tôi thích công việc của mình."
        focus: ["I've worked", "enjoy"]
      - text_en: "I haven't used the special green stamps this week. We don't need them very often, so I didn't even know where they were."
        vi: "Tuần này tôi chưa dùng tem xanh đặc biệt. Chúng tôi không cần chúng thường xuyên nên tôi còn không biết chúng ở đâu."
        clues: [paul-claim]
        focus: ["haven't used", "didn't even know"]
      - text_en: "Many people can get into the post room when the door is open. I'm sure somebody else printed that letter."
        vi: "Nhiều người có thể vào phòng thư khi cửa mở. Tôi chắc chắn ai đó khác đã in lá thư đó."
        focus: ["get into", "somebody else"]
    checks:
      - claim_vi: "Paul làm ở phòng thư sáu năm."
        answer: true
        explain_vi: "Đúng: “I've worked in the post room for six years.”"
      - claim_vi: "Paul nói anh biết tem xanh ở đâu."
        answer: false
        explain_vi: "Sai: “I didn't even know where they were.”"
      - claim_vi: "Paul nói nhiều người có thể vào phòng thư."
        answer: true
        explain_vi: "Đúng: “Many people can get into the post room.”"
solution:
  culprit: paul
  evidence: [special-stamps, printer-room]
  explain_vi: >-
    Paul nói anh chưa dùng tem xanh đặc biệt và không biết chúng ở đâu. Nhưng bà Ng nói anh mua mười con hôm thứ Ba và dặn đừng ghi sổ,
    còn chiếc máy in có lỗi riêng chỉ có Paul và Hugh vào được, trong khi Hugh đang nghỉ phép.
  confession_en: "I didn't want to cause trouble, but I couldn't stay silent about the money. I wrote the letter, printed it at night and posted it myself. I was afraid I would lose my job if I used my name."
  confession_vi: "Tôi không muốn gây rắc rối nhưng tôi không thể im lặng về khoản tiền đó. Tôi viết thư, in vào ban đêm và tự mang đi gửi. Tôi sợ mất việc nếu dùng tên thật."
