# Sự thật: giày thể thao của Lily mất ở phòng thay đồ giờ thể dục. Zack nói cậu ở sân bóng suốt giờ học;
# thầy Cole: sân đóng cửa vì cỏ ướt, không ai ra sân; Rita thấy Zack ở dãy tủ khóa lúc 10:15. Hung thủ: Zack.
id: a2-pe-shoes
level: A2
lesson_range: [9, 13]
status: draft
title_vi: Đôi giày thể thao mất tích
cover: "👟"
premise_vi: >-
  Trong giờ thể dục, đôi giày mới của Lily biến mất khỏi phòng thay đồ. Ba người có mặt gần đó. Ai đã lấy giày?

clues:
  - id: field-closed
    witness: cole
    text: "The football field was closed because the grass was wet."
    text_vi: "Sân bóng đóng cửa vì cỏ ướt."
  - id: zack-lockers
    witness: rita
    text: "Rita saw Zack at the lockers at a quarter past ten."
    text_vi: "Rita thấy Zack ở dãy tủ khóa lúc mười giờ mười lăm."
  - id: cole-gym
    witness: cole
    text: "The class played basketball in the gym."
    text_vi: "Cả lớp chơi bóng rổ trong nhà thi đấu."
  - id: rita-sick
    witness: rita
    text: "Rita went to change her shirt."
    text_vi: "Rita vào thay áo."

witnesses:
  - id: cole
    name: Mr Cole
    role: The PE teacher
    avatar: "🏀"
    segments:
      - text: "Today the class played basketball in the gym. We started at ten o'clock."
        vi: "Hôm nay cả lớp chơi bóng rổ trong nhà thi đấu. Chúng tôi bắt đầu lúc mười giờ."
        clues: [cole-gym]
      - text: "The football field was closed. The grass was wet after the rain, so nobody played outside."
        vi: "Sân bóng đóng cửa. Cỏ ướt sau cơn mưa nên không ai chơi ngoài trời."
        clues: [field-closed]
        focus: ["closed", "nobody"]
      - text: "At the end of the lesson, Lily couldn't find her new shoes."
        vi: "Cuối giờ, Lily không tìm thấy đôi giày mới của mình."
    checks:
      - claim_vi: "Cả lớp chơi bóng rổ trong nhà thi đấu."
        answer: true
        explain_vi: "Đúng: “played basketball in the gym.”"
      - claim_vi: "Hôm nay mọi người chơi bóng đá ngoài sân."
        answer: false
        explain_vi: "Sai: sân đóng cửa vì cỏ ướt."
      - claim_vi: "Lily không tìm thấy giày mới."
        answer: true
        explain_vi: "Đúng: “Lily couldn't find her new shoes.”"
  - id: rita
    name: Rita
    role: A classmate
    avatar: "🧦"
    segments:
      - text: "I went to the changing room at ten past ten to change my shirt. I was very hot."
        vi: "Em vào phòng thay đồ lúc mười giờ mười để thay áo. Em rất nóng."
        clues: [rita-sick]
      - text: "At a quarter past ten, I saw Zack at the lockers. He was alone."
        vi: "Lúc mười giờ mười lăm, em thấy Zack ở dãy tủ khóa. Cậu ấy đi một mình."
        clues: [zack-lockers]
        focus: ["at the lockers", "alone"]
      - text: "He said he needed the toilet. But the toilet is on the other side of the gym."
        vi: "Cậu ấy nói cần đi vệ sinh. Nhưng nhà vệ sinh ở phía bên kia nhà thi đấu."
    checks:
      - claim_vi: "Rita vào phòng thay đồ để thay áo."
        answer: true
        explain_vi: "Đúng: “to change my shirt.”"
      - claim_vi: "Rita thấy Zack ở sân bóng."
        answer: false
        explain_vi: "Sai: ở dãy tủ khóa."
      - claim_vi: "Nhà vệ sinh ở gần tủ khóa."
        answer: false
        explain_vi: "Sai: ở phía bên kia nhà thi đấu."
  - id: zack
    name: Zack
    role: A classmate
    avatar: "⚽"
    segments:
      - text: "I played football on the field with my friends for the whole lesson."
        vi: "Em chơi bóng đá ngoài sân với bạn suốt cả tiết học."
        focus: ["the whole lesson", "on the field"]
      - text: "I never went into the changing room. My shoes are on my feet!"
        vi: "Em không hề vào phòng thay đồ. Giày của em đang ở chân em!"
      - text: "Perhaps somebody from another class took Lily's shoes."
        vi: "Có lẽ ai đó ở lớp khác đã lấy giày của Lily."
    checks:
      - claim_vi: "Zack nói cậu chơi bóng đá cả tiết học."
        answer: true
        explain_vi: "Đúng: “I played football… for the whole lesson.”"
      - claim_vi: "Zack nói cậu đã vào phòng thay đồ."
        answer: false
        explain_vi: "Sai: “I never went into the changing room.”"
      - claim_vi: "Zack nghĩ một lớp khác có thể lấy giày."
        answer: true
        explain_vi: "Đúng: “somebody from another class took Lily's shoes.”"
solution:
  culprit: zack
  evidence: [field-closed, zack-lockers]
  explain_vi: >-
    Zack nói cậu chơi bóng đá ngoài sân cả tiết. Nhưng sân đóng cửa vì cỏ ướt, và Rita thấy cậu ở dãy tủ khóa lúc 10:15.
  confession: "I'm sorry, Lily. Your shoes were so cool. I put them in my bag, but I'll give them back now."
  confession_vi: "Mình xin lỗi Lily. Đôi giày của bạn đẹp quá. Mình bỏ chúng vào balô nhưng giờ mình trả lại bạn."
