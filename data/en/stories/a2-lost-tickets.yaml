# Truyện trinh thám tiếng Anh (docs/DETECTIVE_STORIES_PLAN.md). Cốt truyện tự sáng tác.
# Bảng sự thật (không hiển thị cho người học):
#   - 5:00  Emma dắt chó đi dạo, vé hòa nhạc còn trên bàn bếp.
#   - 5:30  Bà Brown (hàng xóm) sang mượn đường; Lily mở cửa, vào bếp lấy đường  -> Lily ĐÃ vào bếp.
#   - Lily nói mình chỉ chơi ngoài vườn và không vào bếp           -> nói dối.
#   - Jack nhìn ra vườn hai lần, không thấy ai                      -> Lily không ở trong vườn.
#   - 6:00  Emma về, vé biến mất.  Hung thủ duy nhất: Lily (rất thích ban nhạc, bố mẹ không cho đi).
id: a2-lost-tickets
level: A2
lesson_range: [11, 15]
status: draft
title_vi: Vé hòa nhạc biến mất
cover: "🎟️"
premise_vi: >-
  Emma có hai vé xem ban nhạc yêu thích, để trên bàn bếp. Một tiếng sau, hai chiếc vé biến mất.
  Bạn là thám tử: hãy nghe lời khai của ba người trong nhà và tìm ra ai đã lấy vé.

clues:
  - id: garden-empty
    witness: jack
    text_en: "Jack looked at the garden twice. Nobody was there."
    text_vi: "Jack nhìn ra vườn hai lần. Không có ai ở đó."
  - id: lily-kitchen
    witness: brown
    text_en: "Lily went into the kitchen and brought some sugar."
    text_vi: "Lily vào bếp và mang đường ra."
  - id: doorbell
    witness: jack
    text_en: "Jack heard the doorbell once."
    text_vi: "Jack nghe chuông cửa một lần."
  - id: dislikes-band
    witness: jack
    text_en: "Jack does not like the band."
    text_vi: "Jack không thích ban nhạc đó."
  - id: brown-hall
    witness: brown
    text_en: "Mrs Brown stayed in the hall."
    text_vi: "Bà Brown chỉ đứng ở sảnh."
  - id: loves-band
    witness: lily
    text_en: "Lily loves the band."
    text_vi: "Lily rất thích ban nhạc."

witnesses:
  - id: jack
    name: Jack
    role_en: Emma's brother
    avatar: "🎮"
    segments:
      - text_en: "I was in my room all afternoon. I played video games from five o'clock to six o'clock."
        vi: "Em ở trong phòng cả buổi chiều. Em chơi điện tử từ năm giờ đến sáu giờ."
      - text_en: "My window looks at the garden. I looked outside twice, but I didn't see anyone there. The garden was empty."
        vi: "Cửa sổ phòng em nhìn ra vườn. Em nhìn ra ngoài hai lần nhưng không thấy ai ở đó. Khu vườn trống không."
        clues: [garden-empty]
        focus: ["looks at", "empty"]
      - text_en: "I don't like that band, so I didn't want the tickets. I heard the doorbell once, but I didn't go downstairs."
        vi: "Em không thích ban nhạc đó nên em không cần vé. Em nghe chuông cửa một lần nhưng em không xuống nhà."
        clues: [doorbell, dislikes-band]
        focus: ["doorbell", "downstairs"]
    checks:
      - claim_vi: "Jack chơi điện tử trong phòng từ năm giờ đến sáu giờ."
        answer: true
        explain_vi: "Đúng: “I played video games from five o'clock to six o'clock.”"
      - claim_vi: "Jack nhìn thấy một người trong vườn."
        answer: false
        explain_vi: "Sai: “I didn't see anyone there. The garden was empty.”"
      - claim_vi: "Jack đã xuống nhà khi chuông cửa reo."
        answer: false
        explain_vi: "Sai: “I heard the doorbell once, but I didn't go downstairs.”"

  - id: brown
    name: Mrs Brown
    role_en: The neighbour
    avatar: "👵"
    segments:
      - text_en: "I came to the house at half past five. I wanted to borrow some sugar for a cake."
        vi: "Tôi đến nhà lúc năm giờ rưỡi. Tôi muốn mượn một ít đường để làm bánh."
        focus: ["half past five", "borrow"]
      - text_en: "Lily opened the door and asked me to wait in the hall. Then she went into the kitchen and came back with a bag of sugar."
        vi: "Lily mở cửa và bảo tôi đợi ở sảnh. Rồi con bé vào bếp và quay lại với một túi đường."
        clues: [lily-kitchen]
        focus: ["went into", "came back with"]
      - text_en: "I stayed in the hall for two minutes. I never went into the kitchen. Then I said thank you and went home."
        vi: "Tôi đứng ở sảnh hai phút. Tôi không hề vào bếp. Rồi tôi cảm ơn và về nhà."
        clues: [brown-hall]
        focus: ["stayed", "never"]
    checks:
      - claim_vi: "Bà Brown đến nhà lúc năm giờ rưỡi."
        answer: true
        explain_vi: "Đúng: “I came to the house at half past five.”"
      - claim_vi: "Bà Brown vào bếp để lấy đường."
        answer: false
        explain_vi: "Sai: bà ở sảnh, Lily mới là người vào bếp."
      - claim_vi: "Lily vào bếp rồi quay lại với túi đường."
        answer: true
        explain_vi: "Đúng: “she went into the kitchen and came back with a bag of sugar.”"

  - id: lily
    name: Lily
    role_en: Emma's cousin
    avatar: "🎒"
    segments:
      - text_en: "I came to Emma's house at four o'clock. Emma went for a walk with the dog at five."
        vi: "Em đến nhà Emma lúc bốn giờ. Emma dắt chó đi dạo lúc năm giờ."
      - text_en: "After Emma left, I played in the garden. I stayed there for a long time. I didn't go into the kitchen."
        vi: "Sau khi Emma đi, em chơi ngoài vườn. Em ở đó rất lâu. Em không vào bếp."
        focus: ["After", "stayed"]
      - text_en: "I love that band, but I didn't take the tickets. I'm not a thief! Maybe someone came in through the front door."
        vi: "Em rất thích ban nhạc đó nhưng em không lấy vé. Em không phải kẻ trộm! Có thể ai đó đã vào bằng cửa trước."
        clues: [loves-band]
        focus: ["thief", "front door"]
    checks:
      - claim_vi: "Lily đến nhà Emma lúc bốn giờ."
        answer: true
        explain_vi: "Đúng: “I came to Emma's house at four o'clock.”"
      - claim_vi: "Lily nói rằng cô bé đã chơi ngoài vườn sau khi Emma đi."
        answer: true
        explain_vi: "Đúng: “After Emma left, I played in the garden.”"
      - claim_vi: "Lily nói rằng cô bé không thích ban nhạc."
        answer: false
        explain_vi: "Sai: “I love that band.”"

solution:
  culprit: lily
  evidence: [garden-empty, lily-kitchen]
  explain_vi: >-
    Lily nói cô bé chỉ chơi ngoài vườn và không vào bếp. Nhưng Jack nhìn ra vườn hai lần mà không thấy ai,
    và bà Brown nói chính Lily đã vào bếp lấy đường. Lily đã nói dối.
  confession_en: "I'm sorry. I love that band, but my parents said no. I took the tickets from the kitchen table. I wanted to give them back tonight."
  confession_vi: "Em xin lỗi. Em rất thích ban nhạc đó nhưng bố mẹ em không cho đi. Em đã lấy vé trên bàn bếp. Tối nay em định trả lại."
