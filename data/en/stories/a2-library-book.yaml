# Sự thật: sách xanh có ngôi sao vàng biến mất khỏi thư viện. Sam nói không mượn sách nào; máy tính cho thấy không ai mượn;
# Zara thấy Sam để một cuốn sách bìa xanh có sao vàng vào ba lô. Hung thủ: Sam.
id: a2-library-book
level: A2
lesson_range: [8, 12]
status: draft
title_vi: Cuốn sách mất tích
cover: "📕"
premise_vi: >-
  Thư viện trường mất một cuốn sách ảnh cũ rất quý, bìa màu xanh lá có một ngôi sao vàng.
  Ba người ở đó chiều nay. Ai đã lấy cuốn sách?

clues:
  - id: nobody-borrowed
    witness: reed
    text: "The computer says nobody borrowed the green book today."
    text_vi: "Máy tính cho biết hôm nay không ai mượn cuốn sách xanh."
  - id: bag-green-star
    witness: zara
    text: "Zara saw Sam put a green book with a gold star in his bag."
    text_vi: "Zara thấy Sam bỏ một cuốn sách xanh có sao vàng vào ba lô."
  - id: reed-lunch
    witness: reed
    text: "Mrs Reed went to lunch at one o'clock."
    text_vi: "Cô Reed đi ăn trưa lúc một giờ."
  - id: zara-homework
    witness: zara
    text: "Zara was doing her homework at the big table."
    text_vi: "Zara làm bài tập ở chiếc bàn lớn."

witnesses:
  - id: reed
    name: Mrs Reed
    role: The librarian
    avatar: "📚"
    segments:
      - text: "I work in the library every day. Today I went to lunch at one o'clock and came back at two."
        vi: "Tôi làm việc ở thư viện mỗi ngày. Hôm nay tôi đi ăn trưa lúc một giờ và quay lại lúc hai giờ."
        clues: [reed-lunch]
      - text: "The book has a green cover and a small gold star on it. At three o'clock it wasn't on the shelf."
        vi: "Cuốn sách có bìa màu xanh lá và một ngôi sao vàng nhỏ. Lúc ba giờ nó không còn trên kệ."
        focus: ["cover", "shelf"]
      - text: "I looked at the computer. Nobody borrowed that book today. So somebody took it without asking."
        vi: "Tôi xem máy tính. Hôm nay không ai mượn cuốn sách đó. Vậy là có người lấy mà không xin phép."
        clues: [nobody-borrowed]
        focus: ["borrowed", "without asking"]
    checks:
      - claim_vi: "Cô Reed đi ăn trưa lúc một giờ."
        answer: true
        explain_vi: "Đúng: “I went to lunch at one o'clock.”"
      - claim_vi: "Cuốn sách có bìa màu đỏ."
        answer: false
        explain_vi: "Sai: “The book has a green cover.”"
      - claim_vi: "Hôm nay có người mượn cuốn sách đó."
        answer: false
        explain_vi: "Sai: “Nobody borrowed that book today.”"
  - id: sam
    name: Sam
    role: A student
    avatar: "🎒"
    segments:
      - text: "I came to the library at half past two. I read a comic book for twenty minutes."
        vi: "Em đến thư viện lúc hai giờ rưỡi. Em đọc truyện tranh trong hai mươi phút."
      - text: "I didn't take any books today. I only looked at some pictures of animals."
        vi: "Hôm nay em không lấy cuốn sách nào. Em chỉ xem vài bức tranh về động vật."
        focus: ["didn't take", "only"]
      - text: "My bag is full of my own things. I don't need a green book!"
        vi: "Ba lô của em đầy đồ của em. Em không cần cuốn sách xanh nào cả!"
    checks:
      - claim_vi: "Sam đến thư viện lúc hai giờ rưỡi."
        answer: true
        explain_vi: "Đúng: “I came to the library at half past two.”"
      - claim_vi: "Sam nói cậu đã lấy một cuốn sách."
        answer: false
        explain_vi: "Sai: “I didn't take any books today.”"
      - claim_vi: "Sam đọc truyện tranh khoảng hai mươi phút."
        answer: true
        explain_vi: "Đúng: “I read a comic book for twenty minutes.”"
  - id: zara
    name: Zara
    role: Another student
    avatar: "✏️"
    segments:
      - text: "I was at the big table near the door. I did my homework from two o'clock to four o'clock."
        vi: "Em ngồi ở chiếc bàn lớn gần cửa. Em làm bài tập từ hai giờ đến bốn giờ."
        clues: [zara-homework]
      - text: "At about a quarter to three, I saw Sam near the shelf with the animal books. He looked around quickly."
        vi: "Khoảng ba giờ kém mười lăm, em thấy Sam gần kệ sách động vật. Cậu ấy nhìn quanh rất nhanh."
        focus: ["looked around", "quickly"]
      - text: "Then he put a green book with a gold star into his bag. I thought it was strange, but I didn't say anything."
        vi: "Rồi cậu ấy bỏ một cuốn sách xanh có sao vàng vào ba lô. Em thấy lạ nhưng em không nói gì."
        clues: [bag-green-star]
        focus: ["put … into", "strange"]
    checks:
      - claim_vi: "Zara làm bài tập đến bốn giờ."
        answer: true
        explain_vi: "Đúng: “from two o'clock to four o'clock.”"
      - claim_vi: "Zara thấy Sam bỏ sách vào ba lô."
        answer: true
        explain_vi: "Đúng: “he put a green book with a gold star into his bag.”"
      - claim_vi: "Zara đã nói với cô Reed ngay lập tức."
        answer: false
        explain_vi: "Sai: “I didn't say anything.”"
solution:
  culprit: sam
  evidence: [nobody-borrowed, bag-green-star]
  explain_vi: >-
    Sam nói cậu không lấy cuốn sách nào. Nhưng máy tính cho thấy không ai mượn cuốn sách xanh,
    và Zara thấy Sam bỏ đúng cuốn sách đó vào ba lô.
  confession: "I'm sorry. I really liked the pictures, so I put the book in my bag. I wanted to look at it at home. I'll bring it back tomorrow."
  confession_vi: "Em xin lỗi. Em rất thích những bức tranh nên bỏ cuốn sách vào ba lô. Em muốn xem ở nhà. Ngày mai em sẽ mang trả."
