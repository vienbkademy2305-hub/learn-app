# Sự thật: dấu giày ủng lấm bùn trên sàn bếp vừa lau. Tom nói cậu làm bài tập trong phòng, ủng để trong gara;
# Anna: ủng của Tom không ở gara (cô vừa dọn gara) mà đang ướt cạnh cửa sau; bố: dấu chân nhỏ cỡ 4 như của Tom, giày bố cỡ 10. Hung thủ: Tom.
id: a2-muddy-boots
level: A2
lesson_range: [9, 13]
status: draft
title_vi: Dấu chân bùn
cover: "👢"
premise_vi: >-
  Mẹ vừa lau sàn bếp xong thì có những dấu ủng lấm bùn khắp nơi. Ba người trong nhà đều nói họ không làm.
  Ai đã đi ủng bẩn vào bếp?

clues:
  - id: boots-door
    witness: anna
    text: "Tom's boots were wet by the back door, not in the garage."
    text_vi: "Ủng của Tom ướt cạnh cửa sau, không nằm trong gara."
  - id: small-prints
    witness: dad
    text: "The footprints were small, size four. Dad's boots are size ten."
    text_vi: "Các dấu chân nhỏ, cỡ bốn. Giày của bố cỡ mười."
  - id: anna-garage
    witness: anna
    text: "Anna tidied the garage in the morning."
    text_vi: "Anna dọn gara vào buổi sáng."
  - id: dad-shed
    witness: dad
    text: "Dad was working in the shed."
    text_vi: "Bố đang làm việc trong nhà kho."

witnesses:
  - id: dad
    name: Dad
    role: The father
    avatar: "🧰"
    segments:
      - text: "I was working in the shed all afternoon. I only came in for a drink of water."
        vi: "Bố làm việc trong nhà kho cả buổi chiều. Bố chỉ vào nhà uống nước."
        clues: [dad-shed]
      - text: "I looked at the footprints on the kitchen floor. They were very small. My boots are size ten, so they aren't mine."
        vi: "Bố nhìn các dấu chân trên sàn bếp. Chúng rất nhỏ. Giày của bố cỡ mười nên không phải của bố."
        clues: [small-prints]
        focus: ["small", "size ten"]
      - text: "They were size four, like Tom's boots."
        vi: "Chúng cỡ bốn, giống ủng của Tom."
    checks:
      - claim_vi: "Bố làm việc trong nhà kho."
        answer: true
        explain_vi: "Đúng: “I was working in the shed.”"
      - claim_vi: "Giày của bố cỡ bốn."
        answer: false
        explain_vi: "Sai: giày của bố cỡ mười."
      - claim_vi: "Các dấu chân rất nhỏ."
        answer: true
        explain_vi: "Đúng: “They were very small.”"
  - id: anna
    name: Anna
    role: Tom's sister
    avatar: "🎀"
    segments:
      - text: "I tidied the garage this morning. I put all the shoes and boots on the shelf."
        vi: "Sáng nay em dọn gara. Em xếp tất cả giày và ủng lên kệ."
        clues: [anna-garage]
      - text: "Tom's boots weren't in the garage. They were by the back door, and they were wet."
        vi: "Ủng của Tom không ở trong gara. Chúng ở cạnh cửa sau và còn ướt."
        clues: [boots-door]
        focus: ["by the back door", "wet"]
      - text: "Tom said, 'I'm going to do my homework.' He went upstairs."
        vi: "Tom nói: “Anh đi làm bài tập đây.” Anh ấy lên lầu."
    checks:
      - claim_vi: "Anna dọn gara vào buổi sáng."
        answer: true
        explain_vi: "Đúng: “I tidied the garage this morning.”"
      - claim_vi: "Ủng của Tom khô và nằm trong gara."
        answer: false
        explain_vi: "Sai: chúng ướt và ở cạnh cửa sau."
      - claim_vi: "Tom lên lầu làm bài tập."
        answer: true
        explain_vi: "Đúng: “He went upstairs.”"
  - id: tom
    name: Tom
    role: The brother
    avatar: "📚"
    segments:
      - text: "I did my homework in my room all afternoon. I never went outside."
        vi: "Anh làm bài tập trong phòng cả buổi chiều. Anh không hề ra ngoài."
        focus: ["all afternoon", "never"]
      - text: "My boots are in the garage. I didn't wear them today."
        vi: "Ủng của anh ở trong gara. Hôm nay anh không đi chúng."
      - text: "Maybe the dog brought mud into the kitchen."
        vi: "Có lẽ con chó mang bùn vào bếp."
    checks:
      - claim_vi: "Tom nói cậu làm bài tập trong phòng."
        answer: true
        explain_vi: "Đúng: “I did my homework in my room.”"
      - claim_vi: "Tom nói cậu đã đi ủng hôm nay."
        answer: false
        explain_vi: "Sai: “I didn't wear them today.”"
      - claim_vi: "Tom nghĩ con chó có thể mang bùn vào."
        answer: true
        explain_vi: "Đúng: “Maybe the dog brought mud into the kitchen.”"
solution:
  culprit: tom
  evidence: [boots-door, small-prints]
  explain_vi: >-
    Tom nói cậu ở trong phòng và ủng để trong gara. Nhưng ủng của cậu ướt cạnh cửa sau, và dấu chân nhỏ cỡ bốn giống ủng của cậu.
  confession: "I'm sorry, Mum. I went outside to play in the rain. I came in through the kitchen with my boots on. I was afraid you'd be angry."
  confession_vi: "Con xin lỗi mẹ. Con ra ngoài chơi dưới mưa. Con đi ủng vào bếp. Con sợ mẹ giận."
