# Sự thật: cúp vô địch của câu lạc bộ thuyền buồm mất khỏi tủ kính giữa 8:00 và 9:00 tối sau lễ trao giải.
# Bà Pryce nói bà về lúc 7 giờ bằng taxi; Jon (bartender): bà ngồi ở quầy đến 9 giờ, taxi đến 9:10; Mel (11 tuổi) thấy bà đứng cạnh tủ lúc 8:30
# cầm chìa khóa của chủ tịch. Hung thủ: bà Pryce.
id: b2-sailing-trophy
level: B2
lesson_range: [56, 66]
status: draft
title_vi: Chiếc cúp biến mất
cover: "🏆"
premise_vi: >-
  Sau lễ trao giải của câu lạc bộ thuyền buồm, chiếc cúp vô địch trăm năm tuổi biến mất khỏi tủ kính.
  Bốn người còn ở lại câu lạc bộ tối hôm đó. Ai đã lấy chiếc cúp?

clues:
  - id: bar-until-nine
    witness: jon
    text_en: "Mrs Pryce stayed at the bar until nine o'clock and her taxi came at ten past nine."
    text_vi: "Bà Pryce ngồi ở quầy bar đến chín giờ và taxi của bà đến lúc chín giờ mười."
  - id: mel-key
    witness: mel
    text_en: "Mel saw Mrs Pryce at the trophy cabinet at half past eight, holding the Commodore's key."
    text_vi: "Mel thấy bà Pryce đứng cạnh tủ cúp lúc tám giờ rưỡi, tay cầm chìa khóa của Chủ tịch."
  - id: key-lent
    witness: hale
    text_en: "The Commodore lent his key to nobody."
    text_vi: "Chủ tịch không cho ai mượn chìa khóa."
  - id: pryce-left
    witness: pryce
    text_en: "Mrs Pryce says she left at seven."
    text_vi: "Bà Pryce nói bà rời đi lúc bảy giờ."

witnesses:
  - id: hale
    name: Commodore Hale
    role_en: The club president
    avatar: "⚓"
    segments:
      - text_en: "The trophy has been in the glass cabinet since 1923. After the ceremony, at about seven, I locked the cabinet and put the key in my jacket pocket."
        vi: "Chiếc cúp nằm trong tủ kính từ năm 1923. Sau buổi lễ, khoảng bảy giờ, tôi khóa tủ và bỏ chìa vào túi áo khoác."
        focus: ["has been", "locked"]
      - text_en: "I lent the key to nobody. However, I hung my jacket on a chair near the bar, and I didn't go back to it until nine."
        vi: "Tôi không cho ai mượn chìa. Tuy nhiên tôi treo áo khoác lên một chiếc ghế gần quầy bar và không quay lại lấy nó cho đến chín giờ."
        clues: [key-lent]
        focus: ["lent", "However"]
      - text_en: "At nine I found the cabinet open and the trophy gone. The lock hadn't been forced, so someone must have used my key."
        vi: "Lúc chín giờ tôi thấy tủ mở và chiếc cúp không còn. Ổ khóa không bị phá nên chắc chắn có người đã dùng chìa của tôi."
        focus: ["hadn't been forced", "must have used"]
    checks:
      - claim_vi: "Chiếc cúp nằm trong tủ từ năm 1923."
        answer: true
        explain_vi: "Đúng: “The trophy has been in the glass cabinet since 1923.”"
      - claim_vi: "Chủ tịch cho một thành viên mượn chìa khóa."
        answer: false
        explain_vi: "Sai: “I lent the key to nobody.”"
      - claim_vi: "Ổ khóa tủ bị phá."
        answer: false
        explain_vi: "Sai: “The lock hadn't been forced.”"
  - id: jon
    name: Jon
    role_en: The bartender
    avatar: "🍸"
    segments:
      - text_en: "I work behind the bar every Saturday, so I see everybody who comes in and out of the clubhouse."
        vi: "Tôi làm sau quầy bar mỗi thứ Bảy nên tôi thấy tất cả những ai ra vào nhà câu lạc bộ."
      - text_en: "Mrs Pryce sat at the bar from the end of the ceremony until nine o'clock. She had two glasses of orange juice and read a magazine."
        vi: "Bà Pryce ngồi ở quầy bar từ lúc kết thúc buổi lễ đến chín giờ. Bà uống hai ly nước cam và đọc tạp chí."
        clues: [bar-until-nine]
        focus: ["from … until", "read a magazine"]
      - text_en: "Her taxi arrived at ten past nine; I called it myself, so I remember the time. She left a few minutes later."
        vi: "Taxi của bà đến lúc chín giờ mười; chính tôi gọi nên tôi nhớ giờ. Bà ra về vài phút sau đó."
        focus: ["I called it myself", "a few minutes later"]
    checks:
      - claim_vi: "Jon làm việc sau quầy bar mỗi thứ Bảy."
        answer: true
        explain_vi: "Đúng: “I work behind the bar every Saturday.”"
      - claim_vi: "Bà Pryce uống hai ly rượu vang."
        answer: false
        explain_vi: "Sai: hai ly nước cam."
      - claim_vi: "Taxi của bà Pryce đến lúc chín giờ mười."
        answer: true
        explain_vi: "Đúng: “Her taxi arrived at ten past nine.”"
  - id: mel
    name: Mel
    role_en: A junior sailor
    avatar: "⛵"
    segments:
      - text_en: "I'm eleven, and I came with my dad. While he was talking, I walked round the clubhouse to look at the old photographs."
        vi: "Em mười một tuổi và đi cùng bố. Trong lúc bố nói chuyện, em đi quanh nhà câu lạc bộ để xem các bức ảnh cũ."
        focus: ["While", "walked round"]
      - text_en: "At half past eight I was looking at a picture near the trophy cabinet, and I saw Mrs Pryce standing in front of the glass. She was holding a small brass key."
        vi: "Lúc tám giờ rưỡi em đang xem một bức ảnh gần tủ cúp và em thấy bà Pryce đứng trước tấm kính. Bà cầm một chiếc chìa khóa đồng nhỏ."
        clues: [mel-key]
        focus: ["in front of", "brass key"]
      - text_en: "She smiled and said she was just admiring the trophy. I thought she worked for the club, so I didn't ask anything."
        vi: "Bà mỉm cười và nói chỉ đang ngắm chiếc cúp. Em tưởng bà làm việc cho câu lạc bộ nên không hỏi gì."
        focus: ["admiring", "worked for"]
    checks:
      - claim_vi: "Mel đi cùng bố đến câu lạc bộ."
        answer: true
        explain_vi: "Đúng: “I came with my dad.”"
      - claim_vi: "Mel thấy bà Pryce cạnh tủ cúp lúc chín giờ."
        answer: false
        explain_vi: "Sai: lúc tám giờ rưỡi."
      - claim_vi: "Bà Pryce cầm một chiếc chìa khóa."
        answer: true
        explain_vi: "Đúng: “She was holding a small brass key.”"
  - id: pryce
    name: Mrs Pryce
    role_en: A long-time member
    avatar: "🧤"
    segments:
      - text_en: "I've been a member of this club for thirty years. I left straight after the ceremony, at seven o'clock, and took a taxi home."
        vi: "Tôi là thành viên câu lạc bộ này ba mươi năm rồi. Tôi ra về ngay sau buổi lễ, lúc bảy giờ, và đi taxi về nhà."
        clues: [pryce-left]
        focus: ["I've been", "straight after"]
      - text_en: "I never touched the trophy cabinet, and I certainly don't have a key. Why would I want an old silver cup?"
        vi: "Tôi chưa bao giờ đụng vào tủ cúp và chắc chắn tôi không có chìa khóa. Tôi cần một chiếc cúp bạc cũ làm gì?"
      - text_en: "Perhaps one of the young sailors took it as a joke. They've been behaving badly all season."
        vi: "Có thể một trong những thuyền viên trẻ lấy nó để đùa. Họ cư xử tệ cả mùa giải."
    checks:
      - claim_vi: "Bà Pryce nói bà rời câu lạc bộ lúc bảy giờ."
        answer: true
        explain_vi: "Đúng: “I left straight after the ceremony, at seven o'clock.”"
      - claim_vi: "Bà Pryce nói bà có chìa khóa tủ cúp."
        answer: false
        explain_vi: "Sai: “I certainly don't have a key.”"
      - claim_vi: "Bà Pryce nghi ngờ các thuyền viên trẻ."
        answer: true
        explain_vi: "Đúng: “one of the young sailors took it as a joke.”"
solution:
  culprit: pryce
  evidence: [bar-until-nine, mel-key]
  explain_vi: >-
    Bà Pryce nói bà rời câu lạc bộ lúc bảy giờ. Nhưng Jon nói bà ngồi ở quầy bar đến chín giờ, và Mel thấy bà cầm
    chìa khóa đồng đứng cạnh tủ cúp lúc tám giờ rưỡi, khi chiếc áo khoác của Chủ tịch đang treo gần quầy.
  confession_en: "My family sailed in this club for generations, but the committee never respected us. I took the key from the Commodore's jacket. I only wanted to hold the trophy once. I'm sorry."
  confession_vi: "Gia đình tôi chèo thuyền ở câu lạc bộ này nhiều thế hệ nhưng ban quản lý chưa bao giờ coi trọng chúng tôi. Tôi lấy chìa trong áo khoác của Chủ tịch. Tôi chỉ muốn cầm chiếc cúp một lần. Tôi xin lỗi."
