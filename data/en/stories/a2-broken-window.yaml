# Bảng sự thật (không hiển thị):
#   - ~3:00 cửa sổ nhà ông Evans bị vỡ bởi một quả bóng.
#   - Ben nói: tập bóng ở trường 2–4 giờ, không có mũ đỏ.
#   - Anna (em gái Ben): buổi tập hôm nay bị hủy (huấn luyện viên ốm); Ben đi lúc 2 giờ, về lúc 3:30 và giấu chiếc mũ đỏ.
#   - Ông Green (chủ tiệm đối diện): lúc 3 giờ thấy một cậu bé đội mũ đỏ chạy ra khỏi vườn nhà ông Evans.
#   - Hung thủ duy nhất: Ben (nói dối về buổi tập và về mũ đỏ).
id: a2-broken-window
level: A2
lesson_range: [14, 15]
status: draft
title_vi: Chiếc cửa sổ bị vỡ
cover: "🪟"
premise_vi: >-
  Chiều nay, cửa sổ nhà ông Evans bị một quả bóng đá làm vỡ. Không ai nhận là mình làm.
  Hãy nghe ba người và tìm ra ai đã đá quả bóng đó.

clues:
  - id: practice-cancelled
    witness: anna
    text_en: "Football practice was cancelled today."
    text_vi: "Buổi tập bóng hôm nay bị hủy."
  - id: red-cap-boy
    witness: green
    text_en: "A boy in a red cap ran away from the garden."
    text_vi: "Một cậu bé đội mũ đỏ chạy ra khỏi khu vườn."
  - id: ben-says-practice
    witness: ben
    text_en: "Ben says he was at football practice."
    text_vi: "Ben nói cậu ở buổi tập bóng."
  - id: shop-closes
    witness: green
    text_en: "Mr Green's shop closes at six."
    text_vi: "Cửa hàng của ông Green đóng cửa lúc sáu giờ."
  - id: anna-reading
    witness: anna
    text_en: "Anna was reading at home."
    text_vi: "Anna đọc sách ở nhà."

witnesses:
  - id: green
    name: Mr Green
    role_en: The shopkeeper
    avatar: "🧔"
    segments:
      - text_en: "My shop is opposite Mr Evans' house. I was at the door at three o'clock."
        vi: "Cửa hàng của tôi ở đối diện nhà ông Evans. Lúc ba giờ tôi đang đứng ở cửa."
      - text_en: "I heard a loud noise. Then I saw a boy in a red cap. He ran out of the garden with a ball."
        vi: "Tôi nghe một tiếng động lớn. Rồi tôi thấy một cậu bé đội mũ đỏ. Cậu ấy chạy ra khỏi vườn, tay cầm quả bóng."
        clues: [red-cap-boy]
        focus: ["red cap", "ran out of"]
      - text_en: "I couldn't see his face. My shop closes at six, so I went back inside to help a customer."
        vi: "Tôi không nhìn thấy mặt cậu ấy. Cửa hàng tôi đóng cửa lúc sáu giờ nên tôi vào trong giúp một khách hàng."
        clues: [shop-closes]
    checks:
      - claim_vi: "Ông Green đứng ở cửa tiệm lúc ba giờ."
        answer: true
        explain_vi: "Đúng: “I was at the door at three o'clock.”"
      - claim_vi: "Ông Green nhìn rõ mặt cậu bé."
        answer: false
        explain_vi: "Sai: “I couldn't see his face.”"
      - claim_vi: "Cậu bé chạy ra khỏi vườn với một quả bóng."
        answer: true
        explain_vi: "Đúng: “He ran out of the garden with a ball.”"

  - id: anna
    name: Anna
    role_en: Ben's sister
    avatar: "📚"
    segments:
      - text_en: "I stayed at home this afternoon. I was reading a book in the living room."
        vi: "Chiều nay em ở nhà. Em đọc sách trong phòng khách."
        clues: [anna-reading]
      - text_en: "My brother Ben left at two o'clock with his ball. Mum said, 'Don't be late!'"
        vi: "Anh Ben của em ra khỏi nhà lúc hai giờ với quả bóng. Mẹ nói: “Đừng về muộn nhé!”"
        focus: ["left", "late"]
      - text_en: "Football practice was cancelled today because the coach was ill. Ben came home at half past three. He hid his red cap under his bed."
        vi: "Hôm nay buổi tập bóng bị hủy vì huấn luyện viên bị ốm. Anh Ben về nhà lúc ba giờ rưỡi. Anh ấy giấu chiếc mũ đỏ dưới gầm giường."
        clues: [practice-cancelled]
        focus: ["cancelled", "hid"]
    checks:
      - claim_vi: "Anna đọc sách ở nhà chiều nay."
        answer: true
        explain_vi: "Đúng: “I was reading a book in the living room.”"
      - claim_vi: "Ben ra khỏi nhà lúc ba giờ."
        answer: false
        explain_vi: "Sai: Ben ra khỏi nhà lúc hai giờ."
      - claim_vi: "Buổi tập bóng hôm nay bị hủy."
        answer: true
        explain_vi: "Đúng: “Football practice was cancelled today.”"

  - id: ben
    name: Ben
    role_en: A boy from the street
    avatar: "⚽"
    segments:
      - text_en: "It wasn't me! I was at football practice at school from two to four. Coach Dan was there."
        vi: "Không phải tôi! Tôi ở buổi tập bóng ở trường từ hai đến bốn giờ. Huấn luyện viên Dan cũng ở đó."
        clues: [ben-says-practice]
        focus: ["It wasn't me", "from two to four"]
      - text_en: "I don't have a red cap. I have a blue one. I never wear red."
        vi: "Tôi không có mũ đỏ. Tôi có một chiếc mũ xanh. Tôi không bao giờ đội màu đỏ."
      - text_en: "I like Mr Evans. I would never break his window! Maybe some other boy did it."
        vi: "Tôi quý ông Evans. Tôi sẽ không bao giờ làm vỡ cửa sổ của ông! Có lẽ một cậu bé khác đã làm."
    checks:
      - claim_vi: "Ben nói rằng cậu ở buổi tập bóng."
        answer: true
        explain_vi: "Đúng: “I was at football practice at school.”"
      - claim_vi: "Ben nói rằng cậu có một chiếc mũ đỏ."
        answer: false
        explain_vi: "Sai: “I don't have a red cap.”"
      - claim_vi: "Ben nói rằng ông Evans là người xấu."
        answer: false
        explain_vi: "Sai: “I like Mr Evans.”"

solution:
  culprit: ben
  evidence: [practice-cancelled, red-cap-boy]
  explain_vi: >-
    Ben nói cậu ở buổi tập bóng và không có mũ đỏ. Nhưng Anna nói buổi tập đã bị hủy và Ben giấu chiếc mũ đỏ dưới giường,
    còn ông Green thấy một cậu bé đội mũ đỏ chạy ra khỏi vườn. Ben đã nói dối.
  confession_en: "I'm sorry, Mr Evans. We didn't have practice, so I kicked my ball in the street. It hit your window. I was afraid, so I ran away."
  confession_vi: "Cháu xin lỗi ông Evans. Hôm nay không có buổi tập nên cháu đá bóng ngoài đường. Quả bóng trúng cửa sổ nhà ông. Cháu sợ nên đã chạy đi."
