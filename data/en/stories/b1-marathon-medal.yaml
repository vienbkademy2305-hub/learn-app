# Sự thật: huy chương vàng của người thắng cuộc biến mất khỏi bàn trao giải lúc 11:10. Phòng thay đồ bị khóa để lau dọn 10:45–11:45.
# Tina nói cô khởi động trong phòng thay đồ 11:00–11:30 -> nói dối; Pete thấy Tina cạnh bàn huy chương lúc 11:10 cầm túi thể thao. Hung thủ: Tina.
id: b1-marathon-medal
level: B1
lesson_range: [22, 30]
status: draft
title_vi: Huy chương biến mất
cover: "🏅"
premise_vi: >-
  Sau cuộc chạy marathon của thị trấn, tấm huy chương vàng biến mất khỏi bàn trao giải. Bốn người ở gần bàn lúc đó.
  Ai đã lấy nó?

clues:
  - id: room-locked
    witness: barker
    text: "The changing room was locked for cleaning from 10:45 to 11:45."
    text_vi: "Phòng thay đồ bị khóa để dọn từ 10:45 đến 11:45."
  - id: tina-near-table
    witness: pete
    text: "Pete saw Tina next to the medal table at ten past eleven with a sports bag."
    text_vi: "Pete thấy Tina cạnh bàn huy chương lúc 11:10, tay cầm túi thể thao."
  - id: wu-tea
    witness: wu
    text: "Mrs Wu was serving tea at the other end of the field."
    text_vi: "Bà Wu đang phục vụ trà ở đầu kia của sân."
  - id: pete-stretching
    witness: pete
    text: "Pete was stretching on the grass near the finish line."
    text_vi: "Pete đang giãn cơ trên cỏ gần vạch đích."

witnesses:
  - id: barker
    name: Coach Barker
    role: The race organiser
    avatar: "📣"
    segments:
      - text: "I put the gold medal on the prize table at ten o'clock. I counted all the medals, and there were exactly twelve."
        vi: "Tôi đặt huy chương vàng lên bàn trao giải lúc mười giờ. Tôi đếm tất cả huy chương và có đúng mười hai chiếc."
        focus: ["put", "exactly"]
      - text: "At ten past eleven one of them was missing: the gold one. At that time the changing room had been locked since a quarter to eleven because the cleaners were working there."
        vi: "Lúc mười một giờ mười, một chiếc đã biến mất: chiếc huy chương vàng. Khi đó phòng thay đồ đã bị khóa từ mười giờ kém mười lăm vì nhân viên vệ sinh đang dọn ở đó."
        clues: [room-locked]
        focus: ["had been locked", "since"]
      - text: "The cleaners didn't let anybody in until a quarter to twelve. I'm sure about that, because I stood at the door myself."
        vi: "Nhân viên vệ sinh không cho ai vào cho đến mười hai giờ kém mười lăm. Tôi chắc chắn về điều đó vì chính tôi đã đứng ở cửa."
    checks:
      - claim_vi: "Có mười hai huy chương trên bàn lúc mười giờ."
        answer: true
        explain_vi: "Đúng: “there were exactly twelve.”"
      - claim_vi: "Phòng thay đồ được mở cho mọi người vào lúc 11 giờ."
        answer: false
        explain_vi: "Sai: phòng bị khóa từ 10:45 đến 11:45."
      - claim_vi: "Huy chương biến mất là chiếc vàng."
        answer: true
        explain_vi: "Đúng: “one of them was missing: the gold one.”"
  - id: pete
    name: Pete
    role: A runner
    avatar: "🏃"
    segments:
      - text: "I finished the race in third place. After that I was stretching on the grass near the finish line, about ten metres from the prize table."
        vi: "Tôi về đích thứ ba. Sau đó tôi giãn cơ trên cỏ gần vạch đích, cách bàn trao giải khoảng mười mét."
        clues: [pete-stretching]
      - text: "At about ten past eleven I saw Tina standing right next to the table. She was holding a big sports bag."
        vi: "Khoảng mười một giờ mười tôi thấy Tina đứng ngay cạnh bàn. Cô ấy cầm một chiếc túi thể thao lớn."
        clues: [tina-near-table]
        focus: ["right next to", "holding"]
      - text: "I didn't see her take anything, because a lot of people were walking past. But I remember that she looked nervous."
        vi: "Tôi không thấy cô ấy lấy gì vì có rất nhiều người đi qua. Nhưng tôi nhớ cô ấy trông rất lo lắng."
        focus: ["walking past", "nervous"]
    checks:
      - claim_vi: "Pete về đích thứ ba."
        answer: true
        explain_vi: "Đúng: “I finished the race in third place.”"
      - claim_vi: "Pete thấy Tina lấy huy chương."
        answer: false
        explain_vi: "Sai: “I didn't see her take anything.”"
      - claim_vi: "Tina cầm một chiếc túi thể thao."
        answer: true
        explain_vi: "Đúng: “She was holding a big sports bag.”"
  - id: wu
    name: Mrs Wu
    role: A volunteer
    avatar: "🍵"
    segments:
      - text: "I volunteer at every race. This morning I was serving tea at the other end of the field, near the car park."
        vi: "Tôi làm tình nguyện ở mọi cuộc chạy. Sáng nay tôi phục vụ trà ở đầu kia của sân, gần bãi đỗ xe."
        clues: [wu-tea]
      - text: "From there I couldn't see the prize table, so I don't know what happened. I only heard people shouting."
        vi: "Từ đó tôi không nhìn thấy bàn trao giải nên tôi không biết chuyện gì xảy ra. Tôi chỉ nghe mọi người la lên."
        focus: ["couldn't see", "shouting"]
      - text: "I know Tina well. She's a good girl and she has never taken anything. I'm sure there's a mistake."
        vi: "Tôi biết rõ Tina. Con bé ngoan và chưa bao giờ lấy gì. Tôi chắc là có sự nhầm lẫn."
    checks:
      - claim_vi: "Bà Wu phục vụ trà gần bàn trao giải."
        answer: false
        explain_vi: "Sai: bà ở đầu kia của sân, gần bãi đỗ xe."
      - claim_vi: "Bà Wu nhìn thấy kẻ lấy huy chương."
        answer: false
        explain_vi: "Sai: “I couldn't see the prize table.”"
      - claim_vi: "Bà Wu tin rằng Tina là người tốt."
        answer: true
        explain_vi: "Đúng: “She's a good girl.”"
  - id: tina
    name: Tina
    role: A runner
    avatar: "👟"
    segments:
      - text: "I finished the race in sixth place. I wasn't happy with my time, so I went to the changing room to warm up and think."
        vi: "Tôi về đích thứ sáu. Tôi không hài lòng với thành tích nên tôi vào phòng thay đồ để khởi động và suy nghĩ."
        focus: ["wasn't happy with", "warm up"]
      - text: "I stayed there from eleven o'clock to half past eleven. I was alone, so nobody can say they saw me, but I never went near the prize table."
        vi: "Tôi ở đó từ mười một giờ đến mười một giờ rưỡi. Tôi ở một mình nên không ai có thể nói họ thấy tôi, nhưng tôi không hề đến gần bàn trao giải."
      - text: "I don't need a medal. I'm just a hobby runner, and I'm not interested in prizes."
        vi: "Tôi không cần huy chương. Tôi chỉ là người chạy cho vui và không quan tâm đến giải thưởng."
    checks:
      - claim_vi: "Tina nói cô ở phòng thay đồ từ 11:00 đến 11:30."
        answer: true
        explain_vi: "Đúng: “from eleven o'clock to half past eleven.”"
      - claim_vi: "Tina nói cô đến gần bàn trao giải."
        answer: false
        explain_vi: "Sai: “I never went near the prize table.”"
      - claim_vi: "Tina nói cô rất muốn có huy chương."
        answer: false
        explain_vi: "Sai: “I don't need a medal.”"
solution:
  culprit: tina
  evidence: [room-locked, tina-near-table]
  explain_vi: >-
    Tina nói cô ở trong phòng thay đồ từ 11:00 đến 11:30. Nhưng phòng bị khóa từ 10:45 đến 11:45, và Pete thấy cô
    đứng cạnh bàn huy chương lúc 11:10 với một chiếc túi lớn.
  confession: "I'm sorry. I wanted to win something this year, and I was very disappointed. I took the medal and put it in my bag. I was going to return it, but I got scared."
  confession_vi: "Tôi xin lỗi. Năm nay tôi muốn thắng một thứ gì đó và tôi rất thất vọng. Tôi lấy huy chương bỏ vào túi. Tôi định trả lại nhưng tôi sợ."
