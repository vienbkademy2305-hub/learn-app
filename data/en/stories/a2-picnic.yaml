# Sự thật: sandwich trong giỏ picnic bị ăn mất lúc 12:30. Ben nói cậu chơi xích đu cả buổi; Ella nói xích đu bị căng dây vàng
# (đóng) vì mưa đêm qua; ông nội thấy áo Ben dính sốt mayonnaise. Hung thủ: Ben.
id: a2-picnic
level: A2
lesson_range: [8, 10]
status: draft
title_vi: Bữa picnic bị phá hỏng
cover: "🧺"
premise_vi: >-
  Cả nhà đi picnic ở công viên. Khi mọi người quay lại, những chiếc bánh sandwich trong giỏ đã biến mất.
  Ai đã ăn chúng?

clues:
  - id: swings-closed
    witness: ella
    text: "The swings were closed with yellow tape."
    text_vi: "Xích đu bị căng dây băng vàng, không cho chơi."
  - id: mayo-shirt
    witness: grandpa
    text: "Ben had mayonnaise on his shirt."
    text_vi: "Áo của Ben dính sốt mayonnaise."
  - id: grandpa-bench
    witness: grandpa
    text: "Grandpa sat on a bench near the lake."
    text_vi: "Ông ngồi trên ghế dài gần hồ."
  - id: ella-ice-cream
    witness: ella
    text: "Ella bought an ice cream at the kiosk."
    text_vi: "Ella mua một cây kem ở quầy."

witnesses:
  - id: grandpa
    name: Grandpa
    role: Ben and Ella's grandfather
    avatar: "👴"
    segments:
      - text: "I sat on a bench near the lake and read my newspaper. I didn't walk around."
        vi: "Ông ngồi trên ghế dài gần hồ và đọc báo. Ông không đi loanh quanh."
        clues: [grandpa-bench]
      - text: "At half past twelve Ben came to the bench. He said, 'I'm not hungry.' He smiled a lot."
        vi: "Mười hai giờ rưỡi Ben đến chỗ ghế dài. Cháu nói: “Cháu không đói.” Cháu cười rất nhiều."
        focus: ["not hungry", "smiled"]
      - text: "I looked at his shirt. There was white mayonnaise on it, near the pocket. I said nothing."
        vi: "Ông nhìn áo của cháu. Có sốt mayonnaise màu trắng dính gần túi áo. Ông không nói gì."
        clues: [mayo-shirt]
        focus: ["mayonnaise", "pocket"]
    checks:
      - claim_vi: "Ông ngồi gần hồ."
        answer: true
        explain_vi: "Đúng: “I sat on a bench near the lake.”"
      - claim_vi: "Ben nói rằng cậu rất đói."
        answer: false
        explain_vi: "Sai: “I'm not hungry.”"
      - claim_vi: "Áo của Ben dính sốt."
        answer: true
        explain_vi: "Đúng: “There was white mayonnaise on it.”"
  - id: ella
    name: Ella
    role: Ben's sister
    avatar: "🍦"
    segments:
      - text: "I went to the kiosk and bought an ice cream. It was chocolate and very cold."
        vi: "Em đến quầy và mua một cây kem. Đó là kem sô-cô-la và rất lạnh."
        clues: [ella-ice-cream]
      - text: "On my way back, I walked past the playground. The swings were closed. There was yellow tape around them because of the rain last night."
        vi: "Trên đường về, em đi ngang sân chơi. Xích đu bị đóng. Có băng vàng quanh chúng vì cơn mưa đêm qua."
        clues: [swings-closed]
        focus: ["closed", "because of"]
      - text: "I saw Ben sitting behind a big tree, near the picnic basket. He was eating something."
        vi: "Em thấy Ben ngồi sau một cái cây lớn, gần giỏ picnic. Cậu ấy đang ăn gì đó."
        focus: ["behind", "eating"]
    checks:
      - claim_vi: "Ella mua một cây kem vani."
        answer: false
        explain_vi: "Sai: kem sô-cô-la."
      - claim_vi: "Xích đu bị đóng vì mưa."
        answer: true
        explain_vi: "Đúng: “The swings were closed… because of the rain.”"
      - claim_vi: "Ella thấy Ben ngồi sau một cái cây."
        answer: true
        explain_vi: "Đúng: “I saw Ben sitting behind a big tree.”"
  - id: ben
    name: Ben
    role: The little brother
    avatar: "🛝"
    segments:
      - text: "I played on the swings all afternoon. I didn't go near the basket."
        vi: "Cháu chơi xích đu cả buổi chiều. Cháu không đến gần cái giỏ."
        focus: ["all afternoon", "near"]
      - text: "I wasn't hungry because I ate a big breakfast. I don't like sandwiches anyway."
        vi: "Cháu không đói vì cháu đã ăn sáng rất nhiều. Dù sao cháu cũng không thích sandwich."
      - text: "Maybe a dog ate them. There are a lot of dogs in the park!"
        vi: "Có lẽ một con chó đã ăn chúng. Trong công viên có rất nhiều chó!"
    checks:
      - claim_vi: "Ben nói cậu chơi xích đu cả buổi chiều."
        answer: true
        explain_vi: "Đúng: “I played on the swings all afternoon.”"
      - claim_vi: "Ben nói cậu thích sandwich."
        answer: false
        explain_vi: "Sai: “I don't like sandwiches anyway.”"
      - claim_vi: "Ben nghĩ có thể một con chó đã ăn chúng."
        answer: true
        explain_vi: "Đúng: “Maybe a dog ate them.”"
solution:
  culprit: ben
  evidence: [swings-closed, mayo-shirt]
  explain_vi: >-
    Ben nói cậu chơi xích đu cả buổi chiều. Nhưng xích đu đã bị đóng vì mưa, và áo cậu dính sốt mayonnaise như đã ăn sandwich.
  confession: "I'm sorry. I was very hungry, and the sandwiches looked so good. I ate them behind the tree. I'll buy you new ones."
  confession_vi: "Cháu xin lỗi. Cháu đói quá và mấy chiếc sandwich trông ngon quá. Cháu ăn sau gốc cây. Cháu sẽ mua cái mới."
