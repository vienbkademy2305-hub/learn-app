# Ngân hàng 44 âm tiếng Anh (giọng Anh-Anh chuẩn) cho người Việt. BẢN NHÁP chờ duyệt.
# Tự viết; "Tree or Three?" (nguồn reference) chỉ dùng để đối chiếu phạm vi/thứ tự âm — không chép cặp từ, câu, hình.
# - lesson: buổi có âm này làm trọng tâm phát âm (references/ban-do-tai-lieu.md §2 của skill english-content).
# - pairs: cặp từ tối thiểu (chỉ khác nhau 1 âm) — âm của mục này đứng TRƯỚC.
# - IPA của từ ví dụ: ai-draft, cần đối chiếu Wiktionary/Cambridge.
source: editorial
status: draft
sounds:
  # ── Nguyên âm đơn ─────────────────────────────────────────────────────────
  - id: snd-ii
    ipa: "iː"
    kind: vowel
    examples: [see, eat, green]
    how_vi: "Âm \"i\" kéo dài, môi căng sang hai bên như đang cười."
    note_vi: "Người Việt đọc /iː/ và /ɪ/ giống nhau. /iː/ dài và căng hơn hẳn."
    pairs: [[seat, sit], [leave, live], [feel, fill]]
    lesson: 8
    tot_unit: 6
  - id: snd-i
    ipa: "ɪ"
    kind: vowel
    examples: [sit, big, fish]
    how_vi: "Âm \"i\" ngắn, gọn, môi thả lỏng, miệng hơi mở hơn /iː/."
    note_vi: "Không kéo dài: ship khác sheep. Cũng là âm của đuôi -ing, -es (/ɪz/), -ed (/ɪd/)."
    pairs: [[sit, seat], [live, leave], [fill, feel]]
    lesson: 8
    tot_unit: 7
  - id: snd-e
    ipa: "e"
    kind: vowel
    examples: [bed, pen, ten]
    how_vi: "Giống \"e\" tiếng Việt nhưng miệng mở vừa, lưỡi hơi cao hơn."
    note_vi: "Phân biệt với /æ/: /e/ miệng mở ít hơn."
    pairs: [[bed, bad], [men, man], [said, sad]]
    lesson: 8
    tot_unit: 15
  - id: snd-ae
    ipa: "æ"
    kind: vowel
    examples: [cat, bag, happy]
    how_vi: "Mở miệng rộng như nói \"a\" nhưng vị trí lưỡi của \"e\"; hàm dưới hạ thấp."
    note_vi: "Tiếng Việt không có. Hay bị đọc thành \"e\" (bad → bed) hoặc \"a\" (cat → cut)."
    pairs: [[bad, bed], [cat, cut], [man, men]]
    lesson: 8
    tot_unit: 16
  - id: snd-uh
    ipa: "ʌ"
    kind: vowel
    examples: [cup, bus, mother]
    how_vi: "Âm \"ă\" ngắn, miệng mở vừa, lưỡi thả lỏng ở giữa."
    note_vi: "Gần \"ă\" tiếng Việt. Chú ý chữ o/ou cũng đọc /ʌ/: son, mother, country."
    pairs: [[cut, cart], [hut, heart], [cup, cap]]
    lesson: 9
    tot_unit: 17
  - id: snd-aa
    ipa: "ɑː"
    kind: vowel
    examples: [car, father, park]
    how_vi: "Âm \"a\" dài, miệng mở rộng, lưỡi lùi về sau. Chữ r sau nó không đọc (giọng Anh-Anh)."
    note_vi: "Không cong lưỡi đọc \"r\" ở car, park (giọng Anh-Anh)."
    pairs: [[cart, cut], [heart, hut], [heart, hot]]
    lesson: 9
    tot_unit: 18
  - id: snd-o
    ipa: "ɒ"
    kind: vowel
    examples: [hot, dog, shop]
    how_vi: "Âm \"o\" ngắn, miệng tròn và mở rộng."
    note_vi: "Ngắn hơn hẳn /ɔː/: shot khác short."
    pairs: [[pot, port], [shot, short], [cod, cord]]
    lesson: 11
    tot_unit: 20
  - id: snd-oo
    ipa: "ɔː"
    kind: vowel
    examples: [ball, door, walk]
    how_vi: "Âm \"o\" dài, môi tròn và hơi chu ra."
    note_vi: "Chữ l trong walk, talk câm. Không đọc walk thành work (/ɜː/)."
    pairs: [[port, pot], [walk, work], [caught, coat]]
    lesson: 11
    tot_unit: 21
  - id: snd-u
    ipa: "ʊ"
    kind: vowel
    examples: [book, good, put]
    how_vi: "Âm \"u\" ngắn, môi tròn nhẹ, thả lỏng."
    note_vi: "Ngắn: full khác fool. Chữ oo có lúc đọc /ʊ/ (book), có lúc /uː/ (food)."
    pairs: [[full, fool], [pull, pool], [look, Luke]]
    lesson: 17
    tot_unit: 29
  - id: snd-uu
    ipa: "uː"
    kind: vowel
    examples: [food, blue, school]
    how_vi: "Âm \"u\" dài, môi tròn và chu ra."
    note_vi: "Kéo dài và căng môi hơn /ʊ/."
    pairs: [[fool, full], [pool, pull], [Luke, look]]
    lesson: 17
    tot_unit: 30
  - id: snd-er
    ipa: "ɜː"
    kind: vowel
    examples: [bird, work, learn]
    how_vi: "Âm \"ơ\" dài, môi dẹt, lưỡi ở giữa miệng, không cong lưỡi."
    note_vi: "Tiếng Việt không có đúng âm này; không đọc work thành walk, bird thành bud."
    pairs: [[heard, hard], [work, walk], [bird, bud]]
    lesson: 14
    tot_unit: 23
  - id: snd-schwa
    ipa: "ə"
    kind: vowel
    examples: [about, doctor, banana]
    how_vi: "Âm \"ơ\" rất ngắn và nhẹ, miệng thả lỏng hoàn toàn. Chỉ có ở âm tiết KHÔNG nhấn."
    note_vi: "Âm hay gặp nhất trong tiếng Anh. Người Việt hay đọc rõ mọi âm tiết (ba-na-na) — phải đọc nhẹ âm không nhấn: bə-NAA-nə. Dạng yếu: a /ə/, than /ðən/, to /tə/, of /əv/."
    pairs: []
    lesson: 18
    tot_unit: 3
  # ── Nguyên âm đôi ─────────────────────────────────────────────────────────
  - id: snd-ei
    ipa: "eɪ"
    kind: diphthong
    examples: [day, name, paper]
    how_vi: "Trượt từ \"e\" sang \"i\": \"ây\"."
    note_vi: "Phải trượt đủ sang \"i\": late khác let."
    pairs: [[late, let], [wait, wet], [pain, pen]]
    lesson: 14
    tot_unit: 41
  - id: snd-ai
    ipa: "aɪ"
    kind: diphthong
    examples: [time, like, my]
    how_vi: "Trượt từ \"a\" sang \"i\": \"ai\"."
    note_vi: "Giữ phụ âm cuối sau nó: time, like, white — không nuốt /m/, /k/, /t/."
    pairs: [[white, wait], [time, tame], [buy, bay]]
    lesson: 15
    tot_unit: 43
  - id: snd-oi
    ipa: "ɔɪ"
    kind: diphthong
    examples: [boy, enjoy, noise]
    how_vi: "Trượt từ \"o\" sang \"i\": \"oi\"."
    note_vi: "Gần \"oi\" tiếng Việt, dễ."
    pairs: [[boy, buy], [toy, tie], [oil, aisle]]
    lesson: 19
    tot_unit: 42
  - id: snd-ou
    ipa: "əʊ"
    kind: diphthong
    examples: [go, home, phone]
    how_vi: "Trượt từ \"ơ\" sang \"u\": \"âu\" (giọng Anh-Anh)."
    note_vi: "Không đọc thành \"ô\" đơn: coat khác caught. won't /wəʊnt/ khác want /wɒnt/."
    pairs: [[coat, caught], [low, law], [won't, want]]
    lesson: 15
    tot_unit: 34
  - id: snd-au
    ipa: "aʊ"
    kind: diphthong
    examples: [house, now, brown]
    how_vi: "Trượt từ \"a\" sang \"u\": \"ao\"."
    note_vi: "now khác know (/əʊ/), loud khác load."
    pairs: [[now, know], [loud, load], [found, fond]]
    lesson: 17
    tot_unit: 33
  - id: snd-ie
    ipa: "ɪə"
    kind: diphthong
    examples: [here, near, ear]
    how_vi: "Trượt từ \"i\" sang \"ơ\" nhẹ: \"ia\". Không đọc r cuối (Anh-Anh)."
    note_vi: "here khác hair (/eə/)."
    pairs: [[here, hair], [ear, air], [beer, bear]]
    lesson: 3
    tot_unit: 27
  - id: snd-ea
    ipa: "eə"
    kind: diphthong
    examples: [chair, there, where]
    how_vi: "Trượt từ \"e\" sang \"ơ\" nhẹ: \"eơ\". Không đọc r cuối (Anh-Anh)."
    note_vi: "there, their, they're đọc giống nhau: /ðeə/."
    pairs: [[hair, here], [air, ear], [bear, beer]]
    lesson: 3
    tot_unit: 28
  - id: snd-ue
    ipa: "ʊə"
    kind: diphthong
    examples: [tour, pure, sure]
    how_vi: "Trượt từ \"u\" sang \"ơ\" nhẹ: \"uơ\"."
    note_vi: "Ít gặp; nhiều người bản xứ đọc sure, tour thành /ɔː/. Chỉ cần nhận ra khi nghe."
    pairs: []
    lesson: 19
    tot_unit: null
  # ── Phụ âm ────────────────────────────────────────────────────────────────
