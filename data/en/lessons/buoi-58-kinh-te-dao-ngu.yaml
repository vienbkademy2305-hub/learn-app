  - type: dialogue
    title_vi: Tháng lương đầu tiên
    lines:
      - speaker: A
        text: I've just got my first salary. I'm thinking of splashing out on a new phone.
        vi: Mình vừa nhận lương tháng đầu. Mình đang định chi mạnh tay mua điện thoại mới.
      - speaker: B
        text: But your phone is only a year old! Is it just a status symbol?
        vi: Nhưng điện thoại của bạn mới dùng một năm! Chỉ để khoe thôi à?
      - speaker: A
        text: Maybe a little. Everyone at work has the latest model.
        vi: Có lẽ một chút. Ai ở chỗ làm cũng có đời mới nhất.
      - speaker: B
        text: Not only would you spend two months' salary, but you'd also need a loan.
        vi: Bạn không chỉ tiêu hai tháng lương mà còn phải vay nữa.
      - speaker: A
        text: True. I really don't want to get into debt.
        vi: Đúng. Mình thật sự không muốn mắc nợ.
      - speaker: B
        text: Why don't you save part of it and buy a good second-hand one later?
        vi: Sao bạn không để dành một phần rồi sau mua một chiếc cũ tốt?
      - speaker: A
        text: Good idea. Only when I have enough savings will I buy a new one.
        vi: Ý hay. Chỉ khi có đủ tiền tiết kiệm mình mới mua cái mới.
  - type: exercises
    items:
      - id: b58-x1
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu bằng đảo ngữ, bắt đầu bằng từ cho sẵn.
        questions:
          - q: People rarely read the small print. → Rarely ___
            answer: do people read the small print.
          - q: I have never seen such high prices. → Never ___
            answer: have I seen such high prices.
          - q: Online shopping saves time. It also encourages impulse buying. → Not only ___
            answer: does online shopping save time, but it also encourages impulse buying.
          - q: People save more only when prices rise. → Only when ___
            answer: prices rise do people save more.
          - q: We can reduce waste only by buying less. → Only by ___
            answer: buying less can we reduce waste.
      - id: b58-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: Seldom ___ about the environmental cost of cheap clothes.
            options:
              - people think
              - do people think
              - people do think
              - do people thinks
            answer: b
          - q: Never before ___ so easy to borrow money.
            options:
              - it has been
              - has it been
              - it was being
              - was it be
            answer: b
          - q: Not only ___ prices, but it also reduces wages.
            options:
              - inflation raises
              - does inflation raise
              - does inflation raises
              - inflation does raise
            answer: b
          - q: Only when the recession ended ___ to spend again.
            options:
              - consumers started
              - did consumers start
              - consumers did start
              - did consumers started
            answer: b
          - q: Which sentence is NOT correct?
            options:
              - Advertising not only creates desire but also encourages debt.
              - Not only does advertising create desire, but it also encourages debt.
              - Not only advertising creates desire, but it also encourages debt.
              - Advertising creates desire and also encourages debt.
            answer: c
            explain_vi: "Not only ở đầu câu phải đảo: Not only does advertising create …"
      - id: b58-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank:
          - disposable income
          - impulse buying
          - luxury goods
          - materialistic
          - inflation
          - frugal
          - second-hand
          - retailers
        questions:
          - q: Supermarkets put sweets near the checkout to encourage ___.
            answer: impulse buying
          - q: After paying rent and bills, young workers have little ___.
            answer: disposable income
          - q: When ___ is high, the same money buys fewer things.
            answer: inflation
          - q: Many online ___ offer free delivery.
            answer: retailers
          - q: My grandparents lived a very ___ life and never wasted food.
            answer: frugal
          - q: Buying ___ clothes is cheaper and better for the environment.
            answer: second-hand
          - q: Some critics say modern society has become too ___.
            answer: materialistic
          - q: Designer handbags and expensive watches are examples of ___.
            answer: luxury goods
      - id: b58-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 5 lỗi (đảo ngữ, trợ động từ, số nhiều). Sửa trực tiếp.
        text: Never consumers have had so much choice. Rarely do people stops to think before they buy. Not only e-commerce saves time, but it also encourages impulse buying. Only when they receive the bill people realise how much they spent. Luxury goods is often bought as status symbols.
        errors:
          - wrong: Never consumers have had
            right: Never have consumers had
            why: Never đầu câu → đảo have.
          - wrong: do people stops
            right: do people stop
            why: Sau do là V nguyên thể.
          - wrong: Not only e-commerce saves
            right: Not only does e-commerce save
            why: Not only đầu câu → mượn does, V nguyên thể.
          - wrong: the bill people realise
            right: the bill do people realise
            why: Only when … → đảo ở mệnh đề chính.
          - wrong: Luxury goods is
            right: Luxury goods are
            why: goods luôn số nhiều.
      - id: b58-x5
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: recession
            right: a period when the economy stops growing and many people lose jobs
          - left: inflation
            right: a general rise in prices
          - left: debt
            right: money that you owe
          - left: status symbol
            right: something you own to show that you are rich or important
          - left: frugal
            right: careful not to spend much money
          - left: consumerism
            right: the idea that buying more things is good
      - id: b58-x6
        bank_no: 18
        kind: completion
        instructions_vi: Nghe cuộc phỏng vấn khảo sát người mua sắm (hai giọng) và hoàn thành phiếu. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ.
        max_words: 1
        audio_text: |-
          Woman: Excuse me, have you got a minute for a short survey about shopping habits?
          Man: Sure, go ahead.
          Woman: How often do you buy things online?
          Man: About twice a week, mostly clothes.
          Woman: And how much do you spend each month?
          Man: Around two hundred pounds. Oh no, sorry, it's more like three hundred now, because of inflation.
          Woman: Do you ever buy second-hand items?
          Man: Yes, furniture. It's much cheaper.
          Woman: Finally, what makes you buy things you don't need?
          Man: Probably the discounts. When I see fifty per cent off, I can't resist.
        passage: |-
          SHOPPING HABITS SURVEY
          Buys online: (1) ___ a week
          Mostly buys: (2) ___
          Monthly spending: £(3) ___
          Buys second-hand: (4) ___
          Reason for impulse buying: (5) ___
        questions:
          - q: (1)
            answer: twice
          - q: (2)
            answer: clothes
          - q: (3)
            answer: "300"
            accept:
              - three hundred
          - q: (4)
            answer: furniture
          - q: (5)
            answer: discounts
      - id: b58-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe bản tin kinh tế rồi chọn T (đúng) hoặc F (sai).
        audio_text: New figures show that online sales rose by twelve per cent last year, while sales in traditional shops fell slightly. Not only are more people shopping online, but they are also spending more on each order. However, economists warn that household debt has also increased. Rarely have so many young people used buy-now-pay-later services, and many do not understand the fees involved.
        questions:
          - q: Online sales grew last year.
            answer: T
          - q: Sales in traditional shops rose slightly.
            answer: F
          - q: People are spending less on each online order.
            answer: F
          - q: Economists are worried about household debt.
            answer: T
      - id: b58-x8
        bank_no: 7
        kind: error-correction
        instructions_vi: "Lỗi đặc trưng người Việt khi viết về tiêu dùng: 4 lỗi (số nhiều, to be, giới từ). Sửa trực tiếp."
        text: Nowadays, many young people spend a lot of money for luxury goods. They buy it because it is a status symbol. This trend very common in big cities. Many student take out loans to buy phones.
        errors:
          - wrong: money for luxury goods
            right: money on luxury goods
            why: spend money ON something.
          - wrong: They buy it because it is a status symbol
            right: They buy them because they are status symbols
            why: goods số nhiều → them, they are.
          - wrong: This trend very common
            right: This trend is very common
            why: Thiếu to be trước tính từ.
          - wrong: Many student take
            right: Many students take
            why: many + danh từ số nhiều.
