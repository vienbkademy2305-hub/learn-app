  - type: skill
    skill: writing
    title_vi: Writing Task 2 — đa dạng cấu trúc câu (Grammatical Range & Accuracy)
    intro_vi: "Tiêu chí GRA band 6: 'uses a mix of simple and complex sentence forms'. Band 7: 'uses a variety of complex structures … frequent error-free sentences'. Nghĩa là để lên 7 bạn cần NHIỀU LOẠI câu phức (quan hệ, điều kiện, bị động, mệnh đề danh từ, phân từ, đảo ngữ…) và phần lớn câu không lỗi. Đảo ngữ là một 'màu' trong bảng — dùng 1 lần đúng chỗ thì ghi điểm, dùng 4 lần thì bài nghe như học thuộc."
    steps:
      - title_vi: Viết ý trước, chọn cấu trúc sau
        text_vi: Đừng bắt đầu bằng 'mình phải dùng đảo ngữ'. Viết ý rõ ràng trước, rồi xem câu nào cần NHẤN MẠNH — đó là chỗ đặt đảo ngữ (thường ở câu chủ đề hoặc câu kết).
      - title_vi: Rà bảng cấu trúc
        text_vi: "Sau khi viết nháp, đánh dấu: đã có mệnh đề quan hệ? điều kiện? bị động? mệnh đề danh từ? phân từ? Thiếu 2–3 loại thì sửa vài câu, không viết lại cả bài."
      - title_vi: Đảo ngữ ở câu cần nhấn mạnh
        text_vi: "Mở bài/kết bài: 'Never before have consumers had so much choice.' Thân bài: 'Not only does …, but it also …' để nối hai lợi ích/tác hại."
      - title_vi: Kiểm tra trợ động từ
        text_vi: Thì gì → trợ động từ gì (do/does/did/have/has/can). Sau do/does/did là V nguyên thể.
      - title_vi: Giữ câu đơn khi cần
        text_vi: "Câu ngắn rõ ràng vẫn có chỗ: sau một câu dài, một câu ngắn giúp người đọc theo kịp. Band 7 không có nghĩa là mọi câu đều phức."
    tips:
      - Một bài Task 2 band 7 thường có 5–6 loại câu phức khác nhau, mỗi loại 1–2 lần.
      - Câu đúng đơn giản > câu phức sai. Giám khảo trừ điểm Accuracy khi câu phức có lỗi.
      - "Đảo ngữ an toàn nhất: Not only … but also, Only by + V-ing, Never before have …"
    traps:
      - trap_vi: "Đảo ngữ quên trợ động từ: 'Rarely people save'."
        fix_vi: Rarely DO people save.
      - trap_vi: "Chia động từ chính sau does: 'Not only does it saves'."
        fix_vi: "does + V nguyên thể: does it save."
      - trap_vi: Dùng đảo ngữ ở mọi đoạn.
        fix_vi: Tối đa 1–2 câu đảo ngữ cả bài.
    phrases:
      - en: Never before have consumers had so much choice.
        vi: Chưa bao giờ người tiêu dùng có nhiều lựa chọn như vậy.
        note_vi: Mở bài chủ đề tiêu dùng.
      - en: Not only does …, but it also …
        vi: … không chỉ … mà còn …
      - en: Only by … can we …
        vi: Chỉ bằng cách … chúng ta mới có thể …
        note_vi: Câu giải pháp/kết bài.
      - en: Rarely do people stop to consider …
        vi: Hiếm khi người ta dừng lại để cân nhắc …
      - en: Only when … do people realise …
        vi: Chỉ khi … người ta mới nhận ra …
    demo:
      title_vi: "Làm mẫu: nâng một đoạn thân bài từ band 6 lên band 7 bằng đa dạng cấu trúc"
      text_en: |-
        Question: In many countries, people are buying more and more things they do not need. Why is this happening? Is it a positive or negative development?

        Band 6: People buy more things now because shopping online is easy. Companies advertise a lot on social media. People see the ads and they buy things. This is negative because people get into debt and there is a lot of waste.

        Band 7: The main reason for this trend is the rise of e-commerce. Not only does online shopping save time, but it also offers instant gratification, which makes impulse buying almost effortless. What makes matters worse is that advertisements are now tailored to each user's interests, so products seem to appear exactly when people want them. Having bought items they did not need, many consumers end up in debt. Only by becoming aware of these tactics can shoppers resist them.
      notes:
        - label: Not only does … but it also
          text_vi: Đảo ngữ nối hai lợi ích — dùng một lần.
        - label: ", which makes …"
          text_vi: Mệnh đề quan hệ không xác định (Buổi 48).
        - label: What makes matters worse is that …
          text_vi: Mệnh đề danh từ (Buổi 54).
        - label: Having bought …
          text_vi: Mệnh đề phân từ (Buổi 56).
        - label: Only by … can shoppers resist
          text_vi: Đảo ngữ thứ hai, ở câu kết đoạn — nhấn mạnh giải pháp.
