  - type: dialogue
    title_vi: Nhận xét bài viết với giáo viên
    lines:
      - speaker: Teacher
        text: I've marked your Task 2. Overall, I'd say it's a 6.
        vi: Cô đã chấm bài Task 2 của em. Nhìn chung, cô cho khoảng 6.
      - speaker: Student
        text: Which criterion is the weakest?
        vi: Tiêu chí nào yếu nhất ạ?
      - speaker: Teacher
        text: Coherence. You start almost every sentence with 'Moreover', and your second paragraph has two main ideas.
        vi: Mạch lạc. Em mở gần như mọi câu bằng 'Moreover', và đoạn hai có hai ý chính.
      - speaker: Student
        text: What about grammar? I used inversion and a cleft sentence.
        vi: Còn ngữ pháp ạ? Em đã dùng đảo ngữ và câu chẻ.
      - speaker: Teacher
        text: Good range, but you still forget the plural 's' quite often. That keeps accuracy at 6.
        vi: Đa dạng tốt, nhưng em vẫn hay quên 's' số nhiều. Điều đó giữ độ chính xác ở mức 6.
      - speaker: Student
        text: So if I had checked for plurals, I might have got 6.5?
        vi: Vậy nếu em soát số nhiều thì có thể đã được 6.5 ạ?
      - speaker: Teacher
        text: Quite possibly. Make that your one goal for the next essay.
        vi: Rất có thể. Hãy lấy đó làm mục tiêu duy nhất cho bài sau.
  - type: exercises
    items:
      - id: b65-x1
        bank_no: 8
        kind: transformation
        instructions_vi: "Ôn cấu trúc GĐ3: viết lại câu theo gợi ý."
        questions:
          - q: Online shopping saves time. It also encourages impulse buying. → Not only ___
            answer: does online shopping save time, but it also encourages impulse buying.
            explain_vi: Buổi 58.
          - q: The city didn't fund the theatre. It closed. → If the city had ___
            answer: funded the theatre, it wouldn't have closed.
            accept:
              - funded the theatre, it would not have closed.
            explain_vi: Buổi 60.
          - q: The cost worries taxpayers most. → What ___
            answer: worries taxpayers most is the cost.
            explain_vi: Buổi 63.
          - q: She finished the report. Then she sent it to her manager. → Having ___
            answer: finished the report, she sent it to her manager.
            explain_vi: Buổi 56.
          - q: Many countries have banned animal testing. → Animal testing ___
            answer: has been banned in many countries.
            accept:
              - has been prohibited in many countries.
              - has been banned by many countries.
            explain_vi: Buổi 64.
      - id: b65-x2
        bank_no: 10
        kind: mcq
        instructions_vi: "Chấm thử: mỗi nhận xét thuộc tiêu chí nào?"
        questions:
          - q: "'The essay does not answer the second question.'"
            options:
              - Task Response
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: a
          - q: "'Moreover is used in almost every sentence.'"
            options:
              - Task Response
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: b
          - q: "'There are frequent errors with plural nouns.'"
            options:
              - Task Response
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: d
          - q: "'Collocations such as \"impose a ban on\" are used accurately.'"
            options:
              - Task Response
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: c
          - q: "'The Task 1 report has no overview.'"
            options:
              - Task Achievement
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: a
          - q: "'Each paragraph has a clear central topic.'"
            options:
              - Task Response
              - Coherence & Cohesion
              - Lexical Resource
              - Grammatical Range & Accuracy
            answer: b
      - id: b65-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn Task 2 có 6 lỗi đã gặp trong GĐ3. Sửa trực tiếp.
        text: Never before consumers have had so much choice. What worries experts are the rise in debt. Having bought things online, the debt increased quickly. If people would have saved more, they would have avoided it. Moreover, many young people spend money for luxury goods. It is the private sector which encouraging this trend.
        errors:
          - wrong: Never before consumers have had
            right: Never before have consumers had
            why: Đảo ngữ (Buổi 58).
          - wrong: What worries experts are
            right: What worries experts is
            why: What-clause + is (Buổi 54, 63).
          - wrong: Having bought things online, the debt increased quickly
            right: Having bought things online, many people saw their debt increase quickly
            why: Chủ ngữ phân từ phải là người mua (Buổi 56).
          - wrong: If people would have saved
            right: If people had saved
            why: Loại 3 (Buổi 60).
          - wrong: spend money for luxury goods
            right: spend money on luxury goods
            why: spend ON (Buổi 58, 62).
          - wrong: which encouraging
            right: that is encouraging
            why: Câu chẻ cần động từ đầy đủ (Buổi 63).
      - id: b65-x4
        bank_no: 13
        kind: tfng
        instructions_vi: "Reading (mô phỏng, 6 phút): đọc đoạn văn và chọn T, F hoặc NG."
        passage: "When the public band descriptors for IELTS Writing were revised, examiners were given clearer guidance on how to assess each criterion. According to the descriptors, a Task 1 report without an overview is unlikely to score above band 5 for task achievement, however accurate its figures are. In Task 2, candidates who fail to address every part of the question are also limited, although the exact penalty depends on how much of the task is missing. Interestingly, the descriptors do not reward long essays: an answer of 400 words is not marked higher than one of 270 words simply because of its length. Examiners are, however, told to note when an answer is under the minimum word count."
        questions:
          - q: A Task 1 report with accurate figures but no overview can still reach band 6 for task achievement.
            answer: F
          - q: In Task 2, the penalty for missing part of the question is always the same.
            answer: F
          - q: Longer essays receive higher marks because of their length.
            answer: F
          - q: Examiners pay attention to answers that are too short.
            answer: T
          - q: Most candidates write more than 300 words in Task 2.
            answer: NG
      - id: b65-x5
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn câu phù hợp nhất (ôn kỹ năng Writing GĐ3).
        questions:
          - q: "Best overview for a process diagram with seven stages:"
            options:
              - Overall, clay is dug, then mixed, then shaped, then dried.
              - Overall, there are seven stages, beginning with digging clay and ending with the delivery of bricks.
              - Overall, bricks are important for buildings.
              - Overall, the process is very long and interesting.
            answer: b
            explain_vi: Buổi 46.
          - q: "Best comparison for 30.2% vs 29.9%:"
            options:
              - considerably higher
              - marginally higher
              - by far the highest
              - very higher
            answer: b
            explain_vi: Buổi 59.
          - q: "Best topic sentence for a Cause/Effect body paragraph:"
            options:
              - There are many reasons.
              - The main cause of rising obesity is the popularity of sugary drinks.
              - Obesity is a problem, moreover it is bad.
              - Some people are obese.
            answer: b
            explain_vi: Buổi 55.
          - q: "Most natural Speaking answer:"
            options:
              - It's a piece of cake, as they say.
              - It took me a while to get the hang of it, but now I really enjoy it.
              - Every cloud has a silver lining.
              - It is raining cats and dogs.
            answer: b
            explain_vi: Buổi 57.
      - id: b65-x6
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe giáo viên nhận xét bài viết (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Woman: I've marked your Task 1. You scored 6 for task achievement.
          Man: Only 6? I included all the numbers.
          Woman: That's the problem. You listed every figure but didn't compare them, and your overview was hidden at the end.
          Man: So I should move it?
          Woman: Yes, put it straight after the introduction. And your grammar was good: you used 'considerably' and 'by far' correctly.
          Man: What about vocabulary?
          Woman: Fine, but you wrote 'increase' eight times. Try 'rise' or 'grow' sometimes.
        questions:
          - q: What was the main problem with task achievement?
            options:
              - There were no numbers.
              - He listed figures without comparing them.
              - The essay was too short.
              - He wrote about the wrong chart.
            answer: b
          - q: Where should he put the overview?
            options:
              - at the end
              - after the introduction
              - in the first body paragraph
              - nowhere
            answer: b
          - q: What did the teacher praise?
            options:
              - his spelling
              - his use of comparison words
              - his conclusion
              - his handwriting
            answer: b
          - q: What vocabulary problem did she mention?
            options:
              - spelling mistakes
              - too many rare words
              - repeating 'increase'
              - informal words
            answer: c
      - id: b65-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe lời khuyên trước Giai đoạn 4 rồi chọn T (đúng) hoặc F (sai).
        audio_text: Congratulations on finishing Stage 3. In Stage 4, you'll do a full practice test every few lessons, so it's important to know your weakest criterion now. For most learners at this level, it is coherence or accuracy, not vocabulary. Before each practice test, choose one goal only, for example checking plurals or writing a clear overview. Remember that Task 2 counts twice as much as Task 1, so spend forty minutes on it.
        questions:
          - q: Stage 4 includes regular full practice tests.
            answer: T
          - q: For most learners at this level, vocabulary is the weakest area.
            answer: F
          - q: Learners should set several goals before each test.
            answer: F
          - q: Task 2 carries more marks than Task 1.
            answer: T
      - id: b65-x8
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối tiêu chí với câu hỏi kiểm tra phù hợp.
        pairs:
          - left: task response
            right: Have I answered every part of the question with a clear position?
          - left: coherence
            right: Do my ideas follow a logical order, one main idea per paragraph?
          - left: cohesion
            right: Do I use linking words and reference words naturally?
          - left: lexical resource
            right: Do I use precise topic vocabulary and collocations?
          - left: grammatical range
            right: Do I use a variety of complex structures?
          - left: accuracy
            right: Are most of my sentences free of errors?
  - type: homework
    kind: task2
    prompt_vi: "Làm một bài Writing hoàn chỉnh trong 60 phút: Task 1 (20 phút, ≥ 150 từ) + Task 2 (40 phút, ≥ 250 từ). Sau đó TỰ CHẤM cả hai bài theo 4 tiêu chí bằng câu hỏi kiểm tra của buổi này: cho điểm từng tiêu chí, ghi bằng chứng, chọn 1 mục tiêu cho Giai đoạn 4. Gửi bài + bảng tự chấm để chữa."
    prompt_en: |-
      Task 1: The table shows average weekly spending on leisure activities by three age groups in one country in 2005 and 2025 (hypothetical figures): 18–30: $40 → $95; 31–50: $55 → $80; 51+: $30 → $70. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.
      Task 2: Some people believe that the arts, such as music and painting, should receive government funding. Others think this money should be spent on science and technology. Discuss both views and give your own opinion.
    words:
      min: 400
      max: 480
    minutes: 60
