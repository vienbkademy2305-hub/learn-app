  - type: skill
    skill: writing
    title_vi: Tự chấm bài Writing theo 4 tiêu chí — chuẩn band 6.5
    intro_vi: "Mỗi bài Writing được chấm 4 tiêu chí ngang nhau: Task Achievement (Task 1) / Task Response (Task 2), Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy. Điểm bài = trung bình 4 tiêu chí; Task 2 nặng gấp đôi Task 1. Muốn đạt 6.5 cả bài, bạn cần khoảng 6 ở Task 1 và 6.5–7 ở Task 2. Buổi này bạn học cách TỰ CHẤM bằng câu hỏi kiểm tra cho từng tiêu chí — kỹ năng quan trọng nhất trước khi sang Giai đoạn 4 luyện đề."
    steps:
      - title_vi: TA / TR — trả lời đúng và đủ
        text_vi: "Task 1: có overview rõ? số liệu chính xác, có so sánh? ≥ 150 từ? Task 2: trả lời MỌI phần đề? quan điểm rõ và nhất quán? mỗi ý được giải thích + ví dụ (không underdeveloped)? Không có ý lạc đề?"
      - title_vi: CC — mạch lạc và liên kết
        text_vi: Mỗi đoạn một ý chính, có câu chủ đề? Thứ tự ý hợp lý? Từ nối đa dạng nhưng không lạm dụng (không mở MỌI câu bằng Moreover)? Dùng từ quy chiếu (this, these, such) tránh lặp?
      - title_vi: LR — từ vựng
        text_vi: Có từ ít phổ biến dùng ĐÚNG (collocation chủ đề)? Có paraphrase đề, không chép nguyên? Lỗi chính tả/từ loại có làm khó hiểu không? Band 7 cho phép 'occasional errors'.
      - title_vi: GRA — ngữ pháp
        text_vi: "Đếm loại câu phức (mục tiêu 5–6 loại). Đếm câu KHÔNG lỗi: band 6 ≈ khoảng một nửa, band 7 ≈ đa số. Lỗi hệ thống (-s, to be) lặp lại → khó quá 6."
      - title_vi: Cho điểm từng tiêu chí rồi lấy trung bình
        text_vi: Chấm thật lòng, dựa vào câu hỏi kiểm tra chứ không vào cảm giác. Ghi 1 việc cần sửa cho mỗi tiêu chí — đó là mục tiêu cho bài sau.
    tips:
      - Band descriptors công khai của IELTS là nguồn chuẩn — đọc cột band 6 và band 7, gạch chân chỗ khác nhau.
      - "Tiêu chí thấp nhất kéo cả bài xuống: nâng tiêu chí yếu nhất lên 0.5–1 band dễ hơn nâng tiêu chí đã mạnh."
      - TR và CC thường cải thiện nhanh nhất (lập dàn ý kỹ); LR và GRA cần thời gian.
    traps:
      - trap_vi: Tự chấm theo cảm giác 'bài này hay'.
        fix_vi: Trả lời từng câu hỏi kiểm tra, ghi bằng chứng (câu nào, đoạn nào).
      - trap_vi: Chỉ chú ý từ vựng khó, bỏ qua TR.
        fix_vi: Bài lạc một phần đề thì từ vựng hay cũng không cứu được.
      - trap_vi: Task 1 không có overview.
        fix_vi: Không có overview → TA thường không quá 5.
    phrases:
      - en: The essay addresses all parts of the task.
        vi: Bài trả lời đủ các phần của đề.
        note_vi: Nhận xét TR.
      - en: The position is clear throughout.
        vi: Quan điểm rõ ràng xuyên suốt.
      - en: Some ideas are underdeveloped.
        vi: Một số ý chưa được phát triển.
      - en: Linking words are overused.
        vi: Từ nối bị lạm dụng.
      - en: There is a good range of complex structures, with some errors.
        vi: Có nhiều cấu trúc câu phức, còn vài lỗi.
    demo:
      title_vi: "Làm mẫu: chấm một đoạn thân bài Task 2 theo 4 tiêu chí"
      text_en: |-
        Question: Some people think governments should spend money on space research. Others think this money should be used to solve problems on Earth. Discuss both views and give your opinion.

        Student paragraph: Moreover, space research have many benefit. Firstly, satellites help to forecast the weather. Moreover, it help farmers. Moreover, many technology we use every day was developed for astronauts, for example memory foam. In my opinion, space research is very important and useful and necessary.

        TR: the paragraph gives a benefit and an example, but the idea about farmers is underdeveloped (how do they help?). The opinion is stated but not explained. → about 6
        CC: 'Moreover' is used three times, including as the first word of the paragraph; 'it' is unclear. → about 5.5
        LR: some topic vocabulary (satellites, forecast, memory foam), but 'important and useful and necessary' is repetitive. → about 6
        GRA: mostly simple sentences; systematic errors (research have, many benefit, it help, many technology … was). → about 5.5

        Improved: One major benefit of space research is that satellites allow scientists to forecast the weather accurately, which helps farmers decide when to plant and harvest their crops. In addition, a number of products we use every day, such as memory foam, were first developed for astronauts. It is these practical spin-offs that, in my view, justify the cost.
      notes:
        - label: TR
          text_vi: Phát triển ý 'farmers' bằng mệnh đề which + giải thích cụ thể.
        - label: CC
          text_vi: Bỏ 3 lần Moreover; câu chủ đề rõ; thay 'it' mơ hồ.
        - label: LR
          text_vi: Thay chuỗi tính từ lặp bằng 'justify the cost', 'practical spin-offs'.
        - label: GRA
          text_vi: Sửa lỗi hệ thống (Buổi 62) + thêm mệnh đề danh từ, which, câu chẻ.
