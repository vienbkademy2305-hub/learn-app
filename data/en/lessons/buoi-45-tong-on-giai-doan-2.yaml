        cue_card:
          topic: Describe a change in your city or town that you think is positive.
          points:
            - what the change is
            - when it happened
            - how it has affected people
            - and explain why you think it is positive
        sample: "I'd like to talk about the new metro line in my city, which opened a couple of years ago. Before it was built, it used to take me an hour to get to work because of the traffic congestion. Now it takes only twenty-five minutes… (Part 3: Should governments spend more on public transport than on roads? · Will cities have fewer cars in the future?)"
  - type: homework
    kind: task2
    prompt_vi: "Mini mock Writing: viết Task 2 hoàn chỉnh trong ĐÚNG 40 phút (bấm giờ), ≥ 250 từ. Đây là dạng two-part question. Sau khi viết, dùng danh sách lỗi ở tab Ngữ pháp để tự rà trong 5 phút và gạch chân mọi lỗi tìm được trước khi nộp."
    prompt_en: In many countries, more and more people are moving from rural areas to big cities. Why is this happening? Is it a positive or negative development?
    words:
      min: 250
      max: 290
    minutes: 40
