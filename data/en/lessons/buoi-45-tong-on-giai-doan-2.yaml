      - speaker: B
        text: Good point. And in Writing, my teacher said I had made the same mistake five times.
        vi: Đúng. Còn phần Viết, cô bảo tớ mắc cùng một lỗi năm lần.
      - speaker: A
        text: Which one?
        vi: Lỗi gì?
      - speaker: B
