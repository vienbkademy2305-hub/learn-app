  - type: skill
    skill: reading
    title_vi: Mini mock test — chiến lược và thời gian cho 4 kỹ năng
    intro_vi: "Buổi này mô phỏng một bài thi RÚT GỌN để bạn luyện nhịp độ trước khi sang Giai đoạn 3. Bài thi thật: Listening 30 phút (+ thời gian chép đáp án), Reading 60 phút cho 3 bài đọc, Writing 60 phút (Task 1 + Task 2), Speaking 11–14 phút. Điểm yếu lớn nhất ở giai đoạn này thường không phải kiến thức mà là THỜI GIAN: mắc kẹt ở một câu khó và bỏ lỡ nhiều câu dễ phía sau."
    steps:
      - title_vi: "Reading: 20 phút mỗi bài đọc"
        text_vi: Làm dạng dễ trước (T/F/NG, completion — theo thứ tự bài), dạng khó sau (matching headings, matching information). Một câu quá 2 phút → đoán, đánh dấu, quay lại nếu còn thời gian. Không bao giờ để trống.
      - title_vi: "Listening: đọc trước là tất cả"
        text_vi: Dùng mọi khoảng nghỉ để đọc câu hỏi phần TIẾP THEO, không ngồi kiểm tra phần vừa nghe. Lạc thì bám từ khóa câu sau.
      - title_vi: "Writing: Task 2 trước hoặc chia 20/40"
        text_vi: "Task 2 chiếm 2/3 điểm Writing. Chia cứng: 20 phút Task 1, 40 phút Task 2 (gồm 5 phút dàn ý, 3 phút soát lỗi). Thiếu từ bị trừ điểm nhiều hơn một vài lỗi nhỏ."
      - title_vi: "Speaking: phát triển ý, không học thuộc"
        text_vi: "Part 1: 2–4 câu. Part 2: đủ 4 gợi ý, 1 phút 30 trở lên. Part 3: paraphrase → A-R-E-A."
      - title_vi: "Sau bài thi: lập danh sách lỗi"
        text_vi: "Ghi mỗi câu sai vào một trong 3 cột: (1) không biết từ/ngữ pháp, (2) hiểu sai câu hỏi/bẫy, (3) hết thời gian. Cột nào dài nhất là việc cần làm ở Giai đoạn 3."
    tips:
      - Viết đáp án Listening/Reading bằng chữ IN HOA nếu chữ viết tay khó đọc — cả hai đều được chấp nhận.
      - "Reading: đáp án T/F/NG viết đúng kiểu đề yêu cầu (TRUE/FALSE/NOT GIVEN hoặc YES/NO/NOT GIVEN)."
      - "Trước ngày thi: không học mới. Ôn danh sách lỗi của riêng bạn."
    traps:
      - trap_vi: Dành 10 phút cho một câu matching headings.
        fix_vi: Đặt giới hạn 2 phút/câu; đoán và đi tiếp.
      - trap_vi: Task 1 viết 250 từ, Task 2 chỉ còn 15 phút.
        fix_vi: Task 1 chỉ cần 160–180 từ. Đồng hồ là giám khảo nghiêm nhất.
      - trap_vi: Chọn F khi bài không đề cập (T/F/NG).
        fix_vi: Không có thông tin → NG. Đây là lỗi riêng bạn hay mắc — kiểm tra kỹ từng câu F.
      - trap_vi: Nối câu bằng dấu phẩy, quên -s, quên viết hoa I.
        fix_vi: 3 phút cuối Writing chỉ để soát đúng 3 lỗi này.
    phrases:
      - en: Could you repeat the question, please?
        vi: Xin nhắc lại câu hỏi được không ạ?
        note_vi: Speaking — được phép hỏi lại, không bị trừ điểm.
      - en: That's an interesting question. Let me think…
        vi: Câu hỏi thú vị đấy. Để tôi nghĩ…
        note_vi: Mua thời gian Part 3.
      - en: Could I start again?
        vi: Tôi nói lại từ đầu được không?
        note_vi: Khi nói nhầm ngay đầu Part 2.
    demo:
      title_vi: "Làm mẫu: phân bổ 60 phút Reading"
      text_en: |-
        Passage 1 (13 questions): 17 minutes  — easier text, gain time here
        Passage 2 (13 questions): 20 minutes
        Passage 3 (14 questions): 23 minutes  — hardest text, most time

        Inside each passage:
        1. Read the title and skim the first line of each paragraph (2 min)
        2. Do questions that follow the text order first (T/F/NG, completion)
        3. Do matching questions last
        4. Transfer answers immediately — there is NO extra time in Reading
      notes:
        - label: No extra time
          text_vi: "Khác Listening: Reading không có thời gian chép đáp án — viết thẳng vào phiếu."
        - label: Passage 1 nhanh hơn
          text_vi: Bài đầu dễ nhất; tiết kiệm được phút nào dành cho bài 3.
        - label: Matching làm sau
          text_vi: Khi làm xong các dạng khác, bạn đã quen nội dung từng đoạn (Buổi 37).
