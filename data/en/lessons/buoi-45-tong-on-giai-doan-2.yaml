      - id: b45-x4
        bank_no: 20
        kind: mcq
        instructions_vi: "Listening Part 3 (mô phỏng): nghe hai sinh viên và giảng viên (nhiều giọng) rồi chọn đáp án đúng."
        audio_text: |-
          Tutor: So, what did you find in your survey about part-time jobs?
          Linh: Well, about seventy per cent of students have a part-time job. Most of them work in cafés or teach private lessons.
          Tutor: Did that surprise you?
          Khoa: A little. We expected money to be the main reason, but most students said they work to gain experience.
          Tutor: Interesting. Any negative effects?
          Linh: Yes. Students who work more than twenty hours a week had lower marks. So we think universities should give advice about working hours.
          Khoa: I'm not sure advice is enough. I think the limit should be written into the rules.
          Tutor: Well, you'll need to agree before you write the conclusion.
        questions:
          - q: What proportion of students have a part-time job?
            options:
              - about half
              - about 70%
              - about a third
            answer: b
          - q: What was the main reason students gave for working?
            options:
              - money
              - experience
              - friends
            answer: b
            explain_vi: "'We expected money… but most students said… to gain experience'."
          - q: What was the negative effect of working more than 20 hours?
            options:
              - lower marks
              - poor health
              - less sleep
            answer: a
          - q: What does Khoa think?
            options:
              - Advice is enough.
              - A limit should be in the rules.
              - Students should not work.
            answer: b
      - id: b45-x5
        bank_no: 20
        kind: tf
        instructions_vi: "Listening Part 4 (đoạn ngắn): nghe rồi chọn T (đúng) hoặc F (sai)."
        audio_text: In the final part of today's lecture, I'll summarise the effects of the four-day week trial. Productivity did not fall; in fact, it rose slightly in most companies. Staff reported less stress, and fewer people resigned. However, customer service teams found it difficult, so a rota system was introduced. The researchers recommend that the trial should be extended to hospitals next year.
        questions:
