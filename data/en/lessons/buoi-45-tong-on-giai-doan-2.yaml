    items:
      - id: b45-x1
        bank_no: 13
        kind: tfng
        instructions_vi: "Reading (mô phỏng, 8 phút cho bài 1 và bài 2): đọc bài và chọn T (True), F (False) hoặc NG (Not Given)."
        passage: |-
          THE SHARING ECONOMY

          A  In the past ten years, a new kind of business has grown quickly in Asian cities. Instead of owning things, people now share them through apps: cars, bicycles, rooms and even clothes. Supporters say this 'sharing economy' saves money and reduces waste, because fewer products need to be manufactured.

          B  Ride-sharing apps are the best-known example. In Ho Chi Minh City, a survey in 2023 found that almost two thirds of young office workers had used a ride-sharing app in the previous week. Many said they had sold their own motorbike, since sharing was cheaper than paying for parking and repairs.

          C  However, the sharing economy has also created problems. Drivers usually work as freelancers, so they have little job security and no paid holidays. In addition, some cities have complained that shared bicycles are left on pavements, where they block pedestrians.

          D  Governments are now trying to find a balance. Some have introduced rules so that app companies must pay part of their drivers' insurance. Others have limited the number of shared bicycles that each company can put on the streets. Experts believe that if these rules are enforced, the sharing economy can continue to grow without harming workers or cities.
        questions:
          - q: The sharing economy has developed quickly in Asian cities over the last decade.
            answer: T
          - q: The sharing economy increases the number of products that need to be made.
            answer: F
          - q: Most young office workers in the survey owned a car.
            answer: NG
            explain_vi: Bài nói về ride-sharing và bán xe máy — không có thông tin về sở hữu ô tô. NG, không phải F.
          - q: Ride-sharing drivers usually have good job security.
            answer: F
          - q: All cities have banned shared bicycles.
            answer: F
            explain_vi: Một số thành phố GIỚI HẠN số lượng — không cấm.
          - q: Experts think the rules must be enforced for the sharing economy to grow safely.
            answer: T
