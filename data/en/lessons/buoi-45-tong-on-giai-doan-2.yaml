            answer: F
          - q: Fewer employees resigned.
            answer: T
          - q: Customer service teams had no problems.
            answer: F
          - q: The trial has already been extended to hospitals.
            answer: F
            explain_vi: "'should be extended … next year' — khuyến nghị cho tương lai."
      - id: b45-x6
        bank_no: 7
        kind: error-correction
        instructions_vi: "Rà lỗi lặp lại: đoạn Task 2 có 6 lỗi thuộc danh sách ở tab Ngữ pháp (comma splice, although…but, because of, for + V, bị động modal, viết hoa I). Sửa trực tiếp."
        text: Many young people move to big cities for find jobs, however this causes problems. Although cities offer more opportunities, but the cost of living is very high. Some people cannot buy a house because of prices are rising. In my opinion, more affordable housing should built. i believe this is the best solution.
        errors:
          - wrong: for find jobs
            right: to find jobs
            why: "Mục đích: to V (Buổi 39)."
          - wrong: find jobs, however this causes
            right: find jobs. However, this causes
            why: "Comma splice: tách câu, However + dấu phẩy (Buổi 30)."
          - wrong: more opportunities, but the cost
            right: more opportunities, the cost
            why: Although không đi với but (Buổi 37).
          - wrong: because of prices are rising
            right: because prices are rising
            why: because + mệnh đề (Buổi 32).
          - wrong: should built
            right: should be built
            why: "Bị động modal: should be + V3 (Buổi 43)."
          - wrong: i believe
            right: I believe
            why: Luôn viết hoa I — lỗi riêng cần tự kiểm tra.
