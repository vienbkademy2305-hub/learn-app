  - type: pronunciation
    notes:
      - sound: snd-d
        text_vi: "Đuôi -ed có 3 cách đọc: /ɪd/ sau t, d (ex-CI-ted, dis-ap-POINT-ed); /t/ sau âm vô thanh (relaxed, embarrassed); /d/ còn lại (bored, surprised, confused, tired)."
      - sound: snd-au
        text_vi: "/aʊ/ trong proud, about, now: trượt từ 'a' sang 'u'."
      - sound: snd-uu
        text_vi: "confused, confusing có /juː/: kən-FJUːZD. Kéo dài âm u."
      - word: tired|adj
        text_vi: Chỉ 1 âm tiết /taɪəd/; bored cũng 1 âm tiết /bɔːd/ — không thêm âm 'đờ'.
