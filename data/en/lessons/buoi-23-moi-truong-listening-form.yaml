  - type: dialogue
    title_vi: Hỏi về câu lạc bộ xanh
    lines:
      - speaker: A
        text: Hi, I'd like to join the Green Club. What do members do?
        vi: Chào anh, em muốn tham gia Câu lạc bộ Xanh. Thành viên thường làm gì ạ?
      - speaker: B
        text: We pick up rubbish and plant trees. We have planted over two thousand trees since 2021.
        vi: Bọn anh nhặt rác và trồng cây. Từ năm 2021 bọn anh đã trồng hơn hai nghìn cây.
      - speaker: A
        text: That's amazing. When did the club start?
        vi: Tuyệt quá. Câu lạc bộ thành lập khi nào ạ?
      - speaker: B
        text: It started six years ago with only ten volunteers.
        vi: Câu lạc bộ bắt đầu từ sáu năm trước với chỉ mười tình nguyện viên.
      - speaker: A
        text: Have you worked on any big projects?
        vi: Câu lạc bộ đã làm dự án lớn nào chưa ạ?
      - speaker: B
        text: Yes. Last year we cleaned the To Lich River for three months.
        vi: Rồi. Năm ngoái bọn anh làm sạch sông Tô Lịch trong ba tháng.
      - speaker: A
        text: Great. Can I register now?
        vi: Hay quá. Em đăng ký bây giờ được không ạ?
      - speaker: B
        text: Sure. Can I take your name, please?
        vi: Được chứ. Cho anh xin tên em nhé?
      - speaker: A
        text: Nguyen Thu Ha. That's H-A.
        vi: Nguyễn Thu Hà. H-A ạ.
      - speaker: B
        text: Thanks. Please bring a reusable bottle to every event. We don't use single-use plastic.
        vi: Cảm ơn em. Nhớ mang chai dùng lại được đến mọi buổi nhé. Bọn anh không dùng nhựa dùng một lần.
  - type: exercises
    items:
      - id: b23-x1
        bank_no: 18
        kind: mcq
        instructions_vi: "Trước khi nghe: mỗi chỗ trống cần LOẠI thông tin gì?"
        questions:
          - q: "Contact number: ______"
            options:
              - a name
              - a number
              - a date
              - a place
            answer: b
          - q: "Surname: ______"
            options:
              - a name that may be spelled
              - a price
              - a time
              - an adjective
            answer: a
          - q: The tour costs £ ______ per person.
            options:
              - a word like 'cheap'
              - a number only
              - a number and '£'
              - a date
            answer: b
            explain_vi: £ đã in sẵn → chỉ viết số.
          - q: Please bring a ______ jacket.
            options:
              - a noun
              - a verb
              - an adjective
              - a number
            answer: c
            explain_vi: "Giữa a và danh từ jacket → tính từ (VD: waterproof, warm)."
          - q: Volunteers need to arrive at ______ a.m.
            options:
              - a time
              - a place
              - a name
              - a plural noun
            answer: a
          - q: Each group will collect several ______ of rubbish.
            options:
              - a singular noun
              - a plural noun
              - an adjective
              - a verb
            answer: b
            explain_vi: several + danh từ số nhiều (bags).
      - id: b23-x2
        bank_no: 18
        kind: completion
        instructions_vi: Nghe cuộc gọi đăng ký làm tình nguyện viên (nghe 1 lần như thi thật) và điền form. Viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống.
        max_words: 2
        audio_text: |-
          Woman: Good morning, Clean Beach Project. How can I help you?
          Man: Hi. I'd like to register as a volunteer for the beach clean-up.
          Woman: Great. Can I take your name, please?
          Man: Yes, it's David Parker. That's P-A-R-K-E-R.
          Woman: Thank you. And what's the best number to contact you on?
          Man: It's 0 9 1 2, double 5, 7 3 8 6.
          Woman: So that's 0 9 1 2 5 5 7 3 8 6. And which clean-up would you like to join? We have one on the 14th of June and another on the 21st.
          Man: The 14th, please. Oh no, sorry, I'm busy that weekend. The 21st, then.
          Woman: No problem. We meet at the car park next to the lighthouse at half past six in the morning.
          Man: That's early! How long does it last?
          Woman: About four hours. We finish at 10.30. And please don't bring any plastic water bottles. Bring a reusable bottle instead.
          Man: OK. Do I need to bring gloves?
          Woman: No, we give everyone gloves and bags.
        passage: |-
          CLEAN BEACH PROJECT — VOLUNTEER FORM
          Name: David (1) __________
          Phone: (2) __________
          Date of clean-up: (3) __________ June
          Meeting point: the car park next to the (4) __________
          Start time: (5) __________ a.m.
          Please bring: a (6) __________ bottle
        questions:
          - q: (1)
            answer: Parker
          - q: (2)
            answer: "0912557386"
            accept:
              - 0912 557 386
              - 0912 55 7386
              - 091 255 7386
          - q: (3)
            answer: 21st
            accept:
              - "21"
              - twenty-first
              - the 21st
            explain_vi: "Người nói chọn 14th rồi sửa lại: 'Oh no, sorry… The 21st, then.'"
          - q: (4)
            answer: lighthouse
            accept:
              - the lighthouse
          - q: (5)
            answer: "6.30"
            accept:
              - 6:30
              - half past six
              - 6.30 a.m.
            explain_vi: 10.30 là giờ KẾT THÚC — bẫy.
          - q: (6)
            answer: reusable
      - id: b23-x3
        bank_no: 6
        kind: verb-form
        instructions_vi: "Chia động từ: hiện tại hoàn thành hay quá khứ đơn?"
        questions:
          - q: The government (ban) ___ single-use plastic bags in 2022.
            answer: banned
          - q: We (plant) ___ over 500 trees so far this year.
            answer: have planted
            accept:
              - "'ve planted"
          - q: When ___ you start volunteering? (do)
            answer: did
            explain_vi: When did you start…? — câu hỏi When dùng quá khứ đơn.
          - q: Air quality in Hanoi (become) ___ worse since 2015.
            answer: has become
          - q: I (never / see) ___ an endangered animal in the wild.
            answer: have never seen
            accept:
              - "'ve never seen"
          - q: Two years ago, the river (be) ___ very dirty.
            answer: was
          - q: ___ you ever worked at a recycling centre? (have / do)
            answer: Have
            explain_vi: "ever + V3 (worked) → hiện tại hoàn thành: Have you ever worked…?"
          - q: My town (not / have) ___ a recycling bin until last month.
            answer: didn't have
            accept:
              - did not have
      - id: b23-x4
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank:
          - pollution
          - deforestation
          - renewable energy
          - carbon emissions
          - endangered species
          - rubbish
          - volunteer
          - environmentally friendly
        questions:
          - q: Wind and solar power are types of ___.
            answer: renewable energy
          - q: Cars produce a lot of ___.
            answer: carbon emissions
          - q: Cutting down forests for farms causes ___.
            answer: deforestation
          - q: The tiger is an ___ in many countries.
            answer: endangered species
          - q: Please put your ___ in the bin.
            answer: rubbish
          - q: Air ___ in big cities is getting worse.
            answer: pollution
          - q: She works as a ___ at the national park every summer.
            answer: volunteer
          - q: Bamboo straws are more ___ than plastic ones.
            answer: environmentally friendly
      - id: b23-x5
        bank_no: 3
        kind: collocation
        instructions_vi: Ghép động từ với cụm danh từ phù hợp.
        pairs:
          - left: reduce
            right: carbon emissions
          - left: protect
            right: endangered species
          - left: recycle
            right: plastic bottles
          - left: use
            right: renewable energy
          - left: pick up
            right: rubbish on the beach
      - id: b23-x6
        bank_no: 23
        kind: dictation
        instructions_vi: Nghe và chép lại chính xác (nghe tối đa 3 lần). Chú ý đuôi -s, -ed và have/has.
        text: Our city has built two new recycling centres since last year. Many people have stopped using plastic bags, and the river is cleaner now.
      - id: b23-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: Our apartment building started recycling two years ago. Since then, we have reduced our rubbish by half. Plastic bottles go in the blue bin and paper goes in the green bin. Food waste is collected on Tuesdays and Fridays. Last month, volunteers from a local school showed residents how to sort their rubbish.
        questions:
          - { q: The building started recycling two years ago., answer: T }
          - { q: They have reduced their rubbish by half., answer: T }
          - { q: Plastic bottles go in the green bin., answer: F }
          - { q: Food waste is collected every day., answer: F }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 150–180 từ: môi trường ở quê bạn đã thay đổi thế nào trong 10 năm qua (tốt lên hay xấu đi, vì sao). Dùng ít nhất 4 câu hiện tại hoàn thành (since, so far, in the last ten years) và 3 câu quá khứ đơn có mốc thời gian. Bắt buộc dùng: pollution, rubbish, protect, reduce. Bài này là bước đệm cho Writing Task 2 chủ đề môi trường."
    prompt_en: How has the environment in your hometown changed in the last ten years?
    words:
      min: 150
      max: 180
    minutes: 30
