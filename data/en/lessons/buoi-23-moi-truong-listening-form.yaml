  - type: grammar
    items:
      - en-g2-03
  - type: skill
    skill: listening
    title_vi: Listening — điền form, ghi chú, bảng (form/note/table completion)
    intro_vi: "Bài Listening IELTS có 4 phần, 40 câu, nghe đúng MỘT lần. Phần 1 thường là hội thoại đời thường (đặt chỗ, đăng ký, hỏi thông tin) với dạng điền form: tên, số điện thoại, ngày, giá tiền, địa chỉ. Đây là phần dễ lấy điểm nhất — nếu đoán trước được loại thông tin và không sai chính tả."
    steps:
      - title_vi: Đọc kỹ giới hạn số từ
        text_vi: "'NO MORE THAN TWO WORDS AND/OR A NUMBER' nghĩa là tối đa 2 từ + 1 số. Viết 3 từ là sai dù đúng ý. 'ONE WORD ONLY' thì chỉ 1 từ."
      - title_vi: Tận dụng thời gian đọc trước (khoảng 30 giây)
        text_vi: "Đọc lướt cả form, gạch từ khóa quanh mỗi chỗ trống: Name, Date, Cost, Address…"
      - title_vi: Đoán LOẠI thông tin
        text_vi: "Mỗi chỗ trống là gì: tên (cần đánh vần), số điện thoại, ngày tháng, giá tiền, giờ, địa điểm, nghề nghiệp? Ghi nhanh ký hiệu bên cạnh: tên / số / ngày / $."
      - title_vi: Đoán TỪ LOẠI bằng ngữ pháp
        text_vi: Sau a/an → danh từ số ít; sau many/several → danh từ số nhiều; sau very/quite → tính từ; sau to → động từ nguyên mẫu.
      - title_vi: Nghe theo thứ tự và bám từ khóa
        text_vi: Đáp án đi theo thứ tự câu hỏi. Khi nghe thấy từ khóa (hoặc từ đồng nghĩa) của câu 3, đáp án câu 3 sắp tới. Lỡ một câu thì bỏ qua ngay, theo dõi câu tiếp — đừng để mất cả loạt.
      - title_vi: Cảnh giác khi người nói sửa lại
        text_vi: "'Actually…', 'Oh no, sorry…', 'I mean…', 'Let me check…' → thông tin đầu bị thay thế; đáp án là thông tin SAU CÙNG."
      - title_vi: Soát lại khi hết bài
        text_vi: Chính tả, -s số nhiều, viết hoa tên riêng, định dạng ngày (12 May / May 12) và tiền ($15 / 15 dollars).
    tips:
      - "Luyện bảng chữ cái: người Việt hay nhầm A /eɪ/ – E /iː/ – I /aɪ/, G /dʒiː/ – J /dʒeɪ/, B – V – P."
      - "Số: 'double five' = 55; 'oh' = 0 trong số điện thoại; 13 (thirTEEN, nhấn sau) ≠ 30 (THIRty, nhấn trước)."
      - Nếu form đã in sẵn đơn vị ('£ ___', '___ km'), chỉ viết con số — viết thêm đơn vị có thể bị thừa từ.
      - Nghe thấy người nói đánh vần là gần như chắc chắn chỗ đó là đáp án — viết từng chữ ngay.
    traps:
      - trap_vi: "Ghi luôn thông tin đầu tiên nghe được: 'It's on the 15th… oh no, sorry, the 16th.'"
        fix_vi: Chờ đến hết câu nói; đáp án là thông tin sau khi người nói sửa (16th).
      - trap_vi: Nghe đúng nhưng viết sai chính tả (enviroment, recieve).
        fix_vi: Sai chính tả = sai. Học thuộc chính tả các từ chủ đề hay gặp.
      - trap_vi: "Quên -s: 'two ___' mà viết 'bottle'."
        fix_vi: Nhìn từ đứng trước chỗ trống (two, several, many) → cần số nhiều.
      - trap_vi: Mải nghĩ một câu khó, bỏ lỡ 3 câu sau.
        fix_vi: Không nghe được thì bỏ trống, đoán sau; mắt luôn đi trước tai một câu.
    phrases:
      - en: Can I take your name, please?
        vi: Cho tôi xin tên anh/chị?
        note_vi: Ngay sau đó thường là đánh vần.
      - en: Could you spell that for me?
        vi: Anh/chị đánh vần giúp tôi được không?
      - en: What's the best number to contact you on?
        vi: Số nào tiện liên lạc với anh/chị nhất?
      - en: Sorry, I mean …
        vi: Xin lỗi, ý tôi là …
        note_vi: Báo hiệu thông tin được sửa lại.
      - en: So that's … Is that right?
        vi: Vậy là … đúng không ạ?
        note_vi: Người nói nhắc lại để xác nhận — cơ hội nghe lại đáp án.
    demo:
      title_vi: "Làm mẫu: đoán trước khi nghe"
      text_en: |-
        GREEN DAY TREE PLANTING — REGISTRATION
        Name: Lan (1) __________
        Phone number: (2) __________
        Date of the event: Saturday (3) __________ April
        Meeting point: the (4) __________ of Thong Nhat Park
        Please bring: a hat and a (5) __________ bottle
      notes:
        - label: (1) Lan ___
          text_vi: "Sau tên riêng Lan → HỌ. Người nói gần như chắc chắn sẽ đánh vần: chuẩn bị viết từng chữ."
        - label: (2) Phone number
          text_vi: Dãy số. Chú ý 'double', 'oh' và cách ngắt nhóm số.
        - label: (3) Saturday ___ April
          text_vi: "Ngày trong tháng (số thứ tự: 12th, 20th). Bẫy hay gặp: nói một ngày rồi sửa lại."
        - label: (4) the ___ of Thong Nhat Park
          text_vi: "Sau 'the' và trước 'of' → danh từ chỉ vị trí: main gate / north entrance / car park…"
        - label: (5) a hat and a ___ bottle
          text_vi: Giữa 'a' và danh từ 'bottle' → TÍNH TỪ. Chủ đề môi trường → đoán reusable / water. Tối đa số từ theo yêu cầu đề.
