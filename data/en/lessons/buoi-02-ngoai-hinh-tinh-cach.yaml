      - sound: snd-dh
        text_vi: "/ð/ trong the, than, they, mother, father: đặt đầu lưỡi giữa hai răng, rung dây thanh. Không đọc thành /d/ hay /z/."
      - sound: snd-schwa
        text_vi: "Đuôi -er của so sánh hơn đọc /ə/ rất nhẹ: taller /ˈtɔː.lə/, kinder /ˈkaɪn.də/. Than trong câu đọc yếu /ðən/."
      - word: handsome|adj
        text_vi: "Chữ d câm: HAN-sơm, không đọc 'hand-some'."
      - word: personality|n
        text_vi: "Trọng âm âm 3: per-so-NA-li-ty (giống nationality ở Buổi 1)."
      - word: straight|adj
        text_vi: "Âm cuối /t/ phải bật nhẹ ra: straight hair, không nuốt thành 'stray'."
