  - type: skill
    skill: writing
    title_vi: Writing Task 2 — đề kết hợp nhiều dạng (mixed / combined questions)
    intro_vi: "Nhiều đề thật không thuộc gọn một dạng: 'Discuss both views and give your opinion' là Discussion + Opinion; 'Why is this happening? Is it positive or negative?' là Cause + Opinion (đã gặp ở Buổi 58); 'What problems … and what should governments do? Who should pay?' là Problem–Solution + câu hỏi thêm. Tiêu chí Task Response band 6: 'addresses all parts of the task, although some parts may be more fully covered than others'. Band 7: 'addresses all parts … presents a clear position throughout'. Bỏ sót MỘT phần câu hỏi là TR khó quá 5."
    steps:
      - title_vi: Tách đề thành từng câu hỏi
        text_vi: "Gạch và đánh số mọi phần phải trả lời: (1) discuss view A, (2) discuss view B, (3) give your opinion. Hoặc (1) problems, (2) solutions, (3) who should pay."
      - title_vi: Gán mỗi phần vào một đoạn
        text_vi: 2 phần → 2 thân bài. 3 phần → 2 thân bài, trong đó quan điểm cá nhân nằm ở mở bài + kết bài và cuối thân bài 2, HOẶC 3 thân bài ngắn.
      - title_vi: Nêu quan điểm ngay từ mở bài
        text_vi: "Nếu đề có 'your opinion', câu thesis phải nêu rõ bạn nghiêng về bên nào. Câu chẻ giúp làm rõ: 'It is research into Earth's problems that should come first, in my view.'"
      - title_vi: Mỗi thân bài 1 ý chính + giải thích + ví dụ
        text_vi: Không liệt kê 4–5 ý mỏng. 2 ý phát triển kỹ ghi điểm TR cao hơn.
      - title_vi: Kết bài trả lời lại TẤT CẢ phần
        text_vi: Một câu tóm tắt cho mỗi phần của đề. Không thêm ý mới.
    tips:
      - Viết lại đề thành checklist 2–3 dòng ở giấy nháp; đánh dấu khi đã trả lời.
      - "Thời gian: 5 phút phân tích đề + dàn ý, 32 phút viết, 3 phút soát (Buổi 62)."
      - "Quan điểm phải nhất quán: nếu mở bài nói 'partly agree', thân bài phải thể hiện cả hai phía."
    traps:
      - trap_vi: Chỉ trả lời câu hỏi đầu, quên câu hỏi thứ hai.
        fix_vi: Checklist phần của đề; mỗi phần ít nhất một đoạn hoặc nửa đoạn.
      - trap_vi: Đề 'discuss both views' nhưng chỉ viết một phía.
        fix_vi: Mỗi quan điểm một thân bài, kể cả quan điểm bạn không đồng ý.
      - trap_vi: Quan điểm đổi giữa bài.
        fix_vi: Viết thesis trước, đọc lại trước khi viết kết bài.
    phrases:
      - en: This essay will discuss both views before explaining why I believe …
        vi: Bài luận sẽ thảo luận cả hai quan điểm rồi giải thích vì sao tôi tin rằng …
        note_vi: Thesis đề Discussion + Opinion.
      - en: It is … that should be the priority.
        vi: Chính … mới nên là ưu tiên.
        note_vi: Câu chẻ nêu quan điểm.
      - en: What concerns critics most is …
        vi: Điều khiến những người phản đối lo nhất là …
      - en: As for who should pay, …
        vi: Còn về việc ai nên chi trả, …
        note_vi: Chuyển sang câu hỏi thứ ba.
      - en: In conclusion, although …, I believe …
        vi: Tóm lại, mặc dù …, tôi tin rằng …
    demo:
      title_vi: "Làm mẫu: dàn ý và mở bài – kết bài cho đề ba phần"
      text_en: |-
        Question: Some people believe that space exploration is a waste of money, while others think it is essential for humanity's future. Discuss both views and give your own opinion. Who should pay for space exploration?

        Checklist: (1) view A — waste of money; (2) view B — essential; (3) my opinion; (4) who should pay.

        Plan: Body 1 = view A (astronomical costs; pressing problems on Earth such as poverty). Body 2 = view B (spin-offs such as satellite weather forecasts; long-term survival) + my opinion. Body 3 (short) = who should pay: governments for scientific research, the private sector for commercial projects.

        Introduction: Space exploration has become one of the most expensive scientific activities in history. While some argue that this money would be better spent on Earth, others see space as the final frontier for humanity. This essay will discuss both views before explaining why I believe space exploration is worthwhile, and it will then consider who should pay for it.

        Conclusion: In conclusion, although the cost of space exploration is difficult to justify when people still live in poverty, I believe its long-term benefits are greater. It is not governments alone that should fund it, however: commercial missions should be paid for by the private sector, leaving public money for research that benefits everyone.
      notes:
        - label: Checklist
          text_vi: Bốn phần; câu hỏi phụ 'who should pay' dễ bị bỏ sót nhất.
        - label: Plan
          text_vi: Quan điểm cá nhân gộp cuối thân bài 2; câu hỏi thứ tư có thân bài ngắn riêng.
        - label: Introduction
          text_vi: Paraphrase hai quan điểm + thesis nêu rõ ý kiến + báo trước phần 'who should pay'.
        - label: It is not governments alone that …
          text_vi: Câu chẻ ở kết bài, trả lời lại câu hỏi thứ tư.
