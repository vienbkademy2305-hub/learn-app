  - type: dialogue
    title_vi: "Tranh luận: tiền cho vũ trụ hay cho Trái Đất?"
    lines:
      - speaker: A
        text: Did you see the news? Another mission to Mars is planned for next year.
        vi: Bạn xem tin chưa? Lại có một sứ mệnh lên sao Hỏa dự kiến năm sau.
      - speaker: B
        text: Honestly, what bothers me is the cost. It's astronomical.
        vi: Thật lòng, điều làm mình khó chịu là chi phí. Khổng lồ.
      - speaker: A
        text: But it's partly paid for by the private sector now, not only taxpayers.
        vi: Nhưng giờ khu vực tư nhân trả một phần, không chỉ người đóng thuế.
      - speaker: B
        text: Even so, we have more pressing problems on Earth, like climate change.
        vi: Dù vậy, Trái Đất còn nhiều vấn đề cấp bách hơn, như biến đổi khí hậu.
      - speaker: A
        text: Actually, it's satellites that give us most of our climate data.
        vi: Thật ra, chính vệ tinh cung cấp phần lớn dữ liệu khí hậu cho chúng ta.
      - speaker: B
        text: Fair point. I just don't think colonising Mars is feasible.
        vi: Có lý. Mình chỉ không nghĩ lập thuộc địa trên sao Hỏa là khả thi.
      - speaker: A
        text: Maybe not yet. But fifty years ago, reusable rockets weren't feasible either.
        vi: Có lẽ chưa. Nhưng năm mươi năm trước, tên lửa tái sử dụng cũng đâu khả thi.
  - type: exercises
    items:
      - id: b63-x1
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu thành câu chẻ, bắt đầu bằng từ cho sẵn.
        questions:
          - q: The cost worries most people. → What ___
            answer: worries most people is the cost.
          - q: Private companies are leading the space race. → It is ___
            answer: private companies that are leading the space race.
            accept:
              - private companies who are leading the space race.
          - q: Humans first landed on the Moon in 1969. → It was in 1969 ___
            answer: that humans first landed on the Moon.
          - q: Space research is worthwhile because it produces useful technology. → The reason ___
            answer: space research is worthwhile is that it produces useful technology.
            accept:
              - why space research is worthwhile is that it produces useful technology.
      - id: b63-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: What we need most ___ better education, not rockets.
            options:
              - are
              - is
              - be
              - being
            answer: b
          - q: It was Yuri Gagarin ___ first travelled into space.
            options:
              - which
              - who
              - what
              - whom
            answer: b
          - q: The reason many people oppose it is ___ it is too expensive.
            options:
              - because
              - that
              - why
              - so
            answer: b
          - q: It is not the government ___ the private sector that should pay for tourist flights.
            options:
              - or
              - but
              - and
              - nor
            answer: b
          - q: "'Discuss both views and give your opinion. Who should pay?' How many parts must you answer?"
            options:
              - one
              - two
              - three
              - four
            answer: d
            explain_vi: View A, view B, opinion, who should pay.
      - id: b63-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank:
          - astronomical
          - justify
          - pressing
          - feasible
          - habitable
          - space debris
          - spin-offs
          - taxpayers
        questions:
          - q: Building a city on Mars is not yet technically ___.
            answer: feasible
          - q: Scientists are searching for ___ planets outside our solar system.
            answer: habitable
          - q: The ___ cost of the mission shocked the public.
            answer: astronomical
          - q: Politicians find it hard to ___ spending billions on space.
            answer: justify
          - q: Poverty and climate change are more ___ problems.
            answer: pressing
          - q: Thousands of pieces of ___ now circle the Earth.
            answer: space debris
          - q: Memory foam and water filters are ___ from space research.
            answer: spin-offs
          - q: The project is paid for by ___, so it must be good value.
            answer: taxpayers
      - id: b63-x4
        bank_no: 10
        kind: mcq
        instructions_vi: "Phân tích đề: với mỗi đề, chọn dàn ý phù hợp nhất."
        questions:
          - q: "'More and more private companies are sending people into space. Why is this happening? Is it a positive or negative development?'"
            options:
              - "Body 1: advantages; Body 2: disadvantages"
              - "Body 1: reasons for the trend; Body 2: my opinion (positive or negative)"
              - "Body 1: problems; Body 2: solutions"
              - "Body 1: view A; Body 2: view B"
            answer: b
          - q: "'Space debris is increasing. What problems does this cause, and what can be done?'"
            options:
              - "Body 1: causes; Body 2: effects"
              - "Body 1: problems; Body 2: solutions"
              - "Body 1: my opinion; Body 2: other opinion"
              - One body paragraph only
            answer: b
          - q: Which thesis answers ALL parts of 'Discuss both views and give your opinion'?
            options:
              - This essay will discuss both views.
              - Space exploration is very interesting.
              - This essay will discuss both views before explaining why I believe the benefits outweigh the costs.
              - There are many advantages of space exploration.
            answer: c
      - id: b63-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 5 lỗi (câu chẻ, lỗi người Việt từ Buổi 62). Sửa trực tiếp.
        text: What worries many taxpayers are the cost of each mission. It is the private sector which leading the industry now. The reason is because governments cannot afford it. Space exploration very expensive. However, it has produced many useful spin-off.
        errors:
          - wrong: What worries many taxpayers are
            right: What worries many taxpayers is
            why: What-clause + is.
          - wrong: which leading the industry
            right: that is leading the industry
            why: Sau that/which cần động từ đầy đủ.
          - wrong: The reason is because
            right: The reason is that
            why: The reason is that …
          - wrong: Space exploration very expensive
            right: Space exploration is very expensive
            why: Thiếu to be.
          - wrong: many useful spin-off.
            right: many useful spin-offs.
            why: many + số nhiều.
      - id: b63-x6
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hai sinh viên phân tích một đề Task 2 (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Man: OK, the question says: some people think governments should stop funding space research and spend the money on healthcare. Discuss both views and give your opinion.
          Woman: So that's three parts: both views, and our opinion.
          Man: Right. What's your opinion?
          Woman: I think we need both, but healthcare should come first. It's healthcare that affects everyone every day.
          Man: I'd argue the opposite. What people forget is that satellites help doctors reach remote areas.
          Woman: Good example, but it doesn't change my view. Let's each write a plan and compare.
        questions:
          - q: How many parts does the question have, according to the woman?
            options:
              - two
              - three
              - four
              - five
            answer: b
          - q: What is the woman's opinion?
            options:
              - Stop space research completely.
              - Healthcare should be the priority.
              - Space research is more important.
              - Both are useless.
            answer: b
          - q: What example does the man give?
            options:
              - rockets carry medicine
              - satellites help doctors reach remote areas
              - astronauts become doctors
              - space hospitals
            answer: b
          - q: What do they decide to do next?
            options:
              - write one essay together
              - each write a plan and compare
              - ask the teacher
              - change the question
            answer: b
      - id: b63-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe bản tin rồi chọn T (đúng) hoặc F (sai).
        audio_text: Scientists say there are now more than thirty thousand pieces of space debris large enough to track. It is these objects that pose the greatest danger to satellites and astronauts. Several companies are testing ways to remove debris, for example with nets and magnets. However, experts warn that no solution will be feasible unless countries agree on international rules.
        questions:
          - q: There are fewer than thirty thousand trackable pieces of debris.
            answer: F
          - q: Space debris is a danger to astronauts.
            answer: T
          - q: Companies are testing nets and magnets to remove debris.
            answer: T
          - q: Experts believe the problem can be solved without international rules.
            answer: F
      - id: b63-x8
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với nghĩa tiếng Anh.
        pairs:
          - left: feasible
            right: possible to do
          - left: pressing
            right: needing to be dealt with immediately
          - left: spin-off
            right: a useful product that develops from something else
          - left: habitable
            right: suitable for people to live in
          - left: taxpayer
            right: a person who pays money to the government
          - left: cutting-edge
            right: the most modern and advanced
