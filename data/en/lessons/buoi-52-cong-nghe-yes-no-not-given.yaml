  - type: skill
    skill: reading
    title_vi: "Reading — Yes / No / Not Given: quan điểm của tác giả"
    intro_vi: "Buổi 25 đã học True/False/Not Given (về SỰ THẬT trong bài). Yes/No/Not Given hỏi về Ý KIẾN / NHẬN ĐỊNH của TÁC GIẢ: bài thường là bài luận, bài bình luận có quan điểm. YES = câu hỏi khớp quan điểm tác giả; NO = trái với quan điểm tác giả; NOT GIVEN = tác giả không bày tỏ quan điểm về điều đó (kể cả khi chủ đề có được nhắc). Dạng này khó vì tác giả hay nói mềm (may, arguably) và hay trích ý kiến NGƯỜI KHÁC để phản bác."
    steps:
      - title_vi: Xác định đây là Y/N/NG
        text_vi: "Đề: 'Do the following statements agree with the views/claims of the writer?' → Y/N/NG. Viết đúng YES/NO/NOT GIVEN (không viết TRUE/FALSE)."
      - title_vi: Gạch chủ thể quan điểm + từ mức độ
        text_vi: Câu hỏi nói về quan điểm của AI? (the writer believes… / the writer suggests…). Gạch will, all, only, always, more than, the main reason… — đáp án hay nằm ở những từ này.
      - title_vi: Tìm vùng thông tin
        text_vi: Dùng từ khóa không đổi (tên, năm) hoặc chủ đề. Câu hỏi đi theo thứ tự bài.
      - title_vi: Tách ý TÁC GIẢ khỏi ý NGƯỜI KHÁC
        text_vi: "'Some experts claim…', 'It is often said…' là ý người khác. Ý tác giả thường sau: However, I would argue…, In my view…, The truth is…, This is misleading because…"
      - title_vi: So mức độ và chiều
        text_vi: Tác giả nói 'may help' mà câu hỏi 'will replace' → NO. Tác giả không nói gì về điều đó → NOT GIVEN.
    tips:
      - "NOT GIVEN ≠ NO. Tự hỏi: tác giả có NÓI NGƯỢC LẠI không? Có → NO. Chỉ im lặng → NOT GIVEN. (Đây là lỗi bạn hay mắc ở Buổi 25.)"
      - Câu hỏi có so sánh (more important than, the main…) cần bài cũng có so sánh; không có → thường NOT GIVEN.
      - "Tác giả có thể thay đổi quan điểm trong một đoạn: đọc đến hết câu 'However…'."
    traps:
      - trap_vi: Lấy ý kiến người được trích dẫn làm ý kiến tác giả.
        fix_vi: "Tìm dấu hiệu phản bác phía sau: But / However / This view ignores…"
      - trap_vi: Bỏ qua từ mức độ (may ↔ will, some ↔ all).
        fix_vi: Gạch và so từng từ mức độ.
      - trap_vi: Chọn NO vì 'nghe có vẻ tác giả không đồng ý'.
        fix_vi: Cần câu cụ thể trong bài nói ngược lại; suy đoán → NOT GIVEN.
    phrases:
      - en: Do the following statements agree with the views of the writer?
        vi: Các nhận định sau có khớp với quan điểm của tác giả không?
      - en: YES if the statement agrees with the views of the writer
        vi: YES nếu nhận định khớp quan điểm tác giả
      - en: NO if the statement contradicts the views of the writer
        vi: NO nếu nhận định mâu thuẫn quan điểm tác giả
      - en: NOT GIVEN if it is impossible to say what the writer thinks about this
        vi: NOT GIVEN nếu không thể biết tác giả nghĩ gì về điều này
    demo:
      title_vi: "Làm mẫu: tách ý người khác và ý tác giả"
      text_en: |-
        Passage: "Many technology companies claim that AI will soon replace doctors. This, in my view, is misleading. AI may help doctors to read X-rays more quickly, but it cannot talk to a frightened patient or make difficult ethical decisions."

        1. The writer believes AI will soon replace doctors.  → NO
        2. The writer thinks AI can help doctors read X-rays.  → YES
        3. The writer believes AI is too expensive for hospitals.  → NOT GIVEN
      notes:
        - label: Câu 1 → NO
          text_vi: "'will soon replace doctors' là ý của 'technology companies'; tác giả nói 'This … is misleading' → trái quan điểm tác giả."
        - label: Câu 2 → YES
          text_vi: "'AI may help doctors to read X-rays more quickly' — khớp (may help ≈ can help)."
        - label: Câu 3 → NOT GIVEN
          text_vi: Bài không nói gì về chi phí. Không phải NO.
