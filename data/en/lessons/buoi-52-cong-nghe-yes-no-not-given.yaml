  - type: dialogue
    title_vi: AI trong tuyển dụng
    lines:
      - speaker: A
        text: Did you know some companies now use AI to choose which job applicants to interview?
        vi: Cậu có biết một số công ty giờ dùng AI để chọn ứng viên phỏng vấn không?
      - speaker: B
        text: Yes. It's faster, but I'm worried about bias.
        vi: Có. Nhanh hơn, nhưng tớ lo về sự thiên lệch.
      - speaker: A
        text: Why? A computer should be more objective than a person.
        vi: Sao vậy? Máy tính phải khách quan hơn con người chứ.
      - speaker: B
        text: Not necessarily. If the algorithm learns from old data, it's likely to repeat old mistakes.
        vi: Chưa chắc. Nếu thuật toán học từ dữ liệu cũ, nó có khả năng lặp lại sai lầm cũ.
      - speaker: A
        text: Like preferring men for engineering jobs?
        vi: Kiểu ưu tiên nam giới cho các vị trí kỹ sư?
      - speaker: B
        text: Exactly. And there's often a lack of transparency. Applicants don't know why they were rejected.
        vi: Chính xác. Và thường thiếu minh bạch. Ứng viên không biết vì sao họ bị loại.
      - speaker: A
        text: So should companies stop using it?
        vi: Vậy các công ty có nên ngừng dùng nó không?
      - speaker: B
        text: I wouldn't go that far. It may be useful, but only with human oversight.
        vi: Tớ không đến mức đó. Nó có thể hữu ích, nhưng chỉ khi có sự giám sát của con người.
  - type: exercises
    items:
      - id: b52-x1
        bank_no: 13
        kind: ynng
        instructions_vi: Đọc bài (khoảng 8 phút). Các nhận định có khớp với QUAN ĐIỂM của tác giả không? Chọn Y (Yes), N (No) hoặc NG (Not Given). Tách ý người khác và ý tác giả trước khi chọn.
        passage: |-
          SHOULD WE FEAR ARTIFICIAL INTELLIGENCE?

          Few technologies have been discussed as much as artificial intelligence. Some commentators warn that intelligent machines will soon take over most jobs and even threaten human survival. Others promise that AI will cure diseases and end poverty within a generation. In my view, both groups exaggerate.

          There is no doubt that machine learning has produced genuine breakthroughs. Systems that analyse medical scans are, in some studies, as accurate as experienced doctors, and translation software has improved at an unprecedented speed. However, these systems are narrow: a program that identifies skin cancer cannot drive a car or write a poem. The idea that one machine will soon match human intelligence in every area is, I believe, not supported by the evidence.

          That does not mean we should relax. The more immediate danger is not a super-intelligent robot but ordinary algorithms that make decisions about people's lives without anyone checking them. Algorithms already help decide who gets a loan, who is invited to a job interview and, in some countries, who receives police attention. If the data they learn from reflects past discrimination, they are likely to repeat it — and because their decisions look scientific, they may be harder to challenge than a biased human.

          The answer, I would argue, is not to ban AI but to regulate it sensibly. Companies should be required to explain how important decisions are made, and a human should always be able to review them. Such rules may slow innovation slightly, but that is a small price for public trust.
        questions:
          - q: The writer agrees that AI will take over most jobs soon.
            answer: N
            explain_vi: Đó là ý 'some commentators'; tác giả nói 'both groups exaggerate'.
          - q: The writer accepts that machine learning has achieved real progress.
            answer: Y
          - q: The writer believes medical AI is more accurate than all doctors.
            answer: N
            explain_vi: "Bài: 'as accurate as experienced doctors' trong 'some studies' — không phải chính xác hơn tất cả bác sĩ."
          - q: The writer thinks translation software will soon replace human translators.
            answer: NG
            explain_vi: Bài chỉ nói phần mềm dịch tiến bộ nhanh; không nói gì về việc thay thế người dịch.
          - q: According to the writer, ordinary algorithms are a more urgent risk than super-intelligent machines.
            answer: Y
          - q: The writer suggests that biased algorithms may be harder to challenge than biased people.
            answer: Y
          - q: The writer believes AI should be banned in the police.
            answer: N
            explain_vi: "'The answer … is not to ban AI but to regulate it'."
          - q: The writer thinks new rules would greatly reduce companies' profits.
            answer: NG
            explain_vi: Tác giả nói 'may slow innovation slightly' — không nhắc lợi nhuận.
      - id: b52-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng về mức độ chắc chắn.
        questions:
          - q: AI ___ to change most office jobs in the next ten years.
            options:
              - likely
              - is likely
              - will likely to
              - likely is
            answer: b
          - q: Which sentence is the most certain?
            options:
              - AI may replace some drivers.
              - AI is likely to replace some drivers.
              - AI will replace some drivers.
              - AI might replace some drivers.
            answer: c
          - q: Which sentence is the least certain?
            options:
              - Robots are unlikely to replace nurses.
              - Robots will not replace nurses.
              - It is certain that robots won't replace nurses.
              - Robots cannot replace nurses.
            answer: a
          - q: "Passage: 'AI may help teachers mark essays.' Statement: 'The writer believes AI will replace teachers.' →"
            options:
              - Yes
              - No
              - Not Given
            answer: c
            explain_vi: Bài nói giúp chấm bài, không nói gì (không phản bác) việc thay thế → NOT GIVEN. Nếu bài viết 'AI cannot replace teachers' thì mới là NO.
          - q: ___, privacy is the biggest risk of facial recognition.
            options:
              - Likely
              - Arguably
              - Accurately
              - Unlikely
            answer: b
      - id: b52-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu với từ trong ngoặc, giữ nguyên mức độ.
        questions:
          - q: AI will probably change education. (likely) → AI ___
            answer: is likely to change education.
          - q: It is possible that autonomous cars will reduce accidents. (may) → Autonomous cars ___
            answer: may reduce accidents.
          - q: Robots probably won't replace nurses soon. (unlikely) → Robots ___
            answer: are unlikely to replace nurses soon.
          - q: The algorithm seems to prefer men. (appears) → The algorithm ___
            answer: appears to prefer men.
      - id: b52-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 4 lỗi. Sửa trực tiếp.
        text: AI likely to change many jobs. However, robots are unlikely replacing doctors because patients need human contact. Some algorithms appear showing bias against women. It is likely AI will to become more accurate.
        errors:
          - wrong: AI likely to change
            right: AI is likely to change
            why: be likely to + V.
          - wrong: unlikely replacing doctors
            right: unlikely to replace doctors
            why: be unlikely to + V.
          - wrong: appear showing bias
            right: appear to show bias
            why: appear to + V.
          - wrong: It is likely AI will to become
            right: It is likely that AI will become
            why: It is likely that + S + will + V.
      - id: b52-x5
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: algorithm
            right: a set of rules a computer follows to solve a problem
          - left: bias
            right: unfairly favouring one group over another
          - left: transparency
            right: being open about how decisions are made
          - left: breakthrough
            right: an important new discovery
          - left: unprecedented
            right: never having happened before
          - left: human oversight
            right: people checking what a system does
      - id: b52-x6
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: Facial recognition raises serious ___ questions.
            base: ethics
            answer: ethical
          - q: The ___ of medical AI has improved.
            base: accurate
            answer: accuracy
          - q: Some hiring algorithms are ___ against women.
            base: bias
            answer: biased
          - q: AI has the ___ to transform healthcare.
            base: potentially
            answer: potential
          - q: ___ vehicles may reduce accidents.
            base: autonomy
            answer: Autonomous
            accept:
              - autonomous
      - id: b52-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hai người thảo luận (hai giọng) và chọn đáp án đúng. Chú ý mức độ chắc chắn.
        audio_text: |-
          Man: Our city is thinking of using facial recognition cameras in the metro.
          Woman: I read about that. The council says it will cut crime by half.
          Man: Do you believe that?
          Woman: Not really. It may reduce some crime, but half seems unlikely. In other cities, the effect was much smaller.
          Man: What worries you most?
          Woman: Privacy. Once the cameras are there, they're likely to be used for other purposes too.
          Man: So you'd vote against it?
          Woman: Only if there's no human oversight. With strict rules, I might accept it.
        questions:
          - q: What does the council claim?
            options:
              - Crime will fall slightly.
              - Crime will be cut by half.
              - Crime will not change.
              - Cameras are cheap.
            answer: b
          - q: What does the woman think about the council's claim?
            options:
              - It is certain.
              - It is unlikely.
              - It is proven.
              - She has no opinion.
            answer: b
          - q: What is the woman's main worry?
            options:
              - cost
              - privacy
              - accuracy
              - slow trains
            answer: b
          - q: Under what condition might she accept the cameras?
            options:
              - if they are cheap
              - with strict rules and human oversight
              - if crime rises
              - never
            answer: b
      - id: b52-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe đoạn bình luận rồi chọn T (đúng) hoặc F (sai).
        audio_text: Chatbots can now generate essays, poems and computer code in seconds. Some teachers fear that students will stop thinking for themselves. However, early research suggests a more mixed picture. Students who used chatbots only to check ideas actually wrote slightly better essays, whereas students who copied the answers learned very little. The key, researchers say, is not banning the tools but teaching students how to use them.
        questions:
          - q: Chatbots can generate computer code.
            answer: T
          - q: Research shows chatbots always harm learning.
            answer: F
          - q: Students who used chatbots to check ideas wrote much better essays.
            answer: F
            explain_vi: "'slightly better' — tốt hơn một chút."
          - q: Researchers recommend banning chatbots in schools.
            answer: F
  - type: homework
    kind: paragraph
    prompt_vi: Viết đoạn văn 180–200 từ trả lời câu hỏi bên dưới. Trình bày ý kiến của người khác trước (Some people claim…), rồi quan điểm của bạn (In my view…). Dùng ít nhất 4 mức độ chắc chắn khác nhau (will / is likely to / may / is unlikely to / arguably) và 6 từ của buổi này.
    prompt_en: Will artificial intelligence do more good than harm in the next twenty years?
    words:
      min: 180
      max: 200
    minutes: 30
