    prompt_en: |-
      TASK 1 (20 minutes, at least 150 words)
      The pie charts show how an average household in one country spent its income in 2000 and 2025.
      2000: Food 35% · Housing 22% · Transport 14% · Education 8% · Entertainment 6% · Other 15%
      2025: Food 21% · Housing 33% · Transport 13% · Education 12% · Entertainment 9% · Other 12%
      Summarise the information by selecting and reporting the main features, and make comparisons where relevant.

      TASK 2 (40 minutes, at least 250 words)
      More and more people are working from home rather than in an office.
      Do the advantages of this trend outweigh the disadvantages?
      Give reasons for your answer and include any relevant examples from your own knowledge or experience.
