# Buổi 80 — Mock test cuối cùng + Tổng kết lộ trình · Bạn đang ở band nào so với mục tiêu 6.5?. Tự soạn theo lo-trinh-ielts-6.5.md. BẢN NHÁP chờ duyệt.
slug: buoi-80-mock-cuoi-tong-ket
number: 80
stage: 4
title_vi: Mock test cuối cùng + Tổng kết lộ trình · Bạn đang ở band nào so với mục tiêu 6.5?
focus:
  grammar: Không học điểm mới
  skill: Mock test cuối đủ 4 kỹ năng; so sánh với Mock 1 và Mock 77; đánh giá band hiện tại và kế hoạch sau lộ trình
target_band: 6.0-6.5
source: editorial
status: draft
steps:
  - type: skill
    skill: reading
    title_vi: Mock cuối — và nhìn lại 80 buổi
    intro_vi: "Đây là buổi cuối cùng của lộ trình IELTS 6.5. Bạn làm một đề đầy đủ lần cuối, theo đúng kế hoạch ngày thi đã viết ở Buổi 79, với danh sách lỗi ở Buổi 78 bên cạnh. Sau khi chấm, đặt kết quả cạnh Mock 1 (Buổi 66) và Mock 77 để thấy quãng đường đã đi, rồi quyết định bước tiếp theo: đăng ký thi, hay luyện thêm một kỹ năng trước."
    steps:
      - title_vi: Làm đề như ngày thi
        text_vi: Listening (Bài tập 1–7) → Reading (Bài tập 8–15) → Writing (phần Về nhà) → nghỉ → Speaking (Bài tập 16–18). Đọc danh sách lỗi ngày thi trước khi bắt đầu, không đọc lại trong lúc làm.
      - title_vi: So sánh ba mốc
        text_vi: "Lập bảng: Mock 1 (Buổi 66) · Mock 77 · Mock 80 cho Listening, Reading (số câu và band), Writing, Speaking (tự chấm). Kỹ năng nào tăng nhiều nhất? Kỹ năng nào đi ngang?"
      - title_vi: Đánh giá so với mục tiêu 6.5
        text_vi: Band tổng ≥ 6.5 ở cả Mock 77 và Mock 80 → sẵn sàng đăng ký thi. Đạt 6.0 → luyện thêm 2–4 tuần, tập trung kỹ năng thấp nhất (thường Writing). Dưới 6.0 ở một kỹ năng → ôn lại các buổi Giai đoạn 3 của kỹ năng đó trước khi thi.
      - title_vi: Kế hoạch sau lộ trình
        text_vi: "Giữ thói quen: 1 bài nghe/đọc tiếng Anh thật mỗi ngày (podcast, báo), 1 bài Task 2 mỗi tuần, 10 phút nói to mỗi ngày. Kỹ năng ngôn ngữ giảm nhanh nếu ngừng hoàn toàn."
    tips:
      - Tự chấm Writing và Speaking thường lệch ±0.5 band so với giám khảo thật. Nếu có thể, nhờ giáo viên chấm một bài Writing của Mock 80 trước khi đăng ký thi.
      - Đăng ký thi khi kết quả ổn định ở hai lần mock liên tiếp, không phải khi có một lần may mắn.
      - Nếu thi lại, IELTS cho phép thi lại một kỹ năng (One Skill Retake) ở một số địa điểm — kiểm tra trên trang chính thức của đơn vị tổ chức.
    traps:
      - trap_vi: Thất vọng vì Mock 80 thấp hơn Mock 77 một chút.
        fix_vi: Điểm dao động ±0.5 giữa các đề là bình thường. Nhìn xu hướng của cả ba mốc, không nhìn một lần.
      - trap_vi: Dừng học hoàn toàn trong thời gian chờ ngày thi.
        fix_vi: Giữ nhịp nhẹ theo lịch tuần trước thi ở Buổi 79.
    phrases:
      - en: My overall band has risen from 5.5 to 6.5.
        vi: Điểm tổng của tôi đã tăng từ 5.5 lên 6.5.
      - en: Writing is still my weakest skill.
        vi: Writing vẫn là kỹ năng yếu nhất của tôi.
      - en: I'm planning to take the test in two months.
        vi: Tôi dự định thi trong hai tháng tới.
