      - id: b80-x13
        bank_no: 13
        kind: ynng
        instructions_vi: READING PASSAGE 3 · Câu 27–32. Câu nhận định có khớp với QUAN ĐIỂM của tác giả không? Chọn YES / NO / NOT GIVEN.
        passage: |-
          WHY DO WE PUT THINGS OFF?

          A  Almost everyone procrastinates sometimes, delaying a task even though we know the delay will probably make things worse. The common explanation is that procrastinators are lazy or poor at managing their time. I have come to believe that this explanation is, for the most part, mistaken.

          B  A growing body of research suggests that procrastination is mainly a problem of managing emotions, not time. When a task makes us feel anxious, bored or insecure — a difficult report, a tax form, an email we are afraid to send — putting it off provides immediate relief. The relief is real but short-lived, and the task, along with the bad feelings, is still waiting for us later, often larger than before.

          C  This helps to explain why time-management techniques so often fail. A detailed timetable does nothing to reduce the anxiety a task produces; indeed, seeing a long list of unfinished tasks may make the feeling worse. It also explains why procrastination is not related to how busy people are: some of the most chronic procrastinators have plenty of free time.

          D  Interestingly, one of the most effective responses appears to be self-compassion. In a study of university students, those who forgave themselves for procrastinating before their first exam procrastinated less before the next one. Being hard on ourselves, it seems, adds to the negative feelings that caused the delay in the first place.

          E  Other practical strategies target the emotions directly. Making the first step very small — 'open the document and write one sentence' — reduces the feeling of threat. Focusing on how we will feel once a task is finished, rather than on the task itself, can also help. I would add that it is worth noticing which tasks we repeatedly avoid: they often reveal something about our fears, or about work we are doing for the wrong reasons.

          F  None of this means that procrastination is harmless. Chronic procrastination has been linked to stress, poorer health and lower performance. But treating it as a moral failing is unhelpful. Understanding it as an emotional habit — one that can be changed — is both kinder and, the evidence suggests, more effective.
        questions:
          - q: 27 · Laziness is the main cause of procrastination.
            answer: N
          - q: 28 · Putting off a task gives a feeling of relief that does not last.
            answer: Y
          - q: 29 · Time-management techniques usually solve the problem of procrastination.
            answer: N
          - q: 30 · People with very busy jobs procrastinate more than others.
            answer: N
            explain_vi: "'procrastination is not related to how busy people are' → mâu thuẫn trực tiếp."
          - q: 31 · Self-compassion is more effective for students than for older adults.
            answer: NG
          - q: 32 · Tasks we avoid repeatedly may tell us something about ourselves.
            answer: Y
