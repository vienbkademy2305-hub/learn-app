        instructions_vi: LISTENING PART 4 · Câu 31–40. Bài giảng về thói quen (habits). Viết MỘT TỪ cho mỗi chỗ trống.
        max_words: 1
        audio_text: Today's topic is habits — the actions we perform automatically, often without being aware of them. Researchers estimate that around forty per cent of our daily actions are habits rather than conscious decisions. A useful way to understand a habit is as a loop with three parts. First, there is a cue, something in our environment that triggers the behaviour, such as a time of day or a place. Then comes the routine, the behaviour itself. Finally, there is a reward, which makes the brain more likely to repeat the loop next time. How long does it take to form a new habit? A popular claim says twenty-one days, but this has little scientific basis. In one well-known study, the average was sixty-six days, and it varied enormously between people and between behaviours. Simple habits, like drinking a glass of water at breakfast, formed much faster than complex ones, like exercising every day. Missing a single day, interestingly, made little difference to the final result. What about breaking bad habits? Research suggests that willpower alone is surprisingly ineffective. A better strategy is to change the environment, so that the cue doesn't appear. For example, people who want to use their phones less are more successful if they keep the phone in another room, rather than simply trying to resist it. Another effective approach is to replace the routine while keeping the same cue and reward. Someone who snacks when they feel stressed might go for a short walk instead. Finally, habits are strongly connected to identity. People who think of themselves as, say, a runner, rather than as someone who is trying to run, find it easier to keep the habit going.
        passage: |-
