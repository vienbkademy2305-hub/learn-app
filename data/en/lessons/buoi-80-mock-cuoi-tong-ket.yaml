        instructions_vi: READING PASSAGE 1 · Câu 1–7. Bắt đầu 60 phút Reading. Chọn TRUE / FALSE / NOT GIVEN.
        passage: |-
          THE HIDDEN VALUE OF MANGROVES

          Mangroves are trees and shrubs that grow along tropical and subtropical coastlines, in the zone between high and low tide. Few plants can survive there: the soil is salty, low in oxygen and flooded twice a day. Mangroves cope in a variety of ways. Some species filter salt out at their roots, while others get rid of it through their leaves. Many have roots that grow upwards out of the mud, allowing them to take in air.

          For a long time, mangrove forests were seen as wasteland. Between 1980 and 2000, roughly a third of the world's mangroves were cleared, mainly for shrimp farms, rice fields and coastal development. Only recently has their true value been widely recognised.

          The most obvious benefit is protection. Dense mangrove forests reduce the height of waves and slow down storm surges, protecting villages behind them. After the Indian Ocean tsunami of 2004, several studies reported that areas with healthy mangroves suffered less damage than similar areas without them, although researchers have debated how strong this effect was.

          Mangroves are also extremely important for fisheries. Their roots provide shelter for young fish, crabs and shrimp, and many species that are caught at sea spend the early part of their lives in mangrove forests. Coastal communities in South-East Asia depend on these catches for both food and income.

          Perhaps the most surprising discovery concerns carbon. Mangroves store large amounts of carbon, not only in their trees but especially in the waterlogged soil beneath them, where dead plant material decays very slowly. Per hectare, a mangrove forest can store several times more carbon than a typical tropical rainforest. When mangroves are cleared, much of this carbon is released.

          Efforts to restore mangroves have had mixed results. Early projects often planted a single species in large numbers, frequently in places where mangroves had never grown naturally, and many of the young trees died. More successful projects first restore the natural flow of water, for example by removing old walls around abandoned shrimp ponds, and then allow mangroves to return on their own or plant species suited to each part of the shore.
        questions:
          - q: 1 · Mangrove soil contains a lot of oxygen.
            answer: F
          - q: 2 · All mangrove species remove salt through their leaves.
            answer: F
            explain_vi: "'Some species … at their roots, while others … through their leaves' — không phải tất cả."
          - q: 3 · Shrimp farming was one reason for the loss of mangroves.
            answer: T
          - q: 4 · Researchers fully agree about how much mangroves reduced tsunami damage in 2004.
            answer: F
            explain_vi: "'researchers have debated how strong this effect was' → không đồng thuận."
          - q: 5 · Fish caught in mangrove forests are sold mainly to foreign markets.
            answer: NG
          - q: 6 · Most of the carbon in mangrove forests is stored in the soil.
            answer: T
            explain_vi: "'not only in their trees but especially in the waterlogged soil'."
          - q: 7 · Vietnam has the largest area of restored mangroves in Asia.
            answer: NG
