        instructions_vi: READING PASSAGE 2 · Câu 14–18. Đoạn nào (A–F) chứa thông tin sau? Một đoạn có thể được chọn nhiều lần.
        passage: |-
          THE RETURN OF THE TRAM

          A  In the first half of the twentieth century, trams ran through the streets of hundreds of cities in Europe, North America and Asia. Hà Nội had its own network from 1900 until 1991. Yet in most places they were removed between the 1930s and 1960s, as buses became cheaper and cars more common. Trams came to be seen as old-fashioned and an obstacle to traffic.

          B  Since the 1980s, however, trams — now usually called 'light rail' — have been making a comeback. France has been particularly enthusiastic: Strasbourg reintroduced trams in 1994, and more than twenty French cities have followed. Transport planner Claire Dubois argues that the success of these schemes came from treating the tram as part of a wider plan to redesign the city centre, not simply as a means of transport.

          C  Supporters point to several advantages. Trams can carry far more passengers than buses, produce no exhaust fumes on the street and give a smoother ride. Research by economist Daniel Hughes suggests that property values near new tram stops often rise, which he believes shows that people value permanent rail lines more than bus routes that could be changed at any time.

          D  The main disadvantage is cost. Building a tram line requires moving underground pipes and cables and rebuilding the road, and can cost many times more than an equivalent bus service. Construction can also disrupt businesses for years. Professor Ruth Okoye, who has studied several projects, warns that cities often underestimate both the cost and the time involved, and that some lines have carried far fewer passengers than predicted.

          E  For this reason, some cities have chosen bus rapid transit (BRT) instead: buses that run on their own lanes, with stations where passengers pay before boarding. Okoye points out that BRT can provide many of the benefits of trams at a fraction of the price, as long as cities are willing to give buses truly separate lanes.

          F  The debate is likely to continue, but one thing is clear: the choice depends less on the vehicle than on the political will to give public transport priority over private cars. As Dubois puts it, 'A tram stuck in traffic is no better than a bus.'
