  - type: skill
    skill: listening
    title_vi: "Listening — Multiple choice: chọn đáp án đúng khi cả 3 phương án đều được nhắc"
    intro_vi: "Dạng bài xuất hiện nhiều ở Part 2 và Part 3 (đôi khi Part 1, 4): một câu hỏi và 3 phương án A, B, C. Câu hỏi đi theo thứ tự của bài nghe. Cái khó: người nói thường nhắc tới CẢ BA phương án, nhưng chỉ một phương án khớp với câu hỏi — hai phương án kia bị phủ định, bị sửa lại hoặc nói về đối tượng khác. Vì vậy nghe thấy từ khóa chưa đủ, phải nghe hết ý."
    steps:
      - title_vi: Đọc câu hỏi, gạch từ khóa
        text_vi: Gạch ai (the man? the woman? most employees?), cái gì, thời gian (last year / this year). Từ khóa trong câu hỏi thường được giữ nguyên hoặc paraphrase nhẹ — đó là tín hiệu 'sắp tới câu này'.
      - title_vi: Đọc 3 phương án, gạch điểm KHÁC nhau
        text_vi: Ba phương án thường giống nhau phần lớn, chỉ khác 1–2 từ (two hours per week / one day per month). Gạch đúng chỗ khác đó — đáp án nằm ở đấy.
      - title_vi: Đoán cách paraphrase
        text_vi: "Hỏi: người nói có thể nói ý này bằng từ khác thế nào? job satisfaction → enjoy their work more; unemployed people → people who are looking for work."
      - title_vi: Nghe tín hiệu chuyển ý (signposting)
        text_vi: Những cụm như 'Now, moving on to…', 'Another thing…', 'But the main reason is…', 'Actually…' báo hiệu câu hỏi mới hoặc đáp án thật sắp tới.
      - title_vi: Ghi chú ✓ / ✗ cạnh từng phương án
        text_vi: Khi một phương án bị phủ định (not, no longer, we decided against…), đánh ✗ ngay. Phương án được xác nhận cuối cùng mới chọn.
      - title_vi: Không kịp thì bỏ, sang câu sau
        text_vi: Câu hỏi đã qua thì không quay lại được. Đoán tạm một đáp án và tập trung vào câu tiếp theo.
    tips:
      - Đáp án đúng thường được nói bằng từ KHÁC với phương án; phương án lặp y nguyên từ trong bài nghe thường là bẫy.
      - "Chú ý chủ thể: câu hỏi 'What does the WOMAN think?' — bỏ qua ý kiến của người đàn ông."
      - "Chú ý thời gian: last year / this year / in the future. Bẫy hay gặp: nói về việc năm ngoái rồi mới tới năm nay."
      - "Câu điều kiện là bẫy: 'If it rains, we'll use the hall' — chưa chắc đã dùng hall."
    traps:
      - trap_vi: Chọn phương án vì nghe thấy đúng từ đó.
        fix_vi: "Nghe thêm 1–2 câu sau: 'Some people think it's the money, but actually…' — ý sau 'actually/but' mới là đáp án."
      - trap_vi: Nhầm chủ thể khi có hai người/hai nhóm tương tự (bố mẹ và ông bà, năm ngoái và năm nay).
        fix_vi: Gạch chủ thể trong câu hỏi và chỉ ghi chú thông tin của đúng chủ thể đó. Đây là lỗi bạn đã hay mắc ở dạng T/F/NG.
      - trap_vi: "Người nói tự sửa: 'We meet on Tuesdays — oh no, sorry, it's Thursdays now.'"
        fix_vi: Luôn chọn thông tin CUỐI CÙNG sau các cụm sorry / I mean / actually / not any more.
    phrases:
      - en: Now, moving on to …
        vi: Bây giờ, chuyển sang …
        note_vi: Tín hiệu câu hỏi mới.
      - en: The main reason is that …
        vi: Lý do chính là …
        note_vi: Đáp án cho câu hỏi 'why'.
      - en: Actually, …
        vi: Thật ra thì …
        note_vi: Thường sửa lại ý trước đó.
      - en: We decided not to …
        vi: Chúng tôi quyết định không …
        note_vi: Loại phương án đó.
      - en: One thing to remember is …
        vi: Một điều cần nhớ là …
        note_vi: Nhấn mạnh thông tin quan trọng.
      - en: That's no longer the case.
        vi: Giờ không còn như thế nữa.
        note_vi: Phủ định thông tin cũ.
    demo:
      title_vi: "Làm mẫu: loại hai phương án nhiễu"
      text_en: |-
        Question: What is the main reason why older people join the Family Centre?
        A  to learn new skills
        B  to meet other people
        C  to get help with their health

        Speaker: "We do offer computer classes, and some older people come for those. We also have a nurse who visits once a month. But when we asked our members, most of them said they come because they feel lonely at home — they want to talk to people of their own age."
      notes:
        - label: A — computer classes
          text_vi: Được nhắc ('some older people come for those') nhưng chỉ là MỘT SỐ người → không phải lý do chính. ✗
        - label: C — a nurse
          text_vi: Có nhắc sức khỏe nhưng chỉ là dịch vụ, không phải lý do người ta tới. ✗
        - label: B — đáp án
          text_vi: "'But … most of them said … feel lonely … want to talk to people' = meet other people. Tín hiệu 'But' + 'most of them' + paraphrase."
