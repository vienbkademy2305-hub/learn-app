            options:
              - Hana
              - Marcus
              - both
            answer: c
            explain_vi: "Hana: 'I'm not convinced'; Marcus: 'I agree with you there' → cả hai."
          - q: 22 · A local example would interest the audience more.
            options:
              - Hana
              - Marcus
              - both
            answer: b
          - q: 23 · The article about biodegradable plastic gave a false impression.
            options:
              - Hana
              - Marcus
              - both
            answer: c
            explain_vi: "Marcus: 'misleading'; Hana: 'That's exactly what I found' → đồng ý."
          - q: 24 · Technical problems might affect the presentation.
            options:
              - Hana
              - Marcus
              - both
            answer: a
          - q: 25 · The presentation should end with a request for action.
            options:
              - Hana
              - Marcus
              - both
            answer: b
            explain_vi: Marcus muốn khán giả ký cam kết; Hana phản đối, muốn đặt câu hỏi thảo luận.
