        passage: |-
          DOES HANDWRITING STILL MATTER?

          A  In many schools, handwriting lessons are disappearing. Children spend more and more of the day typing on laptops and tablets, and some education authorities have stopped requiring pupils to learn joined-up writing at all. The argument is simple: adults today write almost everything on a keyboard, so why spend hours teaching a skill that is no longer needed? It is an argument I once found convincing. I am no longer sure that it is right.

          B  The first reason for doubt comes from research on note-taking. In a widely reported study, university students listened to lectures and took notes either by hand or on a laptop. Those who typed wrote down far more words, often copying the lecturer almost exactly. Yet when they were tested later, the students who had written by hand understood the ideas better. The researchers' explanation was that writing by hand is slower, so students cannot record everything; they are forced to decide what is important and put it into their own words, and this extra mental effort helps them to learn.

          C  A second line of evidence concerns young children. Studies using brain scans have found that when children practise forming letters by hand, areas of the brain linked to reading become more active than when they simply look at letters or type them. Some researchers believe that the physical movement of drawing each letter helps children to remember its shape. If this is correct, then giving up handwriting too early could make learning to read harder for some children.

          D  It would be a mistake, however, to exaggerate these findings. Not every study has found an advantage for handwriting, and the note-taking research in particular has been repeated with mixed results. Laptops also bring benefits that paper cannot: students with poor handwriting or physical difficulties can produce work that is clear and well organised, and typed notes can be searched, shared and edited. To suggest that pupils should go back to pen and paper for everything would be to ignore these advantages.

          E  What seems clear is that the question is not 'handwriting or keyboard?' but 'which tool for which purpose?' Typing is efficient when the aim is to produce a long, polished text. Handwriting may be the better choice when the aim is to think, to plan or to learn something new. A sensible school policy would teach both skills properly, rather than treating one as old-fashioned and the other as modern.

          F  There is also a less practical argument, which I admit is harder to prove. A handwritten letter or note says something that a typed message does not: that someone took the time to write it. Most of us keep a few handwritten cards long after we have deleted thousands of emails. That alone is not a reason to fill the school timetable with handwriting practice, but it is a reminder that what is efficient is not always what is valued.
        questions:
          - q: 27 · The writer has always disagreed with the argument for removing handwriting lessons.
            answer: N
            explain_vi: "'It is an argument I once found convincing' → trước đây tác giả từng đồng ý."
          - q: 28 · Students who typed their notes recorded more of what the lecturer said.
            answer: Y
          - q: 29 · The note-taking study was carried out at several universities.
            answer: NG
            explain_vi: Bài không nói nghiên cứu ở một hay nhiều trường.
          - q: 30 · The evidence in favour of handwriting is not completely consistent.
            answer: Y
            explain_vi: "'Not every study has found an advantage… mixed results'."
          - q: 31 · Schools should return to using pen and paper for all work.
            answer: N
          - q: 32 · Handwritten cards are kept longer than emails because they are more attractive.
            answer: NG
            explain_vi: Tác giả nói người ta giữ thiệp viết tay lâu hơn, nhưng lý do là 'someone took the time to write it', không nói về vẻ đẹp.
