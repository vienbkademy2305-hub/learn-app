      - id: b67-x6
        bank_no: 22
        kind: completion
        instructions_vi: LISTENING PART 4 · Câu 31–40. Bài giảng về giấc ngủ và trí nhớ. Hoàn thành ghi chú và sơ đồ. Viết MỘT TỪ cho mỗi chỗ trống.
        max_words: 1
        audio_text: In today's lecture, I want to look at the relationship between sleep and memory. For a long time, sleep was seen as a passive state, a time when the brain simply rested. We now know that this is far from true. During sleep, the brain is extremely active, and one of its most important jobs is to process what we have learned during the day. Let me describe the basic process, which researchers call consolidation. First, during the day, new information is stored temporarily in a region of the brain called the hippocampus. You can think of the hippocampus as a kind of notebook. It records things quickly, but it doesn't have much space. Then, during deep sleep, the brain replays the day's experiences. Next, important memories are transferred to the cortex, the outer layer of the brain, where they can be kept for a long time. Finally, the hippocampus is cleared, so that it is ready to receive new information the next day. So what happens if we don't get enough sleep? In one well-known experiment, students who stayed awake all night before a test remembered about forty per cent less than students who had slept normally. Interestingly, lack of sleep doesn't only affect facts. It also affects emotions. People who are tired tend to remember negative experiences more easily than positive ones. And there is also an effect on skills. Musicians who practised a new piece and then slept performed it more accurately the next day than those who practised in the morning and were tested in the evening, without sleep. What about naps? Short naps of around twenty minutes can improve alertness, but for memory, longer naps that include deep sleep seem to be more effective. However, a nap that is too long, or too late in the day, can make it harder to sleep at night. Finally, some practical advice for students. Revising in the evening and then sleeping is more effective than staying up late. It also helps to keep regular hours, because the body's internal clock affects the quality of sleep. And it's best to avoid screens before bed, as the light from them can delay sleep.
        passage: |-
          SLEEP AND MEMORY
          Old view: sleep was a (31) ___ state in which the brain rested
          The consolidation process
          Day: new information is stored in the hippocampus, which works like a (32) ___
            ↓
          Deep sleep: the brain (33) ___ the day's experiences
            ↓
          Important memories are moved to the (34) ___
            ↓
          The hippocampus is (35) ___, ready for new information
          Effects of lack of sleep
          • Students awake all night remembered about 40% less
          • Tired people remember (36) ___ experiences more easily
          • Musicians who slept played a new piece more (37) ___
          Naps
          • 20 minutes: better alertness; longer naps with deep sleep help memory
          • Too long or too (38) ___ in the day: harder to sleep at night
          Advice for students
          • Revise in the (39) ___, then sleep
          • Keep regular hours; avoid (40) ___ before bed
        questions:
          - q: (31)
            answer: passive
          - q: (32)
            answer: notebook
          - q: (33)
            answer: replays
            explain_vi: Động từ ở hiện tại đơn, chủ ngữ 'the brain' → replays (có -s).
          - q: (34)
