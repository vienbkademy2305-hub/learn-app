        instructions_vi: LISTENING PART 1 · Câu 1–10. Hoàn thành phiếu ghi danh khóa học buổi tối. Viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống. Chỉ nghe MỘT lần.
