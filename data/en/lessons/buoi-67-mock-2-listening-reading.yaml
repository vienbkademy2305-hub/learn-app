          HOW THE NETHERLANDS BECAME A CYCLING NATION

          A  Today, the Netherlands has more bicycles than people, and more than a quarter of all journeys there are made by bike. Visitors often assume that this has always been the case, and that the Dutch simply cycle because their country is flat. The real story is more complicated.

          B  Bicycles became popular in the Netherlands at the end of the nineteenth century, as they did in many European countries. At first they were expensive and were mainly ridden by wealthy people for pleasure. By the 1920s, however, prices had fallen, and the bicycle had become an everyday form of transport for ordinary workers.

          C  After the Second World War, things began to change. As the economy grew, more and more families bought cars, and Dutch cities, like cities elsewhere, started to redesign their streets for motor traffic. Old neighbourhoods were knocked down to build wider roads, and the number of journeys made by bike fell steadily throughout the 1950s and 1960s.

          D  The turning point came in the early 1970s. Road deaths had risen sharply, and in 1971 more than 3,000 people were killed on Dutch roads, over 400 of them children. Protest groups were formed, the best known of which was called 'Stop de Kindermoord' ('Stop the Child Murder'). Its members organised demonstrations, blocked streets and held events at which children played in roads that had been closed to cars.

          E  At about the same time, the oil crisis of 1973 caused fuel prices to rise dramatically. The government introduced 'car-free Sundays', on which private cars were banned from the roads. Many people were surprised to discover how pleasant their streets could be without traffic, and the experience helped to change public opinion.

          F  From the mid-1970s, Dutch cities began to invest in separate cycle paths, and some city centres were closed to through traffic. Delft and The Hague were among the first cities to test complete networks of cycle routes. Planners found that people cycled more when routes were continuous and direct, rather than simply when more paths were built.

          G  The result is the system that exists today: thousands of kilometres of protected paths, traffic lights designed for cyclists and enormous bicycle parks at railway stations. The largest, in Utrecht, has space for 12,500 bikes. Even so, Dutch planners say the work is not finished. Electric bikes now allow people to cycle longer distances, and many cities are building 'fast cycle routes' between towns to encourage commuters to leave their cars at home.
        questions:
          - q: 1 · The Dutch cycle mainly because their country is flat.
            answer: F
            explain_vi: Bài nói khách du lịch 'assume' như vậy, nhưng 'The real story is more complicated' → bác bỏ.
          - q: 2 · In the late nineteenth century, cycling in the Netherlands was mostly a leisure activity for rich people.
            answer: T
          - q: 3 · Dutch bicycles in the 1920s were cheaper than those in other European countries.
            answer: NG
            explain_vi: Bài chỉ nói giá giảm, không so sánh với nước khác.
          - q: 4 · Cycling in Dutch cities increased during the 1950s and 1960s.
            answer: F
            explain_vi: "'fell steadily' → giảm, ngược với 'increased'."
          - q: 5 · Some members of 'Stop de Kindermoord' had lost children in road accidents.
            answer: NG
            explain_vi: Bài nói về số trẻ em chết và hoạt động của nhóm, không nói về thành viên. Thông tin 'nghe hợp lý' nhưng không có trong bài → NG.
          - q: 6 · Car-free Sundays changed how many people felt about traffic in their streets.
            answer: T
          - q: 7 · Planners found that the total length of cycle paths mattered more than whether routes were connected.
            answer: F
            explain_vi: "Ngược lại: người ta đạp nhiều hơn khi tuyến 'continuous and direct', 'rather than simply when more paths were built'."
