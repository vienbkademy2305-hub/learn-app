        passage: |-
          FARMING UPWARDS

          A  In a former warehouse on the edge of Singapore, lettuces grow in towers that reach almost to the ceiling. There is no soil and no sunlight. Instead, the plants sit in trays of water containing carefully measured nutrients, and they are lit by rows of LED lamps. This is a vertical farm, and supporters believe that farms like it could play a major role in feeding the world's growing cities.

          B  The arguments in favour are easy to understand. Vertical farms use a tiny fraction of the land needed by traditional farms, because crops are stacked in layers. They also use up to 95 per cent less water, since water is collected and reused rather than lost into the ground. Because the plants are grown indoors, they are protected from pests, so no pesticides are needed, and harvests do not depend on the weather. Food can be grown close to where people live, which reduces the distance it has to travel.

          C  However, the industry has a serious weakness: energy. Sunlight is free, but LED lamps are not. Professor Lena Hartmann, an agricultural economist, has calculated that the electricity needed to grow a single kilogram of lettuce indoors can cost more than the price a supermarket pays for the same lettuce grown in a field. 'The technology works,' she says, 'but in many countries the numbers don't.' In 2023, several large vertical farming companies in Europe and the United States closed, mainly because of rising electricity prices.

          D  Another limitation is the type of crop. At present, vertical farms grow mainly leafy vegetables, herbs and strawberries — plants that grow quickly and are sold at high prices. Staple crops such as wheat and rice, which provide most of the world's calories, are a different matter. Dr Tomás Ferreira, a plant scientist, points out that wheat grown indoors would need so much light that a loaf of bread could cost many times its current price. He does not believe this will change in the near future.

          E  Supporters argue that these problems can be solved. LED lamps have become far more efficient over the past decade, and some farms now use renewable energy, such as solar panels on nearby buildings. Dr Amira Haddad, who studies urban food systems, suggests that vertical farms make most sense in places where land is extremely expensive or where the climate makes traditional farming difficult, such as desert regions. 'This is not about replacing fields,' she says. 'It's about adding to them in the right places.'

          F  Singapore is a good example of the conditions she describes. The country imports more than 90 per cent of its food, and it has very little farmland. The government has set a target of producing 30 per cent of the country's nutritional needs locally by 2030, and vertical farms are part of that plan. Whether the target will be met remains to be seen, but the experiment is being watched closely by other crowded cities.
        questions:
          - q: 14 · a reason why some companies went out of business
            options: &a1
              - A
              - B
              - C
              - D
              - E
              - F
            answer: c
          - q: 15 · a description of how plants are fed without soil
            options: *a1
            answer: a
          - q: 16 · a figure for the amount of food a country buys from abroad
            options: *a1
            answer: f
          - q: 17 · a reference to improvements in lighting technology
            options: *a1
            answer: e
          - q: 18 · an explanation of why farms do not need chemicals to kill insects
            options: *a1
            answer: b
            explain_vi: "'protected from pests, so no pesticides are needed' — pesticides = chemicals to kill insects."
