          Woman: Dr Evans, could you look at our plan for the presentation?
          Man: Of course. Overall, the structure is clear. My main concern is the length. You've planned twenty-five minutes, but you only have fifteen.
          Woman: Oh. Which part should we cut?
          Man: The history of plastic. It's interesting, but it's not central to your argument.
          Woman: OK. What about the statistics? We've got a lot of them.
          Man: Keep the numbers, but choose three or four of the most striking ones and put them on one slide. Too many figures and the audience will stop listening.
          Woman: Right. And is it fine if Marcus does all the speaking? He's more confident than me.
          Man: I'm afraid not. Both of you need to speak for roughly equal amounts of time, because you're assessed individually.
          Woman: I see. Should we prepare a handout?
          Man: It's not required, but it would be a good idea to put your list of sources on it.
          Woman: Thank you. One last thing, when do you need the slides?
          Man: Email them to me the day before. Not on the morning of the presentation, please.
