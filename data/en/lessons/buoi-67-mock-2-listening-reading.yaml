        audio_text: |-
          Man: Good evening, Westbrook Adult Learning Centre. Can I help you?
          Woman: Yes, I'd like to enrol on one of your evening courses, please.
          Man: Certainly. Which course are you interested in?
          Woman: Well, I was thinking about the photography course, but I've just seen that it's full. So I'll do the Italian for beginners instead.
          Man: Good choice. Could I have your full name?
          Woman: It's Megan Doyle. That's D-O-Y-L-E.
          Man: Thank you. And what's your date of birth?
          Woman: The twelfth of March, nineteen ninety-four.
          Man: And your phone number?
          Woman: It's oh-seven-nine-six-four, three-three-eight, two-one-five.
          Man: Let me repeat that. Oh-seven-nine-six-four, three-three-eight, two-one-five?
          Woman: That's right.
          Man: The Italian course meets on Wednesdays. It used to be in room twelve, but this term it's in room twenty, on the second floor.
          Woman: OK. And how long is the course?
          Man: It's ten weeks, and the fee is ninety pounds.
          Woman: Is there a discount for students? I'm doing a part-time degree.
          Man: Yes, students pay seventy-five pounds. You'll just need to show your student card on the first evening.
          Woman: Great. Do I need to buy a book?
          Man: No, the tutor gives out notes each week, but you should bring a dictionary. A small one is fine.
          Woman: And who's the tutor?
          Man: This term it's Mr Rossi. Oh, wait, sorry, I'm looking at last term's list. It's Ms Bianchi now. B-I-A-N-C-H-I.
          Woman: Thanks. One more thing. Is there somewhere to park?
          Man: The car park at the front closes at six, so most evening students use the one behind the sports hall.
          Woman: Perfect. And when does it start?
          Man: The first class is on the fourteenth of January.
