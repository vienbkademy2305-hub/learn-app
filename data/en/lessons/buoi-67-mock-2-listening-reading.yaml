        instructions_vi: LISTENING PART 2 · Câu 11–15. Một bài nói trên đài phát thanh về chương trình thuê xe đạp của thành phố. Chọn đáp án đúng.
        audio_text: Good morning, and thanks for having me on the programme. I'm Ravi Patel from the city transport office, and I'm here to talk about our new bike share scheme, which starts next month. The idea isn't new, of course. Many cities have had schemes like this for years, and ours is based mainly on the one in Lyon, in France, although we've added some features of our own. There will be forty docking stations at the start, mostly near bus and train stations, and we hope to double that number within two years. Now, the bikes themselves. Half of them will be electric, which should help people who live on the hills to the north of the city. To use a bike, you'll need our free app. You can pay for each journey, but most regular users will want the annual pass, which costs sixty pounds. That gives you unlimited rides of up to forty-five minutes. Some people have asked whether children can use the bikes. The answer is that you have to be at least sixteen, and riders under eighteen need permission from a parent. Finally, I know some listeners are worried about safety. We're not making helmets compulsory, because research from other cities shows this tends to reduce the number of people who cycle. Instead, we'll be spending most of the budget for the first year on new protected cycle lanes.
        questions:
          - q: 11 · The city's scheme is mostly based on a scheme in
            options:
              - London.
              - Lyon.
              - Amsterdam.
              - Copenhagen.
            answer: b
          - q: 12 · Most of the first docking stations will be
            options:
              - in the city centre.
              - near schools and colleges.
              - near public transport.
              - on the hills to the north.
            answer: c
            explain_vi: "'near bus and train stations' = gần giao thông công cộng (paraphrase)."
          - q: 13 · What does the annual pass include?
            options:
              - unlimited rides of up to 45 minutes
              - one free electric bike
              - a free helmet
              - rides for two people
            answer: a
          - q: 14 · Who can use the bikes?
            options:
              - anyone over 12 with a parent
              - anyone aged 16 or over, with parental permission if under 18
              - adults over 18 only
              - students with a college card
            answer: b
          - q: 15 · Why will helmets NOT be compulsory?
            options:
              - They are too expensive to provide.
              - Electric bikes are slower than normal bikes.
              - It could make fewer people cycle.
              - The protected lanes make them unnecessary.
            answer: c
            explain_vi: Làn đường bảo vệ là việc thành phố LÀM THÊM, không phải lý do không bắt buộc mũ.
