      - id: b67-x4
        bank_no: 21
        kind: mcq
        instructions_vi: LISTENING PART 3 · Câu 21–25. Hai sinh viên Hana và Marcus chuẩn bị bài thuyết trình về rác thải nhựa. Ý kiến nào sau đây là của ai? Chọn A (Hana), B (Marcus) hoặc C (cả hai).
        audio_text: |-
          Woman: Marcus, I've read the articles our tutor suggested. One of them says that recycling is the most important solution to plastic waste. I'm not convinced. Only a small part of plastic is actually recycled.
          Man: I agree with you there. Reducing how much plastic we use has to come first.
          Woman: Good. Now, what about the deposit scheme in Germany, where you get money back for returning bottles? I think we should use it as our main example.
          Man: Hmm, I'd rather use a local example. The audience will find it easier to relate to.
          Woman: Fair enough, we can mention Germany briefly. What did you think of the article about biodegradable plastic?
          Man: Honestly, I thought it was a bit misleading. A lot of that plastic only breaks down at very high temperatures in special factories.
          Woman: That's exactly what I found. Most people think it just disappears in the ground.
          Man: Right. Another thing: I think we should include a short video. People remember images better than numbers.
          Woman: Maybe, but videos often don't work on the classroom computers. I'd prefer to use a few clear photos.
          Man: OK, photos then. And at the end I'd like to ask the audience to sign a pledge to stop using plastic bags.
          Woman: I'm not sure about that. It might feel a bit forced. A simple question for discussion would be better, I think.
        questions:
