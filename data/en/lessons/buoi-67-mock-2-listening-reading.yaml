# Buổi 67 — Mock test 2 · Listening + Reading — dạng nối thông tin & nối đặc điểm. Tự soạn theo lo-trinh-ielts-6.5.md. BẢN NHÁP chờ duyệt.
slug: buoi-67-mock-2-listening-reading
number: 67
stage: 4
title_vi: Mock test 2 · Listening + Reading — dạng nối thông tin & nối đặc điểm
focus:
  grammar: Không học điểm mới — chữa lỗi phát sinh khi làm đề
  skill: Listening + Reading — đề thứ hai, nhiều câu Matching (thông tin, đặc điểm, ý kiến); so sánh với nhật ký lỗi Mock 1
target_band: 6.0-6.5
source: editorial
status: draft
steps:
  - type: skill
    skill: reading
    title_vi: Mock 2 — làm đề, rồi đối chiếu với nhật ký lỗi Mock 1
    intro_vi: "Đề thứ hai có cùng cấu trúc với Mock 1 (Listening 40 câu khoảng 30 phút, Reading 40 câu 60 phút) nhưng có nhiều dạng NỐI hơn: nối người nói với ý kiến (Listening Part 3), nối thông tin với đoạn văn và nối phát hiện với nhà nghiên cứu (Reading). Đây là những dạng dễ mất điểm vì đáp án KHÔNG xuất hiện theo thứ tự câu hỏi. Làm đề như thi thật, chấm, rồi so sánh nhật ký lỗi với Mock 1: lỗi nào lặp lại hai lần là lỗi cần luyện ở Buổi 75–76."
    steps:
      - title_vi: Trước khi làm — đọc lại nhật ký lỗi Mock 1
        text_vi: "Dành 3 phút đọc lại 2–3 nguyên nhân mất điểm nhiều nhất ở Mock 1 (VD: nhầm F với NG, sai -s số nhiều, không nghe kịp Part 4). Viết chúng ra góc giấy nháp để nhắc mình trong lúc làm."
      - title_vi: Listening Part 3 — nối người nói với ý kiến
        text_vi: "Đọc trước các ý kiến (A–E) và gạch keyword. Khi nghe, chú ý AI nói và người kia có đồng ý không: 'I'm not convinced', 'That's exactly what I thought' quyết định đáp án. Một ý được nhắc tới chưa chắc là ý của người đang nói."
      - title_vi: Matching information — tìm chi tiết, không tìm ý chính
        text_vi: "Dạng 'Which paragraph contains…?' hỏi một CHI TIẾT nhỏ (một ví dụ, một con số, một lời giải thích), không phải ý chính của đoạn. Làm SAU các dạng khác của cùng bài đọc: lúc đó bạn đã đọc bài và nhớ chi tiết nào nằm ở đâu. Một đoạn có thể được chọn hai lần, có đoạn không được chọn."
      - title_vi: Matching features — gạch tên người, rồi đọc quanh tên
        text_vi: "Quét bài tìm mọi chỗ có tên nhà nghiên cứu (kể cả họ được nhắc lại sau: 'Larsen's team', 'she'). Đọc 2–3 câu quanh mỗi tên, tóm tắt ý của họ bằng 3–4 từ tiếng Việt, rồi nối với các phát biểu. Câu hỏi thường paraphrase rất mạnh."
      - title_vi: Chấm, quy đổi band, so với Mock 1
        text_vi: Dùng bảng quy đổi ở Buổi 66 (Listening 23 câu ≈ 6, 30 ≈ 7; Reading 23 ≈ 6, 30 ≈ 7). Ghi điểm hai lần mock cạnh nhau. Điểm tăng mà lỗi cũ vẫn còn thì vẫn phải luyện lỗi đó.
    tips:
      - "Matching information: đáp án thường là những từ như 'an example of…', 'a reference to…', 'a comparison between…'. Hãy tìm đúng LOẠI chi tiết đó."
      - Listening Part 3 thường có ý kiến bị người nói bác bỏ ngay sau khi nêu ra. Nghe hết lượt của cả hai người.
      - "Flow-chart (Part 4 hoặc Reading): các bước theo đúng thứ tự thời gian. Chỗ trống thường là danh từ hoặc động từ chỉ hành động."
      - Sau khi chấm, đếm riêng số câu sai ở dạng Matching. Từ 4 câu sai trở lên thì Matching là một ứng viên cho Buổi 75–76.
    traps:
      - trap_vi: Nối người nói với ý kiến mà người đó chỉ nhắc lại lời người khác ('My brother thinks…').
        fix_vi: "Hỏi: đây có phải quan điểm CỦA người đang nói không? Nghe tiếp xem họ đồng ý hay phản bác."
      - trap_vi: "Matching information: đọc lại cả bài cho từng câu hỏi → hết giờ."
        fix_vi: "Làm dạng này cuối cùng trong bài đọc. Khi làm các dạng khác, ghi chú lề 2–3 từ cho mỗi đoạn (VD: 'A: chi phí', 'D: ví dụ Singapore')."
      - trap_vi: Nhầm chủ thể giữa hai nhà nghiên cứu có kết luận gần giống nhau (lỗi riêng của bạn).
        fix_vi: "Gạch tên người ở cả câu hỏi và bài đọc. So sánh động từ: 'found', 'argued', 'doubted' khác nhau về mức độ chắc chắn."
      - trap_vi: "Đáp án đúng ý nhưng sai chính tả hoặc thiếu -s (VD: 'nutrient' thay cho 'nutrients')."
        fix_vi: Soát chính tả và số ít/số nhiều cho mọi câu điền từ trước khi nộp.
    phrases:
      - en: I'm not convinced that's the main reason.
        vi: Tôi không tin đó là lý do chính.
        note_vi: Người nói PHẢN ĐỐI ý vừa nêu → không chọn ý đó cho họ.
      - en: That's exactly what I found.
        vi: Đó đúng là điều tôi nhận thấy.
        note_vi: Người nói ĐỒNG Ý và có chung ý kiến.
      - en: Which paragraph contains a reference to…?
        vi: Đoạn nào có nhắc đến…?
        note_vi: Câu lệnh dạng Matching information.
      - en: Her team concluded that…
        vi: Nhóm của bà ấy kết luận rằng…
        note_vi: "Tín hiệu của dạng Matching features: chú ý ai là người kết luận."
