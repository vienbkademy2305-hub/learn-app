  - type: dialogue
    title_vi: Chuẩn bị cho bài giảng Part 4
    lines:
      - speaker: A
        text: The lecture today is about public health policies. I found the handout.
        vi: Bài giảng hôm nay về chính sách y tế công cộng. Tớ tìm được tài liệu phát tay rồi.
      - speaker: B
        text: What are the main sections?
        vi: Các phần chính là gì?
      - speaker: A
        text: Background, a case study about a sugar tax, the results, and recommendations.
        vi: Bối cảnh, một nghiên cứu điển hình về thuế đường, kết quả, và khuyến nghị.
      - speaker: B
        text: OK. For the recommendations, I expect a lot of 'should be' sentences.
        vi: Được. Phần khuyến nghị chắc sẽ có nhiều câu 'should be'.
      - speaker: A
        text: Right, like 'the tax should be increased' or 'the money should be spent on schools'.
        vi: Đúng, kiểu 'nên tăng thuế' hay 'nên dùng tiền đó cho trường học'.
      - speaker: B
        text: And the gaps are all one word only, so we can't write 'public spending'.
        vi: Và các chỗ trống đều chỉ một từ, nên không viết được 'public spending'.
      - speaker: A
        text: Unless 'public' is already in the notes. Let's check each gap before the lecture starts.
        vi: Trừ khi chữ 'public' đã có sẵn trong ghi chú. Mình kiểm tra từng chỗ trống trước khi bài giảng bắt đầu nhé.
      - speaker: B
        text: Good idea. And let's write numbers as digits so that we don't make spelling mistakes.
        vi: Ý hay. Và mình viết số bằng chữ số để khỏi sai chính tả.
  - type: exercises
    items:
      - id: b43-x1
        bank_no: 18
        kind: completion
        instructions_vi: "Part 4: nghe bài giảng (nghe 1 lần như thi thật) và hoàn thành ghi chú. Viết MỘT TỪ cho mỗi chỗ trống. (Quốc gia và số liệu trong bài là giả định.)"
        max_words: 1
        audio_text: "Good afternoon. In today's lecture, I'd like to look at how governments use taxes to change people's behaviour, and I'll focus on one example: a tax on sugary drinks. First, some background. In many countries, the number of children who are overweight has risen sharply over the last thirty years. Doctors say that sugary drinks are one of the main causes. So several governments decided that these drinks should be taxed. Let's look at a case study. In one country, a sugar tax was introduced in 2018. The tax was paid by the companies that made the drinks, not directly by shoppers. And interestingly, the aim was not mainly to raise money. The main purpose was to make companies change their recipes. Now, the results. Within two years, most companies had reduced the amount of sugar in their drinks, so that they would pay less tax. Sales of sugary drinks fell by around ten per cent, while sales of water rose. However, the tax had one weakness: it did not include sweets or cakes, so some people simply bought more of those instead. Finally, the recommendations. Researchers suggest that the tax should be extended to other sugary foods, and that the money should be spent on sports facilities in schools. They also say that the tax must be explained clearly to the public, because many people thought it was unfair when it was first introduced."
        passage: |-
          TAXES THAT CHANGE BEHAVIOUR — THE SUGAR TAX
          Background
          • More children are (1) ___ than 30 years ago
          • Sugary drinks = one of the main (2) ___
          Case study
          • Tax introduced in 2018; paid by the (3) ___, not by shoppers
          • Main aim: to make drink makers change their (4) ___
          Results
          • Sugar in drinks reduced; sales fell by about (5) ___ %
          • Sales of (6) ___ increased
          • Weakness: did not include sweets or (7) ___
          Recommendations
          • Extend the tax to other sugary foods
          • Spend the money on (8) ___ facilities in schools
          • The tax must be explained clearly to the (9) ___
        questions:
          - q: (1)
            answer: overweight
          - q: (2)
            answer: causes
          - q: (3)
            answer: companies
            explain_vi: "'paid by the companies that made the drinks' — shoppers là bẫy."
          - q: (4)
            answer: recipes
            explain_vi: "'the aim was not mainly to raise money. The main purpose was to make companies change their recipes'."
          - q: (5)
            answer: "10"
            accept:
              - ten
          - q: (6)
            answer: water
          - q: (7)
            answer: cakes
          - q: (8)
            answer: sports
            accept:
              - sport
          - q: (9)
            answer: public
      - id: b43-x2
        bank_no: 18
        kind: completion
        instructions_vi: "Flowchart: nghe mô tả quy trình một chương trình trợ cấp và hoàn thành sơ đồ. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống."
        max_words: 1
        audio_text: Let me explain how the new solar panel subsidy works for families. First, the family fills in an application form on the city website. Then, an engineer visits the house to check whether the roof is suitable. Once this has been done, the family receives a letter telling them how much money they will get. The subsidy covers up to forty per cent of the cost. After that, the panels are installed by an approved company, and finally, the family must send a copy of the bill to the city office within thirty days. The money is then paid into their bank account.
        passage: |-
          SOLAR PANEL SUBSIDY — STEPS
          Family fills in an application form on the city (1) ___
                ↓
          An engineer checks whether the (2) ___ is suitable
                ↓
          Family receives a (3) ___ with the amount
          (subsidy covers up to (4) ___ % of the cost)
                ↓
          Panels are installed by an approved company
                ↓
          Family sends a copy of the (5) ___ within 30 days
                ↓
          Money is paid into the family's bank account
        questions:
          - q: (1)
            answer: website
          - q: (2)
            answer: roof
          - q: (3)
            answer: letter
          - q: (4)
            answer: "40"
            accept:
              - forty
          - q: (5)
            answer: bill
      - id: b43-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Chuyển sang bị động với động từ khuyết thiếu (bỏ tác nhân nếu không cần).
        questions:
          - q: The government should ban plastic bags. → Plastic bags ___
            answer: should be banned.
            accept:
              - should be banned by the government.
          - q: The police must enforce the new law. → The new law ___
            answer: must be enforced.
            accept:
              - must be enforced by the police.
          - q: We can reduce traffic in the city centre. → Traffic in the city centre ___
            answer: can be reduced.
          - q: The city will not raise taxes next year. → Taxes ___
            answer: will not be raised next year.
            accept:
              - won't be raised next year.
          - q: The government needs to spend more money on healthcare. → More money ___
            answer: needs to be spent on healthcare.
      - id: b43-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: Smoking should ___ in parks.
            options:
              - ban
              - be ban
              - be banned
              - banned
            answer: c
          - q: More money must be ___ on schools.
            options:
              - spend
              - spent
              - spending
              - spends
            answer: b
          - q: The new policy ___ implemented next year.
            options:
              - will
              - will be
              - will is
              - will being
            answer: b
          - q: These problems cannot ___ quickly.
            options:
              - solve
              - be solved
              - solved
              - be solving
            answer: b
          - q: "'Nghe thấy /ˈpɒl.ə.si/' — which word is it?"
            options:
              - police
              - policy
              - politics
              - polite
            answer: b
      - id: b43-x5
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: High ___ can make people leave the country.
            base: tax
            answer: taxation
          - q: The ___ of the new policy took two years.
            base: implement
            answer: implementation
          - q: Farmers receive government ___ to grow rice.
            base: subsidise
            answer: subsidies
          - q: The ___ of a new law is not enough; it must be enforced.
            base: introduce
            answer: introduction
          - q: Every ___ has the right to free education.
            base: citizenship
            answer: citizen
      - id: b43-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: subsidy
            right: money the government pays to help reduce the cost of something
          - left: welfare
            right: help given by the state to people who need it
          - left: enforce
            right: to make sure that people obey a law
          - left: budget
            right: the amount of money available to spend
          - left: scheme
            right: an official plan to help people
          - left: policy
            right: a plan of action agreed by a government
      - id: b43-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe đoạn cuối một bài giảng (độc thoại) và chọn đáp án đúng.
        audio_text: To sum up, the free bus scheme in our city has been a partial success. Bus use has increased by a third, and there are fewer cars in the centre during rush hour. However, the scheme is expensive. At the moment, it is paid for by the city budget, and this money could be used for schools or hospitals. My recommendation is that the buses should remain free for students and elderly people, but other passengers should pay a small fare. This would reduce the cost of the scheme by about half.
        questions:
          - q: How does the speaker describe the scheme?
            options:
              - a complete failure
              - a partial success
              - a total success
              - too early to judge
            answer: b
          - q: By how much has bus use increased?
            options:
              - a quarter
              - a third
              - half
              - double
            answer: b
          - q: What is the main problem with the scheme?
            options:
              - It is expensive.
              - Buses are late.
              - Nobody uses it.
              - It is unfair to students.
            answer: a
          - q: Who should continue to travel free?
            options:
              - everyone
              - students and elderly people
              - only children
              - workers
            answer: b
      - id: b43-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe hai người nói chuyện (hai giọng) rồi chọn T (đúng) hoặc F (sai). Chú ý câu bị động và modal.
        audio_text: |-
          Man: Have you heard about the new rule on plastic bags?
          Woman: Yes, it will be introduced next month. Supermarkets won't be allowed to give bags for free.
          Man: How much will we have to pay?
          Woman: Two thousand dong for each bag.
          Man: What about small markets?
          Woman: They won't be included at first, but the rule may be extended to them next year.
          Man: And what will happen to the money?
          Woman: The city says it should be spent on cleaning the rivers.
        questions:
          - q: The rule has already been introduced.
            answer: F
          - q: Supermarkets can no longer give plastic bags for free.
            answer: T
          - q: Small markets must follow the rule from next month.
            answer: F
          - q: The money should be used to clean rivers.
            answer: T
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 150–180 từ: 'Chính phủ Việt Nam nên làm gì để giảm ùn tắc giao thông ở các thành phố lớn?' Đưa ra 3 đề xuất, mỗi đề xuất có lý do. Dùng ít nhất 4 câu bị động với modal (should be / must be / could be / needs to be + V3) và 6 từ của buổi này. Tự kiểm tra: không thiếu 'be', sau be là V3."
    prompt_en: What should the government do to reduce traffic congestion in big cities?
    words:
      min: 150
      max: 180
    minutes: 30
