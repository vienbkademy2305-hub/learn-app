  - type: skill
    skill: listening
    title_vi: "Listening Part 4 — bài giảng học thuật: ghi chú, flowchart, diagram"
    intro_vi: "Part 4 là phần cuối và khó nhất: một bài giảng khoảng 5 phút về một chủ đề học thuật (chính sách, khoa học, lịch sử), KHÔNG có khoảng nghỉ, thường 10 câu điền ghi chú liền nhau. Buổi 39 đã luyện cách theo dõi bài nghe dài. Buổi này thêm hai dạng hay gặp ở Part 4 và Part 3: FLOWCHART (sơ đồ các bước của một quy trình) và DIAGRAM (sơ đồ có nhãn các bộ phận). Cả hai đều theo thứ tự bài nói và đòi hỏi đoán trước loại từ."
    steps:
      - title_vi: Đọc tiêu đề + cấu trúc bài giảng
        text_vi: "Tiêu đề các phần (Background / Case study / Results / Recommendations) là 'bản đồ'. Part 4 hay đi: giới thiệu → ví dụ cụ thể → kết quả → đề xuất."
      - title_vi: "Flowchart: xác định trình tự"
        text_vi: "Đọc các ô theo mũi tên, gạch động từ trong mỗi ô. Chỗ trống giữa hai ô có sẵn → đáp án là bước nằm GIỮA hai bước đó. Nghe từ chỉ thứ tự: first, then, after that, once …, finally."
      - title_vi: "Diagram: xác định các bộ phận đã có tên"
        text_vi: "Nhìn phần đã có nhãn làm mốc. Người nói thường mô tả theo hướng: from the top / at the bottom / inside / next to. Đoán nhãn là danh từ."
      - title_vi: Đoán loại từ cho từng chỗ trống
        text_vi: "Như Buổi 23: sau a/the → danh từ; sau to → động từ; giữa the và danh từ → tính từ. Kiểm tra giới hạn từ (thường ONE WORD ONLY ở Part 4)."
      - title_vi: Nghe câu đề xuất bị động
        text_vi: Phần Recommendations thường dùng 'X should be…', 'Y must be…', 'Z could be…' — đáp án hay là danh từ chủ ngữ hoặc V3.
    tips:
      - "Part 4 ONE WORD ONLY: nếu bạn nghe cụm 2 từ, thường một từ đã có sẵn trong ghi chú."
      - "Chính tả học thuật hay sai: government, environment, necessary, recommend, efficient."
      - Nếu lạc ở giữa bài, nhìn tiêu đề phần tiếp theo và đợi tín hiệu 'Moving on to…'.
    traps:
      - trap_vi: Điền danh từ số ít trong khi bài nói số nhiều (và ngược lại).
        fix_vi: "Đọc lại câu ghi chú với đáp án: có 'a' trước không? động từ sau có -s không?"
      - trap_vi: Nhầm policy / police / politics khi nghe.
        fix_vi: "Trọng âm: POL-i-cy, po-LICE, POL-i-tics. Nghe cả câu để đoán nghĩa."
      - trap_vi: "Flowchart: điền bước nghe được đầu tiên dù chưa đúng vị trí."
        fix_vi: Luôn kiểm tra bước trước và sau chỗ trống.
    phrases:
      - en: Today I'm going to talk about …
        vi: Hôm nay tôi sẽ nói về …
        note_vi: Mở bài giảng — nghe chủ đề.
      - en: Let's look at a case study.
        vi: Hãy xem một nghiên cứu điển hình.
        note_vi: Chuyển sang ví dụ cụ thể.
      - en: Once this has been done, …
        vi: Sau khi việc này đã được thực hiện, …
        note_vi: Tín hiệu bước tiếp theo (flowchart).
      - en: It is recommended that …
        vi: Người ta khuyến nghị rằng …
      - en: … should be introduced / must be enforced.
        vi: … nên được áp dụng / phải được thực thi.
    demo:
      title_vi: "Làm mẫu: flowchart một quy trình"
      text_en: |-
        Flowchart: HOW A NEW TAX IS INTRODUCED
        Government proposes the tax → experts study its likely (1) ______ → public is asked for opinions → tax is approved → shops are given (2) ______ months to prepare

        Lecture: "First, the government proposes the tax. Before anything else happens, a team of experts studies its likely effects on prices and on people's health. Once this has been done, the public is asked for their opinions, usually online. If the tax is approved, shops are given six months to prepare, so that they can change their prices."
      notes:
        - label: (1) → effects
          text_vi: Sau 'its likely' → danh từ. 'studies its likely effects' — một từ.
        - label: (2) → six
          text_vi: Sau 'given' và trước 'months' → số. Nghe 'six months'.
        - label: Once this has been done
          text_vi: Tín hiệu chuyển sang ô tiếp theo của flowchart.
