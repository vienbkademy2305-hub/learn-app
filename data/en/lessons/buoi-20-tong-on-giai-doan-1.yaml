  - type: dialogue
    title_vi: Gặp lại bạn cũ
    lines:
      - speaker: A
        text: Minh! Long time no see! How are you?
        vi: Minh! Lâu lắm không gặp! Cậu khỏe không?
      - speaker: B
        text: Lan! I'm fine, thanks. What do you do now?
        vi: Lan! Tớ khỏe, cảm ơn. Giờ cậu làm gì?
      - speaker: A
        text: I work as an accountant in Da Nang. What about you?
        vi: Tớ làm kế toán ở Đà Nẵng. Còn cậu?
      - speaker: B
        text: I'm a teacher. At the moment I'm teaching English at a high school.
        vi: Tớ là giáo viên. Hiện tớ đang dạy tiếng Anh ở một trường cấp ba.
      - speaker: A
        text: Great! Did you go to the class party last month?
        vi: Hay quá! Tháng trước cậu có đi họp lớp không?
      - speaker: B
        text: No, I didn't. I was working that day. Are you going to come to the next one?
        vi: Không, hôm đó tớ phải làm. Lần tới cậu có định đi không?
      - speaker: A
        text: Yes, I am. I'm really excited about it.
        vi: Có chứ. Tớ háo hức lắm.
      - speaker: B
        text: Me too. I think it will be the best party of the year!
        vi: Tớ cũng vậy. Chắc đó sẽ là bữa tiệc vui nhất năm!
  - type: exercises
    items:
      - id: b20-x1
        bank_no: 6
        kind: verb-form
        instructions_vi: Chia động từ trong ngoặc ở thì đúng.
        questions:
          - q: My brother (work) ___ in a bank. He loves his job.
            answer: works
          - q: Look! It (rain) ___.
            answer: is raining
          - q: We (visit) ___ Hoi An last summer.
            answer: visited
          - q: I (watch) ___ TV when you called me.
            answer: was watching
          - q: She (not / go) ___ to work yesterday because she was ill.
            answer: did not go
            accept:
              - didn't go
          - q: I've bought the tickets. We (travel) ___ to Sapa next week.
            answer: are going to travel
            accept:
              - "'re going to travel"
          - q: "\"It's cold.\" \"OK, I (close) ___ the window.\""
            answer: will close
            accept:
              - "'ll close"
            explain_vi: Quyết định ngay lúc nói → will.
          - q: This bridge (build) ___ in 1902.
            answer: was built
          - q: How often (you / go) ___ to the gym?
            answer: do you go
          - q: Coffee (grow) ___ in the Central Highlands.
            answer: is grown
      - id: b20-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: My sister is ___ than me.
            options:
              - more tall
              - taller
              - tallest
              - the tallest
            answer: b
          - q: There isn't ___ milk in the fridge.
            options:
              - some
              - many
              - any
              - a
            answer: c
          - q: I go to work ___ motorbike.
            options:
              - on
              - in
              - by
              - with
            answer: c
          - q: I enjoy ___ to music.
            options:
              - listen
              - to listen
              - listening
              - listened
            answer: c
          - q: The film was really ___. I almost fell asleep.
            options:
              - bored
              - boring
              - bore
              - bores
            answer: b
          - q: She is ___ honest person.
            options:
              - a
              - an
              - the
              - –
            answer: b
      - id: b20-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn dưới đây có 6 lỗi thường gặp của người Việt. Tìm và sửa.
        text: My name is Hoa and i am from Hai Phong. I work in hospital. My husband is teacher and he teach maths. We have two child. Last weekend we go to the beach. I like the beach, it is very relaxing.
        errors:
          - wrong: and i am
            right: and I am
            why: Đại từ I luôn viết hoa.
          - wrong: work in hospital
            right: work in a hospital
            why: Danh từ đếm được số ít cần a.
          - wrong: is teacher and he teach
            right: is a teacher and he teaches
            why: Nghề nghiệp cần a; ngôi 3 số ít thêm -es.
          - wrong: two child
            right: two children
            why: "Số nhiều bất quy tắc: child → children."
          - wrong: we go to the beach
            right: we went to the beach
            why: Last weekend → quá khứ đơn.
          - wrong: the beach, it is
            right: the beach. It is
            why: "Comma splice: tách thành hai câu hoặc dùng because."
      - id: b20-x4
        bank_no: 13
        kind: tfng
        instructions_vi: Đọc đoạn văn rồi chọn T (đúng), F (sai) hoặc NG (không được nhắc đến).
        passage: Thu is twenty-eight years old and she works as a nurse in Can Tho. She usually starts work at seven in the morning, but this month she is working at night because a colleague is ill. Last year Thu went to Singapore for a training course. The course was tiring, but she was proud of her new skills. Her younger brother, Khoa, is a university student in Ho Chi Minh City. He is going to graduate next year, and he wants to work abroad. Their parents own a small restaurant which was opened in 1998.
        questions:
          - q: Thu always works at night.
            answer: F
            explain_vi: Thường làm buổi sáng; chỉ tháng này làm đêm.
          - q: Thu studied in Singapore last year.
            answer: T
            explain_vi: Đi học khóa đào tạo ở Singapore.
          - q: Thu enjoyed the food in Singapore.
            answer: NG
          - q: Khoa is older than Thu.
            answer: F
            explain_vi: younger brother = em trai.
          - q: Thu wants to work abroad.
            answer: F
            explain_vi: Người muốn ra nước ngoài là Khoa, không phải Thu. Đọc kỹ chủ thể.
          - q: The restaurant opened more than twenty years ago.
            answer: T
      - id: b20-x5
        bank_no: 23
        kind: dictation
        instructions_vi: Nghe và chép lại chính xác (nghe tối đa 3 lần). Chú ý đuôi -s và -ed.
        text: Last Saturday my sister and I visited our grandparents. My grandmother cooked a delicious meal, and my grandfather showed us his old photos.
      - id: b20-x6
        bank_no: 29
        kind: speaking-part1
        instructions_vi: Trả lời bằng tiếng Anh, mỗi câu 2–3 câu (không trả lời một từ). Ghi âm và nghe lại.
        questions:
          - q: Do you work or are you a student?
          - q: What do you usually do at the weekend?
          - q: What did you do last weekend?
          - q: What are you going to do next summer?
        sample: I work as an accountant in a small company. I usually go to the office by motorbike, and I really enjoy working with my colleagues.
      - id: b20-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Man: Hi Lan! How are you? What are you doing these days?
          Woman: I'm working at a bank. I started in January.
          Man: Do you like it?
          Woman: Yes, but I usually finish late. What about you?
          Man: I'm going to study in Singapore next year, so I'm saving money now.
          Woman: That's exciting!
        questions:
          - { q: Where does Lan work?, options: [ at a school, at a bank, at a hotel, at a hospital ], answer: b }
          - { q: When did she start?, options: [ in January, in June, last week, two years ago ], answer: a }
          - { q: What is the man going to do next year?, options: [ work at a bank, study in Singapore, travel to Japan, buy a car ], answer: b }
      - id: b20-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: My hometown is famous for its beaches. When I was a child, I swam in the sea every summer. Now I live in Hanoi and I work as a nurse. I'm going to visit my parents next month, and I'm very excited.
        questions:
          - { q: The speaker's hometown is famous for its mountains., answer: F }
          - { q: She swam in the sea every summer as a child., answer: T }
          - { q: Now she works as a teacher., answer: F }
          - { q: She is going to visit her parents next month., answer: T }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 100–120 từ về cuộc sống của bạn: năm ngoái bạn đã làm gì, hiện tại bạn đang làm gì, và năm tới bạn định làm gì. Dùng ít nhất 4 thì khác nhau. Tự rà 5 lỗi thường gặp (to be, -s, mạo từ, số nhiều, dấu phẩy) trước khi nộp."
    prompt_en: "Write about your life: last year, now, and your plans for next year."
    words:
      min: 100
      max: 120
    minutes: 25
