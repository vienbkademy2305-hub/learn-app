  - type: skill
    skill: writing
    title_vi: Collocation học thuật và paraphrase đề bài
    intro_vi: "Tiêu chí Lexical Resource band 6.5 yêu cầu dùng 'less common lexical items with some awareness of style and collocation'. Nói đơn giản: dùng CỤM TỪ đi đúng với nhau (commit an offence, tackle the root causes) thay vì từ đơn lẻ, và paraphrase được đề bài mà không chép lại. Hai lỗi kéo điểm nhiều nhất: collocation sai (do a crime, make a crime) và từ đồng nghĩa 'tra từ điển' không hợp ngữ cảnh."
    steps:
      - title_vi: Học từ theo CỤM, không theo từ đơn
        text_vi: "Mỗi từ mới ghi kèm động từ/tính từ đi cùng: offence → commit / serious / first. Tab Từ vựng có sẵn mục collocations — học cả cụm."
      - title_vi: "Paraphrase đề: 3 cách an toàn"
        text_vi: "(1) Danh từ hóa: crime is rising → the rise in crime. (2) Chủ động ↔ bị động: The government should punish… → Offenders should be punished… (3) Đồng nghĩa ĐÚNG NGỮ CẢNH: young people → teenagers / juveniles."
      - title_vi: Kiểm tra từ đồng nghĩa trước khi dùng
        text_vi: Không chắc thì giữ từ gốc. 'crime' → 'criminality' nghe học thuật nhưng thường không tự nhiên trong câu của bạn.
      - title_vi: Xoay vòng trong bài
        text_vi: "Lần 1: crime; lần 2: criminal activity; lần 3: offences; lần 4: it/this problem. Không cần đổi mọi lần."
    tips:
      - "Collocation hay gặp chủ đề tội phạm: commit an offence, serve a sentence, crack down on, act as a deterrent, tackle the root causes, reoffend."
      - Paraphrase mở bài chỉ cần đổi 2–3 cụm chính, không cần đổi mọi từ.
      - Dùng Oxford Collocations Dictionary (bản online) khi tự học để kiểm tra cụm từ.
    traps:
      - trap_vi: do / make a crime.
        fix_vi: commit a crime / an offence.
      - trap_vi: "Đổi từ đồng nghĩa sai sắc thái: 'kids' trong Writing, 'baby criminals'."
        fix_vi: young offenders / juveniles.
      - trap_vi: "Giới từ sai sau danh từ hóa: a reduction of, an increase of."
        fix_vi: reduction/increase IN.
    phrases:
      - en: tackle the root causes of crime
        vi: giải quyết nguyên nhân gốc rễ của tội phạm
      - en: act as an effective deterrent
        vi: có tác dụng răn đe hiệu quả
      - en: reduce the likelihood of reoffending
        vi: giảm khả năng tái phạm
      - en: focus on rehabilitation rather than punishment
        vi: tập trung vào cải tạo hơn là trừng phạt
      - en: There has been a significant rise in …
        vi: Đã có sự gia tăng đáng kể về …
    demo:
      title_vi: "Làm mẫu: paraphrase một đề Task 2"
      text_en: |-
        Question: Crime rates among young people are increasing in many countries. Some people think that longer prison sentences are the best solution.

        Paraphrase 1 (nominalisation): The rise in juvenile crime in many parts of the world has led some to argue that longer sentences are the most effective response.

        Paraphrase 2 (passive + collocation): In many countries, more offences are being committed by teenagers, and it is often argued that harsher punishments would act as a deterrent.
      notes:
        - label: Crime rates … are increasing → the rise in juvenile crime
          text_vi: Danh từ hóa (increase → rise) + từ học thuật (juvenile).
        - label: Some people think → has led some to argue
          text_vi: Đổi cấu trúc câu, không chỉ đổi từ.
        - label: more offences are being committed by teenagers
          text_vi: Bị động tiếp diễn + collocation commit an offence.
        - label: act as a deterrent
          text_vi: Collocation thay cho 'stop people doing crime'.
