  - type: dialogue
    title_vi: Bàn luận về tội phạm vị thành niên
    lines:
      - speaker: A
        text: Did you see the report? There's been a sharp increase in juvenile crime in our city.
        vi: Cậu xem báo cáo chưa? Tội phạm vị thành niên ở thành phố mình tăng mạnh.
      - speaker: B
        text: Yes. Mostly petty crime, like shoplifting and stealing phones.
        vi: Rồi. Chủ yếu là tội vặt, như ăn cắp ở cửa hàng và trộm điện thoại.
      - speaker: A
        text: Some people want longer sentences to act as a deterrent.
        vi: Một số người muốn án tù dài hơn để răn đe.
      - speaker: B
        text: I'm not convinced. Young people who go to prison often reoffend when they come out.
        vi: Tớ không tin lắm. Người trẻ đi tù thường tái phạm khi ra tù.
      - speaker: A
        text: So what's the alternative?
        vi: Vậy phương án khác là gì?
      - speaker: B
        text: Rehabilitation. And we need to tackle the root causes, like poverty and dropping out of school.
        vi: Cải tạo. Và cần giải quyết nguyên nhân gốc rễ, như nghèo đói và bỏ học.
      - speaker: A
        text: But the police should still crack down on serious offences.
        vi: Nhưng cảnh sát vẫn nên trấn áp mạnh các tội nghiêm trọng.
      - speaker: B
        text: Of course. Prevention and law enforcement should work together.
        vi: Tất nhiên. Phòng ngừa và thực thi pháp luật phải đi cùng nhau.
  - type: exercises
    items:
      - id: b50-x1
        bank_no: 3
        kind: collocation
        instructions_vi: Ghép để tạo collocation đúng.
        pairs:
          - left: commit
            right: a serious offence
          - left: serve
            right: a prison sentence
          - left: tackle
            right: the root causes of crime
          - left: act as
            right: a deterrent
          - left: crack down
            right: on drink-driving
          - left: be less likely
            right: to reoffend
      - id: b50-x2
        bank_no: 5
        kind: paraphrase
        instructions_vi: Viết lại câu bằng cách danh từ hóa từ in hoa, bắt đầu bằng từ cho sẵn.
        questions:
          - q: Petty crime has REDUCED significantly. → There has been a significant ___
            answer: reduction in petty crime.
            accept:
              - reduction in petty crime
          - q: Cybercrime has INCREASED sharply. → There has been a sharp ___
            answer: increase in cybercrime.
            accept:
              - increase in cybercrime
              - rise in cybercrime.
          - q: Many people are POOR, and this causes crime. → ___
            answer: Poverty causes crime.
            accept:
              - Poverty is a cause of crime.
              - Poverty is one of the root causes of crime.
          - q: We should PREVENT crime rather than punish it. → The ___
            answer: prevention of crime is better than punishment.
            accept:
              - prevention of crime is better than punishing it.
              - prevention of crime should come before punishment.
      - id: b50-x3
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: He ___ a serious offence and was sent to prison.
            options:
              - did
              - made
              - committed
              - had
            answer: c
          - q: There has been a sharp increase ___ violent crime.
            options:
              - of
              - in
              - on
              - for
            answer: b
          - q: Poverty is one of the root causes ___ crime.
            options:
              - for
              - to
              - of
              - in
            answer: c
          - q: Harsh punishments do not always act ___ a deterrent.
            options:
              - like
              - as
              - for
              - to
            answer: b
          - q: Which is the best paraphrase of 'Young people are committing more crimes'?
            options:
              - Kids are doing more bad things.
              - There has been a rise in juvenile crime.
              - Young people are criminality.
              - Crimes are young.
            answer: b
      - id: b50-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 5 lỗi collocation và danh từ hóa. Sửa trực tiếp.
        text: In recent years, there has been an increase of juvenile crime. Many teenagers do crimes because they are poor. Poor is a root cause for this problem. Longer sentences may act like a deterrent, but they do not reduce the likelihood of reoffending.
        errors:
          - wrong: an increase of juvenile crime
            right: an increase in juvenile crime
            why: an increase IN.
          - wrong: teenagers do crimes
            right: teenagers commit crimes
            why: commit a crime (không dùng do).
          - wrong: Poor is a root cause
            right: Poverty is a root cause
            why: "Chủ ngữ cần danh từ: poverty."
          - wrong: root cause for this problem
            right: root cause of this problem
            why: the cause OF.
          - wrong: act like a deterrent
            right: act as a deterrent
            why: act AS a deterrent.
      - id: b50-x5
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: The ___ of young offenders takes time.
            base: rehabilitate
            answer: rehabilitation
          - q: Crime ___ programmes are cheaper than prisons.
            base: prevent
            answer: prevention
          - q: There has been a sharp ___ in cybercrime.
            base: rise
            answer: rise
            accept:
              - increase
          - q: Long sentences are not always an effective ___.
            base: deter
            answer: deterrent
          - q: Stricter law ___ could reduce drink-driving.
            base: enforce
            answer: enforcement
      - id: b50-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: reoffend
            right: to commit a crime again
          - left: rehabilitation
            right: helping someone return to a normal life after prison
          - left: petty crime
            right: crime that is not very serious
          - left: surveillance
            right: watching people, often with cameras
          - left: deterrent
            right: something that makes people decide not to do something
          - left: root cause
            right: the most basic reason for a problem
      - id: b50-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe đoạn phỏng vấn (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Interviewer: Your programme works with young offenders. What exactly do you do?
          Director: We offer education and job training to teenagers who have committed petty crimes. Instead of prison, they spend six months with us.
          Interviewer: Does it work?
          Director: The figures are encouraging. Only about one in five of our young people reoffend, compared with more than half of those who go to prison.
          Interviewer: Some people say it's too soft.
          Director: I understand that. But prison doesn't tackle the root causes. Most of these teenagers have left school early and come from very poor families.
        questions:
          - q: Who does the programme work with?
            options:
              - victims of crime
              - young people who committed petty crimes
              - prison officers
              - violent criminals
            answer: b
          - q: How long do the teenagers spend on the programme?
            options:
              - three months
              - six months
              - one year
              - two years
            answer: b
          - q: What proportion of the programme's young people reoffend?
            options:
              - about 20%
              - about 50%
              - more than half
              - almost none
            answer: a
          - q: According to the director, what are the root causes?
            options:
              - bad friends and video games
              - leaving school early and poverty
              - weak laws
              - a lack of police
            answer: b
      - id: b50-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe bản tin rồi chọn T (đúng) hoặc F (sai). Chú ý danh từ hóa trong bài nghe.
        audio_text: According to new police figures, there has been a twelve per cent reduction in burglaries in the city over the past year. However, the same report shows a sharp increase in cybercrime, especially online shopping fraud. The police believe the fall in burglaries is the result of better street lighting and more neighbourhood patrols.
        questions:
          - q: The number of burglaries has fallen.
            answer: T
          - q: Cybercrime has also decreased.
            answer: F
          - q: Online shopping fraud is a problem mentioned in the report.
            answer: T
          - q: The police think the fall in burglaries is due to longer prison sentences.
            answer: F
  - type: homework
    kind: paragraph
    prompt_vi: "Bài 1 (15 phút): viết 2 cách paraphrase khác nhau cho mỗi đề dưới đây (chỉ câu mở bài). Bài 2 (25 phút): viết một đoạn thân bài 150–180 từ trả lời đề thứ hai, dùng ít nhất 6 collocation và 3 danh từ hóa của buổi này. Không dùng 'do a crime', 'reduction of'."
    prompt_en: 1. The number of crimes committed online is growing rapidly. 2. Some people believe that the best way to reduce crime among young people is to educate them rather than punish them. To what extent do you agree?
