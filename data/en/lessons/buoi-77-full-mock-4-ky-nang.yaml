    prompt_en: |-
      TASK 1 (20 minutes, at least 150 words)
      The bar chart shows the percentage of people in one country who used four types of transport to travel to work in 2005 and 2025.
      Car: 2005: 52% · 2025: 41%
      Bus: 2005: 23% · 2025: 19%
      Bicycle: 2005: 6% · 2025: 15%
      Train: 2005: 12% · 2025: 18%
      (Other: 2005: 7% · 2025: 7%)
      Summarise the information by selecting and reporting the main features, and make comparisons where relevant.

      TASK 2 (40 minutes, at least 250 words)
      Some people believe that university education should be free for all students, while others think that students should pay for their own studies.
      Discuss both views and give your own opinion.
      Give reasons for your answer and include any relevant examples from your own knowledge or experience.
