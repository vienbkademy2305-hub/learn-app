      - id: b77-x8
        bank_no: 13
        kind: tfng
        instructions_vi: READING PASSAGE 1 · Câu 1–7. Bắt đầu 60 phút Reading. Chọn TRUE / FALSE / NOT GIVEN.
        passage: |-
          THE SECRET OF ROMAN CONCRETE

          Many Roman structures have survived for two thousand years. The Pantheon in Rome, completed around 125 CE, still has the largest unreinforced concrete dome in the world. Harbour walls built by the Romans have stood in sea water for centuries, while modern concrete in similar conditions often begins to crack within decades. For a long time, engineers wondered why.

          Roman concrete was made from lime, volcanic ash and pieces of rock. The volcanic ash, much of it from the area around the Bay of Naples, reacted with the lime to create an extremely strong material. Roman writers described the recipe, but their descriptions were incomplete, and modern attempts to copy it were not very successful.

          A key discovery came from studying the small white lumps of lime that are found throughout Roman concrete. These had long been seen as a sign of poor mixing or low-quality materials. In 2023, however, a team of researchers suggested that the lumps were deliberate. They argued that the Romans mixed in 'quicklime', a very reactive form of lime, which heated the mixture and left behind these lumps.

          The lumps, the team believe, give the concrete the ability to repair itself. When a small crack forms and water gets in, the water dissolves some of the lime from the lumps. This then reacts to form a new mineral that fills the crack. To test the idea, the researchers made concrete using the Roman method, deliberately cracked it, and ran water through it. Within two weeks, the cracks had closed, while cracks in a sample made without quicklime did not.

          Harbour concrete has a further secret. Sea water, which damages modern concrete, appears to have strengthened Roman harbour walls by encouraging the growth of rare minerals inside them.

          Some companies are now experimenting with these ideas. If self-repairing concrete could be produced on a large scale, buildings might last longer and need less maintenance, which would reduce the large carbon emissions produced by making new cement.
        questions:
          - q: 1 · The Pantheon's dome contains steel reinforcement.
            answer: F
            explain_vi: "'unreinforced' = không có cốt thép."
          - q: 2 · Most of the volcanic ash came from Greece.
            answer: F
            explain_vi: "'much of it from the area around the Bay of Naples' (Ý)."
          - q: 3 · Roman writers left complete instructions for making concrete.
            answer: F
          - q: 4 · The white lumps were once thought to show that the concrete was badly made.
            answer: T
          - q: 5 · The 2023 research team was based in Italy.
            answer: NG
          - q: 6 · In the experiment, the cracks closed within two weeks.
            answer: T
          - q: 7 · Self-repairing concrete is already used in most new buildings.
            answer: F
            explain_vi: Mới 'experimenting'; 'If … could be produced on a large scale' → chưa phổ biến. Bài nói ngược với 'already used in most'.
