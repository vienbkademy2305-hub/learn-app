      - id: b77-x13
        bank_no: 13
        kind: ynng
        instructions_vi: READING PASSAGE 3 · Câu 27–32. Câu nhận định có khớp với QUAN ĐIỂM của tác giả không? Chọn YES / NO / NOT GIVEN.
        passage: |-
          CAN WE TRUST WHAT WE REMEMBER?

          A  Most of us think of memory as a kind of recording: an event happens, it is stored, and later we play it back. Decades of research suggest that this picture is wrong. Memories are rebuilt each time we recall them, and in the process they can change — sometimes a great deal — without our noticing. I find this one of the most unsettling discoveries in psychology.

          B  In a classic series of experiments, participants watched a film of a car accident and were then asked how fast the cars were going when they 'hit' or 'smashed into' each other. Those who heard the word 'smashed' gave higher estimates of speed, and a week later they were more likely to remember seeing broken glass, although there had been none. A single word, in other words, was enough to add a detail to their memory.

          C  Later studies went further. By using a mixture of true family stories and one invented event, researchers persuaded a significant minority of participants that they had once been lost in a shopping centre as a child. Some described the imaginary event in rich detail. These participants were not lying; they genuinely believed what they remembered.

          D  The consequences are most serious in courts of law. Eyewitness evidence is extremely persuasive to juries, yet mistaken identification has played a part in a large proportion of the convictions later overturned by DNA evidence in the United States. Confidence is a poor guide: a witness who is completely certain may still be wrong, especially if they were repeatedly questioned or shown the suspect's photograph before the identity parade.

          E  None of this means that memory is generally unreliable. For the everyday purposes of life — remembering where we live, who our friends are, what we did yesterday — it works remarkably well. The problem is that we tend to trust a vivid memory more than it deserves. A memory can feel clear and detailed precisely because we have recalled and rebuilt it many times.

          F  Some practical lessons follow. Police forces in several countries have changed how they interview witnesses, avoiding leading questions and recording a witness's confidence at the first identification, when it is most meaningful. For the rest of us, a little humility seems appropriate. When two people remember the same event differently, it is quite possible that neither is lying — and that neither is entirely right.
        questions:
          - q: 27 · Memory works like a recording that we play back.
            answer: N
          - q: 28 · The writer finds the idea that memories change disturbing.
            answer: Y
            explain_vi: "'one of the most unsettling discoveries' — unsettling = disturbing."
          - q: 29 · The participants in the shopping-centre study were deliberately lying.
            answer: N
            explain_vi: "'These participants were not lying'."
          - q: 30 · Juries should not be allowed to hear eyewitness evidence.
            answer: NG
            explain_vi: Tác giả nói về rủi ro nhưng không đề xuất cấm.
          - q: 31 · Human memory is generally unreliable in daily life.
            answer: N
          - q: 32 · Changes to police interviews have reduced the number of wrongful convictions.
            answer: NG
            explain_vi: Bài chỉ nói cách phỏng vấn đã thay đổi, không nói kết quả.
