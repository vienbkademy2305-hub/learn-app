        max_words: 1
        audio_text: "Today we're looking at a substance so common that we rarely think about it: salt. Yet for most of human history, salt was extremely valuable. The main reason was preservation. Before refrigerators, salt was one of the only ways to keep meat and fish from going bad, which made it essential for long journeys and for surviving the winter. Salt was produced in two main ways. Near the coast, sea water was left in shallow pools so that the sun could evaporate it. Inland, salt was mined from underground deposits, or salty water from springs was boiled over fires, which required huge amounts of wood. Because salt was so important, it was often controlled and taxed by governments. In China, a state monopoly on salt provided a large share of government income for more than two thousand years. In France, a hated salt tax called the gabelle was one of the complaints that led to the Revolution. And in India in 1930, Gandhi led a march of nearly four hundred kilometres to the sea to make salt, in protest against British salt laws. Salt also left its mark on language. Roman soldiers were sometimes given money to buy salt, and some historians connect this with the word salary, although the evidence for this is weaker than many people assume. Today, salt is cheap, and the main concern is health. Most people eat far more than they need, mostly from processed food rather than from the salt they add themselves. High salt intake is linked to high blood pressure, and several countries have persuaded manufacturers to gradually reduce the salt in products such as bread, so slowly that customers don't notice the difference."
