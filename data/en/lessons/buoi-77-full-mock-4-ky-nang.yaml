      - id: b77-x17
        bank_no: 30
        kind: speaking-part2
        instructions_vi: SPEAKING PART 2. Chuẩn bị 1 phút, nói 2 phút.
        cue_card:
          topic: Describe a memorable event you attended with a group of people.
          points:
            - what the event was
            - who you went with
            - what happened
            - and explain why it was memorable
        sample: I'd like to talk about the lantern festival in Hội An, which I went to with five colleagues after a work conference two years ago. None of us had been there during the full moon before, so we didn't know what to expect. In the evening, the electric lights in the old town were switched off, and the streets were lit only by hundreds of silk lanterns. We hired a small boat, and the boatman gave each of us a paper lantern with a candle inside to put on the river. What made it memorable was the atmosphere. Usually my colleagues and I only talk about deadlines, but that night we talked about our families and our plans, and it felt like we really got to know each other. Since then, we've worked together much better, and we still have a photo of that evening on the office wall.
      - id: b77-x18
        bank_no: 31
        kind: speaking-part3
        instructions_vi: SPEAKING PART 3. Mỗi câu 30–45 giây.
        questions:
          - q: Why do people enjoy attending events in large groups?
          - q: How have traditional festivals changed in recent years?
          - q: Do you think tourism helps or harms local festivals?
          - q: Should governments spend public money on festivals and celebrations?
        sample: I think it does both. On the positive side, tourism brings money that helps local communities keep their traditions alive — the lantern makers in Hội An, for example, depend heavily on visitors. Having said that, when a festival becomes mainly a show for tourists, local people sometimes stop taking part, and it can lose its original meaning. So on balance, I'd say tourism helps as long as local residents are still involved in organising it.
