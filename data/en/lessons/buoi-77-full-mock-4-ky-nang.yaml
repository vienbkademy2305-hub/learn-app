# Buổi 77 — Mock test đầy đủ 4 kỹ năng · Mô phỏng ngày thi thật (khoảng 3 giờ). Tự soạn theo lo-trinh-ielts-6.5.md. BẢN NHÁP chờ duyệt.
slug: buoi-77-full-mock-4-ky-nang
number: 77
stage: 4
title_vi: Mock test đầy đủ 4 kỹ năng · Mô phỏng ngày thi thật (khoảng 3 giờ)
focus:
  grammar: Không học điểm mới
  skill: "Full IELTS Academic: Listening 30' → Reading 60' → Writing 60' → Speaking 11–14', liên tục như ngày thi"
target_band: 6.0-6.5
source: editorial
status: draft
steps:
  - type: skill
    skill: listening
    title_vi: "Ngày thi thử: bốn kỹ năng, một buổi, đúng thứ tự"
    intro_vi: "Ngày thi thật, Listening, Reading và Writing làm liền nhau khoảng 2 giờ 40 phút, không nghỉ giữa các phần. Speaking có thể cùng ngày hoặc cách vài ngày. Buổi này mô phỏng đúng như vậy để bạn biết sức tập trung của mình giữ được đến đâu. Làm theo thứ tự: Listening (Bài tập 1–7) → Reading (Bài tập 8–15) → Writing (phần Về nhà) → Speaking (Bài tập 16–18). Không xem đáp án cho tới khi xong cả Writing. Buổi 78 sẽ chữa chi tiết đề này."
    steps:
      - title_vi: Chuẩn bị (10 phút trước khi bắt đầu)
        text_vi: Ăn nhẹ, uống nước, đi vệ sinh — thi thật không được rời phòng giữa Listening và Writing. Đặt tờ ghi 5 lỗi cá nhân (Buổi 76) và các 'luật' (Buổi 75) cạnh bàn, đọc một lần rồi úp xuống.
      - title_vi: Listening 30 phút — nghe một lần
        text_vi: Bấm nghe mỗi phần một lần duy nhất. Sau Part 4, dành 2 phút soát chính tả và -s (thi máy tính không có 10 phút chép đáp án).
      - title_vi: Reading 60 phút — mốc 18 / 38 / 60
        text_vi: "Xong bài 1 trước phút 18, bài 2 trước phút 38. Câu kẹt quá 90 giây: đoán, đánh dấu, đi tiếp."
      - title_vi: Writing 60 phút — Task 1 tối đa 20 phút
        text_vi: Làm ngay sau Reading, không nghỉ. Mệt là bình thường; dàn ý 5 phút cho Task 2 giúp bạn không bị 'trôi' khi mệt.
      - title_vi: Speaking — nghỉ 15 phút rồi làm
        text_vi: Ghi âm đủ 3 Part. Sau đó mới chấm Listening/Reading, quy đổi band, tự chấm Writing và Speaking theo 4 tiêu chí. Tính band tổng = trung bình 4 kỹ năng, làm tròn đến 0.5 gần nhất.
    tips:
      - "Cách làm tròn band tổng: trung bình kết thúc bằng .25 → làm tròn lên .5; .75 → làm tròn lên số nguyên tiếp theo. VD: (6 + 6.5 + 6 + 6.5)/4 = 6.25 → 6.5."
      - Ghi giờ thực tế bạn hoàn thành từng phần. Phần nào lố giờ là phần cần chiến thuật ở Buổi 79.
      - Nếu mất tập trung ở Reading bài 3 hoặc Writing Task 2 — đó là dấu hiệu sức bền, không phải trình độ. Ghi lại để Buổi 79 xử lý.
    traps:
      - trap_vi: Dừng giữa chừng để xem đáp án Listening trước khi làm Reading.
        fix_vi: Không chấm gì cho tới khi xong Writing — giống thi thật, bạn không biết điểm khi đang thi.
      - trap_vi: Viết Writing ngắn vì mệt sau 90 phút Listening + Reading.
        fix_vi: Dàn ý trước, viết theo dàn ý; kiểm tra số từ trước khi hết giờ.
    phrases:
      - en: Overall band score
        vi: Điểm tổng (trung bình 4 kỹ năng)
      - en: I'd like to start with Part 1, please.
        vi: (Tự nhắc) Bắt đầu Part 1.
        note_vi: Không cần nói trong phòng thi; dùng khi tự ghi âm để đánh dấu các phần.
