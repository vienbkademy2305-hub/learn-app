  - type: dialogue
    title_vi: Tham quan làng gốm
    lines:
      - speaker: A
        text: Welcome to Bat Trang village. It's famous for its pottery.
        vi: Chào mừng đến làng Bát Tràng. Làng nổi tiếng về gốm.
      - speaker: B
        text: How are the cups and bowls made?
        vi: Chén bát được làm thế nào ạ?
      - speaker: A
        text: They are made by hand from local clay.
        vi: Chúng được làm bằng tay từ đất sét địa phương.
      - speaker: B
        text: How old is the village?
        vi: Làng có từ bao giờ ạ?
      - speaker: A
        text: It is more than five hundred years old.
        vi: Làng có hơn năm trăm năm tuổi.
      - speaker: B
        text: Are the products sold abroad?
        vi: Sản phẩm có được bán ra nước ngoài không?
      - speaker: A
        text: Yes, they are exported to Japan, Europe and the USA.
        vi: Có, chúng được xuất khẩu sang Nhật, châu Âu và Mỹ.
      - speaker: B
        text: Wonderful. I'd like to buy a handmade cup as a souvenir.
        vi: Tuyệt quá. Tôi muốn mua một chiếc cốc làm tay để làm quà lưu niệm.
  - type: exercises
    items:
      - id: b19-x1
        bank_no: 6
        kind: verb-form
        instructions_vi: Chia động từ trong ngoặc ở dạng bị động (hiện tại đơn hoặc quá khứ đơn).
        questions:
          - q: Tea (grow) ___ in Thai Nguyen.
            answer: is grown
          - q: This temple (build) ___ in the eleventh century.
            answer: was built
          - q: These shoes (make) ___ in Vietnam.
            answer: are made
          - q: The first computer (invent) ___ in the 1940s.
            answer: was invented
          - q: Rice (export) ___ to many countries every year.
            answer: is exported
          - q: The letters (send) ___ yesterday.
            answer: were sent
          - q: English (speak) ___ in many countries.
            answer: is spoken
          - q: The windows (not / clean) ___ last week.
            answer: were not cleaned
            accept:
              - weren't cleaned
      - id: b19-x2
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu ở dạng bị động. Chỉ giữ by + người khi cần thiết.
        questions:
          - q: Farmers grow coffee in the Central Highlands. → Coffee ___
            answer: is grown in the Central Highlands.
            accept:
              - is grown in the Central Highlands by farmers.
          - q: They built this school in 1995. → This school ___
            answer: was built in 1995.
          - q: Picasso painted this picture. → This picture ___
            answer: was painted by Picasso.
          - q: People speak French in Canada. → French ___
            answer: is spoken in Canada.
          - q: The factory produces 500 bikes a day. → 500 bikes ___
            answer: are produced a day.
            accept:
              - are produced a day by the factory.
              - are produced by the factory a day.
      - id: b19-x3
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: This table is made ___ wood.
            options:
              - in
              - of
              - by
              - from
            answer: b
          - q: My phone was made ___ Korea.
            options:
              - in
              - of
              - by
              - at
            answer: a
          - q: The book ___ into ten languages last year.
            options:
              - translated
              - is translated
              - was translated
              - translates
            answer: c
          - q: Where ___ you born?
            options:
              - are
              - was
              - were
              - did
            answer: c
          - q: This song was written ___ a Vietnamese singer.
            options:
              - from
              - of
              - with
              - by
            answer: d
      - id: b19-x4
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: export
            right: to sell goods to another country
          - left: invention
            right: something new that somebody makes for the first time
          - left: handmade
            right: made by a person, not by a machine
          - left: recycle
            right: to use old things again to make new things
          - left: factory
            right: a building where things are made by machines
      - id: b19-x5
        bank_no: 13
        kind: tfng
        instructions_vi: Đọc đoạn văn rồi chọn T (đúng), F (sai) hoặc NG (không được nhắc đến).
        passage: Van Phuc is a small village near Hanoi. It is famous for its silk. In the past, all the silk was made here by hand, but today most of the cloth is produced by machines. The village shops sell scarves, shirts and dresses to tourists. Some of the products are exported to Japan and France. The oldest workshop in the village was opened by a local family more than eighty years ago, and it is still run by the same family today.
        questions:
          - q: Van Phuc is famous for pottery.
            answer: F
            explain_vi: Làng nổi tiếng về lụa.
          - q: Most silk in the village is made by hand today.
            answer: F
            explain_vi: Ngày nay phần lớn làm bằng máy.
          - q: Some silk products are sold to other countries.
            answer: T
          - q: Silk from Van Phuc is more expensive than silk from Hoi An.
            answer: NG
          - q: The oldest workshop was opened by a family from another city.
            answer: F
            explain_vi: a local family = gia đình ở địa phương.
          - q: The same family still runs the oldest workshop.
            answer: T
      - id: b19-x6
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Woman: This scarf is beautiful. Where was it made?
          Man: It was made in Van Phuc village. It's silk.
          Woman: Is it handmade?
          Man: Yes, all our scarves are made by hand. Some are exported to Japan.
          Woman: How much is it?
          Man: Four hundred thousand dong.
        questions:
          - { q: Where was the scarf made?, options: [ in Japan, in Van Phuc village, in a big factory, in Hanoi city centre ], answer: b }
          - { q: What is it made of?, options: [ cotton, silk, plastic, wool ], answer: b }
          - { q: Where are some scarves exported to?, options: [ China, Japan, France, Korea ], answer: b }
      - id: b19-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: Coffee is grown in the Central Highlands of Vietnam. It was brought to Vietnam by the French in the nineteenth century. Today, Vietnamese coffee is exported to more than eighty countries, and a lot of it is used to make instant coffee.
        questions:
          - { q: Coffee is grown in the Central Highlands., answer: T }
          - { q: Coffee was brought to Vietnam by the Chinese., answer: F }
          - { q: Vietnamese coffee is exported to more than eighty countries., answer: T }
          - { q: Vietnamese coffee is never used for instant coffee., answer: F }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 80–100 từ giới thiệu một sản phẩm nổi tiếng ở quê bạn: được làm/trồng ở đâu, làm thế nào, bán cho ai. Dùng ít nhất 5 câu bị động."
    prompt_en: "Describe a famous product from your hometown: where and how it is made, and who buys it."
    words:
      min: 80
      max: 100
    minutes: 20
