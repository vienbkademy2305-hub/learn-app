  - type: skill
    skill: reading
    title_vi: "Reading — Sentence completion: hoàn thành câu bằng từ trong bài"
    intro_vi: "Bạn nhận một số câu chưa hoàn chỉnh và phải điền từ LẤY NGUYÊN TỪ BÀI ĐỌC, đúng giới hạn từ (VD: NO MORE THAN TWO WORDS). Các câu đi theo thứ tự của bài. Câu trong đề đã được viết lại (paraphrase) so với bài đọc, nên việc chính là: nhận ra câu nào trong bài mang cùng ý, rồi lấy đúng từ còn thiếu. Điền đúng ý nhưng sai chính tả hoặc vượt số từ vẫn bị tính sai."
    steps:
      - title_vi: Đọc kỹ giới hạn từ
        text_vi: ONE WORD ONLY / NO MORE THAN TWO WORDS / ONE WORD AND/OR A NUMBER. Khoanh tròn yêu cầu này. 'a lot of visitors' = 4 từ — không được nếu giới hạn là 2.
      - title_vi: Gạch từ khóa và phân loại
        text_vi: "Từ khóa KHÔNG ĐỔI: tên riêng, năm, con số, thuật ngữ (Minh Chau, 1999, UNESCO) — dùng để tìm vị trí trong bài. Từ khóa CÓ THỂ ĐỔI: động từ, tính từ, danh từ chung (visitors → tourists, damage → harm) — dùng để khớp ý."
      - title_vi: Đoán loại từ cần điền
        text_vi: "Nhìn chữ đứng trước và sau chỗ trống: sau a/the/tính từ → danh từ; sau to be và trước danh từ → tính từ; sau to hoặc will → động từ nguyên thể; có 'in + ___' với năm → số."
      - title_vi: Scan tìm vùng thông tin
        text_vi: Tìm từ khóa không đổi (nếu có), hoặc từ đồng nghĩa của từ khóa có thể đổi. Vì câu đi theo thứ tự, đáp án câu 3 nằm sau đáp án câu 2.
      - title_vi: Đọc kỹ 1–2 câu quanh đó
        text_vi: "So sánh từng phần của câu đề với câu trong bài. Phần còn thiếu chính là đáp án. Kiểm tra ý nghĩa: có đúng chủ thể, đúng thời gian không?"
      - title_vi: Chép đúng và đọc lại cả câu
        text_vi: Chép nguyên chữ trong bài (đúng số ít/số nhiều), không tự đổi dạng từ. Đọc lại câu hoàn chỉnh xem có đúng ngữ pháp không.
    tips:
      - Đáp án thường là DANH TỪ (khoảng 70%). Nếu bạn đoán động từ mà điền danh từ, xem lại.
      - "Số: có thể viết 5,000 hoặc five thousand — nhưng số tính là MỘT từ khi đề cho 'and/or a number'."
      - Không cần hiểu hết bài. Mỗi câu chỉ cần hiểu kỹ 1–2 câu văn chứa đáp án.
    traps:
      - trap_vi: Điền từ của mình (đúng nghĩa) thay vì từ trong bài.
        fix_vi: Đề yêu cầu 'from the passage' — chỉ chép từ có trong bài.
      - trap_vi: "Sai số ít/số nhiều: bài viết 'temples', bạn chép 'temple'."
        fix_vi: Chép đúng như trong bài và kiểm tra với mạo từ trong câu đề (a ___ → số ít).
      - trap_vi: Lấy đáp án từ câu giả định (loại 2) hoặc câu nói về quá khứ khi đề hỏi hiện tại.
        fix_vi: "Đối chiếu thời gian và chủ thể: 'In the past…' vs 'Today…', 'If … would…' = chưa xảy ra."
      - trap_vi: Vượt giới hạn từ vì chép cả mạo từ đã có trong câu đề.
        fix_vi: Câu đề có sẵn 'the ___' thì không chép lại 'the'.
    phrases:
      - en: NO MORE THAN TWO WORDS from the passage
        vi: Không quá hai từ lấy từ bài đọc
        note_vi: 1 hoặc 2 từ đều được.
      - en: ONE WORD AND/OR A NUMBER
        vi: Một từ và/hoặc một số
      - en: Complete the sentences below.
        vi: Hoàn thành các câu bên dưới.
      - en: Choose ONE WORD ONLY from the passage for each answer.
        vi: Chọn CHỈ MỘT TỪ trong bài cho mỗi đáp án.
    demo:
      title_vi: "Làm mẫu: từ câu đề về câu trong bài"
      text_en: |-
        Passage: "Before the town became famous, most families earned their living from fishing. Today, more than half of them run small hotels or souvenir shops."

        Question: In the past, the majority of local people worked in __________ .  (ONE WORD ONLY)
      notes:
        - label: Từ khóa
          text_vi: "'In the past' ↔ 'Before the town became famous'; 'the majority of local people' ↔ 'most families'; 'worked in' ↔ 'earned their living from'."
        - label: Loại từ
          text_vi: Sau 'worked in' → danh từ chỉ nghề/ngành.
        - label: "Đáp án: fishing"
          text_vi: "Một từ, chép nguyên. Bẫy: 'hotels' là việc làm HIỆN NAY (Today) — sai thời gian."
