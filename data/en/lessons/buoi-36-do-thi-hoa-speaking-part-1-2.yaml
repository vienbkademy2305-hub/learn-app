  - type: skill
    skill: speaking
    title_vi: Speaking Part 1 + Part 2 — nói trôi và liên kết ý
    intro_vi: "Part 1 (4–5 phút): câu hỏi ngắn về bản thân, quê hương, nơi ở. Part 2 (3–4 phút): nhận thẻ đề (cue card), 1 phút chuẩn bị, nói 1–2 phút. Hai phần thường cùng một mạch chủ đề — hỏi về nơi bạn sống ở Part 1 rồi Part 2 bảo 'Describe a place in your city…'. Buổi này luyện nối hai phần: dùng lại ý và từ của Part 1 để Part 2 không bị bí, và dùng từ nối văn nói để câu trôi chảy."
    steps:
      - title_vi: "Part 1: trả lời 2–4 câu"
        text_vi: "Công thức Buổi 24: Answer + Reason + Detail. Thêm 1 từ nối văn nói cho tự nhiên: 'Actually, …', 'Apart from that, …'."
      - title_vi: "Part 1: ghi nhớ ý hay của chính mình"
        text_vi: Nếu bạn vừa kể về một con phố, một khu chợ ở Part 1, rất có thể dùng lại được ở Part 2. Đừng sợ lặp chủ đề — chỉ cần khác câu chữ.
      - title_vi: "Part 2: 1 phút chuẩn bị = 4 dòng ghi chú"
        text_vi: Mỗi gợi ý trên thẻ ghi 2–3 từ khóa, không viết câu. Dòng cuối (explain why…) ghi nhiều hơn vì đó là phần dài nhất.
      - title_vi: "Part 2: mở – thân – kết"
        text_vi: "Mở: 'I'd like to talk about …'. Thân: đi lần lượt các gợi ý, nối bằng 'As for …', 'Apart from that, …', 'What I like most is …'. Kết: 'So that's why …'."
      - title_vi: Nói tiếp khi giám khảo chưa dừng
        text_vi: "Còn thời gian mà hết ý? Thêm một kỷ niệm cụ thể: 'I remember one time when …' (quá khứ đơn, Buổi 14/28)."
    tips:
      - Part 1 không cần dùng từ khó; cần câu trọn vẹn và tự nhiên.
      - "Part 2: nhìn giám khảo khi nói, chỉ liếc ghi chú. Đọc ghi chú làm mất Fluency."
      - "Nếu bí từ, diễn đạt vòng: 'the place where people sell fresh food' thay cho từ bạn quên."
    traps:
      - trap_vi: Dùng 'actually' với nghĩa 'hiện nay'.
        fix_vi: Hiện nay = at the moment / currently / these days. Actually = thật ra.
      - trap_vi: Mở mọi câu bằng 'Well' hoặc 'To be honest'.
        fix_vi: "Đổi cách mở: trả lời thẳng, hoặc 'Yes, definitely…', 'Not really, because…'."
      - trap_vi: Part 2 dừng sau 40 giây.
        fix_vi: Thêm chi tiết giác quan (thấy gì, nghe gì, ăn gì) và một kỷ niệm. 1 phút 30 giây trở lên là an toàn.
      - trap_vi: "Dùng từ nối văn viết khi nói: 'Furthermore', 'In conclusion'."
        fix_vi: Nói 'Also', 'Besides', 'So that's why…'.
    phrases:
      - en: I'd like to talk about …
        vi: Tôi muốn nói về …
        note_vi: Mở Part 2.
      - en: As for …,
        vi: Còn về …,
        note_vi: Chuyển sang gợi ý tiếp theo trên thẻ.
      - en: What I like most about it is (that) …
        vi: Điều tôi thích nhất ở đó là …
      - en: Apart from that, …
        vi: Ngoài ra, …
      - en: Anyway, …
        vi: Dù sao thì, …
        note_vi: Quay về ý chính sau khi nói lan man.
      - en: So that's why I …
        vi: Vì thế nên tôi …
        note_vi: Kết Part 2.
    demo:
      title_vi: "Làm mẫu: từ Part 1 sang Part 2"
      text_en: |-
        Part 1 — Examiner: Do you like the area where you live?
        Candidate: Yes, I do. It's quite lively, and it's within walking distance of Hoan Kiem Lake. Apart from the traffic, it's a great place to live.

        Part 2 — Cue card: Describe a place in your city that you like to visit. You should say: where it is · what you can do there · how often you go there · and explain why you like it.

        Candidate: I'd like to talk about the pedestrian zone around Hoan Kiem Lake, which is just ten minutes from my flat. On weekend evenings, the streets are closed to cars, so the whole area becomes very lively. As for what you can do there, there are street performers, games for children, and of course lots of street food. I usually go there with my friends about twice a month, normally on Saturday nights. What I like most about it is the atmosphere. Everyone is relaxed, and you can see families, tourists and teenagers all enjoying the same space. I remember one evening when a group of students started singing traditional songs, and soon everyone was joining in. Anyway, for me, it's the best place to escape the stress of the week, so that's why I love going there.
      notes:
        - label: Dùng lại ý Part 1
          text_vi: "'within walking distance of Hoan Kiem Lake' ở Part 1 thành chủ đề Part 2."
        - label: As for …
          text_vi: Chuyển sang gợi ý 2 mà không cần 'Secondly'.
        - label: What I like most …
          text_vi: Mở gợi ý cuối (explain why) — phần dài nhất.
        - label: I remember one evening when …
          text_vi: Kỷ niệm cụ thể giúp kéo dài và tự nhiên. Quá khứ đơn.
        - label: Anyway, … so that's why …
          text_vi: Quay về ý chính và kết. Toàn bài khoảng 1 phút 40 giây.
