  - type: skill
    skill: reading
    title_vi: Reading — Matching features (nối nhận định với người/nhóm)
    intro_vi: Đề cho một danh sách người (nhà nghiên cứu, nhà phê bình), địa điểm hoặc mốc thời gian, và một danh sách nhận định. Bạn nối mỗi nhận định với đúng người. Một người có thể được dùng nhiều lần hoặc không lần nào. Khó vì tên xuất hiện rải rác, và nhận định đã được PARAPHRASE.
    steps:
      - title_vi: Khoanh tất cả tên trong bài trước
        text_vi: "Scan và khoanh mọi chỗ tên xuất hiện (cả họ đơn lẻ: 'Chen argues…', và đại từ he/she ngay sau). Một người thường xuất hiện 2–3 chỗ."
      - title_vi: Đọc nhận định, gạch từ khóa ý
        text_vi: Nhận định không lặp từ của bài; gạch ý chính (VD 'public money should support the arts').
      - title_vi: Đọc quanh từng tên
        text_vi: Đọc 2–3 câu quanh mỗi chỗ tên xuất hiện, so với các nhận định. Làm theo TÊN (ít) thay vì theo NHẬN ĐỊNH (nhiều) thường nhanh hơn.
      - title_vi: Phân biệt ý của người đó và ý người khác
        text_vi: Câu như 'Unlike Chen, Moreno believes…' — ý sau thuộc về Moreno, không phải Chen.
      - title_vi: Không đúng thứ tự
        text_vi: Dạng này KHÔNG theo thứ tự bài. Đừng bỏ qua nhận định khó; đánh dấu và quay lại.
    tips:
      - "Động từ tường thuật cho biết thái độ: argues, claims (quan điểm), found, showed (kết quả nghiên cứu), warns (cảnh báo)."
      - "Chú ý câu điều kiện loại 3 trong bài: 'If X had …, Y would have …' nghĩa là X ĐÃ KHÔNG xảy ra."
      - "Thời gian gợi ý: 1 phút/nhận định."
    traps:
      - trap_vi: Thấy tên và từ khóa gần nhau là chọn ngay.
        fix_vi: "Đọc cả câu: có thể người đó đang PHẢN BÁC ý đó."
      - trap_vi: Nghĩ mỗi người chỉ dùng một lần.
        fix_vi: Đề ghi 'You may use any letter more than once'.
      - trap_vi: Hiểu nhầm câu loại 3 thành việc đã xảy ra.
        fix_vi: "'would have succeeded' = đã KHÔNG thành công."
    phrases:
      - en: X argues that …
        vi: X lập luận rằng …
      - en: Unlike X, Y believes …
        vi: Khác với X, Y tin rằng …
      - en: According to X, …
        vi: Theo X, …
      - en: X's research found that …
        vi: Nghiên cứu của X phát hiện rằng …
    demo:
      title_vi: "Làm mẫu: tìm người cho nhận định"
      text_en: |-
        Passage extract: Critic Laura Moreno argues that public funding keeps theatres alive. 'If the city had not paid for the Riverside Theatre in the 1990s, it would have closed,' she says. Economist Daniel Chen disagrees. In his view, audiences, not governments, should decide which arts survive. However, Chen's own study found that free museum entry doubled the number of young visitors.

        Statement 1: Government money has saved at least one theatre. → Moreno ('If the city had not paid …, it would have closed' = the city paid, so it did not close).
        Statement 2: Ticket buyers should choose which arts continue. → Chen ('audiences … should decide').
        Statement 3: Removing entry fees attracts more young people. → Chen (his STUDY found this, even though he disagrees with funding in general).
      notes:
        - label: Statement 1
          text_vi: "Câu loại 3 là chìa khóa: hiểu đúng 'if … had not … would have closed' = nhà hát KHÔNG đóng cửa nhờ tiền của thành phố."
        - label: Statement 2
          text_vi: "Paraphrase: audiences → ticket buyers; decide which arts survive → choose which arts continue."
        - label: Statement 3
          text_vi: Một người có thể xuất hiện nhiều lần; kết quả nghiên cứu khác quan điểm cá nhân.
