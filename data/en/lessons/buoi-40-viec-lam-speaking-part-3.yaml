  - type: skill
    skill: speaking
    title_vi: Speaking Part 3 nâng cao — paraphrase, dự đoán, đánh giá
    intro_vi: "Buổi 32 đã có khung A-R-E-A. Buổi này nâng cấp cho band 6+: (1) mở đầu bằng paraphrase câu hỏi để có thời gian nghĩ và thể hiện vốn từ; (2) xử lý ba loại câu hỏi khó: DỰ ĐOÁN (Will … in the future?), ĐÁNH GIÁ (Is it a good or bad thing that…?), và SO SÁNH (Which is more important, A or B?). Giám khảo Part 3 hay hỏi dồn 'Why?' 'Can you give an example?' — đó là dấu hiệu tốt, nghĩa là họ đang đẩy bạn lên band cao hơn."
    steps:
      - title_vi: Paraphrase 1 câu
        text_vi: "Đổi từ loại hoặc dùng When it comes to / As for: 'Will robots take our jobs?' → 'As for automation replacing workers, …'. Chỉ 1 câu, rồi trả lời."
      - title_vi: "Câu dự đoán: dùng mức độ chắc chắn"
        text_vi: will definitely / will probably / may / might / I doubt that … Đừng chỉ nói 'will' — thêm mức độ cho tự nhiên và chính xác.
      - title_vi: "Câu đánh giá: hai mặt rồi kết luận"
        text_vi: "'It's a positive development in some ways, because… However, … Overall, I'd say it's more positive than negative.'"
      - title_vi: "Câu so sánh: chọn rõ một bên"
        text_vi: "'Which is more important, salary or job satisfaction?' → chọn một bên, giải thích, rồi thừa nhận bên kia: 'Of course, salary matters, but…'."
      - title_vi: Khi không biết gì về chủ đề
        text_vi: "Thành thật + suy luận: 'I don't know much about the economy, but I imagine that…' — vẫn nói được 30 giây."
    tips:
      - Không học thuộc câu paraphrase cho mọi câu hỏi — chỉ nhớ 3–4 khung (When it comes to, As for, In terms of, That's an interesting question…).
      - "Dùng ví dụ cấp XÃ HỘI: 'In Vietnam, many factory workers…', 'A lot of companies now…'."
      - Giám khảo ngắt lời bạn là bình thường — Part 3 là thảo luận, không phải độc thoại.
    traps:
      - trap_vi: "Lặp nguyên văn câu hỏi: 'Why are many young people unemployed? Many young people are unemployed because…'"
        fix_vi: "Đổi sang danh từ: 'When it comes to youth unemployment, …'."
      - trap_vi: Paraphrase dài 3–4 câu mà chưa trả lời.
        fix_vi: Paraphrase tối đa 1 câu; câu thứ hai phải là câu trả lời.
      - trap_vi: When it comes to + to V.
        fix_vi: When it comes to + V-ing / danh từ.
      - trap_vi: Nhầm economic / economical.
        fix_vi: economic growth (kinh tế) — an economical car (tiết kiệm).
    phrases:
      - en: When it comes to …, I'd say …
        vi: Khi nói đến …, tôi cho là …
      - en: As for …, I think …
        vi: Còn về …, tôi nghĩ …
      - en: It will probably …, although I doubt that …
        vi: Có lẽ nó sẽ …, dù tôi không chắc là …
        note_vi: Câu dự đoán có mức độ.
      - en: Overall, I'd say it's more positive than negative.
        vi: Nhìn chung, tôi cho là tích cực nhiều hơn tiêu cực.
        note_vi: Câu đánh giá.
      - en: Of course, … matters, but …
        vi: Tất nhiên … cũng quan trọng, nhưng …
        note_vi: Thừa nhận bên kia trong câu so sánh.
      - en: I don't know much about …, but I imagine that …
        vi: Tôi không biết nhiều về …, nhưng tôi đoán là …
    demo:
      title_vi: "Làm mẫu: câu hỏi dự đoán"
      text_en: |-
        Examiner: Do you think robots will replace most workers in the future?

        Candidate: As for machines replacing human workers, I'd say it will probably happen in some industries, but not in most of them. When it comes to factory work, robots are already cheaper and faster, so jobs like packing and assembling will definitely disappear. However, I doubt that robots will replace nurses or teachers, because these jobs need human feelings and communication. For example, a robot can check a patient's temperature, but it can't really comfort a frightened child. So overall, I think the workforce will change rather than disappear, and people will need lifelong learning to keep up.
      notes:
        - label: Paraphrase
          text_vi: "'robots will replace most workers' → 'machines replacing human workers' (đổi sang danh động từ)."
        - label: Mức độ chắc chắn
          text_vi: probably / definitely / I doubt that — không chỉ dùng will.
        - label: When it comes to factory work
          text_vi: "Chia chủ đề thành hai nhóm nghề: nhà máy vs chăm sóc con người."
        - label: For example …
          text_vi: Ví dụ cụ thể (robot đo nhiệt độ vs an ủi trẻ).
        - label: So overall …
          text_vi: Kết luận + từ vựng buổi học (workforce, lifelong learning). Khoảng 45 giây.
