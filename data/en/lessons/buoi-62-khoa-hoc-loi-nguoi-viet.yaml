  - type: dialogue
    title_vi: Chữa bài cùng bạn học
    lines:
      - speaker: A
        text: Can you check my paragraph? I wrote 'In the solar system have eight planet'.
        vi: Bạn xem giúp đoạn của mình? Mình viết 'In the solar system have eight planet'.
      - speaker: B
        text: Two mistakes. It should be 'There are eight planets in the solar system'.
        vi: Hai lỗi. Phải là 'There are eight planets in the solar system'.
      - speaker: A
        text: Oh, 'có' again! I always translate it as 'have'.
        vi: Ôi, lại chữ 'có'! Mình toàn dịch thành 'have'.
      - speaker: B
        text: "And here: 'Mars very cold'. You need 'is'."
        vi: "Còn đây: 'Mars very cold'. Cần thêm 'is'."
      - speaker: A
        text: Right. What about 'scientists make researches about Mars'?
        vi: Đúng rồi. Còn 'scientists make researches about Mars'?
      - speaker: B
        text: "'Carry out research into Mars'. Research is uncountable, so no 's'."
        vi: "'Carry out research into Mars'. Research không đếm được nên không có 's'."
      - speaker: A
        text: I'll make a list of my mistakes and check them one by one.
        vi: Mình sẽ lập danh sách lỗi của mình và soát từng cái một.
  - type: exercises
    items:
      - id: b62-x1
        bank_no: 7
        kind: error-correction
        instructions_vi: "Lượt 1 (-s): đoạn văn có 5 lỗi số nhiều / ngôi 3. Sửa trực tiếp."
        text: Our solar system has eight planet. The Earth orbit the Sun once a year. There are thousands of satellite above us. Each spacecraft carry special cameras. Many astronaut say that space is very quiet.
        errors:
          - wrong: eight planet.
            right: eight planets.
            why: Số đếm > 1 → danh từ số nhiều.
          - wrong: The Earth orbit the Sun
            right: The Earth orbits the Sun
            why: Chủ ngữ số ít, hiện tại đơn → V-s.
          - wrong: thousands of satellite above
            right: thousands of satellites above
            why: thousands of + N số nhiều.
          - wrong: Each spacecraft carry
            right: Each spacecraft carries
            why: each + số ít → V-s.
          - wrong: Many astronaut say
            right: Many astronauts say
            why: many + N số nhiều.
      - id: b62-x2
        bank_no: 7
        kind: error-correction
        instructions_vi: "Lượt 2 (cấu trúc câu): đoạn văn có 4 lỗi (to be, 'có', thiếu chủ ngữ). Sửa trực tiếp."
        text: Mars very cold because its atmosphere is thin. On Mars have huge dust storms. Scientists believe that in the past had water there. The new telescope very powerful.
        errors:
          - wrong: Mars very cold
            right: Mars is very cold
            why: Thiếu to be trước tính từ.
          - wrong: On Mars have huge dust storms
            right: There are huge dust storms on Mars
            why: "'có' tồn tại → there are."
          - wrong: in the past had water there
            right: there was water there in the past
            why: Thiếu chủ ngữ; 'có' → there was.
          - wrong: The new telescope very powerful
            right: The new telescope is very powerful
            why: Thiếu to be.
      - id: b62-x3
        bank_no: 10
        kind: mcq
        instructions_vi: "Lượt 3 (word-by-word và giới từ): chọn cách diễn đạt đúng."
        questions:
          - q: Scientists ___ an experiment on the space station.
            options:
              - made
              - carried out
              - did make
              - created
            answer: b
          - q: There has been a lot of research ___ the effects of zero gravity.
            options:
              - about
              - into
              - for
              - at
            answer: b
          - q: Many young people are interested ___ becoming astronauts.
            options:
              - on
              - about
              - in
              - with
            answer: c
          - q: There has been a sharp increase ___ the number of satellites.
            options:
              - of
              - in
              - on
              - for
            answer: b
          - q: Students can ___ a lot of knowledge from science museums.
            options:
              - learn
              - gain
              - study
              - take
            answer: b
            explain_vi: Học được kiến thức = gain/acquire knowledge, KHÔNG 'learn knowledge'.
          - q: The success of the mission depends ___ good weather.
            options:
              - of
              - in
              - on
              - from
            answer: c
      - id: b62-x4
        bank_no: 10
        kind: mcq
        instructions_vi: "Trật tự tính từ và danh từ không đếm được: chọn đáp án đúng."
        questions:
          - q: They built a ___ telescope.
            options:
              - Chilean huge new
              - huge new Chilean
              - new Chilean huge
              - Chilean new huge
            answer: b
          - q: The astronauts wore ___ suits.
            options:
              - white heavy
              - heavy white
              - white and heavy white
              - heavily white
            answer: b
          - q: The scientists gave us some useful ___.
            options:
              - informations
              - information
              - an information
              - many information
            answer: b
          - q: The laboratory bought new ___.
            options:
              - equipments
              - an equipment
              - equipment
              - many equipment
            answer: c
          - q: Which is correct?
            options:
              - There are many researches on Mars.
              - There is a lot of research on Mars.
              - There are a lot of research on Mars.
              - There is many research on Mars.
            answer: b
      - id: b62-x5
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ trong khung vào chỗ trống.
        bank:
          - orbits
          - launched
          - gravity
          - hypothesis
          - atmosphere
          - laboratory
          - galaxies
          - observe
        questions:
          - q: The International Space Station ___ the Earth about 16 times a day.
            answer: orbits
          - q: The rocket was ___ from a base in the desert.
            answer: launched
          - q: In zero ___, water forms floating balls.
            answer: gravity
          - q: The experiment did not support their ___.
            answer: hypothesis
          - q: The Earth's ___ protects us from harmful radiation.
            answer: atmosphere
          - q: The samples were sent to a ___ for testing.
            answer: laboratory
          - q: There may be billions of ___ in the universe.
            answer: galaxies
          - q: Astronomers ___ the stars through powerful telescopes.
            answer: observe
      - id: b62-x6
        bank_no: 19
        kind: completion
        instructions_vi: Nghe hai người nói về chuyến tham quan đài thiên văn (hai giọng) và hoàn thành ghi chú. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ.
        max_words: 1
        audio_text: |-
          Woman: Hi, I'm calling about the evening tour of the observatory.
          Man: Of course. Tours start at eight o'clock, and they last about ninety minutes.
          Woman: What will we see?
          Man: If the sky is clear, you'll look at Saturn through our main telescope. We also show a short film about the solar system.
          Woman: How much are tickets?
          Man: Twelve pounds for adults. Sorry, that's last year's price. It's fifteen now. Students pay half.
          Woman: And what should we bring?
          Man: A warm jacket. It gets very cold on the roof.
        passage: |-
          OBSERVATORY EVENING TOUR
          Starts at: (1) ___ pm
          Length: about (2) ___ minutes
          Planet to observe: (3) ___
          Adult ticket: £(4) ___
          Bring: a warm (5) ___
        questions:
          - q: (1)
            answer: "8"
            accept:
              - eight
          - q: (2)
            answer: "90"
            accept:
              - ninety
          - q: (3)
            answer: Saturn
          - q: (4)
            answer: "15"
            accept:
              - fifteen
          - q: (5)
            answer: jacket
      - id: b62-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe đoạn giới thiệu rồi chọn T (đúng) hoặc F (sai).
        audio_text: Life on the International Space Station is very different from life on Earth. Because there is almost no gravity, astronauts sleep in bags attached to the wall. They exercise for about two hours every day, because without gravity their muscles and bones become weaker. Water is recycled, including sweat. Most astronauts stay on the station for about six months.
        questions:
          - q: Astronauts sleep in beds on the floor.
            answer: F
          - q: Astronauts exercise to protect their muscles and bones.
            answer: T
          - q: Water on the station is not recycled.
            answer: F
          - q: A typical stay lasts about six months.
            answer: T
      - id: b62-x8
        bank_no: 7
        kind: error-correction
        instructions_vi: "Soát cả 3 lượt: đoạn Task 2 có 5 lỗi. Sửa trực tiếp."
        text: Some people think space exploration is waste of money. However, space research have brought many benefit. For example, satellite images helps farmers to predict the weather. In addition, many products we use every day was first developed for astronauts.
        errors:
          - wrong: is waste of money
            right: is a waste of money
            why: a waste of money (cụm cố định có a).
          - wrong: space research have brought
            right: space research has brought
            why: research không đếm được → has.
          - wrong: many benefit
            right: many benefits
            why: many + số nhiều.
          - wrong: satellite images helps
            right: satellite images help
            why: Chủ ngữ số nhiều → không thêm -s.
          - wrong: was first developed
            right: were first developed
            why: many products → were.
  - type: homework
    kind: paragraph
    prompt_vi: (1) Lập danh sách 3 nhóm lỗi hay gặp nhất của bạn từ 5 bài viết gần đây. (2) Viết một đoạn thân bài (150 từ) cho đề dưới đây trong 15 phút, rồi soát 3 phút theo 3 lượt bằng 3 màu bút. Ghi số lỗi tìm được ở mỗi lượt.
    prompt_en: Some people think governments should spend money on space research. Others think this money should be used to solve problems on Earth. Write one body paragraph giving the benefits of space research.
    words:
      min: 130
      max: 170
    minutes: 20
