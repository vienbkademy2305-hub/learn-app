  - type: skill
    skill: writing
    title_vi: Writing — tự soát lỗi (proofreading) trong 3 phút cuối
    intro_vi: "Ở band 6, phần lớn bài mất điểm GRA không vì thiếu câu phức mà vì LỖI LẶP LẠI: quên -s, bỏ to be, sai giới từ. Những lỗi này bạn BIẾT sửa nếu nhìn thấy — vấn đề là không có thời gian để nhìn. Buổi này luyện một quy trình soát lỗi 3 phút theo 'lượt', mỗi lượt chỉ tìm MỘT loại lỗi của chính bạn."
    steps:
      - title_vi: Lập danh sách lỗi cá nhân
        text_vi: Xem lại 5 bài viết gần nhất đã được chữa. Đếm lỗi theo nhóm (-s, to be, giới từ, mạo từ, thì…). Chọn 3 nhóm hay gặp nhất — đó là 3 'lượt' soát của bạn.
      - title_vi: Lượt 1 — danh từ số nhiều và -s động từ
        text_vi: Dùng bút chì chạm vào từng danh từ sau many/several/số/these; từng động từ sau chủ ngữ số ít. 60 giây.
      - title_vi: Lượt 2 — to be và cấu trúc câu
        text_vi: "Mỗi câu: có chủ ngữ? có động từ chính? tính từ sau chủ ngữ có is/are? 'có' đã thành there is/are chưa? 60 giây."
      - title_vi: Lượt 3 — giới từ và collocation
        text_vi: "Soát các cụm quen sai: research into, increase in, interested in, depend on, carry out. 60 giây."
      - title_vi: Không viết lại câu
        text_vi: 3 phút cuối chỉ SỬA NHỎ (thêm -s, thêm is, đổi giới từ). Không viết lại cả câu — dễ sinh lỗi mới và bài bẩn.
    tips:
      - "Đọc chậm từ cuối bài lên đầu: não không đọc theo nghĩa nữa nên dễ thấy lỗi hình thức."
      - Chừa 3 phút cho Task 2 và 2 phút cho Task 1 ngay từ khi lập kế hoạch thời gian.
      - "Khi luyện ở nhà: dùng 3 màu bút cho 3 lượt để thấy lỗi nào hay bị bỏ sót."
    traps:
      - trap_vi: Soát 'chung chung' một lần từ đầu đến cuối.
        fix_vi: Mỗi lượt một loại lỗi — hiệu quả gấp nhiều lần.
      - trap_vi: Viết đến phút cuối, không còn thời gian soát.
        fix_vi: Dừng viết ở phút 37 (Task 2) dù chưa hoàn hảo.
      - trap_vi: "'Sửa' research → researches, information → informations."
        fix_vi: Thuộc danh sách danh từ không đếm được hay gặp.
    phrases:
      - en: There are many … in …
        vi: Có nhiều … ở …
        note_vi: Thay cho 'In … have many …'.
      - en: carry out research into …
        vi: tiến hành nghiên cứu về …
      - en: a significant increase in …
        vi: sự gia tăng đáng kể về …
      - en: … is essential for …
        vi: … là thiết yếu đối với …
    demo:
      title_vi: "Làm mẫu: soát một đoạn thân bài theo 3 lượt"
      text_en: |-
        Original: Nowadays, many country spend a lot of money for space programme. In space have thousands of satellite which help us in daily life. For example, weather forecast very accurate thanks to satellite images. Moreover, scientists make many researches about the climate from space.

        Pass 1 (-s): many country → many countries; space programme → space programmes; thousands of satellite → thousands of satellites.
        Pass 2 (structure): In space have → There are … in space; weather forecast very accurate → weather forecasts are very accurate.
        Pass 3 (prepositions / collocations): spend money for → spend money on; make many researches about → carry out a lot of research into.

        Corrected: Nowadays, many countries spend a lot of money on space programmes. There are thousands of satellites in space which help us in daily life. For example, weather forecasts are very accurate thanks to satellite images. Moreover, scientists carry out a lot of research into the climate from space.
      notes:
        - label: Pass 1
          text_vi: 3 lỗi -s — loại lỗi hay gặp nhất của người Việt.
        - label: Pass 2
          text_vi: "'có' → there are; thêm are trước tính từ."
        - label: Pass 3
          text_vi: spend ON; carry out research INTO; research không đếm được.
