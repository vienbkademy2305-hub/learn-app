  - type: skill
    skill: listening
    title_vi: Listening Part 3–4 — không lạc trong bài nghe dài
    intro_vi: "Part 3 là hội thoại 2–4 người trong bối cảnh học tập (sinh viên bàn bài tập với nhau hoặc với giảng viên). Part 4 là một bài giảng ĐỘC THOẠI khoảng 4–5 phút, KHÔNG có khoảng nghỉ giữa bài, thường là dạng điền ghi chú. Hai phần này khó nhất vì từ vựng học thuật, nhiều ý kiến đan xen và ít điểm dừng. Chìa khóa: dùng câu hỏi như 'bản đồ' để biết mình đang ở đâu, và ghi chú nhanh."
    steps:
      - title_vi: Dùng thời gian đọc trước tối đa
        text_vi: Đọc tiêu đề và TẤT CẢ câu hỏi của phần đó (Part 4 có 10 câu liền). Gạch từ khóa, đoán loại từ. Các tiêu đề nhỏ (Background / Problems / Solutions) cho biết cấu trúc bài giảng.
      - title_vi: Nghe tín hiệu chuyển phần
        text_vi: "'First, I'll look at…', 'Moving on to…', 'Now, what about the effects?', 'Finally…' — mỗi tín hiệu tương ứng một nhóm câu hỏi. Nghe thấy là nhìn xuống nhóm câu tiếp theo."
      - title_vi: "Part 3: ghi chú theo người nói"
        text_vi: "Ghi M: / W: / T: (tutor) trước ý. Câu hỏi thường hỏi ý kiến của MỘT người hoặc điều cả hai ĐỒNG Ý."
      - title_vi: Ghi chú nhanh bằng ký hiệu
        text_vi: ↑ tăng · ↓ giảm · → dẫn đến · = giống · ≠ khác · b/c because · e.g. ví dụ · ppl people · govt government. Chỉ ghi từ khóa, không ghi câu.
      - title_vi: Lạc thì nhảy sang câu sau
        text_vi: Nếu đã nghe tới từ khóa của câu 25 mà chưa có đáp án câu 24 → bỏ 24, theo câu 25. Bài không dừng lại đợi bạn.
      - title_vi: Chép sang phiếu, kiểm tra
        text_vi: Chính tả, số ít/số nhiều, giới hạn từ. Câu bỏ trống thì đoán một từ đúng loại từ.
    tips:
      - Part 4 nói về MỘT chủ đề học thuật — không cần hiểu chuyên môn, chỉ cần theo dõi thứ tự ý.
      - Câu hỏi 'Why…?' / 'What was the purpose…?' → chờ to / in order to / so that / because.
      - Luyện nghe thêm podcast 5 phút (BBC 6 Minute English…) và thử ghi chú bằng ký hiệu.
    traps:
      - trap_vi: Ghi chú nguyên câu và lỡ câu tiếp theo.
        fix_vi: Tối đa 2–3 từ + ký hiệu mỗi ý.
      - trap_vi: Nhầm ý kiến giữa hai sinh viên (Part 3).
        fix_vi: "Luôn ghi ai nói; chú ý câu đồng ý/phản đối: 'I'm not sure about that', 'Good point'."
      - trap_vi: Bị cuốn vào một ví dụ dài và quên câu hỏi.
        fix_vi: Ví dụ thường KHÔNG phải đáp án; đáp án là ý chính trước hoặc sau ví dụ.
    phrases:
      - en: First, I'd like to look at …
        vi: Trước hết, tôi muốn xem xét …
        note_vi: Bắt đầu phần 1 của bài giảng.
      - en: Moving on to …
        vi: Chuyển sang …
      - en: The main purpose of this was to …
        vi: Mục đích chính của việc này là …
      - en: I'm not sure I agree.
        vi: Tớ không chắc là mình đồng ý.
        note_vi: Part 3 — phản đối.
      - en: To sum up, …
        vi: Tóm lại, …
        note_vi: Cuối bài giảng — thường có 1–2 câu hỏi cuối.
    demo:
      title_vi: "Làm mẫu: ghi chú bằng ký hiệu"
      text_en: |-
        Lecture: "Moving on to the effects of remote work. First, most companies found that productivity went up, mainly because employees spent less time travelling. However, many managers reported that new staff felt lonely and learned more slowly, so some firms now ask new employees to come to the office three days a week in order to build relationships."

        Notes: Effects of remote work
        • productivity ↑ b/c less travel
        • BUT new staff: lonely, learn slowly
        • → some firms: new staff in office 3 days/wk — purpose: build relationships
      notes:
        - label: Moving on to …
          text_vi: Tín hiệu phần mới → nhìn sang nhóm câu hỏi 'Effects'.
        - label: ↑ b/c
          text_vi: Ký hiệu thay cho cả mệnh đề 'went up, mainly because…'.
        - label: in order to build relationships
          text_vi: Câu hỏi 'Why do some firms ask new staff to come in?' → đáp án đến ngay sau in order to.
