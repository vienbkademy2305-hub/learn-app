  - type: dialogue
    title_vi: Bàn báo cáo thực tập với giảng viên
    lines:
      - speaker: Tutor
        text: So, Minh, how was your internship at the marketing company?
        vi: Minh, kỳ thực tập ở công ty marketing thế nào?
      - speaker: Student
        text: Really useful. I gained a lot of experience, especially in writing social media posts.
        vi: Rất hữu ích ạ. Em có thêm nhiều kinh nghiệm, nhất là viết bài đăng mạng xã hội.
      - speaker: Tutor
        text: Good. In your report, you say the company recruits many interns. Why is that?
        vi: Tốt. Trong báo cáo em nói công ty tuyển nhiều thực tập sinh. Vì sao vậy?
      - speaker: Student
        text: They train interns so that they can hire the best ones after graduation.
        vi: Họ đào tạo thực tập sinh để có thể tuyển những bạn giỏi nhất sau khi tốt nghiệp.
      - speaker: Tutor
        text: Interesting. And what about job satisfaction among the employees?
        vi: Thú vị đấy. Còn mức độ hài lòng với công việc của nhân viên thì sao?
      - speaker: Student
        text: Most of them were happy. They can work from home twice a week.
        vi: Phần lớn họ hài lòng. Họ được làm việc tại nhà hai ngày một tuần.
      - speaker: Tutor
        text: I'd add some numbers there. Did you do a survey?
        vi: Em nên thêm số liệu ở đó. Em có làm khảo sát không?
      - speaker: Student
        text: Not yet. I'll send a short survey to twenty employees in order to get more data.
        vi: Chưa ạ. Em sẽ gửi khảo sát ngắn cho hai mươi nhân viên để có thêm dữ liệu.
  - type: exercises
    items:
      - id: b39-x1
        bank_no: 20
        kind: mcq
        instructions_vi: "Part 3: nghe hai sinh viên và giảng viên bàn về đề tài nghiên cứu (nhiều giọng, nghe 1 lần như thi thật). Chọn A, B hoặc C. Ghi chú M:/W:/T: khi nghe."
        audio_text: |-
          Tutor: So, Lan and Duc, have you chosen a topic for your research project?
          Lan: We're thinking about young people and freelance work. Lots of our friends do freelance design or translation.
          Tutor: Good. What's your main question?
          Duc: At first we wanted to find out how much freelancers earn. But that information is very private, so people might not answer honestly.
          Lan: So now we want to know why young people choose freelance work instead of a full-time job.
          Tutor: That's more realistic. How will you collect data?
          Duc: I suggested an online survey, because it's quick.
          Lan: But I think interviews will give us deeper answers. In the end, we agreed to do both: a survey first, then interviews with eight people.
          Tutor: Sensible. And what do you expect to find?
          Duc: I think the main reason will be money.
          Lan: I disagree. From what our friends say, it's freedom. They want to choose their own hours.
          Tutor: Well, that's what your research is for. Don't forget, the deadline for your plan is the end of this month.
        questions:
          - q: Why did they change their first research question?
            options:
              - It was too easy.
              - People might not answer honestly about money.
              - The tutor didn't like it.
            answer: b
          - q: What is their research question now?
            options:
              - how much freelancers earn
              - why young people choose freelance work
              - how to find freelance work
            answer: b
          - q: How will they collect data?
            options:
              - only an online survey
              - only interviews
              - a survey and then interviews
            answer: c
            explain_vi: Duc muốn survey, Lan muốn interview — 'In the end, we agreed to do both'.
          - q: What does Lan expect the main reason to be?
            options:
              - money
              - freedom
              - experience
            answer: b
            explain_vi: Money là ý của DUC. Câu hỏi hỏi Lan.
          - q: When is the deadline for their plan?
            options:
              - next week
              - the end of this month
              - the end of the term
            answer: b
      - id: b39-x2
        bank_no: 18
        kind: completion
        instructions_vi: "Part 4: nghe bài giảng (độc thoại, nghe 1 lần) và hoàn thành ghi chú. Viết MỘT TỪ cho mỗi chỗ trống. Đọc tiêu đề các phần trước khi nghe. (Số liệu trong bài là giả định.)"
        max_words: 1
        audio_text: "Good morning. Today's lecture is about the four-day working week. First, some background. The idea is simple: employees work four days instead of five, but they receive the same salary. Several companies in Europe tested it, and some Vietnamese technology firms are now trying it too. So why do companies try it? The main purpose is to reduce stress, so that staff are healthier and take fewer days off. Some firms also use it in order to recruit young workers, who care a lot about work-life balance. Moving on to the results. In most trials, productivity stayed the same or even rose. Employees reported better sleep and more time with their families. And interestingly, the number of people who resigned fell sharply. However, there were also problems. Customer service was the most difficult area, because customers expect help five days a week. Some companies solved this by using a rota, so that different teams have different days off. Finally, what about the future? Experts believe the idea will spread, but mainly in office jobs. In factories and hospitals, it will be much harder to introduce."
        passage: |-
          THE FOUR-DAY WORKING WEEK
          Background
          • Staff work 4 days but get the same (1) ___
          Reasons companies try it
          • to reduce (2) ___ → healthier staff, fewer days off
          • to (3) ___ young workers
          Results
          • productivity: same or higher
          • staff: better (4) ___, more family time
          • fewer people (5) ___
          Problems
          • hardest area: customer (6) ___
          • solution: a (7) ___ → teams have different days off
          Future
          • likely to spread mainly in (8) ___ jobs
        questions:
          - q: (1)
            answer: salary
          - q: (2)
            answer: stress
          - q: (3)
            answer: recruit
          - q: (4)
            answer: sleep
          - q: (5)
            answer: resigned
            explain_vi: "'the number of people who resigned fell sharply' → fewer people resigned. Giữ đúng dạng quá khứ để câu ghi chú đúng ngữ pháp."
          - q: (6)
            answer: service
          - q: (7)
            answer: rota
          - q: (8)
            answer: office
      - id: b39-x3
        bank_no: 22
        kind: completion
        instructions_vi: "Short-answer questions: nghe lời khuyên về phỏng vấn xin việc và trả lời câu hỏi. Viết KHÔNG QUÁ HAI TỪ cho mỗi câu. Câu hỏi 'What/Where/Who' → đoán loại thông tin trước."
        max_words: 2
        audio_text: Here are a few tips for your first job interview. Before the interview, read the company's website carefully in order to understand what they do. Many candidates forget to prepare questions for the employer, so make sure you have at least two. On the day, arrive ten minutes early so that you have time to relax. Most employers say the thing that impresses them most is not your qualifications but your attitude. And after the interview, send a short thank-you email to the person who interviewed you.
        questions:
          - q: (1)
            answer: company's website
            accept:
              - website
              - the website
          - q: (2)
            answer: questions
          - q: (3)
            answer: ten minutes
            accept:
              - 10 minutes
          - q: (4)
            answer: attitude
            accept:
              - your attitude
          - q: (5)
            answer: thank-you email
            accept:
              - an email
              - email
        passage: |-
          SHORT-ANSWER QUESTIONS — JOB INTERVIEW TIPS
          (1) What should you read before the interview?  ___
          (2) What should you prepare for the employer?  ___
          (3) How early should you arrive?  ___
          (4) What impresses employers most?  ___
          (5) What should you send after the interview?  ___
      - id: b39-x4
        bank_no: 9
        kind: combine
        instructions_vi: Nối hai câu bằng từ trong ngoặc để nói mục đích.
        questions:
          - q: She did an internship. She wanted to gain experience. (to)
            answer: She did an internship to gain experience.
          - q: He works from home. He can look after his daughter. (so that)
            answer: He works from home so that he can look after his daughter.
          - q: They left early. They didn't want to miss the train. (in order not to)
            answer: They left early in order not to miss the train.
          - q: The company offers training. It wants to keep good employees. (in order to)
            answer: The company offers training in order to keep good employees.
      - id: b39-x5
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: I'm learning English ___ a better job.
            options:
              - for find
              - for finding
              - to find
              - so that find
            answer: c
          - q: She saved money ___ she could study abroad.
            options:
              - in order to
              - so that
              - for
              - to
            answer: b
          - q: He wrote the date on his hand so as ___ the meeting.
            options:
              - not forget
              - not to forget
              - to not forgetting
              - don't forget
            answer: b
          - q: We went to the office ___ an interview.
            options:
              - for
              - to
              - so that
              - in order
            answer: a
            explain_vi: for + DANH TỪ (an interview) là đúng; for + V mới sai.
          - q: The manager changed the rota so that everyone ___ have two days off.
            options:
              - can
              - could
              - to
              - for
            answer: b
            explain_vi: Quá khứ (changed) → so that + could.
      - id: b39-x6
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: The company has 500 ___.
            base: employ
            answer: employees
          - q: My ___ pays for my English lessons.
            base: employ
            answer: employer
          - q: She got a ___ to manager after two years.
            base: promote
            answer: promotion
          - q: The ___ of new staff takes three months.
            base: recruit
            answer: recruitment
          - q: His ___ surprised everyone in the office.
            base: resign
            answer: resignation
      - id: b39-x7
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: internship
            right: a period of work to get experience, often while studying
          - left: freelance
            right: working for different companies, not for one employer
          - left: wage
            right: money paid for work, usually every hour or week
          - left: resign
            right: to leave your job by your own choice
          - left: recruit
            right: to find new people to work for a company
          - left: job satisfaction
            right: the feeling of enjoying your work
      - id: b39-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai).
        audio_text: |-
          Woman: I heard you've resigned from the bank. Is that true?
          Man: Yes. I start my new job next month, at a small tech company.
          Woman: Is the salary better?
          Man: Actually, it's a bit lower. But I can work from home three days a week, so that I don't spend two hours in traffic every day.
          Woman: That sounds good for your work-life balance.
          Man: Exactly. And they've promised me a promotion after one year if I do well.
        questions:
          - q: The man has resigned from a bank.
            answer: T
          - q: The new salary is higher.
            answer: F
          - q: He can work from home three days a week.
            answer: T
          - q: He wants to avoid spending time in traffic.
            answer: T
          - q: He will definitely get a promotion after one year.
            answer: F
            explain_vi: "'if I do well' — có điều kiện, không chắc chắn."
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 150–180 từ mô tả công việc bạn muốn làm trong 5 năm tới và những gì bạn đang/sẽ làm để đạt được. Dùng ít nhất 4 cấu trúc mục đích khác nhau (to / in order to / so as to / so that) và 6 từ của buổi này. Tự kiểm tra: không có 'for + V'; experience không có -s khi nghĩa là kinh nghiệm."
    prompt_en: Describe the job you want to have in five years and what you are doing to get it.
    words:
      min: 150
      max: 180
    minutes: 30
