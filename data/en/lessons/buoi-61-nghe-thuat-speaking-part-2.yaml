  - type: skill
    skill: speaking
    title_vi: "Speaking Part 2 — chủ đề trừu tượng: kỷ niệm, thay đổi, thành tựu"
    intro_vi: "Thẻ Part 2 không phải lúc nào cũng là người/đồ vật/địa điểm. Các chủ đề trừu tượng như 'Describe an achievement you are proud of', 'a change that improved your life', 'a time you felt nostalgic' khó hơn vì không có gì để 'tả' — bạn phải KỂ một câu chuyện có diễn biến và cảm xúc. Chìa khóa: biến ý trừu tượng thành MỘT sự việc cụ thể, kể theo trình tự trước – trong – sau."
    steps:
      - title_vi: Chọn MỘT sự việc cụ thể
        text_vi: "'An achievement' → buổi biểu diễn piano cuối năm lớp 12. Không nói chung chung 'I achieved many things'."
      - title_vi: Khung kể chuyện 4 phần
        text_vi: "Bối cảnh (khi nào, ở đâu) → trước đó (đã chuẩn bị/khó khăn gì — quá khứ hoàn thành) → khoảnh khắc chính (chi tiết giác quan: thấy, nghe, cảm thấy) → nhìn lại (ý nghĩa, thay đổi)."
      - title_vi: Ghi chú 1 phút theo khung
        text_vi: "4 dòng, mỗi dòng 3–4 từ khóa. VD: 'Dec 2022 – school hall / rehearsed 3 months, stage fright / applause, cried / confidence, turning point'."
      - title_vi: Dùng thì đa dạng một cách tự nhiên
        text_vi: Quá khứ đơn cho diễn biến chính; had + V3 / had been V-ing để quay lui; loại 3 hoặc hỗn hợp ở phần nhìn lại (If I hadn't …, I wouldn't be …).
      - title_vi: Kết thúc bằng ý nghĩa
        text_vi: "Phần 'explain why' là nơi thể hiện ý trừu tượng: 'Looking back on it, it was a turning point because…'."
    tips:
      - "Chuẩn bị sẵn 3–4 câu chuyện 'đa năng' dùng được cho nhiều thẻ: một thành tựu, một thay đổi lớn, một lần vượt qua nỗi sợ, một kỷ niệm với người thân."
      - Chi tiết cảm xúc cụ thể (my hands were shaking) thuyết phục hơn tính từ chung (I was very nervous).
      - "Nếu hết ý trước 2 phút: nói thêm về 'nếu điều đó không xảy ra thì …' (loại 3/hỗn hợp)."
    traps:
      - trap_vi: Nói chung chung, không có sự việc cụ thể.
        fix_vi: Chọn một ngày, một địa điểm, một khoảnh khắc.
      - trap_vi: "Dùng hiện tại hoàn thành cho việc trước mốc quá khứ: 'I have practised for months before the show'."
        fix_vi: I had been practising for months before the show.
      - trap_vi: Kể hết câu chuyện trong 1 phút rồi im lặng.
        fix_vi: Dành 30–40 giây cho phần nhìn lại và ý nghĩa.
    phrases:
      - en: I'd like to talk about a time when …
        vi: Tôi muốn kể về một lần …
        note_vi: Mở đầu.
      - en: Before that, I had never …
        vi: Trước đó, tôi chưa từng …
      - en: I had been … for months, so …
        vi: Tôi đã … suốt mấy tháng, nên …
      - en: I vividly remember …
        vi: Tôi nhớ rõ …
      - en: Looking back on it, it was a real turning point.
        vi: Nhìn lại, đó thực sự là một bước ngoặt.
      - en: If I hadn't …, I wouldn't be … today.
        vi: Nếu tôi đã không …, hôm nay tôi đã không …
        note_vi: Điều kiện hỗn hợp — kết bài.
    demo:
      title_vi: "Làm mẫu: Describe an achievement you are proud of"
      text_en: |-
        Cue card: Describe an achievement you are proud of. You should say: what it was, when it happened, how you achieved it, and explain why you are proud of it.

        I'd like to talk about the first time I played the piano in front of a real audience, which was at my school's end-of-year concert in December 2022.

        Before that, I had never performed on stage, and to be honest, I had terrible stage fright. My teacher had been encouraging me for ages, so in the end I agreed. For three months, I had been rehearsing every evening, sometimes until midnight.

        I vividly remember walking onto the stage. My hands were shaking and I couldn't see anyone because of the lights. But once I started playing, I forgot about the audience completely. When I finished, there was a huge round of applause, and I actually cried a little.

        Looking back on it, I'm proud not because the performance was perfect — it wasn't — but because I overcame my fear. It was a real turning point. If I hadn't done that concert, I don't think I would have the self-confidence to speak in class the way I do now.
      notes:
        - label: Bối cảnh
          text_vi: "Một sự việc cụ thể: buổi hòa nhạc cuối năm, tháng 12/2022."
        - label: had never performed / had been rehearsing
          text_vi: Quay lui về trước buổi diễn bằng quá khứ hoàn thành (tiếp diễn).
        - label: My hands were shaking
          text_vi: Chi tiết cảm giác cụ thể thay cho 'I was nervous'.
        - label: If I hadn't …, I wouldn't have …
          text_vi: Điều kiện hỗn hợp ở phần ý nghĩa — ngữ pháp band 7.
