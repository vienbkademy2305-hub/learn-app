  - type: dialogue
    title_vi: Part 3 sau thẻ 'thành tựu'
    lines:
      - speaker: Examiner
        text: Do you think people should always set ambitious goals?
        vi: Bạn có nghĩ người ta nên luôn đặt mục tiêu tham vọng không?
      - speaker: Candidate
        text: Generally yes, but only if they're realistic. Before I passed my audition, I had set a lot of goals that were simply impossible.
        vi: Nhìn chung là có, nhưng phải thực tế. Trước khi qua buổi thử giọng, tôi đã đặt rất nhiều mục tiêu không thể đạt.
      - speaker: Examiner
        text: What matters more, talent or hard work?
        vi: Điều gì quan trọng hơn, tài năng hay chăm chỉ?
      - speaker: Candidate
        text: I'd say perseverance. Many talented people give up, whereas people with dedication keep improving.
        vi: Tôi cho là sự kiên trì. Nhiều người có tài bỏ cuộc, trong khi người tận tâm thì tiến bộ mãi.
      - speaker: Examiner
        text: Do schools celebrate students' achievements enough?
        vi: Trường học có tôn vinh thành tích học sinh đủ không?
      - speaker: Candidate
        text: Only academic ones, in my experience. In hindsight, if my school had celebrated music more, more students would have joined the choir.
        vi: Theo trải nghiệm của tôi thì chỉ thành tích học tập. Giờ nghĩ lại, nếu trường tôn vinh âm nhạc hơn thì đã có nhiều bạn tham gia dàn hợp xướng hơn.
  - type: exercises
    items:
      - id: b61-x1
        bank_no: 6
        kind: verb-form
        instructions_vi: "Chia động từ trong ngoặc: quá khứ đơn, quá khứ hoàn thành hoặc quá khứ hoàn thành tiếp diễn."
        questions:
          - q: When I got to the theatre, the play (already / start) ___.
            answer: had already started
          - q: I (never / sing) ___ in public before that night.
            answer: had never sung
          - q: We were exhausted because we (rehearse) ___ for six hours.
            answer: had been rehearsing
          - q: After I had passed the audition, I (call) ___ my parents.
            answer: called
          - q: She was nervous because she (not / perform) ___ for years.
            answer: had not performed
            accept:
              - hadn't performed
      - id: b61-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: By the time the applause stopped, I ___ to cry.
            options:
              - have started
              - had started
              - had been started
              - start
            answer: b
          - q: I ___ her for ten years when we formed the band.
            options:
              - had been knowing
              - had known
              - have known
              - know
            answer: b
          - q: Getting my first job was an important ___ in my life.
            options:
              - milestone
              - applause
              - stage fright
              - genre
            answer: a
          - q: The concert gave me a real sense of ___.
            options:
              - accomplish
              - accomplished
              - accomplishment
              - accomplishing
            answer: c
          - q: Which is the best start for 'Describe a change that improved your life'?
            options:
              - Changes are important in life.
              - I'd like to talk about the time I moved to Da Nang for university, which was a real turning point.
              - I have many changes.
              - Life is always changing, as they say.
            answer: b
      - id: b61-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank:
          - stage fright
          - turning point
          - perseverance
          - nostalgic
          - rewarding
          - vividly
          - overcame
          - round of applause
        questions:
          - q: Looking at old photos always makes me feel ___.
            answer: nostalgic
          - q: Moving to the city was a ___ in my career.
            answer: turning point
          - q: Teaching children is hard but very ___.
            answer: rewarding
          - q: I still ___ remember my first day at school.
            answer: vividly
          - q: Learning a language takes time and ___.
            answer: perseverance
          - q: Many famous singers still suffer from ___.
            answer: stage fright
          - q: The audience gave the dancers a huge ___.
            answer: round of applause
          - q: She finally ___ her fear of flying.
            answer: overcame
      - id: b61-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Câu trả lời Part 2 (đã chép ra) có 5 lỗi. Sửa trực tiếp.
        text: I'd like to talk about my first competition. Before that day, I have never competed in a big event. I have been practising for months, so I felt ready. When I arrived, the competition already started. The audience gave me an applause. It was a unforgettable experience.
        errors:
          - wrong: I have never competed
            right: I had never competed
            why: Trước mốc quá khứ 'that day' → had + V3.
          - wrong: I have been practising
            right: I had been practising
            why: Kéo dài đến trước mốc quá khứ → had been V-ing.
          - wrong: the competition already started
            right: the competition had already started
            why: Bắt đầu trước khi tôi đến → had started.
          - wrong: gave me an applause
            right: gave me a round of applause
            why: applause không đếm được.
          - wrong: a unforgettable
            right: an unforgettable
            why: Trước nguyên âm /ʌ/ dùng an.
      - id: b61-x5
        bank_no: 30
        kind: speaking-part2
        instructions_vi: Chuẩn bị 1 phút (ghi chú 4 dòng theo khung bối cảnh → trước đó → khoảnh khắc → nhìn lại), nói 2 phút, ghi âm. Dùng ít nhất 1 câu quá khứ hoàn thành và 1 câu loại 3/hỗn hợp.
        cue_card:
          topic: Describe an important change in your life.
          points:
            - what the change was
            - when it happened
            - how you felt about it at first
            - and explain how it has affected your life
        sample: I'd like to talk about the time I changed my university major from accounting to design. Before that, I had been studying accounting for a year, and to be honest, I had never felt interested in it…
      - id: b61-x6
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe một thí sinh nói Part 2 và trả lời giám khảo (hai giọng), rồi chọn đáp án đúng.
        audio_text: |-
          Examiner: Now, I'd like you to describe a time when you felt proud of yourself.
          Candidate: I'd like to talk about the day I finished my first half marathon. Before that, I had never run more than five kilometres. I had been training for four months, but two weeks before the race, I hurt my knee.
          Examiner: Did you think about giving up?
          Candidate: Definitely. But my coach said I could walk part of the way. On the day, I ran the first fifteen kilometres and walked the rest. When I crossed the finish line, my family were cheering. It was unforgettable.
          Examiner: How has it affected you?
          Candidate: It gave me a lot of self-confidence. If I hadn't finished that race, I don't think I would have applied for my current job.
        questions:
          - q: Before the race, what was the longest distance she had run?
            options:
              - two kilometres
              - five kilometres
              - fifteen kilometres
              - a half marathon
            answer: b
          - q: What happened two weeks before the race?
            options:
              - She got ill.
              - She hurt her knee.
              - She changed coach.
              - She stopped training.
            answer: b
          - q: How did she finish the race?
            options:
              - She ran all the way.
              - She walked part of the way.
              - She didn't finish.
              - She finished first.
            answer: b
          - q: What does she say about her job?
            options:
              - She lost it after the race.
              - The race gave her confidence to apply for it.
              - Her coach found it for her.
              - She applied before the race.
            answer: b
      - id: b61-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe đoạn kể chuyện rồi chọn T (đúng) hoặc F (sai).
        audio_text: "When I was sixteen, I joined a drama club. I had always been very shy, and I had never spoken in front of more than five people. For the end-of-year show, the teacher gave me a small role with only three lines. We had been rehearsing for weeks, but on the night I forgot my first line. Luckily, another actor helped me, and nobody in the audience noticed. Looking back on it, that night was a turning point: I stopped being afraid of making mistakes."
        questions:
          - q: The speaker was confident before joining the drama club.
            answer: F
          - q: The speaker had a large role in the show.
            answer: F
          - q: The speaker forgot a line during the show.
            answer: T
          - q: The audience realised there was a mistake.
            answer: F
          - q: The speaker thinks the experience was important.
            answer: T
      - id: b61-x8
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với nghĩa tiếng Anh.
        pairs:
          - left: milestone
            right: an important event in your development
          - left: perseverance
            right: continuing to try even when something is difficult
          - left: in hindsight
            right: thinking about the past with the knowledge you have now
          - left: audition
            right: a short performance to test if someone is good enough for a role
          - left: nostalgic
            right: feeling happy and a little sad when you remember the past
          - left: rewarding
            right: making you feel satisfied that you did it
  - type: homework
    kind: speaking
    prompt_vi: "Chuẩn bị 3 câu chuyện 'đa năng' (một thành tựu, một thay đổi, một lần vượt qua nỗi sợ). Ghi âm 2 thẻ dưới đây, mỗi thẻ 2 phút. Nghe lại: đếm số câu quá khứ hoàn thành và loại 3/hỗn hợp; kiểm tra bạn có dành 30 giây cho phần ý nghĩa không."
    prompt_en: 1. Describe a time when you felt nostalgic. 2. Describe something difficult you did that you are proud of.
