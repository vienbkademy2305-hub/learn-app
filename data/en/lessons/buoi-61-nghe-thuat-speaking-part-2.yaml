      - word: overcome|v
        text_vi: "o-ver-COME: nhấn âm cuối (quá khứ o-ver-CAME). Khi kể chuyện: I had → I'd /aɪd/. 'I'd never been so nervous' — nghe dạng rút gọn này rất tự nhiên."
