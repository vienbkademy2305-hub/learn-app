  - type: skill
    skill: listening
    title_vi: Listening — Matching và note completion
    intro_vi: "Matching: bạn ghép một danh sách câu hỏi (người, địa điểm, hoạt động) với một danh sách phương án A–G. Thường gặp ở Part 2 và Part 3 (hai sinh viên và giảng viên bàn luận). Số phương án NHIỀU HƠN số câu hỏi, và người nói thường nhắc tới nhiều phương án cho cùng một câu hỏi rồi mới chốt. Note completion: điền từ vào một bản ghi chú có tiêu đề và gạch đầu dòng — cách làm giống điền form (Buổi 23), nhưng thông tin học thuật hơn và hay bị paraphrase."
    steps:
      - title_vi: Matching — đọc câu hỏi (danh sách bên trái)
        text_vi: Đây là các mốc sẽ được nhắc THEO THỨ TỰ (the eldest child, a middle child…). Gạch tên từng mục để nghe ra khi người nói chuyển sang mục đó.
      - title_vi: Matching — đọc và đoán paraphrase các phương án A–G
        text_vi: Phương án gần như không bao giờ được nói nguyên văn. 'low risk of injury' có thể thành 'you're unlikely to hurt yourself'; 'not dependent on season' thành 'you can do it all year round'. Viết 1–2 từ gợi ý cạnh mỗi phương án.
      - title_vi: Matching — nghe hết ý rồi mới chọn
        text_vi: "Người nói có thể nhắc một phương án rồi bác: 'Some people think it's sociable, but actually…'. Ghi chữ cái sau khi ý kết thúc. Phương án dùng rồi thường không lặp lại (trừ khi đề cho phép)."
      - title_vi: Note completion — đọc tiêu đề và gạch đầu dòng
        text_vi: Tiêu đề cho biết chủ đề; mỗi gạch đầu dòng là một ý. Đoán loại từ cho từng chỗ trống (danh từ? số? tính từ?) và đọc giới hạn từ.
      - title_vi: Note completion — nghe từ khóa, điền, kiểm tra
        text_vi: Ghi chú dùng từ khác bài nói. Khi nghe thấy ý khớp, điền đúng từ bạn nghe. Cuối cùng kiểm tra chính tả, số ít/số nhiều, giới hạn từ.
    tips:
      - Trong bài có hai người tranh luận (Part 3), đáp án là điều họ ĐỒNG Ý CUỐI CÙNG, không phải ý kiến đầu tiên.
      - Người nói hay thuật lại lời người khác (My tutor said…, The report mentioned…). Nghe kỹ AI là chủ thể của ý kiến.
      - "Note completion: đáp án phổ biến nhất là danh từ; chính tả sai = mất điểm, kể cả từ quen như 'environment', 'government'."
    traps:
      - trap_vi: Chọn phương án đầu tiên được nhắc tới.
        fix_vi: "Đợi xác nhận: 'So, that's the main advantage' / 'I'd say the most important thing is…'."
      - trap_vi: Nhầm ý kiến của hai người trong hội thoại.
        fix_vi: "Ghi chú kiểu 'M: …  W: …' khi nghe. Câu hỏi hỏi 'According to the woman…' thì chỉ lấy ý của người phụ nữ."
      - trap_vi: "Viết thiếu -s: bài nói 'high rents', bạn ghi 'rent'."
        fix_vi: Đây là lỗi quên -s quen thuộc của bạn — đọc lại cả câu ghi chú với đáp án để kiểm tra.
    phrases:
      - en: What about …?
        vi: Còn … thì sao?
        note_vi: Chuyển sang mục tiếp theo trong câu hỏi matching.
      - en: The main advantage of … is that …
        vi: Ưu điểm chính của … là …
      - en: I'm not sure about that. I think …
        vi: Tớ không chắc lắm. Tớ nghĩ …
        note_vi: Người nói bác ý cũ — đổi đáp án.
      - en: According to the report, …
        vi: Theo báo cáo, …
      - en: She said that …
        vi: Cô ấy nói rằng …
        note_vi: Tường thuật — ý kiến của người thứ ba.
    demo:
      title_vi: "Làm mẫu: matching với paraphrase và bẫy"
      text_en: |-
        Question: What problem does the speaker mention for each area?
        1  Riverside    2  Old Town
        A  noise   B  high rents   C  traffic congestion   D  lack of parks

        Speaker: "Riverside is lovely and green, with lots of parks. But because so many people want to live there, flats now cost twice as much as five years ago. As for the Old Town, people often think the traffic is the problem, but it's actually closed to cars. The real issue is the bars — they stay open until 2 a.m., so residents can't sleep."
      notes:
        - label: Riverside → B
          text_vi: "'lots of parks' loại D. 'flats now cost twice as much' = high rents (paraphrase)."
        - label: Old Town → A
          text_vi: "'people often think the traffic… but it's actually closed to cars' → C bị bác. 'bars… residents can't sleep' = noise."
