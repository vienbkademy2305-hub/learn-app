  - type: pronunciation
    notes:
      - sound: snd-s
        text_vi: "Đuôi -s đọc /s/ sau âm vô thanh /p t k f/: works, cooks, gets."
      - sound: snd-z
        text_vi: "Đuôi -s đọc /z/ sau nguyên âm và âm hữu thanh: goes, does, reads, plays."
      - word: watch|v
        text_vi: "Đuôi -es sau s, sh, ch, x đọc /ɪz/ thành thêm 1 âm tiết: watch-es, relax-es, wash-es."
      - word: usually|adv
        text_vi: "U-su-al-ly /ˈjuː.ʒu.ə.li/: âm /ʒ/ giống 'gi' nhẹ, trọng âm âm đầu."
      - text_vi: does /dʌz/ và doesn't /ˈdʌz.ənt/ — không đọc 'đốt'.
