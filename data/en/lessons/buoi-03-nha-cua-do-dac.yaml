  - type: pronunciation
    notes:
      - sound: snd-ea
        text_vi: "/eə/ trong chair, stairs, there, where: bắt đầu từ /e/ rồi lướt nhẹ về /ə/. Anh-Mỹ đọc có /r/: /tʃer/."
      - sound: snd-ie
        text_vi: "/ɪə/ trong here, near: bắt đầu từ /ɪ/ lướt về /ə/. Phân biệt here /hɪə/ với hair /heə/."
      - word: stairs|n
        text_vi: Anh-Anh không đọc r cuối (/steəz/), nhưng phải đọc -s /z/ ở cuối.
      - text_vi: There is thường nối thành there's /ðeəz/; nhớ /ð/ của Buổi 2.
      - word: kitchen|n
        text_vi: KIT-chen /ˈkɪtʃ.ən/ — âm /tʃ/ ở giữa, đừng đọc thành chicken.
      - { word: leather|n, text_vi: "leather /ˈleð.ə/: th đọc /ð/ rung (như mother), không đọc /d/." }
      - { word: garage|n, text_vi: "garage: Anh-Anh /ˈɡær.ɑːʒ/ (GA-rage), Anh-Mỹ /ɡəˈrɑːʒ/ (ga-RAGE) — cả hai đều đúng." }
