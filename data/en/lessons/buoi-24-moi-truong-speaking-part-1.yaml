  - type: skill
    skill: speaking
    title_vi: Speaking Part 1 — trả lời mở rộng (không trả lời cụt)
    intro_vi: "Part 1 kéo dài 4–5 phút: giám khảo hỏi 10–12 câu về bạn, công việc/học tập, quê hương và 2 chủ đề quen thuộc (thời tiết, công viên, cây cối…). Bốn tiêu chí chấm, mỗi tiêu chí 25%: Fluency & Coherence (trôi chảy, mạch lạc), Lexical Resource (từ vựng), Grammatical Range & Accuracy (ngữ pháp), Pronunciation (phát âm). Trả lời 'Yes.' hay 'I like it.' không cho giám khảo đủ dữ liệu để chấm band 5 trở lên. Mục tiêu: 2–4 câu, khoảng 15–25 giây mỗi câu hỏi."
    steps:
      - title_vi: Trả lời thẳng câu hỏi (Answer)
        text_vi: "Câu đầu trả lời đúng điều được hỏi, bằng một câu hoàn chỉnh — không chỉ 'Yes' hay 'Park'. Có thể mượn từ trong câu hỏi nhưng nên đổi cách nói: Do you like parks? → Yes, I really enjoy going to parks."
      - title_vi: Thêm lý do (Reason)
        text_vi: because / so / since … Lý do làm câu trả lời có logic và tự nhiên kéo dài thêm một câu.
      - title_vi: Thêm ví dụ hoặc chi tiết (Example/Detail)
        text_vi: "Ai, ở đâu, bao lâu một lần, lần gần nhất thế nào: For example, last weekend I … / I usually go there twice a week with …"
      - title_vi: Dừng đúng lúc
        text_vi: Part 1 không cần nói quá 30 giây. Nói 2–4 câu rồi dừng, để giám khảo hỏi tiếp — nói lan man cũng bị trừ điểm mạch lạc.
      - title_vi: Nói tự nhiên, không học thuộc
        text_vi: Giám khảo nhận ra câu học thuộc (ngữ điệu đều, từ quá 'sang' so với phần còn lại) và sẽ chuyển chủ đề. Chuẩn bị Ý, không chuẩn bị nguyên câu.
    tips:
      - Câu hỏi 'Do you…?' → trả lời có/không + lý do. 'How often…?' → trạng từ tần suất + dịp cụ thể. 'Which do you prefer…?' → prefer … to … + lý do.
      - "Dùng thì đúng câu hỏi: 'Did you… as a child?' → quá khứ đơn; 'Have you ever…?' → Yes, I have + chi tiết ở quá khứ đơn."
      - "Cần thời gian nghĩ? Dùng câu đệm tự nhiên: 'Well, let me think…', 'That's an interesting question.' — thay vì im lặng hoặc 'ờ…'."
      - "Không biết từ? Diễn đạt vòng: 'the place where they put rubbish' thay vì dừng lại."
    traps:
      - trap_vi: "Trả lời một từ: 'Do you like trees?' – 'Yes.'"
        fix_vi: "Answer + Reason + Detail: 'Yes, I do. They make the air fresher, and there's a big tree outside my window that gives shade in summer.'"
      - trap_vi: "Lặp nguyên câu hỏi: 'Do you like parks?' – 'Yes, I like parks.'"
        fix_vi: "Đổi cách nói: 'Yes, I really enjoy going to parks…' / 'Yes, I'm quite keen on them…'"
      - trap_vi: "Dùng một cấu trúc cho mọi câu: I like… I like… I like…"
        fix_vi: Luân phiên enjoy, be keen on, prefer … to …, would rather, don't mind.
      - trap_vi: Học thuộc một đoạn dài 'thuộc lòng' cho mỗi chủ đề.
        fix_vi: Chuẩn bị 2–3 ý + từ vựng theo chủ đề, luyện nói lại mỗi lần một khác.
    phrases:
      - en: To be honest, …
        vi: Thật lòng mà nói, …
      - en: Actually, …
        vi: Thật ra, …
        note_vi: Dùng khi câu trả lời hơi khác mong đợi.
      - en: Well, it depends.
        vi: À, cái đó còn tùy.
        note_vi: "Sau đó phải nói tùy vào gì: It depends on the weather."
      - en: The main reason is that …
        vi: Lý do chính là …
      - en: For example, last weekend I …
        vi: Ví dụ, cuối tuần trước tôi …
      - en: Let me think …
        vi: Để tôi nghĩ chút …
    demo:
      title_vi: "Làm mẫu: từ trả lời cụt đến trả lời band 6"
      text_en: |-
        Examiner: Do you like spending time in nature?

        Band 4: Yes, I like.

        Band 6: Yes, I really do. The main reason is that I live in a noisy part of the city, so being in nature helps me relax. For example, every Sunday morning I go for a walk around Hoan Kiem Lake to get some fresh air before the streets get busy.
      notes:
        - label: Yes, I like.
          text_vi: "Cụt, sai ngữ pháp (like cần tân ngữ: I like it)."
        - label: Yes, I really do.
          text_vi: "Answer: trả lời thẳng, câu hoàn chỉnh, không lặp nguyên câu hỏi."
        - label: The main reason is that … so …
          text_vi: "Reason: có lý do + câu ghép với so."
        - label: For example, every Sunday morning I …
          text_vi: "Detail: ví dụ cụ thể (khi nào, ở đâu, làm gì) + từ vựng chủ đề: go for a walk, fresh air."
        - label: Độ dài
          text_vi: 3 câu, khoảng 20 giây — vừa đủ cho Part 1.
