  - type: dialogue
    title_vi: "Mô phỏng Speaking Part 1: chủ đề công viên & thiên nhiên"
    lines:
      - speaker: Examiner
        text: Let's talk about parks. Are there many parks where you live?
        vi: Chúng ta nói về công viên nhé. Nơi bạn sống có nhiều công viên không?
      - speaker: Candidate
        text: Not really. I live in the city centre, and there are only a few small green spaces, so people often go to one big park at weekends.
        vi: Không nhiều lắm. Tôi sống ở trung tâm, chỉ có vài không gian xanh nhỏ, nên cuối tuần mọi người thường kéo đến một công viên lớn.
      - speaker: Examiner
        text: How often do you go to a park?
        vi: Bạn có hay đi công viên không?
      - speaker: Candidate
        text: About twice a week. I usually go for a walk after dinner because it helps me relax after a long day.
        vi: Khoảng hai lần một tuần. Tôi thường đi dạo sau bữa tối vì nó giúp tôi thư giãn sau một ngày dài.
      - speaker: Examiner
        text: Do you prefer the countryside or the city?
        vi: Bạn thích nông thôn hay thành phố hơn?
      - speaker: Candidate
        text: Well, I prefer the countryside to the city. The air is fresher and it's much more peaceful, but I'd rather work in the city because there are more jobs.
        vi: À, tôi thích nông thôn hơn thành phố. Không khí trong lành hơn và yên bình hơn nhiều, nhưng tôi lại muốn làm việc ở thành phố vì có nhiều việc hơn.
      - speaker: Examiner
        text: Did you often play outside when you were a child?
        vi: Hồi nhỏ bạn có hay chơi ngoài trời không?
      - speaker: Candidate
        text: Yes, all the time. I grew up in a village, so my friends and I played in the rice fields and swam in the river every summer.
        vi: Có, suốt ngày. Tôi lớn lên ở làng, nên mùa hè nào tôi và bạn bè cũng chơi ngoài đồng và bơi ở sông.
      - speaker: Examiner
        text: Have you ever planted a tree?
        vi: Bạn đã bao giờ trồng cây chưa?
      - speaker: Candidate
        text: Yes, I have. Last year my company planted trees near the river, and I planted two small mango trees. I'm really keen on doing things like that.
        vi: Rồi. Năm ngoái công ty tôi trồng cây gần bờ sông, và tôi trồng hai cây xoài nhỏ. Tôi rất thích làm những việc như vậy.
  - type: exercises
    items:
      - id: b24-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn câu trả lời Speaking Part 1 tốt nhất (đúng ý, có lý do/chi tiết, đúng ngữ pháp).
        questions:
          - q: Do you like rainy days?
            options:
              - Yes.
              - Yes, I like rainy days.
              - Not really. I'm not very keen on them because the streets in my city get flooded, so going to work takes much longer.
              - Rainy days are days when it rains.
            answer: c
          - q: How often do you go to the countryside?
            options:
              - I go to the countryside.
              - About once a month. My grandparents live in a village near Nam Dinh, so I visit them and enjoy the fresh air there.
              - Countryside is very peaceful and beautiful and green and quiet and nice.
              - Never, because I am never.
            answer: b
          - q: Which do you prefer, the mountains or the beach?
            options:
              - I prefer the beach than the mountains.
              - I prefer the beach to the mountains because I love swimming, and the seafood is great.
              - Beach.
              - I would rather to go to the beach.
            answer: b
            explain_vi: a sai 'than'; d sai 'rather to'.
          - q: Is there much pollution where you live?
            options:
              - Yes, there is. The air is quite polluted because of the traffic, especially in the morning when everyone goes to work.
              - Yes, there are many pollutions.
              - Pollution is bad.
              - Yes, very pollution.
            answer: a
            explain_vi: pollution không đếm được — không có 'many pollutions'.
      - id: b24-x2
        bank_no: 6
        kind: verb-form
        instructions_vi: "Chia động từ trong ngoặc: V-ing, to V hay nguyên mẫu?"
        questions:
          - q: I'm really keen on (hike) ___ in the mountains.
            answer: hiking
          - q: I'd rather (stay) ___ at home on rainy days.
            answer: stay
          - q: She prefers (cycle) ___ to driving.
            answer: cycling
          - q: I don't mind (walk) ___ to work.
            answer: walking
          - q: My brother is interested in (plant) ___ trees.
            answer: planting
          - q: I can't stand (sit) ___ in traffic jams.
            answer: sitting
          - q: We decided (go) ___ camping last weekend.
            answer: to go
            explain_vi: decide + to V (ôn Buổi 16).
      - id: b24-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu dùng từ trong ngoặc, nghĩa không đổi.
        questions:
          - q: I like walking more than driving. (prefer)
            answer: I prefer walking to driving.
          - q: I want to stay at home more than go out tonight. (rather)
            answer: I would rather stay at home than go out tonight.
            accept:
              - I'd rather stay at home than go out tonight.
          - q: I really like camping. (keen)
            answer: I am really keen on camping.
            accept:
              - I'm really keen on camping.
              - I am keen on camping.
              - I'm keen on camping.
          - q: I hate noisy streets. (stand)
            answer: I can't stand noisy streets.
            accept:
              - I cannot stand noisy streets.
          - q: Nature interests me a lot. (interested)
            answer: I am very interested in nature.
            accept:
              - I'm very interested in nature.
              - I am really interested in nature.
              - I'm really interested in nature.
      - id: b24-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Câu trả lời Part 1 này có 5 lỗi. Sửa trực tiếp.
        text: Yes, I like. I prefer the countryside than the city because the air is fresh there. I am keen on go fishing with my father. My hometown is very peace and quiet. I would rather to live there when I retire.
        errors:
          - wrong: Yes, I like.
            right: Yes, I like it.
            why: like cần tân ngữ; hoặc 'Yes, I do.'
          - wrong: countryside than the city
            right: countryside to the city
            why: prefer A to B.
          - wrong: keen on go fishing
            right: keen on going fishing
            why: Sau on dùng V-ing.
          - wrong: very peace and quiet
            right: very peaceful and quiet
            why: "Sau very cần tính từ: peaceful."
          - wrong: would rather to live
            right: would rather live
            why: would rather + V nguyên mẫu không to.
      - id: b24-x5
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: countryside
            right: land outside towns and cities
            with fields and farms: null
          - left: peaceful
            right: calm and quiet
          - left: polluted
            right: dirty because of harmful things like smoke or chemicals
          - left: green space
            right: an area of grass or trees in a town
          - left: outdoor
            right: happening outside
            not in a building: null
      - id: b24-x6
        bank_no: 29
        kind: speaking-part1
        instructions_vi: "Trả lời từng câu theo công thức Answer + Reason + Detail (2–4 câu, 15–25 giây). Ghi âm, nghe lại và tự kiểm tra: có câu nào chỉ 1–2 từ không? Có lặp 'I like' không?"
        questions:
          - q: Do you like spending time outdoors? Why?
          - q: Is your hometown a good place for people who like nature?
          - q: Do you prefer living in a city or in the countryside?
          - q: Is there much pollution where you live?
          - q: What do you do to protect the environment?
        sample: I try to do small things. For example, I always carry a reusable bottle, so I don't buy plastic ones, and I sort my rubbish at home. It isn't much, but I think if everyone does it, it really helps.
      - id: b24-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Examiner: Do you prefer living in the city or in the countryside?
          Candidate: To be honest, I prefer the countryside. The air is fresher, and it's much more peaceful.
          Examiner: Do you often go to parks?
          Candidate: Not very often, because there aren't many green spaces near my home. But I go for a walk by the lake on Sundays.
          Examiner: Are you keen on outdoor activities?
          Candidate: Yes, I'm really keen on cycling. I'd rather cycle than drive.
        questions:
          - { q: Where does the candidate prefer to live?, options: [ in the city, in the countryside, near a lake, abroad ], answer: b }
          - { q: Why doesn't she often go to parks?, options: [ She is too busy., There aren't many green spaces near her home., She doesn't like nature., Parks are expensive. ], answer: b }
          - { q: What is she keen on?, options: [ driving, cycling, swimming, gardening ], answer: b }
      - id: b24-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: I grew up in a small village in Nghe An. Now I live in Ho Chi Minh City. The city is noisy and polluted, but there are more jobs. I'd rather live in my village, but I can't find work there. At weekends I sometimes go back home to enjoy the fresh air.
        questions:
          - { q: The speaker grew up in a big city., answer: F }
          - { q: Ho Chi Minh City is quiet and clean., answer: F }
          - { q: He would rather live in his village., answer: T }
          - { q: He sometimes goes back home at weekends., answer: T }
  - type: homework
    kind: speaking
    prompt_vi: "Ghi âm câu trả lời cho 6 câu Part 1 dưới đây, mỗi câu 20–30 giây, không đọc giấy. Nghe lại và ghi vào vở: (1) câu nào dưới 2 câu, (2) lỗi -s/-ed cuối từ, (3) đã dùng được những cấu trúc sở thích nào (keen on, prefer … to, would rather). Nộp bản ghi âm hoặc chép lại lời nói của mình để chữa vào buổi sau."
    prompt_en: 1. Where do you live? 2. What do you like about your area? 3. Do you often go to parks? 4. Do you prefer hot or cold weather? 5. Did you spend much time outdoors as a child? 6. Have you ever joined an environmental activity?
    minutes: 20
