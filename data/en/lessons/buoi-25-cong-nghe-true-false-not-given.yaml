  - type: grammar
    items:
      - en-g2-05
  - type: skill
    skill: reading
    title_vi: Reading — True / False / Not Given (và Yes / No / Not Given)
    intro_vi: "Dạng câu hỏi gặp nhiều nhất trong IELTS Reading và cũng khiến người Việt mất điểm nhiều nhất. Cho một loạt nhận định, bạn quyết định: TRUE — bài đọc nói đúng như vậy; FALSE — bài đọc nói NGƯỢC LẠI; NOT GIVEN — bài đọc không có thông tin để khẳng định hay phủ định. Dạng Yes / No / Not Given làm y hệt, nhưng so với QUAN ĐIỂM của tác giả thay vì sự kiện."
    steps:
      - title_vi: Gạch từ khóa trong nhận định
        text_vi: "Ba loại: CHỦ THỂ (ai/cái gì), HÀNH ĐỘNG/TÍNH CHẤT, và TỪ HẠN ĐỊNH (all, only, most, always, never, the first, more than). Từ hạn định là nơi hay 'cài bẫy' nhất."
      - title_vi: Scan tìm đúng chỗ trong bài
        text_vi: "Dùng tên riêng, số, thuật ngữ để định vị. Câu hỏi đi theo thứ tự bài đọc: đáp án câu 4 nằm sau câu 3."
      - title_vi: Đọc kỹ 2–3 câu quanh đó
        text_vi: "So sánh TỪNG phần của nhận định với bài: chủ thể có đúng không? hành động? mức độ, số lượng, thời gian?"
      - title_vi: Quyết định bằng ba câu hỏi
        text_vi: Bài có nói đúng ý này không? → TRUE. Bài có nói điều NGƯỢC LẠI không? → FALSE. Bài không đề cập, hoặc chỉ nói một phần mà không đủ để kết luận? → NOT GIVEN.
      - title_vi: Chỉ dựa vào bài đọc
        text_vi: Không dùng hiểu biết bên ngoài. Một nhận định đúng ngoài đời vẫn là NOT GIVEN nếu bài không nói tới.
    tips:
      - "Câu NOT GIVEN thường thêm một chi tiết nhỏ mà bài không có: một so sánh (more popular than), một lý do (because…), một ngôi thứ (the first, the most)."
      - FALSE cần một câu trong bài MÂU THUẪN trực tiếp. Nếu không chỉ ra được câu mâu thuẫn đó → nghiêng về NOT GIVEN.
      - Thường mỗi bộ câu hỏi có đủ cả T, F và NG — nếu chưa có NG nào, xem lại.
      - "Không kẹt quá 2 phút một câu: đánh dấu, làm câu sau, quay lại cuối giờ. Không bao giờ bỏ trống."
    traps:
      - trap_vi: Không tìm thấy thông tin trong bài → chọn FALSE.
        fix_vi: "Không thấy = NOT GIVEN. FALSE chỉ khi bài nói ngược lại. (Lỗi bạn hay mắc — luôn tự hỏi: 'Câu nào trong bài phủ định điều này?')"
      - trap_vi: Bài có hai đối tượng giống nhau (hai công ty, hai ứng dụng, bố mẹ ruột và bố mẹ vợ…) → lấy thông tin của đối tượng này gán cho đối tượng kia.
        fix_vi: "Kiểm tra CHỦ THỂ trước tiên: ai/cái gì thực sự làm việc đó? Đọc kỹ từ đứng trước who/which và các đại từ he, it, they."
      - trap_vi: Thấy trùng từ khóa là chọn TRUE.
        fix_vi: "So từ hạn định: 'most users' ≠ 'all users'; 'increased' ≠ 'doubled'; 'can' ≠ 'always'."
      - trap_vi: "Nhầm dạng: đề Yes/No/NG mà ghi True/False."
        fix_vi: Đọc kỹ yêu cầu và ghi đúng ký hiệu — ghi sai loại là mất điểm.
    phrases:
      - en: all / every – most – many / some – few – none
        vi: tất cả – phần lớn – nhiều/một số – ít – không ai
        note_vi: Đổi từ hạn định là đổi nghĩa.
      - en: always – usually – sometimes – rarely – never
        vi: luôn luôn – thường – thỉnh thoảng – hiếm khi – không bao giờ
      - en: only / just
        vi: chỉ
        note_vi: Thêm 'only' vào nhận định thường tạo câu FALSE hoặc NOT GIVEN.
      - en: the first / the largest / the most popular
        vi: đầu tiên / lớn nhất / phổ biến nhất
        note_vi: Bài phải nói rõ ngôi thứ này thì mới là TRUE.
      - en: more than / less than / twice as many as
        vi: hơn / ít hơn / gấp đôi
    demo:
      title_vi: "Làm mẫu: bốn nhận định, bốn cách suy luận"
      text_en: |-
        Two Vietnamese start-ups, GreenRide and FastFood, launched their mobile apps in 2019. GreenRide, which offers electric motorbike taxis, now has about two million users, mostly in Hanoi. FastFood delivers meals in Ho Chi Minh City and Da Nang. Last year FastFood's number of users doubled, but the company has not made a profit yet.

        1. GreenRide's app was launched in 2019.
        2. Most GreenRide users live in Ho Chi Minh City.
        3. GreenRide is the most popular taxi app in Vietnam.
        4. GreenRide's users doubled last year.
      notes:
        - label: 1 → TRUE
          text_vi: "'Two start-ups, GreenRide and FastFood, launched their mobile apps in 2019' — khớp chủ thể, hành động, thời gian."
        - label: 2 → FALSE
          text_vi: "Bài: 'mostly in Hanoi' — nói NGƯỢC với Ho Chi Minh City. Có câu mâu thuẫn trực tiếp → FALSE."
        - label: 3 → NOT GIVEN
          text_vi: Bài nói có hai triệu người dùng, nhưng không so với app nào khác. 'the most popular' là chi tiết thêm → NOT GIVEN.
        - label: 4 → NOT GIVEN (bẫy chủ thể)
          text_vi: Người dùng tăng gấp đôi là của FASTFOOD, không phải GreenRide. Bài không nói gì về GreenRide năm ngoái → NOT GIVEN. Nếu không kiểm tra chủ thể, bạn sẽ chọn nhầm TRUE vì thấy trùng từ 'doubled'.
