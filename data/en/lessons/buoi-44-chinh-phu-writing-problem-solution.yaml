  - type: skill
    skill: writing
    title_vi: Writing Task 2 — Problem / Solution (nguyên nhân và giải pháp)
    intro_vi: "Đề nêu một vấn đề xã hội và hỏi hai câu, thường là: 'What are the causes (hoặc problems/effects) of this? What solutions can you suggest?'. Đây là dạng 'two-part question': phải trả lời ĐỦ CẢ HAI câu hỏi, và thường không cần nêu quan điểm đồng ý/không đồng ý. Bố cục 4 đoạn: Mở bài → Thân bài 1 (nguyên nhân/vấn đề) → Thân bài 2 (giải pháp) → Kết bài. Mẹo quan trọng nhất: mỗi giải pháp nên trả lời đúng một nguyên nhân đã nêu."
    steps:
      - title_vi: Đọc kỹ hai câu hỏi
        text_vi: causes (nguyên nhân) khác problems/effects (hậu quả). Viết nhầm hậu quả khi đề hỏi nguyên nhân là lạc đề một nửa bài.
      - title_vi: Brainstorm 2 nguyên nhân → 2 giải pháp tương ứng
        text_vi: "Ghép thành cặp: nguyên nhân 1 ↔ giải pháp 1, nguyên nhân 2 ↔ giải pháp 2. Bài sẽ logic và Coherence tốt."
      - title_vi: "Mở bài: paraphrase + hướng bài"
        text_vi: "'In recent years, … has become a serious issue in many countries. This essay will examine the main causes of this problem and suggest some effective solutions.'"
      - title_vi: "Thân bài 1: nguyên nhân"
        text_vi: "'There are two main causes of this problem. The first is that … This leads to … Another cause is …' Mỗi nguyên nhân có giải thích hoặc ví dụ."
      - title_vi: "Thân bài 2: giải pháp"
        text_vi: "'Several measures could be taken to tackle this issue. Firstly, the government should … This would … Secondly, … can be addressed by + V-ing.' Nói rõ AI làm và VÌ SAO hiệu quả."
      - title_vi: "Kết bài: tóm tắt"
        text_vi: "'In conclusion, … is mainly caused by … and …, but it can be tackled if …'. Có thể dùng câu điều kiện loại 1."
    tips:
      - "Giải pháp cụ thể > giải pháp chung chung: 'tax sugary drinks' tốt hơn 'the government should do something'."
      - "Dùng bị động modal (Buổi 43) cho giải pháp: 'Stricter penalties should be introduced.'"
      - "Xoay vòng từ: problem / issue / challenge; solve / tackle / address; cause / lead to / result in."
    traps:
      - trap_vi: Viết hậu quả khi đề hỏi nguyên nhân (và ngược lại).
        fix_vi: Gạch chân từ causes / effects / problems trong đề trước khi lập dàn ý.
      - trap_vi: Nguyên nhân và giải pháp không liên quan nhau.
        fix_vi: Lập bảng cặp nguyên nhân–giải pháp trước khi viết.
      - trap_vi: Nhầm results in / results from.
        fix_vi: Nguyên nhân + results IN + kết quả; kết quả + results FROM + nguyên nhân.
      - trap_vi: lead to + động từ nguyên mẫu.
        fix_vi: lead to + danh từ/V-ing.
    phrases:
      - en: … has become a serious issue in many countries.
        vi: … đã trở thành một vấn đề nghiêm trọng ở nhiều nước.
        note_vi: Câu 1 mở bài.
      - en: This essay will examine the main causes and suggest some solutions.
        vi: Bài luận sẽ xem xét các nguyên nhân chính và đề xuất một số giải pháp.
      - en: The main cause of this problem is that …
        vi: Nguyên nhân chính của vấn đề này là …
      - en: Several measures could be taken to tackle this issue.
        vi: Có thể áp dụng một số biện pháp để giải quyết vấn đề này.
        note_vi: Câu chủ đề thân bài 2.
      - en: Since the main cause is …, the most effective solution would be …
        vi: Vì nguyên nhân chính là …, giải pháp hiệu quả nhất sẽ là …
        note_vi: Nối giải pháp với nguyên nhân.
    demo:
      title_vi: "Làm mẫu: thân bài 1 và thân bài 2"
      text_en: |-
        Question: Childhood obesity is increasing in many countries. What are the main causes of this problem? What solutions can you suggest?

        Body 1: There are two main causes of this problem. The first is that children's diets have changed. Fast food and sugary drinks are cheap and heavily advertised, so many children consume far more sugar than they need. The second cause is a lack of exercise. Nowadays, children spend hours on phones and computers instead of playing outside, which leads to fewer calories being burned.

        Body 2: Several measures could be taken to tackle this issue. Since unhealthy food is a major cause, the government should introduce a tax on sugary drinks and ban advertising aimed at children. This would make these products less attractive. Secondly, the lack of exercise can be addressed by giving schools more funding for sports facilities, so that every child has at least one hour of physical activity a day.
      notes:
        - label: Body 1 — 2 nguyên nhân
          text_vi: The first is that … / The second cause is … — mỗi nguyên nhân có giải thích (cheap, advertised / hours on phones).
        - label: leads to …
          text_vi: lead to + cụm danh từ (fewer calories being burned).
        - label: Body 2 — giải pháp ghép cặp
          text_vi: Giải pháp 1 trả lời nguyên nhân 1 (thuế + cấm quảng cáo) — 'Since unhealthy food is a major cause…'. Giải pháp 2 trả lời nguyên nhân 2 (thể thao ở trường).
        - label: can be addressed by giving …
          text_vi: Bị động + by + V-ing; so that (Buổi 39) nói mục đích.
