  - type: skill
    skill: reading
    title_vi: Reading — Matching headings (ghép tiêu đề với đoạn)
    intro_vi: "Cho một danh sách tiêu đề (i, ii, iii…) nhiều hơn số đoạn; bạn chọn tiêu đề phù hợp nhất với Ý CHÍNH của từng đoạn. Dạng này kiểm tra khả năng skimming (Buổi 21): hiểu cả đoạn nói về gì, không phải tìm một chi tiết. Nên làm dạng này TRƯỚC các câu hỏi khác của cùng bài đọc — sau khi ghép xong, bạn đã nắm bố cục cả bài."
    steps:
      - title_vi: Đọc hết danh sách tiêu đề trước
        text_vi: "Gạch từ khóa CHÍNH của mỗi tiêu đề và để ý các tiêu đề na ná nhau (VD: 'causes of crime' và 'effects of crime'). Gạch bỏ tiêu đề đã dùng làm ví dụ."
      - title_vi: "Skim từng đoạn: câu đầu + câu cuối"
        text_vi: Câu chủ đề thường ở đầu đoạn, nhưng có đoạn ý chính nằm sau However hoặc ở câu cuối. Tự tóm tắt đoạn bằng 3–5 từ.
      - title_vi: So tóm tắt của bạn với các tiêu đề
        text_vi: Chọn tiêu đề bao được TOÀN BỘ đoạn, không chỉ một câu. Tiêu đề thường là paraphrase — ít khi dùng đúng từ trong đoạn.
      - title_vi: Làm đoạn dễ trước, loại trừ dần
        text_vi: Đoạn nào chắc chắn thì làm trước và gạch tiêu đề đó. Đoạn khó để cuối — lúc đó còn ít lựa chọn hơn.
      - title_vi: Kiểm tra lại cả bài
        text_vi: "Đọc lại các tiêu đề đã chọn theo thứ tự đoạn: chúng có tạo thành một 'dàn ý' hợp lý không?"
    tips:
      - Tiêu đề có từ trùng với một chi tiết trong đoạn thường là BẪY — chi tiết đó chỉ là ví dụ, không phải ý chính.
      - "Để ý từ khóa phân biệt: causes / effects / solutions / history / comparison / problems / reasons / examples."
      - Mỗi tiêu đề chỉ dùng một lần (trừ khi đề nói khác).
    traps:
      - trap_vi: Chọn tiêu đề vì thấy trùng một từ trong đoạn.
        fix_vi: "Hỏi: tiêu đề này có tóm được CẢ đoạn không? Nếu chỉ đúng với một câu → bẫy."
      - trap_vi: Chỉ đọc câu đầu trong khi đoạn bắt đầu bằng câu dẫn.
        fix_vi: Nếu câu đầu quá chung hoặc là câu hỏi, đọc tiếp đến câu có However / In fact / The main reason.
      - trap_vi: Nhầm nguyên nhân với hậu quả.
        fix_vi: "Tìm tín hiệu: because, due to, the reason (nguyên nhân) ↔ as a result, leads to, therefore (hậu quả)."
    phrases:
      - en: The main reason for … is …
        vi: Lý do chính của … là …
        note_vi: Đoạn nói về nguyên nhân.
      - en: As a result, … / This has led to …
        vi: Kết quả là … / Điều này dẫn đến …
        note_vi: Đoạn nói về hậu quả.
      - en: One way to solve this is …
        vi: Một cách giải quyết là …
        note_vi: Đoạn nói về giải pháp.
      - en: In the past, … Today, …
        vi: Trước đây … Ngày nay …
        note_vi: Đoạn so sánh xưa – nay.
    demo:
      title_vi: "Làm mẫu: ghép tiêu đề cho 2 đoạn"
      text_en: |-
        Headings:
        i    A rise in online crime
        ii   Why some young people break the law
        iii  How cameras are used in shops
        iv   The cost of keeping people in prison

        A  Many teenagers who commit crimes come from poor families or have left school early. Some want money quickly; others simply want to be accepted by a group of friends who are already involved in crime. For example, a sixteen-year-old in one study said he started stealing phones because his friends did it.

        B  Keeping one person in prison is very expensive. In some countries it costs more than sending a student to university for a year. Money is needed for guards, food, buildings and healthcare, and most of it is paid by taxpayers.
      notes:
        - label: Đoạn A → ii
          text_vi: "Tóm tắt: nguyên nhân thanh thiếu niên phạm tội (nghèo, bỏ học, bạn bè). 'stealing phones' chỉ là ví dụ — đừng chọn i (online crime) chỉ vì thấy chữ 'phones'."
        - label: Đoạn B → iv
          text_vi: "Câu đầu nói thẳng ý chính: nuôi một người trong tù rất tốn kém. Các câu sau giải thích tiền dùng vào đâu."
        - label: i và iii
          text_vi: Tiêu đề thừa — không đoạn nào nói về tội phạm mạng hay camera trong cửa hàng.
