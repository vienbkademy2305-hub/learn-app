  - type: skill
    skill: writing
    title_vi: Writing Task 1 — sơ đồ quy trình (process diagram)
    intro_vi: "Đề cho một sơ đồ các bước (sản xuất gạch, tái chế chai nhựa, xử lý nước…). Không có số liệu để so sánh, nên nhiều bạn thấy 'dễ' nhưng hay mất điểm vì (1) bỏ sót bước, (2) viết như danh sách rời rạc, (3) sai bị động. Bố cục 4 đoạn vẫn giữ: mở bài → overview (số bước, điểm đầu → điểm cuối) → thân bài 1 (nửa đầu quy trình) → thân bài 2 (nửa sau)."
    steps:
      - title_vi: Đếm bước và xác định điểm đầu, điểm cuối
        text_vi: Có mấy bước? Bắt đầu từ đâu (nguyên liệu), kết thúc ở đâu (sản phẩm)? Là quy trình nhân tạo (bị động) hay tự nhiên (chủ động)? Có phải vòng tròn (cycle) không?
      - title_vi: "Mở bài: paraphrase"
        text_vi: The diagram shows how… → The diagram illustrates the process by which… / the stages involved in…
      - title_vi: "Overview: số bước + đầu → cuối"
        text_vi: "'Overall, there are six main stages in the process, beginning with the collection of used bottles and ending with the production of new plastic items.' Không đi vào chi tiết từng bước."
      - title_vi: Chia thân bài theo nửa quy trình
        text_vi: "Thân bài 1: bước 1–3; thân bài 2: bước 4–6. Mỗi bước ít nhất một câu; giữ đúng thứ tự mũi tên."
      - title_vi: Dùng từ trong sơ đồ, đổi dạng
        text_vi: Nhãn trong sơ đồ thường là danh từ (collection, sorting) → đổi thành động từ bị động (are collected, are sorted). Giữ thuật ngữ kỹ thuật, không cố tìm từ đồng nghĩa.
      - title_vi: Soát lỗi
        text_vi: Mỗi câu bị động có đủ be + V3? -ed đúng? Có bỏ sót bước nào không?
    tips:
      - Cần tối thiểu 150 từ — sơ đồ ít chữ, nên thêm chi tiết có trong hình (nhiệt độ, thời gian, địa điểm).
      - "Luân phiên: First → Next → After that → Once … → Subsequently → Finally. Không lặp 'Then' năm lần."
      - Không thêm thông tin ngoài sơ đồ (không giải thích vì sao phải lọc nước).
    traps:
      - trap_vi: "Viết chủ động sai: 'The bottles collect'."
        fix_vi: "Quy trình nhân tạo → bị động: are collected."
      - trap_vi: Overview liệt kê từng bước.
        fix_vi: "Overview chỉ: số bước + bắt đầu + kết thúc (+ vòng tròn hay không)."
      - trap_vi: Bỏ sót bước nhỏ (VD bước làm khô).
        fix_vi: Đánh số các bước trên đề trước khi viết, gạch khi đã viết xong.
    phrases:
      - en: The diagram illustrates the process by which …
        vi: Sơ đồ minh họa quy trình mà qua đó …
        note_vi: Mở bài.
      - en: Overall, there are … main stages, beginning with … and ending with …
        vi: Nhìn chung, có … giai đoạn chính, bắt đầu với … và kết thúc với …
        note_vi: Overview.
      - en: At the first stage, …
        vi: Ở giai đoạn đầu, …
      - en: Once … has been …, it is …
        vi: Sau khi … đã được …, nó được …
      - en: After being …, the … is …
        vi: Sau khi được …, … được …
      - en: In the final stage, …
        vi: Ở giai đoạn cuối, …
    demo:
      title_vi: "Làm mẫu: bài process tái chế chai nhựa (sơ đồ mô tả bằng lời để luyện tập)"
      text_en: |-
        Diagram (6 stages): 1 used bottles collected from homes → 2 taken to a recycling plant and sorted by colour → 3 crushed into flakes → 4 washed and dried → 5 melted and formed into pellets → 6 pellets sold to factories to make new products (clothes, bottles, furniture).

        Introduction: The diagram illustrates the process by which used plastic bottles are recycled to make new products.

        Overview: Overall, there are six main stages in the process, beginning with the collection of used bottles and ending with the production of new items such as clothes and furniture.

        Body 1: At the first stage, used bottles are collected from homes and taken to a recycling plant. There, they are sorted according to their colour. Once the bottles have been sorted, they are crushed into small flakes.

        Body 2: After being washed and dried, the flakes are melted down and formed into small pellets. Finally, these pellets are sold to factories, where they are used as raw materials to make a range of new products, including clothes, bottles and furniture.
      notes:
        - label: process by which
          text_vi: Paraphrase 'shows how' — cụm học thuật, dùng một lần ở mở bài.
        - label: Overview
          text_vi: "Số bước (six) + bắt đầu (collection) + kết thúc (new items). Danh từ hóa: the collection of, the production of."
        - label: Once … have been sorted
          text_vi: Gộp bước 2 và 3; hiện tại hoàn thành bị động sau once.
        - label: After being washed … where …
          text_vi: Hai cách gộp bước khác; where nối bước 6 với nơi dùng pellets.
