  - type: skill
    skill: reading
    title_vi: Reading — Matching sentence endings
    intro_vi: "Đề cho các NỬA ĐẦU câu (theo thứ tự bài đọc) và một danh sách NỬA SAU A–G (nhiều hơn số câu). Bạn ghép để tạo câu đúng với bài. Dạng này kiểm tra cả NGHĨA và NGỮ PHÁP: nhiều phương án ghép vào nghe hợp ngữ pháp nhưng sai ý bài. Lợi thế: nửa đầu đi theo thứ tự bài, nên định vị nhanh."
    steps:
      - title_vi: Đọc các nửa đầu, gạch từ khóa
        text_vi: Nửa đầu chứa chủ đề + từ khóa để tìm trong bài (thường là tên, thuật ngữ).
      - title_vi: Đọc lướt các nửa sau, đoán loại
        text_vi: Nửa sau bắt đầu bằng gì? động từ số ít/số nhiều, to V, V-ing, because…? Loại những nửa sau không khớp ngữ pháp với từng nửa đầu.
      - title_vi: Tìm vị trí trong bài
        text_vi: Scan từ khóa của nửa đầu. Đọc kỹ 2–3 câu quanh đó.
      - title_vi: Chọn theo NGHĨA trong bài
        text_vi: Từ các nửa sau còn lại, chọn cái diễn đạt đúng ý bài (thường bị paraphrase). Đọc lại cả câu ghép hoàn chỉnh.
      - title_vi: Kiểm tra phương án 'bẫy'
        text_vi: Các nửa sau thừa thường dùng từ trong bài nhưng nói sai chủ thể hoặc sai quan hệ.
    tips:
      - Mỗi nửa sau chỉ dùng một lần (trừ khi đề nói khác).
      - Cụm phân từ (Having lived…, Built in…) hay xuất hiện trong bài đọc học thuật — nhận ra chủ ngữ thật của câu để hiểu đúng.
      - Nếu hai nửa sau đều hợp, xem cái nào khớp chính xác mức độ (some/all, may/will).
    traps:
      - trap_vi: Chọn nửa sau chỉ vì hợp ngữ pháp.
        fix_vi: Luôn kiểm tra với ý trong bài.
      - trap_vi: Chọn nửa sau có chứa từ giống bài nhưng nói về đối tượng khác.
        fix_vi: "Kiểm tra chủ thể: ai/cái gì làm gì."
      - trap_vi: Hiểu sai câu có cụm phân từ.
        fix_vi: "Chủ ngữ của cụm phân từ = chủ ngữ câu chính: 'Having moved to the city, young people…' → young people đã chuyển lên thành phố."
    phrases:
      - en: Complete each sentence with the correct ending, A–G.
        vi: Hoàn thành mỗi câu với phần kết đúng, A–G.
      - en: Write the correct letter, A–G, next to questions 1–5.
        vi: Viết chữ cái đúng, A–G, bên cạnh câu hỏi 1–5.
    demo:
      title_vi: "Làm mẫu: loại theo ngữ pháp rồi chọn theo nghĩa"
      text_en: |-
        Passage: "Handed down through families for centuries, the craft of silk weaving almost disappeared in the 1990s. Having found new markets through tourism, however, many villages have revived it."

        1  The craft of silk weaving …
        A  was introduced by tourists.
        B  nearly died out in the 1990s.
        C  having found new markets.
      notes:
        - label: Loại C
          text_vi: "'having found' không tạo thành câu hoàn chỉnh sau 'The craft … ' → sai ngữ pháp."
        - label: Loại A
          text_vi: "Hợp ngữ pháp nhưng sai ý: nghề được truyền trong gia đình, không phải do du khách mang đến."
        - label: Đáp án B
          text_vi: "'almost disappeared' = 'nearly died out' (paraphrase)."
