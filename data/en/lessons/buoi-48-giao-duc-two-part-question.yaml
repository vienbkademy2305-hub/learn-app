  - type: dialogue
    title_vi: Học đại học hay học nghề?
    lines:
      - speaker: A
        text: My cousin is choosing between university and a vocational course in cooking.
        vi: Em họ tớ đang phân vân giữa đại học và khóa học nghề nấu ăn.
      - speaker: B
        text: What do her parents want?
        vi: Bố mẹ em ấy muốn gì?
      - speaker: A
        text: University, of course. My aunt, who never went to university herself, really wants a degree for her.
        vi: Đại học, tất nhiên. Dì tớ, người chưa từng học đại học, rất muốn con có bằng.
      - speaker: B
        text: I understand, but a lot of graduates can't find jobs, which is quite worrying.
        vi: Tớ hiểu, nhưng nhiều người tốt nghiệp không tìm được việc, điều đó khá đáng lo.
      - speaker: A
        text: True. The cooking course is two years long and very hands-on.
        vi: Đúng. Khóa nấu ăn dài hai năm và rất thiên về thực hành.
      - speaker: B
        text: And restaurants always need skilled chefs, which improves her employability.
        vi: Mà nhà hàng lúc nào cũng cần đầu bếp giỏi, điều đó giúp em ấy dễ được tuyển hơn.
      - speaker: A
        text: She could still go to university later, through distance learning, for example.
        vi: Em ấy vẫn có thể học đại học sau này, ví dụ học từ xa.
      - speaker: B
        text: Exactly. The best choice is the one that matches her interests.
        vi: Chính xác. Lựa chọn tốt nhất là cái phù hợp với sở thích của em ấy.
  - type: exercises
    items:
      - id: b48-x1
        bank_no: 9
        kind: combine
        instructions_vi: Nối hai câu bằng mệnh đề quan hệ không xác định (, who / , which / , where). Nhớ dấu phẩy.
        questions:
          - q: My teacher has taught for thirty years. She still loves her job. (who)
            answer: My teacher, who has taught for thirty years, still loves her job.
          - q: Many students have a heavy workload. This leaves them little time for sport. (which)
            answer: Many students have a heavy workload, which leaves them little time for sport.
          - q: I studied in Da Nang. My family lives there. (where)
            answer: I studied in Da Nang, where my family lives.
          - q: University fees have doubled. This means many families cannot afford a degree. (which)
            answer: University fees have doubled, which means many families cannot afford a degree.
            accept:
              - University fees have doubled, which means that many families cannot afford a degree.
      - id: b48-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: My university, ___ is in Hue, has a beautiful campus.
            options:
              - that
              - which
              - who
              - where
            answer: b
          - q: Students have too many exams, ___ causes a lot of stress.
            options:
              - this
              - that
              - which
              - it
            answer: c
          - q: Which sentence is correct?
            options:
              - Students who study abroad become more independent.
              - Students, who study abroad become more independent.
              - Students that, study abroad, become more independent.
              - Students which study abroad become more independent.
            answer: a
            explain_vi: Mệnh đề XÁC ĐỊNH (chỉ rõ nhóm sinh viên nào) → không dấu phẩy.
          - q: "'Why is this happening? Is it positive or negative?' How many body paragraphs are best?"
            options:
              - one
              - two — one for each question
              - three about reasons
              - four
            answer: b
          - q: Which sentence gives a clear opinion for 'Is this positive or negative?'
            options:
              - There are good and bad points.
              - In my view, this is a largely positive development.
              - Some people think it is good.
              - It depends on many things.
            answer: b
      - id: b48-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn thân bài có 5 lỗi (mệnh đề quan hệ, comma splice, -s, từ loại). Sửa trực tiếp.
        text: There are two main reasons for this trend. Firstly, university fees have risen, this means many families cannot pay. Secondly, many graduate cannot find jobs because their courses are too theory. Vocational training, that is shorter and cheaper, offers hands-on experience, which help students find work quickly.
        errors:
          - wrong: fees have risen, this means
            right: fees have risen, which means
            why: "Comma splice: dùng which (hoặc tách câu)."
          - wrong: many graduate cannot
            right: many graduates cannot
            why: "many + danh từ số nhiều: thêm -s."
          - wrong: too theory
            right: too theoretical
            why: "Sau too cần tính từ: theoretical."
          - wrong: training, that is shorter
            right: training, which is shorter
            why: Mệnh đề có dấu phẩy không dùng that.
          - wrong: which help students
            right: which helps students
            why: "which thay cho cả ý / cho 'hands-on experience' → số ít: helps."
      - id: b48-x4
        bank_no: 26
        kind: mcq
        instructions_vi: "Chọn mở bài tốt nhất cho đề: 'More and more students choose to study online rather than on campus. Why is this? Do the advantages outweigh the disadvantages?'"
        questions:
          - q: Which introduction is best?
            options:
              - Online learning is very popular. There are many advantages and disadvantages.
              - An increasing number of students now take courses online instead of attending classes in person. This essay will explain the reasons for this trend and argue that its benefits outweigh its drawbacks.
              - More and more students choose to study online rather than on campus. Why is this?
              - I think online learning is good because I like it.
            answer: b
            explain_vi: "a: không trả lời gì. c: chép đề. d: quá cá nhân, không paraphrase."
      - id: b48-x5
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: The course is too ___; students never practise.
            base: theory
            answer: theoretical
          - q: Internships improve graduates' ___.
            base: employ
            answer: employability
          - q: Continuous ___ is fairer than one final exam.
            base: assess
            answer: assessment
          - q: Recent ___ often lack practical skills.
            base: graduate
            answer: graduates
          - q: Her academic ___ improved after she joined a study group.
            base: perform
            answer: performance
      - id: b48-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: vocational training
            right: education for a particular job or skill
          - left: tertiary education
            right: education at university or college
          - left: well-rounded
            right: having a wide range of knowledge and skills
          - left: hands-on
            right: involving doing things yourself
          - left: workload
            right: the amount of work a person has to do
          - left: employability
            right: how easily a person can get a job
      - id: b48-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hai sinh viên lập dàn ý (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Woman: The question has two parts: why do more young people choose vocational training, and is this positive or negative?
          Man: For the first part, I'd say cost is the main reason. University fees keep rising.
          Woman: Agreed. And the second reason could be that graduates can't find jobs.
          Man: Good. Now, is it positive or negative?
          Woman: I think it's mostly positive, although society still sees university as more respectable.
          Man: So body paragraph two says it's positive, and we mention that social attitude as the other side.
          Woman: Exactly. And we must answer both questions in the introduction too.
        questions:
          - q: What is the main reason, according to the man?
            options:
              - social attitudes
              - rising university fees
              - a lack of teachers
              - parents' wishes
            answer: b
          - q: What is the woman's opinion about the trend?
            options:
              - completely negative
              - mostly positive
              - she has no opinion
              - it depends on the student
            answer: b
          - q: What will they use as the 'other side' in body paragraph two?
            options:
              - university is cheaper
              - society sees university as more respectable
              - vocational courses are too long
              - graduates earn more
            answer: b
          - q: Where must they answer both questions, besides the body paragraphs?
            options:
              - only in the conclusion
              - in the introduction
              - in the title
              - nowhere else
            answer: b
      - id: b48-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai).
        audio_text: A recent survey of five hundred employers found that most of them valued soft skills, such as teamwork and communication, more than exam results. Only a quarter said that a degree from a top university was essential. However, almost all employers agreed that graduates need hands-on experience, which many of them do not get at university.
        questions:
          - q: The survey asked five hundred employers.
            answer: T
          - q: Most employers valued exam results more than soft skills.
            answer: F
          - q: A quarter of employers said a top university degree was essential.
            answer: T
          - q: Employers think most graduates already have enough hands-on experience.
            answer: F
