  - type: skill
    skill: writing
    title_vi: Writing Task 2 — Two-part question (câu hỏi hai phần)
    intro_vi: "Đề nêu một tình huống rồi hỏi HAI câu trực tiếp, VD: 'Why is this happening? Is it a positive or negative development?' hoặc 'What are the reasons? What can be done?'. Không có công thức 'agree/disagree' — giám khảo chỉ chấm bạn có trả lời ĐÚNG và ĐỦ cả hai câu không. Bố cục dễ nhất: Mở bài → Thân bài 1 trả lời câu hỏi 1 → Thân bài 2 trả lời câu hỏi 2 → Kết bài. Buổi 45 đã có một đề dạng này làm bài về nhà."
    steps:
      - title_vi: Tách và gạch hai câu hỏi
        text_vi: "Ghi Q1 và Q2 ra nháp. Xác định LOẠI câu hỏi: Why (lý do), Is it positive/negative (đánh giá — cần quan điểm), What can be done (giải pháp), How (cách thức)."
      - title_vi: "Mở bài: paraphrase + trả lời ngắn cả hai câu"
        text_vi: "Câu 1 paraphrase tình huống. Câu 2: 'This essay will argue that this is mainly due to …, and that it is a largely positive development.' Giám khảo thấy ngay bạn trả lời cả hai."
      - title_vi: Thân bài 1 = câu hỏi 1
        text_vi: Câu chủ đề nhắc lại câu hỏi 1 bằng từ khác. 2 ý, mỗi ý giải thích + ví dụ. Dùng ', which' để nối nguyên nhân với hệ quả.
      - title_vi: Thân bài 2 = câu hỏi 2
        text_vi: Câu chủ đề trả lời thẳng câu hỏi 2 (VD 'In my view, this trend is largely positive.'). Có thể thừa nhận một mặt ngược lại bằng although (Buổi 37).
      - title_vi: "Kết bài: tóm tắt hai câu trả lời"
        text_vi: "'In conclusion, … is mainly caused by …, and I believe it is …' — không ý mới."
    tips:
      - "Câu hỏi 'Is it positive or negative?' là câu hỏi quan điểm: phải chọn (có thể 'mostly positive'), không chỉ liệt kê hai mặt."
      - Đừng dành 3 đoạn cho câu 1 và 2 câu cho câu 2 — hai thân bài nên dài tương đương.
      - "Nhắc lại chính xác phạm vi đề: 'young adults in cities', không mở rộng thành 'everyone'."
    traps:
      - trap_vi: Viết theo khuôn 'agree/disagree' quen thuộc.
        fix_vi: "Đọc lại đề: nếu có hai dấu hỏi thì trả lời HAI câu hỏi, không nêu đồng ý hay không."
      - trap_vi: Trả lời câu hỏi 2 ở kết bài một câu cho xong.
        fix_vi: Câu hỏi 2 cần một thân bài riêng.
      - trap_vi: "Comma splice với this: '…workload, this leaves…'."
        fix_vi: Dùng ', which leaves …' hoặc tách câu.
    phrases:
      - en: There are several reasons why …
        vi: Có một số lý do khiến …
        note_vi: Câu chủ đề cho câu hỏi Why.
      - en: The main reason for this trend is that …
        vi: Lý do chính của xu hướng này là …
      - en: In my view, this is a largely positive development.
        vi: Theo tôi, đây phần lớn là một bước phát triển tích cực.
        note_vi: Câu hỏi đánh giá.
      - en: …, which means that …
        vi: …, điều đó có nghĩa là …
      - en: This essay will explain why … and argue that …
        vi: Bài luận sẽ giải thích vì sao … và lập luận rằng …
        note_vi: Câu 2 mở bài.
    demo:
      title_vi: "Làm mẫu: mở bài và thân bài 1"
      text_en: |-
        Question: Nowadays, more and more young people choose vocational training instead of going to university. Why is this happening? Is this a positive or negative development?

        Introduction: In recent years, a growing number of school leavers have chosen practical vocational courses rather than tertiary education. This essay will explain why this is happening and argue that it is a largely positive development.

        Body 1: There are two main reasons for this trend. Firstly, university fees have risen sharply, which means that many families can no longer afford a four-year degree. Secondly, many graduates struggle to find work because their courses are too theoretical. By contrast, vocational training offers hands-on experience in skills that employers need, such as electrical work or cooking, so students often find jobs immediately after finishing their course.
      notes:
        - label: Mở bài trả lời cả hai
          text_vi: "'explain why …' (Q1) + 'argue that it is a largely positive development' (Q2 — có quan điểm)."
        - label: …, which means that …
          text_vi: which thay cho cả ý 'fees have risen sharply' — nối nguyên nhân với hệ quả trong một câu.
        - label: Hai lý do song song
          text_vi: Firstly (chi phí) / Secondly (việc làm). Lý do 2 có so sánh với vocational training → dẫn sang thân bài 2.
