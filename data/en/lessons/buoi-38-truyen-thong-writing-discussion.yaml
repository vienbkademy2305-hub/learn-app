  - type: skill
    skill: writing
    title_vi: Writing Task 2 — Discuss both views and give your own opinion
    intro_vi: "Đề nêu hai quan điểm đối lập ('Some people think A, while others think B') và yêu cầu: bàn CẢ HAI và nêu ý kiến riêng. Giám khảo kiểm tra 3 thứ: (1) có bàn quan điểm A không, (2) có bàn quan điểm B không, (3) ý kiến của bạn có rõ và nhất quán từ mở bài đến kết bài không. Thiếu một trong ba → Task Response khó qua band 5. Bố cục 4 đoạn: Mở bài → Thân bài 1 (quan điểm A) → Thân bài 2 (quan điểm B = quan điểm bạn đồng ý) → Kết bài."
    steps:
      - title_vi: Tách đề thành 3 nhiệm vụ
        text_vi: "Gạch quan điểm A, quan điểm B và cụm 'give your own opinion'. Quyết định trước: bạn nghiêng về bên nào? (Có thể đồng ý một phần cả hai, nhưng phải nói rõ.)"
      - title_vi: "Mở bài: paraphrase + ý kiến"
        text_vi: "Câu 1: 'While some people believe …, others argue that …'. Câu 2: 'This essay will discuss both views, but I believe that …'. Ý kiến có ngay từ mở bài."
      - title_vi: "Thân bài 1: quan điểm bạn KHÔNG chọn"
        text_vi: "'On the one hand, some people argue that … This is because … For example, …'. Trình bày công bằng — đây là ý của người khác, không phản bác ngay."
      - title_vi: "Thân bài 2: quan điểm bạn chọn"
        text_vi: "'On the other hand, I believe that … The main reason is that … In addition, …'. Có thể thêm 1 câu giải thích vì sao lý lẽ của bên kia yếu hơn."
      - title_vi: "Kết bài: tóm tắt + nhắc lại ý kiến"
        text_vi: "'In conclusion, although …, I believe that …' — dùng although (Buổi 37) để gói cả hai bên trong một câu. Không thêm ý mới."
    tips:
      - Đặt quan điểm của bạn ở thân bài 2 — bài dẫn dắt tự nhiên tới kết luận.
      - Mỗi thân bài 2 lý do × (giải thích + ví dụ) là đủ cho band 6.
      - "Đổi cách gọi 'some people': supporters of censorship, critics, many parents, those who work in the media."
      - "Viết 260–290 từ: đủ ý mà không lan man. Dưới 250 từ bị trừ điểm."
    traps:
      - trap_vi: Chỉ bàn quan điểm mình đồng ý, bỏ qua bên kia.
        fix_vi: Thân bài 1 dành trọn cho quan điểm A, kể cả khi bạn không đồng ý.
      - trap_vi: Quên ý kiến riêng hoặc ý kiến ở mở bài khác ở kết bài.
        fix_vi: Viết câu ý kiến trước khi viết bài; chép lại ý đó (bằng từ khác) ở kết bài.
      - trap_vi: Dùng 'I think' ở thân bài 1 khi đang trình bày ý người khác.
        fix_vi: "Thân bài 1: Some people argue / It is claimed. Thân bài 2 mới dùng I believe."
      - trap_vi: Viết 'Although …, but …' ở kết bài.
        fix_vi: Although … , I believe … — không có but (Buổi 37).
    phrases:
      - en: While some people believe that …, others argue that …
        vi: Trong khi một số người tin rằng …, những người khác lại cho rằng …
        note_vi: Câu 1 mở bài.
      - en: This essay will discuss both views, but I believe that …
        vi: Bài luận sẽ bàn cả hai quan điểm, nhưng tôi cho rằng …
        note_vi: Câu 2 mở bài — có ý kiến.
      - en: On the one hand, supporters of … argue that …
        vi: Một mặt, những người ủng hộ … lập luận rằng …
      - en: It is often claimed that …
        vi: Người ta thường cho rằng …
      - en: On the other hand, I would argue that …
        vi: Mặt khác, tôi cho rằng …
      - en: In conclusion, although …, I believe that …
        vi: Tóm lại, mặc dù …, tôi cho rằng …
    demo:
      title_vi: "Làm mẫu: mở bài, thân bài 1 và kết bài"
      text_en: |-
        Question: Some people think that newspapers and TV are the best way to get the news, while others believe that social media is better. Discuss both views and give your own opinion.

        Introduction: While some people believe that traditional media such as newspapers and television are the most reliable sources of news, others argue that social media is a better choice. This essay will discuss both views, but I believe that traditional media is still more trustworthy.

        Body 1: On the one hand, supporters of social media argue that it is faster and more convenient. News appears on platforms like Facebook or TikTok within minutes, while a newspaper has to wait until the next morning. In addition, it is often claimed that social media shows many points of view, not only the view of large companies. For example, ordinary people can post videos of events that journalists have not reported.

        Conclusion: In conclusion, although social media is quick and offers different perspectives, I believe that newspapers and TV remain the best way to get the news because they check their sources and are more objective.
      notes:
        - label: Introduction
          text_vi: "Câu 1: While… others argue… (paraphrase cả hai quan điểm). Câu 2: nêu rõ ý kiến ngay."
        - label: Body 1 = quan điểm KHÔNG chọn
          text_vi: Trình bày công bằng bằng 'supporters … argue', 'it is often claimed' — không có 'I think'.
        - label: 2 lý do + ví dụ
          text_vi: Nhanh hơn (so sánh với báo giấy) và nhiều góc nhìn (ví dụ người dân quay video).
        - label: Conclusion
          text_vi: although gói quan điểm A; I believe nhắc lại ý kiến + lý do chính của thân bài 2 (không viết ra ở đây — bạn tự viết thân bài 2 ở bài tập).
