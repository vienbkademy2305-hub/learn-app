  - type: dialogue
    title_vi: Lập dàn ý trước khi viết
    lines:
      - speaker: A
        text: "The question says: some people think the government should control online content, while others think people should be free to post anything."
        vi: "Đề nói: một số người cho rằng chính phủ nên kiểm soát nội dung trên mạng, số khác cho rằng mọi người nên được tự do đăng bất cứ thứ gì."
      - speaker: B
        text: So we need both views and our opinion. What do you think?
        vi: Vậy mình cần cả hai quan điểm và ý kiến riêng. Cậu nghĩ sao?
      - speaker: A
        text: I think some control is necessary, especially for harmful content.
        vi: Tớ nghĩ cần kiểm soát ở mức nào đó, nhất là với nội dung có hại.
      - speaker: B
        text: "OK, then body paragraph one is the other side: freedom of speech."
        vi: "Được, vậy thân bài một là phía bên kia: tự do ngôn luận."
      - speaker: A
        text: Right. Supporters argue that censorship can be used to hide the truth.
        vi: Đúng. Những người ủng hộ lập luận rằng kiểm duyệt có thể bị dùng để che giấu sự thật.
      - speaker: B
        text: "And body two: harmful content and misinformation can mislead children."
        vi: "Còn thân bài hai: nội dung có hại và tin sai lệch có thể đánh lừa trẻ em."
      - speaker: A
        text: Good. Let's give an example for each reason.
        vi: Tốt. Mỗi lý do mình đưa một ví dụ nhé.
      - speaker: B
        text: "And in the conclusion: although freedom of speech matters, some regulation is needed."
        vi: "Và kết bài: mặc dù tự do ngôn luận quan trọng, vẫn cần có quy định ở mức nào đó."
  - type: exercises
    items:
      - id: b38-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Đọc đề và chọn đáp án đúng về cách viết bài Discussion.
        questions:
          - q: "'Some people think A, while others think B. Discuss both views and give your own opinion.' What must the essay include?"
            options:
              - only view A
              - only your opinion
              - view A, view B and your opinion
              - view B and an example
            answer: c
          - q: Where should your opinion appear first?
            options:
              - only in the conclusion
              - in the introduction
              - in body paragraph 1
              - nowhere
            answer: b
          - q: You agree with view B. What is the best plan?
            options:
              - "Body 1: view B; Body 2: view A"
              - "Body 1: view A; Body 2: view B"
              - "Body 1 and 2: view B only"
              - "Body 1: your life story"
            answer: b
          - q: Which sentence is best for body paragraph 1 (the view you don't agree with)?
            options:
              - I strongly think censorship is wrong.
              - On the one hand, supporters of censorship argue that it protects children.
              - In conclusion, censorship is bad.
              - Censorship is a word.
            answer: b
      - id: b38-x2
        bank_no: 26
        kind: mcq
        instructions_vi: "Chọn mở bài tốt nhất cho đề sau: 'Some people believe that advertising aimed at children should be banned, while others think it is acceptable. Discuss both views and give your opinion.'"
        questions:
          - q: Which introduction is best?
            options:
              - Advertising is everywhere. I will write about it.
              - While some people argue that advertisements targeting children should be prohibited, others believe they are acceptable. This essay will discuss both views, but I believe that such advertising should be strictly limited.
              - Some people believe that advertising aimed at children should be banned, while others think it is acceptable.
              - In my opinion, children like advertisements, and advertisements are good, and parents are busy.
            answer: b
            explain_vi: "a: không paraphrase, không ý kiến. c: chép nguyên đề, thiếu ý kiến. d: không nhắc hai quan điểm, câu nối lỏng."
      - id: b38-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu theo gợi ý, giữ nguyên nghĩa.
        questions:
          - q: People often say that social media is harmful. → It is often said ___
            answer: that social media is harmful.
          - q: Some people think TV is educational. Other people think it is only for entertainment. → While some people ___
            answer: think TV is educational, others think it is only for entertainment.
            accept:
              - think TV is educational, other people think it is only for entertainment.
          - q: In my opinion, the press should be free. → From my ___
            answer: point of view, the press should be free.
      - id: b38-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn thân bài có 5 lỗi. Sửa trực tiếp.
        text: On the one hand, some people argue about that the goverment should control online content. It is often claimed harmful content can mislead children. For example, many videos contain violence. In my point of view, this is true. Although censorship has some benefits, but it can limit freedom of speech.
        errors:
          - wrong: argue about that
            right: argue that
            why: argue that + mệnh đề.
          - wrong: the goverment should
            right: the government should
            why: "Chính tả: government có chữ n."
          - wrong: It is often claimed harmful content
            right: It is often claimed that harmful content
            why: Giữ that sau It is claimed trong văn viết.
          - wrong: In my point of view
            right: From my point of view
            why: "from my point of view. (Thêm nữa: thân bài 1 nên trình bày ý người khác, không chen ý kiến.)"
          - wrong: has some benefits, but it can
            right: has some benefits, it can
            why: Although … không đi với but.
      - id: b38-x5
        bank_no: 27
        kind: completion
        instructions_vi: Hoàn thành đoạn thân bài 2 bằng từ trong bài học. Viết MỘT TỪ cho mỗi chỗ trống.
        max_words: 1
        passage: On the other hand, I believe that some (1) ___ of online content is necessary. The main reason is that children can easily find (2) ___ videos, such as those showing violence. In addition, false stories can (3) ___ the public and change public (4) ___ very quickly. For example, during elections, fake posts are often shared millions of times. However, any rules must be fair and (5) ___, so that they do not limit freedom of the press.
        questions:
          - q: (1)
            answer: regulation
            accept:
              - control
          - q: (2)
            answer: harmful
          - q: (3)
            answer: mislead
          - q: (4)
            answer: opinion
          - q: (5)
            answer: objective
      - id: b38-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: censorship
            right: stopping people from publishing or showing certain information
          - left: biased
            right: unfairly supporting one side
          - left: objective
            right: based on facts, not on personal feelings
          - left: mislead
            right: to make somebody believe something that is not true
          - left: regulate
            right: to control something with rules
          - left: public opinion
            right: what most people in a society think
      - id: b38-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hai sinh viên tranh luận (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Man: I think advertising aimed at children should be banned completely.
          Woman: Completely? That seems too strong. Some ads are educational, like ones for books or healthy food.
          Man: Maybe, but most of them are for sweets and toys. Children can't tell the difference between an ad and a normal video.
          Woman: That's true. So perhaps we should ban ads for unhealthy food, but not all advertising.
          Man: OK, I can agree with that. And TV channels should show fewer ads during children's programmes.
          Woman: Yes. Although companies won't like it, I think it's fair.
        questions:
          - q: What is the man's first opinion?
            options:
              - Ads for children are fine.
              - All advertising for children should be banned.
              - Only TV ads should be banned.
              - Parents should decide.
            answer: b
          - q: Why does the woman disagree at first?
            options:
              - Ads are cheap.
              - Some ads are educational.
              - Children don't watch ads.
              - Companies need money.
            answer: b
          - q: What do they finally agree on?
            options:
              - banning all ads
              - banning ads for unhealthy food
              - showing more ads
              - doing nothing
            answer: b
            explain_vi: Đáp án là điều họ ĐỒNG Ý CUỐI CÙNG, không phải ý kiến đầu tiên.
          - q: What does the woman say about companies?
            options:
              - They will be happy.
              - They won't like it.
              - They agree completely.
              - They make educational ads.
            answer: b
      - id: b38-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe đoạn giới thiệu một cuộc khảo sát rồi chọn T (đúng) hoặc F (sai).
        audio_text: In a recent survey, one thousand adults were asked where they got their news. It is often claimed that young people only use social media, but the results were more mixed. About sixty per cent of people under thirty used social media as their main source. However, almost half of them said they did not trust it completely. Older people preferred television, and very few people of any age still read printed newspapers every day.
        questions:
          - q: The survey asked one thousand adults.
            answer: T
          - q: All young people use only social media for news.
            answer: F
          - q: About sixty per cent of people under thirty used social media as their main source.
            answer: T
          - q: Most young people trust social media completely.
            answer: F
          - q: Many people still read printed newspapers every day.
            answer: F
  - type: homework
    kind: task2
    prompt_vi: "Viết Task 2 hoàn chỉnh (≥ 250 từ, 40 phút) theo bố cục 4 đoạn của buổi này. Thân bài 1 = quan điểm bạn không chọn (không dùng 'I think'); thân bài 2 = quan điểm bạn chọn. Dùng ít nhất: 1 câu While … others …, 1 câu It is often argued/claimed that …, 1 câu although ở kết bài, và 5 từ của buổi này."
    prompt_en: Some people believe that the government should control what is posted on social media, while others think that people should be free to post whatever they want. Discuss both views and give your own opinion.
