  - type: dialogue
    title_vi: Ngày xưa và bây giờ
    lines:
      - speaker: A
        text: Did you use to do any sports when you were at school?
        vi: Hồi đi học cậu có chơi môn thể thao nào không?
      - speaker: B
        text: Yes, I used to play volleyball every afternoon. Our team competed in a few tournaments.
        vi: Có, chiều nào tớ cũng chơi bóng chuyền. Đội tớ thi đấu vài giải.
      - speaker: A
        text: Do you still play?
        vi: Giờ cậu còn chơi không?
      - speaker: B
        text: No, I gave it up when I started work. Now I just go running to keep fit.
        vi: Không, tớ bỏ từ khi đi làm. Giờ tớ chỉ chạy bộ để giữ dáng.
      - speaker: A
        text: Running? I didn't use to like running at all.
        vi: Chạy bộ á? Ngày xưa tớ chẳng thích chạy tí nào.
      - speaker: B
        text: Me neither. But I'm used to getting up at five now, and I feel much more energetic.
        vi: Tớ cũng vậy. Nhưng giờ tớ quen dậy lúc năm giờ rồi, và thấy tràn đầy năng lượng hơn nhiều.
      - speaker: A
        text: Have you ever run a marathon?
        vi: Cậu đã bao giờ chạy marathon chưa?
      - speaker: B
        text: Only a half marathon, last December. I was exhausted, but it was really memorable.
        vi: Mới nửa marathon thôi, hồi tháng Mười Hai năm ngoái. Tớ kiệt sức, nhưng thật sự đáng nhớ.
      - speaker: A
        text: Maybe I should take up running too.
        vi: Có lẽ tớ cũng nên bắt đầu chạy bộ.
      - speaker: B
        text: You should! Come with me on Saturday.
        vi: Nên chứ! Thứ Bảy đi cùng tớ nhé.
  - type: exercises
    items:
      - id: b28-x1
        bank_no: 6
        kind: verb-form
        instructions_vi: Điền used to / didn't use to / use to + V, hoặc be used to + V-ing.
        questions:
          - q: When I was a child, I (play) ___ football in the street every day.
            answer: used to play
          - q: My dad (not / exercise) ___, but now he runs every morning.
            answer: didn't use to exercise
            accept:
              - did not use to exercise
          - q: Did you (swim) ___ in the river when you were young?
            answer: use to swim
          - q: I've lived in Da Lat for years, so I'm used to (live) ___ in cold weather.
            answer: living
          - q: There (be) ___ a football pitch here, but now it's a car park.
            answer: used to be
          - q: I (go) ___ to the gym three times last week.
            answer: went
            explain_vi: Số lần cụ thể + last week → quá khứ đơn, không dùng used to.
      - id: b28-x2
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn nói Part 2 có 5 lỗi. Sửa trực tiếp.
        text: I'd like to talk about a marathon that I have run last year. I use to hate running, but my friend encouraged me. On the day, I was very exhausting after 30 kilometres. I didn't gave up. Now I am used to run every weekend.
        errors:
          - wrong: that I have run last year
            right: that I ran last year
            why: last year → quá khứ đơn.
          - wrong: I use to hate
            right: I used to hate
            why: "Quá khứ: used to."
          - wrong: very exhausting
            right: very exhausted
            why: Người cảm thấy → -ed.
          - wrong: didn't gave up
            right: didn't give up
            why: Sau didn't dùng V nguyên mẫu.
          - wrong: used to run every weekend
            right: used to running every weekend
            why: be used to + V-ing.
      - id: b28-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank:
          - took up
          - gave up
          - tournament
          - medal
          - cheered
          - exhausted
          - memorable
          - athletes
        questions:
          - q: She ___ tennis at the age of forty and loves it.
            answer: took up
          - q: He ___ smoking after his doctor's advice.
            answer: gave up
          - q: Our team won a bronze ___ at the regional games.
            answer: medal
          - q: Thousands of fans ___ loudly when the goal was scored.
            answer: cheered
          - q: After ten hours of hiking, we were completely ___.
            answer: exhausted
          - q: Sixteen teams took part in the badminton ___.
            answer: tournament
          - q: Winning the final was the most ___ moment of my life.
            answer: memorable
          - q: Professional ___ train for many hours every day.
            answer: athletes
      - id: b28-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng về cách làm Part 2.
        questions:
          - q: How long do you have to prepare?
            options:
              - no time
              - 30 seconds
              - 1 minute
              - 2 minutes
            answer: c
          - q: What is the best way to use the preparation time?
            options:
              - write the full answer
              - write keywords for each point
              - think in Vietnamese without notes
              - ask the examiner questions
            answer: b
          - q: Which is the best first sentence?
            options:
              - Hello, my name is Lan.
              - Describe a sports event you watched.
              - I'd like to talk about the SEA Games final that I watched on TV in 2022.
              - Sport is very important.
            answer: c
          - q: You finish all four points after 50 seconds. What should you do?
            options:
              - stop and wait
              - add details, examples and feelings
              - start a new story
              - repeat the cue card
            answer: b
      - id: b28-x5
        bank_no: 30
        kind: speaking-part2
        instructions_vi: "Chuẩn bị 1 phút (ghi từ khóa), nói 1–2 phút, ghi âm. Tự kiểm tra: đủ 4 gợi ý? bao nhiêu giây? đã dùng used to và quá khứ đơn đúng chưa?"
        cue_card:
          topic: Describe a sport or physical activity that you enjoy (or used to enjoy).
          points:
            - what it is
            - when and how you started doing it
            - who you do it with
            - and explain why you enjoy it
        sample: I'd like to talk about badminton, which I've played since I was twelve. I took it up because my father used to play every Sunday in the park near our house, and one day he asked me to join him…
      - id: b28-x6
        bank_no: 30
        kind: speaking-part2
        instructions_vi: "Thẻ thứ hai để luyện 'tái chế' câu chuyện: thử dùng lại câu chuyện ở bài 5 nếu hợp."
        cue_card:
          topic: Describe a time when you felt proud of yourself.
          points:
            - when it was
            - what you did
            - who was with you
            - and explain why you felt proud
      - id: b28-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Woman: Did you use to play any sports at school?
          Man: Yes, I used to play volleyball, but I gave it up when I went to university.
          Woman: Why?
          Man: I didn't have time. Now I just go to the gym to keep fit.
          Woman: I took up badminton last year. I'm competing in a small tournament next month!
        questions:
          - { q: What sport did the man use to play?, options: [ football, volleyball, badminton, basketball ], answer: b }
          - { q: Why did he give it up?, options: [ He had an injury., He didn't have time., He didn't like it., His team stopped playing. ], answer: b }
          - { q: What is the woman doing next month?, options: [ taking up tennis, competing in a tournament, joining a gym, running a marathon ], answer: b }
      - id: b28-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: "I'd like to talk about a memorable day: the day I watched Vietnam win a football final. I was at a café with my friends. When the match finished, everyone cheered and ran into the streets. I got home at two in the morning. I was exhausted, but very happy."
        questions:
          - { q: The speaker watched the match at home., answer: F }
          - { q: She watched it with her friends., answer: T }
          - { q: Everyone cheered when the match finished., answer: T }
          - { q: She got home early., answer: F }
