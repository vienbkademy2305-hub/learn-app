  - type: skill
    skill: speaking
    title_vi: Speaking Part 2 — nói 1–2 phút theo cue card
    intro_vi: "Giám khảo đưa một thẻ đề (cue card) có chủ đề và 3–4 gợi ý. Bạn có 1 phút chuẩn bị, được ghi chú, rồi nói 1–2 phút liên tục đến khi giám khảo dừng. Sau đó có thể có 1–2 câu hỏi ngắn. Band 6 cần nói đủ gần 2 phút, trả lời đủ các gợi ý, mạch lạc và ít ngập ngừng. Chủ đề hay gặp: một người, một nơi, một đồ vật, một sự kiện/trải nghiệm."
    steps:
      - title_vi: Chọn nhanh MỘT câu chuyện (10 giây)
        text_vi: Chọn điều bạn nhớ rõ và có từ vựng để nói — không cần có thật hay ấn tượng. Đừng mất thời gian phân vân giữa hai ý.
      - title_vi: Ghi chú từ khóa theo từng gợi ý (50 giây)
        text_vi: Mỗi gợi ý 3–5 từ khóa tiếng Anh, không viết câu hoàn chỉnh. Riêng gợi ý cuối ('and explain why…') ghi nhiều nhất — đó là phần dễ nói dài.
      - title_vi: Câu mở đầu
        text_vi: "Giới thiệu thẳng: 'I'd like to talk about a badminton tournament that I took part in two years ago.' Không cần chào hay nhắc lại cả đề."
      - title_vi: Đi lần lượt các gợi ý
        text_vi: "Dùng từ nối để chuyển ý: 'As for when it happened…', 'The reason why…', 'What I remember most is…'. Mỗi gợi ý 2–4 câu có chi tiết cụ thể (ai, ở đâu, cái gì)."
      - title_vi: Kết bằng cảm xúc và ý nghĩa
        text_vi: "Gợi ý cuối thường hỏi cảm xúc/lý do: nói kỹ bằng tính từ cảm xúc (proud, exhausted, memorable) và giải thích vì sao."
      - title_vi: Nói đến khi giám khảo dừng
        text_vi: "Còn thời gian thì thêm chi tiết: điều gì xảy ra sau đó, bạn học được gì, bây giờ còn làm không (used to…)."
    tips:
      - Chuyện đã xảy ra → giữ quá khứ đơn suốt bài; thói quen xưa → used to; kết nối với hiện tại → hiện tại hoàn thành.
      - "Luyện với đồng hồ: 1 phút chuẩn bị + 2 phút nói. Lần đầu thường chỉ được 50–60 giây — bình thường, luyện 5–6 lần sẽ lên."
      - "Có thể 'tái chế' một câu chuyện cho nhiều đề: giải cầu lông có thể dùng cho 'sự kiện thể thao', 'lần bạn tự hào', 'một ngày đáng nhớ'."
      - "Ghi âm lại và tự đếm: bao nhiêu giây, bao nhiêu lần 'ờ', có đủ các gợi ý không."
    traps:
      - trap_vi: Viết câu hoàn chỉnh trong 1 phút chuẩn bị rồi đọc lại.
        fix_vi: Chỉ ghi từ khóa; đọc thuộc lòng làm mất điểm Fluency và nghe rất máy móc.
      - trap_vi: Nói hết 4 gợi ý trong 40 giây rồi im lặng.
        fix_vi: Mỗi gợi ý thêm ví dụ, chi tiết, cảm xúc; gợi ý cuối nói dài nhất.
      - trap_vi: Đổi thì lung tung khi kể chuyện quá khứ.
        fix_vi: Chọn thì chính (quá khứ đơn) và giữ nguyên; chỉ đổi khi nói về hiện tại.
      - trap_vi: Dừng lại khi quên một từ.
        fix_vi: "Diễn đạt vòng hoặc đổi sang ý khác: 'the thing you use to hit the shuttlecock… the racket'."
    phrases:
      - en: I'd like to talk about …
        vi: Tôi muốn kể về …
        note_vi: Câu mở đầu.
      - en: It happened about two years ago, when I …
        vi: Chuyện xảy ra khoảng hai năm trước, khi tôi …
      - en: What I remember most is …
        vi: Điều tôi nhớ nhất là …
      - en: As far as I can remember, …
        vi: Theo như tôi nhớ thì …
      - en: The reason why it was so memorable is that …
        vi: Lý do nó đáng nhớ là …
      - en: Looking back, I feel …
        vi: Nhìn lại, tôi cảm thấy …
        note_vi: Câu kết.
    demo:
      title_vi: "Làm mẫu: ghi chú 1 phút và bài nói khoảng 1 phút 40 giây"
      text_en: |-
        Cue card: Describe a sports event you took part in or watched. You should say:
        – what the event was
        – when and where it happened
        – who you were with
        and explain how you felt about it.

        Notes: school badminton tournament / grade 11, 2019, sports hall in Nam Dinh / best friend Tuan, team, coach / nervous → exhausted → proud, silver medal

        Answer: I'd like to talk about a badminton tournament that I took part in when I was in grade eleven. My school used to organise a sports competition every spring, and in 2019 I decided to enter the badminton event.
        It took place in a big sports hall in the city centre of Nam Dinh. There were about sixty players from ten different schools, so it was much bigger than I expected.
        I played in a team with my best friend Tuan. We used to practise together every afternoon after school, and our coach, Mr Hai, gave us a lot of useful advice.
        As for how I felt, at the beginning I was really nervous, because many players were older and stronger than us. But after we won the first two matches, I felt more confident. In the final we lost to a very strong team, but we still won a silver medal. I was completely exhausted, but I've never felt so proud. Looking back, it was one of the most memorable days of my school life, and it's the reason why I still play badminton today.
      notes:
        - label: Notes
          text_vi: Chỉ từ khóa, chia theo 4 gợi ý. Gợi ý cảm xúc ghi nhiều nhất (nervous → exhausted → proud).
        - label: I'd like to talk about …
          text_vi: Mở đầu thẳng vào chuyện.
        - label: used to organise / used to practise
          text_vi: used to cho thói quen ngày xưa; phần sự kiện chính dùng quá khứ đơn (took place, won, lost).
        - label: As for how I felt, …
          text_vi: Từ nối chuyển sang gợi ý cuối; cảm xúc thay đổi theo diễn biến → nói được lâu.
        - label: I've never felt so proud / it's the reason why I still play
          text_vi: Nối về hiện tại để kết — thêm độ dài và đa dạng thì.
