  - type: pronunciation
    notes:
      - sound: snd-er
        text_vi: "/ɜː/ trong heard, learnt, first, word, work: miệng hơi mở, lưỡi ở giữa, KHÔNG tròn môi, kéo dài. Anh-Mỹ có /r/: /hɝːd/."
      - sound: snd-ei
        text_vi: "/eɪ/ trong break, came, gave, made, stayed: bắt đầu /e/ rồi trượt sang /ɪ/ — đừng đọc thành 'ê' đơn."
      - word: hear|v
        text_vi: "hear /hɪə/ → heard /hɜːd/: nguyên âm đổi hẳn, đừng đọc heard như 'hia-d'."
      - word: lose|v
        text_vi: lose /luːz/ tận cùng /z/ rung; lost /lɒst/ tận cùng /st/ — đọc đủ hai âm cuối.
      - text_vi: "was/were trong câu thường đọc yếu: I was /wəz/ walking, they were /wə/ talking."
      - { word: buy|v, text_vi: bought /bɔːt/ (quá khứ của buy) và brought /brɔːt/ (quá khứ của bring) rất giống nhau — nghe kỹ âm /r/. }
