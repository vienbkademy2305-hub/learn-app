  - type: dialogue
    title_vi: Có nên bắt buộc mặc đồng phục?
    lines:
      - speaker: A
        text: Our teacher asked us to write about school uniforms. What's your opinion?
        vi: Cô giáo bảo bọn mình viết về đồng phục. Ý kiến của cậu thế nào?
      - speaker: B
        text: I believe uniforms should be compulsory.
        vi: Tớ cho rằng đồng phục nên là bắt buộc.
      - speaker: A
        text: Really? Why do you think so?
        vi: Thật à? Sao cậu nghĩ vậy?
      - speaker: B
        text: The main reason is that students look equal, so rich and poor children feel the same.
        vi: Lý do chính là học sinh trông bình đẳng, nên trẻ giàu và nghèo cảm thấy như nhau.
      - speaker: A
        text: I disagree. Uniforms can stop students from showing their creativity.
        vi: Tớ không đồng ý. Đồng phục có thể ngăn học sinh thể hiện sự sáng tạo.
      - speaker: B
        text: That's a fair point, but students can be creative in other ways.
        vi: Cũng có lý, nhưng học sinh có thể sáng tạo theo cách khác.
      - speaker: A
        text: Maybe. Another drawback is the cost. Some families pay a lot for them.
        vi: Có thể. Một nhược điểm khác là chi phí. Có gia đình phải trả nhiều tiền cho đồng phục.
      - speaker: B
        text: True. But one benefit is that parents do not have to buy many different clothes.
        vi: Đúng. Nhưng một lợi ích là phụ huynh không phải mua nhiều quần áo khác nhau.
      - speaker: A
        text: OK, we have different opinions, but we both have clear reasons.
        vi: Được rồi, bọn mình khác quan điểm, nhưng cả hai đều có lý do rõ ràng.
      - speaker: B
        text: Exactly. That's what the essay needs!
        vi: Chính xác. Bài luận cần đúng như thế!
  - type: exercises
    items:
      - id: b22-x1
        bank_no: 9
        kind: combine
        instructions_vi: Nối hai câu đơn thành một câu bằng từ trong ngoặc. Nhớ dấu phẩy khi cần.
        questions:
          - q: Tuition fees are high. Many students work part-time. (so)
            answer: Tuition fees are high, so many students work part-time.
            accept:
              - Tuition fees are high so many students work part-time.
          - q: Many students work part-time. Tuition fees are high. (because)
            answer: Many students work part-time because tuition fees are high.
          - q: Homework is useful. Too much homework is harmful. (but)
            answer: Homework is useful, but too much homework is harmful.
            accept:
              - Homework is useful but too much homework is harmful.
          - q: Children feel pressure. They learn less. (When … ,)
            answer: When children feel pressure, they learn less.
            accept:
              - When children feel pressure they learn less.
          - q: Students read more. They write better. (If … ,)
            answer: If students read more, they write better.
            accept:
              - If students read more they write better.
          - q: Uniforms are cheap. They look tidy. (and)
            answer: Uniforms are cheap, and they look tidy.
            accept:
              - Uniforms are cheap and they look tidy.
      - id: b22-x2
        bank_no: 7
        kind: error-correction
        instructions_vi: "Đoạn văn có 5 lỗi nối câu và dùng từ. Sửa trực tiếp. Lỗi dấu phẩy nối hai câu: tách thành hai câu."
        text: Because practical skills are useful, so schools should teach them. Cooking is essential, every adult needs it. I am agree with this idea. In my opinion, I think money skills are important too. Students should learn them. Because they help young people become independent.
        errors:
          - wrong: Because practical skills are useful, so schools
            right: Because practical skills are useful, schools
            why: Because và so không đi cùng nhau.
          - wrong: Cooking is essential, every adult needs it.
            right: Cooking is essential. Every adult needs it.
            why: Comma splice — tách câu.
          - wrong: I am agree
            right: I agree
            why: agree là động từ thường, không đi với am.
          - wrong: In my opinion, I think money skills
            right: In my opinion, money skills
            why: In my opinion và I think lặp ý — chỉ giữ một.
          - wrong: Students should learn them. Because they help
            right: Students should learn them because they help
            why: Mệnh đề because không đứng riêng thành câu.
      - id: b22-x3
        bank_no: 10
        kind: mcq
        instructions_vi: "Đề: 'Some people think that all students should study a foreign language at school. To what extent do you agree or disagree?' Chọn đáp án đúng."
        questions:
          - q: What is the TOPIC of this question?
            options:
              - studying abroad
              - learning a foreign language at school
              - the best school subjects
              - teachers of foreign languages
            answer: b
          - q: Which word limits the scope and must NOT be ignored?
            options:
              - some
              - all
              - people
              - school
            answer: b
            explain_vi: "'all students' — bài phải bàn về mọi học sinh, không chỉ học sinh giỏi."
          - q: Which sentence is the best paraphrase of the question?
            options:
              - Some people think that all students should study a foreign language at school.
              - It is often argued that every student should learn another language at school.
              - Foreign languages are very difficult for many students.
              - There are many languages in the world today.
            answer: b
            explain_vi: a chép nguyên đề; c, d lạc ý.
          - q: Which is the best thesis statement?
            options:
              - There are different opinions about this topic.
              - Languages are interesting.
              - I completely agree with this view because a second language opens more job opportunities and helps students understand other cultures.
              - In my opinion, I think I agree.
            answer: c
            explain_vi: Có quan điểm rõ + 2 lý do báo trước.
          - q: Which is a good topic sentence for Body paragraph 1?
            options:
              - For example, my cousin speaks Japanese.
              - The main reason why every student should learn a foreign language is that it helps them find better jobs.
              - Many people have different opinions.
              - In conclusion, languages are useful.
            answer: b
      - id: b22-x4
        bank_no: 5
        kind: paraphrase
        instructions_vi: Viết lại câu với nghĩa không đổi, dùng từ trong ngoặc.
        questions:
          - q: Some people think that sport should be a compulsory subject. (argue)
            answer: Some people argue that sport should be a compulsory subject.
            accept:
              - It is often argued that sport should be a compulsory subject.
          - q: One advantage of uniforms is that they save time. (benefit)
            answer: One benefit of uniforms is that they save time.
          - q: The biggest disadvantage of online classes is the lack of contact. (drawback)
            answer: The biggest drawback of online classes is the lack of contact.
            accept:
              - The main drawback of online classes is the lack of contact.
          - q: I do not agree with this idea. (disagree)
            answer: I disagree with this idea.
          - q: Homework makes children feel stressed. (pressure)
            answer: Homework puts pressure on children.
            accept:
              - Homework puts a lot of pressure on children.
              - Homework puts too much pressure on children.
      - id: b22-x5
        bank_no: 3
        kind: collocation
        instructions_vi: Ghép động từ với cụm danh từ phù hợp.
        pairs:
          - left: put
            right: pressure on students
          - left: develop
            right: creativity
          - left: express
            right: an opinion
          - left: have
            right: a positive effect on health
          - left: give
            right: clear reasons
      - id: b22-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: compulsory
            right: that you must do because of a rule
          - left: independent
            right: able to do things without help from others
          - left: drawback
            right: a problem or bad side of something
          - left: essential
            right: very important and necessary
          - left: practical
            right: "useful in real life, not only in theory"
      - id: b22-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Man: Do you think school uniforms should be compulsory?
          Woman: Yes, I do. They're cheap, and students look equal.
          Man: I disagree. Students can't show their creativity.
          Woman: But if there are no uniforms, rich students wear expensive clothes, and poor students feel pressure.
          Man: That's true, but I still believe students should choose.
        questions:
          - { q: What is the woman's opinion?, options: [ Uniforms should be compulsory., Uniforms are too expensive., Students should choose their clothes., She has no opinion. ], answer: a }
          - { q: What is the man's main reason?, options: [ Uniforms are cheap., Students can't show their creativity., Uniforms look ugly., Teachers don't like them. ], answer: b }
          - { q: "According to the woman, who feels pressure without uniforms?", options: [ rich students, teachers, poor students, parents ], answer: c }
      - id: b22-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: Many parents believe that homework is essential. However, some teachers argue that too much homework puts pressure on children, so they have less time to play. In my opinion, a small amount of homework is useful, but primary school children should not spend more than an hour a day on it.
        questions:
          - { q: All parents think homework is essential., answer: F, explain_vi: "Many parents, không phải all." }
          - { q: Some teachers think too much homework puts pressure on children., answer: T }
          - { q: The speaker thinks homework is always bad., answer: F }
          - { q: The speaker thinks primary children should do less than an hour a day., answer: T }
  - type: homework
    kind: task2
    prompt_vi: "Viết bài Writing Task 2 hoàn chỉnh (≥ 250 từ, 40 phút), bố cục 4 đoạn. Mở bài: paraphrase + thesis. Mỗi thân bài: câu luận điểm → giải thích → ví dụ. Dùng ít nhất 2 câu ghép và 3 câu phức (because/when/if). Tự kiểm tra: không nối hai câu bằng dấu phẩy, không dùng 'Because… so…'."
    prompt_en: Some people think that schools should teach practical skills, such as cooking and managing money, instead of only academic subjects. To what extent do you agree or disagree?
    words:
      min: 250
      max: 290
    minutes: 40
