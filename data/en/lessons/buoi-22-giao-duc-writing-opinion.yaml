  - type: skill
    skill: writing
    title_vi: "Writing Task 2 — bài Opinion: phân tích đề, mở bài và luận điểm"
    intro_vi: 'Task 2 chiếm khoảng 2/3 điểm Writing: 40 phút, tối thiểu 250 từ. Dạng Opinion ("Do you agree or disagree?", "To what extent do you agree or disagree?") gặp nhiều nhất. Bố cục an toàn 4 đoạn: Mở bài (2 câu) → Thân bài 1 (lý do 1) → Thân bài 2 (lý do 2) → Kết bài. Buổi này tập trung phân tích đề, viết mở bài và câu luận điểm; bài đầy đủ làm ở phần Về nhà.'
    steps:
      - title_vi: Tìm TOPIC và TASK trong đề
        text_vi: "Topic là vấn đề được bàn (VD: bài tập về nhà ở tiểu học). Task là yêu cầu (To what extent do you agree or disagree?). Gạch cả những từ giới hạn phạm vi: all, only, should, primary schools — viết lệch phạm vi là mất điểm Task Response."
      - title_vi: Chọn một quan điểm rõ ràng
        text_vi: Đồng ý, phản đối, hoặc đồng ý một phần. Ở band 5–6, chọn hẳn MỘT phía là dễ viết mạch lạc nhất. Giữ nguyên quan điểm đó từ mở bài đến kết bài.
      - title_vi: Brainstorm 2 lý do (2–3 phút)
        text_vi: "Tự hỏi: Vì sao? Ai được lợi, ai chịu thiệt? Có ví dụ nào gần gũi? Chọn 2 lý do mà bạn giải thích được và có ví dụ cụ thể."
      - title_vi: "Câu 1 mở bài: paraphrase đề"
        text_vi: "Nói lại đề bằng lời của mình: đổi từ đồng nghĩa (believe → argue, banned → not allowed) và đổi cấu trúc câu. Không chép nguyên đề — giám khảo không tính những từ chép lại."
      - title_vi: "Câu 2 mở bài: thesis statement"
        text_vi: "Nêu rõ quan điểm và (nên) báo trước 2 lý do: 'I completely agree with this view because … and …'. Mở bài chỉ khoảng 40–50 từ."
      - title_vi: Mỗi thân bài mở đầu bằng câu luận điểm
        text_vi: "Câu đầu đoạn (topic sentence) nêu MỘT lý do. Các câu sau: giải thích (This means that…) → ví dụ (For example, …) → câu chốt nối lại với quan điểm."
    tips:
      - Dành 5 phút lập dàn ý trước khi viết — bài có dàn ý mạch lạc hơn hẳn (tiêu chí Coherence & Cohesion).
      - Không mở bài kiểu văn mẫu 'Nowadays, with the development of society…' — vào thẳng đề.
      - Chỉ cần nêu 'I think / I believe' một lần ở thesis; thân bài trình bày lý lẽ, không lặp 'I think' mỗi câu.
      - 250–290 từ là vừa. Dưới 250 từ bị trừ điểm Task Response.
    traps:
      - trap_vi: Chép nguyên câu đề vào mở bài.
        fix_vi: "Paraphrase: thay từ và đổi cấu trúc (should be banned → should not be allowed; children → young learners)."
      - trap_vi: Mở bài chỉ nói 'There are different opinions about this' mà không nêu quan điểm.
        fix_vi: "Dạng Opinion bắt buộc có thesis rõ ràng: I (strongly) agree / disagree …"
      - trap_vi: Đề nói 'primary schools' nhưng bài viết về học sinh cấp 3 hoặc đại học.
        fix_vi: Luôn quay lại kiểm tra đúng đối tượng và phạm vi của đề sau mỗi đoạn.
      - trap_vi: "Nối hai ý bằng dấu phẩy: 'Homework is boring, children hate it.'"
        fix_vi: Dùng liên từ (and, so, because) hoặc tách thành hai câu.
    phrases:
      - en: It is often argued that …
        vi: Người ta thường cho rằng …
        note_vi: Mở đầu câu paraphrase đề.
      - en: I completely agree with this view because …
        vi: Tôi hoàn toàn đồng ý với quan điểm này vì …
      - en: I disagree with this idea for two main reasons.
        vi: Tôi không đồng ý với ý kiến này vì hai lý do chính.
      - en: The main reason why … is that …
        vi: Lý do chính khiến … là …
        note_vi: Câu luận điểm (topic sentence).
      - en: This means that …
        vi: Điều này có nghĩa là …
        note_vi: Câu giải thích.
      - en: For example, …
        vi: Ví dụ, …
    demo:
      title_vi: "Làm mẫu: mở bài và một đoạn thân bài"
      text_en: |-
        Question: Some people believe that homework should be banned in primary schools. To what extent do you agree or disagree?

        Introduction: It is often argued that young children should not get any homework. I completely agree with this view because homework puts too much pressure on young learners and takes away their time to play.

        Body paragraph 1: The main reason why homework should be stopped is that it causes stress for children. After six or seven hours at school, most children are tired, but many of them have to spend another two hours on exercises at home. This means that they often go to bed late and worry about their marks. For example, my nine-year-old brother often cries when he cannot finish his maths exercises. Without homework, children can rest and enjoy learning more.
      notes:
        - label: Topic / Task
          text_vi: "Topic: bài tập về nhà ở TIỂU HỌC. Task: To what extent do you agree or disagree → phải nêu quan điểm."
        - label: It is often argued that young children should not get any homework.
          text_vi: "Paraphrase: believe → argued; homework should be banned → should not get any homework; primary schools → young children."
        - label: I completely agree with this view because … and …
          text_vi: "Thesis: quan điểm rõ + báo trước 2 lý do (áp lực; mất thời gian chơi) = 2 thân bài."
        - label: The main reason why homework should be stopped is that …
          text_vi: Câu luận điểm của thân bài 1 — chỉ nói về lý do 1 (áp lực).
        - label: This means that … / For example, …
          text_vi: Giải thích rồi ví dụ cụ thể. Câu cuối 'Without homework, …' nối lại với quan điểm.
