        passage: |-
          THE FOUR-DAY WEEK

          A  For most of the twentieth century, the five-day, forty-hour working week was treated as normal in industrialised countries. It was itself the result of long campaigns: in the nineteenth century, factory workers often worked six days a week, for ten hours or more a day. Now some employers and researchers are asking whether it is time for another reduction.

          B  The most widely discussed model is not simply shorter hours but a '100-80-100' arrangement: employees receive 100 per cent of their pay for working 80 per cent of their previous time, on condition that they maintain 100 per cent of their output. Supporters argue that much time at work is wasted on unnecessary meetings, interruptions and tasks that add little value, and that a shorter week forces organisations to remove them.

          C  Several large trials have been carried out since 2019. In one of the best known, organised in the United Kingdom in 2022, around sixty companies tried a four-day week for six months. At the end, the great majority chose to continue. Staff reported lower stress and better sleep, and the number of sick days fell. Importantly, most companies said that revenue had stayed roughly the same.

          D  Critics, however, point to problems with how the evidence was collected. The companies in most trials volunteered to take part, so they were likely to be organisations that expected the system to work. Much of the data was based on what employees and managers reported about themselves, rather than on independent measurements. And six months may be too short to show whether the benefits last once the novelty wears off.

          E  There are also types of work for which the model is difficult to apply. In hospitals, schools and shops, a service must be provided for a fixed number of hours, and productivity cannot easily be increased by removing meetings. For such organisations, a four-day week for each employee may simply mean hiring more staff, which raises costs.

          F  Even so, the debate has already changed how many people think about work. Some companies that rejected a full four-day week have introduced 'focus time' with no meetings, or have allowed staff to work compressed hours. Whether or not the four-day week becomes standard, the assumption that productivity depends on hours spent at a desk is being questioned as never before.
