        passage: |-
          THE MYTH OF THE LONE GENIUS

          A  Popular history loves a lone genius. Newton sits under a tree and discovers gravity; Edison works through the night and invents the light bulb. These stories are memorable, and they are not entirely false. But in my view they give a seriously distorted picture of how new ideas actually come about.

          B  Consider the light bulb. Edison did not invent it. More than twenty inventors had produced working electric lamps before him, and in Britain Joseph Swan was developing a very similar design at the same time. What Edison's laboratory achieved was a practical, long-lasting bulb and, just as importantly, a system of power stations and cables to make it useful. That achievement depended on a team of skilled assistants whose names are now almost forgotten.

          C  The pattern is common. Historians of science have recorded hundreds of cases of 'multiple discovery', in which two or more people arrive at the same idea independently and at about the same time. Calculus was developed separately by Newton and Leibniz; the theory of evolution by natural selection occurred to both Darwin and Wallace. Such cases suggest that new ideas become possible when the necessary knowledge and tools are available, rather than appearing from nowhere in the mind of one exceptional person.

          D  Why, then, does the myth survive? Part of the reason is that stories need heroes, and a single name is easier to remember than a network of contributors. Another is that the system of patents and prizes rewards individuals, so there are strong incentives to claim sole credit. I suspect, too, that the myth flatters us: it is pleasant to imagine that one brilliant mind can change the world.

          E  The myth is not harmless. If young people believe that great work is done only by rare geniuses, those who do not see themselves in that way may decide that science or invention is not for them. It may also lead organisations to invest in finding 'stars' rather than in building teams in which people share ideas freely, which is where, I would argue, most progress actually happens.

          F  None of this means that individuals do not matter. Darwin's years of careful observation shaped how his theory was presented and received, and not every member of a team contributes equally. The point is rather that talent works within a particular environment. Recognising this would give us a more accurate history — and perhaps a more productive future.
