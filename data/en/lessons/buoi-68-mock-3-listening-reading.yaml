        instructions_vi: LISTENING PART 4 · Câu 31–40. Bài giảng về phục hồi rạn san hô. Viết MỘT TỪ cho mỗi chỗ trống.
        max_words: 1
        audio_text: This afternoon I'm going to talk about efforts to restore coral reefs. Coral reefs cover less than one per cent of the ocean floor, but they support about a quarter of all marine species, so their loss is a serious concern. Corals are animals, not plants, although they live in partnership with tiny algae. The algae live inside the coral and provide it with food, and they also give the coral its colour. When the water becomes too warm, the coral pushes the algae out, and it turns white. This is known as bleaching. If temperatures return to normal quickly, the coral can recover, but if not, it starves. So what can be done? The most common method is coral gardening. Small pieces of healthy coral are collected and grown in underwater nurseries, often hanging from structures that look a bit like trees. After six to twelve months, they are large enough to be planted back onto the damaged reef. One problem with this method is scale. It is slow and labour-intensive, and it is very expensive to restore large areas. Another approach is to use sound. Scientists have found that a healthy reef is a noisy place, full of the sounds of fish and shrimp. When they placed underwater speakers playing these sounds on damaged reefs, more young fish arrived and stayed. A third, more controversial approach is selective breeding. Researchers choose corals that have survived heatwaves and breed from them, in the hope of producing corals that can tolerate higher temperatures. Critics worry that this could reduce genetic variety. Finally, it is important to remember that none of these methods addresses the main cause of the problem, which is rising ocean temperatures. Restoration can buy time, but it cannot replace action on climate change.
