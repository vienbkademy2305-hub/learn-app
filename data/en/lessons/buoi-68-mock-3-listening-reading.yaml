      - id: b68-x8
        bank_no: 13
        kind: tfng
        instructions_vi: READING PASSAGE 1 · Câu 1–8. Khoảng 20 phút cho cả bài 1 (câu 1–13). Chọn TRUE / FALSE / NOT GIVEN.
        passage: |-
          THE HUMBLE SHIPPING CONTAINER

          In 1956, a converted oil tanker called the Ideal X sailed from New Jersey to Houston carrying fifty-eight metal boxes. It was not an impressive sight, but the voyage changed world trade. The man behind it was Malcom McLean, a trucking businessman who had become frustrated by how long it took to load and unload ships.

          Before the container, goods were loaded one item at a time. Sacks, barrels and boxes of different sizes were carried onto ships by teams of dock workers, a process known as 'break-bulk' shipping. A ship could spend more time in port than at sea, and theft was common. McLean's idea was simple: put the goods into a standard box, and move the whole box from a lorry onto the ship and off again without opening it.

          The idea was not entirely new — railways and some shipping lines had experimented with boxes before — but McLean was the first to build a complete system around it, including special cranes and ships. The results were dramatic. Loading costs fell from almost six dollars per ton to around sixteen cents, and ships could be turned around in hours rather than days.

          For the first decade, however, progress was slow. Different companies used boxes of different sizes, so a container from one company could not be carried on another company's ship. It was not until the late 1960s that international standards were agreed, including the size that is still most familiar today: the twenty-foot box, which became the industry's unit of measurement, the 'TEU'.

          Containers also needed a reason to spread, and the Vietnam War provided one. The US military was struggling to supply its troops, and McLean's company was contracted to carry supplies across the Pacific. On the way back, rather than return empty, the ships stopped in Japan and collected goods for the American market — an early sign of the trade routes that would later dominate the world economy.

          Today, around 90 per cent of non-bulk cargo travels in containers, and the largest ships can carry more than 24,000 TEU. The change has not been good for everyone. Dock work, which once employed hundreds of thousands of people, is now largely automated, and many old port cities lost their main source of employment as new container ports were built in places with deeper water and more space.
        questions:
          - q: 1 · McLean worked in road transport before he became involved in shipping.
            answer: T
            explain_vi: "'a trucking businessman' — trucking = vận tải đường bộ bằng xe tải."
          - q: 2 · The Ideal X was built specially to carry containers.
            answer: F
            explain_vi: "'a converted oil tanker' = tàu chở dầu được hoán cải, không phải đóng riêng."
          - q: 3 · Theft from ships was a problem in the break-bulk system.
            answer: T
          - q: 4 · McLean was the first person to think of transporting goods in boxes.
            answer: F
            explain_vi: "'The idea was not entirely new' → người khác đã thử trước."
          - q: 5 · McLean made a large personal fortune from his invention.
            answer: NG
            explain_vi: Bài không nói về tài sản của McLean.
          - q: 6 · In the early years, containers from different companies were not compatible.
            answer: T
          - q: 7 · McLean's ships carried Japanese goods to America on their return journeys.
            answer: T
          - q: 8 · Most of the old port cities have now recovered economically.
            answer: NG
            explain_vi: Bài chỉ nói họ mất nguồn việc làm chính, không nói về sự phục hồi.
