          - q: 27 · Stories about lone geniuses are completely untrue.
            answer: N
            explain_vi: "'they are not entirely false' → tác giả KHÔNG cho là hoàn toàn sai."
          - q: 28 · Edison's success depended on the work of other people.
            answer: Y
            explain_vi: "'That achievement depended on a team of skilled assistants'."
          - q: 29 · Swan's bulb was more reliable than Edison's.
            answer: NG
            explain_vi: Bài chỉ nói Swan phát triển thiết kế tương tự, không so sánh độ bền.
          - q: 30 · The patent system encourages people to claim individual credit.
            answer: Y
          - q: 31 · The lone genius myth may discourage some young people from science.
            answer: Y
