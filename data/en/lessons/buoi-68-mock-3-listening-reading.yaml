# Buổi 68 — Mock test 3 · Listening + Reading — bản đồ, nối câu, tóm tắt có hộp từ. Tự soạn theo lo-trinh-ielts-6.5.md. BẢN NHÁP chờ duyệt.
slug: buoi-68-mock-3-listening-reading
number: 68
stage: 4
title_vi: Mock test 3 · Listening + Reading — bản đồ, nối câu, tóm tắt có hộp từ
focus:
  grammar: Không học điểm mới — chữa lỗi phát sinh khi làm đề
  skill: "Listening + Reading — đề thứ ba: bản đồ, matching headings, nối nửa câu, tóm tắt có hộp từ; chốt 2 dạng yếu nhất sau 3 lần mock"
target_band: 6.0-6.5
source: editorial
status: draft
steps:
  - type: skill
    skill: listening
    title_vi: Mock 3 — và chốt kỹ năng cần luyện riêng
    intro_vi: "Đây là lần mock Listening + Reading cuối trước khi chuyển sang Writing (Buổi 69–71) và Speaking (Buổi 72–74). Đề có các dạng chưa xuất hiện ở Mock 1–2: định vị trên bản đồ (Listening Part 2), câu trả lời ngắn, nối nửa câu và tóm tắt có hộp từ (Reading). Sau khi chấm, bạn có ba lần kết quả để chọn ra HAI dạng câu yếu nhất cho Buổi 75–76."
    steps:
      - title_vi: "Bản đồ (Listening): định hướng trước khi nghe"
        text_vi: "Trong 30 giây đọc đề, tìm điểm xuất phát (thường là lối vào hoặc 'You are here'), xác định Bắc/Nam và các mốc đã có tên. Khi nghe, dùng ngón tay đi theo lời người nói: 'go straight ahead', 'turn left', 'opposite', 'next to', 'in the corner'. Mỗi câu hỏi tương ứng một địa điểm theo đúng thứ tự trong bài nói."
      - title_vi: "Nối nửa câu (Reading): ngữ pháp loại bớt đáp án"
        text_vi: Đọc nửa đầu, đoán nửa sau cần gì (động từ, danh từ, mệnh đề). Loại các phần cuối không khớp ngữ pháp, rồi tìm trong bài để chọn giữa các phần còn lại. Có nhiều phần cuối hơn số câu hỏi.
      - title_vi: "Tóm tắt có hộp từ: đoán loại từ trước"
        text_vi: "Với mỗi chỗ trống, quyết định cần danh từ, tính từ hay động từ, số ít hay số nhiều. Từ trong hộp thường là TỪ ĐỒNG NGHĨA với từ trong bài, không phải từ chép nguyên văn. Hai từ trong hộp có thể cùng loại nhưng nghĩa ngược nhau (increase/decline): chọn theo bài."
      - title_vi: Chọn 2 dạng yếu nhất cho Buổi 75–76
        text_vi: Cộng số câu sai của từng dạng qua Mock 1–3. Chia cho tổng số câu của dạng đó để có tỉ lệ sai. Hai dạng có tỉ lệ sai cao nhất (và cùng một nguyên nhân lặp lại) là trọng tâm luyện riêng.
    tips:
      - "Bản đồ: 'opposite' = đối diện (bên kia đường/hành lang); 'next to' = sát bên; 'beyond' = đi quá; 'at the far end' = ở tận cùng."
      - "Câu trả lời ngắn: câu hỏi What/Which/Where chỉ cần danh từ, không viết cả câu, không vượt số từ."
      - "Matching headings: đọc câu đầu và câu cuối của đoạn trước, nhưng đừng chọn chỉ vì một từ trùng."
    traps:
      - trap_vi: "Bản đồ: người nói đi một hướng rồi đổi ý ('Actually, it's easier if you go round the back')."
        fix_vi: Đi theo lộ trình CUỐI CÙNG. Đánh dấu nhẹ bằng bút chì để xóa được.
      - trap_vi: "Tóm tắt có hộp từ: chọn từ xuất hiện nguyên văn trong bài nhưng sai nghĩa."
        fix_vi: Đọc cả câu tóm tắt sau khi điền. Câu phải đúng ngữ pháp VÀ đúng ý bài.
      - trap_vi: Nhầm F với NG khi bài nói về chủ đề gần giống (lỗi riêng của bạn).
        fix_vi: F chỉ khi bài nói điều ngược lại. Bài không đề cập → NG, kể cả khi điều đó nghe rất hợp lý.
    phrases:
      - en: Go straight ahead and it's on your right.
        vi: Đi thẳng, nó ở bên phải bạn.
      - en: It's opposite the café.
        vi: Nó đối diện quán cà phê.
      - en: At the far end of the corridor.
        vi: Ở tận cuối hành lang.
      - en: Just beyond the car park.
        vi: Ngay sau bãi đỗ xe (đi qua bãi xe một chút).
