  - type: skill
    skill: listening
    title_vi: Listening — gắn nhãn bản đồ, sơ đồ (map/plan labelling)
    intro_vi: 'Thường xuất hiện ở Part 2: một người hướng dẫn giới thiệu một khu vực (công viên, trung tâm thể thao, bảo tàng) và bạn ghép tên địa điểm với chữ cái A–H trên bản đồ. Khó ở chỗ phải vừa nghe vừa "đi" theo lời chỉ dẫn. Điểm tựa: tìm đúng vị trí người nói bắt đầu và nắm chắc các cụm chỉ vị trí.'
    steps:
      - title_vi: Định hướng bản đồ khi đọc trước
        text_vi: Tìm điểm xuất phát ('You are here', lối vào), la bàn (N/S/E/W), các địa điểm đã có tên sẵn. Những địa điểm có sẵn tên chính là mốc người nói sẽ nhắc.
      - title_vi: Đánh dấu đường đi bằng bút chì
        text_vi: "Đặt bút ở điểm xuất phát và di chuyển theo lời nói: go straight, turn left, go past… Luôn tự hỏi: 'Bây giờ mình đang đứng đâu, quay mặt hướng nào?'"
      - title_vi: Đọc trước danh sách tên cần điền
        text_vi: Các địa điểm cần gắn nhãn thường được nhắc THEO THỨ TỰ câu hỏi. Gạch từ khóa (gym, café, first aid room) để nghe ra khi chúng xuất hiện.
      - title_vi: Nghe cụm chỉ vị trí + mốc
        text_vi: "Đáp án thường là 'mốc + cụm vị trí': 'directly opposite reception', 'at the end of the path', 'just past the pool'."
      - title_vi: Cẩn thận chữ cái nhiễu
        text_vi: Bản đồ có nhiều chữ cái hơn số câu hỏi. Người nói có thể nhắc một địa điểm rồi nói 'but that's not…', hoặc nói nơi đó đã bị dời đi.
    tips:
      - Nếu bản đồ không có la bàn, dùng left/right theo hướng người nói đang đi, không phải theo tờ giấy.
      - clockwise / anticlockwise hay xuất hiện khi mô tả đường vòng quanh hồ, quanh sân.
      - Bị lạc thì đợi mốc có tên tiếp theo để 'bắt' lại vị trí — đừng bỏ cả phần còn lại.
    traps:
      - trap_vi: Nhầm in the north of và to the north of.
        fix_vi: in = nằm trong khu vực; to = nằm ngoài, về phía đó.
      - trap_vi: Nhầm trái/phải khi người nói đang đi ngược chiều bản đồ.
        fix_vi: Xoay bản đồ (hoặc tưởng tượng) theo hướng người nói đang đi.
      - trap_vi: Chọn ngay địa điểm được nhắc đầu tiên.
        fix_vi: "Nghe hết câu: 'The café used to be here, but it's now next to the pool.'"
    phrases:
      - en: As you come in through the main entrance, …
        vi: Khi bạn vào qua lối chính, …
        note_vi: Điểm xuất phát.
      - en: It's the first room on your right.
        vi: Đó là phòng đầu tiên bên phải bạn.
      - en: If you go past the pool, you'll see …
        vi: Nếu bạn đi qua bể bơi, bạn sẽ thấy …
      - en: It's directly opposite reception.
        vi: Nó ở ngay đối diện quầy lễ tân.
      - en: at the far end of the building
        vi: ở tận cuối tòa nhà
    demo:
      title_vi: "Làm mẫu: từ lời nói đến chữ cái"
      text_en: |-
        Plan of the ground floor (you enter from the south):
        A – first door on the left after the entrance
        B – first door on the right after the entrance
        C – in the centre of the building
        D – at the far end, on the left
        E – at the far end, on the right

        Speaker: "As you come in, reception is straight ahead, in the centre of the building. The café is the first door on your right. And if you walk past reception to the far end, the gym is on your left."
      notes:
        - label: reception → C
          text_vi: "'straight ahead, in the centre of the building' khớp với C."
        - label: café → B
          text_vi: "'first door on your right' — bạn đang đi từ lối vào phía nam lên, nên bên phải là B."
        - label: gym → D
          text_vi: "'walk past reception to the far end… on your left' = D. E là chữ cái nhiễu không được nhắc."
