  - type: skill
    skill: reading
    title_vi: "Reading — Matching information: đoạn nào chứa thông tin?"
    intro_vi: "Đề cho một bài đọc có các đoạn A, B, C… và một danh sách câu mô tả thông tin (VD 'an example of…', 'a reason why…'). Bạn phải tìm ĐOẠN chứa từng thông tin. Khác Matching headings (Buổi 29): ở đây thông tin là một CHI TIẾT nhỏ trong đoạn, không phải ý chính; câu hỏi KHÔNG theo thứ tự bài; một đoạn có thể dùng nhiều lần hoặc không dùng. Đây là dạng khó và tốn thời gian, nên thường làm SAU các dạng khác cùng bài."
    steps:
      - title_vi: Đọc yêu cầu
        text_vi: "'You may use any letter more than once' → một đoạn có thể là đáp án của 2 câu. Ghi nhớ điều này để không loại đoạn quá sớm."
      - title_vi: Gạch LOẠI thông tin + từ khóa
        text_vi: "Mỗi câu có 2 phần: loại thông tin (an example / a reason / a comparison / a description / a warning / a suggestion) + nội dung (… of fake news spreading). Loại thông tin giúp nhận ra câu đúng: 'a reason' → tìm because, due to, the main cause…; 'an example' → for example, such as, tên người, năm."
      - title_vi: Đọc lướt cả bài một lần
        text_vi: "Ghi 3–5 từ tóm tắt nội dung mỗi đoạn bên lề (A: history, B: why people share, C: example Vietnam…)."
      - title_vi: Làm câu dễ trước
        text_vi: Câu có tên riêng, số, năm → scan là tìm ra. Câu trừu tượng để sau.
      - title_vi: Đọc kỹ đoạn nghi ngờ
        text_vi: So sánh cả LOẠI và NỘI DUNG. Đoạn chỉ nhắc tới chủ đề nhưng không đưa đúng loại thông tin (VD có nói về fake news nhưng không có ví dụ) → không phải đáp án.
    tips:
      - "Từ khóa trong câu hỏi hầu như luôn bị paraphrase: 'a suggestion for young people' ↔ 'students should…'."
      - Nếu hết giờ, đoán đoạn có nhiều chi tiết nhất (đoạn dài, nhiều số liệu) — xác suất cao hơn.
      - although / despite / however trong bài báo hiệu thông tin đối lập — hay là chỗ đặt câu hỏi 'a contrast between…'.
    traps:
      - trap_vi: Chọn đoạn vì thấy trùng một từ.
        fix_vi: "Kiểm tra LOẠI thông tin: câu hỏi cần 'a reason', đoạn chỉ có 'an example' → sai."
      - trap_vi: Nghĩ mỗi đoạn chỉ dùng một lần.
        fix_vi: Đọc kỹ yêu cầu; nhiều đề cho dùng lại chữ cái.
      - trap_vi: Làm dạng này đầu tiên và mất 10 phút.
        fix_vi: Làm các dạng khác của bài trước — lúc đó bạn đã quen nội dung từng đoạn.
    phrases:
      - en: Which paragraph contains the following information?
        vi: Đoạn nào chứa thông tin sau?
      - en: NB You may use any letter more than once.
        vi: "Lưu ý: bạn có thể dùng một chữ cái nhiều lần."
      - en: a reference to …
        vi: một chỗ nhắc tới …
      - en: an explanation of why …
        vi: lời giải thích vì sao …
      - en: a comparison between … and …
        vi: sự so sánh giữa … và …
    demo:
      title_vi: "Làm mẫu: loại thông tin quyết định đáp án"
      text_en: |-
        B  Researchers have found that false stories are shared more often than true ones. The main reason seems to be emotion: fake news is usually more surprising or frightening, and people like to share surprising things.

        C  For example, in 2020 a post claimed that drinking hot water every fifteen minutes could stop a virus. Although doctors said it was false, the post was shared millions of times.

        Question: Which paragraph contains … an explanation of why people share false stories?
      notes:
        - label: Loại thông tin
          text_vi: "'an explanation of why' → tìm lý do: because, the reason is…"
        - label: Đoạn C — bẫy
          text_vi: Có nói về tin giả được chia sẻ, nhưng là MỘT VÍ DỤ (For example, in 2020…), không giải thích vì sao.
        - label: "Đáp án: B"
          text_vi: "'The main reason seems to be emotion…' = explanation of why. Paraphrase: shared more often ↔ people share."
