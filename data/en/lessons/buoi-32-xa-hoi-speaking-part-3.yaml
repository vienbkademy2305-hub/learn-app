  - type: dialogue
    title_vi: "Part 3: Gia đình ngày nay"
    lines:
      - speaker: Examiner
        text: How have gender roles in families changed in your country?
        vi: Vai trò giới trong gia đình ở nước bạn đã thay đổi thế nào?
      - speaker: Candidate
        text: They've changed a lot. In the past, men earned money, whereas women did all the household chores.
        vi: Thay đổi nhiều lắm. Trước đây đàn ông kiếm tiền, còn phụ nữ làm hết việc nhà.
      - speaker: Candidate
        text: Nowadays, most women work, so couples share the chores. Take my parents, for example. My father cooks dinner three times a week.
        vi: Ngày nay phần lớn phụ nữ đi làm, nên các cặp vợ chồng chia nhau việc nhà. Lấy bố mẹ tôi làm ví dụ. Bố tôi nấu bữa tối ba lần một tuần.
      - speaker: Examiner
        text: Why do some teenagers not communicate well with their parents?
        vi: Vì sao một số thiếu niên không giao tiếp tốt với bố mẹ?
      - speaker: Candidate
        text: I'd say it's mainly because of the generation gap. Parents and teenagers often have different values.
        vi: Tôi cho là chủ yếu do khoảng cách thế hệ. Bố mẹ và con tuổi teen thường có quan niệm khác nhau.
      - speaker: Candidate
        text: For instance, many parents think social media is a waste of time, but for teenagers it's how they keep in touch with friends.
        vi: Ví dụ, nhiều bố mẹ nghĩ mạng xã hội là lãng phí thời gian, nhưng với thiếu niên đó là cách giữ liên lạc với bạn bè.
      - speaker: Examiner
        text: Should parents be strict with their children?
        vi: Bố mẹ có nên nghiêm khắc với con không?
      - speaker: Candidate
        text: It depends on the age of the child. Young children need clear rules. However, if parents are too strict with teenagers, they may stop telling their parents the truth.
        vi: Còn tùy vào tuổi của con. Trẻ nhỏ cần quy tắc rõ ràng. Tuy nhiên, nếu bố mẹ quá nghiêm với con tuổi teen, con có thể không còn nói thật với bố mẹ.
  - type: exercises
    items:
      - id: b32-x1
        bank_no: 10
        kind: mcq
        instructions_vi: "Chọn từ đúng: lý do + mệnh đề hay + danh từ? ví dụ mở câu hay nằm trong câu?"
        questions:
          - q: Many couples have fewer children ___ the high cost of education.
            options:
              - because
              - because of
              - since
              - so
            answer: b
          - q: Teenagers argue with their parents ___ they want more freedom.
            options:
              - because of
              - due to
              - because
              - such as
            answer: c
          - q: Children can help with easy chores, ___ washing the dishes.
            options:
              - for example
              - such as
              - because
              - due to
            answer: b
          - q: Grandparents play an important role. ___, they often look after children while parents work.
            options:
              - Such as
              - Because of
              - For instance
              - Due to
            answer: c
          - q: Some young people leave home early ___ peer pressure.
            options:
              - because
              - due to
              - for example
              - since
            answer: b
          - q: ___ both parents work, children spend more time with their grandparents.
            options:
              - Because of
              - Due to
              - Since
              - Such as
            answer: c
            explain_vi: Since = because, theo sau là mệnh đề (both parents work).
      - id: b32-x2
        bank_no: 9
        kind: combine
        instructions_vi: Nối hai câu bằng từ trong ngoặc. Viết thành MỘT câu (hoặc hai câu nếu từ nối đứng đầu câu thứ hai).
        questions:
          - q: Many parents feel stressed. They work long hours. (because)
            answer: Many parents feel stressed because they work long hours.
          - q: Many parents feel stressed. Long working hours. (because of)
            answer: Many parents feel stressed because of long working hours.
          - q: Fathers now do more at home. My uncle cooks every day. (For example)
            answer: Fathers now do more at home. For example, my uncle cooks every day.
          - q: Children should learn practical skills. Cooking and cleaning are practical skills. (such as)
            answer: Children should learn practical skills such as cooking and cleaning.
            accept:
              - Children should learn practical skills, such as cooking and cleaning.
      - id: b32-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: "Câu trả lời Part 3 (đã chép ra) có 5 lỗi: because/because of, such as, nowadays + thì, influence, strict. Sửa trực tiếp."
        text: I think parents today are less strict than before. This is because of families are smaller. Nowadays, many parents have spent more time with their kids. Such as my parents always ask for my opinion. However, children are also influenced to social media, so parents should be strict to them about screen time.
        errors:
          - wrong: because of families are smaller
            right: because families are smaller
            why: Trước mệnh đề (families are smaller) dùng because.
          - wrong: Nowadays, many parents have spent
            right: Nowadays, many parents spend
            why: nowadays đi với hiện tại đơn khi nói về thói quen, tình trạng chung.
          - wrong: Such as my parents always ask
            right: For example, my parents always ask
            why: Mở câu ví dụ bằng For example/For instance, không bằng Such as.
          - wrong: influenced to social media
            right: influenced by social media
            why: be influenced BY something.
          - wrong: strict to them
            right: strict with them
            why: be strict WITH somebody.
      - id: b32-x4
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: Men and women should have ___ rights at work.
            base: equality
            answer: equal
          - q: Good ___ between parents and children prevents many problems.
            base: communicate
            answer: communication
          - q: Children should learn to ___ well in public places.
            base: behaviour
            answer: behave
          - q: Parents have a strong ___ on their children's values.
            base: influence
            answer: influence
            explain_vi: "Danh từ và động từ cùng dạng: have an influence ON."
          - q: My parents didn't ___ me; I had to earn my own pocket money.
            base: spoiled
            answer: spoil
      - id: b32-x5
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: role model
            right: a person that others want to copy
          - left: peer pressure
            right: influence from people of your own age to behave like them
          - left: spoil
            right: to give a child everything he or she wants
          - left: expectation
            right: a strong belief about what somebody should achieve
          - left: gender roles
            right: jobs and behaviour that society thinks are right for men or women
          - left: discipline
            right: training people to obey rules
      - id: b32-x6
        bank_no: 31
        kind: speaking-part3
        instructions_vi: "Trả lời từng câu theo khung A-R-E-A (Answer – Reason – Example – Alternative), mỗi câu 30–45 giây. Ghi âm, nghe lại, đếm: mỗi câu trả lời có ít nhất 1 lý do và 1 ví dụ chưa?"
        questions:
          - q: How have families in your country changed in the last 30 years?
          - q: Do you think grandparents should help to bring up their grandchildren?
          - q: "Who has more influence on teenagers: parents or friends? Why?"
          - q: Should children do household chores? What can they learn from them?
          - q: Do you think men and women should share the housework equally?
        sample: I'd say that friends have more influence on teenagers than parents. This is mainly because teenagers spend most of their day at school with people of their own age, and they want to be accepted by the group. For example, if everyone in the class has a certain phone or plays a certain game, a teenager will feel peer pressure to do the same. However, I think parents still influence their values, even if teenagers don't always show it.
      - id: b32-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe một thí sinh trả lời Part 3 (mỗi người một giọng) và chọn đáp án đúng.
        audio_text: |-
          Examiner: Do you think parents should give children pocket money?
          Candidate: Yes, I do, but it depends on their age. I think children over ten should get a small amount every week. This is mainly because it teaches them how to save and plan. Take my younger brother, for example. He wanted a new bicycle, so he saved his pocket money for six months. Some people say pocket money spoils children. However, if parents give it for doing chores, children learn that money comes from work.
        questions:
          - q: What is the candidate's main answer?
            options:
              - Children should never get pocket money.
              - Children over ten should get pocket money.
              - Only teenagers should get pocket money.
              - Pocket money spoils children.
            answer: b
          - q: What reason does the candidate give?
            options:
              - It makes children happy.
              - It teaches children to save and plan.
              - Everyone else does it.
              - It helps parents.
            answer: b
          - q: What did the brother do?
            options:
              - He bought a phone.
              - He saved for a bicycle.
              - He spent it on sweets.
              - He gave it to his parents.
            answer: b
          - q: How does the candidate answer the opposite view?
            options:
              - He agrees completely.
              - He says pocket money for chores teaches that money comes from work.
              - He doesn't mention it.
              - He changes his opinion.
            answer: b
            explain_vi: "Bước Alternative: However + câu điều kiện loại 1."
      - id: b32-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý so sánh quá khứ – hiện tại.
        audio_text: When my grandmother was young, girls didn't usually go to university. They married early and looked after the house. My mother's generation was different. She studied economics and worked in a bank for twenty years. Nowadays, my sister and I both study at university, and our parents have the same expectations for both of us. My brother does exactly the same chores as we do.
        questions:
          - q: The speaker's grandmother went to university.
            answer: F
          - q: The speaker's mother worked in a bank.
            answer: T
          - q: The parents expect more from the son than from the daughters.
            answer: F
          - q: The speaker's brother does fewer chores than his sisters.
            answer: F
  - type: homework
    kind: speaking
    prompt_vi: "Ghi âm câu trả lời cho 5 câu hỏi Part 3 dưới đây, mỗi câu 30–45 giây, không đọc giấy (chỉ được ghi 3–4 từ khóa). Nghe lại và chép ra một câu trả lời: gạch chân bước A, R, E, A. Kiểm tra lỗi because/because of, For example/such as. Nộp bản ghi âm hoặc bản chép."
    prompt_en: "1. What are the advantages of living in an extended family? 2. Why do some young people not want to have children? 3. How can parents bridge the generation gap? 4. Do you think children today have a better childhood than in the past? 5. Who should be responsible for teaching children good behaviour: parents or schools?"
    minutes: 25
