  - type: skill
    skill: speaking
    title_vi: "Speaking Part 3 — thảo luận: trả lời dài, có lý do và ví dụ"
    intro_vi: "Part 3 kéo dài 4–5 phút, ngay sau Part 2 và cùng chủ đề nhưng ở mức XÃ HỘI chứ không còn về bản thân: 'Why do…?', 'How has … changed?', 'Do you think … should …?'. Giám khảo muốn nghe bạn giải thích và phát triển ý (tiêu chí Fluency & Coherence). Mỗi câu nên nói khoảng 30–45 giây, tức 4–6 câu. Không có đáp án đúng/sai — chỉ có câu trả lời được phát triển hay không."
    steps:
      - title_vi: Nhận dạng loại câu hỏi
        text_vi: Ý kiến (Do you think…?) · Nguyên nhân (Why…?) · So sánh quá khứ–hiện tại (How has … changed?) · Dự đoán (Will … in the future?) · Đề xuất (What should … do?). Mỗi loại có mở đầu riêng — xem mục Mẫu câu.
      - title_vi: "A — Answer: trả lời thẳng"
        text_vi: "Câu đầu trả lời ngay câu hỏi: 'I think parents should be strict, but only to some extent.' Có thể nói 'It depends' nhưng phải nói ngay depends on cái gì."
      - title_vi: "R — Reason: vì sao"
        text_vi: "'This is because…' / 'The main reason is that…'. Một lý do được giải thích rõ tốt hơn ba lý do liệt kê."
      - title_vi: "E — Example: ví dụ cụ thể"
        text_vi: "'For example, in Vietnam…', 'For instance, my cousin…'. Ví dụ có thể từ bản thân, gia đình, đất nước, tin tức."
      - title_vi: "A — Alternative: mặt khác / kết quả"
        text_vi: "Thêm một câu nhìn mặt kia hoặc hệ quả: 'However, if parents are too strict, …' / 'As a result, …'. Câu điều kiện loại 1 rất hợp ở bước này."
    tips:
      - "Câu hỏi khó? Mua thời gian bằng một câu tự nhiên: 'That's an interesting question. Let me think…' — rồi trả lời. Không im lặng."
      - Nói về NGƯỜI NÓI CHUNG (people, parents, young people), không chỉ 'I'. Part 3 là câu hỏi về xã hội.
      - "So sánh quá khứ – hiện tại: dùng quá khứ đơn/used to cho trước đây và hiện tại đơn/hiện tại hoàn thành cho bây giờ."
      - Không cần đúng sự thật tuyệt đối — giám khảo chấm ngôn ngữ, không chấm kiến thức.
    traps:
      - trap_vi: "Trả lời 1 câu rồi dừng: 'Yes, I think so.'"
        fix_vi: "Luôn đi đủ A-R-E: trả lời → vì sao → ví dụ. Nếu còn thời gian, thêm mặt kia."
      - trap_vi: Kể chuyện cá nhân quá dài như Part 2.
        fix_vi: "Ví dụ cá nhân chỉ 1–2 câu, rồi quay lại ý chung: '…and I think this is true for many families.'"
      - trap_vi: Dùng because of + mệnh đề, hoặc mở câu bằng Such as.
        fix_vi: because + S + V; because of + danh từ; For example + câu đầy đủ.
      - trap_vi: Học thuộc câu mẫu dài và đọc ra.
        fix_vi: Giám khảo nhận ra ngay và có thể hạ điểm. Chỉ học KHUNG (mở đầu, nối ý), nội dung tự nghĩ.
    phrases:
      - en: I'd say that …
        vi: Tôi cho là …
        note_vi: Mở đầu câu ý kiến, mềm hơn I think.
      - en: It depends on …
        vi: Còn tùy vào …
        note_vi: Phải nói tiếp tùy vào gì.
      - en: This is mainly because …
        vi: Điều này chủ yếu là vì …
      - en: Take my family, for example.
        vi: Lấy gia đình tôi làm ví dụ.
      - en: In the past, … whereas nowadays …
        vi: Trước đây … trong khi ngày nay …
        note_vi: Câu hỏi so sánh quá khứ – hiện tại.
      - en: On the one hand, … On the other hand, …
        vi: Một mặt … Mặt khác …
      - en: That's a difficult question, but I suppose …
        vi: Câu hỏi khó đấy, nhưng tôi đoán là …
        note_vi: Mua thời gian.
    demo:
      title_vi: "Làm mẫu: một câu trả lời A-R-E-A"
      text_en: |-
        Examiner: Do you think parents today are stricter than in the past?

        Candidate: I'd say that they're actually less strict than before. (A) This is mainly because families are smaller now, so parents have more time to talk to their children instead of just giving orders. (R) Take my family, for example. My grandfather used to make all the decisions, but my parents always ask for my opinion. (E) However, I think some parents are now too relaxed, and if children have no rules at all, they may become spoiled. (A)
      notes:
        - label: Answer
          text_vi: Trả lời thẳng ngay câu đầu — 'less strict', có I'd say that để mềm.
        - label: Reason
          text_vi: "'This is mainly because…' + một lý do được giải thích (families are smaller → more time to talk)."
        - label: Example
          text_vi: Ví dụ gia đình, so sánh quá khứ (used to) với hiện tại (always ask).
        - label: Alternative
          text_vi: However + câu điều kiện loại 1 (Buổi 31) cho mặt kia. Cả câu trả lời ~70 từ ≈ 35 giây.
