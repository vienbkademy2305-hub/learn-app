  - type: skill
    skill: writing
    title_vi: Coherence & Cohesion — mạch lạc và liên kết ở band 6.5–7
    intro_vi: "Coherence (mạch lạc) là THỨ TỰ và LOGIC của ý: mỗi đoạn một ý chính, câu sau phát triển câu trước. Cohesion (liên kết) là CÔNG CỤ nối: từ nối, từ quy chiếu (this, these, such), từ đồng nghĩa. Band 6: 'cohesive devices used effectively, but cohesion within and/or between sentences may be faulty or mechanical'. Band 7: 'uses a range of cohesive devices appropriately although there may be some under-/over-use'. Muốn lên 7, bạn cần đa dạng VÀ tiết chế: ít từ nối hơn nhưng đúng hơn."
    steps:
      - title_vi: Mỗi đoạn một ý chính rõ ràng
        text_vi: Câu chủ đề đầu đoạn nói ý chính; mọi câu sau phục vụ ý đó. Ý mới → đoạn mới.
      - title_vi: "Chuỗi phát triển ý: nêu → giải thích → ví dụ → hệ quả"
        text_vi: Đây là 'xương sống' mạch lạc; từ nối chỉ đánh dấu các bước chuyển.
      - title_vi: Chọn từ nối theo QUAN HỆ, không theo độ 'sang'
        text_vi: "Tự hỏi: câu sau THÊM, ĐỐI LẬP, KẾT QUẢ hay VÍ DỤ so với câu trước? Rồi chọn từ trong bảng Ngữ pháp."
      - title_vi: Thay một nửa từ nối bằng từ quy chiếu
        text_vi: "'This problem…', 'Such policies…', 'These offenders…' nối câu tự nhiên hơn và cho thấy kiểm soát ngôn ngữ."
      - title_vi: Soát 'mechanical'
        text_vi: "Đếm: nếu hơn 1/2 số câu bắt đầu bằng từ nối → bỏ bớt. Không lặp một từ nối 2 lần trong bài."
    tips:
      - Đoạn thân bài 5–6 câu thường chỉ cần 2–3 từ nối.
      - "'Firstly, Secondly, Thirdly, Finally' ở MỌI đoạn nghe như danh sách — thay bằng câu chủ đề rõ ràng."
      - Ở Speaking, KHÔNG dùng moreover/furthermore/thus — dùng Also, Besides, So (Buổi 36).
    traps:
      - trap_vi: Moreover cho ý đối lập, Nevertheless cho ý cùng chiều.
        fix_vi: Kiểm tra quan hệ giữa hai câu trước khi chọn từ.
      - trap_vi: Nối hai câu bằng dấu phẩy + moreover/however/consequently.
        fix_vi: Dấu chấm + từ nối + dấu phẩy.
      - trap_vi: Từ nối ở mọi câu.
        fix_vi: Dùng this/these/such + danh từ để nối.
    phrases:
      - en: Moreover, …
        vi: Hơn nữa, …
        note_vi: Ý cùng chiều, mạnh hơn.
      - en: Nevertheless, …
        vi: Dù vậy, …
        note_vi: Thừa nhận rồi giữ quan điểm.
      - en: …, thus reducing …
        vi: …, qua đó làm giảm …
      - en: A case in point is …
        vi: Một ví dụ điển hình là …
      - en: This approach …
        vi: Cách tiếp cận này …
        note_vi: Từ quy chiếu thay cho từ nối.
    demo:
      title_vi: "Làm mẫu: một đoạn 'mechanical' và bản sửa"
      text_en: |-
        Mechanical (band 5.5–6): Firstly, prisons are expensive. Moreover, they do not reduce crime. Furthermore, prisoners meet other criminals. In addition, they cannot find jobs later. Therefore, prison is not a good solution.

        Improved (band 6.5–7): The most obvious drawback of prison is its cost, which is paid by taxpayers. More importantly, there is little evidence that it reduces crime. Offenders often meet experienced criminals inside, and many leave prison with no job prospects. Consequently, a large proportion of them reoffend within a few years, which suggests that such a system fails to protect society in the long term.
      notes:
        - label: Bản 1
          text_vi: 5 câu, 5 từ nối ở đầu câu, các câu rời rạc như danh sách → 'mechanical'.
        - label: More importantly
          text_vi: Thay Moreover — chỉ rõ ý sau quan trọng hơn.
        - label: Không từ nối ở câu 3
          text_vi: Câu 3 tự nối bằng nội dung (giải thích cho 'does not reduce crime').
        - label: Consequently + which + such a system
          text_vi: 1 từ nối kết quả, 1 mệnh đề which (Buổi 48), 1 từ quy chiếu such — cohesion đa dạng.
