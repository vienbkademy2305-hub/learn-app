  - type: dialogue
    title_vi: Hỏi về thời tiết
    lines:
      - speaker: A
        text: What's the weather like in Da Nang today?
        vi: Hôm nay thời tiết ở Đà Nẵng thế nào?
      - speaker: B
        text: It's cloudy and windy. The forecast says there is a storm tonight.
        vi: Trời nhiều mây và gió. Dự báo nói tối nay có bão.
      - speaker: A
        text: Oh no. Are you worried about it?
        vi: Ôi. Bạn có lo không?
      - speaker: B
        text: A little. My daughter is afraid of storms.
        vi: Hơi lo. Con gái mình sợ bão.
      - speaker: A
        text: Here in Hanoi it's freezing. The temperature is only nine degrees.
        vi: Ở Hà Nội thì rét cóng. Nhiệt độ chỉ có chín độ.
      - speaker: B
        text: Really? The weather in the north is very different from the weather here.
        vi: Thật à? Thời tiết miền Bắc khác hẳn ở đây.
      - speaker: A
        text: Yes. Winter here is cold and humid, but I love autumn.
        vi: Ừ. Mùa đông ở đây lạnh và ẩm, nhưng mình rất thích mùa thu.
      - speaker: B
        text: Hanoi is famous for its autumn, right?
        vi: Hà Nội nổi tiếng về mùa thu mà, đúng không?
  - type: exercises
    items:
      - id: b11-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền giới từ đúng.
        bank:
          - of
          - in
          - at
          - about
          - for
          - from
        questions:
          - q: I'm afraid ___ thunder.
            answer: of
          - q: She is interested ___ photography.
            answer: in
          - q: My brother is good ___ maths.
            answer: at
          - q: We are worried ___ the typhoon.
            answer: about
          - q: Hue is famous ___ its old buildings.
            answer: for
          - q: Summer in Sa Pa is different ___ summer in Hanoi.
            answer: from
      - id: b11-x2
        bank_no: 3
        kind: collocation
        instructions_vi: Ghép tính từ với phần còn lại cho đúng.
        pairs:
          - left: afraid
            right: of dogs
          - left: interested
            right: in history
          - left: good
            right: at cooking
          - left: worried
            right: about the exam
          - left: famous
            right: for its beaches
          - left: different
            right: from my sister
      - id: b11-x3
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: What's the weather ___ today?
            options:
              - like
              - as
              - how
              - about
            answer: a
          - q: It's ___ now. Take an umbrella.
            options:
              - rain
              - raining
              - rainy season
              - rains
            answer: b
          - q: The weather ___ says there is a storm tonight.
            options:
              - temperature
              - forecast
              - degree
              - season
            answer: b
          - q: It's thirty-five ___ in Ho Chi Minh City.
            options:
              - degree
              - degrees
              - temperatures
              - level
            answer: b
          - q: I'm not very good ___ swimming.
            options:
              - in
              - on
              - at
              - for
            answer: c
      - id: b11-x4
        bank_no: 13
        kind: tfng
        instructions_vi: Đọc đoạn văn rồi chọn T (đúng), F (sai) hoặc NG (không được nhắc đến).
        passage: "Vietnam has very different weather in the north and the south. In the north, there are four seasons. Winter is cold and humid, and in the mountains it is sometimes freezing. Summer is hot, with a lot of storms. In the south, there are only two seasons: the dry season and the rainy season. The temperature is usually between 25 and 35 degrees. Mai lives in Can Tho and loves the dry season. Her cousin Hung lives in Hanoi. He is afraid of the cold, so he doesn't like winter."
        questions:
          - q: The south of Vietnam has four seasons.
            answer: F
            explain_vi: Miền Nam chỉ có hai mùa.
          - q: It is sometimes freezing in the northern mountains.
            answer: T
          - q: Mai doesn't like the dry season.
            answer: F
            explain_vi: Mai thích mùa khô.
          - q: Hung likes winter.
            answer: F
            explain_vi: "Hung sợ lạnh nên không thích mùa đông — chú ý chủ thể: Hung, không phải Mai."
          - q: Mai is afraid of storms.
            answer: NG
            explain_vi: Người sợ (lạnh) là Hung; bài không nói gì về Mai và bão.
          - q: Hung visits Can Tho every year.
            answer: NG
      - id: b11-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn dưới đây có 5 lỗi. Tìm và sửa.
        text: My hometown is Da Lat. It is famous about its flowers and cool weather. Today is very rain and the temperature is fifteen degree. My sister is interested on the weather, but she is afraid with storms.
        errors:
          - wrong: famous about
            right: famous for
            why: famous for.
          - wrong: Today is very rain
            right: It's raining a lot today
            why: Dùng It's raining; rain không phải tính từ.
          - wrong: fifteen degree
            right: fifteen degrees
            why: Số nhiều thêm -s.
          - wrong: interested on
            right: interested in
            why: interested in.
          - wrong: afraid with
            right: afraid of
            why: afraid of.
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 80–100 từ về thời tiết ở quê bạn: có mấy mùa, mỗi mùa thế nào, bạn thích/sợ mùa nào và vì sao. Dùng ít nhất 3 cụm tính từ + giới từ."
    prompt_en: Describe the weather and seasons in your hometown.
    words:
      min: 80
      max: 100
    minutes: 20
