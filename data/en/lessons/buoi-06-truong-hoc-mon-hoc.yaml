      - word: science|n
        text_vi: "Chữ c sau s câm: SAI-ơns. Tương tự: scene, scissors."
      - word: geography|n
        text_vi: "Trọng âm âm 2: ge-O-gra-phy. Chữ g đầu đọc /dʒ/."
