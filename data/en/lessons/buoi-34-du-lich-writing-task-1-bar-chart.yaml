  - type: skill
    skill: writing
    title_vi: "Writing Task 1 — biểu đồ cột: so sánh, không kể lể"
    intro_vi: "Biểu đồ cột có hai kiểu: (1) so sánh các nhóm tại MỘT thời điểm (không có thay đổi theo thời gian) — trọng tâm là cao nhất/thấp nhất, gấp mấy lần; (2) so sánh nhóm qua VÀI thời điểm (VD 2019 và 2023) — vừa so sánh nhóm, vừa nói thay đổi (từ vựng xu hướng của Buổi 26). Bố cục vẫn 4 đoạn như Buổi 26: Mở bài → Overview → Thân bài 1 → Thân bài 2. Cái khác là cách CHIA NHÓM số liệu."
    steps:
      - title_vi: Xác định kiểu biểu đồ cột
        text_vi: Trục ngang là các nhóm (thành phố, hạng mục) hay các năm? Có mấy màu cột? Đơn vị (%, triệu người, $)? Có thời gian → cần cả ngôn ngữ xu hướng; không có → chỉ so sánh.
      - title_vi: "Mở bài: paraphrase"
        text_vi: The bar chart shows → compares / illustrates; the number of tourists → visitor numbers; in five cities → in five Vietnamese destinations.
      - title_vi: "Overview: cao nhất + điểm chung/khác biệt lớn"
        text_vi: "'Overall, X was the most popular …, while Y attracted the fewest …' + (nếu có thời gian) xu hướng chung. Không số liệu."
      - title_vi: Chia nhóm cho 2 thân bài
        text_vi: "Cách dễ: Thân bài 1 = các nhóm LỚN (hoặc tăng), Thân bài 2 = các nhóm NHỎ (hoặc giảm). Hoặc chia theo năm: năm đầu / năm cuối. Đừng đi lần lượt từng cột từ trái sang phải."
      - title_vi: Mỗi câu thân bài có số liệu + so sánh
        text_vi: "Ghép hai nhóm trong một câu: '…, whereas …', 'twice as many as', '… and …, respectively'. Mỗi thân bài 3–4 câu là đủ."
      - title_vi: Soát lỗi
        text_vi: fewer/less, many/much, số ít-số nhiều sau the number of / the majority of, thì quá khứ, đủ 150 từ.
    tips:
      - Số cột nhiều (6–8)? Không cần nêu hết. Nêu cột cao nhất, thấp nhất, cột bất thường và vài cột tiêu biểu.
      - Đọc số không rõ trên cột → approximately, around, just over, just under.
      - "Luân phiên chủ ngữ: Hanoi received … / The figure for Hanoi was … / Hanoi was the most popular …"
    traps:
      - trap_vi: Mô tả từng cột một, từ trái sang phải, không so sánh.
        fix_vi: Mỗi câu nên có ít nhất 2 nhóm và một từ so sánh (higher than, twice as many, whereas).
      - trap_vi: fewer money / less tourists.
        fix_vi: fewer + danh từ đếm được số nhiều; less + không đếm được.
      - trap_vi: Dùng ngôn ngữ xu hướng (increased) khi biểu đồ chỉ có MỘT thời điểm.
        fix_vi: "Một thời điểm → không có tăng/giảm. Dùng so sánh: Hanoi had more visitors than Hue."
      - trap_vi: "Dấu phẩy nối câu: 'Hanoi was the highest, Hue was the lowest.'"
        fix_vi: Dùng whereas/while trong cùng câu, hoặc tách câu + In contrast.
    phrases:
      - en: The bar chart compares … in terms of …
        vi: Biểu đồ cột so sánh … về mặt …
        note_vi: Mở bài.
      - en: Overall, … was by far the most popular …
        vi: Nhìn chung, … là … được ưa chuộng nhất, vượt xa các nhóm khác.
      - en: … attracted twice as many visitors as …
        vi: … thu hút lượng khách gấp đôi …
      - en: …, whereas the figure for … was only …
        vi: …, trong khi con số của … chỉ là …
      - en: … and … accounted for 20% and 35%, respectively.
        vi: … và … lần lượt chiếm 20% và 35%.
      - en: The lowest figure was for …, at just …
        vi: Con số thấp nhất là của …, chỉ …
    demo:
      title_vi: "Làm mẫu: đề, số liệu và bài viết mẫu (số liệu giả định để luyện tập)"
      text_en: |-
        Question: The bar chart shows how much an average international tourist spent per day in four Vietnamese cities in 2023, divided into three categories.

        Spending per day (US$)   Accommodation   Food   Shopping
        Hanoi                          40          20        15
        Ho Chi Minh City               45          25        30
        Da Nang                        35          20        10
        Hoi An                         30          15        25

        Introduction: The bar chart compares the average daily expenditure of international tourists in four cities in Vietnam in 2023, in terms of accommodation, food and shopping.

        Overview: Overall, accommodation was the largest category of spending in all four cities, and tourists in Ho Chi Minh City spent the most money in every category.

        Body 1: Visitors to Ho Chi Minh City spent $45 a day on accommodation, compared with $40 in Hanoi and $35 in Da Nang. The lowest figure was for Hoi An, at just $30. Spending on food followed a similar pattern, at between $15 and $25.

        Body 2: Shopping showed the biggest differences. Tourists in Ho Chi Minh City and Hoi An spent $30 and $25 a day, respectively, whereas those in Da Nang spent only $10. In other words, shoppers in Ho Chi Minh City spent three times as much as those in Da Nang.
      notes:
        - label: Introduction
          text_vi: shows how much … spent → compares the average daily expenditure; divided into three categories → in terms of accommodation, food and shopping.
        - label: Overview
          text_vi: "Hai đặc điểm: hạng mục lớn nhất (accommodation) và thành phố chi nhiều nhất (HCMC). Không số."
        - label: Body 1 — nhóm giống nhau
          text_vi: Accommodation và food có cùng khuôn mẫu → gộp một đoạn. 'compared with', 'The lowest figure was for…'.
        - label: Body 2 — điểm khác biệt
          text_vi: "Shopping chênh lệch lớn nhất: respectively, whereas, three times as much as (money → much)."
