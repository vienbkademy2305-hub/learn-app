  - type: dialogue
    title_vi: Cùng viết bài Task 1
    lines:
      - speaker: A
        text: What does this bar chart show?
        vi: Biểu đồ cột này cho biết gì?
      - speaker: B
        text: It compares the number of visitors to five destinations in 2019 and 2023.
        vi: Nó so sánh số khách đến năm điểm du lịch năm 2019 và 2023.
      - speaker: A
        text: Which one was the most popular?
        vi: Nơi nào đông khách nhất?
      - speaker: B
        text: Ha Long Bay, in both years. It had approximately four million visitors in 2023.
        vi: Vịnh Hạ Long, cả hai năm. Năm 2023 có khoảng bốn triệu khách.
      - speaker: A
        text: And Phu Quoc almost doubled, didn't it?
        vi: Còn Phú Quốc gần như tăng gấp đôi, phải không?
      - speaker: B
        text: Yes. It rose from one million to about two million, whereas Hue stayed the same.
        vi: Đúng. Nó tăng từ một triệu lên khoảng hai triệu, trong khi Huế giữ nguyên.
      - speaker: A
        text: So in the overview, we say most destinations grew, and Ha Long Bay was the most popular.
        vi: Vậy trong overview, mình nói phần lớn điểm đến tăng khách, và Hạ Long đông khách nhất.
      - speaker: B
        text: Exactly. And no numbers in the overview!
        vi: Chính xác. Và không có số trong overview nhé!
  - type: exercises
    items:
      - id: b34-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Đọc bảng số liệu (giả định) của biểu đồ cột và chọn câu mô tả ĐÚNG.
        passage: |-
          Number of visitors to five destinations (millions)
                            2019    2023
          Ha Long Bay        3.5     4.0
          Da Nang            3.0     3.6
          Phu Quoc           1.0     2.1
          Hue                1.8     1.8
          Sapa               1.2     0.9
        questions:
          - q: Which sentence is correct about 2023?
            options:
              - Da Nang had twice as many visitors as Hue.
              - Hue had more visitors than Phu Quoc.
              - Sapa had the most visitors.
              - Ha Long Bay had fewer visitors than Da Nang.
            answer: a
            explain_vi: 3.6 = 2 × 1.8. Hue (1.8) < Phu Quoc (2.1); Sapa ít nhất; Ha Long (4.0) > Da Nang (3.6).
          - q: Which destination almost doubled its visitor numbers?
            options:
              - Ha Long Bay
              - Da Nang
              - Phu Quoc
              - Hue
            answer: c
          - q: Which is the best overview?
            options:
              - Overall, Ha Long Bay had 4 million visitors in 2023.
              - Overall, most destinations attracted more visitors in 2023, and Ha Long Bay was the most popular in both years.
              - Overall, Sapa fell from 1.2 to 0.9 million.
              - Overall, tourism is good for Vietnam.
            answer: b
            explain_vi: Overview không số liệu, nêu xu hướng chung + nhóm nổi bật. Phương án d là ý kiến — Task 1 không nêu ý kiến.
          - q: Which sentence about Hue is correct?
            options:
              - Hue increased slightly.
              - The figure for Hue remained stable at 1.8 million.
              - Hue doubled.
              - Hue was the least popular in 2019.
            answer: b
      - id: b34-x2
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ phù hợp trong khung.
        bank:
          - twice
          - fewer
          - less
          - whereas
          - respectively
          - majority
          - compared
          - contrast
        questions:
          - q: Phu Quoc attracted ___ as many visitors in 2023 as in 2019.
            answer: twice
          - q: Sapa had ___ visitors in 2023 than in 2019.
            answer: fewer
          - q: Tourists spent ___ money on food than on hotels.
            answer: less
          - q: Da Nang grew by 0.6 million, ___ Sapa fell by 0.3 million.
            answer: whereas
          - q: Hanoi and Hue received 5 million and 1.5 million visitors, ___.
            answer: respectively
          - q: The ___ of visitors to Sapa were young people.
            answer: majority
          - q: ___ with 2019, visitor numbers in 2023 were higher in most places.
            answer: compared
          - q: Ha Long Bay grew. In ___, Sapa became less popular.
            answer: contrast
      - id: b34-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu theo gợi ý, giữ nguyên nghĩa.
        questions:
          - q: "Hanoi: 6 million visitors. Hue: 3 million visitors. → Hanoi had twice ___"
            answer: as many visitors as Hue.
            accept:
              - as many visitors as Hue did.
          - q: Domestic tourists spent $20. International tourists spent $60. → International tourists spent three times ___
            answer: as much as domestic tourists.
            accept:
              - as much money as domestic tourists.
          - q: "Food: 30%. Hotels: 45%. (respectively) → Food and hotels made up ___"
            answer: 30% and 45%, respectively.
          - q: Da Nang rose. Sapa fell. (whereas) → Da Nang rose, ___
            answer: whereas Sapa fell.
      - id: b34-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn thân bài Task 1 có 5 lỗi (so sánh, fewer/less, số ít/nhiều, dấu phẩy nối câu, thì). Sửa trực tiếp.
        text: In 2023, Ha Long Bay had the most visitors, Sapa had the fewest. Da Nang received two times more visitors as Hue. Tourists in Hue spent fewer money on shopping than those in Hoi An. The majority of visitors to Sapa was young people. The number of visitors to Phu Quoc increases from 1 million to 2.1 million.
        errors:
          - wrong: had the most visitors, Sapa had
            right: had the most visitors, whereas Sapa had
            why: Không nối hai mệnh đề chỉ bằng dấu phẩy — dùng whereas/while.
          - wrong: two times more visitors as Hue
            right: twice as many visitors as Hue
            why: "Cấu trúc gấp đôi: twice as many … as."
          - wrong: spent fewer money
            right: spent less money
            why: money không đếm được → less.
          - wrong: visitors to Sapa was young people
            right: visitors to Sapa were young people
            why: the majority of + danh từ số nhiều → động từ số nhiều.
          - wrong: Phu Quoc increases from
            right: Phu Quoc increased from
            why: Số liệu năm đã qua → quá khứ đơn.
      - id: b34-x5
        bank_no: 16
        kind: completion
        instructions_vi: Dựa vào bảng số liệu ở bài 1, hoàn thành câu. Viết MỘT TỪ hoặc MỘT SỐ.
        max_words: 1
        passage: |-
          Number of visitors to five destinations (millions)
                            2019    2023
          Ha Long Bay        3.5     4.0
          Da Nang            3.0     3.6
          Phu Quoc           1.0     2.1
          Hue                1.8     1.8
          Sapa               1.2     0.9
        questions:
          - q: In 2023, Ha Long Bay was the most ___ destination.
            answer: popular
          - q: Sapa was the only destination whose visitor numbers ___.
            answer: fell
            accept:
              - decreased
              - dropped
              - declined
          - q: Da Nang was the ___ most popular destination in both years.
            answer: second
          - q: In 2019, Phu Quoc had ___ visitors than Sapa.
            answer: fewer
      - id: b34-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: domestic
            right: inside your own country
          - left: destination
            right: the place where somebody is travelling to
          - left: accommodation
            right: a place to stay, such as a hotel
          - left: expenditure
            right: the amount of money that is spent
          - left: respectively
            right: in the same order as the things you mentioned
          - left: approximately
            right: close to a number but not exact
      - id: b34-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hai sinh viên nói về kết quả khảo sát và chọn đáp án đúng.
        audio_text: |-
          Man: So, what did our survey show about how students travel?
          Woman: Well, we asked two hundred students. The majority of them travel inside Vietnam, about eighty per cent.
          Man: And the rest go abroad?
          Woman: Yes, twenty per cent. Thailand was the most popular foreign destination, then Korea.
          Man: What about spending?
          Woman: Students spend the most on transport, not accommodation. I was surprised. Accommodation was second.
          Man: Maybe because they stay with friends or in cheap hostels.
          Woman: Exactly. And they spend less on shopping than on food.
        questions:
          - q: How many students did they survey?
            options:
              - "80"
              - "100"
              - "200"
              - "20"
            answer: c
          - q: What percentage of students travel abroad?
            options:
              - 80%
              - 20%
              - 50%
              - 10%
            answer: b
          - q: What was the second most popular foreign destination?
            options:
              - Thailand
              - Korea
              - Japan
              - Singapore
            answer: b
          - q: Students spend the most money on…
            options:
              - accommodation
              - food
              - transport
              - shopping
            answer: c
            explain_vi: "'the most on transport, not accommodation' — accommodation đứng thứ hai."
      - id: b34-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe phần mô tả biểu đồ rồi chọn T (đúng) hoặc F (sai). Chú ý các từ so sánh.
        audio_text: "The bar chart compares the number of hotel rooms in three coastal cities in 2015 and 2025. In 2015, Nha Trang had the most rooms, with about twenty thousand, whereas Quy Nhon had only five thousand. By 2025, Da Nang had overtaken Nha Trang, with forty thousand rooms. Quy Nhon grew the fastest: its number of rooms tripled over the ten years."
        questions:
          - q: In 2015, Nha Trang had more hotel rooms than Quy Nhon.
            answer: T
          - q: In 2025, Nha Trang still had the most rooms.
            answer: F
          - q: Da Nang had forty thousand rooms in 2025.
            answer: T
          - q: The number of rooms in Quy Nhon doubled.
            answer: F
            explain_vi: tripled = tăng gấp BA (5,000 → 15,000).
  - type: homework
    kind: task1
    prompt_vi: "Viết Task 1 (≥ 150 từ, 20 phút) theo bố cục 4 đoạn. Số liệu giả định cho sẵn trong đề. Chia thân bài theo nhóm (không đi lần lượt từng cột). Dùng ít nhất: 1 câu twice/three times as … as, 1 câu whereas, 1 câu respectively, và fewer/less đúng. Không giải thích nguyên nhân."
    prompt_en: |-
      The bar chart shows the percentage of Vietnamese people in three age groups who travelled abroad for a holiday in 2014 and 2024.
      Age group:        18–30   31–50   51 and over
      2014 (%):            6       10        4
      2024 (%):           22       18        6
      Summarise the information by selecting and reporting the main features, and make comparisons where relevant.
    words:
      min: 150
      max: 190
    minutes: 20
