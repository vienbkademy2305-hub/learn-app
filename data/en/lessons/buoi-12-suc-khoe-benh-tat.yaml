  - type: dialogue
    title_vi: Đi khám bác sĩ
    lines:
      - speaker: A
        text: Good morning. What's the problem?
        vi: Chào anh. Anh bị làm sao?
      - speaker: B
        text: I have a headache and a sore throat. I also have a fever.
        vi: Tôi bị đau đầu và đau họng. Tôi còn bị sốt nữa.
      - speaker: A
        text: I think you have the flu. You must take this medicine twice a day.
        vi: Tôi nghĩ anh bị cúm. Anh phải uống thuốc này hai lần một ngày.
      - speaker: B
        text: Do I have to stay at home?
        vi: Tôi có phải ở nhà không?
      - speaker: A
        text: Yes. You should get some rest for three days, and you shouldn't go to work.
        vi: Có. Anh nên nghỉ ngơi ba ngày, và không nên đi làm.
      - speaker: B
        text: Can I drink coffee?
        vi: Tôi uống cà phê được không?
      - speaker: A
        text: You should drink warm water, not coffee.
        vi: Anh nên uống nước ấm, đừng uống cà phê.
      - speaker: B
        text: Do I have to make another appointment?
        vi: Tôi có phải đặt lịch hẹn nữa không?
      - speaker: A
        text: No, you don't have to. Just come back if you feel worse.
        vi: Không cần đâu. Nếu thấy tệ hơn thì quay lại.
  - type: exercises
    items:
      - id: b12-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ thích hợp.
        bank:
          - fever
          - cough
          - appointment
          - pharmacy
          - medicine
          - diet
        questions:
          - q: My temperature is 39 degrees. I have a ___.
            answer: fever
          - q: You can buy this at the ___ next to the hospital.
            answer: pharmacy
          - q: I want to see the doctor. I need to make an ___.
            answer: appointment
          - q: Take this ___ after meals.
            answer: medicine
          - q: He smokes a lot, so he has a bad ___.
            answer: cough
          - q: Eating fruit every day is part of a healthy ___.
            answer: diet
      - id: b12-x2
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: You look tired. You ___ go to bed early.
            options:
              - should
              - mustn't
              - don't have to
              - shouldn't
            answer: a
          - q: The museum is free. You ___ pay.
            options:
              - mustn't
              - don't have to
              - shouldn't
              - must
            answer: b
            explain_vi: Miễn phí = không cần trả.
          - q: You ___ smoke in the hospital. It's not allowed.
            options:
              - don't have to
              - mustn't
              - should
              - have to
            answer: b
            explain_vi: Cấm → mustn't.
          - q: My sister ___ wear a uniform at work.
            options:
              - have to
              - has to
              - must to
              - should to
            answer: b
          - q: You should ___ more water.
            options:
              - to drink
              - drinks
              - drink
              - drinking
            answer: c
      - id: b12-x3
        bank_no: 5
        kind: paraphrase
        instructions_vi: Viết lời khuyên với should hoặc shouldn't cho mỗi tình huống.
        questions:
          - q: I have a headache. (take some medicine)
            answer: You should take some medicine.
            accept:
              - You should take medicine.
          - q: I have a sore throat. (drink cold water)
            answer: You shouldn't drink cold water.
            accept:
              - You should not drink cold water.
          - q: I'm always tired. (go to bed late)
            answer: You shouldn't go to bed late.
            accept:
              - You should not go to bed late.
          - q: I have a bad cough. (see a doctor)
            answer: You should see a doctor.
      - id: b12-x4
        bank_no: 16
        kind: completion
        instructions_vi: Đọc thông báo và điền KHÔNG QUÁ HAI TỪ vào mỗi chỗ trống.
        max_words: 2
        passage: CITY HOSPITAL — VISITOR INFORMATION. Visitors must come between 3 p.m. and 7 p.m. You don't have to make an appointment to visit a patient. You mustn't bring food into the rooms. Children under 12 have to come with an adult. If you have a cough or a fever, you should wear a mask. The pharmacy is on the first floor, next to the café.
        questions:
          - q: Visitors can come until ___.
            answer: 7 p.m.
            accept:
              - 7 pm
              - "7"
          - q: Visitors don't need an ___.
            answer: appointment
          - q: Visitors mustn't bring ___ into the rooms.
            answer: food
          - q: Children under 12 must come with ___.
            answer: an adult
            accept:
              - adult
          - q: The pharmacy is on the ___.
            answer: first floor
      - id: b12-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn dưới đây có 5 lỗi. Tìm và sửa.
        text: My brother is ill. He is headache and he has a fever. The doctor says he should to rest and he musts drink a lot of water. He have to take medicine three times a day. He is happy because he mustn't go to school this week — the school is closed.
        errors:
          - wrong: He is headache
            right: He has a headache
            why: Dùng have a headache.
          - wrong: should to rest
            right: should rest
            why: Sau should không có to.
          - wrong: he musts drink
            right: he must drink
            why: must không thêm -s.
          - wrong: He have to
            right: He has to
            why: He → has to.
          - wrong: he mustn't go to school
            right: he doesn't have to go to school
            why: Trường đóng cửa = không cần đi, không phải bị cấm.
      - id: b12-x6
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại thành câu mệnh lệnh (bắt đầu bằng động từ, Don't hoặc Let's).
        questions:
          - q: You should drink a lot of water.
            answer: Drink a lot of water.
            accept:
              - Drink a lot of water!
          - q: You shouldn't go out in the rain.
            answer: Don't go out in the rain.
            accept:
              - Do not go out in the rain.
          - q: You mustn't be late for the appointment.
            answer: Don't be late for the appointment.
            accept:
              - Do not be late for the appointment.
          - q: Shall we see a doctor together?
            answer: Let's see a doctor.
            accept:
              - Let's see a doctor together.
          - q: Smoking is not allowed here. (biển báo, 2 từ)
            answer: No smoking.
            accept:
              - No smoking
      - id: b12-x7
        bank_no: 8
        kind: transformation
        instructions_vi: Sắp xếp các từ thành câu mệnh lệnh đúng (nhớ dấu . hoặc ! cuối câu).
        questions:
          - q: late / don't / be
            answer: Don't be late!
            accept:
              - Don't be late.
          - q: medicine / take / your
            answer: Take your medicine.
            accept:
              - Take your medicine!
          - q: the window / please / open
            answer: Open the window, please.
            accept:
              - Please open the window.
          - q: some exercise / let's / do
            answer: Let's do some exercise.
            accept:
              - Let's do some exercise!
      - id: b12-x8
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền bộ phận cơ thể thích hợp.
        bank:
          - teeth
          - ears
          - nose
          - feet
          - back
          - fingers
          - knee
        questions:
          - q: We hear with our ___.
            answer: ears
          - q: We smell with our ___.
            answer: nose
          - q: I brush my ___ every morning and every night.
            answer: teeth
          - q: We have ten ___ on our hands.
            answer: fingers
          - q: My shoes are too small. My ___ hurt.
            answer: feet
          - q: He sits at a desk all day, so he often has ___ pain.
            answer: back
          - q: She fell over and hurt her ___.
            answer: knee
      - id: b12-x9
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Doctor: Good morning. What's the problem?
          Man: I have a sore throat and a bad cough.
          Doctor: Do you have a fever?
          Man: Yes, a little.
          Doctor: You should rest for two days and drink a lot of warm water. Take this medicine three times a day.
          Man: Do I have to stay at home?
          Doctor: Yes. You shouldn't go to work until you feel better.
        questions:
          - { q: What are the man's problems?, options: [ a headache and a fever, a sore throat and a cough, a stomachache, a broken leg ], answer: b }
          - { q: How often should he take the medicine?, options: [ once a day, twice a day, three times a day, every hour ], answer: c }
          - { q: Does he have to stay at home?, options: [ "Yes, until he feels better.", "No, he can go to work.", Only in the morning., The doctor doesn't say. ], answer: a }
      - id: b12-x10
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: To stay healthy, you should sleep seven or eight hours a night. You must not eat too much sugar, and you should eat fruit and vegetables every day. Don't sit in front of a computer all day. Take a short walk every hour.
        questions:
          - { q: You should sleep seven or eight hours a night., answer: T }
          - { q: It's fine to eat a lot of sugar., answer: F }
          - { q: You should eat vegetables every day., answer: T }
          - { q: You should sit at your computer all day., answer: F }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 80–100 từ đưa lời khuyên cho một người bạn hay bị mệt và ốm: bạn ấy nên / không nên / phải làm gì để khỏe hơn."
    prompt_en: Give advice to a friend who is often tired and ill.
    words:
      min: 80
      max: 100
    minutes: 20
