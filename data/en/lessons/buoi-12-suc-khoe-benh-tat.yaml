  - type: pronunciation
    notes:
      - sound: snd-h
        text_vi: "/h/ trong health, headache, have, hospital: chỉ là luồng hơi nhẹ từ họng, không đọc nặng như 'h' tiếng Việt khàn."
      - sound: snd-l
        text_vi: "/l/ cuối từ (ill, cold, pill, health): đầu lưỡi chạm lợi trên và giữ lại — không bỏ qua, không đọc thành 'u' hay 'ồ'."
      - word: should|v
        text_vi: "should /ʃʊd/, could, would: chữ l câm."
      - word: have-to|v
        text_vi: have to đọc nối /ˈhæf.tə/ (v biến thành f), has to /ˈhæs.tə/.
      - word: cough|n
        text_vi: "cough /kɒf/: gh đọc /f/, giống enough, laugh."
