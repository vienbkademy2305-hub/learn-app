  - type: skill
    skill: writing
    title_vi: Writing Task 1 — pie chart và mixed charts
    intro_vi: "Biểu đồ tròn cho biết các PHẦN của một TỔNG (100%). Thường gặp: một biểu đồ tròn (so sánh các phần), hai hoặc ba biểu đồ tròn của các năm khác nhau (so sánh phần + thay đổi), hoặc mixed charts — biểu đồ tròn kết hợp bảng / biểu đồ cột. Bố cục vẫn 4 đoạn (Buổi 26, 34). Điểm mới: với mixed charts, overview phải tóm tắt CẢ HAI biểu đồ, và mỗi thân bài thường dành cho một biểu đồ."
    steps:
      - title_vi: "Nhận dạng: 1 pie / nhiều pie / mixed"
        text_vi: Nhiều pie của các năm → có thay đổi (xu hướng). Mixed → hai loại thông tin khác nhau (VD tỉ lệ và tổng giá trị) — tìm mối liên hệ giữa chúng.
      - title_vi: "Mở bài: paraphrase cả hai biểu đồ"
        text_vi: "'The pie chart illustrates …, while the table shows …'. Không bỏ sót biểu đồ nào."
      - title_vi: "Overview: phần lớn nhất + thay đổi chính"
        text_vi: "'Overall, X made up the largest share in both years, and the share of Y increased significantly.' Mixed: thêm 1 ý cho biểu đồ thứ hai."
      - title_vi: "Thân bài: nhóm phần lớn / phần nhỏ"
        text_vi: "Một pie: thân bài 1 = 2–3 phần lớn nhất; thân bài 2 = các phần nhỏ (gộp bằng 'the remainder'). Mixed: thân bài 1 = pie, thân bài 2 = table."
      - title_vi: Xoay vòng cách nói tỉ lệ
        text_vi: account for / make up / represent / X% of … was … / nearly half / just over a quarter. Không dùng 'is' + % cho mọi câu.
    tips:
      - Tổng các phần = 100% → đừng nói 'increased' khi chỉ có MỘT biểu đồ tròn (không có thời gian).
      - "Hai pie hai năm: so sánh cùng một phần qua hai năm là cách viết hiệu quả nhất (The share of X rose from … to …)."
      - "Gộp các phần rất nhỏ: 'The remaining three categories combined made up less than 10%.'"
    traps:
      - trap_vi: Mô tả từng miếng pie một cách rời rạc theo chiều kim đồng hồ.
        fix_vi: Sắp xếp theo độ lớn và so sánh giữa các phần.
      - trap_vi: Mixed charts nhưng overview chỉ nói về một biểu đồ.
        fix_vi: "Overview 2 câu: một câu cho mỗi biểu đồ."
      - trap_vi: "Viết bị động: 'was accounted for 30%'."
        fix_vi: account for / make up / represent đều chủ động.
      - trap_vi: "Chủ ngữ và động từ không khớp: '30% of exports was…'."
        fix_vi: exports (số nhiều) → were; money (không đếm được) → was.
    phrases:
      - en: The pie charts compare the proportion of … in … and …
        vi: Các biểu đồ tròn so sánh tỉ lệ … vào năm … và …
        note_vi: Mở bài.
      - en: … made up the largest share, at …%.
        vi: … chiếm tỉ phần lớn nhất, ở mức …%.
      - en: The share of … rose from …% to …%.
        vi: Tỉ phần của … tăng từ …% lên …%.
      - en: The remaining categories combined accounted for …
        vi: Các nhóm còn lại gộp lại chiếm …
      - en: This is reflected in the table, which shows …
        vi: Điều này được phản ánh trong bảng, cho thấy …
        note_vi: Nối pie với table trong mixed charts.
    demo:
      title_vi: "Làm mẫu: hai biểu đồ tròn + bảng (số liệu giả định để luyện tập)"
      text_en: |-
        Question: The pie charts show the main destinations of Vietnam's exports in 2014 and 2024, and the table shows the total value of exports in those years.

        Destination (%)    2014   2024
        USA                  19     30
        China                10     17
        EU                   19     13
        Japan                10      6
        Others               42     34

        Total value of exports (billion US$):  2014 — 150    2024 — 405

        Introduction: The pie charts compare the proportion of Vietnam's exports sent to five destinations in 2014 and 2024, while the table gives the total value of exports in each year.

        Overview: Overall, the USA became by far the largest single market over the period, and the total value of exports rose dramatically.

        Body 1: In 2014, the USA and the EU each accounted for 19% of exports. Ten years later, the USA's share had risen to almost a third (30%), whereas the EU's fell to 13%. China's share also grew, from 10% to 17%. In contrast, Japan's share dropped from 10% to just 6%, and other countries combined made up about a third of the total in 2024, compared with 42% in 2014.

        Body 2: The table shows that the value of exports increased from 150 to 405 billion dollars, which is nearly three times as much. This means that although the EU's share fell, the actual value of goods sent there probably still rose.
      notes:
        - label: Introduction
          text_vi: Paraphrase cả pie (proportion … sent to five destinations) và table (total value).
        - label: Overview
          text_vi: Một ý cho pie (USA lớn nhất), một ý cho table (tổng giá trị tăng mạnh). Không số.
        - label: Body 1 — pie
          text_vi: So sánh từng thị trường qua hai năm; xoay vòng account for / share had risen / made up. almost a third (30%), whereas, in contrast.
        - label: Body 2 — table + liên hệ
          text_vi: "'nearly three times as much' (Buổi 34). Câu cuối nối hai biểu đồ: tỉ lệ giảm nhưng giá trị có thể vẫn tăng — đây là điểm cộng cho Task Achievement."
