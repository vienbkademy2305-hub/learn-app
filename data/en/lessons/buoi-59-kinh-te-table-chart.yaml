  - type: skill
    skill: writing
    title_vi: Writing Task 1 — bảng số liệu kết hợp biểu đồ (mixed charts)
    intro_vi: "Đề cho HAI hình (VD bảng + biểu đồ tròn, hoặc biểu đồ đường + cột). Lỗi hay gặp: mô tả từng hình riêng lẻ như hai bài khác nhau, và chép hết số liệu trong bảng. Giám khảo muốn thấy bạn CHỌN số liệu nổi bật và (nếu được) LIÊN HỆ hai hình. Vẫn 150+ từ, 20 phút, bố cục 4 đoạn."
    steps:
      - title_vi: Tìm mối liên hệ giữa hai hình
        text_vi: "Hai hình cùng chủ đề (VD: bảng thu nhập và biểu đồ tròn chi tiêu). Hỏi: hình này giải thích hình kia không? Có số nào lặp lại không?"
      - title_vi: "Mở bài: paraphrase CẢ HAI hình"
        text_vi: "'The table shows … and the pie chart illustrates …' → 'The table compares …, while the pie chart breaks down …'"
      - title_vi: "Overview: 1 ý chính cho mỗi hình"
        text_vi: "Overview hai câu: điểm nổi bật nhất của bảng + điểm nổi bật nhất của biểu đồ. Không có số liệu."
      - title_vi: Mỗi thân bài một hình
        text_vi: "Thân bài 1: bảng (so sánh hàng/cột lớn nhất – nhỏ nhất). Thân bài 2: biểu đồ. Nếu có liên hệ, thêm một câu nối ở cuối thân bài 2."
      - title_vi: Chọn số liệu, không chép bảng
        text_vi: "Bảng 4×4 có 16 con số — chỉ chọn 6–8 số: lớn nhất, nhỏ nhất, ngoại lệ, và số có chênh lệch thú vị."
      - title_vi: So sánh có mức độ
        text_vi: Dùng considerably / marginally / by far / almost as … as thay cho 'higher than' lặp lại.
    tips:
      - Bảng không có xu hướng thì đừng viết 'increase'; chỉ so sánh.
      - Nếu hai hình khác mốc thời gian, nói rõ năm của từng hình.
      - "Thời gian: 3 phút đọc + tìm liên hệ, 14 phút viết, 3 phút soát."
    traps:
      - trap_vi: Viết hai overview dài, hết thời gian cho thân bài.
        fix_vi: Overview 2 câu ngắn là đủ.
      - trap_vi: Chép mọi con số của bảng.
        fix_vi: "Nhóm số giống nhau: 'Countries B and C spent a comparable amount (around 20%)'."
      - trap_vi: "'very higher', 'more higher'."
        fix_vi: much / considerably / significantly higher.
    phrases:
      - en: The table compares …, while the pie chart breaks down …
        vi: Bảng so sánh …, còn biểu đồ tròn chia nhỏ …
        note_vi: Mở bài hai hình.
      - en: Overall, … was by far the largest …, and …
        vi: Nhìn chung, … là … lớn nhất với cách biệt xa, và …
      - en: … was considerably higher than …
        vi: … cao hơn đáng kể so với …
      - en: … was marginally lower, at …
        vi: … thấp hơn một chút, ở mức …
      - en: This is reflected in the chart, which shows …
        vi: Điều này được phản ánh trong biểu đồ, cho thấy …
        note_vi: Câu nối hai hình.
    demo:
      title_vi: "Làm mẫu: bảng thu nhập + biểu đồ tròn chi tiêu (số liệu giả định, mô tả bằng lời)"
      text_en: |-
        Table: average monthly household income (hypothetical figures) — City X $2,400; City Y $1,500; City Z $1,450.
        Pie chart: how households in City X spend their income — housing 38%, food 20%, transport 15%, leisure 14%, utilities 8%, other 5%.

        Introduction: The table compares the average monthly household income in three cities, while the pie chart breaks down how families in City X spend their money.

        Overview: Overall, households in City X earned by far the most, and housing was the largest expense in that city's budget.

        Body 1: At $2,400 a month, the average income in City X was considerably higher than in the other two cities. Families in City Y earned $1,500, which was only marginally more than the figure for City Z ($1,450).

        Body 2: Turning to spending in City X, housing accounted for 38% of the budget, almost twice as much as food (20%). Transport and leisure took comparable shares, at 15% and 14% respectively. By contrast, utilities made up just 8%. The relatively large share spent on leisure may reflect the city's higher income.
      notes:
        - label: compares … while … breaks down
          text_vi: Mở bài nêu cả hai hình, mỗi hình một động từ khác.
        - label: Overview
          text_vi: Một ý cho bảng (City X cao nhất) + một ý cho biểu đồ (housing lớn nhất). Không số liệu.
        - label: considerably / marginally
          text_vi: "Cho biết mức chênh: 2,400 vs 1,500 là nhiều; 1,500 vs 1,450 là ít."
        - label: comparable … respectively
          text_vi: Gộp hai số gần nhau thay vì viết hai câu.
        - label: may reflect
          text_vi: Câu nối hai hình, dùng may vì là suy đoán hợp lý, không khẳng định.
