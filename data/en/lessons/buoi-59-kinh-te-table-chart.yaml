  - type: dialogue
    title_vi: Chuẩn bị bài Task 1
    lines:
      - speaker: A
        text: There are so many numbers in this table. Do I need to mention all of them?
        vi: Bảng này nhiều số quá. Mình có cần nhắc hết không?
      - speaker: B
        text: No. Pick the biggest, the smallest and anything unusual.
        vi: Không. Chọn số lớn nhất, nhỏ nhất và cái gì bất thường.
      - speaker: A
        text: OK. Housing is by far the largest expense in every country.
        vi: Được. Nhà ở là khoản chi lớn nhất với cách biệt xa ở mọi nước.
      - speaker: B
        text: Good, that's your overview. What about food?
        vi: Tốt, đó là overview. Còn thực phẩm?
      - speaker: A
        text: It's marginally higher in Country B than in Country C, 21 and 20 per cent.
        vi: Ở nước B cao hơn nước C một chút, 21 và 20 phần trăm.
      - speaker: B
        text: "Then group them: 'comparable, at around 20%'. It saves words."
        vi: "Vậy gộp lại: 'tương đương, khoảng 20%'. Đỡ tốn chữ."
      - speaker: A
        text: And the pie chart shows the same pattern, so I can link them.
        vi: Và biểu đồ tròn cho thấy cùng xu hướng, nên mình có thể liên hệ hai hình.
  - type: exercises
    items:
      - id: b59-x1
