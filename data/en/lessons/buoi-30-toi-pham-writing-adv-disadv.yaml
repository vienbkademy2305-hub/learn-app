  - type: skill
    skill: writing
    title_vi: Writing Task 2 — Advantages / Disadvantages
    intro_vi: "Dạng đề yêu cầu bàn về ưu và nhược điểm của một hiện tượng. Có hai kiểu, phải đọc kỹ để biết có cần nêu ý kiến không: (1) 'Discuss the advantages and disadvantages of…' — trình bày cả hai mặt, ý kiến riêng không bắt buộc. (2) 'Do the advantages outweigh the disadvantages?' — BẮT BUỘC nêu quan điểm bên nào lớn hơn, ngay từ mở bài. Bố cục 4 đoạn: Mở bài → Thân bài 1 (ưu điểm) → Thân bài 2 (nhược điểm) → Kết bài."
    steps:
      - title_vi: Xác định kiểu đề
        text_vi: Có 'outweigh' / 'Is this a positive or negative development?' → phải có quan điểm. Chỉ 'Discuss the advantages and disadvantages' → nêu cả hai mặt cân bằng; có thể thêm ý kiến ở kết bài.
      - title_vi: "Brainstorm: 2 ưu + 2 nhược"
        text_vi: "Hỏi: ai được lợi? ai chịu thiệt? về tiền bạc, an toàn, sức khỏe, tự do, xã hội? Chọn những ý bạn giải thích và cho ví dụ được."
      - title_vi: "Mở bài: paraphrase + định hướng"
        text_vi: "Câu 1 paraphrase đề. Câu 2: kiểu (1) 'This essay will discuss both the benefits and drawbacks of…'; kiểu (2) 'I believe that the advantages outweigh the disadvantages.'"
      - title_vi: "Thân bài 1: câu chủ đề + 2 ưu điểm"
        text_vi: "Câu chủ đề: 'There are several advantages of…'. Ưu điểm 1 (Firstly, …) + giải thích; ưu điểm 2 (In addition, …) + giải thích + ví dụ."
      - title_vi: "Thân bài 2: câu chủ đề + 2 nhược điểm"
        text_vi: "Mở đầu bằng 'On the other hand, … also has some disadvantages.' rồi làm tương tự. Kiểu (2): đặt mặt YẾU hơn ở thân bài 1 và mặt MẠNH hơn ở thân bài 2 cho logic."
      - title_vi: "Kết bài: tóm tắt + quan điểm"
        text_vi: "'In conclusion, …' — nhắc lại hai mặt bằng từ khác và (kiểu 2) khẳng định lại bên nào lớn hơn. Không đưa ý mới."
    tips:
      - "Dùng xen kẽ từ đồng nghĩa để không lặp: advantage / benefit / positive effect; disadvantage / drawback / negative effect."
      - "Mỗi ý chỉ cần 2–3 câu: nêu → giải thích (This means that…) → ví dụ/hệ quả."
      - "Nhắc đúng đối tượng trong đề (VD: CCTV in public places), đừng lan sang camera trong nhà riêng."
    traps:
      - trap_vi: Đề hỏi 'outweigh' nhưng bài chỉ liệt kê hai mặt, không nói bên nào lớn hơn.
        fix_vi: Nêu rõ quan điểm ở mở bài VÀ kết bài; thân bài dẫn tới kết luận đó.
      - trap_vi: Dùng On the other hand để thêm một ưu điểm nữa.
        fix_vi: "Thêm ý cùng chiều: In addition / Another advantage is that… On the other hand chỉ để chuyển sang mặt đối lập."
      - trap_vi: Mỗi thân bài liệt kê 4–5 ý ngắn không giải thích.
        fix_vi: 2 ý được phát triển tốt > 5 ý liệt kê. Giám khảo chấm độ sâu (Task Response).
      - trap_vi: Viết 'Because … so …' hoặc nối câu bằng dấu phẩy + however.
        fix_vi: Một liên từ mỗi mệnh đề; However đứng đầu câu mới.
    phrases:
      - en: There are several advantages of …
        vi: … có một số ưu điểm.
        note_vi: Câu chủ đề thân bài 1.
      - en: The first benefit is that …
        vi: Lợi ích đầu tiên là …
      - en: Another advantage is that …
        vi: Một ưu điểm khác là …
      - en: On the other hand, … also has some drawbacks.
        vi: Mặt khác, … cũng có một số nhược điểm.
        note_vi: Câu chủ đề thân bài 2.
      - en: I believe that the advantages outweigh the disadvantages.
        vi: Tôi cho rằng ưu điểm lớn hơn nhược điểm.
      - en: In conclusion, although …, I believe …
        vi: Tóm lại, dù …, tôi cho rằng …
        note_vi: although sẽ học kỹ ở Buổi 37 — ở đây chỉ dùng như cụm cố định.
    demo:
      title_vi: "Làm mẫu: mở bài và hai đoạn thân bài"
      text_en: |-
        Question: In many cities, more and more security cameras are being installed in public places. Do the advantages of this outweigh the disadvantages?

        Introduction: Nowadays, a growing number of CCTV cameras are being put in streets, stations and parks in cities around the world. I believe that the benefits of this trend outweigh its drawbacks.

        Body 1: Admittedly, there are some disadvantages of having cameras everywhere. The main problem is that people may feel they have lost their privacy and freedom. For example, many people do not like the idea that their daily movements are recorded and stored by the government. In addition, installing and checking thousands of cameras is very expensive.

        Body 2: However, I think these drawbacks are less important than the benefits. Firstly, cameras can deter crime, because criminals know they are likely to be seen and caught. As a result, streets become safer, especially at night. Another advantage is that cameras help the police after a crime has happened. Videos can show what happened and who was involved, so the police do not have to depend only on witnesses.
      notes:
        - label: Kiểu đề
          text_vi: "'Do the advantages … outweigh …?' → BẮT BUỘC có quan điểm. Thesis ở câu 2 mở bài."
        - label: Body 1 = nhược điểm
          text_vi: Người viết cho rằng ưu > nhược nên đặt mặt YẾU (nhược điểm) trước, mặt MẠNH sau — bài dẫn dắt tới kết luận.
        - label: The main problem is that … / In addition, …
          text_vi: Hai nhược điểm, cùng chiều → In addition (không phải On the other hand).
        - label: However, I think these drawbacks …
          text_vi: However chuyển mặt; 'these drawbacks' là từ quy chiếu, nhắc lại cả thân bài 1 trong 2 chữ.
        - label: Firstly … As a result … Another advantage is that …
          text_vi: "Mỗi ưu điểm: nêu → giải thích/hệ quả. Không cần quá nhiều từ nối."
