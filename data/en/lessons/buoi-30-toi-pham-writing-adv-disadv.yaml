  - type: dialogue
    title_vi: Tranh luận về lao động công ích
    lines:
      - speaker: A
        text: Should young offenders go to prison or do community service?
        vi: Người phạm tội trẻ tuổi nên đi tù hay làm lao động công ích?
      - speaker: B
        text: I think community service is better. The main advantage is that they help society.
        vi: Tớ nghĩ lao động công ích tốt hơn. Ưu điểm chính là họ giúp ích cho xã hội.
      - speaker: A
        text: True. In addition, it's much cheaper than prison.
        vi: Đúng. Ngoài ra, nó rẻ hơn nhiều so với nhà tù.
      - speaker: B
        text: And they don't meet experienced criminals, so they are less likely to commit more crimes.
        vi: Và họ không gặp những tội phạm lâu năm, nên ít có khả năng phạm thêm tội.
      - speaker: A
        text: On the other hand, some people say it isn't harsh enough.
        vi: Mặt khác, có người nói nó không đủ nghiêm khắc.
      - speaker: B
        text: That's a fair point. A punishment should deter people from breaking the law.
        vi: Cũng có lý. Hình phạt phải răn đe được người ta không phạm luật.
      - speaker: A
        text: So for serious crimes, prison is still necessary.
        vi: Vậy với tội nghiêm trọng, tù vẫn cần thiết.
      - speaker: B
        text: I agree. But for small crimes, I believe the advantages of community service outweigh the disadvantages.
        vi: Tớ đồng ý. Nhưng với tội nhỏ, tớ cho rằng ưu điểm của lao động công ích lớn hơn nhược điểm.
  - type: exercises
    items:
      - id: b30-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Đọc đề và chọn đáp án đúng.
        questions:
          - q: "'Discuss the advantages and disadvantages of online shopping.' Do you have to give your opinion?"
            options:
              - Yes, in every paragraph
              - No, it is not required
              - Only in the introduction
              - You must only write about advantages
            answer: b
          - q: "'Do the advantages of living in a big city outweigh the disadvantages?' What must your essay include?"
            options:
              - only advantages
              - a clear opinion about which side is stronger
              - a story about your life
              - three body paragraphs about disadvantages
            answer: b
          - q: You think the advantages are stronger. Which order is the most logical?
            options:
              - Body 1 advantages, Body 2 disadvantages
              - Body 1 disadvantages, Body 2 advantages
              - only advantages
              - mix them in every sentence
            answer: b
            explain_vi: Mặt yếu trước, mặt mạnh sau → dẫn tới kết luận của bạn (cả cách a cũng chấp nhận được, nhưng b logic hơn).
          - q: Which sentence is the best topic sentence for a paragraph about drawbacks?
            options:
              - For example, prisons are expensive.
              - On the other hand, harsh punishments also have some drawbacks.
              - In conclusion, I agree.
              - Prison is a building.
            answer: b
      - id: b30-x2
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ nối phù hợp.
        bank:
          - In addition
          - However
          - As a result
          - For example
          - Therefore
          - On the other hand
        questions:
          - q: Cameras help the police catch criminals. ___, they make people feel safer.
            answer: In addition
          - q: Prison keeps dangerous people away from the public. ___, it is very expensive.
            answer: However
            accept:
              - On the other hand
          - q: The city put up more street lights. ___, crime at night fell by 20%.
            answer: As a result
            accept:
              - Therefore
          - q: Community service can be useful. ___, offenders can clean parks or help in hospitals.
            answer: For example
          - q: Young people copy what they see online. ___, parents should check what their children watch.
            answer: Therefore
            accept:
              - As a result
          - q: Harsh punishments may deter crime. ___, they can be unfair to first-time offenders.
            answer: On the other hand
            accept:
              - However
      - id: b30-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn thân bài có 5 lỗi (từ nối, dấu câu, từ quy chiếu, cấu trúc prevent/encourage). Sửa trực tiếp; lỗi dấu phẩy thì tách câu.
        text: There are several advantages of community service. Firstly, it is cheaper than prison, however it still punishes offenders. On the other hand, it helps society because offenders clean streets and parks. Because offenders work with ordinary people, so they learn good habits. Community service can also prevent offenders to commit more crimes. Community service is a good way to encourage young people change.
        errors:
          - wrong: cheaper than prison, however it still
            right: cheaper than prison. However, it still
            why: however không nối câu bằng dấu phẩy.
          - wrong: On the other hand, it helps society
            right: In addition, it helps society
            why: Ý cùng chiều (thêm ưu điểm) → In addition.
          - wrong: ordinary people, so they learn
            right: ordinary people, they learn
            why: Because … so … — chỉ giữ một liên từ.
          - wrong: prevent offenders to commit
            right: prevent offenders from committing
            why: prevent somebody from + V-ing.
          - wrong: encourage young people change
            right: encourage young people to change
            why: encourage somebody to + V.
      - id: b30-x4
        bank_no: 9
        kind: combine
        instructions_vi: Nối hai câu bằng từ trong ngoặc. Viết thành HAI câu, từ nối đứng đầu câu thứ hai và có dấu phẩy.
        questions:
          - q: Cameras can deter crime. They can reduce people's privacy. (However)
            answer: Cameras can deter crime. However, they can reduce people's privacy.
          - q: The city built more parks. Young people had more places to play sport. (As a result)
            answer: The city built more parks. As a result, young people had more places to play sport.
          - q: Community service is cheap. It helps society. (In addition)
            answer: Community service is cheap. In addition, it helps society.
      - id: b30-x5
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - q: Cameras can improve public ___.
            base: safe
            answer: safety
          - q: Too many rules can limit personal ___.
            base: free
            answer: freedom
          - q: Crime ___ is better than punishment.
            base: prevent
            answer: prevention
          - q: Crime is a serious ___ problem.
            base: society
            answer: social
          - q: One ___ of prison is its cost.
            base: advantage
            answer: disadvantage
            explain_vi: Chi phí cao là nhược điểm → thêm dis-.
      - id: b30-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: outweigh
            right: to be more important than something else
          - left: deter
            right: to make somebody decide not to do something
          - left: harsh
            right: very strict or cruel
          - left: community service
            right: unpaid work for the public as a punishment
          - left: crime rate
            right: the number of crimes in a place in a period of time
      - id: b30-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Woman: What do you think about security cameras in schools?
          Man: One advantage is that they prevent fights. In addition, parents feel safer.
          Woman: On the other hand, students may feel they have no privacy.
          Man: That's true. However, I believe the benefits outweigh the drawbacks.
        questions:
          - { q: What is the first advantage the man gives?, options: [ Cameras are cheap., Cameras prevent fights., Students study harder., Teachers like them. ], answer: b }
          - { q: What is the woman's worry?, options: [ the cost, students' privacy, broken cameras, parents' opinions ], answer: b }
          - { q: What is the man's final opinion?, options: [ The drawbacks are bigger., The benefits outweigh the drawbacks., Cameras should be banned., He is not sure. ], answer: b }
      - id: b30-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: Some people argue that harsh punishments deter crime. However, research shows that the crime rate does not always fall when punishments become harsher. Therefore, many experts believe that education and jobs for young people are better ways to prevent crime.
        questions:
          - { q: Everyone agrees that harsh punishments deter crime., answer: F }
          - { q: The crime rate always falls when punishments become harsher., answer: F }
          - { q: Many experts think education helps to prevent crime., answer: T }
          - { q: The speaker mentions jobs for young people., answer: T }
  - type: homework
    kind: task2
    prompt_vi: "Viết Task 2 hoàn chỉnh (≥ 250 từ, 40 phút), bố cục 4 đoạn. Đây là kiểu đề BẮT BUỘC có quan điểm. Mỗi thân bài 2 ý, mỗi ý có giải thích + ví dụ. Dùng ít nhất 4 từ nối khác nhau và 2 từ quy chiếu (this/these + N). Tự kiểm tra: không dùng On the other hand để thêm ý cùng chiều; không 'Because … so …'."
    prompt_en: In some countries, young people who commit small crimes are given community service instead of being sent to prison. Do the advantages of this outweigh the disadvantages?
