  - type: dialogue
    title_vi: Toàn cầu hóa trong đời sống
    lines:
      - speaker: A
        text: Look at this T-shirt. It's an American brand, but it was manufactured in Vietnam.
        vi: Nhìn chiếc áo này xem. Thương hiệu Mỹ nhưng sản xuất ở Việt Nam.
      - speaker: B
        text: That's globalisation. Big companies outsource production to save money.
        vi: Toàn cầu hóa đấy. Các công ty lớn thuê ngoài sản xuất để tiết kiệm tiền.
      - speaker: A
        text: Is that good for Vietnam?
        vi: Điều đó có tốt cho Việt Nam không?
      - speaker: B
        text: In some ways. It creates jobs, and exporting goods helps the economy grow.
        vi: Ở một số mặt. Nó tạo việc làm, và xuất khẩu hàng hóa giúp kinh tế tăng trưởng.
      - speaker: A
        text: But I worry about local businesses. It's hard for them to compete with global brands.
        vi: Nhưng tớ lo cho doanh nghiệp địa phương. Họ khó cạnh tranh với các thương hiệu toàn cầu.
      - speaker: B
        text: True. And every shopping mall looks the same now — the same fast-food chains everywhere.
        vi: Đúng. Mà giờ trung tâm thương mại nào cũng giống nhau — chuỗi đồ ăn nhanh ở khắp nơi.
      - speaker: A
        text: So instead of eating burgers, let's try that new pho place tonight.
        vi: Vậy thay vì ăn burger, tối nay mình thử quán phở mới đi.
      - speaker: B
        text: Good idea. Supporting local businesses is the least we can do!
        vi: Ý hay. Ủng hộ doanh nghiệp địa phương là điều tối thiểu mình có thể làm!
  - type: exercises
    items:
      - id: b41-x1
        bank_no: 16
        kind: completion
        instructions_vi: "Summary KHÔNG có hộp từ: đọc bài và hoàn thành đoạn tóm tắt. Viết KHÔNG QUÁ HAI TỪ lấy từ bài đọc."
        max_words: 2
        passage: |-
          THE JOURNEY OF A SMARTPHONE

          A  A modern smartphone is a truly global product. It may be designed in California, but its parts come from dozens of countries. The screen might be made in South Korea, the memory chips in Taiwan, and the battery in China. Finally, all the parts are shipped to a factory, often in Vietnam or India, where the phone is put together.

          B  This system, known as a global supply chain, allows companies to keep prices low. Each country does what it can do most cheaply or most skilfully, and consumers around the world benefit from cheaper and better products. For developing countries, joining these supply chains has brought millions of factory jobs.

          C  However, the system is also fragile. In 2021, a shortage of computer chips stopped production in car and phone factories on three continents. Because every step depends on the one before, a problem in a single factory can delay products all over the world. Since then, some multinational corporations have started moving part of their production closer to home, even though this increases costs.

          SUMMARY
          A smartphone's parts are made in many countries and finally (1) ___ in a factory, often in Vietnam or India. This global supply chain keeps (2) ___ low, and consumers get better products. It has also created millions of (3) ___ in developing countries. But the system can easily break: in 2021, a lack of (4) ___ stopped production on three continents. As a result, some companies are moving production closer to home, despite the higher (5) ___.
        questions:
          - q: (1)
            answer: put together
            explain_vi: "'the phone is put together' ↔ 'finally ___ in a factory'. Sau 'are' + phân từ."
          - q: (2)
            answer: prices
          - q: (3)
            answer: factory jobs
            accept:
              - jobs
          - q: (4)
            answer: computer chips
            accept:
              - chips
          - q: (5)
            answer: costs
            explain_vi: "'even though this increases costs' ↔ 'despite the higher costs' (Buổi 37)."
      - id: b41-x2
        bank_no: 16
        kind: completion
        instructions_vi: "Summary CÓ hộp từ: chọn một từ trong hộp cho mỗi chỗ trống (viết nguyên từ). Có 3 từ thừa. Đáp án thường là từ ĐỒNG NGHĨA với từ trong bài."
        max_words: 1
        passage: |-
          Passage: "In many Asian cities, global fast-food chains have become extremely popular with teenagers. Some sociologists fear that traditional family meals are disappearing, as young people prefer to eat quickly and cheaply outside the home. Others point out that local restaurants have also changed, adding modern dishes to attract younger customers, so local food culture is adapting rather than dying."

          SUMMARY
          International fast-food restaurants are very (1) ___ among young people in Asia. Some experts are (2) ___ that families no longer eat traditional meals together. However, local restaurants have (3) ___ new dishes to their menus, which shows that food culture is changing, not (4) ___.

          BOX:  popular · worried · added · disappearing · removed · happy · unpopular
        questions:
          - q: (1)
            answer: popular
            explain_vi: "Duy nhất từ trong hộp trùng nguyên văn — đôi khi vẫn có; kiểm tra nghĩa: 'extremely popular with teenagers'."
          - q: (2)
            answer: worried
            explain_vi: "'fear' → worried. happy ngược nghĩa."
          - q: (3)
            answer: added
            explain_vi: "'adding modern dishes' → added. removed ngược nghĩa."
          - q: (4)
            answer: disappearing
            explain_vi: "'adapting rather than dying' → changing, not disappearing."
      - id: b41-x3
        bank_no: 6
        kind: verb-form
        instructions_vi: "Chia động từ trong ngoặc: V-ing hay to V."
        questions:
          - q: (travel) ___ abroad has become cheaper for young Vietnamese.
            answer: Travelling
            accept:
              - Traveling
              - travelling
              - traveling
          - q: Many consumers are interested in (buy) ___ local products.
            answer: buying
          - q: It is difficult for small shops (compete) ___ with global brands.
            answer: to compete
          - q: The company avoided (raise) ___ its prices.
            answer: raising
          - q: Most families can't afford (buy) ___ imported cars.
            answer: to buy
          - q: You can learn about other cultures by (watch) ___ foreign films.
            answer: watching
          - q: The manager suggested (move) ___ production to Vietnam.
            answer: moving
          - q: The factory refused (pay) ___ higher wages.
            answer: to pay
      - id: b41-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng nghĩa.
        questions:
          - q: "'He stopped buying imported goods.' means…"
            options:
              - He no longer buys them.
              - He paused in order to buy them.
              - He is buying them now.
              - He never bought them.
            answer: a
          - q: "'She stopped to buy a coffee.' means…"
            options:
              - She gave up coffee.
              - She paused so that she could buy a coffee.
              - She never drinks coffee.
              - She couldn't buy coffee.
            answer: b
          - q: Please remember ___ your passport — you'll need it at the airport.
            options:
              - bringing
              - to bring
              - bring
              - brought
            answer: b
          - q: I'll never forget ___ Japan for the first time.
            options:
              - visiting
              - to visit
              - visit
              - visited
            answer: a
          - q: If your shop isn't making money, try ___ online.
            options:
              - to selling
              - selling
              - sold
              - sell
            answer: b
            explain_vi: try + V-ing = thử làm xem có hiệu quả không.
      - id: b41-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 5 lỗi V-ing/to V và giới từ. Sửa trực tiếp.
        text: Buy foreign brands is very popular in Vietnam. Many young people are interested in follow global trends. However, it is important protect local businesses. Some experts suggest to reduce taxes for small shops. Globalisation has a big impact to our culture.
        errors:
          - wrong: Buy foreign brands is
            right: Buying foreign brands is
            why: Chủ ngữ là hành động → V-ing.
          - wrong: interested in follow
            right: interested in following
            why: Sau giới từ → V-ing.
          - wrong: it is important protect
            right: it is important to protect
            why: It is + tính từ + to V.
          - wrong: suggest to reduce
            right: suggest reducing
            why: suggest + V-ing.
          - wrong: impact to our culture
            right: impact on our culture
            why: have an impact ON.
      - id: b41-x6
        bank_no: 3
        kind: collocation
        instructions_vi: Ghép để tạo cụm từ đúng.
        pairs:
          - left: remove
            right: trade barriers
          - left: support
            right: local businesses
          - left: benefit
            right: from free trade
          - left: have an impact
            right: on local culture
          - left: outsource
            right: production to Asia
          - left: global
            right: supply chains
      - id: b41-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe đoạn phỏng vấn (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Interviewer: Your company makes coffee. How has globalisation affected you?
          Owner: In a good way, mostly. We started exporting to Korea five years ago, and now half of our sales are abroad.
          Interviewer: Was it difficult?
          Owner: At first, yes. We had to change our packaging to meet their rules. But removing some trade barriers helped a lot.
          Interviewer: Any problems now?
          Owner: The main problem is competition. Big global brands are opening cafés in every city, and it's hard for us to compete with their advertising.
          Interviewer: What are you planning to do?
          Owner: Instead of competing on price, we're focusing on quality and telling customers the story of our farmers.
        questions:
          - q: When did the company start exporting?
            options:
              - one year ago
              - three years ago
              - five years ago
              - ten years ago
            answer: c
          - q: What proportion of sales are abroad?
            options:
              - a quarter
              - a third
              - half
              - most
            answer: c
          - q: What is the main problem now?
            options:
              - trade barriers
              - packaging rules
              - competition from global brands
              - a lack of coffee
            answer: c
          - q: What is the company's plan?
            options:
              - to lower its prices
              - to focus on quality and its farmers' story
              - to stop exporting
              - to open cafés abroad
            answer: b
      - id: b41-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai).
        audio_text: Globalisation has changed what people eat. Twenty years ago, it was difficult to find pizza in most Vietnamese towns. Today, international fast-food chains are common, especially in big cities. However, a recent survey found that most young people still prefer eating Vietnamese food at home. Only about one in ten said they ate fast food more than twice a week.
        questions:
          - q: Twenty years ago, pizza was easy to find in most Vietnamese towns.
            answer: F
          - q: Fast-food chains are common in big cities today.
            answer: T
          - q: Most young people prefer fast food to Vietnamese food.
            answer: F
          - q: About ten per cent of young people eat fast food more than twice a week.
            answer: T
            explain_vi: one in ten = 10%.
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 150–180 từ: 'Toàn cầu hóa đã thay đổi cuộc sống ở nơi bạn sống như thế nào (đồ ăn, mua sắm, việc làm…)? Thay đổi đó tích cực hay tiêu cực?' Dùng ít nhất 2 câu có V-ing làm chủ ngữ, 3 lần giới từ + V-ing (instead of, by, without…), 1 câu It is + tính từ + to V, và 6 từ của buổi này."
    prompt_en: How has globalisation changed life in the place where you live? Are these changes positive or negative?
    words:
      min: 150
      max: 180
    minutes: 30
