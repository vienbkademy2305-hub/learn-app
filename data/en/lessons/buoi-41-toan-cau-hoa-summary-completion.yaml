  - type: skill
    skill: reading
    title_vi: "Reading — Summary completion: có hộp từ và không có hộp từ"
    intro_vi: "Đề cho một đoạn TÓM TẮT (summary) một phần của bài đọc, có các chỗ trống. Hai kiểu: (1) KHÔNG có hộp từ — chép từ trong bài, đúng giới hạn từ (giống Sentence completion ở Buổi 33); (2) CÓ hộp từ (A–H) — chọn từ trong hộp; từ trong hộp thường là TỪ ĐỒNG NGHĨA với từ trong bài, không trùng nguyên văn. Summary thường chỉ tóm tắt 1–3 đoạn, và các chỗ trống thường theo thứ tự bài."
    steps:
      - title_vi: Đọc yêu cầu và tiêu đề summary
        text_vi: Có hộp từ hay không? Giới hạn bao nhiêu từ? Tiêu đề summary cho biết phần nào của bài được tóm tắt.
      - title_vi: "Scan summary: từ khóa + loại từ"
        text_vi: Với mỗi chỗ trống, gạch từ khóa xung quanh và đoán loại từ (sau a/the → danh từ; sau to → động từ; sau giới từ → danh từ/V-ing; sau be → tính từ/V-ing/V3).
      - title_vi: Skim tìm đoạn chứa summary
        text_vi: Đọc câu đầu của summary và tìm đoạn có ý tương tự. Từ khóa không đổi (tên, số, năm) giúp định vị nhanh.
      - title_vi: Scan từng vùng thông tin
        text_vi: Trong đoạn đã tìm, xác định câu tương ứng với từng chỗ trống. Chỗ trống sau thường nằm sau chỗ trống trước.
      - title_vi: Đọc kỹ và chọn đáp án
        text_vi: "Không hộp: chép đúng từ trong bài. Có hộp: tìm từ trong hộp CÙNG NGHĨA với từ trong bài VÀ đúng loại từ. Loại những từ sai ngữ pháp trước."
      - title_vi: Đọc lại toàn bộ summary
        text_vi: Summary hoàn chỉnh phải đúng ngữ pháp và đúng ý bài. Kiểm tra số ít/số nhiều và -ing.
    tips:
      - "Có hộp từ: số từ trong hộp nhiều hơn số chỗ trống, và thường có 2 từ cùng chủ đề nhưng trái nghĩa (increase/decrease) — đọc kỹ chiều của ý."
      - "Không hộp: nếu đáp án bạn tìm được làm câu sai ngữ pháp, nhiều khả năng bạn chọn sai vị trí."
      - Summary có thể dùng từ khác hoàn toàn bài đọc — đọc hiểu Ý, không săn chữ giống.
    traps:
      - trap_vi: Có hộp từ nhưng chọn từ giống hệt từ trong bài.
        fix_vi: Từ giống nguyên văn thường là bẫy; đáp án đúng hay là từ đồng nghĩa.
      - trap_vi: Chọn đúng nghĩa nhưng sai loại từ (VD cần danh từ, chọn tính từ).
        fix_vi: Luôn kiểm tra chữ trước và sau chỗ trống.
      - trap_vi: Sau giới từ điền động từ nguyên mẫu (by reduce).
        fix_vi: "Giới từ + V-ing: by reducing."
    phrases:
      - en: Complete the summary using the list of words, A–H, below.
        vi: Hoàn thành đoạn tóm tắt bằng danh sách từ A–H bên dưới.
        note_vi: Kiểu có hộp từ.
      - en: Choose NO MORE THAN TWO WORDS from the passage for each answer.
        vi: Chọn không quá hai từ từ bài đọc cho mỗi đáp án.
        note_vi: Kiểu không hộp.
    demo:
      title_vi: "Làm mẫu: summary có hộp từ"
      text_en: |-
        Passage: "When the factory closed, hundreds of workers lost their jobs. However, many of them later found work in the new tourist hotels, which paid slightly higher wages."

        Summary: After the factory closed, many workers were left (1) ______ . Later, a large number found jobs in tourism, where the pay was a little (2) ______ .

        Box:  A unemployed   B lower   C better   D employed   E hotels
      notes:
        - label: (1) → A unemployed
          text_vi: "'lost their jobs' = unemployed. Sau 'were left' cần tính từ. D employed ngược nghĩa."
        - label: (2) → C better
          text_vi: "'slightly higher wages' = the pay was a little better. B lower ngược chiều. E hotels đúng chủ đề nhưng sai loại từ (sau 'a little' cần tính từ)."
