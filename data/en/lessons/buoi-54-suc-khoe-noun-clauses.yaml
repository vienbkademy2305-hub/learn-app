  - type: skill
    skill: listening
    title_vi: Listening Part 4 — ý chính, số liệu và thái độ người nói
    intro_vi: "Buổi 39 và 43 đã luyện theo dõi bài giảng dài và dạng flowchart/diagram. Ở band 6.5+, Part 4 thử thách thêm hai điểm: (1) phân biệt SỐ LIỆU gần nhau (người nói nhắc nhiều con số, năm, phần trăm — chỉ một cái là đáp án); (2) nhận ra THÁI ĐỘ và mức độ chắc chắn của người nói (surprisingly, unfortunately, it is unclear whether…). Mệnh đề danh từ xuất hiện rất nhiều trong bài giảng: 'What is interesting is that…', 'The question is whether…' — đó là tín hiệu thông tin quan trọng sắp tới."
    steps:
      - title_vi: Đọc câu hỏi, gạch loại thông tin
        text_vi: "Số (năm? phần trăm? tuổi?), danh từ, tính từ thái độ. Ghi chú bên cạnh: %, yr, adj."
      - title_vi: Nghe tín hiệu nhấn mạnh
        text_vi: "'What is surprising is that…', 'The key point is…', 'What researchers found was…' → thông tin ngay sau là đáp án thường gặp."
      - title_vi: Ghi mọi con số, gạch sau
        text_vi: "Khi có nhiều số, ghi nhanh cả hai ('1990: 67 → now: 74'), rồi chọn theo câu hỏi (năm nào? tăng bao nhiêu?)."
      - title_vi: Nghe từ chỉ thái độ
        text_vi: surprisingly, unfortunately, encouragingly, it remains unclear whether → câu hỏi về ý kiến người nói dựa vào những từ này.
      - title_vi: Kiểm tra chính tả thuật ngữ
        text_vi: vaccination, nutrition, sanitation, hygiene — đáp án đúng nghĩa nhưng sai chính tả vẫn bị tính sai.
    tips:
      - "'It is unclear whether…' = người nói KHÔNG chắc; đừng chọn đáp án khẳng định."
      - "Số tăng: rose from X to Y — câu hỏi 'now' là Y, câu hỏi 'in the past' là X, câu hỏi 'by how much' là Y − X."
      - Part 4 có thể không có ví dụ đầu — luôn đọc câu 31 trước khi bài nghe bắt đầu.
    traps:
      - trap_vi: Điền con số nghe đầu tiên.
        fix_vi: "Nghe hết câu: '…fell from 30% to 12%' — câu hỏi hỏi con số nào?"
      - trap_vi: Bỏ qua 'not' hoặc 'unclear'.
        fix_vi: Gạch ý phủ định/không chắc chắn khi ghi chú.
      - trap_vi: Sai chính tả thuật ngữ y tế.
        fix_vi: "Học chính tả các từ của buổi: hygiene, sanitation, vaccination."
    phrases:
      - en: What is interesting is that …
        vi: Điều thú vị là …
        note_vi: Tín hiệu thông tin quan trọng.
      - en: The question is whether …
        vi: Vấn đề là liệu …
      - en: It remains unclear whether …
        vi: Vẫn chưa rõ liệu …
        note_vi: Người nói không chắc chắn.
      - en: Surprisingly, …
        vi: Đáng ngạc nhiên là, …
      - en: The main reason why … is that …
        vi: Lý do chính khiến … là …
    demo:
      title_vi: "Làm mẫu: chọn đúng con số và thái độ"
      text_en: |-
        Lecture: "In 1990, average life expectancy in the country was sixty-seven. By 2020, it had risen to seventy-four. What is surprising is that the biggest improvement came not from new medicines but from clean water and better sanitation. However, it remains unclear whether this trend will continue, as chronic diseases are becoming more common."

        Notes:  Life expectancy in 2020: ______   Main cause of improvement: clean water and ______   Speaker's view of the future: ______ (certain / uncertain)
      notes:
        - label: "74"
          text_vi: Câu hỏi 2020 → số thứ hai. 67 là năm 1990 (bẫy).
        - label: sanitation
          text_vi: Sau 'What is surprising is that…' — tín hiệu đáp án. 'not from new medicines' loại bẫy.
        - label: uncertain
          text_vi: "'it remains unclear whether' = không chắc chắn."
