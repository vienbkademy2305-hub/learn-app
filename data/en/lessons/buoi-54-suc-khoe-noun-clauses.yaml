  - type: dialogue
    title_vi: Khám sức khỏe định kỳ
    lines:
      - speaker: A
        text: When did you last have a check-up?
        vi: Lần cuối cậu khám sức khỏe định kỳ là khi nào?
      - speaker: B
        text: Honestly, I can't remember whether it was two or three years ago.
        vi: Thật lòng tớ không nhớ là hai hay ba năm trước nữa.
      - speaker: A
        text: That's quite a long time. What my doctor always says is that prevention is better than cure.
        vi: Khá lâu đấy. Điều bác sĩ của tớ luôn nói là phòng bệnh hơn chữa bệnh.
      - speaker: B
        text: I know, but I feel fine. I eat a balanced diet and I exercise.
        vi: Tớ biết, nhưng tớ thấy khỏe mà. Tớ ăn uống cân bằng và có tập thể dục.
      - speaker: A
        text: The problem is that many chronic diseases have no symptoms at first.
        vi: Vấn đề là nhiều bệnh mãn tính lúc đầu không có triệu chứng.
      - speaker: B
        text: Really? I didn't know that high blood pressure could be silent.
        vi: Thật à? Tớ không biết là huyết áp cao có thể không có dấu hiệu.
      - speaker: A
        text: Exactly. And it's also worth asking how your mental health is, not just your body.
        vi: Chính xác. Và cũng nên hỏi về sức khỏe tinh thần của cậu nữa, không chỉ cơ thể.
      - speaker: B
        text: OK, you've convinced me. I'll book an appointment this week.
        vi: Được rồi, cậu thuyết phục được tớ rồi. Tuần này tớ sẽ đặt lịch khám.
  - type: exercises
    items:
      - id: b54-x1
        bank_no: 18
        kind: completion
        instructions_vi: "Part 4: nghe bài giảng (nghe 1 lần) và hoàn thành ghi chú. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ cho mỗi chỗ trống. Chú ý các con số gần nhau và từ chỉ thái độ. (Quốc gia và số liệu là giả định.)"
        max_words: 1
        audio_text: "Today I want to look at how one country improved public health over thirty years. In 1990, average life expectancy was sixty-seven. By 2020, it had reached seventy-four. What is interesting is that the biggest improvement did not come from hospitals or new medicines. It came from simple things: clean water, better sanitation and free vaccination for children. In 1990, only forty per cent of children were vaccinated; by 2020, the figure was ninety-five per cent. Consequently, outbreaks of infectious diseases became rare. However, the country now faces a different problem. Chronic diseases such as diabetes are increasing, mainly because of poor nutrition and a lack of exercise. The government has started a programme of free check-ups for everyone over forty. Unfortunately, it remains unclear whether people will actually use it, because in the first year, only a quarter of those invited came."
        passage: |-
          PUBLIC HEALTH: 1990–2020
          • Life expectancy in 2020: (1) ___ years
          • Main causes of improvement: clean water, better (2) ___ and free vaccination
          • Children vaccinated in 2020: (3) ___ %
          • Result: fewer outbreaks of (4) ___ diseases
          • New problem: chronic diseases, e.g. (5) ___
          • Free check-ups for people over (6) ___
          • First-year attendance: about a (7) ___
        questions:
          - q: (1)
            answer: "74"
            accept:
              - seventy-four
          - q: (2)
            answer: sanitation
          - q: (3)
            answer: "95"
            accept:
              - ninety-five
          - q: (4)
            answer: infectious
          - q: (5)
            answer: diabetes
          - q: (6)
            answer: "40"
            accept:
              - forty
          - q: (7)
            answer: quarter
      - id: b54-x2
        bank_no: 20
        kind: mcq
        instructions_vi: Dựa vào bài giảng ở bài 1, chọn đáp án đúng về thái độ người nói.
        audio_text: "Today I want to look at how one country improved public health over thirty years. In 1990, average life expectancy was sixty-seven. By 2020, it had reached seventy-four. What is interesting is that the biggest improvement did not come from hospitals or new medicines. It came from simple things: clean water, better sanitation and free vaccination for children. In 1990, only forty per cent of children were vaccinated; by 2020, the figure was ninety-five per cent. Consequently, outbreaks of infectious diseases became rare. However, the country now faces a different problem. Chronic diseases such as diabetes are increasing, mainly because of poor nutrition and a lack of exercise. The government has started a programme of free check-ups for everyone over forty. Unfortunately, it remains unclear whether people will actually use it, because in the first year, only a quarter of those invited came."
        questions:
          - q: What does the speaker find interesting?
            options:
              - Life expectancy fell.
              - The biggest improvement came from simple measures.
              - Hospitals improved dramatically.
              - New medicines were very cheap.
            answer: b
          - q: What was the vaccination rate in 1990?
            options:
              - 40%
              - 67%
              - 74%
              - 95%
            answer: a
          - q: How does the speaker feel about the check-up programme?
            options:
              - certain it will succeed
              - uncertain whether people will use it
              - sure it will fail
              - not interested
            answer: b
      - id: b54-x3
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu bằng mệnh đề danh từ, bắt đầu bằng từ cho sẵn.
        questions:
          - q: The rise in obesity worries doctors. → What ___
            answer: worries doctors is the rise in obesity.
          - q: Everyone accepts that smoking is harmful. → It is widely ___
            answer: accepted that smoking is harmful.
          - q: Will the campaign work? Nobody knows. → Nobody knows ___
            answer: whether the campaign will work.
            accept:
              - if the campaign will work.
              - whether or not the campaign will work.
              - whether the campaign will work or not.
          - q: Why do some people live longer? Scientists are studying this. → Scientists are studying ___
            answer: why some people live longer.
          - q: Vaccination is free. This has increased coverage. → The fact that ___
            answer: vaccination is free has increased coverage.
      - id: b54-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: What worries parents most ___ the lack of exercise.
            options:
              - are
              - is
              - be
              - were being
            answer: b
          - q: Researchers want to know how ___ the disease.
            options:
              - does it spread
              - it spreads
              - spreads it
              - did it spread
            answer: b
          - q: It is unclear ___ the new tax will reduce sugar consumption.
            options:
              - that
              - whether
              - what
              - which
            answer: b
          - q: It is clear ___ good sanitation saves lives.
            options:
              - whether
              - what
              - that
              - if
            answer: c
      - id: b54-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 4 lỗi. Sửa trực tiếp.
        text: What concerns experts are the rise in mental health problems. Nobody knows that social media is the main cause or not. Researchers are trying to understand why do teenagers feel more anxious. It is clear good sleep improves well-being.
        errors:
          - wrong: What concerns experts are
            right: What concerns experts is
            why: Chủ ngữ What … → số ít.
          - wrong: Nobody knows that social media
            right: Nobody knows whether social media
            why: Điều chưa chắc (… or not) → whether.
          - wrong: why do teenagers feel
            right: why teenagers feel
            why: Mệnh đề danh từ không đảo ngữ.
          - wrong: It is clear good sleep
            right: It is clear that good sleep
            why: Văn viết giữ that sau It is + adj.
      - id: b54-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: outbreak
            right: the sudden start of a disease in an area
          - left: chronic disease
            right: an illness that lasts for a long time
          - left: sanitation
            right: systems for clean water and removing waste
          - left: life expectancy
            right: the average number of years people live
          - left: preventive
            right: intended to stop something bad from happening
          - left: well-being
            right: the state of being healthy and happy
      - id: b54-x7
        bank_no: 20
        kind: tf
        instructions_vi: Nghe hai người nói chuyện rồi chọn T (đúng) hoặc F (sai).
        audio_text: |-
          Woman: I read that the city is going to make vaccination compulsory for all schoolchildren.
          Man: Really? Is that already decided?
          Woman: Not yet. The council will vote next month. What surprised me is that most parents support it.
          Man: Do you know why some parents are against it?
          Woman: Mostly they worry about side effects, although doctors say the risks are very small.
        questions:
          - q: Compulsory vaccination has already been decided.
            answer: F
          - q: The council will vote next month.
            answer: T
          - q: Most parents oppose the plan.
            answer: F
          - q: Some parents worry about side effects.
            answer: T
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 180–200 từ trả lời câu hỏi bên dưới. Dùng ít nhất 4 mệnh đề danh từ khác nhau (What … is, It is + adj + that, whether, why/how, The fact that) và 6 từ của buổi này. Tự kiểm tra: không đảo ngữ sau why/how; What … is dùng động từ số ít."
    prompt_en: Should governments spend more money on preventing illness than on treating it?
