  - type: skill
    skill: reading
    title_vi: Reading & Listening — nhận ra paraphrase giữa câu hỏi và bài
    intro_vi: "Gần như mọi câu hỏi Reading và Listening đều PARAPHRASE bài: câu hỏi nói 'prohibited', bài nói 'banned'; câu hỏi nói 'the introduction of new laws', bài nói 'when the government introduced new laws'. Người học band 5 tìm TỪ GIỐNG; người học band 6.5+ tìm Ý GIỐNG. Buổi này luyện nhận ra 4 kiểu paraphrase đã học để định vị đáp án nhanh hơn."
    steps:
      - title_vi: Dự đoán paraphrase trước khi đọc bài
        text_vi: "Với mỗi từ khóa trong câu hỏi, nghĩ nhanh 1–2 cách bài có thể viết khác: prohibited → banned / not allowed / illegal."
      - title_vi: Neo bằng từ KHÔNG đổi được
        text_vi: Tên riêng, số, năm, thuật ngữ (animal testing, human rights) thường giữ nguyên — dùng chúng để tìm vị trí, rồi đọc kỹ quanh đó.
      - title_vi: Nhận ra đổi cấu trúc
        text_vi: "Bị động ↔ chủ động, động từ ↔ danh từ: 'The law was changed in 2015' = 'the 2015 change to the law'."
      - title_vi: Kiểm tra mức độ và phủ định
        text_vi: some/most/all, may/will, not/never — bẫy F/NG hay nằm ở đây, dù từ vựng giống.
      - title_vi: "Listening: nghe ý, không chờ từ"
        text_vi: Đáp án thường đến sau câu paraphrase trong phiếu. Nghe thấy 'the main reason' khi phiếu ghi 'Cause:' là đến lúc viết.
    tips:
      - "Sổ paraphrase: mỗi bài đọc làm xong, chép 5 cặp (câu hỏi ↔ bài) — sau 20 bài bạn có 100 cặp hay gặp."
      - "Các cặp hay gặp chủ đề luật: ban ≈ prohibit ≈ make illegal; obey ≈ comply with ≈ follow; punish ≈ penalise ≈ impose a penalty."
      - "Câu hỏi thường dùng từ CHUNG hơn bài: bài 'cosmetics', câu hỏi 'beauty products'."
    traps:
      - trap_vi: Chọn đáp án vì thấy từ giống hệt trong bài.
        fix_vi: Từ giống hệt thường là bẫy; kiểm tra ý cả câu.
      - trap_vi: Bỏ qua từ chỉ mức độ (some, most, may).
        fix_vi: Gạch chân chúng trong câu hỏi trước khi đọc.
      - trap_vi: "Không nhận ra bị động: 'X was banned by Y' ≠ 'X banned Y'."
        fix_vi: Xác định ai làm gì với ai.
    phrases:
      - en: ban → prohibit / make illegal
        vi: cấm
      - en: obey → comply with / follow
        vi: tuân thủ
      - en: punish → impose a penalty on
        vi: trừng phạt
      - en: introduce a law → the introduction of a law
        vi: ban hành luật
      - en: not allowed → prohibited / illegal
        vi: không được phép
    demo:
      title_vi: "Làm mẫu: nối câu hỏi với câu trong bài"
      text_en: |-
        Passage sentence: In 2013, the European Union made it illegal to sell cosmetics that had been tested on animals.

        Question A (TFNG): The sale of beauty products tested on animals was prohibited in the EU. → TRUE
        made it illegal to sell → the sale … was prohibited (danh từ hóa + bị động + đồng nghĩa); cosmetics → beauty products (từ chung hơn).

        Question B (TFNG): All countries in the world have banned animal testing for cosmetics. → NOT GIVEN (or FALSE if the passage mentions countries that still allow it)
        The passage only mentions the EU; 'all countries' changes the scope.

        Question C (completion): The EU ban on selling animal-tested cosmetics was introduced in ______. → 2013
        'was introduced' = 'made it illegal'; the number is the anchor.
      notes:
        - label: Question A
          text_vi: Ba kỹ thuật paraphrase cùng lúc trong một câu hỏi.
        - label: Question B
          text_vi: "Bẫy mức độ: 'All countries' — bài không nói."
        - label: Question C
          text_vi: Neo bằng thuật ngữ (cosmetics, EU) và tìm số.
