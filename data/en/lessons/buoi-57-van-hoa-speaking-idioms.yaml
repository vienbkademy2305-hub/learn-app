  - type: dialogue
    title_vi: "Part 1: Quê hương và thay đổi"
    lines:
      - speaker: Examiner
        text: Where did you grow up?
        vi: Bạn lớn lên ở đâu?
      - speaker: Candidate
        text: I grew up in a small town near Hue. Whenever I go back, it really brings back memories of riding my bike along the river.
        vi: Tôi lớn lên ở một thị trấn nhỏ gần Huế. Mỗi lần về, nó gợi lại kỷ niệm đạp xe dọc bờ sông.
      - speaker: Examiner
        text: Has it changed much?
        vi: Nó có thay đổi nhiều không?
      - speaker: Candidate
        text: Enormously. It's a far cry from the quiet place I remember. There are hotels and cafés everywhere now.
        vi: Rất nhiều. Nó khác xa nơi yên tĩnh tôi còn nhớ. Giờ khách sạn và quán cà phê ở khắp nơi.
      - speaker: Examiner
        text: Would you like to live there again?
        vi: Bạn có muốn sống ở đó lần nữa không?
      - speaker: Candidate
        text: Maybe in the long run. For now, I've got used to city life, and I think I'd find it hard to fit in again.
        vi: Có thể về lâu dài. Giờ thì tôi đã quen với cuộc sống thành phố, và chắc sẽ khó hòa nhập lại.
      - speaker: Examiner
        text: Do you miss anything about it?
        vi: Bạn có nhớ điều gì ở đó không?
      - speaker: Candidate
        text: The clean air, definitely. I used to take it for granted, but after living in the city, I really appreciate it.
        vi: Chắc chắn là không khí trong lành. Trước tôi coi đó là hiển nhiên, nhưng sau khi sống ở thành phố, tôi thật sự trân trọng nó.
  - type: exercises
    items:
      - id: b57-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền cụm phù hợp (chia động từ nếu cần theo gợi ý trong câu).
        bank:
          - fit in
          - get the hang of
          - brings back memories
          - a far cry from
          - take it for granted
          - keep up with
        questions:
          - q: Driving on the left was strange, but I soon managed to ___ it.
            answer: get the hang of
          - q: This old song always ___ of my school days.
            answer: brings back memories
          - q: Modern Saigon is ___ the city my grandparents knew.
            answer: a far cry from
          - q: New students sometimes find it hard to ___.
            answer: fit in
          - q: Clean water is precious; we shouldn't ___.
            answer: take it for granted
          - q: It's hard to ___ all the new apps.
            answer: keep up with
      - id: b57-x2
        bank_no: 5
        kind: paraphrase
        instructions_vi: Viết lại câu cho tự nhiên hơn bằng cụm trong ngoặc.
        questions:
          - q: I learnt to cook Vietnamese food after some time. (get the hang of)
            answer: It took me some time to get the hang of cooking Vietnamese food.
            accept:
              - I got the hang of cooking Vietnamese food after some time.
              - After some time, I got the hang of cooking Vietnamese food.
          - q: I am excited about seeing my friends next week. (look forward to)
            answer: I'm looking forward to seeing my friends next week.
            accept:
              - I am looking forward to seeing my friends next week.
              - I look forward to seeing my friends next week.
          - q: I found an interesting old book by chance. (come across)
            answer: I came across an interesting old book.
            accept:
              - I came across an interesting old book by chance.
          - q: When I lived abroad, I missed my home a lot. (homesick)
            answer: When I lived abroad, I felt very homesick.
            accept:
              - When I lived abroad, I was very homesick.
              - When I lived abroad, I felt homesick.
              - When I lived abroad, I was homesick.
      - id: b57-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Câu trả lời (đã chép ra) có 4 lỗi. Sửa trực tiếp.
        text: I'm looking forward to visit Japan next year. When I was grow up, I took for granted my family. I learnt some Japanese from anime and picked up it quickly. It's raining cats and dogs of opportunities there.
        errors:
          - wrong: looking forward to visit
            right: looking forward to visiting
            why: look forward to + V-ing.
          - wrong: When I was grow up, I took for granted my family
            right: When I was growing up, I took my family for granted
            why: was growing up; take + O + for granted.
          - wrong: picked up it quickly
            right: picked it up quickly
            why: "Đại từ đứng giữa: pick it up."
          - wrong: It's raining cats and dogs of opportunities there.
            right: There are lots of opportunities there.
            why: Thành ngữ sai nghĩa, sai chỗ — dùng câu đơn giản chính xác.
      - id: b57-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn cách diễn đạt TỰ NHIÊN nhất cho Speaking.
        questions:
          - q: "'Describe your first week at university.' Best sentence?"
            options:
              - It was a piece of cake.
              - It took me a while to fit in, but my roommates made me feel at home.
              - Every cloud has a silver lining.
              - It was raining cats and dogs.
            answer: b
          - q: Which is grammatically correct?
            options:
              - I look forward to hear from you.
              - I look forward to hearing from you.
              - I look forward hearing from you.
              - I look forward for hearing from you.
            answer: b
          - q: Which is grammatically correct?
            options:
              - I took for granted my health.
              - I took my health for granted.
              - I took granted my health.
              - I for granted took my health.
            answer: b
          - q: "'Has your hometown changed?' Most natural answer:"
            options:
              - Yes, change is the only constant.
              - Yes, it's a far cry from the quiet town I grew up in.
              - Yes, it changes very very much.
              - Yes, as the saying goes, time flies.
            answer: b
      - id: b57-x5
        bank_no: 30
        kind: speaking-part2
        instructions_vi: "Chuẩn bị 1 phút, nói 2 phút, ghi âm. Dùng 3–4 cụm tự nhiên của buổi này (không dùng thành ngữ sáo). Nghe lại: cụm nào nghe gượng? Thay bằng câu đơn giản."
        cue_card:
          topic: Describe a place you visited that was very different from your hometown.
          points:
            - where it was
            - when you went there
            - what was different about it
            - and explain how you felt about the experience
        sample: I'd like to talk about Seoul, which I visited two years ago. Coming from a small town, I found it a far cry from what I was used to. At first, I felt a bit of culture shock — everything was so fast and organised. It took me a couple of days to get the hang of the subway…
      - id: b57-x6
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối cụm với nghĩa tiếng Anh.
        pairs:
          - left: get the hang of
            right: to learn how to do something
          - left: take for granted
            right: to not value something because it is always there
          - left: a far cry from
            right: very different from
          - left: fit in
            right: to be accepted by a group
          - left: come across
            right: to find something by chance
          - left: catch up on
            right: to do something you did not have time for before
      - id: b57-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe một thí sinh nói Part 2 và câu hỏi thêm (hai giọng) rồi chọn đáp án đúng.
        audio_text: |-
          Examiner: So, how did you feel when you first arrived in Canada?
          Candidate: Honestly, I felt really homesick. It was minus twenty degrees, which was a far cry from Ho Chi Minh City!
          Examiner: How long did it take you to settle in?
          Candidate: About three months. It took me a while to get the hang of the bus system, but my classmates helped me fit in.
          Examiner: Would you go back?
          Candidate: Definitely. I'm already looking forward to visiting my friends there next winter.
        questions:
          - q: How did the candidate feel at first?
            options:
              - excited
              - homesick
              - bored
              - angry
            answer: b
          - q: What was very different from Ho Chi Minh City?
            options:
              - the food
              - the temperature
              - the language
              - the people
            answer: b
          - q: What took a while to learn?
            options:
              - the language
              - the bus system
              - cooking
              - skiing
            answer: b
          - q: What is the candidate looking forward to?
            options:
              - studying again
              - visiting friends there
              - finding a job
              - moving home
            answer: b
      - id: b57-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai).
        audio_text: Moving to a new country usually happens in stages. At first, everything seems exciting. Then, after a few weeks, many people experience culture shock and feel homesick. Most people get the hang of their new life within six months, although some never fully fit in. Researchers say that people who are open-minded and make local friends adapt fastest.
        questions:
          - q: People usually feel homesick immediately after they arrive.
            answer: F
            explain_vi: Lúc đầu thấy hào hứng; sốc văn hóa sau vài tuần.
          - q: Most people adapt within six months.
            answer: T
          - q: Everyone eventually fits in completely.
            answer: F
          - q: Making local friends helps people adapt faster.
            answer: T
  - type: homework
    kind: speaking
    prompt_vi: Ghi âm 2 thẻ Part 2 dưới đây (1 phút chuẩn bị, 2 phút nói). Mỗi thẻ dùng 3–4 cụm tự nhiên của buổi, không dùng thành ngữ sáo. Chép lại một bài, gạch dưới các cụm; đánh dấu cụm nào bạn thấy chưa tự nhiên để hỏi lại ở buổi sau.
    prompt_en: 1. Describe a skill that took you a long time to learn. 2. Describe a place that has changed a lot since you were a child.
    minutes: 25
