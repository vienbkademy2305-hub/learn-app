  - type: skill
    skill: speaking
    title_vi: "Speaking — Lexical Resource band 7: tự nhiên, không sáo rỗng"
    intro_vi: "Giám khảo không chấm số lượng từ khó, mà chấm việc bạn chọn từ CHÍNH XÁC và TỰ NHIÊN cho ngữ cảnh. Band 6: 'has a wide enough vocabulary to discuss topics at length'. Band 7: 'uses vocabulary resource flexibly … uses some less common and idiomatic vocabulary and shows some awareness of style and collocation'. Cụm động từ (grow up, fit in, come across) và thành ngữ phổ biến (take for granted, a far cry from) làm câu trả lời nghe như người thật đang nói, không như đọc bài."
    steps:
      - title_vi: Chuẩn bị theo chủ đề, không theo danh sách thành ngữ
        text_vi: "Với mỗi chủ đề Part 2 hay gặp (tuổi thơ, du lịch, thay đổi, người quan trọng), chuẩn bị 3–4 cụm tự nhiên. VD tuổi thơ: grow up, bring back memories, take for granted."
      - title_vi: Dùng khi kể chuyện và so sánh
        text_vi: Thành ngữ tự nhiên nhất khi kể trải nghiệm (It took me a while to get the hang of it) hoặc so sánh quá khứ–hiện tại (a far cry from…).
      - title_vi: Kiểm tra ngữ pháp của cụm
        text_vi: look forward to + V-ing; take + O + for granted; pick it up. Cụm đúng ý nhưng sai cấu trúc vẫn bị trừ điểm GRA.
      - title_vi: Tránh sáo ngữ
        text_vi: Không mở câu bằng 'It's a piece of cake', 'raining cats and dogs', 'every cloud has a silver lining' — giám khảo biết đó là câu học thuộc.
    tips:
      - "Paraphrase tự nhiên khi quên từ: 'the thing you use to…', 'a kind of…' — cũng được tính là linh hoạt."
      - "Cụm động từ làm câu nói trôi hơn động từ Latin: find out > discover, come across > encounter (trong văn nói)."
      - Một câu trả lời Part 2 dùng 3–4 cụm tự nhiên là đủ cho band 7 về Lexical Resource.
    traps:
      - trap_vi: Nhét thành ngữ không liên quan để 'khoe'.
        fix_vi: Chỉ dùng khi nghĩa khớp đúng tình huống.
      - trap_vi: look forward to + V nguyên thể.
        fix_vi: look forward to + V-ing.
      - trap_vi: "Đặt sai vị trí tân ngữ: 'take for granted my family'."
        fix_vi: take my family for granted.
    phrases:
      - en: It took me a while to get the hang of it.
        vi: Tôi mất một thời gian mới quen tay.
      - en: It really brings back memories of …
        vi: Nó thật sự gợi lại kỷ niệm về …
      - en: It's a far cry from …
        vi: Nó khác xa so với …
      - en: I used to take … for granted.
        vi: Tôi từng coi … là điều hiển nhiên.
      - en: What stood out most was …
        vi: Điều nổi bật nhất là …
    demo:
      title_vi: "Làm mẫu: cùng một ý, band 6 và band 7"
      text_en: |-
        Question (Part 2): Describe a time you lived or stayed in a different place.

        Band 6: When I went to Australia, it was very difficult at first. The culture was very different and I missed my family very much. After some months I became familiar with the life there and I was happy.

        Band 7: When I first moved to Australia to study, I went through quite a bit of culture shock. Everything was a far cry from what I was used to, and I felt really homesick for the first few months. It took me a while to fit in, but once I got the hang of the local way of life, I started to feel at home. Looking back, it made me far more open-minded, and I realised how much I'd taken my family for granted.
      notes:
        - label: culture shock, homesick
          text_vi: Thay 'very difficult', 'missed my family very much' bằng từ chính xác.
        - label: a far cry from
          text_vi: Thay 'very different' — thành ngữ phổ biến, đúng ngữ cảnh.
        - label: fit in, got the hang of, feel at home
          text_vi: Ba cụm động từ/thành ngữ kể quá trình thích nghi tự nhiên.
        - label: taken … for granted
          text_vi: Đúng cấu trúc take + O + for granted, thì quá khứ hoàn thành.
