  - type: pronunciation
    notes:
      - sound: snd-sh
        text_vi: "Đuôi -tion, -cian đọc /ʃən/: occupation, electrician. Chu môi khi đọc /ʃ/, đừng đọc thành /s/."
      - sound: snd-zh
        text_vi: /ʒ/ là bản rung của /ʃ/, gặp trong decision, usually, television.
      - word: occupation|n
        text_vi: "Từ có -tion: trọng âm luôn rơi vào âm tiết ngay trước -tion: oc-cu-PA-tion."
      - word: colleague|n
        text_vi: "Chỉ 2 âm tiết: KOL-iːg. Không đọc -gue thành 'gơ'."
      - { word: colleague|n, text_vi: "colleague /ˈkɒl.iːɡ/ (đồng nghiệp, âm cuối /ɡ/) ≠ college /ˈkɒl.ɪdʒ/ (trường cao đẳng, âm cuối /dʒ/) — hai từ rất dễ nhầm khi nghe." }
      - { word: chef|n, text_vi: "chef đọc /ʃef/ như 'she', không đọc /tʃ/ như chair." }
