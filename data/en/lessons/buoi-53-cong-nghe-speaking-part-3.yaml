  - type: skill
    skill: speaking
    title_vi: Speaking Part 3 — cân nhắc và phản biện quan điểm trái chiều
    intro_vi: "Buổi 32 (A-R-E-A) và 40 (paraphrase, dự đoán) đã cho bạn khung trả lời. Ở band 6.5+, giám khảo Part 3 thường 'đẩy' bằng câu hỏi trái chiều: 'Some people say technology makes us lonely. What do you think?' hoặc hỏi lại 'But isn't it true that…?'. Người nói band cao không né và không chỉ đồng ý/không đồng ý: họ THỪA NHẬN phần đúng, rồi đưa quan điểm CÓ ĐIỀU KIỆN kèm lý do và ví dụ. Đây là 'phát triển ý' mà tiêu chí Fluency & Coherence tìm kiếm."
    steps:
      - title_vi: Nhận ra câu hỏi 'hai phía'
        text_vi: Some people say… / Isn't it true that… / Do you agree that… → giám khảo mời bạn cân nhắc hai phía.
      - title_vi: Thừa nhận ngắn (1 câu)
        text_vi: "'I can see why some people think that, especially when…' — cho thấy bạn hiểu góc nhìn kia."
      - title_vi: Phản bác bằng lý do chính
        text_vi: "'But I'd argue that…' + lý do rõ nhất của bạn."
      - title_vi: Ví dụ cụ thể
        text_vi: "'For example, my grandparents video-call us every week, which they couldn't do ten years ago.'"
      - title_vi: Kết bằng quan điểm có điều kiện
        text_vi: "'So I think it depends on how we use it: …' — nghe chín chắn hơn một câu tuyệt đối."
    tips:
      - "Khi giám khảo phản bác lại bạn ('But what about…?'), đó là tín hiệu tốt: trả lời bình tĩnh bằng 'That's a valid point. Having said that…'."
      - Không cần thay đổi quan điểm; chỉ cần cho thấy bạn đã cân nhắc.
      - "Dùng ngôn ngữ mức độ (Buổi 49, 52): may, tend to, is likely to — tránh 'always/never'."
    traps:
      - trap_vi: Chỉ nói 'I agree' / 'I disagree' rồi dừng.
        fix_vi: Thừa nhận → phản bác → ví dụ → kết có điều kiện.
      - trap_vi: Nhượng bộ quá dài, quên quan điểm của mình.
        fix_vi: Nhượng bộ 1 câu, phần còn lại cho quan điểm của bạn.
      - trap_vi: "'While …, but …'."
        fix_vi: While (mặc dù) không đi với but.
      - trap_vi: Dùng từ viết trang trọng khi nói (Moreover, Consequently).
        fix_vi: "Nói: Also, So, Having said that, The thing is…"
    phrases:
      - en: I can see why some people think that, but …
        vi: Tôi hiểu vì sao một số người nghĩ vậy, nhưng …
      - en: That's a valid point. Having said that, …
        vi: Ý đó có cơ sở. Nói vậy chứ, …
      - en: To some extent, yes, but …
        vi: Ở một mức độ nào đó thì đúng, nhưng …
      - en: It depends on how we use it.
        vi: Còn tùy vào cách chúng ta sử dụng nó.
      - en: I wouldn't go as far as saying …
        vi: Tôi sẽ không đến mức nói rằng …
    demo:
      title_vi: "Làm mẫu: trả lời câu hỏi trái chiều"
      text_en: |-
        Examiner: Some people say technology has made people more isolated. Do you agree?

        Candidate: I can see why some people think that, especially when you see a whole family at dinner looking at their phones. But I'd argue that, overall, technology has brought people closer. For example, my grandparents live in the countryside, and they video-call us every weekend, which simply wasn't possible ten years ago. Having said that, I think it depends on how we use it: if we use it to replace face-to-face contact completely, then yes, it can lead to social isolation.
      notes:
        - label: Thừa nhận
          text_vi: "'I can see why some people think that, especially when…' + hình ảnh cụ thể."
        - label: Phản bác
          text_vi: "'But I'd argue that, overall…' — quan điểm rõ."
        - label: Ví dụ
          text_vi: Ông bà gọi video — cá nhân nhưng tiêu biểu; which (Buổi 48) nối hệ quả.
        - label: Kết có điều kiện
          text_vi: "'Having said that, it depends…' + câu điều kiện loại 1 (Buổi 31)."
