  - type: dialogue
    title_vi: Hỏi đường ra sân bay
    lines:
      - speaker: A
        text: Excuse me, how can I get to the airport?
        vi: Xin lỗi, làm sao để ra sân bay ạ?
      - speaker: B
        text: You can go by taxi or by bus.
        vi: Bạn có thể đi taxi hoặc xe buýt.
      - speaker: A
        text: Which is cheaper?
        vi: Cách nào rẻ hơn ạ?
      - speaker: B
        text: The bus is the cheapest, but it's very crowded at rush hour.
        vi: Xe buýt rẻ nhất, nhưng giờ cao điểm rất đông.
      - speaker: A
        text: Where is the bus stop?
        vi: Điểm dừng xe buýt ở đâu ạ?
      - speaker: B
        text: It's opposite the train station. Take bus number 86.
        vi: Đối diện ga tàu. Bạn bắt xe số 86 nhé.
      - speaker: A
        text: And where do I get off?
        vi: Thế tôi xuống ở đâu ạ?
      - speaker: B
        text: Get off at the last stop. The journey takes about forty-five minutes.
        vi: Xuống ở bến cuối. Đi mất khoảng bốn mươi lăm phút.
  - type: exercises
    items:
      - id: b10-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền by, on hoặc in.
        bank:
          - by
          - on
          - in
        questions:
          - q: I usually go to school ___ bus.
            answer: by
          - q: There were fifty people ___ the bus.
            answer: on
          - q: My brother drove me home ___ his car.
            answer: in
          - q: It's near. Let's go ___ foot.
            answer: on
          - q: She goes to work ___ her motorbike.
            answer: on
          - q: We travelled to Nha Trang ___ train.
            answer: by
          - q: He left his phone ___ the taxi.
            answer: in
      - id: b10-x2
        bank_no: 2
        kind: match-definition
        instructions_vi: Nối từ với định nghĩa tiếng Anh.
        pairs:
          - left: commute
            right: to travel between home and work every day
          - left: rush hour
            right: the busy time when people go to or come home from work
          - left: passenger
            right: a person who travels in a vehicle but is not driving
          - left: helmet
            right: a hard hat that keeps your head safe
          - left: traffic jam
            right: a long line of cars that cannot move
      - id: b10-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ thích hợp vào chỗ trống.
        bank:
          - ticket
          - crowded
          - convenient
          - driver
          - station
          - journey
        questions:
          - q: You need a ___ to get on the train.
            answer: ticket
          - q: The bus is very ___. There are no seats.
            answer: crowded
          - q: The metro is fast and ___.
            answer: convenient
          - q: The taxi ___ doesn't know the way.
            answer: driver
          - q: The train leaves the ___ at 9:30.
            answer: station
          - q: The ___ from Hanoi to Sapa is about five hours.
            answer: journey
      - id: b10-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn dưới đây có 5 lỗi. Tìm và sửa.
        text: Every day I commute to work by my motorbike. My wife goes to her office by the bus. Sometimes the bus is very crowd and she can't get in the bus. On Sundays we go to the park by foot. There are many traffics in our city.
        errors:
          - wrong: by my motorbike
            right: on my motorbike
            why: Có my → on.
          - wrong: by the bus
            right: by bus
            why: by + phương tiện, không có the.
          - wrong: very crowd
            right: very crowded
            why: Cần tính từ crowded.
          - wrong: get in the bus
            right: get on the bus
            why: Xe buýt dùng get on.
          - wrong: by foot
            right: on foot
            why: Đi bộ là on foot.
      - id: b10-x5
        bank_no: 16
        kind: completion
        instructions_vi: Đọc đoạn văn rồi hoàn thành câu. Mỗi chỗ trống tối đa HAI từ.
        max_words: 2
        passage: Minh lives in Thu Duc and works in District 1. His brother goes to work by motorbike, but Minh doesn't like the traffic jams at rush hour, so he takes the metro. He walks to the station, which takes ten minutes, and the train takes twenty-five minutes. He says the metro is more convenient and safer than a motorbike, but it is crowded in the morning.
        questions:
          - q: Minh goes to work by ___.
            answer: metro
            accept:
              - the metro
              - train
          - q: He gets to the station on ___.
            answer: foot
          - q: The train part of the journey takes ___ minutes.
            answer: twenty-five
            accept:
              - "25"
          - q: The metro is busy in the ___.
            answer: morning
      - id: b10-x6
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền giới từ / cụm từ chỉ đường thích hợp.
        bank:
          - along
          - across
          - through
          - straight
          - left
          - corner
          - into
        questions:
          - q: Walk ___ the river for about 200 metres.
            answer: along
          - q: Go ___ the bridge to the other side.
            answer: across
          - q: We drive ___ a long tunnel under the mountain.
            answer: through
          - q: Go ___ on, don't turn.
            answer: straight
          - q: Turn ___ at the traffic lights. The shop is on your left.
            answer: left
          - q: The pharmacy is on the ___ of Le Loi Street.
            answer: corner
          - q: She gets ___ the taxi.
            answer: into
      - id: b10-x7
        bank_no: 19
        kind: completion
        instructions_vi: Đọc lời chỉ đường rồi điền KHÔNG QUÁ HAI TỪ vào chỗ trống.
        max_words: 2
        passage: You come out of the station and turn right. You go straight on along Tran Phu Street and go past the post office. At the second corner, you turn left. Then you go across the road. The museum is on your left, opposite a big park. It takes about ten minutes on foot.
        questions:
          - q: When you come out of the station, you turn ___.
            answer: right
          - q: You go past the ___.
            answer: post office
          - q: You turn left at the ___ corner.
            answer: second
            accept:
              - 2nd
          - q: The museum is opposite a ___.
            answer: big park
            accept:
              - park
          - q: It takes about ten minutes ___.
            answer: on foot
      - id: b10-x8
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Woman: Excuse me, how do I get to the train station?
          Man: Go straight on along this street, then turn left at the corner.
          Woman: Is it far? Can I go on foot?
          Man: It's about fifteen minutes on foot. Or you can take the number nine bus. The bus stop is across the road.
          Woman: Thank you very much!
        questions:
          - { q: Where does the woman turn left?, options: [ at the station, at the corner, at the bus stop, at the traffic lights ], answer: b }
          - { q: How long does it take on foot?, options: [ five minutes, fifteen minutes, fifty minutes, an hour ], answer: b }
          - { q: Which bus can she take?, options: [ number 5, number 9, number 19, number 90 ], answer: b }
      - id: b10-x9
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: I commute to work by motorbike. The journey usually takes twenty minutes, but in the rush hour it takes forty, because of the traffic jams. My wife goes to work by bus. It's slower but cheaper, and she can read on the bus.
        questions:
          - { q: The speaker goes to work by bus., answer: F }
          - { q: "In the rush hour, the journey takes forty minutes.", answer: T }
          - { q: His wife goes to work by motorbike., answer: F }
          - { q: The bus is cheaper than the motorbike., answer: T }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 60–90 từ: bạn đi làm/đi học bằng gì, mất bao lâu, giá bao nhiêu, và so sánh với một phương tiện khác. Dùng đúng by/on/in."
    prompt_en: How do you commute? Compare two ways of getting to work or school.
    words:
      min: 60
      max: 90
