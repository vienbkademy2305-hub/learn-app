  - type: grammar
    items:
      - en-g3-04
  - type: skill
    skill: speaking
    title_vi: Speaking Part 1 — từ band 5.5 lên 6.5
    intro_vi: "Buổi 24 đã học công thức Answer + Reason + Detail cho Part 1. Band 6.5 khác band 5.5 không phải ở độ dài mà ở CHẤT: (1) từ vựng tự nhiên, cụ thể theo chủ đề (cram, procrastinate, challenging), không lặp 'good/bad/very'; (2) thì linh hoạt — nói về hiện tại, quá khứ và thay đổi trong cùng một câu trả lời; (3) nói mềm có mức độ (tend to, fairly); (4) ít ngập ngừng dài. Part 1 kéo dài 4–5 phút với 2–3 chủ đề quen thuộc: học tập/công việc, quê hương, sở thích, thói quen hằng ngày."
    steps:
      - title_vi: Trả lời thẳng, không lặp câu hỏi
        text_vi: "Hỏi 'Do you like studying?' → không nói 'Yes, I like studying'. Nói: 'Yes, most of the time, especially when …'."
      - title_vi: Thêm lý do bằng từ cụ thể
        text_vi: "Thay 'because it's interesting' bằng lý do có hình ảnh: 'because I get to do experiments instead of just memorising facts'."
      - title_vi: Thêm một chi tiết khác THÌ
        text_vi: "So sánh quá khứ – hiện tại: 'When I was at school, I used to cram, but these days I tend to study a little every day.' Một câu, ba thì — điểm Grammatical Range."
      - title_vi: Dừng đúng lúc
        text_vi: 20–30 giây mỗi câu. Part 1 không cần nói hết; giám khảo cần thời gian hỏi các câu khác.
    tips:
      - Chuẩn bị sẵn 'câu chuyện nhỏ' về 4 chủ đề quen thuộc — dùng lại được cho nhiều câu hỏi.
      - "Hỏi lại khi không nghe rõ: 'Sorry, could you repeat the question?' — không bị trừ điểm."
      - Tránh câu học thuộc kiểu 'Well, to be honest, that's an interesting question' cho câu hỏi Part 1 đơn giản.
    traps:
      - trap_vi: Trả lời 'Yes' / 'No' rồi im.
        fix_vi: Luôn thêm lý do + chi tiết (2–3 câu).
      - trap_vi: Dùng very / good / bad / interesting liên tục.
        fix_vi: "Đổi: fairly challenging, really inspiring, a bit tedious, pretty strict."
      - trap_vi: "'I am tend to…' hoặc 'I tend to studying'."
        fix_vi: I tend to + V nguyên thể.
      - trap_vi: Nói cả phút cho một câu Part 1 và bị ngắt.
        fix_vi: 20–30 giây; ý dài để dành cho Part 2 và 3.
    phrases:
      - en: Most of the time, yes, especially when …
        vi: Phần lớn là có, nhất là khi …
      - en: Not particularly, to be honest. I'd rather …
        vi: Thật ra là không lắm. Tôi thích … hơn.
      - en: I used to …, but these days I tend to …
        vi: Trước đây tôi hay …, nhưng dạo này tôi thường …
        note_vi: Ba thì trong một câu.
      - en: It was fairly …, although …
        vi: Nó khá …, dù …
      - en: I'd say it depends on …
        vi: Tôi cho là còn tùy vào …
    demo:
      title_vi: "Làm mẫu: cùng một câu hỏi, band 5.5 và band 6.5"
      text_en: |-
        Examiner: How do you usually prepare for exams?

        Band 5.5: I study very hard before the exam. I read my books and I do many exercises. It is very tiring but it is good.

        Band 6.5: I have to admit I tend to procrastinate, so I usually end up cramming the night before. When I was in high school, I used to memorise everything, but these days I try to review a little every day, which is far less stressful.
      notes:
        - label: Từ vựng cụ thể
          text_vi: procrastinate, cramming, memorise, review thay cho 'study very hard', 'read my books'.
        - label: Nói mềm
          text_vi: "'I have to admit', 'tend to', 'try to' — nghe thật và tự nhiên."
        - label: Thì linh hoạt
          text_vi: Hiện tại (tend to) → quá khứ (used to) → hiện tại (these days) trong 2 câu.
        - label: ", which is …"
          text_vi: Mệnh đề quan hệ không xác định (Buổi 48) để kết câu gọn.
