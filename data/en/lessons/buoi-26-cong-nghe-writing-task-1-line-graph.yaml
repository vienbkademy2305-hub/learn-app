  - type: skill
    skill: writing
    title_vi: Writing Task 1 — biểu đồ đường (line graph)
    intro_vi: "Task 1 (Academic): 20 phút, tối thiểu 150 từ, chiếm khoảng 1/3 điểm Writing. Biểu đồ đường cho thấy số liệu THAY ĐỔI theo thời gian. Bạn không nêu ý kiến, không giải thích nguyên nhân — chỉ tóm tắt và so sánh những điểm nổi bật. Bố cục 4 đoạn an toàn: Mở bài (paraphrase) → Overview (xu hướng chính, không số liệu) → Thân bài 1 → Thân bài 2."
    steps:
      - title_vi: Phân tích biểu đồ (2–3 phút)
        text_vi: Biểu đồ nói về cái gì, ở đâu, đơn vị gì (%, triệu, $), từ năm nào đến năm nào? Thời gian ở quá khứ → quá khứ đơn; có năm tương lai → will / is expected to.
      - title_vi: "Mở bài: 1 câu paraphrase đề"
        text_vi: shows → illustrates / gives information about; the number of → how many; from 2010 to 2020 → over a ten-year period. Không chép nguyên đề.
      - title_vi: "Overview: 2 đặc điểm nổi bật nhất"
        text_vi: Bắt đầu bằng 'Overall, …'. Nêu xu hướng chung (tăng/giảm) và đường nào cao nhất / thay đổi nhiều nhất. KHÔNG đưa số liệu vào overview. Thiếu overview thì Task Achievement khó vượt band 5.
      - title_vi: Chia nhóm số liệu cho 2 thân bài
        text_vi: "Cách dễ nhất: nhóm các đường cùng xu hướng (các đường tăng / các đường giảm), hoặc chia theo giai đoạn (trước và sau một mốc)."
      - title_vi: "Thân bài: mô tả + số liệu + so sánh"
        text_vi: "Mỗi xu hướng cần: điểm đầu → biến đổi (sharply/gradually) → điểm cuối, kèm số liệu chính. So sánh giữa các đường: higher than, twice as many as, while…"
      - title_vi: Soát lỗi (2 phút)
        text_vi: Thì, trạng từ/tính từ (rose sharply / a sharp rise), giới từ from/to/by/at, số nhiều, đủ 150 từ.
    tips:
      - Không cần nhắc mọi con số — chọn điểm bắt đầu, điểm kết thúc, đỉnh, đáy và chỗ hai đường cắt nhau.
      - Luân phiên hai cấu trúc (động từ + trạng từ / There was a + tính từ + danh từ) để tránh lặp.
      - Dùng 'the figure for…', 'this number' thay cho việc lặp lại cả cụm chủ ngữ dài.
      - "Số liệu ước lượng: around, approximately, just over, just under, nearly."
    traps:
      - trap_vi: Viết overview có số liệu hoặc bỏ luôn overview.
        fix_vi: Overview chỉ nói xu hướng lớn, không số; luôn có đoạn bắt đầu bằng Overall.
      - trap_vi: "Giải thích nguyên nhân: 'because people became richer'."
        fix_vi: Task 1 chỉ mô tả dữ liệu trên biểu đồ, không suy đoán lý do.
      - trap_vi: "Liệt kê từng năm một: In 2010… In 2011… In 2012…"
        fix_vi: "Gộp thành xu hướng: rose steadily from 2010 to 2015, then…"
      - trap_vi: "Dùng bị động: 'The number was increased'."
        fix_vi: "Số liệu tự thay đổi → chủ động: The number increased."
    phrases:
      - en: The line graph illustrates …
        vi: Biểu đồ đường minh họa …
        note_vi: Câu mở bài.
      - en: Overall, … while …
        vi: Nhìn chung, … trong khi …
        note_vi: Câu overview so sánh hai xu hướng.
      - en: … rose steadily from X in 2010 to Y in 2020.
        vi: … tăng đều từ X năm 2010 lên Y năm 2020.
      - en: There was a sharp fall in …
        vi: Có một sự sụt giảm mạnh về …
      - en: … reached a peak of X in …
        vi: … đạt đỉnh X vào năm …
      - en: By contrast, the figure for … remained stable.
        vi: Ngược lại, số liệu của … giữ ổn định.
    demo:
      title_vi: "Làm mẫu: đề, số liệu và bài viết mẫu (số liệu giả định để luyện tập)"
      text_en: |-
        Question: The line graph shows the percentage of adults in a city who shopped online, by age group, from 2014 to 2024.

        Data (%)         2014   2016   2018   2020   2022   2024
        Aged 18–30         20     35     60     75     78     80
        Aged 31–50         10     18     30     55     60     62
        Aged 51 and over    5      6      8     25     35     40

        Introduction: The line graph illustrates the proportion of adults in one city who bought things online between 2014 and 2024, divided into three age groups.

        Overview: Overall, online shopping became more popular in all three groups over the period, and young adults were always the most likely to shop online.

        Body 1: In 2014, only 20% of people aged 18–30 shopped online, but this figure rose sharply to 75% in 2020 and then increased slightly to 80% in 2024. The 31–50 group followed a similar trend, growing from 10% to 62%.

        Body 2: By contrast, the figure for the oldest group remained almost stable at around 5–8% until 2018. After that, there was a significant increase, and by 2024 it had reached 40%, which was still only half the figure for young adults.
      notes:
        - label: Introduction
          text_vi: shows → illustrates; the percentage of → the proportion of; shopped online → bought things online; from 2014 to 2024 → between 2014 and 2024.
        - label: Overview
          text_vi: "Hai đặc điểm: (1) cả ba nhóm đều tăng; (2) nhóm trẻ luôn cao nhất. Không có con số nào."
        - label: Body 1
          text_vi: "Nhóm hai đường có xu hướng giống nhau (tăng mạnh đều đặn). Mỗi đường: điểm đầu → biến đổi → điểm cuối."
        - label: Body 2
          text_vi: "Đường khác biệt: đi ngang rồi tăng. So sánh với nhóm trẻ ('only half the figure for young adults')."
        - label: by 2024 it had reached
          text_vi: "Quá khứ hoàn thành (had reached) là cấu trúc nâng cao — ở band 5–6 có thể viết đơn giản: 'and it reached 40% in 2024'."
