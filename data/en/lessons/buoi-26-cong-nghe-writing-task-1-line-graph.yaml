  - type: dialogue
    title_vi: Đọc biểu đồ cùng đồng nghiệp
    lines:
      - speaker: A
        text: Have you seen the new report? It has a line graph about our app users.
        vi: Chị xem báo cáo mới chưa? Có một biểu đồ đường về người dùng ứng dụng của mình.
      - speaker: B
        text: Yes. The number of users rose sharply in the first six months.
        vi: Rồi. Số người dùng tăng mạnh trong sáu tháng đầu.
      - speaker: A
        text: Right. It reached a peak of two million in June.
        vi: Đúng. Đạt đỉnh hai triệu vào tháng Sáu.
      - speaker: B
        text: And then it fell slightly in July and August.
        vi: Rồi giảm nhẹ vào tháng Bảy và tháng Tám.
      - speaker: A
        text: Why did it fall? Was it the summer holiday?
        vi: Sao lại giảm nhỉ? Do nghỉ hè à?
      - speaker: B
        text: Maybe, but the graph doesn't say. It only shows the figures.
        vi: Có thể, nhưng biểu đồ không nói. Nó chỉ cho thấy số liệu thôi.
      - speaker: A
        text: What about the last three months?
        vi: Còn ba tháng cuối thì sao?
      - speaker: B
        text: The figure remained stable at around 1.8 million.
        vi: Con số giữ ổn định ở khoảng 1,8 triệu.
      - speaker: A
        text: So overall, there was a significant increase over the year.
        vi: Vậy nhìn chung, cả năm có mức tăng đáng kể.
      - speaker: B
        text: Exactly. That's the main trend.
        vi: Chính xác. Đó là xu hướng chính.
  - type: exercises
    items:
      - id: b26-x1
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng (trạng từ hay tính từ, động từ hay danh từ) của từ trong ngoặc.
        questions:
          - q: The number of e-book readers rose ___ in 2020.
            base: sharp
            answer: sharply
          - q: There was a ___ fall in the price of phones.
            base: gradually
            answer: gradual
          - q: Internet use has increased ___ since 2010.
            base: significant
            answer: significantly
          - q: The figure dropped ___ from 30% to 28%.
            base: slight
            answer: slightly
          - q: The price of oil showed some ___ during the period.
            base: fluctuate
            answer: fluctuation
            accept:
              - fluctuations
      - id: b26-x2
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu với cấu trúc There was a + tính từ + danh từ.
        questions:
          - q: Sales rose sharply in 2019. → There was ___
            answer: a sharp rise in sales in 2019.
            accept:
              - a sharp increase in sales in 2019.
          - q: The number of visitors fell gradually. → There was ___
            answer: a gradual fall in the number of visitors.
            accept:
              - a gradual decrease in the number of visitors.
          - q: Laptop prices increased slightly. → There was ___
            answer: a slight increase in laptop prices.
            accept:
              - a slight rise in laptop prices.
              - a slight increase in the price of laptops.
          - q: Newspaper sales decreased significantly. → There was ___
            answer: a significant decrease in newspaper sales.
            accept:
              - a significant fall in newspaper sales.
      - id: b26-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền giới từ đúng.
        bank:
          - from
          - to
          - by
          - at
          - of
          - over
        questions:
          - q: The number of users rose ___ 2 million in 2015 to 5 million in 2020.
            answer: from
          - q: The figure fell ___ 10%, from 40% to 30%.
            answer: by
            explain_vi: Mức chênh 10 điểm → by.
          - q: It reached a peak ___ 60% in 2019.
            answer: of
          - q: The price remained stable ___ $500 for three years.
            answer: at
          - q: Online banking grew steadily ___ the period.
            answer: over
          - q: Sales increased from 100 units ___ 250 units.
            answer: to
      - id: b26-x4
        bank_no: 16
        kind: completion
        instructions_vi: Đọc bảng số liệu (giả định) và hoàn thành câu miêu tả. Viết MỘT TỪ hoặc MỘT SỐ.
        max_words: 1
        passage: |-
          Hours per day spent on smartphones by students in one school
                     2016   2018   2020   2022   2024
          Boys        2.0    3.0    5.0    4.5    4.5
          Girls       2.5    3.5    4.0    4.0    4.0
        questions:
          - q: In 2016, girls spent ___ hours a day on their phones.
            answer: "2.5"
          - q: Boys' screen time reached a ___ of 5 hours in 2020.
            answer: peak
          - q: Girls' screen time remained ___ at 4 hours from 2020 to 2024.
            answer: stable
          - q: Between 2020 and 2022, boys' screen time fell ___ half an hour.
            answer: by
          - q: In 2016, boys spent ___ time on their phones than girls.
            answer: less
      - id: b26-x5
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn thân bài Task 1 có 5 lỗi. Sửa trực tiếp.
        text: In 2015, the number of e-book readers was 2 million. This number was increased sharp to 6 million in 2019. There was a gradually fall in 2020, and then the figure remained stable in 5 million. Paper book sales decreased 20% because people prefer e-books.
        errors:
          - wrong: was increased
            right: increased
            why: Nội động từ, không dùng bị động.
          - wrong: increased sharp to
            right: increased sharply to
            why: Bổ nghĩa động từ → trạng từ.
          - wrong: a gradually fall
            right: a gradual fall
            why: Bổ nghĩa danh từ → tính từ.
          - wrong: stable in 5 million
            right: stable at 5 million
            why: Giữ ở mức → at.
          - wrong: decreased 20% because people prefer e-books.
            right: decreased by 20%.
            why: Cần by; và Task 1 không giải thích nguyên nhân.
      - id: b26-x6
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: Which sentence is the best OVERVIEW?
            options:
              - In 2010, 20% of people used the internet.
              - Overall, internet use increased in all three countries, and Korea always had the highest figure.
              - The graph shows internet use in three countries.
              - I think the internet is very useful.
            answer: b
          - q: The graph shows data from 2025 to 2040. Which tense do you use?
            options:
              - past simple
              - present perfect
              - will / is expected to
              - present continuous
            answer: c
          - q: Which is the best paraphrase of 'The graph shows the number of cars sold'?
            options:
              - The graph shows the number of cars sold.
              - The graph illustrates how many cars were sold.
              - The graph is about cars.
              - Cars sold the graph.
            answer: b
          - q: What should you NOT do in Task 1?
            options:
              - compare the lines
              - give reasons for the changes
              - write an overview
              - use approximate numbers
            answer: b
      - id: b26-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Man: Have you seen the sales figures?
          Woman: Yes. Online sales rose sharply from January to March, from two to five billion dong.
          Man: And after that?
          Woman: They fell slightly in April, and then they remained stable until June.
          Man: So overall, there was a significant increase.
        questions:
          - { q: What happened from January to March?, options: [ Sales fell sharply., Sales rose sharply., Sales remained stable., Sales fluctuated. ], answer: b }
          - { q: What happened in April?, options: [ Sales fell slightly., Sales rose slightly., Sales reached a peak., Sales fell sharply. ], answer: a }
          - { q: What happened from April to June?, options: [ Sales increased., Sales remained stable., Sales decreased., Sales doubled. ], answer: b }
      - id: b26-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: The graph shows the number of visitors to a museum from 2019 to 2023. In 2019 there were fifty thousand visitors. The figure fell sharply to ten thousand in 2020, but then it rose gradually and reached a peak of seventy thousand in 2023.
        questions:
          - { q: "In 2019 there were 50,000 visitors.", answer: T }
          - { q: The number fell slightly in 2020., answer: F }
          - { q: After 2020 the number rose gradually., answer: T }
          - { q: The number reached a peak in 2022., answer: F }
  - type: homework
    kind: task1
    prompt_vi: Viết Task 1 (≥ 150 từ, 20 phút) theo bố cục Mở bài → Overview → Thân bài 1 → Thân bài 2. Số liệu giả định cho sẵn trong đề. Dùng ít nhất 3 cặp 'động từ + trạng từ' và 2 câu 'There was a + tính từ + danh từ'. Không giải thích nguyên nhân.
    prompt_en: |-
      The line graph shows the number of people (in millions) in Vietnam who used three types of devices to go online, from 2012 to 2024.
      Year:        2012  2015  2018  2021  2024
      Smartphone:    10    25    45    60    70
      Laptop:        12    15    18    20    20
      Desktop PC:    15    13    10     7     5
      Summarise the information by selecting and reporting the main features, and make comparisons where relevant.
    words:
      min: 150
      max: 190
    minutes: 20
