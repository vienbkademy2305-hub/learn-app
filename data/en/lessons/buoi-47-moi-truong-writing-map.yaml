  - type: skill
    skill: writing
    title_vi: Writing Task 1 — so sánh bản đồ (maps)
    intro_vi: "Đề cho hai hoặc ba bản đồ của một nơi (làng, trường, khu phố, hòn đảo) ở các thời điểm khác nhau, hoặc bản đồ hiện tại và bản kế hoạch tương lai. Không có số liệu: điểm Task Achievement đến từ việc nêu đủ các THAY ĐỔI chính kèm VỊ TRÍ, và một overview nói đúng 'bức tranh lớn' (VD: từ làng nông nghiệp thành khu đô thị)."
    steps:
      - title_vi: Xác định thời điểm và thì
        text_vi: Hai năm quá khứ → quá khứ đơn bị động. Quá khứ → hiện nay → hiện tại hoàn thành bị động. Kế hoạch tương lai → will be + V3 / is planned to be + V3.
      - title_vi: "Liệt kê thay đổi: mới, mất, đổi, giữ nguyên"
        text_vi: "Đặt hai bản đồ cạnh nhau, đánh dấu: cái gì được xây mới, bị phá, đổi công năng, mở rộng, giữ nguyên. Nhóm theo khu vực (bắc/nam) hoặc theo loại thay đổi."
      - title_vi: "Overview: 2 thay đổi lớn nhất"
        text_vi: "'Overall, the area became much more developed, with farmland giving way to housing, while the river and the church remained unchanged.' Không cần năm hay chi tiết."
      - title_vi: Thân bài theo khu vực
        text_vi: "Thân bài 1: nửa bắc (hoặc khu dân cư); thân bài 2: nửa nam (hoặc giao thông, tiện ích). Mỗi câu: thay đổi + vị trí."
      - title_vi: Đa dạng động từ
        text_vi: was built / constructed / was replaced by / made way for / was converted into / was extended / was relocated / remained unchanged.
    tips:
      - "Dùng la bàn: in the north-east, to the west of the school, along the coast. Không có la bàn thì dùng top/bottom/left/right of the map."
      - Một câu có thể gộp hai thay đổi bằng while/whereas (Buổi 34) hoặc which (Buổi 25).
      - Nhắc cả những gì KHÔNG đổi — đó cũng là đặc điểm chính.
    traps:
      - trap_vi: Mô tả từng bản đồ riêng lẻ (thân bài 1 = bản đồ 1990, thân bài 2 = bản đồ 2020).
        fix_vi: Luôn mô tả THAY ĐỔI giữa hai bản đồ, không mô tả tĩnh từng cái.
      - trap_vi: "Chủ động sai: 'The factory demolished'."
        fix_vi: "was demolished. Nhưng: made way for, remained là chủ động."
      - trap_vi: "Quên vị trí: 'A school was built.'"
        fix_vi: "'A school was built to the north of the park.'"
    phrases:
      - en: The maps illustrate the changes that took place in … between … and …
        vi: Các bản đồ minh họa những thay đổi đã diễn ra ở … từ … đến …
        note_vi: Mở bài.
      - en: Overall, the most noticeable change was …
        vi: Nhìn chung, thay đổi dễ thấy nhất là …
      - en: … was replaced by …
        vi: … được thay bằng …
      - en: … was converted into …
        vi: … được chuyển thành …
      - en: … made way for …
        vi: … nhường chỗ cho …
      - en: …, whereas … remained unchanged.
        vi: …, trong khi … vẫn giữ nguyên.
    demo:
      title_vi: "Làm mẫu: một ngôi làng ven biển 1995 và 2025 (bản đồ mô tả bằng lời để luyện tập)"
      text_en: |-
        1995: fishing village; small harbour in the south; farmland in the north; a narrow road from the east; woodland in the west; a church in the centre.
        2025: harbour converted into a marina with a café; farmland replaced by houses; road widened and extended to the beach; woodland partly cut down for a car park; church unchanged; a footpath added along the coast.

        Introduction: The maps illustrate the changes that took place in a coastal village between 1995 and 2025.

        Overview: Overall, the village was transformed from a fishing community into a residential and tourist area, although the church in the centre remained unchanged.

        Body 1: In the north, the farmland was replaced by a large housing estate. The narrow road from the east was widened and extended all the way to the beach, and a footpath was added along the coast.

        Body 2: In the south, the small fishing harbour was converted into a marina with a café. Meanwhile, part of the woodland in the west made way for a car park, which made the beach more accessible to visitors.
      notes:
        - label: Thì
          text_vi: Hai mốc đều ở quá khứ (1995, 2025 được xem như hai thời điểm đã xảy ra) → quá khứ đơn bị động.
        - label: Overview
          text_vi: "Bức tranh lớn: từ làng chài → khu dân cư + du lịch; và điều không đổi (nhà thờ)."
        - label: Chia theo khu vực
          text_vi: Thân bài 1 = phía bắc + đường; thân bài 2 = phía nam + phía tây.
        - label: made way for / which
          text_vi: Chủ động make way for; which nối thêm hệ quả.
