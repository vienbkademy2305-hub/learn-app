  - type: pronunciation
    notes:
      - sound: snd-ou
        text_vi: "/əʊ/ trong going, won't, goal, hope, go: bắt đầu từ /ə/ rồi tròn môi về /ʊ/. Anh-Mỹ đọc /oʊ/."
      - sound: snd-ai
        text_vi: "/aɪ/ trong I'll, time, tonight, decide, find: mở miệng rộng /a/ rồi trượt lên /ɪ/."
      - text_vi: "I'll /aɪl/, you'll /juːl/, she'll /ʃiːl/: dạng rút gọn luôn dùng trong văn nói — nhớ âm /l/ cuối."
      - text_vi: "won't /wəʊnt/ ≠ want /wɒnt/: 'I won't go' (tôi sẽ không đi) và 'I want to go' (tôi muốn đi) — nghe nhầm là đổi hẳn nghĩa."
      - text_vi: going to trong văn nói nhanh thường thành gonna /ˈɡə.nə/ — nghe hiểu được, nhưng khi viết IELTS phải viết going to.
