# Buổi 15 — Kế hoạch & dự định. Tự soạn theo lo-trinh-ielts-6.5.md. BẢN NHÁP chờ duyệt.
slug: buoi-15-ke-hoach-du-dinh
number: 15
stage: 1
title_vi: Kế hoạch & dự định
focus:
  grammar: Tương lai đơn (will) vs be going to
  skill: null
target_band: 4.0-5.0
source: editorial
status: draft
steps:
  - type: vocabulary
    items:
      - plan|v
      - future|n
      - decide|v
      - promise|v
      - hope|v
      - goal|n
      - save|v
      - move|v
