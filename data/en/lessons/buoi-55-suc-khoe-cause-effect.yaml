      - id: b55-x5
        bank_no: 27
        kind: completion
        instructions_vi: Hoàn thành đoạn thân bài hệ quả. Viết MỘT TỪ cho mỗi chỗ trống.
        max_words: 1
        passage: "This trend has serious (1) ___ for both individuals and society. For individuals, stress may give (2) ___ to sleep deprivation, which in turn has a detrimental effect (3) ___ concentration at work. For society, the effects are mainly economic: stressed employees take more sick days, (4) ___ reduces productivity and places a heavy burden (5) ___ the healthcare system."
