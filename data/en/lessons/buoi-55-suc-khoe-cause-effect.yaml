  - type: dialogue
    title_vi: Lập dàn ý Cause/Effect
    lines:
      - speaker: A
        text: The question is about why more young adults suffer from stress, and what the effects are.
        vi: Đề hỏi vì sao ngày càng nhiều người trẻ bị căng thẳng, và hậu quả là gì.
      - speaker: B
        text: OK, causes first. Long working hours are an obvious factor.
        vi: Được, nguyên nhân trước. Làm việc nhiều giờ là một yếu tố rõ ràng.
      - speaker: A
        text: And social media. Comparing yourself to others can trigger anxiety.
        vi: Và mạng xã hội. So sánh bản thân với người khác có thể gây lo âu.
      - speaker: B
        text: Good. Now effects. For individuals, stress can give rise to sleep deprivation and health problems.
        vi: Tốt. Giờ đến hậu quả. Với cá nhân, căng thẳng có thể dẫn đến thiếu ngủ và các vấn đề sức khỏe.
      - speaker: A
        text: And for society, it places a burden on the healthcare system and reduces productivity.
        vi: Còn với xã hội, nó tạo gánh nặng cho y tế và làm giảm năng suất.
      - speaker: B
        text: Should we add solutions?
        vi: Mình có nên thêm giải pháp không?
      - speaker: A
        text: No. The question only asks for causes and effects, so solutions would be off-topic.
        vi: Không. Đề chỉ hỏi nguyên nhân và hậu quả, nên giải pháp sẽ lạc đề.
      - speaker: B
        text: Right. Two causes, two effects, and a clear chain between them.
        vi: Đúng. Hai nguyên nhân, hai hậu quả, và một chuỗi liên kết rõ ràng giữa chúng.
  - type: exercises
    items:
      - id: b55-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: A sedentary lifestyle ___ obesity.
            options:
              - stems from
              - contributes to
              - is contributed by
              - results from
            answer: b
          - q: Much stress at work ___ long working hours.
            options:
              - gives rise to
              - stems from
              - contributes
              - triggers to
            answer: b
          - q: Sleep deprivation has a detrimental effect ___ memory.
            options:
              - to
              - for
              - on
              - in
            answer: c
          - q: ___ a lack of exercise, many office workers have back pain.
            options:
              - Owing to
              - Because
              - Since
              - So
            answer: a
          - q: "The question asks: 'What are the causes? What are the effects?' Which paragraph is NOT needed?"
            options:
              - a paragraph on causes
              - a paragraph on effects
              - a paragraph on solutions
              - an introduction
            answer: c
      - id: b55-x2
        bank_no: 8
        kind: transformation
        instructions_vi: Viết lại câu với từ trong ngoặc, giữ nguyên nghĩa (chú ý chiều nhân quả).
        questions:
          - q: Fast food is one cause of obesity. (contributes to) → Fast food ___
            answer: contributes to obesity.
          - q: Stress is caused by long working hours. (stems from) → Stress ___
            answer: stems from long working hours.
          - q: Social media can lead to anxiety. (give rise to) → Social media can ___
            answer: give rise to anxiety.
          - q: Smoking harms the lungs. (detrimental effect) → Smoking has ___
            answer: a detrimental effect on the lungs.
      - id: b55-x3
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn có 5 lỗi. Sửa trực tiếp.
        text: Obesity is contributed by several factors. Much of it stems processed food. Owing to children spend hours online, they exercise less. This has a detrimental effect to their health. Moreover, it places a heavy burden to the healthcare system.
        errors:
          - wrong: Obesity is contributed by several factors
            right: Several factors contribute to obesity
            why: contribute to là chủ động; nguyên nhân làm chủ ngữ.
          - wrong: stems processed food
            right: stems from processed food
            why: stem FROM.
          - wrong: Owing to children spend hours online
            right: Because children spend hours online
            why: owing to + danh từ; trước mệnh đề dùng because.
          - wrong: detrimental effect to their health
            right: detrimental effect on their health
            why: effect ON.
          - wrong: heavy burden to the healthcare system
            right: heavy burden on the healthcare system
            why: a burden ON.
      - id: b55-x4
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ phù hợp.
        bank:
          - sedentary
          - sugary
          - consumption
          - vulnerable
          - burden
          - factor
        questions:
          - q: Office work is a very ___ job; you sit all day.
            answer: sedentary
          - q: Children should drink fewer ___ drinks.
            answer: sugary
          - q: The ___ of alcohol has risen among young people.
            answer: consumption
          - q: Children and the elderly are the most ___ to air pollution.
            answer: vulnerable
          - q: An ageing population places a heavy ___ on young workers.
