      - id: b55-x7
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe đoạn phỏng vấn bác sĩ (hai giọng) và chọn đáp án đúng.
        audio_text: |-
          Interviewer: Doctor, why are so many young adults having sleep problems?
          Doctor: There are several factors. The biggest, I think, is screen use late at night. The light from phones can delay sleep by up to an hour.
          Interviewer: Is work also a factor?
          Doctor: Definitely. Long working hours give rise to stress, and stress is a common trigger for insomnia.
          Interviewer: What are the effects?
          Doctor: In the short term, poor concentration and more accidents. In the long term, sleep deprivation contributes to obesity and heart disease.
        questions:
          - q: According to the doctor, what is the biggest factor?
            options:
              - coffee
              - screen use late at night
              - noise
              - diet
            answer: b
          - q: How much can phone light delay sleep?
            options:
              - up to 10 minutes
              - up to half an hour
              - up to an hour
              - up to two hours
            answer: c
          - q: What does stress trigger?
            options:
              - obesity
              - insomnia
              - accidents
              - headaches
            answer: b
          - q: Which is a LONG-term effect mentioned?
            options:
              - poor concentration
              - more accidents
              - heart disease
              - late meetings
            answer: c
      - id: b55-x8
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chiều nhân quả.
        audio_text: A new study suggests that the rise in childhood obesity stems mainly from diet rather than a lack of exercise. Children in the study who drank sugary drinks every day were twice as likely to be overweight. Exercise still mattered, but it contributed less than diet. The researchers warn that obesity at a young age is likely to give rise to diabetes later in life.
        questions:
          - q: The study says diet is a bigger factor than exercise.
            answer: T
          - q: Children who drank sugary drinks daily were three times as likely to be overweight.
            answer: F
          - q: The study found exercise did not matter at all.
            answer: F
          - q: The researchers warn that childhood obesity may lead to diabetes.
            answer: T
