  - type: skill
    skill: writing
    title_vi: Writing Task 2 — Causes and Effects
    intro_vi: "Đề nêu một xu hướng/vấn đề và hỏi: 'What are the causes of this? What effects does it have (on individuals and society)?'. Khác Problem/Solution (Buổi 44): không hỏi giải pháp — viết giải pháp là lạc đề một phần. Bố cục: Mở bài → Thân bài 1 (2 nguyên nhân) → Thân bài 2 (2 hệ quả) → Kết bài. Ở band 6.5, điểm khác biệt là CHUỖI NHÂN QUẢ rõ ràng: nguyên nhân → cơ chế → hệ quả, và hệ quả ở hai cấp độ (cá nhân và xã hội)."
    steps:
      - title_vi: "Đọc kỹ: causes / effects / problems / solutions"
        text_vi: Gạch các từ này trong đề. Hỏi effects thì không cần giải pháp; nếu có câu 'What can be done?' thì mới thêm giải pháp.
      - title_vi: Brainstorm theo chuỗi
        text_vi: "Nguyên nhân 1 → cơ chế → hệ quả. VD: cheap processed food → high sugar intake → obesity → burden on healthcare."
      - title_vi: "Thân bài 1: nguyên nhân"
        text_vi: "'There are several factors behind this trend.' Mỗi nguyên nhân: nêu + giải thích cơ chế + ví dụ. Dùng contribute to / stem from."
      - title_vi: "Thân bài 2: hệ quả — cá nhân và xã hội"
        text_vi: "'This trend has serious consequences for both individuals and society.' Hệ quả 1 (cá nhân: sức khỏe, thu nhập), hệ quả 2 (xã hội: gánh nặng y tế, năng suất)."
      - title_vi: Kết bài
        text_vi: "'In conclusion, … stems mainly from … and …, and it has a detrimental effect on …' — không thêm giải pháp nếu đề không hỏi."
    tips:
      - "Chuỗi nhân quả là thứ giám khảo chấm ở Coherence: mỗi câu phải NỐI được với câu trước."
      - Hệ quả ở hai cấp độ (individual / society) giúp bài sâu hơn mà không cần thêm ý.
      - "Dùng mức độ: 'is likely to', 'may' cho hệ quả dự đoán."
    traps:
      - trap_vi: Viết giải pháp trong khi đề chỉ hỏi causes và effects.
        fix_vi: Chỉ trả lời đúng hai câu hỏi của đề.
      - trap_vi: Lặp 'cause' / 'because' trong mọi câu.
        fix_vi: "Xoay vòng: contribute to, stem from, give rise to, owing to, lead to, result in."
      - trap_vi: "Nhầm chiều: 'Obesity contributes to fast food'."
        fix_vi: Nguyên nhân đứng trước contribute to / give rise to.
    phrases:
      - en: There are several factors behind this trend.
        vi: Có một số yếu tố đằng sau xu hướng này.
        note_vi: Câu chủ đề thân bài 1.
      - en: This problem stems largely from …
        vi: Vấn đề này phần lớn bắt nguồn từ …
      - en: … is another key factor contributing to …
        vi: … là một yếu tố then chốt khác góp phần gây ra …
      - en: This trend has serious consequences for both individuals and society.
        vi: Xu hướng này có hậu quả nghiêm trọng cho cả cá nhân lẫn xã hội.
        note_vi: Câu chủ đề thân bài 2.
      - en: … places a heavy burden on …
        vi: … tạo gánh nặng lớn cho …
    demo:
      title_vi: "Làm mẫu: hai đoạn thân bài"
      text_en: |-
        Question: In many countries, the number of children who are overweight is increasing. What are the causes of this? What effects does it have?

        Body 1: There are several factors behind this trend. The most important is diet. Processed food and sugary drinks have become cheap and widely available, and they are heavily advertised to children; consequently, many young people consume far more sugar than they need. Another key factor contributing to obesity is a sedentary lifestyle. Owing to the popularity of smartphones and computer games, children now spend much less time playing outside than previous generations did.

        Body 2: This trend has serious consequences for both individuals and society. For children themselves, obesity may give rise to health problems such as diabetes at a young age, and it can also have a detrimental effect on their confidence. For society, the effects are mainly economic: overweight children are likely to become overweight adults, which places a heavy burden on the healthcare system for decades.
      notes:
        - label: Chuỗi nhân quả
          text_vi: cheap + advertised → consume more sugar (consequently) — nguyên nhân có cơ chế, không chỉ liệt kê.
        - label: Đa dạng cấu trúc
          text_vi: contributing to, Owing to, give rise to, have a detrimental effect on, places a burden on.
        - label: Hai cấp độ hệ quả
          text_vi: Cá nhân (sức khỏe, tự tin) và xã hội (gánh nặng y tế).
        - label: Không có giải pháp
          text_vi: Đề chỉ hỏi causes và effects.
