  - type: pronunciation
    notes:
      - sound: snd-m
        text_vi: "/m/ cuối từ phải khép môi hẳn: museum, gym, some time. Không dừng ở nguyên âm."
      - sound: snd-n
        text_vi: "/n/ cuối từ: join, garden, concert (-n- giữa từ). Người miền Bắc chú ý không đọc n thành l."
      - sound: snd-j
        text_vi: "/dʒ/ trong enjoy, join, jogging: bắt đầu như /d/ rồi nhả ra, rung dây thanh. Không đọc thành 'gi' tiếng Việt."
      - word: photography|n
        text_vi: "Trọng âm âm 2: pho-TO-gra-phy (khác PHO-to)."
      - { word: film|n, text_vi: "film /fɪlm/: một âm tiết, cụm /lm/ cuối — không thêm nguyên âm thành 'phi-lim'." }
      - { word: singer|n, text_vi: "singer /ˈsɪŋ.ə/: /ŋ/ không bật /ɡ/ (khác finger /ˈfɪŋ.ɡə/)." }
      - { word: win|v, text_vi: won (quá khứ của win) đọc /wʌn/ giống hệt one — không đọc 'uôn'. }
