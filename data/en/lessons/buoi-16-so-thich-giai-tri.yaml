  - type: dialogue
    title_vi: Nói chuyện về sở thích
    lines:
      - speaker: A
        text: What do you like doing in your free time?
        vi: Lúc rảnh bạn thích làm gì?
      - speaker: B
        text: I love taking photos. I joined a photography club last month.
        vi: Mình rất thích chụp ảnh. Tháng trước mình đã vào một câu lạc bộ nhiếp ảnh.
      - speaker: A
        text: That sounds fun! Do you go out a lot?
        vi: Nghe vui đấy! Bạn có hay ra ngoài không?
      - speaker: B
        text: Yes, I enjoy walking around the Old Quarter with my camera. What about you?
        vi: Có, mình thích đi dạo quanh Phố Cổ với máy ảnh. Còn bạn?
      - speaker: A
        text: I'm learning to play the guitar. I practise every evening.
        vi: Mình đang học chơi guitar. Tối nào mình cũng tập.
      - speaker: B
        text: Wow! Do you want to play at our club party next week?
        vi: Hay quá! Tuần sau bạn có muốn chơi đàn ở bữa tiệc của câu lạc bộ mình không?
      - speaker: A
        text: I'm not very good yet, but I don't mind trying.
        vi: Mình chưa giỏi lắm, nhưng mình không ngại thử.
      - speaker: B
        text: Great! I hope to see you there.
        vi: Tuyệt! Mong gặp bạn ở đó.
  - type: exercises
    items:
      - id: b16-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ thích hợp vào chỗ trống.
        bank:
          - hobby
          - collect
          - relax
          - concert
          - museum
          - club
        questions:
          - q: My favourite ___ is reading.
            answer: hobby
          - q: I ___ old coins from different countries.
            answer: collect
          - q: After work, I listen to music to ___.
            answer: relax
          - q: We saw a famous singer at the ___ last night.
            answer: concert
          - q: There are a lot of old things in the history ___.
            answer: museum
          - q: My son is in the school football ___.
            answer: club
      - id: b16-x2
        bank_no: 6
        kind: verb-form
        instructions_vi: Viết động từ trong ngoặc ở dạng V-ing hoặc to V.
        questions:
          - q: I enjoy (cook) ___ for my family.
            answer: cooking
          - q: She wants (learn) ___ Japanese.
            answer: to learn
          - q: Do you mind (wait) ___ for five minutes?
            answer: waiting
          - q: We decided (go) ___ camping in Ba Vi.
            answer: to go
          - q: He finished (paint) ___ the picture yesterday.
            answer: painting
          - q: I hope (see) ___ you soon.
            answer: to see
          - q: Please stop (talk) ___. The film is starting.
            answer: talking
          - q: They are planning (visit) ___ the museum.
            answer: to visit
      - id: b16-x3
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - q: Let's go ___ this weekend!
            options:
              - to swim
              - swimming
              - swim
              - to swimming
            answer: b
          - q: Would you like ___ chess with me?
            options:
              - playing
              - play
              - to play
              - plays
            answer: c
          - q: I'm interested in ___ photos.
            options:
              - take
              - to take
              - taking
              - took
            answer: c
            explain_vi: Sau giới từ in → V-ing.
          - q: My brother practises ___ the piano every day.
            options:
              - to play
              - playing
              - play
              - played
            answer: b
          - q: She loves ___ with her friends.
            options:
              - hanging out
              - hang out
              - hangs out
              - hung out
            answer: a
            explain_vi: love + V-ing (hoặc to V; ở đây chỉ có V-ing là đúng).
      - id: b16-x4
        bank_no: 7
        kind: error-correction
        instructions_vi: Đoạn văn dưới đây có 5 lỗi. Tìm và sửa.
        text: In my free time I enjoy to play board games with my friends. Last year I decided joining a chess club. I practise to play every evening. Next month I want entering a competition. My friends sometimes go to camping, but I don't like sleeping outside.
        errors:
          - wrong: enjoy to play
            right: enjoy playing
            why: enjoy + V-ing.
          - wrong: decided joining
            right: decided to join
            why: decide + to V.
          - wrong: practise to play
            right: practise playing
            why: practise + V-ing.
          - wrong: want entering
            right: want to enter
            why: want + to V.
          - wrong: go to camping
            right: go camping
            why: go + V-ing, không có to.
      - id: b16-x5
        bank_no: 13
        kind: tfng
        instructions_vi: Đọc đoạn văn rồi chọn T (đúng), F (sai) hoặc NG (không được nhắc đến).
        passage: Hoa and her brother Tuan have very different hobbies. Hoa loves being outside. Every Sunday she goes cycling with her club, and in the summer she often goes camping. Tuan prefers staying at home. He enjoys playing chess online and he is learning to play the piano. Last year Tuan decided to join a music club, but he stopped going after two months because it was too far from his house. Their mother wants them to spend more time together, so they now play board games every Friday evening.
        questions:
          - q: Hoa goes cycling every weekend.
            answer: T
            explain_vi: Every Sunday → mỗi cuối tuần.
          - q: Tuan still goes to the music club.
            answer: F
            explain_vi: Tuan đã thôi đi sau hai tháng.
          - q: The music club was near Tuan's house.
            answer: F
          - q: Tuan plays the piano better than Hoa.
            answer: NG
            explain_vi: Bài không nói Hoa có chơi piano hay không.
          - q: Hoa likes camping.
            answer: T
          - q: Their father wants them to spend more time together.
            answer: F
            explain_vi: Là MẸ, không phải bố. Đọc kỹ chủ thể.
      - id: b16-x6
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ thích hợp (phim & nhạc).
        bank:
          - cinema
          - actor
          - plot
          - special effects
          - singer
          - fan
          - catchy
        questions:
          - q: Let's go to the ___ tonight. There's a new film.
            answer: cinema
          - q: "The ___ of this film is simple: a boy looks for his dog."
            answer: plot
          - q: Tom Holland is my favourite ___.
            answer: actor
          - q: The ___ in this film look very real — the city is on fire!
            answer: special effects
          - q: I'm a big ___ of Den Vau. I have all his songs.
            answer: fan
          - q: Everybody is singing this song. It's really ___.
            answer: catchy
          - q: She has a beautiful voice. She wants to be a ___.
            answer: singer
      - id: b16-x7
        bank_no: 3
        kind: gap-fill
        instructions_vi: Điền play, go hoặc do (play + môn có bóng; go + môn đuôi -ing; do + võ, yoga, thể dục).
        bank:
          - play
          - go
          - do
        questions:
          - q: I ___ football every Saturday.
            answer: play
          - q: Let's ___ swimming this afternoon.
            answer: go
          - q: My mother and I ___ yoga in the morning.
            answer: do
          - q: They ___ basketball after school.
            answer: play
          - q: We often ___ cycling at the weekend.
            answer: go
          - q: My brother wants to ___ karate.
            answer: do
      - id: b16-x8
        bank_no: 20
        kind: mcq
        instructions_vi: Nghe hội thoại (mỗi người một giọng) rồi chọn đáp án đúng. Cố gắng làm sau lần nghe đầu, chưa được thì nghe lại.
        audio_text: |-
          Man: What do you like doing at the weekend?
          Woman: I enjoy painting, and I'm learning to play the guitar.
          Man: Cool! I love watching football. Do you want to come to a match on Sunday?
          Woman: I'd love to, but I promised to visit my grandmother.
          Man: No problem. Maybe next time.
        questions:
          - { q: What does the woman enjoy?, options: [ playing football, painting, cooking, swimming ], answer: b }
          - { q: What is she learning?, options: [ to play the piano, to play the guitar, to paint, to cook ], answer: b }
          - { q: Why can't she go to the match?, options: [ She hates football., She is ill., She is visiting her grandmother., She has to work. ], answer: c }
      - id: b16-x9
        bank_no: 20
        kind: tf
        instructions_vi: Nghe rồi chọn T (đúng) hoặc F (sai). Chú ý chủ thể, con số và các từ như always / never / only.
        audio_text: I joined a photography club last year. We meet every Saturday and practise taking photos in different parts of the city. I don't mind getting up early, because the light is beautiful in the morning. Next month our club is showing our photos at a café.
        questions:
          - { q: The speaker joined the club two years ago., answer: F }
          - { q: The club meets every Saturday., answer: T }
          - { q: The speaker hates getting up early., answer: F }
          - { q: Next month the club is showing photos at a café., answer: T }
  - type: homework
    kind: paragraph
    prompt_vi: "Viết đoạn văn 70–100 từ về sở thích của bạn: bạn thích làm gì, bắt đầu khi nào, và dự định gì cho sở thích đó. Dùng ít nhất 3 động từ + V-ing và 3 động từ + to V."
    prompt_en: Describe your favourite hobby and your plans for it.
    words:
      min: 70
      max: 100
    minutes: 20
