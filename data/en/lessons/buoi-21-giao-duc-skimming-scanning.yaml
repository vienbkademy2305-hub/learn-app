  - type: skill
    skill: reading
    title_vi: Skimming & Scanning — đọc lướt lấy ý chính, dò tìm thông tin
    intro_vi: Bài Reading IELTS có 3 bài đọc (khoảng 2.700 từ) và 40 câu hỏi trong 60 phút — không đủ thời gian đọc kỹ từng chữ. Hai kỹ thuật nền tảng là Skimming (đọc lướt để biết mỗi đoạn nói gì) và Scanning (dò nhanh để tìm một thông tin cụ thể). Mọi dạng câu hỏi ở các buổi sau (True/False/Not Given, matching, điền từ) đều dựa trên hai kỹ thuật này.
    steps:
      - title_vi: Skim tiêu đề và câu đầu mỗi đoạn
        text_vi: Đọc tiêu đề, phụ đề (nếu có), rồi câu đầu của từng đoạn — thường là câu chủ đề. Nếu câu đầu chỉ là câu dẫn, đọc thêm câu thứ hai hoặc câu cuối đoạn. Cả bài chỉ nên mất khoảng 2 phút.
      - title_vi: Ghi ý chính bên lề
        text_vi: "Mỗi đoạn ghi 2–4 từ (tiếng Anh hay tiếng Việt đều được), VD: A – học phí tăng; B – lý do. Đây là 'bản đồ' để quay lại khi làm câu hỏi."
      - title_vi: Để ý từ nối
        text_vi: However / but báo hiệu ý ngược lại — ý quan trọng thường nằm SAU từ này. For example / such as báo hiệu ví dụ — có thể bỏ qua khi skim.
      - title_vi: "Scan: chọn từ khóa dễ tìm trong câu hỏi"
        text_vi: Ưu tiên tên riêng, con số, năm, từ viết hoa, thuật ngữ — những từ này thường giữ nguyên trong bài, không bị đổi sang từ đồng nghĩa.
      - title_vi: "Scan: dò theo 'hình dạng' của từ khóa"
        text_vi: "Không đọc từng câu. Lướt mắt tìm đúng hình dạng từ khóa: số 1998, chữ viết hoa, dấu %, $. Tìm thấy rồi mới đọc kỹ câu đó cùng một câu trước và một câu sau."
      - title_vi: Đối chiếu lại với câu hỏi
        text_vi: Đáp án đúng loại thông tin chưa (số hay tên người)? Đúng số từ cho phép chưa? Chép đúng chính tả và số ít/số nhiều như trong bài chưa?
    tips:
      - Skimming không phải đọc nhanh cả bài. Mục tiêu chỉ là trả lời được 'Đoạn này nói về cái gì?' trong khoảng 20 giây.
      - "Tín hiệu khi scan: năm (2019), số + đơn vị (%, km, $), tên người và địa danh viết hoa, dấu ngoặc kép (lời trích dẫn), từ liệt kê firstly/secondly/finally."
      - "Câu hỏi IELTS thường theo thứ tự bài đọc (trừ dạng matching): đáp án câu 3 thường nằm sau đáp án câu 2."
      - "Gặp từ mới: đừng dừng lại tra. Đoán nghĩa từ ngữ cảnh, hoặc bỏ qua nếu nó không liên quan tới câu hỏi."
    traps:
      - trap_vi: Dịch cả câu hỏi sang tiếng Việt rồi đọc bài từ đầu đến cuối.
        fix_vi: Chỉ gạch 2–3 từ khóa rồi scan. Chỉ đọc kỹ đoạn chứa từ khóa.
      - trap_vi: Thấy từ khóa là chọn đáp án ngay.
        fix_vi: "Đọc hết câu chứa từ khóa: not, only, never, however có thể làm đổi hẳn nghĩa."
      - trap_vi: Chỉ tìm đúng từ y hệt trong câu hỏi.
        fix_vi: Động từ, tính từ hay được thay bằng từ đồng nghĩa (expensive ↔ costly, rise ↔ increase). Chỉ tên riêng và con số là giữ nguyên.
      - trap_vi: Chép đáp án sai chính tả hoặc thiếu -s.
        fix_vi: Chép đúng như trong bài và kiểm tra số ít/số nhiều — sai chính tả là mất điểm.
    phrases:
      - en: However, …
        vi: Tuy nhiên — sắp có ý ngược lại
        note_vi: Ý sau However thường là ý chính của đoạn.
      - en: For example, … / such as …
        vi: Ví dụ — sắp có ví dụ
        note_vi: Khi skim có thể bỏ qua phần ví dụ.
      - en: In addition, …
        vi: Thêm vào đó — bổ sung ý cùng chiều
      - en: As a result, …
        vi: Kết quả là — nêu hệ quả
      - en: Overall, … / In conclusion, …
        vi: Nhìn chung / Tóm lại
        note_vi: Câu này thường chứa ý chính của cả bài.
    demo:
      title_vi: "Làm mẫu: skim và scan một bài đọc ngắn"
      text_en: |-
        A  Online learning has grown quickly in Vietnam over the last ten years. Before 2015, most students only studied in classrooms. Today, millions of learners use apps and websites to learn English, maths and even cooking.
        B  There are several reasons for this change. Internet access has become cheaper, and most young people now have a smartphone. In addition, online courses often cost less than classes at a language centre. For example, a three-month English course online may cost about 500,000 dong, while a similar class at a centre costs over 3 million.
        C  However, online learning is not perfect. Many learners find it hard to study alone at home, and some never finish their courses. A 2023 survey of 2,000 students in Ho Chi Minh City found that only 35% of them finished the online courses they started.
      notes:
        - label: Skim — đoạn A
          text_vi: "Câu đầu: 'Online learning has grown quickly…' → ý chính: học online tăng nhanh. Ghi lề: A – học online tăng."
        - label: Skim — đoạn B
          text_vi: "Câu đầu 'several reasons for this change' → đoạn này nêu LÝ DO. Phần 'For example…' là ví dụ, bỏ qua khi skim. Ghi lề: B – lý do (rẻ, có điện thoại)."
        - label: Skim — đoạn C
          text_vi: "Mở đầu bằng However → ý ngược lại: nhược điểm của học online. Ghi lề: C – nhược điểm."
        - label: Scan — How many students took part in the survey?
          text_vi: "Từ khóa: survey + số lượng. Lướt tìm con số đứng cạnh 'survey' → đoạn C: 2,000. Không cần đọc lại đoạn A, B."
        - label: Scan — What percentage of them finished their courses?
          text_vi: "Tìm dấu % → 35%. Đọc kỹ cả câu: 'only 35% of them finished' — đúng thông tin cần tìm."
