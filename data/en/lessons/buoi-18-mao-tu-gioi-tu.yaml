  - type: pronunciation
    notes:
      - sound: snd-schwa
        text_vi: "Dạng yếu trong câu: a /ə/, an /ən/, the /ðə/, to /tə/, for /fə/, at /ət/. Đọc nhẹ và nhanh: I'm waiting for the bus → /fə ðə/."
      - sound: snd-dh
        text_vi: the đọc /ðə/ trước phụ âm (the bus) và /ði/ trước nguyên âm (the airport).
      - word: listen-to|phr-v
        text_vi: "Chữ t câm: LIS-ən."
      - word: talk-to|phr-v
        text_vi: "Chữ l câm: /tɔːk/, giống walk."
