# Điểm ngữ pháp Giai đoạn 2 (Buổi 21–45). Tự soạn (editorial), BẢN NHÁP chờ duyệt.
points:
  - id: en-g2-01
    lesson: buoi-21-giao-duc-skimming-scanning
    title: Thì hiện tại hoàn thành (Present perfect)
    cefr: B1
    structures:
      - S + have/has + V3            I have studied English for two years.
      - S + haven't/hasn't + V3      She hasn't finished yet.
      - Have/Has + S + (ever) + V3…?  Have you ever won a scholarship?
      - for + khoảng thời gian · since + mốc thời gian
    explain: "Hiện tại hoàn thành nối quá khứ với hiện tại. Dùng khi: (1) việc bắt đầu trong quá khứ và vẫn còn đến bây giờ (I have lived here for five years); (2) trải nghiệm tính đến nay, không nói lúc nào (Have you ever been to Hue?); (3) việc vừa xong mà kết quả còn thấy ở hiện tại (She has just finished her essay). Có mốc quá khứ rõ ràng (yesterday, last year, in 2020) thì dùng quá khứ đơn."
    table:
      - - Nguyên mẫu
        - Quá khứ đơn
        - V3 (quá khứ phân từ)
      - - study
        - studied
        - studied
      - - be
        - was / were
        - been
      - - go
        - went
        - gone / been
      - - do
        - did
        - done
      - - take
        - took
        - taken
      - - write
        - wrote
        - written
      - - see
        - saw
        - seen
      - - get
        - got
        - got (Anh-Mỹ gotten)
      - - teach
        - taught
        - taught
      - - make
        - made
        - made
    notes:
      - "I/you/we/they + have; he/she/it + has. Nói nhanh: I've, she's (= she has), haven't, hasn't."
      - for + khoảng thời gian (for three years, for a long time); since + mốc (since 2022, since I was ten).
      - already, just, never, ever đứng giữa have và V3; yet đứng cuối câu phủ định/câu hỏi.
      - "been ≠ gone: She has been to Da Lat (đã đi và đã về). She has gone to Da Lat (đang ở đó, chưa về)."
      - "Trong bài đọc IELTS, câu nêu thay đổi thường dùng thì này: The number of online courses has increased."
    mistakes:
      - wrong: I have visited Hue last year.
        right: I visited Hue last year.
        why: Có mốc quá khứ xác định (last year) → quá khứ đơn.
      - wrong: I have studied here since three years.
        right: I have studied here for three years.
        why: three years là khoảng thời gian → for; since đi với mốc (since 2022).
      - wrong: I am living in Hanoi for five years.
        right: I have lived in Hanoi for five years.
        why: Việc kéo dài từ quá khứ đến nay (tiếng Việt 'đã… được 5 năm') → hiện tại hoàn thành, không dùng hiện tại tiếp diễn.
      - wrong: She have finished her homework.
        right: She has finished her homework.
        why: Ngôi 3 số ít dùng has.
    examples:
      - b21-001
      - b21-002
      - b21-003
      - b21-004
      - b21-017
      - b21-018
    provenance:
      - source: egiu
        field: scope
        ref: Units 15–20 (present perfect, for/since/ago, so với quá khứ đơn) — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-02
    lesson: buoi-22-giao-duc-writing-opinion
    title: Câu đơn, câu ghép, câu phức (and, but, or, so · because, when, if)
    cefr: B1
    structures:
      - "Câu đơn:   S + V (+ O).                  Students wear uniforms."
      - "Câu ghép:  Mệnh đề 1, and/but/or/so + mệnh đề 2."
      - "Câu phức:  Mệnh đề chính + because/when/if + mệnh đề phụ."
      - "           Because/When/If + mệnh đề phụ, mệnh đề chính."
    explain: Câu đơn có một mệnh đề (một cặp chủ ngữ – động từ). Câu ghép nối hai mệnh đề ngang hàng bằng and (thêm ý), but (đối lập), or (lựa chọn), so (kết quả); trước liên từ thường có dấu phẩy. Câu phức có một mệnh đề chính và một mệnh đề phụ mở đầu bằng because (lý do), when (thời điểm) hoặc if (điều kiện). Muốn đạt band 6 phần Ngữ pháp, bài viết phải trộn cả ba loại câu và không mắc lỗi nối câu.
    table:
      - - Liên từ
        - Ý nghĩa
        - Ví dụ
      - - and
        - thêm ý cùng chiều
        - Uniforms are cheap, and they look tidy.
      - - but
        - ý đối lập
        - Homework is useful, but too much is harmful.
      - - or
        - lựa chọn
        - Students can study online, or they can go to a centre.
      - - so
        - kết quả
        - The fees are high, so many students work part-time.
      - - because
        - lý do
        - Many students work part-time because the fees are high.
      - - when
        - thời điểm
        - When children feel pressure, they learn less.
      - - if
        - điều kiện
        - If students read more, they write better.
    notes:
      - "Mệnh đề phụ đứng đầu câu thì có dấu phẩy: Because the fees are high, … Đứng sau thì không cần dấu phẩy."
      - Hai câu hoàn chỉnh KHÔNG được nối bằng dấu phẩy (comma splice). Dùng dấu chấm hoặc thêm liên từ.
      - "Tiếng Việt nói 'Vì… nên…', tiếng Anh chỉ dùng MỘT liên từ: Because …, … hoặc …, so …"
      - "Mệnh đề because/when/if không đứng một mình thành câu: *Because it is useful.* là câu cụt."
    mistakes:
      - wrong: Because the fees are high, so many students work part-time.
        right: Because the fees are high, many students work part-time.
        why: "'Vì… nên…': tiếng Anh chỉ giữ because HOẶC so."
      - wrong: Uniforms are cheap, they make students feel equal.
        right: Uniforms are cheap, and they make students feel equal.
        why: Hai mệnh đề độc lập nối bằng dấu phẩy là lỗi comma splice — thêm and hoặc tách câu.
      - wrong: Students should learn cooking. Because it is a useful skill.
        right: Students should learn cooking because it is a useful skill.
        why: Mệnh đề because không đứng riêng thành một câu.
    examples:
      - b22-001
      - b22-003
      - b22-008
      - b22-011
      - b22-012
    provenance:
      - source: egiu
        field: scope
        ref: Unit 97 (and/but/or/so/because) — đối chiếu phạm vi
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L1 'Các loại câu trong writing', L2 'Cách cải thiện kỹ năng viết câu' — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-03
    lesson: buoi-23-moi-truong-listening-form
    title: Hiện tại hoàn thành hay quá khứ đơn?
    cefr: B1
    structures:
      - "Quá khứ đơn:      S + V2/-ed + mốc đã kết thúc   (yesterday, last year, in 2019, … ago, when I was a child)"
      - "Hiện tại hoàn thành: S + have/has + V3 + thời gian chưa kết thúc / không nói lúc nào   (for, since, ever, never, yet, already, so far, this year)"
    explain: "Câu hỏi quyết định: người nói có đặt hành động vào một thời điểm ĐÃ KẾT THÚC không? Có (last year, in 2019, two days ago, When …?) → quá khứ đơn. Không nói thời điểm, hoặc khoảng thời gian còn kéo dài đến bây giờ (this year, so far, since 2020) → hiện tại hoàn thành. Khi kể chuyện: câu đầu nêu tin bằng hiện tại hoàn thành, các chi tiết sau (khi nào, ở đâu, thế nào) chuyển sang quá khứ đơn."
    table:
      - - Quá khứ đơn
        - Hiện tại hoàn thành
      - - I planted a tree last Sunday.
        - I have planted ten trees this year.
      - - The river was clean in 2010.
        - The river has become dirty since 2010.
      - - When did you join the club?
        - How long have you been in the club?
      - - She lived in Da Nang for two years. (giờ không sống ở đó nữa)
        - She has lived in Da Nang for two years. (vẫn đang sống)
    notes:
      - "Hỏi 'When…?' luôn trả lời bằng quá khứ đơn: When did you start? — I started in May."
      - "Tin tức → chi tiết: I've lost my phone! I left it on the bus this morning."
      - Trong IELTS Writing Task 1 có năm cụ thể trong quá khứ → dùng quá khứ đơn; Speaking 'Have you ever…?' → trả lời Yes, I have + chi tiết ở quá khứ đơn.
    mistakes:
      - wrong: I have joined the club two years ago.
        right: I joined the club two years ago.
        why: ago = mốc đã qua → quá khứ đơn.
      - wrong: When have you started volunteering?
        right: When did you start volunteering?
        why: Câu hỏi When… dùng quá khứ đơn.
      - wrong: Air pollution got worse since 2015.
        right: Air pollution has got worse since 2015.
        why: since 2015 = kéo dài đến nay → hiện tại hoàn thành.
    examples:
      - b23-001
      - b23-002
      - b23-003
      - b23-004
      - b23-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 18–20 (present perfect vs past simple) — đối chiếu phạm vi
    source: editorial
    status: draft
  - id: en-g2-04
    lesson: buoi-24-moi-truong-speaking-part-1
    title: "Nói về sở thích: enjoy, be keen on, prefer … to …, would rather"
    cefr: B1
    structures:
      - enjoy / love / like / don't mind / hate + V-ing      I enjoy going for walks.
      - be keen on / be interested in / be into + V-ing / N   I'm keen on cycling.
      - prefer + N/V-ing + to + N/V-ing                       I prefer walking to driving.
      - would rather + V + than + V                            I'd rather stay home than go out.
    explain: "Speaking Part 1 hỏi rất nhiều về sở thích: Do you like…? Which do you prefer…? Trả lời bằng nhiều cấu trúc khác nhau thay vì lặp 'I like' giúp ghi điểm cả Từ vựng lẫn Ngữ pháp. Hai điều cần nhớ: sau giới từ (on, in, to trong prefer … to) động từ luôn ở dạng V-ing; còn would rather đi với động từ nguyên mẫu không có to."
    table:
      - - Mức độ
        - Cấu trúc
        - Ví dụ
      - - rất thích
        - love / be really keen on
        - I'm really keen on hiking.
      - - thích
        - enjoy / be into
        - These days I'm into gardening.
      - - bình thường
        - don't mind
        - I don't mind rainy days.
      - - không thích lắm
        - not very keen on
        - I'm not very keen on hot weather.
      - - ghét
        - hate / can't stand
        - I can't stand traffic jams.
      - - so sánh
        - prefer … to … / would rather … than …
        - I'd rather cycle than drive.
    notes:
      - "Mở đầu tự nhiên cho Part 1: 'To be honest, …', 'Actually, …', 'Well, it depends.' — nhưng đừng dùng cùng một câu mở đầu cho mọi câu trả lời."
      - "Ôn Buổi 17: interested (người cảm thấy) ≠ interesting (vật gây ra cảm giác)."
      - "Ôn Buổi 16: enjoy, don't mind, can't stand + V-ing; want, hope, decide + to V."
    mistakes:
      - wrong: I am keen on play football.
        right: I am keen on playing football.
        why: Sau giới từ on dùng V-ing.
      - wrong: I prefer tea than coffee.
        right: I prefer tea to coffee.
        why: prefer A to B (không dùng than).
      - wrong: I would rather to stay at home.
        right: I would rather stay at home.
        why: would rather + động từ nguyên mẫu không to.
      - wrong: I'm interesting in nature.
        right: I'm interested in nature.
        why: Người cảm thấy thích → interested.
    examples:
      - b24-001
      - b24-002
      - b24-003
      - b24-010
      - b24-011
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Speaking cơ bản 'Thể hiện sở thích của bản thân', 'Thể hiện cảm xúc và quan điểm' — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-05
    lesson: buoi-25-cong-nghe-true-false-not-given
    title: "Mệnh đề quan hệ: who, which, that (và whose, where)"
    cefr: B1
    structures:
      - "Người:     N + who/that + V …           The man who fixed my laptop is my neighbour."
      - "Vật:       N + which/that + V …         Apps which track sleep are popular."
      - "Tân ngữ:   N + (that/which/who) + S + V  The phone (that) I bought is fast."
      - "Sở hữu:    N + whose + N …              A student whose phone was stolen…"
      - "Nơi chốn:  N + where + S + V            The shop where I bought it…"
    explain: "Mệnh đề quan hệ đứng ngay sau danh từ để nói rõ đó là người/vật NÀO, giúp nối hai câu đơn thành một câu phức. who dùng cho người, which cho vật, that dùng được cho cả hai. Khi đại từ quan hệ làm tân ngữ (phía sau có chủ ngữ riêng), có thể lược bỏ: the phone (that) I bought. Không lặp lại đại từ he/she/it trong mệnh đề, và động từ trong mệnh đề chia theo danh từ đứng trước."
    table:
      - - Đại từ
        - Thay cho
        - Ví dụ
      - - who
        - người
        - People who use AI should check its answers.
      - - which
        - vật / con vật
        - A robot which cleans floors saves time.
      - - that
        - người hoặc vật
        - The app that I use most is free.
      - - whose
        - sở hữu (của ai)
        - The girl whose laptop broke borrowed mine.
      - - where
        - nơi chốn
        - This is the café where I work online.
    notes:
      - "Nối câu: I have a friend. She works for a tech company. → I have a friend who works for a tech company."
      - "Có thể bỏ đại từ khi nó làm TÂN NGỮ: The app (that) I downloaded… Không bỏ được khi làm CHỦ NGỮ: The app that helps me… (bắt buộc giữ that)."
      - "Mệnh đề có dấu phẩy (thông tin thêm, không xác định) không dùng that: My phone, which is five years old, still works. Sẽ học kỹ hơn ở Giai đoạn 3."
      - Trong bài đọc IELTS, mệnh đề quan hệ hay 'giấu' chủ thể thật của hành động — đọc kỹ ai/cái gì đứng trước who/which.
    mistakes:
      - wrong: The man who he fixed my laptop is my neighbour.
        right: The man who fixed my laptop is my neighbour.
        why: who đã thay cho the man — không thêm he.
      - wrong: I have a friend which works for Google.
        right: I have a friend who works for Google.
        why: Người → who/that.
      - wrong: This is the app that I use it every day.
        right: This is the app that I use every day.
        why: that đã thay cho the app — bỏ it.
      - wrong: Students who uses AI must check the answers.
        right: Students who use AI must check the answers.
        why: Động từ chia theo Students (số nhiều).
    examples:
      - b25-001
      - b25-002
      - b25-003
      - b25-004
      - b25-005
      - b25-013
      - b25-015
    provenance:
      - source: egiu
        field: scope
        ref: Units 101–102 (relative clauses) — đối chiếu phạm vi
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp trung cấp L11 'Mệnh đề quan hệ' — đối chiếu phạm vi
    source: editorial
    status: draft
  - id: en-g2-06
    lesson: buoi-26-cong-nghe-writing-task-1-line-graph
    title: "Miêu tả xu hướng: động từ + trạng từ và tính từ + danh từ"
    cefr: B1
    structures:
      - S + rose / fell / increased / decreased + sharply / gradually / slightly (+ from X to Y)
      - There was a + sharp / gradual / slight + rise / fall / increase + in + N
      - from X to Y (mốc đầu → mốc cuối) · by X (mức chênh) · at X (giữ ở mức) · of X (sau danh từ)
    explain: "Task 1 cần nói một xu hướng theo hai cách để không lặp: động từ + trạng từ (Sales rose sharply) hoặc There was / saw + tính từ + danh từ (There was a sharp rise in sales). Trạng từ đi với động từ, tính từ đi với danh từ. Chọn thì theo thời gian trong biểu đồ: năm đã qua → quá khứ đơn; đến hiện nay → hiện tại hoàn thành; dự báo tương lai → will / is expected to."
    table:
      - - Động từ + trạng từ
        - Tính từ + danh từ
      - - rose sharply
        - a sharp rise
      - - fell gradually
        - a gradual fall
      - - increased significantly
        - a significant increase
      - - decreased slightly
        - a slight decrease
      - - fluctuated
        - a fluctuation / some fluctuation
      - - remained stable
        - (không đổi) — stability
    notes:
      - increased BY 20% = tăng thêm 20 điểm/phần trăm; increased TO 20% = tăng đến mức 20%.
      - reached a peak OF 60% / peaked AT 60% / stood AT 30% in 2015.
      - rise, fall, increase, decrease là nội động từ — KHÔNG dùng bị động (*was increased*).
      - "Tránh lặp chủ ngữ dài: the number of online shoppers → this figure / the figure for young adults."
    mistakes:
      - wrong: The number of users increased sharp.
        right: The number of users increased sharply.
        why: Bổ nghĩa cho động từ → trạng từ.
      - wrong: There was a sharply increase in sales.
        right: There was a sharp increase in sales.
        why: Bổ nghĩa cho danh từ → tính từ.
      - wrong: The price was increased to $20 in 2020.
        right: The price increased to $20 in 2020.
        why: "Số liệu tự tăng: dùng chủ động."
      - wrong: Sales increased 20% in 2019.
        right: Sales increased by 20% in 2019.
        why: Mức tăng thêm cần by.
    examples:
      - b26-001
      - b26-002
      - b26-003
      - b26-004
      - b26-005
    provenance:
      - source: prep-co-ban
        field: scope
        ref: "Writing cơ bản L4 'Writing Task 1: biểu đồ xu hướng + so sánh' (Pre-writing, During and Post-writing) — đối chiếu phạm vi, không chép"
    source: editorial
    status: draft
  - id: en-g2-07
    lesson: buoi-27-suc-khoe-listening-map
    title: "Vị trí trên bản đồ: at the end of, on the corner of, to the north of…"
    cefr: B1
    structures:
      - at the end of / at the top of / at the bottom of + N      The gym is at the end of the corridor.
      - on the corner of / in the corner of + N                   The café is on the corner of the street.
      - in the middle / centre of + N                             The pool is in the centre of the building.
      - to the north / south / east / west of + N (bên ngoài)     The car park is to the south of the gym.
      - in the north / south … of + N (bên trong)                 The courts are in the north of the park.
      - directly opposite / just past / halfway along + N
    explain: "Dạng bài bản đồ trong Listening dùng rất nhiều cụm chỉ vị trí dài hơn opposite hay next to (đã học ở Buổi 3). Cần phân biệt: in the north of (nằm TRONG phần phía bắc của khu vực) và to the north of (nằm BÊN NGOÀI, về phía bắc). on the corner = góc ngoài (góc phố); in the corner = góc trong (góc phòng). Các từ như directly, just, halfway giúp chỉ vị trí chính xác hơn."
    table:
      - - Cụm
        - Nghĩa
        - Ví dụ
      - - at the end of
        - ở cuối
        - at the end of the path
      - - on the corner of
        - ở góc (ngoài)
        - on the corner of Main Street
      - - in the corner of
        - ở góc (trong)
        - in the corner of the room
      - - in the north of
        - ở phía bắc (bên trong)
        - in the north of the park
      - - to the north of
        - về phía bắc (bên ngoài)
        - to the north of the lake
      - - directly opposite
        - đối diện ngay
        - directly opposite the entrance
      - - just past
        - vừa đi qua khỏi
        - just past the café
      - - halfway along
        - ở khoảng giữa (dọc đường)
        - halfway along the corridor
      - - on your left / right
        - bên trái / phải bạn
        - The pool is on your left.
    notes:
      - "Trên bản đồ thi IELTS, người nói thường dùng: 'As you come in…', 'Go past…', 'It's the first room on the right.'"
      - "Thứ tự: the first / second / last building on the left."
      - clockwise / anticlockwise = theo / ngược chiều kim đồng hồ.
    mistakes:
      - wrong: The gym is in the end of the corridor.
        right: The gym is at the end of the corridor.
        why: Cuối (hành lang, con đường) → at the end of.
      - wrong: The café is in the corner of the street.
        right: The café is on the corner of the street.
        why: Góc phố (góc ngoài) → on the corner.
      - wrong: The car park is in the south of the building.
        right: The car park is to the south of the building.
        why: Bãi xe nằm bên ngoài tòa nhà → to the south of.
    examples:
      - b27-001
      - b27-002
      - b27-003
      - b27-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Listening cơ bản L2 'Dự đoán qua ngôn ngữ chỉ dẫn'; Writing cơ bản 'Maps' (giới từ vị trí) — đối chiếu phạm vi
      - source: prep-trung-cap
        field: scope
        ref: Listening trung cấp L10 'Labelling a map' — mới biết tên bài, chưa xem video
    source: editorial
    status: draft
  - id: en-g2-08
    lesson: buoi-28-suc-khoe-speaking-part-2
    title: used to + V (thói quen trong quá khứ) và be used to + V-ing
    cefr: B1
    structures:
      - S + used to + V                    I used to play football every afternoon.
      - S + didn't use to + V              I didn't use to like vegetables.
      - Did + S + use to + V …?            Did you use to play sports at school?
      - S + be / get used to + V-ing / N   I'm used to getting up early. (đã quen)
    explain: "used to + V nói về thói quen hoặc trạng thái trong quá khứ mà BÂY GIỜ KHÔNG CÒN nữa: I used to be shy (giờ không còn nhút nhát). Rất hữu ích ở Speaking Part 2 khi kể chuyện ngày xưa. Khác hẳn be used to + V-ing / danh từ nghĩa là 'đã quen với': I'm used to running in the heat. Trong câu phủ định và câu hỏi, dùng use to (không có d) sau did."
    table:
      - - Cấu trúc
        - Nghĩa
        - Ví dụ
      - - used to + V
        - ngày xưa thường…
        - I used to swim in the river.
      - - didn't use to + V
        - ngày xưa không…
        - I didn't use to exercise.
      - - be used to + V-ing
        - đã quen với…
        - I'm used to training in the rain.
      - - get used to + V-ing
        - dần quen với…
        - I'm getting used to waking up at 5.
    notes:
      - "Chỉ dùng cho quá khứ — không có *I use to play* ở hiện tại. Thói quen hiện tại: I usually play."
      - "Có số lần/khoảng thời gian cụ thể thì dùng quá khứ đơn: I played in three tournaments (không dùng used to)."
      - "Câu mở đầu kể chuyện hay dùng: When I was a child, I used to… / As far as I can remember, …"
    mistakes:
      - wrong: I use to play football when I was young.
        right: I used to play football when I was young.
        why: "Khẳng định quá khứ: used to."
      - wrong: Did you used to play sports?
        right: Did you use to play sports?
        why: Sau did dùng use to (không d).
      - wrong: I am used to get up early.
        right: I am used to getting up early.
        why: be used to + V-ing (to là giới từ).
      - wrong: I used to go to that gym three times last month.
        right: I went to that gym three times last month.
        why: Có số lần/mốc cụ thể → quá khứ đơn.
    examples:
      - b28-001
      - b28-002
      - b28-003
      - b28-004
    provenance:
      - source: egiu
        field: scope
        ref: Unit 14 (used to) — đối chiếu phạm vi
      - source: prep-co-ban
        field: scope
        ref: Speaking cơ bản 'Kể về quá khứ' (used to, as far as I can remember) — đối chiếu phạm vi
    source: editorial
    status: draft
  - id: en-g2-09
    lesson: buoi-29-toi-pham-matching-headings
    title: Câu bị động ở các thì
    cefr: B1
    structures:
      - "Hiện tại tiếp diễn:  am/is/are + being + V3     A new law is being discussed."
      - "Hiện tại hoàn thành: have/has + been + V3       Three men have been arrested."
      - "Quá khứ tiếp diễn:   was/were + being + V3      The bank was being robbed."
      - "Tương lai:           will + be + V3              The thief will be sent to prison."
      - "be going to:         am/is/are going to + be + V3"
    explain: "Bị động giữ nguyên thì của câu chủ động; chỉ đổi thành 'be' chia theo thì đó + V3. Mẹo: viết câu chủ động, xác định thì, rồi chia 'be' ở đúng thì (is being / has been / was being / will be) và thêm V3. Chủ đề tội phạm dùng bị động rất nhiều vì thường không biết hoặc không cần nói ai làm: My bike has been stolen."
    table:
      - - Thì
        - Chủ động
        - Bị động
      - - Hiện tại đơn
        - Police catch thieves.
        - Thieves are caught.
      - - Hiện tại tiếp diễn
        - They are building a prison.
        - A prison is being built.
      - - Hiện tại hoàn thành
        - They have arrested two men.
        - Two men have been arrested.
      - - Quá khứ đơn
        - Someone stole my bike.
        - My bike was stolen.
      - - Quá khứ tiếp diễn
        - They were questioning him.
        - He was being questioned.
      - - Tương lai đơn
        - The judge will punish him.
        - He will be punished.
    notes:
      - "Ôn Buổi 19: bị động hiện tại đơn/quá khứ đơn. Buổi này mở rộng sang các thì còn lại."
      - "have something + V3: I had my phone stolen (tôi bị mất trộm điện thoại) — rất tự nhiên khi kể chuyện."
      - Trong bài đọc, bị động hay 'giấu' người làm — muốn biết ai làm, tìm cụm by + …
    mistakes:
      - wrong: A new prison is building in the city.
        right: A new prison is being built in the city.
        why: "Nhà tù không tự xây → bị động tiếp diễn: is being built."
      - wrong: Two men have arrested.
        right: Two men have been arrested.
        why: "Thiếu been: have/has + been + V3."
      - wrong: The thief will punished.
        right: The thief will be punished.
        why: "Tương lai bị động: will + be + V3."
      - wrong: My phone was stole.
        right: My phone was stolen.
        why: Dùng V3 (stolen), không phải V2.
    examples:
      - b29-001
      - b29-002
      - b29-003
      - b29-004
      - b29-005
    provenance:
      - source: egiu
        field: scope
        ref: "Unit 22 (passive: is being done / has been done) — đối chiếu phạm vi"
    source: editorial
    status: draft
  - id: en-g2-10
    lesson: buoi-30-toi-pham-writing-adv-disadv
    title: "Liên kết câu trong đoạn: từ nối và từ quy chiếu (this, these, such)"
    cefr: B1
    structures:
      - "Thêm ý:   Firstly, … · In addition, … · Another advantage is that …"
      - "Đối lập:  However, … · On the other hand, …"
      - "Kết quả:  As a result, … · Therefore, …"
      - "Quy chiếu: this + N / these + Ns / such + N  (thay cho ý vừa nói)"
    explain: "Tiêu chí Coherence & Cohesion chấm việc các câu nối với nhau mạch lạc. Hai công cụ chính: từ nối cho biết quan hệ giữa hai câu (thêm, đối lập, kết quả), và từ quy chiếu (this, these, such, it, they) nhắc lại ý đã nói mà không lặp nguyên cụm. Từ nối đứng đầu câu thường có dấu phẩy. Đừng nhồi từ nối vào mọi câu — dùng đúng quan hệ quan trọng hơn dùng nhiều."
    table:
      - - Quan hệ
        - Từ nối
        - Ví dụ
      - - thêm ý
        - In addition, / Another … is that
        - In addition, cameras help the police find criminals.
      - - đối lập
        - However, / On the other hand,
        - However, they can invade people's privacy.
      - - kết quả
        - As a result, / Therefore,
        - As a result, many people feel safer.
      - - ví dụ
        - For example, / such as
        - For example, London has thousands of cameras.
      - - quy chiếu
        - this + N / these + Ns
        - This problem … / These cameras …
    notes:
      - "Câu 1: 'Many cities have installed cameras.' Câu 2: 'This helps the police…' — this thay cho cả việc lắp camera."
      - "Không dùng hai từ nối cùng lúc: *Although … but …*, *Because … so …* (ôn Buổi 22)."
      - Mỗi đoạn thân bài chỉ cần 2–4 từ nối rõ ràng; dùng quá nhiều sẽ bị đánh giá 'mechanical' (máy móc).
    mistakes:
      - wrong: Cameras reduce crime. On the other hand, they help the police catch criminals.
        right: Cameras reduce crime. In addition, they help the police catch criminals.
        why: Hai ý cùng chiều (đều là lợi ích) → In addition; On the other hand chỉ dùng cho ý đối lập.
      - wrong: Prison is expensive, however it keeps dangerous people away.
        right: Prison is expensive. However, it keeps dangerous people away.
        why: however không nối hai câu bằng dấu phẩy — tách câu, However + dấu phẩy.
      - wrong: Many young people commit crimes. The crimes of the young people are often small.
        right: Many young people commit crimes. These crimes are often small.
        why: Dùng từ quy chiếu (These crimes) thay vì lặp lại cả cụm.
    examples:
      - b30-001
      - b30-002
      - b30-003
      - b30-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L6 'Phương pháp đảm bảo sự mạch lạc', 'Referencing language' (Task 2 Adv/Disadv) — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-11
    lesson: buoi-31-gia-dinh-listening-multiple-choice
    title: Câu điều kiện loại 1 (If + hiện tại, will + V) và unless
    cefr: B1
    structures:
      - If + S + V(hiện tại đơn), S + will / can / may + V
      - S + will + V + if + S + V(hiện tại đơn)   (không có dấu phẩy)
      - Unless + S + V(hiện tại đơn) = If + S + don't/doesn't + V
    explain: Dùng để nói về một việc CÓ THỂ xảy ra ở hiện tại hoặc tương lai và kết quả của nó. Mệnh đề if dùng hiện tại đơn dù ý là tương lai; mệnh đề kết quả dùng will (chắc chắn), can (có thể làm được), may/might (có thể xảy ra) hoặc câu mệnh lệnh. If đứng đầu câu thì có dấu phẩy ngăn hai vế; if đứng giữa thì không. unless mang sẵn nghĩa phủ định.
    table:
      - - Vế điều kiện
        - Vế kết quả
        - Ví dụ
      - - If + hiện tại đơn
        - will + V
        - If parents work long hours, children will spend more time alone.
      - - If + hiện tại đơn
        - may / might + V
        - If grandparents live with us, they may help with childcare.
      - - If + hiện tại đơn
        - câu mệnh lệnh
        - If you feel lonely, call your family.
      - - Unless + hiện tại đơn
        - will + V
        - Unless we talk more, the generation gap will grow.
    notes:
      - "Không dùng will trong vế if: If it rains … (không phải If it will rain …)."
      - "when khác if: when = chắc chắn sẽ xảy ra (When my father retires next year …); if = chưa chắc."
      - "Trong bài nghe Multiple choice, câu điều kiện hay dùng để cài bẫy: 'If the weather is bad, we'll go to the museum' — chưa chắc đã đi bảo tàng."
    mistakes:
      - wrong: If my parents will retire, they will move to the countryside.
        right: If my parents retire, they will move to the countryside.
        why: Vế if dùng hiện tại đơn, không dùng will.
      - wrong: Unless you don't share the chores, your mother will be tired.
        right: Unless you share the chores, your mother will be tired.
        why: unless đã có nghĩa 'nếu không' — không thêm don't.
      - wrong: If children do chores they learn responsibility, they will become independent.
        right: If children do chores, they will learn responsibility and become more independent.
        why: Một câu chỉ một vế if và một vế kết quả; if đứng đầu cần dấu phẩy.
    examples:
      - b31-001
      - b31-002
      - b31-003
      - b31-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — unit if / when (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-12
    lesson: buoi-32-xa-hoi-speaking-part-3
    title: "Nêu lý do và ví dụ: because / because of / due to · for example / for instance / such as"
    cefr: B1
    structures:
      - "because / since + MỆNH ĐỀ (S + V):   because parents are busy"
      - "because of / due to + DANH TỪ:   because of work pressure"
      - For example, / For instance, + CÂU ĐẦY ĐỦ
      - "… such as + DANH TỪ (trong câu):   chores such as cooking"
    explain: "Part 3 và Writing Task 2 chấm việc bạn phát triển ý. Cách đơn giản nhất: nêu ý kiến → lý do → ví dụ. Lý do: dùng because/since trước một mệnh đề, because of/due to trước một danh từ. Ví dụ: For example/For instance mở đầu một câu mới hoàn chỉnh; such as đứng giữa câu, theo sau là danh từ. Nhầm hai nhóm này là lỗi ngữ pháp rất hay gặp."
    table:
      - - Từ
        - Theo sau là
        - Ví dụ
      - - because / since
        - mệnh đề (S + V)
        - Children copy their parents because they spend a lot of time together.
      - - because of / due to
        - danh từ / V-ing
        - Many young couples delay having children because of the high cost of living.
      - - For example, / For instance,
        - câu đầy đủ
        - For example, my father cooks dinner every weekend.
      - - such as
        - danh từ (liệt kê)
        - Parents should teach skills such as cooking and saving money.
    notes:
      - "This is because + mệnh đề: cách nối lý do sang câu mới rất tự nhiên khi nói: 'Families are smaller now. This is because…'"
      - "Không dùng Because đứng một mình như một câu hoàn chỉnh: *Because they are busy.* ❌ (chỉ chấp nhận khi trả lời câu hỏi Why? trong hội thoại)."
      - "Ví dụ trong Part 3 có thể là: bản thân/gia đình bạn, nước bạn (In Vietnam, …), hoặc một xu hướng chung (Many companies now …)."
    mistakes:
      - wrong: Many parents are stressed because of they work long hours.
        right: Many parents are stressed because they work long hours.
        why: because of + danh từ; trước mệnh đề (they work…) dùng because.
      - wrong: Children learn many skills. Such as cooking and cleaning.
        right: Children learn many skills, such as cooking and cleaning.
        why: such as không mở đầu câu mới; đặt trong câu, sau dấu phẩy.
      - wrong: Due to parents are busy, children spend time online.
        right: Due to their busy parents, children spend a lot of time online.
        why: "due to + danh từ, không + mệnh đề. Hoặc: Because parents are busy, …"
    examples:
      - b32-001
      - b32-002
      - b32-003
      - b32-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Speaking cơ bản — 3 cách mở rộng câu trả lời; Writing cơ bản — supporting sentences (explanation / example). Đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-13
    lesson: buoi-33-du-lich-sentence-completion
    title: Câu điều kiện loại 2 (If + quá khứ đơn, would + V)
    cefr: B1
    structures:
      - If + S + V(quá khứ đơn), S + would / could / might + V
      - If + I / he / she / it + were …   (were cho mọi ngôi)
      - S + would + V + if + S + V(quá khứ đơn)
    explain: "Dùng cho điều KHÔNG CÓ THẬT hoặc rất khó xảy ra ở hiện tại/tương lai, và kết quả tưởng tượng của nó. Động từ ở vế if lùi về quá khứ nhưng ý vẫn là hiện tại. Vế kết quả dùng would (sẽ), could (có thể), might (có lẽ). Với to be, văn viết dùng were cho mọi ngôi: If I were you… So với loại 1: loại 1 = có thể xảy ra thật; loại 2 = giả định, không thật."
    table:
      - - Loại
        - Vế if
        - Vế kết quả
        - Ý nghĩa
      - - Loại 1
        - If fewer tourists come,
        - the town will be quieter.
        - có thể xảy ra thật
      - - Loại 2
        - If fewer tourists came,
        - the town would be quieter.
        - giả định, khó xảy ra
      - - Lời khuyên
        - If I were you,
        - I would visit in the rainy season.
        - đặt mình vào vị trí người khác
    notes:
      - "Không dùng would ở vế if: *If I would have more money…* ❌."
      - If I were you, I would … là mẫu câu khuyên rất tự nhiên trong Speaking.
      - Trong Reading, câu điều kiện loại 2 cho biết điều CHƯA xảy ra — câu hỏi hỏi 'điều gì đang xảy ra' thì đừng lấy đáp án từ câu giả định.
    mistakes:
      - wrong: If I have a lot of money, I would travel around the world.
        right: If I had a lot of money, I would travel around the world.
        why: "Loại 2: vế if dùng quá khứ đơn (had) để khớp với would."
      - wrong: If the town would limit visitors, the streets would be less crowded.
        right: If the town limited visitors, the streets would be less crowded.
        why: Không dùng would trong vế if.
      - wrong: If I was the mayor, I will ban cars in the old town.
        right: If I were the mayor, I would ban cars in the old town.
        why: Vế kết quả của loại 2 là would, không phải will; văn viết dùng were.
    examples:
      - b33-001
      - b33-002
      - b33-003
      - b33-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — unit if I had / if we went (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-14
    lesson: buoi-34-du-lich-writing-task-1-bar-chart
    title: "So sánh số liệu: twice as many as, more/fewer/less than, whereas, respectively"
    cefr: B1
    structures:
      - twice / three times / half + as many (N đếm được) / as much (N không đếm được) + as …
      - more / fewer + N đếm được + than ·  more / less + N không đếm được + than
      - A + V …, whereas / while + B + V …
      - A and B + V + X and Y, respectively
      - the highest / the lowest figure · the second most popular …
    explain: "Biểu đồ cột thường so sánh nhiều nhóm tại cùng một thời điểm, nên điểm cần là so sánh CHÍNH XÁC. Gấp mấy lần: twice as many as (danh từ đếm được) / twice as much as (không đếm được). Ít hơn: fewer với danh từ đếm được (fewer tourists), less với không đếm được (less money). Đối chiếu hai nhóm trong một câu: whereas/while. Hai số liệu cho hai nhóm trong một câu: respectively ở cuối câu. So sánh nhất: the most popular, the second highest."
    table:
      - - Ý
        - Cấu trúc
        - Ví dụ
      - - gấp đôi
        - twice as many … as
        - Hanoi had twice as many visitors as Hue.
      - - ít hơn (đếm được)
        - fewer … than
        - Fewer tourists visited in 2021 than in 2019.
      - - ít hơn (không đếm được)
        - less … than
        - Tourists spent less money on shopping than on food.
      - - đối chiếu
        - …, whereas …
        - Domestic visitors rose, whereas international visitors fell.
      - - lần lượt
        - …, respectively
        - Food and hotels made up 30% and 45%, respectively.
      - - xếp hạng
        - the second most …
        - Da Nang was the second most popular destination.
    notes:
      - "Chủ ngữ số liệu hay dùng: the number of + N số nhiều (đếm được) · the amount of + N không đếm được · the figure for + nhóm · the percentage of."
      - "Không so sánh con số với một nhóm: *The figure for Hanoi was higher than Hue.* → higher than THAT OF Hue / than the figure for Hue."
      - "Nhắc lại: mô tả số liệu quá khứ dùng quá khứ đơn."
    mistakes:
      - wrong: Hanoi had two times more visitors as Hue.
        right: Hanoi had twice as many visitors as Hue.
        why: "Cấu trúc gấp đôi: twice as many … as (không trộn more với as)."
      - wrong: Tourists spent fewer money on shopping than on accommodation.
        right: Tourists spent less money on shopping than on accommodation.
        why: money không đếm được → less; fewer chỉ dùng với danh từ đếm được số nhiều.
      - wrong: The number of visitors to Hue was lower than Da Nang.
        right: The number of visitors to Hue was lower than that to Da Nang.
        why: "So sánh số với số: than that to/for Da Nang (hoặc than the number for Da Nang)."
    examples:
      - b34-001
      - b34-002
      - b34-003
      - b34-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L4 'Task 1 — biểu đồ xu hướng + so sánh' — đối chiếu phạm vi, không chép
      - source: prep-trung-cap
        field: scope
        ref: Writing trung cấp bài 4 'Charts of Comparison' — chỉ biết tên bài (video, chưa xem)
    source: editorial
    status: draft
  - id: en-g2-15
    lesson: buoi-35-do-thi-hoa-listening-matching
    title: "Câu tường thuật cơ bản (reported speech): said / told + lùi thì"
    cefr: B1
    structures:
      - S + said (that) + S + V (lùi một thì)
      - S + told + NGƯỜI NGHE + (that) + S + V (lùi một thì)
      - S + asked (me) + if / whether + S + V   (câu hỏi Yes/No)
      - S + asked (me) + wh-word + S + V   (không đảo ngữ)
    explain: "Khi thuật lại lời người khác bằng said/told, động từ trong lời nói thường lùi một thì: hiện tại → quá khứ, will → would, can → could, is doing → was doing, has done → had done. Đại từ và từ chỉ thời gian/nơi chốn cũng đổi theo người nói: I → he/she, today → that day, tomorrow → the next day, here → there. say KHÔNG có người nghe ngay sau; tell BẮT BUỘC có. Câu hỏi tường thuật trở thành câu kể: không còn đảo trợ động từ, không có dấu hỏi."
    table:
      - - Lời nói trực tiếp
        - Tường thuật
      - - '"Rents are rising."'
        - She said (that) rents were rising.
      - - '"The new metro line will open next year."'
        - He said the new metro line would open the following year.
      - - "\"I can't afford a flat in the city centre.\""
        - Nam told me he couldn't afford a flat in the city centre.
      - - '"We have moved to the suburbs."'
        - They said they had moved to the suburbs.
      - - '"Do you live near here?"'
        - She asked me if I lived near there.
      - - '"Where do you work?"'
        - He asked me where I worked.
    notes:
      - "Nếu điều được nói VẪN ĐÚNG hiện tại, có thể không lùi thì: He said Hanoi is the capital."
      - "Trong IELTS Listening, người nói hay thuật lại ý kiến người khác: 'My tutor said I should…' — phân biệt ý kiến của AI để trả lời câu matching."
      - "Trong Writing Task 2 dùng mẫu gần giống: Some people say that …, Experts argue that … (thì hiện tại)."
    mistakes:
      - wrong: She said me that rents were too high.
        right: She told me that rents were too high.
        why: say không đi thẳng với người nghe; có người nghe thì dùng tell somebody (hoặc said to me).
      - wrong: He told that the traffic was terrible.
        right: He said that the traffic was terrible.
        why: "tell phải có người nghe: He told me/us that …"
      - wrong: She asked me where did I live.
        right: She asked me where I lived.
        why: Câu hỏi tường thuật không đảo ngữ, không dùng did.
    examples:
      - b35-001
      - b35-002
      - b35-003
      - b35-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — unit say/tell, reported speech (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-16
    lesson: buoi-36-do-thi-hoa-speaking-part-1-2
    title: "Từ nối trong văn nói: besides, apart from, as well as · actually, to be honest · anyway"
    cefr: B1
    structures:
      - "Thêm ý:  Besides, + câu  ·  Apart from + N/V-ing, …  ·  … as well as + N/V-ing"
      - "Sửa ý / nói thật:  Actually, …  ·  To be honest, …"
      - "Quay lại ý chính:  Anyway, …"
      - "Nhấn mạnh:  What I like most about … is (that) …  ·  The thing is, …"
    explain: "Giám khảo chấm Fluency & Coherence: câu trả lời có trôi và có liên kết không. Văn nói dùng bộ từ nối KHÁC văn viết — nói 'Furthermore' hay 'Moreover' nghe như đọc bài. Trong Speaking, dùng: Besides/Apart from that (thêm ý), Actually/To be honest (nói điều thật hoặc hơi trái kỳ vọng), Anyway (quay về ý chính sau khi lạc đề), What I like most is… (nhấn mạnh). Lưu ý ngữ pháp: apart from và as well as + danh từ/V-ing, không + mệnh đề."
    table:
      - - Chức năng
        - Văn nói (Speaking)
        - Văn viết (Writing)
      - - thêm ý
        - Besides, … / Apart from that, … / Also, …
        - In addition, … / Furthermore, …
      - - đối lập
        - But … / Actually, … / Having said that, …
        - However, … / On the other hand, …
      - - nói thật
        - To be honest, … / Honestly, …
        - (không dùng)
      - - quay lại ý
        - Anyway, …
        - (không dùng)
      - - nhấn mạnh
        - What I like most is … / The thing is, …
        - The main reason is that …
    notes:
      - actually ≠ hiện nay. 'Hiện nay tôi sống ở Hà Nội' = At the moment / Currently, I live in Hanoi.
      - Đừng mở MỌI câu trả lời bằng 'Well, …' hoặc 'To be honest, …' — lặp lại cũng bị trừ điểm.
      - Nói tự nhiên thì ghép ý bằng and/but/so/because (Buổi 22) vẫn là tốt nhất; từ nối trên chỉ thêm 'gia vị'.
    mistakes:
      - wrong: Actually, I am a third-year student at university.
        right: At the moment, I'm a third-year student at university.
        why: actually = thật ra, không phải 'hiện nay'.
      - wrong: Apart from it is noisy, I love my district.
        right: Apart from the noise, I love my district.
        why: apart from + danh từ/V-ing, không + mệnh đề.
      - wrong: Furthermore, my district has moreover a big market.
        right: Besides, my district has a big market.
        why: Văn nói dùng từ nối nhẹ; không chồng hai từ nối cùng nghĩa.
    examples:
      - b36-001
      - b36-002
      - b36-003
      - b36-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Speaking cơ bản — cách mở rộng câu trả lời, FANBOYS; nói về sự việc xung quanh — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-17
    lesson: buoi-37-truyen-thong-matching-information
    title: "Nhượng bộ: although / even though + mệnh đề · despite / in spite of + danh từ, V-ing"
    cefr: B1
    structures:
      - Although / Even though + S + V, S + V   (không có 'but')
      - Despite / In spite of + N / V-ing, S + V
      - Despite / In spite of + the fact that + S + V, S + V
      - S + V. However, S + V.   (Buổi 30 — nối hai câu)
    explain: "Dùng để nói hai ý trái ngược: một điều xảy ra dù có điều khác cản trở. Although/even though đứng trước một MỆNH ĐỀ (có chủ ngữ + động từ); despite/in spite of đứng trước DANH TỪ hoặc V-ing. Muốn dùng despite với mệnh đề thì thêm the fact that. Vì although đã mang nghĩa đối lập, vế còn lại không được thêm but. Đây là cấu trúc câu phức giúp tăng điểm Grammatical Range trong Writing."
    table:
      - - Cấu trúc
        - Theo sau là
        - Ví dụ
      - - Although / Even though
        - mệnh đề
        - Although the story was false, it spread quickly.
      - - Despite / In spite of
        - danh từ
        - Despite the warnings, many people shared the video.
      - - Despite / In spite of
        - V-ing
        - In spite of being a journalist, he didn't check the source.
      - - Despite the fact that
        - mệnh đề
        - Despite the fact that the post was fake, it got a million likes.
    notes:
      - "Chuyển đổi: Although it rained → Despite the rain / Despite it raining. Although he was tired → Despite being tired (cùng chủ ngữ)."
      - Trong Reading, although/despite/however báo hiệu ý đối lập — thông tin sau từ này thường là trọng tâm.
      - "Dấu phẩy: Although … đứng đầu thì có dấu phẩy ngăn hai vế; đứng giữa câu thì thường không cần."
    mistakes:
      - wrong: Although the news was fake, but many people believed it.
        right: Although the news was fake, many people believed it.
        why: Although đã mang nghĩa đối lập — bỏ but.
      - wrong: Despite the news was fake, many people believed it.
        right: Despite the fact that the news was fake, many people believed it.
        why: despite + danh từ/V-ing; muốn dùng mệnh đề thì thêm the fact that (hoặc dùng Although).
      - wrong: Despite of the warnings, he shared the post.
        right: Despite the warnings, he shared the post.
        why: despite không có of; in spite of mới có of.
    examples:
      - b37-001
      - b37-002
      - b37-003
      - b37-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — unit although / but (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-18
    lesson: buoi-38-truyen-thong-writing-discussion
    title: "Trình bày quan điểm: Some people argue that … / Others believe … / It is often claimed that …"
    cefr: B2
    structures:
      - Some people argue / believe / claim that + S + V
      - Others think / feel that + S + V
      - It is often argued / said / claimed that + S + V   (bị động khách quan)
      - While some people think …, others believe …
      - "Ý kiến riêng:  I believe / In my view, / From my point of view, …"
    explain: "Dạng Discussion yêu cầu trình bày quan điểm của NGƯỜI KHÁC rồi mới đến quan điểm của bạn. Để giám khảo thấy rõ ai nghĩ gì, dùng động từ tường thuật ở hiện tại: argue (lập luận), claim (cho rằng, có thể chưa đúng), believe, feel. Mẫu bị động khách quan 'It is often argued that …' nghe học thuật và giúp tránh lặp 'some people'. Chuyển sang ý kiến của bạn bằng I believe / In my view — đừng trộn lẫn hai phần."
    table:
      - - Mục đích
        - Mẫu câu
      - - giới thiệu quan điểm 1
        - Some people argue that … / It is often claimed that …
      - - giới thiệu quan điểm 2
        - Others, however, believe that … / On the other hand, many people feel that …
      - - gộp hai quan điểm (mở bài)
        - While some people think …, others believe …
      - - ý kiến riêng
        - I believe that … / In my view, … / From my point of view, …
    notes:
      - Dùng thì HIỆN TẠI cho các động từ này trong Task 2 (argue, claim, believe) — không lùi thì như câu tường thuật ở Buổi 35.
      - "'Some people' chỉ dùng 1–2 lần; đổi sang: supporters of …, critics of …, those who …, many parents, some experts."
      - It is argued that + mệnh đề (không phải *It is argued about …*).
    mistakes:
      - wrong: Some people argue about that the government should control social media.
        right: Some people argue that the government should control social media.
        why: argue that + mệnh đề; argue about + danh từ.
      - wrong: It is often claimed social media is harmful.
        right: It is often claimed that social media is harmful.
        why: Trong văn viết giữ that sau It is claimed/argued.
      - wrong: In my point of view, both sides are right.
        right: From my point of view, both sides have a point.
        why: from my point of view; in my view/opinion.
    examples:
      - b38-001
      - b38-002
      - b38-003
      - b38-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L7 'Discuss both views and give your own opinion' — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-19
    lesson: buoi-39-viec-lam-listening-part-3-4
    title: "Mục đích: to V / in order to V / so as to V / so that + S + can/will"
    cefr: B1
    structures:
      - S + V + (in order) to + V   ·   in order not to + V
      - S + V + so as to + V   ·   so as not to + V
      - S + V + so that + S + can / could / will / would + V
    explain: "Dùng để nói ai đó làm gì NHẰM MỤC ĐÍCH gì. Cách đơn giản nhất: to + V (I work part-time to pay my fees). in order to và so as to trang trọng hơn, hợp với Writing; phủ định đặt not ngay trước to. Khi hai vế có CHỦ NGỮ KHÁC NHAU hoặc có can/will, dùng so that + mệnh đề. Không dùng 'for + V' để nói mục đích — đây là lỗi dịch từ 'để' rất hay gặp."
    table:
      - - Cấu trúc
        - Ví dụ
      - - to + V
        - She did an internship to gain experience.
      - - in order to + V
        - Many graduates move to Hanoi in order to find better jobs.
      - - in order not to + V
        - He left early in order not to miss the interview.
      - - so as to + V
        - The company recruits students so as to train them early.
      - - so that + S + can/could
        - I work from home on Mondays so that I can take my son to school.
      - - so that + S + won't/wouldn't
        - She saved money so that she wouldn't need a loan.
    notes:
      - "for + DANH TỪ thì đúng: I went there for an interview. for + V (for to find, for find) thì sai."
      - "Quá khứ: so that + could/would (She studied hard so that she could get a promotion)."
      - Trong Listening Part 3–4, câu hỏi 'Why did…?' / 'What was the purpose of…?' → nghe to / in order to / so that.
    mistakes:
      - wrong: I learn English for find a better job.
        right: I learn English to find a better job.
        why: "Mục đích + động từ: to V (không dùng for + V)."
      - wrong: She works hard so that get a promotion.
        right: She works hard so that she can get a promotion.
        why: so that + MỆNH ĐỀ (có chủ ngữ + can/will).
      - wrong: He left early in order to not miss the bus.
        right: He left early in order not to miss the bus.
        why: "Phủ định: in order not to + V."
    examples:
      - b39-001
      - b39-002
      - b39-003
      - b39-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — unit to … (I went out to post a letter) / for and to (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-20
    lesson: buoi-40-viec-lam-speaking-part-3
    title: "Paraphrase câu hỏi: đổi từ loại (danh từ hóa) và When it comes to + N/V-ing"
    cefr: B2
    structures:
      - When it comes to + N / V-ing, S + V …
      - As for + N, …   ·   In terms of + N, …
      - "Đổi từ loại:  unemployed (adj) → unemployment (n)  ·  grow (v) → growth (n)  ·  poor (adj) → poverty (n)"
      - "Đổi cấu trúc:  Why do …? → The main reason (why) … is that …"
    explain: "Ở Part 3, mở đầu bằng cách nhắc lại câu hỏi bằng từ KHÁC giúp bạn có vài giây suy nghĩ và cho giám khảo thấy vốn từ (Lexical Resource). Hai kỹ thuật: (1) đổi từ loại — biến động từ/tính từ trong câu hỏi thành danh từ (Why are young people unemployed? → youth unemployment); (2) dùng khung 'When it comes to + N/V-ing' để giới thiệu chủ đề. Sau phần paraphrase ngắn, trả lời ngay theo A-R-E-A (Buổi 32). Không lặp nguyên văn câu hỏi."
    table:
      - - Câu hỏi của giám khảo
        - Paraphrase mở đầu
      - - Why are so many young people unemployed?
        - When it comes to youth unemployment, I think the main reason is …
      - - Will robots take people's jobs?
        - As for automation replacing workers, I'd say it will happen in some industries …
      - - How can the government help poor people?
        - In terms of reducing poverty, the government could …
      - - Is it good to change jobs often?
        - Changing jobs frequently can have both benefits and drawbacks …
    notes:
      - "When it comes to + V-ing (không phải to V): When it comes to finding a job, …"
      - Paraphrase chỉ 1 câu ngắn — rồi trả lời. Paraphrase dài không trả lời gì là lạc đề.
      - Không cần từ hiếm; đổi từ loại (grow → growth, employ → employment) là đủ và an toàn.
    mistakes:
      - wrong: When it comes to find a job, experience is important.
        right: When it comes to finding a job, experience is important.
        why: to ở đây là giới từ → + V-ing.
      - wrong: About the unemployment, I think it is a big problem because unemployment.
        right: As for unemployment, I think it is a big problem because young people cannot earn money.
        why: Dùng As for/When it comes to; lý do phải là một mệnh đề có nội dung, không lặp từ.
      - wrong: The economical growth of Vietnam is fast.
        right: The economic growth of Vietnam is fast.
        why: economic = thuộc kinh tế; economical = tiết kiệm.
    examples:
      - b40-001
      - b40-002
      - b40-003
      - b40-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Speaking cơ bản — tiêu chí chấm, Lexical Resource (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-21
    lesson: buoi-41-toan-cau-hoa-summary-completion
    title: Danh động từ và động từ nguyên mẫu (V-ing vs to V) — mở rộng
    cefr: B1
    structures:
      - "V-ing làm CHỦ NGỮ:  Travelling abroad is expensive."
      - "Giới từ + V-ing:  interested in learning · instead of buying · by working · without asking"
      - "It + be + tính từ + to V:  It is important to protect local businesses."
      - avoid / consider / suggest / admit / risk + V-ing  ·  afford / refuse / manage / fail / tend + to V
      - "Đổi nghĩa:  stop / remember / forget / try + V-ing vs + to V"
    explain: "Buổi 16 đã học nhóm cơ bản (enjoy + V-ing, want + to V). Buổi này mở rộng ba quy tắc chắc chắn: (1) V-ing làm chủ ngữ ở đầu câu; (2) sau MỌI giới từ (in, on, of, by, without, instead of…) là V-ing; (3) sau tính từ trong mẫu It is + adj là to V. Thêm một nhóm động từ đổi nghĩa: stop smoking (bỏ hút) ≠ stop to smoke (dừng lại để hút); remember locking (nhớ là đã khóa) ≠ remember to lock (nhớ phải khóa). Trong Reading summary, loại từ này quyết định từ điền."
    table:
      - - Động từ
        - + V-ing
        - + to V
      - - stop
        - "ngừng hẳn việc đó: He stopped buying imported goods."
        - "dừng lại ĐỂ làm việc khác: He stopped to buy a coffee."
      - - remember
        - "nhớ việc đã làm: I remember visiting Japan."
        - "nhớ việc cần làm: Remember to bring your passport."
      - - try
        - "thử làm xem sao: Try selling online."
        - "cố gắng: She tried to learn Japanese."
      - - forget
        - "quên việc đã làm (thường I'll never forget …): I'll never forget meeting her."
        - "quên làm: Don't forget to pay the tax."
    notes:
      - to trong look forward to, be used to (Buổi 28), when it comes to (Buổi 40) là GIỚI TỪ → + V-ing.
      - "Chủ ngữ V-ing đi với động từ số ít: Buying foreign goods IS popular."
      - "Nhóm hay bị sai: suggest + V-ing (không *suggest to do*), afford + to V (không *afford buying*)."
    mistakes:
      - wrong: Buy imported goods are popular among young people.
        right: Buying imported goods is popular among young people.
        why: Chủ ngữ là hành động → V-ing, động từ số ít.
      - wrong: Many people are interested in learn about other cultures.
        right: Many people are interested in learning about other cultures.
        why: Sau giới từ (in) → V-ing.
      - wrong: The teacher suggested to read the passage first.
        right: The teacher suggested reading the passage first.
        why: suggest + V-ing.
    examples:
      - b41-001
      - b41-002
      - b41-003
      - b41-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — units verb + -ing / verb + to …, preposition + -ing (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-22
    lesson: buoi-42-toan-cau-hoa-writing-task-1-pie-chart
    title: "Diễn đạt tỉ lệ: account for / make up / represent · phân số (a quarter, a third, half) · just over / nearly"
    cefr: B2
    structures:
      - A + accounts for / makes up / represents + X% + of + tổng
      - X% of + N + be/V …   ·   The proportion / percentage of + N + was X%
      - "Phân số:  a quarter (25%) · a third (33%) · half (50%) · two thirds (67%) · three quarters (75%)"
      - "Ước lượng:  just over / just under / nearly / roughly + số hoặc phân số"
    explain: "Biểu đồ tròn cho thấy các PHẦN của một TỔNG. Bạn cần nhiều cách nói 'chiếm X%' để không lặp: account for, make up, represent (chủ động, không bị động). Dùng phân số để bài tự nhiên hơn: 26% = just over a quarter; 48% = nearly half; 65% = roughly two thirds. Với danh từ không đếm được sau 'X% of' động từ chia số ít (30% of the money WAS…); danh từ số nhiều thì chia số nhiều (30% of exports WERE…)."
    table:
      - - Số liệu
        - Cách diễn đạt
      - - 24%
        - nearly a quarter / just under a quarter
      - - 26%
        - just over a quarter
      - - 33%
        - a third / one in three
      - - 49%
        - nearly half / just under half
      - - 52%
        - just over half / the majority
      - - 67%
        - two thirds
      - - 74%
        - nearly three quarters
      - - 5%
        - a small minority / only one in twenty
    notes:
      - "account FOR (có for); make up (không có of ngay sau: make up 20% OF exports); represent (không giới từ)."
      - "Hai biểu đồ tròn hai năm → có thay đổi: 'The share of X rose from 20% to 35%' (dùng ngôn ngữ xu hướng Buổi 26)."
      - "Mixed charts: overview phải nói về CẢ HAI biểu đồ; nối hai biểu đồ bằng 'This is reflected in the table, which shows…'."
    mistakes:
      - wrong: Electronics were accounted for 40% of exports.
        right: Electronics accounted for 40% of exports.
        why: account for là chủ động.
      - wrong: Clothes made up of 15% of the total.
        right: Clothes made up 15% of the total.
        why: make up + X% of …; không 'made up of' ở nghĩa chiếm tỉ lệ (made up of = được tạo thành từ).
      - wrong: The 30 percentage of exports went to China.
        right: Thirty per cent of exports went to China.
        why: Có con số → per cent / %; percentage đi một mình (a high percentage).
    examples:
      - b42-001
      - b42-002
      - b42-003
      - b42-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L5 'Task 1 — các dạng biểu đồ khác' — đối chiếu phạm vi, không chép
      - source: prep-trung-cap
        field: scope
        ref: Writing trung cấp bài 5 'Mixed charts' — chỉ biết tên bài (video, chưa xem)
    source: editorial
    status: draft
  - id: en-g2-23
    lesson: buoi-43-chinh-phu-listening-part-4
    title: "Bị động với động từ khuyết thiếu: should / must / can / will + be + V3"
    cefr: B1
    structures:
      - S + should / must / can / could / will / might + be + V3 (+ by …)
      - S + have to / need to + be + V3
      - "Phủ định: S + should not / cannot + be + V3"
    explain: "Buổi 29 đã học bị động ở các thì. Với động từ khuyết thiếu, công thức luôn là modal + BE + V3 (be không chia). Mẫu này rất hay dùng để đưa ra đề xuất khách quan trong Writing Task 2 và trong bài giảng Part 4: thay vì 'The government should ban plastic bags', viết 'Plastic bags should be banned' — nhấn vào VIỆC cần làm, không cần nói ai làm. Trong bài nghe, các câu 'X must be done', 'X could be reduced' thường chứa đáp án cho phần giải pháp."
    table:
      - - Chủ động
        - Bị động
      - - The government should introduce a sugar tax.
        - A sugar tax should be introduced.
      - - The police must enforce the law.
        - The law must be enforced.
      - - We can reduce pollution.
        - Pollution can be reduced.
      - - They will not raise taxes.
        - Taxes will not be raised.
      - - Someone needs to fund the scheme.
        - The scheme needs to be funded.
    notes:
      - "be KHÔNG chia: *should is banned* ❌, *must being enforced* ❌."
      - "V3 bất quy tắc hay gặp: spend → spent, cut → cut, build → built, give → given."
      - "Đừng lạm dụng: mỗi đoạn 1–2 câu bị động modal là đủ, còn lại dùng chủ động cho rõ ràng."
    mistakes:
      - wrong: Plastic bags should banned in supermarkets.
        right: Plastic bags should be banned in supermarkets.
        why: "Thiếu be: modal + be + V3."
      - wrong: More money must be spend on healthcare.
        right: More money must be spent on healthcare.
        why: Sau be là V3 (spent), không phải V nguyên thể.
      - wrong: Smoking in public places should is banned.
        right: Smoking in public places should be banned.
        why: Sau modal, be giữ nguyên dạng.
    examples:
      - b43-001
      - b43-002
      - b43-003
      - b43-004
    provenance:
      - source: egiu
        field: scope
        ref: Essential Grammar in Use — passive units (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g2-24
    lesson: buoi-44-chinh-phu-writing-problem-solution
    title: "Nguyên nhân – hậu quả – giải pháp: lead to / result in / be caused by · One solution is to V / can be solved by V-ing"
    cefr: B2
    structures:
      - "Nguyên nhân → kết quả:  A + leads to / results in / causes + B"
      - "Kết quả ← nguyên nhân:  B + is caused by / results from + A"
      - One (possible) solution is to + V   ·   Another way to tackle this is to + V
      - This problem can be solved / tackled / addressed by + V-ing
    explain: "Dạng Problem–Solution cần nối rõ NGUYÊN NHÂN với KẾT QUẢ, rồi GIẢI PHÁP với vấn đề. lead to, result in, cause đi từ nguyên nhân tới kết quả; is caused by, results from đi ngược lại — đổi chiều là đổi nghĩa. lead to/result in là giới từ + danh từ/V-ing. Giải pháp nên có hai khung: 'One solution is to + V' và bị động 'can be solved by + V-ing' (nối Buổi 43). Mỗi giải pháp cần nói AI làm và VÌ SAO hiệu quả."
    table:
      - - Chiều
        - Cấu trúc
        - Ví dụ
      - - nguyên nhân → kết quả
        - lead to / result in / cause
        - Fast food leads to obesity.
      - - kết quả ← nguyên nhân
        - be caused by / result from
        - Obesity is often caused by poor diet.
      - - giải pháp (chủ động)
        - One solution is to + V
        - One solution is to tax sugary drinks.
      - - giải pháp (bị động)
        - can be tackled by + V-ing
        - This problem can be tackled by educating parents.
    notes:
      - lead to + V-ING (không *lead to eat*); result in + danh từ/V-ing.
      - "Nhắc lại: One solution is TO + V (to ở đây là 'để') khác lead TO + V-ing (to là giới từ)."
      - "Liên kết giải pháp với nguyên nhân: 'Since the main cause is…, the most effective solution would be…'."
    mistakes:
      - wrong: Eating too much sugar leads to have health problems.
        right: Eating too much sugar leads to health problems.
        why: lead to + danh từ/V-ing.
      - wrong: Obesity results in poor diet.
        right: Obesity results from poor diet.
        why: Chế độ ăn là nguyên nhân → results FROM (hoặc Poor diet results in obesity).
      - wrong: One solution is educate parents about healthy food.
        right: One solution is to educate parents about healthy food.
        why: One solution is TO + V.
    examples:
      - b44-001
      - b44-002
      - b44-003
      - b44-004
    provenance:
      - source: prep-co-ban
        field: scope
        ref: Writing cơ bản L8 'Problems – Causes – Solutions' — đối chiếu phạm vi, không chép
    source: editorial
    status: draft
  - id: en-g2-25
    lesson: buoi-45-tong-on-giai-doan-2
    title: "Tổng ôn Giai đoạn 2: câu phức và các lỗi hay lặp lại"
    cefr: B2
    structures:
      - Hiện tại hoàn thành / quá khứ đơn (21, 23) · bị động các thì + modal (29, 43)
      - Mệnh đề quan hệ who/which/that (25) · câu tường thuật said/told/asked (35)
      - Điều kiện loại 1 và 2 (31, 33) · nhượng bộ although/despite (37)
      - Lý do – ví dụ (32) · mục đích to/so that (39) · nguyên nhân – kết quả lead to/result in (44)
      - So sánh số liệu, tỉ lệ, xu hướng (26, 34, 42) · V-ing vs to V (41)
    explain: "Giai đoạn 2 thêm vào bài viết và bài nói của bạn các câu PHỨC — thứ giúp tiêu chí Grammatical Range lên band 6. Bảng dưới gom mỗi cấu trúc về MỘT công thức cần nhớ và lỗi điển hình nhất. Trước khi thi hoặc nộp bài, rà lại theo đúng danh sách này: đây là những lỗi xuất hiện nhiều nhất ở người học Việt Nam trong giai đoạn này."
    table:
      - - Cấu trúc
        - Công thức
        - Lỗi hay gặp
      - - Điều kiện loại 1
        - If + hiện tại, will + V
        - "*If it will rain* → If it rains"
      - - Điều kiện loại 2
        - If + quá khứ, would + V
        - "*If I have money, I would* → If I had"
      - - Nhượng bộ
        - Although + mệnh đề / Despite + N, V-ing
        - "*Although…, but…* · *Despite of*"
      - - Lý do
        - because + mệnh đề / because of + N
        - "*because of they are busy*"
      - - Mục đích
        - to V / so that + S + can
        - "*for find a job* → to find"
      - - Bị động modal
        - should / must + be + V3
        - "*should banned* → should be banned"
      - - Tường thuật
        - said (that) / told + người nghe
        - "*said me* → told me"
      - - Nguyên nhân – kết quả
        - A leads to / results in B
        - "*lead to have* → lead to having"
      - - Nối câu
        - Câu 1. However, câu 2.
        - "*…, however …* (comma splice)"
    notes:
      - "Ba lỗi riêng cần tự kiểm tra ở MỌI bài viết: viết hoa I, -s số nhiều, và nối câu bằng dấu phẩy (comma splice)."
      - "Từ loại: analysis/analyst, journalism/journalist, economic/economical, responsible/responsibility."
      - "Reading T/F/NG: không có thông tin → NG (không phải F); đọc đúng chủ thể của câu hỏi."
    mistakes:
      - wrong: Although many people use social media, but few of them check their sources.
        right: Although many people use social media, few of them check their sources.
        why: Although không đi với but (Buổi 37).
      - wrong: Young people move to cities for find better jobs, this leads to overcrowding.
        right: Young people move to cities to find better jobs. This leads to overcrowding.
        why: "Mục đích: to V (Buổi 39); không nối hai câu bằng dấu phẩy."
      - wrong: If the government will invest in public transport, traffic congestion would be reduced.
        right: If the government invests in public transport, traffic congestion will be reduced.
        why: "Loại 1: If + hiện tại, will + V (Buổi 31); không trộn will với would."
    examples:
      - b45-001
      - b45-002
      - b45-003
      - b45-004
    provenance: []
    source: editorial
    status: draft
