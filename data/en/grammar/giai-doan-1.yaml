  - id: en-g1-28
    lesson: buoi-10-giao-thong-phuong-tien
    title: Giới từ chỉ chuyển động & cách chỉ đường
    structures:
      - go / walk / drive + along · across · through · past · round · into · out of + nơi chốn
      - "Chỉ đường: You go straight on, turn left at the corner, and the bank is on your right."
      - "Hỏi đường: Excuse me, how do I get to …? / Where is the nearest …?"
    explain: "Giới từ nơi chốn (Buổi 3) cho biết vật ĐANG ở đâu; giới từ chuyển động cho biết người/xe ĐI theo hướng nào: along (dọc theo), across (băng ngang qua), through (xuyên qua bên trong), past (đi ngang qua, vượt qua), into / out of (vào trong / ra khỏi). Khi chỉ đường, người Anh thường dùng hiện tại đơn với you: You go along this street and turn right."
    table:
      - - Giới từ
        - Nghĩa
        - Ví dụ
      - - along
        - dọc theo
        - walk along the river
      - - across
        - băng qua
        - go across the bridge
      - - through
        - xuyên qua
        - drive through the tunnel
      - - past
        - đi ngang qua
        - go past the market
      - - into / out of
        - vào / ra khỏi
        - get into the car / get out of the taxi
    notes:
      - on your left / on your right = ở bên tay trái / phải của bạn.
      - "Với xe buýt, tàu: get on / get off (Buổi 10); với ô tô, taxi: get into / get out of."
    mistakes:
      - wrong: Turn to left at the corner.
        right: Turn left at the corner.
        why: turn left/right không có to.
      - wrong: Go across the park to the gate.
        right: Go through the park to the gate.
        why: Đi bên trong một khu (công viên, rừng) dùng through; across hợp với đường, cầu, sông.
      - wrong: The bank is on the your right.
        right: The bank is on your right.
        why: Không dùng the cùng tính từ sở hữu.
    examples:
      - b10-019
      - b10-020
      - b10-021
    provenance:
      - source: egiu
        field: scope
        ref: Unit 110 (up/over/through… — đối chiếu phạm vi, không chép)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L7 'Giới từ' — nhánh chỉ chuyển động; Từ vựng cơ bản L2 phương hướng
