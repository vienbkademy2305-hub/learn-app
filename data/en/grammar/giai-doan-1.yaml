  - id: en-g1-29
    lesson: buoi-11-thoi-tiet-mua
    title: "Chủ ngữ giả It: thời tiết, thời gian, khoảng cách, It takes …"
    structures:
      - "It is + tính từ thời tiết / It is + V-ing: It's windy. It's raining."
      - "It is + giờ / ngày: It's 7 o'clock. It's Monday."
      - "It is + khoảng cách + from … to …: It's 5 km from my house to school."
      - "It takes (somebody) + thời gian + to V: It takes 20 minutes to walk there."
      - "It is + tính từ + to V: It's nice to see you."
    explain: 'Tiếng Việt nói "Trời mưa", "Bảy giờ rồi", "Mất 20 phút" mà không có chủ ngữ; tiếng Anh bắt buộc có chủ ngữ nên dùng It làm "chủ ngữ giả" — It không chỉ vật gì cả. Hỏi mất bao lâu: How long does it take to …? Hỏi xa bao nhiêu: How far is it from … to …?'
    table:
      - - Nói về
        - Mẫu câu
      - - Thời tiết
        - It's cold. It's snowing.
      - - Giờ / ngày
        - It's half past six. It's my birthday today.
      - - Khoảng cách
        - It's 3 km from here to the beach.
      - - Thời gian làm việc gì
        - It takes an hour to get there.
      - - Nhận xét
        - It's easy to cook this dish.
    notes:
      - "Đừng bỏ It: *Is raining* ✗ → It's raining ✓. *Takes 10 minutes* ✗ → It takes 10 minutes ✓."
    mistakes:
      - wrong: Is very hot today.
        right: It's very hot today.
        why: Câu tiếng Anh phải có chủ ngữ; thời tiết dùng It.
      - wrong: It takes me 30 minutes go to work.
        right: It takes me 30 minutes to go to work.
        why: It takes + thời gian + TO V.
      - wrong: From my house to school is 2 km.
        right: It's 2 km from my house to school.
        why: Khoảng cách dùng It is … from … to …
    examples:
      - b11-012
      - b11-013
      - b11-014
    provenance:
      - source: egiu
        field: scope
        ref: Unit 38 (It … — đối chiếu phạm vi, không chép)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L12 'Trật tự từ – There, It' (đối chiếu phạm vi)
