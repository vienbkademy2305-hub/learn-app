  - id: en-g1-19
    lesson: buoi-19-cau-bi-dong-co-ban
    title: Câu bị động ở hiện tại đơn và quá khứ đơn
    structures:
      - "Hiện tại: S + am/is/are + V3 (+ by …)"
      - "Quá khứ: S + was/were + V3 (+ by …)"
      - "Phủ định/câu hỏi: isn't/wasn't + V3; Is/Was + S + V3?"
    explain: "Câu bị động đưa vật hoặc người CHỊU tác động lên làm chủ ngữ. Dùng khi hành động quan trọng hơn người làm, hoặc không biết/không cần nói ai làm: Coffee is grown in Dak Lak. Cấu trúc là to be + phân từ hai (V3): động từ có quy tắc thêm -ed, bất quy tắc dùng cột 3 (built, grown, made, spoken). Muốn nói ai làm thì thêm by + người: The telephone was invented by Bell."
    table:
      - - Chủ động
        - Bị động
      - - They grow coffee in Dak Lak.
        - Coffee is grown in Dak Lak.
      - - Workers built this bridge in 1902.
        - This bridge was built in 1902.
      - - Bell invented the telephone.
        - The telephone was invented by Bell.
    notes:
      - Tiếng Việt dùng được/bị; tiếng Anh không có từ tương ứng — chỉ cần to be + V3. Tôi sinh năm 2000 = I was born in 2000.
      - made of + chất liệu (made of wood), made in + nơi (made in Vietnam), made by + người.
      - Bị động với can/must/should học ở Buổi 43.
    mistakes:
      - wrong: This bridge built in 1902.
        right: This bridge was built in 1902.
        why: Thiếu to be (was).
      - wrong: Coffee is grow in Dak Lak.
        right: Coffee is grown in Dak Lak.
        why: Phải dùng V3 (grown).
      - wrong: English is speaking in many countries.
        right: English is spoken in many countries.
        why: Bị động dùng V3, không dùng V-ing.
      - wrong: The phone was invented from Bell.
        right: The phone was invented by Bell.
        why: Người làm đi sau by.
    examples:
      - b19-001
      - b19-002
      - b19-003
      - b19-006
    provenance:
      - source: egiu
        field: scope
        ref: Unit 21; Appendix 1 (đối chiếu phạm vi, không chép)
