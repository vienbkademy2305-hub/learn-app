  - id: en-g1-27
    lesson: buoi-08-thuc-an-do-uong
    title: "Lượng từ: a few / a little / too many / too much / (not) enough"
    structures:
      - a few + N đếm được số nhiều · a little + N không đếm được
      - too many + N đếm được · too much + N không đếm được (quá nhiều, không tốt)
      - (not) enough + N · tính từ + enough (big enough)
    explain: 'Nối tiếp much/many của buổi này: muốn nói "một ít" thì dùng a few cho thứ đếm được (a few apples) và a little cho thứ không đếm được (a little milk). Muốn nói "quá nhiều" (mang ý tiêu cực) dùng too many / too much. enough nghĩa là "đủ", phủ định not enough là "không đủ". Người Việt hay dùng much cho mọi thứ (*much people*) — hãy hỏi trước: danh từ này đếm được không?'
    table:
      - - ""
        - Đếm được
        - Không đếm được
      - - Một ít
        - a few eggs
        - a little salt
      - - Quá nhiều
        - too many sweets
        - too much sugar
      - - Không đủ
        - not enough chairs
        - not enough time
    notes:
      - a few / a little mang nghĩa tích cực (có một ít); few / little không có a mang nghĩa tiêu cực (hầu như không).
    mistakes:
      - wrong: I eat too much sweets.
        right: I eat too many sweets.
        why: sweets đếm được → too many.
      - wrong: Can I have a few milk?
        right: Can I have a little milk?
        why: milk không đếm được → a little.
      - wrong: We don't have money enough.
        right: We don't have enough money.
        why: enough đứng trước danh từ.
    examples:
      - b08-019
      - b08-020
      - b08-021
    provenance:
      - source: egiu
        field: scope
        ref: Units 83, 92 (much/many, enough — đối chiếu phạm vi)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L4 'Lượng từ' (đối chiếu phạm vi)
