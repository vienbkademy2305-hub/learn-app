  - id: en-g1-22
    lesson: buoi-14-ke-chuyen-qua-khu
    title: "Động từ có hai tân ngữ: give me the book / give the book to me"
    structures:
      - S + V + người + vật  → She gave me a book.
      - S + V + vật + to + người (give, send, lend, show, tell)  → She gave a book to me.
      - S + V + vật + for + người (buy, make, cook)  → He bought flowers for his mother.
    explain: "Một số động từ cần hai tân ngữ: người nhận và vật được trao. Có hai trật tự: người đứng trước vật (không cần giới từ), hoặc vật đứng trước rồi thêm to/for + người. Dùng to với give, send, lend, show, tell (trao đến ai); dùng for với buy, make, cook (làm/mua giúp ai). Nếu vật là đại từ (it, them), đặt vật trước: Give it to me (không nói *Give me it*)."
    table:
      - - Động từ
        - Người + vật
        - Vật + giới từ + người
      - - give (gave)
        - She gave me a gift.
        - She gave a gift to me.
      - - send (sent)
        - I sent him an email.
        - I sent an email to him.
      - - lend (lent)
        - Lend me your pen.
        - Lend your pen to me.
      - - buy (bought)
        - He bought his mum a cake.
        - He bought a cake for his mum.
    notes:
      - Người Việt hay dịch 'đưa cho tôi quyển sách' thành *give to me the book* — bỏ to khi người đứng ngay sau động từ.
    mistakes:
      - wrong: She gave to me a book.
        right: She gave me a book.
        why: Người đứng ngay sau động từ thì không dùng to.
      - wrong: He bought a cake to his mother.
        right: He bought a cake for his mother.
        why: buy đi với for.
      - wrong: Can you give me it?
        right: Can you give it to me?
        why: Vật là đại từ (it) → đặt trước, thêm to.
      - wrong: My father told to me a funny story.
        right: My father told me a funny story.
        why: tell + người (không có to).
    examples:
      - b14-012
      - b14-013
      - b14-014
      - b14-015
    provenance:
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản L11 — mục 1.3 trật tự từ trong câu có hai tân ngữ (đối chiếu phạm vi, không chép)
    cefr: null
