  - id: en-g1-20
    lesson: buoi-20-tong-on-giai-doan-1
    title: "Tổng ôn: hệ thống các thì đã học ở Giai đoạn 1"
    structures:
      - "Hiện tại đơn: S + V(s/es) — thói quen, sự thật"
      - "Hiện tại tiếp diễn: S + am/is/are + V-ing — đang xảy ra, tạm thời"
      - "Quá khứ đơn: S + V2/V-ed — việc đã xong trong quá khứ"
      - "Quá khứ tiếp diễn: S + was/were + V-ing — đang xảy ra tại một lúc trong quá khứ"
      - "Tương lai: will + V (quyết định lúc nói, dự đoán) / be going to + V (kế hoạch có sẵn)"
      - "Bị động: am/is/are/was/were + V3"
    explain: 'Mỗi thì trả lời một câu hỏi về THỜI GIAN và TRẠNG THÁI của hành động. Trước khi viết một câu, tự hỏi: chuyện này xảy ra khi nào (quá khứ, bây giờ, tương lai)? Nó lặp lại, đang diễn ra, hay đã xong? Rồi chọn đúng công thức. Tiếng Việt dùng "đã, đang, sẽ" và có thể bỏ đi, còn tiếng Anh bắt buộc đổi dạng động từ trong mọi câu. Các thì hoàn thành (have done) học từ Buổi 21.'
    table:
      - - Thì
        - Khẳng định
        - Phủ định
        - Câu hỏi
        - Dấu hiệu
      - - Hiện tại đơn
        - She works.
        - She doesn't work.
        - Does she work?
        - every day, usually, often
      - - Hiện tại tiếp diễn
        - She is working.
        - She isn't working.
        - Is she working?
        - now, at the moment, Look!
      - - Quá khứ đơn
        - She worked.
        - She didn't work.
        - Did she work?
        - yesterday, last week, ago
      - - Quá khứ tiếp diễn
        - She was working.
        - She wasn't working.
        - Was she working?
        - at 8 p.m. yesterday, when, while
      - - Tương lai (will)
        - She will work.
        - She won't work.
        - Will she work?
        - tomorrow, I think, probably
      - - be going to
        - She is going to work.
        - She isn't going to work.
        - Is she going to work?
        - kế hoạch, dấu hiệu rõ ràng
    notes:
      - "Sau didn't / doesn't / will luôn là động từ nguyên thể: She didn't go (không nói *didn't went*)."
      - "Lỗi hay gặp nhất của học viên ở Giai đoạn 1: thiếu to be, thiếu -s ngôi 3, thiếu -s số nhiều, thiếu mạo từ, nối hai câu bằng dấu phẩy."
    mistakes:
      - wrong: Yesterday I go to the market.
        right: Yesterday I went to the market.
        why: yesterday → quá khứ đơn.
      - wrong: She didn't went to school.
        right: She didn't go to school.
        why: Sau didn't dùng nguyên thể.
      - wrong: I will going to visit Hue.
        right: I am going to visit Hue.
        why: Không dùng will cùng be going to.
      - wrong: I like English, it is interesting.
        right: I like English. It is interesting.
        why: Không nối hai câu đầy đủ bằng dấu phẩy (comma splice).
    examples:
      - b20-001
      - b20-002
      - b20-003
      - b20-004
    provenance:
      - source: egiu
        field: scope
        ref: Study guide (tr. 271) làm khung ôn; Units 1–28 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
