  - id: en-g1-21
    lesson: buoi-12-suc-khoe-benh-tat
    title: "Câu mệnh lệnh (Imperative): Take… / Don't… / Let's…"
    structures:
      - V (nguyên mẫu) + …  → Take this medicine.
      - Don't + V + …  → Don't drink cold water.
      - Please + V… / V…, please.  → Sit down, please.
      - Let's + V…  → Let's go to the pharmacy.
      - "Biển báo: No + V-ing / danh từ  → No smoking. No parking."
    explain: "Câu mệnh lệnh dùng để hướng dẫn, khuyên, cảnh báo hoặc nhờ ai làm gì. Câu KHÔNG có chủ ngữ và bắt đầu ngay bằng động từ nguyên mẫu (không chia, không có to). Muốn cấm hoặc khuyên đừng làm, thêm Don't phía trước. Thêm please để lịch sự hơn; Let's + V để rủ cả mình cùng làm. Trên biển báo thường viết ngắn: No + V-ing."
    table:
      - - Mục đích
        - Ví dụ
      - - Hướng dẫn
        - Take two tablets after meals.
      - - Khuyên / cảnh báo
        - Don't go to bed late. Be careful!
      - - Nhờ lịch sự
        - Open the window, please.
      - - Rủ cùng làm
        - Let's do some exercise.
      - - Biển báo cấm
        - No smoking. No photos.
    notes:
      - "Với to be: Be careful! / Don't be late! (không nói *Don't late*)."
      - Câu mệnh lệnh kết thúc bằng dấu chấm hoặc dấu chấm than.
    mistakes:
      - wrong: Don't to drink cold water.
        right: Don't drink cold water.
        why: Sau Don't là V nguyên mẫu, không có to.
      - wrong: You take this medicine!
        right: Take this medicine!
        why: Câu mệnh lệnh không có chủ ngữ you (thêm you nghe như trách móc).
      - wrong: Don't late for the appointment.
        right: Don't be late for the appointment.
        why: late là tính từ → cần be.
      - wrong: Not smoke here.
        right: Don't smoke here. / No smoking.
        why: Phủ định câu mệnh lệnh dùng Don't; biển báo dùng No + V-ing.
    examples:
      - b12-015
      - b12-016
      - b12-017
    provenance:
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản L11 'Trật tự từ và các cấu trúc câu' — mục câu mệnh lệnh (đối chiếu phạm vi, không chép)
      - source: egiu
        field: scope
        ref: "Unit 35 (Do this! Don't do that! Let's do this!) — đối chiếu phạm vi"
    cefr: null
    source: editorial
