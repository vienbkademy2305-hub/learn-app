  - id: en-g1-30
    lesson: buoi-17-cam-xuc-trang-thai
    title: Tính từ và trạng từ chỉ cách thức (-ly)
    structures:
      - "Tính từ + ly → trạng từ: quick → quickly, careful → carefully, easy → easily"
      - "S + V (+ tân ngữ) + trạng từ: She speaks English well. He drives carefully."
      - "be / look / feel / seem + TÍNH TỪ: She looks tired. (không dùng trạng từ)"
      - "Bất quy tắc: good → well · fast → fast · hard → hard · late → late · early → early"
    explain: 'Tính từ bổ nghĩa cho danh từ (a careful driver); trạng từ bổ nghĩa cho động từ, cho biết hành động diễn ra THẾ NÀO (He drives carefully). Phần lớn trạng từ = tính từ + ly. Trạng từ cách thức thường đứng sau động từ, hoặc sau tân ngữ nếu có. Cẩn thận: sau be, look, feel, seem vẫn dùng tính từ (She feels nervous), và hardly nghĩa là "hầu như không", không phải "chăm chỉ".'
    table:
      - - Tính từ
        - Trạng từ
        - Ví dụ
      - - slow
        - slowly
        - Please speak slowly.
      - - careful
        - carefully
        - Read the question carefully.
      - - easy
        - easily
        - He passed the exam easily.
      - - good
        - well
        - She cooks well.
      - - fast / hard
        - fast / hard
        - He works hard. She runs fast.
    notes:
      - "friendly, lovely, lonely là TÍNH TỪ dù có đuôi -ly → trạng từ nói: in a friendly way."
    mistakes:
      - wrong: She speaks English very good.
        right: She speaks English very well.
        why: Bổ nghĩa cho động từ speak → trạng từ well.
      - wrong: Please drive careful.
        right: Please drive carefully.
        why: drive là động từ → cần trạng từ.
      - wrong: He works hardly.
        right: He works hard.
        why: hard vừa là tính từ vừa là trạng từ; hardly = hầu như không.
      - wrong: You look nervously.
        right: You look nervous.
        why: Sau look (trông có vẻ) dùng tính từ.
    examples:
      - b17-018
      - b17-019
      - b17-020
    provenance:
      - source: egiu
        field: scope
        ref: Unit 86 (quickly/badly/suddenly — đối chiếu phạm vi, không chép)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản L6 'Tính từ và Trạng từ', mind map L7 'Trạng từ' (đối chiếu phạm vi)
    cefr: null
    source: editorial
