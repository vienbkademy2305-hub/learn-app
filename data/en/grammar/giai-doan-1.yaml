  - id: en-g1-23
    lesson: buoi-01-ban-than-gia-dinh
    title: Đại từ tân ngữ, tính từ sở hữu, đại từ sở hữu & sở hữu cách 's
    structures:
      - "Chủ ngữ → tân ngữ: I→me, you→you, he→him, she→her, it→it, we→us, they→them"
      - "Tính từ sở hữu + danh từ: my / your / his / her / its / our / their + N"
      - "Đại từ sở hữu (đứng một mình): mine / yours / his / hers / ours / theirs"
      - "Người + 's + N: Lan's brother · danh từ số nhiều đuôi -s + ': my parents' house"
    explain: "Đứng trước động từ dùng đại từ chủ ngữ (I, she…); đứng sau động từ hoặc giới từ dùng đại từ tân ngữ (She loves me, I live with them). Muốn nói \"của ai\", đặt tính từ sở hữu trước danh từ (my mother) hoặc dùng đại từ sở hữu thay cho cả cụm (This bag is mine = my bag). Với tên người, thêm 's: Nam's sister. Tiếng Việt dùng \"của\" đứng sau, tiếng Anh thì đặt chủ sở hữu lên TRƯỚC."
    table:
      - - Chủ ngữ
        - Tân ngữ
        - Tính từ sở hữu
        - Đại từ sở hữu
      - - I
        - me
        - my
        - mine
      - - you
        - you
        - your
        - yours
      - - he
        - him
        - his
        - his
      - - she
        - her
        - her
        - hers
      - - it
        - it
        - its
        - —
      - - we
        - us
        - our
        - ours
      - - they
        - them
        - their
        - theirs
    notes:
      - its (của nó) không có dấu nháy; it's = it is.
      - "Hỏi 'của ai': Whose bag is this? — It's Lan's / It's mine."
    mistakes:
      - wrong: She loves she mother.
        right: She loves her mother.
        why: Trước danh từ dùng tính từ sở hữu her.
      - wrong: I live with they.
        right: I live with them.
        why: Sau giới từ dùng đại từ tân ngữ them.
      - wrong: This is the car of my father.
        right: This is my father's car.
        why: Với người, dùng 's; không dịch 'của' thành of.
      - wrong: That book is her's.
        right: That book is hers.
        why: Đại từ sở hữu không có dấu nháy.
    examples:
      - b01-017
      - b01-018
      - b01-019
      - b01-020
    provenance:
      - source: egiu
        field: scope
        ref: Units 59–64 (đối chiếu phạm vi, không chép)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản L3 'Sự sở hữu và Đại từ', mind map L4 (đối chiếu phạm vi)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-24
    lesson: buoi-02-ngoai-hinh-tinh-cach
    title: Trật tự nhiều tính từ trước danh từ
    structures:
      - Ý kiến → kích thước → tuổi → màu sắc → nguồn gốc → chất liệu + DANH TỪ
      - a beautiful small old red Italian leather bag (ít khi dùng quá 2–3 tính từ)
      - S + be / look / feel / seem + tính từ (không cần theo thứ tự này)
    explain: "Khi có hai, ba tính từ đứng trước một danh từ, tiếng Anh xếp theo thứ tự cố định: tính từ nêu Ý KIẾN (nice, beautiful) đứng đầu, sau đó là KÍCH THƯỚC (big, small), TUỔI (old, new, young), MÀU (red), NGUỒN GỐC (Vietnamese, Japanese) và cuối cùng CHẤT LIỆU (leather, cotton). Tiếng Việt đặt tính từ sau danh từ nên người Việt hay lúng túng thứ tự. Sau be/look/feel, nối các tính từ bằng and: She is tall and slim."
    table:
      - - Ý kiến
        - Kích thước
        - Tuổi
        - Màu
        - Nguồn gốc
        - Chất liệu
        - Danh từ
      - - a nice
        - small
        - ""
        - ""
        - ""
        - ""
        - house
      - - a beautiful
        - ""
        - old
        - ""
        - Japanese
        - ""
        - car
      - - a
        - big
        - ""
        - black
        - ""
        - leather
        - sofa
    notes:
      - "Mẹo nhớ: 'Ý – Cỡ – Tuổi – Màu – Gốc – Liệu'."
      - "Hai tính từ cùng loại nối bằng and hoặc dấu phẩy: a kind and patient teacher."
    mistakes:
      - wrong: She has a red beautiful dress.
        right: She has a beautiful red dress.
        why: Ý kiến (beautiful) đứng trước màu (red).
      - wrong: He drives a Japanese new car.
        right: He drives a new Japanese car.
        why: Tuổi (new) đứng trước nguồn gốc (Japanese).
      - wrong: She is tall slim.
        right: She is tall and slim.
        why: Sau be, hai tính từ nối bằng and.
    examples:
      - b02-017
      - b02-018
      - b02-019
    provenance:
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L7 'Tính từ' — vị trí và trật tự (đối chiếu phạm vi)
