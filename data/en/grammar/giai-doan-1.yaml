  - id: en-g1-25
    lesson: buoi-04-so-ngay-thang-thoi-gian
    title: "Giới từ thời gian mở rộng: for / during / until / from … to / before / after"
    structures:
      - "for + khoảng thời gian: for two hours, for a week"
      - "during + sự kiện: during the lesson, during Tet"
      - "until + mốc thời gian: until 9 p.m., until Friday"
      - "from … to / until …: from 8 a.m. to 5 p.m."
      - "before / after + thời gian hoặc sự kiện: before lunch, after work"
    explain: 'Ngoài in/on/at, cần phân biệt: FOR đi với độ dài (bao lâu), DURING đi với một sự kiện (trong lúc nào), UNTIL chỉ mốc kết thúc (đến lúc nào thì thôi). FROM … TO/UNTIL cho biết cả điểm đầu và điểm cuối. Người Việt hay dùng "in" cho mọi thứ vì "trong" — nhưng "trong hai tiếng" là for two hours, còn "trong buổi học" là during the lesson.'
    table:
      - - Giới từ
        - Đi với
        - Ví dụ
      - - for
        - độ dài (bao lâu)
        - I study for two hours.
      - - during
        - sự kiện
        - Phones are off during the exam.
      - - until
        - mốc kết thúc
        - The shop is open until 10 p.m.
      - - from … to
        - điểm đầu – điểm cuối
        - I work from Monday to Friday.
    notes:
      - "Hỏi độ dài: How long …? — For three hours."
      - "Nhắc lại Buổi 4: không dùng giới từ trước this / next / last / every."
    mistakes:
      - wrong: I study English during two hours every day.
        right: I study English for two hours every day.
        why: Độ dài thời gian dùng for.
      - wrong: Please be quiet for the lesson.
        right: Please be quiet during the lesson.
        why: Trong một sự kiện dùng during.
      - wrong: The library opens from 8 a.m. at 5 p.m.
        right: The library opens from 8 a.m. to 5 p.m.
        why: from … to (không phải from … at).
    examples:
      - b04-018
      - b04-019
      - b04-020
      - b04-021
    provenance:
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L7 'Giới từ' — nhánh chỉ thời gian (đối chiếu phạm vi)
