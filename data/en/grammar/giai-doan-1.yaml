  - id: en-g1-26
    lesson: buoi-05-hoat-dong-hang-ngay
    title: Câu hỏi có từ để hỏi (Wh-questions) ở hiện tại
    structures:
      - Wh- + do / does + S + V (nguyên mẫu)?  → What time do you get up?
      - Wh- + am / is / are + S …?  → Where is your office?
      - "Hỏi CHỦ NGỮ: Who / What + V(s)…? (không có do)  → Who cooks dinner?"
      - What · Where · When · What time · Who · Why · How · How often · How long · How much / many
    explain: "Đặt từ để hỏi lên đầu câu, rồi dùng trợ động từ do/does (với động từ thường) hoặc đảo to be lên trước chủ ngữ. Sau does, động từ trở về nguyên mẫu. Riêng khi hỏi CHÍNH người làm việc đó (Who cooks?), từ để hỏi là chủ ngữ nên không cần do/does. Người Việt hay giữ trật tự câu kể: *Where you live?* — phải thêm do."
    table:
      - - Từ để hỏi
        - Nghĩa
        - Ví dụ
      - - What / What time
        - cái gì / mấy giờ
        - What time does the class start?
      - - Where
        - ở đâu
        - Where do your parents live?
      - - When
        - khi nào
        - When do you do the dishes?
      - - Who
        - ai
        - Who makes the bed in your family?
      - - Why
        - tại sao
        - Why are you tired?
      - - How often / How long
        - bao lâu một lần / mất bao lâu
        - How long does it take?
    notes:
      - Trả lời Why bằng Because …
      - Ngữ điệu câu hỏi Wh- thường XUỐNG ở cuối câu (khác câu hỏi Yes/No lên giọng).
    mistakes:
      - wrong: Where you live?
        right: Where do you live?
        why: Thiếu trợ động từ do.
      - wrong: What does she likes?
        right: What does she like?
        why: Sau does dùng nguyên mẫu.
      - wrong: Who does cook dinner?
        right: Who cooks dinner?
        why: Hỏi chủ ngữ thì không dùng does, động từ thêm -s.
      - wrong: Why you are late?
        right: Why are you late?
        why: Đảo to be lên trước chủ ngữ.
    examples:
      - b05-012
      - b05-013
      - b05-014
      - b05-015
    provenance:
      - source: egiu
        field: scope
        ref: Units 44–49 (câu hỏi — đối chiếu phạm vi, không chép)
      - source: prep-mat-goc
        field: scope
        ref: Ngữ pháp cơ bản, mind map L10 'Hiện tại đơn', 'To be' — nhánh câu hỏi có từ để hỏi
