  - id: en-g1-08
    lesson: buoi-08-thuc-an-do-uong
    title: Danh từ đếm được và không đếm được; some, any, much, many
    structures:
      - "Đếm được: a/an + N số ít; some/many + N số nhiều"
      - "Không đếm được: some/much + N (không có a/an, không thêm -s)"
      - "some: câu khẳng định và lời mời (Would you like some…?)"
      - "any: câu phủ định và câu hỏi"
      - How many + N số nhiều? / How much + N không đếm được?
    explain: "Danh từ đếm được có số ít và số nhiều (an egg, two eggs). Danh từ không đếm được như rice, bread, milk, water, sugar, homework không dùng a/an và không thêm -s. Muốn đếm chúng thì dùng đơn vị: a bowl of rice, a slice of bread, a bottle of water. Dùng some trong câu khẳng định, any trong câu phủ định và câu hỏi. many đi với danh từ đếm được, much với không đếm được; a lot of dùng được cho cả hai."
    table:
      - - " "
        - Đếm được
        - Không đếm được
      - - Khẳng định
        - some eggs / a lot of eggs
        - some milk / a lot of milk
      - - Phủ định
        - not any eggs / not many eggs
        - not any milk / not much milk
      - - Câu hỏi
        - any eggs? / How many eggs?
        - any milk? / How much milk?
    notes:
      - "Mời hoặc xin dùng some cả trong câu hỏi: Would you like some tea? Can I have some water?"
      - Tiếng Việt không phân biệt đếm được/không đếm được nên dễ viết *breads*, *rices*, *a homework*.
    mistakes:
      - wrong: I eat a rice every day.
        right: I eat rice every day.
        why: rice không đếm được, không dùng a.
      - wrong: Can I have some breads?
        right: Can I have some bread?
        why: bread không đếm được, không thêm -s.
      - wrong: There isn't some milk in the fridge.
        right: There isn't any milk in the fridge.
        why: Câu phủ định dùng any.
      - wrong: How much eggs do we need?
        right: How many eggs do we need?
        why: eggs đếm được → how many.
    examples:
      - b08-001
      - b08-002
      - b08-003
      - b08-007
    provenance:
      - source: egiu
        field: scope
        ref: Units 66, 67, 68, 76, 83 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-13
    lesson: buoi-13-du-lich-co-ban
    title: "Quá khứ đơn: was/were và động từ có quy tắc (-ed)"
    cefr: null
    structures:
      - I / He / She / It + was · You / We / They + were
      - S + V-ed (khẳng định)
      - S + didn't + V nguyên mẫu (phủ định)
      - Did + S + V nguyên mẫu…? — Yes, I did. / No, I didn't.
    explain: "Quá khứ đơn nói về việc đã xảy ra và kết thúc trong quá khứ, thường có mốc thời gian: yesterday, last week, two days ago, in 2020. To be chia was/were. Động từ có quy tắc thêm -ed cho MỌI ngôi. Phủ định và câu hỏi dùng did; khi đã có did thì động từ về nguyên mẫu (Did you visit…? không nói *Did you visited*)."
    table:
      - - Quy tắc chính tả
        - Ví dụ
      - - Thêm -ed
        - visit → visited, stay → stayed
      - - "Tận cùng -e: thêm -d"
        - arrive → arrived, like → liked
      - - Phụ âm + y → -ied
        - study → studied, carry → carried
      - - "1 nguyên âm + 1 phụ âm (nhấn): nhân đôi"
        - stop → stopped, plan → planned
      - - "Anh-Anh: -l nhân đôi"
        - travel → travelled
    notes:
      - "Đọc đuôi -ed: /t/ sau p, k, f, s, sh, ch (booked, watched); /d/ sau âm hữu thanh (stayed, travelled); /ɪd/ sau t, d (visited, needed)."
      - Người Việt hay quên đổi động từ sang quá khứ khi đã có yesterday — kiểm tra lại mọi động từ trong câu.
    mistakes:
      - wrong: Yesterday I visit my grandparents.
        right: Yesterday I visited my grandparents.
        why: Có yesterday → quá khứ đơn.
      - wrong: Did you visited Hue?
        right: Did you visit Hue?
        why: Sau did dùng nguyên mẫu.
      - wrong: We was very tired.
        right: We were very tired.
        why: We/You/They → were.
      - wrong: I arrived to Da Nang at 9 p.m.
        right: I arrived in Da Nang at 9 p.m.
        why: arrive in + thành phố.
    examples:
      - b13-001
      - b13-002
      - b13-003
      - b13-004
      - b13-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 10, 11, 12, 24 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-09
    lesson: buoi-09-mua-sam-tien-bac
    title: So sánh nhất và not as … as
    structures:
      - "Tính từ ngắn: the + adj-est (+ in/of …)"
      - "Tính từ dài: the most + adj (+ in/of …)"
      - S1 + to be + not as + adj + as + S2
    explain: 'So sánh nhất dùng khi so một người/vật với cả nhóm: the cheapest shop in the market. Tính từ ngắn thêm -est, tính từ dài dùng the most; luôn có the ở trước. Sau so sánh nhất dùng in + nơi chốn/nhóm lớn (in the city, in my family) và of + số lượng/khoảng thời gian (of the three, of the year). not as … as nghĩa là "không … bằng": My bag is not as expensive as yours = túi của tôi rẻ hơn.'
    table:
      - - Tính từ
        - So sánh hơn (Buổi 2)
        - So sánh nhất
      - - cheap
        - cheaper
        - the cheapest
      - - big
        - bigger
        - the biggest
      - - busy
        - busier
        - the busiest
      - - expensive
        - more expensive
        - the most expensive
      - - good / bad / far
        - better / worse / further
        - the best / the worst / the furthest
    notes:
      - "not as … as giữ nguyên tính từ (không thêm -er): not as cheap as (không nói *not as cheaper as*)."
      - "Ôn so sánh hơn: This shop is cheaper THAN that shop."
    mistakes:
      - wrong: This is the most cheap shop.
        right: This is the cheapest shop.
        why: Tính từ ngắn thêm -est, không dùng most.
      - wrong: It is most expensive bag in the shop.
        right: It is the most expensive bag in the shop.
        why: So sánh nhất cần the.
      - wrong: She is the best student of my class.
        right: She is the best student in my class.
        why: "Sau so sánh nhất: in + nhóm/nơi chốn."
      - wrong: My phone is not as expensive than your phone.
        right: My phone is not as expensive as your phone.
        why: as … as, không dùng than.
    examples:
      - b09-001
      - b09-002
      - b09-003
      - b09-006
    provenance:
      - source: egiu
        field: scope
        ref: Units 89, 90; ôn 87, 88 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-14
    lesson: buoi-14-ke-chuyen-qua-khu
    title: Quá khứ đơn (bất quy tắc) & quá khứ tiếp diễn
    cefr: null
    structures:
      - "Quá khứ đơn bất quy tắc: go → went, see → saw, lose → lost (học thuộc)"
      - "Quá khứ tiếp diễn: S + was / were + V-ing"
      - While + S + was/were + V-ing, S + V2 (hành động dài bị hành động ngắn cắt ngang)
      - When + S + V2, S + was/were + V-ing
    explain: "Nhiều động từ thường gặp có dạng quá khứ bất quy tắc, phải học thuộc (go → went, meet → met). Phủ định và câu hỏi vẫn dùng did + nguyên mẫu (I didn't go). Quá khứ tiếp diễn (was/were + V-ing) tả việc ĐANG diễn ra tại một thời điểm trong quá khứ. Khi kể chuyện: hành động dài làm \"nền\" dùng quá khứ tiếp diễn, hành động ngắn chen vào dùng quá khứ đơn: I was cooking when the phone rang."
    table:
      - - Nguyên mẫu
        - Quá khứ
        - Nghĩa
      - - go
        - went
        - đi
      - - see
        - saw
        - thấy
      - - meet
        - met
        - gặp
      - - lose
        - lost
        - mất
      - - find
        - found
        - tìm thấy
      - - break
        - broke
        - làm vỡ
      - - fall
        - fell
        - ngã
      - - hear
        - heard
        - nghe thấy
      - - leave
        - left
        - rời đi
      - - forget
        - forgot
        - quên
    notes:
      - while + quá khứ tiếp diễn; when thường + quá khứ đơn (hành động ngắn).
      - "Không dùng quá khứ tiếp diễn với động từ trạng thái: I knew him (không nói *I was knowing him*)."
    mistakes:
      - wrong: Yesterday I goed to the market.
        right: Yesterday I went to the market.
        why: "go là động từ bất quy tắc: went."
      - wrong: I didn't saw the accident.
        right: I didn't see the accident.
        why: Sau didn't dùng nguyên mẫu.
      - wrong: While I walked home, it started to rain.
        right: While I was walking home, it started to rain.
        why: Hành động đang diễn ra (dài) dùng quá khứ tiếp diễn.
      - wrong: They was watching TV.
        right: They were watching TV.
        why: They → were.
    examples:
      - b14-001
      - b14-002
      - b14-003
      - b14-004
      - b14-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 11, 13, 14; Phụ lục 2, 3 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-10
    lesson: buoi-10-giao-thong-phuong-tien
    title: "Giới từ với phương tiện: by, on, in"
    structures:
      - "by + phương tiện (không có a/the/my): by bus, by car, by motorbike, by train, by plane"
      - on foot (đi bộ)
      - on + the/a/my + bus, train, plane, motorbike, bicycle
      - in + the/a/my + car, taxi
    explain: "Khi nói đi lại bằng phương tiện gì, dùng by + tên phương tiện, không có mạo từ hay tính từ sở hữu: I go to work by motorbike. Nếu có a, the, my, his… thì đổi giới từ: on với phương tiện lớn hoặc phải ngồi lên (on the bus, on my motorbike), in với ô tô và taxi (in my car, in a taxi). Đi bộ luôn là on foot."
    table:
      - - Phương tiện
        - by (không mạo từ)
        - on / in (có mạo từ)
        - Lên / Xuống
      - - bus
        - by bus
        - on the bus
        - get on / get off
      - - motorbike
        - by motorbike
        - on my motorbike
        - get on / get off
      - - train
        - by train
        - on the train
        - get on / get off
      - - car
        - by car
        - in my car
        - get in / get out of
      - - taxi
        - by taxi
        - in a taxi
        - get in / get out of
    notes:
      - "take + the/a + phương tiện: I take the bus to school."
      - "Không dùng giới từ trước home: go home by bus (không nói *go to home*)."
    mistakes:
      - wrong: I go to work by my motorbike.
        right: I go to work on my motorbike.
        why: Có my thì dùng on, không dùng by.
      - wrong: She goes to school by foot.
        right: She goes to school on foot.
        why: Đi bộ là on foot.
      - wrong: He is in the bus now.
        right: He is on the bus now.
        why: Xe buýt dùng on.
      - wrong: Get off the taxi here, please.
        right: Get out of the taxi here, please.
        why: Taxi và ô tô dùng get in / get out of.
    examples:
      - b10-001
      - b10-002
      - b10-004
      - b10-007
    provenance:
      - source: egiu
        field: scope
        ref: Unit 111 (by), Unit 55 (go by/go on) (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-15
    lesson: buoi-15-ke-hoach-du-dinh
    title: "Tương lai: will vs be going to (và hiện tại tiếp diễn cho lịch hẹn)"
    cefr: null
    structures:
      - S + will ('ll) + V — quyết định ngay lúc nói, dự đoán, lời hứa, đề nghị
      - S + am/is/are + going to + V — dự định đã có từ trước, dự đoán có dấu hiệu rõ
      - S + am/is/are + V-ing + mốc tương lai — lịch hẹn đã sắp xếp
      - S + won't + V · S + isn't/aren't going to + V
    explain: "will dùng khi quyết định NGAY lúc nói (The phone is ringing. I'll answer it.), khi dự đoán theo ý kiến (I think it will rain), khi hứa hoặc đề nghị giúp. be going to dùng cho dự định ĐÃ CÓ từ trước (I'm going to study abroad next year) hoặc dự đoán có bằng chứng trước mắt (Look at the clouds! It's going to rain). Với lịch hẹn cố định có người khác cùng tham gia, dùng hiện tại tiếp diễn: I'm meeting Lan tomorrow."
    table:
      - - Tình huống
        - Dùng
        - Ví dụ
      - - Quyết định ngay lúc nói
        - will
        - I'm hungry. I'll make a sandwich.
      - - Dự định từ trước
        - be going to
        - We're going to move next month.
      - - Dự đoán theo ý kiến
        - will
        - I think you'll pass the exam.
      - - Dự đoán có bằng chứng
        - be going to
        - Be careful! You're going to fall.
      - - Lịch hẹn đã sắp xếp
        - hiện tại tiếp diễn
        - I'm seeing the doctor on Friday.
    notes:
      - "Sau will là V nguyên mẫu, không có to, không thêm -s: She will come (không nói *She will comes*)."
      - won't = will not, đọc /wəʊnt/ — khác want /wɒnt/.
    mistakes:
      - wrong: I will to call you tomorrow.
        right: I will call you tomorrow.
        why: Sau will không có to.
      - wrong: She is going to moves to Hanoi.
        right: She is going to move to Hanoi.
        why: going to + V nguyên mẫu.
      - wrong: Next year I study in Australia.
        right: Next year I'm going to study in Australia.
        why: Dự định tương lai cần be going to (tiếng Việt không chia thì nên hay bỏ).
      - wrong: I going to visit my parents.
        right: I'm going to visit my parents.
        why: Thiếu am/is/are trước going to.
    examples:
      - b15-001
      - b15-002
      - b15-003
      - b15-004
      - b15-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 25, 26, 27, 28 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-16
    lesson: buoi-16-so-thich-giai-tri
    title: Động từ + to V và động từ + V-ing
    structures:
      - enjoy / finish / mind / stop / practise + V-ing
      - want / would like / hope / decide / plan / learn / need / promise + to V
      - like / love / hate / start + V-ing hoặc to V
      - "go + V-ing (hoạt động): go camping, go swimming, go shopping"
    explain: Khi hai động từ đứng liền nhau, động từ thứ hai có dạng V-ing hay to V tùy động từ đứng trước. Nhóm chỉ việc đang làm/đã quen (enjoy, finish, mind, stop, practise) đi với V-ing. Nhóm hướng về việc sắp làm (want, would like, hope, decide, plan, learn, need, promise) đi với to V. like, love, hate, start dùng được cả hai. Không có quy tắc chắc chắn cho mọi động từ, nên học thuộc theo nhóm.
    table:
      - - + V-ing
        - + to V
        - Cả hai
      - - enjoy
        - want
        - like
      - - finish
        - would like
        - love
      - - mind
        - hope
        - hate
      - - stop
        - decide / plan
        - start
      - - practise
        - learn / need / promise
        - " "
    notes:
      - "Sau giới từ luôn là V-ing: interested in painting, good at playing chess (ôn Buổi 11)."
      - "want + người + to V: My parents want me to study harder (EGIU 53)."
      - would like + to V (không nói *would like going*).
    mistakes:
      - wrong: I enjoy to read books.
        right: I enjoy reading books.
        why: enjoy + V-ing.
      - wrong: I want going out tonight.
        right: I want to go out tonight.
        why: want + to V.
      - wrong: Do you mind to open the window?
        right: Do you mind opening the window?
        why: mind + V-ing.
      - wrong: We often go to camping.
        right: We often go camping.
        why: go + V-ing, không có to.
    examples:
      - b16-001
      - b16-002
      - b16-004
      - b16-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 51, 52, 53 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-17
    lesson: buoi-17-cam-xuc-trang-thai
    title: Tính từ đuôi -ed và -ing
    structures:
      - "Người + to be/feel + adj-ed (cảm xúc của người đó): I am bored."
      - "Vật/việc/người + to be + adj-ing (tính chất gây ra cảm xúc): The film is boring."
      - "adj-ed + giới từ: interested in, excited about, worried about, bored with, proud of"
    explain: "Nhiều tính từ chỉ cảm xúc có hai dạng. Dạng -ed nói về cảm giác của một người (I'm tired = tôi thấy mệt). Dạng -ing nói về cái gây ra cảm giác đó (The job is tiring = công việc làm người ta mệt). Mẹo: hỏi \"ai CẢM THẤY?\" thì dùng -ed; hỏi \"cái gì GÂY RA cảm giác?\" thì dùng -ing. Người cũng dùng được -ing, nhưng nghĩa là người đó làm người khác thấy vậy: He is boring = anh ta nhạt nhẽo."
    table:
      - - -ed (cảm thấy)
        - -ing (gây ra)
        - Ví dụ
      - - bored
        - boring
        - I'm bored because the lesson is boring.
      - - interested
        - interesting
        - I'm interested in this interesting book.
      - - excited
        - exciting
        - The match was exciting, so we were excited.
      - - tired
        - tiring
        - It was a tiring day. I'm really tired.
      - - confused
        - confusing
        - The rules are confusing. I'm confused.
    notes:
      - Tiếng Việt chỉ có một từ "chán", "mệt" nên người Việt hay nói *I'm boring* khi muốn nói tôi thấy chán.
      - "Cách đọc đuôi -ed (ôn Buổi 13): /ɪd/ sau t, d (excited, disappointed); /t/ sau âm vô thanh (relaxed, embarrassed); /d/ còn lại (bored, surprised, confused)."
    mistakes:
      - wrong: I'm boring. Let's go out!
        right: I'm bored. Let's go out!
        why: Cảm giác của mình → -ed.
      - wrong: The football match was very excited.
        right: The football match was very exciting.
        why: Trận đấu gây ra cảm giác → -ing.
      - wrong: I'm interesting in history.
        right: I'm interested in history.
        why: Người thấy thích → interested in.
      - wrong: She is worried for the exam.
        right: She is worried about the exam.
        why: worried about.
    examples:
      - b17-001
      - b17-003
      - b17-005
      - b17-008
    provenance:
      - source: egiu
        field: scope
        ref: Không có unit riêng trong EGIU — tự soạn (xem ban-do-tai-lieu.md)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-18
    lesson: buoi-18-mao-tu-gioi-tu
    title: Mạo từ a / an / the và không mạo từ
    structures:
      - "a/an + danh từ đếm được số ít: nhắc lần đầu, một trong nhiều, nghề nghiệp"
      - a trước PHỤ ÂM, an trước NGUYÊN ÂM — theo âm đọc, không theo chữ cái
      - "the: người nghe đã biết cái nào, duy nhất, so sánh nhất"
      - "Không mạo từ: số nhiều/không đếm được nói chung, bữa ăn, tên nước/thành phố, go to school/work/bed"
    explain: "Dùng a/an khi nhắc tới một vật lần đầu hoặc bất kỳ cái nào trong nhiều cái (I saw a dog). Nhắc lại lần hai, hoặc khi cả hai người đều biết là cái nào, dùng the (The dog was big). The cũng dùng cho thứ chỉ có một (the sun, the capital) và trước so sánh nhất. Khi nói chung chung về một loại thì không dùng mạo từ: I like music, Cats are cute. Chọn a hay an theo ÂM đầu: an hour (h câm), a university (/juː/)."
    table:
      - - Trường hợp
        - Ví dụ đúng
        - Sai hay gặp
      - - Nghề nghiệp
        - She is a nurse.
        - "*She is nurse.*"
      - - Âm đầu
        - an hour, an honest man, a university, a uniform
        - "*a hour*, *an university*"
      - - Duy nhất / đã biết
        - the sun, the capital of Vietnam
        - "*a sun*"
      - - Nói chung
        - Life is short. I like music.
        - "*The life is short.*"
      - - Bữa ăn
        - have breakfast / lunch / dinner
        - "*have a breakfast*"
      - - Nơi quen thuộc
        - go to school / work / bed; go home
        - "*go to the school* (khi đi học)"
    notes:
      - "Tiếng Việt không có mạo từ nên đây là lỗi phổ biến nhất của người Việt trong IELTS Writing — kiểm tra từng danh từ số ít đếm được: đã có a/an/the/my… chưa?"
      - Tên nước thường không có the, trừ the UK, the USA, the Philippines.
      - Động từ + giới từ cố định (listen to, wait for, depend on…) học thành cụm, xem bảng từ vựng.
    mistakes:
      - wrong: My sister is nurse.
        right: My sister is a nurse.
        why: Nghề nghiệp số ít cần a/an.
      - wrong: I have a breakfast at seven.
        right: I have breakfast at seven.
        why: Bữa ăn không dùng mạo từ.
      - wrong: The life is beautiful.
        right: Life is beautiful.
        why: Nói chung chung → không mạo từ.
      - wrong: It takes a hour.
        right: It takes an hour.
        why: h câm, âm đầu là nguyên âm → an.
      - wrong: He studies at an university.
        right: He studies at a university.
        why: university bắt đầu bằng âm /j/ → a.
    examples:
      - b18-001
      - b18-002
      - b18-003
      - b18-007
    provenance:
      - source: egiu
        field: scope
        ref: Units 65, 69, 70, 71, 72, 73; Unit 113 cho động từ + giới từ (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-19
    lesson: buoi-19-cau-bi-dong-co-ban
    title: Câu bị động ở hiện tại đơn và quá khứ đơn
    structures:
      - "Hiện tại: S + am/is/are + V3 (+ by …)"
      - "Quá khứ: S + was/were + V3 (+ by …)"
      - "Phủ định/câu hỏi: isn't/wasn't + V3; Is/Was + S + V3?"
    explain: "Câu bị động đưa vật hoặc người CHỊU tác động lên làm chủ ngữ. Dùng khi hành động quan trọng hơn người làm, hoặc không biết/không cần nói ai làm: Coffee is grown in Dak Lak. Cấu trúc là to be + phân từ hai (V3): động từ có quy tắc thêm -ed, bất quy tắc dùng cột 3 (built, grown, made, spoken). Muốn nói ai làm thì thêm by + người: The telephone was invented by Bell."
    table:
      - - Chủ động
        - Bị động
      - - They grow coffee in Dak Lak.
        - Coffee is grown in Dak Lak.
      - - Workers built this bridge in 1902.
        - This bridge was built in 1902.
      - - Bell invented the telephone.
        - The telephone was invented by Bell.
    notes:
      - Tiếng Việt dùng được/bị; tiếng Anh không có từ tương ứng — chỉ cần to be + V3. Tôi sinh năm 2000 = I was born in 2000.
      - made of + chất liệu (made of wood), made in + nơi (made in Vietnam), made by + người.
      - Bị động với can/must/should học ở Buổi 43.
    mistakes:
      - wrong: This bridge built in 1902.
        right: This bridge was built in 1902.
        why: Thiếu to be (was).
      - wrong: Coffee is grow in Dak Lak.
        right: Coffee is grown in Dak Lak.
        why: Phải dùng V3 (grown).
      - wrong: English is speaking in many countries.
        right: English is spoken in many countries.
        why: Bị động dùng V3, không dùng V-ing.
      - wrong: The phone was invented from Bell.
        right: The phone was invented by Bell.
        why: Người làm đi sau by.
    examples:
      - b19-001
      - b19-002
      - b19-003
      - b19-006
    provenance:
      - source: egiu
        field: scope
        ref: Unit 21; Appendix 1 (đối chiếu phạm vi, không chép)
