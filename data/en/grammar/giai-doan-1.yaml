# Ngữ pháp Giai đoạn 1 (Buổi 1–20). Nội dung tự viết; BẢN NHÁP chờ người dùng duyệt.
points:
  - id: en-g1-01
    lesson: buoi-01-ban-than-gia-dinh
    title: "Động từ to be & thì hiện tại đơn"
    cefr: null
    structures:
      - "S + am/is/are + danh từ/tính từ"
      - "S + V / V-s, V-es (He/She/It)"
    explain: >-
      Khi phần sau chủ ngữ là danh từ hoặc tính từ (nghề nghiệp, tuổi, tình trạng), dùng to be: I am single.
      Khi nói về hành động hay thói quen, dùng động từ thường: I live with my parents. Với He/She/It, động từ
      thường thêm -s hoặc -es: She lives in Hanoi. Tiếng Việt không có "to be" nên người Việt hay bỏ quên nó.
    table:
      - [Chủ ngữ, Khẳng định, Phủ định, Nghi vấn]
      - [I, am, "am not", "Am I…?"]
      - [He / She / It, is, "is not (isn't)", "Is he/she/it…?"]
      - [We / You / They, are, "are not (aren't)", "Are we/you/they…?"]
    notes:
      - "Phụ âm + y → -ies: study → studies. Tận cùng -s, -sh, -ch, -x, -o → -es: watch → watches, go → goes."
      - "Không dùng to be cùng động từ thường ở hiện tại đơn: I work (không nói I am work)."
    mistakes:
      - { wrong: "She work in a hospital.", right: "She works in a hospital.", why: "Chủ ngữ ngôi 3 số ít, động từ thêm -s." }
      - { wrong: "I happy.", right: "I am happy.", why: "Trước tính từ phải có to be." }
      - { wrong: "I am work as a teacher.", right: "I work as a teacher.", why: "Đã có động từ thường thì không thêm to be." }
    examples: [b01-001, b01-003, b01-007, b01-008]
    source: editorial
    provenance:
      - { source: egiu, field: scope, ref: "Units 1–2 và 5 (đối chiếu phạm vi, không chép)" }
    status: draft
  - id: en-g1-02
    lesson: buoi-02-ngoai-hinh-tinh-cach
    title: Tính từ miêu tả & so sánh hơn
    cefr: null
    structures:
      - S + to be + (very) + tính từ
      - "Tính từ ngắn: S + to be + adj-er + than + N"
      - "Tính từ dài: S + to be + more + adj + than + N"
    explain: "Tính từ đứng trước danh từ (a kind woman) hoặc sau to be (She is kind); tính từ không thêm -s. So sánh hơn: tính từ một âm tiết thêm -er (tall → taller); tính từ hai âm tiết tận cùng -y đổi thành -ier (funny → funnier); tính từ dài dùng more (more patient). Sau đó dùng than + người/vật được so sánh."
    table:
      - - Loại tính từ
        - Quy tắc
        - Ví dụ
      - - 1 âm tiết
        - + er
        - tall → taller, short → shorter
      - - 1 nguyên âm + 1 phụ âm cuối
        - nhân đôi phụ âm + er
        - slim → slimmer, big → bigger
      - - tận cùng -y
        - y → ier
        - funny → funnier, lazy → lazier
      - - 2 âm tiết trở lên
        - more + tính từ
        - more patient, more confident
      - - Bất quy tắc
        - đổi hẳn
        - good → better, bad → worse
    notes:
      - "Tính từ đứng TRƯỚC danh từ, ngược tiếng Việt: long hair (tóc dài), a tall man (một người đàn ông cao)."
      - "Tính từ không có số nhiều: They are kind (không nói *kinds*)."
    mistakes:
      - wrong: My brother is more taller than me.
        right: My brother is taller than me.
        why: Đã có -er thì không thêm more.
      - wrong: She is patienter than her sister.
        right: She is more patient than her sister.
        why: Tính từ dài dùng more, không thêm -er.
      - wrong: He is taller his father.
        right: He is taller than his father.
        why: Thiếu than khi có đối tượng so sánh.
      - wrong: She has hair long.
        right: She has long hair.
        why: Tính từ đứng trước danh từ.
    examples:
      - b02-001
      - b02-002
      - b02-003
      - b02-004
    provenance:
      - source: egiu
        field: scope
        ref: Units 85, 87, 88 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-03
    lesson: buoi-03-nha-cua-do-dac
    title: There is / There are & giới từ nơi chốn
    cefr: null
    structures:
      - There is + a/an + danh từ số ít (+ nơi chốn)
      - There are + danh từ số nhiều (+ nơi chốn)
      - Is there…? / Are there…? — Yes, there is. / No, there aren't.
      - "S + to be + giới từ + nơi chốn: The cat is under the bed."
    explain: "Muốn nói \"ở đâu đó CÓ cái gì\", tiếng Anh dùng There is (một vật) hoặc There are (nhiều vật), không dùng have. Phủ định: There isn't / There aren't; câu hỏi đảo is/are lên trước there. Muốn nói vật ở đâu, dùng to be + giới từ: in (trong), on (trên, có tiếp xúc), under (dưới), next to (cạnh), between (giữa), behind (sau), in front of (trước), opposite (đối diện)."
    table:
      - - ""
        - Số ít
        - Số nhiều
      - - Khẳng định
        - There is (There's) a sofa.
        - There are two chairs.
      - - Phủ định
        - There isn't a garden.
        - There aren't any shelves.
      - - Câu hỏi
        - Is there a balcony?
        - Are there two bedrooms?
    notes:
      - "Chọn is/are theo danh từ ĐẦU TIÊN sau nó: There is a table and two chairs."
      - Tầng nhà dùng on (on the second floor); trong phòng dùng in (in the kitchen).
    mistakes:
      - wrong: In my room have a big bed.
        right: There is a big bed in my room.
        why: Dịch từ 'trong phòng tôi có…' — tiếng Anh dùng There is, không dùng have.
      - wrong: There is two bedrooms.
        right: There are two bedrooms.
        why: Danh từ số nhiều dùng are.
      - wrong: The fridge is next the window.
        right: The fridge is next to the window.
        why: next to luôn đi với to.
      - wrong: My apartment is in the third floor.
        right: My apartment is on the third floor.
        why: Tầng nhà dùng on.
    examples:
      - b03-001
      - b03-002
      - b03-003
      - b03-004
      - b03-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 37, 106, 107, 109 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-04
    lesson: buoi-04-so-ngay-thang-thoi-gian
    title: Giới từ thời gian in / on / at & cách đọc ngày giờ
    cefr: null
    structures:
      - "at + giờ / midnight / night: at 7 o'clock, at midnight"
      - "on + thứ / ngày cụ thể: on Monday, on 5th May, on my birthday"
      - "in + tháng / năm / mùa / buổi: in June, in 2026, in the morning"
    explain: 'Mẹo nhớ theo độ dài thời gian: at cho thời điểm ngắn nhất (giờ), on cho một ngày, in cho khoảng dài (tháng, năm, mùa, buổi trong ngày). Ngày viết 5th May hoặc 5 May nhưng đọc là "the fifth of May" — dùng số thứ tự. Năm 2026 đọc "twenty twenty-six". Giờ: 7:30 = half past seven, 7:15 = a quarter past seven, 7:45 = a quarter to eight; hoặc đọc thẳng số: seven forty-five.'
    table:
      - - Giới từ
        - Dùng với
        - Ví dụ
      - - at
        - giờ, midnight, night
        - at 6:30, at night
      - - on
        - thứ, ngày, ngày lễ cụ thể
        - on Sunday, on 2nd September
      - - in
        - tháng, năm, mùa, buổi
        - in March, in 1999, in the evening
    notes:
      - "Không dùng giới từ trước this / next / last / every: next week, every morning (không nói *in next week*)."
      - in the morning nhưng on Monday morning (có thứ cụ thể → on).
    mistakes:
      - wrong: I have English class in Monday.
        right: I have English class on Monday.
        why: Thứ trong tuần dùng on.
      - wrong: She gets up at the morning.
        right: She gets up in the morning.
        why: Buổi trong ngày dùng in the…
      - wrong: My birthday is in 12th June.
        right: My birthday is on 12th June.
        why: Ngày cụ thể dùng on.
      - wrong: We visit my grandparents in every weekend.
        right: We visit my grandparents every weekend.
        why: Trước every không dùng giới từ.
    examples:
      - b04-001
      - b04-002
      - b04-003
      - b04-004
      - b04-005
    provenance:
      - source: egiu
        field: scope
        ref: Units 103, 104; What time…? Unit 47 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-05
    lesson: buoi-05-hoat-dong-hang-ngay
    title: Hiện tại đơn (phủ định, câu hỏi) & trạng từ tần suất
    cefr: null
    structures:
      - S + don't / doesn't + V (nguyên mẫu)
      - Do / Does + S + V (nguyên mẫu)…? — Yes, I do. / No, she doesn't.
      - S + always/usually/often/sometimes/rarely/never + V
      - S + to be + always/usually/… (sau to be)
      - How often…? — once / twice / three times a day/week
    explain: "Hiện tại đơn diễn tả thói quen, việc lặp lại. Câu phủ định và câu hỏi cần trợ động từ do/does; khi đã có does thì động từ chính trở về nguyên mẫu (She doesn't work, Does she work?). Trạng từ tần suất đứng TRƯỚC động từ thường nhưng SAU to be: I always get up early / She is always late. Hỏi mức độ thường xuyên dùng How often."
    table:
      - - ""
        - I / You / We / They
        - He / She / It
      - - Khẳng định
        - I work.
        - She works.
      - - Phủ định
        - I don't work.
        - She doesn't work.
      - - Câu hỏi
        - Do you work?
        - Does she work?
      - - Trả lời ngắn
        - Yes, I do. / No, I don't.
        - Yes, she does. / No, she doesn't.
    notes:
      - "Đọc đuôi -s: /s/ sau âm vô thanh (works, cooks), /z/ sau âm hữu thanh (goes, plays), /ɪz/ sau s, sh, ch, x (watches, relaxes)."
      - never / rarely đã mang nghĩa phủ định — không thêm don't/doesn't.
    mistakes:
      - wrong: She don't like coffee.
        right: She doesn't like coffee.
        why: He/She/It dùng doesn't.
      - wrong: Does he works on Sunday?
        right: Does he work on Sunday?
        why: Có does rồi thì động từ về nguyên mẫu.
      - wrong: I go always to the gym.
        right: I always go to the gym.
        why: Trạng từ tần suất đứng trước động từ thường.
      - wrong: He always is late.
        right: He is always late.
        why: Với to be, trạng từ đứng sau.
      - wrong: I don't never eat meat.
        right: I never eat meat.
        why: Tiếng Anh không dùng hai phủ định.
    examples:
      - b05-001
      - b05-002
      - b05-003
      - b05-004
      - b05-005
      - b05-006
    provenance:
      - source: egiu
        field: scope
        ref: Units 5, 6, 7, 94 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-06
    lesson: buoi-06-truong-hoc-mon-hoc
    title: Thì hiện tại tiếp diễn
    structures:
      - S + am/is/are + V-ing
      - S + am/is/are + not + V-ing
      - Am/Is/Are + S + V-ing?
    explain: 'Dùng để nói về việc đang xảy ra ngay lúc nói (now, at the moment, right now, Look!, Listen!) hoặc quanh thời điểm hiện tại (this week, today). Luôn cần đủ HAI phần: to be (am/is/are) và động từ thêm -ing. Tiếng Việt chỉ cần thêm "đang", nên người Việt hay quên to be hoặc quên -ing.'
    table:
      - - Động từ
        - Quy tắc thêm -ing
        - Ví dụ
      - - Thông thường
        - + ing
        - study → studying, read → reading
      - - Tận cùng -e
        - bỏ e + ing
        - write → writing, revise → revising
      - - 1 nguyên âm + 1 phụ âm (1 âm tiết)
        - nhân đôi phụ âm + ing
        - sit → sitting, swim → swimming
      - - Tận cùng -ie
        - ie → y + ing
        - lie → lying, die → dying
    notes:
      - "Câu trả lời ngắn: Are you studying? — Yes, I am. / No, I'm not."
      - "Thường viết tắt khi nói: I'm, she's, they're, isn't, aren't."
    mistakes:
      - wrong: I studying English now.
        right: I am studying English now.
        why: Thiếu to be (am).
      - wrong: She is study in the library.
        right: She is studying in the library.
        why: Thiếu -ing.
      - wrong: They are siting in the classroom.
        right: They are sitting in the classroom.
        why: "sit: 1 nguyên âm + 1 phụ âm → nhân đôi t."
      - wrong: Is you doing your homework?
        right: Are you doing your homework?
        why: Chủ ngữ you đi với are.
    examples:
      - b06-001
      - b06-002
      - b06-003
      - b06-004
    provenance:
      - source: egiu
        field: scope
        ref: Units 3, 4 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-11
    lesson: buoi-11-thoi-tiet-mua
    title: Tính từ + giới từ cố định
    cefr: null
    structures:
      - S + to be + tính từ + giới từ + danh từ / V-ing
      - afraid of · interested in · good at · worried about · famous for · different from · similar to · tired of
    explain: "Nhiều tính từ luôn đi với một giới từ nhất định, và giới từ này thường KHÔNG giống cách nói tiếng Việt (\"giỏi VỀ\" nhưng good AT, \"khác VỚI\" nhưng different FROM). Cách học: học cả cụm như một từ. Sau giới từ dùng danh từ hoặc động từ thêm -ing: She is good at cooking. Khi nói thời tiết, dùng It is + tính từ: It's sunny, It's humid."
    table:
      - - Cụm
        - Nghĩa
        - Ví dụ
      - - afraid of
        - sợ
        - I'm afraid of storms.
      - - interested in
        - quan tâm
        - He is interested in the weather forecast.
      - - good at
        - giỏi
        - She is good at English.
      - - worried about
        - lo lắng về
        - We are worried about the typhoon.
      - - famous for
        - nổi tiếng về
        - Da Lat is famous for its flowers.
      - - different from
        - khác với
        - The weather here is different from Hanoi.
    notes:
      - "Thời tiết: It's + tính từ (It's windy) hoặc It's + V-ing (It's raining). Không dùng The weather is rain."
      - "Sau giới từ, động từ thêm -ing: afraid of flying, good at swimming."
    mistakes:
      - wrong: I am good in English.
        right: I am good at English.
        why: good at, dịch 'giỏi về' dễ chọn nhầm in/about.
      - wrong: Her hometown is different with mine.
        right: Her hometown is different from mine.
        why: different from, không dùng with.
      - wrong: He is interested about music.
        right: He is interested in music.
        why: interested in.
      - wrong: Today is very rain.
        right: It's raining a lot today.
        why: rain là danh từ/động từ; dùng It's raining hoặc It's rainy.
    examples:
      - b11-001
      - b11-002
      - b11-003
      - b11-004
      - b11-005
    provenance:
      - source: egiu
        field: scope
        ref: Unit 112 (đối chiếu phạm vi, không chép)
    source: editorial
    status: draft
  - id: en-g1-07
    lesson: buoi-07-cong-viec-nghe-nghiep
    title: Hiện tại đơn và hiện tại tiếp diễn
    structures:
      - "Thói quen, sự thật, công việc cố định: S + V(s/es)"
      - "Đang xảy ra lúc nói hoặc tạm thời: S + am/is/are + V-ing"
      - Động từ trạng thái (like, love, want, need, know, understand) → chỉ dùng hiện tại đơn
    explain: "Hiện tại đơn nói về điều lặp lại hoặc lâu dài: công việc, thói quen, sự thật (She works in a bank). Hiện tại tiếp diễn nói về việc đang diễn ra hoặc chỉ tạm thời trong khoảng này (This week she is working from home). Một số động từ chỉ trạng thái, cảm xúc, suy nghĩ như like, want, need, know, understand không dùng ở dạng -ing dù đang nói về lúc này."
    table:
      - - Hiện tại đơn
        - Hiện tại tiếp diễn
      - - always, usually, often, every day
        - now, at the moment, today, this week
      - - What do you do? (Bạn làm nghề gì?)
        - What are you doing? (Bạn đang làm gì?)
      - - I work in an office.
        - I'm working from home this week.
    notes:
      - What do you do? là câu hỏi về NGHỀ NGHIỆP, không phải việc đang làm.
      - "Động từ trạng thái: I know him (không nói *I am knowing him*)."
    mistakes:
      - wrong: I am knowing the answer.
        right: I know the answer.
        why: know là động từ trạng thái, không dùng -ing.
      - wrong: Listen! My sister sings.
        right: Listen! My sister is singing.
        why: Listen! báo hiệu việc đang xảy ra → tiếp diễn.
      - wrong: I am usually going to work at eight.
        right: I usually go to work at eight.
        why: Thói quen (usually) → hiện tại đơn.
      - wrong: What are you doing? — I'm a nurse.
        right: What do you do? — I'm a nurse.
        why: Hỏi nghề nghiệp dùng What do you do?
    examples:
      - b07-001
      - b07-002
      - b07-004
      - b07-006
    provenance:
      - source: egiu
        field: scope
        ref: Unit 8 (đối chiếu phạm vi, không chép)
    cefr: null
    source: editorial
    status: draft
  - id: en-g1-12
    lesson: buoi-12-suc-khoe-benh-tat
    title: should / must / have to — lời khuyên và nghĩa vụ
    cefr: null
    structures:
      - S + should / shouldn't + V (lời khuyên)
      - S + must / mustn't + V (bắt buộc / cấm — người nói thấy cần)
      - S + have to / has to + V (phải — do quy định, hoàn cảnh)
      - S + don't / doesn't have to + V (không cần phải)
    explain: "should = nên (khuyên). must = phải, thường là ý kiến của chính người nói hoặc biển báo, luật lệ; have to = phải vì hoàn cảnh bên ngoài (công việc, quy định). Sau should và must dùng V nguyên mẫu, không có to, không thêm -s. Cẩn thận: mustn't = CẤM, còn don't have to = KHÔNG CẦN — nghĩa rất khác nhau."
    table:
      - - Cấu trúc
        - Nghĩa
        - Ví dụ
      - - should
        - nên
        - You should drink more water.
      - - shouldn't
        - không nên
        - You shouldn't stay up late.
      - - must
        - phải (bắt buộc)
        - You must take this medicine twice a day.
      - - mustn't
        - cấm
        - You mustn't smoke in the hospital.
      - - have to / has to
        - phải (do hoàn cảnh)
        - She has to work on Saturday.
      - - don't have to
        - không cần
        - You don't have to come tomorrow.
    notes:
      - "Câu hỏi: Should I…? / Do I have to…? (have to cần do/does)."
      - Quá khứ của must/have to đều là had to (học ở Buổi 13–14).
    mistakes:
      - wrong: You should to see a doctor.
        right: You should see a doctor.
        why: Sau should không có to.
      - wrong: She musts take medicine.
        right: She must take medicine.
        why: must không thêm -s.
      - wrong: He have to work late.
        right: He has to work late.
        why: "have to chia theo ngôi: he has to."
      - wrong: You mustn't pay. It's free.
        right: You don't have to pay. It's free.
        why: Miễn phí = không cần trả (don't have to), không phải bị cấm.
    examples:
      - b12-001
      - b12-002
      - b12-003
      - b12-004
      - b12-005
