# Câu xuất hiện lần đầu ở Buổi 11. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b11-001, text: My little brother is afraid of storms., vi: Em trai tôi sợ bão., words: [ afraid-of|colloc, storm|n ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-002, text: Da Lat is famous for its cool weather., vi: Đà Lạt nổi tiếng với thời tiết mát mẻ., words: [ famous-for|colloc, weather|n ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-003, text: The weather in Hanoi is different from the weather in Ho Chi Minh City., vi: Thời tiết ở Hà Nội khác với thời tiết ở TP Hồ Chí Minh., words: [ different-from|colloc, weather|n ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-004, text: My father is interested in the weather forecast., vi: Bố tôi quan tâm đến dự báo thời tiết., words: [ interested-in|colloc, forecast|n ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-005, text: Farmers are worried about the rainy season., vi: Nông dân lo lắng về mùa mưa., words: [ worried-about|colloc, rainy|adj, season|n ], grammar: [ en-g1-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-006, text: "It's sunny today, but it's very humid.", vi: Hôm nay trời nắng nhưng rất oi ẩm., words: [ sunny|adj, humid|adj ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-007, text: "In winter, the temperature in Sa Pa is sometimes below zero degrees.", vi: "Mùa đông, nhiệt độ ở Sa Pa đôi khi dưới không độ.", words: [ winter|n, temperature|n, degree|n, sometimes|adv ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-008, text: She is good at taking photos of the sky., vi: Cô ấy chụp ảnh bầu trời rất giỏi., words: [ good-at|colloc ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-009, text: It's cloudy and windy this afternoon., vi: Chiều nay trời nhiều mây và gió., words: [ cloudy|adj, windy|adj, afternoon|n ], grammar: [ en-g1-11 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-010, text: "It's freezing outside, so wear a warm coat.", vi: "Ngoài trời lạnh cóng, mặc áo khoác ấm vào.", words: [ freezing|adj ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-011, text: Autumn is my favourite season in Hanoi., vi: Mùa thu là mùa tôi thích nhất ở Hà Nội., words: [ autumn|n, season|n ], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-012, text: "It's windy and cold today, so wear a coat.", vi: "Hôm nay trời gió và lạnh, mặc áo khoác vào.", words: [ windy|adj, coat|n ], grammar: [ en-g1-29 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-013, text: It's about 10 km from my house to the beach., vi: Từ nhà tôi ra biển khoảng 10 cây số., words: [ beach|n ], grammar: [ en-g1-29 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-014, text: It takes me twenty minutes to get to work., vi: Tôi mất hai mươi phút để đến chỗ làm., words: [], grammar: [ en-g1-29 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-015, text: Dogs and cats are the most popular pets in Vietnam., vi: Chó và mèo là những thú cưng phổ biến nhất ở Việt Nam., words: [ dog|n, cat|n ], grammar: [ en-g1-09 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-016, text: "In the countryside, you can see cows and horses in the fields.", vi: "Ở nông thôn, bạn có thể thấy bò và ngựa trên cánh đồng.", words: [ cow|n, horse|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-017, text: Many birds fly south in autumn., vi: Nhiều loài chim bay về phương nam vào mùa thu., words: [ bird|n, autumn|n, south|n ], grammar: [ en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-018, text: My little sister is afraid of spiders., vi: Em gái tôi sợ nhện., words: [ spider|n, afraid-of|colloc ], grammar: [ en-g1-11 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-019, text: Dolphins are very clever animals., vi: Cá heo là loài vật rất thông minh., words: [ dolphin|n, animal|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-020, text: Bears sleep for a long time in winter., vi: Gấu ngủ rất lâu vào mùa đông., words: [ bear|n, winter|n ], grammar: [ en-g1-25 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b11-021, text: My son has a white rabbit., vi: Con trai tôi nuôi một con thỏ trắng., words: [ rabbit|n, son|n ], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
