# Câu xuất hiện lần đầu ở Buổi 58. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b58-001, text: Never have consumers had so much choice as they do today., vi: Chưa bao giờ người tiêu dùng có nhiều lựa chọn như ngày nay., words: [ consumer|n ], grammar: [ en-g3-13 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-002, text: Rarely do shoppers read the terms and conditions before they purchase something online., vi: Hiếm khi người mua đọc điều khoản trước khi mua gì đó trên mạng., words: [ purchase|v ], grammar: [ en-g3-13 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-003, text: "Not only does e-commerce save time, but it also encourages impulse buying.", vi: Thương mại điện tử không chỉ tiết kiệm thời gian mà còn khuyến khích mua sắm bốc đồng., words: [ e-commerce|n, impulse-buying|phr-n ], grammar: [ en-g3-13 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-004, text: Only when inflation rises do many families start to live more frugally., vi: Chỉ khi lạm phát tăng thì nhiều gia đình mới bắt đầu sống tiết kiệm hơn., words: [ inflation|n, frugal|adj ], grammar: [ en-g3-13 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-005, text: Seldom do young people think about debt when they take out a loan., vi: Người trẻ hiếm khi nghĩ đến nợ nần khi họ vay tiền., words: [ seldom|adv, debt|n, loan|n ], grammar: [ en-g3-13 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-006, text: The rise of consumerism has made society more materialistic., vi: Sự trỗi dậy của chủ nghĩa tiêu dùng khiến xã hội trở nên thực dụng hơn., words: [ consumerism|n, materialistic|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-007, text: "As disposable income rises, people spend more on luxury goods.", vi: "Khi thu nhập khả dụng tăng, người ta chi nhiều hơn cho hàng xa xỉ.", words: [ disposable-income|phr-n, luxury-goods|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-008, text: "For many young people, the latest phone is a status symbol.", vi: "Với nhiều người trẻ, chiếc điện thoại mới nhất là biểu tượng địa vị.", words: [ status-symbol|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-009, text: "During the recession, many retailers closed their shops.", vi: "Trong thời kỳ suy thoái, nhiều nhà bán lẻ đã đóng cửa hàng.", words: [ recession|n, retailer|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-010, text: "I splashed out on a new laptop, and now I'm buying second-hand clothes to save money.", vi: "Tôi đã chi mạnh tay mua laptop mới, và giờ tôi mua quần áo cũ để tiết kiệm.", words: [ splash-out|phr-v, second-hand|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b58-011, text: "Online shopping offers instant gratification, which makes it hard to resist.", vi: "Mua sắm trực tuyến mang lại sự thỏa mãn tức thì, khiến người ta khó cưỡng lại.", words: [ instant-gratification|phr-n ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
