# Câu xuất hiện lần đầu ở Buổi 45. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b45-001, text: "If the government invests more in renewable energy, air pollution will be reduced.", vi: "Nếu chính phủ đầu tư nhiều hơn vào năng lượng tái tạo, ô nhiễm không khí sẽ giảm.", words: [ invest|v, renewable-energy|phr-n ], grammar: [ en-g2-11, en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-002, text: "Although globalisation has created jobs, it has also led to cultural homogenisation.", vi: "Mặc dù toàn cầu hóa đã tạo ra việc làm, nó cũng dẫn đến sự đồng nhất hóa văn hóa.", words: [ globalisation|n, lead-to|phr-v, cultural-homogenisation|phr-n ], grammar: [ en-g2-17, en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-003, text: Teenagers who spend too much screen time may give in to peer pressure more easily., vi: Thanh thiếu niên dành quá nhiều thời gian cho màn hình có thể dễ khuất phục áp lực bạn bè hơn., words: [ screen-time|phr-n, peer-pressure|phr-n ], grammar: [ en-g2-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-004, text: The report said that misinformation had spread faster than the truth., vi: Báo cáo nói rằng thông tin sai lệch đã lan nhanh hơn sự thật., words: [ misinformation|n, spread|v ], grammar: [ en-g2-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-005, text: Many graduates do internships in order to improve their job security., vi: Nhiều sinh viên tốt nghiệp đi thực tập để tăng sự ổn định trong công việc., words: [ internship|n, job-security|phr-n ], grammar: [ en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-006, text: Old buildings in the city centre should be restored so as to preserve our cultural heritage., vi: Các công trình cũ ở trung tâm nên được trùng tu để bảo tồn di sản văn hóa., words: [ restore|v, preserve|v, cultural-heritage|phr-n ], grammar: [ en-g2-23, en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-007, text: Rapid urbanisation has resulted in overcrowded cities and a lack of green space., vi: Đô thị hóa nhanh đã dẫn đến các thành phố quá đông đúc và thiếu mảng xanh., words: [ urbanisation|n, result-in|phr-v, overcrowded|adj, green-space|phr-n ], grammar: [ en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b45-008, text: "When it comes to reducing crime, I believe education is more effective than harsh punishments.", vi: "Khi nói đến giảm tội phạm, tôi tin rằng giáo dục hiệu quả hơn hình phạt nghiêm khắc.", words: [ effective|adj, harsh|adj, punishment|n ], grammar: [ en-g2-20 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
