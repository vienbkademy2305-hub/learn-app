# Câu xuất hiện lần đầu ở Buổi 65. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b65-001, text: "The essay addresses all parts of the task, but some ideas are underdeveloped.", vi: "Bài luận trả lời đủ các phần của đề, nhưng một số ý chưa được phát triển đầy đủ.", words: [ underdeveloped|adj ], grammar: [ en-g3-20 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-002, text: What lowers the score for coherence is the lack of clear topic sentences., vi: Điều làm giảm điểm mạch lạc là thiếu câu chủ đề rõ ràng., words: [ coherence|n ], grammar: [ en-g3-20, en-g3-09 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-003, text: "Having checked the band descriptors, I realised my overview was missing.", vi: "Sau khi xem bảng mô tả band, tôi nhận ra bài mình thiếu đoạn tổng quan.", words: [ band-descriptor|phr-n, overview|n ], grammar: [ en-g3-20, en-g3-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-004, text: "If I had removed the irrelevant details, I would have had more time to develop my ideas.", vi: Nếu tôi bỏ các chi tiết lạc đề thì đã có thêm thời gian phát triển ý., words: [ irrelevant|adj ], grammar: [ en-g3-20, en-g3-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-005, text: Task response and coherence are usually the easiest criteria to improve quickly., vi: Hoàn thành yêu cầu đề và mạch lạc thường là hai tiêu chí dễ cải thiện nhanh nhất., words: [ task-response|phr-n, coherence|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-006, text: Overusing linking words can actually weaken cohesion., vi: Lạm dụng từ nối thực ra có thể làm yếu tính liên kết., words: [ cohesion|n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-007, text: "Lexical resource depends on precise word choice, not on rare words.", vi: "Vốn từ vựng phụ thuộc vào việc chọn từ chính xác, không phải từ hiếm.", words: [ lexical-resource|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b65-008, text: Grammatical range and accuracy are scored together as one criterion., vi: Độ đa dạng và độ chính xác ngữ pháp được chấm chung thành một tiêu chí., words: [ grammatical-range|phr-n, accuracy|n ], grammar: [ en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
