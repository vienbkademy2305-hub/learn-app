  - { id: b26-003, text: Sales of e-books increased by 15% in 2021., vi: Doanh số sách điện tử tăng 15% vào năm 2021., words: [ increase|v ], grammar: [ en-g2-06 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b26-004, text: The figure reached a peak of 60% in 2019 and then fell slightly., vi: Con số đạt đỉnh 60% năm 2019 rồi giảm nhẹ., words: [ figure|n, reach-a-peak|colloc, fall|v, slightly|adv ], grammar: [ en-g2-06 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
