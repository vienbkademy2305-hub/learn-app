  - { id: b26-007, text: The number of TV viewers remained stable at around 20 million., vi: Số người xem TV giữ ổn định ở khoảng 20 triệu., words: [ remain-stable|colloc ], grammar: [ en-g2-06 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b26-008, text: The line graph shows how many people used social media from 2010 to 2020., vi: Biểu đồ đường cho thấy có bao nhiêu người dùng mạng xã hội từ 2010 đến 2020., words: [ line-graph|phr-n, social-media|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b26-009, text: "Overall, the proportion of older people using the internet grew over the period.", vi: "Nhìn chung, tỉ lệ người lớn tuổi dùng internet tăng trong suốt giai đoạn.", words: [ overall|adv, proportion|n, period|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
