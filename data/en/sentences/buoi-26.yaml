# Câu xuất hiện lần đầu ở Buổi 26. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b26-001, text: The number of online shoppers rose sharply between 2015 and 2020., vi: Số người mua sắm trực tuyến tăng mạnh từ năm 2015 đến 2020., words: [ rise|v, sharply|adv ], grammar: [ en-g2-06 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
