# Câu xuất hiện lần đầu ở Buổi 36. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b36-001, text: "Apart from the traffic, I really enjoy living in the city centre.", vi: "Ngoài chuyện giao thông ra, tôi thật sự thích sống ở trung tâm thành phố.", words: [ apart-from|prep, city-centre|phr-n ], grammar: [ en-g2-16 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-002, text: My district has lots of cafés as well as a big shopping mall., vi: Quận của tôi có nhiều quán cà phê cũng như một trung tâm thương mại lớn., words: [ district|n, as-well-as|prep, shopping-mall|phr-n ], grammar: [ en-g2-16 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-003, text: "To be honest, I don't go to the nightclubs. I prefer quiet places.", vi: "Thật lòng mà nói, tôi không đi hộp đêm. Tôi thích những nơi yên tĩnh hơn.", words: [ to-be-honest|idiom ], grammar: [ en-g2-16 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-004, text: "People think Hanoi is very old, but actually some areas are very modern.", vi: "Mọi người nghĩ Hà Nội rất cổ kính, nhưng thật ra có những khu rất hiện đại.", words: [ actually|adv, modern|adj ], grammar: [ en-g2-16 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-005, text: Ho Chi Minh City is a vibrant city with exciting nightlife., vi: Thành phố Hồ Chí Minh là một thành phố sôi động với cuộc sống về đêm hấp dẫn., words: [ vibrant|adj, nightlife|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-006, text: The old quarter is famous for its street food and lively atmosphere., vi: Phố cổ nổi tiếng với đồ ăn đường phố và không khí náo nhiệt., words: [ street-food|phr-n, lively|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-007, text: "On weekend evenings, the street around the lake becomes a pedestrian zone.", vi: "Vào tối cuối tuần, con phố quanh hồ trở thành khu đi bộ.", words: [ pedestrian|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-008, text: My flat is within walking distance of a park and a supermarket., vi: Căn hộ của tôi cách công viên và siêu thị một quãng đi bộ., words: [ walking-distance|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-009, text: "It is easy to get around the city by motorbike, but it can be dangerous.", vi: "Đi lại trong thành phố bằng xe máy rất tiện, nhưng có thể nguy hiểm.", words: [ get-around|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-010, text: Many people move to the suburbs to escape the hustle and bustle of the city., vi: Nhiều người chuyển ra ngoại ô để thoát khỏi sự hối hả của thành phố., words: [ hustle-and-bustle|idiom, suburb|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-011, text: "Good local amenities, such as parks and hospitals, improve the quality of life.", vi: "Những tiện ích địa phương tốt, như công viên và bệnh viện, nâng cao chất lượng cuộc sống.", words: [ amenity|n, quality-of-life|phr-n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b36-012, text: "The new park is spacious and green. Besides, it's free for everyone.", vi: "Công viên mới rộng rãi và xanh mát. Hơn nữa, nó miễn phí cho mọi người.", words: [ spacious|adj, besides|adv ], grammar: [ en-g2-16 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
