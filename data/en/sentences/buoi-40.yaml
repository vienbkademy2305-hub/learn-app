# Câu xuất hiện lần đầu ở Buổi 40. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b40-001, text: "When it comes to youth unemployment, I think the main problem is a lack of practical skills.", vi: "Nói về tình trạng thất nghiệp ở người trẻ, tôi nghĩ vấn đề chính là thiếu kỹ năng thực tế.", words: [ unemployment|n ], grammar: [ en-g2-20 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-002, text: "As for automation, some jobs will be replaced by machines, but new jobs will appear.", vi: "Còn về tự động hóa, một số công việc sẽ bị máy móc thay thế, nhưng những công việc mới sẽ xuất hiện.", words: [ automation|n, replace|v ], grammar: [ en-g2-20, en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-003, text: "In terms of reducing poverty, the government should invest in education.", vi: "Về việc giảm nghèo, chính phủ nên đầu tư vào giáo dục.", words: [ poverty|n, invest|v ], grammar: [ en-g2-20 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-004, text: "When it comes to choosing a career, job security matters more to my parents than to me.", vi: "Khi chọn nghề, sự ổn định công việc quan trọng với bố mẹ tôi hơn là với tôi.", words: [ job-security|phr-n ], grammar: [ en-g2-20 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-005, text: "Rapid economic growth has created many jobs, but income inequality has also increased.", vi: "Tăng trưởng kinh tế nhanh đã tạo ra nhiều việc làm, nhưng bất bình đẳng thu nhập cũng tăng lên.", words: [ economic-growth|phr-n, income-inequality|phr-n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-006, text: Many people believe the minimum wage should be raised because the cost of living is rising., vi: Nhiều người cho rằng lương tối thiểu nên được tăng vì chi phí sinh hoạt đang tăng., words: [ minimum-wage|phr-n, cost-of-living|phr-n ], grammar: [ en-g2-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-007, text: Vietnam's economy depends a lot on the manufacturing industry., vi: Nền kinh tế Việt Nam phụ thuộc nhiều vào ngành công nghiệp sản xuất., words: [ economy|n, industry|n, depend-on|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-008, text: "Skilled workers can find jobs more easily, especially in the IT industry.", vi: "Lao động có tay nghề tìm việc dễ hơn, nhất là trong ngành công nghệ thông tin.", words: [ skilled|adj, industry|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-009, text: "If factory workers lose their jobs, the government should help them retrain.", vi: "Nếu công nhân nhà máy mất việc, chính phủ nên giúp họ đào tạo lại.", words: [ retrain|v ], grammar: [ en-g2-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-010, text: Lifelong learning is necessary because in-demand skills change very quickly., vi: Học tập suốt đời là cần thiết vì những kỹ năng được săn đón thay đổi rất nhanh., words: [ lifelong-learning|phr-n, in-demand|adj ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-011, text: Young people today want flexible jobs rather than a job for life., vi: Người trẻ ngày nay muốn công việc linh hoạt hơn là một công việc suốt đời., words: [ flexible|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b40-012, text: Women now make up almost half of the workforce in many wealthy countries., vi: Phụ nữ hiện chiếm gần một nửa lực lượng lao động ở nhiều nước giàu., words: [ workforce|n, wealthy|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
