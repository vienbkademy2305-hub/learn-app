# Câu xuất hiện lần đầu ở Buổi 27. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b27-001, text: "The gym is at the end of the corridor, on the left.", vi: "Phòng gym ở cuối hành lang, bên trái.", words: [ gym|n ], grammar: [ en-g2-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-002, text: The swimming pool is directly opposite the changing rooms., vi: Bể bơi ở ngay đối diện phòng thay đồ., words: [ swimming-pool|phr-n, changing-room|phr-n, opposite|prep ], grammar: [ en-g2-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-003, text: The tennis courts are in the north of the park., vi: Các sân tennis nằm ở phía bắc công viên., words: [ court|n ], grammar: [ en-g2-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-004, text: The car park is to the south of the sports centre., vi: Bãi đỗ xe nằm về phía nam của trung tâm thể thao., words: [ car-park|phr-n ], grammar: [ en-g2-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-005, text: Please sign in at reception before you use the facilities., vi: Vui lòng đăng ký ở quầy lễ tân trước khi dùng các tiện ích., words: [ reception|n, facility|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-006, text: I work out at the gym three times a week., vi: Tôi tập gym ba lần một tuần., words: [ work-out|phr-v, gym|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-007, text: "Always stretch before you run, or you may pull a muscle.", vi: "Luôn giãn cơ trước khi chạy, nếu không bạn có thể bị căng cơ.", words: [ stretch|v, muscle|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-008, text: He has had a knee injury since last month., vi: Anh ấy bị chấn thương đầu gối từ tháng trước., words: [ injury|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-009, text: The first aid room is just past the main entrance., vi: Phòng sơ cứu ở ngay sau lối vào chính., words: [ first-aid|phr-n, entrance|n ], grammar: [ en-g2-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-010, text: Doctors say adults need at least 150 minutes of physical activity a week., vi: Bác sĩ nói người lớn cần ít nhất 150 phút vận động mỗi tuần., words: [ physical-activity|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-011, text: The referee stopped the match because of the rain., vi: Trọng tài dừng trận đấu vì trời mưa., words: [ referee|n, match|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-012, text: The running track goes round the football pitch., vi: Đường chạy chạy vòng quanh sân bóng đá., words: [ running-track|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b27-013, text: Our company offers free fitness classes on Friday evenings., vi: Công ty chúng tôi có lớp thể dục miễn phí vào tối thứ Sáu., words: [ fitness|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
