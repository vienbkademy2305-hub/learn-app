# Câu xuất hiện lần đầu ở Buổi 44. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b44-001, text: Spending too much time on screens can lead to sleep problems., vi: Dành quá nhiều thời gian cho màn hình có thể dẫn đến các vấn đề về giấc ngủ., words: [ lead-to|phr-v, problem|n ], grammar: [ en-g2-24 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-002, text: Traffic congestion is mainly caused by the large number of private vehicles., vi: Ùn tắc giao thông chủ yếu do số lượng lớn phương tiện cá nhân gây ra., words: [ cause|n, traffic-congestion|phr-n ], grammar: [ en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-003, text: One solution is to give people incentives to use public transport., vi: Một giải pháp là khuyến khích người dân dùng phương tiện công cộng., words: [ solution|n, incentive|n, public-transport|phr-n ], grammar: [ en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-004, text: This problem can be tackled by building more affordable housing., vi: Vấn đề này có thể được giải quyết bằng cách xây thêm nhà ở giá phải chăng., words: [ tackle|v, housing|n ], grammar: [ en-g2-24, en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-005, text: Rising rents have resulted in many young people living with their parents longer., vi: Tiền thuê nhà tăng đã khiến nhiều người trẻ sống cùng bố mẹ lâu hơn., words: [ result-in|phr-v, rent|n ], grammar: [ en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-006, text: Air pollution is a serious issue with long-term consequences for children's health., vi: Ô nhiễm không khí là một vấn đề nghiêm trọng với hậu quả lâu dài cho sức khỏe trẻ em., words: [ issue|n, long-term|adj, consequence|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-007, text: The government should make road safety a top priority., vi: Chính phủ nên coi an toàn giao thông là ưu tiên hàng đầu., words: [ priority|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-008, text: A national campaign could raise awareness of the dangers of drink-driving., vi: Một chiến dịch toàn quốc có thể nâng cao nhận thức về nguy hiểm của việc lái xe khi say rượu., words: [ campaign|n, raise-awareness|colloc ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-009, text: Heavy penalties are effective only if the law is enforced., vi: Hình phạt nặng chỉ hiệu quả nếu luật được thực thi., words: [ penalty|n, effective|adj, enforce|v ], grammar: [ en-g2-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-010, text: The new sports programme will be funded by the city and will address the problem of childhood obesity., vi: Chương trình thể thao mới sẽ được thành phố cấp kinh phí và sẽ giải quyết vấn đề béo phì ở trẻ em., words: [ fund|v, address|v ], grammar: [ en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b44-011, text: There is no simple way to solve this problem., vi: Không có cách đơn giản nào để giải quyết vấn đề này., words: [ solve|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
