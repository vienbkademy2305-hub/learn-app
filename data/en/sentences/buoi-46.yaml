# Câu xuất hiện lần đầu ở Buổi 46. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b46-001, text: "First, used bottles are collected from homes and taken to a recycling plant.", vi: "Đầu tiên, chai đã qua sử dụng được thu gom từ các hộ gia đình và đưa đến nhà máy tái chế.", words: [ recycle|v ], grammar: [ en-g3-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-002, text: "Once the bottles have been sorted, they are crushed into small pieces.", vi: "Sau khi chai được phân loại, chúng được nghiền thành mảnh nhỏ.", words: [ once|conj, sort|v, crush|v ], grammar: [ en-g3-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-003, text: "After being washed, the plastic is melted down and made into pellets.", vi: "Sau khi được rửa, nhựa được nung chảy và làm thành hạt.", words: [ melt|v ], grammar: [ en-g3-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-004, text: "The water is pumped into a tank, where it is filtered through sand.", vi: "Nước được bơm vào một bể, tại đó nó được lọc qua cát.", words: [ filter|v ], grammar: [ en-g3-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-005, text: The diagram illustrates how drinking water is produced from a river., vi: Sơ đồ minh họa cách nước uống được sản xuất từ một con sông., words: [ diagram|n ], grammar: [ en-g3-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-006, text: "There are six stages in the process, from collection to delivery.", vi: "Quy trình có sáu giai đoạn, từ thu gom đến phân phối.", words: [ stage|n, process|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-007, text: The clean water is stored in a reservoir before it is delivered to homes., vi: Nước sạch được lưu trong hồ chứa trước khi được đưa đến các hộ gia đình., words: [ store|v, reservoir|n, deliver|v ], grammar: [ en-g3-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-008, text: Food waste can be turned into compost instead of being sent to landfill., vi: Rác thực phẩm có thể được biến thành phân hữu cơ thay vì bị đưa đến bãi chôn lấp., words: [ compost|n, landfill|n ], grammar: [ en-g2-23, en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-009, text: The raw materials are transported to the factory by lorry., vi: Nguyên liệu thô được vận chuyển đến nhà máy bằng xe tải., words: [ raw-material|phr-n, transport|v ], grammar: [ en-g3-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-010, text: The mixture is heated to 200°C and subsequently packaged for sale., vi: Hỗn hợp được đun nóng đến 200°C và sau đó được đóng gói để bán., words: [ heat|v, subsequently|adv, package|v ], grammar: [ en-g3-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b46-011, text: Chemicals are added to purify the water and kill bacteria., vi: Hóa chất được thêm vào để làm sạch nước và diệt vi khuẩn., words: [ purify|v ], grammar: [ en-g3-01, en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
