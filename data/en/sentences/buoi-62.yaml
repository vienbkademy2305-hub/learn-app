# Câu xuất hiện lần đầu ở Buổi 62. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b62-001, text: There are eight planets in our solar system., vi: Có tám hành tinh trong hệ Mặt Trời của chúng ta., words: [ planet|n, solar-system|phr-n ], grammar: [ en-g3-17 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-002, text: The Moon orbits the Earth once every 27 days., vi: Mặt Trăng quay quanh Trái Đất 27 ngày một vòng., words: [ orbit|v ], grammar: [ en-g3-17 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-003, text: The universe is far bigger than scientists once thought., vi: Vũ trụ lớn hơn nhiều so với các nhà khoa học từng nghĩ., words: [ universe|n ], grammar: [ en-g3-17 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-004, text: Scientists carried out an experiment to test their hypothesis., vi: Các nhà khoa học tiến hành một thí nghiệm để kiểm chứng giả thuyết., words: [ experiment|n, hypothesis|n ], grammar: [ en-g3-17 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-005, text: A lot of research into Mars has been done in the last decade., vi: Rất nhiều nghiên cứu về sao Hỏa đã được thực hiện trong thập kỷ qua., words: [ research|n ], grammar: [ en-g3-17, en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-006, text: Astronauts on the space station live without gravity for months., vi: Các phi hành gia trên trạm vũ trụ sống không trọng lực hàng tháng trời., words: [ astronaut|n, gravity|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-007, text: The satellite was launched into orbit in 2023., vi: Vệ tinh được phóng lên quỹ đạo năm 2023., words: [ satellite|n, launch|v ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-008, text: The new space telescope can observe galaxies billions of light years away., vi: Kính thiên văn không gian mới có thể quan sát các thiên hà cách hàng tỉ năm ánh sáng., words: [ telescope|n, observe|v, galaxy|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-009, text: Two spacecraft are now travelling beyond our solar system., vi: Hai con tàu vũ trụ hiện đang bay ra ngoài hệ Mặt Trời., words: [ spacecraft|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-010, text: "Mars has a very thin atmosphere, so it is extremely cold.", vi: "Sao Hỏa có bầu khí quyển rất mỏng, nên nó cực kỳ lạnh.", words: [ atmosphere|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b62-011, text: The samples were tested in a laboratory to find scientific evidence of water., vi: Các mẫu được kiểm tra trong phòng thí nghiệm để tìm bằng chứng khoa học về nước., words: [ laboratory|n, scientific|adj, evidence|n ], grammar: [ en-g2-09, en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
