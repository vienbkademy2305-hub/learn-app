# Câu xuất hiện lần đầu ở Buổi 39. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b39-001, text: Many students do an internship in order to gain work experience., vi: Nhiều sinh viên đi thực tập để có kinh nghiệm làm việc., words: [ internship|n, in-order-to|idiom, experience|n ], grammar: [ en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-002, text: I work from home on Fridays so that I can spend more time with my family., vi: Tôi làm việc tại nhà vào thứ Sáu để có thể dành nhiều thời gian hơn cho gia đình., words: [ work-from-home|phr-v, so-that|conj ], grammar: [ en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-003, text: The company offers free training so as to keep its best employees., vi: Công ty đào tạo miễn phí để giữ chân những nhân viên giỏi nhất., words: [ employee|n ], grammar: [ en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-004, text: She left home early in order not to be late for the interview., vi: Cô ấy rời nhà sớm để không bị muộn buổi phỏng vấn., words: [ in-order-to|idiom, interview|n ], grammar: [ en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-005, text: Good employers listen to their staff and pay fair wages., vi: Người chủ tốt lắng nghe nhân viên và trả công công bằng., words: [ employer|n, wage|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-006, text: "After three years, he finally got a promotion to team leader.", vi: "Sau ba năm, cuối cùng anh ấy cũng được thăng chức lên trưởng nhóm.", words: [ promotion|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-007, text: More and more young people choose freelance work because it is flexible., vi: Ngày càng nhiều người trẻ chọn làm tự do vì nó linh hoạt., words: [ freelance|adj ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-008, text: The factory recruited two hundred new workers last month., vi: Nhà máy đã tuyển hai trăm công nhân mới vào tháng trước., words: [ recruit|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-009, text: She resigned from her job because she had no time for her children., vi: Cô ấy nghỉ việc vì không có thời gian cho con., words: [ resign|v ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-010, text: A friendly workplace can improve job satisfaction more than a high salary., vi: Một nơi làm việc thân thiện có thể tăng sự hài lòng với công việc hơn cả lương cao., words: [ workplace|n, job-satisfaction|phr-n, salary|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b39-011, text: My colleagues and I share ideas so that we can finish projects faster., vi: Tôi và đồng nghiệp chia sẻ ý tưởng để có thể hoàn thành dự án nhanh hơn., words: [ colleague|n, so-that|conj ], grammar: [ en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
