# Câu xuất hiện lần đầu ở Buổi 43. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b43-001, text: A tax on sugary drinks should be introduced to protect children's health., vi: Nên áp dụng thuế đối với đồ uống có đường để bảo vệ sức khỏe trẻ em., words: [ tax|n, introduce|v ], grammar: [ en-g2-23, en-g2-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-002, text: "The new law must be enforced strictly, or nobody will follow it.", vi: "Luật mới phải được thực thi nghiêm, nếu không sẽ chẳng ai tuân theo.", words: [ enforce|v, law|n ], grammar: [ en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-003, text: More public spending could be used to improve healthcare in rural areas., vi: Có thể dùng thêm chi tiêu công để cải thiện chăm sóc y tế ở nông thôn., words: [ public-spending|phr-n, healthcare|n, rural|adj ], grammar: [ en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-004, text: Smoking should be banned in all public places., vi: Nên cấm hút thuốc ở mọi nơi công cộng., words: [ ban|v ], grammar: [ en-g2-23 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-005, text: The government has introduced a new policy to reduce plastic waste., vi: Chính phủ đã ban hành một chính sách mới nhằm giảm rác thải nhựa., words: [ policy|n, government|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-006, text: Farmers receive subsidies so that they can sell rice at a low price., vi: Nông dân nhận trợ cấp để có thể bán gạo với giá thấp., words: [ subsidy|n ], grammar: [ en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-007, text: "In a welfare state, citizens get free healthcare and education.", vi: "Trong một nhà nước phúc lợi, công dân được chăm sóc y tế và giáo dục miễn phí.", words: [ welfare|n, citizen|n, healthcare|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-008, text: The local authorities have taken measures to reduce traffic in the old town., vi: Chính quyền địa phương đã có biện pháp giảm giao thông ở phố cổ., words: [ authority|n, measure|n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-009, text: "The recycling scheme was implemented in 2022, but it has not had enough funding.", vi: "Chương trình tái chế được triển khai năm 2022, nhưng chưa có đủ kinh phí.", words: [ scheme|n, implement|v, funding|n ], grammar: [ en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-010, text: A large part of the national budget is spent on public services such as schools and hospitals., vi: Một phần lớn ngân sách quốc gia được chi cho các dịch vụ công như trường học và bệnh viện., words: [ budget|n, public-service|phr-n ], grammar: [ en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b43-011, text: Some people think high taxation discourages people from working harder., vi: Một số người cho rằng mức thuế cao khiến người ta không muốn làm việc chăm hơn., words: [ taxation|n ], grammar: [ en-g2-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
