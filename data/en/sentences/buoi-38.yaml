# Câu xuất hiện lần đầu ở Buổi 38. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b38-001, text: Some people argue that the government should regulate social media more strictly., vi: Một số người lập luận rằng chính phủ nên quản lý mạng xã hội chặt chẽ hơn., words: [ government|n, regulate|v ], grammar: [ en-g2-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-002, text: Others believe that censorship would limit freedom of speech., vi: Những người khác cho rằng kiểm duyệt sẽ hạn chế tự do ngôn luận., words: [ censorship|n, freedom-of-speech|phr-n ], grammar: [ en-g2-18, en-g2-13 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-003, text: It is often claimed that online advertising is harmful to children., vi: Người ta thường cho rằng quảng cáo trên mạng có hại cho trẻ em., words: [ claim|v, advertising|n, harmful|adj ], grammar: [ en-g2-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-004, text: "While some people watch TV for entertainment, others prefer educational programmes.", vi: "Trong khi một số người xem TV để giải trí, những người khác thích các chương trình giáo dục.", words: [ entertainment|n, educational|adj ], grammar: [ en-g2-18 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-005, text: A good journalist should be objective and not biased., vi: Một nhà báo giỏi nên khách quan và không thiên vị., words: [ objective|adj, biased|adj, journalist|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-006, text: Misleading headlines can change public opinion very quickly., vi: Những tiêu đề gây hiểu lầm có thể thay đổi dư luận rất nhanh., words: [ mislead|v, public-opinion|phr-n, headline|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-007, text: Freedom of the press is important because journalists need to report the truth., vi: Tự do báo chí quan trọng vì nhà báo cần đưa tin sự thật., words: [ freedom-of-the-press|phr-n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-008, text: "From my point of view, parents should check the content their children watch.", vi: "Theo quan điểm của tôi, bố mẹ nên kiểm tra nội dung con cái xem.", words: [ point-of-view|phr-n, content|n ], grammar: [ en-g2-18 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-009, text: "On the one hand, social media is free. On the other hand, it is full of misinformation.", vi: "Một mặt, mạng xã hội miễn phí. Mặt khác, nó đầy thông tin sai lệch.", words: [ on-the-one-hand|idiom, on-the-other-hand|idiom ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b38-010, text: The essay should discuss both views before giving your own opinion., vi: Bài luận nên bàn cả hai quan điểm trước khi đưa ra ý kiến riêng., words: [ view|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
