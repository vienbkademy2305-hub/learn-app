# Câu xuất hiện lần đầu ở Buổi 14. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b14-001, text: "While I was riding to work, I saw an accident.", vi: "Trong lúc đang đi xe đến chỗ làm, tôi thấy một vụ tai nạn.", words: [ while|conj, accident|n ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-002, text: "I lost my phone yesterday, but luckily a kind man found it.", vi: "Hôm qua tôi làm mất điện thoại, nhưng may là một người tốt bụng đã tìm thấy.", words: [ lose|v, luckily|adv, find|v, kind|adj ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-003, text: She was cooking dinner when she heard a strange noise., vi: Cô ấy đang nấu bữa tối thì nghe thấy một tiếng động lạ., words: [ hear|v, cook|v ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-004, text: My brother fell off his bike and broke his arm., vi: Em trai tôi ngã xe đạp và bị gãy tay., words: [ fall|v, break|v ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-005, text: What happened? I didn't hear anything., vi: Chuyện gì xảy ra vậy? Tôi không nghe thấy gì cả., words: [ happen|v, hear|v ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-006, text: I met my best friend at university., vi: Tôi gặp bạn thân nhất ở trường đại học., words: [ meet|v ], grammar: [ en-g1-14 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-007, text: "At first I was scared, but then I felt better.", vi: "Lúc đầu tôi sợ, nhưng sau đó tôi thấy đỡ hơn.", words: [ at-first|colloc, then|adv ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-008, text: I forgot my passport and left my luggage on the bus!, vi: Tôi quên hộ chiếu và để quên hành lý trên xe buýt!, words: [ forget|v, leave|v, passport|n, luggage|n ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-009, text: My grandmother often tells us stories about the old days., vi: Bà tôi hay kể cho chúng tôi chuyện ngày xưa., words: [ story|n, often|adv ], grammar: [ en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-010, text: "Suddenly, the lights went out.", vi: Đột nhiên đèn tắt phụt., words: [ suddenly|adv ], grammar: [ en-g1-14 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b14-011, text: We waited for two hours and finally the bus arrived., vi: Chúng tôi đợi hai tiếng và cuối cùng xe buýt cũng đến., words: [ finally|adv, arrive|v ], grammar: [ en-g1-13 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
