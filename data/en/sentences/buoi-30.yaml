# Câu xuất hiện lần đầu ở Buổi 30. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b30-001, text: "Security cameras can deter crime. In addition, they help the police find criminals.", vi: "Camera an ninh có thể răn đe tội phạm. Ngoài ra, chúng giúp cảnh sát tìm ra kẻ phạm tội.", words: [ deter|v, in-addition|idiom ], grammar: [ en-g2-10 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-002, text: "However, too many cameras may reduce people's freedom.", vi: "Tuy nhiên, quá nhiều camera có thể làm giảm sự tự do của con người.", words: [ however|adv, freedom|n ], grammar: [ en-g2-10 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-003, text: "Many cities have installed cameras. As a result, the crime rate has fallen.", vi: Nhiều thành phố đã lắp camera. Kết quả là tỉ lệ tội phạm đã giảm., words: [ crime-rate|phr-n ], grammar: [ en-g2-10 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-004, text: Young offenders often feel ashamed. This feeling can stop them from committing more crimes., vi: Người phạm tội trẻ tuổi thường thấy xấu hổ. Cảm giác này có thể ngăn họ phạm thêm tội., words: [ offender|n ], grammar: [ en-g2-10 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-005, text: The main advantage of community service is that offenders help society., vi: Ưu điểm chính của lao động công ích là người phạm tội giúp ích cho xã hội., words: [ advantage|n, community-service|phr-n, society|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-006, text: One disadvantage of prison is its high cost., vi: Một nhược điểm của nhà tù là chi phí cao., words: [ disadvantage|n, prison|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-007, text: "In my view, the benefits of cameras outweigh the drawbacks.", vi: "Theo tôi, lợi ích của camera lớn hơn nhược điểm.", words: [ outweigh|v, benefit|n, drawback|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-008, text: Better street lights can prevent people from committing crimes at night., vi: Đèn đường tốt hơn có thể ngăn người ta phạm tội vào ban đêm., words: [ prevent|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-009, text: Some people think harsh punishments are the best way to protect public safety., vi: Một số người cho rằng hình phạt nghiêm khắc là cách tốt nhất để bảo vệ an toàn công cộng., words: [ harsh|adj, punishment|n, public-safety|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-010, text: Schools should encourage students to follow the law., vi: Trường học nên khuyến khích học sinh tuân thủ pháp luật., words: [ encourage|v, law|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-011, text: "Prison is very expensive. On the other hand, it keeps dangerous people away from the public.", vi: "Nhà tù rất tốn kém. Mặt khác, nó giữ những người nguy hiểm tránh xa công chúng.", words: [ on-the-other-hand|idiom ], grammar: [ en-g2-10 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b30-012, text: "Cameras record everything. Therefore, it is easier to find witnesses.", vi: "Camera ghi lại mọi thứ. Vì vậy, việc tìm nhân chứng dễ hơn.", words: [ therefore|adv, witness|n ], grammar: [ en-g2-10 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
