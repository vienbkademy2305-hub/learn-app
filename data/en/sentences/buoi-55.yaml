# Câu xuất hiện lần đầu ở Buổi 55. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b55-001, text: A sedentary lifestyle contributes to obesity and heart disease., vi: Lối sống ít vận động góp phần gây béo phì và bệnh tim., words: [ sedentary|adj, contribute-to|phr-v, obesity|n ], grammar: [ en-g3-10 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-002, text: Much childhood obesity stems from the high consumption of sugary drinks., vi: Phần lớn béo phì ở trẻ bắt nguồn từ việc tiêu thụ nhiều đồ uống có đường., words: [ stem-from|phr-v, consumption|n, sugary|adj ], grammar: [ en-g3-10 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-003, text: Long working hours may give rise to stress and sleep deprivation., vi: Làm việc nhiều giờ có thể dẫn đến căng thẳng và thiếu ngủ., words: [ give-rise-to|phr-v, sleep-deprivation|phr-n ], grammar: [ en-g3-10, en-g3-07 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-004, text: Processed food has a detrimental effect on children's health., vi: Thực phẩm chế biến sẵn có tác động có hại đến sức khỏe trẻ em., words: [ processed-food|phr-n, detrimental|adj ], grammar: [ en-g3-10 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-005, text: "Owing to a lack of exercise, many office workers suffer from back pain.", vi: "Do thiếu vận động, nhiều nhân viên văn phòng bị đau lưng.", words: [ owing-to|prep ], grammar: [ en-g3-10 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-006, text: Elderly people are particularly vulnerable to heatwaves., vi: Người cao tuổi đặc biệt dễ bị ảnh hưởng bởi các đợt nắng nóng., words: [ vulnerable|adj, elderly|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-007, text: Chronic diseases place a heavy burden on the healthcare system., vi: Bệnh mãn tính tạo gánh nặng lớn cho hệ thống y tế., words: [ burden|n, chronic-disease|phr-n, healthcare|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-008, text: Poor diet is one key factor behind the rise in diabetes., vi: Chế độ ăn kém là một yếu tố then chốt đằng sau sự gia tăng tiểu đường., words: [ factor|n ], grammar: [ en-g3-10, en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b55-009, text: Stress at work can trigger headaches and other adverse health effects., vi: Căng thẳng trong công việc có thể gây đau đầu và những tác động tiêu cực khác đến sức khỏe., words: [ trigger|v, adverse|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
