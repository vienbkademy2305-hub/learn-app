# Câu xuất hiện lần đầu ở Buổi 48. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b48-001, text: "Many graduates lack soft skills, which makes it hard for them to find jobs.", vi: "Nhiều sinh viên tốt nghiệp thiếu kỹ năng mềm, điều này khiến họ khó tìm việc.", words: [ graduate|n, soft-skills|phr-n ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-002, text: "Vietnam's education system, which is very exam-oriented, is slowly changing.", vi: "Hệ thống giáo dục Việt Nam, vốn rất nặng về thi cử, đang dần thay đổi.", words: [ exam-oriented|adj ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-003, text: "Students often have a heavy workload, which leaves them little time for sport.", vi: "Học sinh thường có khối lượng bài vở nặng, điều này khiến các em có ít thời gian cho thể thao.", words: [ workload|n ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-004, text: "My older brother, who chose vocational training, now runs his own business.", vi: "Anh trai tôi, người đã chọn học nghề, giờ tự kinh doanh.", words: [ vocational-training|phr-n ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-005, text: Standardised tests assess memory rather than critical thinking., vi: Các bài thi chuẩn hóa đánh giá trí nhớ hơn là tư duy phản biện., words: [ standardised-test|phr-n, assess|v, critical-thinking|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-006, text: Hands-on experience improves graduates' employability more than theoretical knowledge., vi: Kinh nghiệm thực hành cải thiện khả năng được tuyển dụng của sinh viên tốt nghiệp hơn kiến thức lý thuyết., words: [ hands-on|adj, employability|n, theoretical|adj ], grammar: [], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-007, text: Access to tertiary education has increased significantly in the last twenty years., vi: Khả năng tiếp cận giáo dục bậc cao đã tăng đáng kể trong hai mươi năm qua., words: [ tertiary-education|phr-n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-008, text: "A well-rounded education should include art, sport and life skills.", vi: "Một nền giáo dục toàn diện nên bao gồm nghệ thuật, thể thao và kỹ năng sống.", words: [ well-rounded|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-009, text: Distance learning allows people in rural areas to study at top universities., vi: Học từ xa cho phép người ở nông thôn học tại các trường đại học hàng đầu., words: [ distance-learning|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b48-010, text: There is no clear link between homework and academic performance in primary school., vi: Không có mối liên hệ rõ ràng giữa bài tập về nhà và kết quả học tập ở bậc tiểu học., words: [ academic-performance|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
