# Câu xuất hiện lần đầu ở Buổi 60. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b60-001, text: "If we had booked earlier, we would have got tickets for the premiere.", vi: Nếu chúng tôi đặt sớm hơn thì đã có vé xem buổi công chiếu., words: [ premiere|n ], grammar: [ en-g3-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-002, text: "If the concert hadn't been sold out, I would have gone with my sister.", vi: Nếu buổi hòa nhạc không hết vé thì tôi đã đi cùng chị., words: [ sold-out|adj ], grammar: [ en-g3-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-003, text: The sequel might have done better at the box office if the critics had liked it., vi: Phần tiếp theo có lẽ đã có doanh thu phòng vé tốt hơn nếu giới phê bình thích nó., words: [ sequel|n, box-office|phr-n, critic|n ], grammar: [ en-g3-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-004, text: "If I had learnt to paint as a child, I would enjoy abstract art more now.", vi: Nếu hồi nhỏ tôi học vẽ thì giờ tôi sẽ thích nghệ thuật trừu tượng hơn., words: [ abstract|adj ], grammar: [ en-g3-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-005, text: "Had the gallery received more funding, it would not have closed.", vi: Nếu phòng tranh được tài trợ nhiều hơn thì nó đã không đóng cửa., words: [ gallery|n, funding|n ], grammar: [ en-g3-15 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-006, text: The exhibition includes portraits and sculptures by young Vietnamese artists., vi: Triển lãm gồm tranh chân dung và tác phẩm điêu khắc của các nghệ sĩ trẻ Việt Nam., words: [ exhibition|n, portrait|n, sculpture|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-007, text: Many people regard this painting as a masterpiece., vi: Nhiều người coi bức tranh này là một kiệt tác., words: [ masterpiece|n, painting|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-008, text: "The film received mixed reviews, but its soundtrack was a huge success.", vi: "Bộ phim nhận đánh giá trái chiều, nhưng nhạc phim thì rất thành công.", words: [ review|n, soundtrack|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-009, text: Hollywood blockbusters often earn more than critically acclaimed local films., vi: Phim bom tấn Hollywood thường thu nhiều hơn những phim nội địa được giới phê bình ca ngợi., words: [ blockbuster|n, critically-acclaimed|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-010, text: The playwright gave a short speech after the performance., vi: Nhà viết kịch có bài phát biểu ngắn sau buổi diễn., words: [ playwright|n, performance|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b60-011, text: Documentaries are a genre that is becoming more popular with young audiences., vi: Phim tài liệu là một thể loại đang ngày càng được khán giả trẻ yêu thích., words: [ genre|n, audience|n ], grammar: [ en-g2-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
