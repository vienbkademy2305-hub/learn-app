# Câu xuất hiện lần đầu ở Buổi 49. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b49-001, text: "I tend to procrastinate, so I often cram the night before an exam.", vi: "Tôi hay trì hoãn, nên thường học nhồi vào đêm trước kỳ thi.", words: [ tend-to|phr-v, procrastinate|v, cram|v ], grammar: [ en-g3-04 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-002, text: "Maths was fairly easy for me, but chemistry was quite challenging.", vi: "Toán với tôi khá dễ, nhưng hóa thì khá khó.", words: [ fairly|adv, quite|adv, challenging|adj ], grammar: [ en-g3-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-003, text: "I'd say my high school was quite traditional, with lots of memorising.", vi: "Tôi cho là trường cấp ba của tôi khá truyền thống, học thuộc nhiều.", words: [ memorise|v ], grammar: [ en-g3-04 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-004, text: I suppose I learn better from my peers than from textbooks., vi: Tôi đoán là tôi học từ bạn bè tốt hơn từ sách giáo khoa., words: [ peer|n ], grammar: [ en-g3-04 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-005, text: My biggest problem is a lack of motivation when I study alone., vi: Vấn đề lớn nhất của tôi là thiếu động lực khi tự học., words: [ motivation|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-006, text: I find it hard to concentrate when my phone is next to me., vi: Tôi thấy khó tập trung khi điện thoại ở bên cạnh., words: [ concentrate|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-007, text: An inspiring teacher can act as a mentor for young learners., vi: Một giáo viên truyền cảm hứng có thể là người dìu dắt cho những người học trẻ., words: [ inspiring|adj, mentor|n, learner|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-008, text: "I've never missed a deadline, although I've come close a few times.", vi: "Tôi chưa bao giờ trễ hạn, dù đã suýt vài lần.", words: [ deadline|n ], grammar: [ en-g2-17, en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-009, text: "These days, I do about two hours of self-study every evening.", vi: "Dạo này, tôi tự học khoảng hai tiếng mỗi tối.", words: [ self-study|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b49-010, text: Our school used continuous assessment instead of one final exam., vi: Trường chúng tôi đánh giá thường xuyên thay vì một kỳ thi cuối., words: [ assessment|n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
