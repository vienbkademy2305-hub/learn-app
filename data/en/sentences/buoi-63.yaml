# Câu xuất hiện lần đầu ở Buổi 63. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b63-001, text: It is the private sector that is now leading space exploration., vi: Chính khu vực tư nhân đang dẫn đầu việc thám hiểm vũ trụ., words: [ private-sector|phr-n, space-exploration|phr-n ], grammar: [ en-g3-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-002, text: What concerns many taxpayers is the astronomical cost of each mission., vi: Điều khiến nhiều người đóng thuế lo ngại là chi phí khổng lồ của mỗi sứ mệnh., words: [ taxpayer|n, astronomical|adj, mission|n ], grammar: [ en-g3-18, en-g3-09 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-003, text: It was in 1961 that the first human travelled into outer space., vi: Chính năm 1961 con người đầu tiên bay vào không gian vũ trụ., words: [ outer-space|phr-n ], grammar: [ en-g3-18 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-004, text: The reason space research is worth funding is that it produces useful spin-offs., vi: Lý do nghiên cứu vũ trụ đáng được tài trợ là nó tạo ra nhiều ứng dụng hữu ích., words: [ spin-off|n ], grammar: [ en-g3-18 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-005, text: Some billionaires dream of colonising Mars within twenty years., vi: Một số tỉ phú mơ lập thuộc địa trên sao Hỏa trong vòng hai mươi năm., words: [ colonise|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-006, text: It is difficult to justify such spending when there are more pressing problems on Earth., vi: Khó mà biện minh cho khoản chi như vậy khi Trái Đất còn nhiều vấn đề cấp bách hơn., words: [ justify|v, pressing|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-007, text: Reusable rockets have made commercial space flights more feasible., vi: Tên lửa tái sử dụng đã khiến các chuyến bay vũ trụ thương mại khả thi hơn., words: [ rocket|n, commercial|adj, feasible|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-008, text: Space debris is becoming a serious threat to satellites., vi: Rác vũ trụ đang trở thành mối đe dọa nghiêm trọng đối với vệ tinh., words: [ space-debris|phr-n, satellite|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-009, text: No other habitable planet has been found so far., vi: Cho đến nay chưa tìm thấy hành tinh nào khác có thể sinh sống., words: [ habitable|adj, planet|n ], grammar: [ en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-010, text: Many see space as the final frontier for humanity., vi: Nhiều người coi vũ trụ là biên giới cuối cùng của nhân loại., words: [ frontier|n, humanity|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b63-011, text: Cutting-edge technology developed for astronauts is now used in hospitals., vi: Công nghệ tiên tiến phát triển cho phi hành gia nay được dùng trong bệnh viện., words: [ cutting-edge|adj, astronaut|n ], grammar: [ en-g3-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
