# Câu xuất hiện lần đầu ở Buổi 34. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b34-001, text: "In 2023, Hanoi received twice as many international visitors as Hue.", vi: "Năm 2023, Hà Nội đón lượng khách quốc tế gấp đôi Huế.", words: [ international|adj, visitor|n ], grammar: [ en-g2-14 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-002, text: Domestic tourists spent less money on accommodation than international tourists., vi: Khách nội địa chi ít tiền cho chỗ ở hơn khách quốc tế., words: [ domestic|adj, accommodation|n ], grammar: [ en-g2-14 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-003, text: "The number of domestic visitors rose, whereas the number of international visitors fell.", vi: "Số khách nội địa tăng, trong khi số khách quốc tế giảm.", words: [ whereas|conj, domestic|adj ], grammar: [ en-g2-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-004, text: "Food and transport accounted for 25% and 15% of tourist expenditure, respectively.", vi: Ăn uống và đi lại lần lượt chiếm 25% và 15% chi tiêu của khách du lịch., words: [ respectively|adv, expenditure|n ], grammar: [ en-g2-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-005, text: The bar chart compares the number of visitors to five destinations in Vietnam in 2019 and 2023., vi: Biểu đồ cột so sánh số khách đến năm điểm du lịch ở Việt Nam vào năm 2019 và 2023., words: [ bar-chart|phr-n, destination|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-006, text: Da Nang was the second most popular destination in both years., vi: Đà Nẵng là điểm đến được ưa chuộng thứ hai trong cả hai năm., words: [ popular|adj ], grammar: [ en-g2-14 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-007, text: The majority of visitors to Sapa were young people aged 18 to 30., vi: Phần lớn khách đến Sa Pa là người trẻ từ 18 đến 30 tuổi., words: [ the-majority-of|colloc ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-008, text: "Compared with 2019, the number of tourists in Phu Quoc almost doubled in 2023.", vi: "So với năm 2019, số khách đến Phú Quốc gần như tăng gấp đôi vào năm 2023.", words: [ compared-with|colloc, double|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-009, text: Approximately 40% of visitors spent their money on tourist attractions., vi: Khoảng 40% du khách chi tiền cho các điểm tham quan., words: [ approximately|adv, tourist-attraction|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-010, text: "Accommodation was the largest category of spending. In contrast, shopping was the smallest.", vi: "Chỗ ở là hạng mục chi tiêu lớn nhất. Ngược lại, mua sắm là nhỏ nhất.", words: [ category|n, in-contrast|idiom ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b34-011, text: "The northern region attracted fewer foreign tourists than the south. Similarly, it had fewer hotels.", vi: "Miền Bắc thu hút ít khách nước ngoài hơn miền Nam. Tương tự, miền Bắc có ít khách sạn hơn.", words: [ region|n, similarly|adv ], grammar: [ en-g2-14 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
