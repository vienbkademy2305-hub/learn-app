# Câu xuất hiện lần đầu ở Buổi 64. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b64-001, text: Animal testing for cosmetics has been prohibited in many countries., vi: Thử nghiệm mỹ phẩm trên động vật đã bị cấm ở nhiều nước., words: [ animal-testing|phr-n, prohibit|v ], grammar: [ en-g3-19, en-g2-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-002, text: The introduction of stricter legislation led to a fall in pollution., vi: Việc ban hành luật chặt chẽ hơn đã dẫn đến giảm ô nhiễm., words: [ legislation|n ], grammar: [ en-g3-19, en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-003, text: All companies are required to comply with the new regulations., vi: Mọi công ty đều phải tuân thủ các quy định mới., words: [ comply-with|phr-v, regulation|n ], grammar: [ en-g3-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-004, text: Collecting personal data without consent violates people's privacy., vi: Thu thập dữ liệu cá nhân không có sự đồng ý là xâm phạm quyền riêng tư., words: [ consent|n, violate|v, privacy|n ], grammar: [ en-g3-19, en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-005, text: Doctors sometimes face a moral dilemma when a patient refuses treatment., vi: Bác sĩ đôi khi đối mặt với tình thế khó xử về đạo đức khi bệnh nhân từ chối điều trị., words: [ moral|adj, dilemma|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-006, text: Politicians must be held accountable for their decisions., vi: Các chính trị gia phải chịu trách nhiệm về quyết định của mình., words: [ accountable|adj ], grammar: [ en-g2-23 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-007, text: Discrimination against older workers is illegal in many countries., vi: Phân biệt đối xử với người lao động lớn tuổi là bất hợp pháp ở nhiều nước., words: [ discrimination|n, illegal|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-008, text: The company used a legal loophole to avoid paying tax., vi: Công ty đã lợi dụng kẽ hở pháp luật để trốn thuế., words: [ loophole|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-009, text: The city imposed a ban on plastic bags last year., vi: Thành phố đã áp lệnh cấm túi nhựa năm ngoái., words: [ impose|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-010, text: Most law-abiding citizens support harsher penalties for drink-driving., vi: Phần lớn công dân tuân thủ pháp luật ủng hộ hình phạt nặng hơn cho lái xe khi say rượu., words: [ law-abiding|adj, penalty|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-011, text: Many people believe it is unethical to keep wild animals in small cages., vi: Nhiều người cho rằng nhốt động vật hoang dã trong lồng nhỏ là trái đạo đức., words: [ unethical|adj ], grammar: [ en-g1-29 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b64-012, text: Protecting human rights is a legal obligation for every government., vi: Bảo vệ nhân quyền là nghĩa vụ pháp lý của mọi chính phủ., words: [ human-rights|phr-n, obligation|n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
