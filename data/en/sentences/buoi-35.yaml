# Câu xuất hiện lần đầu ở Buổi 35. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b35-001, text: The mayor said that the new metro line would reduce traffic congestion., vi: Thị trưởng nói rằng tuyến tàu điện mới sẽ giảm ùn tắc giao thông., words: [ traffic-congestion|phr-n ], grammar: [ en-g2-15 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-002, text: My cousin told me that rents in the city centre were too high., vi: Anh họ tôi nói với tôi rằng tiền thuê nhà ở trung tâm thành phố quá cao., words: [ rent|n, city-centre|phr-n ], grammar: [ en-g2-15 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-003, text: The officer asked us if we had moved from a rural area., vi: Cán bộ hỏi chúng tôi có phải đã chuyển đến từ vùng nông thôn không., words: [ rural|adj ], grammar: [ en-g2-15 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-004, text: She mentioned that her neighbourhood didn't have any green spaces., vi: Cô ấy nhắc rằng khu phố của cô không có mảng xanh nào., words: [ mention|v, neighbourhood|n, green-space|phr-n ], grammar: [ en-g2-15 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-005, text: "Rapid urbanisation has created many problems, such as pollution and a lack of housing.", vi: "Đô thị hóa nhanh đã gây ra nhiều vấn đề, như ô nhiễm và thiếu nhà ở.", words: [ urbanisation|n, housing|n, pollution|n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-006, text: "Every year, thousands of young people migrate from the countryside to big cities.", vi: "Mỗi năm, hàng nghìn người trẻ di cư từ nông thôn lên các thành phố lớn.", words: [ migrate|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-007, text: The main reason for rural-urban migration is the lack of job opportunities in the countryside., vi: Lý do chính của di cư từ nông thôn ra thành thị là thiếu cơ hội việc làm ở nông thôn., words: [ migration|n, job-opportunity|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-008, text: The population of Ho Chi Minh City has grown very quickly since 2000., vi: Dân số Thành phố Hồ Chí Minh đã tăng rất nhanh kể từ năm 2000., words: [ population|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-009, text: Many families have moved to the suburbs because of the high cost of living., vi: Nhiều gia đình đã chuyển ra ngoại ô vì chi phí sinh hoạt cao., words: [ suburb|n, cost-of-living|phr-n ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-010, text: "If the city doesn't invest in infrastructure, urban sprawl will get worse.", vi: "Nếu thành phố không đầu tư vào cơ sở hạ tầng, tình trạng đô thị lan tràn sẽ trầm trọng hơn.", words: [ infrastructure|n, urban-sprawl|phr-n ], grammar: [ en-g2-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-011, text: High-rise apartments are replacing the old houses in my street., vi: Các căn hộ cao tầng đang thay thế những ngôi nhà cũ trên phố tôi., words: [ high-rise|adj, apartment|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b35-012, text: "Urban areas offer better services, but rural life is quieter and cheaper.", vi: "Khu đô thị có dịch vụ tốt hơn, nhưng cuộc sống nông thôn yên tĩnh và rẻ hơn.", words: [ urban|adj, rural|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
