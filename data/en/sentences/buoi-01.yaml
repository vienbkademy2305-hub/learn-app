# Câu xuất hiện lần đầu ở Buổi 1. Chuyển từ nhat-ky-hoc-tap/tieng-anh/buoi-01.md; đã thay tên thật của học viên.
sentences:
  - { id: b01-001, text: "My name is Lan and I am twenty-six years old.", vi: "Tên tôi là Lan và tôi hai mươi sáu tuổi.", words: [], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-002, text: "I am single and I live with my parents.", vi: "Tôi độc thân và sống cùng bố mẹ.", words: [single|adj, live-with|phr-v, parent|n], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-003, text: "My father works as a teacher, and my mother is a nurse.", vi: "Bố tôi làm giáo viên, còn mẹ tôi là y tá.", words: [work-as|phr-v], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-004, text: "I have two siblings: an elder brother and a younger sister.", vi: "Tôi có hai anh chị em: một anh trai và một em gái.", words: [sibling|n, elder-brother|phr-n, younger-sister|phr-n], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-005, text: "My grandparents live in the countryside, but we visit them every month.", vi: "Ông bà tôi sống ở quê, nhưng tháng nào chúng tôi cũng về thăm.", words: [grandparent|n], grammar: [en-g1-01], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-006, text: "My hometown is Hai Phong, and my nationality is Vietnamese.", vi: "Quê tôi ở Hải Phòng, và tôi mang quốc tịch Việt Nam.", words: [hometown|n, nationality|n], grammar: [en-g1-01], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-007, text: "My brother is married, and his wife is a doctor.", vi: "Anh trai tôi đã lập gia đình, vợ anh ấy là bác sĩ.", words: [married|adj, wife|n], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-008, text: "We are a happy family.", vi: "Chúng tôi là một gia đình hạnh phúc.", words: [], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  # Câu ví dụ cho từng từ trong bảng từ vựng (tra ngược qua `words`).
  - { id: b01-009, text: "My full name is Tran Thi Lan.", vi: "Họ tên đầy đủ của tôi là Trần Thị Lan.", words: [full-name|phr-n], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-010, text: "My date of birth is 5th May 2000.", vi: "Ngày sinh của tôi là 5 tháng 5 năm 2000.", words: [date-of-birth|phr-n], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-011, text: "My address is 12 Le Loi Street.", vi: "Địa chỉ của tôi là số 12 phố Lê Lợi.", words: [address|n], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-012, text: "Her marital status is single.", vi: "Tình trạng hôn nhân của cô ấy là độc thân.", words: [marital-status|phr-n, single|adj], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-013, text: "Her husband works in a bank.", vi: "Chồng cô ấy làm ở ngân hàng.", words: [husband|n], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-014, text: "They have one son and one daughter.", vi: "Họ có một con trai và một con gái.", words: [son|n, daughter|n], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-015, text: "My elder sister lives in Da Nang.", vi: "Chị gái tôi sống ở Đà Nẵng.", words: [elder-sister|phr-n], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-016, text: "My younger brother is a student.", vi: "Em trai tôi là sinh viên.", words: [younger-brother|phr-n], grammar: [en-g1-01], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-017, text: My uncle lives in Da Nang with his wife and their two children., vi: Chú tôi sống ở Đà Nẵng với vợ và hai con của chú., words: [ uncle|n ], grammar: [ en-g1-23, en-g1-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-018, text: This is Mai's bag. That one is mine., vi: Đây là túi của Mai. Cái kia là của tôi., words: [], grammar: [ en-g1-23 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-019, text: My cousins often visit us at Tet., vi: Các anh chị em họ thường đến thăm nhà tôi vào dịp Tết., words: [ cousin|n ], grammar: [ en-g1-23, en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-020, text: "My parents' house is small, but I love it.", vi: "Nhà của bố mẹ tôi nhỏ, nhưng tôi rất yêu nó.", words: [ parent|n ], grammar: [ en-g1-23 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-021, text: Vietnam is a beautiful country., vi: Việt Nam là một đất nước xinh đẹp., words: [ country|n ], grammar: [ en-g1-01 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-022, text: I am Vietnamese and my first language is Vietnamese., vi: Tôi là người Việt và tiếng mẹ đẻ của tôi là tiếng Việt., words: [ vietnamese|adj, language|n ], grammar: [ en-g1-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-023, text: "My English teacher is British, not American.", vi: "Giáo viên tiếng Anh của tôi là người Anh, không phải người Mỹ.", words: [ english|adj, british|adj, american|adj ], grammar: [ en-g1-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-024, text: "My aunt speaks Chinese, Japanese and Korean.", vi: "Dì tôi nói được tiếng Trung, tiếng Nhật và tiếng Hàn.", words: [ aunt|n, chinese|adj, japanese|adj, korean|adj ], grammar: [ en-g1-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-025, text: Her husband is French., vi: Chồng cô ấy là người Pháp., words: [ french|adj, husband|n ], grammar: [ en-g1-01 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-026, text: My nephew and niece are twins., vi: Cháu trai và cháu gái tôi là một cặp sinh đôi., words: [ nephew|n, niece|n ], grammar: [ en-g1-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b01-027, text: All my relatives come to my grandparents' house on the first day of Tet., vi: "Mùng một Tết, cả họ hàng tôi đều đến nhà ông bà.", words: [ relative|n, grandparent|n ], grammar: [ en-g1-23 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
