# Câu xuất hiện lần đầu ở Buổi 37. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b37-001, text: "Although the headline was false, the story spread very quickly online.", vi: "Mặc dù tiêu đề là sai sự thật, câu chuyện vẫn lan truyền rất nhanh trên mạng.", words: [ although|conj, headline|n, spread|v ], grammar: [ en-g2-17 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-002, text: "Despite the warnings, many people shared the video without checking it.", vi: "Bất chấp những lời cảnh báo, nhiều người vẫn chia sẻ video mà không kiểm tra.", words: [ despite|prep ], grammar: [ en-g2-17 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-003, text: "In spite of being a journalist, he didn't check his sources.", vi: "Mặc dù là nhà báo, anh ta không kiểm tra nguồn tin của mình.", words: [ in-spite-of|prep, journalist|n, source|n ], grammar: [ en-g2-17 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-004, text: "Even though the mainstream media corrected the story, the fake version was more popular.", vi: "Mặc dù truyền thông chính thống đã đính chính câu chuyện, bản tin giả vẫn phổ biến hơn.", words: [ even-though|conj, mainstream-media|phr-n ], grammar: [ en-g2-17 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-005, text: Misinformation often spreads faster than the truth on social media., vi: Thông tin sai lệch thường lan nhanh hơn sự thật trên mạng xã hội., words: [ misinformation|n, social-media|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-006, text: Schools should teach media literacy so that students can recognise fake news., vi: Trường học nên dạy năng lực truyền thông để học sinh có thể nhận ra tin giả., words: [ media-literacy|phr-n, fake-news|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-007, text: A reliable source always tells you where the information comes from., vi: Một nguồn đáng tin cậy luôn cho bạn biết thông tin đến từ đâu., words: [ reliable|adj, source|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-008, text: The newspaper published the article on its website last night., vi: Tờ báo đã đăng bài viết trên trang web của mình tối qua., words: [ publish|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-009, text: Her cooking video went viral and reached an audience of two million people., vi: Video nấu ăn của cô ấy lan truyền mạnh và tiếp cận hai triệu người xem., words: [ viral|adj, audience|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-010, text: Many young people get their news from influencers rather than newspapers., vi: Nhiều người trẻ tiếp nhận tin tức từ người có ảnh hưởng trên mạng thay vì báo chí., words: [ influencer|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b37-011, text: Social media platforms should do more to fact-check posts., vi: Các nền tảng mạng xã hội nên làm nhiều hơn để kiểm chứng bài đăng., words: [ platform|n, fact-check|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
