# Câu xuất hiện lần đầu ở Buổi 28. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b28-001, text: I used to play badminton with my father every Sunday., vi: Ngày xưa Chủ nhật nào tôi cũng chơi cầu lông với bố., words: [ badminton|n ], grammar: [ en-g2-08 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-002, text: "I didn't use to exercise, but now I work out every day.", vi: "Trước đây tôi không tập thể dục, nhưng giờ ngày nào tôi cũng tập.", words: [ work-out|phr-v ], grammar: [ en-g2-08 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-003, text: Did you use to take part in sports competitions at school?, vi: Hồi đi học bạn có hay tham gia các cuộc thi thể thao không?, words: [ competition|n ], grammar: [ en-g2-08 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-004, text: "After a year of training, I'm used to running in the heat.", vi: "Sau một năm luyện tập, tôi đã quen chạy dưới trời nóng.", words: [], grammar: [ en-g2-08 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-005, text: My brother took up swimming last year to keep fit., vi: Năm ngoái anh tôi bắt đầu bơi để giữ dáng., words: [ take-up|phr-v, keep-fit|colloc ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-006, text: She gave up football after a serious injury., vi: Cô ấy bỏ bóng đá sau một chấn thương nặng., words: [ give-up|phr-v, injury|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-007, text: "More than 10,000 people ran in the Hanoi Marathon.", vi: Hơn 10.000 người đã chạy giải Marathon Hà Nội., words: [ marathon|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-008, text: The whole stadium cheered when Vietnam won the gold medal., vi: Cả sân vận động reo hò khi Việt Nam giành huy chương vàng., words: [ cheer|v, medal|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-009, text: After the race I was exhausted but very proud., vi: Sau cuộc đua tôi kiệt sức nhưng rất tự hào., words: [ exhausted|adj, proud|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-010, text: Our school team competed in a national tournament., vi: Đội của trường tôi thi đấu ở một giải toàn quốc., words: [ compete|v, tournament|n, team|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-011, text: It was one of the most memorable days of my life., vi: Đó là một trong những ngày đáng nhớ nhất đời tôi., words: [ memorable|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-012, text: Professional athletes follow a very healthy lifestyle., vi: Các vận động viên chuyên nghiệp theo một lối sống rất lành mạnh., words: [ athlete|n, healthy-lifestyle|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b28-013, text: Morning exercise makes me feel energetic all day., vi: Tập thể dục buổi sáng giúp tôi tràn đầy năng lượng cả ngày., words: [ energetic|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
