# Câu xuất hiện lần đầu ở Buổi 33. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b33-001, text: "If fewer tourists visited the old town, local residents would have a quieter life.", vi: "Nếu ít khách du lịch đến phố cổ hơn, cư dân địa phương sẽ có cuộc sống yên tĩnh hơn.", words: [ local-resident|phr-n ], grammar: [ en-g2-13 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-002, text: "If I were the mayor, I would ban motorbikes in the historic centre.", vi: "Nếu tôi là thị trưởng, tôi sẽ cấm xe máy ở khu trung tâm lịch sử.", words: [ historic|adj ], grammar: [ en-g2-13 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-003, text: The festival would lose its meaning if it became just a show for tourists., vi: Lễ hội sẽ mất đi ý nghĩa nếu nó chỉ còn là một màn trình diễn cho khách du lịch., words: [ festival|n ], grammar: [ en-g2-13 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-004, text: "If I were you, I would try authentic local food instead of pizza.", vi: "Nếu tôi là bạn, tôi sẽ thử món ăn địa phương đích thực thay vì pizza.", words: [ authentic|adj ], grammar: [ en-g2-13 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-005, text: Mass tourism can damage ancient buildings and pollute beaches., vi: Du lịch đại trà có thể làm hư hại các công trình cổ và làm ô nhiễm bãi biển., words: [ mass-tourism|phr-n, damage|v, ancient|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-006, text: The government has spent a lot of money to restore the old temples., vi: Chính phủ đã chi nhiều tiền để trùng tu các ngôi chùa cổ., words: [ restore|v ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-007, text: "Tourism brings jobs, but it can also change the cultural identity of a place.", vi: "Du lịch mang lại việc làm, nhưng cũng có thể làm thay đổi bản sắc văn hóa của một nơi.", words: [ tourism|n, cultural-identity|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-008, text: Young people should learn about their cultural heritage and preserve old traditions., vi: Người trẻ nên tìm hiểu di sản văn hóa của mình và giữ gìn các truyền thống cũ., words: [ cultural-heritage|phr-n, preserve|v, tradition|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-009, text: "In summer, the beaches are so overcrowded that you can hardly find a place to sit.", vi: "Vào mùa hè, bãi biển đông đến mức bạn gần như không tìm được chỗ ngồi.", words: [ overcrowded|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-010, text: "Visitors should respect local customs, for example by dressing politely in temples.", vi: "Du khách nên tôn trọng phong tục địa phương, ví dụ ăn mặc lịch sự trong chùa.", words: [ custom|n, respect|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-011, text: The bridge is the town's most famous landmark and appears on many postcards., vi: Cây cầu là địa danh nổi tiếng nhất của thị trấn và xuất hiện trên nhiều bưu thiếp., words: [ landmark|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b33-012, text: Each region of Vietnam has a unique culture with its own food and music., vi: Mỗi vùng của Việt Nam có một nền văn hóa độc đáo với ẩm thực và âm nhạc riêng., words: [ unique|adj, culture|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
