# Câu xuất hiện lần đầu ở Buổi 42. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b42-001, text: "In the chart, electronics accounted for nearly half of the country's exports.", vi: "Trong biểu đồ, hàng điện tử chiếm gần một nửa xuất khẩu của quốc gia đó.", words: [ account-for|phr-v, nearly|adv, half|n, export|v ], grammar: [ en-g2-22 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-002, text: Clothes and shoes made up just over a quarter of the total., vi: Quần áo và giày dép chiếm hơn một phần tư tổng số một chút., words: [ make-up|phr-v, just-over|colloc, quarter|n ], grammar: [ en-g2-22 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-003, text: Agricultural products represented only a small minority of exports., vi: Nông sản chỉ chiếm một phần nhỏ trong xuất khẩu., words: [ represent|v, minority|n ], grammar: [ en-g2-22 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-004, text: The percentage of exports going to the USA rose from 20% to 30%., vi: Tỉ lệ xuất khẩu sang Mỹ tăng từ 20% lên 30%., words: [ percentage|n ], grammar: [ en-g2-22, en-g2-06 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-005, text: The two pie charts compare the sources of energy used in 2010 and 2024., vi: Hai biểu đồ tròn so sánh các nguồn năng lượng được sử dụng năm 2010 và 2024., words: [ pie-chart|phr-n, source|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-006, text: Coal was the largest segment of the pie in both years., vi: Than đá là phần lớn nhất của biểu đồ tròn trong cả hai năm., words: [ segment|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-007, text: "Combined, Asia and Europe received three quarters of all exports.", vi: "Gộp lại, châu Á và châu Âu nhận ba phần tư tổng xuất khẩu.", words: [ combined|adj, quarter|n ], grammar: [ en-g2-22 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-008, text: "The remainder was made up of other goods, such as furniture and toys.", vi: "Phần còn lại gồm các mặt hàng khác, như đồ nội thất và đồ chơi.", words: [ remainder|n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-009, text: The table shows that the total value of exports doubled over the period., vi: Bảng cho thấy tổng giá trị xuất khẩu tăng gấp đôi trong giai đoạn này., words: [ table|n, double|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-010, text: China's share of Vietnam's imports was larger than that of any other country., vi: Tỉ phần của Trung Quốc trong nhập khẩu của Việt Nam lớn hơn bất kỳ nước nào khác., words: [ share|n, import|v ], grammar: [ en-g2-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b42-011, text: The total comprises five categories of goods., vi: Tổng số gồm năm nhóm hàng hóa., words: [ comprise|v, category|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
