# Câu xuất hiện lần đầu ở Buổi 7. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b07-001, text: My father works for a big company., vi: Bố tôi làm việc cho một công ty lớn., words: [ company|n ], grammar: [ en-g1-07 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-002, text: Today he isn't working in the office. He is working from home., vi: Hôm nay bố không làm ở văn phòng. Bố đang làm việc ở nhà., words: [ office|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-003, text: What do you do? I'm an accountant., vi: Bạn làm nghề gì? Tôi là kế toán., words: [ accountant|n ], grammar: [ en-g1-07 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-004, text: "I usually start work at eight, but this week I'm starting at seven.", vi: "Tôi thường bắt đầu làm lúc tám giờ, nhưng tuần này tôi bắt đầu lúc bảy giờ.", words: [], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-005, text: My aunt is a nurse. She is helping a patient right now., vi: Cô tôi là y tá. Lúc này cô ấy đang giúp một bệnh nhân., words: [ nurse|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-006, text: Our manager knows all the customers., vi: Quản lý của chúng tôi biết tất cả khách hàng., words: [ manager|n, customer|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-007, text: Nam wants a full-time job., vi: Nam muốn một công việc toàn thời gian., words: [ full-time|adj, job|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-008, text: Are you looking for a job at the moment?, vi: Hiện giờ bạn có đang tìm việc không?, words: [ job|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-009, text: I like my colleagues. They are very friendly., vi: Tôi quý các đồng nghiệp. Họ rất thân thiện., words: [ colleague|n, friendly|adj ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-010, text: Engineers earn a good salary in Vietnam., vi: Kỹ sư ở Việt Nam có mức lương khá., words: [ engineer|n, earn|v, salary|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-011, text: The electrician is repairing the lights in our kitchen., vi: Thợ điện đang sửa đèn trong bếp nhà tôi., words: [ electrician|n, kitchen|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-012, text: She works as a shop assistant on Saturdays., vi: Cô ấy làm nhân viên bán hàng vào các ngày thứ Bảy., words: [ shop-assistant|phr-n, work-as|phr-v ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-013, text: My uncle is a police officer., vi: Chú tôi là cảnh sát., words: [ police-officer|phr-n ], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-014, text: Many students have part-time jobs., vi: Nhiều sinh viên làm việc bán thời gian., words: [ part-time|adj ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-015, text: I am applying for a job at a bank., vi: Tôi đang nộp đơn xin việc ở một ngân hàng., words: [ apply-for|phr-v ], grammar: [ en-g1-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-016, text: I have a job interview tomorrow morning., vi: Sáng mai tôi có buổi phỏng vấn xin việc., words: [ interview|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-017, text: "He is unemployed, so he is looking for work.", vi: Anh ấy đang thất nghiệp nên đang tìm việc., words: [ unemployed|adj ], grammar: [ en-g1-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-018, text: Please write your occupation on this form., vi: Vui lòng ghi nghề nghiệp của bạn vào mẫu đơn này., words: [ occupation|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-019, text: The secretary answers the phone and arranges meetings., vi: Thư ký nghe điện thoại và sắp xếp các cuộc họp., words: [ secretary|n ], grammar: [ en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-020, text: The receptionist is checking in a guest right now., vi: Lễ tân đang làm thủ tục nhận phòng cho một vị khách., words: [ receptionist|n ], grammar: [ en-g1-07 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-021, text: My uncle is a chef in a big hotel in Hue., vi: Chú tôi là đầu bếp ở một khách sạn lớn ở Huế., words: [ chef|n ], grammar: [ en-g1-01 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-022, text: "The director usually works late, but today she is having a day off.", vi: "Giám đốc thường làm muộn, nhưng hôm nay bà ấy đang nghỉ một ngày.", words: [ director|n ], grammar: [ en-g1-07 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-023, text: All the staff wear a uniform at work., vi: Tất cả nhân viên đều mặc đồng phục khi làm việc., words: [ staff|n, uniform|n ], grammar: [ en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-024, text: He is a successful businessman with three companies., vi: Ông ấy là một doanh nhân thành đạt có ba công ty., words: [ businessman|n, company|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b07-025, text: My colleague studied at a college in Da Nang., vi: Đồng nghiệp của tôi từng học ở một trường cao đẳng tại Đà Nẵng., words: [ colleague|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
