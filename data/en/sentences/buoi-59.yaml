# Câu xuất hiện lần đầu ở Buổi 59. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b59-001, text: Spending on housing was considerably higher in the city than in rural areas., vi: Chi tiêu cho nhà ở tại thành phố cao hơn đáng kể so với nông thôn., words: [ considerably|adv ], grammar: [ en-g3-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-002, text: The proportion spent on utilities was marginally lower in 2020 than in 2010., vi: Tỉ lệ chi cho điện nước năm 2020 thấp hơn một chút so với năm 2010., words: [ marginally|adv, utilities|n ], grammar: [ en-g3-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-003, text: Housing was by far the largest expense in all three countries., vi: Nhà ở là khoản chi lớn nhất với cách biệt xa ở cả ba nước., words: [ by-far|idiom ], grammar: [ en-g3-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-004, text: "The higher a family's income, the more it spends on leisure.", vi: Thu nhập gia đình càng cao thì càng chi nhiều cho giải trí., words: [ income|n, leisure|n ], grammar: [ en-g3-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-005, text: Spending on groceries was almost as high as spending on transport., vi: Chi cho thực phẩm gần bằng chi cho đi lại., words: [ groceries|n ], grammar: [ en-g3-14 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-006, text: "Online revenue tripled over the period, while shop sales were almost halved.", vi: "Doanh thu trực tuyến tăng gấp ba trong giai đoạn này, trong khi doanh số tại cửa hàng giảm gần một nửa.", words: [ revenue|n, triple|v, halve|v ], grammar: [ en-g2-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-007, text: "By 2020, online sales had overtaken shop sales and exceeded 50% of the total.", vi: "Đến năm 2020, doanh số trực tuyến đã vượt doanh số cửa hàng và vượt 50% tổng số.", words: [ overtake|v, exceed|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-008, text: Families in Country A allocated 35% of their budget to housing (hypothetical figures)., vi: Các gia đình ở nước A dành 35% ngân sách cho nhà ở (số liệu giả định)., words: [ allocate|v, budget|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-009, text: The change in spending on clothes was negligible., vi: Thay đổi trong chi tiêu cho quần áo là không đáng kể., words: [ negligible|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-010, text: "The table covers food and housing; the former fell, whereas the latter rose substantially.", vi: "Bảng gồm thực phẩm và nhà ở; khoản trước giảm, trong khi khoản sau tăng đáng kể.", words: [ the-former|pron, the-latter|pron, substantially|adv ], grammar: [ en-g2-14 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b59-011, text: The figures for the two countries are comparable., vi: Số liệu của hai nước tương đương nhau., words: [ comparable|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
