# Câu xuất hiện lần đầu ở Buổi 52. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b52-001, text: AI is likely to change most office jobs within the next decade., vi: AI có khả năng cao sẽ thay đổi hầu hết công việc văn phòng trong thập kỷ tới., words: [ likely|adj ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-002, text: "Autonomous cars may reduce accidents, but they raise difficult ethical questions.", vi: "Xe tự lái có thể giảm tai nạn, nhưng chúng đặt ra những câu hỏi đạo đức khó.", words: [ autonomous|adj, ethical|adj ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-003, text: "Arguably, the greatest risk of facial recognition is the loss of privacy.", vi: "Có thể nói, rủi ro lớn nhất của nhận diện khuôn mặt là mất quyền riêng tư.", words: [ arguably|adv, facial-recognition|phr-n ], grammar: [ en-g3-07 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-004, text: Some algorithms appear to show a bias against women., vi: Một số thuật toán dường như thể hiện sự thiên lệch với phụ nữ., words: [ algorithm|n, bias|n ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-005, text: Machine learning has led to a major breakthrough in medical diagnosis., vi: Học máy đã dẫn đến một bước đột phá lớn trong chẩn đoán y khoa., words: [ machine-learning|phr-n, breakthrough|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-006, text: Technology is changing society at an unprecedented speed., vi: Công nghệ đang thay đổi xã hội với tốc độ chưa từng có., words: [ unprecedented|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-007, text: Chatbots can generate a whole essay in a few seconds., vi: Chatbot có thể tạo ra cả một bài luận trong vài giây., words: [ chatbot|n, generate|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-008, text: "Without human oversight, AI systems are unlikely to be completely accurate.", vi: "Nếu không có sự giám sát của con người, hệ thống AI khó có thể chính xác hoàn toàn.", words: [ human-oversight|phr-n, accurate|adj ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-009, text: Deepfakes could make it harder to trust what we see online., vi: Deepfake có thể khiến việc tin những gì ta thấy trên mạng khó hơn., words: [ deepfake|n ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-010, text: "Companies should explain how their algorithms work, which would increase transparency.", vi: "Các công ty nên giải thích thuật toán hoạt động ra sao, điều đó sẽ tăng tính minh bạch.", words: [ transparency|n ], grammar: [ en-g3-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b52-011, text: "The potential of AI in education is huge, but its capabilities are often exaggerated.", vi: "Tiềm năng của AI trong giáo dục rất lớn, nhưng khả năng của nó thường bị phóng đại.", words: [ potential|n, capability|n ], grammar: [], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
