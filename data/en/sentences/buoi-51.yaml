# Câu xuất hiện lần đầu ở Buổi 51. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b51-001, text: "Prison is expensive. Moreover, there is little evidence that it reduces crime.", vi: "Nhà tù tốn kém. Hơn nữa, có rất ít bằng chứng cho thấy nó làm giảm tội phạm.", words: [ moreover|adv, evidence|n ], grammar: [ en-g3-06 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-002, text: "The death penalty may deter some criminals. Nevertheless, innocent people can be executed by mistake.", vi: "Án tử hình có thể răn đe một số tội phạm. Dù vậy, người vô tội có thể bị xử tử oan.", words: [ death-penalty|phr-n, nevertheless|adv, innocent|adj ], grammar: [ en-g3-06 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-003, text: "Street lighting was improved in 2020. Consequently, night-time robberies fell by a third.", vi: "Đèn đường được cải thiện năm 2020. Do đó, các vụ cướp ban đêm giảm một phần ba.", words: [ consequently|adv ], grammar: [ en-g3-06 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-004, text: "Education programmes give prisoners new skills, thus reducing the chance that they will reoffend.", vi: "Các chương trình giáo dục trang bị kỹ năng mới cho phạm nhân, qua đó giảm khả năng họ tái phạm.", words: [ thus|adv, reoffend|v ], grammar: [ en-g3-06 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-005, text: "Everyone has the right to a fair trial, even people who are clearly guilty.", vi: "Ai cũng có quyền được xét xử công bằng, kể cả người rõ ràng có tội.", words: [ trial|n, guilty|adj ], grammar: [ en-g2-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-006, text: Corruption weakens people's trust in the legal system., vi: Tham nhũng làm suy giảm niềm tin của người dân vào hệ thống pháp luật., words: [ corruption|n, legal-system|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-007, text: "Long-term imprisonment separates offenders from their families. Furthermore, it makes it harder for them to find work later.", vi: "Án tù dài hạn tách người phạm tội khỏi gia đình. Ngoài ra, nó khiến họ khó tìm việc sau này.", words: [ imprisonment|n, furthermore|adv ], grammar: [ en-g3-06 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-008, text: "Some countries have strict drug laws, whereas others focus on treatment.", vi: "Một số nước có luật ma túy nghiêm khắc, trong khi những nước khác tập trung vào điều trị.", words: [ whereas|conj ], grammar: [ en-g3-06 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-009, text: "Harsh sentences may deter adults. Conversely, they may push teenagers further into crime.", vi: "Án nặng có thể răn đe người lớn. Ngược lại, chúng có thể đẩy thanh thiếu niên sâu hơn vào con đường phạm tội.", words: [ conversely|adv ], grammar: [ en-g3-06 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-010, text: "The aim of the justice system should be to protect society. As a result, rehabilitation matters as much as punishment.", vi: "Mục tiêu của hệ thống tư pháp phải là bảo vệ xã hội. Vì vậy, cải tạo cũng quan trọng như trừng phạt.", words: [ justice|n, as-a-result|idiom, rehabilitation|n ], grammar: [ en-g3-06 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b51-011, text: "The policy was unpopular at first. It reduced crime, nonetheless.", vi: "Chính sách lúc đầu không được ủng hộ. Dù vậy, nó vẫn làm giảm tội phạm.", words: [ nonetheless|adv ], grammar: [ en-g3-06 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
