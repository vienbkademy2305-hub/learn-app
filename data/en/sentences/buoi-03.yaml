  - { id: b03-016, text: My bed has soft cotton sheets., vi: Giường tôi có ga trải bằng vải bông mềm., words: [ soft|adj, cotton|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b03-017, text: What colour is your bedroom? It's light blue., vi: Phòng ngủ của bạn màu gì? Màu xanh nhạt., words: [ colour|n, bedroom|n ], grammar: [], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b03-018, text: "Our house is narrow, but the balcony is wide.", vi: Nhà chúng tôi hẹp nhưng ban công thì rộng., words: [ narrow|adj, wide|adj, balcony|n ], grammar: [ en-g1-02 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b03-019, text: There is a red carpet under the table., vi: Có một tấm thảm đỏ dưới gầm bàn., words: [ carpet|n, under|prep ], grammar: [ en-g1-03 ], cefr: A1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b03-020, text: We keep our motorbikes in the garage., vi: Chúng tôi để xe máy trong ga-ra., words: [ garage|n ], grammar: [ en-g1-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
