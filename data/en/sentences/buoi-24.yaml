# Câu xuất hiện lần đầu ở Buổi 24. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b24-001, text: I prefer walking in the park to staying at home., vi: Tôi thích đi bộ trong công viên hơn là ở nhà., words: [ prefer|v ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-002, text: I'm really keen on outdoor activities like cycling and camping., vi: Tôi rất mê các hoạt động ngoài trời như đạp xe và cắm trại., words: [ keen-on|colloc, outdoor|adj ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-003, text: I would rather live in the countryside than in a big city., vi: Tôi thà sống ở nông thôn còn hơn ở thành phố lớn., words: [ would-rather|colloc, countryside|n ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-004, text: "My hometown is quite peaceful, but the main road is noisy in the morning.", vi: "Quê tôi khá yên bình, nhưng con đường chính thì ồn ào vào buổi sáng.", words: [ peaceful|adj, noisy|adj, hometown|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-005, text: I go for a walk by the lake every evening to get some fresh air., vi: Tối nào tôi cũng đi dạo bên hồ để hít thở không khí trong lành., words: [ go-for-a-walk|colloc, fresh-air|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-006, text: There are not many green spaces in the city centre., vi: Trung tâm thành phố không có nhiều không gian xanh., words: [ green-space|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-007, text: The river near my house is badly polluted., vi: Con sông gần nhà tôi bị ô nhiễm nặng., words: [ polluted|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-008, text: Spending time in nature helps me relax after work., vi: Dành thời gian giữa thiên nhiên giúp tôi thư giãn sau giờ làm., words: [ nature|n, spend-time|colloc ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-009, text: "Last spring, my class planted fifty trees near the school.", vi: "Mùa xuân năm ngoái, lớp tôi đã trồng năm mươi cây gần trường.", words: [ plant|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-010, text: "To be honest, I'm not very keen on hot weather.", vi: "Thật lòng mà nói, tôi không thích thời tiết nóng lắm.", words: [ keen-on|colloc ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-011, text: "These days I'm into gardening, so I spend a lot of time outdoors.", vi: "Dạo này tôi mê làm vườn, nên tôi ở ngoài trời rất nhiều.", words: [ gardening|n ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b24-012, text: "I can't stand traffic jams, so I usually go to work by bike.", vi: "Tôi không chịu nổi tắc đường, nên tôi thường đi làm bằng xe đạp.", words: [ traffic-jam|phr-n ], grammar: [ en-g2-04 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
