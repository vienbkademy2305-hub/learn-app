# Câu xuất hiện lần đầu ở Buổi 29. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b29-001, text: A new law against drink-driving is being discussed., vi: Một luật mới chống lái xe khi say rượu đang được thảo luận., words: [ law|n ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-002, text: Three men have been arrested for stealing motorbikes., vi: Ba người đàn ông đã bị bắt vì trộm xe máy., words: [ arrest|v, steal|v ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-003, text: The shop was being robbed when the police arrived., vi: Cửa hàng đang bị cướp thì cảnh sát đến., words: [], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-004, text: The thief will be sent to prison for two years., vi: Tên trộm sẽ bị đưa vào tù hai năm., words: [ thief|n, prison|n ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-005, text: More security cameras have been installed in the city centre., vi: Nhiều camera an ninh hơn đã được lắp ở trung tâm thành phố., words: [ security-camera|phr-n ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-006, text: Most crimes in big cities are committed at night., vi: Phần lớn tội phạm ở thành phố lớn xảy ra vào ban đêm., words: [ crime|n, commit|v ], grammar: [ en-g1-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-007, text: The criminal was caught by a security guard., vi: Kẻ phạm tội bị một bảo vệ bắt được., words: [ criminal|n ], grammar: [ en-g1-19 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-008, text: It is illegal to drive without a licence., vi: Lái xe không có bằng là bất hợp pháp., words: [ illegal|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-009, text: The victim told the police what happened., vi: Nạn nhân kể cho cảnh sát chuyện đã xảy ra., words: [ victim|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-010, text: A witness saw the car and remembered the number., vi: Một nhân chứng thấy chiếc xe và nhớ biển số., words: [ witness|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-011, text: He had to pay a fine for parking on the pavement., vi: Anh ấy phải nộp phạt vì đỗ xe trên vỉa hè., words: [ fine|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-012, text: Some people think prison is not the best punishment for young offenders., vi: Một số người cho rằng tù không phải hình phạt tốt nhất cho người phạm tội trẻ tuổi., words: [ punishment|n, offender|n, prison|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-013, text: The judge decided that the man was not guilty., vi: Thẩm phán kết luận người đàn ông vô tội., words: [ judge|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b29-014, text: I had my phone stolen on the bus last week., vi: Tuần trước tôi bị trộm mất điện thoại trên xe buýt., words: [ steal|v ], grammar: [ en-g2-09 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
