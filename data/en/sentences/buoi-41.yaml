# Câu xuất hiện lần đầu ở Buổi 41. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b41-001, text: Buying imported goods has become much easier because of globalisation., vi: Mua hàng nhập khẩu đã trở nên dễ dàng hơn nhiều nhờ toàn cầu hóa., words: [ goods|n, globalisation|n ], grammar: [ en-g2-21 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-002, text: "Instead of eating fast food, we should try traditional dishes.", vi: "Thay vì ăn đồ ăn nhanh, chúng ta nên thử các món truyền thống.", words: [ fast-food|phr-n, traditional|adj ], grammar: [ en-g2-21 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-003, text: It is important to support local businesses in small towns., vi: Việc ủng hộ các doanh nghiệp địa phương ở thị trấn nhỏ là rất quan trọng., words: [ local-business|phr-n ], grammar: [ en-g2-21 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-004, text: Some companies stopped manufacturing in Europe and moved their factories to Asia., vi: Một số công ty ngừng sản xuất ở châu Âu và chuyển nhà máy sang châu Á., words: [ manufacture|v ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-005, text: Multinational corporations often outsource production to countries with lower wages., vi: Các tập đoàn đa quốc gia thường thuê ngoài việc sản xuất ở các nước có lương thấp hơn., words: [ multinational-corporation|phr-n, outsource|v, wage|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-006, text: Consumers benefit from free trade because goods become cheaper., vi: Người tiêu dùng được lợi từ tự do thương mại vì hàng hóa trở nên rẻ hơn., words: [ consumer|n, benefit-from|phr-v, trade|n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-007, text: A problem in one factory can affect global supply chains., vi: Một sự cố ở một nhà máy có thể ảnh hưởng đến chuỗi cung ứng toàn cầu., words: [ global|adj, supply-chain|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-008, text: Some people worry that cultural homogenisation will make every city look the same., vi: Một số người lo rằng sự đồng nhất hóa văn hóa sẽ khiến mọi thành phố trông giống nhau., words: [ cultural-homogenisation|phr-n ], grammar: [], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-009, text: Removing trade barriers has had a big impact on Vietnam's exports., vi: Việc dỡ bỏ rào cản thương mại đã tác động lớn đến xuất khẩu của Việt Nam., words: [ trade-barrier|phr-n, impact|n ], grammar: [ en-g2-21, en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b41-010, text: "In an interconnected world, a crisis in one country quickly spreads to others.", vi: "Trong một thế giới kết nối chặt chẽ, khủng hoảng ở một nước nhanh chóng lan sang nước khác.", words: [ interconnected|adj, spread|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
