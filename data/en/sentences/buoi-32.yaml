# Câu xuất hiện lần đầu ở Buổi 32. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b32-001, text: Children often copy their parents because they see them as role models., vi: Trẻ em thường bắt chước bố mẹ vì chúng coi bố mẹ là tấm gương., words: [ role-model|phr-n ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-002, text: Many young people feel stressed because of their parents' high expectations., vi: Nhiều người trẻ thấy căng thẳng vì kỳ vọng cao của bố mẹ., words: [ expectation|n ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-003, text: "Gender roles have changed. For example, many fathers now cook and look after the children.", vi: "Vai trò giới đã thay đổi. Ví dụ, nhiều ông bố giờ nấu ăn và chăm con.", words: [ gender-role|phr-n, look-after|phr-v ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-004, text: Parents should teach life skills such as cooking and saving money., vi: Bố mẹ nên dạy các kỹ năng sống như nấu ăn và tiết kiệm tiền., words: [ such-as|prep ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-005, text: "Nowadays, teenagers are influenced more by social media than by their parents.", vi: "Ngày nay, thanh thiếu niên chịu ảnh hưởng từ mạng xã hội nhiều hơn từ bố mẹ.", words: [ nowadays|adv, teenager|n, influence|v, social-media|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-006, text: Some teenagers start smoking due to peer pressure., vi: Một số thiếu niên bắt đầu hút thuốc do áp lực bạn bè., words: [ due-to|prep, peer-pressure|phr-n ], grammar: [ en-g2-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-007, text: "If parents are too strict, their children may not communicate with them openly.", vi: "Nếu bố mẹ quá nghiêm khắc, con cái có thể không cởi mở trò chuyện với họ.", words: [ strict|adj, communicate|v ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-008, text: Grandparents sometimes spoil their grandchildren by giving them too many sweets., vi: Ông bà đôi khi nuông chiều cháu bằng cách cho chúng quá nhiều bánh kẹo., words: [ spoil|v, grandparent|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-009, text: "Gender equality starts at home, when boys and girls do the same household chores.", vi: "Bình đẳng giới bắt đầu từ trong nhà, khi con trai và con gái cùng làm việc nhà như nhau.", words: [ equality|n, household-chore|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-010, text: A happy childhood can have a positive influence on a person's attitude to life., vi: Một tuổi thơ hạnh phúc có thể ảnh hưởng tích cực đến thái độ sống của một người., words: [ childhood|n, attitude|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-011, text: "Children learn good behaviour mainly from their families, not from school.", vi: "Trẻ học cách cư xử tốt chủ yếu từ gia đình, không phải từ trường học.", words: [ behaviour|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b32-012, text: "For instance, in my family, we eat dinner together and share our values.", vi: "Chẳng hạn, trong gia đình tôi, cả nhà ăn tối cùng nhau và chia sẻ những giá trị chung.", words: [ for-instance|idiom, value|n ], grammar: [ en-g2-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
