# Câu xuất hiện lần đầu ở Buổi 25. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b25-001, text: A software engineer is a person who writes computer programs., vi: Kỹ sư phần mềm là người viết chương trình máy tính., words: [ software|n, engineer|n ], grammar: [ en-g2-05 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-002, text: Smartphones are devices which can do almost everything., vi: Điện thoại thông minh là thiết bị làm được gần như mọi thứ., words: [ device|n, smartphone|n ], grammar: [ en-g2-05 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-003, text: The app that I use most is a dictionary., vi: Ứng dụng tôi dùng nhiều nhất là từ điển., words: [ app|n ], grammar: [ en-g2-05 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-004, text: Artificial intelligence is technology that can learn from data., vi: Trí tuệ nhân tạo là công nghệ có thể học từ dữ liệu., words: [ artificial-intelligence|phr-n, technology|n, data|n ], grammar: [ en-g2-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-005, text: Children who have too much screen time often sleep badly., vi: Trẻ dùng màn hình quá nhiều thường ngủ không ngon., words: [ screen-time|phr-n ], grammar: [ en-g2-05 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-006, text: Automation has replaced many jobs in factories., vi: Tự động hóa đã thay thế nhiều công việc trong nhà máy., words: [ automation|n, factory|n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-007, text: "Social media helps people keep in touch, but it can waste a lot of time.", vi: "Mạng xã hội giúp mọi người giữ liên lạc, nhưng có thể làm tốn nhiều thời gian.", words: [ social-media|phr-n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-008, text: Many teenagers are addicted to their phones., vi: Nhiều thiếu niên nghiện điện thoại., words: [ addicted-to|colloc ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-009, text: Online banking is very convenient for busy people., vi: Ngân hàng trực tuyến rất tiện cho người bận rộn., words: [ convenient|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-010, text: Older people need digital literacy to use online services safely., vi: Người lớn tuổi cần kỹ năng số để dùng dịch vụ trực tuyến an toàn., words: [ digital-literacy|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-011, text: You can access the internet almost everywhere in Vietnam., vi: Ở Việt Nam bạn có thể truy cập internet gần như ở mọi nơi., words: [ access|v, internet|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-012, text: Users should protect their privacy online., vi: Người dùng nên bảo vệ quyền riêng tư của mình trên mạng., words: [ user|n, privacy|n, protect|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-013, text: Robots which clean the floor are now common in many homes., vi: Rô-bốt lau nhà giờ đã phổ biến ở nhiều gia đình., words: [ robot|n ], grammar: [ en-g2-05 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-014, text: Fake news spreads very quickly on social media., vi: Tin giả lan truyền rất nhanh trên mạng xã hội., words: [ fake-news|phr-n, social-media|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b25-015, text: This is the shop where I bought my first laptop., vi: Đây là cửa hàng nơi tôi mua chiếc máy tính xách tay đầu tiên., words: [ laptop|n ], grammar: [ en-g2-05 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
