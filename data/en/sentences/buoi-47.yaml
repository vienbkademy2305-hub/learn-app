# Câu xuất hiện lần đầu ở Buổi 47. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b47-001, text: The old factory in the east of the town was demolished in 2005., vi: Nhà máy cũ ở phía đông thị trấn bị phá dỡ vào năm 2005., words: [ demolish|v ], grammar: [ en-g3-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-002, text: The farmland to the north of the river was replaced by a residential area., vi: Đất nông nghiệp ở phía bắc con sông đã được thay bằng một khu dân cư., words: [ farmland|n, residential|adj ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-003, text: "Since 2000, the harbour has been converted into a shopping centre.", vi: "Từ năm 2000, bến cảng đã được chuyển thành một trung tâm mua sắm.", words: [ convert|v ], grammar: [ en-g3-02, en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-004, text: The woodland in the south made way for a large car park., vi: Khu rừng ở phía nam nhường chỗ cho một bãi đỗ xe lớn., words: [ woodland|n, make-way-for|phr-v ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-005, text: The two maps show how the layout of the village changed between 1990 and 2020., vi: Hai bản đồ cho thấy bố cục của ngôi làng đã thay đổi thế nào từ năm 1990 đến 2020., words: [ layout|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-006, text: "Overall, the village was transformed from a farming community into a small town.", vi: "Nhìn chung, ngôi làng đã biến đổi từ một cộng đồng làm nông thành một thị trấn nhỏ.", words: [ transform|v ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-007, text: "The main road was extended to the coast, and a cycle lane was added along it.", vi: "Con đường chính được kéo dài ra đến bờ biển, và một làn xe đạp được thêm dọc theo nó.", words: [ extend|v, cycle-lane|phr-n ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-008, text: "The hospital was expanded, while the market was relocated to the west.", vi: "Bệnh viện được mở rộng, trong khi chợ được di dời sang phía tây.", words: [ expand|v, relocate|v ], grammar: [ en-g3-02, en-g2-14 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-009, text: An industrial zone has been constructed next to the railway station., vi: Một khu công nghiệp đã được xây dựng bên cạnh nhà ga., words: [ industrial|adj, construct|v ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-010, text: A new footpath makes the beach more accessible to visitors., vi: Một lối đi bộ mới giúp du khách dễ ra bãi biển hơn., words: [ footpath|n, accessible|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-011, text: The most dramatic change was the removal of the trees in the centre., vi: Thay đổi đáng kể nhất là việc dỡ bỏ cây xanh ở trung tâm., words: [ dramatic|adj, remove|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b47-012, text: "After the redevelopment, the church remained unchanged.", vi: "Sau đợt cải tạo, nhà thờ vẫn giữ nguyên.", words: [ redevelopment|n ], grammar: [ en-g3-02 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
