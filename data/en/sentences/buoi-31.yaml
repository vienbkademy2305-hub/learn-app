# Câu xuất hiện lần đầu ở Buổi 31. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b31-001, text: "If parents work long hours, their children will spend more time alone.", vi: "Nếu bố mẹ làm việc nhiều giờ, con cái sẽ ở một mình nhiều hơn.", words: [ parent|n ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-002, text: "If my grandparents live with us, they can help look after my little brother.", vi: "Nếu ông bà sống cùng chúng tôi, ông bà có thể giúp trông em trai tôi.", words: [ grandparent|n, look-after|phr-v ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-003, text: "Unless we talk to each other more, the generation gap will get wider.", vi: "Nếu chúng ta không nói chuyện với nhau nhiều hơn, khoảng cách thế hệ sẽ ngày càng lớn.", words: [ unless|conj, generation-gap|phr-n ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-004, text: Children will learn responsibility if they do household chores., vi: Trẻ em sẽ học được tính trách nhiệm nếu chúng làm việc nhà., words: [ responsibility|n, household-chore|phr-n ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-005, text: "In Vietnam, many people still live with their extended family.", vi: "Ở Việt Nam, nhiều người vẫn sống cùng đại gia đình.", words: [ extended-family|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-006, text: The nuclear family has become more common in big cities., vi: Gia đình hạt nhân đã trở nên phổ biến hơn ở các thành phố lớn., words: [ nuclear-family|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-007, text: I was brought up by my grandmother because my parents worked abroad., vi: Tôi được bà nuôi dạy vì bố mẹ tôi làm việc ở nước ngoài., words: [ bring-up|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-008, text: Many adults find it hard to have a good work-life balance., vi: Nhiều người trưởng thành thấy khó cân bằng giữa công việc và cuộc sống., words: [ work-life-balance|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-009, text: "In a close-knit family, everyone supports each other.", vi: "Trong một gia đình gắn bó, mọi người đều hỗ trợ lẫn nhau.", words: [ close-knit|adj, support|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-010, text: "Young people should respect traditional values, but they don't have to follow all of them.", vi: "Người trẻ nên tôn trọng các giá trị truyền thống, nhưng không nhất thiết phải làm theo tất cả.", words: [ respect|v, traditional|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-011, text: "I get on well with my father, but we sometimes argue about my future.", vi: "Tôi hòa hợp với bố, nhưng thỉnh thoảng hai bố con tranh cãi về tương lai của tôi.", words: [ get-on-with|phr-v, argue|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b31-012, text: "When my father retires next year, he will spend more time with his elderly parents.", vi: "Khi bố tôi nghỉ hưu vào năm sau, ông sẽ dành nhiều thời gian hơn cho ông bà nội đã cao tuổi.", words: [ retire|v, elderly|adj ], grammar: [ en-g2-11 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
