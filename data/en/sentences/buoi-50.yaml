# Câu xuất hiện lần đầu ở Buổi 50. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b50-001, text: There has been a significant reduction in petty crime since the cameras were installed., vi: Tội vặt đã giảm đáng kể kể từ khi camera được lắp đặt., words: [ reduction|n, petty-crime|phr-n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-002, text: The rise in cybercrime has worried many governments., vi: Sự gia tăng tội phạm mạng khiến nhiều chính phủ lo ngại., words: [ cybercrime|n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-003, text: The rehabilitation of young offenders should be a priority., vi: Việc cải tạo người phạm tội trẻ tuổi nên được ưu tiên., words: [ rehabilitation|n, offender|n, priority|n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-004, text: Poverty and a lack of education are two root causes of juvenile crime., vi: Nghèo đói và thiếu giáo dục là hai nguyên nhân gốc rễ của tội phạm vị thành niên., words: [ poverty|n, root-cause|phr-n, juvenile-crime|phr-n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-005, text: Offenders who receive education in prison are less likely to reoffend., vi: Người phạm tội được học tập trong tù ít có khả năng tái phạm hơn., words: [ reoffend|v ], grammar: [ en-g2-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-006, text: Long prison sentences do not always act as a deterrent., vi: Án tù dài không phải lúc nào cũng có tác dụng răn đe., words: [ sentence|n, deterrent|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-007, text: The police have cracked down on drink-driving during the holiday season., vi: Cảnh sát đã trấn áp mạnh tay việc lái xe sau khi uống rượu trong mùa lễ., words: [ crack-down-on|phr-v ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-008, text: More video surveillance may lead to an increase in public safety., vi: Giám sát bằng camera nhiều hơn có thể giúp tăng an toàn công cộng., words: [ surveillance|n, increase|n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-009, text: Anyone who commits a serious offence should be punished., vi: Bất cứ ai phạm tội nghiêm trọng đều nên bị trừng phạt., words: [ offence|n ], grammar: [ en-g2-05, en-g2-23 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-010, text: Strict law enforcement is needed to reduce violent crime., vi: Cần thực thi pháp luật nghiêm để giảm tội phạm bạo lực., words: [ law-enforcement|phr-n, violent-crime|phr-n ], grammar: [ en-g2-19 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b50-011, text: Crime prevention programmes in schools can rehabilitate young people before it is too late., vi: Các chương trình phòng chống tội phạm ở trường học có thể giúp cải tạo người trẻ trước khi quá muộn., words: [ prevention|n, rehabilitate|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
