# Câu xuất hiện lần đầu ở Buổi 53. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b53-001, text: "While it is true that automation causes job displacement, it also creates new kinds of work.", vi: "Mặc dù đúng là tự động hóa khiến người lao động mất việc, nó cũng tạo ra những loại việc mới.", words: [ job-displacement|phr-n, automation|n ], grammar: [ en-g3-08 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-002, text: "Admittedly, smartphones are convenient. However, our reliance on them may be harmful.", vi: "Phải thừa nhận điện thoại thông minh rất tiện. Tuy nhiên, việc phụ thuộc vào chúng có thể có hại.", words: [ admittedly|adv, reliance|n ], grammar: [ en-g3-08 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-003, text: "I can see why older people worry, but most young people are tech-savvy enough to stay safe online.", vi: "Tôi hiểu vì sao người lớn tuổi lo lắng, nhưng phần lớn người trẻ đủ rành công nghệ để an toàn trên mạng.", words: [ tech-savvy|adj ], grammar: [ en-g3-08 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-004, text: "That's a valid point. Having said that, I think we tend to overestimate the risks.", vi: "Đó là một ý có cơ sở. Dù vậy, tôi nghĩ chúng ta thường đánh giá quá cao rủi ro.", words: [ valid|adj, having-said-that|idiom, overestimate|v ], grammar: [ en-g3-08, en-g3-04 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-005, text: Many older people rely on their children to use online banking., vi: Nhiều người lớn tuổi phải dựa vào con cái để dùng ngân hàng trực tuyến., words: [ rely-on|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-006, text: The digital divide between cities and rural areas is still wide., vi: Khoảng cách số giữa thành phố và nông thôn vẫn còn lớn., words: [ digital-divide|phr-n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-007, text: "Spending hours online can lead to social isolation, especially among teenagers.", vi: "Dành hàng giờ trên mạng có thể dẫn đến cô lập xã hội, nhất là ở thanh thiếu niên.", words: [ social-isolation|phr-n ], grammar: [ en-g2-24 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-008, text: "Some skills will become obsolete, so workers need to upskill regularly.", vi: "Một số kỹ năng sẽ trở nên lỗi thời, nên người lao động cần thường xuyên nâng cao kỹ năng.", words: [ obsolete|adj, upskill|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-009, text: It seems inevitable that technology will keep changing the way we work., vi: Dường như không thể tránh khỏi việc công nghệ sẽ tiếp tục thay đổi cách chúng ta làm việc., words: [ inevitable|adj ], grammar: [ en-g3-07 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-010, text: "From an economic perspective, innovation is essential for growth.", vi: "Từ góc độ kinh tế, đổi mới là yếu tố thiết yếu cho tăng trưởng.", words: [ perspective|n, innovation|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-011, text: A strong essay considers the counterargument before rejecting it., vi: Một bài luận tốt cân nhắc lập luận phản bác trước khi bác bỏ nó., words: [ counterargument|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b53-012, text: The convenience of online shopping has changed the way people spend their weekends., vi: Sự tiện lợi của mua sắm trực tuyến đã thay đổi cách mọi người dành thời gian cuối tuần., words: [ convenience|n ], grammar: [ en-g3-05 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
