# Câu xuất hiện lần đầu ở Buổi 57. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b57-001, text: "Eating with chopsticks was hard at first, but I soon got the hang of it.", vi: "Ăn bằng đũa lúc đầu khó, nhưng tôi nhanh chóng quen tay.", words: [ get-the-hang-of|idiom ], grammar: [ en-g3-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-002, text: The smell of pho always brings back memories of my grandmother's kitchen., vi: Mùi phở luôn gợi lại kỷ niệm về gian bếp của bà tôi., words: [ bring-back-memories|idiom ], grammar: [ en-g3-12 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-003, text: I used to take my parents for granted until I moved abroad., vi: Tôi từng coi bố mẹ là điều hiển nhiên cho đến khi ra nước ngoài., words: [ take-for-granted|idiom ], grammar: [ en-g3-12, en-g2-08 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-004, text: I'm really looking forward to visiting my hometown during Tet., vi: Tôi rất mong được về quê dịp Tết., words: [ look-forward-to|phr-v ], grammar: [ en-g3-12 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-005, text: Life in Hanoi today is a far cry from what it was when I was growing up., vi: Cuộc sống ở Hà Nội ngày nay khác xa so với hồi tôi còn nhỏ., words: [ a-far-cry-from|idiom, grow-up|phr-v ], grammar: [], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-006, text: "When I first studied abroad, I experienced culture shock and felt very homesick.", vi: "Lần đầu du học, tôi bị sốc văn hóa và rất nhớ nhà.", words: [ culture-shock|phr-n, homesick|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-007, text: "It took me a few months to fit in, but now I feel at home here.", vi: "Tôi mất vài tháng để hòa nhập, nhưng giờ tôi thấy như ở nhà.", words: [ fit-in|phr-v, feel-at-home|idiom ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-008, text: Travelling alone made me more open-minded., vi: Đi du lịch một mình khiến tôi cởi mở hơn., words: [ open-minded|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-009, text: Older people sometimes find it hard to keep up with new technology., vi: Người lớn tuổi đôi khi thấy khó theo kịp công nghệ mới., words: [ keep-up-with|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-010, text: I came across some old family photos while I was cleaning the house., vi: Tôi tình cờ thấy vài tấm ảnh gia đình cũ khi đang dọn nhà., words: [ come-across|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-011, text: What stood out most about the trip was how friendly the local people were., vi: Điều nổi bật nhất trong chuyến đi là người dân địa phương thân thiện như thế nào., words: [ stand-out|phr-v ], grammar: [ en-g3-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b57-012, text: "At weekends, I usually catch up on sleep and call my family.", vi: "Cuối tuần, tôi thường ngủ bù và gọi điện cho gia đình.", words: [ catch-up-on|phr-v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
