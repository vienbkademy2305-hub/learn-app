# Câu xuất hiện lần đầu ở Buổi 22. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b22-001, text: "Students wear uniforms, so they do not worry about clothes.", vi: Học sinh mặc đồng phục nên không phải lo về quần áo., words: [ uniform|n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-002, text: Many people believe that homework is essential for learning., vi: Nhiều người tin rằng bài tập về nhà rất cần thiết cho việc học., words: [ believe|v, essential|adj, homework|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-003, text: I disagree with this opinion because it is not fair to poor students., vi: Tôi không đồng ý với ý kiến này vì nó không công bằng với học sinh nghèo., words: [ disagree|v, opinion|n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-004, text: Art lessons can develop children's creativity., vi: Giờ học mỹ thuật có thể phát triển khả năng sáng tạo của trẻ., words: [ develop|v, creativity|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-005, text: One benefit of group work is that students learn from each other., vi: Một lợi ích của làm việc nhóm là học sinh học hỏi lẫn nhau., words: [ benefit|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-006, text: The main drawback of online classes is the lack of contact with teachers., vi: Nhược điểm chính của lớp học online là thiếu tiếp xúc với giáo viên., words: [ drawback|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-007, text: Some people argue that sport should be compulsory at school., vi: Một số người cho rằng thể thao nên là môn bắt buộc ở trường., words: [ argue|v, compulsory|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-008, text: "When children have too much homework, they feel a lot of pressure.", vi: "Khi trẻ có quá nhiều bài tập về nhà, chúng cảm thấy rất áp lực.", words: [ pressure|n, homework|n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-009, text: University students should be more independent than school children., vi: Sinh viên đại học nên tự lập hơn học sinh phổ thông., words: [ independent|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-010, text: Cooking and managing money are practical skills., vi: Nấu ăn và quản lý tiền bạc là những kỹ năng thực tế., words: [ practical|adj, skill|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-011, text: "If students learn critical thinking, they can solve problems better.", vi: "Nếu học sinh học tư duy phản biện, các em có thể giải quyết vấn đề tốt hơn.", words: [ critical-thinking|phr-n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-012, text: "You can agree or disagree, but you must give clear reasons.", vi: "Bạn có thể đồng ý hoặc phản đối, nhưng phải đưa ra lý do rõ ràng.", words: [ disagree|v, reason|n ], grammar: [ en-g2-02 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-013, text: Too much screen time can have a negative effect on children., vi: Dùng màn hình quá nhiều có thể ảnh hưởng tiêu cực đến trẻ em., words: [ negative|adj, screen|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b22-014, text: Sport has a positive effect on students' health., vi: Thể thao có ảnh hưởng tích cực đến sức khỏe của học sinh., words: [ positive|adj ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
