# Câu xuất hiện lần đầu ở Buổi 61. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b61-001, text: "I had never performed in front of an audience before, so I had terrible stage fright.", vi: "Tôi chưa từng biểu diễn trước khán giả, nên tôi run sợ sân khấu kinh khủng.", words: [ stage-fright|phr-n, audience|n ], grammar: [ en-g3-16 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-002, text: We had been rehearsing every evening for two months before the show., vi: Chúng tôi đã tập dượt mỗi tối suốt hai tháng trước buổi diễn., words: [ rehearse|v ], grammar: [ en-g3-16 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-003, text: "By the time the applause started, I had forgotten all my fears.", vi: "Đến khi tràng pháo tay vang lên, tôi đã quên hết mọi nỗi sợ.", words: [ applause|n ], grammar: [ en-g3-16 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-004, text: "I passed the audition, although I had failed twice before.", vi: "Tôi đã qua buổi thử giọng, dù trước đó đã trượt hai lần.", words: [ audition|n ], grammar: [ en-g3-16 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-005, text: "Getting into university was a milestone, but moving abroad was the real turning point.", vi: "Đỗ đại học là một cột mốc, nhưng ra nước ngoài mới là bước ngoặt thật sự.", words: [ milestone|n, turning-point|phr-n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-006, text: I still vividly remember the day I overcame my fear of speaking in public., vi: Tôi vẫn nhớ rõ ngày tôi vượt qua nỗi sợ nói trước đám đông., words: [ vividly|adv, overcome|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-007, text: "Looking back on it, the experience was extremely rewarding.", vi: Nhìn lại thì trải nghiệm đó rất đáng giá., words: [ look-back-on|phr-v, rewarding|adj ], grammar: [ en-g3-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-008, text: Finishing the marathon gave me a real sense of accomplishment., vi: Hoàn thành cuộc chạy marathon cho tôi cảm giác thành tựu thật sự., words: [ accomplishment|n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-009, text: It took a lot of perseverance and dedication to learn the piano as an adult., vi: Học piano khi đã trưởng thành đòi hỏi rất nhiều kiên trì và tận tâm., words: [ perseverance|n, dedication|n ], grammar: [ en-g1-29 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-010, text: That old song always makes me feel nostalgic about my student days., vi: Bài hát cũ đó luôn khiến tôi hoài niệm về thời sinh viên., words: [ nostalgic|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-011, text: "In hindsight, the competition helped me build my self-confidence.", vi: "Giờ nghĩ lại, cuộc thi đã giúp tôi xây dựng sự tự tin.", words: [ in-hindsight|idiom, self-confidence|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b61-012, text: "It was an unforgettable night, thanks to her determination to make everything perfect.", vi: "Đó là một đêm không thể quên, nhờ quyết tâm làm mọi thứ hoàn hảo của cô ấy.", words: [ unforgettable|adj, determination|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
