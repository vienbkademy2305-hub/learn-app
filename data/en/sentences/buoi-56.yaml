# Câu xuất hiện lần đầu ở Buổi 56. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b56-001, text: "Having grown up in a handicraft village, she learnt to make silk at the age of ten.", vi: "Lớn lên ở một làng nghề thủ công, cô đã học dệt lụa từ năm mười tuổi.", words: [ handicraft|n ], grammar: [ en-g3-11 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-002, text: "Built over five hundred years ago, the temple is still a place of worship.", vi: "Được xây hơn năm trăm năm trước, ngôi đền vẫn là nơi thờ cúng.", words: [ worship|v ], grammar: [ en-g3-11 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-003, text: Songs handed down from generation to generation are an important part of intangible heritage., vi: Những bài hát được truyền từ đời này sang đời khác là một phần quan trọng của di sản phi vật thể., words: [ hand-down|phr-v, generation|n, intangible|adj ], grammar: [ en-g3-11 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-004, text: Many young people living in cities no longer speak their grandparents' dialect., vi: Nhiều người trẻ sống ở thành phố không còn nói phương ngữ của ông bà., words: [ dialect|n ], grammar: [ en-g3-11 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-005, text: Ancestor worship is a central ritual in many Vietnamese families., vi: Thờ cúng tổ tiên là một nghi lễ trọng tâm trong nhiều gia đình Việt Nam., words: [ ancestor|n, ritual|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-006, text: Language is a key part of a community's identity., vi: Ngôn ngữ là một phần then chốt trong bản sắc của một cộng đồng., words: [ identity|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-007, text: Some ethnic minorities fear that their children will assimilate into mainstream culture., vi: Một số dân tộc thiểu số lo rằng con cái họ sẽ bị hòa lẫn vào văn hóa đa số., words: [ ethnic-minority|phr-n, assimilate|v ], grammar: [], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-008, text: Indigenous languages are disappearing faster than ever before., vi: Các ngôn ngữ bản địa đang biến mất nhanh hơn bao giờ hết., words: [ indigenous|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-009, text: Tourism has helped to revive interest in traditional craftsmanship., vi: Du lịch đã giúp khơi lại sự quan tâm đến tay nghề truyền thống., words: [ revive|v, craftsmanship|n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-010, text: Critics say the festival has become too commercialised., vi: Những người chỉ trích nói lễ hội đã bị thương mại hóa quá mức., words: [ commercialise|v ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b56-011, text: Many descendants of Vietnamese immigrants still tell stories from folklore., vi: Nhiều hậu duệ của người Việt di cư vẫn kể những câu chuyện dân gian., words: [ descendant|n, folklore|n ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
