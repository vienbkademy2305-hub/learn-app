# Câu xuất hiện lần đầu ở Buổi 54. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b54-001, text: What worries doctors most is the rise in chronic diseases among young people., vi: Điều khiến các bác sĩ lo nhất là sự gia tăng bệnh mãn tính ở người trẻ., words: [ chronic-disease|phr-n ], grammar: [ en-g3-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-002, text: It is widely accepted that prevention is cheaper than treatment., vi: Người ta thừa nhận rộng rãi rằng phòng ngừa rẻ hơn điều trị., words: [ prevention|n ], grammar: [ en-g3-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-003, text: Nobody knows whether the new campaign will improve people's mental health., vi: Không ai biết liệu chiến dịch mới có cải thiện sức khỏe tinh thần của người dân không., words: [ mental-health|phr-n, campaign|n ], grammar: [ en-g3-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-004, text: Researchers are studying why life expectancy is higher in some regions., vi: Các nhà nghiên cứu đang tìm hiểu vì sao tuổi thọ ở một số vùng cao hơn., words: [ life-expectancy|phr-n ], grammar: [ en-g3-09 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-005, text: The fact that vaccination is free has helped to stop several outbreaks., vi: Việc tiêm chủng miễn phí đã giúp ngăn chặn một số đợt bùng phát., words: [ vaccination|n, outbreak|n ], grammar: [ en-g3-09 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-006, text: Good hygiene and clean water reduce the spread of infectious diseases., vi: Vệ sinh tốt và nước sạch giảm sự lây lan của bệnh truyền nhiễm., words: [ hygiene|n, infectious|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-007, text: Better sanitation has improved public health in many developing countries., vi: Hệ thống vệ sinh tốt hơn đã cải thiện sức khỏe cộng đồng ở nhiều nước đang phát triển., words: [ sanitation|n, public-health|phr-n ], grammar: [ en-g2-01 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-008, text: Regular check-ups are a simple form of preventive medicine., vi: Khám định kỳ là một hình thức y học phòng ngừa đơn giản., words: [ check-up|n, preventive|adj ], grammar: [], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-009, text: Good nutrition and a balanced diet are essential for children's development., vi: Dinh dưỡng tốt và chế độ ăn cân bằng là thiết yếu cho sự phát triển của trẻ., words: [ nutrition|n, balanced-diet|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-010, text: Spending time in nature improves both physical and mental well-being., vi: Dành thời gian với thiên nhiên cải thiện cả sức khỏe thể chất lẫn tinh thần., words: [ well-being|n ], grammar: [ en-g2-21 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b54-011, text: Some experts warn that there is an epidemic of loneliness in big cities., vi: Một số chuyên gia cảnh báo có một 'đại dịch' cô đơn ở các thành phố lớn., words: [ epidemic|n ], grammar: [ en-g3-09 ], cefr: C1, audio: { tts: true }, source: editorial, status: draft }
