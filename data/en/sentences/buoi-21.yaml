# Câu xuất hiện lần đầu ở Buổi 21. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b21-001, text: I have studied English for two years., vi: Tôi đã học tiếng Anh được hai năm., words: [], grammar: [ en-g2-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-002, text: Have you ever won a scholarship?, vi: Bạn đã bao giờ giành được học bổng chưa?, words: [ scholarship|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-003, text: My sister has just graduated from university., vi: Chị tôi vừa tốt nghiệp đại học., words: [ graduate|v ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-004, text: The cost of higher education has increased a lot recently., vi: Chi phí học đại học gần đây đã tăng nhiều., words: [ higher-education|phr-n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-005, text: Our school has used a new curriculum since 2020., vi: Trường chúng tôi dùng chương trình học mới từ năm 2020., words: [ curriculum|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-006, text: She has improved her writing skills this year., vi: Năm nay cô ấy đã cải thiện kỹ năng viết., words: [ improve|v, skill|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-007, text: Rote learning does not help students understand a subject., vi: Học vẹt không giúp học sinh hiểu một môn học., words: [ rote-learning|phr-n, subject|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-008, text: Many students take part in extracurricular activities after school., vi: Nhiều học sinh tham gia hoạt động ngoại khóa sau giờ học., words: [ extracurricular-activity|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-009, text: Tuition fees at private universities are very high., vi: Học phí ở các trường đại học tư rất cao., words: [ tuition-fee|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-010, text: A good qualification can help you find a better job., vi: Một tấm bằng tốt có thể giúp bạn tìm được việc tốt hơn., words: [ qualification|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-011, text: My lecturer has written three books about education., vi: Giảng viên của tôi đã viết ba cuốn sách về giáo dục., words: [ lecturer|n, education|n ], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-012, text: You can gain a lot of knowledge from books., vi: Bạn có thể thu được nhiều kiến thức từ sách., words: [ knowledge|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-013, text: The main idea of a paragraph is often in the first sentence., vi: Ý chính của một đoạn văn thường nằm ở câu đầu tiên., words: [ main-idea|phr-n, paragraph|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-014, text: She attends English classes three times a week., vi: Cô ấy học lớp tiếng Anh ba buổi một tuần., words: [ attend|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-015, text: He is good at academic subjects like maths and physics., vi: Cậu ấy giỏi các môn học thuật như toán và vật lý., words: [ academic|adj, subject|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-016, text: What do you want to achieve this year?, vi: Năm nay bạn muốn đạt được điều gì?, words: [ achieve|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-017, text: I haven't finished my homework yet., vi: Tôi vẫn chưa làm xong bài tập về nhà., words: [ homework|n ], grammar: [ en-g2-01 ], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-018, text: "I visited Hue last year, but I have never been to Da Lat.", vi: "Năm ngoái tôi đã đến Huế, nhưng tôi chưa bao giờ đến Đà Lạt.", words: [], grammar: [ en-g2-01 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b21-019, text: She has a degree in business from a university in Hanoi., vi: Cô ấy có bằng cử nhân kinh doanh của một trường đại học ở Hà Nội., words: [ degree|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
