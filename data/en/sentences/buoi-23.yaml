# Câu xuất hiện lần đầu ở Buổi 23. Tự soạn (editorial), BẢN NHÁP chờ duyệt.
sentences:
  - { id: b23-001, text: Air pollution in our city has got worse since 2015., vi: Ô nhiễm không khí ở thành phố chúng tôi trở nên tệ hơn kể từ năm 2015., words: [ pollution|n ], grammar: [ en-g2-03 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-002, text: I joined a beach clean-up two years ago., vi: Hai năm trước tôi đã tham gia một buổi dọn rác bãi biển., words: [], grammar: [ en-g2-03 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-003, text: Our group has picked up five tons of rubbish so far., vi: Đến nay nhóm chúng tôi đã nhặt được năm tấn rác., words: [ rubbish|n ], grammar: [ en-g2-03 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-004, text: "Have you ever worked as a volunteer? – Yes, I worked at a national park last summer.", vi: "Bạn đã bao giờ làm tình nguyện viên chưa? – Rồi, mùa hè năm ngoái tôi làm ở một vườn quốc gia.", words: [ volunteer|n ], grammar: [ en-g2-03 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-005, text: Many countries have reduced single-use plastic in the last few years., vi: Nhiều nước đã giảm nhựa dùng một lần trong vài năm gần đây., words: [ reduce|v, single-use-plastic|phr-n ], grammar: [ en-g2-03 ], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-006, text: Climate change is one of the biggest problems today., vi: Biến đổi khí hậu là một trong những vấn đề lớn nhất hiện nay., words: [ climate-change|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-007, text: We should protect the environment for our children., vi: Chúng ta nên bảo vệ môi trường vì con cháu mình., words: [ protect|v, environment|n ], grammar: [], cefr: A2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-008, text: Cars and factories produce a lot of carbon emissions., vi: Ô tô và nhà máy thải ra rất nhiều khí thải carbon., words: [ carbon-emissions|phr-n, factory|n, produce|v ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-009, text: Solar power is a kind of renewable energy., vi: Điện mặt trời là một loại năng lượng tái tạo., words: [ renewable-energy|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-010, text: Deforestation has destroyed the homes of many animals., vi: Nạn phá rừng đã phá hủy nơi sống của nhiều loài động vật., words: [ deforestation|n ], grammar: [ en-g2-03 ], cefr: B2, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-011, text: The saola is an endangered species in Vietnam and Laos., vi: Sao la là một loài có nguy cơ tuyệt chủng ở Việt Nam và Lào., words: [ endangered-species|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-012, text: I always bring a reusable bottle to work., vi: Tôi luôn mang theo một chai nước dùng lại được khi đi làm., words: [ reusable|adj, bottle|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-013, text: Food waste is a big problem in restaurants., vi: Lãng phí thực phẩm là một vấn đề lớn ở các nhà hàng., words: [ waste|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-014, text: Global warming makes summers hotter every year., vi: Sự nóng lên toàn cầu khiến mùa hè mỗi năm một nóng hơn., words: [ global-warming|phr-n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
  - { id: b23-015, text: This shop sells environmentally friendly products., vi: Cửa hàng này bán các sản phẩm thân thiện với môi trường., words: [ environmentally-friendly|adj, product|n ], grammar: [], cefr: B1, audio: { tts: true }, source: editorial, status: draft }
