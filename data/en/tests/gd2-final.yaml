# Kiểm tra đầu ra Giai đoạn 2 (Buổi 21–45). Tự soạn, BẢN NHÁP chờ duyệt.
id: gd2-final
title_vi: "Kiểm tra đầu ra Giai đoạn 2"
stage: 2
kind: final
after_lesson: 45
minutes: 80
pass_percent: 80
intro_vi: >-
  Bài kiểm tra tổng hợp Giai đoạn 2 (Buổi 21–45): từ vựng theo 12 chủ đề IELTS, ngữ pháp câu phức, đọc hiểu nhiều dạng câu
  hỏi, nghe (form, bản đồ, multiple choice, matching, bài giảng) và viết câu. Đạt từ 80% phần chấm tự động trở lên thì sẵn
  sàng sang Giai đoạn 3. Phần viết không chấm tự động — gửi để chữa.
source: editorial
status: draft
sections:
  - title_vi: "Phần 1 · Từ vựng"
    exercises:
      - id: gd2-final-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank: [tuition fees, critical thinking, carbon emissions, screen time, facilities, took up, offender, deter, extended family, cultural heritage, domestic, suburbs]
        questions:
          - { q: "Many students work part-time to pay their ___.", answer: tuition fees, lesson: 21 }
          - { q: "Schools should teach ___, not only rote learning.", answer: critical thinking, lesson: 22 }
          - { q: "Cars and factories produce most of the city's ___.", answer: carbon emissions, lesson: 23 }
          - { q: "Parents worry about their children's ___ on phones and tablets.", answer: screen time, lesson: 25 }
          - { q: "The sports centre has excellent ___: a pool, a gym and four courts.", answer: facilities, lesson: 27 }
          - { q: "My father ___ running when he was forty.", answer: took up, lesson: 28 }
          - { q: "The young ___ was given community service instead of prison.", answer: offender, lesson: 29 }
          - { q: "Harsh punishments may ___ people from committing crimes.", answer: deter, lesson: 30 }
          - { q: "In the countryside, many people still live with their ___.", answer: extended family, lesson: 31 }
          - { q: "Old temples are an important part of our ___.", answer: cultural heritage, lesson: 33 }
          - { q: "Most visitors to Da Lat are ___ tourists, not foreigners.", answer: domestic, lesson: 34 }
          - { q: "Rents are cheaper in the ___ than in the city centre.", answer: suburbs, lesson: 35 }
      - id: gd2-final-x2
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - { q: "Using public transport is more ___ friendly than driving.", base: environment, answer: environmentally, lesson: 23 }
          - { q: "Teenagers who are ___ to their phones sleep less.", base: addiction, answer: addicted, lesson: 25 }
          - { q: "There was a ___ increase in sales in 2020.", base: significantly, answer: significant, lesson: 26 }
          - { q: "Winning the final was the most ___ moment of my life.", base: memory, answer: memorable, lesson: 28 }
          - { q: "Gender ___ is still a problem in some workplaces.", base: equal, answer: equality, lesson: 32 }
          - { q: "Rapid ___ has changed Vietnamese cities.", base: urban, answer: urbanisation, accept: [urbanization], lesson: 35 }
          - { q: "My cousin is studying ___ at university.", base: journalist, answer: journalism, lesson: 37 }
          - { q: "Good ___ need to be objective.", base: journalism, answer: journalists, lesson: 38 }
          - { q: "Vietnam has had rapid ___ growth.", base: economy, answer: economic, lesson: 40 }
          - { q: "The ___ of the new policy took two years.", base: implement, answer: implementation, lesson: 43 }
      - id: gd2-final-x3
        bank_no: 3
        kind: mcq
        instructions_vi: "Collocation: chọn động từ đi đúng với cụm danh từ."
        questions:
          - { q: "___ awareness of the problem", options: [increase, raise, lift, grow], answer: b, lesson: 44 }
          - { q: "___ the generation gap", options: [bridge, close, build, cross], answer: a, lesson: 31 }
          - { q: "___ trade barriers", options: [take, remove, delete, lose], answer: b, lesson: 41 }
          - { q: "___ a peak", options: [get, arrive, reach, go], answer: c, lesson: 26 }
          - { q: "give in to ___", options: [peer pressure, peer stress, friend force, group power], answer: a, lesson: 32 }
          - { q: "go ___ (spread very fast online)", options: [virus, viral, popular, famous], answer: b, lesson: 37 }
  - title_vi: "Phần 2 · Ngữ pháp"
    exercises:
      - id: gd2-final-x4
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - { q: "She ___ three online courses since January.", options: [took, has taken, takes, is taking], answer: b, lesson: 21 }
          - { q: "I ___ to Da Nang last summer.", options: [have been, went, have gone, go], answer: b, lesson: 23 }
          - { q: "I'd rather ___ at home than go out tonight.", options: [stay, to stay, staying, stayed], answer: a, lesson: 24 }
          - { q: "The app ___ I use most is for learning English.", options: [who, which, where, whose], answer: b, lesson: 25 }
          - { q: "The café is ___ the end of the street.", options: [in, on, at, to], answer: c, lesson: 27 }
          - { q: "I'm not used to ___ up so early.", options: [get, getting, got, gets], answer: b, lesson: 28 }
          - { q: "The thief ___ by the police last night.", options: [arrested, was arrested, has arrested, is arresting], answer: b, lesson: 29 }
          - { q: "If it ___ tomorrow, we'll stay at home.", options: [will rain, rains, rained, would rain], answer: b, lesson: 31 }
          - { q: "Some people leave the countryside ___ a lack of jobs.", options: [because, because of, since, so], answer: b, lesson: 32 }
          - { q: "If I ___ you, I would take the train.", options: [am, was being, were, will be], answer: c, lesson: 33 }
          - { q: "Tourists spent ___ money on food than on hotels.", options: [fewer, less, few, little], answer: b, lesson: 34 }
          - { q: "He told me that he ___ a new flat.", options: [has found, had found, finds, will find], answer: b, lesson: 35 }
          - { q: "___ the rain, the festival went ahead.", options: [Although, Despite, However, Even though], answer: b, lesson: 37 }
          - { q: "I work from home ___ I can take my son to school.", options: [in order to, so that, for, to], answer: b, lesson: 39 }
          - { q: "When it comes to ___ a job, experience matters.", options: [find, finding, to find, found], answer: b, lesson: 40 }
          - { q: "Many people are interested in ___ other cultures.", options: [learn, to learn, learning, learned], answer: c, lesson: 41 }
          - { q: "Smoking should ___ in all parks.", options: [ban, be banned, banned, be ban], answer: b, lesson: 43 }
          - { q: "Eating late at night can lead to ___ badly.", options: [sleep, sleeping, slept, sleeps], answer: b, lesson: 44 }
      - id: gd2-final-x5
        bank_no: 8
        kind: transformation
        instructions_vi: "Viết lại câu theo gợi ý, giữ nguyên nghĩa."
        questions:
          - { q: "My grandfather used to live here. That house was his. → That's the house ___", answer: "where my grandfather used to live.", accept: ["which my grandfather used to live in.", "that my grandfather used to live in."], lesson: 25 }
          - { q: "Sales rose sharply in 2022. → There was ___", answer: "a sharp rise in sales in 2022.", accept: ["a sharp increase in sales in 2022."], lesson: 26 }
          - { q: "\"I can't find a cheap flat.\" → She said ___", answer: "she couldn't find a cheap flat.", accept: ["that she couldn't find a cheap flat.", "she could not find a cheap flat.", "that she could not find a cheap flat."], lesson: 35 }
          - { q: "People often claim that social media is harmful. → It is often ___", answer: "claimed that social media is harmful.", lesson: 38 }
          - { q: "Electronics were 45% of exports. (accounted for) → Electronics ___", answer: "accounted for 45% of exports.", lesson: 42 }
      - id: gd2-final-x6
        bank_no: 7
        kind: error-correction
        instructions_vi: "Đoạn văn có 6 lỗi. Sửa trực tiếp; lỗi dấu phẩy thì tách câu."
        text: "I have lived in Hanoi since three years. Although the city is crowded, but I love it. Rents are high, however many young people still move here. Hanoi had two times more visitors as Hue last year. The government should invest more on public transport. In my point of view, this is the best solution."
        errors:
          - { wrong: "since three years", right: "for three years", why: "for + khoảng thời gian; since + mốc.", lesson: 21 }
          - { wrong: "is crowded, but I love it", right: "is crowded, I love it", why: "Although không đi với but.", lesson: 37 }
          - { wrong: "Rents are high, however many", right: "Rents are high. However, many", why: "however không nối câu bằng dấu phẩy.", lesson: 30 }
          - { wrong: "two times more visitors as Hue", right: "twice as many visitors as Hue", why: "twice as many … as.", lesson: 34 }
          - { wrong: "invest more on public transport", right: "invest more in public transport", why: "invest IN.", lesson: 40 }
          - { wrong: "In my point of view", right: "From my point of view", why: "from my point of view.", lesson: 38 }
  - title_vi: "Phần 3 · Đọc hiểu"
    exercises:
      - id: gd2-final-x7
        bank_no: 13
        kind: tfng
        instructions_vi: "Đọc bài và chọn T (True), F (False) hoặc NG (Not Given)."
        lesson: 25
        passage: |-
          ONLINE LEARNING AFTER THE PANDEMIC

          A  When schools closed in 2020, millions of Vietnamese students started studying online for the first time. At first, many families did not have a laptop or a fast internet connection, so some children had to share one phone with their brothers and sisters.

          B  Since then, online learning has become a normal part of education. Most universities now offer at least some courses online, and many working adults take evening classes from home. A survey by one university found that students who combined online and classroom lessons got slightly better results than those who studied only in class.

          C  However, teachers have noticed problems. Some students find it hard to concentrate at home, and many feel lonely without classmates. Experts recommend that online courses should include regular video meetings, so that students can talk to each other and to their teachers.
        questions:
          - { q: "In 2020, some children had to share a phone to study.", answer: T }
          - { q: "All universities now teach only online.", answer: F }
          - { q: "Students who mixed online and classroom lessons did slightly better.", answer: T }
          - { q: "Online courses are cheaper than classroom courses.", answer: NG, explain_vi: "Bài không nói về giá. Không có thông tin → NG." }
          - { q: "Experts think online courses should include regular video meetings.", answer: T }
      - id: gd2-final-x8
        bank_no: 14
        kind: mcq
        instructions_vi: "Matching headings: chọn tiêu đề đúng cho đoạn A, B, C của bài ở bài 7. Có 2 tiêu đề thừa."
        lesson: 29
        passage: |-
          ONLINE LEARNING AFTER THE PANDEMIC

          A  When schools closed in 2020, millions of Vietnamese students started studying online for the first time. At first, many families did not have a laptop or a fast internet connection, so some children had to share one phone with their brothers and sisters.

          B  Since then, online learning has become a normal part of education. Most universities now offer at least some courses online, and many working adults take evening classes from home. A survey by one university found that students who combined online and classroom lessons got slightly better results than those who studied only in class.

          C  However, teachers have noticed problems. Some students find it hard to concentrate at home, and many feel lonely without classmates. Experts recommend that online courses should include regular video meetings, so that students can talk to each other and to their teachers.

          Headings:
          i    Difficulties and a suggested improvement
          ii   The cost of new technology
          iii  A difficult start
          iv   Why teachers prefer classrooms
          v    Online learning becomes ordinary
        questions:
          - { q: "Paragraph A", options: ["i", "ii", "iii", "iv", "v"], answer: c }
          - { q: "Paragraph B", options: ["i", "ii", "iii", "iv", "v"], answer: e }
          - { q: "Paragraph C", options: ["i", "ii", "iii", "iv", "v"], answer: a }
      - id: gd2-final-x9
        bank_no: 16
        kind: completion
        instructions_vi: "Summary completion: hoàn thành đoạn tóm tắt bài ở bài 7. Viết KHÔNG QUÁ HAI TỪ lấy từ bài đọc."
        max_words: 2
        lesson: 41
        passage: |-
          In 2020, many families lacked a laptop or a fast (1) ___. Today, many working adults study online through (2) ___ from home. Some students find it difficult to (3) ___ at home, and many feel (4) ___ without their classmates.
        questions:
          - { q: "(1)", answer: internet connection }
          - { q: "(2)", answer: evening classes }
          - { q: "(3)", answer: concentrate }
          - { q: "(4)", answer: lonely }
      - id: gd2-final-x10
        bank_no: 15
        kind: mcq
        instructions_vi: "Matching information: đoạn nào (A–C) của bài ở bài 7 chứa thông tin sau? Có thể dùng một chữ cái nhiều lần."
        lesson: 37
        passage: |-
          ONLINE LEARNING AFTER THE PANDEMIC

          A  When schools closed in 2020, millions of Vietnamese students started studying online for the first time. At first, many families did not have a laptop or a fast internet connection, so some children had to share one phone with their brothers and sisters.

          B  Since then, online learning has become a normal part of education. Most universities now offer at least some courses online, and many working adults take evening classes from home. A survey by one university found that students who combined online and classroom lessons got slightly better results than those who studied only in class.

          C  However, teachers have noticed problems. Some students find it hard to concentrate at home, and many feel lonely without classmates. Experts recommend that online courses should include regular video meetings, so that students can talk to each other and to their teachers.
        questions:
          - { q: "a reference to research results", options: [A, B, C], answer: b }
          - { q: "a recommendation from experts", options: [A, B, C], answer: c }
          - { q: "an example of a problem caused by a lack of equipment", options: [A, B, C], answer: a }
      - id: gd2-final-x11
        bank_no: 16
        kind: completion
        instructions_vi: "Đọc số liệu (giả định) và hoàn thành câu. Viết MỘT TỪ hoặc MỘT SỐ."
        max_words: 1
        lesson: 42
        passage: |-
          How students in one city travel to school (%)     2015    2025
          Motorbike (with parents)                            55      40
          Bicycle                                             25      15
          Bus                                                 10      30
          Walking                                             10      15
        questions:
          - { q: "In 2015, motorbikes accounted for just over ___ of all trips.", answer: half }
          - { q: "The share of bus trips ___ between 2015 and 2025.", answer: tripled, accept: [rose, increased, grew] }
          - { q: "In 2025, bicycles and walking made up 15% and 15%, ___.", answer: respectively }
          - { q: "Bicycle use ___ from 25% to 15%.", answer: fell, accept: [decreased, dropped, declined] }
  - title_vi: "Phần 4 · Nghe"
    exercises:
      - id: gd2-final-x12
        bank_no: 18
        kind: completion
        instructions_vi: "Nghe cuộc gọi và điền form. Viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT SỐ. Nghe 1 lần."
        lesson: 23
        max_words: 2
        audio_text: |-
          Man: Green City Volunteers, good afternoon.
          Woman: Hi, I'd like to join the tree-planting day next month.
          Man: Great. Can I have your name?
          Woman: Mai Tran. That's T-R-A-N.
          Man: And which date? We have the 12th and the 19th.
          Woman: The 12th, please. Actually, no, the 19th is better.
          Man: No problem. We meet at the park gate at 7 a.m. Please bring a water bottle and gloves.
          Woman: Do I need to pay anything?
          Man: No, it's free, but we ask for a small donation of 50,000 dong if possible.
        passage: |-
          VOLUNTEER FORM
          Name: Mai (1) ___
          Date: (2) ___ of next month
          Meeting place: the park (3) ___
          Bring: a water bottle and (4) ___
        questions:
          - { q: "(1)", answer: Tran }
          - { q: "(2)", answer: 19th, accept: ["19", nineteenth] }
          - { q: "(3)", answer: gate }
          - { q: "(4)", answer: gloves }
      - id: gd2-final-x13
        bank_no: 19
        kind: mcq
        instructions_vi: "Nghe hướng dẫn và chọn chữ cái đúng (A–E) cho mỗi địa điểm. Có 1 chữ cái thừa."
        lesson: 27
        audio_text: "Welcome to the new community centre. You're at the main entrance, on the south side. The library is directly opposite the entrance, at the far end of the hall. The café is the first room on your left as you come in. The computer room is next to the library, on the right. And the first aid room is just inside the entrance, on the right."
        passage: |-
          Plan (entrance in the south):
          A – just inside the entrance, on the left
          B – just inside the entrance, on the right
          C – far end, in the middle (opposite the entrance)
          D – far end, on the right
          E – far end, on the left
        questions:
          - { q: "library", options: [A, B, C, D, E], answer: c }
          - { q: "café", options: [A, B, C, D, E], answer: a }
          - { q: "computer room", options: [A, B, C, D, E], answer: d }
          - { q: "first aid room", options: [A, B, C, D, E], answer: b }
      - id: gd2-final-x14
        bank_no: 20
        kind: mcq
        instructions_vi: "Nghe hai sinh viên và giảng viên (nhiều giọng, nghe 1 lần) rồi chọn đáp án đúng."
        lesson: 39
        audio_text: |-
          Tutor: So, what's the topic of your presentation?
          Nam: Globalisation and local businesses. At first we wanted to focus on fast food, but there's too much information.
          Lan: So we chose coffee instead. We'll compare a global café chain with small local cafés.
          Tutor: How will you collect data?
          Nam: We'll interview five café owners.
          Lan: And we'll do a short survey of customers so that we can see why they choose one or the other.
          Tutor: Good. What do you expect to find?
          Nam: I think local cafés will say that competition is their biggest problem.
          Lan: I'm not sure. I think rising rents are a bigger problem for them.
        questions:
          - { q: "What topic did they finally choose?", options: [fast food, coffee, clothes, supermarkets], answer: b, lesson: 41 }
          - { q: "How many café owners will they interview?", options: [three, five, ten, fifteen], answer: b }
          - { q: "Why will they survey customers?", options: [to see why customers choose each type of café, to find the cheapest café, to sell coffee, to test new drinks], answer: a }
          - { q: "What does Lan think is the biggest problem for local cafés?", options: [competition, rising rents, bad coffee, lack of staff], answer: b, lesson: 35 }
      - id: gd2-final-x15
        bank_no: 20
        kind: tf
        instructions_vi: "Nghe đoạn bài giảng ngắn rồi chọn T (đúng) hoặc F (sai)."
        audio_text: "Today I'll talk about how cities can reduce traffic congestion. The main cause in many Asian cities is the huge number of motorbikes and private cars. One solution is to improve public transport so that people have a real alternative. Some cities have also introduced a charge for driving into the city centre. In one European city, traffic fell by about a fifth after the charge was introduced. However, experts say that such a charge should only be introduced if good public transport already exists."
        questions:
          - { q: "Motorbikes and private cars are the main cause of congestion in many Asian cities.", answer: T, lesson: 44 }
          - { q: "The speaker says public transport cannot solve the problem.", answer: F, lesson: 44 }
          - { q: "In one European city, traffic fell by about 20%.", answer: T, lesson: 42 }
          - { q: "Experts think the charge should be introduced before public transport is improved.", answer: F, lesson: 43 }
      - id: gd2-final-x16
        bank_no: 20
        kind: mcq
        instructions_vi: "Nghe một thí sinh trả lời Speaking (hai giọng) và chọn đáp án đúng."
        audio_text: |-
          Examiner: Do you think parents should be strict with their children?
          Candidate: I'd say it depends on the child's age. Young children need clear rules because they can't always see danger. For example, my little brother isn't allowed to cross the road alone. However, if parents are too strict with teenagers, they may stop telling their parents the truth.
          Examiner: Has family life changed in your country?
          Candidate: Yes, a lot. In the past, three generations often lived together, whereas nowadays most young couples live in a nuclear family.
        questions:
          - { q: "What is the candidate's main answer to the first question?", options: [Parents should always be strict., It depends on the child's age., Parents should never be strict., Teenagers need more rules.], answer: b, lesson: 32 }
          - { q: "What example does the candidate give?", options: [his brother can't cross the road alone, his sister's homework, his own school rules, his parents' jobs], answer: a, lesson: 32 }
          - { q: "What does the candidate say about teenagers?", options: [They need very strict rules., Strict rules may stop them telling the truth., They should live alone., They don't need parents.], answer: b, lesson: 31 }
          - { q: "How has family life changed?", options: [More generations live together now., Most young couples now live in a nuclear family., Families are bigger now., It hasn't changed.], answer: b, lesson: 31 }
      - id: gd2-final-x17
        bank_no: 23
        kind: dictation
        instructions_vi: "Nghe và chép lại chính xác (tối đa 3 lần)."
        lesson: 36
        text: "Apart from the traffic, my neighbourhood is a lively place with lots of street food and a big park."
writing:
  prompt_vi: "Không chấm tự động — viết trong 40 phút rồi gửi để chữa theo 4 tiêu chí IELTS."
  prompt_en: "Some people believe that the best way to reduce crime is to give longer prison sentences. Others think there are better ways to reduce crime. Discuss both views and give your own opinion."
  words: { min: 250, max: 290 }
