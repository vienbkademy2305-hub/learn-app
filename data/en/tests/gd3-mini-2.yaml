# Kiểm tra ngắn 2 Giai đoạn 3 — sau Buổi 55 (Buổi 51–55). Tự soạn, BẢN NHÁP chờ duyệt.
id: gd3-mini-2
title_vi: "Kiểm tra ngắn 2 (Giai đoạn 3): Buổi 51–55"
stage: 3
kind: mini
after_lesson: 55
minutes: 40
pass_percent: 80
intro_vi: "Từ nối học thuật, mức độ chắc chắn, nhượng bộ – phản bác, mệnh đề danh từ, nguyên nhân – hệ quả nâng cao; từ vựng Tội phạm – Công nghệ & AI – Sức khỏe cộng đồng; đọc Yes/No/Not Given, nghe bài giảng Part 4."
source: editorial
status: draft
sections:
  - title_vi: Ngữ pháp
    exercises:
      - id: gd3-mini-2-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - { q: "Prison is expensive. ___, it rarely rehabilitates offenders.", options: [Nevertheless, Moreover, Conversely, Whereas], answer: b, lesson: 51 }
          - { q: "The law was unpopular. ___, it reduced drink-driving.", options: [Moreover, Furthermore, Nevertheless, Thus], answer: c, lesson: 51 }
          - { q: "AI ___ to change most office jobs.", options: [likely, is likely, will likely to, likely is], answer: b, lesson: 52 }
          - { q: "Robots are ___ to replace nurses soon.", options: [unlikely, not likely be, unlikely be, likely not], answer: a, lesson: 52 }
          - { q: "___ it is true that phones are useful, they can be addictive.", options: [But, While, Despite, However], answer: b, lesson: 53 }
          - { q: "That's a valid point. ___, I think the risks are exaggerated.", options: [Having said that, Moreover, As a result, For example], answer: a, lesson: 53 }
          - { q: "What worries doctors most ___ the rise in diabetes.", options: [are, is, be, being], answer: b, lesson: 54 }
          - { q: "Scientists want to know why ___ longer.", options: [do some people live, some people live, some people do live?, lives some people], answer: b, lesson: 54 }
          - { q: "A sedentary lifestyle ___ obesity.", options: [stems from, contributes to, is contributed by, results from], answer: b, lesson: 55 }
          - { q: "Sleep deprivation has a detrimental effect ___ memory.", options: [to, for, on, at], answer: c, lesson: 55 }
      - id: gd3-mini-2-x2
        bank_no: 8
        kind: transformation
        instructions_vi: "Viết lại câu theo yêu cầu."
        questions:
          - { q: "Education gives prisoners skills. This reduces reoffending. (thus + V-ing) → Education gives prisoners skills, ___", answer: "thus reducing reoffending." , lesson: 51 }
          - { q: "It is possible that deepfakes will harm elections. (may) → Deepfakes ___", answer: "may harm elections.", lesson: 52 }
          - { q: "Will the campaign work? Nobody knows. → Nobody knows ___", answer: "whether the campaign will work.", accept: ["if the campaign will work.", "whether or not the campaign will work.", "whether the campaign will work or not."], lesson: 54 }
          - { q: "Stress is caused by long working hours. (stems from) → Stress ___", answer: "stems from long working hours.", lesson: 55 }
  - title_vi: Từ vựng
    exercises:
      - id: gd3-mini-2-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank: [evidence, innocent, algorithm, transparency, obsolete, digital divide, outbreak, life expectancy, burden, vulnerable]
        questions:
          - { q: "There is little ___ that harsh punishments reduce crime.", answer: evidence, lesson: 51 }
          - { q: "He spent ten years in prison although he was ___.", answer: innocent, lesson: 51 }
          - { q: "The ___ decides which videos you see next.", answer: algorithm, lesson: 52 }
          - { q: "Companies should explain their decisions to increase ___.", answer: transparency, lesson: 52 }
          - { q: "Some skills will become ___ because of automation.", answer: obsolete, lesson: 53 }
          - { q: "The ___ means rural students have less access to online learning.", answer: digital divide, lesson: 53 }
          - { q: "Free vaccination helped to stop the ___ quickly.", answer: outbreak, lesson: 54 }
          - { q: "Average ___ has risen from 67 to 74 years.", answer: life expectancy, lesson: 54 }
          - { q: "Chronic diseases place a heavy ___ on the healthcare system.", answer: burden, lesson: 55 }
          - { q: "The elderly are especially ___ to heatwaves.", answer: vulnerable, lesson: 55 }
      - id: gd3-mini-2-x4
        bank_no: 4
        kind: word-form
        instructions_vi: Viết dạng đúng của từ trong ngoặc.
        questions:
          - { q: "Life ___ is an alternative to the death penalty.", base: prison, answer: imprisonment, lesson: 51 }
          - { q: "Facial recognition raises serious ___ questions.", base: ethics, answer: ethical, lesson: 52 }
          - { q: "Our ___ on smartphones keeps growing.", base: rely, answer: reliance, lesson: 53 }
          - { q: "Good ___ is essential for children's growth.", base: nourish, answer: nutrition, lesson: 54 }
          - { q: "Sugar ___ has doubled in twenty years.", base: consume, answer: consumption, lesson: 55 }
  - title_vi: Đọc hiểu
    exercises:
      - id: gd3-mini-2-x5
        bank_no: 13
        kind: ynng
        instructions_vi: "Các nhận định có khớp với QUAN ĐIỂM tác giả không? Chọn Y, N hoặc NG."
        lesson: 52
        passage: |-
          It is often claimed that smartphones are ruining young people's mental health. In my view, this claim is too simple. Heavy use of social media does appear to be linked with anxiety in some teenagers, and I would not dismiss parents' concerns. However, the same phones allow isolated young people to find support groups and to talk to friends who live far away. The real question is not whether teenagers should have phones, but how they use them. Schools, I believe, should teach students to manage their screen time rather than ban phones completely.
        questions:
          - { q: "The writer agrees that smartphones are ruining young people's mental health.", answer: N, explain_vi: "Tác giả nói 'this claim is too simple'." }
          - { q: "The writer accepts that social media may be linked to anxiety in some teenagers.", answer: Y }
          - { q: "The writer thinks phones should be banned in schools.", answer: N }
          - { q: "The writer believes girls are more affected than boys.", answer: NG }
          - { q: "According to the writer, how phones are used matters more than whether teenagers have them.", answer: Y }
      - id: gd3-mini-2-x6
        bank_no: 16
        kind: completion
        instructions_vi: "Đọc đoạn văn ở bài 5 và hoàn thành câu. Viết KHÔNG QUÁ HAI TỪ lấy từ bài đọc."
        max_words: 2
        lesson: 53
        passage: |-
          It is often claimed that smartphones are ruining young people's mental health. In my view, this claim is too simple. Heavy use of social media does appear to be linked with anxiety in some teenagers, and I would not dismiss parents' concerns. However, the same phones allow isolated young people to find support groups and to talk to friends who live far away. The real question is not whether teenagers should have phones, but how they use them. Schools, I believe, should teach students to manage their screen time rather than ban phones completely.
        questions:
          - { q: "Phones help isolated young people find ___.", answer: support groups }
          - { q: "The writer suggests that schools teach students to manage their ___.", answer: screen time }
  - title_vi: Nghe
    exercises:
      - id: gd3-mini-2-x7
        bank_no: 18
        kind: completion
        instructions_vi: "Nghe đoạn bài giảng và hoàn thành ghi chú. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ. Nghe 1 lần."
        lesson: 54
        max_words: 1
        audio_text: "In today's lecture, I'll look at sleep and public health. Adults need about seven to nine hours of sleep a night, yet surveys show that a third of adults regularly sleep less than six. What is surprising is that the main cause is not work but screens: people use their phones in bed until late at night. Sleep deprivation contributes to obesity, heart disease and accidents at work. Unfortunately, it remains unclear whether public campaigns can change these habits."
        passage: |-
          SLEEP AND PUBLIC HEALTH
          • Adults need 7–9 hours
          • A (1) ___ of adults regularly sleep under 6 hours
          • Main cause: (2) ___ used in bed
          • Sleep deprivation contributes to obesity, heart disease and (3) ___ at work
          • Speaker's view of campaigns: (4) ___ (certain / unclear)
        questions:
          - { q: "(1)", answer: third }
          - { q: "(2)", answer: phones, accept: [screens] }
          - { q: "(3)", answer: accidents }
          - { q: "(4)", answer: unclear }
      - id: gd3-mini-2-x8
        bank_no: 20
        kind: mcq
        instructions_vi: "Nghe hai người thảo luận (hai giọng) và chọn đáp án đúng."
        lesson: 53
        audio_text: |-
          Woman: Some people say AI will make teachers unnecessary. What do you think?
          Man: I can see why they say that, because AI can already mark essays. But I wouldn't go as far as saying teachers are unnecessary.
          Woman: Why not?
          Man: Because students need encouragement, not just marks. Having said that, teachers will need to upskill and use AI tools.
        questions:
          - { q: "What does the man think?", options: [Teachers will soon be unnecessary., Teachers will still be needed., AI cannot mark essays., Students don't need teachers.], answer: b }
          - { q: "What reason does he give?", options: [AI is expensive., Students need encouragement., Teachers are cheap., AI makes mistakes.], answer: b }
          - { q: "What does he say teachers will need to do?", options: [retire early, upskill and use AI tools, stop marking, work longer hours], answer: b }
      - id: gd3-mini-2-x9
        bank_no: 20
        kind: tf
        instructions_vi: "Nghe bản tin rồi chọn T (đúng) hoặc F (sai)."
        audio_text: "New figures show that obesity among children has risen by ten per cent in five years. Experts say the rise stems mainly from sugary drinks, although a sedentary lifestyle also contributes. The government is considering a tax on sugary drinks. However, it is unlikely to be introduced before next year."
        questions:
          - { q: "Childhood obesity has risen by ten per cent in five years.", answer: T, lesson: 55 }
          - { q: "Experts say the main cause is a lack of exercise.", answer: F, lesson: 55 }
          - { q: "The tax has already been introduced.", answer: F, lesson: 52 }
      - id: gd3-mini-2-x10
        bank_no: 23
        kind: dictation
        instructions_vi: "Nghe và chép lại chính xác (tối đa 3 lần)."
        lesson: 51
        text: "Prison is expensive. Moreover, there is little evidence that longer sentences reduce crime."
  - title_vi: Viết câu
    exercises:
      - id: gd3-mini-2-x11
        bank_no: 7
        kind: error-correction
        instructions_vi: "Đoạn văn có 5 lỗi. Sửa trực tiếp."
        text: "Prison is costly, moreover it rarely works. AI likely to replace some jobs. While it is true that technology helps us, but it also isolates us. Researchers want to know why do some people never get ill. Obesity is contributed by poor diet."
        errors:
          - { wrong: "Prison is costly, moreover it", right: "Prison is costly. Moreover, it", why: "moreover là trạng từ — tách câu.", lesson: 51 }
          - { wrong: "AI likely to replace", right: "AI is likely to replace", why: "be likely to + V.", lesson: 52 }
          - { wrong: "helps us, but it also", right: "helps us, it also", why: "While (mặc dù) không đi với but.", lesson: 53 }
          - { wrong: "why do some people never get", right: "why some people never get", why: "Mệnh đề danh từ không đảo ngữ.", lesson: 54 }
          - { wrong: "Obesity is contributed by poor diet", right: "Poor diet contributes to obesity", why: "contribute to là chủ động.", lesson: 55 }
writing:
  prompt_vi: "Không chấm tự động — viết một đoạn thân bài (khoảng 150 từ) nêu 2 nguyên nhân của thiếu ngủ ở người trẻ, dùng ít nhất 3 cấu trúc nhân quả và 2 từ nối học thuật."
  prompt_en: "Why do many young adults not get enough sleep?"
  words: { min: 130, max: 170 }
