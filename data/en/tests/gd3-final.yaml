# Kiểm tra đầu ra Giai đoạn 3 (Buổi 46–65). Tự soạn, BẢN NHÁP chờ duyệt.
id: gd3-final
title_vi: "Kiểm tra đầu ra Giai đoạn 3"
stage: 3
kind: final
after_lesson: 65
minutes: 80
pass_percent: 80
intro_vi: >-
  Bài kiểm tra tổng hợp Giai đoạn 3 (Buổi 46–64): từ vựng học thuật theo chủ đề, câu phức band 6.5–7 (bị động quy trình,
  mệnh đề quan hệ, danh từ hóa, từ nối, mệnh đề danh từ, phân từ, đảo ngữ, điều kiện loại 3, câu chẻ), đọc Yes/No/Not Given
  và Matching features, nghe bài giảng và hội thoại, sửa lỗi đặc trưng người Việt. Đạt từ 80% phần chấm tự động trở lên thì
  sẵn sàng sang Giai đoạn 4 (luyện đề). Phần viết không chấm tự động — gửi để chữa.
source: editorial
status: draft
sections:
  - title_vi: "Phần 1 · Từ vựng"
    exercises:
      - id: gd3-final-x1
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank: [purified, demolished, rote learning, procrastinate, deterrent, nevertheless, transparency, obsolete, outbreak, detrimental]
        questions:
          - { q: "Once the water has been filtered, it is ___ with chemicals.", answer: purified, lesson: 46 }
          - { q: "The old factory was ___ to make way for a park.", answer: demolished, lesson: 47 }
          - { q: "Critics say ___ does not develop critical thinking.", answer: rote learning, lesson: 48 }
          - { q: "I tend to ___ when a deadline is far away.", answer: procrastinate, lesson: 49 }
          - { q: "Some argue that long prison sentences act as a ___.", answer: deterrent, lesson: 50 }
          - { q: "The law was unpopular; ___, it reduced crime.", answer: nevertheless, lesson: 51 }
          - { q: "Tech companies should explain how their algorithms work to increase ___.", answer: transparency, lesson: 52 }
          - { q: "Some jobs will become ___ because of automation.", answer: obsolete, lesson: 53 }
          - { q: "Quick vaccination helped to stop the ___.", answer: outbreak, lesson: 54 }
          - { q: "Lack of sleep has a ___ effect on memory.", answer: detrimental, lesson: 55 }
      - id: gd3-final-x2
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ/cụm từ trong khung vào chỗ trống.
        bank: [intangible, took it for granted, recession, by far, sold out, stage fright, orbits, feasible, loophole]
        questions:
          - { q: "Folk songs and festivals are part of our ___ cultural heritage.", answer: intangible, lesson: 56 }
          - { q: "I had clean air as a child, but I ___.", answer: took it for granted, lesson: 57 }
          - { q: "During the ___, many shops closed.", answer: recession, lesson: 58 }
          - { q: "Housing was ___ the largest expense.", answer: by far, lesson: 59 }
          - { q: "We couldn't go because the concert was ___.", answer: sold out, lesson: 60 }
          - { q: "Before my first performance, I had terrible ___.", answer: stage fright, lesson: 61 }
          - { q: "The Moon ___ the Earth about once a month.", answer: orbits, lesson: 62 }
          - { q: "Colonising Mars is not yet technically ___.", answer: feasible, lesson: 63 }
          - { q: "Companies often find a ___ in the tax law.", answer: loophole, lesson: 64 }
  - title_vi: "Phần 2 · Ngữ pháp"
    exercises:
      - id: gd3-final-x3
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - { q: "After ___, the bricks are packed and delivered.", options: [cool, cooled, being cooled, cooling down by], answer: c, lesson: 46 }
          - { q: "Since 2010, the old market ___ into a shopping centre.", options: [converted, has been converted, has converted, is converting], answer: b, lesson: 47 }
          - { q: "Many students choose vocational courses, ___ helps them find jobs quickly.", options: [that, which, what, who], answer: b, lesson: 48 }
          - { q: "I ___ study late at night, to be honest.", options: [tend to, tend, am tend to, tending], answer: a, lesson: 49 }
          - { q: "Crime fell sharply. → There was a sharp ___ crime.", options: [reduce of, reduction in, reducing on, reduced in], answer: b, lesson: 50 }
          - { q: "Prison is costly. ___, it rarely reforms offenders.", options: [Moreover, Whereas, Conversely, Although], answer: a, lesson: 51 }
          - { q: "AI ___ replace some office jobs within ten years.", options: [is likely to, likely, will likely to, is likely], answer: a, lesson: 52 }
          - { q: "___ it is true that phones are useful, they can isolate us.", options: [But, While, Despite, However], answer: b, lesson: 53 }
          - { q: "Scientists want to know ___ the vaccine works for children.", options: [whether, that, what, does], answer: a, lesson: 54 }
          - { q: "Obesity largely ___ a sedentary lifestyle.", options: [stems from, contributes, gives rise, leads], answer: a, lesson: 55 }
          - { q: "___ in 1920, the theatre is the oldest in the city.", options: [Building, Built, Having building, To build], answer: b, lesson: 56 }
          - { q: "It took me a while to ___ city life.", options: [get the hang of, get hang, take for granted, a far cry from], answer: a, lesson: 57 }
          - { q: "Only when prices rise ___ to save.", options: [people start, do people start, people do start, start people], answer: b, lesson: 58 }
          - { q: "___ you earn, the more you spend.", options: [More, The more, Most, The most], answer: b, lesson: 59 }
          - { q: "If she had practised more, she ___ the competition.", options: [would win, would have won, had won, will win], answer: b, lesson: 60 }
          - { q: "By the time we arrived, the film ___.", options: [already started, had already started, has already started, was start], answer: b, lesson: 61 }
          - { q: "In space ___ thousands of satellites.", options: [have, has, there are, there is], answer: c, lesson: 62 }
          - { q: "It is the cost ___ worries most taxpayers.", options: [what, that, which it, where], answer: b, lesson: 63 }
          - { q: "Animal testing ___ in many countries.", options: [has banned, has been prohibited, have prohibited, is prohibiting], answer: b, lesson: 64 }
      - id: gd3-final-x4
        bank_no: 8
        kind: transformation
        instructions_vi: "Viết lại câu theo yêu cầu."
        questions:
          - { q: "The bottles are sorted. Then they are crushed. (Once) → Once ___", answer: "the bottles have been sorted, they are crushed.", lesson: 46 }
          - { q: "The government reduced taxes. (nominalisation) → There was a ___", answer: "reduction in taxes.", lesson: 50 }
          - { q: "Will the campaign work? Nobody knows. → Nobody knows ___", answer: "whether the campaign will work.", accept: ["if the campaign will work."], lesson: 54 }
          - { q: "I have never seen such crowds. → Never ___", answer: "have I seen such crowds.", lesson: 58 }
          - { q: "The cost worries me most. → What ___", answer: "worries me most is the cost.", lesson: 63 }
  - title_vi: "Phần 3 · Đọc hiểu"
    exercises:
      - id: gd3-final-x5
        bank_no: 13
        kind: ynng
        instructions_vi: "Các nhận định có khớp với QUAN ĐIỂM tác giả không? Chọn Y, N hoặc NG."
        lesson: 52
        passage: |-
          It is often claimed that artificial intelligence will soon make human workers unnecessary. In my view, this prediction is exaggerated. AI is certainly capable of performing routine tasks faster than people, and some jobs will undoubtedly disappear. Nevertheless, history suggests that new technologies tend to create as many jobs as they destroy. What concerns me more is not unemployment but fairness: if the benefits of AI go only to a few large companies, inequality will grow. Governments should therefore focus on retraining workers rather than trying to slow down innovation.
        questions:
          - { q: "The writer believes AI will soon make all human workers unnecessary.", answer: N }
          - { q: "The writer accepts that some jobs will be lost to AI.", answer: Y }
          - { q: "The writer is more worried about inequality than unemployment.", answer: Y }
          - { q: "The writer thinks governments should slow down innovation.", answer: N }
          - { q: "The writer works for a large technology company.", answer: NG }
      - id: gd3-final-x6
        bank_no: 17
        kind: mcq
        instructions_vi: "Matching features: chọn người phù hợp (A Nguyen, B Harris, C Silva). Một người có thể được chọn nhiều lần."
        lesson: 60
        passage: |-
          Historian Mai Nguyen argues that traditional crafts survive only when young people can earn a living from them. 'If the village had not opened a craft school in the 1990s, the skill would have died out,' she says.

          Tourism expert Tom Harris believes that tourism is a double-edged sword. Visitors bring money, but many shops now sell cheap copies rather than handmade goods. In his view, this commercialisation damages the craft's reputation.

          Designer Ana Silva agrees with Nguyen that income matters most. However, she believes online sales, not tourism, are the answer, because they allow craftspeople to reach customers all over the world without changing their villages.
        questions:
          - { q: "Education helped to save a traditional skill.", options: [Nguyen, Harris, Silva], answer: a }
          - { q: "Selling copies harms the image of a craft.", options: [Nguyen, Harris, Silva], answer: b }
          - { q: "The internet offers a better solution than visitors.", options: [Nguyen, Harris, Silva], answer: c }
          - { q: "Tourism has both advantages and disadvantages.", options: [Nguyen, Harris, Silva], answer: b }
  - title_vi: "Phần 4 · Nghe"
    exercises:
      - id: gd3-final-x7
        bank_no: 18
        kind: completion
        instructions_vi: "Nghe đoạn bài giảng và hoàn thành ghi chú. Viết MỘT TỪ VÀ/HOẶC MỘT SỐ. Nghe 1 lần."
        lesson: 55
        max_words: 1
        audio_text: "Today I'd like to look at the causes of obesity in cities. The first factor is diet: people now eat twice as much processed food as they did thirty years ago. The second is a sedentary lifestyle, since most office workers sit for about nine hours a day. What is often ignored, however, is sleep. Sleep deprivation increases hunger, which gives rise to overeating. Finally, the solution most experts recommend is not a tax, but better education in schools."
        passage: |-
          CAUSES OF URBAN OBESITY
          • Diet: (1) ___ as much processed food as 30 years ago
          • Office workers sit about (2) ___ hours a day
          • Often ignored factor: (3) ___
          • Recommended solution: better (4) ___ in schools
        questions:
          - { q: "(1)", answer: twice }
          - { q: "(2)", answer: "9", accept: [nine] }
          - { q: "(3)", answer: sleep }
          - { q: "(4)", answer: education }
      - id: gd3-final-x8
        bank_no: 20
        kind: mcq
        instructions_vi: "Nghe hai người thảo luận (hai giọng) và chọn đáp án đúng."
        lesson: 53
        audio_text: |-
          Woman: Some people say online learning will replace universities. What's your view?
          Man: I can see why they say that, because online courses are cheaper. But I wouldn't go that far.
          Woman: Why not?
          Man: Because students also need to meet people and build networks. Having said that, universities will have to offer more online courses.
          Woman: So you think both will exist together?
          Man: Exactly. It's the combination that works best.
        questions:
          - { q: "What does the man think?", options: [Universities will disappear., Online learning will not fully replace universities., Online courses are too expensive., Students prefer online courses.], answer: b }
          - { q: "What reason does he give?", options: [Online courses are boring., Students need to meet people., Teachers dislike technology., Universities are cheaper.], answer: b }
          - { q: "What does he say universities will have to do?", options: [close some campuses, offer more online courses, charge higher fees, stop online courses], answer: b }
      - id: gd3-final-x9
        bank_no: 20
        kind: tf
        instructions_vi: "Nghe đoạn mô tả bản đồ rồi chọn T (đúng) hoặc F (sai)."
        audio_text: "The maps show the town centre in 2000 and today. The old factory near the river has been demolished and replaced by apartments. The car park next to the station has been converted into a small park. In addition, a new cycle lane has been built along the river, although the main road has remained unchanged."
        questions:
          - { q: "The factory has been turned into offices.", answer: F, lesson: 47 }
          - { q: "The car park is now a park.", answer: T, lesson: 47 }
          - { q: "A cycle lane has been added along the river.", answer: T, lesson: 47 }
          - { q: "The main road has been widened.", answer: F, lesson: 47 }
      - id: gd3-final-x10
        bank_no: 23
        kind: dictation
        instructions_vi: "Nghe và chép lại chính xác (tối đa 3 lần)."
        lesson: 51
        text: "Prison is expensive. Moreover, there is little evidence that it reduces crime."
  - title_vi: "Phần 5 · Viết câu"
    exercises:
      - id: gd3-final-x11
        bank_no: 7
        kind: error-correction
        instructions_vi: "Đoạn văn có 6 lỗi. Sửa trực tiếp."
        text: "First, the bottles collect from homes. Nowadays, students are more exam-oriented than in the past, which it is worrying. Scientists want to know why do some people never get ill. Having arrived late, the lecture had already started. Rarely people read the small print. Many country spend a lot of money on space research."
        errors:
          - { wrong: "the bottles collect from", right: "the bottles are collected from", why: "Quy trình nhân tạo → bị động.", lesson: 46 }
          - { wrong: "which it is worrying", right: "which is worrying", why: "which thay cho cả mệnh đề, không thêm it.", lesson: 48 }
          - { wrong: "why do some people never get", right: "why some people never get", why: "Mệnh đề danh từ không đảo ngữ.", lesson: 54 }
          - { wrong: "Having arrived late, the lecture had already started", right: "Having arrived late, I found that the lecture had already started", why: "Chủ ngữ của phân từ phải là người đến muộn.", lesson: 56 }
          - { wrong: "Rarely people read", right: "Rarely do people read", why: "Đảo ngữ sau Rarely.", lesson: 58 }
          - { wrong: "Many country spend", right: "Many countries spend", why: "many + số nhiều.", lesson: 62 }
      - id: gd3-final-x12
        bank_no: 10
        kind: mcq
        instructions_vi: "Chọn câu phù hợp nhất cho bài viết/nói."
        questions:
          - { q: "Best overview for a map comparison:", options: ["Overall, the factory was demolished in 2005.", "Overall, the town became more residential, with industrial buildings replaced by housing and green spaces.", "Overall, the maps are very interesting.", "Overall, I prefer the town today."], answer: b, lesson: 47 }
          - { q: "Most natural Part 1 answer to 'Do you like studying?':", options: ["Yes.", "Yes, I tend to enjoy it, especially when the subject is practical.", "Studying is the key to success, as everyone knows.", "No, never, not at all."], answer: b, lesson: 49 }
          - { q: "Best Part 2 sentence about the past:", options: ["I have never performed before that day.", "I had never performed on stage before that day.", "I never perform before that day.", "I was never perform before."], answer: b, lesson: 61 }
          - { q: "Best paraphrase of 'Many people think fines should be higher.'", options: ["Everyone agrees fines are too low.", "It is widely believed that heavier penalties should be imposed.", "Fines have been increased.", "Some people pay fines."], answer: b, lesson: 64 }
writing:
  prompt_vi: "Không chấm tự động — viết một bài Task 2 hoàn chỉnh (≥ 250 từ, 40 phút), rồi tự chấm theo 4 tiêu chí như Buổi 65 và gửi để chữa."
  prompt_en: "Some people believe that governments should spend more on the arts, while others think the money should go to science and technology. Discuss both views and give your own opinion."
  words: { min: 250, max: 300 }
