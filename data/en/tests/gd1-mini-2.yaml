# Kiểm tra ngắn 2 — sau Buổi 10 (Buổi 6–10, có ôn Buổi 1–5). Tự soạn, BẢN NHÁP chờ duyệt.
id: gd1-mini-2
title_vi: "Kiểm tra ngắn 2: Buổi 6–10"
stage: 1
kind: mini
after_lesson: 10
minutes: 30
pass_percent: 80
intro_vi: "Hiện tại tiếp diễn, phân biệt với hiện tại đơn, danh từ đếm được & lượng từ, so sánh nhất, phương tiện và chỉ đường."
source: editorial
status: draft
sections:
  - title_vi: Ngữ pháp
    exercises:
      - id: gd1-mini-2-x1
        bank_no: 10
        kind: mcq
        instructions_vi: Chọn đáp án đúng.
        questions:
          - { q: "Be quiet! The baby ___.", options: [sleeps, is sleeping, sleep, are sleeping], answer: b, lesson: 6 }
          - { q: "I ___ this song. It's great!", options: [am loving, love, loving, am love], answer: b, explain_vi: "love là động từ trạng thái, không dùng tiếp diễn.", lesson: 7 }
          - { q: "How ___ water do you drink a day?", options: [many, much, a few, few], answer: b, lesson: 8 }
          - { q: "Can I have ___ sugar in my coffee?", options: [a few, a little, many, an], answer: b, lesson: 8 }
          - { q: "This is ___ restaurant in our town.", options: [the cheaper, cheapest, the cheapest, more cheap], answer: c, lesson: 9 }
          - { q: "My phone is not ___ yours.", options: [as expensive as, expensive than, as expensive than, the most expensive], answer: a, lesson: 9 }
          - { q: "I usually go to work ___ bus.", options: [on, in, by, with], answer: c, lesson: 10 }
          - { q: "Walk ___ the bridge and you can see the market.", options: [across, through, into, on], answer: a, lesson: 10 }
      - id: gd1-mini-2-x2
        bank_no: 6
        kind: verb-form
        instructions_vi: Chia động từ ở hiện tại đơn hoặc hiện tại tiếp diễn.
        questions:
          - { q: "Look! It (rain) ___.", answer: "is raining", accept: ["'s raining"], lesson: 6 }
          - { q: "My mother usually (work) ___ at a hospital.", answer: works, lesson: 7 }
          - { q: "This week she (work) ___ from home.", answer: "is working", accept: ["'s working"], lesson: 7 }
          - { q: "What (you / do) ___ now? — I'm doing my homework.", answer: "are you doing", lesson: 6 }
          - { q: "He (not / understand) ___ the question.", answer: "doesn't understand", accept: ["does not understand"], lesson: 7 }
  - title_vi: Từ vựng
    exercises:
      - id: gd1-mini-2-x3
        bank_no: 1
        kind: gap-fill
        instructions_vi: Điền từ thích hợp.
        bank: [exam, colleague, vegetables, discount, traffic jam, receptionist]
        questions:
          - { q: "I have a maths ___ tomorrow, so I'm studying tonight.", answer: exam, lesson: 6 }
          - { q: "The ___ at the hotel gives us the key to our room.", answer: receptionist, lesson: 7 }
          - { q: "My ___ and I work in the same office.", answer: colleague, lesson: 7 }
          - { q: "You should eat more fruit and ___.", answer: vegetables, lesson: 8 }
          - { q: "Everything in the shop has a 20% ___ today.", answer: discount, lesson: 9 }
          - { q: "I'm late because there is a big ___ on the main road.", answer: traffic jam, lesson: 10 }
  - title_vi: Nghe
    exercises:
      - id: gd1-mini-2-x4
        bank_no: 23
        kind: dictation
        lesson: 10
        instructions_vi: "Nghe và chép lại (nghe tối đa 3 lần)."
        text: "Every morning I catch the bus at the corner. It is crowded, so I often stand. The journey takes thirty minutes."
      - id: gd1-mini-2-x5
        bank_no: 20
        kind: mcq
        instructions_vi: "Nghe hai đồng nghiệp nói chuyện (nghe tối đa 2 lần) rồi chọn đáp án đúng."
        audio_text: |-
          Woman: Hi Tuan. Are you working on the new project this week?
          Man: Yes, I am. I'm very busy, so I usually have lunch at my desk.
          Woman: Really? What do you eat?
          Man: Some rice and a little chicken. I don't eat much meat.
          Woman: And how do you get to work?
          Man: I usually go by bus, but this week I'm going by taxi, because my motorbike is at the repair shop.
          Woman: Taxis are expensive! The bus is cheaper, and the metro is the cheapest.
          Man: You're right. I want to try the metro tomorrow.
        questions:
          - { q: "What is Tuan doing this week?", options: [studying for an exam, working on a new project, travelling, looking for a job], answer: b, lesson: 7 }
          - { q: "Where does Tuan usually have lunch?", options: [at a restaurant, at home, at his desk, in the canteen], answer: c, lesson: 7 }
          - { q: "What does he eat?", options: [a lot of meat, bread and eggs, rice and a little chicken, noodles], answer: c, lesson: 8 }
          - { q: "How does Tuan usually go to work?", options: [by taxi, by bus, by motorbike, on foot], answer: b, explain_vi: "Tuần này đi taxi, nhưng THƯỜNG đi xe buýt.", lesson: 10 }
          - { q: "According to the woman, which is the cheapest?", options: [the taxi, the bus, the metro, the motorbike], answer: c, lesson: 9 }
      - id: gd1-mini-2-x6
        bank_no: 20
        kind: tf
        instructions_vi: "Nghe Mai nói về trường học và việc đi chợ. Chọn T (đúng) hoặc F (sai)."
        audio_text: "I'm a student at Nguyen Hue High School. Classes start at seven o'clock and finish at half past eleven. My favourite subject is English, but I'm not very good at maths. After school I sometimes go to the market with my mum. Vegetables there are cheaper than in the supermarket, and the sellers are very friendly."
        questions:
          - { q: "Classes start at seven o'clock.", answer: T, lesson: 6 }
          - { q: "Classes finish in the afternoon.", answer: F, lesson: 6 }
          - { q: "Mai's favourite subject is maths.", answer: F, lesson: 6 }
          - { q: "Vegetables at the market are more expensive than at the supermarket.", answer: F, lesson: 9 }
          - { q: "Mai goes to the market every day after school.", answer: F, explain_vi: "sometimes ≠ every day.", lesson: 9 }
