# Sự thật: chìa khóa phòng họp bị lấy. Hung thủ: Tiểu Lý (小李). Bằng chứng: anh nói sáu giờ đã rời công ty, nhưng thẻ quẹt lúc 7:30; đồng nghiệp thấy anh cầm chìa khóa.
id: zh-hsk3-key
level: HSK3
lesson_range: [31, 50]
status: draft
title_vi: Chìa khóa phòng họp
cover: "🔑"
premise_vi: >-
  Sáng thứ Hai, chìa khóa phòng họp quan trọng biến mất. Có ba người có thể biết chuyện tối Chủ nhật.

clues:
  - id: card-record
    witness: baoan
    text: "晚上七点半，小李的卡还在公司门口刷过。"
    text_vi: "Bảy giờ rưỡi tối, thẻ của Tiểu Lý còn quẹt ở cửa công ty."
  - id: key-in-hand
    witness: tongshi
    text: "我看见小李拿着一把钥匙，他看起来很着急。"
    text_vi: "Mình thấy Tiểu Lý cầm một chiếc chìa khóa, trông anh rất vội."
  - id: left-six
    witness: xiaoli
    text: "我昨天六点就离开公司了。"
    text_vi: "Hôm qua sáu giờ tôi đã rời công ty."

witnesses:
  - id: baoan
    name: 保安
    role: 保安
    avatar: "💂"
    segments:
      - text: "昨天是星期天，公司里的人很少。"
        vi: "Hôm qua là Chủ nhật nên trong công ty rất ít người."
      - text: "晚上七点半，小李的卡还在公司门口刷过。"
        vi: "Bảy giờ rưỡi tối, thẻ của Tiểu Lý còn quẹt ở cửa công ty."
        clues: [card-record]
        focus: ["刷过", "七点半"]
      - text: "八点以后，我就没有再看见别人进来。"
        vi: "Sau tám giờ, tôi không thấy ai vào nữa."
    checks:
      - claim_vi: "Hôm qua trong công ty rất đông người."
        answer: false
        explain_vi: "Sai: Chủ nhật nên rất ít người."
      - claim_vi: "Thẻ của Tiểu Lý được quẹt lúc 7:30."
        answer: true
        explain_vi: "Đúng: “七点半…刷过”."
  - id: tongshi
    name: 张姐
    role: 同事
    avatar: "👩‍💼"
    segments:
      - text: "我昨天晚上回公司拿东西，在办公室看见小李。"
        vi: "Tối qua mình quay lại công ty lấy đồ, thấy Tiểu Lý ở văn phòng."
        focus: ["拿东西", "办公室"]
      - text: "我看见小李拿着一把钥匙，他看起来很着急。"
        vi: "Mình thấy Tiểu Lý cầm một chiếc chìa khóa, trông anh rất vội."
        clues: [key-in-hand]
      - text: "我没有问他，因为我要赶地铁。"
        vi: "Mình không hỏi anh vì phải đi cho kịp tàu điện."
    checks:
      - claim_vi: "Chị Trương thấy Tiểu Lý cầm chìa khóa."
        answer: true
        explain_vi: "Đúng: “拿着一把钥匙”."
      - claim_vi: "Chị Trương đã hỏi Tiểu Lý về chìa khóa."
        answer: false
        explain_vi: "Sai: chị không hỏi vì phải đuổi tàu."
  - id: xiaoli
    name: 小李
    role: 同事
    avatar: "👨‍💻"
    segments:
      - text: "我昨天六点就离开公司了，然后去朋友家吃饭。"
        vi: "Hôm qua sáu giờ tôi đã rời công ty, rồi đến nhà bạn ăn cơm."
        clues: [left-six]
        focus: ["离开", "吃饭"]
      - text: "我不知道钥匙在哪儿，也没有去过会议室。"
        vi: "Tôi không biết chìa khóa ở đâu, cũng không vào phòng họp."
    checks:
      - claim_vi: "Tiểu Lý nói anh rời công ty lúc sáu giờ."
        answer: true
        explain_vi: "Đúng: “六点就离开公司”."
      - claim_vi: "Tiểu Lý nói anh đã vào phòng họp."
        answer: false
        explain_vi: "Sai: anh nói chưa vào."
solution:
  culprit: xiaoli
  evidence: [card-record, key-in-hand]
  explain_vi: >-
    Tiểu Lý nói sáu giờ đã rời công ty, nhưng thẻ của anh quẹt lúc bảy giờ rưỡi và đồng nghiệp thấy anh cầm chìa khóa.
  confession: "对不起，我昨天晚上回公司拿了钥匙，因为我想先准备明天的会议。我现在还给大家。"
  confession_vi: "Xin lỗi mọi người, tối qua tôi quay lại công ty lấy chìa khóa vì muốn chuẩn bị trước cho cuộc họp ngày mai. Tôi xin trả lại."
