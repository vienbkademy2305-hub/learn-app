# Sự thật: điện thoại của bố biến mất lúc chiều. Tiểu Minh nói cậu ở trường đến 5 giờ mới về; thầy Vương: chiều nay không có tiết, học sinh về từ 2 giờ;
# mẹ: 4:30 về nhà thấy cặp của Tiểu Minh ở cạnh bàn. Hung thủ: Tiểu Minh.
id: zh-hsk1-phone
level: HSK1
lesson_range: [1, 14]
status: draft
title_vi: Điện thoại của bố biến mất
cover: "📱"
premise_vi: >-
  Chiều nay, điện thoại của bố để trên bàn thì biến mất. Có ba người liên quan: mẹ, thầy giáo và cậu con trai Tiểu Minh.
  Ai đã lấy điện thoại?

clues:
  - id: no-class
    witness: wang
    text: "今天下午没有课。"
    text_vi: "Chiều nay không có tiết học."
  - id: bag-home
    witness: mama
    text: "小明的书包在桌子旁边。"
    text_vi: "Cặp sách của Tiểu Minh ở cạnh bàn."
  - id: phone-table
    witness: mama
    text: "三点手机在桌子上。"
    text_vi: "Ba giờ điện thoại còn ở trên bàn."
  - id: shop
    witness: mama
    text: "四点妈妈去商店。"
    text_vi: "Bốn giờ mẹ đi cửa hàng."

witnesses:
  - id: mama
    name: 小明的妈妈
    role: 妈妈
    avatar: "👩"
    segments:
      - text: "三点我在家做饭。爸爸的手机在桌子上。"
        vi: "Ba giờ mẹ ở nhà nấu cơm. Điện thoại của bố ở trên bàn."
        clues: [phone-table]
        focus: ["做饭", "桌子"]
      - text: "我四点去商店买东西，四点半回家。"
        vi: "Bốn giờ mẹ đi cửa hàng mua đồ, bốn giờ rưỡi mẹ về nhà."
        clues: [shop]
      - text: "我看见小明的书包在桌子旁边，可是手机不在桌子上了。小明不在家。"
        vi: "Mẹ thấy cặp sách của Tiểu Minh ở cạnh bàn, nhưng điện thoại không còn trên bàn. Tiểu Minh không có nhà."
        clues: [bag-home]
        focus: ["书包", "旁边"]
    checks:
      - claim_vi: "Ba giờ điện thoại ở trên bàn."
        answer: true
        explain_vi: "Đúng: “爸爸的手机在桌子上。”"
      - claim_vi: "Mẹ ở nhà cả buổi chiều."
        answer: false
        explain_vi: "Sai: bốn giờ mẹ đi cửa hàng."
      - claim_vi: "Mẹ thấy cặp của Tiểu Minh ở cạnh bàn."
        answer: true
        explain_vi: "Đúng: “小明的书包在桌子旁边。”"
  - id: wang
    name: 王老师
    role: 老师
    avatar: "🧑‍🏫"
    segments:
      - text: "我是小明的老师。今天下午没有课，学生们两点就回家了。"
        vi: "Tôi là thầy giáo của Tiểu Minh. Chiều nay không có tiết, học sinh về nhà từ hai giờ."
        clues: [no-class]
        focus: ["没有课", "回家"]
      - text: "学校三点就关门了，学校里没有人。"
        vi: "Ba giờ trường đã đóng cửa, trong trường không có ai."
      - text: "小明是好学生，我很喜欢他。"
        vi: "Tiểu Minh là học sinh ngoan, tôi rất quý cậu ấy."
    checks:
      - claim_vi: "Chiều nay có tiết học."
        answer: false
        explain_vi: "Sai: “今天下午没有课。”"
      - claim_vi: "Học sinh về nhà lúc hai giờ."
        answer: true
        explain_vi: "Đúng: “学生们两点就回家了。”"
      - claim_vi: "Ba giờ trường vẫn còn mở cửa."
        answer: false
        explain_vi: "Sai: “学校三点就关门了。”"
  - id: xiaoming
    name: 小明
    role: 儿子
    avatar: "🎒"
    segments:
      - text: "今天下午我在学校学习，五点才回家。"
        vi: "Chiều nay con học ở trường, năm giờ mới về nhà."
        focus: ["在学校", "五点才回家"]
      - text: "我没有看见爸爸的手机。我不在家。"
        vi: "Con không thấy điện thoại của bố. Con không ở nhà."
      - text: "我也有手机，我不要爸爸的手机。"
        vi: "Con cũng có điện thoại, con không cần điện thoại của bố."
    checks:
      - claim_vi: "Tiểu Minh nói cậu học ở trường buổi chiều."
        answer: true
        explain_vi: "Đúng: “我在学校学习。”"
      - claim_vi: "Tiểu Minh nói cậu về nhà lúc hai giờ."
        answer: false
        explain_vi: "Sai: cậu nói năm giờ mới về."
      - claim_vi: "Tiểu Minh nói cậu cần điện thoại của bố."
        answer: false
        explain_vi: "Sai: “我不要爸爸的手机。”"
solution:
  culprit: xiaoming
  evidence: [no-class, bag-home]
  explain_vi: >-
    Tiểu Minh nói cậu ở trường đến năm giờ. Nhưng thầy Vương nói chiều nay không có tiết và học sinh về từ hai giờ,
    còn mẹ thấy cặp của cậu ở cạnh bàn lúc bốn giờ rưỡi.
  confession: "对不起，爸爸。我想玩游戏，所以拿了你的手机。我现在还给你。"
  confession_vi: "Con xin lỗi bố. Con muốn chơi game nên đã lấy điện thoại của bố. Bây giờ con trả bố."
